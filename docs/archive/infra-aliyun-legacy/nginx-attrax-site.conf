# General API/page limiter and a much tighter limiter for expensive scan creation.
limit_req_zone $binary_remote_addr zone=attrax_api:10m rate=10r/s;
map $request_method $attrax_scan_create_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $attrax_scan_create_key zone=attrax_scan_create:10m rate=3r/m;

upstream attrax_nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name twinbuddy.xyz www.twinbuddy.xyz 120.77.36.107 _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name twinbuddy.xyz www.twinbuddy.xyz 120.77.36.107;

    ssl_certificate     /etc/letsencrypt/live/twinbuddy.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twinbuddy.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    include /etc/nginx/custom-error-pages.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        try_files $uri =404;
    }

    location ~ /\.(env|env\.local|env\.production|git|svn|htaccess|htpasswd|gitignore|DS_Store) {
        return 404;
    }
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|administrator|xmlrpc\.php|phpmyadmin) {
        return 404;
    }
    location ~* \.(sql|bak|backup|old|orig|swp|sql\.gz|tar\.gz|zip|log)$ {
        return 404;
    }

    # Preserve real upstream status codes. Turning 500/502/503 into 404 hides
    # outages from clients and monitoring and makes retries/debugging unsafe.
    proxy_intercept_errors off;

    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 50m;
    client_body_timeout 60s;

    location = /api/health {
        proxy_pass http://attrax_nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, do not append, so clients cannot spoof the left-most XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location ~ ^/api/scan(/.*)?$ {
        # Empty keys are not accounted by nginx; only POST consumes this zone.
        limit_req zone=attrax_scan_create burst=2 nodelay;
        limit_req zone=attrax_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://attrax_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        limit_req zone=attrax_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://attrax_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
