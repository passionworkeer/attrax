# Attrax — shared locations (rate limits + proxy to nextjs upstream)
# Included by both the 443 block (wangjianjun.xyz) and the 80 block (twinbuddy/IP).

# Block sensitive dotfile paths
location ~ /\.(env|env\.local|env\.production|git|svn|htaccess|htpasswd|gitignore|DS_Store) {
    return 404;
}
# Block common CMS scan targets
location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|administrator|xmlrpc\.php|phpmyadmin|\.well-known/security\.txt) {
    return 404;
}
# Block backup/config extensions
location ~* \.(sql|bak|backup|old|orig|swp|sql\.gz|tar\.gz|zip|log)$ {
    return 404;
}

# Next.js hashed static assets — served directly by nginx (sendfile + precompressed .br/.gz + immutable cache).
# Next 16 + Turbopack no longer copies .next/static into standalone/.next/static; chunks live at
# the build root. `alias` rewrites the matched prefix; trailing slashes on both sides are mandatory.
# See docs/DEPLOYMENT.md and the portfolio DEPLOY for the parallel pattern.
location ^~ /_next/static/ {
    alias /opt/attrax/.next/static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
# App Router RSC payloads — mirror the static block, short-cache.
location ^~ /_next/data/ {
    alias /opt/attrax/.next/static/;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

# /complipilot/* static assets — try the canonical file first; for the two
# image-named PNGs, fall back to a .webp sidecar if a future build ships it
# (no .webp on disk today; this is forward-compatible and a no-op currently).
location ~ ^/complipilot/.+\.(png|webp|mp4)$ {
    root /opt/attrax/.next/standalone/public;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

# Health endpoint — no rate limit
location = /api/health {
    proxy_pass http://attrax_nextjs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Scan endpoint — rate limited
location ~ ^/api/scan(/.*)?$ {
    limit_req zone=attrax_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://attrax_nextjs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# All other traffic
location / {
    limit_req zone=attrax_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://attrax_nextjs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}