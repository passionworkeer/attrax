[Definition]
# Match 4xx from sensitive path probes (masscan/nuclei)
# nginx access log format: HOST - - [date] "METHOD path HTTP" STATUS BYTES
failregex = ^<HOST> [^"]* "(?:GET|POST|HEAD) (?:/\.[a-z]+|/(?:wp-|administrator|xmlrpc|phpmyadmin)|/[^"]*\.(?:sql|bak|backup|zip|log|old|env|swp|sql\.gz|tar\.gz))[^"]*" (?:4[0-9][0-9]|5[0-9][0-9])
ignoreregex =
