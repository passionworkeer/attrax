[Definition]
# Match 4xx from sensitive path probes (masscan/nuclei).
# nginx access log format: HOST - - [date] "METHOD path HTTP" STATUS BYTES
#
# Deliberately 4xx-only: a normal user hitting 502/503/504 during an nginx
# reload, upstream restart, or the healthcheck self-heal (apply-deploy [8.5] /
# attrax-healthcheck.timer) would otherwise rack up failures and get a 24h
# ban. 5xx means the server failed to handle a legitimate-looking request,
# not that the request was malicious. Probe patterns under sensitive paths
# still match because they always return 4xx.
failregex = ^<HOST> [^"]* "(?:GET|POST|HEAD) (?:/\.[a-z]+|/(?:wp-|administrator|xmlrpc|phpmyadmin)|/[^"]*\.(?:sql|bak|backup|zip|log|old|env|swp|sql\.gz|tar\.gz))[^"]*" (?:4[0-9][0-9])
ignoreregex =
