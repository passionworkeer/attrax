*************************************************************************
*  Attrax production server. Authorized access only.                    *
*  All activity is logged and monitored.                                *
*************************************************************************
# Rate limit zone: 10r/s per IP, burst 20
limit_req_zone $binary_remote_addr zone=attrax_api:10m rate=10r/s;

# Upstream to local Next.js
upstream attrax_nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name 203.0.113.10 _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 203.0.113.10;

    ssl_certificate     /etc/nginx/ssl/attrax.crt;
    ssl_certificate_key /etc/nginx/ssl/attrax.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

include /etc/nginx/custom-error-pages.conf;
        # Block sensitive dotfile paths (masscan/nuclei scan targets)
    location ~ /\.(env|env\.local|env\.production|git|svn|htaccess|htpasswd|gitignore|DS_Store) {
        return 404;
    }
    # Block common CMS scan targets
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|administrator|xmlrpc\.php|phpmyadmin|\.well-known/security\.txt) {
        return 404;
    }
    # Block backup/config extensions
    location ~* \.(sql|bak|backup|old|orig|swp|sql\.gz|tar\.gz|zip|log)$ {
        return 404;
    }
    # Hide internal server errors from clients (return 404 instead of 500/502/503)
    proxy_intercept_errors on;
    error_page 500 501 502 503 =404;
    # Security headers
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Body size limit (Next.js image upload)
    client_max_body_size 50m;
    client_body_timeout  300s;

    # Health endpoint — no rate limit
    location = /api/health {
        proxy_pass http://attrax_nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header x-frame-options;
        proxy_hide_header x-content-type-options;
    }

    # Scan endpoint — rate limited 10 req/s per IP, burst 20
    location ~ ^/api/scan(/.*)?$ {
        limit_req zone=attrax_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://attrax_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header x-frame-options;
        proxy_hide_header x-content-type-options;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # All other traffic (pages, static, other APIs) — moderate limit
    location / {
        limit_req zone=attrax_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://attrax_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header x-frame-options;
        proxy_hide_header x-content-type-options;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
