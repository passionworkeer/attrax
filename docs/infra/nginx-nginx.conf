*************************************************************************
*  Attrax production server. Authorized access only.                    *
*  All activity is logged and monitored.                                *
*************************************************************************
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# Safe with modern kernels + epoll: each worker accepts all available
	# connections per wakeup instead of one. Reduces wakeup frequency under
	# bursty load (H9 hardening).
	multi_accept on;
}

http {
    server_tokens off;
    # Buffer size & timeout hardening (anti-slowloris / DoS)
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 30s;
    keepalive_requests 100;
    reset_timedout_connection on;

    # 2026-09-18 concurrency hardening (H10): per-IP concurrent-connection cap.
    # MUST live in http {} — the vhost-side `limit_conn attrax_conn 20` only
    # references it. `apply-deploy.sh` injects this directive on the server
    # if it isn't already present, and re-runs `nginx -t` before reload.
    # Keep the keyword `attrax_conn:10m` stable — it is the single shared
    # memory zone name (10 MB ≈ 160k unique IPs, plenty for one box).
    limit_conn_zone $binary_remote_addr zone=attrax_conn:10m;

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Connection / Request Limits (H10 hardening)
	##

	# limit_req caps request rate per IP but not concurrent open sockets. A
	# slow client (or a parallelized scanner keeping connections open while
	# waiting for the RAG long-poll to return) can still saturate the worker
	# pool. limit_conn caps simultaneous connections per IP — 20 is well
	# above any realistic single-user session count (long-poll + upload +
	# a few tabs of assets/reports) and well below worker_connections/2.
	limit_conn_zone $binary_remote_addr zone=attrax_conn:10m;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


