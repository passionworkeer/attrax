# Attrax — vhost: example.com (HTTPS) + twinbuddy.xyz/IP (HTTP)
# certbot renewal: `certbot renew` (nginx plugin, cert lives at /etc/letsencrypt/live/example.com/)
limit_req_zone $binary_remote_addr zone=attrax_api:10m rate=10r/s;

upstream attrax_nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- shared proxy locations ----------
# security headers + proxy rules reused by both serving blocks

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 50m;
    client_body_timeout  300s;

    # Security headers (HSTS now safe — SSL active on this block)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    include snippets/attrax-locations.conf;
    include snippets/attrax-engagement.conf;
    include /etc/nginx/snippets/monitor-event-location.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # ACME challenge must stay on :80 for renewals
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name twinbuddy.xyz www.twinbuddy.xyz 198.51.100.20;

    client_max_body_size 50m;
    client_body_timeout  300s;

    # Security headers (HSTS omitted — HTTP only)
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Cheap drop for bot probes looking for config/secret files.
    # Returns 444 (close connection without response body) so nginx never proxies to nextjs.
    location ~* \.(yml|yaml|conf|cnf|ini|env\.bak|env\.sample|env\.example)(\.|$) {
        return 444;
    }

    include snippets/attrax-locations.conf;
}
