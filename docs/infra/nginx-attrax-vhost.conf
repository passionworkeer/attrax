# Attrax — vhost: wangjianjun.xyz (HTTPS) + IP 直连 (HTTP → 301 到规范域名)
# certbot renewal: `certbot renew` (nginx plugin, cert lives at /etc/letsencrypt/live/wangjianjun.xyz/)
limit_req_zone $binary_remote_addr zone=attrax_api:10m rate=10r/s;

upstream attrax_nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- shared proxy locations ----------
# security headers + proxy rules reused by both serving blocks

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wangjianjun.xyz www.wangjianjun.xyz;

    ssl_certificate /etc/letsencrypt/live/wangjianjun.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wangjianjun.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 50m;
    client_body_timeout  300s;

    # Security headers (HSTS now safe — SSL active on this block)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    include snippets/attrax-locations.conf;
    include /etc/nginx/snippets/monitor-event-location.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name wangjianjun.xyz www.wangjianjun.xyz;

    # ACME challenge must stay on :80 for renewals
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    # 2026-09-17: 本块不再反代应用，只做 301 到规范域名。
    #
    # 之前这里 server_name 含 twinbuddy.xyz + IP，并 include 了
    # snippets/attrax-locations.conf，于是整个应用（含 /api/scan 等写端点）
    # 在明文 HTTP 下完全可达 —— 无 TLS、无 HSTS、无跳转。
    # 现在：
    #   - twinbuddy.xyz 的 DNS 已指向 LabMemory 的阿里云主机（120.77.36.107），
    #     不再保留该 server_name；命中本机的 twinbuddy Host 落到 000-default。
    #   - IP 直连保留但只返回 301，浏览器/探针都能继续用，明文不再承载业务。
    server_name 43.155.141.192;

    # Cheap drop for bot probes looking for secret/config files.
    # 444 = close connection without response body, so nginx never proxies upstream.
    location ~ /\.(env|env\.local|env\.production|git|svn|htaccess|htpasswd|gitignore|DS_Store) {
        return 404;
    }
    location ~* \.(yml|yaml|conf|cnf|ini|env\.bak|env\.sample|env\.example)(\.|$) {
        return 444;
    }

    location / {
        return 301 https://wangjianjun.xyz$request_uri;
    }
}
