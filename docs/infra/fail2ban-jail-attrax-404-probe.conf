*************************************************************************
*  Attrax production server. Authorized access only.                    *
*  All activity is logged and monitored.                                *
*************************************************************************
[attrax-404-probe]
ignoreip = 127.0.0.1/8 203.0.113.10
enabled  = true
port     = http,https
filter   = attrax-404-probe
logpath  = /var/log/nginx/access.log
maxretry = 10
findtime = 60
bantime  = 86400
backend = polling
