*************************************************************************
*  Attrax production server. Authorized access only.                    *
*  All activity is logged and monitored.                                *
*************************************************************************
# Attrax security hardening
# IP forwarding (we're not a router)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# SYN flood protection
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2

# Reverse path filtering (anti-spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignore ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Disable source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Enable IP spoofing protection
net.ipv4.conf.all.rp_filter = 1

# Log martians (packets with impossible addresses)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore broadcast ICMP (smurf attack protection)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Enable bad error message protection
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Filesystem protections
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# Kernel pointer restriction
kernel.kptr_restrict = 2

# Restrict dmesg access
kernel.dmesg_restrict = 1

# Restrict ptrace to root only (anti-debug)
kernel.yama.ptrace_scope = 2

# Performance: increase connection backlog
net.core.somaxconn = 1024
net.core.netdev_max_backlog = 2048

# TCP TIME_WAIT reuse + broader ephemeral port range.
# Without tcp_tw_reuse, sockets in TIME_WAIT (outbound connections to
# LLM/Anthropic/MiniMax/DeepSeek providers, RAG upstream, etc.) cannot be
# rebound for ~60s, and under sustained scan load the default
# 32768-60999 (~28k) port range exhausts. Reuse + full port range
# (1024-65535) keeps outbound reconnect working through the long-poll /
# streaming responses the RAG pipeline produces.
net.ipv4.tcp_tw_reuse = 1
net.ipv4.ip_local_port_range = 1024 65535
