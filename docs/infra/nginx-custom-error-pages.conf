# Custom error pages — prevent nginx version disclosure
error_page 403 /custom-errors/403.html;
error_page 404 /custom-errors/404.html;
error_page 500 502 503 504 /custom-errors/5xx.html;
location = /custom-errors/403.html { internal; }
location = /custom-errors/404.html { internal; }
location = /custom-errors/5xx.html { internal; }
