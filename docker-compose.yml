services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Nginx is the only public ingress. Never bind the application directly to
    # all host interfaces in production.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      RAG_SERVICE_URL: http://rag-service:8000
      DEMO_MODE: ${DEMO_MODE:-false}
      RAG_INTERNAL_SECRET: ${RAG_INTERNAL_SECRET:?RAG_INTERNAL_SECRET is required}
      ATTRAX_BUILD_SHA: ${ATTRAX_BUILD_SHA:-unknown}
      RATE_LIMIT_STORE_DIR: /app/data/rate-limit
      RATE_LIMIT_TRUST_XFF: "true"
    volumes:
      - ./data/sessions:/app/data/sessions
      - ./data/rate-limit:/app/data/rate-limit
      - ./public/uploads:/app/public/uploads
    depends_on:
      rag-service:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  rag-service:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    # Optional host access is loopback-only for operator diagnostics. The web
    # container uses the private Docker network at rag-service:8000.
    ports:
      - "127.0.0.1:${RAG_PORT:-8001}:8000"
    environment:
      ENV: production
      DEMO_MODE: ${DEMO_MODE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_THINKING: ${LLM_THINKING:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-240}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimaxi.com/anthropic/v1}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      MIMOTALK_API_KEY: ${MIMOTALK_API_KEY:-}
      # DeepSeek 降级通道：vision（OpenAI 兼容）与 generate（Anthropic 兼容）
      # 共用 key；留空则只使用 primary，主通道不可用时退化到 mock。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_ANTHROPIC_BASE_URL: ${DEEPSEEK_ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-16384}
      MINIMAX_THINKING_MODE: ${MINIMAX_THINKING_MODE:-adaptive}
      RAG_ALLOWED_ORIGINS: ${RAG_ALLOWED_ORIGINS:-http://localhost:3000}
      RAG_INTERNAL_SECRET: ${RAG_INTERNAL_SECRET:?RAG_INTERNAL_SECRET is required}
      ATTRAX_BUILD_SHA: ${ATTRAX_BUILD_SHA:-unknown}
      ATTRAX_RUNTIME_DIR: /app/data/backend
      NO_PROXY: "localhost,127.0.0.1,rag-service"
    volumes:
      - ./data/backend:/app/data/backend
      # KB regulation library + KB anchors + 法规 YAMLs 随镜像构建打入：
      # rag_service/Dockerfile 用 `COPY . .` 把整个 build context（含
      # data/regulations/, data/kb/anchors/, data/inspection_profiles/,
      # data/regulation_sources/）一次性复制到 /app/data/。
      # .dockerignore 显式排除 data/backend、data/sessions、corpus 离线缓存、
      # regulation_eval/reports 产物，避免污染镜像。
      # 运行时不需要 host mount 任何 KB 数据。
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
