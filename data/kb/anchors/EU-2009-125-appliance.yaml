key_points:
- 框架指令,按产品类别的具体实施条例 (e.g. 1275/2008 待机功耗、2019/1782 外置电源等)
- 要求能源相关产品符合生态设计要求 (能效、材料、可修复性等)
- 需提供符合性技术文档并加贴 CE 标志
- 数据库 EPREL (European Product Registry for Energy Labelling) 需注册
