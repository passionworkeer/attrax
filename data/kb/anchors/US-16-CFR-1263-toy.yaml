official_citation: 16 CFR Part 1263
short_name: 纽扣电池消费品安全
source: category
primary_source: toy
applies_if:
  category: [toy]
  features_any: [battery]
  markets: [US]
key_articles: [section-1263-1-a, section-1263-1-c, section-1263-3, guidance-product-requirements, guidance-certification]
key_points:
- 条件适用：含有或设计使用纽扣电池的消费品，不能仅凭18+标注排除
- 未满14岁玩具符合16 CFR 1250电池可接触性与标签要求时才适用该项豁免
- 证书如列明16 CFR 1263.3，应记录证书覆盖范围，不得仅因照片未展示电池仓就重复要求该证书
- CPSC官方业务指南明确说明工具/双动作开启、电池不可通过使用滥用测试释放、产品包装警告、产品警告及说明书警告要求
