key_points:
- GB 4806 系列对应中国 FCM 国家强制标准 (2026 年版)
- GB 4806.1 通则 + GB 4806.2~.16 各材料专项 (塑料/金属/玻璃/陶瓷/纸/粘合剂等)
- GB 4806.7 (塑料) 对应 EU 10/2011,GB 4806.9 (金属) 限制元素迁移
- 需出具 DoC (符合性声明) + 测试报告
- 产品接触面需标识 '食品接触用' 或刀叉符号
