key_points:
- 框架法规,适用于所有与食品接触的材料/制品 (塑料/金属/玻璃/陶瓷/纸等)
- 材料不能向食品迁移危害人体健康的物质,不能改变食品成分/感官
- 需附 DoC + 标签标识 (e.g. 'for food contact' 或刀叉符号)
- 塑料类需额外符合 (EU) 10/2011; 陶瓷符合 84/500/EEC
risk_hint: 无 DoC 或迁移超标 → 产品召回 + 处罚
est_cost: 迁移测试 ¥5K-15K + DoC ¥2K-5K
