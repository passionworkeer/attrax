key_points:
- 纤维名称必须按 Annex I 用官方语言标注 (e.g. cotton/cotton)
- 多纤维产品按重量降序 + 非纺织部件需单独标注
- 标签须持久 (缝合/烫印/挂签),购买前可见
- 皮革/毛皮动物来源需明示 (Annex V)
risk_hint: 纤维名称错误或缺失 → 海关扣留 + 处罚
est_cost: 标签设计 ¥2K-5K + 纤维检测 ¥1K-3K
