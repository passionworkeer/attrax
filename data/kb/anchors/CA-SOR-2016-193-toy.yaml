key_points:
- 加拿大《表面涂层材料法规》限制铅、汞、镉等重金属在涂料中的含量
- 用于儿童玩具 / 家具 / 婴儿用品的涂层:铅 ≤ 90 mg/kg、汞 ≤ 10 mg/kg、镉 ≤ 90 mg/kg
- 含涂层玩具上市前需经 Health Canada 认可的实验室测试
- 与 US 16 CFR 1303(铅涂料) + ASTM F963 形成北美双线合规
- 含铅涂层超限 → 召回 + 罚款 + 跨境扣留
risk_hint: 涂层含铅 → 加拿大 + 美国双线召回
est_cost: 涂层重金属测试 ¥2K-6K/产品
