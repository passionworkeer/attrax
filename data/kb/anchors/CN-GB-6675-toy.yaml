key_points:
- GB 6675 系列对应 ISO 8124 + EN 71 等玩具安全标准
- GB 6675.1 基本规范 + GB 6675.2 机械物理性能 + GB 6675.3 易燃性能 + GB 6675.4 化学迁移
- 3C 玩具目录 (电玩具/童车/塑胶玩具等) 强制 CCC
- 非 3C 目录内玩具仍需符合 GB 6675 (GB 强制性标准)
- 化学要求涵盖 8 种重金属迁移 + 邻苯
