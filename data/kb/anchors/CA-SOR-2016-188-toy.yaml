key_points:
- 加拿大《邻苯二甲酸盐法规》限制 6 种邻苯在儿童玩具和儿童护理用品中的含量
- DEHP / DBP / BBP 浓度限值 1000 mg/kg
- DINP / DIDP / DNOP 浓度限值 1000 mg/kg(可入口部分)
- 由 Health Canada 强制执行,与 US 16 CFR 1307 + EU REACH Annex XVII 入口门槛大体一致
- 邻苯超限 → 召回 + 罚款 + CPSC 与 Health Canada 双线风险
risk_hint: 玩具邻苯超限 → 加拿大 + 美国双线召回
