key_points:
- 年龄标签只是四项判定因素之一，不能仅凭18+标识排除儿童产品规则
- 需结合包装与广告呈现、消费者通常认知、合理可预见用途和CPSC年龄指南
- 成人收藏定位与儿童玩耍吸引力冲突时，应保留适用范围待确认状态
