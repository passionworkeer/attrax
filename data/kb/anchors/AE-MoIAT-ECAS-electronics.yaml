key_points:
- 阿联酋《合格评定计划》(ECAS)是 UAE 产品上市的强制性合格评定程序
- 强制目录内产品上市前须由 MoIAT 指定公告机构(ESMA / ENAS / TUV 等)发 ECAS 证书
- 注册 + 标签 + DoC 三大要素缺一不可
- EQM 能效标签计划同步强制(大家电 / 空调 / 照明等)
- 由 MoIAT 主管,缺 ECAS 证书 → 海关扣留 + 召回
risk_hint: 缺 ECAS 证书 / EQM 标签 → 海关扣留 + 罚款
est_cost: ECAS 测试 ¥8K-20K + 注册 ¥3K-8K + 标签 ¥1K-3K
