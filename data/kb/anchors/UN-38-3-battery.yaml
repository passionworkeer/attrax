key_points:
- UN 推荐锂电池运输测试标准,全球航空/海运/陆运通用强制
- '8 项测试 (T1-T8): 高度模拟/热冲击/振动/冲击/外部短路/撞击/过充/强制放电'
- 需 UN 认可实验室测试,报告全球互认
- UN 3480 (锂离子电池单独运输) + UN 3481 (装在设备内或与设备一起)
- 测试通过后方可依据 IATA/IMO/ADR 等危险品规则运输
risk_hint: 无 UN 38.3 报告 → 航空公司/船公司/陆运公司拒收 + 罚款
