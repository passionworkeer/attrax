key_points:
- 适用于额定电压 50-1000V AC 或 75-1500V DC 的电气设备
- Annex I 列主要安全目标 (电气/热/机械/辐射等危险防护)
- Annex II 列出不适用设备 (如医疗、电梯、汽车电气等专项指令覆盖)
- 投放市场需 CE 标志 + DoC + 技术文档
