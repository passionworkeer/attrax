key_points:
- 加拿大《2001 消费品化学品与容器法规》,覆盖化学品分类、警示标签、儿童防护包装(CRPC)
- 含有毒、易燃或腐蚀性物质必须标注危险性符号 + 急救说明 + 储存处置建议
- 儿童可能接触的产品优先采用 child-resistant closure + 显著警示语
- 由 Health Canada 主管,违规产品召回 + 罚款 + 海关扣留
- 与 US 16 CFR 1500 / EU CLP / GHS 大致对齐,但加拿大有独立标签模板
risk_hint: 缺少 CCCR 标签 / 警示语 → 海关扣留 + Health Canada 召回
est_cost: 标签改版 ¥2K-5K + 第三方检测 ¥5K-15K
