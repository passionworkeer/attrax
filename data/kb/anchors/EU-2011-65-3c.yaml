key_points:
- 限制电子电气设备中铅、汞、镉、六价铬、PBB、PBDE 等 10 类有害物质
- 投放欧盟市场需附 CE 标志 + DoC (符合性声明)
- Annex II 列具体限值与豁免清单 (e.g. 焊料铅豁免至 2026 阶段收尾)
- 由各成员国市场监管机构执行,违规处罚因国而异
