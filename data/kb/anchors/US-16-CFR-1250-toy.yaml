key_points:
- 被认定为玩具时，需符合16 CFR 1250.2纳入的适用ASTM F963条款
- 适用版本取决于生产日期，不能只看证书名称或照片
- 外观照片只能发现可见疑点，不能代替机械物理、化学或电池可接触性测试
