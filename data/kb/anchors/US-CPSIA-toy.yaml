key_points:
- 先确认年龄定位及适用规则，18+标注不代表所有消费品安全义务均豁免
- 15 USC 2063(a)(1)规定受CPSC规则约束产品的认证，(a)(2)涉及儿童产品认证
- 15 USC 2063(a)(5)规定儿童产品及包装在可行范围内的永久追踪标记
- 15 USC 2056b规定玩具标准纳入机制，具体ASTM版本及生效日期另查16 CFR 1250
- 厂家证书和实验室完整报告是不同证据，不得把已提供证书写成未提供
- CPSC官方指南显示2024年4月20日前生产且晚于2018年2月28日的玩具对应ASTM F963-17时间段
risk_hint: 无 CPC 或超标 → CPSC 强制召回 + 民事处罚
est_cost: CPC + 测试 ¥10K-25K
