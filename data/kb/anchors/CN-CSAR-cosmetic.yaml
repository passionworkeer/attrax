key_points:
- 2021-01-01 起施行,取代《化妆品卫生监督条例》(1990)
- 国家药监局 (NMPA) 主管,省级局负责备案/注册
- 特殊化妆品 (染发/烫发/美白/防晒/防脱发/新功效) 实行注册管理,普通化妆品备案
- 需提交产品配方/生产工艺/质量标准/安全评估资料
- 原料符合《已使用化妆品原料目录》(2021版) 或按新原料注册
risk_hint: 无备案/注册 → NMPA 处罚 + 平台下架 + 召回
