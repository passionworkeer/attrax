key_points:
- 先按第1条确认属于无线电设备；无线产品的安全目标通过RED第3(1)(a)条适用，不能重复套用LVD整体义务
- 第3(1)(a)条为健康安全，第3(1)(b)条为电磁兼容，第3(2)条为频谱使用；第3(3)条按具体设备类别适用
- 第10条为制造商义务，第17条为合格评定程序，第18条为EU符合性声明，第20条为CE标志规则
- 第11条规定制造商可书面委任授权代表，不应将此条表述为所有欧盟外制造商必须委任；进口商义务另见第12条
- 已有符合性声明应核对型号、版本和所列测试范围，不应再次笼统要求相同声明
