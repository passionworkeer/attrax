key_points:
- 新西兰《儿童玩具产品安全标准》基于 Fair Trading Act 1986 s.29(1)(a) 强制实施
- 涵盖 14 岁以下儿童玩具的机械、物理、易燃、化学、电气、辐射危险
- 适用 AS/NZS 8124 系列协调标准(与 EU EN 71 体系大致对应)
- 14 岁以下儿童玩具进入 NZ 须附 DoC + 警示标签 + 通过认可实验室测试
- 由 MBIE / Product Safety NZ 主管,违规产品召回 + 罚款
risk_hint: 玩具缺 AS/NZS 8124 测试 → 召回 + NZ Commerce Commission 罚款
est_cost: AS/NZS 8124 测试 ¥5K-15K + DoC 文件准备 ¥2K-5K
