key_points:
- 适用于加州销售的所有产品,清单含 900+ 化学品 (铅/镉/邻苯等)
- 需对暴露途径 (摄入/接触/吸入) 提供清晰合理的警示标签 ('WARNING' 或 'CAUTION')
- 清单每年至少更新 1 次 (OEHHA 维护)
- 化学检测需确认含量低于 NSRL/MADL 或标注警示
- 律师提交通知 (60-day notice) 是常见起诉前置程序
risk_hint: 未警告或超标 → 民事和解单次 $10K-$100K+,集体诉讼风险
