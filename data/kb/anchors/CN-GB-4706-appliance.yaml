key_points:
- 对应 IEC 60335-1 家用电器安全,GB 4706.1 通用 + GB 4706.2~XX 各类专项
- CCC 强制目录内的家电产品 (电饭锅/微波炉/空调等) 必须通过
- 测试项目涵盖电气/机械/热/辐射等危险防护
- GB 标准由 SAC 标准化技术委员会维护
- 对应协调标准 GB 4706.1-2005 + 专项
