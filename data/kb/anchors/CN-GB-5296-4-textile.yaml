- GB 5296 系列的纺织分支,规定纺织品和服装的使用说明 (标签)
- 需标注纤维成分 + 含量百分比 + 维护方式 + 制造商/经销商
- 需 GB/T 8685-2008 规定的图形符号表示洗涤/熨烫/晾干等
- 中文标注强制,与英文/其他语种并列可
- 吊牌 + 缝制标签 + 包装标注均合规
