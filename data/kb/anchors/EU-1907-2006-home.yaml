key_points:
- 化学品/混合物/物品中 SVHC (高关注物质) 含量 > 0.1% w/w 需向 ECHA 通报并告知下游
- Annex XVII 列出限用物质 (e.g. 邻苯二甲酸盐、重金属、偶氮染料)
- 需做 SVHC 筛查 (ICP-MS/XRF 等) 并保留测试证书 10 年
- Candidate List (候选清单) 通常每年 1-2 次更新
risk_hint: SVHC 超标未通报 → 产品召回 + 处罚 + 平台下架
