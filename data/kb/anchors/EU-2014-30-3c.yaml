key_points:
- 确保电子设备在正常使用环境中不产生不可接受的电磁干扰,且能承受外部干扰
- CE 标志 + DoC + 技术文档 (含 EMC 测试报告) 是投放前提
- EN 55032 / EN 55035 / EN 61000 系列协调标准是常用合规依据
- 本指令不适用于 2014/53/EU (RED) 覆盖的无线电设备
