key_points:
- 对应 IEC 62368-1 音视频/信息技术设备安全要求
- 适用于 600V 以下电子电气设备 (电源适配器、笔记本、手机充电器等)
- GB 4943.1-2022 替代 GB 4943.1-2011 + GB 8898-2011
- CCC 目录内的产品需配合 CCC 认证申请
- GB 标准由 SAC 维护,正式版本需购买纸质/电子版
risk_hint: 未满足 GB 4943.1 → CCC 申请失败 + 平台下架
