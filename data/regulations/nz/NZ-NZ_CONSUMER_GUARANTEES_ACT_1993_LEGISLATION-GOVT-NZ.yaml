    3

    Act to bind the Crown




    This Act shall bind the Crown.


    4

    Act not a code


    (1)



    The rights and remedies provided in this Act are in addition to any other right or remedy under any other Act or rule of law unless the right or remedy is expressly or impliedly repealed or modified
    by this Act.


    (2)



    No provision of this Act shall be construed as repealing, invalidating, or superseding the provisions of any other Act unless this Act by express provision or by necessary implication clearly intends
    such a provision to be so construed.


    Compare: Consumer Products Warranties Act 1977 s 3 (Saskatchewan)


    Part 1

    Guarantees in respect of supply of goods


    5

    Guarantees as to title


    (1)



    Subject to'
- id: art-34
  title: section 41
  text: "section 41\n, the following guarantees apply where goods are supplied to a consumer:\n\n(a)\n\n\nthat the supplier has a right to sell the goods; and\n\n(b)\n\n\nthat the goods are free from any\
    \ undisclosed security; and\n\n(c)\n\n\nthat the consumer has the right to undisturbed possession of the goods, except in so far as that right is varied pursuant to—\n\n(i)\n\n\na term of the agreement\
    \ for supply in any case where that agreement is a hire purchase agreement within the meaning of the\nIncome Tax Act 2007\n; or\n\n(ii)\n\n\na security, or a term of the agreement for supply, in respect\
    \ of which the consumer has received—\n\n(A)\n\n\noral advice, acknowledged in writing by the consumer, as to the way in which the consumer’s right to undisturbed possession of the goods could be affected,\
    \ sufficient to enable a reasonable consumer to understand the general nature and effect of the variation; and\n\n(B)\n\n\na written copy of the agreement for supply or security, or a written copy of\
    \ the part thereof which provides for the variation.\n\n(2)\n\n\nA reference in subsection (1)\uFEFF(a) to a\nright to sell\ngoods means a right to dispose of the ownership of the goods to the consumer\
    \ at the time when that ownership is to pass.\n\n(3)\n\n\nAn\nundisclosed security\nreferred to in this section means any security that was neither disclosed to the consumer in writing before he or\
    \ she agreed to the supply nor created by or with the express consent of the consumer.\n\n(4)\n\n\nNothing in subsection (1)\uFEFF(a) or (1)\uFEFF(b) shall apply in any case where the goods are only\
    \ hired or leased.\n\n(5)\n\n\nWhere the goods are only hired or leased, the guarantee set out in subsection (1)\uFEFF(c) shall confer a right to undisturbed possession of the goods only for the period\
    \ of the hire or lease.\n\n(6)\n\n\nPart 2\ngives the consumer a right of redress against the supplier where the goods fail to comply with any guarantee in this section.\n\nCompare: 1908 No 168\ns 14\n\
    ; 1971 No 147 s 11"
