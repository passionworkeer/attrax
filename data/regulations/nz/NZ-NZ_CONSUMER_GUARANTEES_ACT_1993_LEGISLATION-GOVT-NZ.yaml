  text: "Section 5(1)\uFEFF(c)\uFEFF(i)\n:\namended\n, on\n1 April 2008\n(effective for 2008–09 income year and later income years, except when the context requires otherwise), by\nsection ZA 2(1)\nof the\n\
    Income Tax Act 2007\n(2007 No 97).\n\n5A\nGuarantee as to delivery\n\n(1)\n\n\nWhere a supplier is responsible for delivering, or for arranging for the delivery of, goods to a consumer there is a guarantee\
    \ that the goods will be received by the consumer—\n\n(a)\n\n\nat a time, or within a period, agreed between the supplier and the consumer; or\n\n(b)\n\n\nif no time or period has been agreed, within\
    \ a reasonable time.\n\n(2)\n\n\nWhere the delivery of the goods fails to comply with the guarantee under this section,\nPart 2\ngives the consumer a right of redress against the supplier and, in that\
    \ case, the consumer may,—\n\n(a)\n\n\nif the failure is of a substantial character, reject the goods under"
