    7A

    Guarantee of acceptable quality in supply of gas and electricity


    (1)



    There is a guarantee that the supply of gas by a gas retailer, and the supply of electricity by an electricity retailer, to a consumer is of an acceptable quality.


    (2)



    The guarantee of acceptable quality is a guarantee that—


    (a)



    the supply of gas or electricity is as safe as a reasonable consumer would expect it to be; and


    (b)



    the supply of gas or electricity to a place is as reliable as a reasonable consumer would expect a supply to that place to be; and


    (c)



    the quality of the gas or electricity supplied is such that it can be consistently used for the things that a reasonable consumer would expect to use gas or electricity for.


    (3)



    When determining what a reasonable consumer would expect, it is assumed that the consumer has considered—


    (a)



    that the supply of gas or electricity may be affected by emergencies, or other events or circumstances, outside the control of the retailer or any other person involved in the supply of gas or electricity;
    and


    (b)



    that the supply of gas or electricity may be interrupted for safety, maintenance, or other technical reasons; and


    (c)



    that the quality of gas or electricity supplied may fluctuate, but that fluctuations are acceptable only within tolerances permitted by gas and electricity safety regulations; and


    (d)



    that the reliability and quality of the supply of gas or electricity may vary depending on the location of the place to which the gas or electricity is supplied; and


    (e)



    that reliability and quality of supply may be related to price.


    (4)



    The supply of gas or electricity will not fail to comply with the guarantee of acceptable quality—


    (a)



    if the gas or electricity has been used by the consumer in an unreasonable manner or to an unreasonable extent, and the supply of gas or electricity would have complied with the guarantee of acceptable
    quality if it had not been used in that manner or to that extent; or


