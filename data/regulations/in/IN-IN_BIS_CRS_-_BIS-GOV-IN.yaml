  title: बीआईएस प्रमाणन योजना मूलतः स्वैच्छिक प्रकृति की है। हालांकि,
  text: "बीआईएस प्रमाणन योजना मूलतः स्वैच्छिक प्रकृति की है। हालांकि, कई उत्पादों के लिए भारतीय मानकों का अनुपालन केंद्र सरकार द्वारा विभिन्न कारणों से अनिवार्य किया गया है जैसे—जनहित, मानव, पशु या वनस्पति\
    \ स्वास्थ्य का संरक्षण, पर्यावरण की सुरक्षा, अनुचित व्यापार रीतियों की रोकथाम तथा राष्ट्रीय सुरक्षा।\nबीआईएस लाइसेंस प्राप्त करने के लिए अपनाए जाने वाले चरण देखें\nबीआईएस स्टोर\nक्या आप भारतीय मानक\
