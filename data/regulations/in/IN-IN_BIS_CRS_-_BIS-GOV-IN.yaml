- id: art-2
  title: ज्वैलर्स पंजीकरण हेतु आवेदन प्रक्रिया
  text: "ज्वैलर्स पंजीकरण हेतु आवेदन प्रक्रिया\nहॉलमार्किंग केंद्र\nए एवं एच केंद्रों हेतु दिशानिर्देश\nहॉलमार्किंग केंद्रों की सूची\nसामान्य गुणवत्ता मैनुअल\nरद्द/समाप्त/स्थगित एएचसी की सूची\nस्वर्ण रिफाइनरी\n\
    स्वर्ण मौद्रीकरण योजना\nउपभोक्ता संरक्षण\nकेंद्रीय सहायता योजना के अंतर्गत ईओआई\nप्रपत्र एवं प्रारूप\nअक्सर पूछे जाने वाले प्रश्न\nसंपर्क करें\nप्रशिक्षण\nप्रशिक्षण\nपरिचय\nआवेदन करने की प्रक्रिया\n\
    प्रशिक्षण कार्यक्रम\nप्रशिक्षण कैलेंडर »\nवार्षिक प्रशिक्षण कैलेंडर\nमाह-वार प्रशिक्षण कैलेंडर\n2025-26 के लिए उत्पाद-विशिष्ट कैप्सूल पाठ्यक्रम\nप्रशिक्षण रणनीति\nआईटीपी एलुमनी पोर्टल\nआईटीईसी के अंतर्गत\
    \ आईटीपी\nशुल्क\nप्रपत्र\nसंपर्क करें\nप्रशिक्षण पोर्टल\nउपभोक्ता सहभागिता\nअवलोकन\nउपभोक्ता संरक्षण\nसतर्कता पोर्टल\nराष्ट्रीय गुणवत्ता पुरस्कार\nपुस्तिकाएँ\nस्टैंडर्ड इंडिया\nभारतीय मानकों का कॉपीराइट\n\
    ऑनलाइन शिकायत पंजीकरण\nनागरिक चार्टर\nप्रवर्तन गतिविधियाँ\nअक्सर पूछे जाने वाले प्रश्न\nसंपर्क करें\nHow can we help you?\nrefine search by\nहोम\nसप्ताह का मानक\nमाह का मानक \nनए मानक\nसंशोधित मानक\n\
    अपने मानक के बारे में जाने\nस्नैप\nअनिवार्य प्रमाणन के अंतर्गत उत्पाद\nमानक विकास और भवन विनियम\nबीआईएस टॉक \nमानक मंच\nमानक गीत\nराजभाषा हिन्दी\nबीआईएस पुस्तकालय \nमासिक बीआईएस समाचार पत्र\nआईसीसी\
    \ संरचना\n☰\nBIS लॉगिन\n          एफएक्यू\nमीडिया\nबीआईएस ब्लॉग\nइंग्लिश\nस्किप कंटेंट \nबीआईएस के फेसबुक पेज \nपर लाइक करें\nबीआईएस के ट्विटर पेज \nपर फॉलो करें\nबीआईएस के लिंक्डइन पेज \nपर फॉलो करें\n\
    बीआईएस के यूट्यूब पेज \nपर सब्सक्राइब करे \nबीआईएस के इंस्टाग्राम पेज \nपर फॉलो करें\nउपभोक्ता जागरूकता और संरक्षण आदि से जुड़े रहें! नवीनतम अपडेट और मूल्यवान जानकारी के लिए उपभोक्ता मामले विभाग के\
    \ सोशल मीडिया हैंडल फ़ॉलो करें।\n एक्स ट्विटर: \n https://x.com/jagograhakjago\n फेसबुक: \n  https://www.facebook.com/ConsumerAdvocacy/\n इंस्टाग्राम: \n https://www.instagram.com/consumeraffairs_goi/\n\
    \ यूट्यूब: \nhttps://www.youtube.com/channel/UCTyQpXH6_4xVR1CUyuPkm0Q\nहम बीआईएस हैं,\nभारत का राष्ट्रीय\nमानक निकाय\nभारतीय मानक ब्यूरो (बीआईएस) जो भारत का राष्ट्रीय मानक निकाय है। हम भारतीय मानक को\
    \ विकसित व प्रकाशित करते हैं, अनुरूपता मूल्यांकन योजनाओं को लागू करते हैं और अनुरूपता मूल्यांकन के लिए प्रयोगशालाओं को मान्यता देते हैं तथा प्रयोगशालाओं को संचालित करते हैं, हॉलमार्किंग लागू करते हैं,\
    \ उपभोक्ता सशक्तिकरण के लिए काम करते हैं, गुणवत्ता आश्वासन पर क्षमता निर्माण कार्यक्रमों का आयोजन करते हैं और आईएसओ व आईईसी में देश का प्रतिनिधित्व करते हैं।\nराष्ट्रीय भवन निर्माण के मानक 2026 \nजन\
    \ सुनवाई\nसमय-सारणी: प्रत्येक बुधवार समय: 14:00 – 15:00 बजे\nइस पहल का उद्देश्य बीआईएस अधिकारियों के साथ सीधे बातचीत का अवसर प्रदान करना है ताकि आपके प्रश्नों/शिकायतों का समाधान हो सके और सुझाव एवं\
    \ प्रतिक्रिया आमंत्रित की जा सकें।\nहमारे लाइव सपोर्ट सत्र में जुड़े और बीआईएस की गतिविधियों से संबंधित किसी भी प्रकार के प्रश्न, शिकायत या सुझाव के लिए इस सुविधा का लाभ उठाएं।\nपुरानी वेबसाइट\nStandards\
    \ Watch\nअगला\nपिछला\nक्या नया है\n                PATH द्वारा SHF और MHAI के सहयोग से 07-08 सितंबर 2026 को नई दिल्ली के द लीला पैलेस होटल में “भारत के मासिक धर्म स्वास्थ्य इकोसिस्टम को मजबूत करना:\
    \ संरचनात्मक पहुंच को बढ़ावा देना” विषय पर एक अंतरराष्ट्रीय रणनीति सह-निर्माण कार्यशाला आयोजित की गई।\n                इंटरव्यू के लिए अस्थायी रूप से शॉर्टलिस्ट किए गए उम्मीदवारों के लिए – डेप्युटेशन\
    \ के आधार पर डिप्टी डायरेक्टर (प्रशासन और वित्त), डिप्टी डायरेक्टर (मार्केटिंग और उपभोक्ता मामले), डिप्टी डायरेक्टर (हिंदी) और डिप्टी डायरेक्टर (प्रकाशन) के पदों पर रिक्तियों को भरने के लिए [संदर्भ:\
    \ विज्ञापन संख्या 1/2025/ESTT (डेप्युटेशन)]\n                IS 17440 : 2020 के अनुसार “कार्बन ब्लैक” के लिए अखिल भारतीय पहला लाइसेंस प्रदान करना।\n                IS 6307 : 2023 के अनुसार “रिजिड PVC\
