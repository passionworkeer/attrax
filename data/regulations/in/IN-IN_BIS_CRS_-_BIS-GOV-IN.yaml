  title: '                वस्त्र विभाग, बीआईएस द्वारा आयोजित आईएस 5175'
  text: "                वस्त्र विभाग, बीआईएस द्वारा आयोजित आईएस 5175 – पॉलीप्रोपाइलीन रस्सियों के संशोधन के व्यापक प्रसार वाले मसौदे पर हितधारक परामर्श वेबिनार की रिपोर्ट\n                स्वर्ण आभूषणों\
    \ और स्वर्ण कलाकृतियों पर हॉलमार्किंग (द्वितीय संशोधन) आदेश, 2026\nसभी देखें »\nउद्योग सूचना\n  आगामी QCOs - अधिसूचित और कार्यान्वयन के लिए नियत \n    |    \nFMCS के अंतर्गत आवेदन जमा करने हेतु ऑनलाइन\
    \ पोर्टल\nउपभोक्ता सूचना\nउत्पाद रिकॉल के लिए सार्वजनिक संकेत\nकार्यक्रम और गतिविधियाँ\nहम बीआईएस हैं,\nभारत का राष्ट्रीय\nमानक निकाय\nभारतीय मानक ब्यूरो (बीआईएस) जो भारत का राष्ट्रीय मानक निकाय है।\
    \ हम भारतीय मानक को विकसित व प्रकाशित करते हैं, अनुरूपता मूल्यांकन योजनाओं को लागू करते हैं और अनुरूपता मूल्यांकन के लिए प्रयोगशालाओं को मान्यता देते हैं तथा प्रयोगशालाओं को संचालित करते हैं, हॉलमार्किंग\
    \ लागू करते हैं, उपभोक्ता सशक्तिकरण के लिए काम करते हैं, गुणवत्ता आश्वासन पर क्षमता निर्माण कार्यक्रमों का आयोजन करते हैं और आईएसओ व आईईसी में देश का प्रतिनिधित्व करते हैं।\nराष्ट्रीय भवन निर्माण के\
    \ मानक 2026 \nजन सुनवाई (जन सुनवाई)\nसमय: प्रत्येक बुधवार समय: 14:00 – 15:00 बजे\nइस पहल का उद्देश्य बीआईएस अधिकारियों के साथ सीधे बातचीत करने का अवसर प्रदान करना है ताकि आपके प्रश्नों/शिकायतों का समाधान\
    \ हो सके और सुझाव एवं प्रतिक्रिया आमंत्रित की जा सके।\nएनबीसी 2026\nपुरानी वेबसाइट\nStandards Watch\nNext\nPrev\nक्या नया है\n                PATH द्वारा SHF और MHAI के सहयोग से 07-08 सितंबर 2026 को\
    \ नई दिल्ली के द लीला पैलेस होटल में “भारत के मासिक धर्म स्वास्थ्य इकोसिस्टम को मजबूत करना: संरचनात्मक पहुंच को बढ़ावा देना” विषय पर एक अंतरराष्ट्रीय रणनीति सह-निर्माण कार्यशाला आयोजित की गई।\n    \
    \            इंटरव्यू के लिए अस्थायी रूप से शॉर्टलिस्ट किए गए उम्मीदवारों के लिए – डेप्युटेशन के आधार पर डिप्टी डायरेक्टर (प्रशासन और वित्त), डिप्टी डायरेक्टर (मार्केटिंग और उपभोक्ता मामले), डिप्टी\
    \ डायरेक्टर (हिंदी) और डिप्टी डायरेक्टर (प्रकाशन) के पदों पर रिक्तियों को भरने के लिए [संदर्भ: विज्ञापन संख्या 1/2025/ESTT (डेप्युटेशन)]\n                IS 17440 : 2020 के अनुसार “कार्बन ब्लैक” के\
    \ लिए अखिल भारतीय पहला लाइसेंस प्रदान करना।\n                IS 6307 : 2023 के अनुसार “रिजिड PVC शीट्स” के लिए ऑल इंडिया पहला लाइसेंस जारी करना।\n                IS 1867 : 2023 के अनुसार “रबर हॉट वॉटर\
    \ बॉटल्स” के लिए ऑल इंडिया पहला लाइसेंस जारी करना।\n                Grant of All India First Licence for “Cylinder Cartridges for Locks” as per IS 18841\n                नागरिक-केंद्रित पहलें | DG –\
    \ भारतीय मानक ब्यूरो | भाग 2\n                विभागीय जांचों के संचालन हेतु जांच अधिकारी के रूप में सेवानिवृत्त अधिकारियों के पैनलीकरण के संबंध में।\n                वस्त्र विभाग, बीआईएस द्वारा आयोजित\
    \ आईएस 5175 – पॉलीप्रोपाइलीन रस्सियों के संशोधन के व्यापक प्रसार वाले मसौदे पर हितधारक परामर्श वेबिनार की रिपोर्ट\n                स्वर्ण आभूषणों और स्वर्ण कलाकृतियों पर हॉलमार्किंग (द्वितीय संशोधन)\
