    WIPO Lex resources



    WIPO Treaties: Preparatory Documents


    An online resource comprising the written records generated during the negotiations for the WIPO-administered treaties including the WIPO Convention


    Judicial Administration Structure for IP Disputes


    WIPO provides an index of the national court systems of eighteen WIPO member states’ that are responsible for judging IP Disputes.



    WIPO''s work with judiciaries


    The

    WIPO Judicial Institute


    works with judges to provide open access to IP legal knowledge via the WIPO Lex database.







    WIPO Treaties: Preparatory Documents and Guides


    An online resource comprising the written records generated during the negotiations for the WIPO-administered treaties including the WIPO Convention.


    Judicial administration structure by jurisdiction


    Overview of civil, criminal and administrative court structures and competences for IP disputes.



