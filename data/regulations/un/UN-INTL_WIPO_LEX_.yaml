    WIPO Lex - International Intellectual Property Law Database



    Access to legal information on intellectual property (IP) from around the world





    WIPO Lex – A Global Intellectual Property (IP) Legal Database


    Access information on IP legal data from around the world



    WIPO Lex serves as the comprehensive, open and free gateway to more than 50,000 legal documents from 200 jurisdictions, spanning patents, copyrights, trademarks, designs, and other IP subject matters.



    The WIPO Lex Database is organized into three collections, consisting of IP laws and regulations, WIPO-administered treaties and other IP‑related treaties, and IP judgments.








    Browse by jurisdiction



    List of members with IP laws and regulations/rules, IP treaties, and IP judgments




    Search IP laws



    National and regional IP legislation


    Search IP treaties



    WIPO-administered and other IP-related treaties


    Search IP judgments



    Leading judicial decisions of national and regional courts on IP


