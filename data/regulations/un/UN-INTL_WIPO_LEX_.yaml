    WIPO Lex supported collections




    WIPO Lex SEP Case Law Collection



    Litigation surrounding standard essential patents (SEPs) has gradually increased over time and expanded into new jurisdictions.  The WIPO Lex SEP Case Law Collection provides access to noteworthy SEP
    rulings from around the world, enhancing global understanding of judicial approaches to the latest and most complex SEP legal issues.


    WIPO Lex Trade Secrets Case Law Collection


    A curated collection of important developments and diverse judicial approaches to trade secret protection from across the globe. Access answers to key trade secrets law questions, including what qualifies
    as a trade secret, how protection is established, when disclosure or misappropriation occurs, lawful exceptions to trade secrets, and remedies for breach of trade secrets.



    UPOV Lex


    UPOV Lex contains the legislation of members of the Union that has been notified in accordance with the UPOV Convention, the UPOV Convention notifications concerning individual members of the Union
    (e.g. accessions, ratifications) and the text of the UPOV Convention and its Acts.


    Hague System legal texts


    Access all Hague legal texts, including related Regulations and Administrative Instructions, complete with historical versions.


    Madrid System legal texts


    Access all Madrid legal instruments, including related regulations and administrative instructions, complete with historical versions.


    Traditional knowledge legal texts


    Find laws, treaties and regulations on the protection of traditional knowledge (TK), traditional cultural expressions (TCEs) and genetic resources (GRs).




