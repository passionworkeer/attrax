- id: art-4
  title: Annex 5 defines 69 attack vectors across seven threat categories—from back-end servers to physical vehicle access. Your TARA must address each relevant vector with specific mitigations mapped to
    suppl
  text: 'Annex 5 defines 69 attack vectors across seven threat categories—from back-end servers to physical vehicle access. Your TARA must address each relevant vector with specific mitigations mapped to
    supplier evidence. But your BOM contains 150+ ECUs from 60 suppliers. Without BOM-level compliance intelligence linking components to threat vectors and supplier documentation, you cannot demonstrate
    complete coverage. A single unmapped vector can delay type approval.

    The Supplier Cascade Problem

    The Supplier Cascade Problem

    The Supplier Cascade Problem

    While OEMs bear type approval responsibility, automotive supply chain security depends entirely on supplier cooperation. A Tier 2 ECU manufacturer claims cybersecurity compliance but provides no supporting
    documentation. A Tier 1 integrator passes through declarations without validation. A software supplier''s vulnerability disclosure process is undocumented. Without supplier risk scoring and due diligence,
    evidence gaps persist through audit—and become the OEM''s liability when the approval authority reviews the CSMS package.

