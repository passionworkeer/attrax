    R155/R156?

    What


    Is


    UN


    R155/R156?

    UN R155/R156 compliance is the first globally binding vehicle cybersecurity regulation and the cornerstone of automotive cybersecurity compliance. For supply chain teams, the primary obligation is managing
    cybersecurity evidence across multi-tier suppliers—demonstrating that organizational processes, vehicle architectures, and software update mechanisms are secure throughout the entire vehicle lifecycle.

    UN R155 requires a certified Cybersecurity Management System (CSMS) covering development, production, and post-production phases. UN R156 requires a complementary Software Update Management System (SUMS)
    ensuring OTA and workshop updates are delivered securely and traceably. Together, they are prerequisites for vehicle type approval in 60+ countries. CSMS certification must be renewed every three years,
    and approval authorities can withdraw certificates if post-production monitoring or incident reporting is insufficient.

    UN R155/R156 compliance requires documented cybersecurity evidence—threat analyses, risk assessments, mitigation plans, penetration test results, and supplier compliance attestations—from every tier.
    When scope expands or new threat vectors emerge, your entire supplier portfolio requires reassessment.

