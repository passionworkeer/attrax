    The scope of UN R155/R156 compliance now extends to motorcycles, scooters, and electric bicycles. New vehicle type approvals for Category L require full CSMS evidence from December 2027; existing types
    must comply by June 2029. China''s parallel GB 44495:2024 standard adds technical verification requirements beyond UN R155. OEMs selling into both UNECE and Chinese markets face dual-track compliance
    obligations. Supplier cybersecurity evidence from prior audit cycles may no longer reflect current threat landscapes or regulatory requirements.

