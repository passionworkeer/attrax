- id: art-1
  title: Chinese Catalogue of Technologies Prohibited or Restricted f
  text: "Chinese Catalogue of Technologies Prohibited or Restricted from Export [July 2025] | Center for Security and Emerging Technology\nSkip to main content\nSearch\nSearch\nClose\nCenter for Security\
    \ and Emerging Technology\nSearch\n      Translation    \nChinese Catalogue of Technologies Prohibited or Restricted from Export [July 2025]\n中国禁止出口限制出口技术目录\nAugust 18, 2025\nRead our translation of\
    \ China’s catalog of prohibited and restricted exports, as updated in July 2025.\nDownload Full Translation\nThis is a translation of China’s catalog of prohibited and restricted exports, as updated\
    \ in July 2025. This catalog, along with China’s two dual-use export control lists, is one of three major documents that list China’s export-controlled items and technologies. The catalog of prohibited\
    \ and restricted exports has two parts: technologies that may not be exported from China under any circumstances, and a much longer list of technologies whose export is subject to unspecified “restrictions.”\
    \ The catalog does not mention how the export eligibility review process works for this latter category; this process is the subject of other Chinese laws and regulations. The July 2025 revision adds\
    \ several technologies related to lithium-ion battery manufacturing to the catalog, demonstrating China’s confidence that it is the world leader in these technologies.\nThis translation incorporates\
    \ China’s July 2025 list of modifications to the \nCatalogue\n into the full text of the \nCatalogue\n as published by China in December 2023.\nArchived versions of the Chinese text of the July 2025\
    \ modifications and the December 2023 full text are available online at \nhttps://perma.cc/KT3B-XQY3\n and \nhttps://perma.cc/B5Z7-JH2T\n respectively.\nChinese Catalogue of Technologies Prohibited\
    \ or Restricted from Export [July 2025]\n1\nMinistry of Commerce (MOFCOM)\nMinistry of Science and Technology (MOST)\nReference Principles for Chinese Technologies Prohibited or Restricted from Export\n\
    I. Reference Principles for Technologies Prohibited from Export\n(i) Where export is prohibited to safeguard national security, the public interest, or public morality;\n(ii) Where it is necessary to\
    \ prohibit export to protect human health or safety, protect animal or plant life or health, or protect the environment;\n(iii) Other cases where it is necessary to prohibit export in accordance with\
    \ laws and administrative regulations;\n(iv) Other cases where it is necessary to prohibit export pursuant to the provisions of international treaties and agreements concluded by China or to which it\
    \ is a party.\nII. Reference Principles for Technologies Restricted from Export\n(i) Where it is necessary to restrict export to safeguard national security, the public interest, or public morality;\n\
    (ii) Where it is necessary to restrict export to protect human health or safety, protect animal or plant life or health, or protect the environment;\n(iii) Other cases where it is necessary to restrict\
    \ export in accordance with laws and administrative regulations;\n(iv) Other cases where it is necessary to restrict export pursuant to the provisions of international treaties and agreements concluded\
    \ by China or to which it is a party.\nTo view the rest of this translation, download the pdf below.\nDownload Full Translation\nChinese Catalogue of Technologies Prohibited or Restricted from Export\
    \ [July 2025]\nTranslator’s note: The July 2025 changes to the \nChinese Catalogue of Technologies Prohibited or Restricted from Export "
- id: art-2
  title: 'are as follows: In the “Prohibited from Export” portion: (1)'
  text: "are as follows: In the “Prohibited from Export” portion: (1) item 085001J “Chinese traditional building technology” is deleted. In the “Restricted from Export” portion: (2) items 085001X “Chinese\
    \ traditional building technology” and 085001X “Building environmental control technology” are deleted. (3) Item 252604X “Technology for battery positive electrode materials and preparations” (pp. 21-22)\
    \ is added. (4) In item 083201X “Non-ferrous metals metallurgy technology,” control point 2 is changed from “’Dissolution method’ (“溶解法”) process of recovering gallium in the original liquid using the\
    \ precipitation mother liquor (种分母液) in alumina production” to “Technology and techniques for extracting metallic gallium from alumina mother liquor (母液) using methods such as ion exchange and ion exchange\
    \ resin” (p. 27). (5) In item 083201X, control points 9-13, all related to lithium extraction, are added (pp. 28-29). CSET’s English translation of the previous (December 2023) version of the \nChinese\
    \ Catalogue of Technologies Prohibited or Restricted from Export\n is available online at: \nhttps://cset.georgetown.edu/publication/china-export-control-catalog-2023/.\nAuthor\nChinese Ministry of\
    \ Commerce (MOFCOM; 商务部) and Ministry of Science and Technology (MOST; 科学技术部; 科技部)\nSource\nMOST website\nOriginally Published\nJuly 15, 2025\nTranslated\nAugust 18, 2025\nRelated Content\nPrevious\n\
