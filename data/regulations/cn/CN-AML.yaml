- id: art-11
  title: 第一条 为了预防和制止垄断行为，保护市场公平竞争，鼓
  text: '第一条 为了预防和制止垄断行为，保护市场公平竞争，鼓

    励创新，提高经济运行效率，维护消费者利益和社会公共利益，

    促进社会主义市场经济健康发展，制定本法。'
- id: art-12
  title: 第二条 中华人民共和国境内经济活动中的垄断行为，适用
  text: '第二条 中华人民共和国境内经济活动中的垄断行为，适用

    本法；中华人民共和国境外的垄断行为，对境内市场竞争产生排

    除、限制影响的，适用本法。'
- id: art-13
  title: 第三条 本法规定的垄断行为包括：
  text: '第三条 本法规定的垄断行为包括：

    （一）经营者达成垄断协议；

    （二）经营者滥用市场支配地位；

    （三）具有或者可能具有排除、限制竞争效果的经营者集中。'
- id: art-14
  title: 第四条 反垄断工作坚持中国共产党的领导。
  text: '第四条 反垄断工作坚持中国共产党的领导。

    国家坚持市场化、法治化原则，强化竞争政策基础地位，制

    定和实施与社会主义市场经济相适应的竞争规则，完善宏观调控，

    健全统一、开放、竞争、有序的市场体系。'
- id: art-15
  title: 第五条 国家建立健全公平竞争审查制度。
  text: '第五条 国家建立健全公平竞争审查制度。

    行政机关和法律、法规授权的具有管理公共事务职能的组织

    在制定涉及市场主体经济活动的规定时，应当进行公平竞争审查。'
- id: art-16
  title: 第六条 经营者可以通过公平竞争、自愿联合，依法实施集
  text: '第六条 经营者可以通过公平竞争、自愿联合，依法实施集

    中，扩大经营规模，提高市场竞争能力。'
- id: art-17
  title: 第七条 具有市场支配地位的经营者，不得滥用市场支配地
  text: '第七条 具有市场支配地位的经营者，不得滥用市场支配地

    2

    位，排除、限制竞争。'
- id: art-18
  title: 第八条 国有经济占控制地位的关系国民经济命脉和国家
  text: '第八条 国有经济占控制地位的关系国民经济命脉和国家

    安全的行业以及依法实行专营专卖的行业，国家对其经营者的合

    法经营活动予以保护，并对经营者的经营行为及其商品和服务的

    价格依法实施监管和调控，维护消费者利益，促进技术进步。

    前款规定行业的经营者应当依法经营，诚实守信，严格自律，

    接受社会公众的监督，不得利用其控制地位或者专营专卖地位损

    害消费者利益。'
- id: art-19
  title: 第九条 经营者不得利用数据和算法、技术、资本优势以及
  text: '第九条 经营者不得利用数据和算法、技术、资本优势以及

    平台规则等从事本法禁止的垄断行为。'
- id: art-20
  title: 第十条 行政机关和法律、法规授权的具有管理公共事务职
  text: '第十条 行政机关和法律、法规授权的具有管理公共事务职

    能的组织不得滥用行政权力，排除、限制竞争。'
- id: art-21
  title: 第十一条 国家健全完善反垄断规则制度，强化反垄断监管
  text: '第十一条 国家健全完善反垄断规则制度，强化反垄断监管

    力量，提高监管能力和监管体系现代化水平，加强反垄断执法司

    法，依法公正高效审理垄断案件，健全行政执法和司法衔接机制，

    维护公平竞争秩序。'
- id: art-22
  title: 第十二条 国务院设立反垄断委员会，负责组织、协调、指
  text: '第十二条 国务院设立反垄断委员会，负责组织、协调、指

    导反垄断工作，履行下列职责：

    （一）研究拟订有关竞争政策；

    （二）组织调查、评估市场总体竞争状况，发布评估报告；

    （三）制定、发布反垄断指南；

    3

    （四）协调反垄断行政执法工作；

    （五）国务院规定的其他职责。

    国务院反垄断委员会的组成和工作规则由国务院规定。'
- id: art-23
  title: 第十三条 国务院反垄断执法机构负责反垄断统一执法工
  text: '第十三条 国务院反垄断执法机构负责反垄断统一执法工

    作。

    国务院反垄断执法机构根据工作需要，可以授权省、自治区、

    直辖市人民政府相应的机构，依照本法规定负责有关反垄断执法

    工作。'
- id: art-24
  title: 第十四条 行业协会应当加强行业自律，引导本行业的经营
  text: '第十四条 行业协会应当加强行业自律，引导本行业的经营

    者依法竞争，合规经营，维护市场竞争秩序。'
- id: art-25
  title: 第十五条 本法所称经营者，是指从事商品生产、经营或者
  text: '第十五条 本法所称经营者，是指从事商品生产、经营或者

    提供服务的自然人、法人和非法人组织。

    本法所称相关市场，是指经营者在一定时期内就特定商品或

    者服务（以下统称商品）进行竞争的商品范围和地域范围。'
- id: art-26
  title: 第二章 垄断协议
  text: 第二章 垄断协议
- id: art-27
  title: 第十六条 本法所称垄断协议，是指排除、限制竞争的协议、
  text: '第十六条 本法所称垄断协议，是指排除、限制竞争的协议、

    决定或者其他协同行为。'
- id: art-28
  title: 第十七条 禁止具有竞争关系的经营者达成下列垄断协议：
  text: '第十七条 禁止具有竞争关系的经营者达成下列垄断协议：

    （一）固定或者变更商品价格；

    （二）限制商品的生产数量或者销售数量；

    （三）分割销售市场或者原材料采购市场；

    4

    （四）限制购买新技术、新设备或者限制开发新技术、新产

    品；

    （五）联合抵制交易；

    （六）国务院反垄断执法机构认定的其他垄断协议。'
- id: art-29
  title: 第十八条 禁止经营者与交易相对人达成下列垄断协议：
  text: '第十八条 禁止经营者与交易相对人达成下列垄断协议：

    （一）固定向第三人转售商品的价格；

    （二）限定向第三人转售商品的最低价格；

    （三）国务院反垄断执法机构认定的其他垄断协议。

    对前款第一项和第二项规定的协议，经营者能够证明其不具

    有排除、限制竞争效果的，不予禁止。

    经营者能够证明其在相关市场的市场份额低于国务院反垄

    断执法机构规定的标准，并符合国务院反垄断执法机构规定的其

    他条件的，不予禁止。'
- id: art-30
  title: 第十九条 经营者不得组织其他经营者达成垄断协议或者
  text: '第十九条 经营者不得组织其他经营者达成垄断协议或者

    为其他经营者达成垄断协议提供实质性帮助。'
- id: art-31
  title: 第二十条 经营者能够证明所达成的协议属于下列情形之
  text: '第二十条 经营者能够证明所达成的协议属于下列情形之

    一的，不适用本法第十七条、第十八条第一款、第十九条的规定：

    （一）为改进技术、研究开发新产品的；

    （二）为提高产品质量、降低成本、增进效率，统一产品规

    格、标准或者实行专业化分工的；

    （三）为提高中小经营者经营效率，增强中小经营者竞争力

    5

    的；

    （四）为实现节约能源、保护环境、救灾救助等社会公共利

    益的；

    （五）因经济不景气，为缓解销售量严重下降或者生产明显

    过剩的；

    （六）为保障对外贸易和对外经济合作中的正当利益的；

    （七）法律和国务院规定的其他情形。

    属于前款第一项至第五项情形，不适用本法第十七条、第十

    八条第一款、第十九条规定的，经营者还应当证明所达成的协议

    不会严重限制相关市场的竞争，并且能够使消费者分享由此产生

    的利益。'
- id: art-32
  title: 第二十一条 行业协会不得组织本行业的经营者从事本章
  text: '第二十一条 行业协会不得组织本行业的经营者从事本章

    禁止的垄断行为。'
- id: art-33
  title: 第三章 滥用市场支配地位
  text: 第三章 滥用市场支配地位
- id: art-34
  title: 第二十二条 禁止具有市场支配地位的经营者从事下列滥
  text: '第二十二条 禁止具有市场支配地位的经营者从事下列滥

    用市场支配地位的行为：

    （一）以不公平的高价销售商品或者以不公平的低价购买商

    品；

    （二）没有正当理由，以低于成本的价格销售商品；

    （三）没有正当理由，拒绝与交易相对人进行交易；

    （四）没有正当理由，限定交易相对人只能与其进行交易或

    6

    者只能与其指定的经营者进行交易；

    （五）没有正当理由搭售商品，或者在交易时附加其他不合

    理的交易条件；

    （六）没有正当理由，对条件相同的交易相对人在交易价格

    等交易条件上实行差别待遇；

    （七）国务院反垄断执法机构认定的其他滥用市场支配地位

    的行为。

    具有市场支配地位的经营者不得利用数据和算法、技术以及

    平台规则等从事前款规定的滥用市场支配地位的行为。

    本法所称市场支配地位，是指经营者在相关市场内具有能够

    控制商品价格、数量或者其他交易条件，或者能够阻碍、影响其

    他经营者进入相关市场能力的市场地位。'
- id: art-35
  title: 第二十三条 认定经营者具有市场支配地位，应当依据下列
  text: '第二十三条 认定经营者具有市场支配地位，应当依据下列

    因素：

    （一）该经营者在相关市场的市场份额，以及相关市场的竞

    争状况；

    （二）该经营者控制销售市场或者原材料采购市场的能力；

    （三）该经营者的财力和技术条件；

    （四）其他经营者对该经营者在交易上的依赖程度；

    （五）其他经营者进入相关市场的难易程度；

    （六）与认定该经营者市场支配地位有关的其他因素。

    7'
- id: art-36
  title: 第二十四条 有下列情形之一的，可以推定经营者具有市场
  text: '第二十四条 有下列情形之一的，可以推定经营者具有市场

    支配地位：

    （一）一个经营者在相关市场的市场份额达到二分之一的；

    （二）两个经营者在相关市场的市场份额合计达到三分之二

    的；

    （三）三个经营者在相关市场的市场份额合计达到四分之三

    的。

    有前款第二项、第三项规定的情形，其中有的经营者市场份

    额不足十分之一的，不应当推定该经营者具有市场支配地位。

    被推定具有市场支配地位的经营者，有证据证明不具有市场

    支配地位的，不应当认定其具有市场支配地位。'
- id: art-37
  title: 第四章 经营者集中
  text: 第四章 经营者集中
- id: art-38
  title: 第二十五条 经营者集中是指下列情形：
  text: '第二十五条 经营者集中是指下列情形：

    （一）经营者合并；

    （二）经营者通过取得股权或者资产的方式取得对其他经营

    者的控制权；

    （三）经营者通过合同等方式取得对其他经营者的控制权或

    者能够对其他经营者施加决定性影响。'
- id: art-39
  title: 第二十六条 经营者集中达到国务院规定的申报标准的，经
  text: '第二十六条 经营者集中达到国务院规定的申报标准的，经

    营者应当事先向国务院反垄断执法机构申报，未申报的不得实施

    集中。

    8

    经营者集中未达到国务院规定的申报标准，但有证据证明该

    经营者集中具有或者可能具有排除、限制竞争效果的，国务院反

    垄断执法机构可以要求经营者申报。

    经营者未依照前两款规定进行申报的，国务院反垄断执法机

    构应当依法进行调查。'
- id: art-40
  title: 第二十七条 经营者集中有下列情形之一的，可以不向国务
  text: '第二十七条 经营者集中有下列情形之一的，可以不向国务

    院反垄断执法机构申报：

    （一）参与集中的一个经营者拥有其他每个经营者百分之五

    十以上有表决权的股份或者资产的；

    （二）参与集中的每个经营者百分之五十以上有表决权的股

    份或者资产被同一个未参与集中的经营者拥有的。'
- id: art-41
  title: 第二十八条 经营者向国务院反垄断执法机构申报集中，应
  text: '第二十八条 经营者向国务院反垄断执法机构申报集中，应

    当提交下列文件、资料：

    （一）申报书；

    （二）集中对相关市场竞争状况影响的说明；

    （三）集中协议；

    （四）参与集中的经营者经会计师事务所审计的上一会计年

    度财务会计报告；

    （五）国务院反垄断执法机构规定的其他文件、资料。

    申报书应当载明参与集中的经营者的名称、住所、经营范围、

    预定实施集中的日期和国务院反垄断执法机构规定的其他事项。

    9'
- id: art-42
  title: 第二十九条 经营者提交的文件、资料不完备的，应当在国
  text: '第二十九条 经营者提交的文件、资料不完备的，应当在国

    务院反垄断执法机构规定的期限内补交文件、资料。经营者逾期

    未补交文件、资料的，视为未申报。'
- id: art-43
  title: 第三十条 国务院反垄断执法机构应当自收到经营者提交
  text: '第三十条 国务院反垄断执法机构应当自收到经营者提交

    的符合本法第二十八条规定的文件、资料之日起三十日内，对申

    报的经营者集中进行初步审查，作出是否实施进一步审查的决定，

    并书面通知经营者。国务院反垄断执法机构作出决定前，经营者

    不得实施集中。

    国务院反垄断执法机构作出不实施进一步审查的决定或者

    逾期未作出决定的，经营者可以实施集中。'
- id: art-44
  title: 第三十一条 国务院反垄断执法机构决定实施进一步审查
  text: '第三十一条 国务院反垄断执法机构决定实施进一步审查

    的，应当自决定之日起九十日内审查完毕，作出是否禁止经营者

    集中的决定，并书面通知经营者。作出禁止经营者集中的决定，

    应当说明理由。审查期间，经营者不得实施集中。

    有下列情形之一的，国务院反垄断执法机构经书面通知经营

    者，可以延长前款规定的审查期限，但最长不得超过六十日：

    （一）经营者同意延长审查期限的；

    （二）经营者提交的文件、资料不准确，需要进一步核实的；

    （三）经营者申报后有关情况发生重大变化的。

    国务院反垄断执法机构逾期未作出决定的，经营者可以实施

    集中。

    10'
- id: art-45
  title: 第三十二条 有下列情形之一的，国务院反垄断执法机构可
  text: '第三十二条 有下列情形之一的，国务院反垄断执法机构可

    以决定中止计算经营者集中的审查期限，并书面通知经营者：

    （一）经营者未按照规定提交文件、资料，导致审查工作无

    法进行；

    （二）出现对经营者集中审查具有重大影响的新情况、新事

    实，不经核实将导致审查工作无法进行；

    （三）需要对经营者集中附加的限制性条件进一步评估，且

    经营者提出中止请求。

    自中止计算审查期限的情形消除之日起，审查期限继续计算，

    国务院反垄断执法机构应当书面通知经营者。'
- id: art-46
  title: 第三十三条 审查经营者集中，应当考虑下列因素：
  text: '第三十三条 审查经营者集中，应当考虑下列因素：

    （一）参与集中的经营者在相关市场的市场份额及其对市场

    的控制力；

    （二）相关市场的市场集中度；

    （三）经营者集中对市场进入、技术进步的影响；

    （四）经营者集中对消费者和其他有关经营者的影响；

    （五）经营者集中对国民经济发展的影响；

    （六）国务院反垄断执法机构认为应当考虑的影响市场竞争

    的其他因素。'
- id: art-47
  title: 第三十四条 经营者集中具有或者可能具有排除、限制竞争
  text: '第三十四条 经营者集中具有或者可能具有排除、限制竞争

    效果的，国务院反垄断执法机构应当作出禁止经营者集中的决定。

    11

    但是，经营者能够证明该集中对竞争产生的有利影响明显大于不

    利影响，或者符合社会公共利益的，国务院反垄断执法机构可以

    作出对经营者集中不予禁止的决定。'
- id: art-48
  title: 第三十五条 对不予禁止的经营者集中，国务院反垄断执法
  text: '第三十五条 对不予禁止的经营者集中，国务院反垄断执法

    机构可以决定附加减少集中对竞争产生不利影响的限制性条件。'
- id: art-49
  title: 第三十六条 国务院反垄断执法机构应当将禁止经营者集
  text: '第三十六条 国务院反垄断执法机构应当将禁止经营者集

    中的决定或者对经营者集中附加限制性条件的决定，及时向社会

    公布。'
- id: art-50
  title: 第三十七条 国务院反垄断执法机构应当健全经营者集中
  text: '第三十七条 国务院反垄断执法机构应当健全经营者集中

    分类分级审查制度，依法加强对涉及国计民生等重要领域的经营

    者集中的审查，提高审查质量和效率。'
- id: art-51
  title: 第三十八条 对外资并购境内企业或者以其他方式参与经
  text: '第三十八条 对外资并购境内企业或者以其他方式参与经

    营者集中，涉及国家安全的，除依照本法规定进行经营者集中审

    查外，还应当按照国家有关规定进行国家安全审查。'
- id: art-52
  title: 第五章 滥用行政权力排除、限制竞争
  text: 第五章 滥用行政权力排除、限制竞争
- id: art-53
  title: 第三十九条 行政机关和法律、法规授权的具有管理公共事
  text: '第三十九条 行政机关和法律、法规授权的具有管理公共事

    务职能的组织不得滥用行政权力，限定或者变相限定单位或者个

    人经营、购买、使用其指定的经营者提供的商品。'
- id: art-54
  title: 第四十条 行政机关和法律、法规授权的具有管理公共事务
  text: '第四十条 行政机关和法律、法规授权的具有管理公共事务

    职能的组织不得滥用行政权力，通过与经营者签订合作协议、备

    忘录等方式，妨碍其他经营者进入相关市场或者对其他经营者实

    12

    行不平等待遇，排除、限制竞争。'
- id: art-55
  title: 第四十一条 行政机关和法律、法规授权的具有管理公共事
  text: '第四十一条 行政机关和法律、法规授权的具有管理公共事

    务职能的组织不得滥用行政权力，实施下列行为，妨碍商品在地

    区之间的自由流通：

    （一）对外地商品设定歧视性收费项目、实行歧视性收费标

    准，或者规定歧视性价格；

    （二）对外地商品规定与本地同类商品不同的技术要求、检

    验标准，或者对外地商品采取重复检验、重复认证等歧视性技术

    措施，限制外地商品进入本地市场；

    （三）采取专门针对外地商品的行政许可，限制外地商品进

    入本地市场；

    （四）设置关卡或者采取其他手段，阻碍外地商品进入或者

    本地商品运出；

    （五）妨碍商品在地区之间自由流通的其他行为。'
- id: art-56
  title: 第四十二条 行政机关和法律、法规授权的具有管理公共事
  text: '第四十二条 行政机关和法律、法规授权的具有管理公共事

    务职能的组织不得滥用行政权力，以设定歧视性资质要求、评审

    标准或者不依法发布信息等方式，排斥或者限制经营者参加招标

    投标以及其他经营活动。'
- id: art-57
  title: 第四十三条 行政机关和法律、法规授权的具有管理公共事
  text: '第四十三条 行政机关和法律、法规授权的具有管理公共事

    务职能的组织不得滥用行政权力，采取与本地经营者不平等待遇

    等方式，排斥、限制、强制或者变相强制外地经营者在本地投资

    13

    或者设立分支机构。'
- id: art-58
  title: 第四十四条 行政机关和法律、法规授权的具有管理公共事
  text: '第四十四条 行政机关和法律、法规授权的具有管理公共事

    务职能的组织不得滥用行政权力，强制或者变相强制经营者从事

    本法规定的垄断行为。'
- id: art-59
  title: 第四十五条 行政机关和法律、法规授权的具有管理公共事
  text: '第四十五条 行政机关和法律、法规授权的具有管理公共事

    务职能的组织不得滥用行政权力，制定含有排除、限制竞争内容

    的规定。'
- id: art-60
  title: 第六章 对涉嫌垄断行为的调查
  text: 第六章 对涉嫌垄断行为的调查
