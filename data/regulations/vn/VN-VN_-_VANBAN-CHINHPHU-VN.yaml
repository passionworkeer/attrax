    \ tử công vụ Chính phủ\nLiên hệ\nSơ đồ\nCổng TTĐT\nChính phủ\nGhi rõ nguồn 'Cục Thông tin và Truyền thông Chính phủ' hoặc\n'www.chinhphu.vn'\nkhi phát hành lại thông tin từ các nguồn này."
