  text: "Ban Chỉ đạo Trung tâm tài chính quốc tế tại Việt Nam \nBan Chỉ đạo Trung ương các chương trình mục tiêu quốc gia\nBan Chỉ đạo Trung ương các chương trình mục tiêu quốc gia giai đoạn 2016 - 2020\n\
