    \ định về Định mức kinh tế - kỹ thuật điều tra, đánh giá hiện trạng xả nước thải và khả năng tiếp nhận nước thải của nguồn nước\n16/09/2026\nTài liệu đính kèm\n85/2026/VBHN-TT-BNNMT\n16/09/2026\n16/09/2026\n\
    Quy định kỹ thuật quy hoạch tổng hợp lưu vực sông liên tỉnh, nguồn nước liên tỉnh\n16/09/2026\nTài liệu đính kèm\n84/2026/VBHN-NĐ-BNNMT\n16/09/2026\n16/09/2026\nQuy định về xử phạt vi phạm hành chính\
    \ trong lĩnh vực khoáng sản\n16/09/2026\nTài liệu đính kèm\n83/2026/VBHN-TT-BNNMT\n16/09/2026\n16/09/2026\nBan hành quy định kỹ thuật và định mức kinh tế - kỹ thuật khảo sát, đo đạc tài nguyên nước\
    \ và đánh giá, dự báo tài nguyên nước bằng mô hình dòng chảy \n16/09/2026\nTài liệu đính kèm\n82/2026/VBHN-TT-BXD\n16/09/2026\n16/09/2026\nHướng dẫn quản lý cây xanh đô thị\n16/09/2026\nTài liệu đính\
    \ kèm\n81/2026/VBHN-TT-BXD\n16/09/2026\n16/09/2026\nBan hành QCVN 07:2023/BXD Quy chuẩn kỹ thuật quốc gia về Hệ thống công trình hạ tầng kỹ thuật\n16/09/2026\nTài liệu đính kèm\n80/2026/VBHN-TT-BXD\n\
    16/09/2026\n16/09/2026\nQuy định về trình tự, thủ tục chứng nhận chất lượng an toàn kỹ thuật và bảo vệ môi trường xe cơ giới, xe máy chuyên dùng, phụ tùng xe cơ giới trong nhập khẩu\n16/09/2026\nTài\
    \ liệu đính kèm\n65/CĐ-TTg\n16/09/2026\n16/09/2026\nVề vụ cháy nhà dân tại số 2B ngách 264/2 phố Thụy Khuê, phường Tây Hồ, thành phố Hà Nội\n16/09/2026\nTài liệu đính kèm\n43/2026/QĐ-TTg\n16/09/2026\n\
    16/09/2026\nBan hành Quy chế quản lý, vận hành, khai thác, sử dụng Trục liên thông văn bản quốc gia\n16/09/2026\nTài liệu đính kèm\n20/2026/TT-BNV\n16/09/2026\n16/09/2026\nQuy định chi tiết và hướng\
    \ dẫn thi hành một số điều của Luật Thi đua, khen thưởng đối với ngành Nội vụ \n16/09/2026\nTài liệu đính kèm\nTài liệu đính kèm\n14464/BTC-PTHT\n15/09/2026\n15/09/2026\nV/v thực hiện chế độ báo cáo\
    \ nhanh theo tuần tình hình phân bổ và giải ngân vốn đầu tư công nguồn ngân sách nhà nước năm 2026 - lũy kế đến hết ngày 10/9/2026\n15/09/2026\nTài liệu đính kèm"
- id: art-7
  title: 1788/QĐ-TTg
  text: "1788/QĐ-TTg\n15/09/2026\n15/09/2026\nBan hành Kế hoạch triển khai thi hành Luật sửa đổi, bổ sung một số điều của Luật Trách nhiệm bồi thường của Nhà nước\n15/09/2026\nTài liệu đính kèm\n487/TB-VPCP\n\
    15/09/2026\n15/09/2026\nKết luận của Phó Thủ tướng Thường trực Chính phủ Phạm Gia Túc tại chuyến kiểm tra và làm việc về tình hình triển khai các dự án trọng điểm về giao thông và năng lượng tại khu\
    \ vực đồng bằng sông Cửu Long\n15/09/2026\nTài liệu đính kèm\n358/2026/NĐ-CP\n15/09/2026\n15/09/2026\nVề cơ chế hoạt động và quản lý tài chính của Công ty trách nhiệm hữu hạn một thành viên Mua bán\
    \ nợ Việt Nam\n15/09/2026\nTài liệu đính kèm\n357/2026/NĐ-CР\n15/09/2026\n15/09/2026\nVề quản lý, sử dụng nguồn thu từ cơ cấu lại vốn nhà nước tại doanh nghiệp, chuyển đơn vị sự nghiệp công lập thành\
    \ công ty cổ phần\n15/09/2026\nTài liệu đính kèm\n79/2026/VBHN-NĐ-BXD\n15/09/2026\n15/09/2026\nQuy định danh mục hàng hóa nguy hiểm, vận chuyển hàng hóa nguy hiểm và trình tự, thủ tục cấp giấy phép,\
    \ cấp giấy chứng nhận hoàn thành chương trình tập huấn cho người lái xe hoặc người áp tải vận chuyển hàng hóa nguy hiểm trên đường bộ\n15/09/2026\nTài liệu đính kèm\n78/2026/VBHN-TT-BXD\n15/09/2026\n\
    15/09/2026\nQuy định một số nội dung về lựa chọn nhà đầu tư thực hiện dự án đầu tư kinh doanh công trình trạm dừng nghỉ\n15/09/2026\nTài liệu đính kèm\n56/2026/VBHN-NĐ-BQP\n15/09/2026\n15/09/2026\n\
    Quy định biện pháp thi hành chế độ, chính sách đối với quân nhân chuyên nghiệp, công nhân và viên chức quốc phòng chuyển ngành, công nhân và viên chức quốc phòng thôi việc theo quy định của Luật Quân\
    \ nhân chuyên nghiệp, công nhân và viên chức quốc phòng\n15/09/2026\nTài liệu đính kèm\n55/2026/VBHN-NĐ-BQP\n15/09/2026\n15/09/2026\nQuy định chi tiết và hướng dẫn thi hành một số điều về chế độ, chính\
    \ sách của Luật quân nhân chuyên nghiệp, công nhân và viên chức quốc phòng\n15/09/2026\nTài liệu đính kèm\n54/2026/VBHN-NĐ-BQP\n15/09/2026\n15/09/2026\nQuy định chi tiết và hướng dẫn thi hành một số\
    \ điều của Luật Sĩ quan Quân đội nhân dân Việt Nam về chế độ, chính sách đối với sĩ quan thôi phục vụ tại ngũ; sĩ quan tại ngũ hy sinh, từ trần; sĩ quan tại ngũ chuyển sang quân nhân chuyên nghiệp hoặc\
    \ công chức quốc phòng\n15/09/2026\nTài liệu đính kèm\n09/2026/TT-KTNN\n15/09/2026\n15/09/2026\nQuy định danh mục hồ sơ kiểm toán; chế độ nộp lưu, bảo quản, khai thác và huỷ hồ sơ kiểm toán của Kiểm\
    \ toán nhà nước\n15/09/2026\nTài liệu đính kèm\n1780/QĐ-TTg\n14/09/2026\n14/09/2026\nVề việc thành lập Hội đồng thẩm định nhà nước thẩm định Báo cáo nghiên cứu tiền khả thi Dự án tuyến đường bộ cao\
    \ tốc Quảng Ngãi - Kon Tum, đoạn Quảng Ngãi - Đăk Hà (Km0-Km136)\n14/09/2026\nTài liệu đính kèm\n1777/QĐ-TTg\n14/09/2026\n14/09/2026\nPhê chuẩn kết quả miễn nhiệm chức vụ Phó Chủ tịch Ủy ban nhân dân\
    \ thành phố Cần Thơ nhiệm kỳ 2026- 2031\n14/09/2026\nTài liệu đính kèm\n1775/QĐ-TTg\n14/09/2026\n14/09/2026\nPhê duyệt Chương trình hành động thực hiện Kế hoạch chiến lược Kết nối ASEAN tại Việt Nam\
    \ giai đoạn 2026 - 2030 và giai đoạn 2031 - 2035\n14/09/2026\nTài liệu đính kèm\n1774/QĐ-TTg\n14/09/2026\n14/09/2026\nBan hành Kế hoạch triển khai thi hành Luật Hòa giải ở cơ sở\n14/09/2026\nTài liệu\
    \ đính kèm\n482/TB-VPCP\n14/09/2026\n14/09/2026\nKết luận của Phó Thủ tướng Thường trực Chính phủ Phạm Gia Túc tại cuộc họp rà soát quy định về khoảng cách an toàn đối với xe tham gia giao thông trên\
    \ đường bộ\n14/09/2026\nTài liệu đính kèm\n136/2026/TT-BTC\n14/09/2026\n14/09/2026\nSửa đổi, bổ sung khoản 2 Điều 3 của Thông tư số 158/2025/TT-BTC ngày 31 tháng 12 năm 2025 của Bộ trưởng Bộ Tài chính\
    \ quy định chi tiết một số điều của Nghị định số 360/2025/NĐ-CP ngày 31 tháng 12 năm 2025 của Chính phủ quy định chi tiết thi hành một số điều của Luật Thuế tiêu thụ đặc biệt\n14/09/2026\nTài liệu đính\
    \ kèm\n82/2026/VBHN-QĐ-BNNMT\n14/09/2026\n14/09/2026\nQuy định tiêu chí xác định dự án, phương án sản xuất kinh doanh ứng dụng công nghệ cao trong nông nghiệp và bổ sung Danh mục công nghệ cao được\
    \ ưu tiên đầu tư phát triển ban hành kèm theo Quyết định số 66/2014/QĐ-TTg ngày 25 tháng 11 năm 2014 của Thủ tướng Chính phủ \n14/09/2026"
- id: art-8
  title: Tài liệu đính kèm
  text: "Tài liệu đính kèm\n79/2026/VBHN-TT-BCT\n14/09/2026\n14/09/2026\nQuy định việc khai báo, quản lý và sử dụng cơ sở dữ liệu môi trường ngành Công Thương\n14/09/2026\nTài liệu đính kèm\n78/2026/VBHN-TT-BCT\n\
    14/09/2026\n14/09/2026\nQuy định về quản lý, thực hiện các nhiệm vụ sử dụng nguồn kinh phí sự nghiệp bảo vệ môi trường của Bộ Công Thương\n14/09/2026\nTài liệu đính kèm\n77/2026/VBHN-TT-BCT\n14/09/2026\n\
    14/09/2026\nSửa đổi, bổ sung một số quy định về phân cấp, cắt giảm, đơn giản hóa thủ tục hành chính trong các lĩnh vực thuộc phạm vi quản lý của Bộ Công Thương\n14/09/2026\nTài liệu đính kèm\n76/2026/VBHN-TT-BCT\n\
    14/09/2026\n14/09/2026\nSửa đổi, bổ sung một số quy định về phân cấp thực hiện thủ tục hành chính trong các lĩnh vực thuộc phạm vi quản lý của Bộ Công Thương\n14/09/2026\nTài liệu đính kèm\n75/2026/VBHN-TT-BCT\n\
    14/09/2026\n14/09/2026\nSửa đổi, bổ sung một số quy định về chế độ báo cáo định kỳ tại các Thông tư do Bộ trưởng Bộ Công Thương ban hành hoặc liên tịch ban hành\n14/09/2026\nTài liệu đính kèm\n74/2026/VBHN-TT-BCT\n\
    14/09/2026\n14/09/2026\nBổ sung Dạnh mục chi tiết theo mã số HS của hàng hóa xuất khẩu, nhập khẩu quy định tại một số Thông tư của Bộ Công Thương\n14/09/2026\nTài liệu đính kèm\n73/2026/VBHN-TT-BCT\n\
    14/09/2026\n14/09/2026\nSửa đổi, bổ sung một số điều quy định Danh mục chi tiết theo mã số HS của hàng hóa xuất khẩu, nhập khẩu ban hành kèm theo một số Thông tư của Bộ trưởng Bộ Công Thương\n14/09/2026\n\
    Tài liệu đính kèm\n73/2026/VBHN-TT-BXD\n14/09/2026\n14/09/2026\nQuy định về quản lý, khai thác vận tải đường sắt\n14/09/2026\nTài liệu đính kèm\n72/2026/VBHN-TT-BXD\n14/09/2026\n14/09/2026\nQuy định\
    \ về quản lý, khai thác kết cấu hạ tầng đường sắt\n14/09/2026\nTài liệu đính kèm\n4/2026/VBHN-TT-BVHTTDL\n14/09/2026\n14/09/2026\nQuy định về hoạt động chuyên môn, nghiệp vụ của thư viện\n14/09/2026\n\
    Tài liệu đính kèm\n1\n2\n3\n4\n...\n            1 - 50 | 99113\nTất cả văn bản\n                        Văn bản mới\n                        Văn bản quy phạm pháp luật\nCơ quan ban hành\nQuốc hội\n\
    Chính phủ\nThủ tướng Chính phủ\nBộ/Cơ quan ngang bộ\nLiên bộ\nUBND tỉnh/thành phố\nLoại văn bản\nHiến pháp\nSắc lệnh - Sắc luật\nLuật - Pháp lệnh\nNghị định\nQuyết định\nThông tư\n                 \
