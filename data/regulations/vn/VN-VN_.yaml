  title: Công báo điện tử Nước CHXHCN Việt Nam
  text: "Công báo điện tử Nước CHXHCN Việt Nam\n                        CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM\n                        Độc lập - Tự do - Hạnh phúc\nCông báo\n                    Thứ --, --/--/----\n\
    \                            --° - --°\n                                Hà Nội\n                        trang chủ\n                        Công báo\n                        Văn bản đăng công báo\n \
    \                       Văn bản chỉ đạo điều hành\n                    Thứ --, --/--/----\nHà Nội\n26°-33°\nTất cả loại thông tin\nCông báo\nVăn bản\n                    Tìm kiếm nâng cao\nTìm kiếm\n\
    \                            Cơ quan ban hành\n-- Tất cả các cơ quan --\nTRANH TRA CHÍNH PHỦ\nVĂN PHÒNG CHÍNH PHỦ\nTHANH TRA CHÍNH PHỦ\nNGÂN HÀNG NHÀ NƯỚC VIỆT NAM\nBỘ DÂN TỘC VÀ TÔN GIÁO\nBỘ Y TẾ\n\
    BỘ GIÁO DỤC VÀ ĐÀO TẠO\nVĂN PHÒNG QUỐC HỘI\nBỘ KHOA HỌC VÀ CÔNG NGHỆ\nBỘ VĂN HÓA, THỂ THAO VÀ DU LỊCH\nKIỂM TOÁN NHÀ NƯỚC\nBỘ XÂY DỰNG\nVIỆN KIỂM SÁT NHÂN DÂN TỐI CAO\nBỘ NÔNG NGHIỆP VÀ MÔI TRƯỜNG\n\
    BỘ CÔNG THƯƠNG\nTÒA ÁN NHÂN DÂN TỐI CAO\nHỘI ĐỒNG THẨM PHÁN TÒA ÁN NHÂN DÂN TỐI CAO\nBỘ TÀI CHÍNH\nTHỦ TƯỚNG CHÍNH PHỦ\nBỘ TƯ PHÁP\nBỘ NỘI VỤ\nCHÍNH PHỦ\nỦY BAN THƯỜNG VỤ QUỐC HỘI\nBỘ NGOẠI GIAO\nQUỐC\
    \ HỘI\nBỘ CÔNG AN\nBAN CHỈ ĐẠO QUỐC GIA VỀ TÌM KIẾM, QUY TẬP VÀ XÁC MINH DANH TÍNH HÀI CỐT LIỆT SỸ\nBAN CHỈ ĐẠO QUỐC GIA VỀ CHỐNG KHAI THÁC HẢI SẢN BẤT HỢP PHÁP, KHÔNG BÁO CÁO VÀ KHÔNG THEO QUY ĐỊNH\
    \ VÀ PHÁT TRIỂN BỀN VỮNG NGÀNH THỦY SẢN\nBAN CHỈ ĐẠO CỦA CHÍNH PHỦ VỀ PHÁT TRIỂN KHOA HỌC, CÔNG NGHỆ, ĐỔI MỚI SÁNG TẠO, CHUYỂN ĐỔI SỐ VÀ ĐỀ ÁN 06\nỦY BAN QUỐC GIA VỀ TRẺ EM\nBAN CHỈ ĐẠO PHÒNG KHÔNG\
    \ NHÂN DÂN TRUNG ƯƠNG\nHỘI ĐỒNG ĐIỀU HÀNH TRUNG TÂM TÀI CHÍNH QUỐC TẾ TẠI VIỆT NAM\nBAN CHỈ ĐẠO THỰC HIỆN CÁC NGHỊ QUYẾT CỦA QUỐC HỘI VỀ THÍ ĐIỂM MỘT SỐ CƠ CHẾ, CHÍNH SÁCH ĐẶC THÙ PHÁT TRIỂN THÀNH PHỐ\
    \ HỒ CHÍ MINH\nBAN CHỈ ĐẠO CỦA CHÍNH PHỦ VỀ QUẢN LÝ VÀ ĐIỀU HÀNH KINH TẾ VĨ MÔ\nBan Chỉ đạo Trung ương về chính sách nhà ở và thị trường bất động sản\nBỘ QUỐC PHÒNG\nCHỦ TỊCH NƯỚC\nBAN CHỈ ĐẠO QUỐC\
    \ GIA HỘI NHẬP QUỐC TẾ VỀ GIÁO DỤC VÀ KHOA HỌC, CÔNG NGHỆ\nBAN CHÌ ĐẠO TRUNG ƯƠNG XÂY DỰNG ĐỀ ÁN THÍ ĐIỂM MÔ HÌNH TỔ CHỨC CHÍNH QUYỀN ĐÔ THỊ\nBAN CHỈ ĐẠO TỔNG KẾT 10 NĂM THỰC HIỆN LUẬT PCTN\nỦY BAN\
    \ AN NINH HÀNG KHÔNG DÂN DỤNG QUỐC GIA\nBỘ LAO ĐỘNG - THƯƠNG BINH VÀ XÃ HỘI\nTHÔNG TẤN XÃ VIỆT NAM\nỦY BAN QUỐC GIA VỀ BIẾN ĐỔI KHÍ HẬU\nỦY BAN TRUNG ƯƠNG MẶT TRẬN TỔ QUỐC VIỆT NAM\nBAN CHỈ ĐẠO TRUNG\
    \ ƯƠNG THỰC HIỆN THÍ ĐIỂM KHÔNG TỔ CHỨC HỘI ĐỒNG NHÂN DÂN HUYỆN, QUẬN, PHƯỜNG\nBAN CHỈ ĐẠO NHÀ NƯỚC VỀ QUY HOẠCH PHÁT TRIỀN ĐIỆN LỰC QUỐC GIA\nBAN CHỈ ĐẠO CHƯƠNG TRÌNH PHÁT TRIỂN SẢN PHẨM QUỐC GIA ĐẾN\
    \ NĂM 2020\nBỘ GIAO THÔNG VẬN TẢI\nBAN CHỈ ĐẠO NHÀ NƯỚC CÁC CÔNG TRÌNH, DỰ ÁN TRỌNG ĐIỂM NGÀNH GIAO THÔNG VẬN TẢI\nBAN CHỈ ĐẠO ĐIỀU HÀNH GIÁ\nBAN CHỈ ĐẠO QUỐC GIA VỀ Y TẾ BIỂN ĐẢO\nỦY BAN PHÁP LUẬT\n\
    BAN CHỈ ĐẠO QUỐC GIA XÂY DỰNG XÃ HỘI HỌC TẬP\nBAN CHỈ ĐẠO QUỐC GIA CHỐNG BUÔN LẬU, GIAN LẬN THƯƠNG MẠI VÀ HÀNG GIẢ\nBAN CHỈ ĐẠO QUỐC GIA VỀ HỘI NHẬP QUỐC TẾ\nBAN CHỈ ĐẠO PHÒNG, CHỐNG TỘI PHẠM CỦA CHÍNH\
    \ PHỦ\nBAN CHỈ ĐẠO 896\nBAN CHỈ ĐẠO LIÊN NGÀNH TRIỀN KHAI \"CƠ CẤU LẠI HỆ THỐNG CÁC TỔ CHỨC TÍN DỤNG GIAI ĐOẠN 2011 - 2015\"\nBỘ THÔNG TIN VÀ TRUYỀN THÔNG\nBAN CHỈ ĐẠO TRUNG ƯƠNG THỰC HIỆN QUYẾT ĐỊNH\
    \ SỐ 1956/QĐ-TTG\nHỘI ĐỒNG TƯ VẤN ĐẶC XÁ\nBAN CHỈ ĐẠO TRUNG ƯƠNG VỀ CẢI CÁCH CHÍNH SÁCH TIỀN LƯƠNG, BẢO HIỂM XÃ HỘI VÀ ƯU ĐÃI NGƯỜI CÓ CÔNG\nBAN CHỈ ĐẠO CẢI CÁCH HÀNH CHÍNH CỦA CHÍNH PHỦ\nHỘI ĐỒNG PHÁT\
    \ TRIỂN, ỨNG DỤNG NĂNG LƯỢNG NGUYÊN TỬ QUỐC GIA\nBAN CHỈ ĐẠO QUỐC GIA THỰC HIỆN QUY HOẠCH PHÁT TRIỂN NHÂN LỰC VÀ ĐÀO TẠO THEO NHU CẦU XÃ HỘI\nBAN CHỈ ĐẠO PPP\nBAN CHỈ ĐẠO CƠ KHÍ TRỌNG ĐIỀM\nBAN CHỈ\
    \ ĐẠO TRUNG ƯƠNG CHƯƠNG TRÌNH MTQG XÂY DỰNG NÔNG THÔN MỚI\nVĂN BẢN HỢP NHẤT\nBỘ KẾ HOẠCH VÀ ĐẦU TƯ\nỦY BAN DÂN TỘC\nBAN CHỈ ĐẠO QUỐC GIA VỀ TÀI CHÍNH TOÀN DIỆN\nBAN CHỈ ĐẠO PHÒNG THỦ DÂN SỰ QUỐC GIA\n\
    ỦY BAN THƯỜNG VỤ QUỐC HỘI - CHÍNH PHỦ - ĐOÀN CHỦ TỊCH ỦY BAN TRUNG ƯƠNG MẶT TRẬN TỔ QUỐC VIỆT NAM\nBAN CHỈ ĐẠO THỰC HIỆN NGHỊ QUYẾT SỐ 136/2024/QH15 CỦA QUỐC HỘI\nBAN CHỈ ĐẠO XÂY DỰNG NHÀ MÁY ĐIỆN HẠT\
    \ NHÂN\nTC\nBAN CHỈ ĐẠO QUỐC GIA VỀ PHÁT TRIỂN NGÀNH CÔNG NGHIỆP BÁN DẪN"
- id: art-2
  title: 'BAN CHỈ ĐẠO RÀ SOÁT, XỬ LÝ VƯỚNG MẮC TRONG HỆ THỐNG VĂN BẢN '
  text: "BAN CHỈ ĐẠO RÀ SOÁT, XỬ LÝ VƯỚNG MẮC TRONG HỆ THỐNG VĂN BẢN QUY PHẠM PHÁP LUẬT\nBAN CHỈ ĐẠO NHÀ NƯỚC CÁC CÔNG TRÌNH, DỰ ÁN QUAN TRỌNG QUỐC GIA, TRỌNG ĐIỂM NGÀNH GIAO THÔNG VẬN TẢI\nBAN CHỈ ĐẠO\
    \ TỔNG KẾT 20 NĂM THỰC HIỆN MÔ HÌNH TỔ CHỨC BỘ MÁY CỦA CHÍNH PHỦ\nCHÍNH PHỦ - ĐOÀN CHỦ TỊCH ỦY BAN TRUNG ƯƠNG MẶT TRẬN TỔ QUỐC VIỆT NAM\nBAN CHỈ ĐẠO XÂY DỰNG THỰC HIỆN ĐỀ ÁN CHỦ TRƯƠNG ĐẦU TƯ ĐƯỜNG\
    \ SẮT TỐC ĐỘ CAO TRÊN TRỤC BẮC-NAM VÀ CÁC\nBAN CHỈ ĐẠO TỔNG KẾT NGHỊ QUYẾT 22-NQ/TW CỦA BỘ CHÍNH TRỊ VỀ HỘI NHẬP QUỐC TẾ\nHỘI ĐỒNG ĐIỀU PHỐI VÙNG ĐỒNG BẰNG SÔNG CỬU LONG\nBAN CHỈ ĐẠO TRIỂN KHAI NGHỊ\
    \ QUYẾT SỐ 98/2023/QH15 CỦA QUỐC HỘI\nHỘI ĐỒNG ĐIỀU PHỐI VÙNG TÂY NGUYÊN\nHỘI ĐỒNG ĐIỀU PHỐI VÙNG ĐÔNG NAM BỘ\nHỘI ĐỒNG ĐIỀU PHỐI VÙNG ĐỒNG BẰNG SÔNG HỒNG\nHỘI ĐỒNG ĐIỀU PHỐI VÙNG  BẮC TRUNG BỘ VÀ DUYÊN\
    \ HẢI TRUNG BỘ\nHỘI ĐỒNG ĐIỀU PHỐI VÙNG TRUNG DU VÀ MIỀN NÚI PHÍA BẮC\nBAN CHỈ ĐẠO QUỐC GIA DÂN SỐ VÀ PHÁT TRIỂN\nBAN CHỈ ĐẠO TRUNG ƯƠNG TỔNG KẾT 20 NĂM THỰC HIỆN NGHỊ QUYẾT TRUNG ƯƠNG 5  KHÓA IX VỀ\
    \ TIẾP TỤC ĐỔI MỚ\nBAN CHỈ ĐẠO NHÀ NƯỚC CÁC DỰ ÁN TRỌNG ĐIỂM VỀ DẦU KHÍ\nBAN CHỈ ĐẠO CHƯƠNG TRÌNH QUỐC GIA VỀ SỬ DỤNG NĂNG LƯỢNG TIẾT KIỆM VÀ HIỆU QUẢ\nBAN CHỈ ĐẠO QUỸ VÌ BIỂN, ĐẢO VIỆT NAM\nTỔ CÔNG\
    \ TÁC ĐẶC BIỆT CỦA THỦ TƯỚNG CHÍNH PHỦ\nTCT\nBAN CHỈ ĐẠO TỔNG KẾT THI HÀNH LUẬT ĐẤT ĐAI VÀ XÂY DỰNG DỰ ÁN LUẬT ĐẤT ĐAI SỬA ĐỔI\nBAN CHỈ ĐẠO QUỐC GIA TÀI CHÍNH TOÀN DIỆN\nBỘ TÀI NGUYÊN VÀ MÔI TRƯỜNG\n\
    BAN CHỈ ĐẠO BIÊN SOẠN VÀ XUẤT BẢN LỊCH SỬ CHÍNH PHỦ VIỆT NAM 1945 - 2015\nBAN CHỈ ĐẠO QUỐC GIA VỀ CHỐNG KHAI THÁC HẢI SẢN BẤT HỢP PHÁP, KHÔNG BÁO CÁO VÀ KHÔNG THEO QUY ĐỊNH\nBCĐ THỰC HIỆN ĐỀ ÁN TIẾP\
    \ TỤC ĐỔI MỚI VÀ NÂNG CAO HIỆU QUẢ HĐ GIÁM ĐỊNH TƯ PHÁP Ở CẤP TRUNG ƯƠNG\nBAN CHỈ ĐẠO CHIẾN LƯỢC CÔNG NGHIỆP HÓA CỦA VIỆT NAM TRONG KHUÔN KHỔ HỢP TÁC VIỆT NAM - NHẬT BẢN\nBAN CHỈ ĐẠO CHIẾN LƯỢC CÔNG\
    \ NGHIỆP HÓA  CỦA VIỆT NAM TRONG KHUÔN KHỔ HỢP TÁC VIỆT NAM - NHẬT BẢN HƯỚ\nBAN CHỈ ĐẠO CHIẾN LƯỢC CÔNG NGHIỆP HÓA CỦA VIỆT NAM TRONG KHUÔN KHỔ HỢP TÁC VIỆT NAM - NHẬT BẢN HƯỚN\nỦY BAN QUỐC GIA ASEAN\
    \ 2020\nBAN CHỈ ĐẠO QUỐC GIA CHƯƠNG TRÌNH KHÔNG CÒN NẠN ĐÓI Ở VIỆT NAM ĐẾN NĂM 2025\nBAN CHỈ ĐẠO QUÓC GIA VỀ CƠ CẤU LẠI NỀN KINH TẾ, ĐỔI MỚI MÔ HÌNH TĂNG TRƯỞNG\nHỘI ĐỒNG QUỐC GIA VỀ AN TOÀN, VỆ SINH\
    \ LAO ĐỘNG\nỦy ban Quốc gia APEC 2017\nHỘI ĐỒNG GIÁO DỤC QUỐC PHÒNG VÀ AN NINH TRUNG ƯƠNG\nBan Chỉ đạo về đầu tư theo hình thức đối tác công - tư (PPP)\nBan Chỉ đạo trung ương xây dựng đề án thí điểm\
    \ mô hình tổ chức chính quyền đô thị\nBan Chỉ đạo quốc gia thực hiện phát triên nhân lực và đào tạo theo nhu cầu xã hội\nBan Chỉ đạo Nhà nước về Quy hoạch phát triển điện lực quốc gia\nBan Chỉ đạo liên\
    \ ngành triển khai Cơ cấu lại hệ thống các tổ chức tín dụng giai đoạn 2011 - 2015\nBan Chỉ đạo cơ khí trọng điểm\nLIÊN BỘ\nBAN CHỈ ĐẠO XỬ LÝ CÁC TỒN TẠI, YẾU KÉM CỦA MỘT SỐ DỰ ÁN VÀ DOANH NGHIỆP CHẬM\
    \ TIẾN ĐỘ, KÉM HIỆU QUẢ T\nBAN CHỈ ĐẠO QUỐC GIA VỀ PHÁT TRIỂN ĐIỆN LỰC\nBAN CHỈ ĐẠO TRUNG ƯƠNG CÁC CHƯƠNG TRÌNH MỤC TIÊU QUỐC GIA\nBỘ NÔNG NGHIỆP VÀ PHÁT TRIỂN NÔNG THÔN\nBỘ LAO ĐỘNG\nHỘI ĐỒNG BẦU CỬ\
    \ QUỐC GIA\nQUỐC HỘI KHÓA XIII ỦY BAN PHÁP LUẬT\nBAN CHỈ ĐẠO VỀ ĐẦU TƯ THEO HÌNH THỨC ĐỐI TÁC CÔNG TƯ\nBCH TRUNG ƯƠNG ĐOÀN TNCS HỒ CHÍ MINH\n                            Ngày ban hành\n             \
    \               Loại văn bản\n-- Tất cả các loại văn bản --\nKế hoạch thẩm định\nĐiều hành\nChưa được phân loại\nCông văn điều hành\nThông tư liên bộ\nSắt luật\nSắc lệnh\nSao y\nKết luận\nThư công\n\
    Phiếu báo\nPhiếu chuyển\nPhiếu gửi\nGiấy nghỉ phép\nGiấy giới thiệu\nGiấy mời\nGiấy ủy quyền\nBản thỏa thuận\nBản ghi nhớ\nHợp đồng\nTờ trình\nBiên bản\nDự án\nĐề án\nPhương án\nChương trình\nThông\
    \ cáo\nQuy định\nQuy chế\nBáo cáo\nNghị quyết liên tịch\nHiến pháp\nHướng dẫn\nCông điện\nĐính chính\nKế hoạch\nPháp lệnh\nLuật\nLệnh\nSao lục\nCông văn\nThông báo\nVăn bản hợp nhất\nNghị quyết\nThông\
    \ tư liên tịch\nChỉ thị\nThông tư\nQuyết định\nNghị định\n                            Người ký\n-- Tất cả người ký văn bản --\nNGUYỄN TẤN DŨNG\nTRẦN TUẤN ANH\nNGUYỄN VINH HIỂN\nVĂN TẤT THU\nNGUYỄN BẮC\
    \ SON\nNGUYỄN ĐỒNG TIẾN\nĐINH LA THĂNG\nPHẠM VŨ LUẬN\nBÙI VĂN GA\nNGUYỄN TRỌNG ĐÀM\nNGUYỄN HỮU CHÍ\nLÊ DƯƠNG QUANG\nBÙI BÁ BỔNG\nNGUYỄN CÔNG NGHIỆP\nTRƯƠNG TẤN SANG"
- id: art-3
  title: CHU NGỌC ANH
  text: "CHU NGỌC ANH\nNGUYỄN LINH NGỌC\nHÀ HÙNG CƯỜNG\nTRẦN VĂN TUẤN\nNGUYỄN THÀNH BIÊN\nĐINH TRUNG TỤNG\nNGUYỄN THIỆN NHÂN\nĐỖ HOÀNG ANH TUẤN\nLÊ MẠNH HÙNG\nDIỆP KỈNH TẦN\nTRẦN VĂN SƠN\nĐẠI TƯỚNG PHÙNG\
    \ QUANG THANH\nHỨA ĐỨC NHỊ\nTRẦN XUÂN HÀ\nNGUYỄN QUÂN\nĐÀM HỮU ĐẮC\nNGUYỄN SINH HÙNG\nTRẦN QUANG QUÝ\nLÊ ĐÌNH TIẾN\nNGUYỄN VĂN GIÀU\nNGUYỄN MINH TRIẾT\nĐÀO QUANG THU\nTRẦN THANH NAM\nSƠN PHƯỚC HOAN\n\
