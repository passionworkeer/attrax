    5 PARTIES THAT NEED TO APPLY FOR REGISTRATION

    Only one party involved in the supply chain of the controlled goods in Viet Nam

    needs to register the controlled goods with the Regulatory Authority. No party shall be

    allowed to advertise and/or supply the controlled goods unless they have been registered

    with the Regulatory Authority. The registration is non-transferable.

    Importer

    Importers who import controlled goods that are meant for Viet Nam are required to

    apply for registration with the Regulatory Authority. No registration is needed if the

    controlled goods are meant for export only. However, these ‘For Export Only’ controlled'
- id: art-3
