  text: 'goods shall not be advertised, supplied, displayed in any retail outlets and/or made available

    for sale in Viet Nam under any circumstances.

    Parallel Importer

    Any parallel importer of the same brand and model of controlled goods are also

    required to apply for registration.

    Retailer

    Retailers are only required to apply for registration if they import the controlled

    goods themselves.

    6

    Manufacturer

    Any local manufacturers in Viet Nam who supply the controlled goods to the

    domestic market are required to apply for registration of goods prior to sale.

    Distributor

    Since the Certificate of Conformity (CoC) is not transferable, when a company

    relegates its ownership of its registered controlled goods to another business entity, the

    latter has to re-register the controlled goods with the Regulatory Authority prior to sale on

    the domestic market.

