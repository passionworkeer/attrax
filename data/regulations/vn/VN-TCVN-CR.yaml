  text: 'designated third-party CAB maybe a local or foreign based under an appropriate mutual

    recognition agreement (MRA) and will be hereinafter referred as a Listed CAB (Appendix

    D & E).

    Controlled goods shall be certificated using system 5 in general including Factory

    Inspection, type testing of selected samples and frequent after-certification surveillance

    (not more than 12 months).

    The supplier can also apply for Certification by system 7 including testing,

    assessment for the lot.

    After the controlled goods have been successfully certified for conformity to

    Technical Regulation, the listed CAB shall issue Certificate of Conformity (CoC) with

    Certification Code and guidance for supplier to prepare CR Mark according to the most

    current specification. The suppliers can then affix the CR Mark (Appendix C) either on

    the registered controlled goods or their packaging.

    Then the suppliers submit complete technical file as specified in Chapter 10 and

    proceed registration of the controlled goods to Regulatory Authority before commencing

    supply to the market.

    The Certificate of Conformity (CoC) is valid for the lot submitted only if

    controlled products are certified according to system 7.

    The Certificate of Conformity is valid no more than three (3) years if controlled

    products are certified according to system 5.

    The certification code (XXXX-YY/ABC) is a unique number issued by the listed

    CAB which is traceable to the Suppliers and the registered controlled goods of

