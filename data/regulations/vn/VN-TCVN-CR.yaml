    7 REGULATORY AUTHORITY’S REQUIREMENTS

    The Regulatory Authority monitors the safety of the controlled goods sold in Viet

    Nam by investigating all complaints, incidents and accidents reported to the authority.

    Experiences gained are expected to be translated into the Regulatory Authority’s

    Requirements. These new requirements are to be fulfilled in addition to the applicable

    safety standards.

