  text: 'with the CR Mark. Registered controlled goods that have met the safety requirements

    specified by Technical Regulation are, in general, safe to accidental fire, electric shock,

    explosion, radiation and other hazards that could result in injuries or deaths to humans

    and/or damages to private properties.

    Suppliers

    Manufacturers, importers (including parallel importers), distributors and retailers

    who are involved in advertising and/or supplying the controlled goods must ensure that

    their obligations under the Safety Technical Regulation are fulfilled.

    This Information Booklet is to assist suppliers in understanding the requirements and

    procedures when they apply for registration of controlled goods.

