    1 PREFACE

    This information booklet serves as a guide to registration of controlled goods and

    other requirements related to the controlled goods registration scheme in Viet Nam.

    Directorate for Standards, Metrology and Quality reserves the right to amend and

    introduce new requirements to the aforementioned scheme without reference to the holder

    of this booklet and encourages feedback from readers to ensure that improvements to this

    booklet could be made from time to time.

    Our address is:

    Directorate for Standards, Metrology and Quality

    8 Hoang Quoc Viet, Ha Noi, Viet Nam

    Telephone: 84-4-37911630

    Facsimile: 84-4-37911595

    Email: htqt@tcvn.gov.vn

    Website: www.tcvn.gov.vn

    2 INTRODUCTION

    The objective of the Controlled Goods Registration Scheme is to protect consumers’

    interest by ensuring that household electrical and electronic products, designated as

    controlled goods, meet the Safety Technical Regulation. The regulation is equally applied

    to both domestic and imported products. At the time being, there are thirteen (13) categories

    of controlled goods in Viet Nam. The list of controlled goods and applicable safety

    standards are provided in Chapter 6 of this information booklet.

    Registration of controlled goods under the Safety Technical Regulation is based on

    Certificate of Conformity (CoC) issued by designated third-party Conformity Assessment

    Bodies (CABs). An overall view of the registration process is shown in Appendix B.

    We would like to draw your attention to Safety Technical Regulation, where it is

    stipulated that no person shall trade, supply or advertise for the purpose of supplying any

    of the controlled goods in Viet Nam after the specified dates, unless the controlled goods

    are registered and affixed with the Conformity Mark (CR Mark).

    4

    3 WHO SHOULD BE CONCERNED WITH THIS SCHEME

    Consumers

    To assure that consumers’ interest can be met, consumers are strongly advised to

    purchase controlled goods that are registered with the Regulatory Authority and affixed'
