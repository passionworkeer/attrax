    Appendix A

    TERMS AND DEFINITIONS

    For the purposes of this document, the following terms and definitions apply.

    1 CAB means Conformity Assessment Body that conducts Conformity assessment for

    Controlled Goods.

    2 CAB (Local) means CAB that is located in Viet Nam and is designated by

    Directorate for Standards, Metrology and Quality, the Designating Authority to issue CoC

    for products or controlled goods supplied in Vietnam.

    3 CAB (Foreign - MRA) means CAB that is located in the MRA partner country

    designated by the Designating Authority of the MRA partner country to issue CoC which

    is recognized and/or accepted by the Vietnamese Designating Authority.

    4 Listed CAB is CAB (Local) or CAB (Foreign - MRA)

    5 CoC means Certificate of Conformity issued by either CAB (Local) or CAB

    (Foreign- MRA).

    6 Controlled goods means any goods of a type, class or description specified in the

    Technical Regulation on EE products safety QCVN 4:2009/BKHCN.

    7 MRA means a Mutual Recognition Agreement or Arrangement between Viet Nam

    and any other country/territory.

    8 RTL means a Recognized Testing Laboratory.

    9 Registered controlled goods means any controlled goods registered with the

    Regulatory Authority.

    10 Regulator means Ministry of Science and Technology authorized by the

    Government to take full responsibility to manage quality of the specified group of goods

    and product and the Provincial Body authorized by local government for goods and

    products quality management within the city or province’s scope.

    11 Designating Authority means Directorate for Standards, Metrology and Quality

    authorized by the Regulator to manage Quality and Safety Assurance system to the

    controlled electrical and electronic products.

    12 Regulatory Authority means Provincial/Municipal Department for Standards,

    Metrology and Quality authorized by the Designating Authority to implement Quality and

    Safety Assurance system and regulations for electrical and electronic products.

    13 CR Mark means the Mark of conformity to Technical Regulation

    14 IEC means the International Electrotechnical Commission.

    15 TCVN means Vietnamese National Standard.

