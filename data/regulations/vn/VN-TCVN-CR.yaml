    supplementing and repealing certain regulations on investment and business conditions in

    sectors under management of ministry of science and technology and certain regulations

    on specialized inspections.

    9 MODIFICATIONS OF REGISTERED CONTROLLED GOODS

    Modification (including technical and non-technical changes) refers to any change

    made to the registered controlled goods. Non-technical changes are (i) colour change; (ii)

    change relating only to factory location but without change in the manufacturing process

    (including testing facilities) or a change of the manufacturer; and/or (iii) change in the year

    of production.

    The Suppliers may approach the Regulatory Authority to determine whether re-

    certification of the registered controlled goods is required as a result of modification.

    The Suppliers shall update their technical file on the registered controlled goods with

    details of the change.

    In a case where there is modification to the registered controlled goods, the following

    scenarios shall apply:

    10

    a) If the modification does not result in a change in the model number even though the

    change is a technical one:

    i) The controlled goods have to be re-registered with the Regulatory Authority.

    ii) The Supplier only needs to submit the modification to the certifying Listed

    CAB for updating related certification files and/or re-certification if necessary.'
- id: art-5
  title: The Supplier is to update the technical file with the test r
  text: 'The Supplier is to update the technical file with the test report and certification

    attesting that the modification still meets the safety standard requirements.

    b) If the modification does not result in a change in the model number and the change is a

    non technical one, which does not affect safety aspects of the controlled goods:

    i) The controlled goods have to be re-registered with the Regulatory Authority.

    ii) The controlled goods do not have to be re-certified.

    iii) The Supplier only needs to update the technical file with the modification,

    e.g. merely change(s) in the aesthetics that does (do) not affect the safety of the

    controlled goods.

    iv) The Supplier shall be responsible to ensure that the modification does not

    compromise the safety of the controlled goods.

    c) If the modification results in a change in the model number and the change is a technical

    one:

    i) The controlled goods have to be re-registered with the Regulatory Authority

    as per procedure indicated in Chapter 8.

    ii) The controlled goods have to be re-certified with the Listed CAB as per

    procedure indicated in Chapter 8.

    iii) A new CoC bearing a new certification code is required

    iv) The Supplier needs to create a new technical file.

    d) If the modification results in a change in the model number even though the change is a

    nontechnical one and does not affect the safety of the controlled goods:

    i) The controlled goods do not have to be re-certified but the change in model

    number of the certified controlled goods shall be updated to the listed CAB

    provided the original certification. The CAB shall have to revise the technical files

    to decide the appropriate action(s) regarding the certified goods under review

    including certification code issue.

    ii) The controlled goods have to be re-registered with the Authorized Local

    Quality Control Body.

    iii) The Supplier needs to update a technical file and submit to the listed CAB

    provided original certification for revision.

    11

    10 TECHNICAL FILE

    Every Supplier in Viet Nam is required to maintain technical files of all their

    registered controlled goods for at least ten (10) years from the date of issue of the CoC or

    the last renewed CoC. The requested contents of the technical files are specified in the table

    below.

    CAB is required to maintain certify file for at least six (6) years from the date of

    expiry date of the certificate.

    The maintenance of the technical files is necessary to enable the Regulatory

    Authority to carry out its investigation duties in the event of a complaint, incident or

    accident. Upon receiving request made by the Regulatory Authority, the Suppliers must

    provide the relevant technical files to the Regulatory Authority. In addition, the Suppliers

    shall be responsible for the regular updating of the technical files especially if there have

    been modifications made to the registered controlled goods. Supplementary testing and

    certification are required if there are modifications with safety implications.

