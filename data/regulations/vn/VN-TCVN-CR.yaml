    8 REGISTRATION PROCEDURE/AFFIXING THE QR MARK/ REGISTRATION

    OF SUPPLIERS

    Suppliers who wish to supply the controlled goods into Viet Nam’s market shall

    submit a set of specified technical file to the Regulatory Authority. The Regulatory

    Authority will proceed a documents review. If no evidence of compliance of goods with

    the Technical Regulation has been found, the Regulation Authority will request conformity

    assessment.

    The supplier shall submit them to designated third-party CAB for certification. The'
