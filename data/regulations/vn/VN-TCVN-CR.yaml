    type/model/lots under the particular certification. The connotation of the certification

    number is as following:

    XXXX = serial number (e.g. 1234)

    YY = the last 2 digits of year of certification (e.g. 01 for year 2001)

    ABC = CAB’s name (e.g. QUACERT)

    A flow-chart for registration of controlled goods is found in Appendix B.

    Suppliers who have test reports issued by testing laboratories of the listed CABs can

    apply test reports to the local listed CABs only for certification of their controlled goods.

    The local listed CABs shall certify the controlled goods without re-testing unless the test

    reports are found not to be in full compliance to the safety requirements specified in this

    booklet.

    The importer after receiving the certification of regulation must register at quality

