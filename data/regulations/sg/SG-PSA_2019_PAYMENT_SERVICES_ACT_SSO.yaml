    \ Legislation\nExit Search\nSearch Results\nPayment Services Act 2019\n2020 REVISED EDITION\nThis revised edition incorporates all amendments up to and including 1 December 2021 and comes into operation\
    \ on 31 December 2021\nAn Act to provide for the licensing and regulation of payment service providers, the oversight of payment systems, and connected matters and to make consequential and related\
    \ amendments to certain other Acts.\n[28 January 2020:  Except sections 111, 113 and 114   ;\n30 July 2020:  Section 114   ;\n31 May 2021:  Section 111   ]\nPART 1\nPRELIMINARY\nShort title and commencement\n\
    1.\n—(1)  This Act is the Payment Services Act 2019.\n(2)  Section 113 comes into operation on a date that the Minister appoints by notification in the \nGazette\n.\nInterpretation\n2.\n—(1)  In this\
    \ Act, unless the context otherwise requires —\n“5% controller”, in relation to a corporation (being a licensee or an operator of a designated payment system), means a person that alone or together\
    \ with the person’s associates —\n(\na\n)\nhas an interest in at least 5%, but less than 12%, of the shares in the corporation; or\n(\nb\n)\nis in a position to control at least 5%, but less than 12%,\
    \ of the votes in the corporation;\n“12% controller”, in relation to a corporation (being a licensee or an operator of a designated payment system), means a person that alone or together with the person’s\
    \ associates —\n(\na\n)\nhas an interest in at least 12%, but less than 20%, of the shares in the corporation; or\n(\nb\n)\nis in a position to control at least 12%, but less than 20%, of the votes\
    \ in the corporation;\n“20% controller”, in relation to a corporation (being a licensee or an operator of a designated payment system), means a person that alone or together with the person’s associates —\n\
    (\na\n)\nhas an interest in at least 20% of the shares in the corporation; or\n(\nb\n)\nis in a position to control at least 20% of the votes in the corporation;\n“access”, in relation to a payment\
    \ system, means an entitlement or eligibility to be a participant in the payment system;\n“access regime”, in relation to a payment system, means an access regime imposed by the Authority under section 51\
    \ and that is in force;\n“account issuance service” has the meaning given by Part 3 of the First Schedule;\n“arrangement” includes any formal or informal scheme, arrangement or understanding, and any\
    \ trust whether express or implied;\n“Authority” means the Monetary Authority of Singapore established under the Monetary Authority of Singapore Act 1970;\n“bank”, “bank in Singapore” and “banking business”\
    \ have the meanings given by section 2(1) of the Banking Act 1970;\n“book” includes any record, register, document or other record of information and any account or accounting record, however compiled,\
    \ recorded or stored, whether in written or printed form or on microfilm or by electronic process or otherwise;\n“calendar year” means a period from 1 January to 31 December (both dates inclusive);\n\
    “chief executive officer”, in relation to a corporation, means a person (however designated) who —\n(\na\n)\nis in the direct employment of, or acting for or by arrangement with, the corporation; and\n\
    (\nb\n)\nis principally responsible for the management and conduct of the business of the corporation;"
