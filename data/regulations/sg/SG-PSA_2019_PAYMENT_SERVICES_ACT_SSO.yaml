  title: a payment system operated by an exempt payment service provi
  text: "a payment system operated by an exempt payment service provider;\n(\nc\n)\na payment system operated by a person exempt under section 100 from having in force a licence;\n(\nd\n)\na designated\
    \ payment system;\n“settlement institution” means a person that provides facilities for —\n(\na\n)\nthe participants of a payment system to hold funds; and\n(\nb\n)\nthe settling of transactions between\
    \ the participants;\n“share” has the meaning given by section 4(1) of the Companies Act 1967 and includes an interest in a share;\n“Singapore operator” means an operator that is incorporated in Singapore;\n\
    “Singapore settlement institution” means a settlement institution that is incorporated in Singapore;\n“specified e‑money” means any e‑money that has been issued —\n(\na\n)\nto any person whom the issuer\
    \ of the e‑money has determined, according to such criteria as the Authority may specify by written notice, to be resident in Singapore; or\n(\nb\n)\nin Singapore to a person whom the issuer of the\
    \ e‑money has not determined, according to such criteria as the Authority may specify by written notice, to be resident outside Singapore;\n“standard payment institution” means a person that has in\
    \ force a standard payment institution licence granted under section 6;\n“treasury share” has the meaning given by section 4(1) of the Companies Act 1967;\n“unique identifier” means a combination of\
    \ letters, numbers or symbols used by a payment service user to identify unambiguously either or both of the following for the purposes of a payment transaction:\n(\na\n)\nany payment service user that\
