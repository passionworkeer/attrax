    1\nApr\n2022\n1\nOct\n2022\n5\nDec\n2025\nor find current version as at\nGo\nSearch within Legislation\nExit Search\nSearch Results\nPersonal Data Protection \nAct 2012\n2020 REVISED EDITION\nThis revised\
    \ edition incorporates all amendments up to and including 1 December 2021 and comes into operation on 31 December 2021\nAn Act to govern the collection, use and disclosure of personal data by organisations,\
    \ and to establish the Do Not Call Register and to provide for its administration, and for matters connected therewith.\n[22/2016]\n[2 January 2013:  Parts I, II, VIII, IX (except sections 36 to 38,\
    \ 41 and 43 to 48) and X (except section 67(1)), and the First, Seventh and Ninth Schedules ;\n2 December 2013:  Sections 36, 37, 38 and 41 ;\n2 January 2014:  Sections 43 to 48 and 67(1) and the Eighth Schedule\
    \ ;\n2 July 2014:  Parts III to VII, and the Second to Sixth Schedules ]\nPART 1\nPRELIMINARY\nShort title\n1.\n  This Act is the Personal Data Protection Act 2012.\nInterpretation\n2.\n—(1)  In this\
    \ Act, unless the context otherwise requires —\n“advisory committee” means an advisory committee appointed under section 7;\n“Appeal Committee” means a Data Protection Appeal Committee constituted under\
    \ section 48P(4), read with the Seventh Schedule;\n“Appeal Panel” means the Data Protection Appeal Panel established by section 48P(1);\n“authorised officer”, in relation to the exercise of any power\
    \ or performance of any function or duty under any provision of this Act, means a person to whom the exercise of that power or performance of that function or duty under that provision has been delegated\
    \ under section 38 of the Info‑communications Media Development Authority Act 2016;\n“Authority” means the Info‑communications Media Development Authority established by section 3 of the Info‑communications\
    \ Media Development Authority Act 2016;\n“benefit plan” means an insurance policy, a pension plan, an annuity, a provident fund plan or other similar plan;\n“business” includes the activity of any organisation,\
    \ whether or not carried on for purposes of gain, or conducted on a regular, repetitive or continuous basis, but does not include an individual acting in his or her personal or domestic capacity;\n\
    “business contact information” means an individual’s name, position name or title, business telephone number, business address, business electronic mail address or business fax number and any other\
    \ similar information about the individual, not provided by the individual solely for his or her personal purposes;"
