  text: "formed or recognised under the law of Singapore; or\n(\nb\n)\nresident, or having an office or a place of business, in Singapore;\n“personal data” means data, whether true or not, about an individual\
    \ who can be identified —\n(\na\n)\nfrom that data; or\n(\nb\n)\nfrom that data and other information to which the organisation has or is likely to have access;\n“prescribed healthcare body” means a\
    \ healthcare body prescribed for the purposes of the Second Schedule by the Minister charged with the responsibility for health;\n“prescribed law enforcement agency” means an authority charged with\
    \ the duty of investigating offences or charging offenders under written law, prescribed for the purposes of sections 21(4) and 26D(6) and the Second Schedule by the Minister charged with the responsibility\
    \ for that authority;\n“private trust” means a trust for the benefit of one or more designated individuals who are the settlor’s friends or family members;\n“proceedings” means any civil, criminal or\
    \ administrative proceedings by or before a court, tribunal or regulatory authority that is related to the allegation of —\n(\na\n)\na breach of an agreement;\n(\nb\n)\na contravention of any written\
    \ law or any rule of professional conduct or other requirement imposed by any regulatory authority in exercise of its powers under any written law; or\n(\nc\n)\na wrong or a breach of a duty for which\
    \ a remedy is claimed under any law;\n“processing”, in relation to personal data, means the carrying out of any operation or set of operations in relation to the personal data, and includes any of the\
    \ following:\n(\na\n)\nrecording;\n(\nb\n)\nholding;\n(\nc\n)\norganisation, adaptation or alteration;\n(\nd\n)\nretrieval;\n(\ne\n)\ncombination;\n(\nf\n)\ntransmission;\n(\ng\n)\nerasure or destruction;\n\
    “public agency” includes —\n(\na\n)\nthe Government, including any ministry, department, agency, or organ of State;\n(\nb\n)\nany tribunal appointed under any written law; or\n(\nc\n)\nany statutory\
    \ body specified under subsection (2);\n“publicly available”, in relation to personal data about an individual, means personal data that is generally available to the public, and includes personal data\
    \ which can be observed by reasonably expected means at a location or an event —\n(\na\n)\nat which the individual appears; and\n(\nb\n)\nthat is open to the public;\n“relevant body” means the Commission,\
    \ the Appeal Panel or any Appeal Committee;\n“tribunal” includes a judicial or quasi‑judicial body or a disciplinary, an arbitral or a mediatory body;\n“user activity data”, in relation to an organisation,\
    \ means personal data about an individual that is created in the course or as a result of the individual’s use of any product or service provided by the organisation;\n“user‑provided data”, in relation\
    \ to an organisation, means personal data provided by an individual to the organisation.\n[22/2016; 40/2020]\n(2)  The Minister may, by notification in the \nGazette\n, specify any statutory body established\
    \ under a public Act for a public function to be a public agency for the purposes of this Act.\nPurpose\n3.\n  The purpose of this Act is to govern the collection, use and disclosure of personal data\
    \ by organisations in a manner that recognises both the right of individuals to protect their personal data and the need of organisations to collect, use or disclose personal data for purposes that\
    \ a reasonable person would consider appropriate in the circumstances.\nApplication of Act\n4.\n—(1)  Parts 3, 4, 5, 6, 6A and 6B do not impose any obligation on —\n(\na\n)\nany individual acting in\
    \ a personal or domestic capacity;\n(\nb\n)\nany employee acting in the course of his or her employment with an organisation;\n(\nc\n)\nany public agency; or\n(\nd\n)\nany other organisations or personal\
    \ data, or classes of organisations or personal data, prescribed for the purposes of this provision.\n[40/2020]\n(2)  Parts 3, 4, 5, 6 (except sections 24 and 25), 6A (except sections 26C(3)(\na"
- id: art-6
  title: ) and 26E) and 6B do not impose any obligation on a data int
  text: ") and 26E) and 6B do not impose any obligation on a data intermediary in respect of its processing of personal data on behalf of and for the purposes of another organisation pursuant to a contract\
    \ which is evidenced or made in writing.\n[40/2020]\n(3)  An organisation has the same obligation under this Act in respect of personal data processed on its behalf and for its purposes by a data intermediary\
    \ as if the personal data were processed by the organisation itself.\n(4)  This Act does not apply in respect of —\n(\na\n)\npersonal data about an individual that is contained in a record that has\
    \ been in existence for at least 100 years; or\n(\nb\n)\npersonal data about a deceased individual, except that the provisions relating to the disclosure of personal data and section 24 (protection\
    \ of personal data) apply in respect of personal data about an individual who has been dead for 10 years or less.\n(5)  Except where business contact information is expressly mentioned, Parts 3, 4,\
    \ 5, 6 and 6A do not apply to business contact information.\n[40/2020]\n(6)  Unless otherwise expressly provided in this Act —\n(\na\n)\nnothing in Parts 3, 4, 5, 6, 6A and 6B affects any authority,\
    \ right, privilege or immunity conferred, or obligation or limitation imposed, by or under the law, including legal privilege, except that the performance of a contractual obligation is not an excuse\
    \ for contravening this Act; and\n(\nb\n)\nthe provisions of other written law prevail to the extent that any provision of Parts 3, 4, 5, 6, 6A and 6B is inconsistent with the provisions of that other\
    \ written law.\n[40/2020]\n                        Singapore Statutes Online\nFAQs\nFeedback\nSitemap\n\t\t\tReport Vulnerability\n\t\t\tPrivacy Statement\n\t\t\tTerms of Use\n                     \
