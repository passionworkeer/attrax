  title: “Chief Executive”, in relation to the Authority, means the C
  text: '“Chief Executive”, in relation to the Authority, means the Chief Executive of the Authority appointed under section 40(2) of the Info‑communications Media Development Authority Act 2016, and includes
    any individual acting in that capacity;

    “Commission” means the person designated as the Personal Data Protection Commission under section 5 to be responsible for the administration of this Act;

    “Commissioner” means the Commissioner for Personal Data Protection appointed under section 8(1)(

    a

    ), and includes any Deputy Commissioner for Personal Data Protection or Assistant Commissioner for Personal Data Protection appointed under section 8(1)(

    b

    );

    “credit bureau” means an organisation which —

    (

    a

    )

    provides credit reports for gain or profit; or

    (

    b

    )

    provides credit reports on a routine, non‑profit basis as an ancillary part of a business carried on for gain or profit;

    “credit report” means a communication, whether in written, oral or other form, provided to an organisation to assess the creditworthiness of an individual in relation to a transaction between the organisation
    and the individual;

    “data intermediary” means an organisation which processes personal data on behalf of another organisation but does not include an employee of that other organisation;

    “derived personal data”  —

    (

    a

    )

    means personal data about an individual that is derived by an organisation in the course of business from other personal data, about the individual or another individual, in the possession or under
    the control of the organisation; but

    (

    b

    )

    does not include personal data derived by the organisation using any prescribed means or method;

    “document” includes information recorded in any form;

    “domestic” means related to home or family;

    “education institution” means an organisation that provides education, including instruction, training or teaching, whether by itself or in association or collaboration with, or by affiliation with,
    any other person;

    “employee” includes a volunteer;

    “employment” includes working under an unpaid volunteer work relationship;

    “evaluative purpose” means —

    (

    a

    )

    the purpose of determining the suitability, eligibility or qualifications of the individual to whom the data relates —

    (i)

    for employment or for appointment to office;

    (ii)

    for promotion in employment or office or for continuance in employment or office;

    (iii)

    for removal from employment or office;

    (iv)

    for admission to an education institution;

    (v)

    for the awarding of contracts, awards, bursaries, scholarships, honours or other similar benefits;

    (vi)

    for selection for an athletic or artistic purpose; or

    (vii)

    for grant of financial or social assistance, or the delivery of appropriate health services, under any scheme administered by a public agency;

    (

    b

    )

    the purpose of determining whether any contract, award, bursary, scholarship, honour or other similar benefit should be continued, modified or cancelled;

    (

    c

    )

    the purpose of deciding whether to insure any individual or property or to continue or renew the insurance of any individual or property; or

    (

    d

    )

    such other similar purposes as the Minister may prescribe;

    “individual” means a natural person, whether living or deceased;

    “inspector” means an individual appointed as an inspector under section 8(1)(

    b

    );

    “investigation” means an investigation relating to —

    (

    a

    )

    a breach of an agreement;

    (

    b

    )

    a contravention of any written law, or any rule of professional conduct or other requirement imposed by any regulatory authority in exercise of its powers under any written law; or

    (

    c

    )

    a circumstance or conduct that may result in a remedy or relief being available under any law;

    “national interest” includes national defence, national security, public security, the maintenance of essential services and the conduct of international affairs;

    “organisation” includes any individual, company, association or body of persons, corporate or unincorporated, whether or not —

    (

    a

