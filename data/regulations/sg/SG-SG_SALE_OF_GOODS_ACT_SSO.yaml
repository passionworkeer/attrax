    \ Search\nSearch Results\nSale of Goods Act 1979\n2020 REVISED EDITION\nThis revised edition incorporates all amendments up to and including 1 December 2021 and comes into operation on 31 December 2021\n\
    An Act to consolidate the law relating to the sale of goods.\n[12 November 1993]\nPART 1\nCONTRACTS TO WHICH ACT APPLIES\nContracts to which Act applies\n1.\n—(1)  This Act applies to contracts of sale\
    \ of goods made on or after (but not to those made before) 1 January 1894.\n(2)  In relation to contracts made on certain dates, this Act applies subject to the modification of certain of its sections\
    \ as mentioned in the Schedule.\n(3)  Any such modification is indicated in the section concerned by a reference to the Schedule.\n(4)  Accordingly, where a section does not contain such a reference,\
    \ this Act applies in relation to the contract concerned without such modification of the section.\n                        Singapore Statutes Online\nFAQs\nFeedback\nSitemap\n\t\t\tReport Vulnerability\n\
