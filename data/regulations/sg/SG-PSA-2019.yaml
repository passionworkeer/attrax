    \        Published in Acts Supplement on 20 Feb 2019\nLoading...\nSearch within Legislation\nExit Search\nSearch Results\nREPUBLIC OF SINGAPORE\nGOVERNMENT GAZETTE\nACTS SUPPLEMENT\nPublished by Authority\n\
    NO. 7]\nFriday, February\n22\n[2019\nThe following Act was passed by Parliament on 14 January 2019 and assented to by the President on 11 February 2019:—\nPayment Services Act 2019\n(No. 2 of 2019)\n\
    I assent.\nHALIMAH YACOB,\nPresident.\n 11 February 2019.\nDate of Commencement: 28 January 2020 Parts 1 to 8, sections 109, 110, 112, 115 to 120, Part 10, the First and Second Schedules  \nDate of\
    \ Commencement: 30 July 2020 Section 114  \nDate of Commencement: 31 May 2021 Section 111  \nDate of Commencement: 30 June 2022 Section 113 \nAn Act to provide for the licensing and regulation of payment\
    \ service providers, the oversight of payment systems, and connected matters, to repeal the Money‑changing and Remittance Businesses Act (Chapter 187 of the 2008 Revised Edition) and the Payment Systems\
    \ (Oversight) Act (Chapter 222A of the 2007 Revised Edition), and to make consequential and related amendments to certain other Acts.\nBe it enacted by the President with the advice and consent of the\
    \ Parliament of Singapore, as follows:          \nPART 1\nPRELIMINARY\nShort title and commencement\n1.\n  This Act is the Payment Services Act 2019 and comes into operation on a date that the Minister\
    \ appoints by notification in the \nGazette\n.\nInterpretation\n2.\n—(1)  In this Act, unless the context otherwise requires —\n“5% controller”, in relation to a corporation (being a licensee or an\
    \ operator of a designated payment system), means a person that alone or together with the person’s associates —\n(\na\n)\nhas an interest in at least 5%, but less than 12%, of the shares in the corporation;\
    \ or\n(\nb\n)\nis in a position to control at least 5%, but less than 12%, of the votes in the corporation;\n“12% controller”, in relation to a corporation (being a licensee or an operator of a designated\
    \ payment system), means a person that alone or together with the person’s associates —\n(\na\n)\nhas an interest in at least 12%, but less than 20%, of the shares in the corporation; or\n(\nb\n)\n\
    is in a position to control at least 12%, but less than 20%, of the votes in the corporation;\n“20% controller”, in relation to a corporation (being a licensee or an operator of a designated payment\
    \ system), means a person that alone or together with the person’s associates —\n(\na\n)\nhas an interest in at least 20% of the shares in the corporation; or\n(\nb\n)\nis in a position to control at\
    \ least 20% of the votes in the corporation;\n“access”, in relation to a payment system, means an entitlement or eligibility to be a participant in the payment system;\n“access regime”, in relation\
    \ to a payment system, means an access regime imposed by the Authority under section 51 and that is in force;\n“account issuance service” has the meaning given by Part 3 of the First Schedule;\n“arrangement”\
    \ includes any formal or informal scheme, arrangement or understanding, and any trust whether express or implied;\n“Authority” means the Monetary Authority of Singapore established under the Monetary\
    \ Authority of Singapore Act (Cap. 186);\n“bank”, “bank in Singapore” and “banking business” have the meanings given by section 2(1) of the Banking Act (Cap. 19);\n“book” includes any record, register,\
    \ document or other record of information and any account or accounting record, however compiled, recorded or stored, whether in written or printed form or on microfilm or by electronic process or otherwise;\n\
    “calendar year” means a period from 1 January to 31 December (both dates inclusive);\n“chief executive officer”, in relation to a corporation, means a person (however designated) who —\n(\na\n)"
