  text: '“Guidelines on Fit and Proper Criteria” means the document (as revised from time to time) that is called by that title, issued by the Authority and published on the Authority’s website;

    “indirect controller”, in relation to a corporation (being a licensee or an operator of a designated payment system) —

    (

    a

    )

    means any person, whether acting alone or together with any other person, and whether with or without holding shares or controlling voting power in the corporation —

    (i)

    in accordance with whose directions, instructions or wishes the directors of the corporation are accustomed or under an obligation, whether formal or informal, to act; or

    (ii)

    that is in a position to determine the policy of the corporation; but

    (

    b

    )

    excludes any person —

    (i)

    who is a director or other officer of the corporation and whose appointment has been approved by the Authority; or

    (ii)

    in accordance with whose directions, instructions or wishes the directors of the corporation are accustomed to act by reason only that they act on advice given by the person in the person’s professional
    capacity;

    “licence” means a licence granted under section 6;

    “licensee” means a payment service provider the licence of which is in force;

    “limited liability partnership” has the meaning given by section 4(1) of the Limited Liability Partnerships Act (Cap. 163A);

    “major payment institution” means a person that has in force a major payment institution licence granted under section 6;

    “merchant” means a person (other than an individual who is not required to be registered under the Business Names Registration Act 2014 (Act 29 of 2014)) who, in the course of the person’s business —

    (

    a

    )

    provides goods or services;

    (

    b

    )

    promotes the use or purchase of goods or services; or

    (

    c

    )

    receives, or is entitled to receive, any money or other consideration for providing goods or services,

    and includes any employee or agent of the person;

    “merchant acquisition service” has the meaning given by Part 3 of the First Schedule;

    “money” includes e‑money but excludes any digital payment token and any excluded digital representation of value;

    “money-changing service” has the meaning given by Part 3 of the First Schedule;

    “operator”, in relation to a payment system, means a person that operates the payment system;

    “participant”, in relation to a payment system, means any person that is recognised in the rules of the payment system, or is otherwise recognised by the operator or settlement institution of the payment
    system, as being eligible to settle payments through the payment system with other persons that are similarly recognised, or to process payments through the payment system;

    “partner”, in relation to a limited liability partnership, has the meaning given by section 2(1) of the Limited Liability Partnerships Act;

    “payee” means a person that is the intended recipient of money that is the subject of a payment transaction;

    “payer” means a person that initiates, or consents to the initiation of, a payment order for the transfer of money;

    “payment account”  —

    (

    a

    )

    means any account, or any device or facility (whether in physical or electronic form), that —

    (i)

    is held in the name, or associated with the unique identifier, of any person, and is used by that person for the initiation of a payment order or the execution of a payment transaction, or both; or

    (ii)

    is held in the names, or associated with the unique identifiers, of 2 or more persons, and is used by any of those persons for the initiation of a payment order or the execution of a payment transaction,
    or both; and

    (

    b

    )

    includes a bank account, debit card, credit card or charge card;

    “payment order” means an instruction to a payment service provider requesting for the execution of a payment transaction;

    “payment service” means any service that is specified in Part 1 of the First Schedule, but excludes any service that is specified in Part 2 of that Schedule;'
- id: art-6
  title: '“payment service provider” means any person that provides a '
  text: '“payment service provider” means any person that provides a payment service;

    “payment service user” means any person that uses a payment service in the capacity of a payer or a payee, or of both;

    “payment system” means a funds transfer system or other system that facilitates the circulation of money, and includes any instruments and procedures that relate to the system;

    “payment transaction” means the placing, transfer or withdrawal of money, whether for the purpose of paying for goods or services or for any other purpose, and regardless of whether the intended recipient
    of the money is entitled to the money;

    “permanent place of business”, in relation to a licensee, or an operator or a settlement institution of a designated payment system, means each fixed location in Singapore used by the licensee, operator
    or settlement institution for carrying on its business, regardless whether the business is carried on within a single building or at a single business address;

    “place of business”, in relation to a licensee, or an operator or a settlement institution of a designated payment system, means any location (including a kiosk that can be moved from one location to
    another) in Singapore used by the licensee, operator or settlement institution for carrying on its business;

    “public authority” means —

    (

    a

    )

    the Government, including any ministry, department or agency of the Government, or an Organ of State; or

    (

    b

    )

    any body established or constituted by or under a public Act to perform or discharge any public function;

    “registered office” means a registered office maintained under section 142(1) or 370(1) of the Companies Act;

    “regulated financial institution” means a person that carries on a business, the conduct of which is regulated or authorised by the Authority or, if it is carried on in Singapore, would be regulated
    or authorised by the Authority;

    “relevant payment system” means any of the following payment systems:

    (

    a

    )

    a payment system operated by a major payment institution;

    (

    b

    )

    a payment system operated by an exempt payment service provider;

    (

    c

    )

    a payment system operated by a person exempt under section 100 from having in force a licence;

    (

    d

    )

    a designated payment system;

    “settlement institution” means a person that provides facilities for —

    (

    a

    )

    the participants of a payment system to hold funds; and

    (

    b

    )

    the settling of transactions between the participants;

    “share” has the meaning given by section 4(1) of the Companies Act and includes an interest in a share;

    “Singapore operator” means an operator that is incorporated in Singapore;

    “Singapore settlement institution” means a settlement institution that is incorporated in Singapore;

    “specified e‑money” means any e‑money that has been issued —

    (

    a

    )

    to any person whom the issuer of the e‑money has determined, according to such criteria as the Authority may specify by notice in writing, to be resident in Singapore; or

    (

    b

    )

    in Singapore to a person whom the issuer of the e‑money has not determined, according to such criteria as the Authority may specify by notice in writing, to be resident outside Singapore;

    “standard payment institution” means a person that has in force a standard payment institution licence granted under section 6;

    “treasury share” has the meaning given by section 4(1) of the Companies Act;

    “unique identifier” means a combination of letters, numbers or symbols used by a payment service user to identify unambiguously either or both of the following for the purposes of a payment transaction:

    (

    a

    )

    any payment service user that is a party to the payment transaction;

    (

    b

    )

    any payment account;

    “voting share” has the meaning given by section 4(1) of the Companies Act.

    (2)  In this Act, unless the context otherwise requires —

    (

    a

    )

    a person has an interest in a share if —

    (i)

    the person has or is treated as having an interest in that share under section 7(1A), (1B), (2), (6) and (7) to (10) of the Companies Act; or

    (ii)'
- id: art-7
  title: the person has any legal or equitable interest in that share
  text: "the person has any legal or equitable interest in that share, except an interest that is to be disregarded under section 7(9) of the Companies Act;\n(\nb\n)\na reference to the control of a percentage\
    \ of the votes in a corporation (being a licensee or an operator of a designated payment system) is a reference to the control, whether direct or indirect, of that percentage of the total number of\
    \ votes that might be cast in a general meeting of the corporation;\n(\nc\n)\na person (\nA\n) is an associate of another person (\nB\n) if —\n(i)\nA\n is the spouse, a parent, remoter lineal ancestor\
    \ or step‑parent, a son, daughter, remoter issue, stepson or stepdaughter, or a brother or sister, of \nB\n;\n(ii)\nA\n is a body corporate that is, or a majority of the directors of which are, accustomed\
    \ or under an obligation, whether formal or informal, to act in accordance with the directions, instructions or wishes of \nB\n;\n(iii)\nA\n is a person that is accustomed or under an obligation, whether\
    \ formal or informal, to act in accordance with the directions, instructions or wishes of \nB\n;\n(iv)\nA\n is a subsidiary of \nB\n;\n(v)\nA\n is a body corporate in which \nB\n, whether alone or together\
    \ with other associates of \nB\n as described in sub‑paragraphs (ii), (iii) and (iv), is in a position to control 20% or more of the votes in \nA\n; or\n(vi)\nA\n is a person with whom \nB\n has an\
    \ agreement or arrangement (whether oral or in writing and whether express or implied) to act together with respect to the acquisition, holding or disposal of shares or other interests in, or with respect\
    \ to the exercise of their votes in relation to, the corporation (being a licensee or an operator of a designated payment system) mentioned in the definition of “5% controller”, “12% controller” or\
    \ “20% controller”;\n(\nd\n)\na person has a substantial shareholding in a corporation if —\n(i)\nthe person has an interest in one or more voting shares (excluding treasury shares) in the corporation;\
    \ and\n(ii)\nthe total votes attached to that share, or those shares, is at least 5% of the total votes attached to all the voting shares (excluding treasury shares) in the corporation; and\n(\ne\n\
    )\na person has a substantial shareholding in a corporation, the share capital of which is divided into 2 or more classes of shares, if —\n(i)\nthe person has an interest in one or more voting shares\
    \ (excluding treasury shares) included in one of those classes; and\n(ii)\nthe total votes attached to that share, or those shares, is at least 5% of the total votes attached to all the voting shares\
    \ (excluding treasury shares) included in that class.\n(3)  In any case where the functions of the operator or settlement institution of a payment system are assumed by or shared among 2 or more operators\
    \ or settlement institutions, a reference in this Act to the operator or settlement institution is a reference to each such operator or settlement institution.\n(4)  For the purposes of sections 5(2)\
    \ and 13(13) and paragraph 2(\ni\n) of the First Schedule, a payment service, or the provision of a payment service, is incidental to any other business carried on by a person, if the payment service —\n\
    (\na\n)\nis carried on, offered or provided by that person to support that other business; and\n(\nb\n)\nis provided by that person in connection with the carrying on of that other business.\nApplication\
    \ of Act\n3.\n—(1)  Subject to subsection (2), this Act does not apply to any public authority.\n(2)  The Minister may by order declare that a public authority is one to which this Act applies.\nAppointment\
    \ of assistants\n4.\n—(1)  Subject to subsection (2), the Authority may appoint any person to exercise any of its powers or perform any of its functions or duties under this Act, either generally or\
    \ in any particular case, except —\n(\na\n)\nthe power of appointment conferred by this subsection; and\n(\nb\n)\nthe power to make subsidiary legislation.\n(2)  The Authority may, by notification in\
    \ the \nGazette"
