- id: art-3
  title: Interpretation
  text: 'Interpretation

    2.

    —(1)  In this Act, unless the context otherwise requires —

    “chief executive” means the chief executive of the Commission and includes any person acting in that capacity;

    “Commission” means the Competition and Consumer Commission of Singapore established by section 3 of the Competition Act 2004;

    “consumer” means an individual who, otherwise than exclusively in the course of business —

    (

    a

    )

    receives or has the right to receive goods or services from a supplier; or

    (

    b

    )

    has a legal obligation to pay a supplier for goods or services that have been or are to be supplied to another individual;

    “consumer transaction” means —

    (

    a

    )

    the supply of goods or services by a supplier to a consumer as a result of a purchase, lease, gift, contest or other arrangement; or

    (

    b

    )

    an agreement between a supplier and a consumer, as a result of a purchase, lease, gift, contest or other arrangement, in which the supplier is to supply goods or services to the consumer or to another
    consumer specified in the agreement,

    but does not include any transaction specified in the First Schedule;

    “financial product” includes any arrangement, transaction or contract regulated, or supplied by any person regulated, under —

    (

    a

    )

    any written law administered by the Monetary Authority of Singapore;

    (

    b

    )

    the Commodity Trading Act 1992; or

    (

    c

    )

    any other written law that the Minister may by order prescribe;

    “financial services” includes any services regulated, or supplied by any person regulated, under —

    (

    a

    )

    any written law administered by the Monetary Authority of Singapore;

    (

    b

    )

    the Commodity Trading Act 1992; or

    (

    c

    )

    any other written law that the Minister may by order prescribe;

    “flat” means a horizontal stratum of any building or part thereof, whether the stratum or part is on one or more levels or is partially or wholly below the surface of the ground;

    “goods” means —

    (

    a

    )

    any personal property, whether tangible or intangible, and includes —

    (i)

    chattels that are attached or intended to be attached to real property on or after delivery; and

    (ii)

    financial products and credit, including credit extended solely on the security of land;

    (

    b

    )

    any residential property; or

    (

    c

    )

    a voucher;

    “hire-purchase agreement” has the meaning given by the Hire‑Purchase Act 1969;

    “material fact” means any information that a supplier knows or ought reasonably to know would affect the decision of a consumer to enter into a consumer transaction;

    “motor vehicle” has the meaning given by section 2 of the Road Traffic Act 1961;

    “motor vehicle dealer” means a supplier of motor vehicles;

    “motor vehicle sale contract” means a contract between a consumer and a motor vehicle dealer for the sale of a motor vehicle to the consumer;

    “residential property” means any house, flat or other premises which is permitted to be used pursuant to any written law as a dwelling house and any such house, flat or other premises which is in the
    course of being constructed;

    “services” includes —

    (

    a

    )

    a service offered or provided that involves the addition to or maintenance, repair or alteration of goods or any residential property;

    (

    b

    )

    a membership in any club or organisation if the club or organisation is a business formed to make a profit for its owners;

    (

    c

    )

    the right to use time share accommodation under a time share contract; and

    (

    d

    )

    financial services;

    “Small Claims Tribunal” means a Small Claims Tribunal constituted under section 4 of the State Courts Act 1970;

    “specified body” means any person or body appointed under section 8(10);

    “specified dispute resolution scheme” means, in respect of disputes arising in relation to any consumer transaction, any dispute resolution scheme specified for the purposes of section 7(11) by regulations
    made under section 43(2)(

    k

    ) in respect of disputes arising in relation to a class of consumer transactions to which that consumer transaction belongs;

    “supplier” means a person who, in the course of the person’s business —

    (

    a

