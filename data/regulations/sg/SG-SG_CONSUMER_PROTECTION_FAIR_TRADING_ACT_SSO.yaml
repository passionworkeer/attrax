- id: art-4
  title: provides goods or services to consumers;
  text: "provides goods or services to consumers;\n(\nb\n)\nmanufactures, assembles or produces goods;\n(\nc\n)\npromotes the use or purchase of goods or services; or\n(\nd\n)\nreceives or is entitled to\
    \ receive money or other consideration as a result of the provision of goods or services to consumers,\nand includes any employee or agent of the person, and the word “supply”, with its grammatical\
    \ variations and cognate expressions, has corresponding meanings;\n“time share accommodation” means any living accommodation, in Singapore or elsewhere, used or intended to be used (wholly or partly)\
    \ for leisure purposes by a class of persons all of whom have rights to use, or participate in arrangements under which they may use, that accommodation or accommodation within a pool of accommodation\
    \ to which that accommodation belongs;\n“time share contract” means a contract which confers or purports to confer on an individual time share rights that are exercisable during a period of not less\
    \ than 3 years;\n“time share related contract” means a contract to assist a consumer to dispose of the consumer’s time share rights conferred under a time share contract;\n“time share rights” means\
    \ rights to use time share accommodation for a specified or ascertainable period, but does not include rights under a contract of employment or an insurance policy;\n“unfair practice” means an unfair\
    \ practice within the meaning of section 4;\n“voucher” means any document that purports to give the holder of the document the right to obtain goods or a service or the right to obtain goods or a service\
    \ at a discounted or reduced price.\n[5/2014; 25/2016; 10/2018]\n(2)  An individual who holds himself or herself out as acting exclusively in the course of business is treated as acting exclusively\
    \ in the course of business for the purpose of the definition of “consumer” in subsection (1).\n(3)  For the purposes of the definitions of “financial product” and “financial services” in subsection (1),\
    \ a reference to a person regulated under a written law includes a person exempted from being licensed, approved or regulated under that written law.\n                        Singapore Statutes Online\n\
