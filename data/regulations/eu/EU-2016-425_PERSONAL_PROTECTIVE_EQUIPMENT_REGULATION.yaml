    Official Journal of'
  text: 'L_2016081EN.01005101.xml


    31.3.2016


    EN


    Official Journal of the European Union


    L 81/51


    REGULATION (EU) 2016/425 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 9 March 2016



    on personal protective equipment and repealing Council Directive 89/686/EEC


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 114 thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    Council Directive 89/686/EEC

    (

    3

    )

    was adopted in the context of establishing the internal market, in order to harmonise health and safety requirements for personal protective equipment (PPE) in all Member States and to remove obstacles
    to trade in PPE between Member States.


    (2)


    Directive 89/686/EEC is based on the ‘new approach’ principles, as set out in the Council Resolution of 7 May 1985 on a new approach to technical harmonisation and standards

    (

    4

    )

    . Thus, it sets only the essential requirements applying to PPE, whereas technical details are adopted by the European Committee for Standardisation (CEN) and the European Committee for Electrotechnical
    Standardisation (Cenelec) in accordance with Regulation (EU) No 1025/2012 of the European Parliament and of the Council

    (

    5

    )

    . Conformity with the harmonised standards so set, the reference numbers of which are published in the

    Official Journal of the European Union

    , provides a presumption of conformity with the requirements of Directive 89/686/EEC. Experience has shown that those basic principles have worked well in that sector and should be maintained and even
    further promoted.


    (3)


    Experience with the application of Directive 89/686/EEC has shown inadequacies and inconsistencies in the product coverage and conformity assessment procedures. In order to take account of that experience
    and to provide clarification in relation to the framework within which products covered by this Regulation may be made available on the market, certain aspects of Directive 89/686/EEC should be revised
    and enhanced.


    (4)


    Since the scope, the essential health and safety requirements and conformity assessment procedures have to be identical in all the Member States there is almost no flexibility in transposing a directive
    based on the new approach principles into national law. Directive 89/686/EEC should therefore be replaced by a regulation, which is the appropriate legal instrument for imposing clear and detailed rules
    which do not give room for divergent transposition by Member States.


    (5)


    Regulation (EC) No 765/2008 of the European Parliament and of the Council

    (

    6

    )

    lays down rules on the accreditation of conformity assessment bodies, provides a framework for the market surveillance of products and for controls on products from third countries, and lays down the
    general principles of the CE marking.


    (6)


    Decision No 768/2008/EC of the European Parliament and of the Council

    (

    7

    )

    lays down common principles and reference provisions intended to apply across sectoral legislation. In order to ensure consistency with other sectoral product legislation, it is appropriate to align
    certain provisions of this Regulation to that Decision, in so far as sectoral specificities do not require a different solution. Therefore, certain definitions, the general obligations of economic operators,
    the presumption of conformity, EU declaration of conformity, rules on CE marking, requirements for conformity assessment bodies and notification procedures, the conformity assessment procedures and
    the provisions concerning procedures to deal with PPE presenting a risk should be adapted to that Decision.


    (7)


    Regulation (EU) No 1025/2012 provides for a procedure for objections to harmonised standards where those standards do not entirely satisfy the requirements of this Regulation.


    (8)


    This Regulation covers PPE which is new to the Union market when it is placed on the market; that is to say it is either new PPE made by a manufacturer established in the Union or PPE, whether new or
    second-hand, imported from a third country.


    (9)


    This Regulation should apply to all forms of supply, including distance selling.


    (10)


    Some products on the market that provide a protective function to the user are excluded from the scope of Directive 89/686/EEC. In order to ensure as high a level of protection for the user of those
    products as for the user of PPE covered by Directive 89/686/EEC, the scope of this Regulation should include PPE for private use against heat, in line with similar PPE for professional use which is
    already covered by Directive 89/686/EEC. Artisanal decorative products do not claim to fulfil a protective function, are by definition not personal protective equipment and are therefore not concerned
    by that inclusion. Clothing intended for private use with reflective or fluorescent elements included for reasons of design or decoration is not personal protective equipment and is therefore not covered
    by this Regulation. As for products intended for private use to protect against atmospheric conditions that are not of an extreme nature or to protect against damp and water, including but not limited
    to seasonal clothing, umbrellas and dishwashing gloves, those should also fall outside of the scope of this Regulation. It is also appropriate to clarify the list of excluded PPE set out in Annex I
    to Directive 89/686/EEC by adding a reference to products covered by other legislation and therefore excluded from the scope of this Regulation.


    (11)


    Economic operators should be responsible for the compliance of PPE with the requirements of this Regulation, in relation to their respective roles in the supply chain, so as to ensure a high level of
    protection of public interests, such as health and safety, and the protection of users, and to guarantee fair competition on the Union market.


    (12)


    All economic operators intervening in the supply and distribution chain should take appropriate measures to ensure that they make available on the market only PPE which is in conformity with this Regulation.
    This Regulation should provide a clear and proportionate distribution of obligations which correspond to the role of each economic operator in the supply and distribution chain.


    (13)


    In order to facilitate communication between economic operators, national market surveillance authorities and consumers, Member States should encourage economic operators to include a website address
    in addition to the postal address.


    (14)


    The manufacturer, having detailed knowledge of the design and production process, is best placed to carry out the conformity assessment procedure. Conformity assessment should therefore remain solely
    the obligation of the manufacturer.


    (15)


    It is necessary to ensure that PPE from third countries entering the Union market complies with the requirements of this Regulation and, in particular, that appropriate conformity assessment procedures
    have been carried out by manufacturers. Provision should therefore be made for importers to make sure that PPE they place on the market complies with the requirements of this Regulation and that they
    do not place on the market PPE which does not comply with such requirements or which present a risk. Provision should also be made for importers to make sure that the conformity assessment procedures
    have been carried out and that the CE marking and technical documentation drawn up by manufacturers are available for inspection by the competent national authorities.


    (16)


    The distributor makes PPE available on the market after it has been placed on the market by the manufacturer or the importer and should act with due care to ensure that its handling of PPE does not
    adversely affect the compliance of the PPE.


    (17)


    When placing PPE on the market, every importer should indicate on the PPE his name, registered trade name or registered trade mark and the postal address at which he can be contacted. Exceptions should
    be provided for in cases where the size or nature of the PPE does not allow it. This includes cases where the importer would have to open the packaging to put his name and address on the PPE.


    (18)


    Efforts should be made by economic operators to ensure that all relevant documentation, such as the user''s instructions, whilst ensuring precise and comprehensible information, are easily understandable,
    take into account technological developments and changes to end-user behaviour, and are as up to date as possible. When PPE is made available on the market in packages containing multiple units, the
    instructions and information should accompany each smallest commercially available unit.


    (19)


    Any economic operator who either places PPE on the market under his own name or trademark or modifies a product in such a way that compliance with the requirements of this Regulation may be affected
    should be considered to be the manufacturer and should assume the obligations of the manufacturer.


    (20)


    Distributors and importers, being close to the market place, should be involved in market surveillance tasks carried out by the competent national authorities, and should be prepared to participate
    actively, providing those authorities with all necessary information relating to the PPE concerned.


    (21)


    Ensuring traceability of PPE throughout the whole supply chain helps to make market surveillance simpler and more efficient. An efficient traceability system facilitates the market surveillance authorities''
    task of tracing economic operators who made non-compliant PPE available on the market. When keeping the information required under this Regulation for the identification of other economic operators,
    economic operators should not be required to update such information in respect of other economic operators who have either supplied them with PPE or to whom they have supplied PPE.


    (22)


    In order to simplify and adapt certain essential safety requirements of Directive 89/686/EEC to the current practice, the requirement to label PPE protecting against harmful noise with a comfort index
    should be removed as experience has shown that it is not possible to measure and establish such an index. As regards mechanical vibrations, it is appropriate to remove the requirement not to exceed
    the limit values set by Union legislation on the exposure of workers to vibrations since the use of PPE alone is not able to achieve this objective. As regards PPE protecting against radiation, it is
    no longer necessary to require that the instructions for use supplied by the manufacturer indicate transmission curves, since the indication of the protection factor is more useful and is sufficient
    for the user.


    (23)


    It is necessary to clearly specify the relationship with, and the scope of this Regulation as regards, the entitlement of Member States to lay down requirements for the use of PPE at the workplace,
    in particular pursuant to Council Directive 89/656/EEC

    (

    8

    )

    , in order to avoid any confusion and ambiguity and hence ensure the free movement of compliant PPE. Article 4 of that Directive obliges employers to provide PPE which complies with the relevant Union
    provisions on design and manufacture with respect to safety and health. Pursuant to that Article, manufacturers of PPE who provide that PPE to their employees must ensure that such PPE fulfils the requirements
    laid down in this Regulation.


    (24)


    Market surveillance authorities should have easy access to the EU declaration of conformity. In order to fulfil that requirement, manufacturers should ensure that PPE is accompanied either by a copy
    of the EU declaration of conformity or by the internet address at which the EU declaration '
- id: art-2
  title: CHAPTER I
  text: 'CHAPTER I


    GENERAL PROVISIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Subject matter


    This Regulation lays down requirements for the design and manufacture of personal protective equipment (PPE) which is to be made available on the market, in order to ensure protection of the health
    and safety of users and establish rules on the free movement of PPE in the Union.'
- id: art-4
  title: Article 2
  text: 'Article 2


    Scope


    1.   This Regulation applies to PPE.


    2.   This Regulation does not apply to PPE:


    (a)


    specifically designed for use by the armed forces or in the maintenance of law and order;


    (b)


    designed to be used for self-defence, with the exception of PPE intended for sporting activities;


    (c)


    designed for private use to protect against:


    (i)


    atmospheric conditions that are not of an extreme nature,


    (ii)


    damp and water during dishwashing;


    (d)


    for exclusive use on seagoing vessels or aircraft that are subject to the relevant international treaties applicable in Member States;


    (e)


    for head, face or eye protection of users, that is covered by Regulation No 22 of the United Nations Economic Commission for Europe on uniform provisions concerning the approval of protective helmets
    and their visors for drivers and passengers of motorcycles and mopeds.'
- id: art-5
  title: Article 3
  text: 'Article 3


    Definitions


    For the purposes of this Regulation, the following definitions apply:


    (1)


    ‘personal protective equipment’ (PPE) means:


    (a)


    equipment designed and manufactured to be worn or held by a person for protection against one or more risks to that person''s health or safety;


    (b)


    interchangeable components for equipment referred to in point (a) which are essential for its protective function;


    (c)


    connexion systems for equipment referred to in point (a) that are not held or worn by a person, that are designed to connect that equipment to an external device or to a reliable anchorage point, that
    are not designed to be permanently fixed and that do not require fastening works before use;


    (2)


    ‘making available on the market’ means any supply of PPE for distribution or use on the Union market in the course of a commercial activity, whether in return for payment or free of charge;


    (3)


    ‘placing on the market’ means the first making available of PPE on the Union market;


    (4)


    ‘manufacturer’ means any natural or legal person who manufactures PPE or has it designed or manufactured, and markets it under his name or trademark;


    (5)


    ‘authorised representative’ means any natural or legal person established within the Union who has received a written mandate from a manufacturer to act on his behalf in relation to specified tasks;


    (6)


    ‘importer’ means any natural or legal person established within the Union who places PPE from a third country on the Union market;


    (7)


    ‘distributor’ means any natural or legal person in the supply chain, other than the manufacturer or the importer, who makes PPE available on the market;


    (8)


    ‘economic operators’ means the manufacturer, the authorised representative, the importer and the distributor;


    (9)


    ‘technical specification’ means a document that prescribes technical requirements to be fulfilled by PPE;


    (10)


    ‘harmonised standard’ means a harmonised standard as defined in point (c) of point 1 of Article 2 of Regulation (EU) No 1025/2012;


    (11)


    ‘accreditation’ means accreditation as defined in point 10 of Article 2 of Regulation (EC) No 765/2008;


    (12)


    ‘national accreditation body’ means a national accreditation body as defined in point 11 of Article 2 of Regulation (EC) No 765/2008;


    (13)


    ‘conformity assessment’ means the process demonstrating whether the essential health and safety requirements of this Regulation relating to PPE have been fulfilled;


    (14)


    ‘conformity assessment body’ means a body that performs conformity assessment activities including calibration, testing, certification and inspection;


    (15)


    ‘recall’ means any measure aimed at achieving the return of PPE that has already been made available to the end-user;


    (16)


    ‘withdrawal’ means any measure aimed at preventing PPE in the supply chain from being made available on the market;


    (17)


    ‘Union harmonisation legislation’ means any Union legislation harmonising the conditions for the marketing of products;


    (18)


    ‘CE marking’ means a marking by which the manufacturer indicates that PPE is in conformity with the applicable requirements set out in Union harmonisation legislation providing for its affixing.'
- id: art-6
  title: Article 4
  text: 'Article 4


    Making available on the market


    PPE shall only be made available on the market if, where properly maintained and used for its intended purpose, it complies with this Regulation and does not endanger the health or safety of persons,
    domestic animals or property.'
- id: art-7
  title: Article 5
  text: 'Article 5


    Essential health and safety requirements


    PPE shall meet the essential health and safety requirements set out in Annex II which apply to it.'
- id: art-8
  title: Article 6
  text: 'Article 6


    Provisions concerning the use of PPE


    This Regulation shall not affect Member States'' entitlement, in particular when implementing Directive 89/656/EEC, to lay down requirements concerning the use of PPE, provided that those requirements
    do not affect the design of PPE which is placed on the market in accordance with this Regulation.'
- id: art-9
  title: Article 7
  text: 'Article 7


    Free movement


    1.   Member States shall not impede, for the aspects covered by this Regulation, the making available on the market of PPE which complies with this Regulation.


    2.   At trade fairs, exhibitions and demonstrations or similar events, Member States shall not prevent the showing of PPE which does not comply with this Regulation, provided that a visible sign clearly
    indicates that the PPE does not comply with this Regulation and is not available on the market until it has been brought into conformity.


    During demonstrations, adequate measures shall be taken to ensure the protection of persons.'
- id: art-10
  title: CHAPTER II
  text: 'CHAPTER II


    OBLIGATIONS OF ECONOMIC OPERATORS'
- id: art-11
  title: Article 8
  text: 'Article 8


    Obligations of manufacturers


    1.   When placing PPE on the market, manufacturers shall ensure that it has been designed and manufactured in accordance with the applicable essential health and safety requirements set out in Annex II.


    2.   Manufacturers shall draw up the technical documentation referred to in Annex III (‘technical documentation’) and carry out the applicable conformity assessment procedure referred to in Article 19
    or have it carried out.


    Where compliance of PPE with the applicable essential health and safety requirements has been demonstrated by the appropriate procedure, manufacturers shall draw up the EU declaration of conformity
    referred to in Article 15 and affix the CE marking referred to in Article 16.


    3.   Manufacturers shall keep the technical documentation and the EU declaration of conformity for 10 years after the PPE has been placed on the market.


    4.   Manufacturers shall ensure that procedures are in place for series production to remain in conformity with this Regulation. Changes in the design or characteristics of the PPE and changes in the
    harmonised standards or in other technical specifications by reference to which the conformity of the PPE is declared shall be adequately taken into account.


    When deemed appropriate with regard to the risks presented by PPE, manufacturers shall, to protect the health and safety of consumers and other end-users, carry out sample testing of PPE made available
    on the market, investigate, and, if necessary, keep a register of complaints, of non-conforming PPE and PPE recalls, and shall keep distributors informed of any such monitoring.


    5.   Manufacturers shall ensure that the PPE which they place on the market bears a type, batch or serial number or other element allowing its identification, or, where the size or nature of the PPE
    does not allow it, that the required information is provided on the packaging or in a document accompanying the PPE.


    6.   Manufacturers shall indicate, on the PPE, their name, registered trade name or registered trade mark and the postal address at which they can be contacted or, where that is not possible, on its
    packaging or in a document accompanying the PPE. The address shall indicate a single point at which the manufacturer can be contacted. The contact details shall be in a language easily understood by
    end-users and market surveillance authorities.


    7.   Manufacturers shall ensure that the PPE is accompanied by the instructions and information set out in point 1.4 of Annex II in a language which can be easily understood by consumers and other end-users,
    as determined by the Member State concerned. Such instructions and information, as well as any labelling, shall be clear, understandable, intelligible and legible.


    8.   The manufacturer shall either provide the EU declaration of conformity with the PPE or include in the instructions and information set out in point 1.4 of Annex II the internet address at which
    the EU declaration of conformity can be accessed.


    9.   Manufacturers who consider or have reason to believe that PPE which they have placed on the market is not in conformity with this Regulation shall immediately take the corrective measures necessary
    to bring that PPE into conformity, to withdraw it or to recall it, as appropriate. Furthermore, where the PPE presents a risk, manufacturers shall immediately inform the competent national authorities
    of the Member States in which they made the PPE available on the market to that effect, giving details, in particular, of the non-conformity and of any corrective measures taken.


    10.   Manufacturers shall, further to a reasoned request from a competent national authority, provide it with all the information and documentation, in paper or electronic form, necessary to demonstrate
    the conformity of the PPE with this Regulation, in a language which can be easily understood by that authority. They shall cooperate with that authority, at its request, on any action taken to eliminate
    the risks posed by PPE which they have placed on the market.'
- id: art-12
  title: Article 9
  text: 'Article 9


    Authorised representatives


    1.   A manufacturer may, by a written mandate, appoint an authorised representative.


    The obligations laid down in Article 8(1) and the obligation to draw up the technical documentation referred to in Article 8(2) shall not form part of the authorised representative''s mandate.


    2.   An authorised representative shall perform the tasks specified in the mandate received from the manufacturer. The mandate shall allow the authorised representative to do at least the following:


    (a)


    keep the EU declaration of conformity and the technical documentation at the disposal of the national market surveillance authorities for 10 years after the PPE has been placed on the market;


    (b)


    further to a reasoned request from a competent national authority, provide that authority with all the information and documentation necessary to demonstrate the conformity of the PPE;


    (c)


    cooperate with the competent national authorities, at their request, on any action taken to eliminate the risks posed by PPE covered by the authorised representative''s mandate.'
- id: art-13
  title: Article 10
  text: 'Article 10


    Obligations of importers


    1.   Importers shall place only compliant PPE on the market.


    2.   Before placing PPE on the market, importers shall ensure that the appropriate conformity assessment procedure referred to in Article 19 has been carried out by the manufacturer. They shall ensure
    that the manufacturer has drawn up the technical documentation, that the PPE bears the CE marking and is accompanied by the required documents, and that the manufacturer has complied with the requirements
    set out in Article 8(5) and (6).


    Where an importer considers or has reason to believe that PPE is not in conformity with the applicable essential health and safety requirements set out in Annex II, he shall not place it on the market
    until it has been brought into conformity. Furthermore, where the PPE presents a risk, the importer shall inform the manufacturer and the market surveillance authorities to that effect.


    3.   Importers shall indicate, on the PPE, their name, registered trade name or registered trade mark and the postal address at which they can be contacted or, where that is not possible, on its packaging
    or in a document accompanying the PPE. The contact details shall be in a language easily understood by end-users and market surveillance authorities.


    4.   Importers shall ensure that the PPE is accompanied by the instructions and information set out in point 1.4 of Annex II in a language which can be easily understood by consumers and other end-users,
    as determined by the Member State concerned.


    5.   Importers shall ensure that, while the PPE is under their responsibility, storage or transport conditions do not jeopardise its conformity with the applicable essential health and safety requirements
    set out in Annex II.


    6.   When deemed appropriate with regard to the risks presented by PPE, importers shall, to protect the health and safety of consumers and other end-users, carry out sample testing of PPE made available
    on the market, investigate, and, if necessary, keep a register of complaints, of non-conforming PPE and PPE recalls, and shall keep distributors informed of any such monitoring.


    7.   Importers who consider or have reason to believe that PPE which they have placed on the market is not in conformity with this Regulation shall immediately take the corrective measures necessary
    to bring the PPE into conformity, to withdraw it or to recall it, as appropriate. Furthermore, where the PPE presents a risk, importers shall immediately inform the competent national authorities of
    the Member States in which they made the PPE available on the market to that effect, giving details, in particular, of the non-conformity and of any corrective measures taken.


    8.   Importers shall, for 10 years after the PPE has been placed on the market, keep a copy of the EU declaration of conformity at the disposal of the market surveillance authorities and ensure that
    the technical documentation can be made available to those authorities, upon request.


    9.   Importers shall, further to a reasoned request from a competent national authority, provide it with all the information and documentation, in paper or electronic form, necessary to demonstrate
    the conformity of PPE in a language which can be easily understood by that authority. They shall cooperate with that authority, at its request, on any action taken to eliminate the risks posed by PPE
    which they have placed on the market.'
- id: art-14
  title: Article 11
  text: 'Article 11


    Obligations of distributors


    1.   When making PPE available on the market, distributors shall act with due care in relation to the requirements of this Regulation.


    2.   Before making PPE available on the market, distributors shall verify that it bears the CE marking, is accompanied by the required documents and by the instructions and information set out in point 1.4
    of Annex II in a language which can be easily understood by consumers and other end-users in the Member State in which PPE is to be made available on the market and that the manufacturer and the importer
    have complied with the requirements set out in Article 8(5) and (6) and Article 10(3) respectively.


    Where a distributor considers or has reason to believe that PPE is not in conformity with the applicable essential health and safety requirements set out in Annex II, he shall not make the PPE available
    on the market until it has been brought into conformity. Furthermore, where the PPE presents a risk, the distributor shall inform the manufacturer or the importer to that effect as well as the market
    surveillance authorities.


    3.   Distributors shall ensure that, while PPE is under their responsibility, its storage or transport conditions do not jeopardise its conformity with the applicable essential health and safety requirements
    set out in Annex II.


    4.   Distributors who consider or have reason to believe that PPE which they have made available on the market is not in conformity with this Regulation shall make sure that the corrective measures
    necessary to bring it into conformity, to withdraw it or to recall it, as appropriate, are taken. Furthermore, where the PPE presents a risk, distributors shall immediately inform the competent national
    authorities of the Member States in which they have made the PPE available on the market to that effect, giving details, in particular, of the non-conformity and of any corrective measures taken.


    5.   Distributors shall, further to a reasoned request from a competent national authority, provide it with all the information and documentation, in paper or electronic form, necessary to demonstrate
    the conformity of the PPE. They shall cooperate with that authority, at its request, on any action taken to eliminate the risks posed by PPE which they have made available on the market.'
- id: art-15
  title: Article 12
  text: 'Article 12


    Cases in which obligations of manufacturers apply to importers and distributors


    An importer or distributor shall be considered a manufacturer for the purposes of this Regulation and he shall be subject to the obligations of the manufacturer set out in Article 8 where he places
    PPE on the market under his name or trademark or modifies PPE already placed on the market in such a way that compliance with this Regulation may be affected.'
- id: art-16
  title: Article 13
  text: 'Article 13


    Identification of economic operators


    Economic operators shall, on request, identify the following to the market surveillance authorities:


    (a)


    any economic operator who has supplied them with PPE;


    (b)


    any economic operator to whom they have supplied PPE.


    Economic operators shall be able to present the information referred to in the first paragraph for 10 years after they have been supplied with the PPE and for 10 years after they have supplied the PPE.'
- id: art-17
  title: CHAPTER III
  text: 'CHAPTER III


    CONFORMITY OF THE PPE'
- id: art-18
  title: Article 14
  text: 'Article 14


    Presumption of conformity of PPE


    PPE which is in conformity with harmonised standards or parts thereof the references of which have been published in the

    Official Journal of the European Union

    shall be presumed to be in conformity with the essential health and safety requirements set out in Annex II covered by those standards or parts thereof.'
- id: art-19
  title: Article 15
  text: 'Article 15


    EU declaration of conformity


    1.   The EU declaration of conformity shall state that the fulfilment of the applicable essential health and safety requirements set out in Annex II has been demonstrated.


    2.   The EU declaration of conformity shall have the model structure set out in Annex IX, shall contain the elements specified in the relevant modules set out in Annexes IV, VI, VII and VIII and shall
    be continuously updated. It shall be translated into the language or languages required by the Member State in which the PPE is placed or made available on the market.


    3.   Where PPE is subject to more than one Union act requiring an EU declaration of conformity, a single EU declaration of conformity shall be drawn up in respect of all such Union acts. That declaration
    shall contain the identification of the Union acts concerned, including their publication references.


    4.   By drawing up the EU declaration of conformity, the manufacturer shall assume responsibility for the compliance of the PPE with the requirements laid down in this Regulation.'
- id: art-20
  title: Article 16
  text: 'Article 16


    General principles of the CE marking


    The CE marking shall be subject to the general principles set out in Article 30 of Regulation (EC) No 765/2008.'
- id: art-21
  title: Article 17
  text: 'Article 17


    Rules and conditions for affixing the CE marking


    1.   The CE marking shall be affixed visibly, legibly and indelibly to the PPE. Where that is not possible or not warranted on account of the nature of the PPE, it shall be affixed to the packaging
    and to the documents accompanying the PPE.


    2.   The CE marking shall be affixed before the PPE is placed on the market.


    3.   For category III PPE, the CE marking shall be followed by the identification number of the notified body involved in the procedure set out in Annex VII or VIII.


