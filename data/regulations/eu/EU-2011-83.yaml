    L 304/64


    DIRECTIVE 2011/83/EU OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 25 October 2011



    on consumer rights, amending Council Directive 93/13/EEC and Directive 1999/44/EC of the European Parliament and of the Council and repealing Council Directive 85/577/EEC and Directive 97/7/EC of the
    European Parliament and of the Council


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 114 thereof,


    Having regard to the proposal from the European Commission,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Having regard to the opinion of the Committee of the Regions

    (

    2

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    3

    )

    ,


    Whereas:


    (1)


    Council Directive 85/577/EEC of 20 December 1985 to protect the consumer in respect of contracts negotiated away from business premises

    (

    4

    )

    and Directive 97/7/EC of the European Parliament and of the Council of 20 May 1997 on the protection of consumers in respect of distance contracts

    (

    5

    )

    lay down a number of contractual rights for consumers.


    (2)


    Those Directives have been reviewed in the light of experience with a view to simplifying and updating the applicable rules, removing inconsistencies and closing unwanted gaps in the rules. That review
    has shown that it is appropriate to replace those two Directives by a single Directive. This Directive should therefore lay down standard rules for the common aspects of distance and off-premises contracts,
    moving away from the minimum harmonisation approach in the former Directives whilst allowing Member States to maintain or adopt national rules in relation to certain aspects.


    (3)'
- id: art-2
  title: Article 169(1) and point (a) of Article 169(2) of the Treaty on the Functioning of the European Union (TFEU) provide that the Union is to contribute to the attainment of a high level of consumer
    prote
  text: 'Article 169(1) and point (a) of Article 169(2) of the Treaty on the Functioning of the European Union (TFEU) provide that the Union is to contribute to the attainment of a high level of consumer
    protection through the measures adopted pursuant to Article 114 thereof.


    (4)


    In accordance with Article 26(2) TFEU, the internal market is to comprise an area without internal frontiers in which the free movement of goods and services and freedom of establishment are ensured.
    The harmonisation of certain aspects of consumer distance and off-premises contracts is necessary for the promotion of a real consumer internal market striking the right balance between a high level
    of consumer protection and the competitiveness of enterprises, while ensuring respect for the principle of subsidiarity.


    (5)


    The cross-border potential of distance selling, which should be one of the main tangible results of the internal market, is not fully exploited. Compared with the significant growth of domestic distance
    sales over the last few years, the growth in cross-border distance sales has been limited. This discrepancy is particularly significant for Internet sales for which the potential for further growth
    is high. The cross-border potential of contracts negotiated away from business premises (direct selling) is constrained by a number of factors including the different national consumer protection rules
    imposed upon the industry. Compared with the growth of domestic direct selling over the last few years, in particular in the services sector, for instance utilities, the number of consumers using this
    channel for cross-border purchases has remained flat. Responding to increased business opportunities in many Member States, small and medium-sized enterprises (including individual traders) or agents
    of direct selling companies should be more inclined to seek business opportunities in other Member States, in particular in border regions. Therefore the full harmonisation of consumer information and
    the right of withdrawal in distance and off-premises contracts will contribute to a high level of consumer protection and a better functioning of the business-to-consumer internal market.


    (6)


    Certain disparities create significant internal market barriers affecting traders and consumers. Those disparities increase compliance costs to traders wishing to engage in the cross-border sale of
    goods or provision of services. Disproportionate fragmentation also undermines consumer confidence in the internal market.


    (7)


    Full harmonisation of some key regulatory aspects should considerably increase legal certainty for both consumers and traders. Both consumers and traders should be able to rely on a single regulatory
    framework based on clearly defined legal concepts regulating certain aspects of business-to-consumer contracts across the Union. The effect of such harmonisation should be to eliminate the barriers
    stemming from the fragmentation of the rules and to complete the internal market in this area. Those barriers can only be eliminated by establishing uniform rules at Union level. Furthermore consumers
    should enjoy a high common level of protection across the Union.


    (8)


    The regulatory aspects to be harmonised should only concern contracts concluded between traders and consumers. Therefore, this Directive should not affect national law in the area of contracts relating
    to employment, contracts relating to succession rights, contracts relating to family law and contracts relating to the incorporation and organisation of companies or partnership agreements.


    (9)


    This Directive establishes rules on information to be provided for distance contracts, off-premises contracts and contracts other than distance and off-premises contracts. This Directive also regulates
    the right of withdrawal for distance and off-premises contracts and harmonises certain provisions dealing with the performance and some other aspects of business-to-consumer contracts.


    (10)


    This Directive should be without prejudice to Regulation (EC) No 593/2008 of the European Parliament and of the Council of 17 June 2008 on the law applicable to contractual obligations (Rome I)

    (

    6

    )

    .


    (11)


    This Directive should be without prejudice to Union provisions relating to specific sectors, such as medicinal products for human use, medical devices, privacy and electronic communications, patients’
    rights in cross-border healthcare, food labelling and the internal market for electricity and natural gas.


    (12)


    The information requirements provided for in this Directive should complete the information requirements of Directive 2006/123/EC of the European Parliament and of the Council of 12 December 2006 on
    services in the internal market

    (

    7

    )

    and Directive 2000/31/EC of the European Parliament and of the Council of 8 June 2000 on certain legal aspects of information society services, in particular electronic commerce, in the Internal Market
    (‘Directive on electronic commerce’)

    (

    8

    )

    . Member States should retain the possibility to impose additional information requirements applicable to service providers established in their territory.


    (13)


    Member States should remain competent, in accordance with Union law, to apply the provisions of this Directive to areas not falling within its scope. Member States may therefore maintain or introduce
    national legislation corresponding to the provisions of this Directive, or certain of its provisions, in relation to contracts that fall outside the scope of this Directive. For instance, Member States
    may decide to extend the application of the rules of this Directive to legal persons or to natural persons who are not consumers within the meaning of this Directive, such as non-governmental organisations,
    start-ups or small and medium-sized enterprises. Similarly, Member States may apply the provisions of this Directive to contracts that are not distance contracts within the meaning of this Directive,
    for example because they are not concluded under an organised distance sales or service-provision scheme. Moreover, Member States may also maintain or introduce national provisions on issues not specifically
    addressed in this Directive, such as additional rules concerning sales contracts, including in relation to the delivery of goods, or requirements for the provision of information during the existence
    of a contract.


    (14)


    This Directive should not affect national law in the area of contract law for contract law aspects that are not regulated by this Directive. Therefore, this Directive should be without prejudice to
    national law regulating for instance the conclusion or the validity of a contract (for instance in the case of lack of consent). Similarly, this Directive should not affect national law in relation
    to the general contractual legal remedies, the rules on public economic order, for instance rules on excessive or extortionate prices, and the rules on unethical legal transactions.


    (15)


    This Directive should not harmonise language requirements applicable to consumer contracts. Therefore, Member States may maintain or introduce in their national law language requirements regarding contractual
    information and contractual terms.


    (16)


    This Directive should not affect national laws on legal representation such as the rules relating to the person who is acting in the name of the trader or on his behalf (such as an agent or a trustee).
    Member States should remain competent in this area. This Directive should apply to all traders, whether public or private.


    (17)


    The definition of consumer should cover natural persons who are acting outside their trade, business, craft or profession. However, in the case of dual purpose contracts, where the contract is concluded
    for purposes partly within and partly outside the person’s trade and the trade purpose is so limited as not to be predominant in the overall context of the contract, that person should also be considered
    as a consumer.


    (18)


    This Directive does not affect the freedom of Member States to define, in conformity with Union law, what they consider to be services of general economic interest, how those services should be organised
    and financed, in compliance with State aid rules, and which specific obligations they should be subject to.


    (19)


    Digital content means data which are produced and supplied in digital form, such as computer programs, applications, games, music, videos or texts, irrespective of whether they are accessed through
    downloading or streaming, from a tangible medium or through any other means. Contracts for the supply of digital content should fall within the scope of this Directive. If digital content is supplied
    on a tangible medium, such as a CD or a DVD, it should be considered as goods within the meaning of this Directive. Similarly to contracts for the supply of water, gas or electricity, where they are
    not put up for sale in a limited volume or set quantity, or of district heating, contracts for digital content which is not supplied on a tangible medium should be classified, for the purpose of this
    Directive, neither as sales contracts nor as service contracts. For such contracts, the consumer should have a right of withdrawal unless he has consented to the beginning of the performance of the
    contract during the withdrawal period and has acknowledged that he will consequently lose the right to withdraw from the contract. In addition to the general information requirements, the trader should
    inform the consumer about the functionality and the relevant interoperability of digital content. The notion of functionality should refer to the ways in which digital content can be used, for instance
    for the tracking of consumer behaviour; it should also refer to the absence or presence of any technical restrictions such as protection via Digital Rights Management or region coding. The notion of
    relevant interoperability is meant to describe the information regarding the standard hardware and software environment with which the digital content is compatible, for instance the operating system,
    the necessary version and certain hardware features. The Commission should examine the need for further harmonisation of provisions in respect of digital content and submit, if necessary, a legislative
    proposal for addressing this matter.


    (20)


    The definition of distance contract should cover all cases where a contract is concluded between the trader and the consumer under an organised distance sales or service-provision scheme, with the exclusive
    use of one or more means of distance communication (such as mail order, Internet, telephone or fax) up to and including the time at which the contract is concluded. That definition should also cover
    situations where the consumer visits the business premises merely for the purpose of gathering information about the goods or services and subsequently negotiates and concludes the contract at a distance.
    By contrast, a contract which is negotiated at the business premises of the trader and finally concluded by means of distance communication should not be considered a distance contract. Neither should
    a contract initiated by means of distance communication, but finally concluded at the business premises of the trader be considered a distance contract. Similarly, the concept of distance contract should
    not include reservations made by a consumer through a means of distance communications to request the provision of a service from a professional, such as in the case of a consumer phoning to request
    an appointment with a hairdresser. The notion of an organised distance sales or service-provision scheme should include those schemes offered by a third party other than the trader but used by the trader,
    such as an online platform. It should not, however, cover cases where websites merely offer information on the trader, his goods and/or services and his contact details.


    (21)


    An off-premises contract should be defined as '
- id: art-3
  title: CHAPTER I
  text: 'CHAPTER I


    SUBJECT MATTER, DEFINITIONS AND SCOPE'
- id: art-4
  title: Article 1
  text: 'Article 1


    Subject matter


    The purpose of this Directive is, through the achievement of a high level of consumer protection, to contribute to the proper functioning of the internal market by approximating certain aspects of the
    laws, regulations and administrative provisions of the Member States concerning contracts concluded between consumers and traders.'
- id: art-5
  title: Article 2
  text: 'Article 2


    Definitions


    For the purpose of this Directive, the following definitions shall apply:


    (1)


    ‘consumer’ means any natural person who, in contracts covered by this Directive, is acting for purposes which are outside his trade, business, craft or profession;


    (2)


    ‘trader’ means any natural person or any legal person, irrespective of whether privately or publicly owned, who is acting, including through any other person acting in his name or on his behalf, for
    purposes relating to his trade, business, craft or profession in relation to contracts covered by this Directive;


    (3)


    ‘goods’ means any tangible movable items, with the exception of items sold by way of execution or otherwise by authority of law; water, gas and electricity shall be considered as goods within the meaning
    of this Directive where they are put up for sale in a limited volume or a set quantity;


    (4)


    ‘goods made to the consumer’s specifications’ means non-prefabricated goods made on the basis of an individual choice of or decision by the consumer;


    (5)


    ‘sales contract’ means any contract under which the trader transfers or undertakes to transfer the ownership of goods to the consumer and the consumer pays or undertakes to pay the price thereof, including
    any contract having as its object both goods and services;


    (6)


    ‘service contract’ means any contract other than a sales contract under which the trader supplies or undertakes to supply a service to the consumer and the consumer pays or undertakes to pay the price
    thereof;


    (7)


    ‘distance contract’ means any contract concluded between the trader and the consumer under an organised distance sales or service-provision scheme without the simultaneous physical presence of the trader
    and the consumer, with the exclusive use of one or more means of distance communication up to and including the time at which the contract is concluded;


    (8)


    ‘off-premises contract’ means any contract between the trader and the consumer:


    (a)


    concluded in the simultaneous physical presence of the trader and the consumer, in a place which is not the business premises of the trader;


    (b)


    for which an offer was made by the consumer in the same circumstances as referred to in point (a);


    (c)


    concluded on the business premises of the trader or through any means of distance communication immediately after the consumer was personally and individually addressed in a place which is not the business
    premises of the trader in the simultaneous physical presence of the trader and the consumer; or


    (d)


    concluded during an excursion organised by the trader with the aim or effect of promoting and selling goods or services to the consumer;


    (9)


    ‘business premises’ means:


    (a)


    any immovable retail premises where the trader carries out his activity on a permanent basis; or


    (b)


    any movable retail premises where the trader carries out his activity on a usual basis;


    (10)


    ‘durable medium’ means any instrument which enables the consumer or the trader to store information addressed personally to him in a way accessible for future reference for a period of time adequate
    for the purposes of the information and which allows the unchanged reproduction of the information stored;


    (11)


    ‘digital content’ means data which are produced and supplied in digital form;


    (12)


    ‘financial service’ means any service of a banking, credit, insurance, personal pension, investment or payment nature;


    (13)


    ‘public auction’ means a method of sale where goods or services are offered by the trader to consumers, who attend or are given the possibility to attend the auction in person, through a transparent,
    competitive bidding procedure run by an auctioneer and where the successful bidder is bound to purchase the goods or services;


    (14)


    ‘commercial guarantee’ means any undertaking by the trader or a producer (the guarantor) to the consumer, in addition to his legal obligation relating to the guarantee of conformity, to reimburse the
    price paid or to replace, repair or service goods in any way if they do not meet the specifications or any other requirements not related to conformity set out in the guarantee statement or in the relevant
    advertising available at the time of, or before the conclusion of the contract;


    (15)


    ‘ancillary contract’ means a contract by which the consumer acquires goods or services related to a distance contract or an off-premises contract and where those goods are supplied or those services
    are provided by the trader or by a third party on the basis of an arrangement between that third party and the trader.'
- id: art-6
  title: Article 3
  text: 'Article 3


    Scope


    1.   This Directive shall apply, under the conditions and to the extent set out in its provisions, to any contract concluded between a trader and a consumer. It shall also apply to contracts for the
    supply of water, gas, electricity or district heating, including by public providers, to the extent that these commodities are provided on a contractual basis.


    2.   If any provision of this Directive conflicts with a provision of another Union act governing specific sectors, the provision of that other Union act shall prevail and shall apply to those specific
    sectors.


    3.   This Directive shall not apply to contracts:


    (a)


    for social services, including social housing, childcare and support of families and persons permanently or temporarily in need, including long-term care;


    (b)


    for healthcare as defined in point (a) of Article 3 of Directive 2011/24/EU, whether or not they are provided via healthcare facilities;


    (c)


    for gambling, which involves wagering a stake with pecuniary value in games of chance, including lotteries, casino games and betting transactions;


    (d)


    for financial services;


    (e)


    for the creation, acquisition or transfer of immovable property or of rights in immovable property;


    (f)


    for the construction of new buildings, the substantial conversion of existing buildings and for rental of accommodation for residential purposes;


    (g)


    which fall within the scope of Council Directive 90/314/EEC of 13 June 1990 on package travel, package holidays and package tours

    (

    18

    )

    ;


    (h)


    which fall within the scope of Directive 2008/122/EC of the European Parliament and of the Council of 14 January 2009 on the protection of consumers in respect of certain aspects of timeshare, long-term
    holiday product, resale and exchange contracts

    (

    19

    )

    ;


    (i)


    which, in accordance with the laws of Member States, are established by a public office-holder who has a statutory obligation to be independent and impartial and who must ensure, by providing comprehensive
    legal information, that the consumer only concludes the contract on the basis of careful legal consideration and with knowledge of its legal scope;


    (j)


    for the supply of foodstuffs, beverages or other goods intended for current consumption in the household, and which are physically supplied by a trader on frequent and regular rounds to the consumer’s
    home, residence or workplace;


    (k)


    for passenger transport services, with the exception of Article 8(2) and Articles 19 and 22;


    (l)


    concluded by means of automatic vending machines or automated commercial premises;


    (m)


    concluded with telecommunications operators through public payphones for their use or concluded for the use of one single connection by telephone, Internet or fax established by a consumer.


    4.   Member States may decide not to apply this Directive or not to maintain or introduce corresponding national provisions to off-premises contracts for which the payment to be made by the consumer
    does not exceed EUR 50. Member States may define a lower value in their national legislation.


    5.   This Directive shall not affect national general contract law such as the rules on the validity, formation or effect of a contract, in so far as general contract law aspects are not regulated in
    this Directive.


    6.   This Directive shall not prevent traders from offering consumers contractual arrangements which go beyond the protection provided for in this Directive.'
- id: art-7
  title: Article 4
  text: 'Article 4


    Level of harmonisation


    Member States shall not maintain or introduce, in their national law, provisions diverging from those laid down in this Directive, including more or less stringent provisions to ensure a different level
    of consumer protection, unless otherwise provided for in this Directive.'
- id: art-8
  title: CHAPTER II
  text: 'CHAPTER II


    CONSUMER INFORMATION FOR CONTRACTS OTHER THAN DISTANCE OR OFF-PREMISES CONTRACTS'
- id: art-9
  title: Article 5
  text: 'Article 5


    Information requirements for contracts other than distance or off-premises contracts


    1.   Before the consumer is bound by a contract other than a distance or an off-premises contract, or any corresponding offer, the trader shall provide the consumer with the following information in
    a clear and comprehensible manner, if that information is not already apparent from the context:


    (a)


    the main characteristics of the goods or services, to the extent appropriate to the medium and to the goods or services;


    (b)


    the identity of the trader, such as his trading name, the geographical address at which he is established and his telephone number;


    (c)


    the total price of the goods or services inclusive of taxes, or where the nature of the goods or services is such that the price cannot reasonably be calculated in advance, the manner in which the price
    is to be calculated, as well as, where applicable, all additional freight, delivery or postal charges or, where those charges cannot reasonably be calculated in advance, the fact that such additional
    charges may be payable;


    (d)


    where applicable, the arrangements for payment, delivery, performance, the time by which the trader undertakes to deliver the goods or to perform the service, and the trader’s complaint handling policy;


    (e)


    in addition to a reminder of the existence of a legal guarantee of conformity for goods, the existence and the conditions of after-sales services and commercial guarantees, where applicable;


    (f)


    the duration of the contract, where applicable, or, if the contract is of indeterminate duration or is to be extended automatically, the conditions for terminating the contract;


    (g)


    where applicable, the functionality, including applicable technical protection measures, of digital content;


    (h)


    where applicable, any relevant interoperability of digital content with hardware and software that the trader is aware of or can reasonably be expected to have been aware of.


    2.   Paragraph 1 shall also apply to contracts for the supply of water, gas or electricity, where they are not put up for sale in a limited volume or set quantity, of district heating or of digital
    content which is not supplied on a tangible medium.


    3.   Member States shall not be required to apply paragraph 1 to contracts which involve day-to-day transactions and which are performed immediately at the time of their conclusion.


    4.   Member States may adopt or maintain additional pre-contractual information requirements for contracts to which this Article applies.'
- id: art-10
  title: CHAPTER III
  text: 'CHAPTER III


    CONSUMER INFORMATION AND RIGHT OF WITHDRAWAL FOR DISTANCE AND OFF-PREMISES CONTRACTS'
- id: art-11
  title: Article 6
  text: 'Article 6


    Information requirements for distance and off-premises contracts


    1.   Before the consumer is bound by a distance or off-premises contract, or any corresponding offer, the trader shall provide the consumer with the following information in a clear and comprehensible
    manner:


    (a)


    the main characteristics of the goods or services, to the extent appropriate to the medium and to the goods or services;


    (b)


    the identity of the trader, such as his trading name;


    (c)


    the geographical address at which the trader is established and the trader’s telephone number, fax number and e-mail address, where available, to enable the consumer to contact the trader quickly and
    communicate with him efficiently and, where applicable, the geographical address and identity of the trader on whose behalf he is acting;


    (d)


    if different from the address provided in accordance with point (c), the geographical address of the place of business of the trader, and, where applicable, that of the trader on whose behalf he is
    acting, where the consumer can address any complaints;


    (e)


    the total price of the goods or services inclusive of taxes, or where the nature of the goods or services is such that the price cannot reasonably be calculated in advance, the manner in which the price
    is to be calculated, as well as, where applicable, all additional freight, delivery or postal charges and any other costs or, where those charges cannot reasonably be calculated in advance, the fact
    that such additional charges may be payable. In the case of a contract of indeterminate duration or a contract containing a subscription, the total price shall include the total costs per billing period.
    Where such contracts are charged at a fixed rate, the total price shall also mean the total monthly costs. Where the total costs cannot be reasonably calculated in advance, the manner in which the price
    is to be calculated shall be provided;


    (f)


    the cost of using the means of distance communication for the conclusion of the contract where that cost is calculated other than at the basic rate;


    (g)


    the arrangements for payment, delivery, performance, the time by which the trader undertakes to deliver the goods or to perform the services and, where applicable, the trader’s complaint handling policy;


    (h)


    where a right of withdrawal exists, the conditions, time limit and procedures for exercising that right in accordance with Article 11(1), as well as the model withdrawal form set out in Annex I(B);


    (i)


    where applicable, that the consumer will have to bear the cost of returning the goods in case of withdrawal and, for distance contracts, if the goods, by their nature, cannot normally be returned by
    post, the cost of returning the goods;


    (j)


    that, if the consumer exercises the right of withdrawal after having made a request in accordance with Article 7(3) or Article 8(8), the consumer shall be liable to pay the trader reasonable costs in
    accordance with Article 14(3);


    (k)


    where a right of withdrawal is not provided for in accordance with Article 16, the information that the consumer will not benefit from a right of withdrawal or, where applicable, the circumstances under
    which the consumer loses his right of withdrawal;


    (l)


    a reminder of the existence of a legal guarantee of conformity for goods;


    (m)


    where applicable, the existence and the conditions of after sale customer assistance, after-sales services and commercial guarantees;


    (n)


    the existence of relevant codes of conduct, as defined in point (f) of Article 2 of Directive 2005/29/EC, and how copies of them can be obtained, where applicable;


    (o)


    the duration of the contract, where applicable, or, if the contract is of indeterminate duration or is to be extended automatically, the conditions for terminating the contract;


    (p)


    where applicable, the minimum duration of the consumer’s obligations under the contract;


    (q)


    where applicable, the existence and the conditions of deposits or other financial guarantees to be paid or provided by the consumer at the request of the trader;


    (r)


    where applicable, the functionality, including applicable technical protection measures, of digital content;


    (s)


    where applicable, any relevant interoperability of digital content with hardware and software that the trader is aware of or can reasonably be expected to have been aware of;


    (t)


    where applicable, the possibility of having recourse to an out-of-court complaint and redress mechanism, to which the trader is subject, and the methods for having access to it.


    2.   Paragraph 1 shall also apply to contracts for the supply of water, gas or electricity, where they are not put up for sale in a limited volume or set quantity, of district heating or of digital
    content which is not supplied on a tangible medium.


    3.   In the case of a public auction, the information referred to in points (b), (c) and (d) of paragraph 1 may be replaced by the equivalent details for the auctioneer.


    4.   The information referred to in points (h), (i) and (j) of paragraph 1 may be provided by means of the model instructions on withdrawal set out in Annex I(A). The trader shall have fulfilled the
    information requirements laid down in points (h), (i) and (j) of paragraph 1 if he has supplied these instructions to the consumer, correctly filled in.


    5.   The information referred to in paragraph 1 shall form an integral part of the distance or off-premises contract and shall not be altered unless the contracting parties expressly agree otherwise.


    6.   If the trader has not complied with the information requirements on additional charges or other costs as referred to in point (e) of paragraph 1, or on the costs of returning the goods as referred
    to in point (i) of paragraph 1, the consumer shall not bear those charges or costs.


    7.   Member States may maintain or introduce in their national law language requirements regarding the contractual information, so as to ensure that such information is easily understood by the consumer.


    8.   The information requirements laid down in this Directive are in addition to information requirements contained in Directive 2006/123/EC and Directive 2000/31/EC and do not prevent Member States
    from imposing additional information requirements in accordance with those Directives.


    Without prejudice to the first subparagraph, if a provision of Directive 2006/123/EC or Directive 2000/31/EC on the content and the manner in which the information is to be provided conflicts with a
    provision of this Directive, the provision of this Directive shall prevail.


    9.   As regards compliance with the information requirements '
