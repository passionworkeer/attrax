    Official Journal of'
  text: 'L_2016081EN.01009901.xml


    31.3.2016


    EN


    Official Journal of the European Union


    L 81/99


    REGULATION (EU) 2016/426 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 9 March 2016



    on appliances burning gaseous fuels and repealing Directive 2009/142/EC


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 114 thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    Directive 2009/142/EC of the European Parliament and of the Council

    (

    3

    )

    lays down rules for the placing on the market and the putting into service of appliances burning gaseous fuels (‘appliances’).


    (2)


    Directive 2009/142/EC is based on the ‘new approach’ principles, as set out in the Council Resolution of 7 May 1985 on a new approach to technical harmonisation and standards

    (

    4

    )

    . Thus, it sets out only the essential requirements applying to appliances, whereas technical details are adopted by the European Committee for Standardisation (CEN) and the European Committee for Electrotechnical
    Standardisation (Cenelec) in accordance with Regulation (EU) No 1025/2012 of the European Parliament and of the Council

    (

    5

    )

    . Conformity with the harmonised standards so set, the reference numbers of which are published in the

    Official Journal of the European Union

    , provides a presumption of conformity with the requirements of Directive 2009/142/EC. Experience has shown that those basic principles have worked well in that sector and should be maintained and even
    further promoted.


    (3)


    Experience acquired from the implementation of Directive 2009/142/EC has shown the need to modify some of its provisions in order to clarify and update them and thus ensure legal certainty as regards
    the definitions relating to its scope, the content of the Member States'' communications of the types of gas and corresponding supply pressures used on their territory and certain essential requirements.


    (4)


    Since the scope, essential requirements and conformity assessment procedures have to be identical in all Member States, there is almost no flexibility in transposing a directive based on the new approach
    principles into national law. In order to simplify the regulatory framework, Directive 2009/142/EC should be replaced by a regulation, which is the appropriate legal instrument as it imposes clear and
    detailed rules which do not give room for divergent transposition by Member States and thus ensures uniform implementation throughout the Union.


    (5)


    Decision No 768/2008/EC of the European Parliament and of the Council

    (

    6

    )

    lays down common principles and reference provisions intended to apply across sectoral legislation in order to provide a coherent basis for revision or recasts of that legislation. In order to ensure
    consistency with other sectoral product legislation, Directive 2009/142/EC should be adapted to that Decision.


    (6)


    Regulation (EC) No 765/2008 of the European Parliament and of the Council

    (

    7

    )

    lays down rules on the accreditation of conformity assessment bodies, provides a framework for the market surveillance of products and for controls on products from third countries, and lays down the
    general principles of the CE marking.


    (7)


    The scope of this Regulation should reflect the scope of Directive 2009/142/EC. This Regulation should apply to domestic and non-domestic appliances intended for a number of specified applications and
    to fittings designed to be incorporated into such appliances.


    (8)


    This Regulation covers appliances and fittings which are new to the Union market when they are placed on the market; that is to say, they are either new appliances and fittings made by a manufacturer
    established in the Union or appliances and fittings, whether new or second-hand, imported from a third country.


    (9)


    Appliances possessing a historic or artistic value within the meaning of Article 36 of the Treaty on the Functioning of the European Union (TFEU) and not put into service, such as antique and other
    appliances serving exhibition or collection purposes, should not be considered as appliances covered by this Regulation.


    (10)


    This Regulation should apply to all forms of supply, including distance selling.


    (11)


    This Regulation should aim to ensure the functioning of the internal market of appliances and of fittings as regards gas safety risks and energy efficiency.


    (12)


    This Regulation should not apply in respect of aspects covered more specifically by other Union harmonisation legislation. This includes the measures adopted pursuant to Directive 2009/125/EC of the
    European Parliament and of the Council

    (

    8

    )

    .


    (13)


    This Regulation should prevent Member States from imposing stricter requirements on health, safety and energy conservation which would prohibit, restrict or impede the making available on the market
    and the putting into service of appliances which comply with this Regulation. However, this should not affect the possibility for Member States, when implementing other Union acts, to impose requirements
    which affect the energy efficiency of products, including appliances, as long as such measures are compatible with the TFEU.


    (14)


    Directive 2009/28/EC of the European Parliament and of the Council

    (

    9

    )

    requires Member States to introduce in their building regulations and codes appropriate measures in order to increase the share of all kinds of energy from renewable sources in the building sector.
    Directive 2010/31/EU of the European Parliament and of the Council

    (

    10

    )

    requires Member States to set minimum energy performance requirements for buildings and building elements and system requirements in respect of the overall energy performance of the technical building
    systems which are installed in existing buildings. Directive 2012/27/EU of the European Parliament and of the Council

    (

    11

    )

    requires Member States to take sufficient measures to progressively reduce energy consumption in different areas, including in buildings.


    (15)


    This Regulation should not affect the obligation for Member States to adopt measures with respect to the promotion of the use of energy from renewable sources and to the energy efficiency of buildings,
    in accordance with Directives 2009/28/EC, 2010/31/EU and 2012/27/EU. It is consistent with the objectives of those Directives that national measures may in certain circumstances limit the installation
    of appliances which comply with the rational use of energy requirement of this Regulation, provided that such measures do not constitute an unjustifiable market barrier.


    (16)


    Member States should take the necessary steps to ensure that appliances are made available on the market and put into service only where they do not compromise the health and safety of persons, domestic
    animals or property, when normally used.


    (17)


    This Regulation should not affect the Member States'' entitlement to lay down rules concerning commissioning or periodic inspections of appliances or other measures such as installer training or certification,
    in order to ensure the correct installation, use and maintenance of appliances, including precautionary safety measures. Those rules and measures are essential in preventing gas poisoning, including
    from carbon monoxide (CO), and the leakage of any substances harmful to health and safety.


    (18)


    This Regulation should not affect the Member States'' entitlement to lay down requirements as they may deem necessary concerning installation aspects, space ventilation conditions and aspects relating
    to the safety of the building itself and its energy performance, provided that those requirements do not impose design requirements on appliances.


    (19)


    As this Regulation does not cover risks caused by appliances in the case of incorrect installation, maintenance or use, Member States should be encouraged to take measures to ensure that the public
    is made aware of the health and safety risks related to combustion products and the need for proper precautionary safety measures, inter alia in relation to emissions of carbon monoxide.


    (20)


    Although this Regulation does not regulate the gas supply conditions in the Member States, it should take into account the fact that different conditions as regards types of gas and supply pressures
    are in force in the Member States in the absence of harmonisation of the technical characteristics of the gaseous fuel. The composition and specifications of the types of gas and the supply pressures
    at the place where an appliance is put into service is very important for its safe and correct functioning, therefore that aspect should be taken into consideration at the design phase of the appliance
    in order to ensure its compatibility with the gas type(s) and supply pressure(s) it is intended for.


    (21)


    In order to avoid barriers to trade with regard to appliances on grounds relating to the fact that the gas supply conditions are not yet harmonised and to ensure that economic operators are sufficiently
    informed, Member States should communicate to the other Member States and to the Commission the types of gas and corresponding supply pressures used on their territory and any changes thereof in good
    time.


    (22)


    The communication of the gas types and supply pressures by Member States should contain the necessary information for economic operators. In that framework, the primary source of the gaseous fuel supplied
    is not relevant for the characteristics, the performance and the compatibility of appliances with the communicated gas supply conditions.


    (23)


    When determining the gas families and gas groups used on their territory, Member States are encouraged to take into account the ongoing standardisation work concerning gas qualities and thus ensure,
    across the Union, a coherent and coordinated approach towards harmonisation of gaseous fuels via standardisation.


    (24)


    When, in accordance with Directive 2009/73/EC of the European Parliament and of the Council

    (

    12

    )

    and the ongoing standardisation work of CEN on gas quality specifications, Member States take concrete measures for a wider use of biogas by injecting such gas into the gas distribution network or by
    distributing such gas through isolated systems, they should ensure that they update in a timely manner their communication of the types of gas in the event that the quality of the supplied gas does
    not remain within the already communicated quality range.


    (25)


    When Member States establish their national action plans in accordance with Directive 2009/28/EC in order to comply with their obligation to increase the percentage of renewable energies and in particular
    biogas in the total energy consumption, they are encouraged to consider the possibilities of injecting such gases into the gas distribution network.


    (26)


    Member States should take the necessary measures to ensure that the gas supply conditions do not constitute barriers to trade and that they do not restrict the putting into service of appliances that
    are compatible with the local gas supply conditions.


    (27)


    Appliances covered by this Regulation and complying with it should benefit from the principle of free movement of goods. Such appliances should be allowed to be put into service provided that they are
    compatible with the local gas supply conditions.


    (28)


    The appliance category marking indicated on the appliance or its data plate establishes a direct link with the gas families and/or gas groups for which an appliance has been designed to burn safely
    at the desired performance level and thus ensures the compatibility of the appliance with the local gas supply conditions.


    (29)


    The essential requirements laid down in this'
- id: art-2
  title: CHAPTER I
  text: 'CHAPTER I


    GENERAL PROVISIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Scope


    1.   This Regulation applies to appliances and fittings.


    2.   For the purposes of this Regulation, an appliance is considered to be ‘normally used’ where the following conditions are met:


    (a)


    it is correctly installed and regularly serviced in accordance with the manufacturer''s instructions;


    (b)


    it is used with a normal variation in the gas quality and a normal fluctuation in the supply pressure as set out by Member States in their communication pursuant to Article 4(1);


    (c)


    it is used in accordance with its intended purpose or in a way which can be reasonably foreseen.


    3.   This Regulation does not apply to appliances specifically designed:


    (a)


    for use in industrial processes carried out on industrial premises;


    (b)


    for use on aircrafts and railways;


    (c)


    for research purposes for temporary use in laboratories.


    For the purposes of this paragraph, an appliance is considered to be ‘specifically designed’ when the design is only intended to address a specific need for a specific process or use.


    4.   Where, for appliances or fittings, the aspects covered by this Regulation are covered more specifically by other acts of Union harmonisation legislation, this Regulation does not apply or ceases
    to apply to such appliances or fittings in respect of those aspects.


    5.   The rational use of energy essential requirement laid down in point 3.5 of Annex I to this Regulation does not apply to appliances covered by a measure adopted pursuant to Article 15 of Directive 2009/125/EC.


    6.   This Regulation shall not affect the obligation upon Member States to adopt measures with respect to the promotion of the use of energy from renewable sources and to the energy efficiency of buildings,
    in accordance with Directives 2009/28/EC, 2010/31/EU and 2012/27/EU. Such measures shall be compatible with the TFEU.'
- id: art-4
  title: Article 2
  text: 'Article 2


    Definitions


    For the purposes of this Regulation the following definitions apply:


    (1)


    ‘appliances’ means appliances burning gaseous fuels used for cooking, refrigeration, air-conditioning, space heating, hot water production, lighting or washing, and also forced draught burners and heating
    bodies to be equipped with such burners;


    (2)


    ‘fittings’ means safety devices, controlling devices or regulating devices and sub-assemblies thereof, designed to be incorporated into an appliance or to be assembled to constitute an appliance;


    (3)


    ‘burning’ means a process in which gaseous fuel reacts with oxygen producing heat or light;


    (4)


    ‘washing’ means the entire washing process, including drying and ironing;


    (5)


    ‘cooking’ means the art or practice of preparing or warming food for consumption with the use of heat and employing a wide range of methods;


    (6)


    ‘gaseous fuel’ means any fuel which is in a gaseous state at a temperature of 15 °C under an absolute pressure of 1 bar;


    (7)


    ‘industrial process’ means the extraction, growth, refining, processing, production, manufacture or preparation of materials, plants, livestock, animal products, food or other products with a view to
    their commercial use;


    (8)


    ‘industrial premises’ means any place where the main activity carried out is an industrial process that would be subject to specific national health and safety regulations;


    (9)


    ‘gas family’ means a group of gaseous fuels with similar burning behaviour linked together by a range of Wobbe indices;


    (10)


    ‘gas group’ means a specified range of Wobbe indices within that of the gas family concerned;


    (11)


    ‘Wobbe index’ means an indicator of the interchangeability of fuel gases used to compare the combustion energy output of different composition fuel gases in an appliance;


    (12)


    ‘appliance category’ means the identification of gas families and/or gas groups that an appliance is designed to burn safely and at the desired performance level, as indicated by the appliance category
    marking;


    (13)


    ‘energy efficiency’ means the ratio of output of performance of an appliance to input of energy;


    (14)


    ‘making available on the market’ means any supply of an appliance or a fitting for distribution or use on the Union market in the course of a commercial activity, whether in return for payment or free
    of charge;


    (15)


    ‘placing on the market’ means the first making available of an appliance or a fitting on the Union market;


    (16)


    ‘putting into service’ means the first use of an appliance in the Union by its end-user;


    (17)


    ‘manufacturer’ means any natural or legal person who manufactures an appliance or a fitting or who has an appliance or a fitting designed or manufactured, and markets that appliance or fitting under
    his name or trademark or uses the appliance for his own purposes;


    (18)


    ‘authorised representative’ means any natural or legal person established within the Union who has received a written mandate from a manufacturer to act on his behalf in relation to specified tasks;


    (19)


    ‘importer’ means any natural or legal person established within the Union who places an appliance or a fitting from a third country on the Union market;


    (20)


    ‘distributor’ means any natural or legal person in the supply chain, other than the manufacturer or the importer, who makes an appliance or a fitting available on the market;


    (21)


    ‘economic operators’ means the manufacturer, the authorised representative, the importer and the distributor;


    (22)


    ‘technical specification’ means a document that prescribes technical requirements to be fulfilled by an appliance or a fitting;


    (23)


    ‘harmonised standard’ means a harmonised standard as defined in point (c) of point 1 of Article 2 of Regulation (EU) No 1025/2012;


    (24)


    ‘accreditation’ means accreditation as defined in point 10 of Article 2 of Regulation (EC) No 765/2008;


    (25)


    ‘national accreditation body’ means a national accreditation body as defined in point 11 of Article 2 of Regulation (EC) No 765/2008;


    (26)


    ‘conformity assessment’ means the process demonstrating whether the essential requirements of this Regulation relating to an appliance or a fitting have been fulfilled;


    (27)


    ‘conformity assessment body’ means a body that performs conformity assessment activities including calibration, testing, certification and inspection;


    (28)


    ‘recall’ means any measure aimed at achieving the return of an appliance that has already been made available to the end-user or of a fitting that has already been made available to an appliance manufacturer;


    (29)


    ‘withdrawal’ means any measure aimed at preventing an appliance or a fitting in the supply chain from being made available on the market;


    (30)


    ‘Union harmonisation legislation’ means any Union legislation harmonising the conditions for the marketing of products;


    (31)


    ‘CE marking’ means a marking by which the manufacturer indicates that the appliance or the fitting is in conformity with the applicable requirements set out in Union harmonisation legislation providing
    for its affixing.'
- id: art-5
  title: Article 3
  text: 'Article 3


    Making available on the market and putting into service


    1.   Appliances shall only be made available on the market and put into service if, when normally used, they comply with this Regulation.


    2.   Fittings shall only be made available on the market if they comply with this Regulation.


    3.   This Regulation shall not affect Member States'' entitlement to lay down such requirements as they may deem necessary to ensure that persons, domestic animals and property are protected during
    the normal use of the appliances, provided that this does not mean modifications to the appliances.'
- id: art-6
  title: Article 4
  text: 'Article 4


    Gas supply conditions


    1.   By 21 October 2017, Member States shall communicate to the Commission and the other Member States in accordance with Annex II and using the relevant form the types of gas and corresponding supply
    pressures of gaseous fuels used on their territory. They shall communicate any changes thereof within six months after the announcement of the envisaged changes.


    2.   The Commission shall be empowered to adopt delegated acts in accordance with Article 41 concerning modifications to the content of the Member States'' communications of the gas supply conditions
    on their territory, as set out in Annex II, in order to take into account the technical developments with regard to the gas supply conditions.


    3.   The Commission may, by means of implementing acts, define the harmonised form of the Member States'' communications referred to in paragraph 1 of this Article. Those implementing acts shall be
    adopted in accordance with the examination procedure referred to in Article 42(3).


    4.   The Commission shall ensure that the information provided by Member States in accordance with paragraph 1 is published in the

    Official Journal of the European Union

    .'
- id: art-7
  title: Article 5
  text: 'Article 5


    Essential requirements


    Appliances and fittings shall meet the essential requirements set out in Annex I which apply to them.'
- id: art-8
  title: Article 6
  text: 'Article 6


    Free movement


    1.   Member States shall not, on grounds relating to the aspects covered by this Regulation, prohibit, restrict or impede the making available on the market and the putting into service of appliances
    which comply with this Regulation.


    2.   Member States shall not, on grounds relating to the risks covered by this Regulation, prohibit, restrict or impede the making available on the market of fittings which comply with this Regulation.


    3.   At trade fairs, exhibitions, demonstrations or similar events, Member States shall not prevent the showing of appliances or fittings which do not comply with this Regulation, provided that a visible
    sign clearly indicates that such appliances or fittings do not comply with this Regulation and that they are not for sale until they have been brought into conformity. During demonstrations, adequate
    safety measures shall be taken to ensure the protection of persons, domestic animals and property.'
- id: art-9
  title: CHAPTER II
  text: 'CHAPTER II


    OBLIGATIONS OF ECONOMIC OPERATORS'
- id: art-10
  title: Article 7
  text: 'Article 7


    Obligations of manufacturers


    1.   When placing their appliances or fittings on the market or when using the appliances for their own purposes, manufacturers shall ensure that they have been designed and manufactured in accordance
    with the essential requirements set out in Annex I.


    2.   Manufacturers shall draw up the technical documentation referred to in Annex III (‘technical documentation’) and carry out the relevant conformity assessment procedure referred to in Article 14
    or have it carried out.


    Where compliance of an appliance or a fitting with the applicable requirements has been demonstrated by the procedure referred to in the first subparagraph, manufacturers shall draw up an EU declaration
    of conformity and affix the CE marking.


    3.   Manufacturers shall keep the technical documentation and the EU declaration of conformity for 10 years after the appliance or the fitting has been placed on the market.


    4.   Manufacturers shall ensure that procedures are in place for series production to remain in conformity with this Regulation. Changes in appliance or fitting design or characteristics and changes
    in the harmonised standards or in other technical specifications by reference to which the conformity of the appliance or the fitting is declared shall be adequately taken into account.


    When deemed appropriate with regard to the risks presented by an appliance, manufacturers shall, to protect the health and safety of consumers and other users, carry out sample testing of appliances
    made available on the market, investigate, and, if necessary, keep a register of complaints, of non-conforming appliances and fittings and recalls of such appliances and fittings, and shall keep distributors
    informed of any such monitoring.


    5.   Manufacturers shall ensure that their appliances and fittings bear a type, batch or serial number or other element allowing their identification, and the inscriptions provided for in Annex IV.


    Where the size or nature of the appliance or the fitting does not allow it, manufacturers shall ensure that the required information is provided on the packaging or in a document accompanying the appliance
    or the fitting.


    6.   Manufacturers shall indicate on the appliance their name, registered trade name or registered trade mark, and the postal address at which they can be contacted or, where that is not possible, on
    the packaging or in a document accompanying the appliance. The address shall indicate a single point at which the manufacturer can be contacted. The contact details shall be in a language easily understood
    by consumers and other end-users and the market surveillance authorities.


    Manufacturers shall indicate on the fitting their name, registered trade name or registered trade mark, and the postal address at which they can be contacted or, where that is not possible, on the packaging
    or in a document accompanying the fitting. The address shall indicate a single point at which the manufacturer can be contacted. The contact details shall be in a language easily understood by appliance
    manufacturers and the market surveillance authorities.


    7.   Manufacturers shall ensure that the appliance is accompanied by instructions and safety information in accordance with point 1.5 of Annex I, in a language which can be easily understood by consumers
    and other end-users, as determined by the Member State concerned. Such instructions and safety information, as well as any labelling, shall be clear, understandable and intelligible.


    Manufacturers shall ensure that the fitting is accompanied by a copy of the EU declaration of conformity containing, inter alia, instructions for incorporation or assembly, adjustment, operation and
    maintenance in accordance with point 1.7 of Annex I, in a language which can be easily understood by appliance manufacturers, as determined by the Member State concerned.


    However, where a large number of fittings are delivered to a single user, the batch or consignment concerned may be accompanied by a single copy of the EU declaration of conformity.


    8.   Manufacturers who consider or have reason to believe that an appliance or a fitting which they have placed on the market is not in conformity with this Regulation shall immediately take the corrective
    measures necessary to bring that appliance or fitting into conformity, to withdraw it or recall it, if appropriate. Furthermore, where the appliance or the fitting presents a risk, manufacturers shall
    immediately inform the competent national authorities of the Member States in which they made the appliance or the fitting available on the market to that effect, giving details, in particular, of the
    non-compliance and of any corrective measures taken.


    9.   Manufacturers shall, further to a reasoned request from a competent national authority, provide it with all the information and documentation necessary to demonstrate the conformity of the appliance
    or the fitting with this Regulation, in a language which can be easily understood by that authority. That information and documentation may be provided in paper or electronic form. They shall cooperate
    with that authority, at its request, on any action taken to eliminate the risks posed by appliances or fittings which they have placed on the market.'
- id: art-11
  title: Article 8
  text: 'Article 8


    Authorised representatives


    1.   A manufacturer may, by a written mandate, appoint an authorised representative.


    The obligations laid down in Article 7(1) and the obligation to draw up technical documentation shall not form part of the authorised representative''s mandate.


    2.   An authorised representative shall perform the tasks specified in the mandate received from the manufacturer. The mandate shall allow the authorised representative to do at least the following:


    (a)


    keep the EU declaration of conformity and the technical documentation at the disposal of national market surveillance authorities for 10 years after the appliance or the fitting has been placed on the
    market;


    (b)


    further to a reasoned request from a competent national authority, provide that authority with all the information and documentation necessary to demonstrate the conformity of the appliance or the fitting;


    (c)


    cooperate with the competent national authorities, at their request, on any action taken to eliminate the risks posed by appliances or fittings covered by the authorised representative''s mandate.'
- id: art-12
  title: Article 9
  text: 'Article 9


    Obligations of importers


    1.   Importers shall place only compliant appliances or fittings on the market.


    2.   Before placing an appliance on the market, importers shall ensure that the appropriate conformity assessment procedure referred to in Article 14 has been carried out by the manufacturer. They shall
    ensure that the manufacturer has drawn up the technical documentation, that the appliance bears the CE marking and is accompanied by instructions and safety information in accordance with point 1.5
    of Annex I, and that the manufacturer has complied with the requirements set out in Article 7(5) and (6).


    Before placing a fitting on the market, importers shall ensure that the appropriate conformity assessment procedure referred to in Article 14 has been carried out by the manufacturer. They shall ensure
    that the manufacturer has drawn up the technical documentation, that the fitting bears the CE marking and is accompanied by a copy of the EU declaration of conformity containing, inter alia, instructions
    for incorporation or assembly, adjustment, operation and maintenance in accordance with point 1.7 of Annex I, and that the manufacturer has complied with the requirements set out in Article 7(5) and
    (6).


    Where an importer considers or has reason to believe that an appliance or a fitting is not in conformity with the essential requirements set out in Annex I, he shall not place the appliance or the fitting
    on the market until it has been brought into conformity. Furthermore, where the appliance or the fitting presents a risk, the importer shall inform the manufacturer and the market surveillance authorities
    to that effect.


    3.   Importers shall indicate on the appliance their name, registered trade name or registered trade mark, and the postal address at which they can be contacted or, where that is not possible, on its
    packaging or in a document accompanying the appliance. The contact details shall be in a language easily understood by consumers and other end-users and the market surveillance authorities.


    Importers shall indicate on the fitting their name, registered trade name or registered trade mark, and the postal address at which they can be contacted or, where that is not possible, on its packaging
    or in a document accompanying the fitting. The contact details shall be in a language easily understood by appliance manufacturers and the market surveillance authorities.


    4.   Importers shall ensure that the appliance is accompanied by instructions and safety information in accordance with point 1.5 of Annex I, in a language which can be easily understood by consumers
    and other end-users, as determined by the Member State concerned.


    Importers shall ensure that the fitting is accompanied by a copy of the EU declaration of conformity containing, inter alia, instructions for incorporation or assembly, adjustment, operation and maintenance
    in accordance with point 1.7 of Annex I, in a language which can be easily understood by appliance manufacturers, as determined by the Member State concerned.


    5.   Importers shall ensure that, while an appliance or a fitting is under their responsibility, storage or transport conditions do not jeopardise its compliance with the essential requirements set
    out in Annex I.


    6.   When deemed appropriate with regard to the risks presented by an appliance, importers shall, to protect the health and safety of consumers and other users, carry out sample testing of appliances
    made available on the market, investigate, and, if necessary, keep a register of complaints, of non-conforming appliances and fittings and recalls of such appliances and fittings, and shall keep distributors
    informed of any s'
