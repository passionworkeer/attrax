  title: Article 110 of Directive (EU) 2018/1972 requires Member States to ensure that their public warning systems transmit public warnings to end-users concerned, namely end-users who are located in the
    geog
  text: 'Article 110 of Directive (EU) 2018/1972 requires Member States to ensure that their public warning systems transmit public warnings to end-users concerned, namely end-users who are located in the
    geographic areas potentially being affected by imminent or developing major emergencies and disasters during the warning period, including roaming end-users. Currently available technologies enable
    national authorities to send public warnings to concerned roaming customers without the need for prior action by the roaming customer, such as downloading an application. However, in some Member States,
    public warning mobile applications which allow sending rich information to end-users are deployed, sometimes in addition to the previously mentioned technologies. In the Member States where the link
    to such a national public warning mobile application is provided in the database of the means of access to emergency services that are mandated in each Member State established pursuant to this Regulation,
    roaming providers should inform roaming customers of the link to that application. The information should be provided in the language in which the roaming provider communicates with the roaming customer.
    With reference to the preamble to Directive (EU) 2018/1972, the Commission will assess possibilities for enabling roaming customers concerned to receive public warnings issued by the competent national
    authorities, including through a mobile application when travelling within the Union, through a Union-wide public warning system that complements national public warning systems.


    (59)


    Numbering ranges, including those used for value-added services, are set in the national numbering plans and are not harmonised at Union level. Operators may therefore not be able to recognise the numbering
    ranges for value-added services in all countries in advance. Numbering ranges used for value-added services are subject to particular pricing conditions at the national level, and in many cases their
    termination rates are not regulated. While this is understood by roaming providers, the level of the wholesale charges they will incur may still be unexpectedly high. In a roaming scenario, operators
    are unable to address this issue because they lack information on numbering ranges used for value-added services throughout the Union. To address this problem, BEREC should establish and maintain a
    single Union-wide, secure database of numbering ranges for value-added services. The database is intended to enhance transparency, enabling national regulatory authorities and, where applicable, other
    competent authorities, as well as operators, to have direct access to information about which numbering ranges can generate higher costs (termination rates) in all Member States. It represents a necessary
    intermediate step to increase transparency at retail level as it could be used to inform roaming customers about the types of services that may be subject to increased charges when roaming. With a view
    to providing better consumer protection and transparency, it should be possible for the database to contain additional information, for example about the tariffs associated with numbering ranges for
    value-added services, such as per minute or per act tariffs. Such tariff information could be made available on the dedicated webpage providing information about value-added services. BEREC should establish
    the procedures by which competent authorities are to provide and update the information in the database of numbering ranges for value-added services established pursuant to this Regulation.


    (60)


    BEREC should establish and maintain a single Union-wide database of means of access to emergency services that are mandated and are technically feasible to be used by roaming end-users in each Member
    State. The database is intended to help national operators, national regulatory authorities and, where applicable, other competent authorities to be informed of all these means of access to emergency
    services deployed in the Union. Member States should be able to update the database with the link to the national public warning mobile application, if applicable. BEREC should establish the procedures
    by which the competent authorities are to provide and update the information requested pursuant to this Regulation.


    (61)


    Where Member States assign to competent authorities other than national regulatory authorities some of the tasks related to end-user protection, for instance regarding information requirements for retail
    contracts, transparency, or contract termination, the competence of those competent authorities for those tasks covers all parts of the retail contract, including the roaming related rights and obligations.
    Without prejudice to the assignment of tasks under Directive (EU) 2018/1972, the national regulatory authorities and, where applicable, other competent authorities which are responsible for carrying
    out tasks under that Directive should have the powers needed to monitor, supervise and enforce the obligations under this Regulation within their territory. They should also monitor developments in
    the pricing of voice, SMS and data services for roaming customers within the Union including, where appropriate, the specific costs related to roaming calls made and received in the outermost regions
    of the Union and the need to ensure that these costs can be adequately recovered on the wholesale market, and that traffic-steering techniques are not used to limit choice to the detriment of customers.
    They should ensure that up-to-date information on the application of this Regulation is made available to interested parties and publish the results of such monitoring. Information should be provided
    on corporate, post-paid and pre-paid customers separately.


    (62)


    In-country roaming in the outermost regions of the Union, where mobile telephony licences are distinct from those issued in respect of the rest of the national territory, could benefit from rate reductions
    equivalent to those practised on the internal market for roaming services. The implementation of this Regulation should not give rise to less favourable pricing treatment for customers using in-country
    roaming services as opposed to customers using Union-wide roaming services. To that end, the national authorities may take additional measures consistent with Union law.


    (63)


    While ensuring business confidentiality and in order to monitor and supervise the application of this Regulation and developments in wholesale roaming markets, national regulatory authorities should
    be entitled to require information on wholesale roaming agreements that do not provide for the application of the maximum wholesale roaming charges. Those authorities should also be allowed to require
    information on the adoption and application of conditions in wholesale roaming agreements aiming to prevent permanent roaming and any anomalous or abusive use of wholesale roaming access for purposes
    other than the provision of regulated roaming services to roaming providers’ customers travelling within the Union.


    (64)


    Where Union providers of mobile services find the benefits of interoperability and end-to-end connectivity for their customers jeopardised by the termination, or threat of termination, of their roaming
    arrangements with mobile network operators in another Member State or where they are unable to provide their customers with services in another Member State as a result of a lack of agreement with at
    least one wholesale network provider, national regulatory authorities, or other competent authorities in the situations referred to under Article 61(2), points (b) and (c) of Directive (EU) 2018/1972,
    should make use, where necessary, of the powers under Article 61 of that Directive to ensure adequate access and interconnection, taking into account the objectives set out in Article 3 of that Directive,
    in particular the development of the internal market by favouring the pr'
