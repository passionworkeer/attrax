  text: 'L_2017198EN.01000101.xml


    28.7.2017


    EN


    Official Journal of the European Union


    L 198/1


    REGULATION (EU) 2017/1369 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 4 July 2017



    setting a framework for energy labelling and repealing Directive 2010/30/EU


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 194(2) thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    After consulting the Committee of the Regions,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    The Union is committed to building an Energy Union with a forward looking climate policy. Energy efficiency is a crucial element of the Union''s 2030 Climate and Energy Policy Framework and is key to
    moderating energy demand.


    (2)


    Energy labelling enables customers to make informed choices based on the energy consumption of energy-related products. Information on efficient and sustainable energy-related products makes a significant
    contribution to energy savings and to reducing energy bills, while at the same time promoting innovation and investments into the production of more energy efficient products. Improving the efficiency
    of energy-related products through informed customer choice and harmonising related requirements at Union level benefits also manufacturers, industry and the Union economy overall.


    (3)


    The Commission reviewed the effectiveness of Directive 2010/30/EU of the European Parliament and of the Council

    (

    3

    )

    and identified the need to update the energy labelling framework to improve its effectiveness.


    (4)


    It is appropriate to replace Directive 2010/30/EU by a Regulation which maintains essentially the same scope, but modifies and enhances some of its provisions in order to clarify and update their content,
    taking into account the technological progress for energy efficiency in products achieved over recent years. As the energy consumption of means of transport for persons or goods is directly and indirectly
    regulated by other Union law and policies, it is appropriate to continue to exempt them from the scope of this Regulation, including means of transport with a motor that stays in the same location during
    operation, such as elevators, escalators and conveyor belts.


    (5)


    It is appropriate to clarify that all products placed on the Union market for the first time, including second-hand imported products, should fall under the scope of this Regulation. However, products
    that are made available on the Union market for a second or additional time should not be included.


    (6)


    A Regulation is the appropriate legal instrument as it imposes clear and detailed rules which preclude divergent transposition by Member States and thus ensures a higher degree of harmonisation across
    the Union. A harmonised regulatory framework at Union rather than at Member State level reduces costs for manufacturers, ensures a level playing field and ensures the free movement of goods across the
    internal market.


    (7)


    Moderating energy demand is recognised as a key action in the European Energy Security Strategy set out in the Commission Communication of 28 May 2014. The Energy Union Framework Strategy set out in
    the Commission Communication of 25 February 2015 further emphasised the energy efficiency first principle and the need to fully implement existing Union energy law. The Roadmap for the Energy Union
    Framework Strategy set out in that Communication provided for a review of the energy efficiency framework for products in 2015. This Regulation improves the legislative and enforcement framework for
    energy labelling.


    (8)


    Improving the efficiency of energy-related products through informed customer choice benefits the Union economy, reduces energy demand and saves customers money on energy bills, contributes to innovation
    and investment in energy efficiency, and enables industries which develop and produce the most energy efficient products to gain a competitive advantage. It also contributes to the achievement of the
    Union''s 2020 and 2030 energy-efficiency targets, as well as to the Union''s goals for the environment and climate change. Furthermore, it aims to have a positive impact on the environmental performance
    of the energy-related products and their parts, including use of resources other than energy.


    (9)


    This Regulation contributes to the development, recognition by customers and market uptake of energy smart products, which can be activated to interact with other appliances and systems, including the
    energy grid itself, in order to improve energy efficiency or the uptake of renewable energies, reduce energy consumption and foster innovation in Union industry.


    (10)


    The provision of accurate, relevant and comparable information on the specific energy consumption of energy-related products facilitates the customer''s choice in favour of products which consume less
    energy and other essential resources during use. A standardised mandatory label for energy-related products is an effective means by which to provide potential customers with comparable information
    on the energy efficiency of energy-related products. The label should be supplemented by a product information sheet. The label should be easily recognisable, simple and concise. To that end, the existing
    dark green to red colour scale of the label should be retained as the basis for informing customers about the energy efficiency of products. In order for the label to be of real use for customers looking
    for energy and cost savings, the steps of the label scale should correspond to significant energy and cost savings for customers. For the majority of product groups, the label should, where appropriate,
    also indicate the absolute energy consumption in addition to the label scale, in order to allow customers to predict the direct impact of their choices on their energy bills. However, it is impossible
    to provide the same information with regard to energy-related products that do not themselves consume energy.


    (11)


    The classification using letters from A to G has been shown to be cost effective for customers. It is intended that its uniform application across product groups raises transparency and understanding
    among customers. In situations where because of ecodesign measures pursuant to Directive 2009/125/EC of the European Parliament and of the Council

    (

    4

    )

    products can no longer fall into class ‘E’, ‘F’ or ‘G’, those classes should nonetheless be shown on the label in grey. In exceptional and duly justified cases, such as reaching insufficient savings
    across the full spectrum of the seven classes, the label should be able to contain fewer classes than a regular A to G scale. In those cases the dark green to red colour scale of the label should be
    retained for the remaining classes and should apply only to new products that are placed on the market or put into service.


    (12)


    Where a supplier places a product on the market, each unit of the product should be accompanied by a label in paper form complying with the requirements of the relevant delegated act. The relevant delegated
    act should set out the most effective way of displaying the labels, taking into account the implications for customers, suppliers and dealers, and could provide that the label is printed on the packaging
    of the product. The dealer should display the label supplied together with the unit of the product in the position required by the relevant delegated act. The label displayed should be clearly visible
    and identifiable as the label belonging to the product in question, without the customer having to read the brand name and model number on the label, and should attract the attention of the customer
    browsing through the product displayed.


    (13)


    Without affecting the obligation of the supplier to provide a printed label together with each unit of a product, advances in digital technology could allow for the use of electronic labels in addition
    to the printed energy label. The dealer should also be able to download the product information sheet from the product database.


    (14)


    Where it is not feasible to display the energy label, such as in certain forms of distance selling, visual advertisements and technical promotional material, potential customers should be provided at
    least with the energy class of the product and the range of the efficiency classes available on the label.


    (15)


    Manufacturers respond to the energy label by developing and placing on the market ever more efficient products. In parallel, they tend to discontinue the production of less efficient products, stimulated
    to do so by Union law relating to ecodesign. This technological development leads to the majority of product models populating the highest classes of the energy label. Further product differentiation
    may be necessary to enable customers to compare products properly, leading to the need to rescale labels. This Regulation should therefore lay down detailed arrangements for rescaling in order to maximise
    legal certainty for suppliers and dealers.


    (16)


    For several labels established by delegated acts adopted pursuant to Directive 2010/30/EU, products are available only or mostly in the top classes. This reduces the effectiveness of the labels. The
    classes on existing labels, depending on the product group have varying scales, where the top class can be anything between classes A to A+++. As a result, when customers compare labels across different
    product groups, they could be led to believe that better energy classes exist for a particular label than those that are displayed. To avoid such potential confusion, it is appropriate to carry out,
    as a first step, an initial rescaling of existing labels, in order to ensure a homogeneous A to G scale for three categories of products pursuant to this Regulation.


    (17)


    Energy labelling of space and water heating products was introduced only recently and the rate of technological progress in those product groups is relatively slow. The current labelling scheme makes
    a clear distinction between conventional fossil fuel technologies that are at best class A, and technologies that use renewable energy, which are often significantly more expensive, for which classes
    A+, A++ and A+++ are reserved. Substantial energy savings can already be achieved by the most efficient fossil fuel technologies, which would make it appropriate to continue promoting them as class
    A. As the market for space and water heating products is likely to move slowly towards more renewable technologies, it is appropriate to rescale the energy labels for those products later.


    (18)


    Following initial rescaling, the frequency of further rescaling should be determined by reference to the percentage of products sold that are in the top classes. Further rescaling should take into account
    the speed of technological progress and the need to avoid over burdening suppliers and dealers, and, in particular, small businesses. Therefore, a timescale of approximately 10 years would be desirable
    for the frequency of rescaling. A newly rescaled label should leave the top class empty to encourage technological progress, provide for regulatory stability, limit the frequency of rescaling and enable
    ever more efficient products to be developed and recognised. In exceptional cases, where technology is expected to develop more rapidly, no products should fall within the top two classes at the moment
    of introduction of the newly rescaled label.


    (19)


    Before rescaling, the Commission should carry out an appropriate preparatory study.


    (20)


    When a label for a product group is rescaled, confusion on the part of customers should be avoided by replacing the labels on the'
- id: art-2
  title: Article 1
  text: 'Article 1


    Subject-matter and scope


    1.   This Regulation lays down a framework that applies to energy-related products (‘products’) placed on the market or put into service. It provides for the labelling of those products and the provision
    of standard product information regarding energy efficiency, the consumption of energy and of other resources by products during use and supplementary information concerning products, thereby enabling
    customers to choose more efficient products in order to reduce their energy consumption.


    2.   This Regulation does not apply to:


    (a)


    second-hand products, unless they are imported from a third country;


    (b)


    means of transport for persons or goods.'
- id: art-3
  title: Article 2
  text: 'Article 2


    Definitions


    For the purposes of this Regulation the following definitions apply:


    (1)


    ‘energy-related product’ or ‘product’ means a good or system with an impact on energy consumption during use which is placed on the market or put into service, including parts with an impact on energy
    consumption during use which are placed on the market or put into service for customers and that are intended to be incorporated into products;


    (2)


    ‘product group’ means a group of products which have the same main functionality;


    (3)


    ‘system’ means a combination of several goods which when put together perform a specific function in an expected environment and of which the energy efficiency can then be determined as a single entity;


    (4)


    ‘model’ means a version of a product of which all units share the same technical characteristics relevant for the label and the product information sheet and the same model identifier;


    (5)


    ‘model identifier’ means the code, usually alphanumeric, which distinguishes a specific product model from other models with the same trade mark or the same supplier''s name;


    (6)


    ‘equivalent model’ means a model which has the same technical characteristics relevant for the label and the same product information sheet, but which is placed on the market or put into service by
    the same supplier as another model with a different model identifier;


    (7)


    ‘making available on the market’ means the supply of a product for distribution or use on the Union market in the course of a commercial activity, whether in return for payment or free of charge;


    (8)


    ‘placing on the market’ means the first making available of a product on the Union market;


    (9)


    ‘putting into service’ means the first use of a product for its intended purpose on the Union market;


    (10)


    ‘manufacturer’ means a natural or legal person who manufactures a product or has a product designed or manufactured, and markets that product under its name or trademark;


    (11)


    ‘authorised representative’ means a natural or legal person established in the Union who has received a written mandate from the manufacturer to act on its behalf in relation to specified tasks;


    (12)


    ‘importer’ means a natural or legal person established in the Union who places a product from a third country on the Union market;


    (13)


    ‘dealer’ means a retailer or other natural or legal person who offers for sale, hire, or hire purchase, or displays products to customers or installers in the course of a commercial activity, whether
    or not in return for payment;


    (14)


    ‘supplier’ means a manufacturer established in the Union, the authorised representative of a manufacturer who is not established in the Union, or an importer, who places a product on the Union market;


    (15)


    ‘distance selling’ means the offer for sale, hire or hire purchase by mail order, catalogue, internet, telemarketing or by any other method by which the potential customer cannot be expected to see
    the product displayed;


    (16)


    ‘customer’ means a natural or legal person who buys, hires or receives a product for own use whether or not acting for purposes which are outside its trade, business, craft or profession;


    (17)


    ‘energy efficiency’ means the ratio of output of performance, service, goods or energy to input of energy;


    (18)


    ‘harmonised standard’ means standard as defined in point (c) of Article 2(1) of Regulation (EU) No 1025/2012 of the European Parliament and of the Council

    (

    11

    )

    ;


    (19)


    ‘label’ means a graphic diagram, either in printed or electronic form, including a closed scale using only letters from A to G, each letter representing a class and each class corresponding to energy
    savings, in seven different colours from dark green to red, in order to inform customers about energy efficiency and energy consumption; it includes rescaled labels and labels with fewer classes and
    colours in accordance with Article 11(10) and (11);


    (20)


    ‘rescaling’ means an exercise making the requirements for achieving the energy class on a label for a particular product group more stringent;


    (21)


    ‘rescaled label’ means a label for a particular product group that has undergone rescaling and is distinguishable from labels before rescaling while preserving a visual and perceptible coherence of
    all labels;


    (22)


    ‘product information sheet’ means a standard document containing information relating to a product, in printed or electronic form;


    (23)


    ‘technical documentation’ means documentation sufficient to enable market surveillance authorities to assess the accuracy of the label and the product information sheet of a product, including test
    reports or similar technical evidence;


    (24)


    ‘supplementary information’ means information, as specified in a delegated act, on the functional and environmental performance of a product;


    (25)


    ‘product database’ means a collection of data concerning products, which is arranged in a systematic manner and consists of a consumer-oriented public part, where information concerning individual product
    parameters is accessible by electronic means, an online portal for accessibility and a compliance part, with clearly specified accessibility and security requirements;


    (26)


    ‘verification tolerance’ means the maximum admissible deviation of the measurement and calculation results of the verification tests performed by, or on behalf of, market surveillance authorities, compared
    to the values of the declared or published parameters, reflecting deviation arising from interlaboratory variation.'
- id: art-4
  title: Article 3
  text: 'Article 3


    General obligations of suppliers


    1.   The supplier shall ensure that products that are placed on the market are accompanied, for each individual unit, free of charge, with accurate printed labels and with product information sheets
    in accordance with this Regulation and the relevant delegated acts.


    As an alternative to supplying the product information sheet with the product, delegated acts referred to in point (h) of Article 16(3) may provide that it is sufficient for the supplier to enter the
    parameters of such product information sheet into the product database. In such a case, the supplier shall provide the product information sheet in printed form to the dealer on request.


    Delegated acts may provide that the label is printed on the packaging of the product.


    2.   The supplier shall deliver printed labels, including rescaled labels in accordance with Article 11(13), and product information sheets, to the dealer free of charge, promptly and in any event within
    five working days upon the dealer''s request.


    3.   The supplier shall ensure the accuracy of the labels and product information sheets that it provides and shall produce technical documentation sufficient to enable the accuracy to be assessed.


    4.   Once a unit of a model is in service, the supplier shall request explicit consent from the customer regarding any changes intended to be introduced to the unit by means of updates that would be
    detrimental to the parameters of the energy efficiency label for that unit, as set out in the relevant delegated act. The supplier shall inform the customer of the objective of the update and of the
    changes in the parameters, including any change in the label class. For a period proportionate to the average lifespan of the product, the supplier shall give the customer the option of refusing the
    update without avoidable loss of functionality.


    5.   The supplier shall not place on the market products that have been designed so that a model''s performance is automatically altered in test conditions with the objective of reaching a more favourable
    level for any of the parameters specified in the relevant delegated act or included in any of the documentation provided with the product.'
- id: art-5
  title: Article 4
  text: 'Article 4


    Obligations of suppliers in relation to the product database


    1.   As from 1 January 2019, the supplier shall, before placing on the market a unit of a new model covered by a delegated act, enter in the public and compliance parts of the product database the information
    for that model, as set out in Annex I.


    2.   Where units of models covered by a delegated act are placed on the market between 1 August 2017 and 1 January 2019, the supplier shall, by 30 June 2019, enter in the product database the information
    set out in Annex I in relation to those models.


    Until data entry in the product database, the supplier shall make an electronic version of the technical documentation available for inspection within 10 days of a request received from market surveillance
    authorities or the Commission.


    3.   The supplier may enter in the product database the information for models, as set out in Annex I, the units of which were exclusively placed on the market before 1 August 2017.


    4.   A product for which changes are made that are relevant for the label or the product information sheet shall be considered to be a new model. The supplier shall indicate in the database when it
    no longer places on the market units of a model.


    5.   The obligations referred to in paragraphs 1 and 2 of this Article shall not apply to packages of heaters referred to in Commission Delegated Regulations (EU) No 811/2013

    (

    12

    )

    , (EU) No 812/2013

    (

    13

    )

    and (EU) 2015/1187

    (

    14

    )

    , where the provision of labels for those packages is the sole responsibility of the dealer.


    6.   After the final unit of a model has been placed on the market, the supplier shall keep the information concerning that model in the compliance part of the product database for a period of 15 years.
    Where appropriate in relation to the average life span of a product, a shorter retention period may be provided for pursuant to point (q) of Article 16(3). The information in the public part of the
    database shall not be deleted.'
- id: art-6
  title: Article 5
  text: 'Article 5


    Obligations of dealers


    1.   The dealer shall:


    (a)


    display, in a visible manner, including for online distance selling, the label provided by the supplier or made available in accordance with paragraph 2 for units of a model covered by the relevant
    delegated act; and


    (b)


    make available to customers the product information sheet, including, upon request, in physical form at the point of sale.


    2.   Where, notwithstanding Article 3(1), the dealer does not have a label, it shall request one from the supplier in accordance with Article 3(2).


    3.   Where, notwithstanding Article 3(1), the dealer does not have a product information sheet, it shall request one from the supplier in accordance with Article 3(2); or, if it chooses to do so, print
    or download one for electronic display from the product database, if those functions are available for the relevant product.'
- id: art-7
  title: Article 6
  text: 'Article 6


    Other obligations of suppliers and dealers


    The supplier and the dealer shall:


    (a)


    make reference to the energy efficiency class of the product and the range of the efficiency classes available on the label in visual advertisements or technical promotional material for a specific
    model in accordance with the relevant delegated act;


    (b)


    cooperate with market surveillance authorities and take immediate action to remedy any case of non-compliance with the requirements set out in this Regulation and the relevant delegated acts, which
    falls under their responsibility, at their own initiative or when required to do so by market surveillance authorities;


    (c)


    for products covered by delegated acts, not provide or display other labels, marks, symbols or inscriptions which do not comply with the requirements of this Regulation and the relevant delegated acts,
    if doing so would be likely to mislead or confuse customers with respect to the consumption of energy or other resources during use;


    (d)


    for products not covered by delegated acts, not supply or display labels which mimic the labels provided for under this Regulation and the relevant delegated acts;


    (e)


    for non-energy related products, not supply or display labels which mimic the labels provided for in this Regulation or in delegated acts.


    Point (d) in the first subparagraph shall not affect labels provided for in national law, unless those labels are provided for in delegated acts.'
- id: art-8
  title: Article 7
  text: 'Article 7


    Obligations of Member States


    1.   Member States shall not impede the placing on the market or putting into service, within their territories, of products which comply with this Regulation and the relevant delegated acts.


    2.   Where Member States provide incentives for a product specified in a delegated act, those incentives shall aim at the highest two significantly populated classes of energy efficiency, or at higher
    classes as laid down in that delegated act.


    3.   Member States shall ensure that the introduction of labels and rescaling of labels is accompanied by educational and promotional information campaigns on energy labelling, if appropriate in cooperation
    with suppliers and dealers. The Commission shall support cooperation and the exchange of best practices in relation to those campaigns, including through the recommendation of common key messages.


    4.   Member States shall lay down the rules on penalties and enforcement mechanisms applicable to infringements of this Regulation and the delegated acts, and shall take all measures necessary to ensure
    that they are implemented. The penalties provided for shall be effective, proportionate and dissuasive. Rules which fulfil the requirements of Article 15 of Directive 2010/30/EU shall be considered
    to fulfil the requirements of this paragraph as regards penalties.


    Member States shall, by 1 August 2017, notify the Commission of the rules referred to in the first subparagraph that have not previously been notified to the Commission, and shall notify the Commission,
    without delay, of any subsequent amendment affecting them.'
- id: art-9
  title: Article 8
  text: 'Article 8


    Union market surveillance and control of products entering the Union market


    1.   Articles 16 to 29 of Regulation (EC) No 765/2008 shall apply to products covered by this Regulation and by the relevant delegated acts.


    2.   The Commission shall encourage and support cooperation and the exchange of information on market surveillance relating to the labelling of products between national authorities of the Member States
    that are responsible for market surveillance or in charge of the control of products entering the Union market and between them and the Commission, inter alia, by involving more closely the AdCos on
    Ecodesign and Energy Labelling.


    Such exchanges of information shall also be conducted when test results indicate that the product complies with this Regulation and the relevant delegated act.


    3.   Member States'' general market surveillance programmes or sector specific programmes established pursuant to Article 18 of Regulation (EC) No 765/2008 shall include actions to ensure the effective
    enforcement of this Regulation.


    4.   The Commission shall, in cooperation with the AdCos on Ecodesign and Energy Labelling, elaborate guidelines for the enforcement of this Regulation, in particular as regards best practices for product
    testing and the sharing of information between national market surveillance authorities and the Commission.


    5.   Market surveillance authorities shall have the right to recover from the supplier the costs of document inspection and physical product testing in case of non-compliance with this Regulation or
    the relevant delegated acts.'
- id: art-10
  title: Article 9
  text: 'Article 9


    Procedure at national level for dealing with products presenting a risk


    1.   Where the market surveillance authorities of one Member State have sufficient reason to believe that a product covered by this Regulation presents a risk to aspects of public interest protection
    covered by this Regulation, such as environmental and consumer protection aspects, they shall carry out an evaluation in relation to the product concerned covering all energy labelling requirements
    relevant to the risk and laid down in this Regulation or in the relevant delegated act. Suppliers and dealers shall cooperate as necessary with the market surveillance authorities for the purpose of
    that evaluation.


    2.   Where, in the course of the evaluation referred to in paragraph 1, the market surveillance authorities find that the product does not comply with the requirements laid down in this Regulation or
    in the relevant delegated act, they shall without delay require the supplier, or where appropriate, the dealer, to take all appropriate corrective action to bring the product into compliance with those
    requirements, where appropriate to withdraw the product from the market, or where appropriate, to recall it within a reasonable period, commensurate with the nature of the risk as they may prescribe.'
- id: art-11
  title: Article 21 of Regulation (EC) No 765/2008 shall apply to the measures referred to in this paragraph.
  text: 'Article 21 of Regulation (EC) No 765/2008 shall apply to the measures referred to in this paragraph.


    3.   Where the market surveillance authorities consider that a case of non-compliance as referred to in paragraph 2 is not restricted to their national territory, they shall inform the Commission and
    the other Member States of the results of the evaluation and of the action which they have required the supplier or dealer to take.


    4.   The supplier or, where appropriate, the dealer shall ensure that all appropriate corrective or restrictive action in accordance with paragraph 2 is taken in respect of all the products concerned
    that it has made available on the market throughout the Union.


    5.   Where the supplier or, where appropriate, the dealer does not take adequate corrective action within the period referred to in paragraph 2, the market surveillance authorities shall take all appropriate
    provisional measures to prohibit or restrict the availability of the product on their national market, to withdraw the product from that market, or to recall it.


    6.   The market surveillance authorities shall inform the Commission and the other Member States without delay of the measures taken pursuant to paragraph 5. That information shall include all available
    details, in particular:


    (a)


    the data necessary for the identification of the non-compliant product;


    (b)


    the origin of the product;


    (c)


    the nature of the non-compliance alleged and the risk involved;


    (d)


    the nature and duration of the national measures taken and the arguments put forward by the supplier or, where appropriate, the dealer.


    In particular, the market surveillance authorities shall indicate whether the non-compliance is due to either failure of the product to meet requirements relating to aspects of public interest protection
    laid down in this Regulation or shortcomings in the harmonised standards referred to in Article 13 conferring a presumption of conformity.


    7.   Member States other than the Member State initiating the procedure shall without delay inform the Commission and the other Member States of any measures adopted and of any additional information
    at their disposal relating to the non-compliance of the product concerned, and, in the event of disagreement with the notified national measure, of their objections.


    8.   Where, within 60 days of receipt of the information referred to in paragraph 6, no objection has been raised by either a Member State or the Commission in respect of a provisional measure taken
    by a Member State, that measure shall be deemed to be justified.


