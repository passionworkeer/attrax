    3.   This Regulation applies to:


    (a)


    manufacturers of connected products placed on the market in the Union and providers of related services, irrespective of the place of establishment of those manufacturers and providers;


    (b)


    users in the Union of connected products or related services as referred to in point (a);


    (c)


    data holders, irrespective of their place of establishment, that make data available to data recipients in the Union;


    (d)


    data recipients in the Union to whom data are made available;


    (e)


    public sector bodies, the Commission, the European Central Bank and Union bodies that request data holders to make data available where there is an exceptional need for those data for the performance
    of a specific task carried out in the public interest and to the data holders that provide those data in response to such request;


    (f)


    providers of data processing services, irrespective of their place of establishment, providing such services to customers in the Union;


    (g)


    participants in data spaces and vendors of applications using smart contracts and persons whose trade, business or profession involves the deployment of smart contracts for others in the context of
    executing an agreement.


    4.   Where this Regulation refers to connected products or related services, such references are also understood to include virtual assistants insofar as they interact with a connected product or related
    service.


    5.   This Regulation is without prejudice to Union and national law on the protection of personal data, privacy and confidentiality of communications and integrity of terminal equipment, which shall
    apply to personal data processed in connection with the rights and obligations laid down herein, in particular Regulations (EU) 2016/679 and (EU) 2018/1725 and Directive 2002/58/EC, including the powers
    and competences of supervisory authorities and the rights of data subjects. Insofar as users are data subjects, the rights laid down in Chapter II of this Regulation shall complement the rights of access
    by data subjects and rights to data portability under Articles 15 and 20 of Regulation (EU) 2016/679. In the event of a conflict between this Regulation and Union law on the protection of personal data
    or privacy, or national legislation adopted in accordance with such Union law, the relevant Union or national law on the protection of personal data or privacy shall prevail.


    6.   This Regulation does not apply to or pre-empt voluntary arrangements for the exchange of data between private and public entities, in particular voluntary arrangements for data sharing.


    This Regulation does not affect Union or national legal acts providing for the sharing of, access to and the use of data for the purpose of the prevention, investigation, detection or prosecution of
    criminal offences or for the execution of criminal penalties, or for customs and taxation purposes, in particular Regulations (EU) 2021/784, (EU) 2022/2065 and (EU) 2023/1543 and Directive (EU) 2023/1544,
    or international cooperation in that area. This Regulation does not apply to the collection or sharing of, access to or the use of data under Regulation (EU) 2015/847 and Directive (EU) 2015/849. This
    Regulation does not apply to areas that fall outside the scope of Union law and in any event does not affect the competences of the Member States concerning public security, defence or national security,
    regardless of the type of entity entrusted by the Member States to carry out tasks in relation to those competences, or their power to safeguard other essential State functions, including ensuring the
    territorial integrity of the State and the maintenance of law and order. This Regulation does not affect the competences of the Member States concerning customs and tax administration or the health
    and safety of citizens.


    7.   This Regulation complements the self-regulatory approach of Regulation (EU) 2018/1807 by adding generally applicable obligations on cloud switching.


    8.   This Regulation is without prejudice to Union and national legal acts providing for the protection of intellectual property rights, in particular Directives 2001/29/EC, 2004/48/EC and (EU) 2019/790.


    9.   This Regulation complements and is without prejudice to Union law which aims to promote the interests of consumers and ensure a high level of consumer protection, and to protect their health, safety
    and economic interests, in particular Directives 93/13/EEC, 2005/29/EC and 2011/83/EU.


    10.   This Regulation does not preclude the conclusion of voluntary lawful data sharing contracts, including contracts concluded on a reciprocal basis, which comply with the requirements laid down in
    this Regulation.'
- id: art-10
  title: Article 2
  text: 'Article 2


    Definitions


    For the purposes of this Regulation, the following definitions apply:


    (1)


    ‘data’ means any digital representation of acts, facts or information and any compilation of such acts, facts or information, including in the form of sound, visual or audio-visual recording;


    (2)


    ‘metadata’ means a structured description of the contents or the use of data facilitating the discovery or use of that data;


    (3)


    ‘personal data’ means personal data as defined in Article 4, point (1), of Regulation (EU) 2016/679;


    (4)


    ‘non-personal data’ means data other than personal data;


    (5)


    ‘connected product’ means an item that obtains, generates or collects data concerning its use or environment and that is able to communicate product data via an electronic communications service, physical
    connection or on-device access, and whose primary function is not the storing, processing or transmission of data on behalf of any party other than the user;


    (6)


    ‘related service’ means a digital service, other than an electronic communications service, including software, which is connected with the product at the time of the purchase, rent or lease in such
    a way that its absence would prevent the connected product from performing one or more of its functions, or which is subsequently connected to the product by the manufacturer or a third party to add
    to, update or adapt the functions of the connected product;


    (7)


    ‘processing’ means any operation or set of operations which is performed on data or on sets of data, whether or not by automated means, such as collection, recording, organisation, structuring, storage,
    adaptation or alteration, retrieval, consultation, use, disclosure by transmission, dissemination, or other means of making them available, alignment or combination, restriction, erasure or destruction;


    (8)


    ‘data processing service’ means a digital service that is provided to a customer and that enables ubiquitous and on-demand network access to a shared pool of configurable, scalable and elastic computing
    resources of a centralised, distributed or highly distributed nature that can be rapidly provisioned and released with minimal management effort or service provider interaction;


    (9)


    ‘same service type’ means a set of data processing services that share the same primary objective, data processing service model and main functionalities;


    (10)


    ‘data intermediation service’ means data intermediation service as defined in Article 2, point (11), of Regulation (EU) 2022/868;


    (11)


    ‘data subject’ means data subject as referred to in Article 4, point (1), of Regulation (EU) 2016/679;


    (12)


    ‘user’ means a natural or legal person that owns a connected product or to whom temporary rights to use that connected product have been contractually transferred, or that receives related services;


    (13)


    ‘data holder’ means a natural or legal person that has the right or obligation, in accordance with this Regulation, applicable Union law or national legislation adopted in accordance with Union law,
    to use and make available data, including, where contractually agreed, product data or related service data which it has retrieved or generated during the provision of a related service;


    (14)


    ‘data recipient’ means a natural or legal person, acting for purposes which are related to that person’s trade, business, craft or profession, other than the user of a connected product or related service,
    to whom the data holder makes data available, including a third party following a request by the user to the data holder or in accordance with a legal obligation under Union law or national legislation
    adopted in accordance with Union law;


    (15)


    ‘product data’ means data generated by the use of a connected product that the manufacturer designed to be retrievable, via an electronic communications service, physical connection or on-device access,
    by a user, data holder or a third party, including, where relevant, the manufacturer;


    (16)


    ‘related service data’ means data representing the digitisation of user actions or of events related to the connected product, recorded intentionally by the user or generated as a by-product of the
    user’s action during the provision of a related service by the provider;


    (17)


    ‘readily available data’ means product data and related service data that a data holder lawfully obtains or can lawfully obtain from the connected product or related service, without disproportionate
    effort going beyond a simple operation;


    (18)


    ‘trade secret’ means trade secret as defined in Article 2, point (1), of Directive (EU) 2016/943;


    (19)


    ‘trade secret holder’ means a trade secret holder as defined in Article 2, point (2), of Directive (EU) 2016/943;


    (20)


    ‘profiling’ means profiling as defined in Article 4, point (4), of Regulation (EU) 2016/679;


    (21)


    ‘making available on the market’ means any supply of a connected product for distribution, consumption or use on the Union market in the course of a commercial activity, whether in return for payment
    or free of charge;


    (22)


    ‘placing on the market’ means the first making available of a connected product on the Union market;


    (23)


    ‘consumer’ means any natural person who is acting for purposes which are outside that person’s trade, business, craft or profession;


    (24)


    ‘enterprise’ means a natural or legal person that, in relation to contracts and practices covered by this Regulation, is acting for purposes which are related to that person’s trade, business, craft
    or profession;


    (25)


    ‘small enterprise’ means a small enterprise as defined in Article 2(2) of the Annex to Recommendation 2003/361/EC;


    (26)


    ‘microenterprise’ means a microenterprise as defined in Article 2(3) of the Annex to Recommendation 2003/361/EC;


    (27)


    ‘Union bodies’ means the Union bodies, offices and agencies set up by or pursuant to acts adopted on the basis of the Treaty on European Union, the TFEU or the Treaty establishing the European Atomic
    Energy Community;


    (28)


    ‘public sector body’ means national, regional or local authorities of the Member States and bodies governed by public law of the Member States, or associations formed by one or more such authorities
    or one or more such bodies;


    (29)


    ‘public emergency’ means an exceptional situation, limited in time, such as a public health emergency, an emergency resulting from natural disasters, a human-induced major disaster, including a major
    cybersecurity incident, negatively affecting the population of the Union or the whole or part of a Member State, with a risk of serious and lasting repercussions for living conditions or economic stability,
    financial stability, or the substantial and immediate degradation of economic assets in the Union or the relevant Member State and which is determined or officially declared in accordance with the relevant
    procedures under Union or national law;


    (30)


    ‘customer’ means a natural or legal person that has entered into a contractual relationship with a provider of data processing services with the objective of using one or more data processing services;


    (31)


    ‘virtual assistants’ means software that can process demands, tasks or questions including those based on audio, written input, gestures or motions, and that, based on those demands, tasks or questions,
    provides access to other services or controls the functions of connected products;


    (32)


    ‘digital assets’ means elements in digital form, including applications, for which the customer has the right of use, independently from the contractual relationship with the data processing service
    it intends to switch from;


    (33)


    ‘on-premises ICT infrastructure’ means ICT infrastructure and computing resources owned, rented or leased by the customer, located in the data centre of the customer itself and operated by the customer
    or by a third-party;


    (34)


    ‘switching’ means the process involving a source provider of data processing services, a customer of a data processing service and, where relevant, a destination provider of data processing services,
    whereby the customer of a data processing service changes from using one data processing service to using another data processing service of the same service type, or other service, offered by a different
    provider of data processing services, or to an on-premises ICT infrastructure, including through extracting, transforming and uploading the data;


    (35)


    ‘data egress charges’ means data transfer fees charged to customers for extracting their data through the network from the ICT infrastructure of a provider of data processing services to the system
    of a different provider or to on-premises ICT infrastructure;


    (36)


    ‘switching charges’ means charges, other than standard service fees or early termination penalties, imposed by a provider of data processing services on a customer for the actions mandated by this Regulation
    for switching to the system of a different provider or to on-premises ICT infrastructure, including data egress charges;


    (37)


    ‘functional equivalence’ means re-establishing on the basis of the customer’s exportable data and digital assets, a minimum level of functionality in the environment of a new data processing service
    of the same service type after the switching process, where the destination data processing service delivers a materially comparable outcome in response to the same input for shared features supplied
    to the customer under the contract;


    (38)


    ‘exportable data’, for the purpose of Articles 23 to 31 and Article 35, means the input and output data, including metadata, directly or indirectly generated, or cogenerated, by the customer’s use of
    the data processing service, excluding any assets or data protected by intellectual property rights, or constituting a trade secret, of providers of data processing services or third parties;


    (39)


    ‘smart contract’ means a computer program used for the automated execution of an agreement or part thereof, using a sequence of electronic data records and ensuring their integrity and the accuracy
    of their chronological ordering;


    (40)


    ‘interoperability’ means the ability of two or more data spaces or communication networks, systems, connected products, applications, data processing services or components to exchange and use data
    in order to perform their functions;


    (41)


    open interoperability specification’ means a technical specification in the field of information and communication technologies which is performance oriented towards achieving interoperability between
    data processing services;


    (42)


    ‘common specifications’ means a document, other than a standard, containing technical solutions providing a means to comply with certain requirements and obligations established under this Regulation;


    (43)


    ‘harmonised standard’ means a harmonised standard as defined in Article 2, point (1)(c), of Regulation (EU) No 1025/2012.'
- id: art-11
  title: CHAPTER II
  text: 'CHAPTER II


    BUSINESS TO CONSUMER AND BUSINESS TO BUSINESS DATA SHARING'
- id: art-12
  title: Article 3
  text: 'Article 3


    Obligation to make product data and related service data accessible to the user


    1.   Connected products shall be designed and manufactured, and related services shall be designed and provided, in such a manner that product data and related service data, including the relevant metadata
    necessary to interpret and use those data, are, by default, easily, securely, free of charge, in a comprehensive, structured, commonly used and machine-readable format, and, where relevant and technically
    feasible, directly accessible to the user.


    2.   Before concluding a contract for the purchase, rent or lease of a connected product, the seller, rentor or lessor, which may be the manufacturer, shall provide at least the following information
    to the user, in a clear and comprehensible manner:


    (a)


    the type, format and estimated volume of product data which the connected product is capable of generating;


    (b)


    whether the connected product is capable of generating data continuously and in real-time;


    (c)


    whether the connected product is capable of storing data on-device or on a remote server, including, where applicable, the intended duration of retention;


    (d)


    how the user may access, retrieve or, where relevant, erase the data, including the technical means to do so, as well as their terms of use and quality of service.


    3.   Before concluding a contract for the provision of a related service, the provider of such related service shall provide at least the following information to the user, in a clear and comprehensible
    manner:


    (a)


    the nature, estimated volume and collection frequency of product data that the prospective data holder is expected to obtain and, where relevant, the arrangements for the user to access or retrieve
    such data, including the prospective data holder’s data storage arrangements and the duration of retention;


    (b)


    the nature and estimated volume of related service data to be generated, as well as the arrangements for the user to access or retrieve such data, including the prospective data holder’s data storage
    arrangements and the duration of retention;


    (c)


    whether the prospective data holder expects to use readily available data itself and the purposes for which those data are to be used, and whether it intends to allow one or more third parties to use
    the data for purposes agreed upon with the user;


    (d)


    the identity of the prospective data holder, such as its trading name and the geographical address at which it is established and, where applicable, of other data processing parties;


    (e)


    the means of communication which make it possible to contact the prospective data holder quickly and communicate'
