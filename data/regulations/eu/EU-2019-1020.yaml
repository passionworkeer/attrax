  text: 'L_2019169EN.01000101.xml


    25.6.2019


    EN


    Official Journal of the European Union


    L 169/1


    REGULATION (EU) 2019/1020 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 20 June 2019



    on market surveillance and compliance of products and amending Directive 2004/42/EC and Regulations (EC) No 765/2008 and (EU) No 305/2011


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Articles 33 and 114 thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    In order to guarantee the free movement of products within the Union, it is necessary to ensure that products are compliant with Union harmonisation legislation and therefore fulfil requirements providing
    a high level of protection of public interests, such as health and safety in general, health and safety in the workplace, protection of consumers, protection of the environment, public security and
    protection of any other public interests protected by that legislation. Robust enforcement of these requirements is essential to the proper protection of these interests and to create the conditions
    in which fair competition in the Union market for goods can thrive. Rules are therefore necessary to ensure this enforcement, regardless of whether products are placed on the market via offline or online
    means and regardless of whether they are manufactured in the Union or not.


    (2)


    Union harmonisation legislation covers a large share of manufactured products. Non-compliant and unsafe products put citizens at risk, and might distort competition with economic operators selling compliant
    products within the Union.


    (3)


    Strengthening the single market for goods through further enhancing efforts to keep non-compliant products from being placed on the Union market was identified as a priority in the Communication from
    the Commission of 28 October 2015 entitled ‘Upgrading the Single Market: more opportunities for people and business’. This should be achieved by strengthening market surveillance, providing economic
    operators with clear, transparent and comprehensive rules, intensifying compliance controls and promoting closer cross-border cooperation among enforcement authorities, including through cooperation
    with customs authorities.


    (4)


    The framework for market surveillance established by this Regulation should complement and strengthen existing provisions in Union harmonisation legislation relating to the ensuring of compliance of
    products and the framework for cooperation with organisations representing economic operators or end users, the market surveillance of products and controls on those products entering the Union market.
    However, in accordance with the principle of

    lex specialis

    , this Regulation should apply only in so far as there are no specific provisions with the same objective, nature or effect in Union harmonisation legislation. The corresponding provisions of this Regulation
    should therefore not apply in the areas covered by such specific provisions, for instance those set out in Regulations (EC) No 1223/2009

    (

    3

    )

    , (EU) 2017/745

    (

    4

    )

    and (EU) 2017/746

    (

    5

    )

    , including as regards the use of the European database on medical devices (EUDAMED), and (EU) 2018/858

    (

    6

    )

    of the European Parliament and of the Council.


    (5)


    Directive 2001/95/EC of the European Parliament and of the Council

    (

    7

    )

    lays down the general safety requirements for all consumer products and provides for specific obligations and powers of the Member States in relation to dangerous products as well as for the exchange
    of information to that effect through the Rapid Information Exchange System (RAPEX). Market surveillance authorities should have the possibility of taking the more specific measures available to them
    under that Directive. In order to achieve a higher level of safety for consumer products, the mechanisms for exchanges of information and rapid intervention situations provided for in Directive 2001/95/EC
    should be made more effective.


    (6)


    The provisions on market surveillance of this Regulation should cover products that are subject to the Union harmonisation legislation listed in Annex I concerning manufactured products other than food,
    feed, medicinal products for human and veterinary use, living plants and animals, products of human origin and products of plants and animals relating directly to their future reproduction. This will
    ensure a uniform framework for market surveillance of those products at Union level and will help to increase the confidence of consumers and other end users in products placed on the Union market.
    If new Union harmonisation legislation is adopted in the future, it will be for that legislation to specify whether this Regulation is also to apply to that legislation.


    (7)


    Articles 15 to 29 of Regulation (EC) No 765/2008 of the European Parliament and of the Council

    (

    8

    )

    laying down the Community market surveillance framework and controls of products entering the Community market should be deleted and the respective provisions should be replaced by this Regulation.
    That framework includes the provisions on controls of products entering the Community market, in Articles 27, 28 and 29 of Regulation (EC) No 765/2008, which apply not only to products covered by the
    market surveillance framework, but to all products in so far as other Union law does not contain specific provisions relating to the organisation of controls on products entering the Union market. It
    is therefore necessary that the scope of the provisions of this Regulation with regard to products entering the Union market extend to all products.


    (8)


    In order to rationalise and simplify the overall legislative framework, while simultaneously pursuing the objectives of Better Regulation, the rules applicable to controls on products entering the Union
    market should be revised and integrated into a single legislative framework for controls on products at the Union''s external borders.


    (9)


    Responsibility for enforcing Union harmonisation legislation should lie with the Member States, and their market surveillance authorities should be required to ensure that the legislation is fully complied
    with. The Member States should, therefore, establish systematic approaches to ensure effectiveness of market surveillance and other enforcement activities. In this regard, the methodology and criteria
    for assessing risks should be further harmonised in all Member States in order to ensure a level playing field for all economic operators.


    (10)


    In order to assist market surveillance authorities to strengthen consistency in their activities related to the application of this Regulation, an effective peer review system should be established
    for those market surveillance authorities wishing to participate.


    (11)


    Certain definitions currently set out in Regulation (EC) No 765/2008 should be aligned with definitions set out in other Union legal acts and, where appropriate, reflect the architecture of modern supply
    chains. The definition of ‘manufacturer’ in this Regulation should not relieve manufacturers of any obligations they might have under Union harmonisation legislation where specific definitions of manufacturer
    are applied, which might cover any natural or legal person who modifies a product already placed on the market in such a way that compliance with the applicable Union harmonisation legislation might
    be affected and places it on the market, or any other natural or legal person who places a product on the market under its name or trade mark.


    (12)


    Economic operators throughout the entire supply chain should be expected to act responsibly and in full accordance with the legal requirements applicable when placing or making products available on
    the market, so as to ensure compliance with the Union harmonisation legislation on products. This Regulation should be without prejudice to the obligations corresponding to the roles of each of the
    economic operators in the supply and distribution process pursuant to specific provisions in Union harmonisation legislation, and the manufacturer should retain ultimate responsibility for compliance
    of the product with requirements of the Union harmonisation legislation.


    (13)


    The challenges of the global market and increasingly complex supply chains, as well as the increase of products that are offered for sale online to end users within the Union, call for the strengthening
    of enforcement measures, to ensure the safety of consumers. Furthermore, practical experience of market surveillance has shown that such supply chains sometimes involve economic operators whose novel
    form means that they do not fit easily into the traditional supply chains according to the existing legal framework. Such is the case, in particular, with fulfilment service providers, which perform
    many of the same functions as importers but which might not always correspond to the traditional definition of importer in Union law. In order to ensure that market surveillance authorities can carry
    out their responsibilities effectively and to avoid a gap in the enforcement system, it is appropriate to include fulfilment service providers within the list of economic operators against whom it is
    possible for market surveillance authorities to take enforcement measures. By including fulfilment service providers within the scope of this Regulation, market surveillance authorities will be better
    able to deal with new forms of economic activity in order to ensure the safety of consumers and the smooth functioning of the internal market, including where the economic operator acts both as an importer
    as regards certain products and as a fulfilment service provider as regards other products.


    (14)


    Modern supply chains encompass a wide variety of economic operators who should all be subject to enforcement of Union harmonisation legislation, while taking due consideration of their respective roles
    in the supply chain, and the extent to which they contribute to the making available of products on the Union market. Therefore, it is necessary to apply this Regulation to economic operators that are
    directly concerned by Union harmonisation legislation listed in Annex I to this Regulation, such as the producer of an article and the downstream user as defined in Regulation (EC) No 1907/2006 of the
    European Parliament and of the Council

    (

    9

    )

    and in Regulation (EC) No 1272/2008 of the European Parliament and of the Council

    (

    10

    )

    , the installer as defined in Directive 2014/33/EU of the European Parliament and of the Council

    (

    11

    )

    , the supplier as defined in Regulation (EC) No 1222/2009 of the European Parliament and of the Council

    (

    12

    )

    or the dealer as defined in Regulation (EU) 2017/1369 of the European Parliament and of the Council

    (

    13

    )

    .


    (15)


    In the case of a product offered for sale online or through other means of distance sales, the product should be considered to have been made available on the market if the offer for sale is targeted
    at end users in the Union. In line with the applicable Union rules on private international law, a case-by-case analysis should be carried out in order to establish whether an offer is targeted at end
    users in the Union. An offer for sale should be considered to be targeted at end users in the Union if the relevant economic operator directs, by any means, its activities to a Member State. For the
    case-by-case analyses, relevant factors, such as the geographical areas to which dispatch is possible, the languages available, used for the offer or for ordering, or means of payment, need to be taken
    into consideration. In the case of online sales, the m'
- id: art-2
  title: CHAPTER I
  text: 'CHAPTER I


    GENERAL PROVISIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Subject matter


    1.   The objective of this Regulation is to improve the functioning of the internal market by strengthening the market surveillance of products covered by the Union harmonisation legislation referred
    to in Article 2, with a view to ensuring that only compliant products that fulfil requirements providing a high level of protection of public interests, such as health and safety in general, health
    and safety in the workplace, the protection of consumers, the protection of the environment and public security and any other public interests protected by that legislation, are made available on the
    Union market.


    2.   This Regulation lays down rules and procedures for economic operators regarding products subject to certain Union harmonisation legislation and establishes a framework for cooperation with economic
    operators.


    3.   This Regulation also provides a framework for controls on products entering the Union market.'
- id: art-4
  title: Article 2
  text: 'Article 2


    Scope


    1.   This Regulation shall apply to products that are subject to the Union harmonisation legislation listed in Annex I (‘Union harmonisation legislation’), in so far as there are no specific provisions
    with the same objective in the Union harmonisation legislation, which regulate in a more specific manner particular aspects of market surveillance and enforcement.


    2.   Articles 25 to 28 shall apply to products covered by Union law in so far as there are no specific provisions relating to the organisation of controls on products entering the Union market in Union
    law.


    3.   The application of this Regulation shall not prevent market surveillance authorities from taking more specific measures as provided for in Directive 2001/95/EC.


    4.   This Regulation is without prejudice to Articles 12 to 15 of Directive 2000/31/EC.'
- id: art-5
  title: Article 3
  text: 'Article 3


    Definitions


    For the purposes of this Regulation, the following definitions shall apply:


    (1)


    ‘making available on the market’ means any supply of a product for distribution, consumption or use on the Union market in the course of a commercial activity, whether in return for payment or free
    of charge;


    (2)


    ‘placing on the market’ means the first making available of a product on the Union market;


    (3)


    ‘market surveillance’ means the activities carried out and measures taken by market surveillance authorities to ensure that products comply with the requirements set out in the applicable Union harmonisation
    legislation and to ensure protection of the public interest covered by that legislation;


    (4)


    ‘market surveillance authority’ means an authority designated by a Member State under Article 10 as responsible for carrying out market surveillance in the territory of that Member State;


    (5)


    ‘applicant authority’ means the market surveillance authority that makes a request for mutual assistance;


    (6)


    ‘requested authority’ means the market surveillance authority that receives a request for mutual assistance;


    (7)


    ‘non-compliance’ means any failure to comply with any requirement under the Union harmonisation legislation or under this Regulation;


    (8)


    ‘manufacturer’ means any natural or legal person who manufactures a product or has a product designed or manufactured, and markets that product under its name or trademark;


    (9)


    ‘importer’ means any natural or legal person established within the Union who places a product from a third country on the Union market;


    (10)


    ‘distributor’ means any natural or legal person in the supply chain, other than the manufacturer or the importer, who makes a product available on the market;


    (11)


    ‘fulfilment service provider’ means any natural or legal person offering, in the course of commercial activity, at least two of the following services: warehousing, packaging, addressing and dispatching,
    without having ownership of the products involved, excluding postal services as defined in point 1 of Article 2 of Directive 97/67/EC of the European Parliament and of the Council

    (

    31

    )

    , parcel delivery services as defined in point 2 of Article 2 of Regulation (EU) 2018/644 of the European Parliament and of the Council

    (

    32

    )

    , and any other postal services or freight transport services;


    (12)


    ‘authorised representative’ means any natural or legal person established within the Union who has received a written mandate from a manufacturer to act on its behalf in relation to specified tasks
    with regard to the manufacturer''s obligations under the relevant Union harmonisation legislation or under the requirements of this Regulation;


    (13)


    ‘economic operator’ means the manufacturer, the authorised representative, the importer, the distributor, the fulfilment service provider or any other natural or legal person who is subject to obligations
    in relation to the manufacture of products, making them available on the market or putting them into service in accordance with the relevant Union harmonisation legislation;


    (14)


    ‘information society service provider’ means a provider of a service as defined in point (b) of Article 1(1) of Directive (EU) 2015/1535 of the European Parliament and of the Council

    (

    33

    )

    ;


    (15)


    ‘online interface’ means any software, including a website, part of a website or an application, that is operated by or on behalf of an economic operator, and which serves to give end users access to
    the economic operator''s products;


    (16)


    ‘corrective action’ means any action taken by an economic operator to bring any non-compliance to an end where required by a market surveillance authority or on the economic operator''s own initiative;


    (17)


    ‘voluntary measure’ means a corrective action where not required by a market surveillance authority;


    (18)


    ‘risk’ means the combination of the probability of an occurrence of a hazard causing harm and the degree of severity of that harm;


    (19)


    ‘product presenting a risk’ means a product having the potential to affect adversely health and safety of persons in general, health and safety in the workplace, protection of consumers, the environment,
    public security and other public interests, protected by the applicable Union harmonisation legislation, to a degree which goes beyond that considered reasonable and acceptable in relation to its intended
    purpose or under the normal or reasonably foreseeable conditions of use of the product concerned, including the duration of use and, where applicable, its putting into service, installation and maintenance
    requirements;


    (20)


    ‘product presenting a serious risk’ means a product presenting a risk, for which, based on a risk assessment and taking into account the normal and foreseeable use of the product, the combination of
    the probability of occurrence of a hazard causing harm and the degree of severity of the harm is considered to require rapid intervention by the market surveillance authorities, including cases where
    the effects of the risk are not immediate;


    (21)


    ‘end user’ means any natural or legal person residing or established in the Union, to whom a product has been made available either as a consumer outside of any trade, business, craft or profession
    or as a professional end user in the course of its industrial or professional activities;


    (22)


    ‘recall’ means any measure aimed at achieving the return of a product that has already been made available to the end user;


    (23)


    ‘withdrawal’ means any measure aimed at preventing a product in the supply chain from being made available on the market;


    (24)


    ‘customs authorities’ means customs authorities as defined in point 1 of Article 5 of Regulation (EU) No 952/2013;


    (25)


    ‘release for free circulation’ means the procedure laid down in Article 201 of Regulation (EU) No 952/2013;


    (26)


    ‘products entering the Union market’ means products from third countries intended to be placed on the Union market or intended for private use or consumption within the customs territory of the Union
    and placed under the customs procedure ‘release for free circulation’.'
- id: art-6
  title: CHAPTER II
  text: 'CHAPTER II


    TASKS OF ECONOMIC OPERATORS'
- id: art-7
  title: Article 4
  text: 'Article 4


    Tasks of economic operators regarding products subject to certain Union harmonisation legislation


    1.   Notwithstanding any obligations set out in applicable Union harmonisation legislation, a product subject to legislation referred to in paragraph 5 may be placed on the market only if there is an
    economic operator established in the Union who is responsible for the tasks set out in paragraph 3 in respect of that product.


    2.   For the purposes of this Article, the economic operator referred to in paragraph 1 means any of the following:


    (a)


    a manufacturer established in the Union;


    (b)


    an importer, where the manufacturer is not established in the Union;


    (c)


    an authorised representative who has a written mandate from the manufacturer designating the authorised representative to perform the tasks set out in paragraph 3 on the manufacturer''s behalf;


    (d)


    a fulfilment service provider established in the Union with respect to the products it handles, where no other economic operator as mentioned in points (a), (b) and (c) is established in the Union.


    3.   Without prejudice to any obligations of economic operators under the applicable Union harmonisation legislation, the economic operator referred to in paragraph 1 shall perform the following tasks:


    (a)


    if the Union harmonisation legislation applicable to the product provides for an EU declaration of conformity or declaration of performance and technical documentation, verifying that the EU declaration
    of conformity or declaration of performance and technical documentation have been drawn up, keeping the declaration of conformity or declaration of performance at the disposal of market surveillance
    authorities for the period required by that legislation and ensuring that the technical documentation can be made available to those authorities upon request;


    (b)


    further to a reasoned request from a market surveillance authority, providing that authority with all information and documentation necessary to demonstrate the conformity of the product in a language
    which can be easily understood by that authority;


    (c)


    when having reason to believe that a product in question presents a risk, informing the market surveillance authorities thereof;


    (d)


    cooperating with the market surveillance authorities, including following a reasoned request making sure that the immediate, necessary, corrective action is taken to remedy any case of non-compliance
    with the requirements set out in Union harmonisation legislation applicable to the product in question, or, if that is not possible, to mitigate the risks presented by that product, when required to
    do so by the market surveillance authorities or on its own initiative, where the economic operator referred to in paragraph 1 considers or has reason to believe that the product in question presents
    a risk.


    4.   Without prejudice to the respective obligations of economic operators under the applicable Union harmonisation legislation, the name, registered trade name or registered trade mark, and contact
    details, including the postal address, of the economic operator referred to in paragraph 1 shall be indicated on the product or on its packaging, the parcel or an accompanying document.


    5.   This Article only applies in relation to products that are subject to Regulations (EU) No 305/2011

