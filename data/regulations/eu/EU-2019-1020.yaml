- id: art-8
  title: Article 5
  text: 'Article 5


    Authorised representative


    1.   For the purposes of point (c) of Article 4(2), the authorised representative shall be mandated by the manufacturer to perform the tasks listed in Article 4(3), notwithstanding any other tasks mandated
    under the relevant Union harmonisation legislation.


    2.   The authorised representative shall perform the tasks specified in the mandate. It shall provide a copy of the mandate to the market surveillance authorities upon request, in a Union language determined
    by the market surveillance authority.


    3.   Authorised representatives shall have the appropriate means to be able to fulfil their tasks.'
- id: art-9
  title: Article 6
  text: 'Article 6


    Distance sales


    Products offered for sale online or through other means of distance sales shall be deemed to be made available on the market if the offer is targeted at end users in the Union. An offer for sale shall
    be considered to be targeted at end users in the Union if the relevant economic operator directs, by any means, its activities to a Member State.'
- id: art-10
  title: Article 7
  text: 'Article 7


    Obligation of cooperation


    1.   Economic operators shall cooperate with market surveillance authorities regarding actions which could eliminate or mitigate risks that are presented by products made available on the market by
    those operators.


    2.   Information society service providers shall cooperate with the market surveillance authorities, at the request of the market surveillance authorities and in specific cases, to facilitate any action
    taken to eliminate or, if that is not possible, to mitigate the risks presented by a product that is or was offered for sale online through their services.'
- id: art-11
  title: CHAPTER III
  text: 'CHAPTER III


    ASSISTANCE TO AND COOPERATION WITH ECONOMIC OPERATORS'
- id: art-12
  title: Article 8
  text: 'Article 8


    Information to economic operators


    1.   The Commission, in accordance with Regulation (EU) 2018/1724, shall ensure that the Your Europe portal provides users with easy online access to information about the product requirements and rights,
    obligations and rules derived from the Union harmonisation legislation.


    2.   Member States shall put in place procedures for providing economic operators, at their request and free of charge, with information with respect to the national transposition and implementation
    of Union harmonisation legislation applicable to products. For this purpose, Article 9(1), (4) and (5) of Regulation (EU) 2019/515 shall apply.'
- id: art-13
  title: Article 9
  text: 'Article 9


    Joint activities to promote compliance


    1.   Market surveillance authorities may agree with other relevant authorities or with organisations representing economic operators or end users on the carrying out of joint activities that have the
    aim of promoting compliance, identifying non-compliance, raising awareness and providing guidance in relation to the Union harmonisation legislation with respect to specific categories of products,
    in particular categories of products that are often found to present a serious risk, including products offered for sale online.


    2.   The market surveillance authority in question and the parties referred to in paragraph 1 shall ensure that the agreement on joint activities does not lead to unfair competition between economic
    operators and does not affect the objectivity, independence and impartiality of the parties.


    3.   A market surveillance authority may use any information resulting from joint activities carried out as part of any investigation regarding non-compliance that it undertakes.


    4.   The market surveillance authority in question shall make the agreement on joint activities, including the names of the parties involved, available to the public and shall enter that agreement in
    the information and communication system referred to in Article 34. At the request of a Member State, the Network established under Article 29 shall assist in the drawing up of the agreement on joint
    activities.'
- id: art-14
  title: CHAPTER IV
  text: 'CHAPTER IV


    ORGANISATION, ACTIVITIES AND OBLIGATIONS OF MARKET SURVEILLANCE AUTHORITIES AND THE SINGLE LIAISON OFFICE'
- id: art-15
  title: Article 10
  text: 'Article 10


    Designation of market surveillance authorities and the single liaison office


    1.   Member States shall organise and carry out market surveillance as provided for in this Regulation.


    2.   For the purposes of paragraph 1 of this Article, each Member State shall designate one or more market surveillance authorities in its territory. Each Member State shall inform the Commission and
    the other Member States of its market surveillance authorities and the areas of competence of each of those authorities, using the information and communication system referred to in Article 34.


    3.   Each Member State shall appoint a single liaison office.


    4.   The single liaison office shall at least be responsible for representing the coordinated position of the market surveillance authorities and the authorities designated under Article 25(1) and for
    communicating the national strategies as set out in Article 13. The single liaison office shall also assist in the cooperation between market surveillance authorities in different Member States, as
    set out in Chapter VI.


    5.   In order to carry out market surveillance of products made available online and offline with the same effectiveness for all distribution channels, Member States shall ensure that their market surveillance
    authorities and single liaison office have the necessary resources, including sufficient budgetary and other resources, such as a sufficient number of competent personnel, expertise, procedures and
    other arrangements for the proper performance of their duties.


    6.   Where there is more than one market surveillance authority in their territory, Member States shall ensure that the respective duties of those authorities are clearly defined and that appropriate
    communication and coordination mechanisms are established to enable those authorities to collaborate closely and exercise their duties effectively.'
- id: art-16
  title: Article 11
  text: 'Article 11


    Activities of market surveillance authorities


    1.   Market surveillance authorities shall conduct their activities in order to ensure the following:


    (a)


    effective market surveillance within their territory of products made available online and offline with respect to products that are subject to Union harmonisation legislation;


    (b)


    the taking by economic operators of appropriate and proportionate corrective action in relation to compliance with that legislation and this Regulation;


    (c)


    the taking of appropriate and proportionate measures where the economic operator fails to take corrective action.


    2.   Market surveillance authorities shall exercise their powers and carry out their duties independently, impartially and without bias.


    3.   Market surveillance authorities, as part of their activities set out in paragraph 1 of this Article, shall perform appropriate checks on the characteristics of products on an adequate scale, by
    means of documentary checks and, where appropriate, physical and laboratory checks based on adequate samples, prioritising their resources and actions to ensure effective market surveillance and taking
    into account the national market surveillance strategy referred to in Article 13.


    In deciding on which checks to perform, on which types of products and on what scale, market surveillance authorities shall follow a risk-based approach taking into account the following factors:


    (a)


    possible hazards and non-compliance associated with the products and, where available, their occurrence on the market;


    (b)


    activities and operations under the control of the economic operator;


    (c)


    the economic operator''s past record of non-compliance;


    (d)


    if relevant, the risk profiling performed by the authorities designated under Article 25(1);


    (e)


    consumer complaints and other information received from other authorities, economic operators, media and other sources that might indicate non-compliance.


    4.   The Commission, after consulting the Network, may adopt implementing acts determining the uniform conditions of checks, criteria for determination of the frequency of checks and amount of samples
    to be checked in relation to certain products or categories of products, where specific risks or serious breaches of applicable Union harmonisation legislation have been con'
