    Official Journal of the European Union


    L 149/22


    DIRECTIVE 2005/29/EC OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 11 May 2005



    concerning unfair business-to-consumer commercial practices in the internal market and amending Council Directive 84/450/EEC, Directives 97/7/EC, 98/27/EC and 2002/65/EC of the European Parliament and
    of the Council and Regulation (EC) No 2006/2004 of the European Parliament and of the Council


    (‘Unfair Commercial Practices Directive’)


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty establishing the European Community, and in particular Article 95 thereof,


    Having regard to the proposal from the Commission,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Acting in accordance with the procedure laid down in Article 251 of the Treaty

    (

    2

    )

    ,


    Whereas:


    (1)'
- id: art-2
  title: Article 153(1) and (3)(a) of the Treaty provides that the Community is to contribute to the attainment of a high level of consumer protection by the measures it adopts pursuant to Article 95 thereof.
  text: 'Article 153(1) and (3)(a) of the Treaty provides that the Community is to contribute to the attainment of a high level of consumer protection by the measures it adopts pursuant to Article 95 thereof.


    (2)


    In accordance with Article 14(2) of the Treaty, the internal market comprises an area without internal frontiers in which the free movement of goods and services and freedom of establishment are ensured.
    The development of fair commercial practices within the area without internal frontiers is vital for the promotion of the development of cross-border activities.


    (3)


    The laws of the Member States relating to unfair commercial practices show marked differences which can generate appreciable distortions of competition and obstacles to the smooth functioning of the
    internal market. In the field of advertising, Council Directive 84/450/EEC of 10 September 1984 concerning misleading and comparative advertising

    (

    3

    )

    establishes minimum criteria for harmonising legislation on misleading advertising, but does not prevent the Member States from retaining or adopting measures which provide more extensive protection
    for consumers. As a result, Member States'' provisions on misleading advertising diverge significantly.


    (4)


    These disparities cause uncertainty as to which national rules apply to unfair commercial practices harming consumers'' economic interests and create many barriers affecting business and consumers.
    These barriers increase the cost to business of exercising internal market freedoms, in particular when businesses wish to engage in cross border marketing, advertising campaigns and sales promotions.
    Such barriers also make consumers uncertain of their rights and undermine their confidence in the internal market.


    (5)


    In the absence of uniform rules at Community level, obstacles to the free movement of services and goods across borders or the freedom of establishment could be justified in the light of the case-law
    of the Court of Justice of the European Communities as long as they seek to protect recognised public interest objectives and are proportionate to those objectives. In view of the Community''s objectives,
    as set out in the provisions of the Treaty and in secondary Community law relating to freedom of movement, and in accordance with the Commission''s policy on commercial communications as indicated in
    the Communication from the Commission entitled ‘The follow-up to the Green Paper on Commercial Communications in the Internal Market’, such obstacles should be eliminated. These obstacles can only be
    eliminated by establishing uniform rules at Community level which establish a high level of consumer protection and by clarifying certain legal concepts at Community level to the extent necessary for
    the proper functioning of the internal market and to meet the requirement of legal certainty.


    (6)


    This Directive therefore approximates the laws of the Member States on unfair commercial practices, including unfair advertising, which directly harm consumers'' economic interests and thereby indirectly
    harm the economic interests of legitimate competitors. In line with the principle of proportionality, this Directive protects consumers from the consequences of such unfair commercial practices where
    they are material but recognises that in some cases the impact on consumers may be negligible. It neither covers nor affects the national laws on unfair commercial practices which harm only competitors''
    economic interests or which relate to a transaction between traders; taking full account of the principle of subsidiarity, Member States will continue to be able to regulate such practices, in conformity
    with Community law, if they choose to do so. Nor does this Directive cover or affect the provisions of Directive 84/450/EEC on advertising which misleads business but which is not misleading for consumers
    and on comparative advertising. Further, this Directive does not affect accepted advertising and marketing practices, such as legitimate product placement, brand differentiation or the offering of incentives
    which may legitimately affect consumers'' perceptions of products and influence their behaviour without impairing the consumer''s ability to make an informed decision.


    (7)


    This Directive addresses commercial practices directly related to influencing consumers'' transactional decisions in relation to products. It does not address commercial practices carried out primarily
    for other purposes, including for example commercial communication aimed at investors, such as annual reports and corporate promotional literature. It does not address legal requirements related to
    taste and decency which vary widely among the Member States. Commercial practices such as, for example, commercial solicitation in the streets, may be undesirable in Member States for cultural reasons.
    Member States should accordingly be able to continue to ban commercial practices in their territory, in conformity with Community law, for reasons of taste and decency even where such practices do not
    limit consumers'' freedom of choice. Full account should be taken of the context of the individual case concerned in applying this Directive, in particular the general clauses thereof.


    (8)


    This Directive directly protects consumer economic interests from unfair business-to-consumer commercial practices. Thereby, it also indirectly protects legitimate businesses from their competitors
    who do not play by the rules in this Directive and thus guarantees fair competition in fields coordinated by it. It is understood that there are other commercial practices which, although not harming
    consumers, may hurt competitors and business customers. The Commission should carefully examine the need for Community action in the field of unfair competition beyond the remit of this Directive and,
    if necessary, make a legislative proposal to cover these other aspects of unfair competition.


    (9)


    This Directive is without prejudice to individual actions brought by those who have been harmed by an unfair commercial practice. It is also without prejudice to Community and national rules on contract
    law, on intellectual property rights, on the health and safety aspects of products, on conditions of establishment and authorisation regimes, including those rules which, in conformity with Community
    law, relate to gambling activities, and to Community competition rules and the national provisions implementing them. The Member States will thus be able to retain or introduce restrictions and prohibitions
    of commercial practices on grounds of the protection of the health and safety of consumers in their territory wherever the trader is based, for example in relation to alcohol, tobacco or pharmaceuticals.
    Financial services and immovable property, by reason of their complexity and inherent serious risks, necessitate detailed requirements, including positive obligations on traders. For this reason, in
    the field of financial services and immovable property, this Directive is without prejudice to the right of Member States to go beyond its provisions to protect the economic interests of consumers.
    It is not appropriate to regulate here the certification and indication of the standard of fineness of articles of precious metal.


    (10)


    It is necessary to ensure that the relationship between this Directive and existing Community law is coherent, particularly where detailed provisions on unfair commercial practices apply to specific
    sectors. This Directive therefore amends Directive 84/450/EEC, Directive 97/7/EC of the European Parliament and of the Council of 20 May 1997 on the protection of consumers in respect of distance contracts

    (

    4

    )

    , Directive 98/27/EC of the European Parliament and of the Council of 19 May 1998 on injunctions for the protection of consumers'' interests

    (

    5

    )

    and Directive 2002/65/EC of the European Parliament and of the Council of 23 September 2002 concerning the distance marketing of consumer financial services

    (

    6

    )

    . This Directive accordingly applies only in so far as there are no specific Community law provisions regulating specific aspects of unfair commercial practices, such as information requirements and
    rules on the way the information is presented to the consumer. It provides protection for consumers where there is no specific sectoral legislation at Community level and prohibits traders from creating
    a false impression of the nature of products. This is particularly important for complex products with high levels of risk to consumers, such as certain financial services products. This Directive consequently
    complements the Community

    acquis

    , which is applicable to commercial practices harming consumers'' economic interests.


    (11)


    The high level of convergence achieved by the approximation of national provisions through this Directive creates a high common level of consumer protection. This Directive establishes a single general
    prohibition of those unfair commercial practices distorting consumers'' economic behaviour. It also sets rules on aggressive commercial practices, which are currently not regulated at Community level.


    (12)


    Harmonisation will considerably increase legal certainty for both consumers and business. Both consumers and business will be able to rely on a single regulatory framework based on clearly defined legal
    concepts regulating all aspects of unfair commercial practices across the EU. The effect will be to eliminate the barriers stemming from the fragmentation of the rules on unfair commercial practices
    harming consumer economic interests and to enable the internal market to be achieved in this area.


    (13)


    In order to achieve the Community''s objectives through the removal of internal market barriers, it is necessary to replace Member States'' existing, divergent general clauses and legal principles.
    The single, common general prohibition established by this Directive therefore covers unfair commercial practices distorting consumers'' economic behaviour. In order to support consumer confidence the
    general prohibition should apply equally to unfair commercial practices which occur outside any contractual relationship between a trader and a consumer or following the conclusion of a contract and
    during its execution. The general prohibition is elaborated by rules on the two types of commercial practices which are by far the most common, namely misleading commercial practices and aggressive
    commercial practices.


    (14)


    It is desirable that misleading commercial practices cover those practices, including misleading advertising, which by deceiving the consumer prevent him from making an informed and thus efficient choice.
    In conformity with the laws and practices of Member States on misleading advertising, this Directive classifies misleading practices into misleading actions and misleading omissions. In respect of omissions,
    this Directive sets out a limited number of key items of information which the consumer needs to make an informed transactional decision. Such information will not have to be disclosed in all advertisements,
    but only where the trader makes an invitation to purchase, which is a concept clearly defined in this Directive. The full harmonisation approach adopted in this Directive does not preclude the Member
    States from specifying in national law the main characteristics of particular products such as, for example, collectors'' items or electrical goods, the omission of which would be material when an invitation
    to purchase is made. It is not the intention of this Directive to reduce consumer choice by prohibiting the promotion of products which look similar to other products unless this similarity confuses
    consumers as to the commercial origin of the product and is therefore misleading. This Directive should be without prejudice to existing Community law which expressly affords Member States the choice
    between several regulatory options for the protection of consumers in the field of '
- id: art-3
  title: CHAPTER 1
  text: 'CHAPTER 1


    GENERAL PROVISIONS'
- id: art-4
  title: Article 1
  text: 'Article 1


    Purpose


    The purpose of this Directive is to contribute to the proper functioning of the internal market and achieve a high level of consumer protection by approximating the laws, regulations and administrative
    provisions of the Member States on unfair commercial practices harming consumers'' economic interests.'
- id: art-5
  title: Article 2
  text: 'Article 2


    Definitions


    For the purposes of this Directive:


    (a)


    ‘consumer’ means any natural person who, in commercial practices covered by this Directive, is acting for purposes which are outside his trade, business, craft or profession;


    (b)


    ‘trader’ means any natural or legal person who, in commercial practices covered by this Directive, is acting for purposes relating to his trade, business, craft or profession and anyone acting in the
    name of or on behalf of a trader;


    (c)


    ‘product’ means any goods or service including immovable property, rights and obligations;


    (d)


    ‘business-to-consumer commercial practices’ (hereinafter also referred to as commercial practices) means any act, omission, course of conduct or representation, commercial communication including advertising
    and marketing, by a trader, directly connected with the promotion, sale or supply of a product to consumers;


    (e)


    ‘to materially distort the economic behaviour of consumers’ means using a commercial practice to appreciably impair the consumer''s ability to make an informed decision, thereby causing the consumer
    to take a transactional decision that he would not have taken otherwise;


    (f)


    ‘code of conduct’ means an agreement or set of rules not imposed by law, regulation or administrative provision of a Member State which defines the behaviour of traders who undertake to be bound by
    the code in relation to one or more particular commercial practices or business sectors;


    (g)


    ‘code owner’ means any entity, including a trader or group of traders, which is responsible for the formulation and revision of a code of conduct and/or for monitoring compliance with the code by those
    who have undertaken to be bound by it;


    (h)


    ‘professional diligence’ means the standard of special skill and care which a trader may reasonably be expected to exercise towards consumers, commensurate with honest market practice and/or the general
    principle of good faith in the trader''s field of activity;


    (i)


    ‘invitation to purchase’ means a commercial communication which indicates characteristics of the product and the price in a way appropriate to the means of the commercial communication used and thereby
    enables the consumer to make a purchase;


    (j)


    ‘undue influence’ means exploiting a position of power in relation to the consumer so as to apply pressure, even without using or threatening to use physical force, in a way which significantly limits
    the consumer''s ability to make an informed decision;


    (k)


    ‘transactional decision’ means any decision taken by a consumer concerning whether, how and on what terms to purchase, make payment in whole or in part for, retain or dispose of a product or to exercise
    a contractual right in relation to the product, whether the consumer decides to act or to refrain from acting;


    (l)


    ‘regulated profession’ means a professional activity or a group of professional activities, access to which or the pursuit of which, or one of the modes of pursuing which, is conditional, directly or
    indirectly, upon possession of specific professional qualifications, pursuant to laws, regulations or administrative provisions.'
- id: art-6
  title: Article 3
  text: 'Article 3


    Scope


    1.   This Directive shall apply to unfair business-to-consumer commercial practices, as laid down in Article 5, before, during and after a commercial transaction in relation to a product.


    2.   This Directive is without prejudice to contract law and, in particular, to the rules on the validity, formation or effect of a contract.


    3.   This Directive is without prejudice to Community or national rules relating to the health and safety aspects of products.


    4.   In the case of conflict between the provisions of this Directive and other Community rules regulating specific aspects of unfair commercial practices, the latter shall prevail and apply to those
    specific aspects.


    5.   For a period of six years from 12 June 2007, Member States shall be able to continue to apply national provisions within the field approximated by this Directive which are more restrictive or prescriptive
    than this Directive and which implement directives containing minimum harmonisation clauses. These measures must be essential to ensure that consumers are adequately protected against unfair commercial
    practices and must be proportionate to the attainment of this objective. The review referred to in Article 18 may, if considered appropriate, include a proposal to prolong this derogation for a further
    limited period.


    6.   Member States shall notify the Commission without delay of any national provisions applied on the basis of paragraph 5.


    7.   This Directive is without prejudice to the rules determining the jurisdiction of the courts.


    8.   This Directive is without prejudice to any conditions of establishment or of authorisation regimes, or to the deontological codes of conduct or other specific rules governing regulated professions
    in order to uphold high standards of integrity on the part of the professional, which Member States may, in conformity with Community law, impose on professionals.


    9.   In relation to ‘financial services’, as defined in Directive 2002/65/EC, and immovable property, Member States may impose requirements which are more restrictive or prescriptive than this Directive
    in the field which it approximates.


    10.   This Directive shall not apply to the application of the laws, regulations and administrative provisions of Member States relating to the certification and indication of the standard of fineness
    of articles of precious metal.'
- id: art-7
  title: Article 4
  text: 'Article 4


    Internal market


    Member States shall neither restrict the freedom to provide services nor restrict the free movement of goods for reasons falling within the field approximated by this Directive.'
- id: art-8
  title: CHAPTER 2
  text: 'CHAPTER 2


    UNFAIR COMMERCIAL PRACTICES'
- id: art-9
  title: Article 5
  text: 'Article 5


    Prohibition of unfair commercial practices


    1.   Unfair commercial practices shall be prohibited.


    2.   A commercial practice shall be unfair if:


    (a)


    it is contrary to the requirements of professional diligence,


    and


    (b)


    it materially distorts or is likely to materially distort the economic behaviour with regard to the product of the average consumer whom it reaches or to whom it is addressed, or of the average member
    of the group when a commercial practice is directed to a particular group of consumers.


    3.   Commercial practices which are likely to materially distort the economic behaviour only of a clearly identifiable group of consumers who are particularly vulnerable to the practice or the underlying
    product because of their mental or physical infirmity, age or credulity in a way which the trader could reasonably be expected to foresee, shall be assessed from the perspective of the average member
    of that group. This is without prejudice to the common and legitimate advertising practice of making exaggerated statements or statements which are not meant to be taken literally.


    4.   In particular, commercial practices shall be unfair which:


    (a)


    are misleading as set out in Articles 6 and 7,


    or


    (b)


    are aggressive as set out in Articles 8 and 9.


    5.   Annex I contains the list of those commercial practices which shall in all circumstances be regarded as unfair. The same single list shall apply in all Member States and may only be modified by
    revision of this Directive.'
- id: art-10
  title: Section 1
  text: 'Section 1


    Misleading commercial practices'
- id: art-11
  title: Article 6
  text: 'Article 6


    Misleading actions


    1.   A commercial practice shall be regarded as misleading if it contains false information and is therefore untruthful or in any way, including overall presentation, deceives or is likely to deceive
    the average consumer, even if the information is factually correct, in relation to one or more of the following elements, and in either case causes or is likely to cause him to take a transactional
    decision that he would not have taken otherwise:


    (a)


    the existence or nature of the product;


    (b)


    the main characteristics of the product, such as its availability, benefits, risks, execution, composition, accessories, after-sale customer assistance and complaint handling, method and date of manufacture
    or provision, delivery, fitness for purpose, usage, quantity, specification, geographical or commercial origin or the results to be expected from its use, or the results and material features of tests
    or checks carried out on the product;


    (c)


    the extent of the trader''s commitments, the motives for the commercial practice and the nature of the sales process, any statement or symbol in relation to direct or indirect sponsorship or approval
    of the trader or the product;


    (d)


    the price or the manner in which the price is calculated, or the existence of a specific price advantage;


    (e)


    the need for a service, part, replacement or repair;


    (f)


    the nature, attributes and rights of the trader or his agent, such as his identity and assets, his qualifications, status, approval, affiliation or connection and ownership of industrial, commercial
    or intellectual property rights or his awards and distinctions;


    (g)


    the consumer''s rights, including the right to replacement or reimbursement under Directive 1999/44/EC of the European Parliament and of the Council of 25 May 1999 on certain aspects of the sale of
    consumer goods and associated guarantees

    (

    8

    )

    , or the risks he may face.


    2.   A commercial practice shall also be regarded as misleading if, in its factual context, taking account of all its features and circumstances, it causes or is likely to cause the average consumer
    to take a transactional decision that he would not have taken otherwise, and it involves:


    (a)


    any marketing of a product, including comparative advertising, which creates confusion with any products, trade marks, trade names or other distinguishing marks of a competitor;


    (b)


    non-compliance by the trader with commitments contained in codes of conduct by which the trader has undertaken to be bound, where:


    (i)


    the commitment is not aspirational but is firm and is capable of being verified,


    and


    (ii)


    the trader indicates in a commercial practice that he is bound by the code.'
- id: art-12
  title: Article 7
  text: 'Article 7


    Misleading omissions


    1.   A commercial practice shall be regarded as misleading if, in its factual context, taking account of all its features and circumstances and the limitations of the communication medium, it omits
    material information that the average consumer needs, according to the context, to take an informed transactional decision and thereby causes or is likely to cause the average consumer to take a transactional
    decision that he would not have taken otherwise.


    2.   It shall also be regarded as a misleading omission when, taking account of the matters described in paragraph 1, a trader hides or provides in an unclear, unintelligible, ambiguous or untimely
    manner such material information as referred to in that paragraph or fails to identify the commercial intent of the commercial practice if not already apparent from the context, and where, in either
    case, this causes or is likely to cause the average consumer to take a transactional decision that he would not have taken otherwise.


    3.   Where the medium used to communicate the commercial practice imposes limitations of space or time, these limitations and any measures taken by the trader to make the information available to consumers
    by other means shall be taken into account in deciding whether information has been omitted.


    4.   In the case of an invitation to purchase, the following information shall be regarded as material, if not already apparent from the context:


    (a)


    the main characteristics of the product, to an extent appropriate to the medium and the product;


    (b)


    the geographical address and the identity of the trader, such as his trading name and, where applicable, the geographical address and the identity of the trader on whose behalf he is acting;


    (c)


    the price inclusive of taxes, or where the nature of the product means that the price cannot reasonably be calculated in advance, the manner in which the price is calculated, as well as, where appropriate,
    all additional freight, delivery or postal charges or, where these charges cannot reasonably be calculated in advance, the fact that such additional charges may be payable;


    (d)


    the arrangements for payment, delivery, performance and the complaint handling policy, if they depart from the requirements of professional diligence;


    (e)


    for products and transactions involving a right of withdrawal or cancellation, the existence of such a right.


    5.   Information requirements established by Community law in relation to commercial communication including advertising or marketing, a non-exhaustive list of which is contained in Annex II, shall
    be regarded as material.'
- id: art-13
  title: Section 2
  text: 'Section 2


    Aggressive commercial practices'
- id: art-14
  title: Article 8
  text: 'Article 8


    Aggressive commercial practices


    A commercial practice shall be regarded as aggressive if, in its factual context, taking account of all its features and circumstances, by harassment, coercion, including the use of physical force,
    or undue influence, it significantly impairs or is likely to significantly impair the average consumer''s freedom of choice or conduct with regard to the product and thereby causes him or is likely
    to cause him to take a transactional decision that he would not have taken otherwise.'
- id: art-15
  title: Article 9
  text: 'Article 9


    Use of harassment, coercion and undue influence


    In determining whether a commercial practice uses harassment, coercion, including the use of physical force, or undue influence, account shall be taken of:


    (a)


    its timing, location, nature or persistence;


    (b)


    the use of threatening or abusive language or behaviour;


    (c)


    the exploitation by the trader of any specific misfortune or circumstance of such gravity as to impair the consumer''s judgement, of which the trader is aware, to influence the consumer''s decision
    with regard to the product;


    (d)


    any onerous or disproportionate non-contractual barriers imposed by the trader where a consumer wishes to exercise rights under the contract, including rights to terminate a contract or to switch to
    another product or another trader;


    (e)


    any threat to take any action that cannot legally be taken.'
- id: art-16
  title: CHAPTER 3
  text: 'CHAPTER 3


    CODES OF CONDUCT'
- id: art-17
  title: Article 10
  text: 'Article 10


    Codes of conduct


    This Directive does not exclude the control, which Member States may encourage, of unfair commercial practices by code owners and recourse to such bodies by the persons or organisations referred to
    in Article 11 if proceedings before such bodies are in addition to the court or administrative proceedings referred to in that Article.


    Recourse to such control bodies shall never be deemed the equivalent of foregoing a means of judicial or administrative recourse as provided for in Article 11.'
- id: art-18
  title: CHAPTER 4
  text: 'CHAPTER 4


    FINAL PROVISIONS'
- id: art-19
  title: Article 11
  text: 'Article 11


    Enforcement


    1.   Member States shall ensure that adequate and effective means exist to combat unfair commercial practices in order to enforce compliance with the provisions of this Directive in the interest of
    consumers.


    Such means shall include legal provisions under which persons or organisations regarded under national law as having a legitimate interest in combating unfair commercial practices, including competitors,
    may:


    (a)


    take legal action against such unfair commercial practices;


    and/or


    (b)


    bring such unfair commercial practices before an administrative authority competent either to decide on complaints or to initiate appropriate legal proceedings.


    It shall be for each Member State to decide which of these facilities shall be available and whether to enable the courts or administrative authorities to require prior recourse to other established
    means of dealing with complaints, including those referred to in Article 10. These facilities shall be available regardless of whether the consumers affected are in the territory of the Member State
    where the trader is located or in another Member State.


    It shall be for each Member State to decide:


    (a)


    whether these legal facilities may be directed separately or jointly against a number of traders from the same economic sector;


    and


    (b)


    whether these legal facilities may be directed against a code owner where the relevant code promotes non-compliance with legal requirements.


    2.   Under the legal provisions referred to in paragraph 1, Member States shall confer upon the courts or administrative authorities powers enabling them, in cases where they deem such measures to be
    necessary taking into account all the interests involved and in particular the public interest:


    (a)


    to order the cessation of, or to institute appropriate legal proceedings for an order for the cessation of, unfair commercial practices;


    or


    (b)


    if the unfair commercial practice has not yet been carried out but is imminent, to order the prohibition of the practice, or to institute appropriate legal proceedings for an order for the prohibition
    of the practice,


    even without proof of actual loss or damage or of intention or negligence on the part of the trader.


    Member States shall also make provision for the measures referred to in the first subparagraph to be taken under an accelerated procedure:


    —


    either with interim effect,


    or


    —


    with definitive effect,


    on the understanding that it is for each Member State to decide which of the two options to select.


    Furthermore, Member States may confer upon the courts or administrative authorities powers enabling them, with a view to eliminating the continuing effects of unfair commercial practices the cessation
    of which has been ordered by a final decision:


    (a)


    to require publication of that decision in full or in part and in such form as they deem adequate;


    (b)


    to require in addition the publication of a corrective statement.


    3.   The administrative authorities referred to in paragraph 1 must:


    (a)


    be composed so as not to cast doubt on their impartiality;


    (b)


    have adequate powers, where they decide on complaints, to monitor and enforce the observance of their decisions effectively;


    (c)


    normally give reasons for their decisions.


    Where the powers referred to in paragraph 2 are exercised exclusively by an administrative authority, reasons for its decisions shall always be given. Furthermore, in this case, provision must be made
    for procedures whereby improper or unreasonable exercise of its powers by the administrative authority or improper or unreasonable failure to exercise the said powers can be the subject of judicial
    review.'
- id: art-20
  title: Article 12
  text: 'Article 12


    Courts and administrative authorities: substantiation of claims


    Member States shall confer upon the courts or administrative authorities powers enabling them in the civil or administrative proceedings provided for in Article 11:


    (a)


    to require the trader to furnish evidence as to'
