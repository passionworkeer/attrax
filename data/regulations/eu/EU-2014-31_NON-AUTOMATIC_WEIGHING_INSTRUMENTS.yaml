  text: 'L_2014096EN.01010701.xml


    29.3.2014


    EN


    Official Journal of the European Union


    L 96/107


    DIRECTIVE 2014/31/EU OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 26 February 2014



    on the harmonisation of the laws of the Member States relating to the making available on the market of non-automatic weighing instruments


    (recast)


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 114 thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    Directive 2009/23/EC of the European Parliament and of the Council of 23 April 2009 on non-automatic weighing instruments

    (

    3

    )

    has been substantially amended

    (

    4

    )

    . Since further amendments are to be made, that Directive should be recast in the interests of clarity.


    (2)


    Regulation (EC) No 765/2008 of the European Parliament and of the Council of 9 July 2008 setting out the requirements for accreditation and market surveillance relating to the marketing of products

    (

    5

    )

    lays down rules on the accreditation of conformity assessment bodies, provides a framework for the market surveillance of products and for controls on products from third countries, and lays down the
    general principles of the CE marking.


    (3)


    Decision No 768/2008/EC of the European Parliament and of the Council of 9 July 2008 on a common framework for the marketing of products

    (

    6

    )

    lays down common principles and reference provisions intended to apply across sectoral legislation in order to provide a coherent basis for revision or recasts of that legislation. Directive 2009/23/EC
    should therefore be adapted to that Decision.


    (4)


    This Directive covers non-automatic weighing instruments which are new to the Union market when they are placed on the market; that is to say they are either new non-automatic weighing instruments made
    by a manufacturer established in the Union or non-automatic weighing instruments, whether new or second-hand, imported from a third country.


    (5)


    Member States should have the responsibility of protecting the public against incorrect results of weighing operations by means of non-automatic weighing instruments when used for certain categories
    of applications.


    (6)


    This Directive should apply to all forms of supply, including distance selling.


    (7)


    Economic operators should be responsible for the compliance of non-automatic weighing instruments with this Directive in relation to their respective roles in the supply chain, so as to ensure a high
    level of protection of public interests covered by this Directive, and to guarantee fair competition on the Union market.


    (8)


    All economic operators intervening in the supply and distribution chain should take appropriate measures to ensure that they only make available on the market non-automatic weighing instruments which
    are in conformity with this Directive. It is necessary to provide for a clear and proportionate distribution of obligations which correspond to the role of each economic operator in the supply and distribution
    chain.


    (9)


    In order to facilitate communication between economic operators, market surveillance authorities and end-users, Member States should encourage economic operators to include a website address in addition
    to the postal address.


    (10)


    The manufacturer, having detailed knowledge of the design and production process, is best placed to carry out the conformity assessment procedure. Conformity assessment should therefore remain solely
    the obligation of the manufacturer.


    (11)


    It is necessary to ensure that non-automatic weighing instruments from third countries entering the Union market comply with this Directive, and in particular that appropriate conformity assessment
    procedures have been carried out by manufacturers with regard to those non-automatic weighing instruments. Provision should therefore be made for importers to make sure that the non-automatic weighing
    instruments they place on the market comply with the requirements of this Directive and that they do not place on the market non-automatic weighing instruments which do not comply with such requirements
    or present a risk. Provision should also be made for importers to make sure that conformity assessment procedures have been carried out and that marking of non-automatic weighing instruments and documentation
    drawn up by manufacturers are available for inspection by the competent national authorities.


    (12)


    When placing a non-automatic weighing instrument on the market, every importer should indicate on the non-automatic weighing instrument his name, registered trade name or registered trade mark and the
    postal address at which he can be contacted. Exceptions should be provided, including for cases where the importer should have to open the packaging only for the purpose of putting his name and address
    on the instrument.


    (13)


    The distributor makes a non-automatic weighing instrument available on the market after it has been placed on the market by the manufacturer or the importer and should act with due care to ensure that
    its handling of the non-automatic weighing instrument does not adversely affect the compliance of that instrument.


    (14)


    Any economic operator that either places a non-automatic weighing instrument on the market under his own name or trade mark or modifies a non-automatic weighing instrument in such a way that compliance
    with this Directive may be affected should be considered to be the manufacturer and should assume the obligations of the manufacturer.


    (15)


    Distributors and importers, being close to the market place, should be involved in market surveillance tasks carried out by the competent national authorities, and should be prepared to participate
    actively, providing those authorities with all necessary information relating to the non-automatic weighing instrument concerned.


    (16)


    Ensuring traceability of a non-automatic weighing instrument throughout the whole supply chain helps to make market surveillance simpler and more efficient. An efficient traceability system facilitates
    market surveillance authorities’ task of tracing economic operators who made non-compliant non-automatic weighing instruments available on the market. When keeping the information required under this
    Directive for the identification of other economic operators, economic operators should not be required to update such information in respect of other economic operators who have either supplied them
    with a non-automatic weighing instrument or to whom they have supplied a non-automatic weighing instrument.


    (17)


    This Directive should be limited to the expression of the essential requirements as regards metrology and performance in relation to non-automatic weighing instruments. In order to facilitate conformity
    assessment with those essential requirements as regards metrology and performance, it is necessary to provide for a presumption of conformity for non-automatic weighing instruments which are in conformity
    with harmonised standards that are adopted in accordance with Regulation (EU) No 1025/2012 of the European Parliament and of the Council of 25 October 2012 on European Standardisation

    (

    7

    )

    for the purpose of expressing detailed technical specifications of those requirements, in particular as to the metrological, design and construction characteristics.


    (18)


    Regulation (EU) No 1025/2012 provides for a procedure for objections to harmonised standards where those standards do not entirely satisfy the requirements of this Directive.


    (19)


    Assessment of conformity with the relevant metrological and technical provisions is necessary to provide effective protection for users and third parties.


    (20)


    In order to enable economic operators to demonstrate and the competent authorities to ensure that non-automatic weighing instruments made available on the market conform to the essential requirements,
    it is necessary to provide for conformity assessment procedures. Decision No 768/2008/EC establishes modules for conformity assessment procedures, which include procedures from the least to the most
    stringent, in proportion to the level of risk involved and the level of safety required. In order to ensure inter-sectoral coherence and to avoid ad-hoc variants, conformity assessment procedures should
    be chosen from among those modules.


    (21)


    Manufacturers should draw up an EU declaration of conformity to provide information required under this Directive on the conformity of a non-automatic weighing instrument with the requirements of this
    Directive and of other relevant Union harmonisation legislation.


    (22)


    To ensure effective access to information for market surveillance purposes, the information required to identify all applicable Union acts should be available in a single EU declaration of conformity.
    In order to reduce the administrative burden on economic operators, that single EU declaration of conformity may be a dossier made up of relevant individual declarations of conformity.


    (23)


    The CE marking and the supplementary metrology marking, indicating the conformity of a non-automatic weighing instrument, are the visible consequence of a whole process comprising conformity assessment
    in a broad sense. General principles governing the CE marking and its relationship to other markings are set out in Regulation (EC) No 765/2008. Rules governing the affixing of the CE marking and the
    supplementary metrology marking should be laid down in this Directive.


    (24)


    The conformity assessment procedures set out in this Directive require the intervention of conformity assessment bodies, which are notified by the Member States to the Commission.


    (25)


    Experience has shown that the criteria set out in Directive 2009/23/EC that conformity assessment bodies have to fulfil to be notified to the Commission are not sufficient to ensure a uniformly high
    level of performance of notified bodies throughout the Union. It is, however, essential that all notified bodies perform their functions to the same level and under conditions of fair competition. That
    requires the setting of obligatory requirements for conformity assessment bodies wishing to be notified in order to provide conformity assessment services.


    (26)


    If a conformity assessment body demonstrates conformity with the criteria laid down in harmonised standards, it should be presumed to comply with the corresponding requirements set out in this Directive.


    (27)


    In order to ensure a consistent level of conformity assessment quality, it is also necessary to set requirements for notifying authorities and other bodies involved in the assessment, notification and
    monitoring of notified bodies.


    (28)


    The system set out in this Directive should be complemented by the accreditation system provided for in Regulation (EC) No 765/2008. Since accreditation is an essential means of verifying the competence
    of conformity assessment bodies, it should also be used for the purposes of notification.


    (29)


    Transparent accreditation as provided for in Regulation (EC) No 765/2008, ensuring the necessary level of confidence in certificates of conformity, should be considered by the national public authorities
    throughout the Union as the preferred means of demonstrating the technical competence of conformity assessment bodies. However, national authorities may consider that they possess the appropriate means
    of carrying out that evaluation themselves. In such cases, in order to ensure the appropriate level of credibility of evaluations carried out by other national authorities, they should provide the Commission
    and the other Member States with the necessary documentary evidence demon'
- id: art-2
  title: CHAPTER 1
  text: 'CHAPTER 1


    GENERAL PROVISIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Scope


    1.   This Directive shall apply to all non-automatic weighing instruments.


    2.   For the purposes of this Directive, the following categories of use of non-automatic weighing instruments shall be distinguished:


    (a)


    determination of mass for commercial transactions;


    (b)


    determination of mass for the calculation of a toll, tariff, tax, bonus, penalty, remuneration, indemnity or similar type of payment;


    (c)


    determination of mass for the application of laws or regulations or for an expert opinion given in court proceedings;


    (d)


    determination of mass in the practice of medicine for weighing patients for the purposes of monitoring, diagnosis and medical treatment;


    (e)


    determination of mass for making up medicines on prescription in a pharmacy and determination of mass in analyses carried out in medical and pharmaceutical laboratories;


    (f)


    determination of price on the basis of mass for the purposes of direct sales to the public and the making-up of prepackages;


    (g)


    all applications other than those listed in points (a) to (f).'
- id: art-4
  title: Article 2
  text: 'Article 2


    Definitions


    For the purposes of this Directive, the following definitions shall apply:


    (1)


    ‘weighing instrument’ means a measuring instrument serving to determine the mass of a body by using the action of gravity on that body. A weighing instrument may also serve to determine other mass-related
    magnitudes, quantities, parameters or characteristics;


    (2)


    ‘non-automatic weighing instrument’ or ‘instrument’ means a weighing instrument requiring the intervention of an operator during weighing;


    (3)


    ‘making available on the market’ means any supply of an instrument for distribution or use on the Union market in the course of a commercial activity, whether in return for payment or free of charge;


    (4)


    ‘placing on the market’ means the first making available of an instrument on the Union market;


    (5)


    ‘manufacturer’ means any natural or legal person who manufactures an instrument or has an instrument designed or manufactured, and markets that instrument under his name or trade mark;


    (6)


    ‘authorised representative’ means any natural or legal person established within the Union who has received a written mandate from a manufacturer to act on his behalf in relation to specified tasks;


    (7)


    ‘importer’ means any natural or legal person established within the Union who places an instrument from a third country on the Union market;


    (8)


    ‘distributor’ means any natural or legal person in the supply chain, other than the manufacturer or the importer, who makes an instrument available on the market;


    (9)


    ‘economic operators’ means the manufacturer, the authorised representative, the importer and the distributor;


    (10)


    ‘technical specification’ means a document that prescribes technical requirements to be fulfilled by an instrument;


    (11)


    ‘harmonised standard’ means harmonised standard as defined in point (c) of point 1 of Article 2 of Regulation (EU) No 1025/2012;


    (12)


    ‘accreditation’ means accreditation as defined in point 10 of Article 2 of Regulation (EC) No 765/2008;


    (13)


    ‘national accreditation body’ means national accreditation body as defined in point 11 of Article 2 of Regulation (EC) No 765/2008;


    (14)


    ‘conformity assessment’ means the process demonstrating whether the essential requirements of this Directive relating to an instrument have been fulfilled;


    (15)


    ‘conformity assessment body’ means a body that performs conformity assessment activities including calibration, testing, certification and inspection;


    (16)


    ‘recall’ means any measure aimed at achieving the return of an instrument that has already been made available to the end-user;


    (17)


    ‘withdrawal’ means any measure aimed at preventing an instrument in the supply chain from being made available on the market;


    (18)


    ‘Union harmonisation legislation’ means any Union legislation harmonising the conditions for the marketing of products;


    (19)


    ‘CE marking’ means a marking by which the manufacturer indicates that the instrument is in conformity with the applicable requirements set out in Union harmonisation legislation providing for its affixing.'
- id: art-5
  title: Article 3
  text: 'Article 3


    Making available on the market and putting into service


    1.   Member States shall take all steps to ensure that only instruments that meet the applicable requirements of this Directive may be made available on the market.


    2.   Member States shall take all steps to ensure that instruments may not be put into service for the uses referred to in points (a) to (f) of Article 1(2) unless they meet the requirements of this
    Directive.


    3.   Member States shall take all steps to ensure that instruments put into service for the uses referred to in points (a) to (f) of Article 1(2) continue to conform to the applicable requirements of
    this Directive.'
- id: art-6
  title: Article 4
  text: 'Article 4


    Essential requirements


    Instruments used or intended to be used for the applications listed in points (a) to (f) of Article 1(2) shall satisfy the essential requirements set out in Annex I.


    Where the instrument includes, or is connected to, devices which are not used or intended to be used for the applications listed in points (a) to (f) of Article 1(2), such devices shall not be subject
    to those essential requirements.'
- id: art-7
  title: Article 5
  text: 'Article 5


    Free movement of instruments


    1.   Member States shall not impede the making available on the market of instruments which meet the requirements of this Directive.


    2.   Member States shall not impede the putting into service, for the uses referred to in points (a) to (f) of Article 1(2), of instruments which meet the requirements of this Directive.'
- id: art-8
  title: CHAPTER 2
  text: 'CHAPTER 2


    OBLIGATIONS OF ECONOMIC OPERATORS'
- id: art-9
  title: Article 6
  text: 'Article 6


    Obligations of manufacturers


    1.   When placing on the market their instruments intended to be used for the applications listed in points (a) to (f) of Article 1(2), manufacturers shall ensure that they have been designed and manufactured
    in accordance with the essential requirements set out in Annex I.


    2.   For the instruments intended to be used for the applications listed in points (a) to (f) of Article 1(2), manufacturers shall draw up the technical documentation referred to in Annex II and carry
    out the relevant conformity assessment procedure referred to in Article 13 or have it carried out.


    Where compliance of an instrument intended to be used for the applications listed in points (a) to (f) of Article 1(2) with the applicable requirements has been demonstrated by that conformity assessment
    procedure, manufacturers shall draw up an EU declaration of conformity and affix the CE marking and the supplementary metrology marking.


    3.   For the instruments intended to be used for the applications listed in points (a) to (f) of Article 1(2), manufacturers shall keep the technical documentation and the EU declaration of conformity
    for 10 years after the instrument has been placed on the market.


    4.   Manufacturers shall ensure that procedures are in place for series production to remain in conformity with this Directive. Changes in instrument design or characteristics and changes in the harmonised
    standards or in other technical specifications by reference to which conformity of an instrument is declared shall be adequately taken into account.


    When deemed appropriate with regard to the risks presented by an instrument intended to be used for the applications listed in points (a) to (f) of Article 1(2), manufacturers shall carry out sample
    testing of instruments made available on the market, investigate, and, if necessary, keep a register of complaints, of non-conforming instruments and instrument recalls, and shall keep distributors
    informed of any such monitoring.


    5.   Manufacturers shall ensure that instruments which they have placed on the market bear a type, batch or serial number or other element allowing their identification, as set out in Annex III.


    For the instruments intended to be used for the applications listed in points (a) to (f) of Article 1(2), manufacturers shall affix the inscriptions provided for in point 1 of Annex III.


    For the instruments not intended to be used for the applications listed in points (a) to (f) of Article 1(2), manufacturers shall affix the inscriptions provided for in point 2 of Annex III.


    Where an instrument which is intended to be used for any of the applications listed in points (a) to (f) of Article 1(2) includes, or is connected to, devices which are not used or intended to be used
    for the applications listed in points (a) to (f) of Article 1(2), manufacturers shall affix to each of those devices the restrictive use symbol as provided for in Article 18 and in point 3 of Annex
    III.


    6.   Manufacturers shall indicate on the instrument their name, registered trade name or registered trade mark and the postal address at which they can be contacted. The address shall indicate a single
    point at which the manufacturer can be contacted. The contact details shall be in a language easily understood by end-users and market surveillance authorities.


    7.   Manufacturers shall ensure that the instrument intended to be used for the applications listed in points (a) to (f) of Article 1(2) is accompanied by instructions and information in a language
    which can be easily understood by end-users, as determined by the Member State concerned. Such instructions and information, as well as any labelling, shall be clear, understandable and intelligible.


    8.   Manufacturers who consider or have reason to believe that an instrument which they have placed on the market is not in conformity with this Directive shall immediately take the corrective measures
    necessary to bring that instrument into conformity, to withdraw it or recall it, if appropriate. Furthermore, where the instrument presents a risk, manufacturers shall immediately inform the competent
    national authorities of the Member States in which they made the instrument available on the market to that effect, giving details, in particular, of the non-compliance and of any corrective measures
    taken.


    9.   Manufacturers shall, further to a reasoned request from a competent national authority, provide it with all the information and documentation in paper or electronic form necessary to demonstrate
    the conformity of the instrument with this Directive, in a language which can be easily understood by that authority. They shall cooperate with that authority, at its request, on any action taken to
    eliminate the risks posed by instruments which they have placed on the market.'
- id: art-10
  title: Article 7
  text: 'Article 7


    Authorised representatives


    1.   A manufacturer may, by a written mandate, appoint an authorised representative.


    The obligations laid down in Article 6(1) and the obligation to draw up technical documentation referred to in Article 6(2) shall not form part of the authorised representative’s mandate.


    2.   An authorised representative shall perform the tasks specified in the mandate received from the manufacturer. The mandate shall allow the authorised representative to do at least the following:


    (a)


    keep the EU declaration of conformity and the technical documentation at the disposal of national market surveillance authorities for 10 years after the instrument has been placed on the market;


    (b)


    further to a reasoned request from a competent national authority, provide that authority with all the information and documentation necessary to demonstrate the conformity of an instrument;


    (c)


    cooperate with the competent national authorities, at their request, on any action taken to eliminate the risks posed by instruments covered by the authorised representative’s mandate.'
- id: art-11
  title: Article 8
  text: 'Article 8


    Obligations of importers


    1.   Importers shall place only compliant instruments on the market.


    2.   Before placing on the market an instrument intended to be used for the applications listed in points (a) to (f) of Article 1(2), importers shall ensure that the appropriate conformity assessment
    procedure referred to in Article 13 has been carried out by the manufacturer. They shall ensure that the manufacturer has drawn up the technical documentation, that the instrument bears the CE marking
    and the supplementary metrology marking and is accompanied by the required documents, and that the manufacturer has complied with the requirements set out in Article 6(5) and (6).


    Where an importer considers or has reason to believe that an instrument intended to be used for the applications listed in points (a) to (f) of Article 1(2) is not in conformity with the essential requirements
    set out in Annex I, he shall not place the instrument on the market until it has been brought into conformity. Furthermore, where the instrument presents a risk, the importer shall inform the manufacturer
    and the market surveillance authorities to that effect.


    Before placing on the market an instrument not intended to be used for the applications listed in points (a) to (f) of Article 1(2) importers shall ensure that the manufacturer has complied with the
    requirements set out in Article 6(5) and (6).


    3.   Importers shall indicate on the instrument their name, registered trade name or registered trade mark and the postal address at which they can be contacted. Where this would require the packaging
    to be opened, those indications may be given on the packaging and in a document accompanying the instrument. The contact details shall be in a language easily understood by end-users and market surveillance
    authorities.


    4.   Importers shall ensure that the instrument intended to be used for the applications listed in points (a) to (f) of Article 1(2) is accompanied by instructions and information in a language which
    can be easily understood by end-users, as determined by the Member State concerned.


    5.   Importers shall ensure that, while an instrument intended to be used for the applications listed in points (a) to (f) of Article 1(2) is under their responsibility, its storage or transport conditions
    do not jeopardise its compliance with the essential requirements set out in Annex I.


    6.   When deemed appropriate with regard to the risks presented by an instrument intended to be used for the applications listed in points (a) to (f) of Article 1(2), importers shall carry out sample
    testing of instruments made available on the market, investigate, and, if necessary, keep a register of complaints, of non-conforming instruments and instrument recalls, and shall keep distributors
    informed of any such monitoring.


    7.   Importers who consider or have reason to believe that an instrument which they have placed on the market is not in conformity with this Directive shall immediately take the corrective measures
    necessary to bring that instrument into conformity, to withdraw it or recall it, if appropriate. Furthermore, where the instrument presents a risk, importers shall immediately inform the competent national
    authorities of the Member States in which they made the instrument available on the market to that effect, giving details, in particular, of the non-compliance and of any corrective measures taken.


    8.   For the instruments intended to be used for the applications listed in points (a) to (f) of Article 1(2), importers shall, for 10 years after the instrument has been placed on the market keep a
    copy of the EU declaration of conformity at the disposal of the market surveillance authorities and ensure that the technical documentation can be made available to those authorities, upon request.


    9.   Importers shall, further to a reasoned request from a competent national authority, provide it with all the information and documentation in paper or electronic form necessary to demonstrate the
    conformity of an instrument in a language which can be easily understood by that authority. They shall cooperate with that authority, at its request, on any action taken to eliminate the risks posed
    by instruments which they have placed on the market.'
- id: art-12
  title: Article 9
  text: 'Article 9


    Obligations of distributors


    1.   When making an instrument available on the market distributors shall act with due care in relation to the requirements of this Directive.


    2.   Before making an instrument intended to be used for the applications listed in points (a) to (f) of Article 1(2) available on the market, distributors shall verify that the instrument bears the
    CE marking, and the supplementary metrology marking, that it is accompanied by the required documents and by instructions and information in a language which can be easily understood by end-users in
    the Member State in which the instrument is to be made available on the market, and that the manufacturer and the importer have complied with the requirements set out in Article 6(5) and (6) and Article
    8(3) respectively.


    Where a distributor considers or has reason to believe that an instrument intended to be used for the applications listed in points (a) to (f) of Article 1(2) is not in conformity with the essential
    requirements set out in Annex I, he shall not make the instrument available on the market until it has been brought into conformity. Furthermore, where the instrument presents a risk, the distributor
    shall inform the manufacturer or the importer to that effect as well as the market surveillance authorities.


    Before making an instrument not intended to be used for the applications listed in points (a) to (f) of Article 1(2) available on the market, distributors shall verify that the manufacturer and the
    importer have complied with the requirements set out in Article 6(5) and (6) and Article 8(3) respectively.


    3.   Distributors shall ensure that, while an instrument intended to be used for the applications listed in points (a) to (f) of Article 1(2) is under their responsibility, its storage or transport
    conditions do not jeopardise its compliance with the essential requirements set out in Annex I.


    4.   Distributors who consider or have reason to believe that an instrument which they have made available on the market is not in conformity with this Directive shall make sure that the corrective
    measures necessary to bring that instrument into conformity, to withdraw it or recall it, if appropriate, are taken. Furthermore, where the instrument presents a risk, distributors shall immediately
    inform the competent national authorities of the Member States in which they made the instrument available on the market to that effect, giving details, in particular, of the non-compliance and of any
    corrective measures taken.


    5.   Distributors shall, further to a reasoned request from a competent national authority, provide it with all the information and documentation in paper or electronic form necessary to demonstrate
    the conformity of an instrument. They shall cooperate with that authority, at its request, on any action taken to eliminate the risks posed by instruments which they have made available on the market.'
- id: art-13
  title: Article 10
  text: 'Article 10


    Cases in which obligations of manufacturers apply to importers and distributors


    An importer or distributor shall be considered a manufacturer for the purposes of this Directive and he shall be subject to the obligations of the manufacturer under Article 6, where he places an instrument
    on the market under his name or trade mark or modifies an instrument already placed on the market in such a way that compliance with this Directive may be affected.'
- id: art-14
  title: Article 11
  text: 'Article 11


    Identification of economic operators


    For instruments intended to be used for the applications listed in points (a) to (f) of Article 1(2), economic operators shall, on request, identify the following to the market surveillance authorities:


    (a)


    any economic operator who has supplied them with an instrument;


    (b)


    any economic operator to whom they have supplied an instrument.


    Economic operators shall be able to present the information referred to in the first paragraph for 10 years after they have been supplied with the instrument and for 10 years after they have supplied
    the instrument.'
- id: art-15
  title: CHAPTER 3
  text: 'CHAPTER 3


    CONFORMITY OF INSTRUMENTS'
- id: art-16
  title: Article 12
  text: 'Article 12


    Presumption of conform'
