  text: 'Section 2


    Regulatory status of products and counselling'
- id: art-7
  title: Article 3
  text: 'Article 3


    Regulatory status of products


    1.   Upon a duly substantiated request of a Member State, the Commission shall, after consulting the Medical Device Coordination Group established under Article 103 of Regulation (EU) 2017/745 (MDCG),
    by means of implementing acts, determine whether or not a specific product, or category or group of products, falls within the definitions of ‘

    in vitro

    diagnostic medical device’ or ‘accessory for an

    in vitro

    diagnostic medical device’. Those implementing acts shall be adopted in accordance with the examination procedure referred to in Article 107(3) of this Regulation.


    2.   The Commission may also, on its own initiative, after consulting the MDCG, decide, by means of implementing acts, on the issues referred to in paragraph 1 of this Article. Those implementing acts
    shall be adopted in accordance with the examination procedure referred to in Article 107(3).


    3.   The Commission shall ensure that Member States share expertise in the fields of

    in vitro

    diagnostic medical devices, medical devices, medicinal products, human tissues and cells, cosmetics, biocides, food and, if necessary, other products, in order to determine the appropriate regulatory
    status of a product, or category or group of products.


    4.   When deliberating on the possible regulatory status as a device of products involving medicinal products, human tissues and cells, biocides or food products, the Commission shall ensure an appropriate
    level of consultation of the European Medicines Agency (EMA), the European Chemicals Agency and the European Food Safety Authority, as relevant.'
- id: art-8
  title: Article 4
  text: 'Article 4


    Genetic information, counselling and informed consent


    1.   Member States shall ensure that where a genetic test is used on individuals, in the context of healthcare as defined in point (a) of Article 3 of Directive 2011/24/EU of the European Parliament
    and of the Council

    (

    23

    )

    and for the medical purposes of diagnostics, improvement of treatment, predictive or prenatal testing, the individual being tested or, where applicable, his or her legally designated representative
    is provided with relevant information on the nature, the significance and the implications of the genetic test, as appropriate.


    2.   In the context of the obligations referred to in paragraph 1, Member States shall, in particular, ensure that there is appropriate access to counselling in the case of the use of genetic tests
    that provide information on the genetic predisposition for medical conditions and/or diseases which are generally considered to be untreatable according to the state of science and technology.


    3.   Paragraph 2 shall not apply in cases where a diagnosis of a medical condition and/or a disease which the individual being tested is already known to have is confirmed by a genetic test or in cases
    where a companion diagnostic is used.


    4.   Nothing in this Article shall prevent Member States from adopting or maintaining measures at national level which are more protective of patients, more specific or which deal with informed consent.'
