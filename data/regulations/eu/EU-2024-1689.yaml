    2024/1689


    12.7.2024


    REGULATION (EU) 2024/1689 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 13 June 2024



    laying down harmonised rules on artificial intelligence and amending Regulations (EC) No 300/2008, (EU) No 167/2013, (EU) No 168/2013, (EU) 2018/858, (EU) 2018/1139 and (EU) 2019/2144 and Directives
    2014/90/EU, (EU) 2016/797 and (EU) 2020/1828 (Artificial Intelligence Act)


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Articles 16 and 114 thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Having regard to the opinion of the European Central Bank

    (

    2

    )

    ,


    Having regard to the opinion of the Committee of the Regions

    (

    3

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    4

    )

    ,


    Whereas:


    (1)


    The purpose of this Regulation is to improve the functioning of the internal market by laying down a uniform legal framework in particular for the development, the placing on the market, the putting
    into service and the use of artificial intelligence systems (AI systems) in the Union, in accordance with Union values, to promote the uptake of human centric and trustworthy artificial intelligence
    (AI) while ensuring a high level of protection of health, safety, fundamental rights as enshrined in the Charter of Fundamental Rights of the European Union (the ‘Charter’), including democracy, the
    rule of law and environmental protection, to protect against the harmful effects of AI systems in the Union, and to support innovation. This Regulation ensures the free movement, cross-border, of AI-based
    goods and services, thus preventing Member States from imposing restrictions on the development, marketing and use of AI systems, unless explicitly authorised by this Regulation.


    (2)


    This Regulation should be applied in accordance with the values of the Union enshrined as in the Charter, facilitating the protection of natural persons, undertakings, democracy, the rule of law and
    environmental protection, while boosting innovation and employment and making the Union a leader in the uptake of trustworthy AI.


    (3)


    AI systems can be easily deployed in a large variety of sectors of the economy and many parts of society, including across borders, and can easily circulate throughout the Union. Certain Member States
    have already explored the adoption of national rules to ensure that AI is trustworthy and safe and is developed and used in accordance with fundamental rights obligations. Diverging national rules may
    lead to the fragmentation of the internal market and may decrease legal certainty for operators that develop, import or use AI systems. A consistent and high level of protection throughout the Union
    should therefore be ensured in order to achieve trustworthy AI, while divergences hampering the free circulation, innovation, deployment and the uptake of AI systems and related products and services
    within the internal market should be prevented by laying down uniform obligations for operators and guaranteeing the uniform protection of overriding reasons of public interest and of rights of persons
    throughout the internal market on the basis of Article 114 of the Treaty on the Functioning of the European Union (TFEU). To the extent that this Regulation contains specific rules on the protection
    of individuals with regard to the processing of personal data concerning restrictions of the use of AI systems for remote biometric identification for the purpose of law enforcement, of the use of AI
    systems for risk assessments of natural persons for the purpose of law enforcement and of the use of AI systems of biometric categorisation for the purpose of law enforcement, it is appropriate to base
    this Regulation, in so far as those specific rules are concerned, on Article 16 TFEU. In light of those specific rules and the recourse to Article 16 TFEU, it is appropriate to consult the European
    Data Protection Board.


    (4)


    AI is a fast evolving family of technologies that contributes to a wide array of economic, environmental and societal benefits across the entire spectrum of industries and social activities. By improving
    prediction, optimising operations and resource allocation, and personalising digital solutions available for individuals and organisations, the use of AI can provide key competitive advantages to undertakings
    and support socially and environmentally beneficial outcomes, for example in healthcare, agriculture, food safety, education and training, media, sports, culture, infrastructure management, energy,
    transport and logistics, public services, security, justice, resource and energy efficiency, environmental monitoring, the conservation and restoration of biodiversity and ecosystems and climate change
    mitigation and adaptation.


    (5)


    At the same time, depending on the circumstances regarding its specific application, use, and level of technological development, AI may generate risks and cause harm to public interests and fundamental
    rights that are protected by Union law. Such harm might be material or immaterial, including physical, psychological, societal or economic harm.


    (6)


    Given the major impact that AI can have on society and the need to build trust, it is vital for AI and its regulatory framework to be developed in accordance with Union values as enshrined in Article 2
    of the Treaty on European Union (TEU), the fundamental rights and freedoms enshrined in the Treaties and, pursuant to Article 6 TEU, the Charter. As a prerequisite, AI should be a human-centric technology.
    It should serve as a tool for people, with the ultimate aim of increasing human well-being.


    (7)


    In order to ensure a consistent and high level of protection of public interests as regards health, safety and fundamental rights, common rules for high-risk AI systems should be established. Those
    rules should be consistent with the Charter, non-discriminatory and in line with the Union’s international trade commitments. They should also take into account the European Declaration on Digital Rights
    and Principles for the Digital Decade and the Ethics guidelines for trustworthy AI of the High-Level Expert Group on Artificial Intelligence (AI HLEG).


    (8)


    A Union legal framework laying down harmonised rules on AI is therefore needed to foster the development, use and uptake of AI in the internal market that at the same time meets a high level of protection
    of public interests, such as health and safety and the protection of fundamental rights, including democracy, the rule of law and environmental protection as recognised and protected by Union law. To
    achieve that objective, rules regulating the placing on the market, the putting into service and the use of certain AI systems should be laid down, thus ensuring the smooth functioning of the internal
    market and allowing those systems to benefit from the principle of free movement of goods and services. Those rules should be clear and robust in protecting fundamental rights, supportive of new innovative
    solutions, enabling a European ecosystem of public and private actors creating AI systems in line with Union values and unlocking the potential of the digital transformation across all regions of the
    Union. By laying down those rules as well as measures in support of innovation with a particular focus on small and medium enterprises (SMEs), including startups, this Regulation supports the objective
    of promoting the European human-centric approach to AI and being a global leader in the development of secure, trustworthy and ethical AI as stated by the European Council

    (

    5

    )

    , and it ensures the protection of ethical principles, as specifically requested by the European Parliament

    (

    6

    )

    .


    (9)


    Harmonised rules applicable to the placing on the market, the putting into service and the use of high-risk AI systems should be laid down consistently with Regulation (EC) No 765/2008 of the European
    Parliament and of the Council

    (

    7

    )

    , Decision No 768/2008/EC of the European Parliament and of the Council

    (

    8

    )

    and Regulation (EU) 2019/1020 of the European Parliament and of the Council

    (

    9

    )

    (New Legislative Framework). The harmonised rules laid down in this Regulation should apply across sectors and, in line with the New Legislative Framework, should be without prejudice to existing Union
    law, in particular on data protection, consumer protection, fundamental rights, employment, and protection of workers, and product safety, to which this Regulation is complementary. As a consequence,
    all rights and remedies provided for by such Union law to consumers, and other persons on whom AI systems may have a negative impact, including as regards the compensation of possible damages pursuant
    to Council Directive 85/374/EEC

    (

    10

    )

    remain unaffected and fully applicable. Furthermore, in the context of employment and protection of workers, this Regulation should therefore not affect Union law on social policy and national labour
    law, in compliance with Union law, concerning employment and working conditions, including health and safety at work and the relationship between employers and workers. This Regulation should also not
    affect the exercise of fundamental rights as recognised in the Member States and at Union level, including the right or freedom to strike or to take other action covered by the specific industrial relations
    systems in Member States as well as the right to negotiate, to conclude and enforce collective agreements or to take collective action in accordance with national law. This Regulation should not affect
    the provisions aiming to improve working conditions in platform work laid down in a Directive of the European Parliament and of the Council on improving working conditions in platform work. Moreover,
    this Regulation aims to strengthen the effectiveness of such existing rights and remedies by establishing specific requirements and obligations, including in respect of the transparency, technical documentation
    and record-keeping of AI systems. Furthermore, the obligations placed on various operators involved in the AI value chain under this Regulation should apply without prejudice to national law, in compliance
    with Union law, having the effect of limiting the use of certain AI systems where such law falls outside the scope of this Regulation or pursues legitimate public interest objectives other than those
    pursued by this Regulation. For example, national labour law and law on the protection of minors, namely persons below the age of 18, taking into account the UNCRC General Comment No 25 (2021) on children’s
    rights in relation to the digital environment, insofar as they are not specific to AI systems and pursue other legitimate public interest objectives, should not be affected by this Regulation.


    (10)


    The fundamental right to the protection of personal data is safeguarded in particular by Regulations (EU) 2016/679

    (

    11

    )

    and (EU) 2018/1725

    (

    12

    )

    of the European Parliament and of the Council and Directive (EU) 2016/680 of the European Parliament and of the Council

    (

    13

    )

    . Directive 2002/58/EC of the European Parliament and of the Council

    (

    14

    )

    additionally protects private life and the confidentiality of communications, including by way of providing conditions for any storing of personal and non-personal data in, and access from, terminal
    equipment. Those Union legal acts provide the basis for sustainable and responsible data processing, including where data sets include a mix of personal and non-personal data. This Regulation does not
    seek to affect the application of existing Union law governing the processing of personal data, including the tasks '
- id: art-2
  title: CHAPTER I
  text: 'CHAPTER I


    GENERAL PROVISIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Subject matter`


    1.   The purpose of this Regulation is to improve the functioning of the internal market and promote the uptake of human-centric and trustworthy artificial intelligence (AI), while ensuring a high level
    of protection of health, safety, fundamental rights enshrined in the Charter, including democracy, the rule of law and environmental protection, against the harmful effects of AI systems in the Union
    and supporting innovation.


    2.   This Regulation lays down:


    (a)


    harmonised rules for the placing on the market, the putting into service, and the use of AI systems in the Union;


    (b)


    prohibitions of certain AI practices;


    (c)


    specific requirements for high-risk AI systems and obligations for operators of such systems;


    (d)


    harmonised transparency rules for certain AI systems;


    (e)


    harmonised rules for the placing on the market of general-purpose AI models;


    (f)


    rules on market monitoring, market surveillance, governance and enforcement;


    (g)


    measures to support innovation, with a particular focus on SMEs, including start-ups.'
- id: art-4
  title: Article 2
  text: 'Article 2


    Scope


    1.   This Regulation applies to:


    (a)


    providers placing on the market or putting into service AI systems or placing on the market general-purpose AI models in the Union, irrespective of whether those providers are established or located
    within the Union or in a third country;


    (b)


    deployers of AI systems that have their place of establishment or are located within the Union;


    (c)


    providers and deployers of AI systems that have their place of establishment or are located in a third country, where the output produced by the AI system is used in the Union;


    (d)


    importers and distributors of AI systems;


    (e)


    product manufacturers placing on the market or putting into service an AI system together with their product and under their own name or trademark;


    (f)


    authorised representatives of providers, which are not established in the Union;


    (g)


    affected persons that are located in the Union.


    2.   For AI systems classified as high-risk AI systems in accordance with Article 6(1) related to products covered by the Union harmonisation legislation listed in Section B of Annex I, only Article 6(1),
    Articles 102 to 109 and Article 112 apply. Article 57 applies only in so far as the requirements for high-risk AI systems under this Regulation have been integrated in that Union harmonisation legislation.


    3.   This Regulation does not apply to areas outside the scope of Union law, and shall not, in any event, affect the competences of the Member States concerning national security, regardless of the
    type of entity entrusted by the Member States with carrying out tasks in relation to those competences.


    This Regulation does not apply to AI systems where and in so far they are placed on the market, put into service, or used with or without modification exclusively for military, defence or national security
    purposes, regardless of the type of entity carrying out those activities.


    This Regulation does not apply to AI systems which are not placed on the market or put into service in the Union, where the output is used in the Union exclusively for military, defence or national
    security purposes, regardless of the type of entity carrying out those activities.


    4.   This Regulation applies neither to public authorities in a third country nor to international organisations falling within the scope of this Regulation pursuant to paragraph 1, where those authorities
    or organisations use AI systems in the framework of international cooperation or agreements for law enforcement and judicial cooperation with the Union or with one or more Member States, provided that
    such a third country or international organisation provides adequate safeguards with respect to the protection of fundamental rights and freedoms of individuals.


    5.   This Regulation shall not affect the application of the provisions on the liability of providers of intermediary services as set out in Chapter II of Regulation (EU) 2022/2065.


    6.   This Regulation does not apply to AI systems or AI models, including their output, specifically developed and put into service for the sole purpose of scientific research and development.


    7.   Union law on the protection of personal data, privacy and the confidentiality of communications applies to personal data processed in connection with the rights and obligations laid down in this
    Regulation. This Regulation shall not affect Regulation (EU) 2016/679 or (EU) 2018/1725, or Directive 2002/58/EC or (EU) 2016/680, without prejudice to Article 10(5) and Article 59 of this Regulation.


    8.   This Regulation does not apply to any research, testing or development activity regarding AI systems or AI models prior to their being placed on the market or put into service. Such activities
    shall be conducted in accordance with applicable Union law. Testing in real world conditions shall not be covered by that exclusion.


    9.   This Regulation is without prejudice to the rules laid down by other Union legal acts related to consumer protection and product safety.


    10.   This Regulation does not apply to obligations of deployers who are natural persons using AI systems in the course of a purely personal non-professional activity.


    11.   This Regulation does not preclude the Union or Member States from maintaining or introducing laws, regulations or administrative provisions which are more favourable to workers in terms of protecting
    their rights in respect of the use of AI systems by employers, or from encouraging or allowing the application of collective agreements which are more favourable to workers.


    12.   This Regulation does not apply to AI systems released under free and open-source licences, unless they are placed on the market or put into service as high-risk AI systems or as an AI system that
    falls under Article 5 or 50.'
- id: art-5
  title: Article 3
  text: 'Article 3


    Definitions


    For the purposes of this Regulation, the following definitions apply:


    (1)


    ‘AI system’ means a machine-based system that is designed to operate with varying levels of autonomy and that may exhibit adaptiveness after deployment, and that, for explicit or implicit objectives,
    infers, from the input it receives, how to generate outputs such as predictions, content, recommendations, or decisions that can influence physical or virtual environments;


    (2)


    ‘risk’ means the combination of the probability of an occurrence of harm and the severity of that harm;


    (3)


    ‘provider’ means a natural or legal person, public authority, agency or other body that develops an AI system or a general-purpose AI model or that has an AI system or a general-purpose AI model developed
    and places it on the market or puts the AI system into service under its own name or trademark, whether for payment or free of charge;


    (4)


    ‘deployer’ means a natural or legal person, public authority, agency or other body using an AI system under its authority except where the AI system is used in the course of a personal non-professional
    activity;


    (5)


    ‘authorised representative’ means a natural or legal person located or established in the Union who has received and accepted a written mandate from a provider of an AI system or a general-purpose AI
    model to, respectively, perform and carry out on its behalf the obligations and procedures established by this Regulation;


    (6)


    ‘importer’ means a natural or legal person located or established in the Union that places on the market an AI system that bears the name or trademark of a natural or legal person established in a third
    country;


    (7)


    ‘distributor’ means a natural or legal person in the supply chain, other than the provider or the importer, that makes an AI system available on the Union market;


    (8)


    ‘operator’ means a provider, product manufacturer, deployer, authorised representative, importer or distributor;


    (9)


    ‘placing on the market’ means the first making available of an AI system or a general-purpose AI model on the Union market;


    (10)


    ‘making available on the market’ means the supply of an AI system or a general-purpose AI model for distribution or use on the Union market in the course of a commercial activity, whether in return
    for payment or free of charge;


    (11)


    ‘putting into service’ means the supply of an AI system for first use directly to the deployer or for own use in the Union for its intended purpose;


    (12)


    ‘intended purpose’ means the use for which an AI system is intended by the provider, including the specific context and conditions of use, as specified in the information supplied by the provider in
    the instructions for use, promotional or sales materials and statements, as well as in the technical documentation;


    (13)


    ‘reasonably foreseeable misuse’ means the use of an AI system in a way that is not in accordance with its intended purpose, but which may result from reasonably foreseeable human behaviour or interaction
    with other systems, including other AI systems;


    (14)


    ‘safety component’ means a component of a product or of an AI system which fulfils a safety function for that product or AI system, or the failure or malfunctioning of which endangers the health and
    safety of persons or property;


    (15)


    ‘instructions for use’ means the information provided by the provider to inform the deployer of, in particular, an AI system’s intended purpose and proper use;


    (16)


    ‘recall of an AI system’ means any measure aiming to achieve the return to the provider or taking out of service or disabling the use of an AI system made available to deployers;


    (17)


    ‘withdrawal of an AI system’ means any measure aiming to prevent an AI system in the supply chain being made available on the market;


    (18)


    ‘performance of an AI system’ means the ability of an AI system to achieve its intended purpose;


    (19)


    ‘notifying authority’ means the national authority responsible for setting up and carrying out the necessary procedures for the assessment, designation and notification of conformity assessment bodies
    and for their monitoring;


    (20)


    ‘conformity assessment’ means the process of demonstrating whether the requirements set out in Chapter III, Section 2 relating to a high-risk AI system have been fulfilled;


    (21)


    ‘conformity assessment body’ means a body that performs third-party conformity assessment activities, including testing, certification and inspection;


    (22)


    ‘notified body’ means a conformity assessment body notified in accordance with this Regulation and other relevant Union harmonisation legislation;


    (23)


    ‘substantial modification’ means a change to an AI system after its placing on the market or putting into service which is not foreseen or planned in the initial conformity assessment carried out by
    the provider and as a result of which the compliance of the AI system with the requirements set out in Chapter III, Section 2 is affected or results in a modification to the intended purpose for which
    the AI system has been assessed;


    (24)


    ‘CE marking’ means a marking by which a provider indicates that an AI system is in conformity with the requirements set out in Chapter III, Section 2 and other applicable Union harmonisation legislation
    providing for its affixing;


    (25)


    ‘post-market monitoring system’ means all activities carried out by providers of AI systems to collect and review experience gained from the use of AI systems they place on the market or put into service
    for the purpose of identifying any need to immediately apply any necessary corrective or preventive actions;


    (26)


    ‘market surveillance authority’ means the national authority carrying out the activities and taking the measures pursuant to Regulation (EU) 2019/1020;


    (27)


    ‘harmonised standard’ means a harmonised standard as defined in Article 2(1), point (c), of Regulation (EU) No 1025/2012;


    (28)


    ‘common specification’ means a set of technical specifications as defined in Article 2, point (4) of Regulation (EU) No 1025/2012, providing means to comply with certain requirements established under
    this Regulation;


    (29)


    ‘training data’ means data used for training an AI system through fitting its learnable parameters;


    (30)


    ‘validation data’ means data used for providing an evaluation of the trained AI system and for tuning its non-learnable parameters and its learning process in order, inter alia, to prevent underfitting
    or overfitting;


    (31)


    ‘validation data set’ means a separate data set or part of the training data set, either as a fixed or variable split;


    (32)


    ‘testing data’ means data used for providing an independent evaluation of the AI system in order to confirm the expected performance of that system before its placing on the market or putting into service;


    (33)


    ‘input data’ means data provided to or directly acquired by an AI system on the basis of which the system produces an output;


    (34)


    ‘biometric data’ means personal data resulting from specific technical processing relating to the physical, physiological or behavioural characteristics of a natural person, such as facial images or
    dactyloscopic data;


    (35)


    ‘biometric identification’ means the automated recognition of physical, physiological, behavioural, or psychological human features for the purpose of establishing the identity of a natural person by
    comparing biometric data of that individual to biometric data of individuals stored in a database;


    (36)


    ‘biometric verification’ means the automated, one-to-one verification, including authentication, of the identity of natural persons by comparing their biometric data to previously provided biometric
    data;


    (37)


    ‘special categories of personal data’ means the categories of personal data referred to in Article 9(1) of Regulation (EU) 2016/679, Article 10 of Directive (EU) 2016/680 and Article 10(1) of Regulation
    (EU) 2018/1725;


    (38)


    ‘sensitive operational data’ means operational data related to activities of prevention, detection, investigation or prosecution of criminal offences, the disclosure of which could jeopardise the integrity
    of criminal proceedings;


    (39)


    ‘emotion recognition system’ means an AI system for the purpose of identifying or inferring emotions or intentions of natural persons on the basis of their biometric data;


    (40)


    ‘biometric categorisation system’ means an AI system for the purpose of assigning natural persons to specific categories on the basis of their biometric data, unless it is ancillary to another commercial
    service and strictly necessary for objective technical reasons;


    (41)


    ‘remote biometric identification system’ means an AI system for the purpose of identifying natural persons, without their active involvement, typically at a distance through the comparison of a person’s
    biometric data with the biometric data contained in a reference database;


    (42)


    ‘real-time remote biometric identification system’ means a remote biometric identification system, whereby the capturing of biometric data, the comparison and the identification all occur without a significant
    delay, comprising not only instant identification, but also limited short delays in order to avoid circumvention;


    (43)


    ‘post-remote biometric identification system’ means a remote biometric identification system other than a real-time remote biometric identification system;


    (44)


    ‘publicly accessible space’ means any publicly or privately owned physical place accessible to an undetermined number of natural persons, regardless of whether certain conditions for access may apply,
    and regardless of the potential capacity restrictions;


    (45)


    ‘law enforcement authority’ means:


    (a)


    any public authority competent for the prevention, investigation, detection or prosecution of criminal offences or the execution of criminal penalties, including the safeguarding against and the prevention
    of threats to public security; or


    (b)


    any other body or entity entrusted by Member State law to exercise public authority and public powers for the purposes of the prevention, investigation, detection or prosecution of criminal offences
    or the execution of criminal penalties, including the safeguarding against and the prevention of threats to public security;


    (46)


    ‘law enforcement’ means activities carried out by law enforcement authorities or on their behalf for the prevention, investigation, detection or prosecution of criminal offences or the execution of
    criminal penalties, including safeguarding against and preventing threats to public security;


    (47)


    ‘AI Office’ means the Commission’s function of contributing to the implementation, monitoring and supervision of AI systems and general-purpose AI models, and AI governance, provided for in Commission
    Decision of 24 January 2024; references in this Regulation to the AI Office shall be construed as references to the Commission;


    (48)


    ‘national competent authority’ means a notifying authority or a market surveillance authority; as regards AI systems put into service or used by Union institutions, agencies, offices and bodies, references
    to national competent authorities or market surveillance authorities in this Regulation shall be construed as references to the European Data Protection Supervisor;


    (49)


    ‘serious incident’ means an incident or malfunctioning of an AI system that directly or indirectly leads to any of the following:


    (a)


    the death of a person, or serious harm to a person’s health;


    (b)


    a serious and irreversible disruption of the management or operation of critical infrastructure;


    (c)


    the infringement of obligations under Union law intended to protect fundamental rights;


    (d)


    serious harm to property or the environment;


    (50)


    ‘personal data’ means personal data as defined in Article 4, point (1), of Regulation (EU) 2016/679;


    (51)


    ‘non-personal data’ means data other than personal data as defined in Article 4, point (1), of Regulation (EU) 2016/679;


    (52)


    ‘profiling'
- id: art-6
  title: Article 4
  text: 'Article 4


    AI literacy


    Providers and deployers of AI systems shall take measures to ensure, to their best extent, a sufficient level of AI literacy of their staff and other persons dealing with the operation and use of AI
    systems on their behalf, taking into account their technical knowledge, experience, education and training and the context the AI systems are to be used in, and considering the persons or groups of
    persons on whom the AI systems are to be used.'
- id: art-7
  title: CHAPTER II
  text: 'CHAPTER II


    PROHIBITED AI PRACTICES'
- id: art-8
  title: Article 5
  text: 'Article 5


    Prohibited AI practices


    1.   The following AI practices shall be prohibited:


    (a)


    the placing on the market, the putting into service or the use of an AI system that deploys subliminal techniques beyond a person’s consciousness or purposefully manipulative or deceptive techniques,
    with the objective, or the effect of materially distorting the behaviour of a person or a group of persons by appreciably impairing their ability to make an informed decision, thereby causing them to
    take a decision that they would not have otherwise taken in a manner that causes or is reasonably likely to cause that person, another person or group of persons significant harm;


    (b)


    the placing on the market, the putting into service or the use of an AI system that exploits any of the vulnerabilities of a natural person or a specific group of persons due to their age, disability
    or a specific social or economic situation, with the objective, or the effect, of materially distorting the behaviour of that person or a person belonging to that group in a manner that causes or is
    reasonably likely to cause that person or another person significant harm;


    (c)


    the placing on the market, the putting into service or the use of AI systems for the evaluation or classification of natural persons or groups of persons over a certain period of time based on their
    social behaviour or known, inferred or predicted personal or personality characteristics, with the social score leading to either or both of the following:


