    DIRECTIVE (EU) 2024/2853 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 23 October 2024



    on liability for defective products and repealing Council Directive 85/374/EEC


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 114 thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    In order to improve the proper functioning of the internal market, it is necessary to ensure that competition is not distorted and that the movement of goods is not obstructed. Council Directive 85/374/EEC

    (

    3

    )

    lays down common rules on liability for defective products with the aim of removing divergences between the legal systems of Member States that may distort competition and affect the movement of goods
    within the internal market. Greater harmonisation of the common rules on liability for defective products laid down in that Directive would further contribute to the achievement of those objectives,
    while entailing an increased degree of protection of consumers’ and other natural persons’ health or property.


    (2)


    Liability without fault on the part of economic operators remains the sole means of adequately addressing the problem of fair apportionment of risk inherent in modern technological production.


    (3)


    Directive 85/374/EEC has been an effective and important instrument, but it would need to be revised in light of developments related to new technologies, including artificial intelligence (AI), new
    circular economy business models and new global supply chains, which have led to inconsistencies and legal uncertainty, in particular as regards the meaning of the term ‘product’. Experience gained
    from applying that Directive has also shown that injured persons face difficulties obtaining compensation due to restrictions on making compensation claims and due to challenges in gathering evidence
    to prove liability, especially in light of increasing technical and scientific complexity. That includes compensation claims in respect of damage related to new technologies. The revision of that Directive
    would therefore encourage the roll-out and uptake of such new technologies, including AI, while ensuring that claimants enjoy the same level of protection irrespective of the technology involved and
    that all businesses benefit from more legal certainty and a level playing field.


    (4)


    A revision of Directive 85/374/EEC would be needed in order to ensure coherence and consistency with product safety and market surveillance legislation at Union and national level. In addition, there
    is a need to clarify basic notions and concepts to ensure coherence and legal certainty and a level playing field in the internal market, and to reflect the recent case law of the Court of Justice of
    the European Union.


    (5)


    Considering the extensive nature of the amendments that would be required in order for Directive 85/374/EEC to remain effective and in order to ensure clarity and legal certainty, that Directive should
    be repealed and replaced with this Directive.


    (6)


    In order to ensure that the Union’s product liability regime is comprehensive, no-fault liability for defective products should apply to all movables, including software, including when they are integrated
    into other movables or installed in immovables.


    (7)


    Liability for defective products should not apply to damage arising from nuclear accidents, in so far as liability for such damage is covered by international conventions ratified by Member States.


    (8)


    In order to create a genuine internal market with a high and uniform level of protection of consumers and other natural persons, and to reflect the case law of the Court of Justice of the European Union,
    Member States should not, in respect of matters within the scope of this Directive, maintain or introduce provisions that are more stringent or less stringent than those laid down in this Directive.


    (9)


    Under the national law of Member States, an injured person could have a claim for damages on the basis of contractual liability or on grounds of non-contractual liability that does not involve the manufacturer’s
    liability for the defectiveness of a product as established in this Directive. This concerns for example liability based on a warranty or on fault or strict liability of operators for damage caused
    by the properties of an organism resulting from genetic engineering. Such national law provisions, which serve to attain, inter alia, the objective of effective protection of consumers and other natural
    persons, should remain unaffected by this Directive.


    (10)


    In certain Member States, injured persons are entitled to make claims for damage caused by pharmaceutical products under a special national liability system, with the result that effective protection
    of natural persons in the pharmaceutical sector is already achieved. The right to make such claims should remain unaffected by this Directive. Furthermore, amendments to such special liability systems
    should not be precluded as long as they do not undermine the effectiveness of the system of liability provided for in this Directive or its objectives.


    (11)


    Compensation schemes outside the context of liability regimes, such as national health systems, social security schemes or insurance schemes, fall outside the scope of this Directive and should therefore
    not be precluded. For example, some Member States have schemes in place to provide compensation in respect of pharmaceutical products that cause harm without being defective.


    (12)


    Decision No 768/2008/EC of the European Parliament and of the Council

    (

    4

    )

    lays down common principles and reference provisions intended to apply in all sectoral product legislation. In order to ensure consistency with that Decision, certain provisions of this Directive, in
    particular the definitions, should be aligned therewith.


    (13)


    Products in the digital age can be tangible or intangible. Software, such as operating systems, firmware, computer programs, applications or AI systems, is increasingly common on the market and plays
    an increasingly important role for product safety. Software is capable of being placed on the market as a standalone product or can subsequently be integrated into other products as a component, and
    it is capable of causing damage through its execution. In the interest of legal certainty, it should be clarified in this Directive that software is a product for the purposes of applying no-fault liability,
    irrespective of the mode of its supply or usage, and therefore irrespective of whether the software is stored on a device, accessed through a communication network or cloud technologies, or supplied
    through a software-as-a-service model. Information is not, however, to be considered a product, and product liability rules should therefore not apply to the content of digital files, such as media
    files or e-books or the mere source code of software. A developer or producer of software, including AI system providers within the meaning of Regulation (EU) 2024/1689 of the European Parliament and
    of the Council

    (

    5

    )

    , should be treated as a manufacturer.


    (14)


    Free and open-source software, whereby the source code is openly shared and users can freely access, use, modify and redistribute the software or modified versions thereof, can contribute to research
    and innovation on the market. Such software is subject to licences that allow anyone the freedom to run, copy, distribute, study, change and improve the software. In order not to hamper innovation or
    research, this Directive should not apply to free and open-source software developed or supplied outside the course of a commercial activity, since products so developed or supplied are by definition
    not placed on the market. Developing or contributing to such software should not be understood as making it available on the market. Providing such software on open repositories should not be considered
    as making it available on the market, unless that occurs in the course of a commercial activity. In principle, the supply of free and open-source software by non-profit organisations should not be considered
    as taking place in a business-related context, unless such supply occurs in the course of a commercial activity. However, where software is supplied in exchange for a price, or for personal data used
    other than exclusively for improving the security, compatibility or interoperability of the software, and is therefore supplied in the course of a commercial activity, this Directive should apply.


    (15)


    Where free and open-source software supplied outside the course of a commercial activity is subsequently integrated by a manufacturer as a component into a product in the course of a commercial activity
    and is thereby placed on the market, it should be possible to hold that manufacturer liable for damage caused by the defectiveness of such software but not the manufacturer of the software because the
    manufacturer of the software would not have fulfilled the conditions of placing a product or component on the market.


    (16)


    Whereas digital files as such are not products within the scope of this Directive, digital manufacturing files, which contain the functional information necessary to produce a tangible item by enabling
    the automated control of machinery or tools, such as drills, lathes, mills and 3D printers, should be considered to be products in order to ensure the protection of natural persons in cases where such
    files are defective. For example, a defective computer-assisted-design file used to create a 3D-printed good that causes harm should give rise to liability under this Directive, where such a file is
    developed or supplied in the course of a commercial activity. For the avoidance of doubt, it should be clarified that raw materials, such as gas and water, and electricity are products.


    (17)


    It is becoming increasingly common for digital services to be integrated into, or inter-connected with, a product in such a way that the absence of the service would prevent the product from performing
    one of its functions. While this Directive should not apply to services as such, it is necessary to extend no-fault liability to such integrated or inter-connected digital services as they determine
    the safety of the product just as much as physical or digital components. Those related services should be considered components of the product into which they are integrated or with which they are
    inter-connected where they are within the control of the manufacturer of that product. Examples of related services include the continuous supply of traffic data in a navigation system, a health monitoring
    service that relies on a physical product’s sensors to track the user’s physical activity or health metrics, a temperature control service that monitors and regulates the temperature of a smart fridge,
    or a voice-assistant service that allows one or more products to be controlled by using voice commands. Internet access services should not be treated as related services, since they cannot be considered
    as part of a product within a manufacturer’s control and it would be unreasonable to make manufacturers liable for damage caused by shortcomings in internet access services. Nevertheless, a product
    that relies on internet access services and fails to maintain safety in the event of a loss of connectivity could be found to be defective under this Directive.


    (18)


    Related services and other components, including software updates and upgrades, should be cons'
- id: art-2
  title: CHAPTER I
  text: 'CHAPTER I


    GENERAL PROVISIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Subject matter and objective


    This Directive lays down common rules on the liability of economic operators for damage suffered by natural persons and caused by defective products, and on compensation for such damage.


    The objective of this Directive is to contribute to the proper functioning of the internal market while ensuring a high level of protection of consumers and other natural persons.'
- id: art-4
  title: Article 2
  text: 'Article 2


    Scope


    1.   This Directive shall apply to products placed on the market or put into service after 9 December 2026.


    2.   This Directive does not apply to free and open-source software that is developed or supplied outside the course of a commercial activity.


    3.   This Directive does not apply to damage arising from nuclear accidents in so far as liability for such damage is covered by international conventions ratified by Member States.


    4.   This Directive does not affect:


    (a)


    the applicability of Union law on the protection of personal data, in particular Regulation (EU) 2016/679 and Directives 2002/58/EC and (EU) 2016/680;


    (b)


    any right which an injured person has under national rules concerning contractual liability or concerning non-contractual liability on grounds other than the defectiveness of a product as provided for
    in this Directive, including national rules implementing Union law;


    (c)


    any right which an injured person has under any special liability system that existed in national law on 30 July 1985.'
- id: art-5
  title: Article 3
  text: 'Article 3


    Level of harmonisation


    Member States shall not maintain or introduce, in their national law, provisions diverging from those laid down in this Directive, including more stringent or less stringent provisions, to achieve a different
    level of protection for consumers and other natural persons, unless otherwise provided for in this Directive.'
- id: art-6
  title: Article 4
  text: 'Article 4


    Definitions


    For the purposes of this Directive, the following definitions apply:


    (1)


    ‘product’ means all movables, even if integrated into, or inter-connected with, another movable or an immovable; it includes electricity, digital manufacturing files, raw materials and software;


    (2)


    ‘digital manufacturing file’ means a digital version of, or digital template for, a movable which contains the functional information necessary to produce a tangible item by enabling the automated control
    of machinery or tools;


    (3)


    ‘related service’ means a digital service that is integrated into, or inter-connected with, a product in such a way that its absence would prevent the product from performing one or more of its functions;


    (4)


    ‘component’ means any item, whether tangible or intangible, raw material or related service, that is integrated into, or inter-connected with, a product;


    (5)


    ‘manufacturer’s control’ means that:


    (a)


    the manufacturer of a product performs or, with regard to actions of a third party, authorises or consents to:


    (i)


    the integration, inter-connection or supply of a component, including software updates or upgrades; or


    (ii)


    the modification of the product, including substantial modifications;


    (b)


    the manufacturer of a product has the ability to supply software updates or upgrades, themselves or via a third party;


    (6)


    ‘data’ means data as defined in Article 2, point (1), of Regulation (EU) 2022/868 of the European Parliament and of the Council

    (

    18

    )

    ;


    (7)


    ‘making available on the market’ means any supply of a product for distribution, consumption or use on the Union market in the course of a commercial activity, whether in return for payment or free
    of charge;


    (8)


    ‘placing on the market’ means the first making available of a product on the Union market;


    (9)


    ‘putting into service’ means the first use of a product in the Union in the course of a commercial activity, whether in return for payment or free of charge, in circumstances in which that product has
    not been placed on the market prior to its first use;


    (10)


    ‘manufacturer’ means any natural or legal person who:


    (a)


    develops, manufactures or produces a product;


    (b)


    has a product designed or manufactured, or who, by putting their name, trademark or other distinguishing features on that product, presents themselves as its manufacturer; or


    (c)


    develops, manufactures or produces a product for their own use;


    (11)


    ‘authorised representative’ means any natural or legal person established within the Union who has received a written mandate from a manufacturer to act on that manufacturer’s behalf in relation to
    specified tasks;


    (12)


    ‘importer’ means any natural or legal person who places a product from a third country on the Union market;


    (13)


    ‘fulfilment service provider’ means any natural or legal person offering, in the course of a commercial activity, at least two of the following services: warehousing, packaging, addressing and dispatching
    of a product, without having ownership of that product, excluding postal services as defined in Article 2, point (1), of Directive 97/67/EC of the European Parliament and of the Council

    (

    19

    )

    , parcel delivery services as defined in Article 2, point (2), of Regulation (EU) 2018/644 of the European Parliament and of the Council

    (

    20

    )

    , and any other postal services or freight transport services;


    (14)


    ‘distributor’ means any natural or legal person in the supply chain who makes a product available on the market, other than the manufacturer or importer of that product;


    (15)


    ‘economic operator’ means a manufacturer of a product or component, a provider of a related service, an authorised representative, an importer, a fulfilment service provider or a distributor;


    (16)


    ‘online platform’ means online platform as defined in Article 3, point (i), of Regulation (EU) 2022/2065;


    (17)


    ‘trade secret’ means trade secret as defined in Article 2, point (1), of Directive (EU) 2016/943;


    (18)


    ‘substantial modification’ means a modification of a product after it has been placed on the market or put into service:


    (a)


    that is considered substantial under relevant Union or national rules on product safety; or


    (b)


    where relevant Union or national rules on product safety lay down no threshold on what is to be considered a substantial modification, that:


    (i)


    changes the product’s original performance, purpose or type, without that change having been foreseen in the manufacturer’s initial risk assessment; and


    (ii)


    changes the nature of the hazard, creates a new hazard or increases the level of risk.'
- id: art-7
  title: CHAPTER II
  text: 'CHAPTER II


    SPECIFIC PROVISIONS ON LIABILITY FOR DEFECTIVE PRODUCTS'
- id: art-8
  title: Article 5
  text: 'Article 5


    Right to compensation


    1.   Member States shall ensure that any natural person who suffers damage caused by a defective product (the ‘injured person’) is entitled to compensation in accordance with this Directive.


    2.   Member States shall ensure that claims for compensation pursuant to paragraph 1 may also be brought by:


    (a)


    a person that succeeded, or was subrogated, to the right of the injured person by virtue of Union or national law or contract; or


    (b)


    a person acting on behalf of one or more injured persons by virtue of Union or national law.'
- id: art-9
  title: Article 6
  text: 'Article 6


    Damage


    1.   The right to compensation pursuant to Article 5 shall apply in respect of only the following types of damage:


    (a)


    death or personal injury, including medically recognised damage to psychological health;


    (b)


    damage to, or destruction of, any property, except:


    (i)


    the defective product itself;


    (ii)


    a product damaged by a defective component that is integrated into, or inter-connected with, that product by the manufacturer of that product or within that manufacturer’s control;


    (iii)


    property used exclusively for professional purposes;


    (c)


    destruction or corruption of data that are not used for professional purposes.


    2.   The right to compensation pursuant to Article 5 shall cover all material losses resulting from the damage referred to in paragraph 1 of this Article. The right to compensation shall also cover
    non-material losses resulting from the damage referred to in paragraph 1 of this Article, in so far as they can be compensated for under national law.


    3.   This Article does not affect national law relating to compensation for damage under other liability regimes.'
- id: art-10
  title: Article 7
  text: 'Article 7


    Defectiveness


    1.   A product shall be considered defective where it does not provide the safety that a person is entitled to expect or that is required under Union or national law.


    2.   In assessing the defectiveness of a product, all circumstances shall be taken into account, including:


    (a)


    the presentation and the characteristics of the product, including its labelling, design, technical features, composition and packaging and the instructions for its assembly, installation, use and maintenance;


    (b)


    reasonably foreseeable use of the product;


    (c)


    the effect on the product of any ability to continue to learn or acquire new features after it is placed on the market or put into service;


    (d)


    the reasonably foreseeable effect on the product of other products that can be expected to be used together with the product, including by means of inter-connection;


    (e)


    the moment in time when the product was placed on the market or put into service or, where the manufacturer retains control over the product after that moment, the moment in time when the product left
    the control of the manufacturer;


    (f)


    relevant product safety requirements, including safety-relevant cybersecurity requirements;


    (g)


    any recall of the product or any other relevant intervention relating to product safety by a competent authority or by an economic operator as referred to in Article 8;


    (h)


    the specific needs of the group of users for whose use the product is intended;


    (i)


    in the case of a product whose very purpose is to prevent damage, any failure of the product to fulfil that purpose.


    3.   A product shall not be considered to be defective for the sole reason that a better product, including updates or upgrades for a product, has already been or is subsequently placed on the market
    or put into service.'
- id: art-11
  title: Article 8
  text: 'Article 8


    Economic operators liable for defective products


    1.   Member States shall ensure that the following economic operators are liable for damage in accordance with this Directive:


    (a)


    the manufacturer of a defective product;


    (b)


    the manufacturer of a defective component, where that component was integrated into, or inter-connected with, a product within the manufacturer’s control and caused that product to be defective, and
    without prejudice to the liability of the manufacturer referred to in point (a); and


    (c)


    in the case of a manufacturer of a product or a component established outside the Union, and without prejudice to the liability of that manufacturer:


    (i)


    the importer of the defective product or component;


    (ii)


    the authorised representative of the manufacturer; and


    (iii)


    where there is no importer established within the Union or authorised representative, the fulfilment service provider.


    The liability of the manufacturer referred to in the first subparagraph, point (a), shall also cover any damage caused by a defective component where it was integrated into, or inter-connected with,
    a product within that manufacturer’s control.


    2.   Any natural or legal person that substantially modifies a product outside the manufacturer’s control and thereafter makes it available on the market or puts it into service shall be considered
    to be a manufacturer of that product for the purposes of paragraph 1.


    3.   Member States shall ensure that, where an economic operator from among those referred to in paragraph 1 and established in the Union cannot be identified, each distributor of the defective product
    is liable where:


    (a)


    the injured person requests that distributor to identify an economic operator from among those referred to in paragraph 1 and established in the Union, or its own distributor that supplied it with that
    product; and


    (b)


    that distributor fails to identify an economic operator or its own distributor, as referred to in point (a), within one month of receiving the request referred to in point (a).


    4.   Paragraph 3 of this Article shall also apply to any provider of an online platform that allows consumers to conclude distance contracts with traders and that is not an economic operator, provided
    that the conditions set out in Article 6(3) of Regulation (EU) 2022/2065 are fulfilled.


    5.   Where victims fail to obtain compensation because none of the persons referred to in paragraphs 1 to 4 can be held liable under this Directive, or because the liable persons are insolvent or have
    ceased to exist, Member States may use existing national sectoral compensation schemes or establish new ones under national law, preferably not funded by public revenue, to appropriately compensate
    injured persons who have suffered damage caused by defective products.'
- id: art-12
  title: Article 9
  text: 'Article 9


    Disclosure of evidence


    1.   Member States shall ensure that, at the request of a person who is claiming compensation in proceedings before a national court for damage caused by a defective product (the ‘claimant’) and who
    has presented facts and evidence sufficient to support the plausibility of the claim for compensation, the defendant is required to disclose relevant evidence that is at the defendant’s disposal, subject
    to the conditions set out in this Article.


    2.   Member States shall ensure that, at the request of a defendant that has presented facts and evidence sufficient to demonstrate the defendant’s need for evidence for the purposes of countering a claim
    for compensation, the claimant is required, in accordance with national law, to disclose relevant evidence that is at the claimant’s disposal.


    3.   Member States shall ensure that the disclosure of evidence pursuant to paragraphs 1 and 2, and in accordance with national law, is limited to what is necessary and proportionate.


    4.   Member States shall ensure that, when determining whether the disclosure of evidence requested by a party is necessary and proportionate, national courts consider the legitimate interests of all
    parties concerned, including third parties, in particular in relation to the protection of confidential information and trade secrets.


    5.   Member States shall ensure that, where a defendant is required to disclose information that is a trade secret or an alleged trade secret, national courts are empowered, upon a duly reasoned request
    of a party or on their own initiative, to take the specific measures necessary to preserve the confidentiality of that information when it is used or referred to in the course of or after the legal
    proceedings.


    6.   Member States shall ensure that, where a party is required to disclose evidence, national courts are empowered, upon a duly reasoned request of the opposing party or where the national court concerned
    deems it appropriate and in accordance with national law, to require such evidence to be presented in an easily accessible and easily understandable manner, if such presentation is deemed proportionate
    by the national court in terms of costs and effort for the required party.


    7.   This Article does not affect national rules relating to the pre-trial disclosure of evidence, where such rules exist.'
- id: art-13
  title: Article 10
  text: 'Article 10


    Burden of proof


    1.   Member States shall ensure that a claimant is required to prove the defectiveness of the product, the damage suffered and the causal link between that defectiveness and that damage.


    2.   The defectiveness of the product shall be presumed where any of the following conditions are met:


    (a)


    the defendant fails to disclose relevant evidence pursuant to Article 9(1);


    (b)


    the claimant demonstrates that the product does not comply with mandatory product safety requirements laid down in Union or national law that are intended to protect against the risk of the damage suffered
    by the injured person; or


    (c)


    the claimant demonstrates that the damage was caused by an obvious malfunction of the product during reasonably foreseeable use or under ordinary circumstances.


    3.   The causal link between the defectiveness of the product and the damage shall be presumed where it has been established that the product is defective and that the damage caused is of a kind typically
    consistent with the defect in question.


    4.   A national court shall presume the defectiveness of the product or the causal link between its defectiveness and the damage, or both, where, despite the disclosure of evidence in accordance with
    Article 9 and taking into account all the relevant circumstances of the case:


    (a)


    the claimant faces excessive difficulties, in particular due to technical or scientific complexity, in proving the defectiveness of the product or the causal link between its defectiveness and the damage,
    or both; and


    (b)


    the claimant demonstrates that it is likely that the product is defective or that there is a causal link between the defectiveness of the product and the damage, or both.


    5.   The defendant shall have the right to rebut any of the presumptions referred to in paragraphs 2, 3 and 4.'
- id: art-14
  title: Article 11
  text: 'Article 11


    Exemption from liability


    1.   An economic operator as referred to in Article 8 shall not be liable for damage caused by a defective product if that economic operator proves any of the following:


    (a)


    in the case of a manufacturer or importer, that it did not place the product on the market or put it into service;


    (b)


    in the case of a distributor, that it did not make the product available on the market;


    (c)


    that it is probable that the defectiveness that caused the damage did not exist at the time the product was placed on the market, put into service or, in the case of a distributor, made available on
    the market, or that that defectiveness came into being after that moment;


    (d)


    that the defectiveness that caused the damage is due to compliance of the product with legal requirements;


    (e)


    that the objective state of scientific and technical knowledge at the time the product was placed on the market or put into service or during the period in which the product was within the manufacturer’s
    control was not such that the defectiveness could be discovered;


    (f)


    in the case of a manufacturer of a defective component, as referred to in Article 8(1), first subparagraph, point (b), that the defectiveness of the product in which that component has been integrated
    is attributable to the design of that product or to the instructions given by the manufacturer of that product to the manufacturer of that component;


    (g)


    in the case of a person that modifies a product as referred to in Article 8(2), that the defectiveness that caused the damage is related to a part of the product not affected by the modification.


    2.   By way of derogation from paragraph 1, point (c), an economic operator shall not be exempted from liability where the defectiveness of a product is due to any of the following, provided that it
    is within the manufacturer’s control:


    (a)


    a related service;


    (b)


    software, including software updates or upgrades;


    (c)


    a lack of software updates or upgrades necessary to maintain safety;


    (d)


    a substantial modification of the product.'
- id: art-15
  title: CHAPTER III
  text: 'CHAPTER III


    GENERAL PROVISIONS ON LIABILITY'
- id: art-16
  title: Article 12
  text: 'Article 12


    Liability of multiple economic operators


    1.   Without prejudice to national law concerning rights of contribution or recourse, Member States shall ensure that where two or more economic operators are liable for the same damage pursuant to
    this Directive, they can be held liable jointly and severally.


    2.   A manufacturer that integrates software as a component in a product shall not have a right of recourse against the manufacturer of a defective software component that causes damage where:


    (a)


    the manufacturer of the defective software component was, at the time of the placing on the market of that software component, a microenterprise or a small enterprise, meaning an enterprise that, when
