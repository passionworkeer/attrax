- id: art-3
  title: CHAPTER I
  text: 'CHAPTER I


    SUBJECT MATTER, SCOPE AND DEFINITIONS'
- id: art-4
  title: Article 1
  text: 'Article 1


    Subject matter and scope


    1.   This Regulation establishes the criteria for determining whether an economic activity qualifies as environmentally sustainable for the purposes of establishing the degree to which an investment
    is environmentally sustainable.


    2.   This Regulation applies to:


    (a)


    measures adopted by Member States or by the Union that set out requirements for financial market participants or issuers in respect of financial products or corporate bonds that are made available as
    environmentally sustainable;


    (b)


    financial market participants that make available financial products;


    (c)


    undertakings which are subject to the obligation to publish a non-financial statement or a consolidated non-financial statement pursuant to Article 19a or Article 29a of Directive 2013/34/EU of the
    European Parliament and of the Council

    (

    68

    )

    , respectively.'
- id: art-5
  title: Article 2
  text: 'Article 2


    Definitions


    For the purposes of this Regulation, the following definitions apply:


    (1)


    ‘environmentally sustainable investment’ means an investment in one or several economic activities that qualify as environmentally sustainable under this Regulation;


    (2)


    ‘financial market participant’ means a financial market participant as defined in point (1) of Article 2 of Regulation (EU) 2019/2088 and includes a manufacturer of a pension product to which a Member
    State has decided to apply that Regulation in accordance with Article 16 of that Regulation;


    (3)


    ‘financial product’ means a financial product as defined in point (12) of Article 2 of Regulation (EU) 2019/2088;


    (4)


    ‘issuer’ means an issuer as defined in point (h) of Article 2 of Regulation (EU) 2017/1129 of the European Parliament and of the Council

    (

    69

    )

    ;


    (5)


    ‘climate change mitigation’ means the process of holding the increase in the global average temperature to well below 2 °C and pursuing efforts to limit it to 1,5 °C above pre-industrial levels, as
    laid down in the Paris Agreement;


    (6)


    ‘climate change adaptation’ means the process of adjustment to actual and expected climate change and its impacts;


    (7)


    ‘greenhouse gas’ means a greenhouse gas listed in Annex I to Regulation (EU) No 525/2013 of the European Parliament and of the Council

    (

    70

    )

    ;


    (8)


    ‘waste hierarchy’ means the waste hierarchy as laid down in Article 4 of Directive 2008/98/EC;


    (9)


    ‘circular economy’ means an economic system whereby the value of products, materials and other resources in the economy is maintained for as long as possible, enhancing their efficient use in production
    and consumption, thereby reducing the environmental impact of their use, minimising waste and the release of hazardous substances at all stages of their life cycle, including through the application
    of the waste hierarchy;


    (10)


    ‘pollutant’ means a substance, vibration, heat, noise, light or other contaminant present in air, water or land which may be harmful to human health or the environment, which may result in damage to
    material property, or which may impair or interfere with amenities and other legitimate uses of the environment;


    (11)


    ‘soil’ means the top layer of the Earth’s crust situated between the bedrock and the surface, which is composed of mineral particles, organic matter, water, air and living organisms;


    (12)


    ‘pollution’ means:


    (a)


    the direct or indirect introduction of pollutants into air, water or land as a result of human activity;


    (b)


    in the context of the marine environment, pollution as defined in point 8 of Article 3 of Directive 2008/56/EC;


    (c)


    in the context of the water environment, pollution as defined in point 33 of Article 2 of Directive 2000/60/EC;


    (13)


    ‘ecosystem’ means a dynamic complex of plant, animal, and micro-organism communities and their non-living environment interacting as a functional unit;


    (14)


    ‘ecosystem services’ means the direct and indirect contributions of ecosystems to the economic, social, cultural and other benefits that people derive from those ecosystems;


    (15)


    ‘biodiversity’ means the variability among living organisms arising from all sources including terrestrial, marine and other aquatic ecosystems and the ecological complexes of which they are part and
    includes diversity within species, between species and of ecosystems;


    (16)


    ‘good condition’ means, in relation to an ecosystem, that the ecosystem is in good physical, chemical and biological condition or of a good physical, chemical and biological quality with self-reproduction
    or self-restoration capability, in which species composition, ecosystem structure and ecological functions are not impaired;


    (17)


    ‘energy efficiency’ means the more efficient use of energy at all the stages of the energy chain from production to final consumption;


    (18)


    ‘marine waters’ means marine waters as defined in point 1 of Article 3 of Directive 2008/56/EC;


    (19)


    ‘surface water’ means surface water as defined in point 1 of Article 2 of Directive 2000/60/EC;


    (20)


    ‘groundwater’ means groundwater as defined in point 2 of Article 2 of Directive 2000/60/EC;


    (21)


    ‘good environmental status’ means good environmental status as defined in point 5 of Article 3 of Directive 2008/56/EC;


    (22)


    ‘good status’ means:


    (a)


    for surface water, having both ‘good ecological status’ as defined in point 22 of Article 2 of Directive 2000/60/EC and ‘good surface water chemical status’ as defined in point 24 of Article 2 of that
    Directive;


    (b)


    for groundwater, having both ‘good groundwater chemical status’ as defined in point 25 of Article 2 of Directive 2000/60/EC and ‘good quantitative status’ as defined in point 28 of Article 2 of that
    Directive;


    (23)


    ‘good ecological potential’ means good ecological potential as defined in point 23 of Article 2 of Directive 2000/60/EC.'
- id: art-6
  title: CHAPTER II
  text: 'CHAPTER II


    ENVIRONMENTALLY SUSTAINABLE ECONOMIC ACTIVITIES'
- id: art-7
  title: Article 3
  text: 'Article 3


    Criteria for environmentally sustainable economic activities


    For the purposes of establishing the degree to which an investment is environmentally sustainable, an economic activity shall qualify as environmentally sustainable where that economic activity:


    (a)


    contributes substantially to one or more of the environmental objectives set out in Article 9 in accordance with Articles 10 to 16;


    (b)


    does not significantly harm any of the environmental objectives set out in Article 9 in accordance with Article 17;


    (c)


    is carried out in compliance with the minimum safeguards laid down in Article 18; and


    (d)


    complies with technical screening criteria that have been established by the Commission in accordance with Article 10(3), 11(3), 12(2), 13(2), 14(2) or 15(2).'
- id: art-8
  title: Article 4
  text: 'Article 4


    Use of the criteria for environmentally sustainable economic activities in public measures, in standards and in labels


    Member States and the Union shall apply the criteria set out in Article 3 to determine whether an economic activity qualifies as environmentally sustainable for the purposes of any measure setting out
    requirements for financial market participants or issuers in respect of financial products or corporate bonds that are made available as environmentally sustainable.'
- id: art-9
  title: Article 5
  text: 'Article 5


    Transparency of environmentally sustainable investments in pre-contractual disclosures and in periodic reports


    Where a financial product as referred to in Article 9(1), (2) or (3) of Regulation (EU) 2019/2088 invests in an economic activity that contributes to an environmental objective within the meaning of
    point (17) of Article 2 of that Regulation, the information to be disclosed in accordance with Articles 6(3) and 11(2) of that Regulation shall include the following:


    (a)


    the information on the environmental objective or environmental objectives set out in Article 9 of this Regulation to which the investment underlying the financial product contributes; and


    (b)


    a description of how and to what extent the investments underlying the financial product are in economic activities that qualify as environmentally sustainable under Article 3 of this Regulation.


    The description referred to in point (b) of the first subparagraph of this Article shall specify the proportion of investments in environmentally sustainable economic activities selected for the financial
    product, including details on the proportions of enabling and transitional activities referred to in Article 16 and Article 10(2), respectively, as a percentage of all investments selected for the financial
    product.'
- id: art-10
  title: Article 6
  text: 'Article 6


    Transparency of financial products that promote environmental characteristics in pre-contractual disclosures and in periodic reports


    Where a financial product as referred to in Article 8(1) of Regulation (EU) 2019/2088 promotes environmental characteristics, Article 5 of this Regulation shall apply

    mutatis mutandis

    .


    The information to be disclosed in accordance with Articles 6(3) and 11(2) of Regulation (EU) 2019/2088 shall be accompanied by the following statement:


    ‘The “do no significant harm” principle applies only to those investments underlying the financial product that take into account the EU criteria for environmentally sustainable economic activities.


    The investments underlying the remaining portion of this financial product do not take into account the EU criteria for environmentally sustainable economic activities.’.'
- id: art-11
  title: Article 7
  text: 'Article 7


    Transparency of other financial products in pre-contractual disclosures and in periodic reports


    Where a financial product is not subject to Article 8(1) or to Article 9(1), (2) or (3) of Regulation (EU) 2019/2088, the information to be disclosed in accordance with the provisions of sectoral legislation
    referred to in Articles 6(3) and 11(2) of that Regulation shall be accompanied by the following statement:


    ‘The investments underlying this financial product do not take into account the EU criteria for environmentally sustainable economic activities.’.'
- id: art-12
  title: Article 8
  text: 'Article 8


    Transparency of undertakings in non-financial statements


    1.   Any undertaking which is subject to an obligation to publish non-financial information pursuant to Article 19a or Article 29a of Directive 2013/34/EU shall include in its non-financial statement
    or consolidated non-financial statement information on how and to what extent the undertaking’s activities are associated with economic activities that qualify as environmentally sustainable under Articles
    3 and 9 of this Regulation.


    2.   In particular, non-financial undertakings shall disclose the following:


    (a)


    the proportion of their turnover derived from products or services associated with economic activities that qualify as environmentally sustainable under Articles 3 and 9; and


    (b)


    the proportion of their capital expenditure and the proportion of their operating expenditure related to assets or processes associated with economic activities that qualify as environmentally sustainable
    under Articles 3 and 9.


    3.   If an undertaking publishes non-financial information pursuant to Article 19a or Article 29a of Directive 2013/34/EU in a separate report in accordance with Article 19a(4) or Article 29a(4) of
    that Directive, the information referred to in paragraphs 1 and 2 of this Article shall be published in that separate report.


    4.   The Commission shall adopt a delegated act in accordance with Article 23 to supplement paragraphs 1 and 2 of this Article to specify the content and presentation of the information to be disclosed
    pursuant to those paragraphs, including the methodology to be used in order to comply with them, taking into account the specificities of both financial and non-financial undertakings and the technical
    screening criteria established pursuant to this Regulation. The Commission shall adopt that delegated act by 1 June 2021.'
- id: art-13
  title: Article 9
  text: 'Article 9


    Environmental objectives


    For the purposes of this Regulation, the following shall be environmental objectives:


    (a)


    climate change mitigation;


    (b)


    climate change adaptation;


    (c)


    the sustainable use and protection of water and marine resources;


    (d)


    the transition to a circular economy;


    (e)


    pollution prevention and control;


    (f)


    the protection and restoration of biodiversity and ecosystems.'
- id: art-14
  title: Article 10
  text: 'Article 10


    Substantial contribution to climate change mitigation


    1.   An economic activity shall qualify as contributing substantially to climate change mitigation where that activity contributes substantially to the stabilisation of greenhouse gas concentrations
    in the atmosphere at a level which prevents dangerous anthropogenic interference with the climate system consistent with the long-term temperature goal of the Paris Agreement through the avoidance or
    reduction of greenhouse gas emissions or the increase of greenhouse gas removals, including through process innovations or product innovations, by:


    (a)


    generating, transmitting, storing, distributing or using renewable energy in line with Directive (EU) 2018/2001, including through using innovative technology with a potential for significant future
    savings or through necessary reinforcement or extension of the grid;


    (b)


    improving energy efficiency, except for power generation activities as referred to in Article 19(3);


    (c)


    increasing clean or climate-neutral mobility;


    (d)


    switching to the use of sustainably sourced renewable materials;


    (e)


    increasing the use of environmentally safe carbon capture and utilisation (CCU) and carbon capture and storage (CCS) technologies that deliver a net reduction in greenhouse gas emissions;


    (f)


    strengthening land carbon sinks, including through avoiding deforestation and forest degradation, restoration of forests, sustainable management and restoration of croplands, grasslands and wetlands,
    afforestation, and regenerative agriculture;


    (g)


    establishing energy infrastructure required for enabling the decarbonisation of energy systems;


    (h)


    producing clean and efficient fuels from renewable or carbon-neutral sources; or


    (i)


    enabling any of the activities listed in points (a) to (h) of this paragraph in accordance with Article 16.


    2.   For the purposes of paragraph 1, an economic activity for which there is no technologically and economically feasible low-carbon alternative shall qualify as contributing substantially to climate
    change mitigation where it supports the transition to a climate-neutral economy consistent with a pathway to limit the temperature increase to 1,5

    0

    C above pre-industrial levels, including by phasing out greenhouse gas emissions, in particular emissions from solid fossil fuels, and where that activity:


    (a)


    has greenhouse gas emission levels that correspond to the best performance in the sector or industry;


    (b)


    does not hamper the development and deployment of low-carbon alternatives; and


    (c)


    does not lead to a lock-in of carbon-intensive assets, considering the economic lifetime of those assets.


    For the purpose of this paragraph and the establishment of technical screening criteria pursuant to Article 19, the Commission shall assess the potential contribution and feasibility of all relevant
    existing technologies.


    3.   The Commission shall adopt a delegated act in accordance with Article 23 to:


    (a)


    supplement paragraphs 1 and 2 of this Article by establishing technical screening criteria for determining the conditions under which a specific economic activity qualifies as contributing substantially
    to climate change mitigation; and


    (b)


    supplement Article 17 by establishing, for each relevant environmental objective, technical screening criteria for determining whether an economic activity in respect of which technical screening criteria
    have been established pursuant to point (a) of this paragraph causes significant harm to one or more of those objectives.


    4.   Prior to adopting the delegated act referred to in paragraph 3 of this Article, the Commission shall consult the Platform referred to in Article 20 regarding the technical screening criteria referred
    to in paragraph 3 of this Article.


    5.   The Commission shall establish the technical screening criteria referred to in paragraph 3 of this Article in one delegated act, taking into account the requirements of Article 19.


    6.   The Commission shall adopt the delegated act referred to in paragraph 3 by 31 December 2020, with a view to ensuring its application from 1 January 2022.'
- id: art-15
  title: Article 11
  text: 'Article 11


    Substantial contribution to climate change adaptation


    1.   An economic activity shall qualify as contributing substantially to climate change adaptation where that activity:


    (a)


    includes adaptation solutions that either substantially reduce the risk of the adverse impact of the current climate and the expected future climate on that economic activity or substantially reduce
    that adverse impact, without increasing the risk of an adverse impact on people, nature or assets; or


    (b)


    provides adaptation solutions that, in addition to satisfying the conditions set out in Article 16, contribute substantially to preventing or reducing the risk of the adverse impact of the current climate
    and the expected future climate on people, nature or assets, without increasing the risk of an adverse impact on other people, nature or assets.


    2.   The adaptation solutions referred to in point (a) of paragraph 1 shall be assessed and ranked in order of priority using the best available climate projections and shall, at a minimum, prevent
    or reduce:


    (a)


    the location-specific and context-specific adverse impact of climate change on the economic activity; or


    (b)


    the potential adverse impact of climate change on the environment within which the economic activity takes place.


    3.   The Commission shall adopt a delegated act in accordance with Article 23 to:


    (a)


    supplement paragraphs 1 and 2 of this Article by establishing technical screening criteria for determining the conditions under which a specific economic activity qualifies as contributing substantially
    to climate change adaptation; and


    (b)


    supplement Article 17 by establishing, for each relevant environmental objective, technical screening criteria for determining whether an economic activity in respect of which technical screening criteria
    have been established pursuant to point (a) of this paragraph causes significant harm to one or more of those objectives.


    4.   Prior to adopting the delegated act referred to in paragraph 3 of this Article, the Commission shall consult the Platform referred to in Article 20 regarding the technical screening criteria referred
    to in paragraph 3 of this Article.


    5.   The Commission shall establish the technical screening criteria referred to in paragraph 3 of this Article in one delegated act, taking into account the requirements of Article 19.


    6.   The Commission shall adopt the delegated act referred to in paragraph 3 by 31 December 2020, with a view to ensuring its application from 1 January 2022.'
- id: art-16
  title: Article 12
  text: 'Article 12


