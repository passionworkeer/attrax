- id: art-7
  title: Article 4
  text: 'Article 4


    Free movement


    1.   Packaging shall only be placed on the market if it complies with this Regulation.


    2.   Member States shall not prohibit, restrict or impede the placing on the market of packaging that complies with the sustainability, labelling and information requirements laid down in or pursuant
    to Articles 5 to 12.


    3.   If Member States choose to maintain or introduce national sustainability requirements, or information requirements additional to those laid down in this Regulation, those requirements shall not
    conflict with those laid down in this Regulation and the Member States shall not prohibit, restrict or impede the placing on the market of packaging that complies with this Regulation for reasons of
    non-compliance with those national requirements.


    4.   At trade fairs, exhibitions or similar events, Member States shall not prevent the showing of packaging which does not comply with this Regulation, provided that a visible sign clearly indicates
    that such packaging does not comply with this Regulation and that it is not for sale until it has been brought into conformity.'
- id: art-8
  title: CHAPTER II
  text: 'CHAPTER II


    SUSTAINABILITY REQUIREMENTS'
- id: art-9
  title: Article 5
  text: 'Article 5


    Requirements for substances in packaging


    1.   Packaging placed on the market shall be so manufactured that the presence and concentration of substances of concern as constituents of the packaging material or of any of the packaging components
    is minimised, including with regard to their presence in emissions and any outcomes of waste management, such as secondary raw materials, ashes or other material for final disposal, and to the adverse
    impact on the environment due to microplastics.


    2.   The Commission shall monitor the presence of substances of concern in packaging and packaging components and shall take, where appropriate, the relevant follow-up measures.


