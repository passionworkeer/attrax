  text: 'L_2008218EN.01003001.xml


    13.8.2008


    EN


    Official Journal of the European Union


    L 218/30


    REGULATION (EC) No 765/2008 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 9 July 2008



    setting out the requirements for accreditation and market surveillance relating to the marketing of products and repealing Regulation (EEC) No 339/93


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty establishing the European Community, and in particular Articles 95 and 133 thereof,


    Having regard to the proposal from the Commission,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    After consulting the Committee of the Regions,


    Acting in accordance with the procedure laid down in Article 251 of the Treaty

    (

    2

    )

    ,


    Whereas:


    (1)


    It is necessary to ensure that products benefiting from the free movement of goods within the Community fulfil requirements providing a high level of protection of public interests such as health and
    safety in general, health and safety at the workplace, protection of consumers, protection of the environment and security, while ensuring that the free movement of products is not restricted to any
    extent greater than that which is allowed under Community harmonisation legislation or any other relevant Community rules. Provision should, therefore, be made for rules on accreditation, market surveillance,
    controls of products from third countries and the CE marking.


    (2)


    It is necessary to establish an overall framework of rules and principles in relation to accreditation and market surveillance. That framework should not affect the substantive rules of existing legislation
    setting out the provisions to be observed for the purpose of protecting public interests such as health, safety and protection of consumers and of the environment, but should aim at enhancing their
    operation.


    (3)


    This Regulation should be seen as complementary to Decision No 768/2008/EC of the European Parliament and of the Council of 9 July 2008 on a common framework for the marketing of products

    (

    3

    )

    .


    (4)


    It is very difficult to adopt Community legislation for every product which exists or which may be developed; there is a need for a broad-based, legislative framework of a horizontal nature to deal
    with such products, to cover lacunae, in particular pending revision of existing specific legislation, and to complement provisions in existing or future specific legislation, in particular with a view
    to ensuring a high level of protection of health, safety, the environment and consumers, as required by Article 95 of the Treaty.


    (5)


    The framework for market surveillance established by this Regulation should complement and strengthen existing provisions in Community harmonisation legislation relating to market surveillance and the
    enforcement of such provisions. However, in accordance with the principle of

    lex specialis

    , this Regulation should apply only in so far as there are no specific provisions with the same objective, nature or effect in other existing or future rules of Community harmonisation legislation.
    Examples can be found in the following sectors: drug precursors, medical devices, medicinal products for human and veterinary use, motor vehicles and aviation. The corresponding provisions of this Regulation
    should not therefore apply in the areas covered by such specific provisions.


    (6)


    Directive 2001/95/EC of the European Parliament and of the Council of 3 December 2001 on general product safety

    (

    4

    )

    established rules to ensure the safety of consumer products. Market surveillance authorities should have the possibility of taking the more specific measures available to them under that Directive.


    (7)


    However, in order to achieve a higher level of safety for consumer products, the market surveillance mechanisms provided for in Directive 2001/95/EC should be reinforced as regards products presenting
    a serious risk, in accordance with the principles established by this Regulation. Directive 2001/95/EC should therefore be amended accordingly.


    (8)


    Accreditation is part of an overall system, including conformity assessment and market surveillance, designed to assess and ensure conformity with the applicable requirements.


    (9)


    The particular value of accreditation lies in the fact that it provides an authoritative statement of the technical competence of bodies whose task is to ensure conformity with the applicable requirements.


    (10)


    Accreditation, though so far not regulated at Community level, is carried out in all Member States. The lack of common rules for that activity has resulted in different approaches and differing systems
    throughout the Community, with the result that the degree of rigour applied in the performance of accreditation has varied between Member States. It is therefore necessary to develop a comprehensive
    framework for accreditation and to lay down at Community level the principles for its operation and organisation.


    (11)


    The establishment of a uniform national accreditation body should be without prejudice to the allocation of functions within Member States.


    (12)


    Where Community harmonisation legislation provides for the selection of conformity assessment bodies for its implementation, transparent accreditation, as provided for in this Regulation, ensuring the
    necessary level of confidence in conformity certificates, should be considered by the national public authorities throughout the Community the preferred means of demonstrating the technical competence
    of those bodies. However, national authorities may consider that they possess the appropriate means of carrying out this evaluation themselves. In such cases, in order to ensure the appropriate level
    of credibility of evaluations carried out by other national authorities, they should provide the Commission and the other Member States with the necessary documentary evidence demonstrating the compliance
    of the conformity assessment bodies evaluated with the relevant regulatory requirements.


    (13)


    A system of accreditation which functions by reference to binding rules helps to strengthen mutual confidence between Member States as regards the competence of conformity assessment bodies and consequently
    the certificates and test reports issued by them. It thereby enhances the principle of mutual recognition and therefore the provisions of this Regulation on accreditation should apply in relation to
    bodies carrying out conformity assessments in both the regulated and the non-regulated areas. The issue at stake is the quality of certificates and test reports irrespective of whether they fall within
    the regulated or the non-regulated area, and no distinction should therefore be made between those areas.


    (14)


    For the purposes of this Regulation, not-for-profit operation by a national accreditation body should be understood as an activity that is not intended to add any gain to the resources of the body''s
    owners or members. While national accreditation bodies do not have the objective of maximising or distributing profits, they may provide services in return for payment, or receive income. Any excess
    revenue that results from such services may be used for investment to develop their activities further, as long as it is in line with their main activities. It should accordingly be emphasised that
    the primary objective of national accreditation bodies should be to support or engage actively in activities that are not intended to produce any gain.


    (15)


    Since the purpose of accreditation is to provide an authoritative statement of the competence of a body to perform conformity assessment activities, Member States should not maintain more than one national
    accreditation body and should ensure that that body is organised in such a way as to safeguard the objectivity and impartiality of its activities. Such national accreditation bodies should operate independently
    of commercial conformity assessment activities. It is therefore appropriate to provide that Member States ensure that, in the performance of their tasks, national accreditation bodies are deemed to
    exercise public authority, irrespective of their legal status.


    (16)


    For the assessment and continued monitoring of the competence of a conformity assessment body, it is essential to determine its technological knowledge and experience and its ability to carry out assessment.
    It is therefore necessary that the national accreditation body possess the relevant knowledge, competence and means for the proper performance of its tasks.


    (17)


    Accreditation should in principle be operated as a self-supporting activity. Member States should ensure that financial support exists for the fulfilment of special tasks.


    (18)


    In those cases where it is not economically meaningful or sustainable for a Member State to establish a national accreditation body, that Member State should have recourse to the national accreditation
    body of another Member State and should be encouraged to have such recourse to the fullest extent possible.


    (19)


    Competition between national accreditation bodies could lead to the commercialisation of their activity, which would be incompatible with their role as the last level of control in the conformity assessment
    chain. The objective of this Regulation is to ensure that, within the European Union, one accreditation certificate is sufficient for the whole territory of the Union, and to avoid multiple accreditation,
    which is added cost without added value. National accreditation bodies may find themselves in competition on the markets of third countries, but that must have no effect on their activities inside the
    Community, or on the cooperation and peer evaluation activities organised by the body recognised under this Regulation.


    (20)


    In order to avoid multiple accreditation, to enhance acceptance and recognition of accreditation certificates and to carry out effective monitoring of accredited conformity assessment bodies, conformity
    assessment bodies should request accreditation by the national accreditation body of the Member State in which they are established. Nevertheless, it is necessary to ensure that a conformity assessment
    body is able to request accreditation in another Member State in the event that there is no national accreditation body in its own Member State or where the national accreditation body is not competent
    to provide the accreditation services requested. In such cases, appropriate cooperation and exchange of information between national accreditation bodies should be established.


    (21)


    In order to ensure that national accreditation bodies fulfil the requirements and obligations provided for in this Regulation, it is important that Member States support the proper functioning of the
    accreditation system, monitor their national accreditation bodies regularly and take appropriate corrective measures within a reasonable timeframe where necessary.


    (22)


    In order to ensure the equivalence of the level of competence of conformity assessment bodies, to facilitate mutual recognition and to promote the overall acceptance of accreditation certificates and
    conformity assessment results issued by accredited bodies, it is necessary that national accreditation bodies operate a rigorous and transparent peer evaluation system and regularly undergo such evaluation.


    (23)


    This Regulation should provide for the recognition of a single organisation at European level in respect of certain functions in the field of accreditation. The European cooperation for Accreditation
    (the EA), whose main mission is to promote a transparent and quality-led system for the evaluation of the competence of conformity assessment bodies throughout Europe, manages a peer evaluation system
    among national accreditation bodies from the Member States and other European countries. That system has proved to be efficient and to provide mutual confidence. The EA sh'
- id: art-2
  title: CHAPTER I
  text: 'CHAPTER I


    GENERAL PROVISIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Subject matter and scope


    1.   This Regulation lays down rules on the organisation and operation of accreditation of conformity assessment bodies performing conformity assessment activities.


    2.   This Regulation provides a framework for the market surveillance of products to ensure that those products fulfil requirements providing a high level of protection of public interests, such as
    health and safety in general, health and safety at the workplace, the protection of consumers, protection of the environment and security.


    3.   This Regulation provides a framework for controls on products from third countries.


    4.   This Regulation lays down the general principles of the CE marking.'
- id: art-4
  title: Article 2
  text: 'Article 2


    Definitions


    For the purposes of this Regulation the following definitions shall apply:


    1.


    ‘making available on the market’ shall mean any supply of a product for distribution, consumption or use on the Community market in the course of a commercial activity, whether in return for payment
    or free of charge;


    2.


    ‘placing on the market’ shall mean the first making available of a product on the Community market;


    3.


    ‘manufacturer’ shall mean any natural or legal person who manufactures a product or has a product designed or manufactured, and markets that product under his name or trademark;


    4.


    ‘authorised representative’ shall mean any natural or legal person established within the Community who has received a written mandate from a manufacturer to act on his behalf in relation to specified
    tasks with regard to the latter''s obligations under the relevant Community legislation;


    5.


    ‘importer’ shall mean any natural or legal person established within the Community who places a product from a third country on the Community market;


    6.


    ‘distributor’ shall mean any natural or legal person in the supply chain, other than the manufacturer or the importer, who makes a product available on the market;


    7.


    ‘economic operators’ shall mean the manufacturer, the authorised representative, the importer and the distributor;


    8.


    ‘technical specification’ shall mean a document that prescribes technical requirements to be fulfilled by a product, process or service;


    9.


    ‘harmonised standard’ shall mean a standard adopted by one of the European standardisation bodies listed in Annex I to Directive 98/34/EC of the European Parliament and of the Council of 22 June 1998
    laying down a procedure for the provision of information in the field of technical standards and regulations and of rules on Information Society services

    (

    10

    )

    on the basis of a request made by the Commission in accordance with Article 6 of that Directive;


    10.


    ‘accreditation’ shall mean an attestation by a national accreditation body that a conformity assessment body meets the requirements set by harmonised standards and, where applicable, any additional
    requirements including those set out in relevant sectoral schemes, to carry out a specific conformity assessment activity;


    11.


    ‘national accreditation body’ shall mean the sole body in a Member State that performs accreditation with authority derived from the State;


    12.


    ‘conformity assessment’ shall mean the process demonstrating whether specified requirements relating to a product, process, service, system, person or body have been fulfilled;


    13.


    ‘conformity assessment body’ shall mean a body that performs conformity assessment activities including calibration, testing, certification and inspection;


    14.


    ‘recall’ shall mean any measure aimed at achieving the return of a product that has already been made available to the end user;


    15.


    ‘withdrawal’ shall mean any measure aimed at preventing a product in the supply chain from being made available on the market;


    16.


    ‘peer evaluation’ shall mean a process for the assessment of a national accreditation body by other national accreditation bodies, carried out in accordance with the requirements of this Regulation,
    and, where applicable, additional sectoral technical specifications;


    17.


    ‘market surveillance’ shall mean the activities carried out and measures taken by public authorities to ensure that products comply with the requirements set out in the relevant Community harmonisation
    legislation and do not endanger health, safety or any other aspect of public interest protection;


    18.


    ‘market surveillance authority’ shall mean an authority of a Member State responsible for carrying out market surveillance on its territory;


    19.


    ‘release for free circulation’ shall mean the procedure laid down in Article 79 of Council Regulation (EEC) No 2913/92 of 12 October 1992 establishing the Community Customs Code

    (

    11

    )

    ;


    20.


    ‘CE marking’ shall mean a marking by which the manufacturer indicates that the product is in conformity with the applicable requirements set out in Community harmonisation legislation providing for
    its affixing;


    21.


    ‘Community harmonisation legislation’ shall mean any Community legislation harmonising the conditions for the marketing of products.'
- id: art-5
  title: CHAPTER II
  text: 'CHAPTER II


    ACCREDITATION'
- id: art-6
  title: Article 3
  text: 'Article 3


    Scope


    This Chapter shall apply to accreditation, used on a compulsory or voluntary basis, relating to conformity assessment, whether that assessment is compulsory or not, and irrespective of the legal status
    of the body performing the accreditation.'
- id: art-7
  title: Article 4
  text: 'Article 4


    General principles


    1.   Each Member State shall appoint a single national accreditation body.


    2.   Where a Member State considers that it is not economically meaningful or sustainable to have a national accreditation body or to provide certain accreditation services, it shall, as far as possible,
    have recourse to the national accreditation body of another Member State.


    3.   A Member State shall inform the Commission and the other Member States where, in accordance with paragraph 2, recourse is had to the national accreditation body of another Member State.


    4.   On the basis of the information referred to in paragraph 3 and Article 12, the Commission shall draw up and update a list of national accreditation bodies which it shall make publicly available.


    5.   Where accreditation is not operated directly by the public authorities themselves, a Member State shall entrust its national accreditation body with the operation of accreditation as a public authority
    activity and grant it formal recognition.


    6.   The responsibilities and tasks of the national accreditation body shall be clearly distinguished from those of other national authorities.


    7.   The national accreditation body shall operate on a not-for-profit basis.


    8.   The national accreditation body shall not offer or provide any activities or services that conformity assessment bodies provide, nor shall it provide consultancy services, own shares in or otherwise
    have a financial or managerial interest in a conformity assessment body.


    9.   Each Member State shall ensure that its national accreditation body has the appropriate financial and personnel resources for the proper performance of its tasks, including the fulfilment of special
    tasks, such as activities for European and international accreditation cooperation and activities that are required to support public policy and which are not self-financing.


    10.   The national accreditation body shall be a member of the body recognised under Article 14.


    11.   National accreditation bodies shall establish and maintain appropriate structures to ensure the effective and balanced involvement of all interested parties within both their organisations and
    the body recognised under Article 14.'
- id: art-8
  title: Article 5
  text: 'Article 5


    Operation of accreditation


    1.   A national accreditation body shall, when requested by a conformity assessment body, evaluate whether that conformity assessment body is competent to carry out a specific conformity assessment
    activity. Where it is found to be competent, the national accreditation body shall issue an accreditation certificate to that effect.


    2.   When a Member State decides not to use accreditation, it shall provide the Commission and the other Member States with all the documentary evidence necessary for the verification of the competence
    of the conformity assessment bodies it selects for the implementation of the Community harmonisation legislation in question.


    3.   National accreditation bodies shall monitor the conformity assessment bodies to which they have issued an accreditation certificate.


    4.   Where a national accreditation body ascertains that a conformity assessment body which has received an accreditation certificate is no longer competent to carry out a specific conformity assessment
    activity or has committed a serious breach of its obligations, that accreditation body shall take all appropriate measures within a reasonable timeframe to restrict, suspend or withdraw the accreditation
    certificate.


    5.   Member States shall establish procedures for the resolution of appeals, including, where appropriate, legal remedies against accreditation decisions or the absence thereof.'
- id: art-9
  title: Article 6
  text: 'Article 6


    Principle of non-competition


    1.   National accreditation bodies shall not compete with conformity assessment bodies.


    2.   National accreditation bodies shall not compete with other national accreditation bodies.


    3.   National accreditation bodies shall be permitted to operate across national borders, within the territory of another Member State, either at the request of a conformity assessment body in the circumstances
    set out in Article 7(1), or, if they are asked to do so by a national accreditation body in accordance with Article 7(3), in cooperation with the national accreditation body of that Member State.'
- id: art-10
  title: Article 7
  text: 'Article 7


    Cross-border accreditation


    1.   Where a conformity assessment body requests accreditation it shall do so with the national accreditation body of the Member State in which it is established or with the national accreditation body
    to which that Member State has had recourse in accordance with Article 4(2).


    However, a conformity assessment body may request accreditation by a national accreditation body other than those referred to in the first subparagraph in any one of the following situations:


    (a)


    where the Member State in which it is established has decided not to establish a national accreditation body and has not had recourse to the national accreditation body of another Member State in accordance
    with Article 4(2);


    (b)


    where the national accreditation bodies referred to in the first subparagraph do not perform accreditation in respect of the conformity assessment activities for which accreditation is sought;


    (c)


    where the national accreditation bodies referred to in the first subparagraph have not successfully undergone peer evaluation under Article 10 in respect of the conformity assessment activities for
    which accreditation is sought.


    2.   Where a national accreditation body receives a request pursuant to paragraph 1(b) or (c), it shall inform the national accreditation body of the Member State in which the requesting conformity
    assessment body is established. In such cases, the national accreditation body of the Member State in which the requesting conformity assessment body is established may participate as an observer.


    3.   A national accreditation body may request another national accreditation body to carry out part of the assessment activity. In such a case, the accreditation certificate shall be issued by the
    requesting body.'
- id: art-11
  title: Article 8
  text: 'Article 8


    Requirements for national accreditation bodies


    A national accreditation body shall fulfil the following requirements:


    1.


    it shall be organised in such a manner as to make it independent of the conformity assessment bodies it assesses and of commercial pressures, and to ensure that no conflicts of interest with conformity
    assessment bodies occur;


    2.


    it shall be organised and operated so as to safeguard the objectivity and impartiality of its activities;


    3.


    it shall ensure that each decision relating to the attestation of competence is taken by competent persons different from those who carried out the assessment;


    4.


    it shall have adequate arrangements to safeguard the confidentiality of the information obtained;


    5.


    it shall identify the conformity assessment activities for which it is competent to perform accreditation, referring, where appropriate, to relevant Community or national legislation and standards;


    6.


    it shall set up the procedures necessary to ensure efficient management and appropriate internal controls;


    7.


    it shall have a number of competent personnel at its disposal sufficient for the proper performance of its tasks;


    8.


    it shall document the duties, responsibilities and authorities of personnel who could affect the quality of the assessment and of the attestation of competence;


    9.


    it shall establish, implement and maintain procedures for monitoring the performance and competence of the personnel involved;


    10.


    it shall verify that conformity assessments are carried out in an appropriate manner, meaning that unnecessary burdens are not imposed on undertakings and that due account is taken of the size of an
    undertaking, the sector in which it operates, its structure, the degree of complexity of the product technology in question and the mass or serial nature of the production process;


    11.


    it shall publish audited annual accounts prepared in accordance with generally accepted accounting principles.'
- id: art-12
  title: Article 9
  text: 'Article 9


    Compliance with requirements


    1.   Where a national accreditation body does not meet the requirements of this Regulation or fails to fulfil its obligations hereunder, the Member State concerned shall take appropriate corrective
    action or shall ensure that such corrective action is taken, and shall inform the Commission thereof.


    2.   Member States shall monitor their national accreditation bodies at regular intervals in order to ensure that they fulfil the requirements laid down in Article 8 on a continuing basis.


    3.   Member States shall take the utmost account of the results of peer evaluation under Article 10 when carrying out the monitoring referred to in paragraph 2 of this Article.


    4.   National accreditation bodies shall have in place the necessary procedures to deal with complaints against the conformity assessment bodies they have accredited.'
- id: art-13
  title: Article 10
  text: 'Article 10


    Peer evaluation


    1.   National accreditation bodies shall subject themselves to peer evaluation organised by the body recognised under Article 14.


    2.   Stakeholders shall have the right to participate in the system set up for the supervision of peer evaluation activities, but not in individual peer evaluation procedures.


    3.   Member States shall ensure that their national accreditation bodies regularly undergo peer evaluation as required by paragraph 1.


    4.   Peer evaluation shall be operated on the basis of sound and transparent evaluation criteria and procedures, in particular concerning structural, human resource and process requirements, confidentiality
    and complaints. Appropriate appeal procedures against decisions taken as a result of such evaluation shall be provided for.


    5.   Peer evaluation shall ascertain whether the national accreditation bodies meet the requirements laid down in Article 8, taking into account the relevant harmonised standards referred to in Article 11.


    6.   The outcome of peer evaluation shall be published and communicated by the body recognised under Article 14 to all Member States and the Commission.


    7.   The Commission shall, in cooperation with the Member States, oversee the rules and the proper functioning of the peer evaluation system.'
- id: art-14
  title: Article 11
  text: 'Article 11


    Presumption of conformity for national accreditation bodies


    1.   National accreditation bodies that demonstrate conformity with the criteria laid down in the relevant harmonised standard, the reference of which has been published in the

    Official Journal of the European Union

    , by having successfully undergone peer evaluation under Article 10 shall be presumed to fulfil the requirements laid down in Article 8.


    2.   National authorities shall recognise the equivalence of the services delivered by those accreditation bodies which have successfully undergone peer evaluation under Article 10, and thereby accept,
    on the basis of the presumption referred to in paragraph 1 of this Article, the accreditation certificates of those bodies and the attestations issued by the conformity assessment bodies accredited
    by them.'
- id: art-15
  title: Article 12
  text: 'Article 12


    Information obligation


    1.   Each national accreditation body shall inform the other national accreditation bodies of the conformity assessment activities in respect of which it operates accreditation and of any changes thereto.


    2.   Each Member State shall inform the Commission and the body recognised under Article 14 of the identity of its national accreditation body and of all conformity assessment activities in respect
    of which that body operates accreditation in support of Community harmonisation legislation, and of any changes thereto.


    3.   Each national accreditation body shall regularly make publicly available information concerning the results of its peer evaluation, the conformity assessment activities in respect of which it operates
    accreditation and any changes thereto.'
- id: art-16
  title: Article 13
  text: 'Article 13


    Requests to the body recognised under Article 14


    1.   The Commission may, after consulting the Committee set up by Article 5 of Directive 98/34/EC, request the body recognised under Article 14 to contribute to the development, maintenance and implementation
    of accreditation in the Community.


    2.   The Commission may also, following the procedure laid down in paragraph 1:


    (a)


    request the body recognised under Article 14 to lay down evaluation criteria and procedures for peer evaluation and to develop sectoral accreditation schemes;


    (b)


    accept any existing scheme that already lays down evaluation criteria and procedures for peer evaluation.


    3.   The Commission shall ensure that sectoral schemes identify the technical specifications necessary to meet the level of competence required by Community harmonisation legislation in fields with
    specific requirements relating to technology, health and safety or environment related requirements or any other aspect of public interest protection.'
- id: art-17
  title: Article 14
  text: 'Article 14


    European accreditation infrastructure


    1.   The Commission shall, after consulting the Member States, recognise a body which satisfies the requirements set out in Annex I to this Regulation.


    2.   A body which is to be recognised pursuant to paragraph 1 shall conclude an agreement with the Commission. That agreement shall specify,

    inter alia

    , the detailed tasks of the body, funding provisions and provisions for its supervision. Both the Commission and the body shall be able to terminate the agreement without cause at the expiry of a reasonable
    period of notice to be defined therein.


    3.   The Commission and the body shall make the agreement public.


    4.   The Commission shall communicate the recognition of a body pursuant to paragraph 1 to the Member States and to national accreditation bodies.


    5.   The Commission may not recognise more than one body at a time.


    6.   The first body recognised under this Regulation shall be the European cooperation for accreditation, provided that it has concluded an agreement as specified in paragraph 2.'
- id: art-18
  title: CHAPTER III
  text: 'CHAPTER III


    COMMUNITY MARKET SURVEILLANCE FRAMEWORK AND CONTROLS OF PRODUCTS ENTERING THE COMMUNITY MARKET'
- id: art-19
  title: SECTION 1
  text: 'SECTION 1


    General provisions'
- id: art-20
  title: Article 15
  text: 'Article 15


    Scope


    1.   Articles 16 to 26 shall apply to products covered by Community harmonisation legislation.


    2.   Each of the provisions of Articles 16 to 26 shall apply in so far as there are no specific provisions with the same objective in Community harmonisation legislation.


    3.   The application of this Regulation shall not prevent market surveillance authorities from taking more specific measures as provided for in Directive 2001/95/EC.


