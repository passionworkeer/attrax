  text: 'L_2023150EN.01020601.xml


    9.6.2023


    EN


    Official Journal of the European Union


    L 150/206


    REGULATION (EU) 2023/1115 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 31 May 2023



    on the making available on the Union market and the export from the Union of certain commodities and products associated with deforestation and forest degradation and repealing Regulation (EU) No 995/2010


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 192(1) thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    After consulting the Committee of the Regions,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    Forests provide a broad variety of environmental, economic and social benefits, including timber and non-wood forest products and environmental services essential for humankind, as they harbour most
    of the Earth’s terrestrial biodiversity. They maintain ecosystem functions, help protect the climate system, provide clean air and play a vital role for the purification of waters and soils as well
    as for water retention and recharge. Large forest areas act as a moisture source and help prevent desertification of continental regions. In addition, forests provide subsistence and income to approximately
    one third of the world’s population and the destruction of forests has serious consequences for the livelihoods of the most vulnerable people, including indigenous peoples and local communities who
    depend heavily on forest ecosystems. Furthermore, deforestation and forest degradation reduce essential carbon sinks. Deforestation and forest degradation also increase the likelihood of contact between
    wild animals, farmed animals and humans, thereby increasing the risk of spreading new diseases and the risks of new epidemics and pandemics.


    (2)


    Deforestation and forest degradation are taking place at an alarming rate. The Food and Agriculture Organization of the United Nations (FAO) estimates that 420 million hectares of forest – about 10 %
    of the world’s remaining forests, equalling an area larger than the European Union – have been lost worldwide between 1990 and 2020. Deforestation and forest degradation are, in turn, important drivers
    of global warming and biodiversity loss – the two most important environmental challenges of our time. Yet, every year the world continues to lose 10 million hectares of forest. Forests are also heavily
    impacted by climate change and many challenges will need to be addressed to ensure the adaptability and resilience of forests in the coming decades.


    (3)


    Deforestation and forest degradation contribute to the global climate crisis in multiple ways. Most importantly, they increase greenhouse gas emissions through associated forest fires, permanently removing
    carbon sink capacities, decreasing the climate change resilience of the affected area and substantially reducing its biodiversity and resilience to diseases and pests. Deforestation alone accounts for
    11 % of greenhouse gas emissions as stated in the Intergovernmental Panel on Climate Change (IPCC) special report on climate change and land of 2019.


    (4)


    Climate breakdown induces the loss of biodiversity globally and biodiversity loss aggravates climate change, they are thus inextricably linked, as recent studies have confirmed. Biodiversity and healthy
    ecosystems are fundamental to climate-resilient development. Insects, birds and mammals act as pollinators and seed dispersers and can help store carbon more efficiently, directly or indirectly. Forests
    also ensure the continuous replenishment of water resources and the prevention of droughts and their deleterious effects on local communities, including indigenous peoples. Drastically reducing deforestation
    and forest degradation and systemically restoring forests and other ecosystems is the single largest nature-based opportunity for climate mitigation.


    (5)


    Biodiversity is essential for the resilience of ecosystems and their services both at local and at global level. Over half of the global gross domestic product depends on nature and the services it
    provides. Three major economic sectors – construction, agriculture, and food and drink – all highly depend on nature. Biodiversity loss threatens sustainable water cycles and food systems, putting food
    security and nutrition at risk. More than 75 % of global food crop types rely on animal pollination. Furthermore, several industrial sectors rely on genetic diversity and ecosystem services as critical
    inputs for production, in particular for medicines, including antimicrobials.


    (6)


    Climate change, biodiversity loss and deforestation are concerns of the highest global importance, affecting the survival of humanity and sustained living conditions on Earth. The acceleration of climate
    change, biodiversity loss and environmental degradation, paired with tangible examples of their devastating effects on nature, human living conditions and local economies, have led to the recognition
    of the green transition as the defining objective of our time and a matter of gender equality and of intergenerational equity.


    (7)


    Environmental human rights defenders, who strive to protect and promote human rights relating to the environment, including access to clean water, air, and land are often the target of persecution and
    lethal attacks. Those attacks disproportionately affect indigenous peoples. According to 2020 reports, more than two thirds of victims of those attacks were working to defend the world’s forests from
    deforestation and industrial development.


    (8)


    Union consumption is a considerable driver of deforestation and forest degradation on a global scale. The impact assessment of this Regulation estimated that without appropriate regulatory intervention,
    the Union’s consumption and production of six commodities (cattle, cocoa, coffee, oil palm, soya and wood) alone would rise to approximately 248 000 hectares of deforestation annually by 2030.


    (9)


    As regards the situation of forests within the Union, the State of Europe’s Forests 2020 report states that, between 1990 and 2020, the area of forests in Europe has increased by 9 %, carbon stored
    in the biomass has grown by 50 % and wood supply has risen by 40 %. Primary and naturally regenerating forests are at risk,

    inter alia

    , from intensive management, and their unique biodiversity and structural features are in danger. Furthermore, the European Environment Agency has noted that less than 5 % of European forest areas are
    now considered to be undisturbed or natural, whereas 10 % of European forest areas have been classified as intensively managed. Forest ecosystems have to cope with multiple pressures caused by climate
    change, ranging from extreme weather patterns to pests, and with human-related activities that negatively affect ecosystems and habitats. In particular, intensively managed even-aged forests through
    clear-cutting and deadwood removal can have a severe impact on whole habitats.


    (10)


    In 2019, the Commission adopted several initiatives to address the global environmental crises, including specific actions on deforestation. In its communication of 23 July 2019 on Stepping up EU Action
    to Protect and Restore the World’s Forests (‘Communication on Stepping up EU Action to Protect and Restore the World’s Forests’), the Commission identified as a priority the reduction of the Union consumption
    footprint on land and encouraged the consumption of products from deforestation-free supply chains in the Union. In its communication of 11 December 2019 on the European Green Deal, the Commission set
    out a new growth strategy that aims to transform the Union into a fair and prosperous society, with a modern, resource-efficient and competitive economy built on sustainable and rule-based free trade,
    where there are no net emissions of greenhouse gases in 2050, where economic growth is decoupled from resource use and no person or place is left behind. It aims to protect, conserve and enhance the
    Union’s natural capital, and protect the health and well-being of citizens and future generations from environment-related risks and impacts. Furthermore, the European Green Deal aims to provide citizens
    and future generations with,

    inter alia

    , fresh air, clean water, healthy soil and biodiversity. To that end, the communication of the Commission of 20 May 2020 on a EU Biodiversity Strategy for 2030: Bringing nature back into our lives (the
    ‘EU Biodiversity Strategy for 2030’) the communication of the Commission of 20 May 2020 on a Farm to Fork Strategy for a fair, healthy and environmentally-friendly food system (the ‘Farm to Fork’ strategy),
    the communication of the Commission of 16 July 2021 on a new EU Forest Strategy for 2030, the communication of the Commission of 12 May 2021 on the Pathway to a Healthy Planet for All, EU Action Plan:
    ‘Towards Zero Pollution for Air, Water and Soil’ and other relevant strategies, such as the communication of the Commission of 30 June 2021 on a long-term Vision for the EU’s Rural Areas – Towards stronger,
    connected, resilient and prosperous rural areas by 2040, developed under the European Green Deal, further highlight the importance of action on forest protection and resilience. In particular, the EU
    Biodiversity Strategy for 2030 aims to protect nature and reverse the degradation of ecosystems. Finally, the communication of the Commission of 11 October 2018 on a sustainable Bioeconomy for Europe:
    Strengthening the connection between economy, society and the environment enhances the protection of the environment and ecosystems while addressing the growing demand for food, feed, energy, materials
    and products by seeking new ways to produce and consume.


    (11)


    Member States have repeatedly expressed their concern about persistent deforestation and forest degradation. They have emphasised that since current policies and action at global level on conservation,
    restoration and sustainable management of forests do not suffice to halt deforestation, forest degradation and biodiversity loss, enhanced Union action is needed in order to contribute more effectively
    to the achievement of the Sustainable Development Goals (SDGs) under the 2030 Agenda for Sustainable Development, which was adopted by all United Nations (UN) Member States in 2015. The Council has
    specifically supported the Commission announcement in its communication on Stepping up EU Action to Protect and Restore the World’s Forests that it would assess additional regulatory and non-regulatory
    measures and that it would present proposals for both types of measures. The Union and Member States have also endorsed the UN Decade of Action for the SDGs, the UN Decade on Ecosystem Restoration and
    the UN Decade of Family Farming.


    (12)


    The European Parliament has highlighted that ongoing destruction, degradation and conversion of the world’s forests and natural ecosystems, as well as human rights violations, are linked, to a large
    extent, to the expansion of agricultural production – in particular by converting forests to agricultural land dedicated to producing a number of high-demand commodities and products. On 22 October
    2020, the European Parliament adopted a resolution, in accordance with Article 225 of the Treaty on the Functioning of the European Union (TFEU), requesting the Commission to submit, on the basis of
    Article 192(1) TFEU, a proposal for an ‘EU legal framework to halt and reverse EU-driven global deforestation’ based on mandatory due diligence.


    (13)


    Combating deforestation and forest degradation constitutes an important part of the package of measures needed to reduce greenhouse gas emissions and to comply with the Union’s co'
- id: art-2
  title: CHAPTER 1
  text: 'CHAPTER 1


    GENERAL PROVISIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Subject matter and scope


    1.   This Regulation lays down rules regarding the placing and making available on the Union market as well as the export from the Union of relevant products, as listed in Annex I, that contain, have
    been fed with or have been made using relevant commodities, namely cattle, cocoa, coffee, oil palm, rubber, soya and wood, with a view to:


    (a)


    minimising the Union’s contribution to deforestation and forest degradation worldwide, and thereby contributing to a reduction in global deforestation;


    (b)


    reducing the Union’s contribution to greenhouse gas emissions and global biodiversity loss.


    2.   Except as provided for in Article 37(3), this Regulation does not apply to relevant products listed in Annex I produced before the date indicated in Article 38(1).'
- id: art-4
  title: Article 2
  text: 'Article 2


    Definitions


    For the purposes of this Regulation, the following definitions apply:


    (1)


    ‘relevant commodities’ means cattle, cocoa, coffee, oil palm, rubber, soya and wood;


    (2)


    ‘relevant products’ means products listed in Annex I that contain, have been fed with or have been made using relevant commodities;


    (3)


    ‘deforestation’ means the conversion of forest to agricultural use, whether human-induced or not;


    (4)


    ‘forest’ means land spanning more than 0,5 hectares with trees higher than 5 metres and a canopy cover of more than 10 %, or trees able to reach those thresholds in situ, excluding land that is predominantly
    under agricultural or urban land use;


    (5)


    ‘agricultural use’ means the use of land for the purpose of agriculture, including for agricultural plantations and set-aside agricultural areas, and for rearing livestock;


    (6)


    ‘agricultural plantation’ means land with tree stands in agricultural production systems, such as fruit tree plantations, oil palm plantations, olive orchards and agroforestry systems where crops are
    grown under tree cover; it includes all plantations of relevant commodities other than wood; agricultural plantations are excluded from the definition of ‘forest’;


    (7)


    ‘forest degradation’ means structural changes to forest cover, taking the form of the conversion of:


    (a)


    primary forests or naturally regenerating forests into plantation forests or into other wooded land; or


    (b)


    primary forests into planted forests;


    (8)


    ‘primary forest’ means naturally regenerated forest of native tree species, where there are no clearly visible indications of human activities and the ecological processes are not significantly disturbed;


    (9)


    ‘naturally regenerating forest’ means forest predominantly composed of trees established through natural regeneration; it includes any of the following:


    (a)


    forests for which it is not possible to distinguish whether planted or naturally regenerated;


    (b)


    forests with a mix of naturally regenerated native tree species and planted or seeded trees, and where the naturally regenerated trees are expected to constitute the major part of the growing stock
    at stand maturity;


    (c)


    coppice from trees originally established through natural regeneration;


    (d)


    naturally regenerated trees of introduced species;


    (10)


    ‘planted forest’ means forest predominantly composed of trees established through planting and/or deliberate seeding, provided that the planted or seeded trees are expected to constitute more than 50 %
    of the growing stock at maturity; it includes coppice from trees that were originally planted or seeded;


    (11)


    ‘plantation forest’ means a planted forest that is intensively managed and meets, at planting and stand maturity, all the following criteria: one or two species, even age class, and regular spacing;
    it includes short rotation plantations for wood, fibre and energy, and excludes forests planted for protection or ecosystem restoration, as well as forests established through planting or seeding, which
    at stand maturity resemble or will resemble naturally regenerating forests;


    (12)


    ‘other wooded land’ means land not classified as ‘forest’ spanning more than 0,5 hectares, with trees higher than 5 metres and a canopy cover of 5 to 10 %, or trees able to reach those thresholds in
    situ, or with a combined cover of shrubs, bushes and trees above 10 %, excluding land that is predominantly under agricultural or urban land use;


    (13)


    ‘deforestation-free’ means:


    (a)


    that the relevant products contain, have been fed with or have been made using, relevant commodities that were produced on land that has not been subject to deforestation after 31 December, 2020; and


    (b)


    in the case of relevant products that contain or have been made using wood, that the wood has been harvested from the forest without inducing forest degradation after 31 December, 2020;


    (14)


    ‘produced’ means grown, harvested, obtained from or raised on relevant plots of land or, as regards cattle, on establishments;


    (15)


    ‘operator’ means any natural or legal person who, in the course of a commercial activity, places relevant products on the market or exports them;


    (16)


    ‘placing on the market’ means the first making available of a relevant commodity or relevant product on the Union market;


    (17)


    ‘trader’ means any person in the supply chain other than the operator who, in the course of a commercial activity, makes relevant products available on the market;


    (18)


    ‘making available on the market’ means any supply of a relevant product for distribution, consumption or use on the Union market in the course of a commercial activity, whether in return for payment
    or free of charge;


    (19)


    ‘in the course of a commercial activity’ means for the purpose of processing, for distribution to commercial or non-commercial consumers, or for use in the business of the operator or trader itself;


    (20)


    ‘person’ means a natural person, a legal person or any association of persons which is not a legal person, but which is recognised under Union or national law as having the capacity to perform legal
    acts;


    (21)


    ‘person established in the Union’ means:


    (a)


    in the case of a natural person, any person whose place of residence is in the Union;


    (b)


    in the case of a legal person or an association of persons, any person whose registered office, central headquarters or a permanent business establishment is in the Union;


    (22)


    ‘authorised representative’ means any natural or legal person established in the Union who, in accordance with Article 6, has received a written mandate from an operator or from a trader to act on its
    behalf in relation to specified tasks with regard to the operator’s or the trader’s obligations under this Regulation;


    (23)


    ‘country of origin’ means a country or territory as referred to in Article 60 of Regulation (EU) No 952/2013;


    (24)


    ‘country of production’ means the country or territory where the relevant commodity or the relevant commodity used in the production of, or contained in, a relevant product was produced;


    (25)


    ‘non-compliant products’ means relevant products that do not comply with Article 3;


    (26)


    ‘negligible risk’ means the level of risk that applies to relevant commodities and relevant products, where, on the basis of a full assessment of product-specific and general information, and, where
    necessary, of the application of the appropriate mitigation measures, those commodities or products show no cause for concern as being not in compliance with Article 3, point (a) or (b);


    (27)


    ‘plot of land’ means land within a single real-estate property, as recognised by the law of the country of production, which enjoys sufficiently homogeneous conditions to allow an evaluation of the
    aggregate level of risk of deforestation and forest degradation associated with relevant commodities produced on that land;


    (28)


    ‘geolocation’ means the geographical location of a plot of land described by means of latitude and longitude coordinates corresponding to at least one latitude and one longitude point and using at least
    six decimal digits; for plots of land of more than four hectares used for the production of the relevant commodities other than cattle, this shall be provided using polygons with sufficient latitude
    and longitude points to describe the perimeter of each plot of land;


    (29)


    ‘establishment’ means any premises, structure, or, in the case of open-air farming, any environment or place, where livestock are kept, on a temporary or permanent basis;


    (30)


    ‘micro, small and medium-sized enterprises’ or ‘SMEs’ means micro, small and medium-sized undertakings as defined in Article 3 of Directive 2013/34/EU of the European Parliament and of the Council

    (

    19

    )

    ;


    (31)


    ‘substantiated concern’ means a duly reasoned claim based on objective and verifiable information regarding non-compliance with this Regulation and which could require the intervention of competent
    authorities;


    (32)


    ‘competent authorities’ means the authorities designated under Article 14(1);


    (33)


    ‘customs authorities’ means customs authorities as defined in Article 5, point (1), of Regulation (EU) No 952/2013;


    (34)


    ‘customs territory’ means territory as defined in Article 4 of Regulation (EU) No 952/2013;


    (35)


    ‘third country’ means a country or territory outside the customs territory of the Union;


    (36)


    ‘release for free circulation’ means the procedure laid down in Article 201 of Regulation (EU) No 952/2013;


    (37)


    ‘export’ means the procedure laid down in Article 269 of Regulation (EU) No 952/2013;


    (38)


    ‘relevant products entering the market’ means relevant products from third countries placed under the customs procedure ‘release for free circulation’ that are intended to be placed on the Union market
    and are not intended for private use or consumption within the customs territory of the Union;


    (39)


    ‘relevant products leaving the market’ means relevant products placed under the customs procedure ‘export’;


    (40)


    ‘relevant legislation of the country of production’ means the laws applicable in the country of production concerning the legal status of the area of production in terms of:


    (a)


    land use rights;


    (b)


    environmental protection;


    (c)


    forest-related rules, including forest management and biodiversity conservation, where directly related to wood harvesting;


    (d)


    third parties’ rights;


    (e)


    labour rights;


    (f)


    human rights protected under international law;


    (g)


    the principle of free, prior and informed consent (FPIC), including as set out in the UN Declaration on the Rights of Indigenous Peoples;


    (h)


    tax, anti-corruption, trade and customs regulations.'
- id: art-5
  title: Article 3
  text: 'Article 3


    Prohibition


    Relevant commodities and relevant products shall not be placed or made available on the market or exported, unless all the following conditions are fulfilled:


    (a)


    they are deforestation-free;


    (b)


    they have been produced in accordance with the relevant legislation of the country of production; and


    (c)


    they are covered by a due diligence statement.'
- id: art-6
  title: CHAPTER 2
  text: 'CHAPTER 2


    OBLIGATIONS OF OPERATORS AND TRADERS'
- id: art-7
  title: Article 4
  text: 'Article 4


    Obligations of operators


    1.   Operators shall exercise due diligence in accordance with Article 8 prior to placing relevant products on the market or exporting them in order to prove that the relevant products comply with Article
    3.


    2.   Operators shall not place relevant products on the market or export them without prior submission of a due diligence statement. Operators who, on the basis of the due diligence exercised in accordance
    with Article 8, conclude that the relevant products comply with Article 3 shall, before placing the relevant products on the market or exporting them, make available a due diligence statement to the
    competent authorities through the information system referred to in Article 33. Such electronically available and transmittable due diligence statement shall contain the information set out in Annex
    II for the relevant products and a declaration by the operator that the operator exercised due diligence and that no or only a negligible risk was found.


    3.   By making available the due diligence statement to competent authorities, the operator shall assume responsibility for the compliance of the relevant product with Article 3. Operators shall keep
    a record of the due diligence statements for five years from the date the statement is submitted through the information system referred to in Article 33.


    4.   Operators shall not place relevant products on the market or export them where one or more of the following cases apply:


    (a)


    the relevant products are non-compliant;


    (b)


    the exercise of due diligence has revealed a non-negligible risk that the relevant products are non-compliant;


    (c)


    the operator was unable to fulfil the obligations referred to in paragraphs 1 and 2.


    5.   Operators that obtain or are made aware of relevant new information, including substantiated concerns, indicating that a relevant product that they have placed on the market is at risk of not complying
    with this Regulation shall immediately inform the competent authorities of the Member States in which they placed the relevant product on the market, as well as traders to whom they supplied the relevant
    product. In the case of exports, the operators shall inform the competent authority of the Member State which is the country of production.


    6.   Operators shall offer all necessary assistance to the competent authorities to facilitate the carrying out of the checks under Article 18, including access to premises and the making available
    of documentation and records.


    7.   Operators shall communicate to operators and to traders further down the supply chain of the relevant products they placed on the market or exported all information necessary to demonstrate that
    due diligence was exercised and that no or only a negligible risk was found, including the reference numbers of the due diligence statements associated to those products.


    8.   By way of derogation from paragraph 1 of this Article, operators that are SMEs (‘SME operators’) shall not be required to exercise due diligence for relevant products contained in or made from
    relevant products that have already been subject to due diligence in accordance with paragraph 1 of this Article and for which a due diligence statement has already been submitted in accordance with
    Article 33. In such cases, SME operators shall provide the competent authorities with the reference number of the due diligence statement upon request. For parts of relevant products that have not been
    subject to due diligence, the SME operators shall exercise due diligence in accordance with paragraph 1 of this Article.


    9.   Operators that are not SMEs (‘non-SME operators’) may refer to due diligence statements that have already been submitted in accordance with Article 33 only after having ascertained that the due
    diligence relating to the relevant products contained in or made from the relevant products was exercised in accordance with paragraph 1 of this Article. They shall include the reference numbers of
    such due diligence statements that have already been submitted in accordance with Article 33 in the due diligence statements that they submit under paragraph 2 of this Article. For parts of relevant
    products that have not been subject to due diligence, non-SME operators shall exercise due diligence in accordance with paragraph 1 of this Article.


    10.   Any operator referring to a due diligence statement that has already been submitted in accordance with Article 33 shall retain responsibility for the compliance of the relevant products with Article
    3, including that no or only a negligible risk was found, prior to placing such relevant products on the market or exporting them.'
- id: art-8
  title: Article 5
  text: 'Article 5


    Obligations of traders


    1.   Traders that are not SMEs (‘non-SME traders’) shall be considered as non-SME operators and shall be subject to obligations and provisions in Articles 3, 4 and 6, Articles 8 to 13, Article 16(8)
    to (11) and Article 18 with regard to the relevant commodities and relevant products that they make available on the market.


    2.   Traders that are SMEs (‘SME traders’) shall make available relevant products on the market only if they are in possession of the information required under paragraph 3.


    3.   SME traders shall collect and keep the following information relating to the relevant products they intend to make available on the market:


    (a)


    the name, registered trade name or registered trade mark, the postal address, the email address and, if available, a web address of the operators or the traders who have supplied the relevant products
    to them, as well as the reference numbers of the due diligence statements associated to those products;


    (b)


    the name, registered trade name or registered trade mark, the postal address, the email address and, if available, a web address of the operators or the traders to whom they have supplied the relevant
    products.


    4.   SME traders shall keep the information referred to in paragraph 3 for at least five years from the date of the making available on the market and shall provide that information to the competent
    authorities upon request.


    5.   SME traders that obtain or are made aware of relevant new information, including substantiated concerns, indicating that a relevant product that they have made available on the market is at risk
    of not complying with this Regulation shall immediately inform the competent authorities of the Member States in which they made the relevant product available on the market as well as traders to whom
    they supplied the relevant product.


    6.   Traders, whether or not they are SMEs, shall offer all necessary assistance to the competent authorities to facilitate the carrying out of the checks under Articles 18 and 19, including access
    to premises and the making available of documentation and records.'
- id: art-9
  title: Article 6
  text: 'Article 6


    Authorised representatives


    1.   Operators or traders may mandate an authorised representative to submit the due diligence statement pursuant to Article 4(2) on their behalf. In such cases, the operator or trader shall retain
    responsibility for the compliance of the relevant product with Article 3.


    2.   The authorised representative shall, upon request, provide a copy of the mandate in an official language of the Union to the competent authorities and a copy in an official language of the Member
    State in which the due diligence statement is handled or, where that is not possible, in English.


    3.   An operator that is a natural person or a microenterprise may mandate the next operator or trader further down the supply chain that is not a natural person or a microenterprise to act as an authorised
    representative. Such next operator or trader further down the supply chain shall not place or make available relevant products on the market or export them without submitting the due diligence statement
    pursuant to Article 4(2) on behalf of that operator. In such cases, the operator that is a natural person or a microenterprise shall retain responsibility for compliance of the relevant product with
    Article 3, and shall communicate to that next operator or trader further down the supply chain all information necessary to confirm that due diligence was exercised and that no or only a negligible
    risk was found.'
- id: art-10
  title: Article 7
  text: 'Article 7


    Placing on the market by operators established in third countries


    Where a natural or legal person established outside the Union places relevant products on the market, the first natural or legal person established in the Union who makes such relevant products available
    on the market shall be deemed to be an operator within the meaning of this Regulation.'
- id: art-11
  title: Article 8
  text: 'Article 8


    Due diligence


    1.   Prior to placing relevant products on the market or exporting them, operators shall exercise due diligence with regard to all relevant products supplied by each particular supplier.


    2.   The due diligence shall include:


    (a)


    the collection of information, data and documents needed to fulfil the requirements set out in Article 9;


    (b)


    risk assessment measures as referred to in Articl'
