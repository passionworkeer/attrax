- id: art-2
  title: CHAPTER I
  text: 'CHAPTER I


    GENERAL PROVISIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Subject matter


    This Regulation lays down:


    (a)


    rules for the making available on the market of products with digital elements to ensure the cybersecurity of such products;


    (b)


    essential cybersecurity requirements for the design, development and production of products with digital elements, and obligations for economic operators in relation to those products with respect to
    cybersecurity;


    (c)


    essential cybersecurity requirements for the vulnerability handling processes put in place by manufacturers to ensure the cybersecurity of products with digital elements during the time the products
    are expected to be in use, and obligations for economic operators in relation to those processes;


    (d)


    rules on market surveillance, including monitoring, and enforcement of the rules and requirements referred to in this Article.'
- id: art-4
  title: Article 2
  text: 'Article 2


    Scope


    1.   This Regulation applies to products with digital elements made available on the market, the intended purpose or reasonably foreseeable use of which includes a direct or indirect logical or physical
    data connection to a device or network.


    2.   This Regulation does not apply to products with digital elements to which the following Union legal acts apply:


    (a)


    Regulation (EU) 2017/745;


    (b)


    Regulation (EU) 2017/746;


    (c)


    Regulation (EU) 2019/2144.


    3.   This Regulation does not apply to products with digital elements that have been certified in accordance with Regulation (EU) 2018/1139.


    4.   This Regulation does not apply to equipment that falls within the scope of Directive 2014/90/EU of the European Parliament and of the Council

    (

    36

    )

    .


    5.   The application of this Regulation to products with digital elements covered by other Union rules laying down requirements that address all or some of the risks covered by the essential cybersecurity
    requirements set out in Annex I may be limited or excluded where:


    (a)


    such limitation or exclusion is consistent with the overall regulatory framework that applies to those products; and


    (b)


    the sectoral rules achieve the same or a higher level of protection as that provided for by this Regulation.


    The Commission is empowered to adopt delegated acts in accordance with Article 61 to supplement this Regulation by specifying whether such limitation or exclusion is necessary, the products and rules
    concerned, as well as the scope of the limitation, if relevant.


    6.   This Regulation does not apply to spare parts that are made available on the market to replace identical components in products with digital elements and that are manufactured according to the
    same specifications as the components that they are intended to replace.


    7.   This Regulation does not apply to products with digital elements developed or modified exclusively for national security or defence purposes or to products specifically designed to process classified
    information.


    8.   The obligations laid down in this Regulation shall not entail the supply of information the disclosure of which would be contrary to the essential interests of Member States’ national security,
    public security or defence.'
- id: art-5
  title: Article 3
  text: 'Article 3


    Definitions


    For the purposes of this Regulation, the following definitions apply:


    (1)


    ‘product with digital elements’ means a software or hardware product and its remote data processing solutions, including software or hardware components being placed on the market separately;


    (2)


    ‘remote data processing’ means data processing at a distance for which the software is designed and developed by the manufacturer, or under the responsibility of the manufacturer, and the absence of
    which would prevent the product with digital elements from performing one of its functions;


    (3)


    ‘cybersecurity’ means cybersecurity as defined in Article 2, point (1), of Regulation (EU) 2019/881;


    (4)


    ‘software’ means the part of an electronic information system which consists of computer code;


    (5)


    ‘hardware’ means a physical electronic information system, or parts thereof capable of processing, storing or transmitting digital data;


    (6)


    ‘component’ means software or hardware intended for integration into an electronic information system;


    (7)


    ‘electronic information system’ means a system, including electrical or electronic equipment, capable of processing, storing or transmitting digital data;


    (8)


    ‘logical connection’ means a virtual representation of a data connection implemented through a software interface;


    (9)


    ‘physical connection’ means a connection between electronic information systems or components implemented using physical means, including through electrical, optical or mechanical interfaces, wires
    or radio waves;


    (10)


    ‘indirect connection’ means a connection to a device or network, which does not take place directly but rather as part of a larger system that is directly connectable to such device or network;


    (11)


    ‘end-point’ means any device that is connected to a network and serves as an entry point to that network;


    (12)


    ‘economic operator’ means the manufacturer, the authorised representative, the importer, the distributor, or other natural or legal person who is subject to obligations in relation to the manufacture
    of products with digital elements or to the making available of products with digital elements on the market in accordance with this Regulation;


    (13)


    ‘manufacturer’ means a natural or legal person who develops or manufactures products with digital elements or has products with digital elements designed, developed or manufactured, and markets them
    under its name or trademark, whether for payment, monetisation or free of charge;


    (14)


    ‘open-source software steward’ means a legal person, other than a manufacturer, that has the purpose or objective of systematically providing support on a sustained basis for the development of specific
    products with digital elements, qualifying as free and open-source software and intended for commercial activities, and that ensures the viability of those products;


    (15)


    ‘authorised representative’ means a natural or legal person established within the Union who has received a written mandate from a manufacturer to act on its behalf in relation to specified tasks;


    (16)


    ‘importer’ means a natural or legal person established in the Union who places on the market a product with digital elements that bears the name or trademark of a natural or legal person established
    outside the Union;


    (17)


    ‘distributor’ means a natural or legal person in the supply chain, other than the manufacturer or the importer, that makes a product with digital elements available on the Union market without affecting
    its properties;


    (18)


    ‘consumer’ means a natural person who acts for purposes which are outside that person’s trade, business, craft or profession;


    (19)


    ‘microenterprises’, ‘small enterprises’ and ‘medium-sized enterprises’ mean, respectively, microenterprises, small enterprises and medium-sized enterprises as defined in the Annex to Recommendation
    2003/361/EC;


    (20)


    ‘support period’ means the period during which a manufacturer is required to ensure that vulnerabilities of a product with digital elements are handled effectively and in accordance with the essential
    cybersecurity requirements set out in Part II of Annex I;


    (21)


    ‘placing on the market’ means the first making available of a product with digital elements on the Union market;


    (22)


    ‘making available on the market’ means the supply of a product with digital elements for distribution or use on the Union market in the course of a commercial activity, whether in return for payment
    or free of charge;


    (23)


    ‘intended purpose’ means the use for which a product with digital elements is intended by the manufacturer, including the specific context and conditions of use, as specified in the information supplied
    by the manufacturer in the instructions for use, promotional or sales materials and statements, as well as in the technical documentation;


    (24)


    ‘reasonably foreseeable use’ means use that is not necessarily the intended purpose supplied by the manufacturer in the instructions for use, promotional or sales materials and statements, as well as
    in the technical documentation, but which is likely to result from reasonably foreseeable human behaviour or technical operations or interactions;


    (25)


    ‘reasonably foreseeable misuse’ means the use of a product with digital elements in a way that is not in accordance with its intended purpose, but which may result from reasonably foreseeable human
    behaviour or interaction with other systems;


    (26)


    ‘notifying authority’ means the national authority responsible for setting up and carrying out the necessary procedures for the assessment, designation and notification of conformity assessment bodies
    and for their monitoring;


    (27)


    ‘conformity assessment’ means the process of verifying whether the essential cybersecurity requirements set out in Annex I have been fulfilled;


    (28)


    ‘conformity assessment body’ means a conformity assessment body as defined in Article 2, point (13), of Regulation (EC) No 765/2008;


    (29)


    ‘notified body’ means a conformity assessment body designated in accordance with Article 43 and other relevant Union harmonisation legislation;


    (30)


    ‘substantial modification’ means a change to the product with digital elements following its placing on the market, which affects the compliance of the product with digital elements with the essential
    cybersecurity requirements set out in Part I of Annex I or which results in a modification to the intended purpose for which the product with digital elements has been assessed;


    (31)


    ‘CE marking’ means a marking by which a manufacturer indicates that a product with digital elements and the processes put in place by the manufacturer are in conformity with the essential cybersecurity
    requirements set out in Annex I and other applicable Union harmonisation legislation providing for its affixing;


    (32)


    ‘Union harmonisation legislation’ means Union legislation listed in Annex I to Regulation (EU) 2019/1020 and any other Union legislation harmonising the conditions for the marketing of products to which
    that Regulation applies;


    (33)


    ‘market surveillance authority’ means a market surveillance authority as defined in Article 3, point (4), of Regulation (EU) 2019/1020;


    (34)


    ‘international standard’ means an international standard as defined in Article 2, point (1)(a), of Regulation (EU) No 1025/2012;


    (35)


    ‘European standard’ means a European standard as defined in Article 2, point (1)(b), of Regulation (EU) No 1025/2012;


    (36)


    ‘harmonised standard’ means a harmonised standard as defined in Article 2, point (1)(c), of Regulation (EU) No 1025/2012;


    (37)


    ‘cybersecurity risk’ means the potential for loss or disruption caused by an incident and is to be expressed as a combination of the magnitude of such loss or disruption and the likelihood of occurrence
    of the incident;


    (38)


    ‘significant cybersecurity risk’ means a cybersecurity risk which, based on its technical characteristics, can be assumed to have a high likelihood of an incident that could lead to a severe negative
    impact, including by causing considerable material or non-material loss or disruption;


    (39)


    ‘software bill of materials’ means a formal record containing details and supply chain relationships of components included in the software elements of a product with digital elements;


    (40)


    ‘vulnerability’ means a weakness, susceptibility or flaw of a product with digital elements that can be exploited by a cyber threat;


    (41)


    ‘exploitable vulnerability’ means a vulnerability that has the potential to be effectively used by an adversary under practical operational conditions;


    (42)


    ‘actively exploited vulnerability’ means a vulnerability for which there is reliable evidence that a malicious actor has exploited it in a system without permission of the system owner;


    (43)


    ‘incident’ means an incident as defined in Article 6, point (6), of Directive (EU) 2022/2555;


    (44)


    ‘incident having an impact on the security of the product with digital elements’ means an incident that negatively affects or is capable of negatively affecting the ability of a product with digital
    elements to protect the availability, authenticity, integrity or confidentiality of data or functions;


    (45)


    ‘near miss’ means a near miss as defined in Article 6, point (5), of Directive (EU) 2022/2555;


    (46)


    ‘cyber threat’ means a cyber threat as defined in Article 2, point (8), of Regulation (EU) 2019/881;


    (47)


    ‘personal data’ means personal data as defined in Article 4, point (1), of Regulation (EU) 2016/679;


    (48)


    ‘free and open-source software’ means software the source code of which is openly shared and which is made available under a free and open-source licence which provides for all rights to make it freely
    accessible, usable, modifiable and redistributable;


    (49)


    ‘recall’ means recall as defined in Article 3, point (22), of Regulation (EU) 2019/1020;


    (50)


    ‘withdrawal’ means withdrawal as defined in Article 3, point (23), of Regulation (EU) 2019/1020;


    (51)


    ‘CSIRT designated as coordinator’ means a CSIRT designated as coordinator pursuant to Article 12(1) of Directive (EU) 2022/2555.'
- id: art-6
  title: Article 4
  text: 'Article 4


    Free movement


    1.   Member States shall not impede, for the matters covered by this Regulation, the making available on the market of products with digital elements which comply with this Regulation.


    2.   At trade fairs, exhibitions, demonstrations or similar events, Member States shall not prevent the presentation or use of a product with digital elements which does not comply with this Regulation,
    including its prototypes, provided that the product is presented with a visible sign clearly indicating that it does not comply with this Regulation and that it is not to be made available on the market
    until it does so.


    3.   Member States shall not prevent the making available on the market of unfinished software which does not comply with this Regulation, provided that the software is made available only for a limited
    period required for testing purposes with a visible sign clearly indicating that it does not comply with this Regulation and that it will not be available on the market for purposes other than testing.


    4.   Paragraph 3 does not apply to safety components as referred to in Union harmonisation legislation other than this Regulation.'
- id: art-7
  title: Article 5
  text: 'Article 5


    Procurement or use of products with digital elements


    1.   This Regulation shall not prevent Member States from subjecting products with digital elements to additional cybersecurity requirements for the procurement or use of those products for specific
    purposes, including where those products are procured or used for national security or defence purposes, provided that such requirements are consistent with Member States’ obligations laid down in Union
    law and that they are necessary and proportionate for the achievement of those purposes.


    2.   Without prejudice to Directives 2014/24/EU and 2014/25/EU, where products with digital elements that fall within the scope of this Regulation are procured, Member States shall ensure that compliance
    with the essential cybersecurity requirements set out in Annex I to this Regulation, including the manufacturers’ ability to handle vulnerabilities effectively, are taken into consideration in the procurement
    process.'
- id: art-8
  title: Article 6
  text: 'Article 6


    Requirements for products with digital elements


    Products with digital elements shall be made available on the market only where:


    (a)


    they meet the essential cybersecurity requirements set out in Part I of Annex I, provided that they are properly installed, maintained, used for their intended purpose or under conditions which can
    reasonably be foreseen, and, where applicable, the necessary security updates have been installed; and


    (b)


    the processes put in place by the manufacturer comply with the essential cybersecurity requirements set out in Part II of Annex I.'
- id: art-9
  title: Article 7
  text: 'Article 7


    Important products with digital elements


    1.   Products with digital elements which have the core functionality of a product category set out in Annex III shall be considered to be important products with digital elements and shall be subject
    to the conformity assessment procedures referred to in Article 32(2) and (3). The integration of a product with digital elements which has the core functionality of a product category set out in Annex III
    shall not in itself render the product in which it is integrated subject to the conformity assessment procedures referred to in Article 32(2) and (3).


    2.   The categories of products with digital elements referred to in paragraph 1 of this Article, divided into classes I and II as set out in Annex III, meet at least one of the following criteria:


    (a)


    the product with digital elements primarily performs functions critical to the cybersecurity of other products, networks or services, including securing authentication and access, intrusion prevention
    and detection, end-point security or network protection;


    (b)


    the product with digital elements performs a function which carries a significant risk of adverse effects in terms of its intensity and ability to disrupt, control or cause damage to a large number
    of other products or to the health, security or safety of its users through direct manipulation, such as a central system function, including network management, configuration control, virtualisation
    or processing of personal data.


    3.   The Commission is empowered to adopt delegated acts in accordance with Article 61 to amend Annex III by including in the list a new category within each class of the categories of products with
    digital elements and specifying its definition, moving a category of products from one class to the other or withdrawing an existing category from that list. When assessing the need to amend the list
    set out in Annex III, the Commission shall take into account the cybersecurity-related functionalities or the function and the level of cybersecurity risk posed by the products with digital elements
    as set out by the criteria referred to in paragraph 2 of this Article.


    The delegated acts referred to in the first subparagraph of this paragraph shall, where appropriate, provide for a minimum transitional period of 12 months, in particular where a new category of important
    products with digital elements is added to class I or II or is moved from class I to II as set out in Annex III, before the relevant conformity assessment procedures as referred to in Article 32(2)
    and (3) start applying, unless a shorter transitional period is justified on imperative grounds of urgency.


    4.   By 11 December 2025, the Commission shall adopt an implementing act specifying the technical description of the categories of products with digital elements under classes I and II as set out in
    Annex III and the technical description of the categories of products with digital elements as set out in Annex IV. That implementing act shall be adopted in accordance with the examination procedure
    referred to in Article 62(2).'
- id: art-10
  title: Article 8
  text: 'Article 8


    Critical products with digital elements


    1.   The Commission is empowered to adopt delegated acts in accordance with Article 61 to supplement this Regulation to determine which products with digital elements that have the core functionality
    of a product category that is set out in Annex IV to this Regulation are to be required to obtain a European cybersecurity certificate at assurance level at least ‘substantial’ under a European cybersecurity
    certification scheme adopted pursuant to Regulation (EU) 2019/881, to demonstrate conformity with the essential cybersecurity requirements set out in Annex I to this Regulation or parts thereof, provided
    that a European cybersecurity certification scheme covering those categories of products with digital elements has been adopted pursuant to Regulation (EU) 2019/881 and is available to manufacturers.
