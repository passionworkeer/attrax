  text: 'L_2023165EN.01000101.xml


    29.6.2023


    EN


    Official Journal of the European Union


    L 165/1


    REGULATION (EU) 2023/1230 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 14 June 2023



    on machinery and repealing Directive 2006/42/EC of the European Parliament and of the Council and Council Directive 73/361/EEC


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 114 thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    Directive 2006/42/EC of the European Parliament and of the Council

    (

    3

    )

    was adopted in the context of establishing the internal market, in order to harmonise health and safety requirements for machinery in all Member States and to remove obstacles to trade in machinery
    between Member States.


    (2)


    The machinery sector is an important part of the engineering industry and is one of the industrial mainstays of the Union economy. The social cost of the large number of accidents caused directly by
    the use of machinery can be reduced by inherently safe design and construction of machinery and by proper installation and maintenance.


    (3)


    Experience with the application of Directive 2006/42/EC has shown inadequacies and inconsistencies in the product coverage and conformity assessment procedures. It is therefore necessary to improve,
    simplify and adapt the provisions set out in that Directive to the needs of the market and provide clear rules in relation to the framework within which products within the scope of this Regulation
    may be made available on the market.


    (4)


    Since the rules setting out the requirements for products within the scope of this Regulation, in particular the essential health and safety requirements and the conformity assessment procedures, need
    to be of uniform application for all operators across the Union, and not give room for divergent implementation by Member States, Directive 2006/42/EC should be replaced by a regulation.


    (5)


    Member States are responsible for protecting, on their territory, the health and safety of persons, in particular workers and consumers, and, where appropriate, domestic animals and property, and, where
    applicable, for protecting the environment, notably in relation to the risks arising out of the intended use or any reasonably foreseeable misuse of machinery or related products. For the avoidance
    of doubt, domestic animals should be considered to include farm animals.


    (6)


    Regulation (EC) No 765/2008 of the European Parliament and of the Council

    (

    4

    )

    lays down rules on the accreditation of conformity assessment bodies, and the general principles of the CE marking. That Regulation should be applicable to products within the scope of this Regulation
    in order to ensure that those products, which are benefiting from the free movement of goods within the Union, fulfil requirements providing for a high level of protection of public interests such as
    the protection of the health and safety of persons and, where appropriate, domestic animals and property, and, where applicable, of the environment.


    (7)


    Regulation (EU) 2019/1020 of the European Parliament and of the Council

    (

    5

    )

    sets out rules on market surveillance and control of products entering the Union market. As Directive 2006/42/EC is listed in Annex I of Regulation (EU) 2019/1020, that Regulation already applies to
    products within the scope of this Regulation. However, Regulation (EU) 2019/1020 applies to products within the scope of this Regulation insofar as there are no specific provisions with the same objective,
    which regulate in a more specific manner particular aspects of market surveillance and enforcement.


    (8)


    Regulation (EU) 2019/1020 lays down the tasks of economic operators regarding products subject to certain Union harmonisation legislation. It also provides that such products are to be placed on the
    market only if there is an economic operator established in the Union who is responsible for those tasks. That Union harmonisation legislation includes Directive 2006/42/EC. As a result, products within
    the scope of this Regulation are to be placed on the market only if there is an economic operator established in the Union who is responsible for the tasks set out in Regulation (EU) 2019/1020 in respect
    of those products.


    (9)


    Decision No 768/2008/EC of the European Parliament and of the Council

    (

    6

    )

    lays down common principles and reference provisions intended to apply across sectoral legislation. In order to ensure consistency with other sectoral product legislation, it is appropriate to align
    certain provisions of this Regulation to that Decision, insofar as sectoral specificities do not require a different solution. Therefore, certain definitions, the general obligations of economic operators,
    the rules on presumption of conformity, the rules on EU declaration of conformity, the rules on CE marking, the requirements for conformity assessment bodies, the rules on notification procedures and
    conformity assessment procedures and the rules on procedures to deal with machinery or related products, and, where applicable, with partly completed machinery, presenting a risk should be adapted to
    the reference provisions laid down in that Decision.


    (10)


    This Regulation should cover products which are new to the Union market when placed on the market, and are either new products made by a manufacturer established in the Union or products, whether new
    or second-hand, imported from a third country.


    (11)


    Where there is a possibility that machinery or related products will be used by a consumer, that is to say, a non-professional user, the manufacturer should take account of the fact that the consumer
    does not have the same knowledge of and experience in handling machinery or related products in the design and construction of the products. The same applies where the machinery or related product is
    normally used to provide a service to a consumer.


    (12)


    Recently, more advanced machinery, which is less dependent on human operators, has been introduced on the market. Such machinery is working on defined tasks and in structured environments, yet it can
    learn to perform new actions in this context and become more autonomous. Further refinements to machinery, already in place or to be expected, include real-time processing of information, problem solving,
    mobility, sensor systems, learning, adaptability, and capability of operating in unstructured environments (for example construction sites). The Commission Report on the safety and liability implications
    of Artificial Intelligence, the Internet of Things and Robotics of 19 February 2020, states that the emergence of new digital technologies, like artificial intelligence, the Internet of things and robotics,
    raises new challenges in terms of product safety. The report concludes that the current product safety legislation, including Directive 2006/42/EC, contains a number of gaps in this respect that need
    to be addressed. Thus, this Regulation should cover the safety risks stemming from new digital technologies.


    (13)


    In order to ensure protection of the health and safety of persons, and, where appropriate, domestic animals and property, and, where applicable, of the environment, this Regulation should apply to all
    forms of supply of products within the scope of this Regulation, including distance selling as referred to in Regulation (EU) 2019/1020.


    (14)


    In order to ensure legal certainty, the scope of this Regulation should be set out in a clear manner and the concepts relating to its application should be defined as precisely as possible.


    (15)


    In order to ensure that the scope of this Regulation is sufficiently clear, a distinction should be made between machinery, related products and partly completed machinery. Moreover, related products
    should be understood as comprising interchangeable equipment, safety components, lifting accessories, chains, ropes and webbing, and removable mechanical transmission devices, which are all products
    within the scope of this Regulation.


    (16)


    In order to avoid legislating twice on the same product, it is appropriate to exclude from the scope of this Regulation weapons, including firearms, that are subject to Directive (EU) 2021/555 of the
    European Parliament and of the Council

    (

    7

    )

    .


    (17)


    The purpose of this Regulation is to address the risks stemming from machinery function and not from the transport of goods, persons or animals. Consequently, this Regulation should not apply to means
    of transport by air, on water and on rail networks although it should still apply to the machinery mounted on those means of transport. Means of transport by road that are not yet covered by a specific
    Union legal act should be regulated by this Regulation except in respect of risks that might arise from circulation on public roads. This means that vehicles, including e-bikes, e-scooters and other
    personal mobility devices that are not subject to EU type approval under Regulation (EU) No 167/2013 of the European Parliament and of the Council

    (

    8

    )

    or Regulation (EU) No 168/2013 of the European Parliament and of the Council

    (

    9

    )

    or approval under Regulation (EU) 2018/858 of the European Parliament and of the Council

    (

    10

    )

    are covered by this Regulation.


    (18)


    Household appliances intended for domestic use which are not electrically operated furniture, audio and video equipment, information technology equipment, office machinery, low-voltage switchgear and
    control gear and electric motors fall within the scope of Directive 2014/35/EU of the European Parliament and of the Council

    (

    11

    )

    and should therefore be excluded from the scope of this Regulation. Some of those products, for example washing machines, are progressively incorporating Wi-Fi functions and are therefore covered by
    Directive 2014/53/EU of the European Parliament and of the Council

    (

    12

    )

    as radio equipment. Those products should also be excluded from the scope of this Regulation.


    (19)


    The evolution of the machinery sector has resulted in the growing use of digital means and software plays a more and more important role in machinery design. Consequently, the definition of machinery
    should be adapted. In this respect, machinery missing only the upload of software intended for the specific application foreseen by the manufacturer, and which is the subject of the conformity assessment
    procedure of the machinery, should fall under the definition of machinery and not under the definitions of related products or partly completed machinery. Furthermore, the definition of safety components
    should cover not only physical devices but also digital devices. In order to take into account the increasing use of software as a safety component, software that performs a safety function and which
    is placed independently on the market should be considered a safety component.


    (20)


    Considering their critical protective function, certain components included in the indicative list of safety components in Annex II should also be subject to specific conformity assessment procedures
    and included in Annex I.


    (21)


    Partly completed machinery is a product within the scope of this Regulation which needs to undergo further construction in order to be able to perform its specific application, namely the well-defined
    operations for which the product is designed. It is not necessary that all requirements of this Regulation apply to partly completed machinery but, in order to ensure the safety of the product as a
    whole, it is nevertheless important that the free movement of such partly completed machinery be guaranteed by means of a specific procedure.


