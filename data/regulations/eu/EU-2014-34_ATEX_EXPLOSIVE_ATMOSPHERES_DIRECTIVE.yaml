  text: 'L_2014096EN.01030901.xml


    29.3.2014


    EN


    Official Journal of the European Union


    L 96/309


    DIRECTIVE 2014/34/EU OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 26 February 2014



    on the harmonisation of the laws of the Member States relating to equipment and protective systems intended for use in potentially explosive atmospheres (recast)


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 114 thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    Directive 94/9/EC of the European Parliament and of the Council of 23 March 1994 on the approximation of the laws of the Member States concerning equipment and protective systems intended for use in
    potentially explosive atmospheres

    (

    3

    )

    has been substantially amended

    (

    4

    )

    . Since further amendments are to be made, that Directive should be recast in the interests of clarity.


    (2)


    Regulation (EC) No 765/2008 of the European Parliament and of the Council of 9 July 2008 setting out the requirements for accreditation and market surveillance relating to the marketing of products

    (

    5

    )

    lays down rules on the accreditation of conformity assessment bodies, provides a framework for the market surveillance of products and for controls on products from third countries, and lays down the
    general principles of the CE marking.


    (3)


    Decision No 768/2008/EC of the European Parliament and of the Council of 9 July 2008 on a common framework for the marketing of products

    (

    6

    )

    lays down common principles and reference provisions intended to apply across sectoral legislation in order to provide a coherent basis for revision or recasts of that legislation. Directive 94/9/EC
    should be adapted to that Decision.


    (4)


    This Directive covers products which are new to the Union market when they are placed on the market; that is to say they are either new products made by a manufacturer established in the Union or products,
    whether new or second-hand, imported from a third country.


    (5)


    This Directive should apply to all forms of supply, including distance selling.


    (6)


    It is the duty of Member States to protect, on their territory, the health and safety of persons, especially workers, and, where appropriate, domestic animals and property, especially against the hazards
    resulting from the use of equipment and systems providing protection against potentially explosive atmospheres.


    (7)


    Directive 94/9/EC has made positive steps towards effective protection against explosion hazards for both mining and surface equipment. Those two groups of equipment are used in a large number of commercial
    and industrial sectors and possess considerable economic significance.


    (8)


    Compliance with the health and safety requirements is essential in order to ensure the safety of equipment and protective systems. Those requirements should be subdivided into general and additional
    requirements which need to be met by equipment and protective systems. In particular, the additional requirements should take account of existing or potential hazards. Equipment and protective systems
    should, therefore, meet at least one of those requirements where this is necessary for their proper functioning or is to apply to their intended use. The notion of intended use is of prime importance
    for the explosion-proofing of equipment and protective systems. It is essential that manufacturers supply full information. Specific, clear marking of equipment and protective systems, stating their
    use in a potentially explosive atmosphere, should also be necessary.


    (9)


    Compliance with the essential health and safety requirements laid down in this Directive should be imperative in order to ensure the safety of equipment and protective systems. For the implementation
    of those requirements, both the technology obtained at the time of manufacture and overriding technical and economic requirements should be taken into account.


    (10)


    Economic operators should be responsible for the compliance of products with this Directive, in relation to their respective roles in the supply chain, so as to ensure a high level of protection of
    health and safety of persons, especially workers, and, where appropriate, protection of domestic animals and property, and to guarantee fair competition on the Union market.


    (11)


    All economic operators intervening in the supply and distribution chain should take appropriate measures to ensure that they only make available on the market products which are in conformity with this
    Directive. It is necessary to provide for a clear and proportionate distribution of obligations which correspond to the role of each economic operator in the supply and distribution chain.


    (12)


    In order to facilitate communication between economic operators, market surveillance authorities and consumers, Member States should encourage economic operators to include a website address in addition
    to the postal address.


    (13)


    The manufacturer, having detailed knowledge of the design and production process, is best placed to carry out the conformity assessment procedure. Conformity assessment should therefore remain solely
    the obligation of the manufacturer.


    (14)


    It is necessary to ensure that products from third countries entering the Union market comply with this Directive, and in particular that appropriate conformity assessment procedures have been carried
    out by manufacturers with regard to those products. Provision should therefore be made for importers to make sure that the products they place on the market comply with the requirements of this Directive
    and that they do not place on the market products which do not comply with such requirements or present a risk. Provision should also be made for importers to make sure that conformity assessment procedures
    have been carried out and that product marking and documentation drawn up by manufacturers are available for inspection by the competent national authorities.


    (15)


    When placing a product on the market, every importer should indicate on the product his name, registered trade name or registered trade mark and the postal address at which he can be contacted. Exceptions
    should be provided for in cases where the size or nature of the product does not allow it. This includes cases where the importer would have to open the packaging to put his name and address on the
    product.


    (16)


    The distributor makes a product available on the market after it has been placed on the market by the manufacturer or the importer and should act with due care to ensure that its handling of the product
    does not adversely affect the compliance of the product.


    (17)


    Any economic operator that either places a product on the market under his own name or trade mark or modifies a product in such a way that compliance with this Directive may be affected should be considered
    to be the manufacturer and should assume the obligations of the manufacturer.


    (18)


    Distributors and importers, being close to the market place, should be involved in market surveillance tasks carried out by the competent national authorities, and should be prepared to participate
    actively, providing those authorities with all necessary information relating to the product concerned.


    (19)


    Ensuring traceability of a product throughout the whole supply chain helps to make market surveillance simpler and more efficient. An efficient traceability system facilitates the market surveillance
    authorities’ task of tracing economic operators who made non-compliant products available on the market. When keeping the information required under this Directive for the identification of other economic
    operators, economic operators should not be required to update such information in respect of other economic operators who have either supplied them with a product or to whom they have supplied a product.


    (20)


    This Directive should be limited to the expression of the essential health and safety requirements. In order to facilitate conformity assessment with those requirements it is necessary to provide for
    a presumption of conformity for products which are in conformity with harmonised standards that are adopted in accordance with Regulation (EU) No 1025/2012 of the European Parliament and of the Council
    of 25 October 2012 on European Standardisation

    (

    7

    )

    for the purpose of expressing detailed technical specifications of those requirements.


    (21)


    Regulation (EU) No 1025/2012 provides for a procedure for objections to harmonised standards where those standards do not entirely satisfy the requirements of this Directive.


    (22)


    In order to enable economic operators to demonstrate and the competent authorities to ensure that products made available on the market conform to the essential health and safety requirements it is
    necessary to provide for conformity assessment procedures. Decision No 768/2008/EC establishes modules for conformity assessment procedures, which include procedures from the least to the most stringent,
    in proportion to the level of risk involved and the level of safety required. In order to ensure inter-sectoral coherence and to avoid ad-hoc variants, conformity assessment procedures should be chosen
    from among those modules.


    (23)


    Manufacturers should draw up an EU declaration of conformity to provide information required under this Directive on the conformity of a product with the requirements of this Directive and of other
    relevant Union harmonisation legislation.


    (24)


    To ensure effective access to information for market surveillance purposes, the information required to identify all applicable Union acts should be available in a single EU declaration of conformity.
    In order to reduce the administrative burden on economic operators, that single EU declaration of conformity may be a dossier made up of relevant individual declarations of conformity.


    (25)


    The CE marking, indicating the conformity of a product, is the visible consequence of a whole process comprising conformity assessment in a broad sense. General principles governing the CE marking are
    set out in Regulation (EC) No 765/2008. Rules governing the affixing of the CE marking should be laid down in this Directive.


    (26)


    Certain conformity assessment procedures set out in this Directive require the intervention of conformity assessment bodies, which are notified by the Member States to the Commission.


    (27)


    Experience has shown that the criteria set out in Directive 94/9/EC that conformity assessment bodies have to fulfil to be notified to the Commission are not sufficient to ensure a uniformly high level
    of performance of notified bodies throughout the Union. It is, however, essential that all notified bodies perform their functions to the same level and under conditions of fair competition. That requires
    the setting of obligatory requirements for conformity assessment bodies wishing to be notified in order to provide conformity assessment services.


    (28)


    If a conformity assessment body demonstrates conformity with the criteria laid down in harmonised standards, it should be presumed to comply with the corresponding requirements set out in this Directive


    (29)


    In order to ensure a consistent level of quality in the performance of conformity assessment, it is also necessary to set requirements for notifying authorities and other bodies involved in the assessment,
    notification and monitoring of notified bodies.


    (30)


    The system set out in this Directive should be complemented by the accreditation system provided for in Regulation (EC) No 765/2008. Since accreditation is an essential means of verifying the competence
    of conformity assessm'
- id: art-2
  title: CHAPTER 1
  text: 'CHAPTER 1


    GENERAL PROVISIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Scope


    1.   This Directive shall apply to the following, hereinafter referred to as ‘products’:


    (a)


    equipment and protective systems intended for use in potentially explosive atmospheres;


    (b)


    safety devices, controlling devices and regulating devices intended for use outside potentially explosive atmospheres but required for or contributing to the safe functioning of equipment and protective
    systems with respect to the risks of explosion;


    (c)


    components intended to be incorporated into equipment and protective systems referred to in point (a).


    2.   This Directive shall not apply to:


    (a)


    medical devices intended for use in a medical environment;


    (b)


    equipment and protective systems where the explosion hazard results exclusively from the presence of explosive substances or unstable chemical substances;


    (c)


    equipment intended for use in domestic and non-commercial environments where potentially explosive atmospheres may only rarely be created, solely as a result of the accidental leakage of fuel gas;


    (d)


    personal protective equipment covered by Council Directive 89/686/EEC of 21 December 1989 on the approximation of the laws of the Member States relating to personal protective equipment

    (

    9

    )

    ;


    (e)


    seagoing vessels and mobile offshore units together with equipment on board such vessels or units;


    (f)


    means of transport, i.e. vehicles and their trailers intended solely for transporting passengers by air or by road, rail or water networks, as well as means of transport in so far as such means are
    designed for transporting goods by air, by public road or rail networks or by water. Vehicles intended for use in a potentially explosive atmosphere shall not be excluded from the scope of this Directive;


    (g)


    the equipment covered by point (b) of Article 346(1) of the Treaty on the Functioning of the European Union.'
- id: art-4
  title: Article 2
  text: 'Article 2


    Definitions


    For the purposes of this Directive, the following definitions shall apply:


    (1)


    ‘equipment’ means machines, apparatus, fixed or mobile devices, control components and instrumentation thereof and detection or prevention systems which, separately or jointly, are intended for the
    generation, transfer, storage, measurement, control and conversion of energy and/or the processing of material and which are capable of causing an explosion through their own potential sources of ignition;


    (2)


    ‘protective systems’ means devices other than components of equipment which are intended to halt incipient explosions immediately and/or to limit the effective range of an explosion and which are separately
    made available on the market for use as autonomous systems;


    (3)


    ‘components’ means any item essential to the safe functioning of equipment and protective systems but with no autonomous function;


    (4)


    ‘explosive atmosphere’ means a mixture with air, under atmospheric conditions, of flammable substances in the form of gases, vapours, mists or dusts in which, after ignition has occurred, combustion
    spreads to the entire unburned mixture;


    (5)


    ‘potentially explosive atmosphere’ means an atmosphere which could become explosive due to local and operational conditions;


    (6)


    ‘equipment-group I’ means equipment intended for use in underground parts of mines, and in those parts of surface installations of such mines, liable to be endangered by firedamp and/or combustible
    dust, comprising equipment categories M 1 and M 2 as set out in Annex I;


    (7)


    ‘equipment-group II’ means equipment intended for use in other places liable to be endangered by explosive atmospheres, comprising equipment categories 1, 2 and 3 as set out in Annex I;


    (8)


    ‘equipment category’ means the classification of equipment, within each equipment-group, specified in Annex I, determining the requisite level of protection to be ensured;


    (9)


    ‘intended use’ means the use of a product prescribed by the manufacturer by assigning the equipment to a particular equipment-group and category or by providing all the information which is required
    for the safe functioning of a protective system, device or component;


    (10)


    ‘making available on the market’ means any supply of a product for distribution, consumption or use on the Union market in the course of a commercial activity, whether in return for payment or free
    of charge;


    (11)


    ‘placing on the market’means the first making available of a product on the Union market;


    (12)


    ‘manufacturer’ means any natural or legal person who manufactures a product or has a product designed or manufactured, and markets that product under his name or trade mark or uses it for his own purposes;


    (13)


    ‘authorised representative’ means any natural or legal person established within the Union who has received a written mandate from a manufacturer to act on his behalf in relation to specified tasks;


    (14)


    ‘importer’ means any natural or legal person established within the Union who places a product from a third country on the Union market;


    (15)


    ‘distributor’ means any natural or legal person in the supply chain, other than the manufacturer or the importer, who makes a product available on the market;


    (16)


    ‘economic operators’ means the manufacturer, the authorised representative, the importer and the distributor;


    (17)


    ‘technical specification’ means a document that prescribes technical requirements to be fulfilled by a product;


    (18)


    ‘harmonised standard’ means harmonised standard as defined in point (c) of point 1 of Article 2 of Regulation (EU) No 1025/2012;


    (19)


    ‘accreditation’ means accreditation as defined in point 10 of Article 2 of Regulation (EC) No 765/2008;


    (20)


    ‘national accreditation body’ means national accreditation body as defined in point 11 of Article 2 of Regulation (EC) No 765/2008;


    (21)


    ‘conformity assessment’ means the process demonstrating whether the essential health and safety requirements of this Directive relating to a product have been fulfilled;


    (22)


    ‘conformity assessment body’ means a body that performs conformity assessment activities including calibration, testing, certification and inspection;


    (23)


    ‘recall’ means any measure aimed at achieving the return of a product that has already been made available to the end-user;


    (24)


    ‘withdrawal’ means any measure aimed at preventing a product in the supply chain from being made available on the market;


    (25)


    ‘Union harmonisation legislation’ means any Union legislation harmonising the conditions for the marketing of products;


    (26)


    ‘CE marking’ means a marking by which the manufacturer indicates that the product is in conformity with the applicable requirements set out in Union harmonisation legislation providing for its affixing.'
- id: art-5
  title: Article 3
  text: 'Article 3


    Making available on the market and putting into service


    1.   Member States shall take all appropriate measures to ensure that products may be made available on the market and put into service only if, when properly installed and maintained and used in accordance
    with their intended use, they comply with this Directive.


    2.   This Directive shall not affect Member States’ entitlement to lay down such requirements as they may deem necessary to ensure that persons and, in particular, workers are protected when using relevant
    products provided that this does not mean that such products are modified in a way not specified in this Directive.


    3.   At trade fairs, exhibitions and demonstrations, Member States shall not prevent the showing of products which do not comply with this Directive, provided that a visible sign clearly indicates that
    such products do not comply with this Directive and that they are not for sale until they have been brought into conformity by the manufacturer. During demonstrations, adequate safety measures shall
    be taken to ensure the protection of persons.'
- id: art-6
  title: Article 4
  text: 'Article 4


    Essential health and safety requirements


    Products shall meet the essential health and safety requirements set out in Annex II which apply to them, account being taken of their intended use.'
- id: art-7
  title: Article 5
  text: 'Article 5


    Free movement


    Member States shall not prohibit, restrict or impede the making available on the market and putting into service in their territory of products which comply with this Directive.'
- id: art-8
  title: CHAPTER 2
  text: 'CHAPTER 2


    OBLIGATIONS OF ECONOMIC OPERATORS'
- id: art-9
  title: Article 6
  text: 'Article 6


    Obligations of manufacturers


    1.   When placing their products on the market or using them for their own purposes, manufacturers shall ensure that they have been designed and manufactured in accordance with the essential health
    and safety requirements set out in Annex II.


    2.   Manufacturers shall draw up the technical documentation referred to in Annexes III to IX and carry out the relevant conformity assessment procedure referred to in Article 13 or have it carried
    out.


    Where compliance of a product, other than a component, with the applicable requirements has been demonstrated by that procedure, manufacturers shall draw up an EU declaration of conformity and affix
    the CE marking.


    Where compliance of a component with the applicable requirements has been demonstrated by the relevant conformity assessment procedure, manufacturers shall draw up a written attestation of conformity
    as referred to in Article 13(3).


    Manufacturers shall ensure that each product is accompanied by a copy of the EU declaration of conformity or of the attestation of conformity, as appropriate. However, where a large number of products
    are delivered to a single user, the batch or consignment concerned may be accompanied by a single copy.


    3.   Manufacturers shall keep the technical documentation and the EU declaration of conformity or, where applicable, the attestation of conformity for 10 years after the product has been placed on the
    market.


    4.   Manufacturers shall ensure that procedures are in place for series production to remain in conformity with this Directive. Changes in a product design or characteristics and changes in the harmonised
    standards or in other technical specifications by reference to which conformity of a product is declared shall be adequately taken into account.


    When deemed appropriate with regard to the risks presented by a product, manufacturers shall, to protect the health and safety of end-users, carry out sample testing of products made available on the
    market, investigate, and, if necessary, keep a register of complaints, of non-conforming products and product recalls, and shall keep distributors informed of any such monitoring.


    5.   Manufacturers shall ensure that products which they have placed on the market bear a type, batch or serial number or other element allowing their identification, or, where the size or nature of
    the product does not allow it, that the required information is provided on the packaging or in a document accompanying the product.


    6.   Manufacturers shall ensure that products, other than components, which they have placed on the market bear the specific marking of explosion protection and, where applicable, the other markings
    and information referred to in point 1.0.5 of Annex II.


    7.   Manufacturers shall indicate, on the product, their name, registered trade name or registered trade mark and the postal address at which they can be contacted or, where that is not possible, on
    its packaging or in a document accompanying the product. The address shall indicate a single point at which the manufacturer can be contacted. The contact details shall be in a language easily understood
    by end-users and market surveillance authorities.


    8.   Manufacturers shall ensure that the product is accompanied by instructions and safety information in a language which can be easily understood by end-users, as determined by the Member State concerned.
    Such instructions and safety information, as well as any labelling, shall be clear, understandable and intelligible.


    9.   Manufacturers who consider or have reason to believe that a product which they have placed on the market is not in conformity with this Directive shall immediately take the corrective measures
    necessary to bring that product into conformity, to withdraw it or recall it, if appropriate. Furthermore, where the product presents a risk, manufacturers shall immediately inform the competent national
    authorities of the Member States in which they made the product available on the market to that effect, giving details, in particular, of the non-compliance and of any corrective measures taken.


    10.   Manufacturers shall, further to a reasoned request from a competent national authority, provide it with all the information and documentation in paper or electronic form necessary to demonstrate
    the conformity of the product with this Directive, in a language which can be easily understood by that authority. They shall cooperate with that authority, at its request, on any action taken to eliminate
    the risks posed by products which they have placed on the market.'
- id: art-10
  title: Article 7
  text: 'Article 7


    Authorised representatives


    1.   A manufacturer may, by a written mandate, appoint an authorised representative.


    The obligations laid down in Article 6(1) and the obligation to draw up technical documentation referred to in Article 6(2) shall not form part of the authorised representative’s mandate.


    2.   An authorised representative shall perform the tasks specified in the mandate received from the manufacturer. The mandate shall allow the authorised representative to do at least the following:


    (a)


    keep the EU declaration of conformity or, where applicable, the attestation of conformity and the technical documentation at the disposal of national market surveillance authorities for 10 years after
    the product has been placed on the market;


    (b)


    further to a reasoned request from a competent national authority, provide that authority with all the information and documentation necessary to demonstrate the conformity of a product;


    (c)


    cooperate with the competent national authorities, at their request, on any action taken to eliminate the risks posed by products covered by the authorised representative’s mandate.'
- id: art-11
  title: Article 8
  text: 'Article 8


    Obligations of importers


    1.   Importers shall place only compliant products on the market.


    2.   Before placing a product on the market importers shall ensure that the appropriate conformity assessment procedure referred to in Article 13 has been carried out by the manufacturer. They shall
    ensure that the manufacturer has drawn up the technical documentation, that the product bears the CE marking, where applicable, is accompanied by the EU declaration of conformity or the attestation
    of conformity and the required documents, and that the manufacturer has complied with the requirements set out in Article 6(5), (6) and (7).


    Where an importer considers or has reason to believe that a product is not in conformity with the essential health and safety requirements set out in Annex II, he shall not place the product on the
    market until it has been brought into conformity. Furthermore, where the product presents a risk, the importer shall inform the manufacturer and the market surveillance authorities to that effect.


    3.   Importers shall indicate on the product their name, registered trade name or registered trade mark and the postal address at which they can be contacted or, where that is not possible, on its packaging
    or in a document accompanying the product. The contact details shall be in a language easily understood by end-users and market surveillance authorities.


    4.   Importers shall ensure that the product is accompanied by instructions and safety information in a language which can be easily understood by end-users, as determined by the Member State concerned.


    5.   Importers shall ensure that, while a product is under their responsibility, its storage or transport conditions do not jeopardise its compliance with the essential health and safety requirements
    set out in Annex II.


    6.   When deemed appropriate with regard to the risks presented by a product, importers shall, to protect the health and safety of end-users, carry out sample testing of products made available on the
    market, investigate, and, if necessary, keep a register of complaints, of non-conforming products and product recalls, and shall keep distributors informed of any such monitoring.


    7.   Importers who consider or have reason to believe that a product which they have placed on the market is not in conformity with this Directive shall immediately take the corrective measures necessary
    to bring that product into conformity, to withdraw it or recall it, if appropriate. Furthermore, where the product presents a risk, importers shall immediately inform the competent national authorities
    of the Member States in which they made the product available on the market to that effect, giving details, in particular, of the non-compliance and of any corrective measures taken.


    8.   Importers shall, for 10 years after the product has been placed on the market, keep a copy of the EU declaration of conformity or, where applicable, of the attestation of conformity at the disposal
    of the market surveillance authorities and ensure that the technical documentation can be made available to those authorities, upon request.


    9.   Importers shall, further to a reasoned request from a competent national authority, provide it with all the information and documentation in paper or electronic form necessary to demonstrate the
    conformity of a product in a language which can be easily understood by that authority. They shall cooperate with that authority, at its request, on any action taken to eliminate the risks posed by
    products which they have placed on the market.'
- id: art-12
  title: Article 9
  text: 'Article 9


    Obligations of distributors


    1.   When making a product available on the market distributors shall act with due care in relation to the requirements of this Directive.


    2.   Before making a product available on the market distributors shall verify that the product bears the CE marking, where applicable, that it is accompanied by the EU declaration of conformity or
    the attestation of conformity and the required documents and by instructions and safety information, in a language which can be easily understood by end-users in the Member State in which the product
    is to be made available on the market, and that the manufacturer and the importer have complied with the requirements set out in Article 6(5), (6) and (7) and Article 8(3) respectively.


    Where a distributor considers or has reason to believe that a product is not in conformity with the essential health and safety requirements set out in Annex II, he shall not make the product available
    on the market until it has been brought into conformity. Furthermore, where the product presents a risk, the distributor shall inform the manufacturer or the importer to that effect as well as the market
    surveillance authorities.


    3.   Distributors shall ensure that, while a product is under their responsibility, its storage or transport conditions do not jeopardise its compliance with the essential health and safety requirements
    set out in Annex II.


    4.   Distributors who consider or have reason to believe that a product which they have made available on the market is not in conformity with this Directive shall make sure that the corrective measures
    necessary to bring that product into conformity, to withdraw it or recall it, if appropriate, are taken. Furthermore, where the product presents a risk, distributors shall immediately inform the competent
    national authorities of the Member States in which they made the product available on the market to that effect, giving details, in particular, of the non-compliance and of any corrective measures taken.


    5.   Distributors shall, further to a reasoned request from a competent national authority, provide it with all the information and documentation in paper or electronic form necessary to demonstrate
