    REGULATION (EU) 2024/573 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 7 February 2024



    on fluorinated greenhouse gases, amending Directive (EU) 2019/1937 and repealing Regulation (EU) No 517/2014


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 192(1) thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    After consulting the Committee of the Regions,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    The European Green Deal, as set out in the Commission communication of 11 December 2019, launched a new growth strategy for the Union that aims to transform the Union into a fair and prosperous society,
    with a modern, resource-efficient and competitive economy. It reaffirms the Commission’s ambition to make Europe the first climate-neutral and zero pollution continent by 2050 and aims to protect the
    health and well-being of citizens from environment-related risks and impacts, while ensuring an inclusive, fair and just transition, leaving no one behind. Furthermore, the Union is committed to ensuring
    the full implementation of Regulation (EU) 2021/1119 of the European Parliament and of the Council

    (

    3

    )

    and of the 8th Environment Action Programme, established by Decision (EU) 2022/591 of the European Parliament and of the Council

    (

    4

    )

    , and is committed to the United Nations 2030 Agenda for Sustainable Development and its Sustainable Development Goals.


    (2)


    Fluorinated greenhouse gases are human-made chemicals that are very strong greenhouse gases, which are often several thousand times stronger than carbon dioxide (CO

    2

    ). Together with CO

    2

    , methane and nitrous oxide, fluorinated greenhouse gases belong to the group of greenhouse gas emissions covered by the Paris Agreement adopted under the United Nations Framework Convention on Climate
    Change (UNFCCC) (the ‘Paris Agreement’)

    (

    5

    )

    . Today, fluorinated greenhouse gas emissions amount to 2,5 % of total greenhouse gas emissions in the Union, and have doubled from 1990 to 2014 in contrast to other greenhouse gas emissions, which
    have fallen.


    (3)


    Regulation (EU) No 517/2014 of the European Parliament and of the Council

    (

    6

    )

    was adopted to reverse the increase in fluorinated greenhouse gas emissions. As concluded in an evaluation prepared by the Commission, Regulation (EU) No 517/2014 has led to a year-on-year decrease
    of fluorinated greenhouse gas emissions. The supply of hydrofluorocarbons (HFCs) has declined by 37 % in metric tonnes and by 47 % in terms of tonnes of CO

    2

    equivalent from 2015 until 2019. There has also been a clear shift to the use of alternatives with a lower global warming potential, including natural alternatives (for example, air, CO

    2

    , ammonia, hydrocarbons and water), in many types of equipment that traditionally used fluorinated greenhouse gases.


    (4)


    The Intergovernmental Panel on Climate Change (IPCC) concludes in its 2021 Special Report that emission decreases for fluorinated greenhouse gases of up to 90 % by 2050 globally compared to the year
    2015 would be needed. In response to the urgency for climate action, the Union increased its climate ambition through Regulation (EU) 2021/1119. That Regulation establishes a binding Union domestic
    reduction target for net greenhouse gas emissions (emissions after deduction of removals) of at least 55 % by 2030 compared to 1990 levels and the objective of achieving climate neutrality within the
    Union at the latest by 2050. The Union has also enhanced its initial nationally determined contribution under the Paris Agreement of greenhouse gas emissions reductions from at least 40 % by 2030, to
    at least 55 %. However, the evaluation of Regulation (EU) No 517/2014 shows that the emission savings envisaged by 2030 in the context of the outdated Union climate objectives will not be fully achieved.


    (5)


    Due to global increases in HFC emissions, Parties to the 1987 Montreal Protocol on Substances that Deplete the Ozone Layer (the ‘Protocol’) decided in 2016, under the Kigali Amendment to the Protocol
    (the ‘Kigali Amendment’), which was approved on behalf of the Union by Council Decision (EU) 2017/1541

    (

    7

    )

    , to implement an HFC phase-down that is to reduce HFC production and consumption by more than 80 % over the next 30 years. This implies that each Party must comply with an HFC consumption and production
    reduction schedule as well as provide for a licensing system for imports and exports and reporting on HFCs. It is estimated that the Kigali Amendment alone will save up to 0,4 °C of additional warming
    by the end of this century.


    (6)


    It is important that this Regulation ensures that the Union comply with its international obligations under the Kigali Amendment in the long term, in particular, with regard to the reduction of consumption
    and production of HFCs, and to reporting and licensing requirements, in particular by introducing a phase-down for production and adding reduction steps for the placing on the market of HFCs after 2030.


    (7)


    Some fluorinated greenhouse gases subject to this Regulation are Per- and Polyfluorinated Substances (PFAS) or are proven to or suspected to degrade into PFAS. PFAS are chemicals which resist degradation
    and potentially have negative effects on health and the environment. In line with the precautionary principle, undertakings should consider using alternatives, where available, which are less harmful
    for health, the environment and the climate. In 2023 a proposal under Regulation (EC) No 1907/2006 of the European Parliament and of the Council

    (

    8

    )

    to restrict the manufacture, placing on the market and use of PFAS, including fluorinated greenhouse gases, was submitted to the European Chemicals Agency. When considering potential PFAS restrictions,
    the Commission and Member States should take into account the availability of those alternatives.


    (8)


    To ensure coherence with the obligations under the Protocol, global warming potential of HFCs should be calculated in terms of the 100-year global warming potential of one kilogram of a gas relative
    to that of one kilogram of CO

    2

    , based on the Fourth Assessment Report adopted by the IPCC. For other fluorinated greenhouse gases, the Sixth IPCC Assessment Report should be used. Considering the importance of rapidly reducing greenhouse
    gas emissions in order to keep the target under the Paris Agreement of global warming of 1,5 °C within reach, the 20-year global warming potential of greenhouse gases is becoming increasingly relevant.
    In that respect, where available, the 20-year global warming potential should be provided to better inform about the climate impacts of the substances covered by this Regulation. The Commission should
    raise awareness of the 20-year global warming potential of fluorinated greenhouse gases.


    (9)


    The intentional release of fluorinated substances into the atmosphere, where such release is unlawful, is a serious infringement of this Regulation and should be explicitly prohibited. Operators and
    manufacturers of equipment should be obliged to prevent leakage of such substances to the extent possible, including through checking the most relevant equipment for leaks. Where the release of fluorinated
    substances is technically necessary, operators should take all technically and economically feasible measures to prevent the release of such substances into the atmosphere, including by recapturing
    the gases emitted.


    (10)


    Sulfuryl fluoride is another very potent greenhouse gas that can be emitted when used for fumigation. Operators, using sulfuryl fluoride for fumigation, should document the use of capture and collection
    measures of that gas or, when capture is not technically or economically feasible, should specify the reasons therefor.


    (11)


    Given that the production process for some fluorinated compounds can result in the emission of other fluorinated greenhouse gases, as by-products, such by-product emissions should be destroyed or recovered
    for subsequent use as a condition for the placing on the market of fluorinated greenhouse gases. Producers and importers should be required to document mitigation measures adopted to prevent emissions
    of trifluoromethane during the production process and to provide evidence of the destruction or recovery for subsequent use of those by-product emissions, in line with the best available techniques.
    A declaration of conformity should be provided at the moment of the placing on the market of fluorinated greenhouse gases.


    (12)


    To prevent emissions of fluorinated substances, it is necessary to lay down provisions on the recovery of substances from products and equipment and on the prevention of leakages of such substances.
    Foams containing fluorinated greenhouse gases should be treated in accordance with Directive 2012/19/EU of the European Parliament and of the Council

    (

    9

    )

    . Recovery obligations should also be extended to building owners and contractors when removing certain foams from buildings, in order to maximise the reduction of emissions. Since the recovery, recycling
    and reclamation of fluorinated greenhouse gases is an application of circular economy principles, provisions on the recovery of substances are also introduced in light of the communications of the Commission
    of 10 March 2020 on ‘A new industrial strategy for Europe’, of 11 March 2020 on ‘A new Circular Economy Action Plan – For a cleaner and more competitive Europe’, of 14 October 2020 on ‘Chemicals Strategy
    for Sustainability Towards a toxic-free environment’, of 5 May 2021 on ‘Updating the 2020 New Industrial Strategy: Building a stronger Single Market for Europe’s recovery’ and of 12 May 2021 on ‘Pathway
    to a Healthy Planet for All – EU Action Plan: “Towards zero pollution for air, water and soil”’.


    (13)


    Cooling and freezing appliances rely heavily on fluorinated greenhouse gases for their proper functioning, and they represent one of the most relevant categories in the waste management of electrical
    and electronic equipment. In line with the polluter pays principle and to ensure proper waste management regarding those harmful gases, it is important that obligations relating to the extended responsibility
    for producers in the case of waste electrical and electronic equipment also cover the management of the fluorinated greenhouse gases contained or used in waste electrical and electronic equipment. Directive 2012/19/EU
    sets out financing obligations on producers of electrical and electronic equipment. This Regulation complements that Directive by requiring the financing of the collection, treatment, recovery, environmentally
    sound disposal, recycling, reclamation or destruction of fluorinated greenhouse gases listed in Annexes I and II to this Regulation from the products and equipment, containing those gases or whose functioning
    relies upon those gases, and which constitutes waste electrical and electronic equipment.


    (14)


    Refrigeration and air-conditioning equipment contained in a means of transport have particularly high leakage rates due to the vibrations that occur during transport. Operators of most means of transport
    should carry out leak checks or install leakage detection systems and recover fluorinated greenhouse gases for such mobile equipment. Like operators of other equipment covered by this Regulation, operators
    of refrigeration and air conditioning equipment on-board ships should be required to take precautionary actions to prevent the leakage of fluorinated greenhouse gases and, where such a leakage is detected,
    should repair it without undue delay. Given the internat'
