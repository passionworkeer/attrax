- id: art-5
  title: Article 3
  text: 'Article 3


    Energy efficiency first principle


    1.   In accordance with the energy efficiency first principle, Member States shall ensure that energy efficiency solutions, including demand-side resources and system flexibilities, are assessed in
    planning, policy and major investment decisions of a value of more than EUR 100 000 000 each or EUR 175 000 000 for transport infrastructure projects, relating to the following sectors:


    (a)


    energy systems; and


    (b)


    non-energy sectors, where those sectors have an impact on energy consumption and energy efficiency such as buildings, transport, water, information and communications technology (ICT), agriculture and
    financial sectors.


    2.   By 11 October 2027, the Commission shall carry out an assessment of the thresholds set out in paragraph 1, with the aim of downward revision, taking into account possible developments in the economy
    and in the energy market. The Commission shall, by 11 October 2028, submit a report to the European Parliament and to the Council, followed, where appropriate, by legislative proposals.


    3.   In applying this Article, Member States are encouraged to take into account Commission Recommendation (EU) 2021/1749

    (

    38

    )

    .


    4.   Member States shall ensure that the competent authorities monitor the application of the energy efficiency first principle, including, where appropriate, sector integration and cross-sectoral impacts,
    where policy, planning and investment decisions are subject to approval and monitoring requirements.


    5.   In applying the energy efficiency first principle, Member States shall:


    (a)


    promote and, where cost-benefit analyses are required, ensure the application of, and make publicly available, cost-benefit methodologies that allow proper assessment of the wider benefits of energy
    efficiency solutions where appropriate, taking into account the entire life cycle and long-term perspective, system and cost efficiency, security of supply and quantification from the societal, health,
    economic and climate neutrality perspectives, sustainability and circular economy principles in transition to climate neutrality;


    (b)


    address the impact on energy poverty;


    (c)


    identify an entity or entities responsible for monitoring the application of the energy efficiency first principle and the impacts of regulatory frameworks, including financial regulations, planning,
    policy and the major investment decisions referred to in paragraph 1 on energy consumption, energy efficiency and energy systems;


    (d)


    report to the Commission, as part of their integrated national energy and climate progress reports submitted pursuant to Article 17 of Regulation (EU) 2018/1999, on how the energy efficiency first principle
    was taken into account in the national and, where applicable, regional and local planning, policy and major investment decisions related to the national and regional energy systems including at least
    the following:


    (i)


    an assessment of the application and benefits of the energy efficiency first principle in energy systems, in particular in relation to energy consumption;


    (ii)


    a list of actions taken to remove any unnecessary regulatory or non-regulatory barriers to the implementation of the energy efficiency first principle and of demand-side solutions, including through
    the identification of national legislation and measures that are contrary to the energy efficiency first principle.


    6.   By 11 April 2024, the Commission shall adopt guidelines providing a common general framework including supervision, the monitoring and reporting procedure, which Member States may use to design
    the cost-benefit methodologies referred to in paragraph 5, point (a), for the purpose of comparability, while leaving the possibility for Member States to adapt to national and local circumstances.'
- id: art-6
  title: Article 4
  text: 'Article 4


    Energy efficiency targets


    1.   Member States shall collectively ensure a reduction of energy consumption of at least 11,7 % in 2030 compared to the projections of the 2020 EU Reference Scenario so that the Union’s final energy
    consumption amounts to no more than 763 Mtoe. Member States shall make efforts to collectively contribute to the indicative Union primary energy consumption target amounting to no more than 992,5 Mtoe
    in 2030.


    2.   Each Member State shall set an indicative national energy efficiency contribution based on final energy consumption to meet, collectively, the Union’s binding final energy consumption target referred
    to in paragraph 1 of this Article and shall make efforts to contribute collectively to the Union’s indicative primary energy consumption target referred to in that paragraph. Member States shall notify
    those contributions to the Commission, together with an indicative trajectory for those contributions, as part of the updates of their integrated national energy and climate plans submitted pursuant
    to Article 14(2) of Regulation (EU) 2018/1999, and of their integrated national energy and climate plans notified pursuant to Article 3 and Articles 7 to 12 of that Regulation. When doing so, Member
    States shall also express their contributions in terms of an absolute level of primary energy consumption in 2030. When setting their indicative national energy efficiency contributions, Member States
    shall take into account the requirements set out in paragraph 3 of this Article and explain how, and on the basis of which data, the contributions have been calculated. To that end, they may use the
    formula set out in Annex I to this Directive.


    Member States shall provide the shares of primary energy consumption and final energy consumption of energy end-use sectors, as defined in Regulation (EC) No 1099/2008, including industry, residential,
    services and transport, in their national energy efficiency contributions. Member States shall also indicate projections for energy consumption in ICT.


    3.   In setting their indicative national energy efficiency contributions referred to in paragraph 2, Member States shall take into account:


    (a)


    the Union’s 2030 final energy consumption target of no more than 763 Mtoe and the primary energy consumption target of no more than 992,5 Mtoe, as provided for in paragraph 1;


    (b)


    the measures provided for in this Directive;


    (c)


    other measures to promote energy efficiency within Member States and at Union level;


    (d)


    any relevant factors affecting efficiency efforts:


    (i)


    early efforts and actions in energy efficiency;


