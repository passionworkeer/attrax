    Official Journal of the European Union


    L 231/1


    DIRECTIVE (EU) 2023/1791 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 13 September 2023



    on energy efficiency and amending Regulation (EU) 2023/955 (recast)


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 194(2) thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national Parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Having regard to the opinion of the Committee of the Regions

    (

    2

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    3

    )

    ,


    Whereas:


    (1)


    Directive 2012/27/EU of the European Parliament and of the Council

    (

    4

    )

    has been substantially amended several times

    (

    5

    )

    . Since further amendments are to be made, that Directive should be recast in the interests of clarity.


    (2)


    In its communication of 17 September 2020 on ‘Stepping up Europe’s 2030 climate ambition – Investing in a climate-neutral future for the benefit of our people’ (the ‘Climate Target Plan’), the Commission
    proposed to raise the Union’s climate ambition by increasing the greenhouse gas (GHG) emissions target to at least 55 % below 1990 levels by 2030. That is a substantial increase compared to the existing
    40 % reduction target. The proposal delivered on the commitment made in the communication of the Commission of 11 December 2019 on ‘The European Green Deal’ (the ‘European Green Deal’) to put forward
    a comprehensive plan to increase the Union’s target for 2030 towards 55 % in a responsible way. It is also in accordance with the objectives of the Paris Agreement adopted on 12 December 2015 under
    the United Nations Framework Convention on Climate Change (the ‘Paris Agreement’) to keep the global temperature increase to well below 2 °C and pursue efforts to keep it to 1,5 °C.


    (3)


    The conclusions of the European Council of 10-11 December 2020 endorsed the Union’s binding domestic reduction target for net GHG emissions of at least 55 % by 2030 compared to 1990. The European Council
    concluded that the climate ambition needed to be raised in a manner that would spur sustainable economic growth, create jobs, deliver health and environmental benefits for Union citizens, and contribute
    to the long-term global competitiveness of the Union’s economy by promoting innovation in green technologies.


    (4)


    To implement those objectives, the Commission, in its communication of 19 October 2020 on ‘Commission Work Programme 2021 – A Union of vitality in a world of fragility’, announced a legislative package
    to reduce GHG emissions by at least 55 % by 2030 (the ‘Fit for 55 package’), and to achieve a climate-neutral European Union by 2050. That package covers a range of policy areas including energy efficiency,
    renewable energy, land use, land change and forestry, energy taxation, effort sharing and emissions trading.


    (5)


    The purpose of the Fit for 55 package is to safeguard and create jobs in the Union and to enable the Union to become a world leader in the development and uptake of clean technologies in the global
    energy transition, including energy efficiency solutions.


    (6)


    Projections indicate that, with the full implementation of current policies, GHG emission reductions by 2030 would be around 45 % compared to 1990 levels, when excluding land use emissions and absorptions,
    and around 47 %, when including them. The Climate Target Plan therefore provides for a set of required actions across all sectors of the economy and revisions of the key legislative instruments to reach
    that increased climate ambition.


    (7)


    In its communication of 28 November 2018 on ‘A Clean Planet for all – A European strategic long-term vision for a prosperous, modern, competitive and climate neutral economy’, the Commission stated
    that energy efficiency is a key area of action, without which the full decarbonisation of the Union’s economy cannot be achieved. The need to capture the cost-effective energy saving opportunities has
    led to the Union’s current energy efficiency policy. In December 2018, a new 2030 Union headline energy efficiency target of at least 32,5 %, compared to projected energy use in 2030, was included as
    part of the Clean Energy for All Europeans package, which aimed at putting energy efficiency first, achieving global leadership in renewable energies and providing a fair deal for consumers.


    (8)


    The impact assessment accompanying the Climate Target Plan demonstrated that, to achieve the increased climate ambition, energy efficiency improvements will need to be significantly raised from the
    current level of 32,5 %.


    (9)


    An increase in the Union’s 2030 energy efficiency target can reduce energy prices and be crucial in reducing GHG emissions, accompanied by an increase and uptake of electrification, hydrogen, e-fuels
    and other relevant technologies necessary for the green transition, including in the transport sector. Even with the rapid growth of renewable electricity generation, energy efficiency can reduce the
    need of new power generation capacity and the costs relating to storage, transmission and distribution. Increased energy efficiency is also particularly important for the security of the energy supply
    of the Union, by lowering the Union’s dependence on the import of fuels from third countries. Energy efficiency is one of the cleanest and most cost-efficient measures by which to address that dependence.


    (10)


    The sum of national contributions communicated by Member States in their national energy and climate plans falls short of the Union’s target of 32,5 %. The contributions would collectively lead to a
    reduction of 29,7 % for primary energy consumption and 29,4 % for final energy consumption compared to the projections from the Commission’s 2007 EU Reference Scenario for 2030. That would translate
    in a collective gap of 2,8 percentage points for primary energy consumption and 3,1 percentage points for final energy consumption for the EU-27.


    (11)


    A number of Member States presented ambitious national energy and climate plans, which were assessed by the Commission as ‘sufficient’, and which contained measures that allow those Member States to
    contribute to reaching the collective targets for energy efficiency with a ratio larger than the Union average. In addition, a number of Member States have documented ‘early efforts’ in achieving energy
    savings, namely energy savings above the Union average trajectories in the last years. Both cases are significant efforts that should be recognised and should be included in the Union’s future modelling
    projections and that can serve as good examples of how all Member States can work on their energy efficiency potential to deliver significant benefits to their economies and societies.


    (12)


    In some cases, the assumptions used by the Commission in its 2020 EU Reference Scenario and the assumptions used by some Member States for their reference scenarios underpinning their national energy
    and climate plans are different. This may lead to divergences as regards the calculation of primary energy consumption but both approaches are valid with regard to primary energy consumption.


    (13)


    While the energy savings potential remains large in all sectors, there is a particular challenge relating to transport, as it is responsible for more than 30 % of final energy consumption, and to buildings,
    since 75 % of the Union’s building stock has a poor energy performance. Another increasingly important sector is the information and communications technology (ICT) sector, which is responsible for
    5 to 9 % of the world’s total electricity use and more than 2 % of global emissions. In 2018, data centres accounted for 2,7 % of the electricity demand in the EU-28. In that context, the Commission,
    in its communication of 19 February 2020 on ‘Shaping Europe''s digital future’ (the ‘Union’s Digital Strategy’), highlighted the need for highly energy-efficient and sustainable data centres and transparency
    measures for telecoms operators as regards their environmental footprint. Furthermore, the possible increase in industry’s energy demand that may result from its decarbonisation, particularly for energy
    intensive processes, should also be taken into account.


    (14)


    The higher level of ambition requires a stronger promotion of cost-effective energy efficiency measures in all areas of the energy system and in all relevant sectors where activity affects energy demand,
    such as the transport, water and agriculture sectors. Improving energy efficiency throughout the full energy chain, including energy generation, transmission, distribution and end-use, will benefit
    the environment, improve air quality and public health, reduce GHG emissions, improve energy security by decreasing the need for energy imports, in particular of fossil fuels, cut energy costs for households
    and companies, help alleviate energy poverty, and lead to increased competitiveness, more jobs and increased economic activity throughout the economy. Improving energy efficiency would thus improve
    citizens’ quality of life, while contributing to the transformation of the Union’s energy relations with third-country partners towards achieving climate neutrality. That complies with the Union commitments
    made in the framework of the Energy Union and global climate agenda established by the Paris Agreement. Improving the energy performance of various sectors has the potential of fostering urban regeneration,
    including improvement of buildings, and changes in mobility and accessibility patterns, while promoting more efficient, sustainable and affordable options.


    (15)


    This Directive takes a step forward towards climate neutrality by 2050, under which energy efficiency is to be treated as an energy source in its own right. The energy efficiency first principle is
    an overarching principle that should be taken into account across all sectors, going beyond the energy system, at all levels, including in the financial sector. Energy efficiency solutions should be
    considered as the first option in policy, planning and investment decisions when setting new rules for the supply side and other policy areas. While the energy efficiency first principle should be applied
    without prejudice to other legal obligations, objectives and principles, such obligations, objectives and principles should not hamper its application or lead to exemptions from applying the principle.
    The Commission should ensure that energy efficiency and demand response can compete on equal terms with generation capacity. Energy efficiency improvements need to be made whenever they are more cost-effective
    than equivalent supply-side solutions. That should help exploit the multiple benefits of energy efficiency for the Union, in particular for citizens and businesses. Implementing energy efficiency improvement
    measures should also be a priority in alleviating energy poverty.


    (16)


    Energy efficiency should be recognised as a crucial element and a priority consideration in future investment decisions on the Union’s energy infrastructure. The energy efficiency first principle should
    be applied taking into consideration primarily the system efficiency approach and societal and health perspective, and paying attention to security of supply, energy system integration and the transition
    to climate neutrality. Consequently, the energy efficiency first principle should help increase the efficiency of individual end-use sectors and of the whole energy system. The application of the principle
    should also support investments in energy-efficient solutions contributing to the environmental objectives of Regulation (EU) 2020/852 of the European Parliament and of the Council

    (

    6

    )

    .


    (17)


