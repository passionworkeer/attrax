  text: 'L_2013178EN.01002701.xml


    28.6.2013


    EN


    Official Journal of the European Union


    L 178/27


    DIRECTIVE 2013/29/EU OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 12 June 2013



    on the harmonisation of the laws of the Member States relating to the making available on the market of pyrotechnic articles (recast)


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 114 thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    Directive 2007/23/EC of the European Parliament and of the Council of 23 May 2007 on the placing on the market of pyrotechnic articles

    (

    3

    )

    has been substantially amended

    (

    4

    )

    . Since further amendments are to be made, that Directive should be recast in the interests of clarity.


    (2)


    Regulation (EC) No 765/2008 of the European Parliament and of the Council of 9 July 2008 setting out the requirements for accreditation and market surveillance relating to the marketing of products

    (

    5

    )

    lays down rules on the accreditation of conformity assessment bodies, provides a framework for the market surveillance of products and for controls on products from third countries, and lays down the
    general principles of the CE marking.


    (3)


    Decision No 768/2008/EC of the European Parliament and of the Council of 9 July 2008 on a common framework for the marketing of products

    (

    6

    )

    lays down common principles and reference provisions intended to apply across sectoral legislation in order to provide a coherent basis for revision or recasts of that legislation. Directive 2007/23/EC
    should be adapted to that Decision.


    (4)


    The laws, regulations and administrative provisions in force in the Member States with regard to the making available on the market of pyrotechnic articles are divergent, in particular as regards aspects
    such as safety and performance characteristics.


    (5)


    The laws, regulations and administrative provisions of Member States, being liable to cause barriers to trade within the Union, need to be harmonised in order to guarantee the free movement of pyrotechnic
    articles within the internal market while ensuring a high level of protection of human health and safety and the protection of consumers and professional end-users. Such high level of protection should
    include the relevant age limits associated with users of pyrotechnic articles being adhered to.


    (6)


    Council Directive 93/15/EEC of 5 April 1993 on the harmonisation of the provisions relating to the placing on the market and supervision of explosives for civil uses

    (

    7

    )

    excludes pyrotechnic articles from its scope.


    (7)


    Safety during storage is governed by Council Directive 96/82/EC of 9 December 1996 on the control of major-accident hazards involving dangerous substances

    (

    8

    )

    which sets out safety requirements for establishments where explosives, including pyrotechnic substances, are present.


    (8)


    As regards safety in transportation, the rules concerning the transport of pyrotechnic articles are covered by international conventions and agreements, including the United Nations recommendations
    on the transport of dangerous goods. Those aspects should therefore not fall within the scope of this Directive.


    (9)


    This Directive should apply to all forms of supply, including distance selling.


    (10)


    This Directive should not apply to pyrotechnic articles to which Council Directive 96/98/EC of 20 December 1996 on marine equipment

    (

    9

    )

    and the relevant international conventions referred to therein apply. It should also not apply to percussion caps intended for toys falling within the scope of Directive 2009/48/EC of the European Parliament
    and of the Council of 18 June 2009 on the safety of toys

    (

    10

    )

    .


    (11)


    Fireworks which are built by a manufacturer for his own use and approved for use exclusively on its territory by the Member State in which the manufacturer is established, and which remain on the territory
    of that Member State, should not be considered as having been made available on the market and should therefore not need to comply with this Directive.


    (12)


    It should not be possible, where the requirements laid down in this Directive are satisfied, for Member States to prohibit, restrict or hinder the free movement of pyrotechnic articles. This Directive
    should apply without prejudice to national legislation on the licensing of manufacturers, distributors and importers by the Member States.


    (13)


    Pyrotechnic articles should include fireworks, theatrical pyrotechnic articles and other pyrotechnic articles for technical purposes, such as gas generators used in airbags or in seatbelt pretensioners.


    (14)


    In order to ensure appropriately high levels of protection, pyrotechnic articles should be categorised according to their level of hazard as regards their type of use, purpose or noise level.


    (15)


    Given the dangers inherent in the use of pyrotechnic articles, it is appropriate to lay down age limits for their being made available to persons, and to ensure that their labelling displays sufficient
    and appropriate information on safe use, in order to protect human health and safety and the environment. Certain pyrotechnic articles should be made available only to persons with the necessary knowledge,
    skills and experience. With regard to pyrotechnic articles for vehicles, labelling requirements should take into account current practice and the fact that those articles are supplied exclusively to
    professional users.


    (16)


    The use of pyrotechnic articles and, in particular, the use of fireworks, is subject to markedly divergent cultural customs and traditions in the respective Member States. It is therefore necessary
    to allow Member States to take national measures to limit the use or sale of certain categories of pyrotechnic articles to the general public for reasons, inter alia, of public security or health and
    safety.


    (17)


    Economic operators should be responsible for the compliance of pyrotechnic articles with the requirements of this Directive, in relation to their respective roles in the supply chain, so as to ensure
    a high level of protection of public interests, such as health and safety and the protection of consumers, and to guarantee fair competition on the Union market.


    (18)


    All economic operators intervening in the supply and distribution chain should take appropriate measures to ensure that they only make available on the market pyrotechnic articles which are in conformity
    with this Directive. It is necessary to provide for a clear and proportionate distribution of obligations which correspond to the role of each economic operator in the supply and distribution chain.


    (19)


    In order to facilitate communication between economic operators, market surveillance authorities and consumers, Member States should encourage economic operators to include a website address in addition
    to the postal address.


    (20)


    The manufacturer, having detailed knowledge of the design and production process, is best placed to carry out the conformity assessment procedure. Conformity assessment should therefore remain solely
    the obligation of the manufacturer.


    (21)


    It is necessary to ensure that pyrotechnic articles from third countries entering the Union market comply with the requirements of this Directive, and in particular that appropriate conformity assessment
    procedures have been carried out by manufacturers with regard to those pyrotechnic articles. Provision should therefore be made for importers to make sure that the pyrotechnic articles they place on
    the market comply with the requirements of this Directive and that they do not place on the market pyrotechnic articles which do not comply with such requirements or present a risk. Provision should
    also be made for importers to make sure that conformity assessment procedures have been carried out and that marking of pyrotechnic articles and documentation drawn up by manufacturers are available
    for inspection by the competent national authorities.


    (22)


    The distributor makes a pyrotechnic article available on the market after it has been placed on the market by the manufacturer or the importer and should act with due care to ensure that his handling
    of the pyrotechnic article does not adversely affect the compliance of the pyrotechnic article.


    (23)


    Any economic operator who either places a pyrotechnic article on the market under his own name or trademark or modifies a pyrotechnic article in such a way that compliance with the requirements of this
    Directive may be affected should be considered to be the manufacturer and should assume the obligations of the manufacturer.


    (24)


    Distributors and importers, being close to the market place, should be involved in market surveillance tasks carried out by the competent national authorities, and should be prepared to participate
    actively, providing those authorities with all necessary information relating to the pyrotechnic article concerned.


    (25)


    When keeping the information required under this Directive for the identification of other economic operators, economic operators should not be required to update such information in respect of other
    economic operators who have either supplied them with a pyrotechnic article or to whom they have supplied a pyrotechnic article.


    (26)


    It is appropriate to establish essential safety requirements for pyrotechnic articles in order to protect consumers and to prevent accidents.


    (27)


    Some pyrotechnic articles, particularly pyrotechnic articles for vehicles such as air bag gas generators, contain small amounts of commercial blasting agents and military explosives. Following the adoption
    of Directive 2007/23/EC it has become obvious that it will not be possible to replace these substances as additives in strictly combustive compositions, where they are used to enhance the energetic
    balance. The essential safety requirement, which restricts the use of commercial blasting agents and military explosives, should therefore be modified.


    (28)


    In order to facilitate conformity assessment with the essential safety requirements provided for in this Directive, it is necessary to provide for a presumption of conformity for pyrotechnic articles
    which are in conformity with harmonised standards that are adopted in accordance with Regulation (EU) No 1025/2012 of the European Parliament and of the Council of 25 October 2012 on European Standardisation,
    amending Council Directives 89/686/EEC and 93/15/EEC and Directives 94/9/EC, 94/25/EC, 95/16/EC, 97/23/EC, 98/34/EC, 2004/22/EC, 2007/23/EC, 2009/23/EC and 2009/105/EC of the European Parliament and
    of the Council

    (

    11

    )

    for the purpose of expressing detailed technical specifications of those requirements.


    (29)


    Regulation (EU) No 1025/2012 provides for a procedure for objections to harmonised standards where those standards do not entirely satisfy the requirements of this Directive.


    (30)


    In order to enable economic operators to demonstrate and the competent authorities to ensure that pyrotechnic articles made available on the market comply with the essential safety requirements, it
    is necessary to provide for conformity assessment procedures. Decision No 768/2008/EC establishes modules for conformity assessment procedures, which include procedures from the least to the most stringent,
    in proportion to the level of risk involved and the level of safety required. In order to ensure intersectoral coherence and to avoid ad-hoc variants, conformity assessment procedures should be chosen
    from among those modules.


    (31)


    Manufacturers should draw up an EU declaration of conformity to provide information required under this Directive on th'
- id: art-2
  title: CHAPTER 1
  text: 'CHAPTER 1


    GENERAL PROVISIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Subject matter


    1.   This Directive establishes rules designed to achieve the free movement of pyrotechnic articles in the internal market while ensuring a high level of protection of human health and public security
    and the protection and safety of consumers and taking into account the relevant aspects related to environmental protection.


    2.   This Directive establishes the essential safety requirements which pyrotechnic articles are to fulfil with a view to their being made available on the market. Those requirements are set out in
    Annex I.'
- id: art-4
  title: Article 2
  text: 'Article 2


    Scope


    1.   This Directive shall apply to pyrotechnic articles.


    2.   This Directive shall not apply to:


    (a)


    pyrotechnic articles intended for non-commercial use, in accordance with national law, by the armed forces, the police or fire departments;


    (b)


    equipment falling within the scope of Directive 96/98/EC;


    (c)


    pyrotechnic articles intended for use in the aerospace industry;


    (d)


    percussion caps intended specifically for toys falling within the scope of Directive 2009/48/EC;


    (e)


    explosives falling within the scope of Directive 93/15/EEC;


    (f)


    ammunition;


    (g)


    fireworks which are built by a manufacturer for his own use and approved for use exclusively on its territory by the Member State in which the manufacturer is established, and which remain on the territory
    of that Member State.'
- id: art-5
  title: Article 3
  text: 'Article 3


    Definitions


    For the purposes of this Directive, the following definitions shall apply:


    (1)


    ‘pyrotechnic article’ means any article containing explosive substances or an explosive mixture of substances designed to produce heat, light, sound, gas or smoke or a combination of such effects through
    self-sustained exothermic chemical reactions;


    (2)


    ‘firework’ means a pyrotechnic article intended for entertainment purposes;


    (3)


    ‘theatrical pyrotechnic articles’ means pyrotechnic articles designed for indoor or outdoor stage use, including film and television productions or similar use;


    (4)


    ‘pyrotechnic articles for vehicles’ means components of safety devices in vehicles which contain pyrotechnic substances used to activate these or other devices;


    (5)


    ‘ammunition’ means projectiles and propelling charges and blank ammunition used in portable firearms, other guns and artillery;


    (6)


    ‘person with specialist knowledge’ means a person authorised by a Member State to handle and/or use on its territory category F4 fireworks, category T2 theatrical pyrotechnic articles and/or category
    P2 other pyrotechnic articles;


    (7)


    ‘making available on the market’ means any supply of a pyrotechnic article for distribution, consumption or use on the Union market in the course of a commercial activity, whether in return for payment
    or free of charge;


    (8)


    ‘placing on the market’ means the first making available of a pyrotechnic article on the Union market;


    (9)


    ‘manufacturer’ means a natural or legal person who manufactures a pyrotechnic article, or has such an article designed or manufactured, and markets that pyrotechnic article under his name or trademark;


    (10)


    ‘importer’ means any natural or legal person established within the Union who places a pyrotechnic article from a third country on the Union market;


    (11)


    ‘distributor’ means any natural or legal person in the supply chain, other than the manufacturer or the importer, who makes a pyrotechnic article available on the market;


    (12)


    ‘economic operators’ means the manufacturer, the importer and the distributor;


    (13)


    ‘technical specification’ means a document that prescribes technical requirements to be fulfilled by a pyrotechnic article;


    (14)


    ‘harmonised standard’ means harmonised standard as defined in point (c) of point 1 of Article 2 of Regulation (EU) No 1025/2012;


    (15)


    ‘accreditation’ means accreditation as defined in point 10 of Article 2 of Regulation (EC) No 765/2008;


    (16)


    ‘national accreditation body’ means national accreditation body as defined in point 11 of Article 2 of Regulation (EC) No 765/2008;


    (17)


    ‘conformity assessment’ means the process demonstrating whether the essential safety requirements of this Directive relating to a pyrotechnic article have been fulfilled;


    (18)


    ‘conformity assessment body’ means a body that performs conformity assessment activities including calibration, testing, certification and inspection;


    (19)


    ‘recall’ means any measure aimed at achieving the return of a pyrotechnic article that has already been made available to the end-user;


    (20)


    ‘withdrawal’ means any measure aimed at preventing a pyrotechnic article in the supply chain from being made available on the market;


    (21)


    ‘Union harmonisation legislation’ means any Union legislation harmonising the conditions for the marketing of products;


    (22)


    ‘CE marking’ means a marking by which the manufacturer indicates that the pyrotechnic article is in conformity with the applicable requirements set out in Union harmonisation legislation providing for
    its affixing.'
- id: art-6
  title: Article 4
  text: 'Article 4


    Free movement


    1.   Member States shall not prohibit, restrict or hinder the making available on the market of pyrotechnic articles which satisfy the requirements of this Directive.


    2.   This Directive shall not preclude measures taken by a Member State to prohibit or restrict the possession, use and/or the sale to the general public of category F2 and F3 fireworks, theatrical
    pyrotechnic articles and other pyrotechnic articles, which are justified on grounds of public order, security, health and safety, or environmental protection.


    3.   At trade fairs, exhibitions and demonstrations for the marketing of pyrotechnic articles, Member States shall not prevent the showing and use of pyrotechnic articles not in conformity with this
    Directive, provided that a visible sign clearly indicates the name and date of the trade fair, exhibition or demonstration in question and the non-conformity and non-availability for sale of the pyrotechnic
    articles until brought into conformity. During such events, appropriate safety measures shall be taken in accordance with any requirements laid down by the competent authority of the Member State concerned.


    4.   Member States shall not prevent the free movement and use of pyrotechnic articles manufactured for the purpose of research, development and testing and which are not in conformity with this Directive,
    provided that a visible sign clearly indicates their non-conformity and non-availability for purposes other than research, development and testing.'
- id: art-7
  title: Article 5
  text: 'Article 5


    Making available on the market


    Member States shall take all appropriate measures to ensure that pyrotechnic articles may be made available on the market only if they satisfy the requirements of this Directive.'
- id: art-8
  title: Article 6
  text: 'Article 6


    Categories of pyrotechnic articles


    1.   Pyrotechnic articles shall be categorised by the manufacturer according to their type of use, or their purpose and level of hazard, including their noise level. The notified bodies referred to
    in Article 21 shall confirm the categorisation as part of the conformity assessment procedures referred to in Article 17.


    Categorisation shall be as follows:


    (a)


    Fireworks:


    (i)


    category F1: fireworks which present a very low hazard and negligible noise level and which are intended for use in confined areas, including fireworks which are intended for use inside domestic buildings;


    (ii)


    category F2: fireworks which present a low hazard and low noise level and which are intended for outdoor use in confined areas;


    (iii)


    category F3: fireworks which present a medium hazard, which are intended for outdoor use in large open areas and whose noise level is not harmful to human health;


    (iv)


    category F4: fireworks which present a high hazard, which are intended for use only by persons with specialist knowledge (commonly known as fireworks for professional use) and whose noise level is not
    harmful to human health.


    (b)


    Theatrical pyrotechnic articles:


    (i)


    category T1: pyrotechnic articles for stage use which present a low hazard;


    (ii)


    category T2: pyrotechnic articles for stage use which are intended for use only by persons with specialist knowledge.


    (c)


    Other pyrotechnic articles:


    (i)


    category P1: pyrotechnic articles, other than fireworks and theatrical pyrotechnic articles, which present a low hazard;


    (ii)


    category P2: pyrotechnic articles, other than fireworks and theatrical pyrotechnic articles, which are intended for handling or use only by persons with specialist knowledge.


    2.   Member States shall inform the Commission of the procedures whereby they identify and authorise persons with specialist knowledge.'
- id: art-9
  title: Article 7
  text: 'Article 7


    Age limits and other limitations


    1.   Pyrotechnic articles shall not be made available on the market to persons below the following age limits:


    (a)


    fireworks:


    (i)


    category F1: 12 years;


    (ii)


    category F2: 16 years;


    (iii)


    category F3: 18 years;


    (b)


    theatrical pyrotechnic articles of category T1 and other pyrotechnic articles of category P1: 18 years.


    2.   Member States may increase the age limits set out in paragraph 1 where justified on grounds of public order, security or health and safety. Member States may also lower the age limits for persons
    vocationally trained or undergoing such training.


    3.   Manufacturers, importers and distributors shall not make available on the market the following pyrotechnic articles except to persons with specialist knowledge:


    (a)


    fireworks of category F4;


    (b)


    theatrical pyrotechnic articles of category T2 and other pyrotechnic articles of category P2.


    4.   Other pyrotechnic articles of category P1 for vehicles, including airbag and seat belt pre-tensioner systems, shall not be made available to members of the general public unless those pyrotechnic
    articles for vehicles have been incorporated in a vehicle or a detachable vehicle part.'
- id: art-10
  title: CHAPTER 2
  text: 'CHAPTER 2


    OBLIGATIONS OF ECONOMIC OPERATORS'
- id: art-11
  title: Article 8
  text: 'Article 8


    Obligations of the manufacturers


    1.   When placing their pyrotechnic articles on the market, manufacturers shall ensure that they have been designed and manufactured in accordance with the essential safety requirements set out in Annex
    I.


    2.   Manufacturers shall draw up the technical documentation referred to in Annex II and have the relevant conformity assessment procedure referred to in Article 17 carried out.


    Where compliance of a pyrotechnic article with the applicable requirements has been demonstrated by that procedure, manufacturers shall draw up an EU declaration of conformity and affix the CE marking.


    3.   Manufacturers shall keep the technical documentation and the EU declaration of conformity for 10 years after the pyrotechnic article has been placed on the market.


    4.   Manufacturers shall ensure that procedures are in place for series production to remain in conformity with this Directive. Changes in pyrotechnic article design or characteristics and changes in
    the harmonised standards or in other technical specifications by reference to which conformity of a pyrotechnic article is declared shall be adequately taken into account.


    When deemed appropriate with regard to the risks presented by a pyrotechnic article, manufacturers shall, to protect the health and safety of consumers, upon a duly justified request of the competent
    authorities, carry out sample testing of pyrotechnic articles made available on the market, investigate, and, if necessary, keep a register of complaints, of non-conforming pyrotechnic articles and
    pyrotechnic article recalls, and shall keep distributors informed of any such monitoring.


    5.   Manufacturers shall ensure that pyrotechnic articles which they have placed on the market are labelled in accordance with Article 10 or Article 11.


    6.   Manufacturers shall indicate on the pyrotechnic article their name, registered trade name or registered trade mark and the postal address at which they can be contacted or, where that is not possible,
    on its packaging or in a document accompanying the pyrotechnic article. The address shall indicate a single point at which the manufacturer can be contacted. The contact details shall be in a language
    easily understood by end-users and market surveillance authorities.


    7.   Manufacturers shall ensure that the pyrotechnic article is accompanied by instructions and safety information in a language which can be easily understood by consumers and other end-users, as determined
    by the Member State concerned. Such instructions and safety information, as well as any labelling, shall be clear, understandable and intelligible.


    8.   Manufacturers who consider or have reason to believe that a pyrotechnic article which they have placed on the market is not in conformity with this Directive shall immediately take the corrective
    measures necessary to bring that pyrotechnic article into conformity, to withdraw it or recall it, if appropriate. Furthermore, where the pyrotechnic article presents a risk, manufacturers shall immediately
    inform the competent national authorities of the Member States in which they made the pyrotechnic article available on the market to that effect, giving details, in particular, of the non-compliance
    and of any corrective measures taken.


    9.   Manufacturers shall, further to a reasoned request from a competent national authority, provide it with all the information and documentation in paper or electronic form necessary to demonstrate
    the conformity of the pyrotechnic article with this Directive, in a language which can be easily understood by that authority. They shall cooperate with that authority, at its request, on any action
    taken to eliminate the risks posed by pyrotechnic articles which they have placed on the market.'
- id: art-12
  title: Article 9
  text: 'Article 9


    Traceability


    1.   In order to facilitate the traceability of pyrotechnic articles, manufacturers shall label them with a registration number assigned by the notified body carrying out the conformity assessment pursuant
    to Article 17. The numbering shall be done in accordance with a uniform system determined by the Commission.


    2.   Manufacturers and importers shall maintain records of the registration numbers of the pyrotechnic articles they make available on the market and shall make this information available to the relevant
    authorities upon request.'
- id: art-13
  title: Article 10
  text: 'Article 10


    Labelling of pyrotechnic articles other than pyrotechnic articles for vehicles


    1.   Manufacturers shall ensure that pyrotechnic articles other than pyrotechnic articles for vehicles are labelled visibly, legibly and indelibly in the official language(s) of the Member State in
    which the pyrotechnic article is made available to the consumer. Such labelling shall be clear, understandable and intelligible.


    2.   The labelling of pyrotechnic articles shall include as a minimum the information about the manufacturer set out in Article 8(6) and, where the manufacturer is not established in the Union, the
    information about the manufacturer and the importer set out in Article 8(6) and Article 12(3) respectively, the name and type of the pyrotechnic article, its registration number and its product, batch
    or serial number, the minimum age limits set out in Article 7(1) and (2), the relevant category and instructions for use, the year of production for category F3 and F4 fireworks and, where appropriate,
    a minimum safety distance. The labelling shall include the net explosive content (NEC).


    3.   Fireworks shall also display the following minimum information:


    (a)


    category F1: where appropriate: ‘for outdoor use only’ and a minimum safety distance;


    (b)


    category F2: ‘for outdoor use only’ and, where appropriate, minimum safety distance(s);


    (c)


    category F3: ‘for outdoor use only’ and minimum safety distance(s);


    (d)


    category F4: ‘for use only by persons with specialist knowledge’ and minimum safety distance(s).


    4.   Theatrical pyrotechnic articles shall also display the following minimum information:


    (a)


    category T1: where appropriate: ‘for outdoor use only’ and minimum safety distance(s);


    (b)


    category T2: ‘for use only by persons with specialist knowledge’ and minimum safety distance(s).


    5.   If the pyrotechnic article does not provide sufficient space for the labelling requirements referred to in paragraphs 2, 3 and 4, the information shall be provided on the smallest piece of packaging.'
- id: art-14
  title: Article 11
  text: 'Article 11


    Labelling of pyrotechnic articles for vehicles


    1.   The labelling of pyrotechnic articles for vehicles shall include the information about the manufacturer set out in Article 8(6), the name and type of the pyrotechnic article, its registration number
    and its product, batch or serial number and, where necessary, the safety instructions.


    2.   If the pyrotechnic article for vehicles does not provide sufficient space for the labelling requirements referred to in paragraph 1, the information shall be provided on the packaging.


    3.   A safety data sheet for the pyrotechnic article for vehicles, compiled in accordance with Annex II to Regulation (EC) No 1907/2006 of the European Parliament and of the Council of 18 December 2006
    concerning the Registration, Evaluation, Authorisation and Restriction of Chemicals (REACH), establishing a European Chemicals Agency

    (

    14

    )

    and which takes into account the specific needs of professional users, shall be supplied to those users in the language requested by them.


    The safety data sheet may be supplied on paper or electronically, provided that the professional user has the necessary means of accessing it.'
- id: art-15
  title: Article 12
  text: 'Article 12


    Obligations of importers


    1.   Importers shall place only compliant pyrotechnic articles on the market.


    2.   Before placing a pyrotechnic article on the market importers shall ensure that the appropriate conformity assessment procedure referred to in Article 17 has been carried out by the manufacturer.
    They shall ensure that the manufacturer has drawn up the technical documentation, that the pyrotechnic article bears the CE marking and is accompanied by the required documents, and that the manufacturer
    has complied with the requirements set out in Article 8(5) and (6).


    Where an importer considers or has reason to believe that a pyrotechnic article is not in conformity with the essential safety requirements set out in Annex I, he shall not place the pyrotechnic article
    on the market until it has been brought into conformity. Furthermore, where the pyrotechnic article presents a risk, the importer shall inform the manufacturer and the market surveillance authorities
    to that effect.


    3.   Importers shall indicate on the pyrotechnic article their name, registered trade name or registered trade mark and the postal address at which they can be contacted or, where that is not possible,
    on its packaging or in a document accompanying the pyrotechnic article. The contact details shall be in a language easily understood by end-users and market surveillance authorities.


    4.   Importers shall ensure that the pyrotechnic article is accompanied by instructions and safety information in a language which can be easily understood by consumers and other end-users, as determined
    by the Member State concerned.


    5.   Importers shall ensure that, while a pyrotechnic article is under their responsibility, its storage or transport conditions do not jeopardise its compliance with the essential safety requirements
    set out in Annex I.


    6.   When deemed appropriate with regard to the risks presented by a pyrotechnic article, importers shall, to protect the health and safety of consumers, upon a duly justified request of the competent
    authorities, carry out sample testing of pyrotechnic articles made available on the market, investigate, and, if necessary, keep a register of complaints, of non-conforming pyrotechnic articles and
    pyrotechnic articles recalls, and shall keep distributors informed of any such monitoring.


