    29.6.2022 EN Official Journal of the European Union C 247/5

    PREFACE

    The Guide to the implementation of directives based on the New Approach and the Global Approach (the ‘Blue Guide’) was

    published in 2000. Since then, it has become one of the main reference documents explaining how to implement the

    legislation based on the New Approach, now covered by the New Legislative Framework (NLF). The Guide has the

    ambition of explaining the different elements of the NLF as well as of market surveillance.

    The ‘Blue Guide’ was revised in 2014 to cover new developments and to ensure the broadest possible common

    understanding on implementation of the NLF for the marketing of products. It was further revised and adapted in 2016.

    This new version of the Guide builds on the past editions, but also reflects recent changes in the legislation and in particular

    the adoption of a new Regulation on Market Surveillance(1).

    IMPORTANT NOTICE

    This Guide is intended to contribute to a better understanding of EU product rules and to their more uniform and coherent

    application across different sectors and throughout the single market. It is addressed to the Member States and others who

    need to be informed of the provisions designed to ensure the free circulation of products as well as a high level of protection

    throughout the Union (e.g. trade and consumer associations, standardisation bodies, manufacturers, importers, distributors,

    conformity assessment bodies and trade unions). It is built on consultation among all the interested parties.

    This is intended purely as a guidance document – only the text of the Union harmonisation act itself has legal force. In

    certain cases, there may be differences between the provisions of a Union harmonisation act and the contents of this

    Guide, in particular where slightly divergent provisions in the individual Union harmonisation act cannot be fully

    described in this Guide. The binding interpretation of EU legislation is the exclusive competence of the Court of Justice of

    the European Union. The views expressed in this Guide cannot prejudge the position that the Commission might take

    before the Court of Justice. Neither the European Commission nor any person acting on behalf of the Commission is

    responsible for the use which might be made of the following information.

    This Guide applies to the EU Member States but also to Iceland, Liechtenstein and Norway as signatories of the Agreement

    on the European Economic Area (EEA), as well as Switzerland and Turkey in certain cases. References to the Union or the

    single market are, accordingly, to be understood as referring to the EEA, or to the EEA market.

    As this Guide reflects the legislation at the time of its drafting, the guidance offered may be subject to later modification.

    1. REGULATING THE FREE MOVEMENT OF GOODS

    1.1. A historical perspective

    The objectives of the first harmonisation directives focused on the elimination of barriers and on the free movement of

    goods in the single market. These objectives are now being complemented by a comprehensive policy geared to ensuring

    that only safe and otherwise compliant products find their way on to the market, in such a way that honest economic

    operators can benefit from a level playing field, thus promoting at the same time an effective protection of EU consumers

    and professional users and a competitive single EU market.

    Policies and legislative techniques have evolved over the last 40 years of European integration, especially in the area of the

    free movement of goods, thereby contributing to the success of the Single Market today.

    Historically, EU legislation for goods has progressed through five main phases:

    — the traditional approach or ‘Old Approach’ with detailed texts containing all the necessary technical and administrative

    requirements;

    — the ‘New Approach’ developed in 1985, which restricted the content of legislation to ‘essential requirements’ leaving the

    technical details to European harmonised standards. This in turn led to the development of European standardisation

    policy to support this legislation;

    (1) Regulation (EU) 2019/1020 of the European Parliament and of the Council of 20 June 2019 on market surveillance and compliance of

    products and amending Directive 204/42/EC and Regulations (EC) No 765/2008 and (EU) No 305/2011 (OJ L 169, 25.6.2019, p. 1).

    C 247/6 EN Official Journal of the European Union 29.6.2022

    — the development of the conformity assessment instruments made necessary by the implementation of the various

    Union harmonisation acts, both New Approach and Old Approach;

    — the ‘New Legislative Framework’(2)adopted in July 2008, which built on the New Approach and completed the overall

    legislative framework with all the necessary elements for effective conformity assessment, accreditation and market

    surveillance including the control of products from outside the Union;

    — the adoption of a new Regulation on Market Surveillance(3) and a new Regulation on Mutual Recognition of goods

    lawfully marketed in another Member State(4)in 2019.

    1.1.1. The ‘Old Approach’

    The Old Approach reflected the traditional manner in which national authorities drew up technical legislation, going into

    great detail - usually motivated by a lack of confidence in the rigour of economic operators on issues of public health and

    safety. In certain sectors (e.g. legal metrology) this even led public authorities to deliver certificates of conformity

    themselves. The unanimity required in this field until 1986 made the adoption of such legislation very unwieldy and the

    continued recourse to this technique in a number of sectors is often justified for reasons of public policy (e.g. food

    legislation) or by international traditions and/or agreements which cannot be changed unilaterally (e.g. automobile

    legislation or food again).

    The first attempt to break out of this situation came with the adoption of Directive 83/189/EEC(5) on 28 March 1983

    setting up an information procedure between the Member States and the Commission to avoid the creation of new

    technical barriers to the free movement of goods, which would take a long time to correct through the harmonisation

    process.

    Under that Directive, Member States are obliged to notify draft national technical regulations to other Member States and

    the Commission (and national standardisation bodies (NSB) were obliged to notify draft national standards(6) to the

    Commission, to the European standardisation organisations (ESO) and to other national standardisation bodies). During a

    standstill period, these technical regulations may not be adopted, leaving the Commission and the other Member States the

    possibility to react. In the absence of reactions within the initial standstill period of three months, the draft technical

    regulations may then be adopted. Otherwise, where objections are raised, a further three month standstill is imposed.

    The standstill period is 12 months in the presence of a proposal for a Union harmonisation act in the area in question.

    However, the standstill period does not apply where a Member State is obliged to introduce technical regulations urgently

    to protect public health or safety, animals or plants.

    1.1.2. Mutual Recognition and Regulation (EU) 2019/515 on the Mutual Recognition of Goods

    Alongside legislative initiatives to prevent new barriers and promote the free movement of goods, the systematic

    application of the principle of mutual recognition enshrined in EU law was also pursued. National technical regulations are

    subject to the provisions of Articles 34 to 36 of the Treaty on the Functioning of the European Union (TFEU)(7), which

    (2) Regulation (EC) No 765/2008 of the European Parliament and of the Council of 9 July 2008 setting out the requirements for

    accreditation and market surveillance relating to the marketing of products and repealing Regulation (EEC) No 339/93 (OJ L 218,

    13.8.2008, p. 30) and Decision No 768/2008/EC of the European Parliament and of the Council of 9 July 2008 on a common

    framework for the marketing of products, and repealing Council Decision 93/465/EEC (OJ L 218, 13.8.2008, p. 82).

    (3) Regulation (EU) 2019/1020.

    (4) Regulation (EU) 2019/515 of the European Parliament and of the Council of 19 March 2019 on the mutual recognition of goods

    lawfully marketed in another Member State and repealing Regulation (EC) No 764/2008 (OJ L 91, 29.3.2019, p. 1).

    (5) Now superseded by Directive (EU) 2015/1535 of the European Parliament and of the Council of 9 September 2015 laying down a

    procedure for the provision of information in the field of technical regulations and of rules on Information Society services (OJ L 241,

    17.9.2015, p. 1).

    (6) Since 1.1.2013 and under Regulation (EU) No 1025/2012 each national standardisation body is obliged to make its work programme

    publicly available and to notify the existence thereof to the other national standardisation bodies, to the European standardisation

    organisation and to the Commission.

    (7) For further information see the ‘Commission Notice - Guide on Articles 34-36 of the Treaty on the Functioning of the European Union

    (TFEU)’ C(2021)1457 and available here https://ec.europa.eu/docsroom/documents/44906/attachments/2/translations/en/renditions/

    nativeand https://ec.europa.eu/docsroom/documents/44906/attachments/3/translations/en/renditions/native

    29.6.2022 EN Official Journal of the European Union C 247/7

    prohibit quantitative restrictions or measures having equivalent effect. Case law of the Court of Justice, especially case

    120/78 (the ‘Cassis de Dijon’ case(8)), provides the key elements for mutual recognition. The effect of this case law is as

    follows.

    — Products lawfully marketed in one Member State should in principle move freely throughout the Union.

    — In the absence of Union harmonisation legislation, Member States are free to legislate on their territory subject to the

    Treaty rules on free movement of goods (Arts. 34 – 36 TFEU).

    — Barriers to free movement of goods which result from differences in national legislation may only be accepted if:

    1) the national rule of the Member State of destination pursues a legitimate public interest objective, and

    2) the measure restricting or denying access is proportionate, meaning that the measure is appropriate for securing the

    attainment of the objective and necessary (it does not go beyond what is necessary for attaining the objective).

    To help implement these principles, the European Parliament and the Council adopted Regulation (EC) No 764/2008 of

    9 July 2008 laying down procedures relating to the application of certain national technical rules to products lawfully

    marketed in another Member State and repealing Decision 3052/95/EC(9). This Regulation has now been replaced by

    Regulation (EU) 2019/515.

    Regulation (EU) 2019/515 on the mutual recognition of goods lawfully marketed in another Member State applies as of

    19 April 2020. It introduces the following points to facilitate the application of the principle of mutual recognition(10):

    1. A voluntary ‘mutual recognition declaration’, which businesses can use to demonstrate that their products are lawfully

    marketed in another Member State;

    2. A business-friendly problem solving procedure, based on SOLVIT, which helps businesses when mutual recognition is

    denied;

    3. Stronger administrative cooperation to improve the application of the mutual recognition principle;

    4. More information to businesses through ‘product contact points’ and the ‘single digital gateway’.

    However, while contributing greatly to the free movement of goods within the single market, the mutual recognition

    principle cannot solve all the problems and there remains, even today, room for further harmonisation.

    1.1.3. The ‘New Approach’ and the ‘Global Approach’

    The Cassis de Dijon case is well known for its important role in promoting the mutual recognition pri'
