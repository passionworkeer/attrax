    — providing information and carrying out activities to promote compliance;

    — providing more effective enforcement tools to address online sales; and

    — improving cooperation: between Member States, between market surveillance and customs authorities, and through an

    EU product compliance network.

    Regulation (EU) 2019/1020 also provides a comprehensive framework for controls on all products (in harmonised and

    non-harmonised areas) entering the EU market. That framework applies to products covered by EU law in so far as there

    are no specific provisions relating to the organisation of controls on products entering the EU market in EU law (see Article

    2(2) of Regulation (EU) 2019/1020. This Guide addresses market surveillance in relation to products subject to

    harmonisation legislation and therefore focuses, for the external dimension, on the control of products covered by

    harmonisation legislation entering the EU.

    1.2.2. The legal nature of the NLF acts and the Market Surveillance legislation and their relationship to other EU

    legislation

    1.2.2.1. Regulation (EC) No 765/2008 and Regulation (EU) 2019/1020

    Regulation (EC) No 765/2008 imposes clear obligations on Member States who do not have to transpose its provisions

    (although many may have to take national measures to adapt their national legal framework). Its provisions are directly

    applicable to the Member States, to all the economic operators concerned (manufacturers, distributors, importers) and to

    conformity assessment bodies and accreditation bodies. Economic operators now have not only obligations but direct

    rights that they can enforce through the national courts against both national authorities and other economic operators

    for non-respect of the provisions of the Regulation. While the provisions on accreditation and CE marking remain

    applicable, the provisions on market surveillance in Regulation (EC) No 765/2008 have been repealed and replaced by

    Regulation (EU) 2019/1020.

    In the presence of other EU legislation, both Regulations apply first and foremost, a) on the basis of being directly applicable

    i.e. national authorities and economic operators must apply the provisions of these Regulations as such (most of the other

    legislation is contained in directives) and b) on the basis of the lex specialis rule i.e. whenever a matter is regulated by two

    rules, the more specific one should be applied first.

    In the absence of more specific legislation on the issues covered by its provisions, Regulation (EC) No 765/2008 will apply

    at the same time, with, and as a complement to, existing legislation. Similarly, Regulation (EU) 2019/1020 is based on the

    lex specialis principle, providing that this Regulation applies insofar as there are no specific provisions with the same

    objective in Union harmonisation legislation, which regulate in a more specific manner particular aspects of market

    surveillance and enforcement (Article 2(1) of Regulation (EU) 2019/1020). Where existing legislation contains similar

    provisions as the Regulation, the corresponding provisions will have to be examined on a one to one basis to determine

    which is the most specific.

    In general terms, relatively few EU legislative texts contain provisions relating to accreditation, so it can be said that

    Regulation (EC) No 765/2008 is of general application in this area. In the area of market surveillance (including the

    control of products from third countries) the situation is more complex, as some Union harmonisation legislation does

    have various provisions relating to the issues covered by Regulation (EU) 2019/1020 (e.g. legislation on medical devices

    and on in vitro diagnostic medical devices which provides for a specific information procedure). In many cases, the market

    surveillance provisions in Union harmonisation legislation are complementary and provisions of Regulation (EU)

    2019/1020 remain applicable.

    1.2.2.2. Decision No 768/2008/EC

    Decision No 768/2008/EC is what is referred to as a sui generis decision, meaning that it has no addressees and therefore is

    neither directly nor indirectly applicable. It constitutes a political commitment on the part of the three EU institutions,

    European Parliament, Council and Commission.

    This means that for its provisions to apply in Union law, they have to be either referred to expressis verbis (expressly) in future

    legislation or integrated into it.

    C 247/12 EN Official Journal of the European Union 29.6.2022

    The three institutions have indeed committed themselves to adhere to and to have recourse as systematically as possible to

    its provisions when drawing up product related legislation. Thus, relevant future proposals are to be examined in the light

    of the Decision and departures from its contents, duly justified.

    1.2.3. How the system fits together

    The evolution of EU legislative techniques in this area has been progressive, tackling issues one after another, although

    sometimes in parallel, culminating in the adoption of the New Legislative Framework: essential or other legal

    requirements, product standards, standards and rules for the competence of conformity assessment bodies as well as for

    accreditation, standards for quality management, conformity assessment procedures, CE marking, accreditation policy, and

    lately market surveillance policy including the control of products from third countries.

    The New Legislative Framework now constitutes a complete system bringing together all the different elements that need to

    be dealt with in product safety legislation in a coherent, comprehensive legislative instrument that can be used across the

    board in all industrial sectors, and even beyond (environmental and health policies also have recourse to a number of these

    elements), whenever EU legislation is required.

    In this system, the legislation has to set the levels of public protection objectives of the products concerned as well as the

    basic safety characteristics, it should set the obligations and requirements for economic operators, it has to set-where

    necessary-the level of competence of the third party conformity assessment bodies who assess products or quality

    management systems, as well as the control mechanisms for these bodies (notification and accreditation), it must

    determine which are the appropriate conformity assessment processes (modules which also include the manufacturer’s

    Declaration of Conformity) to be applied, and finally it must impose the appropriate market surveillance mechanisms

    (internal and external) to ensure that the whole legislative instrument operates in an effective and seamless manner.

    All these different elements are interlinked, operate together and are complementary, forming an EU quality(20)chain. The

    quality of the product depends on the quality of the manufacturing, which in many instances is influenced by the quality

    of testing, internal or carried out by external bodies, which depends on the quality of the conformity assessment processes,

    which depends on the quality of the bodies which in turn depends on the quality of their controls, which depends on the

    quality of notification or accreditation; the entire system depending on the quality of m'
