    2024/1781


    28.6.2024


    REGULATION (EU) 2024/1781 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 13 June 2024



    establishing a framework for the setting of ecodesign requirements for sustainable products, amending Directive (EU) 2020/1828 and Regulation (EU) 2023/1542 and repealing Directive 2009/125/EC


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 114 thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    The European Green Deal set out in the communication of the Commission of 11 December 2019 is Europe’s sustainable growth strategy and aims to transform the Union into a fair and prosperous society,
    with a modern, competitive, climate-neutral and circular economy and toxic-free environment. It sets the ambitious objective of ensuring that the Union becomes the first climate neutral continent by
    2050. It recognises the advantages of investing in the Union’s competitive sustainability by building a fairer, greener and more digital Europe. Products have a pivotal role to play in this green transition.
    Underlining that current production processes and consumption patterns remain too linear and dependent on a throughput of new materials extracted, traded and processed into goods that are finally disposed
    of as waste or emissions, the European Green Deal emphasises the urgent need to transition to a circular economy model and stresses the significant progress that remains to be made. It also identifies
    energy efficiency as a priority for the decarbonisation of the energy sector and for reaching the climate objectives in 2030 and 2050.


    (2)


    To accelerate the transition to a circular economy model, the Commission designed a future-oriented agenda in its communication of 11 March 2020 on a new Circular Economy Action Plan for a cleaner and
    more competitive Europe (CEAP), with the objective of making the regulatory framework fit for a sustainable future. The CEAP underlines that, ‘for citizens, the circular economy will provide high-quality,
    functional and safe products, which are efficient and affordable, last longer and are designed for reuse, repair, and high-quality recycling’. As set out in CEAP, there is currently no comprehensive
    set of requirements to ensure that all products placed on the Union market become increasingly sustainable and stand the test of circularity. In particular, product design does not sufficiently promote
    sustainability over the whole life cycle. As a result, products are being replaced frequently, involving significant energy and resource use in order to produce and distribute new products and dispose
    of old ones. It is still too difficult for economic operators and citizens to make sustainable choices in relation to products, given that relevant information and affordable options to do so are lacking.
    This leads to missed opportunities for sustainability and for value-retaining operations, limited demand for secondary materials and obstacles to the adoption of circular business models.


    (3)


    A fully functioning internal market for sustainable products is a pre-requisite for the establishment of a circular economy in the Union. Common ecodesign requirements at Union level would enable the
    development, deployment and scaling-up of new circular economy business models throughout the internal market. Such measures would also alleviate the burden on companies and provide industry and consumers
    with access to reliable and clear data, thereby allowing for more sustainable choices to be made.


    (4)


    The communication of the Commission of 10 March 2020 on a New Industrial Strategy for Europe sets out the Union’s overarching ambition to foster a ‘twin transition’ to climate neutrality and digital
    leadership. It echoes the European Green Deal in pointing to the leading role that Europe’s industry must play in that, by reducing its carbon footprint and material footprint and embedding circularity
    across the economy, and underlines the need to move away from traditional models, and revolutionise the way we design, make, use and dispose of products, as well as the need for a secure supply of raw
    materials. Recycling and the use of secondary raw materials will help reduce the Union''s dependency. The communication of the Commission of 5 May 2021 on Updating the 2020 New Industrial Strategy:
    Building a stronger Single Market for Europe’s recovery reinforces the main messages of the 2020 Strategy and focuses on the lessons from the COVID-19 crisis, including the need to foster resilience.


    (5)


    In the absence of Union law, diverging national approaches in improving the environmental sustainability of products have already emerged, ranging from information requirements concerning the duration
    of software compatibility of electronic devices to reporting obligations on handling unsold durable goods. This is an indication that further national efforts to achieve the aims pursued by this Regulation
    would likely lead to further fragmentation of the internal market. Therefore, in order to contribute to the functioning of the internal market while ensuring a high level of environmental protection,
    an ambitious regulatory framework to progressively introduce ecodesign requirements for products is needed. This Regulation will establish such a framework, by making the ecodesign approach initially
    set out in Directive 2009/125/EC of the European Parliament and of the Council

    (

    3

    )

    applicable to the broadest possible range of products.


    (6)


    This Regulation will support production and consumption patterns that are aligned with the Union’s overall sustainability targets, including climate, environmental, energy, resource-use and biodiversity
    targets, while staying within planetary boundaries, by establishing a legislative framework which contributes to enabling products fit for a climate-neutral, resource-efficient and circular economy,
    reducing waste and ensuring that the performance of frontrunners in sustainability progressively becomes the norm. It should provide for the setting of new ecodesign requirements to improve product
    durability, reliability, repairability, upgradability, reusability and recyclability, improve possibilities for the refurbishment and maintenance of products, address the presence of hazardous chemicals
    in products, increase the energy and resource efficiency of products, including with regard to the possibility of recovery of strategic and critical raw materials, reduce their expected generation of
    waste and increase the recycled content in products, while ensuring their performance and safety, enabling remanufacturing and high-quality recycling and reducing carbon and environmental footprints.


    (7)


    Ecodesign requirements should also address practices associated with premature obsolescence. Such practices have an overall negative impact on the environment, in the form of increased waste and use
    of energy and materials, which can be reduced through ecodesign requirements while contributing to sustainable consumption.


    (8)


    The European Parliament, in its resolution of 25 November 2020‘Towards a more sustainable single market for business and consumers’

    (

    4

    )

    , welcomed promoting durable products which are easier to repair, reuse and recycle. In its resolution of 10 February 2021 on the New Circular Economy Action Plan

    (

    5

    )

    , the European Parliament underlined that sustainable, circular, safe and non-toxic products and materials should become the norm in the Union market and not the exception and should be seen as the
    default choice, which is attractive, affordable and accessible for all consumers. The European Parliament also called for Union binding targets to significantly reduce Union material and consumption
    footprints. It considered that the transition to a circular economy can provide solutions to address the current environmental challenges and the economic crisis brought about by the COVID-19 pandemic.
    The Council, in its conclusions on ‘Making the Recovery Circular and Green’ adopted on 11 December 2020, also welcomed the Commission’s intention to submit legislative proposals as part of a comprehensive
    and integrated sustainable product policy framework that promotes climate neutrality, energy and resource efficiency and a non-toxic circular economy, protects public health and biodiversity, and empowers
    and protects consumers and public buyers.


    (9)


    This Regulation will contribute to achieving the Union’s climate and energy objectives. In line with the goals set out in the Paris Agreement, adopted on 12 December 2015 under the United Nations Framework
    Convention on Climate Change

    (

    6

    )

    (the ‘Paris Agreement’), and approved by the Union on 5 October 2016

    (

    7

    )

    , Regulation (EU) 2021/1119 of the European Parliament and of the Council

    (

    8

    )

    establishes a binding Union domestic reduction commitment of net greenhouse gas emissions of at least 55 % by 2030 and enshrines in legislation the target of economy-wide climate neutrality by 2050.
    In 2021, the Commission adopted the Fit for 55 Package to make the Union’s climate and energy policies fit for achieving these objectives. To do so, in line with the energy efficiency first principle
    enshrined in Directive (EU) 2018/2002 of the European Parliament and of the Council

    (

    9

    )

    , energy efficiency improvements need to be significantly stepped up, to around 36 % in terms of final energy consumption by 2030. Product requirements established under this Regulation will play a significant
    role in the reaching of that target by substantially decreasing products’ energy footprint. Those energy efficiency requirements will also reduce consumer vulnerability to energy price increases. As
    recognised by the Paris Agreement, improving the sustainability of consumption and production will also play an important role in addressing climate change.


    (10)


    This Regulation will also contribute to achieving the Union’s wider environmental objectives. The 8th Environment Action Programme established by Decision (EU) 2022/591 of the European Parliament and
    of the Council

    (

    10

    )

    enshrines in a legal framework the Union’s objective of staying within the planetary boundaries and identifies enabling conditions to achieve priority objectives, which include the transition to a non--toxic
    circular economy. The European Green Deal also calls for the Union to better monitor, report, prevent and remedy air, water, soil and consumer products pollution. This means that chemicals, materials
    and products have to be safe and sustainable by design and during their life cycle, leading to non-toxic material cycles as set out in the communication of the Commission of 12 May 2021 on an EU Action
    Plan: ‘Towards Zero Pollution for Air, Water and Soil’ and the communication of the Commission of 14 October 2020 on a Chemicals Strategy for Sustainability — Towards a Toxic-Free Environment, which
    calls for the zero pollution ambition in production and consumption to be embraced. In addition, both the European Green Deal and the CEAP recognise that the Union internal market provides a critical
    mass that is able to influence global standards on product sustainability and product design. This Regulation will therefore play a significant role towards achieving several targets established under
    the Sustainable Development Goals of the United Nations 2030 Agenda for Sustainable Development, both inside and outside the Union, in particular targets under Sustainable Development Goal 12 (‘Responsible
    consumption and production’).


    (11)


    Directive 2009/125/EC established a f'
- id: art-2
  title: Article 14 of Regulation (EU) 2019/1020 provides market surveillance authorities with the power, where no other effective means are available to eliminate a serious risk, to require the removal
    of con
  text: 'Article 14 of Regulation (EU) 2019/1020 provides market surveillance authorities with the power, where no other effective means are available to eliminate a serious risk, to require the removal
    of content referring to non-compliant products from an online interface. The powers entrusted to market surveillance authorities by that Regulation should also apply in the context of this Regulation.
    However, for effective market surveillance under this Regulation and to avoid non-compliant products being present on the Union market, those powers should apply in all necessary and proportionate cases,
    including for products presenting a less than serious risk. Those powers should be exercised in accordance with Article 9 of Regulation (EU) 2022/2065.


    (73)


    Ensuring a product’s traceability throughout the whole supply chain facilitates the market surveillance authorities’ task of tracing economic operators that placed on the market or made available on
    the market non-compliant products. Economic operators should therefore be required to keep the information on their transactions for a certain period of time.


    (74)


    To speed up and facilitate the verification of compliance of products placed on the market, the power to adopt acts in accordance with Article 290 TFEU should be delegated to the Commission to supplement
    this Regulation by requiring economic operators, where necessary, to make specific parts of the technical documentation digitally available both to competent national authorities and to the Commission.
    This would allow competent national authorities to access such information without request, while continuing to guarantee the protection of trade secrets and intellectual property rights. Possible means
    of making such information digitally available should as a rule include a digital product passport, or via inclusion in the compliance part of the product database referred to in Regulation (EU) 2017/1369,
    or on a website of the economic operator. Such an obligation should not take away from the competent national authorities’ right to access other parts of the technical documentation on request.


    (75)


    In order to allow for a better estimation of relevant products’ market penetration, to better inform studies feeding into the drafting or updating of ecodesign requirements and working plans, and to
    help identify the market share of specific product groups in order to speed up the formulation or review of ecodesign requirements, the power to adopt acts in accordance with Article 290 TFEU should
    be delegated to the Commission to supplement this Regulation by requiring the collection of adequate and reliable data on the sale of products, by allowing the collection of such data by or on behalf
    of the Commission directly from manufacturers or retailers. When adopting rules on monitoring and reporting, the Commission should take into account the need to maximise the available data on market
    penetration and the need to minimise the administrative burden for economic operators, especially for SMEs.


    (76)


    In order to improve future ecodesign requirements and improve end users’ confidence with regard to identifying and correcting deviations between energy in-use and other performance parameters when measured
    under test conditions and actual functioning, the Commission should have access to non-personal data about products’ actual energy consumption while in use and where relevant to other performance parameters.
    To that end, the power to adopt delegated acts in accordance with Article 290 TFEU should be delegated to the Commission to supplement this Regulation by requiring that individual products, similarly
    to road vehicles, record their consumption and other relevant performance parameters and display the related data to the end user. For products connected to the internet, the power to adopt delegated
    acts should be delegated to the Commission to supplement this Regulation by requiring economic operators to remotely collect non-personal in-use data and report those data to the Commission, as it is
    essential to identify how the products perform and to inform the public. For products whose in-use performance depends significantly also on climatic or geographical conditions, general climatic or
    geographical information should also be collected and reported, in a way that does not allow the specific location of individual appliances to be determined. End users should expressly agree to the
    collection of information that they consider is appropriate to share. Collection of information about the behaviour of appliances that occurs in a context in which an individual can reasonably expect
    that no observation or recording is taking place, or collection of information which could provide or which could allow the identification of individuals or the inference of their behaviour should not
    be allowed.


    (77)


    In order to help to facilitate the verification of compliance with ecodesign requirements, including to facilitate conformity assessment and market surveillance, the Commission should be empowered to
    require, where duly justified, that supply chain actors provide, free of charge, information on what they supply, such as the quantity and type or chemical composition of materials used or the production
    process employed, or information on the conditions of the provision of their services. It should also be possible to allow manufacturers to have access to the documents containing such information or
    to the actual facilities of the supply chain actors so that they can access directly the necessary information if the supply chain actors do not provide the information requested within a reasonable
    time. The Commission should also be empowered to enable notified bodies and national authorities to verify the accuracy of the information related to the activities of the supply chain actors.


    (78)


    In order to ensure the effective and harmonised application of ecodesign requirements set under this Regulation, including on aspects such as energy use or efficiency, durability and reliability, and
    recycled content, compliance with those requirements should be measured using reliable, accurate and reproducible methods that take into account the generally recognised state-of-the-art methods. Delegated
    acts setting ecodesign requirements for products should as a rule include the specifications for tests, measurements or calculations needed to establish or verify compliance. In addition, the power
    to adopt acts in accordance with Article 290 TFEU should be delegated to the Commission to supplement this Regulation by requiring the use of digital tools reflecting applicable calculation requirements,
    in order to ensure their harmonised application.


    (79)


    In order to ensure that ecodesign requirements achieve their intended effects, this Regulation should set out comprehensive and overarching provisions which are applicable to all products covered by
    ecodesign requirements and prohibit the circumvention of such requirements. Therefore, any practice leading to an unjustified alteration of the product’s performance during compliance testing, or within
    a short period after putting the product into service, leading to a declared performance that misrepresents the product’s actual performance while in use should be prohibited.


    (80)


    Where appropriate, it should be possible for delegated acts setting ecodesign requirements to refer to the use of standards to establish or verify compliance. In order to ensure that there are no barriers
    to trade on the internal market, such standards should be harmonised at Union level. Once a reference to such standards has been adopted in accordance with Regulation (EU) No 1025/2012 of the European
    Parliament and of the Council

    (

    46

    )

    and published in the

    Official Journal of the European Union

    , products in conformity with such standards should be considered in conformity with ecodesign requirements adopted pursuant to this Regulation to the extent that they are covered by the relevant harmonised
    standards. Similarly, methods for tests, measurement or calculation that are in conformity with harmonised standards should be considered in conformity with the requirements for test, measurement and
    calculation methods set out in the relevant delegated acts laying down ecodesign requirements, to the extent that they are covered by the relevant harmonised standards.


    (81)


    The current Union standardisation framework, which is based on the New Approach principles set out in Council Resolution of 7 May 1985 on a new approach to technical harmonization and standards

    (

    47

    )

    and on Regulation (EU) No 1025/2012, represents the framework by default to elaborate standards that provide for a presumption of conformity with the relevant requirements set out in this Regulation.
    In the absence of relevant references to harmonised standards, the Commission should be able to adopt implementing acts establishing common specifications as an exceptional fall-back solution to facilitate
    compliance with ecodesign requirements by the manufacturer, for instance when the standardisation process is blocked due to a lack of consensus between stakeholders or where there are delays in establishing
    a harmonised standard and the prescribed deadline cannot be respected. Such delays could for example occur when the required quality is not reached. In addition, recourse to this solution should be
    possible where the Commission has restricted or withdrawn the references to relevant harmonised standards in line with Regulation (EU) No 1025/2012. Compliance with common specifications should also
    give rise to the presumption of conformity. In order to ensure efficiency, the Commission should involve relevant stakeholders in the process of establishing the common specifications that cover the
    ecodesign requirements adopted pursuant to this Regulation.


    (82)


    In order to enable economic operators to demonstrate, and competent authorities to verify, that products made available on the market comply with the ecodesign requirements adopted pursuant to this
    Regulation, the power to adopt acts in accordance with Article 290 TFEU should be delegated to the Commission to supplement this Regulation by laying down conformity assessment procedures that are appropriate
    and proportionate to the nature of the product concerned and of the product parameters regulated. To ensure consistency with other Union law, the conformity assessment procedures should be chosen from
    among those of the internal production control module included in this Regulation and of the modules included in Decision No 768/2008/EC of the European Parliament and of the Council

    (

    48

    )

    , ranging from the least stringent to the most stringent. To further ensure that the applicable module is appropriate and proportionate to the nature of the product concerned and of the product parameters
    regulated, the Commission should, where necessary, adapt the module chosen accordingly.


    (83)


    Manufacturers should draw up an EU declaration of conformity to provide information on the conformity of products with this Regulation. Manufacturers could also be required by other Union law to draw
    up an EU declaration of conformity. To ensure effective access to information for market surveillance purposes, a single EU declaration of conformity should be drawn up in respect of all Union law.
    To reduce the administrative burden on economic operators, it should be possible for that single EU declaration of conformity to be a dossier made up of relevant individual EU declarations of conformity.


    (84)


    Regulation (EC) No 765/2008 of the European Parliament and of the Council

    (

    49

    )

    lays down rules on the accreditation of conformity assessment bodies and sets out general principles governing the CE marking and its relationship to other markings. That Regulation should be applicable
    to products covered by this Regulation in order to ensure that products benefiting from the free movement of good'
- id: art-3
  title: CHAPTER I
  text: 'CHAPTER I


    GENERAL PROVISIONS'
- id: art-4
  title: Article 1
  text: 'Article 1


    Subject matter and scope


    1.   This Regulation establishes a framework for the setting of ecodesign requirements that products have to comply with to be placed on the market or put into service, with the aim of improving the
    environmental sustainability of products in order to make sustainable products the norm and to reduce the overall carbon footprint and environmental footprint of products over their life cycle, and
    of ensuring the free movement of sustainable products within the internal market.


    This Regulation also establishes a digital product passport, provides for the setting of mandatory green public procurement requirements and creates a framework to prevent unsold consumer products from
    being destroyed.


    2.   This Regulation applies to any physical goods that are placed on the market or put into service, including components and intermediate products. However, it does not apply to:


    (a)


    food as defined in Article 2 of Regulation (EC) No 178/2002;


    (b)


    feed as defined in Article 3(4) of Regulation (EC) No 178/2002;


    (c)


    medicinal products as defined in Article 1(2) of Directive 2001/83/EC;


    (d)


    veterinary medicinal products as defined in Article 4(1) of Regulation (EU) 2019/6;


    (e)


    living plants, animals and micro-organisms;


    (f)


    products of human origin;


    (g)


    products of plants and animals relating directly to their future reproduction;


    (h)


    vehicles as referred to in Article 2(1) of Regulation (EU) No 167/2013, in Article 2(1) of Regulation (EU) No 168/2013 and in Article 2(1) of Regulation (EU) 2018/858, in respect of those product aspects
    for which requirements are set under sector-specific Union legislative acts applicable to those vehicles.'
- id: art-5
  title: Article 2
  text: 'Article 2


    Definitions


    For the purposes of this Regulation, the following definitions apply:


    (1)


    ‘product’ means any physical goods that are placed on the market or put into service;


    (2)


    ‘component’ means a product intended to be incorporated into another product;


    (3)


    ‘intermediate product’ means a product that requires further manufacturing or transformation such as mixing, coating or assembling to make it suitable for end-users;


    (4)


    ‘energy-related product’ means any product that has an impact on energy consumption during use;


    (5)


    ‘product group’ means a set of products that serve similar purposes and are similar in terms of use, or have similar functional properties, and are similar in terms of consumer perception;


    (6)


    ‘ecodesign’ means the integration of environmental sustainability considerations into the characteristics of a product and the processes taking place throughout the product’s value chain;


    (7)


    ‘ecodesign requirement’ means a performance requirement or an information requirement aimed at making a product, including processes taking place throughout the product’s value chain, more environmentally
    sustainable;


    (8)


    ‘performance requirement’ means a quantitative or non-quantitative requirement for or in relation to a product to achieve a certain performance level in relation to a product parameter referred to in
    Annex I;


    (9)


    ‘information requirement’ means an obligation for a product to be accompanied by information as specified in Article 7(2);


    (10)


    ‘supply chain’ means all upstream activities and processes of the product’s value chain, up to the point where the product reaches the customer;


    (11)


    ‘value chain’ means all activities and processes that are part of the life cycle of a product, as well as its possible remanufacturing;


    (12)


    ‘life cycle’ means the consecutive and interlinked stages of a product’s life, consisting of raw material acquisition or generation from natural resources, pre-processing, manufacturing, storage, distribution,
    installation, use, maintenance, repair, upgrading, refurbishment and reuse, and end-of-life;


    (13)


    ‘end-of-life’ means the life cycle stage that begins when a product is discarded and ends when the waste material of the product is returned to nature or enters another product’s life cycle;


    (14)


    ‘environmental impact’ means any change to the environment, whether adverse or beneficial, wholly or partially resulting from a product during its life cycle;


    (15)


    ‘class of performance’ means a range of performance levels in relation to one or more product parameters referred to in Annex I, which is established based on a common methodology for the product or
    product group, ordered in such a way as to allow for product differentiation;


    (16)


    ‘remanufacturing’ means actions through which a new product is produced from objects that are waste, products or components and through which at least one change is made that substantially affects the
    safety, performance, purpose or type of the product;


    (17)


    ‘upgrading’ means actions carried out to enhance the functionality, performance, capacity, safety or aesthetics of a product;


    (18)


    ‘refurbishment’ means actions carried out to prepare, clean, test, service and, where necessary, repair a product or a discarded product in order to restore its performance or functionality within the
    intended use and range of performance originally conceived at the design stage at the time of the placing of the product on the market;


    (19)


    ‘maintenance’ means one or more actions carried out to keep a product in a condition where it is able to fulfil its intended purpose;


    (20)


    ‘repair’ means one or more actions carried out to return a defective product or waste to a condition where it fulfils its intended purpose;


    (21)


    ‘premature obsolescence’ means a product design feature or subsequent action or omission resulting in the product becoming non-functional or performing less well without such changes of functionality
    or performance being the result of normal wear and tear;


    (22)


    ‘durability’ means the ability of a product to maintain over time its function and performance under specified conditions of use, maintenance and repair;


    (23)


    ‘reliability’ means the probability that a product functions as required under given conditions for a given duration without an occurrence which results in a primary or secondary function of the product
    no longer being performed;


    (24)


    ‘environmental footprint’ means a quantification of the environmental impacts resulting from a product throughout its life cycle, whether in relation to a single environmental impact category or an
    aggregated set of impact categories based on the Product Environmental Footprint method established by Recommendation (EU) 2021/2279 or other scientific methods developed by international organisations,
    widely tested in collaboration with different industry sectors and adopted or implemented by the Commission in other Union law;


    (25)


    ‘carbon footprint’ means the sum of greenhouse gas emissions and greenhouse gas removals in a product system, expressed as CO

    2

    equivalents and based on a life cycle assessment using the single impact category of climate change;


    (26)


    ‘material footprint’ refers to the total amount of raw materials extracted to meet final consumption demands;


    (27)


    ‘substance of concern’ means a substance that:


    (a)


    meets the criteria laid down in Article 57 of Regulation (EC) No 1907/2006 and is identified in accordance with Article 59(1) of that Regulation;


    (b)


    is classified in Part 3 of Annex VI to Regulation (EC) No 1272/2008 in one of the following hazard classes or hazard categories:


    (i)


    carcinogenicity categories 1 and 2;


    (ii)


    germ cell mutagenicity categories 1 and 2;


    (iii)


    reproductive toxicity categories 1 and 2;


    (iv)


    endocrine disruption for human health categories 1 and 2;


    (v)


    endocrine disruption for the environment categories 1 and 2;


    (vi)


    persistent, mobile and toxic or very persistent, very mobile properties;


    (vii)


    persistent, bioaccumulative and toxic or very persistent, very bioaccumulative properties;


    (viii)


    respiratory sensitisation category 1;


    (ix)


    skin sensitisation category 1;


    (x)


    hazardous to the aquatic environment — categories c'
