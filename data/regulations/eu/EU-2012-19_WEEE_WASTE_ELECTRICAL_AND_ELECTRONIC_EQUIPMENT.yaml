    Official Journal of the European Union


    L 197/38


    DIRECTIVE 2012/19/EU OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 4 July 2012



    on waste electrical and electronic equipment (WEEE)


    (recast)


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 192(1) thereof,


    Having regard to the proposal from the European Commission,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    Having regard to the opinion of the Committee of the Regions

    (

    2

    )

    ,


    Acting in accordance with the ordinary legislative procedure

    (

    3

    )

    ,


    Whereas:


    (1)


    A number of substantial changes are to be made to Directive 2002/96/EC of the European Parliament and of the Council of 27 January 2003 on waste electrical and electronic equipment (WEEE)

    (

    4

    )

    . In the interests of clarity, that Directive should be recast.


    (2)


    The objectives of the Union’s environment policy are, in particular, to preserve, protect and improve the quality of the environment, to protect human health and to utilise natural resources prudently
    and rationally. That policy is based on the precautionary principle and the principles that preventive action should be taken, that environmental damage should, as a priority, be rectified at source
    and that the polluter should pay.


    (3)


    The Community programme of policy and action in relation to the environment and sustainable development (Fifth Environmental Action Programme)

    (

    5

    )

    stated that the achievement of sustainable development calls for significant changes in current patterns of development, production, consumption and behaviour and advocates, inter alia, the reduction
    of wasteful consumption of natural resources and the prevention of pollution. It mentioned waste electrical and electronic equipment (WEEE) as one of the target areas to be regulated, in view of the
    application of the principles of prevention, recovery and safe disposal of waste.


    (4)


    This Directive supplements the general waste management legislation of the Union, such as Directive 2008/98/EC of the European Parliament and of the Council of 19 November 2008 on waste

    (

    6

    )

    . It refers to the definitions in that Directive, including the definitions of waste and general waste management operations. The definition of collection in Directive 2008/98/EC includes the preliminary
    sorting and preliminary storage of waste for the purposes of transport to a waste treatment facility. Directive 2009/125/EC of the European Parliament and of the Council

    (

    7

    )

    establishes a framework for setting ecodesign requirements for energy-related products and enables the adoption of specific ecodesign requirements for energy-related products which may also be covered
    by this Directive. Directive 2009/125/EC and the implementing measures adopted pursuant thereto are without prejudice to the waste management legislation of the Union. Directive 2002/95/EC of the European
    Parliament and of the Council of 27 January 2003 on the restriction of the use of certain hazardous substances in electrical and electronic equipment

    (

    8

    )

    requires the substitution of banned substances in respect of all electrical and electronic equipment (EEE) within its scope.


    (5)


    As the market continues to expand and innovation cycles become even shorter, the replacement of equipment accelerates, making EEE a fast-growing source of waste. While Directive 2002/95/EC has contributed
    effectively to reducing hazardous substances contained in new EEE, hazardous substances such as mercury, cadmium, lead, hexavalent chromium and polychlorinated biphenyls (PCBs) and ozone-depleting substances
    will still be present in WEEE for many years. The content of hazardous components in EEE is a major concern during the waste management phase, and recycling of WEEE is not undertaken to a sufficient
    extent. A lack of recycling results in the loss of valuable resources.


    (6)


    The purpose of this Directive is to contribute to sustainable production and consumption by, as a first priority, the prevention of WEEE and, in addition, by the re-use, recycling and other forms of
    recovery of such wastes so as to reduce the disposal of waste and to contribute to the efficient use of resources and the retrieval of valuable secondary raw materials. It also seeks to improve the
    environmental performance of all operators involved in the life cycle of EEE, e.g. producers, distributors and consumers and, in particular, those operators directly involved in the collection and treatment
    of WEEE. In particular, different national applications of the ‘producer responsibility’ principle may lead to substantial disparities in the financial burden on economic operators. Having different
    national policies on the management of WEEE hampers the effectiveness of recycling policies. For that reason, the essential criteria should be laid down at the level of the Union and minimum standards
    for the treatment of WEEE should be developed.


    (7)


    The provisions of this Directive should apply to products and producers irrespective of selling technique, including distance and electronic selling. In this connection, the obligations of producers
    and distributors using distance and electronic selling channels should, as far as is practicable, take the same form, and should be enforced in the same way, as for other distribution channels, in order
    to avoid those other distribution channels having to bear the costs resulting from this Directive arising from WEEE for which the equipment was sold by distance or electronic selling.


    (8)


    In order to fulfil the obligations pursuant to this Directive in a given Member State, a producer should be established in that Member State. By exception, to reduce existing barriers to the proper
    functioning of the internal market and administrative burdens, Member States should allow producers that are not established on their territory, but that are established in another Member State, to
    appoint an authorised representative to be responsible for fulfilling the obligations of that producer under this Directive. In addition, administrative burdens should be reduced by simplifying registration
    and reporting procedures and by ensuring that duplicate charges are not levied for registrations within individual Member States.


    (9)


    This Directive should cover all EEE used by consumers and EEE intended for professional use. This Directive should apply without prejudice to Union legislation on safety and health requirements protecting
    all actors in contact with WEEE, as well as specific Union waste management legislation, in particular Directive 2006/66/EC of the European Parliament and of the Council of 6 September 2006 on batteries
    and accumulators and waste batteries and accumulators

    (

    9

    )

    , and Union product design legislation, in particular Directive 2009/125/EC. The preparing for re-use, recovery and recycling of waste cooling equipment and the substances, mixtures or components thereof
    should be in accordance with the relevant legislation of the Union, in particular Regulation (EC) No 1005/2009 of the European Parliament and of the Council of 16 September 2009 on substances that deplete
    the ozone layer

    (

    10

    )

    and Regulation (EC) No 842/2006 of the European Parliament and of the Council of 17 May 2006 on certain fluorinated greenhouse gases

    (

    11

    )

    . The objectives of this Directive can be achieved without including large-scale fixed installations such as oil platforms, airport luggage transport systems or elevators within its scope. However,
    any equipment which is not specifically designed and installed as part of those installations, and which can fulfil its function even if it is not part of those installations, should be included in
    the scope of this Directive. This refers for instance to equipment such as lighting equipment or photovoltaic panels.


    (10)


    A number of definitions should be included in this Directive in order to specify its scope. However, in the framework of a revision of the scope, the definition of EEE should be further clarified in
    order to bring Member States’ relevant national measures and current, applied and established practices closer together.


    (11)


    Ecodesign requirements facilitating the re-use, dismantling and recovery of WEEE should be laid down in the framework of measures implementing Directive 2009/125/EC. In order to optimise re-use and
    recovery through product design, the whole life cycle of the product should be taken into account.


    (12)


    The establishment, by this Directive, of producer responsibility is one of the means of encouraging design and production of EEE which take into full account and facilitate its repair, possible upgrading,
    re-use, disassembly and recycling.


    (13)


    In order to guarantee the safety and health of distributors’ personnel involved in the take-back and handling of WEEE, Member States should, in accordance with national and Union legislation on safety
    and health requirements, determine the conditions under which take-back may be refused by distributors.


    (14)


    Separate collection is a precondition for ensuring specific treatment and recycling of WEEE and is necessary to achieve the chosen level of protection of human health and the environment in the Union.
    Consumers have to actively contribute to the success of such collection and should be encouraged to return WEEE. For this purpose, convenient facilities should be set up for the return of WEEE, including
    public collection points, where private households should be able to return their waste at least free of charge. Distributors have an important role in contributing to the success of WEEE collection.
    Therefore, collection points set up at retail shops for very small WEEE should not be subject to the registration or permit requirements of Directive 2008/98/EC.


    (15)


    In order to attain the chosen level of protection and the harmonised environmental objectives of the Union, Member States should adopt appropriate measures to minimise the disposal of WEEE as unsorted
    municipal waste and to achieve a high level of separate collection of WEEE. In order to ensure that Member States strive to set up efficient collection schemes, they should be required to achieve a
    high level of collection of WEEE, particularly for cooling and freezing equipment containing ozone-depleting substances and fluorinated greenhouse gases, given their high environmental impact and in
    view of the obligations contained in Regulation (EC) No 842/2006 and Regulation (EC) No 1005/2009. Data included in the impact assessment carried out by the Commission in 2008 show that 65 % of the
    EEE placed on the market was already separately collected then, but more than half of this was potentially the object of improper treatment and illegal exports, and, even when properly treated, this
    was not reported. This leads to losses of valuable secondary raw materials, environmental degradation, and provision of inconsistent data. To avoid this, it is necessary to set an ambitious collection
    target and to ensure that WEEE collected is treated in an environmentally sound way and is correctly reported. It is appropriate to lay down minimum requirements for shipments of used EEE suspected
    to be WEEE, in the application of which Member States may have regard to any relevant Correspondents’ Guidelines elaborated in the context of the implementation of Regulation (EC) No 1013/2006 of the
    European Parliament and of the Council of 14 June 2006 on shipments of waste

    (

    12

    )

    . Such minimum requirements should in any case have the purpose of avoiding unwanted shipments of non-functional EEE to developing countries.


    (16)


    The setting of ambitious collection targets should be based on the amount of WEEE generated where due account is taken of the differing life cycles of products in the Member States, of non-saturated
    markets and of EEE with'
- id: art-2
  title: Article 1
  text: 'Article 1


    Subject matter


    This Directive lays down measures to protect the environment and human health by preventing or reducing the adverse impacts of the generation and management of waste from electrical and electronic equipment
    (WEEE) and by reducing overall impacts of resource use and improving the efficiency of such use in accordance with Articles 1 and 4 of Directive 2008/98/EC, thereby contributing to sustainable development.'
- id: art-3
  title: Article 2
  text: 'Article 2


    Scope


    1.   This Directive shall apply to electrical and electronic equipment (EEE) as follows:


    (a)


    from 13 August 2012 to 14 August 2018 (transitional period), subject to paragraph 3, to EEE falling within the categories set out in Annex I. Annex II contains an indicative list of EEE which falls
    within the categories set out in Annex I;


    (b)


    from 15 August 2018, subject to paragraphs 3 and 4, to all EEE. All EEE shall be classified within the categories set out in Annex III. Annex IV contains a non-exhaustive list of EEE which falls within
    the categories set out in Annex III (open scope).


    2.   This Directive shall apply without prejudice to the requirements of Union legislation on safety and health, on chemicals, in particular Regulation (EC) No 1907/2006 of the European Parliament and
    of the Council of 18 December 2006 concerning the Registration, Evaluation, Authorisation and Restriction of Chemicals (REACH), establishing a European Chemicals Agency

    (

    18

    )

    , as well as of specific Union waste management or product design legislation.


    3.   This Directive shall not apply to any of the following EEE:


    (a)


    equipment which is necessary for the protection of the essential interests of the security of Member States, including arms, munitions and war material intended for specifically military purposes;


    (b)


    equipment which is specifically designed and installed as part of another type of equipment that is excluded from or does not fall within the scope of this Directive, which can fulfil its function only
    if it is part of that equipment;


    (c)


    filament bulbs.


    4.   In addition to the equipment specified in paragraph 3, from 15 August 2018, this Directive shall not apply to the following EEE:


    (a)


    equipment designed to be sent into space;


    (b)


    large-scale stationary industrial tools;


    (c)


    large-scale fixed installations, except any equipment which is not specifically designed and installed as part of those installations;


    (d)


    means of transport for persons or goods, excluding electric two-wheel vehicles which are not type-approved;


    (e)


    non-road mobile machinery made available exclusively for professional use;


    (f)


    equipment specifically designed solely for the purposes of research and development that is only made available on a business-to-business basis;


    (g)


    medical devices and in vitro diagnostic medical devices, where such devices are expected to be infective prior to end of life, and active implantable medical devices.


    5.   No later than 14 August 2015, the Commission shall review the scope of this Directive set out in point (b) of paragraph 1, including the parameters to distinguish between large and small equipment
    in Annex III, and shall present a report thereon to the European Parliament and to the Council. The report shall be accompanied by a legislative proposal, if appropriate.'
- id: art-4
  title: Article 3
  text: 'Article 3


    Definitions


    1.   For the purposes of this Directive, the following definitions shall apply:


    (a)


    ‘electrical and electronic equipment’ or ‘EEE’ means equipment which is dependent on electric currents or electromagnetic fields in order to work properly and equipment for the generation, transfer
    and measurement of such currents and fields and designed for use with a voltage rating not exceeding 1 000 volts for alternating current and 1 500 volts for direct current;


    (b)


    ‘large-scale stationary industrial tools’ means a large size assembly of machines, equipment, and/or components, functioning together for a specific application, permanently installed and de-installed
    by professionals at a given place, and used and maintained by professionals in an industrial manufacturing facility or research and development facility;


    (c)


    ‘large-scale fixed installation’ means a large-size combination of several types of apparatus and, where applicable, other devices, which:


    (i)


    are assembled, installed and de-installed by professionals;


    (ii)


    are intended to be used permanently as part of a building or a structure at a pre-defined and dedicated location; and


    (iii)


    can only be replaced by the same specifically designed equipment;


    (d)


    ‘non-road mobile machinery’ means machinery, with on-board power source, the operation of which requires either mobility or continuous or semi-continuous movement between a succession of fixed working
    locations while working;


    (e)


    ‘waste electrical and electronic equipment’ or ‘WEEE’ means electrical or electronic equipment which is waste within the meaning of Article 3(1) of Directive 2008/98/EC, including all components, sub-assemblies
    and consumables which are part of the product at the time of discarding;


    (f)


    ‘producer’ means any natural or legal person who, irrespective of the selling technique used, including distance communication within the meaning of Directive 97/7/EC of the European Parliament and
    of the Council of 20 May 1997 on the protection of consumers in respect of distance contracts

    (

    19

    )

    :


    (i)


    is established in a Member State and manufactures EEE under his own name or trademark, or has EEE designed or manufactured and markets it under his name or trademark within the territory of that Member
    State;


    (ii)


    is established in a Member State and resells within the territory of that Member State, under his own name or trademark, equipment produced by other suppliers, a reseller not being regarded as the ‘producer’
    if the brand of the producer appears on the equipment, as provided for in point (i);


    (iii)


    is established in a Member State and places on the market of that Member State, on a professional basis, EEE from a third country or from another Member State; or


    (iv)


    sells EEE by means of distance communication directly to private households or to users other than private households in a Member State, and is established in another Member State or in a third country.


    Whoever exclusively provides financing under or pursuant to any finance agreement shall not be deemed to be a ‘producer’ unless he also acts as a producer within the meaning of points (i) to (iv);


    (g)


    ‘distributor’ means any natural or legal person in the supply chain, who makes an EEE available on the market. This definition does not prevent a distributor from being, at the same time, a producer
    within the meaning of point (f);


    (h)


    ‘WEEE from private households’ means WEEE which comes from private households and WEEE which comes from commercial, industrial, institutional and other sources which, because of its nature and quantity,
    is similar to that from private households. Waste from EEE likely to be used by both private households and users other than private households shall in any event be considered to be WEEE from private
    households;


    (i)


    ‘finance agreement’ means any loan, lease, hiring or deferred sale agreement or arrangement relating to any equipment whether or not the terms of that agreement or arrangement or any collateral agreement
    or arrangement provide that a transfer of ownership of that equipment will or may take place;


    (j)


    ‘making available on the market’ means any supply of a product for distribution, consumption or use on the market of a Member State in the course of a commercial activity, whether in return for payment
    or free of charge;


    (k)


    ‘placing on the market’ means the first making available of a product on the market within the territory of a Member State on a professional basis;


    (l)


    ‘removal’ means manual, mechanical, chemical or metallurgic handling with the result that hazardous substances, mixtures and components are contained in an identifiable stream or are an identifiable
    part of a stream within the treatment process. A substance, mixture or component is identifiable if it can be monitored to verify environmentally safe treatment;


    (m)


    ‘medical device’ means a medical device or accessory within the meaning of, respectively, point (a) or (b) of Article 1(2) of Council Directive 93/42/EEC of 14 June 1993 concerning medical devices

    (

    20

    )

    which is EEE;


    (n)


    ‘in vitro diagnostic medical device’ means an in vitro diagnostic device or accessory within the meaning of, respectively, point (b) or (c) of Article 1(2) of Directive 98/79/EC of the European Parliament
    and of the Council of 27 October 1998 on in vitro diagnostic medical devices

    (

    21

    )

    which is EEE;


    (o)


    ‘active implantable medical device’ means an active implantable medical device within the meaning of point (c) of Article 1(2) of Council Directive 90/385/EEC of 20 June 1990 on the approximation of
    the laws of the Member States relating to active implantable medical devices

    (

    22

    )

    which is EEE.


    2.   In addition, the definitions of ‘hazardous waste’, ‘collection’, ‘separate collection’, ‘prevention’, ‘re-use’, ‘treatment’, ‘recovery’, ‘preparing for re-use’, ‘recycling’ and ‘disposal’ laid
    down in Article 3 of Directive 2008/98/EC shall apply.'
- id: art-5
  title: Article 4
  text: 'Article 4


    Product design


    Member States shall, without prejudice to the requirements of Union legislation on the proper functioning of the internal market and on product design, including Directive 2009/125/EC, encourage cooperation
    between producers and recyclers and measures to promote the design and production of EEE, notably in view of facilitating re-use, dismantling and recovery of WEEE, its components and materials. In this
    context, Member States shall take appropriate measures so that the ecodesign requirements facilitating re-use and treatment of WEEE established in the framework of Directive 2009/125/EC are applied
    and producers do not prevent, through specific design features or manufacturing processes, WEEE from being re-used, unless such specific design features or manufacturing processes present overriding
    advantages, for example, with regard to the protection of the environment and/or safety requirements.'
- id: art-6
  title: Article 5
  text: 'Article 5


    Separate collection


    1.   Member States shall adopt appropriate measures to minimise the disposal of WEEE in the form of unsorted municipal waste, to ensure the correct treatment of all collected WEEE and to achieve a high
    level of separate collection of WEEE, notably, and as a matter of priority, for temperature exchange equipment containing ozone-depleting substances and fluorinated greenhouse gases, fluorescent lamps
    containing mercury, photovoltaic panels and small equipment as referred to in categories 5 and 6 of Annex III.


    2.   For WEEE from private households, Member States shall ensure that:


    (a)


    systems are set up allowing final holders and distributors to return such waste at least free of charge. Member States shall ensure the availability and accessibility of the necessary collection facilities,
    taking into account, in particular, the population density;


    (b)


    when supplying a new product, distributors are responsible for ensuring that such waste can be returned to the distributor at least free of charge on a one-to-one basis as long as the equipment is of
    equivalent type and has fulfilled the same functions as the supplied equipment. Member States may derogate from this provision provided that they ensure that returning the WEEE is not thereby made more
    difficult for the final holder and that it remains free of charge for the final holder. Member States making use of this derogation shall inform the Commission thereof;


    (c)


    distributors provide for the collection, at retail shops with sales areas relating to EEE of at least 400 m

    2

    , or in their immediate proximity, of very small WEEE (no external dimension more than 25 cm) free of charge to end-users and with no obligation to buy EEE of an equivalent type, unless an assessment
    shows that alternative existing collection schemes are likely to be at least as effective. Such assessments shall be available to the public. WEEE collected shall be properly treated in accordance with
    Article 8;


    (d)


    without prejudice to points (a), (b) and (c), producers are allowed to set up and to operate individual and/or collective take-back systems for WEEE from private households provided that these are in
    line with the objectives of this Directive;


    (e)


    having regard to national and Union health and safety standards, WEEE that presents a health and safety risk to personnel because of contamination may be refused for return under points (a), (b) and
    (c). Member States shall make specific arrangements for such WEEE.


    Member States may provide for specific arrangements for the return of WEEE pursuant to points (a), (b) and (c) for cases in which the equipment does not contain its essential components or if the equipment
    contains waste other than WEEE.


    3.   Member States may designate the operators that are allowed to collect WEEE from private households as referred to in paragraph 2.


    4.   Member States may require that the WEEE deposited at collection facilities referred to in paragraphs 2 and 3 is handed over to producers or third parties acting on their behalf or is handed over,
    for purposes of preparing for re-use, to designated establishments or undertakings.


    5.   In the case of WEEE other than WEEE from private households, and without prejudice to Article 13, Member States shall ensure that producers or third parties acting on their behalf provide for the
    collection of such waste.'
- id: art-7
  title: Article 6
  text: 'Article 6


    Disposal and transport of collected WEEE


    1.   Member States shall prohibit the disposal of separately collected WEEE which has not yet undergone the treatment specified in Article 8.


    2.   Member States shall ensure that the collection and transport of separately collected WEEE is carried out in a way which allows optimal conditions for preparing for re-use, recycling and the confinement
    of hazardous substances.


    In order to maximise preparing for re-use, Member States shall promote that, prior to any further transfer, collection schemes or facilities provide, where appropriate, for the separation at the collection
    points of WEEE that is to be prepared for re-use from other separately collected WEEE, in particular by granting access for personnel from re-use centres.'
- id: art-8
  title: Article 7
  text: 'Article 7


    Collection rate


    1.   Without prejudice to Article 5(1), each Member State shall ensure the implementation of the ‘producer responsibility’ principle and, on that basis, that a minimum collection rate is achieved annually.
    From 2016, the minimum collection rate shall be 45 % calculated on the basis of the total weight of WEEE collected in accordance with Articles 5 and 6 in a given year in the Member State concerned,
    expressed as a percentage of the average weight of EEE placed on the market in the three preceding years in that Member State. Member States shall ensure that the volume of WEEE collected evolves gradually
    during the period from 2016 to 2019, unless the collection rate laid down in the second subparagraph has already been achieved.


    From 2019, the minimum collection rate to be achieved annually shall be 65 % of the average weight of EEE placed on the market in the three preceding years in the Member State concerned, or alternatively
    85 % of WEEE generated on the territory of that Member State.


    Until 31 December 2015, a rate of separate collection of at least 4 kilograms on average per inhabitant per year of WEEE from private households or the same amount of weight of WEEE as was collected
    in that Member State on average in the three preceding years, whichever is greater, shall continue to apply.


    Member States may set more ambitious rates for separate collection of WEEE and shall in such a case report this to the Commission.


    2.   In order to establish whether the minimum collection rate has been achieved, Member States shall ensure that information concerning the WEEE that is separately collected in accordance with Article
    5 is transmitted to the Member States free of charge, including at least information on WEEE that has been:


    (a)


    received by collection and treatment facilities;


    (b)


    received by distributors;


    (c)


    separately collected by producers or third parties acting on their behalf.


    3.   By way of derogation from paragraph 1, Bulgaria, the Czech Republic, Latvia, Lithuania, Hungary, Malta, Poland, Romania, Slovenia and Slovakia may, because of their lack of the necessary infrastructure
    and their low level of EEE consumption, decide to:


    (a)


    achieve, from 14 August 2016, a collection rate that is lower than 45 % but higher than 40 % of the average weight of EEE placed on the market in the three preceding years; and


    (b)


    postpone the achievement of the collection rate referred to in the second subparagraph of paragraph 1 until a date of their own choice which shall not be later than 14 August 2021.


    4.   The Commission shall be empowered to adopt delegated acts in accordance with Article 20 laying down the necessary transitional adjustments in order to address difficulties faced by Member States
    in adhering to the requirements laid down in paragraph 1.


    5.   In order to ensure uniform conditions for the implementation of this Article, the Commission shall, by 14 August 2015, adopt implementing acts establishing a common methodology for the calculation
    of the weight of EEE placed on the national market and a common methodology for the calculation of the quantity of WEEE generated by weight in each Member State. Those implementing acts shall be adopted
    in accordance with the examination procedure referred to in Article 21(2).


    6.   The Commission shall, by 14 August 2015, present a report to the European Parliament and to the Council on the re-examination of the deadlines relating to the collection rates referred to in paragraph
    1 and on possibly setting individual collection rates for one or more categories set out in Annex III, particularly for temperature exchange equipment, photovoltaic panels, small equipment, small IT
    and telecommunication equipment and lamps containing mercury. The report shall, if appropriate, be accompanied by a legislative proposal.


    7.   If the Commission considers, on the basis of an impact study, that the collection rate based on WEEE generated requires revision, it shall submit a legislative proposal to the European Parliament
    and the Council.'
- id: art-9
  title: Article 8
  text: 'Article 8


    Proper treatment


    1.   Member States shall ensure that all separately collected WEEE undergoes proper treatment.


    2.   Proper treatment, other than preparing for re-use, and recovery or recycling operations shall, as a minimum, include the removal of all fluids and a selective treatment in accordance with Annex
    VII.


    3.   Member States shall ensure that producers or third parties acting on their behalf set up systems to provide for the recovery of WEEE using best available techniques. The systems may be set up by
    producers individually or collectively. Member States shall ensure that any establishment or undertaking carrying out collection or treatment operations stores and treats WEEE in compliance with the
    technical requirements set out in Annex VIII.


    4.   The Commission shall be empowered to adopt delegated acts in accordance with Article 20 concerning the amendment of Annex VII in order to introduce other treatment technologies that ensure at least
    the same level of protection for human health and the environment.


    The Commission shall evaluate, as a matter of priority, whether the entries regarding printed circuit boards for mobile phones and liquid crystal displays need to be amended. The Commission is invited
    to evaluate whether amendments to Annex VII are necessary to address nanomaterials contained in EEE.


    5.   For the purposes of environmental protection, Member States may set up minimum quality standards for the treatment of the WEEE that has been collected.

    '
