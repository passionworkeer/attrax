  text: 'L_2014257EN.01014601.xml


    28.8.2014


    EN


    Official Journal of the European Union


    L 257/146


    DIRECTIVE 2014/90/EU OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 23 July 2014



    on marine equipment and repealing Council Directive 96/98/EC


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 100(2) thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    After consulting the Committee of the Regions,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    The global dimension of shipping calls for the Union to apply and support the international regulatory framework for maritime safety. The international maritime safety conventions require flag States
    to ensure that the equipment carried on board ships complies with certain safety requirements as regards design, construction and performance, and to issue the relevant certificates. To that end, detailed
    performance and testing standards for certain types of marine equipment have been developed by the International Maritime Organization (IMO) and by the international and European standardisation bodies.


    (2)


    The international instruments leave a significant margin of discretion to the flag administrations. In the absence of harmonisation, this leads to varying levels of safety for products which the competent
    national authorities have certified as complying with those conventions and standards; as a result, the smooth functioning of the internal market is affected as it becomes difficult for the Member States
    to accept equipment certified in another Member State to be placed on board ships flying their flags without further verification.


    (3)


    Harmonisation by the Union resolves these problems. Council Directive 96/98/EC

    (

    3

    )

    thus laid down common rules to eliminate differences in the implementation of international standards by means of a clearly identified set of requirements and uniform certification procedures.


    (4)


    There are various other instruments of Union law which lay down requirements and conditions, inter alia, in order to ensure the free movement of goods within the internal market or for environmental
    purposes, for certain products which are similar in nature to equipment used on board ships but which do not meet the international standards – which may substantially differ from the internal legislation
    of the Union and are in constant evolution. Those products cannot therefore be certified by the Member States in accordance with the relevant international maritime safety conventions. Equipment to
    be placed onboard EU ships in accordance with international safety standards should therefore be regulated exclusively by this Directive, which should in any event be considered the

    lex specialis

    ; furthermore, a specific marking should be established to indicate that equipment bearing that mark complies with the requirements laid down in the relevant international conventions and instruments
    which have entered into force.


    (5)


    As well as setting out detailed performance and testing standards for marine equipment, the international instruments sometimes allow for measures that deviate from the prescriptive requirements but
    which, under certain conditions, are suitable to satisfy the intent of those requirements. The International Convention for the Safety of Life at Sea (SOLAS), 1974, allows for alternative designs and
    arrangements which could be applied by individual Member States acting under their own responsibility.


    (6)


    Experience in the implementation of Directive 96/98/EC has shown that it is necessary to take additional measures in order to enhance the implementation and enforcement mechanisms of that Directive
    and simplify the regulatory environment while guaranteeing that IMO requirements are applied and implemented in a harmonised way across the Union.


    (7)


    Requirements should therefore be established for marine equipment to meet the safety standards laid down in the applicable international instruments, including the relevant testing standards, in order
    to ensure that equipment which complies with those requirements can circulate unimpeded within the internal market and be placed on board ships flying the flag of any Member State.


    (8)


    In order to allow for fair competition in the development of marine equipment, every effort should be made to promote the use of open standards in order to make them available freely or at a nominal
    charge, and permissible to all to copy, distribute and use for no fee or at a nominal fee.


    (9)


    Decision No 768/2008/EC of the European Parliament and of the Council

    (

    4

    )

    lays down common principles and reference provisions intended to apply across sectoral legislation in order to provide a coherent basis for revision or recasts of that legislation. That Decision constitutes
    a general framework of a horizontal nature for future legislation harmonising the conditions for the marketing of products and a reference text for existing legislation. That general framework provides
    appropriate solutions to the problems identified in the implementation of Directive 96/98/EC. It is therefore necessary to incorporate the definitions and reference provisions of Decision No 768/2008/EC
    into this Directive by making the adaptations which are required by the specific features of the marine equipment sector.


    (10)


    In order to provide market surveillance authorities with additional, specific means to facilitate their task, an electronic tag could supplement or replace the wheel mark in due time.


    (11)


    The responsibilities of the economic operators should be laid down in a way which is proportionate and non-discriminatory for those economic operators who are established within the Union, taking into
    account the fact that a significant proportion of the marine equipment falling within the scope of this Directive may never be imported and distributed in the territory of the Member States.


    (12)


    Given that marine equipment is placed on board ships at the time of their construction or repair all over the world, market surveillance becomes particularly difficult and cannot be effectively supported
    by border controls. Therefore, the respective obligations of Member States and of economic operators within the Union should be clearly specified. Member States should ensure that only compliant equipment
    is installed on board ships flying their flags and that this obligation is fulfilled through issuance, endorsement or renewal of the certificates of such ships by the flag State administration under
    the international conventions, as well as through national market surveillance arrangements in place in accordance with the Union market surveillance framework laid down in Chapter III of Regulation
    (EC) No 765/2008 of the European Parliament and of the Council

    (

    5

    )

    . Member States should be supported in fulfilling those obligations by the information systems made available by the Commission for the assessment, notification and monitoring of bodies authorised to
    carry out conformity assessment tasks, the sharing of information in relation to approved marine equipment, applications withdrawn or refused, and non-compliance of equipment.


    (13)


    In the first instance, the affixing of the wheel mark to the marine equipment by the manufacturer or, where relevant, the importer should be the guarantee pursuant to their obligations under this Directive
    that the equipment is compliant and may be placed on the market with a view to being placed on board an EU ship. Thereafter, certain provisions are necessary for the safe continuation and applicability
    of the wheel mark after it has been affixed and for the effective discharge of the task of national market surveillance authorities. The manufacturer or, where relevant, the importer or the distributor,
    should be obliged to provide the competent authorities with full and truthful information in relation to the equipment it has wheel marked to ensure that marine equipment remains safe. The manufacturer
    should be obliged to cooperate with market surveillance authorities, including as regard standards against which it has manufactured and certified equipment, and should also exercise due diligence in
    relation to marine equipment it places on the market. In this regard, a manufacturer located outside the Union should appoint an authorised representative in order to ensure cooperation with competent
    national authorities.


    (14)


    Compliance with international testing standards could best be demonstrated by means of conformity assessment procedures such as those laid down in Decision No 768/2008/EC. However, only those conformity
    assessment procedures which meet the requirements of the international instruments should be made available to manufacturers.


    (15)


    In order to ensure a fair and efficient procedure when examining suspected non-compliance, the Member States should be encouraged to take all measures conducive to an exhaustive and objective evaluation
    of the risks;. if the Commission is satisfied that this condition has been met, it should not be obliged to repeat that evaluation when reviewing the restrictive measures adopted by the Member States
    as regards non-compliant equipment.


    (16)


    When performing its investigative duties with regard to notified bodies, the Commission should keep Member States informed and should cooperate with them as far as possible, taking due account of its
    independent role.


    (17)


    When the surveillance authorities of a Member State consider that marine equipment covered by this Directive is liable to present a risk to maritime safety, to health or to the environment, they should
    carry out evaluations or tests in relation to the equipment concerned. In cases where a risk is detected, the Member State should call upon the economic operator concerned to take the appropriate corrective
    action, or even to withdraw or recall the equipment concerned.


    (18)


    The use of marine equipment not bearing the wheel mark should be allowed in exceptional circumstances, especially when it is not possible for a ship to obtain equipment bearing the wheel mark in a port
    or installation outside the Union or when equipment bearing the wheel mark is not available in the market.


    (19)


    It is necessary to ensure that the attainment of the objectives of this Directive is not impaired by the absence of international standards or serious weaknesses or anomalies in existing standards,
    including testing standards, for specific items of marine equipment falling within the scope of this Directive. It is also necessary to identify the specific items of marine equipment which could benefit
    from electronic tagging. Moreover, it is necessary to keep up to date a non-essential element of this Directive, namely the references to standards as referred to in Annex III, when new standards become
    available. The power to adopt acts in accordance with Article 290 of the Treaty on the Functioning of the European Union should therefore be delegated to the Commission in respect of the adoption, under
    certain conditions and on an interim basis, of harmonised technical specifications and testing standards and in order to amend those references. It is of particular importance that the Commission carry
    out appropriate consultations during its preparatory work, including at expert level. The Commission, when preparing and drawing up delegated acts, should ensure a simultaneous, timely and appropriate
    transmission of relevant documents to the European Parliament and to the Council.


    (20)


    In order to meet the objectives of this Directive, the international instruments should be uniformly implemented in the internal market. It is therefore necessary, fo'
- id: art-2
  title: CHAPTER 1
  text: 'CHAPTER 1


    GENERAL PROVISIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Objective


    The objective of this Directive is to enhance safety at sea and to prevent marine pollution through the uniform application of the relevant international instruments relating to marine equipment to
    be placed on board EU ships, and to ensure the free movement of such equipment within the Union.'
- id: art-4
  title: Article 2
  text: 'Article 2


    Definitions


    For the purposes of this Directive, the following definitions apply:


    (1)


    ‘marine equipment’ means equipment falling within the scope of this Directive in accordance with Article 3;


    (2)


    ‘EU ship’ means a ship flying the flag of a Member State and falling within the scope of the international conventions;


    (3)


    ‘international conventions’ means the following conventions, together with their protocols and codes of mandatory application, adopted under the auspices of the International Maritime Organization (IMO),
    which have entered into force and which lay down specific requirements for the approval by the flag State of equipment to be placed on board ships:


    —


    the 1972 Convention on the International Regulations for Preventing Collisions at Sea (Colreg),


    —


    the 1973 International Convention for the Prevention of Pollution from Ships (Marpol),


    —


    the 1974 International Convention for the Safety of Life at Sea (Solas);


    (4)


    ‘testing standards’ means the testing standards for marine equipment set by:


    —


    the International Maritime Organization (IMO),


    —


    the International Organization for Standardization (ISO),


    —


    the International Electrotechnical Commission (IEC),


    —


    the European Committee for Standardization (CEN),


    —


    the European Committee for Electrotechnical Standardization (Cenelec),


    —


    the International Telecommunication Union (ITU),


    —


    the European Telecommunications Standards Institute (ETSI),


    —


    the Commission, in accordance with Article 8 and Article 27(6) of this Directive,


    —


    the regulatory authorities recognised in the mutual recognition agreements to which the Union is a party;


    (5)


    ‘international instruments’ means the international conventions, together with the resolutions and circulars of the IMO giving effect to those conventions in their up-to-date version, and the testing
    standards;


    (6)


    ‘wheel mark’ means the symbol referred to in Article 9 and set out in Annex I or, as appropriate, the electronic tag referred to in Article 11;


    (7)


    ‘notified body’ means an organisation designated by the competent national administration of a Member State in accordance with Article 17;


    (8)


    ‘making available on the market’ means any supply of marine equipment on the Union market in the course of a commercial activity, whether in return for payment or free of charge;


    (9)


    ‘placing on the market’ means the first making available of marine equipment on the Union market;


    (10)


    ‘manufacturer’ means any natural or legal person who manufactures marine equipment or has marine equipment designed or manufactured, and markets that equipment under its name or trademark;


    (11)


    ‘authorised representative’ means any natural or legal person established within the Union who has received a written mandate from a manufacturer to act on its behalf in relation to specified tasks;


    (12)


    ‘importer’ means any natural or legal person established within the Union who places marine equipment from a third country on the Union market;


    (13)


    ‘distributor’ means any natural or legal person in the supply chain, other than the manufacturer or the importer, who makes marine equipment available on the market;


    (14)


    ‘economic operators’ means the manufacturer, the authorised representative, the importer and the distributor;


    (15)


    ‘accreditation’ means accreditation as defined in point 10 of Article 2 of Regulation (EC) No 765/2008;


    (16)


    ‘national accreditation body’ means national accreditation body as defined in point 11 of Article 2 of Regulation (EC) No 765/2008;


    (17)


    ‘conformity assessment’ means the process carried out by the notified bodies, in accordance with Article 15, demonstrating whether marine equipment complies with the requirements laid down in this Directive;


    (18)


    ‘conformity assessment body’ means a body that performs conformity assessment activities including calibration, testing, certification and inspection;


    (19)


    ‘recall’ means any measure aimed at achieving the return of marine equipment that has already been placed on board EU ships or purchased with the intention of being placed on board EU ships;


    (20)


    ‘withdrawal’ means any measure aimed at preventing marine equipment in the supply chain from being made available on the market;


    (21)


    ‘EU declaration of conformity’ means a statement issued by the manufacturer in accordance with Article 16;


    (22)


    ‘product’ means an item of marine equipment.'
- id: art-5
  title: Article 3
  text: 'Article 3


    Scope


    1.   This Directive shall apply to equipment placed or to be placed on board an EU ship and for which the approval of the flag State administration is required by the international instruments, regardless
    of whether the ship is situated in the Union at the time when it is fitted with the equipment.


    2.   Notwithstanding the fact that the equipment referred to in paragraph 1 may also fall within the scope of instruments of Union law other than this Directive, that equipment shall, for the purpose
    set out in Article 1, be subject only to this Directive.'
- id: art-6
  title: Article 4
  text: 'Article 4


    Requirements for marine equipment


    1.   Marine equipment that is placed on board an EU ship on or after the date referred to in the second subparagraph of Article 39(1) shall meet the design, construction and performance requirements
    of the international instruments as applicable at the time when that equipment is placed on board.


    2.   Compliance of marine equipment with the requirements referred to in paragraph 1 shall be demonstrated solely in accordance with the testing standards and by means of the conformity assessment procedures
    referred to in Article 15.


    3.   The international instruments shall apply, without prejudice to the conformity checking procedure set out in Article 5 of Regulation (EC) No 2099/2002 of the European Parliament and of the Council

    (

    8

    )

    .


    4.   The requirements and standards referred to in paragraphs 1 and 2 shall be implemented in a uniform manner, in accordance with Article 35(2).'
- id: art-7
  title: Article 5
  text: 'Article 5


    Application


    1.   When Member States issue, endorse or renew the certificates of the ships flying their flag as required by the international conventions, they shall ensure that the marine equipment on board those
    ships complies with the requirements of this Directive.


    2.   Member States shall take the necessary measures to ensure that marine equipment on board ships flying their flag complies with the requirements in the international instruments which are applicable
    to equipment already placed on board. Implementing powers shall be conferred upon the Commission to ensure the uniform application of those measures, in accordance with Article 35(3).'
- id: art-8
  title: Article 6
  text: 'Article 6


    Functioning of the internal market


    Member States shall not prohibit the placing on the market or the placing on board an EU ship of marine equipment which complies with this Directive, nor refuse to issue the certificates relating thereto
    to the ships flying their flag, or to renew the said certificates.'
- id: art-9
  title: Article 7
  text: 'Article 7


    Transfer of a ship to the flag of a Member State


    1.   In the case of a non-EU ship which is to be transferred to the flag of a Member State, that ship shall, during transfer, be subject to inspection by the receiving Member State to verify that the
    actual condition of its marine equipment corresponds to its safety certificates and either complies with this Directive and bears the wheel mark or is equivalent, to the satisfaction of that Member
    State’s administration, to marine equipment certified in accordance with this Directive as of 18 September 2016.


    2.   In cases where the date of installation on board of marine equipment cannot be established, Member States may determine satisfactory requirements of equivalence, taking into account relevant international
    instruments.


    3.   Unless the equipment either bears the wheel mark or the administration considers it to be equivalent, it shall be replaced.


    4.   Marine equipment which is considered equivalent pursuant to this Article shall be issued with a certificate by the Member State which shall at all times be carried with the equipment. That certificate
    shall give the flag Member State’s permission for the equipment to be retained on board the ship and impose any restrictions or lay down any provisions relating to the use of the equipment.'
- id: art-10
  title: Article 8
  text: 'Article 8


    Standards for marine equipment


    1.   Without prejudice to Directive 98/34/EC of the European Parliament and the Council

    (

    9

    )

    , as amended by Regulation (EU) No 1025/2012 of the European Parliament and of the Council

    (

    10

    )

    , the Union shall pursue the development by the IMO and by standardisation bodies of appropriate international standards, including detailed technical specifications and testing standards, for marine
    equipment whose use or installation on board ships is deemed necessary to enhance maritime safety and the prevention of marine pollution. The Commission shall monitor such development on a regular basis.


    2.   In the absence of an international standard for a specific item of marine equipment, in exceptional circumstances where duly justified by an appropriate analysis and in order to remove a serious
    and unacceptable threat to maritime safety, to health or to the environment and taking into account any ongoing work at IMO level, the Commission shall be empowered to adopt, by means of delegated acts
    in accordance with Article 37, harmonised technical specifications and testing standards for that specific item of marine equipment.


    It is of particular importance that the Commission carry out consultations with experts, including Member States’ experts, during the preparation of such delegated acts.


    Those technical specifications and testing standards shall apply on an interim basis until such time as the IMO has adopted a standard for that specific item of marine equipment.


    3.   In exceptional circumstances where duly justified by an appropriate analysis and if it is necessary to remove an identified unacceptable threat to maritime safety, to health or to the environment
    due to a serious weakness or anomaly in an existing standard for a specific item of marine equipment indicated by the Commission pursuant to Article 35(2) or (3) and taking into account any ongoing
    work at IMO level, the Commission shall be empowered to adopt, by means of delegated acts in accordance with Article 37, harmonised technical specifications and testing standards for that specific item
    of marine equipment, to the extent necessary to remedy the serious weakness or anomaly only.


    It is of particular importance that the Commission carry out consultations with experts, including Member States’ experts, during the preparation of such delegated acts.


    Those technical specifications and testing standards shall apply on an interim basis until such time as the IMO has reviewed the standard applicable to that specific item of marine equipment.


    4.   The technical specifications and standards adopted in accordance with paragraphs 2 and 3 shall be made accessible free of charge by the Commission.'
- id: art-11
  title: CHAPTER 2
  text: 'CHAPTER 2


    THE WHEEL MARK'
- id: art-12
  title: Article 9
  text: 'Article 9


    The wheel mark


    1.   Marine equipment the compliance of which with the requirements laid down in this Directive has been demonstrated in accordance with the relevant conformity assessment procedures shall have the
    wheel mark affixed to it.


    2.   The wheel mark shall not be affixed to any other product.


    3.   The form of the wheel mark to be used shall be as set out in Annex I.


    4.   Use of the wheel mark shall be subject to the general principles set out in paragraphs 1 and 3 to 6 of Article 30 of Regulation (EC) No 765/2008, where any reference to the CE marking shall be
    construed as a reference to the wheel mark.'
- id: art-13
  title: Article 10
  text: 'Article 10


    Rules and conditions for affixing the wheel mark


    1.   The wheel mark shall be affixed visibly, legibly and indelibly to the product or to its data plate and, where relevant, embedded in its software. Where that is not possible or not warranted on
    account of the nature of the product, it shall be affixed to the packaging and to the accompanying documents.


    2.   The wheel mark shall be affixed at the end of the production phase.


    3.   The wheel mark shall be followed by the identification number of the notified body, where that body is involved in the production control phase, and by the year in which the mark is affixed.


    4.   The identification number of the notified body shall be affixed by the body itself or, under its instructions, by the manufacturer or the manufacturer''s authorised representative.'
- id: art-14
  title: Article 11
  text: 'Article 11


    Electronic tag


    1.   In order to facilitate market surveillance and prevent the counterfeiting of specific items of marine equipment referred to in paragraph 3, manufacturers may use an appropriate and reliable form
    of electronic tag instead of, or in addition to, the wheel mark. In such a case, Articles 9 and 10 shall apply, as appropriate,

    mutatis mutandis

    .


    2.   The Commission shall carry out a cost-benefit analysis concerning the use of the electronic tag as a supplement to, or a replacement of, the wheel mark.


    3.   The Commission may adopt delegated acts, in accordance with Article 37, in order to identify the specific items of marine equipment which can benefit from electronic tagging. It is of particular
    importance that the Commission carry out consultations with experts, including Member States’ experts, during the preparation of such delegated acts.


    4.   Implementing powers shall be conferred upon the Commission in order to lay down, in the form of Commission Regulations and in accordance with the examination procedure referred to in Article 38(2),
    appropriate technical criteria as regards the design, performance, affixing and use of electronic tags.


    5.   For the equipment identified in accordance with paragraph 3, the wheel mark may, within three years after the date of adoption of the appropriate technical criteria referred to in paragraph 4,
    be supplemented by an appropriate and reliable form of electronic tag.


    6.   For the equipment identified in accordance with paragraph 3, the wheel mark may be replaced, five years after the date of adoption of the appropriate technical criteria referred to in paragraph
    4, by an appropriate and reliable form of electronic tag.'
- id: art-15
  title: CHAPTER 3
  text: 'CHAPTER 3


    OBLIGATIONS OF ECONOMIC OPERATORS'
- id: art-16
  title: Article 12
  text: 'Article 12


    Obligations of manufacturers


    1.   By affixing the wheel mark, manufacturers shall take on responsibility for guaranteeing that the marine equipment to which the mark is affixed has been designed and manufactured in accordance with
    the technical specifications and standards implemented in accordance with Article 35(2), and shall assume the obligations laid down in paragraphs 2 to 9 of this Article.


    2.   Manufacturers shall draw up the required technical documentation and have the applicable conformity assessment procedures carried out.


    3.   Where the compliance of marine equipment with the applicable requirements has been demonstrated by the conformity assessment procedure, manufacturers shall draw up an EU declaration of conformity
    in accordance with Article 16 and affix the wheel mark in accordance with Articles 9 and 10.


    4.   Manufacturers shall keep the technical documentation and the EU declaration of conformity referred to in Article 16 for at least 10 years after the wheel mark has been affixed and in no case for
    a period shorter than the expected life of the marine equipment concerned.


    5.   Manufacturers shall ensure that procedures are in place for series production to remain in conformity. Changes in marine equipment design or characteristics and changes in the requirements in the
    international instruments as referred to in Article 4, on the basis of which conformity of marine equipment is declared, shall be taken into account. When necessary in accordance with Annex II, manufacturers
    shall have a new conformity assessment carried out.


    6.   Manufacturers shall ensure that their products bear a type, batch or serial number or other element allowing their identification, or, where the size or nature of the product does not allow it,
    that the required information is provided on the packaging or in a document accompanying the product or both, as appropriate.


    7.   Manufacturers shall indicate their name, registered trade name or registered trade mark and the address at which they can be contacted on the product or, where that is not possible, on its packaging
    or in a document accompanying the product or both, as appropriate. The address must indicate a single point at which the manufacturer can be contacted.


    8.   Manufacturers shall ensure that the product is accompanied by instructions and all necessary information for safe installation on board and safe use of the product, including limitations of use,
    if any, that can be easily understood by the users, together with any other documentation required by the international instruments or testing standards.


    9.   Manufacturers who consider or have reason to believe that a product to which they have affixed the wheel mark is not in conformity with the applicable design, construction and performance requirements
    and with the testing standards implemented in accordance with Article 35(2) and (3), shall immediately take the necessary corrective measures to bring that product into conformity, to withdraw it or
    to recall it, if appropriate. In addition, where the product presents a risk, manufacturers shall immediately inform the competent national authorities of the Member States, giving details, in particular,
    of the non-compliance and of any corrective measures taken.


    10.   Manufacturers shall, further to a reasoned request from a competent authority, promptly provide it with all the information and documentation necessary to demonstrate the conformity of the product,
    in a language which can be easily understood by or is acceptable to that authority, grant that authority access to their premises for market surveillance purposes in accordance with Article 19 of Regulation
    (EC) No 765/2008 and provide samples or access to samples in accordance with Article 25(4) of this Directive. They shall cooperate with that authority, at its request, on any action taken to eliminate
    the risks posed by products which they have placed on the market.'
- id: art-17
  title: Article 13
  text: 'Article 13


    Authorised representatives


    1.   A manufacturer who is not located in the territory of at least one Member State shall, by a written mandate, appoint an authorised representative for the Union and shall indicate in the mandate
    the name of the authorised representative and the address at which it can be contacted.


    2.   Fulfilment of the obligations laid down in Article 12(1) and the drawing-up of technical documentation shall not form part of the authorised representative’s mandate.


    3.   An authorised representative shall perform the tasks specified in the mandate received from the manufacturer. The mandate shall allow the authorised representative to do at least the following:


    (a)


    keep the EU declaration of conformity and the technical documentation at the disposal of national surveillance authorities for at least 10 years after the wheel mark has been affixed and in no case
    for a period shorter than the expected life of the marine equipment concerned;


    (b)


    further to a reasoned request from a competent authority, provide that authority with all the information and documentation necessary to demonstrate the conformity of a product;


    (c)


    cooperate with the competent authorities, at their request, on any action taken to eliminate the risks posed by products covered by its mandate.'
- id: art-18
  title: Article 14
  text: 'Article 14


    Other economic operators


    1.   Importers shall indicate their name, registered trade name or registered trade mark and the add'
