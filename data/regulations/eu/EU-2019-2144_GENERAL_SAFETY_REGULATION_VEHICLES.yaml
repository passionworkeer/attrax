  text: 'L_2019325EN.01000101.xml


    16.12.2019


    EN


    Official Journal of the European Union


    L 325/1


    REGULATION (EU) 2019/2144 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL



    of 27 November 2019



    on type-approval requirements for motor vehicles and their trailers, and systems, components and separate technical units intended for such vehicles, as regards their general safety and the protection
    of vehicle occupants and vulnerable road users, amending Regulation (EU) 2018/858 of the European Parliament and of the Council and repealing Regulations (EC) No 78/2009, (EC) No 79/2009 and (EC) No
    661/2009 of the European Parliament and of the Council and Commission Regulations (EC) No 631/2009, (EU) No 406/2010, (EU) No 672/2010, (EU) No 1003/2010, (EU) No 1005/2010, (EU) No 1008/2010, (EU)
    No 1009/2010, (EU) No 19/2011, (EU) No 109/2011, (EU) No 458/2011, (EU) No 65/2012, (EU) No 130/2012, (EU) No 347/2012, (EU) No 351/2012, (EU) No 1230/2012 and (EU) 2015/166


    (Text with EEA relevance)


    THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,


    Having regard to the Treaty on the Functioning of the European Union, and in particular Article 114 thereof,


    Having regard to the proposal from the European Commission,


    After transmission of the draft legislative act to the national parliaments,


    Having regard to the opinion of the European Economic and Social Committee

    (

    1

    )

    ,


    After consulting the Committee of the Regions,


    Acting in accordance with the ordinary legislative procedure

    (

    2

    )

    ,


    Whereas:


    (1)


    Regulation (EU) 2018/858 of the European Parliament and of the Council

    (

    3

    )

    lays down administrative provisions and technical requirements for the type-approval of all new vehicles, systems, components and separate technical units, with a view to ensuring the proper functioning
    of the internal market and in order to offer a high level of safety and environmental performance.


    (2)


    This Regulation is a regulatory act for the purposes of the EU type-approval procedure laid down by Regulation (EU) 2018/858. Therefore, Annex II to Regulation (EU) 2018/858 should be amended accordingly.
    The administrative provisions of Regulation (EU) 2018/858, including the provisions on corrective measures and penalties, are fully applicable to this Regulation.


    (3)


    Over the past decades, developments in vehicle safety have contributed significantly to the overall reduction in the number of road fatalities and severe injuries. However, 25 300 people died on Union
    roads in 2017, a figure that has remained constant in the last four years. Moreover, 135 000 people are seriously injured in collisions every year

    (

    4

    )

    . The Union should do its utmost to reduce or to eliminate accidents and injuries in road transport. In addition to safety measures to protect vehicle occupants, the implementation of specific measures
    to prevent fatalities and injuries of vulnerable road users, such as cyclists and pedestrians, is needed to protect road users outside of the vehicle. Without new initiatives on general road safety,
    the safety effects of the current approach will no longer be able to off-set the effects of increasing traffic volumes. Therefore, the safety performance of vehicles needs to be further improved as
    part of an integrated road safety approach and in order to protect vulnerable road users better.


    (4)


    Type-approval provisions should ensure that motor vehicle performance levels are assessed in a repeatable and reproducible manner. Therefore, the technical requirements in this Regulation only refer
    to pedestrians and cyclists, as only these presently exist as formally harmonised testing target subjects. Besides pedestrians and cyclists, vulnerable road users, in general, also include other non-motorised
    and motorised road users who might use personal mobility solutions without protective bodywork. Moreover, current technology creates a reasonable expectation that advanced systems will also react to
    other vulnerable road users under normal driving conditions, despite not being specifically tested. The technical requirements in this Regulation should be further adapted to technical progress following
    an assessment and review process in order to cover all road users who use personal mobility solutions without protective bodywork, such as scooters, self-balancing vehicles and wheelchairs.


    (5)


    Technical progress in the area of advanced vehicle safety systems offers new possibilities for reducing casualty numbers. In order to minimise the number of severe injuries and fatalities, a set of
    new technologies needs to be introduced.


    (6)


    Within the context of Regulation (EC) No 661/2009 of the European Parliament and of the Council

    (

    5

    )

    , the Commission assessed the feasibility of extending the existing requirement in that Regulation to install certain systems (for example, advanced emergency braking systems and tyre pressure monitoring
    systems) in certain categories of vehicles so that it applied to all vehicle categories. The Commission also assessed the technical and economic feasibility and market maturity of imposing a new requirement
    to install other advanced safety features. Based on those assessments, the Commission published a report for the European Parliament and the Council on 12 December 2016 entitled ‘Saving Lives: Boosting
    Car Safety in the EU’. The Commission Staff Working Document accompanying that report identified and put forward 19 potential regulatory measures that would be effective in further reducing the number
    of road accidents and road fatalities and injuries.


    (7)


    To ensure technology neutrality, the performance requirements should allow both direct and indirect tyre pressure monitoring systems.


    (8)


    Advanced vehicle systems can be more effective in reducing fatalities, decreasing the number of road accidents and mitigating injuries and damage if they are designed to be convenient for users. Therefore,
    vehicle manufacturers should do their utmost to ensure that the systems and features provided for in this Regulation are developed in such a way that supports the driver. The functioning of those systems
    and features and their limitations should be explained in a clear and consumer-friendly manner in the motor vehicle’s user instructions.


    (9)


    Safety features and warnings used in assisting driving should be easily perceivable by every driver, including the elderly and persons with disabilities.


    (10)


    Advanced emergency braking systems, intelligent speed assistance, emergency lane‐keeping systems, driver drowsiness and attention warning, advanced driver distraction warning and reversing detection
    are safety systems that have a high potential to reduce casualty numbers considerably. In addition, some of those safety systems form the basis of technologies which will also be used for the deployment
    of automated vehicles. Any such safety systems should function without the use of any kind of biometric information of drivers or passengers, including facial recognition. Therefore, harmonised rules
    and test procedures for the type-approval of vehicles as regards those systems and for the type‐approval of those systems as separate technical units should be established at Union level. The technological
    progress of those systems should be taken into account in every evaluation of the existing legislation, in order to be future‐proof, whilst strictly adhering to the principles of privacy and data protection,
    and to reduce or eliminate accidents and injuries in road transport. It is also necessary to ensure that those systems can be used safely throughout the life cycle of the vehicle.


    (11)


    It should be possible to switch off intelligent speed assistance, for instance, when a driver experiences false warnings or inappropriate feedback as a result of inclement weather conditions, temporarily
    conflicting road markings in construction zones, or misleading, defective or missing road signs. Such a switch-off feature should be under the control of the driver. It should allow for intelligent
    speed assistance to be switched off for as long as necessary and to be easily switched back on by the driver. When the system is switched off, information about the speed limit may be provided. The
    system should be always active when switching the ignition on and the driver should always be made aware of whether the system is on or off.


    (12)


    It is widely recognised that safety-belts are one of the most important and effective vehicle safety features. Safety-belt reminder systems therefore have the potential to further prevent fatalities
    or mitigate injuries by increasing the safety-belt wearing rates across the Union. For that reason, under Regulation (EC) No 661/2009 the safety-belt reminder system was made compulsory for the driver
    seat in all new passenger cars from 2014 in implementation of United Nations (UN) Regulation No 16, which established the relevant technical provisions. As a result of the amendment of that UN Regulation
    to take account of technical progress, it is obligatory to fit all front and rear seats of M

    1

    and N

    1

    vehicles, as well as all front seats of N

    2

    , N

    3

    , M

    2

    and M

    3

    vehicles, with safety-belt reminder systems from 1 September 2019 for new types of motor vehicles and 1 September 2021 for all new motor vehicles.


    (13)


    The introduction of event data recorders storing a range of crucial anonymised vehicle data, accompanied by requirements for data range, accuracy, resolution and for its collection, storage and retrievability
    over a short timeframe before, during and immediately after collision (for example, triggered by the deployment of an airbag) is a valuable step in obtaining more accurate, in-depth accident data. All
    motor vehicles should therefore be required to be equipped with such recorders. Those recorders should be capable of recording and storing data in such a way that the data can only be used by Member
    States to conduct road safety analysis and assess the effectiveness of specific measures taken without the possibility of identifying the owner or the holder of a particular vehicle on the basis of
    the stored data.


    (14)


    Any processing of personal data, such as information about the driver processed in event data recorders or information about the driver’s drowsiness and attention or the driver’s distraction, should
    be carried out in accordance with with Union data protection law, in particular Regulation (EU) 2016/679 of the European Parliament and of the Council

    (

    6

    )

    . Event data recorders should operate on a closed-loop system, in which the data stored is overwritten, and which does not allow the vehicle or holder to be identified. In addition, the driver drowsiness
    and attention warning or advanced driver distraction warning should not continuously record nor retain any data other than what is necessary in relation to the purposes for which they were collected
    or otherwise processed within the closed-loop system. Furthermore, the processing of personal data collected through the 112-based eCall in-vehicle system is subject to specific safeguards set out in
    Regulation (EU) 2015/758 of the European Parliament and of the Council

    (

    7

    )

    .


    (15)


    Advanced emergency braking systems or emergency lane-keeping systems might not be fully operational in some cases, in particular due to shortcomings in road infrastructure. In those cases, the systems
    should deactivate themselves and give information about the deactivation to the driver. If they do not deactivate automatically, it should be possible to switch them off manually. Such deactivation
    should be temporary and should only last for the period when the system is not fully operational. Drivers might also need to override advanced emergency braking system or emergency lane keeping system
    where the functioning of the system could lead to greater risk or harm. This would ensure that the vehicles are under the driver’s control at all times. Nevertheless such systems could also recognise
    instances where the driver is incapa'
- id: art-2
  title: CHAPTER I
  text: 'CHAPTER I


    SUBJECT MATTER, SCOPE AND DEFINITIONS'
- id: art-3
  title: Article 1
  text: 'Article 1


    Subject matter


    This Regulation establishes requirements:


    (a)


    for the type-approval of vehicles, and of systems, components and separate technical units designed and constructed for vehicles, with regard to their general characteristics and safety, and to the
    protection and safety of vehicle occupants and vulnerable road users;


    (b)


    for the type-approval of vehicles, in respect of tyre pressure monitoring systems, with regard to their safety, fuel efficiency and CO

    2

    emissions; and


    (c)


    for the type-approval of newly-manufactured tyres with regard to their safety and environmental performance.'
- id: art-4
  title: Article 2
  text: 'Article 2


    Scope


    This Regulation applies to vehicles of categories M, N and O, as defined in Article 4 of Regulation (EU) 2018/858, and to systems, components and separate technical units designed and constructed for
    such vehicles.'
- id: art-5
  title: Article 3
  text: 'Article 3


    Definitions


    For the purposes of this Regulation, the definitions laid down in Article 3 of Regulation (EU) 2018/858 apply.


    In addition, the following definitions apply:


    (1)


    ‘vulnerable road user’ means non-motorised road users, including, in particular, cyclists and pedestrians, as well as users of powered two-wheelers;


    (2)


    ‘tyre pressure monitoring system’ means a system fitted on a vehicle which can evaluate the pressure of the tyres or the variation of pressure over time and transmit corresponding information to the
    user while the vehicle is running;


    (3)


    ‘intelligent speed assistance’ means a system to aid the driver in maintaining the appropriate speed for the road environment by providing dedicated and appropriate feedback;


    (4)


    ‘alcohol interlock installation facilitation’ means a standardised interface that facilitates the fitting of aftermarket alcohol interlock devices in motor vehicles;


    (5)


    ‘driver drowsiness and attention warning’ means a system that assesses the driver’s alertness through vehicle systems analysis and warns the driver if needed;


    (6)


    ‘advanced driver distraction warning’ means a system that helps the driver to continue to pay attention to the traffic situation and that warns the driver when he or she is distracted;


    (7)


    ‘emergency stop signal’ means a light-signalling function to indicate to other road users to the rear of the vehicle that a high retardation force is being applied to the vehicle relative to the prevailing
    road conditions;


    (8)


    ‘reversing detection’ means a system to make the driver aware of people and objects at the rear of the vehicle with the primary aim of avoiding collisions when reversing;


    (9)


    ‘lane departure warning system’ means a system to warn the driver that the vehicle is drifting out of its travel lane;


    (10)


    ‘advanced emergency braking system’ means a system which can automatically detect a potential collision and activate the vehicle braking system to decelerate the vehicle with the purpose of avoiding
    or mitigating a collision;


    (11)


    ‘emergency lane-keeping system’ means a system that assists the driver in keeping a safe position of the vehicle with respect to the lane or road boundary, at least when a lane departure occurs or is
    about to occur and a collision might be imminent;


    (12)


    ‘vehicle master control switch’ means the device by which the vehicle’s on-board electronics system is brought, from being switched off, as in the case where a vehicle is parked without the driver being
    present, to normal operation mode;


    (13)


    ‘event data recorder’ means a system with the only purpose of recording and storing critical crash-related parameters and information shortly before, during and immediately after a collision;


    (14)


    ‘frontal protection system’ means a separate structure or structures, such as a bull bar, or a supplementary bumper which, in addition to the original‐equipment bumper, is intended to protect the external
    surface of the vehicle from damage in the event of a collision with an object, with the exception of structures having a mass of less than 0,5 kg, intended to protect only the vehicle’s lights;


    (15)


    ‘bumper’ means any front, lower, outer structures of a vehicle, including attachments thereto, which are intended to give protection to a vehicle when involved in a low speed frontal collision with
    another vehicle; it does not include however any frontal protection system;


    (16)


    ‘hydrogen-powered vehicle’ means any motor vehicle that uses hydrogen as fuel to propel the vehicle;


    (17)


    ‘hydrogen system’ means an assembly of hydrogen components and connecting parts fitted on a hydrogen-powered vehicle, excluding the hydrogen-powered propulsion system or the auxiliary power unit;


    (18)


    ‘hydrogen-powered propulsion system’ means the energy converter used to propel the vehicle;


    (19)


    ‘hydrogen component’ means hydrogen containers and all other parts of hydrogen‐powered vehicles that are in direct contact with hydrogen or which form part of a hydrogen system;


    (20)


    ‘hydrogen container’ means the component within the hydrogen system that stores the primary volume of hydrogen fuel;


    (21)


    ‘automated vehicle’ means a motor vehicle designed and constructed to move autonomously for certain periods of time without continuous driver supervision but in respect of which driver intervention
    is still expected or required;


    (22)


    ‘fully automated vehicle’ means a motor vehicle that has been designed and constructed to move autonomously without any driver supervision;


    (23)


    ‘driver availability monitoring system’ means a system to assess whether the driver is in a position to take over the driving function from an automated vehicle in particular situations, where appropriate;


    (24)


    ‘vehicle platooning’ means the linking of two or more vehicles in a convoy using connectivity technology and automated driving support systems which allow the vehicles to maintain automatically a set,
    close distance between each other when connected for certain parts of a journey and to adapt to changes in the movement of the lead vehicle with little to no action from the drivers;


    (25)


    ‘maximum mass’ means the technically permissible maximum laden mass stated by the manufacturer;


    (26)


    ‘A-pillar’ means the foremost and outermost roof support extending from the chassis to the roof of the vehicle.'
- id: art-6
  title: CHAPTER II
  text: 'CHAPTER II


    OBLIGATIONS OF MANUFACTURERS'
- id: art-7
  title: Article 4
  text: 'Article 4


    General obligations and technical requirements


    1.   Manufacturers shall demonstrate that all new vehicles that are placed on the market, registered or entered into service, and all new systems, components and separate technical units that are placed
    on the market or entered into service, are type-approved in accordance with the requirements of this Regulation and of the delegated acts and implementing acts adopted pursuant to it.


    2.   Type-approval in accordance with the UN Regulations listed in Annex I shall be considered as EU type-approval in accordance with the requirements of this Regulation and of the delegated acts and
    implementing acts adopted pursuant to it.


    3.   The Commission is empowered to adopt delegated acts in accordance with Article 12 to amend Annex I in order to take account of technical progress and regulatory developments by introducing and
    updating references to the UN Regulations, and relevant series of amendments, that apply on a compulsory basis.


    4.   Manufacturers shall ensure that vehicles are designed, constructed and assembled so as to minimise the risk of injury to vehicle occupants and vulnerable road users.


    5.   Manufacturers shall also ensure that vehicles, systems, components and separate technical units comply with the applicable requirements listed in Annex II with effect from the dates specified in
    that Annex, with the detailed technical requirements and test procedures laid down in the delegated acts and with the uniform procedures and technical specifications laid down in the implementing acts
    adopted pursuant to this Regulation, including the requirements relating to:


    (a)


    restraint systems, crash testing, fuel system integrity and high voltage electrical safety;


    (b)


    vulnerable road users, vision and visibility;


    (c)


    vehicle chassis, braking, tyres and steering;


    (d)


    on-board instruments, electrical system, vehicle lighting and protection against unauthorised use including cyberattacks;


    (e)


    driver and system behaviour; and


    (f)


    general vehicle construction and features.


    6.   The Commission is empowered to adopt delegated acts in accordance with Article 12 to amend Annex II in order to take account of technical progress and regulatory developments, in particular in
    relation to the matters listed in points (a) to (f) of paragraph 5 of this Article as well as those referred to in points (a) to (g) of Article 6(1), Article 7(2), (3), (4) and (5), Article 9(2), (3)
    and (5) and Article 11(1), and with a view to ensuring a high level of general safety of vehicles, systems, components and separate technical units and a high level of protection of vehicle occupants
    and vulnerable road users, by introducing and updating references to UN Regulations, as well as to delegated acts and implementing acts.


    7.   The Commission shall by means of implementing acts adopt provisions concerning uniform procedures and technical specifications for the type-approval of vehicles, systems, components and separate
    technical units with regard to the requirements listed in Annex II.


    Those implementing acts shall be adopted in accordance with the examination procedure referred to in Article 13(2). They shall be published at least 15 months before the applicable dates specified in
    Annex II.'
- id: art-8
  title: Article 5
  text: 'Article 5


    Specific provisions relating to tyre pressure monitoring systems and tyres


    1.   Vehicles shall be equipped with an accurate tyre pressure monitoring system capable, over a wide range of road and environmental conditions, of giving an in-vehicle warning to the driver when a
    loss of pressure occurs in a tyre.


    2.   Tyre pressure monitoring systems shall be designed to avoid resetting or recalibration at a low tyre pressure.


    3.   All tyres placed on the market shall meet the safety and environmental performance requirements set out in the relevant regulatory acts listed in Annex II.


    4.   The Commission shall by means of implementing acts adopt provisions concerning uniform procedures and technical specifications for:


    (a)


    the type-approval of vehicles with regard to their tyre pressure monitoring systems;


    (b)


    the type-approval of tyres, including technical specifications concerning their installation.


    Those implementing acts shall be adopted in accordance with the examination procedure referred to in Article 13(2). They shall be published at least 15 months before the applicable dates specified in
    Annex II.'
- id: art-9
  title: Article 6
  text: 'Article 6


    Advanced vehicle systems for all motor vehicle categories


    1.   Motor vehicles shall be equipped with the following advanced vehicle systems:


    (a)


    intelligent speed assistance;


    (b)


    alcohol interlock installation facilitation;


    (c)


    driver drowsiness and attention warning;


    (d)


    advanced driver distraction warning;


    (e)


    emergency stop signal;


    (f)


    reversing detection; and


    (g)


    event data recorder.


    2.   Intelligent speed assistance shall meet the following minimum requirements:


    (a)


    it shall be possible for the driver to be made aware through the accelerator control, or through dedicated, appropriate and effective feedback, that the applicable speed limit is exceeded;


    (b)


    it shall be possible to switch off the system; information about the speed limit may still be provided, and intelligent speed assistance shall be in normal operation mode upon each activation of the
    vehicle master control switch;


    (c)


    the dedicated and appropriate feedback shall be based on speed limit information obtained through the observation of road signs and signals, based on infrastructure signals or electronic map data, or
    both, made available in-vehicle;


    (d)


    it shall not affect the possibility, for the drivers, of exceeding the system’s prompted vehicle speed;


    (e)


    its performance targets shall be set in order to avoid or minimise the error rate under real driving conditions.


    3.   Driver drowsiness and attention warning and advanced driver distraction warning systems shall be designed in such a way that those systems do not continuously record nor retain any data other than
    what is necessary in relation to the purposes for which they were collected or otherwise processed within the closed-loop system. Furthermore, those data shall not be accessible or made available to
    third parties at any time and shall be immediately deleted after processing. Those systems shall also be designed to avoid overlap and shall not prompt the driver separately and concurrently or in a
    confusing manner where one action triggers both systems.


    4.   Event data recorders shall meet the following requirements in particular:


    (a)


    the data that they are capable of recording and storing with respect of the period shortly before, during and immediately after a collision shall include the vehicle’s speed, braking, position and tilt
    of the vehicle on the road, the state and rate of activation of all its safety systems, 112-based eCall in-vehicle system, brake activation and relevant input parameters of the on-board active safety
    and accident avoidance systems, with high level of accuracy and ensured survivability of data;


    (b)


    they cannot be deactivated;


    (c)


    the way in which they are capable of recording and storing data shall be such that:


    (i)


    they operate on a closed-loop system;


    (ii)


    the data that they collect is anonymised and protected against manipulation and misuse; and


    (iii)


    the data that they collect enables precise vehicle type, variant and version, and in particular the active safety and accident avoidance systems fitted to the vehicle, to be identified; and


    (d)


    the data that they are capable of recording can be made available to national authorities, on the basis of Union or national law, only for the purpose of accident research and analysis, including for
    the purposes of type approval of systems and components and in compliance with Regulation (EU) 2016/679, over a standardised interface.


    5.   An event data recorder shall not be capable of recording and storing the last four digits of the vehicle indicator section of the vehicle identification number or any other information which could
    allow the individual vehicle itself, its owner or holder, to be identified.


    6.   The Commission shall adopt delegated acts in accordance with Article 12 supplementing this Regulation by laying down detailed rules concerning the specific test procedures and technical requirements
    for:


    (a)


    the type-approval of vehicles with regard to the advanced vehicle systems listed in paragraph 1;


    (b)


    the type-approval of the advanced vehicle systems listed in points (a), (f) and (g) of paragraph 1 as separate technical units.


    Those delegated acts shall be published at least 15 months before the applicable dates specified in Annex II.'
- id: art-10
  title: Article 7
  text: 'Article 7


    Specific requirements relating to passenger cars and light commercial vehicles


    1.   In addition to the other requirements of this Regulation and of the delegated acts and implementing acts adopted pursuant to it that are also applicable to vehicles of categories M

    1

    and N

    1

    , vehicles of those categories shall meet the requirements set out in paragraphs 2 to 5 and the technical specifications set out in the implementing acts referred to in paragraph 6.


    2.   Vehicles of categories M

    1

    and N

    1

    shall be equipped with advanced emergency braking systems designed and fitted in two phases and providing for:


    (a)


    the detection of obstacles and moving vehicles ahead of the motor vehicle in the first phase;


    (b)


    extending the detection capability referred to in point (a) to also include pedestrians and cyclists ahead of the motor vehicle in the second phase.


    3.   Vehicles of categories M

    1

    and N

    1

    shall also be equipped with an emergency lane-keeping system.


    4.   Advanced emergency braking systems and emergency lane-keeping systems shall meet the following requirements in particular:


    (a)


    it shall only be possible to switch off such systems one at a time by a sequence of actions to be carried out by the driver;


    (b)


    the systems shall be in normal operation mode upon each activation of the vehicle master control switch;


    (c)


    it shall be possible to easily suppress audible warnings, but such action shall not at the same time suppress system functions other than audible warnings;


    (d)


    it shall be possible for the driver to override such systems.


    5.   Vehicles of categories M

    1

    and N

    1

    shall be designed and constructed to provide for an enlarged head impact protection zone with the aim of enhancing the protection of vulnerable road users and mitigating their potential injuries in
    the event of a collision.


    6.   The Commission shall by means of implementing acts adopt provisions concerning uniform procedures and technical specifications for the type-approval of vehicles with regard to the requirements
    laid down in paragraphs 2 to 5 of this Article.


    Those implementing acts shall be adopted in accordance with the examination procedure referred to in Article 13(2). They shall be published at least 15 months before the applicable dates specified in
    Annex II.'
- id: art-11
  title: Article 8
  text: 'Article 8


    Frontal protection systems for passenger cars and light commercial vehicles


    1.   Frontal protection systems, whether fitted as original equipment to vehicles of categories M

    1

    and N

    1

    or made available on the market as separate technical units for such vehicles, shall comply with the requirements laid down in paragraph 2 and with the technical specifications set out in the implementing
    acts referred to in paragraph 3.


    2.   Frontal protection systems made available on the market as separate technical units shall be accompanied by a detailed list of the vehicle types, variants and versions for which the frontal protection
    system is type-approved, as well as by clear assembly instructions.


    3.   The Commission shall by means of implementing acts adopt provisions concerning uniform procedures and technical specifications for the type-approval of frontal protection systems, including technical
    specifications concerning their construction and installation.


    Those implementing acts shall be adopted in accordance with the examination procedure referred to in Article 13(2). They shall be published at least 15 months before the applicable dates specified in
    Annex II.'
- id: art-12
  title: Article 9
  text: 'Article 9


    Specific requirements relating to buses and trucks


    1.   In addition to the other requirements of this Regulation and of the delegated acts and implementing acts adopted pursuant to it that are also applicable to vehicles of categories M

    2

    , M

    3

    , N

    2

    and N

    3

    , vehicles of those categories shall meet the requirements laid down in paragraphs 2 to 5 and the technical specifications set out in the implementing acts referred to in paragraph 7. Vehicles of categories
    M

    2

    and M

    3

    , shall also meet the requirement laid down in paragraph 6.


    2.   Vehicles of categories M

    2

    , M

    3

    , N

    2

    and N

    3

    shall be equipped with a lane departure warning system and an advanced emergency braking system, both of which shall comply with the the technical specifications set out in the implementing acts referred
    to in paragraph 7.


    3.   Vehicles of categories M

    2

    , M

    3

    , N

    2

    and N

    3

    shall be equipped with advanced systems that are capable of detecting pedestrians and cyclists located in close proximity to the front or nearside of the vehicle and of providing a warning or avoiding
    collision with such vulnerable road users.


