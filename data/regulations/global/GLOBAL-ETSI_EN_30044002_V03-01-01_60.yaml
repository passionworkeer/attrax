- id: art-3
  title: 'Annex C (informative):'
  text: 'Annex C (informative):

    Change history

    Version Information about changes

    V2.1.1 This work included merging of previous versions of part 1 and 2. Revision of standard

    parts to cover the essential requirements of article 3.2 of the RE-D. Clarifications in the

    measurement procedure.

    V2.2.1 • Additional Rx-requirement for category 3 receivers: "blocking or desensitization".

    • Clarification harmonized and non-harmonized frequency ranges covered by the

    present document.

    Clarification text: "General performance criteria".

    • 2,4 GHz RFID, GBSAR removed sent to TG 34 (RFID), and TGUWB (UWB)

    respectively.

    • ETSI EN 300 440 split into 3 application specific parts: Communication,

    V3.1.1

    Radiodetermination location tracking, Intrusion radiodetermination.

    • Testing methodology standardized to use ETSI EN 303 883-1 and -2 for

    transmitter and receiver.

