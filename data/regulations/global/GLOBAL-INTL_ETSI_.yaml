    Smart appliances and SAREF\nSmart cities\nSmart Grids and Meters\nSubscribe to alerts for ETSI deliverables\nPlease enter your details below to be informed when a new version of the selected deliverable\
    \ is publicly available:\nFirstname:\nLastname:\nEmail Address:\n\t\t\t\t\t I agree and accept that my personal data contained in the present form are collected and stored in compliance with the \n\
    ETSI privacy policy\n to be notified of ETSI deliverables updates. \n\t\t\t\t\t If you have any question about your personal data or wish to exercise your rights of access, \n\t\t\t\t\t rectification\
    \ and/or erasure, please send an e-mail to \n[email protected]\n.\n\t\tA confirmation e-mail has been sent. Please click on the link in the e-mail to confirm your subscription.\n\t\tThere was a problem\
    \ with the service and your request cannot be processed. Please try again later.\nUnderstanding standards\nWe publish thousands of freely-available technology standards, specifications and reports every\
    \ year. Learn about the different types of ETSI publications, and their critical role in ensuring the interoperability, safety, sustainability and regulatory compliance of ICT systems worldwide.\nRead\
    \ more \nThe standards-making process\nOur world-class technical standards are created through a transparent, consensus-driven process. Find out how ETSI standards are developed, approved and maintained\
    \ to ensure their enduring value and relevance in a fast-changing European and global technology landscape.\nRead more \nEuropean regulation\nETSI supports European radio regulation by providing harmonised\
    \ standards and technical guidance.\nOur work enables manufacturers and service providers to access European markets while ensuring compliance.\nThrough collaboration with the EC, EFTA and CEPT/ECC,\
    \ we help shape spectrum use and regulatory frameworks.\nRead more \nCoordinated Vulnerability Disclosure (CVD)\nETSI’s Coordinated Vulnerability Disclosure (CVD) process provides a secure and transparent\
    \ way for individuals and organisations to report potential security issues in ETSI standards. Valid reports are triaged and resolved in collaboration with technical groups, with the aim of reaching\
    \ resolution within 90 days.\nRead more \nOther ways to get ETSI standards\nThe \nNational Standards Organisations\n (NSOs) assist us in the making of European Standards (ENs). You can buy the standards\
    \ from these NSOs.\nThe National Standardisation Bodies (NSBs) assist us in the making of European Standards (ENs) and European standardisation deliverables in response to Standardisation Requests to\
    \ support the European legislation or policies, in accordance with the amended Regulation (EU) No 1025/2012.\nThere are international distributors around the world from which you can also obtain ETSI\
    \ standards:\nCountry \n Company name\nAUSTRALIA\nStandards Australia\nCZECH REPUBLIC\nNormservis\nEN Standard\nJAPAN \nKEC Ogasawara\nKAZAKHSTAN \nRSE\n (Kazakhstan institute for standardization and\
