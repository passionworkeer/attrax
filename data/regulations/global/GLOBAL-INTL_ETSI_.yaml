  title: Standards - ETSI
  text: "Standards - ETSI\nSearch for:\nStandards\nExplore the technology standards ETSI creates for a connected world\nAs an officially recognised European Standardisation Organisation, ETSI creates and\
    \ maintains thousands of standards, technical specifications and other deliverables that are foundational to the development and market success of ICT-enabled products, systems, applications and services.\
    \ In a hyper-connected global marketplace ETSI standards foster interoperability, cybersecurity and sustainability to benefit technology developers, vendors and end users.\nListen to the standards story!\n\
