    \ Group meeting on DDT was held in Geneva, Switzerland from 14-16 September.  Among others the objective of the meeting was to make recommendations to the Conference of the Parties to the Stockholm\
    \ Convention on the continued need for DDT for disease vector control and on any actions deemed necessary to reduce the reliance on DDT.\nMeeting report of the 2nd meeting of the Compliance Committee\
    \ now available!\nThe second meeting of the Stockholm Convention Compliance Committee was held in Geneva from 16-19 June 2026. The Committee resumed its consideration of the activities of its work programme\
    \ for 2026 - 2027.\nPreparations are underway for the Eleventh Expert Group Meeting on DDT \nThe Eleventh Expert Group Meeting on DDT will be held in Geneva from 14 to 16 September 2026. \nThe clock\
    \ is ticking, the deadline for reporting is fast approaching\nThe Sixth round of national reports under the Stockholm Convention are due on 31 August 2026. As of mid-July, only 10 countries had completed\
    \ their reporting obligations, leaving 176 Parties still to submit their reports. Don't wait until the last minute. Start your reporting process now and ensure your sixth National Report is submitted\
