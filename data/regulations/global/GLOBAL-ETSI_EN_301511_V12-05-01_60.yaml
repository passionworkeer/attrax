    3 Definitions and abbreviations

    3.1 Definitions

    For the purposes of the present document, the terms and definitions given in ETSI TR 121 905 [i.18] and the following

    apply:

    EGPRS: any subset of the packet traffic channels PDTCH/MCS-1 to MCS-9 and related control channels

    E-GSM: extended GSM 900 band (includes P-GSM band)

    environmental profile: range of environmental conditions under which equipment within the scope of the present

    document is required to comply with the provisions of the present document

    ER-GSM 900: extended Railway GSM 900 band (includes R-GSM band)

    GPRS: any subset of the packet traffic channels PDTCH/CS-1 to CS-4 and related control channels

    GSM 900: P-GSM, E-GSM and R-GSM band unless otherwise specified,

    ETSI

    10 ETSI EN 301 511 V12.5.1 (2017-03)

    GSM: GSM 400, GSM 900, ER-GSM 900 and DCS 1800 band unless otherwise specified

    P-GSM: primary GSM 900 band

    R-GSM: Railways GSM 900 band (includes P-GSM band and E-GSM band)

    3.2 Abbreviations

    For the purposes of the present document, the following abbreviations apply:

    AM Amplitude Modulation

    DLMC Downlink Multi-Carrier

    ECSD Enhanced Circuit Switched Data

    EGPRS Enhanced GPRS

    ER-GSM Extended Railways GSM

    GPRS General Packet Radio Service

    GSM Global System for Mobile communications

    HSCSD High Speed Circuit Switched Data

    MS Mobile Station which includes a GSM radio part

    RF Radio Frequency

    RX Reception

    TCH/FS Traffic CHannel for Full rate Speech

    TDMA Time Division Multiple Access

    TX Transmission

    4 Technical requirements specifications

    4.1 Environmental profile

    The technical requirements of the present document apply under the environmental profile for operation of the

    equipment, which shall be declared by the manufacturer. The equipment shall comply with all the technical

    requirements of the present document which are identified as applicable in annex A at all times when operating within

    the boundary limits of the required operational environmental profile.

    4.2 Conformance requirements

    4.2.0 Introduction

    The present document contains all requirements that are needed for terminals to meet the essential requirement as

    defined in the Directive 2014/53/EU [i.9], article 3.2:

    - The present document gives normative reference to a clause of ETSI TS 151 010-1 [2] containing the

    conformance requirement text and references to the base standard.

    To meet the essential requirement under article 3.2 of Directive 2014/53/EU [i.9], a set of essential parameters have

    been identified. Table 2 provides a cross reference between these essential parameters and the corresponding technical

    requirements for equipment within the scope of the present document.

