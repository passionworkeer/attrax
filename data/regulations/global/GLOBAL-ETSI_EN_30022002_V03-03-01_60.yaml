    Modal verbs terminology

    In the present document "shall", "shall not", "should", "should not", "may", "need not", "will", "will not", "can" and

    "cannot" are to be interpreted as described in clause 3.2 of the ETSI Drafting Rules (Verbal forms for the expression of

    provisions).

    "must" and "must not" are NOT allowed in ETSI deliverables except when used in direct citation.

    Introduction

    The present document is part 2 of a multi-part deliverable covering Short Range Devices (SRD) operating in the

    frequency range 25 MHz to 1 000 MHz.

    Compared to earlier versions, the concept of wanted channel is replaced by Operating Channel for all equipment,

    equipment transmitting analog voice are not anymore excluded from the scope, a clarification has been made regarding

    the maximum occupied bandwidth requirement which is now split into two different requirements: occupied bandwidth

    and transmitter frequency stability in order to clearly separate the impact of Tx frequency drift on the transmitted signal,

    from the spectrum broadening due to modulation. Out of band transmission masks have also been split into two

    different requirements, one spectrum mask applying to the operating channel and a separate spectrum mask applying to

    the permitted frequency band. Adjacent channel power limits have been reviewed as a discrepancy in values was

    corrected. New receiver requirements have been added according to the ETSI EG 203 336 [i.4] on Rx parameters. Some

    of these parameters were previously only applicable to specific life critical application with extremely high receiver

    performances also called Receiver Category 1. Although the requirements are now applied generally, the limits have

    been adapted to non specific SRD category. Tests for timing compliance of equipment using polite spectrum access

    have been added.

    The intended use of radio equipment is provided in equipment documentation according to article 10 of the Radio

    Equipment Directive 2014/53/EU [i.2].

    The present document is structured as follows:

    • Clause 2 provides references.

    • Clause 3 provides definitions of terms, symbols and abbreviations used.

    • Clause 4 provides operating conditions and technical requirements specification.

    • Clause 5 provides testing for compliance with technical requirements.

    • Annex A (informative) provides the relationship between the present document and the essential requirements

    of Directive 2014/53/EU [i.2].

    • Annex B (normative): EU wide harmonised national radio interfaces from 25 MHz to 1 000 MHz.

    • Annex C (normative): National Radio Interfaces not EU wide harmonised.

    • Annex D (normative): Test sites and arrangements for radiated measurement.

    • Annex E (normative): Test fixture.

    • Annex F (informative): Guideline for operating channel.

    • Annex G (informative): Properties of EUT.

    • Annex H (informative): Maximum measurement uncertainty.

    • Annex I (informative): Selection of technical parameters.

    • Annex J (informative): Bibliography.

    • Annex K (informative): Change history.

