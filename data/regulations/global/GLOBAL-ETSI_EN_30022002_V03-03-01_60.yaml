  title: 'Annex C (informative):'
  text: 'Annex C (informative):

    National Radio Interfaces not EU wide harmonised

    In addition to EU wide harmonised radio interfaces listed in Annex B, EU and EFTA member states may implement NRIs with associated technical requirements to ensure

    spectrum compatibility. Usually these requirements come from CEPT/ERC/REC 70-03 [i.1] which sets out the general position on spectrum designations for Short Range

    Devices (SRDs) for countries within the CEPT.

    Table C.1 provides a list of these NRIs which might be available in some EU countries.

