    WiMAXTM: trade marked name for the OFDMA TDD WMAN IMT technology

    NOTE: WiMAXTM is an example of a suitable technology available commercially. This information is given for

    the convenience of users of the present document and does not constitute an endorsement by ETSI of this

    technology.

