    Foreword

    This Harmonised European Standard (EN) has been produced by ETSI Technical Committee Mobile Standards Group

    (MSG).

    The present document has been prepared under the Commission''s standardization request C(2015) 5376 final [i.9] to

    provide one voluntary means of conforming to the essential requirements of Directive 2014/53/EU on the harmonisation

    of the laws of the Member States relating to the making available on the market of radio equipment and repealing

    Directive 1999/5/EC [i.2].

    Once the present document is cited in the Official Journal of the European Union under that Directive, compliance with

    the normative clauses of the present document given in table A-1 confers, within the limits of the scope of the present

    document, a presumption of conformity with the corresponding essential requirements of that Directive, and associated

    EFTA regulations.

    The present document is part 2 of a multi-part deliverable. Full details of the entire series can be found in part 1 [i.10].

    National transposition dates

