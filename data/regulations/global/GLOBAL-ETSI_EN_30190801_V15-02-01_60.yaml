    ETSI EN 301 908 [i.8] is divided into multiple standard parts as follows:

    • Part 1: Introduction and common requirements

    The scope of Part 1 is common technical requirements for the IMT RITs, except for IMT-2000

    FDMA/TDMA. This includes radiated emissions (UE, BS and repeater) and Control and monitoring functions

    (UE).

    • Part 2: CDMA Direct Spread (UTRA FDD) User Equipment (UE)

    The scope of Part 2 is User Equipment for IMT-2000 CDMA Direct Spread, which includes UTRA FDD as

    defined by ETSI (3GPP).

    • Part 3: CDMA Direct Spread (UTRA FDD) Base Stations (BS)

    The scope of Part 3 is Base Stations for IMT-2000 CDMA Direct Spread, which includes UTRA FDD as

    defined by ETSI (3GPP).

    • Part 10: IMT-2000 FDMA/TDMA (DECT) covering the essential requirements of article 3.2 of the

    Directive 2014/53/EU

    The scope of Part 10 is equipment for IMT-2000 TDMA FDMA/TDMA, which includes DECT as defined by

    ETSI (DECT), including radiated spurious emission and Control and monitoring function.

    • Part 11: CDMA Direct Spread (UTRA FDD) (Repeaters)

    The scope of Part 11 is Repeaters for IMT-2000 CDMA Direct Spread, which includes UTRA FDD as defined

    by ETSI (3GPP).

    • Part 12: IMT-2000 CDMA Multi Carrier (cdma2000) (Repeaters)

    The scope of Part 12 is Repeaters for IMT-2000 CDMA Multi-Carrier, which includes cdma2000 as defined

    by TIA (3GPP2).

    • Part 13: Evolved Universal Terrestrial Radio Access (E-UTRA) (UE)

    The scope of Part 13 is User Equipment for E-UTRA as defined by ETSI (3GPP).

    • Part 14: Evolved Universal Terrestrial Radio Access (E-UTRA) (BS)

    The scope of Part 14 is Base Stations for E-UTRA as defined by ETSI (3GPP).

    • Part 15: Evolved Universal Terrestrial Radio Access (E-UTRA FDD) (Repeaters)

    The scope of Part 15 is Repeaters for E-UTRA (FDD) as defined by ETSI (3GPP).

    • Part 18: E-UTRA, UTRA and GSM/EDGE Multi-Standard Radio (MSR) Base Stations (BS)

    The scope of Part 18 is Multi-Standard Radio capable Base stations (NR, E-UTRA, UTRA, GSM/EDGE) as

    defined by ETSI (3GPP).

    • Part 19: OFDMA TDD WMAN (Mobile WiMAXTM) TDD User Equipment (UE)

    The scope of Part 19 is User Equipment for OFDMA TDD WMAN (Mobile WiMAXTM) operating in TDD

    mode as defined by IEEE / WiMAX Forum®.

