  text: 'Annex C (informative):

    Overview and organization of ETSI EN 301 908 standard

    parts

    This annex provides an overview of the following IMT technologies included in the multi-part deliverable ETSI

    EN 301 908 [i.8] and how the different standard parts map to the terrestrial components of IMT-2000, IMT Advanced

    and IMT-2020. IMT is specified by ITU-R in Recommendation M.1457-15 [i.4] and contains the following terrestrial

    IMT-2000 component radio interfaces:

    • IMT-2000 CDMA Direct Spread.

    • IMT-2000 CDMA Multi-Carrier.

    • IMT-2000 CDMA TDD.

    • IMT-2000 TDMA Single-Carrier.

    • IMT-2000 FDMA/TDMA.

    • IMT-2000 OFDMA TDD WMAN.

    IMT-Advanced is specified by ITU-R in Recommendation ITU-R M.2012-4 [i.5] and contains the following terrestrial

    IMT-Advanced radio interfaces:

    • LTE-Advanced.

    • Wireless MAN-Advanced.

    IMT-2020 is specified by ITU-R in Recommendation ITU-R M.2150.0 [i.10] and contains the following terrestrial

    IMT-2020 radio interface:

    • New Radio (NR).

    ETSI EN 301 908 [i.8] is a multi-part deliverable covering Base Stations (BS), Repeaters and User Equipment (UE) for

    the members of the terrestrial component of the IMT family. Further details of the standard parts are given below.

    NOTE: This annex only includes the parts that received support for the creation of ETSI work items under the

    Commission''s standardisation request C(2015) 5376 final [i.9] at the date of finalization of the present

    document.

    A cross-reference table for the standards parts applicable to the IMT terrestrial component radio access technologies is

    given in table C-1 and a frequency band cross reference table is given in table C-2. The scope, content and relation

    between the standard parts are given in the tables below.

