    • Part 20: OFDMA TDD WMAN (Mobile WiMAXTM) TDD Base Stations (BS)

    The scope of Part 20 is Base stations for OFDMA TDD WMAN (Mobile WiMAXTM) operating in TDD mode

    as defined by IEEE / WiMAX Forum®.

    • Part 21: OFDMA TDD WMAN (Mobile WiMAXTM) FDD User Equipment (UE)

    The scope of Part 21 is User Equipment for OFDMA TDD WMAN Mobile WiMAXTM (FDD) as defined by

    IEEE / WiMAX Forum®.

