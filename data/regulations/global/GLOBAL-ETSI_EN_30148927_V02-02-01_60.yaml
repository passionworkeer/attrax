- id: art-3
  title: 'Annex C (normative):'
  text: 'Annex C (normative):

    Test fixture for ULP-AMI (Simulated man)

    Equipment intended to be implanted in a human body for purposes of the present document should be tested in a

    simulated man constructed as follows in order to simulate operation of the implant under actual operating conditions as

    shown in figure C.1.

    30 cm

    Plastic Grid

    76 cm

    Implant w/ant

    and leads

    38 cm

    fixed to grid

    Cylinder filled with tissue

    substitute materia l

    Figure C.1: Test fixture

    An appropriate simulator for testing medical implant transmitters consists of a cylindrical Plexiglas container with a

    size of 30 cm ± 0,5 cm by 76 cm ± 0,5 cm with a sidewall thickness of 0,635 cm ± 0,05 cm. It shall be completely filled

    with a material that is sufficiently fluid that it will flow around the implant without any voids. The dielectric and

    conductivity properties of this material shall match the dielectric and conductivity properties of human muscle tissue at

    the centre frequency of operation or, if desired, at the measurement frequency.

    NOTE 1: Saline solutions do not meet the dielectric and conductivity requirements for use as a substitute for human

    tissue.

    All emissions measurements will be made using the above specification with the tissue substitute material at a nominal

    temperature between 22 °C and 38 °C.

    NOTE 2: This temperature will facilitate testing because it is typical of ambient conditions at many test sites.

    A mounting grid for the implant inside the container shall be provided that permits the radiating element or elements of

    the implant to be positioned vertically and horizontally. The grid should also support any additional implant leads

    associated with the therapeutic function of the implant in a fixed repeatable manner such that they do not influence the

    measurement.

    The implant antenna shall be mounted no further than 6 cm ± 0,5 cm from the sidewall and centred vertically within the

    container. When switching from vertical to horizontal positioning, it may be necessary to reposition the implant antenna

    to maintain a separation of 6 cm ± 0,5 cm from the sidewall of the test fixture along its length. Implant leads shall be

    coiled and placed away from the implant antenna while maintaining a nominal 6 cm from the sidewall.

    The above fixture shall be placed on a turntable such that the implant transmitter will be located at a nominal 1,5 m

    height above ground and at a 3 m distance from the measurement antenna. Radiated emissions measurements shall then

    be performed to insure compliance with the applicable technical specifications.

    ETSI

    23 ETSI EN 301 489-27 V2.2.1 (2019-04)

    Tissue parameters for various frequencies may be obtained from the Italian National Research Council, Institute for

    Applied Physics [i.5]. Other sources can be used provided they are based on the 4-Cole-Cole equations developed by

    Gabriel [i.3]. In most instances it may be advisable to make preliminary measurements to identify potential problem

    frequencies and use tissue material corresponding to human tissue characteristics at that frequency. In severe cases,

    tissue substitute material may be used that has conductivity and dielectric parameters that correspond to the human

    tissue at a problem frequency.

    ETSI

    24 ETSI EN 301 489-27 V2.2.1 (2019-04)

    Annex D (informative):

    Change history

    Version Information about changes

    Compared with earlier versions that were cited under previous EU Directives, the

    following changes have been introduced:

    • Radiated immunity testing to a continuous sweep between 80 MHz and

    6 000 MHz at 3V/m and 10 V/m depending on applications:

    − for non-life supporting communications link, the test level shall be 3 V/m

    V2.2.0

    (measured unmodulated);

    − for life supporting communications link, the test level shall be 10 V/m

    (measured unmodulated).

    The scope corrected to cover not therapy verification, but communication link

    verification.

