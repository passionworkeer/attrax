  title: 'Annex C (informative):'
  text: 'Annex C (informative):

    Selection of receiver parameters

    C.0 Introduction

    Receiver parameters under article 3.2 of Directive 2014/53/EU [i.2] listed in ETSI EG 203 336 [i.3] (V1.2.1) are

    analysed and the parameters which are applicable to the present document are specified in respective clauses. In each

    clause in Annex C the definition of the requirement is taken from the ETSI EG 203 336 [i.3].

    C.1 Receiver sensitivity

    Receiver sensitivity is the ability to receive a wanted signal at low input signal levels while providing a pre-determined

    level of performance. Receiver sensitivity is specified in the present document in clauses 4.2.12.

    C.2 Receiver co-channel rejection

    Receiver co-channel rejection is a measure of the capability of a receiver to receive a wanted signal, without exceeding

    a given degradation, due to the presence of an unwanted signal, both signals being at the nominal frequency of the

    receiver.

    In frequency bands covered by the present document, any modulation, channel width, centre frequency and data rate

    may be used. A combination of many signals of widely different characteristics manifests itself primarily as an increase

    in the noise floor.

    Thus, a specific test for co-channel rejection is not included because the co-channel rejection performance of the

    receiver combined with the receiver noise figure directly affects the sensitivity performance, which is tested. The

    required limits for sensitivity ensure that products have the required co-channel rejection.

    C.3 Receiver adjacent channel selectivity

    Adjacent channel selectivity is a measure of the receiver capability to receive a wanted modulated signal without

    exceeding the general performance criteria stated in the present document due to the presence of an unwanted input

    signal in the adjacent channels. Adjacent channel selectivity is specified in the present document in clause 4.2.6.

    C.4 Receiver spurious response rejection

    The spurious response rejection is a measure of the capability of the receiver to receive a wanted signal without

    exceeding a given degradation due to the presence of an unwanted signal at any frequency at which a response is

    obtained. The frequencies of the adjacent signals (channels) are excluded.

    Receiver spurious response rejection is specified in the present document in clause 4.2.8.

    C.5 Receiver blocking

    Blocking is a measure of the receiver capability to receive a wanted modulated signal without exceeding a given

    degradation due to the presence of an unwanted input signal at any frequencies other than those of the spurious

    responses or the adjacent channels or bands. Receiver Blocking is specified in the present document in clause 4.2.7.

    ETSI

    150 ETSI EN 301 908-13 V13.4.1 (2026-09)

    C.6 Receiver radio-frequency intermodulation

    Intermodulation rejection is a measure of the ability of a receiver to operate in the presence of two or more unwanted

    signals the frequencies of which have a specific frequency relationship to the wanted signal. Receiver Intermodulation

    is specified in the present document in clause 4.2.9.

    C.7 Receiver dynamic range

    Receiver dynamic range is defined as the range of the wanted input signal level over which a receiver functions at a

    specified performance level. The lower end of this range is normally the sensitivity of the receiver. The upper end of a

    receiver''s dynamic range determines how strong a received signal can be before producing degradation due to

    overloading.

    The UEs are normally deployed far away from BS and for a few UEs which are close to BS, sufficient coupling loss is

    also guaranteed due to the antenna high difference between BS and UE. Such that UE will not receive a wanted signal

    that is high enough to provide overloading effect. Thus, receiver dynamic range is not included in the present document.

    C.8 Receiver unwanted emissions in the spurious domain

    As a default, the limit for unwanted emissions in the spurious domain referenced at the antenna port should respect

    those in ERC/REC 74-01 [i.32]. Receiver spurious emission is specified in the present document in clause 4.2.10.

    ETSI

    151 ETSI EN 301 908-13 V13.4.1 (2026-09)

    Annex D (informative):

    Maximum measurement uncertainty

    The measurements described in the present document are based on the following assumptions:

    • the measured value related to the corresponding limit is used to decide whether an equipment meets the

    requirements of the present document;

    • the value of the measurement uncertainty for the measurement of each parameter is included in the test report.

    Table D-1 shows the recommended values for the maximum measurement uncertainty figures.

    Table D-1: Maximum measurement uncertainty

