    NOTE 1: For RF tests it should be noted that the uncertaintiesΩ in table D-1

    apply to the test system operating into a nominal 50 load and

    do not include system effects due to mismatch between the EUT

    and the test system.

    NOTE 2: If the test system for a test is known to have a measurement

    uncertainty greater than that specified in table D-1, this

    equipment can still be used provided that an adjustment is made

    as follows:

    any additional uncertainty in the test system over and above that

    specified in table D-1 should be used to tighten the test

    requirements - making the test harder to pass (for some tests,

    e.g. receiver tests, this may require modification of stimulus

    signals). This procedure will ensure that a test system not

    compliant with table D-1 does not increase the probability of

    passing an EUT that would otherwise have failed a test if a test

    system compliant with table D-1 had been used.

