    ETSI EN 301 908 [i.11] is divided into multiple standard parts as follows:

    Part 1: Introduction and common requirements

    The scope of Part 1 is common technical requirements for the IMT RITs, except for IMT-2000 FDMA/TDMA. This

    includes radiated emissions (UE, BS and repeater) and Control and monitoring functions (UE).

    Part 2: CDMA Direct Spread (UTRA FDD) User Equipment (UE)

    The scope of Part 2 is User Equipment for IMT-2000 CDMA Direct Spread, which includes UTRA FDD as defined by

    ETSI (3GPP).

    Part 3: CDMA Direct Spread (UTRA FDD) Base Stations (BS)

    The scope of Part 3 is Base Stations for IMT-2000 CDMA Direct Spread, which includes UTRA FDD as defined by

    ETSI (3GPP).

    Part 4: CDMA Multi Carrier (cdma2000) User Equipment (UE)

    The scope of Part 4 is User Equipment for IMT-2000 CDMA Multi-Carrier, which includes cdma2000 as defined by

    TIA (3GPP2).

    Part 5: CDMA Multi Carrier (cdma2000) Base Stations (BS)

    The scope of Part 5 is Base Stations for IMT-2000 CDMA Multi-Carrier, which includes cdma2000 as defined by TIA

    (3GPP2).

    Part 6: CDMA TDD (UTRA TDD) User Equipment (UE)

    The scope of Part 6 is User Equipment for IMT-2000 CDMA TDD, which includes UTRA TDD as defined by ETSI

    (3GPP).

    Part 7: CDMA TDD (UTRA TDD) Base Stations (BS)

    The scope of Part 7 is Base Stations for IMT-2000 CDMA TDD, which includes UTRA TDD as defined by ETSI

    (3GPP).

    Part 8: IMT-2000 TDMA Single Carrier (UWC 136) (UE)

    The scope of Part 8 is User Equipment for IMT-2000 TDMA Single-Carrier, which includes UWC136 as defined by

    TIA. Part 8 was published in the first release of ETSI EN 301 908.

    ETSI

    24 ETSI EN 301 908-1 V7.1.1 (2015-03)

    Part 9: IMT-2000 TDMA Single Carrier (UWC 136) (BS)

    The scope of Part 9 is Base Stations for IMT-2000 TDMA Single-Carrier, which includes UWC136 as defined by TIA.

    Part 9 was published in the first release of ETSI EN 301 908.

    Part 10: IMT-2000 FDMA/TDMA (DECT)

    The scope of Part 10 is equipment for IMT-2000 TDMA FDMA/TDMA, which includes DECT as defined by ETSI

    (DECT), including radiated spurious emission and Control and monitoring function.

    Part 11: CDMA Direct Spread (UTRA FDD) (Repeaters)

    The scope of Part 11 is Repeaters for IMT-2000 CDMA Direct Spread, which includes UTRA FDD as defined by ETSI

    (3GPP).

    Part 12: IMT-2000 CDMA Multi Carrier (cdma2000) (Repeaters)

    The scope of Part 12 is Repeaters for IMT-2000 CDMA Multi-Carrier, which includes cdma2000 as defined by TIA

    (3GPP2).

    Part 13: Evolved Universal Terrestrial Radio Access (E-UTRA) (UE)

    The scope of Part 13 is User Equipment for E-UTRA as defined by ETSI (3GPP).

    Part 14: Evolved Universal Terrestrial Radio Access (E-UTRA) (BS)

    The scope of Part 14 is Base Stations for E-UTRA as defined by ETSI (3GPP).

    Part 15: Evolved Universal Terrestrial Radio Access (E-UTRA FDD) (Repeaters)

    The scope of Part 15 is Repeaters for E-UTRA (FDD) as defined by ETSI (3GPP).

    Part 16: IMT-2000 Evolved CDMA Multi-Carrier Ultra Mobile Broadband (UMB) (UE)

    The scope of Part 16 is User Equipment for UMB as defined by TIA (3GPP2).

    Part 17: IMT-2000 Evolved CDMA Multi-Carrier Ultra Mobile Broadband (UMB) (BS)

    The scope of Part 17 is Base Stations for UMB as defined by TIA (3GPP2).

    Part 18: E-UTRA, UTRA and GSM/EDGE Multi-Standard Radio (MSR) Base Stations (BS)

    The scope of Part 18 is Multi-Standard Radio capable Base stations (E-UTRA, UTRA, GSM/EDGE) as defined by

    ETSI (3GPP).

    Part 19: OFDMA TDD WMAN (Mobile WiMAX) TDD User Equipment (UE)

    The scope of Part 19 is User Equipment for OFDMA TDD WMAN (Mobile WiMAX) operating in TDD mode as

    defined by IEEE / WiMAX Forum.

    Part 20: OFDMA TDD WMAN (Mobile WiMAX) TDD Base Stations (BS)

    The scope of Part 20 is Base stations for OFDMA TDD WMAN (Mobile WiMAX) operating in TDD mode as defined

    by IEEE / WiMAX Forum.

    Part 21: OFDMA TDD WMAN (Mobile WiMAX) FDD User Equipment (UE)

    The scope of Part 21 User Equipment for OFDMA TDD WMAN Mobile WiMAX (FDD) as defined by IEEE /

