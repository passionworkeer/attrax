  title: 'Annex C (informative):'
  text: 'Annex C (informative):

    Overview and organization of ETSI EN 301 908 standard

    parts

    This annex provides an overview of the IMT technologies included in the multipart standard ETSI EN 301 908 [i.11]

    and how the different standard parts map to the terrestrial components of IMT-2000 and IMT Advanced. IMT is

    specified by ITU-R in Recommendation M.1457-11 [i.7] and contains the following terrestrial IMT-2000 component

    radio interfaces:

    • IMT-2000 CDMA Direct Spread.

    • IMT-2000 CDMA Multi-Carrier.

    • IMT-2000 CDMA TDD.

    • IMT-2000 TDMA Single-Carrier.

    • IMT-2000 FDMA/TDMA.

    • IMT-2000 OFDMA TDD WMAN.

    IMT-Advanced is specified by ITU-R in Recommendation M.2012 [i.8] and contains the following terrestrial

    IMT-Advanced radio interfaces:

    • LTE-Advanced.

    • Wireless MAN-Advanced.

    ETSI EN 301 908 [i.11] is a multi-part deliverable covering Base Stations (BS), Repeaters and User Equipment (UE)

    for the members of the terrestrial component of the IMT family. Further details of the standard parts are given below.

    A cross-reference table for the standards parts applicable to the IMT terrestrial component radio access technologies is

    given in table C-1 and a frequency band cross reference table is given in table C-2. The scope, content and relation

    between the standard parts are given in the clauses below.

    ETSI

