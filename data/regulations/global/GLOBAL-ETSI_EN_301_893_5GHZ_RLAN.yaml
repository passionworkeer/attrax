    3 Definitions, symbols and abbreviations

    3.1 Definitions

    For the purposes of the present document, the terms and definitions given in Directive 2014/53/EU [i.1] and the

    following apply:

    5 GHz RLAN bands: total frequency range that consists of the 5 150 MHz to 5 350 MHz and the 5470 MHz to

    5 725 MHz sub-bands

    adaptive equipment: equipment operating in an adaptive mode

    adaptive mode: mechanism by which equipment can adapt to its environment by identifying other transmissions

    present in the band

    ad-hoc mode: operating mode in which an RLAN device establishes a temporary wireless connection with other RLAN

    devices without a controlling network infrastructure

    antenna array: two or more antennas connected to a single device and operating simultaneously

    antenna assembly: combination of the antenna (integral or dedicated), its coaxial cable and if applicable, its antenna

    connector and associated switching components

    NOTE 1: This term (antenna assembly) refers to an antenna connected to one transmit chain.

    NOTE 2: The gain of an antenna assembly G in dBi, does not include the additional gain that may result out of

    beamforming.

    available channel: channel identified as available for immediate use as an Operating Channel

    NOTE: Usable Channels whose nominal bandwidth falls completely within the band 5 150 MHz to 5 250 MHz

    can be considered as Available Channels without further testing.

    backoff procedure: procedure that facilitates the sharing of the medium by randomizing the transmission attempts

    from multiple devices competing for access to an Operating Channel

    beamforming gain: additional (antenna) gain realized by using beamforming techniques in smart antenna systems

    NOTE: Beamforming gain as used in the present document does not include the gain of the antenna assembly.

    burst: period during which radio waves are intentionally transmitted, preceded and succeeded by periods during which

    no intentional transmission is made

    channel: minimum amount of spectrum used by a single RLAN device

    NOTE: An RLAN device is permitted to operate (transmit/receive) in one or more adjacent or non-adjacent

    channels simultaneously.

    EXAMPLE: For the purpose of the present document, an IEEE 802.11™ [9] device operating in a 40 MHz

    mode may be considered as operating in 2 adjacent 20 MHz channels simultaneously.

    Channel Access Engine (CAE): mechanism that determines when a transmission attempt is permitted

    channel plan: combination of the centre frequencies and for each of the centre frequencies, the declared nominal

    bandwidth(s)

    clear channel assessment: mechanism used by an equipment to identify other transmissions in the channel

    combined equipment: equipment consisting of two or more products where at least one of which is radio equipment

    within the scope of the present document

    Contention Window (CW): main parameter that determines the duration of the Backoff Procedure

    ETSI

    13 ETSI EN 301 893 V2.1.1 (2017-05)

    dedicated antenna: antenna external to the equipment, using an antenna connector with a cable or a wave-guide and

    which has been designed or developed for one or more specific types of equipment

    energy detect: mechanism used by an adaptive system to determine the presence of another device operating on the

    channel based on detecting the signal level of that other device

    environmental profile: range of environmental conditions '
- id: art-4
  title: 'Annex C (normative):'
  text: 'Annex C (normative):

    Procedures for radiated measurements

    C.1 Introduction

    This annex gives the general procedures for radiated measurements using the test sites and arrangements described in

    annex B.

    Preferably, radiated measurements shall be performed in a FAR, see clause C.3. Radiated measurements in an OATS or

    SAR are described in clause C.2.

    C.2 Radiated measurements in an OATS or SAR

    Radiated measurements shall be performed with the aid of a measurement antenna and a substitution antenna, in test

    sites described in annex B. The measurement set-up shall be calibrated according to the procedure defined in the present

    annex. The UUT and the measurement antenna shall be oriented such as to obtain the maximum emitted power level.

    This position shall be recorded in the measurement report.

    a) The measurement antenna (device 2 in figure C.1) shall be oriented initially for vertical polarization unless

    otherwise stated and the UUT (device 1 in figure C.1) shall be placed on the support in its standard position

    and switched on.

    b) The measurement equipment (device 3 in figure C.1) shall be connected to the measurement antenna and

    set-up according to the specifications of the test.

    2

    specified height

    1 range 1 m to 4 m

    1,5 m

    ground

    plane

    3

    1) UUT

    2) Measurement antenna

    3) Measurement equipment

    Figure C.1: Measurement arrangement

    c) The UUT shall be rotated through 360° in a horizontal plane until a higher maximum signal is received.

    d) The measurement antenna shall be raised or lowered again through the specified height range until a maximum

    is obtained. This level shall be recorded. This maximum may be a lower value than the value obtainable at

    heights outside the specified limits.

    e) This measurement procedure in step c) and step d) above shall be repeated for horizontal polarization.

    ETSI

    101 ETSI EN 301 893 V2.1.1 (2017-05)

    C.3 Radiated measurements in a FAR

    For radiated measurements using a FAR, the procedure is identical to the one described in clause C.2, except that the

    height scan in step d) is omitted.

    C.4 Substitution measurement

    To determine the absolute measurement value a substitution measurement is performed. The following steps have to be

    performed:

    1) Replacing the UUT with the substitution antenna that is depicted as device 1 in figure C.1. The substitution

    antenna shall have vertical polarization.

    2) Connect a signal generator to the substitution antenna, and adjust it to the measurement frequency.

    3) If an OATS or a SAR is used, the measurement antenna height shall be varied within the range provided in

    figure C.1, to ensure that the maximum signal is received.

    4) Subsequently, the power of the signal generator is adjusted until the same level is obtained again at the

    measurement equipment.

    5) The radiated power is equal to the power supplied by the signal generator, increased with the substitution

    antenna gain minus the cable losses (values in dB).

    6) This measurement procedure described in step 2) to step 5) above shall be repeated with horizontal

    polarization for the substitution antenna.

    For test sites with a fixed setup of the measurement antenna(s) and a reproducible positioning of the UUT, correction

    values from a verified site calibration can be used alternatively.

    C.5 Guidance for testing technical requirements

    C.5.1 Radio test suites and corresponding test sites

