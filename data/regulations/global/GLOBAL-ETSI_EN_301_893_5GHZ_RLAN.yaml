    Foreword

    This Harmonised European Standard (EN) has been produced by ETSI Technical Committee Broadband Radio Access

    Networks (BRAN).

    The present document has been prepared under the Commission''s standardisation request C(2015) 5376 final [i.4] to

    provide one voluntary means of conforming to the essential requirements of Directive 2014/53/EU on the harmonisation

    of the laws of the Member States relating to the making available on the market of radio equipment and repealing

    Directive 1999/5/EC [i.1].

    Once the present document is cited in the Official Journal of the European Union under that Directive, compliance with

    the normative clauses of the present document given in table A.1 confers, within the limits of the scope of the present

    document, a presumption of conformity with the corresponding essential requirements of that Directive, and associated

    EFTA regulations.

    National transposition dates

    Date of adoption of this EN: 23 May 2017

    Date of latest announcement of this EN (doa): 31 August 2017

    Date of latest publication of new National Standard

    or endorsement of this EN (dop/e): 28 February 2018

    Date of withdrawal of any conflicting National Standard (dow): 28 February 2019

    Modal verbs terminology

    In the present document "shall", "shall not", "should", "should not", "may", "need not", "will", "will not", "can" and

    "cannot" are to be interpreted as described in clause 3.2 of the ETSI Drafting Rules (Verbal forms for the expression of

    provisions).

    "must" and "must not" are NOT allowed in ETSI deliverables except when used in direct citation.

    Introduction

    5 GHz wireless access systems (WAS) including RLAN equipment are used in wireless local area networks which

    provide high speed data communications in between devices connected to the wireless infrastructure. The present

    document also addresses ad-hoc networking where devices communicate directly with each other, without the use of a

    wireless infrastructure.

    ETSI

    9 ETSI EN 301 893 V2.1.1 (2017-05)

    The spectrum usage conditions for equipment within the scope of the present document are set in the ECC

    Decision (04)08 [i.8] and the Commission Decision 2005/513/EC [i.9] as amended by the Commission

    Decision 2007/90/EC [i.10].

    ETSI

    10 ETSI EN 301 893 V2.1.1 (2017-05)

    1 Scope

    The present document specifies technical characteristics and methods of measurements for 5 GHz wireless access

    systems (WAS) including RLAN equipment.

    The present document also describes spectrum access requirements to facilitate spectrum sharing with other equipment.

    These radio equipment are capable of operating in all or parts of the frequency bands given in table 1.

    Table 1: Service frequency bands

    Service frequency bands

    Transmit 5 150 MHz to 5 350 MHz

    Receive 5 150 MHz to 5 350 MHz

    Transmit 5 470 MHz to 5 725 MHz

    Receive 5 470 MHz to 5 725 MHz

    The present document covers the essential requirements of article 3.2 of Directive 2014/53/EU under the conditions

    identified in annex A.

