- id: art-2
  title: WIPO Performances and Phonograms Treaty (WPPT)
  text: "WIPO Performances and Phonograms Treaty (WPPT)\narrow_right\nGlobal protection system\nThe second general group, known as the global protection system treaties, ensures that one international registration\
    \ or filing will have effect in any of the relevant signatory States. The services provided by WIPO under these treaties simplify and reduce the cost of making individual applications or filings in\
    \ all the countries in which protection is sought for a given IP right.\nBudapest Treaty\nHague Agreement\nLisbon Agreement\nMadrid Agreement (Marks)\nMadrid Protocol\nPatent Cooperation Treaty (PCT)\n\
    arrow_right\nClassification\nThe third and final general group is the classification treaties, which create classification systems that organize information concerning inventions, trademarks and industrial\
    \ designs into indexed, manageable structures for easy retrieval.\nLocarno Agreement\nNice Agreement\nStrasbourg Agreement\nVienna Agreement\nNew Online Collection of WIPO Treaty Preparatory Documents\n\
    WIPO has launched \nWIPO Treaties: Preparatory Documents\n, an online collection for the “\ntravaux préparatoires\n” of treaties the Organization administers, including the WIPO Convention.\nNotifications\n\
    All notifications\nTreaty notifications are available in \nEnglish\n and \nFrench\n only.\nEmail updates\nWIPO Treaty Notifications\n – Announcements of treaty accessions, ratifications, declarations,\
    \ etc. 2-3 per month.\nSign up\nAll WIPO newsletters\nMembership\nTreaties\nSummary table of membership of WIPO and the treaties administered by WIPO, plus UPOV, WTO and UN\nContracting parties\nPublication\
