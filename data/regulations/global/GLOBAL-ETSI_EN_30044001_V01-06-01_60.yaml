    Annex D (informative):

    Example of implementation for restriction of 4 W RFID to

    in-building use only

    This annex provides guidance for RFID manufacturers to design an automatic inside/outside building power control,

    thus in order to meet the essential requirement as stated in EN 300 440-2 [i.5] for radiated power levels of 2 W e.i.r.p.

    and 500 mW e.i.r.p. as relevant of the present document. Any other technical design may be implemented to achieve the

    same result.

    The present annex describes an automatic inside/outside building power control scheme. A special, permanently fixed

    in-building mounted, System Control Unit (SCU) restricts the higher power of 4 W RFID to an operation inside a

    building only. In case the same RFID reader is moved outside the building or the RF beam is turned away from the

    in-building fixed installed SCU, e.g. towards windows or doors, then the power is automatically reduced to a default

    power level of 500 mW.

    The SCU has a very short communication range (up to approximately 4 m) and transmits an access code to the RFID

    reader to obtain the higher power of 4 W. The RFID SCU is required to be installed at a permanent fixed position inside

    a building where the higher power (4 W) is needed.

    The above-mentioned schemes will prevent an RFID reader to transmit the higher power when moved outside the range

    of the SCU. The result of such action is the reader loses its high power access code and consequently the power is

    automatically reduced to 500 mW. Furthermore, the user of the RFID system does not need to do anything special.

    To enforce the use of 4 W inside a building only, the following design options are suggested for SCUs, either:

    a) SCU units are equipped with a tamper switch to prevent these units from being removed together with its high

    power access code from their fixed mounting position inside a building. Any tampering with these units causes

    permanent loss of the access code for the higher power level. This prevents the user from moving the SCU

    functionality to a position outside the building. It is further suggested that only a manufacturer''s representative

    can obtain the necessary tools to generate new high power access code; or

    b) SCUs are mounted by a special tool that is not for general sale; or

    c) SCUs are designed to be installed once; if removed, they are permanently destroyed.

    An example for 2,45 GHz RFID installation using this principle is shown in figure D.1.

    Ceiling

    Window

    C

    E

