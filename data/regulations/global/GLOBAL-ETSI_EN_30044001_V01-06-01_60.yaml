- id: art-3
  title: 'Annex C (normative):'
  text: 'Annex C (normative):

    Power limits for RFID systems operating in the 2,45 GHz

    ISM band

    The present annex specifies the requirements for RFID systems operating in the 2,45 GHz ISM band.

    C.1 Power limits and frequency band

    The parameter limits for RFID equipment operating in the 2,45 GHz band are defined in table C.1.

    Table C.1: Parameters for 2,45 GHz RFID systems

    Frequency band Power limit, e.i.r.p. Use of equipment Comments

    (note 1)

    2 446 MHz to 2 454 MHz +27 dBm No restriction FHSS or

    unmodulated carrier (CW) only

    2 446 MHz to 2 454 MHz +36 dBm In-building only FHSS only

    (see note 2)

    NOTE 1: e.i.r.p. including an antenna with the following data:

    a) equal or less than ±45 degrees horizontal beamwidth;

    b) equal or more than 15 dB sidelobe attenuation;

    c) physical protection (e.g. antenna dome) which dimension limits a power transfer from the RFID

    antenna to a quarter wave matched dipole at positioned at an extreme close proximity to ≤ +15 dBm.

    NOTE 2: The use of power levels above +27 dBm (e.i.r.p.) shall by technical means be restricted to in building use

    only and shall have a duty cycle less than or equal to 15 % averaged over any 200 msec period (30 msec

    on/170 msec off).

    C.1.1 Additional requirements for 2,45 GHz 4 W e.i.r.p. indoor

    RFID equipment

    Indoor 4 W e.i.r.p. RFID equipment shall be constructed with 2 power levels as described below:

    a) 4 W e.i.r.p; and

    b) 500 mW e.i.r.p.

    The default power level is 500 mW e.i.r.p. or less.

    The 4 W e.i.r.p. level is only enabled by a secure software code built into the equipment and which is only accessible by

    the manufacturer or his representative. They way the software code controls the power level shall be as below:

    1) Fixed mounted 4 W RFID equipment shall be mounted inside a building and shall have a tamper proof

    function, which shall ensure self-destruction of the special software code if the RFID equipment is removed

    from its fixed mounting position. Such action shall reduce the power automatically to the default value of to

    500 mW e.i.r.p. or less.

    2) Portable 4 W RFID equipment shall, via an inside building short range link, have a continuous update of the

    special software code. This code is generated by a fixed mounted control unit installed in the same indoor

    room or area in which the RFID equipment is to be used. Without a signal from this control unit, the RFID

    equipment shall reduce its power automatically to the default level of 500 mW e.i.r.p. or less. The control unit

    shall have a tamper proof function, which shall ensure self-destruction of the special software code if the unit

    is removed from its fixed, in building, mounting position.

    Further information related to the above requirement is given in annex D.

    ETSI

    53 ETSI EN 300 440-1 V1.6.1 (2010-08)

