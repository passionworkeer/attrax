    Floor

    Figure D.1: Example for RFID system with an automatic RF power control

    for in- and outside building operation

    ETSI

    55 ETSI EN 300 440-1 V1.6.1 (2010-08)

    RFID readers, A to F in figure D.1, are all of same type having both 4 W and 500 mW radiated power (e.i.r.p.) with a

    default power level of 500 mW. Only reader A is able to communicate with the System Control Unit (SCU) via its

    antenna main beam at close distance and is therefore allowed to radiate with the higher power of 4 W e.i.r.p. All other

    readers, B to F, are either out of range or outside the antenna main beam concerning the SCU and are therefore forced to

    radiate with the default power level of 500 mW e.i.r.p.

    As an example, the SCU may be passive (without any transmitter) if control communication system is based on radio.

    In this case, the SCU is only re-modulating and reflecting reader transmitted signals like a normal RFID tag. As the

    reader receiver sensitivity is limited to approx -62 dBm the SCU to reader range is limited to approximately 3 m and

    5 m for reader radiated power of 500 mW and 4 W respectively. This will effectively limit the maximum distance

    between the reader and the SCU to approximately 3 m in order to turn-on the 4 W power level.

    ETSI

    56 ETSI EN 300 440-1 V1.6.1 (2010-08)

    Annex E (normative):

    Limits for GBSAR operating in the frequency range

    17,1 GHz to 17,3 GHz

    E.1 Introduction

    The present annex specifies limits for Ground Based Synthetic Aperture Radar (GBSAR) based Stepped Frequency CW

    (SF-CW) radar operating in the frequency range 17,1 GHz to 17,3 GHz.

    GBSAR system is used for detection of movement and its scope is limited to radar equipment operated as a short range

    device. The GBSAR applications considered in the present document are intended exclusively for detection of

    movement related to structures potentially effecting the protection of workers and the general public. A few examples

    of applications are given below:

    • static and dynamic load analyses of constructions like bridges and buildings;

    • landslide monitoring;

    • volcano and earthquake movement detection;

    • urban area subsidence detection.

    Method of measurements and other limits than given in clause E.2 are in accordance with the present document.

