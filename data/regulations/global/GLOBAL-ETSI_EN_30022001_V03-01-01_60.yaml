    9 ETSI EN 300 220-1 V3.1.1 (2017-02)

    Introduction

    The present document includes improvements to the previous version of the standard that take advantage of technical

    developments within the SRD industry. It also serves the purpose of providing the requirements and associated

    measurement methods to improve the intra- SRD co-existence and promote efficient spectrum use.

    The attention of the reader is brought on the fact that the present document includes "reference limits" which may be

    called by harmonised standards but which can also be different if requested for a specific application environment.

    The present document is structured as follows:

    Clause 2 provides references.

    Clause 3 provides definitions of terms and abbreviations used.

    Clause 4 provides conformance specifications.

    Clause 5 specifies the list of parameters, reference limits and tests.

    Annex A (normative): Technical performance of the test equipment.

    Annex B (normative): Test Fixture, contains specifications for the test fixture.'
