    Foreword

    This European Standard (EN) has been produced by ETSI Technical Committee Electromagnetic compatibility and

    Radio spectrum Matters (ERM).

    The present document is part 1 of a multi-part deliverable covering Short Range Devices (SRD), as identified below:

    Part 1: "Technical characteristics and methods of measurement";

    Part 2: "Harmonised Standard covering the essential requirements of article 3.2 of Directive 2014/53/EU for non

    specific radio equipment";

    Part 3-1: "Harmonised Standard covering the essential requirements of article 3.2 of Directive 2014/53/EU; Low

    duty cycle high reliability equipment, social alarms equipment operating on designated frequencies

    (869,200 MHz to 869,250 MHz)";

    Part 3-2: "Harmonised Standard covering the essential requirements of article 3.2 of Directive 2014/53/EU;

    Wireless alarms operating in designated LDC/HR frequency bands 868,60 MHz to 868,70 MHz,

    869,25 MHz to 869,40 MHZ, 869,65 MHz to 869,70 MHz";

    Part 4: "Harmonised Standard covering the essential requirements of article 3.2 of Directive 2014/53/EU;

    Metering devices operating in designated band 169,400 MHz to 169,475 MHz".

    Other parts may be added in the future, as necessary, using the present document as a basis for Technical characteristics

    and methods of measurement.

    National transposition dates

    Date of adoption of this EN: 27 January 2017

    Date of latest announcement of this EN (doa): 30 April 2017

    Date of latest publication of new National Standard

    or endorsement of this EN (dop/e): 31 October 2017

    Date of withdrawal of any conflicting National Standard (dow): 31 October 2017

    Modal verbs terminology

    In the present document "shall", "shall not", "should", "should not", "may", "need not", "will", "will not", "can" and

    "cannot" are to be interpreted as described in clause 3.2 of the ETSI Drafting Rules (Verbal forms for the expression of

    provisions).

    "must" and "must not" are NOT allowed in ETSI deliverables except when used in direct citation.

