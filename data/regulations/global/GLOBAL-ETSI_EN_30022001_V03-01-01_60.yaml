    1 Scope

    The present document specifies technical characteristics and test methods to be used in the conformance assessment of

    Short Range Device equipment in the frequency range 25 MHz to 1 GHz.

    2 References

    2.1 Normative references

    References are either specific (identified by date of publication and/or edition number or version number) or

    non-specific. For specific references, only the cited version applies. For non-specific references, the latest version of the

    referenced document (including any amendments) applies.

    Referenced documents which are not found to be publicly available in the expected location might be found at

    http://docbox.etsi.org/Reference.

    NOTE: While any hyperlinks included in this clause were valid at the time of publication, ETSI cannot guarantee

    their long term validity.

    The following referenced documents are necessary for the application of the present document.

    [1] Recommendation ITU-T O.153 (10/92): "Basic parameters for the measurement of error

    performance at bit rates below the primary rate".

    [2] ETSI TS 103 060 (V1.1.1): "Electromagnetic compatibility and Radio spectrum Matters (ERM);

    Short Range Devices (SRD); Method for a harmonized definition of Duty Cycle Template (DCT)

    transmission as a passive mitigation technique used by short range devices and related

    conformance test methods".

    2.2 Informative references

    References are either specific (identified by date of publication and/or edition number or version number) or

    non-specific. For specific references, only the cited version applies. For non-specific references, the latest version of the

    referenced document (including any amendments) applies.

    NOTE: While any hyperlinks included in this clause were valid at the time of publication, ETSI cannot guarantee

    their long term validity.

    The following referenced documents are not necessary for the application of the present document but they assist the

    user with regard to a particular subject area.

    [i.1] CISPR 16 (2006) (parts 1-1, 1-4 and 1-5): "Specification for radio disturbance and immunity

    measuring apparatus and methods; Part 1: Radio disturbance and immunity measuring apparatus".

    [i.2] Directive 2014/53/EU of the European Parliament and of the Council of 16 April 2014 on the

    harmonisation of the laws of the Member States relating to the making available on the market of

    radio equipment and repealing Directive 1999/5/EC.

    [i.3] ETSI TR 100 028 (all parts) (V1.4.1): "Electromagnetic compatibility and Radio spectrum Matters

    (ERM); Uncertainties in the measurement of mobile radio equipment characteristics".

    [i.4] ETSI TR 102 273-2 (V1.2.1): "Electromagnetic compatibility and Radio spectrum Matters (ERM);

    Improvement on Radiated Methods of Measurement (using test site) and evaluation of the

    corresponding measurement uncertainties; Part 2: Anechoic chamber".

    [i.5] ETSI TR 102 273-3 (V1.2.1): "Electromagnetic compatibility and Radio spectrum Matters (ERM);

    Improvement on Radiated Methods of Measurement (using test site) and evaluation of the

    corresponding measurement uncertainties; Part 3: Anechoic chamber with a ground plane".

    ETSI

    11 ETSI EN 300 220-1 V3.1.1 (2017-02)

    [i.6] ETSI TR 102 273-4 (V1.2.1): "Electromagnetic compatibility and Radio spectrum Matters (ERM);

    Improvement on Radiated Methods of Measurement (using test site) and evaluation of the

    corresponding measurement uncertainties; Part 4: Open area test site".

