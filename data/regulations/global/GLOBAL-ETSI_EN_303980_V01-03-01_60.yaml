- id: art-5
  title: 'Annex C (normative):'
  text: 'Annex C (normative):

    Conducted measurements

    In view of the low power levels of the equipment to be tested under the present document, conducted measurements

    may be applied to equipment provided with an antenna connector. Where the equipment to be tested does not provide a

    suitable termination, a coupler or attenuator that does provide the correct termination value shall be used.

    The equivalent isotropically radiated power is then calculated from the measured value, the known antenna gain,

    relative to an isotropic antenna, and if applicable, any losses due to cables and connectors in the measurement system.

    The Voltage Standing Wave Ratio (VSWR) shall not be greater than 1,5:1 over the frequency range of the

    measurement.

    ETSI

    67 ETSI EN 303 980 V1.3.1 (2022-10)

    Annex D (informative):

    General Requirements for RF Cables

    All RF cables including their connectors at both ends used within the measurement arrangements and set-ups should be

    of coaxial or waveguide type featuring within the frequency range they are used:

    • a VSWR of less than 1,2 at either end;

    • a shielding loss in excess of 60 dB.

    When using coaxial cables for frequencies above 40 GHz attenuation features increase significantly and decrease of

    return loss due to mismatching caused by joints at RF connectors and impedance errors should be considered.

    All RF cables and waveguide interconnects should be routed suitably in order to reduce impacts on antenna radiation

    pattern, antenna gain, antenna impedance. Table D.1 provides some information about connector systems that can be

    used in connection with the cables.

    Table D.1: Connector systems

    Connector System Frequency Recommended coupling torque

    N 18 GHz 0,68 Nm to 1,13 Nm

    SMA 18 GHz ~ 0,56 Nm

    (some up to 26 GHz)

    3,50 mm 26,5 GHz 0,8 Nm to 1,1 Nm

    2,92 mm 40 GHz 0,8 Nm to 1,1 Nm

    (some up to 46 GHz)

    2,40 mm 50 GHz 0,8 Nm to 1,1 Nm

    (some up to 60 GHz)

    1,85 mm 65 GHz 0,8 Nm to 1,1 Nm

    (some up to 75 GHz)

    ETSI

    68 ETSI EN 303 980 V1.3.1 (2022-10)

    Annex E (informative):

    RF Waveguides

    Wired signal transmission in the millimetre range is preferably realized by means of waveguides because they offer low

    attenuation and high reproducibility. Unlike coax'
