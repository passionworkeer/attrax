    i) carried by the NEST network via the same or another satellite, but not within the internal protocol of the NEST

    system; or

    ii) carried by any other radio communication system.

    external response channel: response channel which is either:

    i) carried by the NEST network via the same or another satellite, but not within the internal protocol of the NEST

    system; or

    ii) carried by any other radio communication system.

    integral antenna: antenna which may not be removed during the tests according to the manufacturer''s declaration

