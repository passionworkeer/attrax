    3 Definition of terms, symbols and abbreviations

    3.1 Terms

    For the purposes of the present document, the terms given in Directive 2014/53/EU [i.6] and the following apply:

    ancillary equipment: equipment used in connection with a NEST

    NOTE: See clause 5.2.

    antenna controller: equipment used to maintain antenna stabilization and tracking accuracy based on inputs from the

    Control and Monitoring Function

    carrier-off radio state: radio state in which the NEST may transmit and does not transmit any carrier

    NOTE: See clause 4.2.8.

    carrier-on radio state: radio state in which the NEST may transmit and transmits a carrier

    Control Channel (CC): channel or channels by which NESTs receive and send control information from and to the

    NCF

    EIRP : maximum EIRP capability of the NEST as declared by the manufacturer

    max

    emissions disabled radio state: radio state in which the NEST may not emit

    NOTE: Examples of cases where the NEST is in this radio state:

    

    before system monitoring pass, before the control channel is received;

    

    when a failure is detected;

    

    when a NEST is commanded to disable; and

    

    when the NEST is in a location requiring cessation of emissions.

    ETSI

