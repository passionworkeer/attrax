- id: art-3
  title: 'Annex C (informative):'
  text: 'Annex C (informative):

    Information required by the test laboratory

    C.1 Information to be supplied

    The manufacturer should, at the time of submission of the equipment for test, supply the following information to be

    recorded in the test report:

    • the intended use and performance of the radio equipment which should be in accordance with the user

    documentation;

    • the user control functions and stored data that are required for intended use and the method to be used to assess

    whether these have been lost after the EMC exposure;

    • the type of modulation (also known as "normal test modulation"), the characteristics of the transmission used

    for testing (random bit stream, message format, etc.) and the necessary test equipment delivered to enable the

    assessment of the EUT;

    • the ancillary equipment to be combined with the radio equipment for testing (where applicable);

    • an exhaustive list of ports, with the maximum cable lengths allowed, classified as either power or

    telecommunication/signal/control. Power ports should further be classified as AC or DC power;

    • the operating frequency band(s) over which the equipment is intended to operate;

    • any equipment thermal limitation which prevents continuous testing of the EUT;

    • the climatic environment(s) in which the equipment is intended to be used;

    • the occupied bandwidth of the corresponding transmitter signal for non-channelized equipment.

    If the present document is used to demonstrate presumption of conformity to European Directive 2014/53/EU [i.1] as a

    specific radio part of the standard could not be identified for a particular type of radio equipment, then the manufacturer

    should at the time of submission of the equipment for test, supply the following information to be recorded in the test

    report:

    • test conditions, clause 4;

    • the value of n used in clause 4.3 used to determine the exclusion bands.

    ETSI

    34 ETSI EN 301 489-1 V2.2.3 (2019-11)

    Annex D (informative):

    Bibliography

    ETSI EG 203 336: "Electromagnetic compatibility and Radio spectrum Matters (ERM); Guide for the selection of

    technical parameters for the production of Harmonised Standards covering article 3.1(b) and article 3.2 of Directive

    2014/53/EU".

    CENELEC EN 55016-1-4 (2010) + A1 (2012): "Specification for radio disturbance and immunity measuring apparatus

    and methods - Part 1-4: Radio disturbance and immunity measuring apparatus - Ancillary equipment - Radiated

    disturbances".

    ETSI TR 103 088: "Electromagnetic compatibility and Radio spectrum Matters (ERM); Using the EN 301 489 series of

    EMC standards".

    ETSI

    35 ETSI EN 301 489-1 V2.2.3 (2019-11)

    Annex E (informative):

    Change history

    Version Information about changes

    Compared with earlier versions that were cited under previous EU Directives, the

    following changes have been introduced:

    • Radiated immunity testing to a continuous sweep between 80 MHz and

    6 000 MHz at 3 V/m, as opposed to the previous frequency range of 80 MHz to

    1 000 MHz and 1 400 MHz to 2 700 MHz in earlier editions of the ETSI

    EN 301 489 series.

    • New derivations of exclusion bands more closely linked to the operational

    characteristics of the radio link(s) in the EUT. In many cases this has resulted

    in new exclusion bands in the individual parts of the ETSI EN 301 489 series.

    • Surge test method aligned with CENELEC EN 61000-4-5.

    2.1.1

    • Clause 4.4 has been deleted as no longer with modern radio design. If

    required, it can be added in product specific part.

    • Also with this version the previous annex B that dealt with aftermarket fitment

    of radio equipment into vehicles has been removed following the demise of the

    EU motor vehicle EMC Directive.

    • Those parts of annex C that covered combined equipment have been

    removed.

    The above changes impact all other parts of the ETSI EN 301 489 series.

    More information regarding the changes between the different versions of the ETSI

    EN 301 489 series may be found in ETSI TR 103 088.

    Correction of circular and generic references, performance criteria definitions and

    annex A according to the concerns raised by the EC RE-D Desk officer.

    2.2.1

    Editorial and format changes to align standard with current drafting guidelines, including

    the addition of annex D. No technical parameters were changed in this revision.

    ETSI

