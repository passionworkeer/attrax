- id: art-6
  title: Annex V.
  text: 'Annex V.

    4.3.2 Safeguards for protection of an ordinary person

    4.3.2.1 Safeguards between a class 1 energy source and an ordinary person

    No safeguards need be interposed between a class 1 energy source and an ordinary person

    (see Figure 9). Consequently, a class 1 energy source may be accessible to an ordinary

    person.

    Class 1

    Ordinary

    energy

    person

    source

    Figure 9 – Model for protection of an ordinary person against a class 1 energy source

    4.3.2.2 Safeguards between a class 2 energy source and an ordinary person

    During normal operating conditions at least one basic safeguard shall be interposed

    between a class 2 energy source and an ordinary person (see Figure 10).

    Class 2 Basic Ordinary

    energy safeguard

    person

    source

    Figure 10 – Model for protection of an ordinary person against a class 2 energy source

    4.3.2.3 Safeguards between a class 2 energy source and an ordinary person during

    ordinary person servicing conditions

    If ordinary person servicing conditions require a basic safeguard to be removed or

    defeated, an instructional safeguard as described in Clause F.5 shall be provided and

    located in such a way that an ordinary person will see the instruction prior to removing or

    defeating the equipment basic safeguard (see Figure 11).

    The instructional safeguard (see Clause F.5) shall include all of the following:

    – identify parts and locations of the class 2 energy source;

    – specify actions that will protect persons from that energy source; and

    – specify actions to reinstate or restore the basic safeguard.

    If ordinary person servicing conditions require a basic safeguard to be removed or

    defeated, and where the equipment is intended for use in the home, an instructional

    safeguard (see Clause F.5), directed towards adults, shall warn against removing or

    defeating the basic safeguard by children.

