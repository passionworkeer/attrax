    4.3.2.4 Safeguards between a class 3 energy source and an ordinary person

    An equipment basic safeguard and an equipment supplementary safeguard (double

    safeguard) or an equipment reinforced safeguard shall be interposed between a class 3

    energy source and an ordinary person (see Figure 12).

    Class 3 Equipment Equipment

    Ordinary

