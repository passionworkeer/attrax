    against a class 1 energy source

    4.3.3.2 Safeguards between a class 2 energy source and an instructed person

    During instructed person servicing, the equipment safeguards against a class 2 energy

    source may be removed or defeated. In this case, an instructed person is presumed to use

    precaution as a safeguard against a class 2 energy source (see Figure 14).

    Class 2

    Precautionary Instructed

