    Figure 12 – Model for protection of an ordinary person against a class 3 energy source

    4.3.3 Protection of an instructed person

    4.3.3.1 Safeguards between a class 1 energy source and an instructed person

    No safeguards need be interposed between a class 1 energy source and an instructed

    person. Consequently, a class 1 energy source may be accessible to an instructed person

    (see Figure 13).

    Class 1

    Instructed

    energy

