    Figure 14 – Model for protection of an instructed person

    against a class 2 energy source

    4.3.3.3 Safeguards between a class 3 energy source and an instructed person

    An equipment basic safeguard and an equipment supplementary safeguard (double

    safeguard) or a reinforced safeguard shall be interposed between a class 3 energy source

    and an instructed person (see Figure 15).

