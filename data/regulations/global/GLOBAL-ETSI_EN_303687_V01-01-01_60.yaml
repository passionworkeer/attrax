    3 Definition of terms, symbols and abbreviations

    3.1 Terms

    For the purposes of the present document, the terms given in Directive 2014/53/EU [i.1] and the following apply:

    6 GHz WAS/RLAN band: frequency range of 5 945 MHz to 6 425 MHz

    adjacent signal: signal adjacent to the wanted signal

    alternate adjacent channels: channel(s) offset from the wanted channel by twice the channel spacing

    antenna assembly: combination of the antenna (integral or dedicated), its coaxial cable and if applicable, its antenna

    connector and associated switching components

    NOTE 1: This term (antenna assembly) refers to an antenna connected to one transmit chain.

    NOTE 2: The gain of an antenna assembly G in dBi, does not include the additional gain that may result out of

    beamforming.

    backoff procedure: procedure that facilitates the sharing of the medium by randomizing the transmission attempts

    from multiple devices competing for access to a channel

    beamforming gain: additional (antenna) gain realized by using beamforming techniques in smart antenna systems

    NOTE: Beamforming gain as used in the present document does not include the gain of the antenna assembly.

    burst: period during which radio waves are intentionally transmitted, preceded and succeeded by periods during which

    no data transmission is made

    channel: continuous part of the radio-frequency spectrum used for transmission and reception by WAS/RLAN

    equipment and identified by a nominal centre frequency and a nominal bandwidth

    NOTE: WAS/RLAN equipment is permitted to operate (transmit/receive) in one or more adjacent or non-adjacent

    channels simultaneously.

    channel access engine: mechanism that determines when a transmission attempt is permitted

    channel plan: list of channels with their centre frequencies and for each of the centre frequencies, the nominal

    bandwidth(s)

    Clear Channel Assessment (CCA): mechanism used by an equipment to identify other transmissions in the channel

    Contention Window (CW): main parameter that determines the duration of the backoff procedure

    dedicated antenna: antenna external to the equipment, using an antenna connector with a cable or a wave-guide and

    which has been designed or developed for one or more specific types of equipment

    Energy Detect (ED): mechanism used to determine the presence of transmissions in the channel based on detecting the

    signal energy of the transmission

    environmental profile: range of environmental conditions under which equipment within the scope of the present

    document is required to comply with the provisions of the present document

    Fixed Frame Period (FFP): periodic timing of the transmit/receive structure for Frame Based Equipment (FBE)

    Frame Based Equipment (FBE): equipment where the transmit/receive structure has a periodic timing with a

    periodicity equal to the Fixed Frame Period (FFP)

    frequency hopping: mechanism in which equipment switches between different hop frequencies within the 6 GHz

    WAS/RLAN band for its operations

    hop frequency: centre frequency used for operations in the context of frequency hopping

    initiating device: equipment that initiates a sequence of one or more transmissions

    ETSI

    13 ETSI EN 303 687 V1.1.1 (2023-06)

    integral antenna: antenna designed as a fixed part of the equipment (without the use of an external connector) which

    cannot be disconnected from the equipment by a user with the intent to connect another antenna

    NOTE 1: The term integral antenna is equivalent to integrated antenna.

    NOTE 2: An integral antenna may be fitted internally or externally. In the case where the antenna is external, a

    non-detachable cable or wave-guide can be used.

    Listen Before Talk (LBT): mechanism by which an equipment applies Clear Channel Assessment (CCA) before using

    the channel

    Load Based Equipment (LBE): equipment where the transmit/receive structure is not fixed in time but demand-driven

    Low Power Indoor Access Point (LPI AP): LPI access point or LPI bridge

    NarrowBand (NB) device: VLP device that operates with a bandwidth below 20 MHz

    observation slot: period during which the channel is checked for the presence of other transmissions

    occupied channel: channel on which the channel access mechanism detected transmissions

    post backoff : backoff procedure that is applied after every successful transmission

    prioritization period: period consisting of an initial deferral period followed by an observation period during which

    the channel is checked for the presence of other transmissions

    receive chain: receiver circuit with an associated antenna

    responding device: equipment that transmits in response to the actions of an initiating device

    smart antenna systems: equipment that combines multiple transmit and/or receive chains with a signal processing

    function to increase the throughput and/or to optimize its radiation and/or reception capabilities

    stand-alone equipment: equipment that is intended primarily as radio communications equipment and that is normally

    used on a stand-alone basis

    unoccupied channel: channel on which the channel access mechanism did not detect transmissions

    WAS/RLAN: broadband radio systems that allow wireless access for public and private applications regardless of the

    underlying network topology

    WAS/RLAN devices: components or sub-assemblies which intentionally emit and/or receive radio waves for the

    purpose of radio communication and are intended for incorporation into WAS/RLAN equipment

    NOTE: Categories and sub-categories are provided in clause 4.2.

