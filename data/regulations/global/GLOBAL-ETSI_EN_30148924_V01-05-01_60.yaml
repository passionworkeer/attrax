  title: 'Annex C (normative):'
  text: 'Annex C (normative):

    Performance assessment of data transfer call. Error Ratios

    C.1 Calibration of data transfer

    C.1.1 UTRA

    For the EUT, calibration of the data transfer may be performed by assessing the Bit Error Ratio (BER), Block Error

    Ratio (BLER) or End-User data error ratio before applying the RF immunity test signal (defined in EN 301 489-1 [1],

    clauses 9.2 and 9.5).

    C.1.2 E-UTRA

    For the EUT, calibration of the data transfer may be performed by assessing the throughput percentage before applying

    the RF immunity test signal (defined in EN 301 489-1 [1] clauses 9.2 and 9.5).

    C.2 Assessment of data transfer

    C.2.1 UTRA. Derivation of Error Ratios

    The manufacturer shall provide the method for calculating the Error Ratio. Known data patterns shall be transferred

    bi-directionally from end-to-end (the whole of the UL and DL will be exercised). Performance assessment shall be

    made at each frequency step. Comparison between transmitted known data and received data shall result in the Error

    Ratio.

    The data patterns used should be of sufficient length to give valid results and should be equivalent to the used channel

    bit rate.

    Possible data patterns for assessing the Error Ratio are BER, BLER and User Data. Detailed description of BER and

    BLER can be found from TS 134 109 [8].

    End-User Data may be used where BER and BLER measurements are not appropriate, and is a manufacturer''s decision

    (see below).

    EXAMPLE: In the cases when the EUT consists of UE with data application ancillary and the data application

    ancillary itself does not support a loopback function that can be applied for the assessment of BER

    or BLER, as specified in TS 134 109 [8]. This would lead into a situation where the data

    application ancillary is not exercised, i.e. the data transfer loop is not end-to-end.

    The characteristics of the End-User Data used for testing (format, size, typical data throughput rate, additional error

    corrections, etc.) and the necessary test equipment shall be delivered to enable the assessment of the EUT.

    Following formula may apply to End-User Data:

    ⎛ ⎞

    erroneuos(bits, bytes, symbols, etc.)

    ⎜ ⎟

    ErrorRatio=⎜ ×100⎟=n%

    ⎝total number of(bits, bytes, symbols, etc.) ⎠

    (In case that high Error Ratios exist, ensure that errors are a consequence of EMC stress.)

    ETSI

    20 ETSI EN 301 489-24 V1.5.1 (2010-10)

    C.2.2 E-UTRA. Derivation of Throughput Percentages

    Known data patterns shall be transferred bi-directionally from end-to-end (the whole of the UL and DL will be

    exercised). Performance assessment shall be made at each frequency step. Comparison between maximum throughput

    and achieved throughput shall result in the throughput percentage.

    The data patterns used should be of sufficient length to give valid results and should be equivalent to the used channel

    bit rate.

    C.3 EUT without data application ancillary

    Data monitoring Devices are here considered as part of the Test System. Arrangements should be made by the

    manufacturer, if needed, to couple the Data monitoring Device by a method which does not affect the radiated

    electromagnetic field (e.g. ultrasonic or optical).

