    Foreword

    This Harmonized European Standard (Telecommunications series) has been produced by ETSI Technical Committee

    Electromagnetic compatibility and Radio spectrum Matters (ERM).

    The present document has been produced by ETSI in response to a mandate from the European Commission issued

    under Council Directive 98/34/EC [3] (as amended) laying down a procedure for the provision of information in the

    field of technical standards and regulations.

    The present document is intended to become a Harmonized Standard, the reference of which will be published in the

    Official Journal of the European Communities referencing the Council Directive on the approximation of the laws of

    the Member States relating to Directive 1999/5/EC [2] of the European Parliament and of the Council of 9 March 1999

    on radio equipment and telecommunications terminal equipment and the mutual recognition of their conformity ("the

    R&TTE Directive").

    The present document is part 24 of a multi-part deliverable. Full details of the entire series can be found in part 1 [1].

    National transposition dates

    Date of adoption of this EN: 4 October 2010

    Date of latest announcement of this EN (doa): 31 January 2011

