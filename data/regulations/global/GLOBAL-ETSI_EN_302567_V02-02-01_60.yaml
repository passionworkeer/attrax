  title: 'Annex C (normative):'
  text: 'Annex C (normative):

    Test sites and arrangements for radiated measurements

    C.1 Test sites

    C.1.1 Open air test sites

    The term "open air" should be understood from an electromagnetic point of view. Such a test site may be really in open

    air or alternatively with walls and ceiling transparent to the radio waves at the frequencies considered.

    An open air test site may be used to perform the measurements using the radiated measurement methods described in

    clause 5.3. Absolute or relative measurements may be performed on transmitters or on receivers; absolute

    measurements of field strength require a calibration of the test site.

    A measuring distance of at least 3 m shall be used for measurements at frequencies up to 1 GHz. For frequencies above

    1 GHz, any suitable measuring distance may be used. The equipment size (excluding the antenna) shall be less than

    20 % of the measuring distance. The height of the equipment or of the substitution antenna shall be 1,5 m; the height of

    the test antenna (transmit or receive) shall vary between 1 m and 4 m.

    Sufficient precautions shall be taken to ensure that reflections from extraneous objects adjacent to the site do not

    degrade the measurement results, in particular:

    • no extraneous conducting objects having any dimension in excess of a quarter wavelength of the highest

    frequency tested shall be in the immediate vicinity of the site;

    • all cables shall be as short as possible; as much of the cables as possible shall be on the ground plane or

    preferably below; and the low impedance cables shall be screened.

    The general measurement arrangement is shown in figure C.1.

