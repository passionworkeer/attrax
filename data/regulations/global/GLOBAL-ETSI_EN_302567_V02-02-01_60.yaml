    37 ETSI EN 302 567 V2.2.1 (2021-07)

    C.2 Test antenna

    When the test site is used for radiated measurements the test antenna shall be used to detect the field from both the test

    sample and the substitution antenna. When the test site is used for the measurement of receiver characteristics the

    antenna shall be used as a transmitting antenna. This antenna shall be mounted on a support capable of allowing the

    antenna to be used in either horizontal or vertical polarization and for the height of its centre above the ground to be

    varied over the specified range. Preferably test antennae with pronounced directivity should be used. The size of the test

    antenna along the measurement axis shall not exceed 20 % of the measuring distance. The antenna shall include any

    necessary up/down conversion to an intermediate frequency for practical signal transport to/from related test equipment.

    C.3 Substitution antenna

    The substitution antenna shall be used to replace the equipment under test in substitution measurements. For

    measurements below 1 GHz the substitution antenna shall be a half wavelength dipole resonant at the frequency under

    consideration, or a shortened dipole, calibrated to the half wavelength dipole. For measurements between 1 GHz and

    4 GHz either a half wavelength dipole or a horn radiator may be used. For measurements above 4 GHz a horn radiator

    shall be used. The centre of this antenna shall coincide with the reference point of the test sample it has replaced. This

    reference point shall be the volume centre of the sample when its antenna is mounted inside the cabinet, or the point

    where an outside antenna is connected to the cabinet.

    The distance between the lower extremity of the dipole and the ground shall be at least 30 cm.

    NOTE: The gain of a horn antenna is generally expressed relative to an isotropic radiator.

    ETSI

    38 ETSI EN 302 567 V2.2.1 (2021-07)

