- id: art-3
  title: section 3.2 use case U-C 5 is recommended to be used for RTT. The use of WebRTC Data
  text: 'section 3.2 use case U-C 5 is recommended to be used for RTT. The use of WebRTC Data

    Channels in web pages and apps is specified in W3C WebRTC: Real-Time Communication in

    Browsers [i.58].

    ETSI CEN CENELEC

    47 EN 301 549 V4.1.1 (2026-09)

    e) Emergency communications: An interface to IP based emergency communications is specified in

    ETSI TS 103 479 [i.48], making use of IETF RFC 4103 [i.13] updated by IETF RFC 9071 [i.52]

    for RTT. A corresponding standard exists for North America. For emergency apps, ETSI

    TS 103 478 [i.47] is specified to implement RTT as specified in ETSI TS 103 871 [i.49]. The use

    of these standards for accessible and interoperable emergency communications including the use of

    RTT is specified in ETSI EN 303 919 [i.56].

    f) Relay services: ETSI ES 202 975 [i.6] specifies in its Annexes A and B interfaces to relay services,

    referring to the present document for specific technologies.

    NOTE 5: Analogue Text telephony is a legacy text communication concept providing functionality to some degree

    similar to RTT in circuit-switched fixed and mobile technologies. There are 6 variants for fixed lines,

    collected in Recommendation ITU-T V.18 [i.22], and one for circuit-switched 2G and 3G mobile

    technologies specified in ETSI TS 126 226 [i.55]. Interworking between these technologies and RTT can

    be achieved to some degree but with severe functional limitations such as no support for multiparty text

    communication, need for gateways for character conversion and buffering the much faster RTT text input

    to accommodate the slower rate of analog technologies, clashes due to lack of bi-directional support, and

    no possibility to use voice while text is transmitted. The differences can also cause confusion to users

    unaware of the differences. Details about the limitations can be found in the references in the present note

    and in IETF RFC 5194 [i.62], section 6.2.5. Considering these limitations, Analogue Text telephony does

    not provide a working (additional) sensory channel.

    NOTE 6: For applying option b) it can be emphasized that the fallback method for multiparty mixing and

    presentation of RTT in multi-party unaware clients specified in IETF RFC 9071 [i.52], sections 2.2 and

    4.2 does not provide a satisfactory user experience and is discouraged from regular use.

    6.3 Caller ID

    Where ICT provides caller identification or other identification functions,

    the caller identification and other identification functions shall be available in text form as well as being

    programmatically determinable, for all functionality that is not closed to programmatic access of information by

    assistive technologies.

    NOTE: See clause 5 for requirements on functionality that is closed.

    6.4 Alternatives to voice-based services

    Where ICT provides voice mail, auto-attendant, or interactive voice response facilities,

    the ICT shall offer users a means to access the information and carry out the tasks provided by the ICT without the use

    of hearing or speech.

    NOTE 1: Tasks that involve both operating the interface and perceiving the information would require that both the

    interface and information be accessible without use of speech or hearing.

    NOTE 2: Solutions capable of handling audio, RTT and video media could satisfy the above requirement.

    6.5 Video communication

    6.5.1 General (informative)

    Clause 6.5 (Video communication) provides performance requirements that support users who communicate using sign

    language and lip-reading. For these users, good usability is achieved with a resolution of at least Quarter Video

    Graphics Array (QVGA, 320 × 240), a frame rate of 20 frames per second and over, with a time difference between

    speech audio and video that does not exceed 100 ms.

    Increasing the resolution and frame rate further improves both sign language (especially finger spelling) and lipreading,

    with frame rate being more important than resolution.

    Time differences between audio and video (asynchronicity) can have a great impact on lip-reading - with video that lags

    behind audio having greater negative effect.

    ETSI CEN CENELEC

    48 EN 301 549 V4.1.1 (2026-09)

    End-to-end latency can be a problem in video (sign) communication. Overall delay values below 400 ms are preferred,

    with an increase in preference down to 100 ms. Overall delay depends on multiple factors, including e.g. network delay

    and video processing. For this reason a testable requirement on minimum values for overall delay cannot be produced.

    NOTE 1: Recommendation ITU-T F.703 [i.38] defines and gives requirements for Total Conversation that relate to

    the integration of audio, RTT and video in a combined real-time bidirectional communication.

    NOTE 2: The delays are specified in Recommendation ITU-T P.1305 [i.61].

    NOTE 3: For the purposes of interoperability and sufficient quality, support of Recommendation

    ITU-T H.264 [i.74] at least version 10 and at least constrained baseline level 3 is widely used for this

    purpose.

    NOTE 4: Where codec negotiation is implemented, other standardized codecs such as Recommendation

    ITU‑T H.265 [i.75] and IETF RFC 6386 [i.76] VP8 [i.76] are commonly used with proper settings are

    suitable so as to avoid transcoding.

    NOTE 5: Background reading and detailed guidance about accessible video communication is provided in ETSI

    ES 204 009 [i.77].

    6.5.2 Resolution

    Where ICT provides real-time bidirectional voice communication, and includes real-time bidirectional video

    communication,

    the ICT:

    a) shall support at least QVGA resolution;

    b) should preferably support at least VGA resolution.

    6.5.3 Frame rate

    Where ICT provides real-time bidirectional voice communication, and includes real-time bidirectional video

    communication,

    the ICT:

    a) shall support a frame rate of at least 20 Frames Per Second (FPS);

    b) should preferably support a frame rate of at least 30 Frames Per Second (FPS) with or without sign language in

    the video stream.

    6.5.4 Synchronization between audio and video

    Where ICT provides real-time bidirectional voice communication, and includes real-time bidirectional video

    communication,

    the ICT shall ensure that voice is received by the user not earlier than 100 ms before and not later than 100 ms after the

    corresponding video is presented to the user.

    NOTE: Verification material and methods are described in Recommendation ITU-T H.Sup1 [i.65], clause 6.

    6.5.5 Indicator of audio with video

    Where ICT provides real-time bidirectional voice communication, and includes real-time bidirectional video

    communication,

    the ICT shall provide a real-time indicator of audio activity.

    NOTE 1: The indicator may be a simple visual dot, or other type of on/off indicator, that flickers to reflect audio

    activity.

    NOTE 2: Without this indication a person who lacks the ability to hear does not know when someone is talking.

    ETSI CEN CENELEC

    49 EN 301 549 V4.1.1 (2026-09)

    6.5.6 Indication of all active communication participants

    Where ICT provides real-time bidirectional voice communication, includes real-time bidirectional video

    communication, and provides speaker indication for voice users,

    the ICT shall provide indication of all active communicators including those signing.

    NOTE 1: The indication of all active communicators can be in the same location as the speaker identification for

    voice users in multiparty communication sessions.

    NOTE 2: This mechanism might be triggered manually by a user, or automatically where this is technically

    achievable.

    6.6 Alternatives to video-based services (recommendation)

    Where ICT provides real-time bidirectional voice communication, and includes real-time bidirectional video

    communication, and provides answering machine, auto attendant or interactive response facilities,

    the ICT should offer users a means to access the information and carry out the tasks related to these facilities:

    a) for audible information, without the use of hearing;

    b) for spoken commands, without the use of speech;

    c) for visual information, without the use of vision.

