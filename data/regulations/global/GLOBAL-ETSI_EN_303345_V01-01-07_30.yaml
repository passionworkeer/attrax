  title: 'Annex C (informative):'
  text: 'Annex C (informative):

    Measurement set-up for electrical methods during radiated

    testing

    Electrical connections within the field can influence the result to testing unless carefully positioned. The connection to

    the audio analyser and any external power supply cables should be configured in a perpendicular direction to the

    electric field, and a CMAD or ferrite with an appropriate impedance over the frequency range of the testing should be

    applied, see figure C.1.

    SAC

