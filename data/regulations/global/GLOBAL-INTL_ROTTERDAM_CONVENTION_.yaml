    Experts gather in Rome for the Twenty-Second Meeting of the Chemical Review Committee (CRC.22)


    Held in Rome from 15-18 September 2026, CRC.22 will review notifications of final regulatory actions on hazardous chemicals and pesticides submitted by Parties to the Rotterdam Convention.


    Meeting report of the 4th meeting of the Compliance Committee now available!


    The 4th meeting of the Rotterdam Convention Compliance Committee was held in Geneva from 19 -21 June 2026. The Committee continued work related to the review of a number of systemic issues of general
    compliance set out in its programme of work for the biennium 2026-2027.


    Test your knowledge this summer with the Rotterdam Convention Quiz


    The Rotterdam Convention has produced a fun quiz to help you discover our procedures, processes and impact.


    Rotterdam Convention COP Bureau meeting report now available


    The Rotterdam Convention COP 13 Bureau meeting took place online on 20 May 2026.


