    5.6 Voltage dips and short interruptions: AC power port

    For EUT with rated input current not exceeding 16 A per phase, test method shall be in accordance with

    EN 61000-4-11 [14], clauses 6 for test instrumentation, 7 for test setup and 8 for test procedure.

    For EUT with rated input current exceeding 16 A per phase, test method shall be in accordance with

    EN 61000-4-34 [24], clauses 6 for test instrumentation, 7 for test setup and 8 for test procedure.

    6 Emission: test methods

    6.0 General

    Where not specified here, the EUT shall be configured, installed, arranged and operated in a manner consistent with the

    intended use of the EUT.

    All emission tests defined in the present document shall be considered by the test plan.

    All emission tests defined in the present document and required by the test plan shall be applied to the EUT.

    For equipment with a radio function, the exclusion band(s) defined in annex D shall apply.

    In the case where non compliances can be attributed to the transmission of the wanted radio signal from the EUT, these

    shall be disregarded.

    6.1 AC power port

    For conducted emission on AC power port in the frequency range 0,15 MHz to 30 MHz, the test method specified in

    EN 55032 [31] clause A3, table A.8 and clause A8.1, shall apply.

    This test applies to AC power input ports. It also applies to output ports of Power Supply equipment defined in

    clause 13 of the present document if, according to the EUT''s specifications, they support cable lengths greater than 3 m.

    6.2 DC power port

    The measuring methods shall be those specified for the AC mains interface in EN 55032 [31], clause A3, table A.8 and

    clause A8.1.

    This test applies to DC power input ports. It also applies to output ports of Power Supply equipment defined in

    clause 13 of the present document if, according to the EUT''s specifications, they support cable lengths greater than 3 m.

    For an EUT that has several modules, each with its own power cable (however terminated) and for which the

    manufacturer provides a power strip (multi-socket mains splitter) with a single power cable for connection to the

    external power source, a single measurement shall be performed at the mains input to that power cable.

    The artificial network shall be the one described in EN 55016-1-2 [1], clause 4:

    - 0,15 MHz to 30 MHz: (50 Ω // 50 μH).

    The DC return lead at the EUT side shall be connected to the protective earth if this is required by the equipment

    installation specification.

    ETSI

    22 ETSI EN 300 386 V3.2.1 (2025-11)

    When the use of the artificial network is not suitable (e.g. when the EUT has a current absorption higher than 200 A)

    the method described in EN 55016-1-2 [1], clause 5.2, for the voltage probe (1 500 Ω) may be used.

    6.3 Wired network Ports

    For conducted emissions on wired network ports in the frequency range 0,15 MHz to 30 MHz, the test method specified

    in EN 55032 [31], clause A3, table A.8 and clauses A8.2, A8.3 or A8.4, shall apply.

    6.4 Antenna Port

    Where the EUT has a port intended for the connection of an external antenna, the requirements of EN 55032 [31],

    clause A3, table A.8 and clauses A8.2, A8.3 or A8.4 for antenna ports shall apply.

    6.5 Radiated emission

    For radiated emission in the frequency range 30 MHz to 6 000 MHz the test method specified in EN 55032 [31],

    table A.1, clauses A1.1, A1.2, A1.3 and A1.4, shall apply.

    7 Test levels and limits

    7.0 General requirements

    The EMC properties of the radio function of the EUT shall be tested against the requirements defined in annex D of the

    present document and, for radio technologies not covered in annex D, the applicable radio EMC standard(s) for the

    specific technology shall also be used. Where there are conflicts between the EMC requirements of the radio standard

    and the present document, the requirements of the present document shall apply.

    Conducted immunity test shall not be applied to the ports that, according to the product documentation, are not

    permanently connected but just used to setup or perform a maintenance activity of the equipment; these maintenance

    activities are not intended operating conditions because such connections are not present in the normal operating

    conditions.

    The non-radio function of the EUT shall be tested against the requirements of the present document.

    7.1 Emission

    7.1.1 Enclosure port, Radiated electromagnetic field emissions

    For radiated emissions, the EUT with the radio function in receive mode shall comply with the limits defined in

    EN 55032 [31], annex A:

    • for the frequency range up to 1 GHz: table A.2, clauses A2.1, A.2.2, A2.3, A2.4 or table A.4, clauses A4.1,

    A.4.2, A4.3, A4.4;

    • for the frequency range above 1 GHz and up to 6 GHz: table A.3, clauses A3.1 and A3.2 or clauses A5.1 and

    A5.2.

    The determination of the applicable limits shall be according to the equipment classification defined in EN 55032 [31],

    clause 4.

    If the EUT has no receiver but just a transmitter the EUT transmitter shall be set to standby-mode.

    ETSI

    23 ETSI EN 300 386 V3.2.1 (2025-11)

    7.1.2 AC ports

    7.1.2.1 Conducted emissions

    The limits defined in EN 55032 [31], annex A, table A.9, clauses A9.1 and A9.2 or table A.10, clauses A10.1 and

    A10.2. shall apply.

    The determination of the applicable limits shall be according to the equipment classification defined in EN 55032 [31],

    clause 4.

    7.1.3 DC ports, Conducted emissions

    The limits defined in EN 55032 [31], annex A, table A.9, clauses A9.1 and A9.2 shall apply.

    The limits above apply to DC power ports in any environment defined in clause 4 of the present document.

    NOTE: DC power cables of telecommunication network equipment in residential environment are either shorter

    than 3 m or running underground.

    7.1.4 Wired network ports, Conducted emissions

    The limits defined in EN 55032 [31], annex A, table A.11, clauses A11.1, A11.2 and A11.3 or table A.12,

    clauses A12.1, A12.2 and A12.3. shall apply.

    The determination of the applicable limits shall be according to the equipment classification defined in EN 55032 [31],

    clause 4.

    7.2 Immunity

    7.2.0 General

    Immunity requirements are defined in clause 7.2.1 for equipment operating in telecommunication centres and

    clause 7.2.2 for equipment operating in other than telecommunication centre.

    If no restrictions are specified in the product documentation for the installation environment; i.e. telecommunication

    centres or other than telecommunication centre as described in clause 4 of the present document, the equipment shall

    comply with the requirements of both environments.

    NOTE: Surge test on DC ports is not defined in the present document because in the environment of

    "telecommunication centres" the DC power distribution is an indoor network in a controlled environment.

    Whereas in the environment "other than telecommunication centres" the DC power line is derived from

    an AC/DC converter with a cable shorter than 10 m and then surge test is performed on the AC port only.

    ETSI

