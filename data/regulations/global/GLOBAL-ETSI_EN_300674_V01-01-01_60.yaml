    9 EN 300 674 V1.1.1 (1999-02)

    1 Scope

    The present document specifies radio parameters which are necessary for the efficient use of the radio spectrum and for

    the purpose of type approval. This includes methods of measurements for verifying the limits stated in the present

    document.

    The present document applies to 5,8 GHz Short Range Devices (SRDs) for use in Road Transport Traffic and

    Telematics (RTTT):

    - with a Radio Frequency (RF) output connection and specified antenna or with an integral antenna;

    - for data transmission only;

    - operating on radio frequencies in the 5 725 MHz to 5 875 MHz Industrial, Scientific and Medical (ISM) band.

    The applicability of the present document covers both the Road Side Units (RSUs) and the On Board Units (OBUs) with

    transceivers and transponders.

    The present document does not necessarily include all the characteristics which may be required by a user, nor does it

    necessarily represent the optimum performance achievable.

    The present document complies with ERC/DEC/(92)02 [2] and CEPT/ERC Recommendation 70-03 [3]. It is a specific

    standard covering various RTTT applications.

    For non-harmonized parameters, national regulatory conditions may apply regarding the type of modulation,

    channel / frequency separation, maximum transmitter output power / effective radiated power, equipment marking as a

    condition of the issue of an individual or general license, or, as a condition of use under license exemption.

    Additional standards or specifications may be required for equipment such as that intended for connection to the Public

    Switched Telephone Network (PSTN) or other systems.

    2 References

    The following documents contain provisions which, through reference in this text, constitute provisions of the present

    document.

    • References are either specific (identified by date of publication, edition number, version number, etc.) or

    non-specific.

    • For a specific reference, subsequent revisions do not apply.

    • For a non-specific reference, the latest version applies.

    • A non-specific reference to an ETS shall also be taken to refer to later versions published as an EN with the same

    number.

    [1] ENV 12253 (1997): "Road Transport and Traffic Telematics (RTTT); Dedicated Short-range

    Communication (DSRC); Physical Layer using Microwave at 5,8 GHz".

    [2] ERC/DEC/(92)02: "ERC Decision of 22 October 1992 on the frequency bands to be designated for

    the co-ordinated introduction of Road Transport Telematic systems(RTT)".

    [3] CEPT/ERC Recommendation 70-03: "Relating to the use of Short Range Devices (SRD)".

    [4] CISPR 16-1: "Specification for radio disturbance and immunity measuring apparatus and methods;

    Part 1: Radio disturbance and immunity measuring apparatus".

    [5] ETR 028: "Electromagnetic compatibility and Radio spectrum Matters (ERM); Uncertainties in the

    measurement of mobile radio equipment characteristics".

    [6] ITU-T Recommendation O.153 (1992): "Basic parameters for the measurement of error

    performance at bit rates below the primary rate".

    ETSI

    10 EN 300 674 V1.1.1 (1999-02)

    [7] IEC 721-3-4 (1995): "Classification of environmental conditions; Part 3: Classification of groups

    of environmental parameters and their severities; Section 4: Stationary use at non-weatherprotected

    locations".

    [8] IEC 721-3-5 (1997): "Classification of environmental conditions; Part 3: Classification of groups

    of environmental parameters and their severities; Section 5: Ground vehicle installations".

    3 Definitions, symbols and abbreviations

    3.1 Definitions

    For the purposes of the present document, the following definitions apply:

    assigned frequency band: the frequency band within which the device is authorized to operate.

    Road Side Unit (RSU): equipment intended for use in a fixed location (Fixed Station).

    integral antenna: an antenna, with or without a connector, designed as an indispensable part of the equipment.

    integrated antenna: an antenna, without connector, integrated as part of the equipment.

    successful message ratio: the proportion of transmitted messages that are received correctly under test conditions.

    On Board Unit (OBU): a device normally fixed in a vehicle which responds to an interrogating signal.

    portable station: equipment intended to be carried, attached or implanted.

    operating frequency: the nominal frequency at which equipment is operated; also referred to as the operating centre

    frequency. Equipment may be able to operate at more than one operating frequency.

    operating frequency range: the range of operating frequencies over which the equipment can be adjusted through

    switching or reprogramming.

    radiated measurements: measurements which involve the absolute measurement of a radiated field.

    transceiver OBU: On Board Unit (OBU) with local Rx and Tx 5,8 GHz frequency generation.

    transponder: On Board Unit (OBU) without own 5,8 GHz frequency generation.

    3.2 Symbols

    For the purposes of the present document, the following symbols apply:

    dBi Gain relative to an isotropic antenna

    E Field strength

    E Reference field strength, (see subclause A.3.2.)

    o

    f Transmitter carrier frequency

    S

    f Declared transponder subcarrier frequency

    TX

    l Wavelength

    ppm parts per million (10-6)

    R Distance, (see subclause A.3.2.)

    R Reference distance, (see subclause A.3.2.)

    o

    Rx Receiver

    Tx Transmitter

    ETSI

    11 EN 300 674 V1.1.1 (1999-02)

    3.3 Abbreviations

    For the purposes of the present document, the following abbreviations apply:

    eirp equivalent isotropically radiated power

    EUT Equipment Under Test

    IF Intermediate Frequency

    ISM Industrial, Scientific and Medical

    NOTE: The present document covers only the following designated ISM band: 5 725 MHz to 5 875 MHz.

    OEM Original Equipment Manufacturer

    OBU On Board Unit

    PSK Phase Shift Keying

