    Foreword

    This European Standard (Telecommunications series) has been produced by ETSI Technical Committee

    Electromagnetic compatibility and Radio spectrum Matters (ERM).

    The present document has been produced by ETSI in response to a mandate from the European Commission issued

    under Council Directive 98/34/EC (as amended) laying down a procedure for the provision of information in the field of

    technical standards and regulations.

    The present document together with ETS 300 683, is intended to become a Harmonized Standard, the reference of

    which will be published in the Official Journal of the European Communities referencing the Council Directive on the

    approximation of the laws of the Member States relating to electromagnetic compatibility ("the EMC Directive")

    (89/336/EEC as amended).

    Technical specifications relevant to the EMC Directive are given in annex G.

    As a result of a meeting between CEN, CEPT, ETSI, and the European Commission on 29 June 1998, the existing work

    item was split as follows:

    - EN 300 674, supporting the CEN TC 278 RTTT system;

    - ES 200 674-1, supporting RTTT systems with lower data rates;

    - ES 200 674-2, supporting RTTT systems with higher data rates.

    National transposition dates

    Date of adoption of this EN: 22 January 1999

    Date of latest announcement of this EN (doa): 30 April 1999

    Date of latest publication of new National Standard

    or endorsement of this EN (dop/e): 31 October 1999

    Date of withdrawal of any conflicting National Standard (dow): 30 April 2002

    ETSI

    8 EN 300 674 V1.1.1 (1999-02)

    Introduction

    The present document was drafted on the assumption that type test measurements, performed in an accredited test

    laboratory, will be accepted by the various national regulatory authorities in order to grant type approval, provided the

    national regulatory requirements are met. This is in compliance with CEPT/ERC Recommendation 70-03 [3].

    The present document specifies the requirements for a dedicated 5,8 GHz short range microwave link intended for a

    European wide data communication system for Road Transport and Traffic Telematics (RTTT) applications.

    RTTT systems for Europe-wide use are specified by CEN. The necessary set of radio parameters for the support of

    ENV 12253 [1] is included in the present document.

    The parameters might be subject to changes if necessary and when other RTTT systems specified by CEN require this.

    The RSU transmitter operates on a non-exclusive basis on frequencies depending on the declared application according

    to ERC/DEC(92)02 [2].

    A channel spacing of 5 MHz is used for channels 1, 2, 3 and 4, see table 1.

    Table 1: RTTT transmitter frequencies for 5 MHz channel spacing systems

    Initial road to Multi lane road junctions

    Vehicle systems (options)

    Channel 1 5,800 GHz - 2,5 MHz

    Channel 2 5,800 GHz + 2,5 MHz

    Channel 3 5,810 GHz - 2,5 MHz

    Channel 4 5,810 GHz + 2,5 MHz

    In order to permit the greatest freedom of design of equipment, whilst protecting other radio services from interference,

    a balance is required between the permitted range of frequencies on which the equipment may be used, and its frequency

    stability and modulation characteristics. The present document specifies the operational frequencies and system

    bandwidths. However, the present document does not fully describe the permitted range of optional frequencies as these

    are covered by national regulations. The optional range of frequencies offered should be specified on each type approval

    certificate issued.

    Clauses 1 and 3 give a general description of the types of equipment covered by the present document and the

    definitions and abbreviations used. Clause 4 gives general requirement in order that type tests may be carried out and

    any markings on the equipment to be provided by the manufacturer.

    Clauses 5 and 6 specify the test conditions.

    Clauses 7 and 8 specify the limits of the parameters which are required to be tested for the RSU transmitters and

    receivers 1. These limits have been chosen to minimize harmful interference to and from other equipment and services.

    These clauses also specify how the equipment is to be tested and the conditions which are applied.

    Clause 9 specifies the limits of the parameters which are required to be tested for transponders. These limits are chosen

    to restrict the access to and radiation from transponders. Details on the test methods for the transponders are also

    specified.

    Clause 10 specifies the maximum measurement uncertainty values.

    Annex A provides normative specifications concerning test sites for radiated measurements.

    Annex B provides normative descriptions of measurement methods for radiated measurements.'
