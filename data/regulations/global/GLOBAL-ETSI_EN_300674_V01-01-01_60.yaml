  title: 'Annex C (normative):'
  text: 'Annex C (normative):

    Receiver methods of measurements using messages

    C.1 General

    The equipment may be tested by using messages when it is not possible to test with bit streams according to

    subclause 6.1.1.1. In this case the normal test signal shall be trains of correctly coded bits or messages modulation

    D-M4. Such messages can also be used for activation of OBUs or performance test of a total installed system.

    C.2 Test signals

    The normal test signals and modulations shall be obtained as follows:

    - D-M3 corresponds to single messages, used for receiver measurements using the up-down method as described in

    clauses C.3 and C.4, triggered either manually or by an automatic testing system. This provides the "normal test

    signal" as required for receiver measurements (e.g. see subclauses 8.1.2.4 and 8.3);

    - D-M4 consists of correctly coded signals, messages transmitted sequentially, one by one, without gaps between

    them;

    - D-M4'' consists of incorrectly coded signals, messages transmitted sequentially, one by one, without gaps between

    them.

    D-M3 is used for receiver methods of measurement with messages where there is a need to transmit single messages a

    number of times (e.g. 20 times, see "normal test signal" of subclauses 8.3.3.2, 8.3.4.2, 8.3.5.2 and 8.3.6.2). The

    corresponding normal test modulation shall be agreed between the manufacturer and the test laboratory.

