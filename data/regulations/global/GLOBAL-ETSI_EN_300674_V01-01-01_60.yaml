    VSWR Voltage Standing Wave Ratio

    4 General

    4.1 Presentation of equipment for testing purposes

    Each equipment submitted for type testing shall fulfil the requirements of the present document on all frequencies over

    which it is intended to operate.

    The applicant shall complete the appropriate application form when submitting equipment for type testing. Additionally,

    technical documentation and operating manuals shall be supplied.

    The performance of the equipment submitted for testing shall be representative of the performance of the corresponding

    production model. In order to avoid any ambiguity in that assessment, the present document contains instructions for the

    presentation of equipment for type testing purposes (this subclause), conditions of testing (see clause 5) and

    measurement methods (see clauses 7, 8 and 9).

    Stand alone equipment shall be offered by the applicant complete with any ancillary equipment needed for testing. The

    applicant shall declare the frequency range(s), the range of operation conditions and power requirements, as applicable,

    in order to establish the appropriate test conditions.

    Test fixtures may be supplied by the applicant (see subclause 6.7).

    Original Equipment Manufacturers'' (OEM) plug-in cards or units may be offered for testing together with a suitable test

    fixture. Alternatively, complete RTTT equipment may be supplied by the manufacturer to facilitate the tests.

    To simplify and harmonize the testing procedures between the different test laboratories, measurements shall be

    performed, according to the present document, on samples of equipment defined in subclauses 4.1.1 and 4.1.2.

    These subclauses are intended to give confidence that the requirements set out in the present document have been met

    without the necessity of performing measurements on all optional frequencies.

    ETSI

    12 EN 300 674 V1.1.1 (1999-02)

    4.1.1 Choice of model for testing

    The applicant shall provide one or more production models of the equipment, as appropriate, for testing.

    Equipment designed for use with an integral antenna may be supplied with a temporary external / internal or permanent

    internal 50 W connector for the purpose of testing, providing the characteristics being measured are not expected to be

    affected. The measurements, wherever possible, should be made by use of a direct connection to the equipment under

    test (antenna connector or temporary 50 W connector) as stated in the present document, in order to ensure that the

    measurement uncertainties are minimized. If applicable, the means to access and/or implement the internal connector

    should be provided by the applicant with the aid of a diagram (see subclause 4.1.4). If a temporary 50 W RF connector is

    used, this shall be stated on the test report form.

    4.1.2 Choice of operating frequencies

    Where equipment can be adjusted to operate at different operating frequencies other than channels 1 and 2 (see table 1),

    a minimum of two operating frequencies shall be chosen such that the lower and higher limits of the applicant''s declared

    operating ranges of the equipment are covered.

    4.1.3 Testing of equipment with or without a permanent external RF port

    To facilitate relative measurements, use may be made of a test fixture as described in subclause 6.7, or the equipment

    may be supplied with a permanent internal / external or temporary internal / external RF port.

    4.1.4 Equipment with a permanent internal RF port

    The way to access a permanent internal RF port shall be stated by the applicant with the aid of a diagram. The fact that

    use has been made of a permanent internal RF port shall be recorded in the test report.

    4.1.5 Equipment with a temporary RF port

    The applicant shall submit two sets of equipment to the test laboratory, one fitted with a temporary 50 W RF connector

    with the antenna disconnected and the other with the antenna connected. Each equipment shall be used for the

    appropriate tests.

    The way the temporary RF port is implemented shall be stated by the applicant with the aid of a diagram. The fact that

    use has been made of the temporary RF port to facilitate measurements shall be stated in the test report. The addition of

    a temporary RF port should not influence the performance of the Equipment Under Test (EUT).

    4.1.6 Antennas

    If the equipment to be tested can be equipped with one or more antennas, the manufacturer shall declare and provide

    these together with the equipment. These antennas shall be used during the radiated measurements described in the

    present document. The manufacturer shall declare the gain of the antenna or antenna assembly(ies). The characteristics

    of the antenna assembly(ies) shall be included in the user documentation supplied with the equipment.

    4.2 Mechanical and electrical design

    4.2.1 General

    The equipment submitted by the applicant or his representative, shall be designed, constructed and manufactured in

    accordance with good engineering practice, with the aim of minimizing harmful interference to other equipment and

    services.

    Transmitters and receivers may be individual or combination units.

    ETSI

    13 EN 300 674 V1.1.1 (1999-02)

    4.2.2 Controls

    Those controls which if maladjusted might increase the interference possibilities to and from the equipment shall only be

    accessible by partial or complete disassembly of the device and requiring the use of tools.

    4.2.3 Marking

    The equipment shall be marked in a visible place. This marking shall be legible and durable.

    4.2.3A Equipment identification

    The marking shall include as a minimum:

    - the name of the applicant or his trade mark;

    - the type designation.

    4.2.4 Receiver data squelch

    If the receiver is equipped with a data squelch or battery saving circuit, it shall be possible to override this circuit for the

    duration of some tests.

    4.3 Declarations by the applicant

    When submitting equipment for testing, the applicant shall supply the necessary information according to the

