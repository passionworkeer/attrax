  title: 'Annex C (informative):'
  text: 'Annex C (informative):

    Conversion of a radio call sign into an ATIS identification

    EXAMPLE 1: call sign = PC8075

    The ship''s identification (ID) is formed as follows:

    Z MID XX 8 0 7 5

    Where:

    Z = always 9;

    MID = for The Netherlands 244;

    XX = C = 03.

    ship''s ID

    9 244 03 8 0 7 5

    | |

    {Z P C 8 0 7 5}

    92 44 03 80 75

    Example of an ATIS message:

    DX 125 125 125 125 125 125 121 *121 92 44 03

    RX 111 110 109 108 107 106 105 104 121 121 92

    DX 80 75 127* ECC 127 127

    RX 44 03 80 75 127 ECC

    (* start/stop Error Correcting Code (ECC) calculation).

    Calculation of the ECC:

    • only DX information characters + one format and one end of sequence character are used to calculate the ECC.

    EXAMPLE 2:

    121 YBBYYYY

    92 BBYYYBY

    44 BBYYBYB

    03 YYBBBBB

    80 BBBBYBY

    75 YYBYBBY

    127 YYYYYYY

    -------------- + even vertical parity

    BYYYBYY(BYB) = 110

    ETSI

    51 ETSI EN 300 698 V2.3.1 (2018-11)

    Annex D (normative):

    Measuring receiver for adjacent channel power

    measurement

    D.1 Power measuring receiver specification

    D.1.0 General

    The power measuring receiver consists of a mixer, an Intermediate Frequency (IF) filter, an oscillator, an amplifier, a

    variable attenuator and an rms value indicator. Instead of the variable attenuator with the rms value indicator it is also

    possible to use an rms voltmeter calibrated in dB. The technical characteristics of the power measuring receiver are

    given in figure D.1 (see also Recommendation ITU-R SM.332-4 [i.6]).

    D.1.1 IF filter

    The IF filter shall be within the limits of the following selectivity characteristics.

    dB

    D4 D4

    90

    close distant

    to from

    D3 26 D3

    carrier carrier

    D2 6 D2

    2

    D1 0 D1 kHz

    Figure D.1: IF filter characteristics

    The selectivity characteristics shall keep the frequency separations shown in table D.1 from the nominal centre

    frequency of the adjacent channel.

    Table D.1: Selectivity characteristic

    Channel separation Frequency separation of filter curve from nominal centre frequency of adjacent channel

    (kHz) (kHz)

    D1 D2 D3 D4

    12,5 3 4,25 5,5 9,5

    25 5 8,0 9,25 13,25

    The attenuation points shall not exceed following tolerances shown in table D.2.

    ETSI

    52 ETSI EN 300 698 V2.3.1 (2018-11)

    Table D.2: Tolerance of attenuation points close to carrier

    Channel separation Tolerance range (kHz)

    (kHz) D1 D2 D3 D4

    12,5 +1,35 ±0,1 -1,35 -5,35

    25 +3,1 ±0,1 -1,35 -5,35

    Table D.3: Tolerance of attenuation points distant from the carrier

    Channel separation Tolerance range (kHz)

    (kHz) D1 D2 D3 D4

    12,5 ±2,0 ±2,0 ±2,0 +2,0

    -6,0

    25 ±3,5 ±3,5 ±3,5 +3,5

    -7,5

    The minimum attenuation of the filter outside the 90 dB attenuation points shall be equal to or greater than 90 dB.

    D.1.2 Attenuation indicator

    The attenuation indicator shall have a minimum range of 80 dB and a reading accuracy of 1 dB. With a view to future

    regulations an attenuation of 90 dB or more is recommended.

    D.1.3 Rms value indicator

    The instrument shall accurately indicate non-sinusoidal signals in ratio of up to 10:1 between peak value and rms value.

    D.1.4 Oscillator and amplifier

    The oscillator and the amplifier shall be designed in such a way that the measurement of the adjacent channel power of

    a low-noise unmodulated transmitter, whose self-noise has a negligible influence on the measurement result, yields a

    measured value of less than -90 dB.

    ETSI

