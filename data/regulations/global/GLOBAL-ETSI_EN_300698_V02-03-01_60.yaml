    4 General and operational requirements

    4.0 Conformance

    Compliance shall be established by simple inspection of the equipment and its technical documentation.

    ETSI

    10 ETSI EN 300 698 V2.3.1 (2018-11)

    4.1 Construction

    All controls shall be of sufficient size to enable the usual control functions to be easily performed and the number of

    controls should be the minimum necessary for simple and satisfactory operation.

    For the purpose of conformance testing, relevant technical documentation shall be supplied with the equipment.

    The VHF maritime mobile service uses both single-frequency and two-frequency channels. For two-frequency channels

    the Radio Regulations require a separation of 4,6 MHz between the transmitting frequency and the receiving frequency.

    The equipment shall be capable of operating on single frequency and two-frequency channels with manual control

    (simplex). It may also be capable of operating on two-frequency channels without manual control (duplex).

    No scanning or multiple watch facilities shall be implemented.

    The equipment shall be able to operate on appropriate channels defined in the ITU Radio Regulations [1], Appendix 18.

    Additional VHF channels outside those defined by the ITU Radio Regulations [1], Appendix 18 may also be provided, but

    means shall be provided to block any or all of these additional channels, as may be required by the licence before installation

    on board vessels. It shall not be possible for the user to unblock any blocked channels.

    The equipment shall be so designed that use of channel 70 for purposes other than DSC is prevented, and that use of

    channels AIS1 and AIS2 for purposes other than AIS is prevented.

    The possibility to apply automatic power reduction to any of these channels shall be available. It shall not be possible

    for the user to change the programmed settings of these channels.

    The output power shall be automatically limited to a value between 0,5 W and 1 W on the following channels:

    - 6, 8, 10, 11, 12, 13, 14, 15, 17, 71, 72, 74, 75, 76 and 77.

    It shall not be possible to transmit while any frequency synthesizer used within the transmitter is out of lock.

    It shall not be possible to transmit during channel switching operations.

    Where equipment is capable of operating in modes other than just inland waterways then:

    - when operating in "inland waterways" mode, all the requirements of the present document apply;

    - when operating in other modes, the equipment shall comply with the requirements of the applicable standard

    for that mode of operation.

    4.2 Controls and indicators

    The equipment shall have a channel selector and shall indicate the designator, as shown in the ITU Radio

    Regulations [1], Appendix 18, of the channel at which the installation is set. The channel designator shall be legible

    irrespective of the external lighting conditions.

