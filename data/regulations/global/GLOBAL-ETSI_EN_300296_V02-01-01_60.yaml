    ETSI

    61 ETSI EN 300 296 V2.1.1 (2016-03)

    Annex D (normative):

    Band-stop filter (for SINAD meter)

    The characteristics of the band-stop filter used in the audio distortion factor meter and SINAD meter should be such that

    at the output the 1 000 Hz tone will be attenuated by at least 40 dB and at 2 000 Hz the attenuation will not exceed

    0,6 dB. The filter characteristic shall be flat within 0,6 dB over the ranges 20 Hz to 500 Hz and 2 000 Hz to 4 000 Hz.

    In the absence of modulation the filter shall not cause more than 1 dB attenuation of the total noise power of the audio

    frequency output of the receiver under test.

    ETSI

