    United Nations Convention on

    Negotiable Cargo Documents, New York, 15 December 2025





    Issuance of Certified True Copies




    Opening for Signature




    Certified True Copy


    The Convention was adopted by the General Assembly of the

    United Nations by Resolution

    80/162

    at its 64th plenary meeting in New York on 15 December

    2025. The Convention, also known as the Accra Convention on Negotiable Cargo Documents,

    shall be open for signature by all States and regional economic integration organizations in

    Accra (Ghana) during the second half of 2026, at a date that will be communicated as soon as

    possible by a subsequent depositary notification.




    Agreement under the United Nations

    Convention on the Law of the Sea on the Conservation and Sustainable Use of Marine

    Biological Diversity of Areas beyond National Jurisdiction


    On 19 September 2025, the conditions for the entry into force

    of the Agreement under the United Nations Convention on the Law of the Sea on the

    Conservation and Sustainable Use of Marine Biological Diversity of Areas beyond National

    Jurisdiction (adopted at New York on 19 June 2023) were met. Accordingly, the Agreement,

    also known as the “BBNJ Agreement”, shall enter into force on

    17 January 2026.




    C.N.447.2025.TREATIES- XI.10 (Depositary Notification)



    Treaty Event 2025: Eighty Years of

    Multilateral Treaty Making at the United Nations (23 - 26 September 2025, United Nations

    Headquarters)



    This year’s


    Treaty

    Event

    will be held from


    23 to 26 September 2025

    at the United Nations Headquarters in New York, in

    conjunction with the general debate of the landmark eightieth session of the General

    Assembly.



    The


    Treaty

    Event

    will highlight multilateral treaties deposited with the Secretary-General which

    cover a wide range of areas of global concern, including human rights, disarmament, penal

    matters, law of the sea, and the environment.

    The


    Treaty

    Event

    may also be used to sign and ratify or accede to any treaty for which the

    Secretary-General acts as depositary.



    For more details, please refer to the


    2025 Treaty Event publication



    United Nations Convention on the

    International Effects of Judicial Sales of Ships


    On 21 August 2025, the conditions for the entry into force of

    the United Nations Convention on the International Effects of Judicial Sales of Ships

    (adopted at New York on 7 December 2022) were met. Accordingly, the Convention, also known

    as the “Beijing Convention on the Judicial Sale of Ships”, shall enter into force on

    17

    February 2026.




    C.N.415.2025.TREATIES- X.21 (Depositary Notification)



    Special Treaty Event for BBNJ

    Agreement at the United Nations

    Ocean Conference (UNOC3)(9 June 2025 in Nice, France)


    A special treaty event will be held on

    9 June 2025

    in

    Nice, France, on the margins of the third United Nations Ocean Conference (UNOC3) to

    provide States wishing to do so with an opportunity to sign the Agreement under the United

    Nations Convention on the Law of the Sea on the Conservation and Sustainable Use of Marine

    Biological Diversity of Areas beyond National Jurisdiction, adopted in New York on 19 June

    2023 (the “BBNJ Agreement”) and deposit instruments of ratification, acceptance or

    approval.


    The BBNJ Agreement special treaty event will take place at

    7

    p.m.

    at the Side event Room 5, Port Lympia, Nice.


    States wishing to sign the BBNJ Agreement or deposit

    instruments of ratification, acceptance, or approval at the special treaty event

    must notify the Treaty Section of their intention to do so through their Permanent Mission

    in New York and provide signed copies

    of full powers and instruments of ratification, acceptance or approval for verification, by


    30 May 2025.





    Note verbale - 2025 OLA-TS-DN/DH


    For further information, please contact the Treaty Section

    (email:

    treatysection@un.org

    ; telephone: (212)

    963-5047


    Call for nominations to participate in the

    Regional Workshop on Treaty Law and Practice for African States, to be held in Addis

    Ababa, Ethiopia, from 20-22 May 2025. The deadline for registration is 18 April 2025




    Note verbale




    Tentative programme


    United Nations Convention against Cybercrime; Strengthening International Cooperation

    for Combating Certain Crimes Committed by Means of Information and Communications

    Technology Systems and for the Sharing of Evidence in Electronic Form of Serious Crimes

    , New York, 24 December 2024




    Issuance of Certified True Copies




    Opening for Signature




    Certified

    True Copy


    The Convention was adopted by the General Assembly of the

    United Nations by Resolution 79/243 at its 55th (resumed) plenary meeting in New York on

    24 December 2024. The Convention shall be open for signature by all States and regional

    economic integration organizations in Hanoi (Viet Nam) at a date that will be communicated

    as soon as possible by a subsequent depositary notification.



    Treaty Event 2024: Strengthening the

    Multilateral Treaty Framework (24 - 27 September 2024, United Nations Headquarters)


    This year’s Treaty Event will be held from


    24 to 27 September 2024

    at the United Nations Headquarters in New York, in

    conjunction with the general debate of the seventy-ninth session of the General Assembly.



    The Treaty Event will highlight multilateral treaties

    deposited with the Secretary-General, promoting in particular the Sustainable Development

    Goals. These cover a wide range of areas of global concern, including human rights,

    disarmament, penal matters, law of the sea, and the environment. The Treaty Event may also

    be used to sign and ratify or accede to any treaty for which the Secretary-General acts as

    depositary.



    For more details, please refer to the


    2024 Treaty Event publication


    General Assembly  resolution

    78/236 of 22 december 2023 - Strengthening and promoting the international treaty

    framework


    During its seventy-eight session and following the Sixth

    Committee''s debate on the agenda item entitled “Strengthening and promoting the

    international treaty framework”, the General Assembly adopted on 22 December 2023

    the

    Resolution 78/236

    . For more information on this General Assembly

    resolution, see the following document:



    A/RES/78/236


    Convention on the contract for

    international carriage of goods by rail, Geneva, 17 November 2023




    Issuance of Certified True Copies




    Opening for Signature




    Certified

    True Copy


    The Convention on the Contract for International Carriage of Goods by Rail was adopted in

    Geneva on 17 November 2023 at the seventy-seventh session of the Working Party on Rail

    Transport of the Inland Transport Committee of the United Nations Economic Commission for

    Europe (UNECE). The Convention shall be open for signature at the United Nations

    Headquarters in New York until 31 March 2025 by all States.



    Agreement under the United Nations

    Convention on the Law of the Sea on the Conservation and Sustainable Use of Marine

    Biological Diversity of Areas beyond National Jurisdiction, New York, 19 June 2023




    Issuance of Certified True Copies




    Opening for Signature




    Certified

    True Copy


    The Agreement under the United Nations Convention on the Law

    of the Sea on the Conservation and Sustainable Use of Marine Biological Diversity of Areas

    beyond National Jurisdiction was adopted In New York on 19 June 2023 during the further

    resumed fifth session of the Intergovernmental conference on an international legally

    binding instrument under the United Nations Convention on the Law of the Sea on the

    Conservation and Sustainable Use of Marine Biological Diversity of Areas beyond National

    Jurisdiction. The Agreement shall be open for signature in New York on

    20 September

    2023

    and shall remain open for signature until 20 September 2025.


    United Nations Convention on the

    International Effects of Judicial Sales of Ships. New York, 7 December 2022




    Issuance of Certified True Copies




    Opening for Signature




    Certified True Copy


    The United Nations Convention on the International Effects of

    Judicial Sales of Ships was adopted in New York on

    7 December 2022

    by resolution

    77/100 during the seventy-seventh session of the General Assembly of the United Nations.

    The Convention shall be open for signature in Beijing on 5 September 2023, and remain open

    for signature thereafter at UN Headquarters in New York.


    Treaty Event 2023: Towards universal

    participation in multilateral environmental agreements for a healthy planet (19 - 22

    September 2023, United Nations Headquarters)


    This year’s Treaty Event will be held from


    19 to 22 September 2023

    at the United Nations Headquarters in New York, in

    conjunction with the general debate of the seventy-eighth session of the General Assembly.



    The Treaty Event will highlight multilateral environmental

    agreements deposited with the Secretary-General as well as treaties that cover a number of

    areas of global concern, including human rights, gender equality, the law of the sea, and

    disarmament. The Treaty Event may be used to sign and ratify or accede to any treaty for

    which the Secretary-General acts as depositary.



    For more details, please refer to the


    2023 Treaty Event publication


    General Assembly  resolution

    76/120 of 9 December 2021 - amended regulations to give effect to article 102 of

    the Charter


    During its seventy-sixth session and following the Sixth

    Committee''s debate on the agenda item on “Strengthening and promoting the international

    treaty framework”, the General Assembly adopted, on 9 December 2021, resolution 76/120 to

    which newly amended Regulations were annexed. This fifth amendment became

    effective on

    1 February 2022

    and is available at the following link:



    LA 41 TR/230/Regulations/2021


    Regional Agreement on Access to

    Information, Public Participation and Justice in Environmental Matters in Latin America

    and the Caribbean


    On 22 January 2021, the conditions for the entry into force

    of the Regional Agreement on Access to Information Public Participation and Justice in

    Environmental Matters in Latin America and the Caribbean (adopted in Escazu 4 March 2018)

    were met. Accordingly, the Agreement shall enter into force on

    22 April 2021

    .




    C.N.15.2021.TREATIES-XXVII.18 (Depositary Notification)


    Framework Agreement on Facilitation of

