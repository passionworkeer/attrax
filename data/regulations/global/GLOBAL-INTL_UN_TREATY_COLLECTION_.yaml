    The Convention was adopted on 20 December 2018 by resolution

    73/198 during the seventy-third session of the General Assembly of the United Nations. The

    Convention shall be open for signature by all States in Singapore, on

    7 August 2019


    , and thereafter at United Nations Headquarters in New York.


    General Assembly  resolution

    73/210 of 20 december 2018 - amended regulations to give effect to article 102 of

    the Charter


    During its seventy-third session and following the Sixth

    Committee''s debate on the agenda item entitled “Strengthening and promoting the

    international treaty framework”, the General Assembly adopted on 20 December 2018

    the Resolution 73/210, to which newly amended Regulations were annexed . This fourth

    amendment, which became

    effective on 1 February 2019

    , adapts the Regulations to

    developments in the registration practice and information technology, and ensures

    consistency with regard to the treaty-making practice of the international community. For

    more information on this latest amendement and its impact on the treaty

    registration and publication process, see the following document:



    LA 41 TR/230/Regulations/2019


