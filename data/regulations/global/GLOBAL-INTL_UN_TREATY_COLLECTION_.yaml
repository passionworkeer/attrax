    C.N.536.2020.TREATIES-X.20 (Depositary Notification)


    Treaty on the Prohibition of Nuclear

    Weapons


    With the deposit of the fiftieth instrument of ratification

    or accession on 24 October 2020, the Treaty on the Prohibition of Nuclear Weapons, adopted

    in New York on 7 July 2017, shall enter into force on

    22 January 2021

    , in

    accordance with its article 15, paragraph 1.




    C.N.478.2020.TREATIES-XXVI.9 (Depositary Notification)


    United Nations Convention on

    International Settlement Agreements Resulting from Mediation


    With the deposit with the Secretary-General on 12 March 2020

    of the third instrument of ratification, the United Nations Convention on International

    Settlement Agreements Resulting from Mediation, also known as the “Singapore Convention on

    Mediation”, shall enter into force on

    12 September 2020

    .


