    The Secretary-General of the United Nations is the depositary of more than 600 multilateral treaties.


    "Every treaty and every international agreement entered into by any Member of the United Nations ... shall as soon as possible be registered with the Secretariat and published by it." (Article 102 of
    the Charter of the United Nations)


