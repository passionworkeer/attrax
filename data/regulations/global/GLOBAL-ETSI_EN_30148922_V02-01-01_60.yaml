- id: art-3
  title: 'Annex C (informative):'
  text: 'Annex C (informative):

    Test Report

    The following information should be recorded in the test report:

    • the functions of the radio equipment to be assessed during and after the EMC exposure;

    • the intended functions of the radio equipment which should be in accordance with the documentation

    accompanying the equipment;

    • the user control functions and stored data that are required for normal operation and the method to be used to

    assess whether these have been lost after the EMC exposure;

    • the type of modulation, the characteristics of the transmission used for testing (random bit stream, message

    format, etc.) and the necessary test equipment delivered to enable the assessment of the EUT;

    • the ancillary equipment to be combined with the radio equipment for testing (where applicable);

    • an exhaustive list of ports, with the maximum cable lengths allowed, classified as either power or

    telecommunication/signal/control. Power ports should further be classified as AC or DC power;

    • the bandwidth of the IF filter immediately preceding the demodulator or equivalent system bandwidth;

    • the method to be used to verify that a communication link is established and maintained (if appropriate);

    • the operating frequency bands over which the equipment is intended to operate;

    • any equipment thermal limitation which prevent continuous testing of the EUT;

    • the environment(s) in which the equipment is intended to be used;

    • the occupied bandwidth of the corresponding transmitter signal for non-channelized equipment;

    • a list of service connectors or programming connectors;

    • details of the mechanism for manual recovery of normal operation should be provided in the user

    documentation;

    • the EUT software version used during the test;

    • exclusion bands applied.

    ETSI

