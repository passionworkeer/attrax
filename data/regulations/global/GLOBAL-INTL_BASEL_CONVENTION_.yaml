    The report of Part I of the 17th meeting of the Implementation and Compliance Committee is now available!

    The Committee met in Geneva from 18 to 21 June 2026, and during this first part of its meeting considered all the activities of its work programme for 2026-2027, which included the consideration of
    specific submissions, general issues of compliance and implementation under the Convention, and its draft 2028-2029 work programme.

    Basel Convention COP Bureau meeting report now available

    The Basel Convention COP 18 Bureau meeting took place online on 30 June and 1 July 2026.'
- id: art-2
  title: Basel Convention Bureau advances COP-18 preparations
  text: "Basel Convention Bureau advances COP-18 preparations\nThe COP Bureau met online on 30 June to 1 July 2026 to review key preparations, including the provisional agenda, for COP-18 scheduled to take\
    \ place 19–30 April 2027 in Panama City.\nUN Basel Convention Working Group Advances Global Action on Hazardous Waste and Other Wastes\nRepresentatives from 140 governments convened in Geneva last week\
    \ for the fifteenth meeting of the Open-ended Working Group (OEWG-15) of the Basel Convention.\nActivities\nNext\nPrevious\nEverything is in place for the 15th meeting of the Basel Convention Open ended\
    \ Working Group.\nPreparations for the 17th meeting of the Implementation and Compliance Committee are in full swing\n10th meeting of ENFORCE to be held in Vienna from 16 to 17 April 2026\nHow the BRS\
