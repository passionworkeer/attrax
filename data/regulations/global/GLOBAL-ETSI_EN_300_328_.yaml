- id: art-3
  title: 'Annex C (normative):'
  text: 'Annex C (normative):

    Measurement procedures for radiated measurement

    C.1 Introduction

    This annex gives the general procedures for radiated measurements using the test sites and arrangements described in

    annex B.

    Preferably, radiated measurements shall be performed in a FAR, see clause C.3. Radiated measurements in an OATS or

    SAR are described in clause C.2.

    C.2 Radiated measurements in an OATS or SAR

    Radiated measurements shall be performed with the aid of a measurement antenna and a substitution antenna in test

    sites described in annex B. The measurement set-up shall be calibrated according to the procedure defined in this annex.

    The UUT and the measurement antenna shall be oriented such as to obtain the maximum emitted power level. This

    position shall be recorded in the test report:

    a) The measurement antenna (device 2 in figure C.1) shall be oriented initially for vertical antenna polarization

    unless otherwise stated and the UUT (device 1 in figure C.1) shall be placed on the support in its normal

    position and switched on.

    b) The measurement equipment (device 3 in figure C.1) shall be connected to the measurement antenna (device 2

    in figure C.1) as shown in figure C.1.

    2

    specified height

    1 range 1 m to 4 m

    1,5 m

    ground

    plane

    3

    1) UUT

    2) Measurement antenna

    3) Measurement equipment

    Figure C.1: Measurement arrangement No.1

    c) The UUT shall be rotated through 360° around its azimuth until the maximum signal level is received.

    d) The measurement antenna shall be raised or lowered over the specified height range until the maximum signal

    level is received. This level shall be recorded.

    e) This measurement shall be repeated for horizontal measurement antenna polarization.

    C.3 Radiated measurements in a FAR

    For radiated measurements using a FAR, the procedure is identical to the one described in clause C.2, except that the

    height scan is omitted.

    ETSI

    86 ETSI EN 300 328 V2.2.2 (2019-07)

    C.4 Substitution measurement

    To determine the absolute measurement value, a substitution measurement, as described in step 1 to step 6 below, has to

    be performed:

    1) Replace the UUT with the substitution antenna as shown as device 1 in figure C.1. The substitution and the

    measurement antenna shall be vertically polarized.

    2) Connect a signal generator to the substitution antenna and set it to the frequency being investigated.

    3) If an OATS or an SAR is used, the measurement antenna shall be raised or lowered, to ensure that the

    maximum signal is received.

    4) Subsequently, the power of the signal generator is adjusted until the same level is obtained as recorded from

    the UUT (see clause C.2).

    5) The radiated power is equal to the power supplied by the signal generator, plus the gain of the substitution

    antenna, minus the cable loss.

    6) This measurement shall be repeated in horizontal polarization.

    For test sites with a fixed setup of the measurement antenna(s) and a reproducible positioning of the UUT, correction

    values from a verified site calibration may be used alternatively.

    C.5 Guidance for testing technical requirements

    C.5.1 Introduction

    This clause provides guidance on how the various technical requirements can be verified using radiated measurements.

    C.5.2 Test procedures and corresponding test sites

    Table C.1 provides guidance on the test site to be used for each of the test procedures when performing radiated

    measurements on integral antenna equipment.

    Table C.1: Test procedures and corresponding test sites

    Test procedures for essential radio test suites Clause Corresponding test site - Clause number(s)

    RF output power 5.4.2 B.2.1, B.2.2, B.2.3

    Duty Cycle, Tx-sequence, Tx-gap 5.4.2 B.4.3 or B.2.1, B.2.2, B.2.3

    Medium Utilization 5.4.2 B.4.3 in conjunction with the results from RF

    output power or B.2.1, B.2.2, B.2.3

    Power Spectral Density 5.4.3 B.4.3 in conjunction with the results from RF

    output power or B.2.1, B.2.2, B.2.3

    Accumulated Transmit time, Frequency Occupation and 5.4.4 B.4.3 or B.2.1, B.2.2, B.2.3

    Hopping Sequence

    Hopping Frequency Separation 5.4.5 B.4.3 or B.2.1, B.2.2, B.2.3

    Adaptivity 5.4.6 C.5.3

    Occupied Channel Bandwidth 5.4.7 B.4.3

    Transmitter unwanted emissions in the out-of-band domain 5.4.8 B.2.1, B.2.2, B.2.3

    Transmitter unwanted emissions in the spurious domain 5.4.9 B.2.1, B.2.2, B.2.3

    Receiver spurious emissions 5.4.10 B.2.1, B.2.2, B.2.3

    Receiver Blocking 5.4.11 C.5.4

    ETSI

    87 ETSI EN 300 328 V2.2.2 (2019-07)

    C.5.3 Guidance for testing Adaptivity (Channel Access

    Mechanism)

    C.5.3.1 Introduction

    This clause provides guidance on how the Adaptivity (see clause 4.3.1.7 or clause 4.3.2.6) requirement can be verified

    on integral antenna equipment using radiated measurements.

    C.5.3.2 Measurement Set-up

    Figure C.2 describes an example of a set-up that can be used to perform radiated adaptivity tests. In order to ensure that

    the signals going into the UUT are at the correct level, it is necessary to consider field strength, polarization and

    direction of arrival (relative to the antenna pattern of the UUT) of each signal. Other configurations are possible, for

    example with the wanted signal routed through the measurement antenna using a combiner.

    Figure C.2: Measurement Set-up

    C.5.3.3 Calibration of the measurement Set-up

    Before starting the actual measurement, the setup shall be calibrated. Figure C.3 shows an example of a set-up that can

    be used for calibrating the set-up given in figure C.2 using a substitution antenna and a spectrum analyser. It shall be

    verified that the levels of the interference and unwanted signals at the input of the substitution antenna correspond with

    the levels used for conducted measurements (see clause 5.4.6).

    For test sites with a fixed setup of the measurement antenna(s) and a reproducible positioning of the UUT, correction

    values from a verified site calibration may be used alternatively.

    ETSI

    88 ETSI EN 300 328 V2.2.2 (2019-07)

    Figure C.3: Measurement Set-up - Calibration

    C.5.3.4 Test method

    The test procedure shall be as follows:

    • Replace the substitution antenna with the UUT once the calibration is performed.

    • The UUT shall be positioned for maximum e.i.r.p. towards the horn antenna. See clause 5.4.3.2.2.

    The test method is further as described under clause 5.4.6.2.1.

    C.5.4 Guidance for testing Receiver Blocking

    C.5.4.1 Introduction

    This clause provides guidance on how the Receiver Blocking (see clause 4.3.1.12 or clause 4.3.2.11) requirement can be

    verified on integral antenna equipment using radiated measurements.

    C.5.4.2 Measurement Set-up

    Figure C.4 describes an example of a set-up that can be used to perform radiated receiver blocking tests.

    Figure C.4: Measurement Set-up

    ETSI

    89 ETSI EN 300 328 V2.2.2 (2019-07)

    C.5.4.3 Calibration of the measurement Set-up

    Before starting the actual measurement, the setup shall be calibrated. Figure C.5 shows an example of a set-up that can

    be used for calibrating the set-up given in figure C.4 using a substitution antenna and a spectrum analyser. It shall be

    verified that the level of the blocking signal at the input of the substitution antenna corresponds with the levels used for

    conducted measurements (see clause 5.4.11).

    For test sites with a fixed setup of the measurement antenna(s) and a reproducible positioning of the UUT, correction

    values from a verified site calibration may be used alternatively.

    Figure C.5: Measurement Set-up - Calibration

    C.5.4.4 Test method

    The test procedure shall be as follows:

    • Replace the substitution antenna with the UUT once the calibration is performed.

    • The UUT shall be positioned for maximum e.i.r.p. towards the horn antenna. See clause 5.4.3.2.2.

    The test method is further as described under clause 5.4.11.2.1.

    ETSI

    90 ETSI EN 300 328 V2.2.2 (2019-07)

