    9 ETSI EN 300 328 V2.2.2 (2019-07)

    Introduction

    The present document covers Wideband Data Transmission equipment.

    Examples of Wideband Data Transmission equipment are equipments such as IEEE 802.11™ RLANs [i.3], Bluetooth®

    wireless technologies, Zigbee™, etc.

    ETSI

    10 ETSI EN 300 328 V2.2.2 (2019-07)

    1 Scope

    The present document applies to Wideband Data Transmission equipment.

    The present document also describes spectrum access requirements to facilitate spectrum sharing with other equipment.

    Wideband Data Transmission equipment covered by the present document is operated in accordance with the ERC

    Recommendation 70-03 [i.6], annex 3 or Commission Decision 2006/771/EC [i.7] (and its amendments).

    This radio equipment is capable of operating in the band provided in table 1.

    Table 1: Service frequency bands

    Service frequency bands

    Transmit 2 400 MHz to 2 483,5 MHz

    Receive 2 400 MHz to 2 483,5 MHz

    Equipment using Ultra Wide Band (UWB) technology is not covered by the present document.

    NOTE: The relationship between the present document and essential requirements of article 3.2 of

    Directive 2014/53/EU [i.1] is given in annex A.

