- id: art-2
  title: FAO supports governments and partners to design the right po
  text: "FAO supports governments and partners to design the right policies and programmes to end hunger, promote\n            food security and promote sustainable agriculture for millions of\n       \
    \     people around the\n            world.\nHover the mouse over an SDG icon for more information\nA world free from hunger and malnutrition where food and agriculture contributes to improving the\
    \ living\n                standards of all\nFAO works with governments and partners to empower some of the world’s most marginalized people to\n                end rural poverty. \nFAO helps ensure\
    \ food security by developing ways of growing food that will work in the future so that\n                millions of people don’t go hungry.\nGood health starts with nutrition. FAO sets global standards\
    \ and works with governments and the private\n                sector to ensure food quality and safety throughout the food chain.\nFAO invests in educational systems for rural communities and supports\
    \ improved access to primary\n                education and school meals in order to create equal opportunities for all and chances of lifelong\n                learning. \nFAO supports gender equality\
    \ in the agricultural sector in an effort to raise levels of nutrition in\n                local communities and improve agricultural productivity. \nFAO works with governments to ensure water use in\
    \ agriculture is made more efficient, equitable and\n                environmentally friendly.\nFAO promotes the use of renewable energies and works to ensure access to modern energy services across\n\
    \                the food chain.\nFAO seeks better economic opportunities for all by investing in sustainable agricultural practices and\n                food systems that reduce inequalities and create\
    \ decent jobs. \nFAO seeks to secure a future for rural communities via investments in transportation, irrigation, food\n                storage facilities and communication technologies. \nFAO works\
    \ with countries and partners to generate employment in rural areas, ensure access to natural\n                resources for the most vulnerable and connect farmers to markets.\nFAO works to improve\
    \ urban healthcare, water quality and rethink city region food systems to help deter\n                the negative effects of sprawling urbanisation.\nFAO coordinates major global initiatives and projects\
    \ to tackle food waste and loss, partnering with\n                international organisations, the private sector and civil society.\nFAO supports countries in responding to the threats of climate change\
    \ by providing advice, data and tools\n                for better agricultural policies and practices.\nFAO, in partnership with governments and fishing communities, implements best practices in fisheries\
    \ to\n                ensure our oceans are protected as a means of livelihoods.\nFAO promotes sustainable approaches to natural resource management and supports endeavours that promote a\n        \
    \        balance between conservation and development initiatives.\nFAO plays a critical role in peacebuilding, restoring rural livelihoods, building resilience and\n                participatory approaches\
    \ to policymaking.\nFAO acts as a neutral policymaking forum and develops partnerships with all concerned with food and\n                agriculture to ensure a world free from hunger.\nFAO supports\
    \ governments and partners to design the right policies and programmes to\n        end hunger, promote\n       food security and promote sustainable agriculture for millions of people\n        around\
    \ the\n        world.\nFAO works with governments and partners to empower some of the world’s most\n                            marginalized people to end rural poverty. \nFAO helps ensure food security\
    \ by developing ways of growing food that will work in the\n                            future so that millions of people don’t go hungry.\nGood health starts with nutrition. FAO sets global standards\
    \ and works with governments and"
