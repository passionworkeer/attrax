    General product information and other remarks:

    The Express Vote 3 (EV3) is a ballot marking device giving voters a convenient method to create a

    summary of their selections while preventing the voter intent issues inherent in hand-marked ballots.

    The EV3 utilizes a thermal card that both initiates the voting session and captures the voter’s selections.

    Insertion of the activation card triggers the selection of ballot, which is presented to the voter. After

    makings their selections through the touchscreen interface, their selections are printed on the card. The

    EV3 then reads back their selections and presents a summary to the voter. The ballot summary card is

    returned to the voter for insertion into a tabulator.

    1. The equipment was assessed using the following documentation references:

    Circuit diagrams: PSB528 Rev A01

    User/installation guide: ExpressVote 3 Manual

    2. Classification of some polymeric materials has been verified using data supplied by the client. In

    these cases no testing has been conducted under this project.

    3. Where approval or product certification documentation has been used to verify suitability of safety

    critical components then limited testing only has been conducted under this project. Responsibility

    for compliance of such items remains with the issuing authority.

    4. The operating temperature range of the apparatus was 15.5 °C to 37.75 °C

    Model Differences –

    N/A – only 1 model assessed

