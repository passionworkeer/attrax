    IN THE SPOTLIGHT\nDIGITAL PRODUCT PASSPORT \nThe\nJoint CEN and CENELEC Technical Committee 24 ‘Digital Product Passport - Framework and System’\n, developed the first series of 8 European standards\
    \ to cover the essential aspects that are needed to implement the European Digital Product Passport required by the Ecodesign for\nSustainable Products Regulation (EU) 2024/1781\n, also known under\
    \ the acronym ESPR.\nREAD MORE\nIN THE SPOTLIGHT\nCEN WORKSHOP AGREEMENT ON TRUSTED DATA TRANSACTIONS\nDATA PROTECTION\nData is now the backbone of the digital economy: it enables economic growth and\
    \ competitiveness, fosters innovation, improves public services, and advances scientific research.\nTo address this growing need, CEN published a new dedicated Workshop Agreement, \nCWA 18125:2024 ‘Trusted\
    \ data transaction - part 1’\n. \nREAD MORE\nIN THE SPOTLIGHT\nEN 50388-1:2022: A NEW IMPORTANT STEP TO MANAGE ELECTRICAL COMPATIBILITY IN RAILWAYS\nTRANSPORT - RAILWAYS\nEnsuring the electrical compatibility\
    \ between rolling stock and electric traction systems is crucial for organizing a railway network.  A new tool can now help the railways community on this path. CENELEC is proud to present the\nEN 50388-1:2022\
    \ ‘Railway Applications - Fixed installations and rolling stock - Technical criteria for the coordination between electric traction power supply systems and rolling stock to achieve interoperability\
    \ - Part 1: General’\n.\nREAD MORE\n                                CEN-CENELEC Topics\n                                CEN Sectors\n                                CENELEC Sectors\nACCESSIBILITY\n\
