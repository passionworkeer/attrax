  text: 'Annex C (normative):

    Receiver methods of measurements using messages

    C.1 General

    Theequipmentmaybetestedbyusingmessageswhenitisnotpossibletotestwithbitstreamsaccordingto

    clause6.1.1.1.InthiscasethenormaltestsignalshallbetrainsofcorrectlycodedbitsormessagesmodulationD-M4.

    Suchmessagescanalsobeusedforperformancetestofatotalinstalledsystem.

    C.2 Test signals

    Thenormaltestsignalsandmodulationsshallbeobtainedasfollows:

    - D-M3correspondstosinglemessages,usedforreceivermeasurementsusingtheup-downmethodasdescribed

    inclausesC.3andC.4,triggeredeithermanuallyorbyanautomatictestingsystem.Thisprovidesthe"normal

    testsignal"asrequiredforreceivermeasurements(e.g.seeclauses8.1.2.4and8.3);

    - D-M4consistsofcorrectlycodedsignals,messagestransmittedsequentially,onebyone,withoutgapsbetween

    them;

    - D-M4''consistsofincorrectlycodedsignals,messagestransmittedsequentially,onebyone,withoutgaps

    betweenthem.

