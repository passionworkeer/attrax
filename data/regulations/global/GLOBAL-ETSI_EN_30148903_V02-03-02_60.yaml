  title: 'corresponding equipment: equipment with which the EUT intera'
  text: 'corresponding equipment: equipment with which the EUT interacts by means of radio waves as part of the EUT''s

    intended use

    EXAMPLE 1: If the EUT is an interrogator or reader for RFID or access control, the corresponding

    equipment may be a tag, label or keycard.

    EXAMPLE 2: If the EUT is a tag, label or keycard, the corresponding equipment may be a reader or

    interrogator.

    Operating Channel (OC): range of frequencies that contains the transmitted or received signal

    NOTE: Lower and upper frequency edges values of OC are denoted as FOC and FOC .

    low high

    operating frequency: centre of transmitted or received signal

    Operating Frequency Band (OFB): frequency band or sub-band within which the equipment is intended to operate

    receiver: stand-alone receiver or receiver being part of a transceiver

    transmitter: stand-alone transmitter or transmitter being part of a transceiver

