    4 Test conditions

    4.1 General

    The test conditions and provisions of ETSI EN 301 489-1 [1], clause 4 shall apply, with the modifications in clause 4 of

    the present document.

    ETSI

    11 ETSI EN 301 489-3 V2.3.2 (2023-01)

    4.2 Arrangements for test signals

    4.2.1 General

    The coupling mechanism for wanted RF signals between the EUT and the measuring and/or test equipment may include

    attenuation to control the level of the signals. The coupling mechanism shall be entirely passive so that the reciprocal

    path loss is the same.

    The wanted signals and/or controls required to exercise the EUT shall be representative of the EUT''s intended use.

    4.2.2 Receiver wanted input signal

    4.2.2.1 General

    For all tests except radiated immunity testing the level of the wanted signal at the input of the receiver or the enclosure

    port of the EUT shall be representative of the EUT intended use.

    For radiated immunity testing the standard procedure is described in clause 4.2.2.2. The alternative procedure in

    clause 4.2.2.3 shall be applied when:

    • the EUT is tested with corresponding equipment; and

    • the maximum separation between the EUT and the corresponding equipment is not more than one-tenth of a

    wavelength at the operating frequency.

    NOTE: The separation is measured as the air gap between the outer casings of the equipment.

    In the case of equipment without an antenna connector the wanted signal level shall be established for each orientation

    in which the EUT is tested.

    4.2.2.2 Radiated immunity test wanted signal level

    The level of the wanted signal at the input of the receiver or the enclosure port of the EUT, shall be 30 dB (±3 dB)

    above the minimum usable receiver signal level.

    NOTE 1: A simple method to establish the required wanted signal level is to establish operation, reduce level to the

    point of failure then increase by 30 dB.

    In the case that the dynamic range at the receiver input is insufficient to accommodate the above level, then the level

    shall be set as follows:

    The maximum usable receiver input level shall be found. The level of the wanted signal shall be set to the geometric

    mean power level of the minimum and maximum usable signal levels.

    NOTE 2: A simple method to establish the geometric mean power level is to take the arithmetic mean of the values

    in dBm.

    4.2.2.3 Radiated immunity test wanted separation'
