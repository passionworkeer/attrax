    SOLICITAÇÕES\nTV INMETRO\nOUVIDORIA\nPT\nEN\nES\nInmetro alerta para golpe com falsa notificação de fiscalização\nPeríodo Eleitoral 2026\nSituação do Prédio do Rio Comprido (RJ)\nPodInmetro?\nFale conosco\
    \ para obter mais informações sobre as atividades do Inmetro\nNotícias\nInmetro alerta para golpe com falsa notificação de fiscalização\n08/09/2026 15h19\nInmetro divulga resultado de seleção para bolsas\
    \ de iniciação científica e tecnológica\n31/08/2026 15h41\n MAIS NOTÍCIAS \nMETROLOGIA CIENTÍFICA\nRealizamos calibração, ensaios e material de referência, além de desenvolver tecnologia metrológica,\
    \ para prover confiança às medições brasileiras, com reconhecimento internacional.\nINOVAÇÃO\nInove com o Inmetro! Nossas competências e infraestrutura apoiam as organizações brasileiras no desenvolvimento\
    \ e transferência de tecnologia.\nBARREIRAS TÉCNICAS\nRepresentamos o Brasil no Acordo sobre Barreiras Técnicas e apoiamos as organizações brasileiras no acesso a mercados. Saiba como!\nEDUCAÇÃO\nPreparamos\
    \ profissionais especializados para atuarem nas áreas em que os conhecimentos da Infraestrutura da Qualidade sejam um diferencial.\nMETROLOGIA LEGAL\nAtuamos no controle de instrumentos de medição e\
    \ produtos pré-medidos, promovendo transações justas e garantindo a saúde e segurança do cidadão.\nACREDITAÇÃO E RECONHECIMENTO BPL\nAvaliamos a competência de organismos de avaliação da conformidade\
    \ e monitoramos os princípios das Boas Práticas de Laboratório (BPL) das instalações de teste, com reconhecimento internacional das atividades.\nREGULAMENTAÇÃO DE PRODUTOS E SERVIÇOS\nAtuamos na regulamentação\
    \ técnica e em programas de avaliação da conformidade, de forma que produtos e serviços atendam a requisitos essenciais.\nINMETRO NOS ESTADOS\nEscolha no mapa o seu estado e clique para conferir as\
    \ ações do Governo Federal.\nSelecione um dos tipos de manifestação abaixo:\nFalaBR\nSugestão\nElogio\nSimplifique\nAcesso à Informação\nDenúncia\nReclamação\nSolicitação\nAcesso rápido\nMarcas e selos\
    \ do Inmetro\nConsultas públicas\nPasta - Consultas públicas\nLegislação\nBiblioteca Online do Inmetro\nPublicações\nSistemas para buscas e solicitações\nProdutos e serviços registrados\nTabelas de\
    \ eficiência energética\nAs tabelas de eficiência energética apresentam todos os produtos aprovados no Programa Brasileiro de Etiquetagem (PBE) e autorizados a ostentar a Etiqueta Nacional de Conservação\
    \ de Energia (ENCE).\nInstituto Nacional de Metrologia, Qualidade e Tecnologia (INMETRO)"
- id: art-2
  title: A carta de serviços do Instituto Nacional de Metrologia, Qua
  text: "A carta de serviços do Instituto Nacional de Metrologia, Qualidade e Tecnologia (INMETRO) oferece informações sobre diversos serviços e processos, incluindo a aquisição de materiais de referência\
    \ certificados, verificação de cronotacógrafos, e acreditação de organismos de certificação. Além disso, é possível consultar processos administrativos, solicitar autorizações para importação e exportação,\
    \ e se inscrever em programas de pós-graduação nas áreas de Metrologia, Qualidade e Biotecnologia. A página também disponibiliza alertas sobre barreiras técnicas ao comércio e informações detalhadas\
    \ sobre os serviços prestados pelo INMETRO.\nPSIE - Portal de Serviços do Inmetro nos Estados\nCronotacógrafo\nAcidentes de Consumo\nCanais de Atendimento\nPerguntas Frequentes\nNesta seção, são divulgados\
    \ os questionamentos frequentemente recebidos pelo Inmetro.\nAcesso rápido\nMarcas e selos do Inmetro\nConsultas públicas\nLegislação\nBiblioteca Online do Inmetro\nPublicações\nSistemas para buscas\
    \ e solicitações\nProdutos e serviços registrados\nTabelas de eficiência energética\nInstituto Nacional de Metrologia, Qualidade e Tecnologia (INMETRO)\nPSIE - Portal de Serviços do Inmetro nos Estados\n\
    Cronotacógrafo\nAcidentes de Consumo\nCanais de Atendimento\nPerguntas Frequentes\nAções, projetos e programas\nInmetro na Palma da Mão\nPrograma Nacional de Capacitação em Infraestrutura da Qualidade\
    \ (Pronac-IQ)\nPronametro\nEcossistema de Inovação\nO Ecossistema de Inovação do Inmetro é um ambiente que promove pesquisa, parcerias com empresas e apoio a projetos de P&D.\nMuseu do Inmetro\nPrograma\
    \ Regional de Desenvolvimento da Infraestrutura da Qualidade (ProdIQ)\nEventos\nAções, projetos e programas\nInmetro na Palma da Mão\nPrograma Nacional de Capacitação em Infraestrutura da Qualidade\
    \ (Pronac-IQ)\nEcossistema de Inovação\nMuseu do Inmetro\nPrograma Regional de Desenvolvimento da Infraestrutura da Qualidade (ProdIQ)\nEventos\nAcesso à Informação\nInstitucional\nNesta seção, são\
    \ divulgadas informações institucionais e organizacionais do Inmetro, compreendendo suas funções, competências, estrutura organizacional, relação de autoridades (quem é quem), agenda de autoridades,\
    \ horários de atendimento e legislação do órgão.\nPlanejamento Estratégico\nContrato de gestão\nDefine as relações e responsabilidades entre o Ministério do Desenvolvimento, Indústria e Comércio Exterior\
    \ e o Inmetro, em especial, fixação de objetivos, metas e indicadores de desempenho, e medidas de organização administrativa que ampliem a autonomia de gestão do Inmetro, em função de sua qualificação\
    \ como agência executiva.\nPrestação de contas\nNesta página são publicados, anualmente, as demonstrações contábeis, o relatório de gestão, o parecer da unidade de Auditoria Interna sobre a prestação\
    \ de contas e, quando aplicáveis, o certificado de auditoria e o pronunciamento da autoridade supervisora. O formato da prestação de contas respeita a regulamentação vigente sobre o tema definida pelo\
    \ Tribunal de Contas da União – TCU.\nDados Abertos\nContratos\nLGPD\nLicitações e Contratos\nPasta - Licitações e contratos\nSanções administrativas\nNesta seção, são divulgadas todas as sanções administrativas\
    \ aplicadas pelo Inmetro a pessoas, empresas, organizações não governamentais e servidores públicos.\nAcesso à Informação\nInstitucional\nPlanejamento Estratégico\nContrato de gestão\nPrestação de contas\n\
