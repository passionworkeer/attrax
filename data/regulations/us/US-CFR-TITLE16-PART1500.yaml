- id: art-2
  title: § 1500.1
  text: '§ 1500.1

    Scope of subchapter.

    Set forth in this subchapter C are the regulations of the Consumer Product Safety Commission issued pursuant to and for the implementation of the Federal Hazardous Substances Act as amended (see § 1500.3(a)(1)).'
- id: art-3
  title: § 1500.2
  text: '§ 1500.2

    Authority.

    Authority under the Federal Hazardous Substances Act is vested in the Consumer Product Safety Commission by section 30(a) of the Consumer Product Safety Act (15 U.S.C. 2079(a)).'
- id: art-4
  title: § 1500.3
  text: '§ 1500.3

    Definitions.

    (a)

    Certain terms used in this part.

    As used in this part:

    (1)

    Act

    means the Federal Hazardous Substances Act (Pub. L. 86-613, 74 Stat. 372-81 (15 U.S.C. 1261-74)) as amended by:

    (i) The Child Protection Act of 1966 (Pub. L. 89-756, 80 Stat. 1303-05).

    (ii) The Child Protection and Toy Safety Act of 1969 (Pub. L. 91-113, 83 Stat. 187-90).

    (iii) The Poison Prevention Packaging Act of 1970 (Pub. L. 91-601, 84 Stat. 1670-74).

    (2)

    Commission

    means the Consumer Product Safety Commission established May 14, 1973, pursuant to provisions of the Consumer Product Safety Act (Pub. L. 92-573, 86 Stat. 1207-33 (15 U.S.C. 2051-81)).

    (b)

    Statutory definitions.

    Except for the definitions given in section 2 (c) and (d) of the act, which are obsolete, the definitions set forth in section 2 of the act are applicable to this part and are repeated for convenience
    as follows (some of these statutory definitions are interpreted, supplemented, or provided with alternatives in paragraph (c) of this section):

    (1)

    Territory

    means any territory or possession of the United States, including the District of Columbia and the Commonwealth of Puerto Rico but excluding the Canal Zone.

    (2)

    Interstate commerce

    means (i) commerce between any State or territory and any place outside thereof and (ii) commerce within the District of Columbia or within any territory not organized with a legislative body.

    (3)

    Person

    includes an individual, partnership, corporation, and association.

    (4)(i)

    Hazardous substance

    means:

    (A) Any substance or mixture of substances which is toxic, corrosive, an irritant, a strong sensitizer, flammable or combustible, or generates pressure through decomposition, heat, or other means, if
    such substance or mixture of substances may cause substantial personal injury or substantial illness during or as a proximate result of any customary or reasonably foreseeable handling or use, including
    reasonably foreseeable ingestion by children.

    (B) Any substance which the Commission by regulation finds, pursuant to the provisions of section 3(a) of the act, meet the requirements of section 2(f)(1)(A) of the act (restated in (A) above).

    (C) Any radioactive substance if, with respect to such substance as used in a particular class of article or as packaged, the Commission determines by regulation that the substance is sufficiently hazardous
    to require labeling in accordance with the act in order to protect the public health.

    (D) Any toy or other article intended for use by children which the Commission by regulation determines, in accordance with section 3(e) of the act, presents an electrical, mechanical, or thermal hazard.

    (ii)

    Hazardous substance

    shall not apply to pesticides subject to the Federal Insecticide, Fungicide, and Rodenticide Act, to foods, drugs, and cosmetics subject to the Federal Food, Drug, and Cosmetic Act, nor to substances
    intended for use as fuels when stored in containers and used in the heating, cooking, or refrigeration system of a house. “Hazardous substance” shall apply, however, to any article which is not itself
    a pesticide within the meaning of the Federal Insecticide, Fungicide, and Rodenticide Act but which is a hazardous substance within the meaning of section 2(f)(1) of the Federal Hazardous Substances
    Act (restated in paragraph (b)(4)(i) of this section) by reason of bearing or containing such a pesticide.

    (iii)

    Hazardous substance

    shall not include any source material, special nuclear material, or byproduct material as defined in the Atomic Energy Act of 1954, as amended, and regulations issued pursuant thereto by the Atomic
    Energy Commission.

    (5)

    Toxic

    shall apply to any substance (other than a radioactive substance) which has the capacity to produce personal injury or illness to man through ingestion, inhalation, or absorption through any body surface.

    (6)(i)

    Highly toxic

    means any substance which falls within any of the following categories:

    (A) Produces death within 14 days in half or more than half of a group of 10 or more laboratory white rats each weighing between 200 and 300 grams, at a single dose of 50 milligrams or less per kilogram
    of body weight, when orally administered; or

    (B) Produces death within 14 days in half or more than half of a group of 10 or more laboratory white rats each weighing between 200 and 300 grams, when inhaled continuously for a period of 1 hour or
    less at an atmospheric concentration of 200 parts per million by volume or less of gas or vapor or 2 milligrams per liter by volume or less of mist or dust, provided such concentration is likely to
    be encountered by man when the substance is used in any reasonably foreseeable manner; or

    (C) Produces death within 14 days in half or more than half of a group of 10 or more rabbits tested in a dosage of 200 milligrams or less per kilogram of body weight, when administered by continuous
    contact with the bare skin for 24 hours or less.

    (ii) If the Commission finds that available data on human experience with any substance indicate results different from those obtained on animals in the dosages and concentrations specified in paragraph
    (b)(6)(i) of this section, the human data shall take precedence.

    (7)

    Corrosive

    means any substance which in contact with living tissue will cause destruction of tissue by chemical action, but shall not refer to action on inanimate surfaces.

    (8)

    Irritant

    means any substance not corrosive within the meaning of section 2(i) of the act (restated in paragraph (b)(7) of this section) which on immediate, prolonged, or repeated contact with normal living tissue
    will induce a local inflammatory reaction.

    (9)

    Strong sensitizer

    means a substance which will cause on normal living tissue through an allergic or photodynamic process a hypersensitivity which becomes evident on reapplication of the same substance and which is designated
    as such by the Commission. Before designating any substance as a strong sensitizer, the Commission, upon consideration of the frequency of occurrence and severity of the reaction, shall find that the
    substance has a significant potential for causing hypersensitivity.

    (10) The terms

    extremely flammable, flammable,

    and

    combustible

    as they apply to any substances, liquid, solid, or the contents of any self-pressurized container, are defined by regulations issued by the Commission and published at § 1500.3(c)(6).

    (11)

    Radioactive substance

    means a substance which emits ionizing radiation.

    (12)

    Label

    means a display of written, printed, or graphic matter upon the immediate container of any substance or, in the cases of an article which is unpackaged or is not packaged in an immediate container intended
    or suitable for delivery to the ultimate consumer, a display of such matter directly upon the article involved or upon a tag or other suitable material affixed thereto. A requirement made by

    or under authority of the act that any word, statement, or other information appear on the label shall not be considered to be complied with unless such word, statement, or other information also appears
    (i) on the outside container or wrapper, if any there be, unless it is easily legible through the outside container or wrapper and (ii) on all accompanying literature where there are directions for
    use, written or otherwise.

    (13)

    Immediate container

    does not include package liners.

    (14)

    Misbranded hazardous substance

    means a hazardous substance (including a toy, or other article intended for use by children, which is a hazardous substance, or which bears or contains a hazardous substance in such manner as to be
    susceptible of access by a child to whom such toy or other article is entrusted) intended, or packaged in a form suitable, for use in the household or by children, if the packaging or labeling of such
    substance is in violation of an applicable regulation issued pursuant to section 3 or 4 of the Poison Prevention Packaging Act of 1970 or if such substance, except as otherwise provided by or pursuant
    to section 3 of the act (Federal Hazardous Substances Act), fails to bear a label:

    (i) Which states conspicuously:

    (A) The name and place of business of the manufacturer, packer, distributor, or seller;

    (B) The common or usual name or the chemical name (if there be no common or usual name) of the hazardous substance or of each component which contributes substantially to its hazard, unless the Commission
    by regulation permits or requires the use of a recognized generic name;

    (C) The signal word “DANGER” on substances which are extremely flammable, corrosive, or highly toxic;

    (D) The signal word “WARNING” or “CAUTION” on all other hazardous substances;

    (E) An affirmative statement of the principal hazard or hazards, such as “Flammable,” “Combustible,” “Vapor Harmful,” “Causes Burns,” “Absorbed Through Skin,” or similar wording descriptive of the hazard;

    (F) Precautionary measures describing the action to be followed or avoided, except when modified by regulation of the Commission pursuant to section 3 of the act;

    (G) Instruction, when necessary or appropriate, for first-aid treatment;

    (H) The word

    Poison

    for any hazardous substance which is defined as “highly toxic” by section 2(h) of the act (restated in paragraph (b)(6) of this section);

    (I) Instructions for handling and storage of packages which require special care in handling or storage; and

    (J) The statement (

    1

    ) “Keep out of the reach of children” or its practical equivalent, or, (

    2

    ) if the article is intended for use by children and is not a banned hazardous substance, adequate directions for the protection of children from the hazard; and

    (ii) On which any statements required under section 2(p)(1) of the act (restated in paragraph (b)(14)(i) of this section) are located prominently and are in the English language in conspicuous and legible
    type in contrast by typography, layout, or color with other printed matter on the label.

    Misbranded hazardous substance

    also means a household substance as defined in section 2(2)(D) of the Poison Prevention Packaging Act of 1970 if it is a substance described in section 2(f)(1) of the Federal Hazardous Substances Act
    (restated in paragraph (b)(4)(i)(A) of this section) and its packaging or labeling is in violation of an applicable regulation issued pursuant to section 3 or 4 of the Poison Prevention Packaging Act
    of 1970.

    (15)(i)

    Banned hazardous substance

    means:

    (A) Any toy, or other article intended for use by children, which is a hazardous substance, or which bears or contains a hazardous substance in such manner as to be susceptible of access by a child
    to whom such toy or other article is entrusted; or

    (B) Any hazardous substance intended, or packaged in a form suitable, for use in the household, which the Commission by regulation classifies as a “banned hazardous substance” on the basis of a finding
    that, notwithstanding such cautionary labeling as is or may be required under the act for that substance, the degree or nature of the hazard involved in the presence or

    use of such substance in households is such that the objective of the protection of the public health and safety can be adequately served only by keeping such substance, when so intended or packaged,
    out of the channels of interstate commerce;

    Provided,

    That the Commission by regulation (

    1

    ) shall exempt from section 2(q)(1)(A) of the act (restated in paragraph (b)(15)(i)(A) of this section) articles, such as chemistry sets, which by reason of their functional purpose require the inclusion
    of the hazardous substance involved, or necessarily present an electrical, mechanical, or thermal hazard, and which bear labeling giving adequate directions and warnings for safe use and are intended
    for use by children who have attained sufficient maturity, and may reasonably be expected, to read and heed such directions and warnings, and (

    2

    ) shall exempt from section 2(q)(1)(A) of the act (restated in paragraph (b)(15)(i)(A) of this section), and provide for the labeling of, common firewor'
- id: art-5
  title: § 1500.4
  text: '§ 1500.4

    Human experience with hazardous substances.

    (a) Reliable data on human experience with any substance should be taken into account in determining whether an article is a “hazardous substance” within the meaning of the act. When such data give
    reliable results different from results with animal data, the human experience takes precedence.

    (b) Experience may show that an article is more or less toxic, irritant, or corrosive to man than to test animals. It may show other factors that are important in determining the degree of hazard to
    humans represented by the substance. For example, experience shows that radiator antifreeze is likely to be stored in the household or garage and likely to be ingested in significant quantities by some
    persons. It also shows that a particular substance in liquid form is more likely to be ingested than the same substance in a paste or a solid and that an aerosol is more likely to get into the eyes
    and the nasal passages than a liquid.'
- id: art-6
  title: § 1500.5
  text: '§ 1500.5

    Hazardous mixtures.

    For a mixture of substances, the determination of whether the mixture is a “hazardous substance” as defined by section 2(f) of the act (repeated in § 1500.3(b)(4)) should be based on the physical, chemical,
    and pharmacological characteristics of the mixture. A mixture of substances may therefore be less hazardous or more hazardous than its components because of synergistic or antagonistic reactions. It
    may not be possible to reach a fully satisfactory decision concerning the toxic, irritant, corrosive, flammable, sensitizing, or pressure-generating properties of a substance from what is known about
    its components or ingredients. The mixture itself should be tested.'
- id: art-7
  title: § 1500.12
  text: '§ 1500.12

    Products declared to be hazardous substances under section 3(a) of the act.

    (a) The Commission finds that the following articles are hazardous substances within the meaning of the act because they are capable of causing substantial personal injury or substantial illness during
    or as a proximate result of any customary or reasonably foreseeable handling or use:

    (1) Charcoal briquettes and other forms of charcoal in containers for retail sale and intended for cooking or heating.

    (2) Metal-cored candlewicks that have a lead content of more than 0.06 percent of the total weight of the metal core, and candles made with such wicks.

    (b) [Reserved]

    [38 FR 27012, Sept. 27, 1973, as amended at 68 FR 19147, Apr. 18, 2003]'
- id: art-8
  title: § 1500.13
  text: '§ 1500.13

    Listing of “strong sensitizer” substances.

    On the basis of frequency of occurrence and severity of reaction information, the Commission finds that the following substances have a significant potential for causing hypersensitivity and therefore
    meet the definition for “strong sensitizer” in section 2(k) of the act (repeated in § 1500.3(b)(9)):

    (a) Paraphenylenediamine and products containing it.

    (b) Powdered orris root and products containing it.

    (c) Epoxy resins systems containing in any concentration ethylenediamine, diethylenetriamine, and diglycidyl ethers of molecular weight of less than 200.

    (d) Formaldehyde and products containing 1 percent or more of formaldehyde.

    (e) Oil of bergamot and products containing 2 percent or more of oil of bergamot.'
- id: art-9
  title: § 1500.14
  text: '§ 1500.14

    Products requiring special labeling under section 3(b) of the act.

    (a) Human experience, as reported in the scientific literature and to the Poison Control Centers and the National Clearing House for Poison Control Centers, and opinions of informed medical experts
    establish that the following substances are hazardous:

    (1) Diethylene glycol and mixtures containing 10 percent or more by weight of diethylene glycol.

    (2) Ethylene glycol and mixtures containing 10 percent or more by weight of ethylene glycol.

    (3) Products containing 5 percent or more by weight of benzene (also known as benzol) and products containing 10 percent or more by weight of toluene (also known as toluol), xylene (also known as xylol),
    or petroleum distillates such as kerosine, mineral seal oil, naphtha, gasoline, mineral spirits, stoddard solvent, and related petroleum distillates.

    (4) Methyl alcohol (methanol) and mixtures containing 4 percent or more by weight of methyl alcohol (methanol).

    (5) Turpentine (including gum turpentine, gum spirits of turpentine, steam-distilled wood turpentine, sulfate wood turpentine, and destructively distilled wood turpentine) and mixtures containing 10
    percent or more by weight of such turpentine.

    (b) The Commission finds that the following substances present special hazards and that, for these substances, the labeling required by section 2(p)(1) of the act is not adequate for the protection
    of the public health. Under section 3(b) of the act, the following specific label statements are deemed necessary to supplement the labeling required by section 2(p)(1) of the act:

    (1)

    Diethylene glycol.

    Because diethylene glycol and mixtures containing 10 percent or more by weight of diethylene glycol are commonly marketed, stored, and used in a manner increasing the possibility of accidental ingestion,
    such products shall be labeled with the signal word “warning” and the statement “Harmful if swallowed.”

    (2)

    Ethylene glycol.

    Because ethylene glycol and mixtures containing 10 percent or more by weight of ethylene glycol are commonly marketed, stored, and used in a manner increasing the possibility of accidental ingestion,
    such products shall be labeled with the signal word “warning” and the statement “Harmful or fatal if swallowed.”

    (3)

    Benzene, toluene, xylene, petroleum distillates.

    (i) Because inhalation of the vapors of products containing 5 percent or more by weight of benzene may cause blood dyscrasias, such products shall be labeled with the signal word “danger,” the statement
    of hazard “Vapor harmful,” the word “poison,” and the skull and crossbones symbol. If the product contains 10 percent or more by weight of benzene, it shall bear the additional statement of hazard “Harmful
    or fatal if swallowed” and the additional statement “Call physician immediately.”

    (ii) Because products containing 10 percent or more by weight of toluene, xylene, or any of the other substances listed in paragraph (a)(3) of this section may be aspirated into the lungs, with resulting
    chemical pneumonitis, pneumonia, and pulmonary edema, such products shall be labeled with the signal word “danger,” the statement or hazard “Harmful or fatal if swallowed,” and the statement “Call physician
    immediately.”

    (iii) Because inhalation of the vapor of products containing 10 percent or more by weight of toluene or xylene may cause systemic injury, such products shall bear the statement of hazard “Vapor harmful”
    in addition to the statements prescribed in paragraph (b)(3)(ii) of this section.

    (4)

    Methyl alcohol

    (

    methanol

    ). Because death and blindness can result from the ingestion of methyl alcohol, the label for this substance and for mixtures containing 4 percent or more by weight

    of this substance shall include the signal word “danger,” the additional word “poison,” and the skull and crossbones symbol. The statement of hazard shall include “Vapor harmful” and “May be fatal or
    cause blindness if swallowed.” The label shall also bear the statement “Cannot be made nonpoisonous.”

    (5)

    Turpentine.

    Because turpentine (including gum turpentine, gum spirits of turpentine, steam-distilled wood turpentine, sulfate wood turpentine, and destructively distilled wood turpentine) and products containing
    10 percent or more by weight of such turpentine, in addition to oral toxicity resulting in systemic poisoning, may be aspirated into the lungs with resulting chemical pneumonitis, pneumonia, and pulmonary
    edema, such products shall be labeled with the signal word “danger” and the statement of hazard “Harmful or fatal if swallowed.”

    (6)

    Charcoal.

    Charcoal briquettes and other forms of charcoal in containers for retail sale and intended for cooking or heating.

    (i)(A) Because inhalation of the carbon monoxide produced by burning charcoal indoors or in confined areas may cause serious injury or death, containers of such products packaged before November 3,
    1997, shall bear the following borderlined statement:

    WARNING: Do Not Use for Indoor Heating or Cooking Unless Ventilation Is Provided for Exhausting Fumes to Outside. Toxic Fumes May Accumulate and Cause Death

    (B) For bags of charcoal packaged before November 3, 1997, the statement specified in paragraph (b)(6)(i) of this section shall appear within a heavy borderline in a color sharply contrasting to that
    of the background, on both front and back panels in the upper 25 percent of the panels of the bag at least 2 inches below the seam, and at least 1 inch above any reading material or design elements
    in type size as follows: The signal word “WARNING” shall appear in capital letters at least three-eighths inch in height; the remaining text of the warning statement shall be printed in letters at least
    three-sixteenths inch in height.

    (ii)(A) Because inhalation of the carbon monoxide produced by burning charcoal indoors or in confined areas can cause serious injury or death, containers of such products packaged on or after November
    3, 1997, shall bear the following borderlined label.

    ER03MY96.051

    (B) Except as provided in paragraph (b)(6)(ii)(C) of this section, the following requirements apply to bags of charcoal subject to paragraph (b)(6)(ii)(A) of this section. The label specified in paragraph
    (b)(6)(ii)(A) of this section shall appear within a heavy borderline, in a color sharply contrasting to that of the background, on both the front and back panels in the upper 25 percent of the panels
    of the bag, and with the outer edge of the borderline at least 2.54 cm (1 inch) below the seam and at least 2.54 cm (1 inch) above any other reading material or design elements. The signal word “WARNING”
    shall be in bold capital letters in at least 7.14 mm (

    9/32

    inch)

    type. The remaining text of the warning statement shall be in at least 4.763 mm (

    3/16

    inch) type. The phrase “CARBON MONOXIDE HAZARD” shall be in bold. This phrase and the word “NEVER” shall be in all capital letters. The lettering shall have a strokewidth-to-height ratio of 1:6 to 1:8.
    The label shall be at least 50.8 mm (2 inches) high and 147.5 mm (5

    13/16

    inches) wide. The label''s lettering, spacing between the bottom of the letters of one line and the top of the letter of the next line, and pictogram shall have the size relation to each other and to
    the remainder of the label shown in paragraph (b)(6)(ii)(A) of this section.

    (C) For bags of charcoal subject to paragraph (b)(6)(ii)(A) of this section that are 6 inches or less wide, the minimum label height may be reduced to 38 mm (1.5 inches) and the minimum width may be
    reduced to 139.7 mm (5.5 inches). The signal word “WARNING” shall be in capital letters in at least 6.32 mm (0.249 inch) type. The remaining text of the warning shall be in at least 4.23 mm (0.166 inch)
    type. All other requirements of paragraphs 6(b)(ii) (A) and (B) of this section shall apply to these bags.

    (7)

    Fireworks devices.

    Because of the special hazards presented by fireworks devices if not used in a certain manner, the following listed fireworks devices shall be labeled as indicated:

    (i)

    Fountains.

    Warning (or Caution)

    FLAMMABLE (or EMITS SHOWERS OF SPARKS, if more descriptive).

    Use only under [close] adult supervision. (Use of the word close is optional.)

    For outdoor use only.

    Place on level surface.

    Light fuse and get away.

    (ii)

    California candles.

    Warning (or Caution) Emits Showers of Sparks

    Use only under [close] adult supervision. (Use of the word close is optional.)

    For outdoor use only.

    Hold in hand at bottom of tube.

    Point away from body so that neither end points toward body.

    (iii)

    Spike and handle cylindrical fountains.

    (A)

    Spike fountains.

    Warning (or Caution) Emits Showers of Sparks

    Use only under [close] adult supervision. (Use of the word close is optional.)

    For outdoor use only.

    Stick firmly in ground in an upright position.

    Do not hold in hand.

