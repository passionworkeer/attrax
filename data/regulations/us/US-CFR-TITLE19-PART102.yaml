- id: art-12
  title: 'Chapter 20 Note:'
  text: 'Chapter 20 Note:

    Notwithstanding the specific rules of this chapter, fruit, nut and vegetable preparations of Chapter 20 that have been prepared or preserved merely by freezing, by packing (including canning) in water,
    brine or natural juices, or by roasting, either dry or in oil (including processing incidental to freezing, packing, or roasting), shall be treated as a good of the country in which the fresh good was
    produced.

    2001-2007

