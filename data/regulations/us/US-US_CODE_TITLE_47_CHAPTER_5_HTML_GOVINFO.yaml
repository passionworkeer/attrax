  title: §152. Application of chapter
  text: '§152. Application of chapter


    (a) The provisions of this chapter shall apply to all interstate and foreign communication by wire or radio and all interstate and foreign transmission of energy by radio, which originates and/or is
    received within the United States, and to all persons engaged within the United States in such communication or such transmission of energy by radio, and to the licensing and regulating of all radio
    stations as hereinafter provided; but it shall not apply to persons engaged in wire or radio communication or transmission in the Canal Zone, or to wire or radio communication or transmission wholly
    within the Canal Zone. The provisions of this chapter shall apply with respect to cable service, to all persons engaged within the United States in providing such service, and to the facilities of cable
    operators which relate to such service, as provided in subchapter V–A.


    (b) Except as provided in sections 223 through 227 of this title, inclusive, section 276 of this title, and section 332 of this title, and subject to the provisions of section 301 of this title and
    subchapter V–A, nothing in this chapter shall be construed to apply or to give the Commission jurisdiction with respect to (1) charges, classifications, practices, services, facilities, or regulations
    for or in connection with intrastate communication service by wire or radio of any carrier, or (2) any carrier engaged in interstate or foreign communication solely through physical connection with
    the facilities of another carrier not directly or indirectly controlling or controlled by, or under direct or indirect common control with such carrier, or (3) any carrier engaged in interstate or foreign
    communication solely through connection by radio, or by wire and radio, with facilities, located in an adjoining State or in Canada or Mexico (where they adjoin the State in which the carrier is doing
    business), of another carrier not directly or indi

    rectly controlling or controlled by, or under direct or indirect common control with such carrier, or (4) any carrier to which clause (2) or clause (3) of this subsection would be applicable except
    for furnishing interstate mobile radio communication service or radio communication service to mobile stations on land vehicles in Canada or Mexico; except that sections 201 to 205 of this title shall,
    except as otherwise provided therein, apply to carriers described in clauses (2), (3), and (4) of this subsection.


    (June 19, 1934, ch. 652, title I, §2, 48 Stat. 1064; Proc. No. 2695, eff. July 4, 1946, 11 F.R. 7517, 60 Stat. 1352; Apr. 27, 1954, ch. 175, §1, 68 Stat. 63; Pub. L. 95–234, §5, Feb. 21, 1978, 92 Stat.
    35; Pub. L. 98–549, §3(a), Oct. 30, 1984, 98 Stat. 2801; Pub. L. 101–166, title V, §521(2), Nov. 21, 1989, 103 Stat. 1193; Pub. L. 101–336, title IV, §401(b)(1), July 26, 1990, 104 Stat. 369; Pub. L.
    102–243, §3(b), Dec. 20, 1991, 105 Stat. 2401; Pub. L. 103–66, title VI, §6002(b)(2)(B)(i), Aug. 10, 1993, 107 Stat. 396; Pub. L. 117–338, §2(c), Jan. 5, 2023, 136 Stat. 6156.)


    Editorial Notes


    References in Text


    This chapter, referred to in text, was in the original "this Act", meaning act June 19, 1934, ch. 652, 48 Stat. 1064, known as the Communications Act of 1934, which is classified principally to this
    chapter. For complete classification of this Act to the Code, see section 609 of this title and Tables.


    For definition of Canal Zone, referred to in subsec. (a), see section 3602(b) of Title 22, Foreign Relations and Intercourse.


    Codification


    Words "the Philippine Islands or" were omitted from this section on authority of Proc. No. 2695, issued pursuant to section 1394 of Title 22, Foreign Relations and Intercourse, which recognized the
    independence of the Philippine Islands as of July 4, 1946. Proc. No. 2695 is set out under section 1394 of Title 22.


