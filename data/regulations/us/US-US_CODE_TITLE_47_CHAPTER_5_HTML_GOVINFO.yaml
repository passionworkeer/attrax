- id: art-4
  title: §151. Purposes of chapter; Federal Communications Commission created
  text: '§151. Purposes of chapter; Federal Communications Commission created


    For the purpose of regulating interstate and foreign commerce in communication by wire and radio so as to make available, so far as possible, to all the people of the United States, without discrimination
    on the basis of race, color, religion, national origin, or sex, a rapid, efficient, Nation-wide, and world-wide wire and radio communication service with adequate facilities at reasonable charges, for
    the purpose of the national defense, for the purpose of promoting safety of life and property through the use of wire and radio communications, and for the purpose of securing a more effective execution
    of this policy by centralizing authority heretofore granted by law to several agencies and by granting additional authority with respect to interstate and foreign commerce in wire and radio communication,
    there is created a commission to be known as the "Federal Communications Commission", which shall be constituted as hereinafter provided, and which shall execute and enforce the provisions of this chapter.


    (June 19, 1934, ch. 652, title I, §1, 48 Stat. 1064; May 20, 1937, ch. 229, §1, 50 Stat. 189; Pub. L. 104–104, title I, §104, Feb. 8, 1996, 110 Stat. 86.)


    Editorial Notes


    References in Text


    This chapter, referred to in text, was in the original "this Act", meaning act June 19, 1934, ch. 652, 48 Stat. 1064, known as the Communications Act of 1934, which is classified principally to this
    chapter. For complete classification of this Act to the Code, see section 609 of this title and Tables.


    Amendments


    1996

    —Pub. L. 104–104 inserted ", without discrimination on the basis of race, color, religion, national origin, or sex," after "to all the people of the United States".


    1937

    —Act May 20, 1937, inserted "for the purpose of promoting safety of life and property through the use of wire and radio communication".


    Statutory Notes and Related Subsidiaries


    Extension of Internet Tax Freedom Act


    Pub. L. 114–113, div. E, title VI, §633, Dec. 18, 2015, 129 Stat. 2471, provided that: "Sections 1101(a) and 1104(a)(2)(A) of the Internet Tax Freedom Act (title XI of division C of Public Law 105–277;
    47 U.S.C. 151 note) shall be applied by substituting ''October 1, 2016'' for ''October 1, 2015''."


    Moratorium on Internet Taxes


    Pub. L. 105–277, div. C, title XI, Oct. 21, 1998, 112 Stat. 2681–719, as amended by Pub. L. 107–75, §2, Nov. 28, 2001, 115 Stat. 703; Pub. L. 108–435, §§2–6A, Dec. 3, 2004, 118 Stat. 2615–2618; Pub.
    L. 110–108, §§2–6, Oct. 31, 2007, 121 Stat. 1024–1026; Pub. L. 113–235, div. E, title VI, §624, Dec. 16, 2014, 128 Stat. 2377; Pub. L. 114–125, title IX, §922, Feb. 24, 2016, 130 Stat. 281, provided
    that:


    "SEC. 1100. SHORT TITLE.


    "This title may be cited as the ''Internet Tax Freedom Act''.


    "SEC. 1101. MORATORIUM.


    "(a)

    Moratorium

    .—No State or political subdivision thereof may impose any of the following taxes:


    "(1) Taxes on Internet access.


    "(2) Multiple or discriminatory taxes on electronic commerce.


    "(b)

    Preservation of State and Local Taxing Authority.—

    Except as provided in this section, nothing in this title shall be construed to modify, impair, or supersede, or authorize the modification, impairment, or superseding of, any State or local law pertaining
    to taxation that is otherwise permissible by or under the Constitution of the United States or other Federal law and in effect on the date of enactment of this Act [Oct. 21, 1998].


    "(c)

    Liabilities and Pending Cases.—

    Nothing in this title affects liability for taxes accrued and enforced before the date of enactment of this Act, nor does this title affect ongoing litigation relating to such taxes.


    "(d)

    Exception to Moratorium.—


    "(1)

    In general

    .—Subsection (a) shall also not apply in the case of any person or entity who knowingly and with knowledge of the character of the material, in interstate or foreign commerce by means of the World Wide
    Web, makes any communication for commercial purposes that is available to any minor and that includes any material that is harmful to minors unless such person or entity has restricted access by minors
    to material that is harmful to minors—


    "(A) by requiring use of a credit card, debit account, adult access code, or adult personal identification number;


    "(B) by accepting a digital certificate that verifies age; or


    "(C) by any other reasonable measures that are feasible under available technology.


    "(2)

    Scope of exception

    .—For purposes of paragraph (1), a person shall not be considered to [be] making a communication for commercial purposes of material to the extent that the person is—


    "(A) a telecommunications carrier engaged in the provision of a telecommunications service;


    "(B) a person engaged in the business of providing an Internet access service;


    "(C) a person engaged in the business of providing an Internet information location tool; or


    "(D) similarly engaged in the transmission, storage, retrieval, hosting, formatting, or translation (or any combination thereof) of a communication made by another person, without selection or alteration
    of the communication.


    "(3)

    Definitions

    .—In this subsection:


    "(A)

    By means of the world wide web

    .—The term ''by means of the World Wide Web'' means by placement of material in a computer server-based file archive so that it is publicly accessible, over the Internet, using hypertext transfer protocol,
    file transfer protocol, or other similar protocols.


    "(B)

    Commercial purposes; engaged in the business.—


    "(i)

    Commercial purposes

    .—A person shall be considered to make a communication for commercial purposes only if such person is engaged in the business of making such communications.


    "(ii)

    Engaged in the business

    .—The term ''engaged in the business'' means that the person who makes a communication, or offers to make a communication, by means of the World Wide Web, that includes any material that is harmful
    to minors, devotes time, attention, or labor to such activities, as a regular course of such person''s trade or business, with the objective of earning a profit as a result of such activities (although
    it is not necessary that the person make a profit or that the making or offering to make such communications be the person''s sole or principal business or source of income). A person may be considered
    to be engaged in the business of making, by means of the World Wide Web, communications for commercial purposes that include material that is harmful to minors, only if the person knowingly causes the
    material that is harmful to minors to be posted on the World Wide Web or knowingly solicits such material to be posted on the World Wide Web.


    "(C)

    Internet

    .—The term ''Internet'' means collectively the myriad of computer and telecommunications facilities, including equipment and operating software, which comprise the interconnected world-wide network
    of networks that employ the Transmission Control Protocol/Internet Protocol, or any predecessor or successor protocols to such protocol, to communicate information of all kinds by wire or radio.


    "(D)

    Internet access service

    .—The term ''Internet access service'' means a service that enables users to access content, information, electronic mail, or other services offered over the Internet and may also include access to
    proprietary content, information, and other services as part of a package of services offered to consumers. The term ''Internet access service'' does not include telecommunications services, except
    to the extent such services are purchased, used, or sold by a provider of Internet access to provide Internet access.


    "(E)

    Internet information location tool

    .—The term ''Internet information location tool'' means a service that refers or links users to an online location on the World Wide Web. Such term includes directories, indices, references, pointers,
    and hypertext links.


    "(F)

    Material that is harmful to minors

    .—The term ''material that is harmful to minors'' means any communication, picture, image, graphic image file, article, recording, writing, or other matter of any kind that is obscene or that—


    "(i) the average person, applying contemporary community standards, would find, taking the material as a whole and with respect to minors, is designed to appeal to, or is designed to pander to, the
    prurient interest;


    "(ii) depicts, describes, or represents, in a manner patently offensive with respect to minors, an actual or simulated sexual act or sexual contact, an actual or simulated normal or perverted sexual
    act, or a lewd exhibition of the genitals or post-pubescent female breast; and


    "(iii) taken as a whole, lacks serious literary, artistic, political, or scientific value for minors.


    "(G)

    Minor

    .—The term ''minor'' means any person under 17 years of age.


    "(H)

    Telecommunications carrier; telecommunications service

    .—The terms ''telecommunications carrier'' and ''telecommunications service'' have the meanings given such terms in section 3 of the Communications Act of 1934 (47 U.S.C. 153).


    "(e)

    Additional Exception to Moratorium.—


    "(1)

    In general

    .—Subsection (a) shall also not apply with respect to an Internet access provider, unless, at the time of entering into an agreement with a customer for the provision of Internet access services, such
    provider offers such customer (either for a fee or at no charge) screening software that is designed to permit the customer to limit access to material on the Internet that is harmful to minors.


    "(2)

    Definitions

    .—In this subsection:


    "(A)

    Internet access provider

    .—The term ''Internet access provider'' means a person engaged in the business of providing a computer and communications facility through which a customer may obtain access to the Internet, but does
    not include a common carrier to the extent that it provides only telecommunications services.


    "(B)

    Internet access services

    .—The term ''Internet access services'' means the provision of computer and communications services through which a customer using a computer and a modem or other communications device may obtain access
    to the Internet, but does not include telecommunications services provided by a common carrier.


    "(C)

    Screening software

    .—The term ''screening software'' means software that is designed to permit a person to limit access to material on the Internet that is harmful to minors.


    "(3)

    Applicability

    .—Paragraph (1) shall apply to agreements for the provision of Internet access services entered into on or after the date that is 6 months after the date of enactment of this Act [Oct. 21, 1998].


    "SEC. 1102. ADVISORY COMMISSION ON ELECTRONIC COMMERCE.


    "(a)

    Establishment of Commission.—

    There is established a commission to be known as the Advisory Commission on Electronic Commerce (in this title referred to as the ''Commission''). The Commission shall—


    "(1) be composed of 19 members appointed in accordance with subsection (b), including the chairperson who shall be selected by the members of the Commission from among themselves; and


    "(2) conduct its business in accordance with the provisions of this title.


    "(b)

    Membership.—


    "(1)

    In general.—

    The Commissioners shall serve for the life of the Commission. The membership of the Commission shall be as follows:


    "(A) 3 representatives from the Federal Government, comprised of the Secretary of Commerce, the Secretary of the Treasury, and the United States Trade Representative (or their respective delegates).


    "(B) 8 representatives from State and local governments (one such representative shall be from a State or local government that does not impose a sales tax and one representative shall be from a State
    that does not impose an income tax).


    "(C) 8 representatives of the electronic commerce industry (including small business), telecommunications carriers, local retail businesses, and consumer groups, comprised of—


    "(i) 5 individuals appointed by the Majority Leader of the Senate;


    "(ii) 3 individuals appointed by the Minority Leader of the Senate;


