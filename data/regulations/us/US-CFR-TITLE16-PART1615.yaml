  text: '§ 1615.31

    Labeling, recordkeeping, advertising, retail display and guaranties.

    (a)

    Definitions.

    For the purposes of this section, the following definitions apply:

    (1)

    Standard

    means the Standard for the Flammability of Children''s Sleepwear: Sizes 0 through 6X (FF 3-71) (subpart A of this part) promulgated by the Secretary of Commerce in the

    Federal Register

    of July 29, 1971 (36 FR 14062), and amended by him in the

    Federal Register

    of July 21, 1972 (37 FR 14624).

    (2)

    Children''s sleepwear

    means “children''s sleepwear” as defined in § 1615.1(a) of the Standard; that is, “any product of wearing apparel up to and including size 6X, such as nightgowns, pajamas, or similar or related items,
    such as robes, intended to be worn primarily for sleeping or activities related to sleeping. Diapers and underwear are excluded from this definition.”

    (3)

    Item

    means “item” as defined in § 1615.1(c) of the Standard; that is, “any product of children''s sleepwear, or any fabric or related material intended or promoted for use in children''s sleepwear.”

    (4)

    Marketing or handling

    or

    marketed or handled

    means any one or more of the transactions set forth in section 3 of the Flammable Fabrics Act (15 U.S.C. 1192).

    (5) The definitions of terms set forth in § 1615.1 of the Standard shall also apply to this section.

    (b)

    Labeling.

    (1) Where any agent or treatment is known to cause deterioration of flame resistance or otherwise enhances the flammability characteristics of an item, such item shall be prominently, permanently, conspicuously,
    and legibly labeled with precautionary care and treatment instructions to protect the item from such agent or treatment: Provided:

    (i) Where items required to be labeled in accordance with this paragraph are marketed at retail in packages, and the required label is not readily visible to the prospective purchaser, the packages
    must also be prominently, conspicuously, and legibly labeled with the required information, and

    (ii) Where items are required to be labeled in accordance with this paragraph, the precautionary care and treatment instructions may appear on the reverse side of the permanent label if

    (A) The precautionary care and treatment instructions are legible, prominent and conspicuous, and

    (B) The phrase “CARE INSTRUCTIONS ON REVERSE” or the equivalent appears permanently, prominently, conspicuously, and legibly on the side of the permanent label that is visible to the prospective purchaser
    when the item is marketed at retail, and

    (C) The item which is so labeled is marketed at retail in such a manner that the prospective purchaser is able to manipulate the label so the entire text of the precautionary care and treatment instructions
    is visible and legible; however, where the label cannot be manipulated so the instructions are visible to the prospective purchaser and legible, the packages must also be prominently, conspicuously
    and legibly labeled with the required precautionary care and treatment information or such information must appear prominently, conspicuously and legibly on a hang tag attached to the item.

    (2) If the item has been initially tested under § 1615.4(g)(4) of the Standard after one washing and drying, it shall be prominently, permanently, conspicuously, and legibly labeled with instructions
    to wash before wearing.

    (3) [Reserved]

    (4) Where any fabric or related material intended or promoted for use in children''s sleepwear is sold or intended for sale to the ultimate consumer for the purpose of conversion into children''s sleepwear,
    each bolt, roll, or other unit shall be labeled with the information required by this section. Each item of fabric or related material sold to an ultimate consumer must be accompanied by a label, as
    prescribed by this section, that can by normal household methods be permanently affixed by the ultimate consumer to any item of children''s sleepwear made from such fabric or related material.

    (5) Where items required to be labeled in accordance with paragraphs (b) (2), (3), and (4) of this section are marketed at retail in packages, and the required label is not readily visible to prospective
    purchasers, the packages must also be prominently, conspicuously, and legibly labeled with the required information.

    (6) Samples, swatches, or specimens used to promote or effect the sale of items subject to the Standard shall be labeled in accordance with this section with the information required by this section,
