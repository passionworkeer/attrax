  title: § 1615.5
  text: '§ 1615.5

    Labeling requirements.

    (a)

    Care labels.

    All items of children''s sleepwear shall be labeled with precautionary instructions to protect the items from agents or treatments which are known to cause deterioration of their flame resistance. If
    the item has been initially tested under § 1615.4(g)(4) after one washing and drying, it shall be labeled with instructions to wash before wearing. Such labels shall be permanent and otherwise in accordance
    with rules and regulations established by the Consumer Product Safety Commission.

    (b) [Reserved]

