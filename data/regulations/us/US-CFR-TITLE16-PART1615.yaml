    Weight of the original fabric, containing no seams or trim, is calculated from the weight of a specimen which has been conditioned for at least 8 h at 21±1.1 °C (70±2 °F) and 65±2 pct relative humidity.
    Shorter conditioning times may be used if the change in weight of a specimen in successive weighings made at intervals of not less than 2 h does not exceed 0.2 pct of the weight of the specimen.

    (7)

    Stopwatch.

    A stopwatch or similar timing device shall be used to measure time to 0.1 second.

    (8)

    Scale.

    A linear scale graduated in millimeters or 0.1 inch divisions shall be used to measure char length.

    (9)

    Circulating Air Oven.

    A forced circulation drying oven capable of maintaining the specimens at 105±2.8 °C. (221±5 °F.), shall be used to dry the specimen while mounted in the specimen holders.

    3

    3

    Option 1 of ASTM, D2654-67T, “Method of Test for Amount of Moisture in Textile Materials,” describes a satisfactory oven (1970 Book of ASTM Standards, part 24, published by the American Society for
    Testing and Materials, 1916 Race Street, Philadelphia, Pa. 19103).

    (10)

    Desiccator.

    An air-tight and moisture-tight desiccating chamber shall be used for cooling mounted specimens after drying. Anhydrous silica gel shall be used as the desiccant in the desicating chamber.

    (11)

    Hood.

    A hood or other suitable enclosure shall be used to provide a draft-free environment surrounding the test chamber. This enclosure shall have a fan or other suitable means for exhausting smoke and/or
    toxic gases produced by testing.

    (b)

    Specimens and sampling—General.

    (1) The test criteria of § 1615.3(b) shall be used in conjunction with the following fabric and garment sampling plan, or any other approved by the Consumer Product Safety Commission that provides at
    least the equivalent level of fire safety to the consumer. Alternate sampling plans submitted for approval shall have operating characteristics such that the probability of Unit acceptance at any percentage
    defective does not exceed the corresponding probability of Unit acceptance of the following sampling plan in the region of the latter''s operating characteristic curves that lies between 5 and 95 percent
    acceptance probability.

    (2) Different colors or different print patterns of the same fabric may be included in a single Fabric or Garment Production Unit, provided such colors or print patterns demonstrate char lengths that
    are not significantly different from each other as determined by previous testing of at least three samples from each color or print pattern to be included in the Unit.

    (3) Garments with different trim and findings may be included in a single Garment Production Unit providing the other garment characteristics are identical except for size, color, and print pattern.

    (4) For fabrics whose flammability characteristics are not dependent on chemical additives or chemical reactants to fiber, yarns, or fabrics, the laundering requirement of paragraph (g)(4) of this section
    is met on subsequent Fabric Production Units if results of testing an initial Fabric Production Unit demonstrate acceptability according to the requirements of paragraph (c) of this section, Normal
    Sampling, both before and after the appropriate laundering.

    (5) If the fabric has been shown to meet the laundering requirement, paragraph (g)(4) of this section, the garments produced from that fabric are not required to be laundered.

    (6) Each Sample (five specimens) for all Fabric Sampling shall be selected so that two specimens are in one fabric direction (machine or cross-machine) and three specimens are in the other fabric direction
    except for the additional Sample selected after a failure, in which case, all five specimens shall be selected in the same fabric direction in which the specimen failure occurred.

    (7) Fabric Samples may be selected from fabric as outlined in paragraph (c) of this section entitled Fabric Sampling, or, for verification purposes, from randomly selected garments.

    (8) Multilayer fabrics shall be tested with a hem of approximately 2.5 cm. (1 in.) sewn at the bottom edge of the specimen with a suitable thread and

    stitch. The specimen shall include each of the components over its entire length. Garments manufactured from multilayer fabrics shall be tested with the edge finish at the bottom edge of the specimen
    which is used in the garment.

    (c)

    Specimens and Sampling—Fabric Sampling.

    A Fabric Production Unit (Unit) is either accepted or rejected in accordance with the following plan:

    (1)

    Normal Sampling.

    Select one Sample from the beginning of the first Fabric Piece (Piece) in the Unit and one Sample from the end of the last Piece in the Unit, or select a sample from each end of the Piece if the Unit
    is made up of only one Piece. Test the two selected Samples. If both Samples meet all the Test Criteria of § 1615.3(b), accept the unit. If either or both of the Samples fail the 17.8 cm. (7.0 in.)
    average char length criterion, § 1615.3(b)(1), reject the Unit. If two or more of the individual specimens, from the 10 selected specimens fail, the 25.4 cm. (10 in.) char length, .3(b)(2), reject the
    Unit. If only one individual specimen, from the 10 selected specimens, fails the 25.4 cm. (10 in.) char length, § 1615.3(b)(2), select five additional specimens from the same end of the Piece in which
    the failure occurred, all five to be taken in the fabric direction in which the specimen failure occurred. If this additional Sample passes all the test criteria, accept the Unit. If this additional
    Sample fails any part of the test criteria, reject the Unit.

    (2)

    Reduced Sampling.

    (i) The level of sampling required for fabric acceptance may be reduced provided the preceding 15 Units of the fabric have all been accepted using the Normal Sampling plan.

    (ii) The Reduced Sampling plan shall be the same as for Normal Sampling except that the quantity of fabric in the Unit may be increased to 10,000 linear yards.

    (iii) Select and test two Samples in the same manner as in Normal Sampling. Accept or reject the Unit on the same basis as with Normal Sampling.

    (iv) Reduced Sampling shall be discontinued and Normal Sampling resumed if a Unit is rejected.

    (3)

    Tightened Sampling.

    The level of sampling required for acceptance shall be increased when a Unit is rejected under the Normal Sampling plan. The Tightened Sampling shall be the same as Normal Sampling except that one additional
    Sample shall be selected and cut from a middle Piece in the Unit. If the Unit is made up of less than two pieces, the Unit shall be divided into at least two Pieces. The division shall be such that
    the Pieces produced by the division shall not be smaller than 100 linear yards or greater than 2,500 linear yards. If the unit is made up of two Pieces, the additional Sample shall be selected from
    the interior end of one of the Pieces. Test the three selected Samples. If all three selected Samples meet all the test criteria of § 1615.3(b), accept the unit. If one or more of the three selected
    Samples fail the 17.8 cm. (7.0 in.) average char length criterion, § 1615.3(b)(1), reject the Unit. If two or more of the individual specimens from the 15 selected specimens fail the 25.4 cm. (10 in.)
    char length, § 1615.3(b)(2), reject the unit. If only one individual specimen, of the 15 selected Specimens fails the 25.4 cm. (10 in.) char length, § 1615.3(b)(2), select five additional specimens
    from the same end of the same piece in which the failure occurred, all five to be taken in the fabric direction in which the Specimen failure occurred. If this additional Sample passes all the test
    criteria, accept the Unit. If this additional Sample fails any part of the test criteria, reject the Unit. Tightened Sampling may be discontinued and Normal Sampling resumed after five consecutive Units
    have all been accepted using Tightened Sampling. If Tightened Sampling remains in effect for 15 consecutive units, production of the specific fabric in Tightened Sampling must be discontinued until
    that part of the process or component which is causing failure has been identified and the quality of the end product has been improved.

    (4)

    Disposition of rejected Units.

    (i) The Piece or Pieces which have failed and resulted in the initial rejection of the Unit may not be retested, used, or promoted for use in children''s sleepwear as defined in § 1615.1(a) except after
