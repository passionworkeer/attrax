  title: § 1615.1
  text: '§ 1615.1

    Definitions.

    In addition to the definitions given in section 2 of the Flammable Fabrics Act, as amended (15 U.S.C. 1191), the following definitions apply for purposes of this Standard:

    (a)

    Children''s Sleepwear

    means any product of wearing apparel up to and including size 6X, such as nightgowns, pajamas, or similar or related items, such as robes, intended to be worn primarily for sleeping or activities related
    to sleeping, except:

    (1) Diapers and underwear;

    (2) “Infant garments,” as defined by section 1615.1(c), below; and

    (3) “Tight-fitting garments,” as defined by section 1615.1(o), below.

    (b)

    Size 6X

    means the size defined as 6X in Department of Commerce Voluntary Product Standard, previously identified as Commercial Standard, CS 151-50 “Body Measurements for the Sizing of Apparel for Infants, Babies,
    Toddlers, and Children.”

    1

    1

    Copies available from the National Technical Information Service, 5285 Port Royal Street, Springfield, VA 22151, and should be ordered as CS 15150.

    (c)

    Infant garment

    means a garment which:

    (1) Is sized nine months or smaller;

    (2) If a one-piece garment, does not exceed 64.8 centimeters (25.75 inches) in length; if a two-piece garment, has no piece exceeding 40 centimeters (15.75 inches) in length;

    (3) Complies with all applicable requirements of the Standard for the Flammability of Clothing Textiles (16 CFR part 1610) and the Standard for the Flammability of Vinyl Plastic Film (16 CFR part 1611);
    and

    (4) Bears a label stating the size of the garment, expressed in terms of months of age. For example, “0 to 3 mos.” or “9 mos.” If the label is not visible to the consumer when the garment is offered
    for sale at retail, the same information must appear legibly on the package of the garment.

    (d)

    Item

    means any product of children''s sleepwear, or any fabric or related material intended or promoted for use in children''s sleepwear.

    (e)

    Trim

    means decorative materials, such as ribbons, laces, embroidery, or ornaments. This definition does not include (1) individual pieces less than 2 inches in their longest dimension, provided that such
    pieces do not constitute or cover in aggregate a total of more than 20 square inches of the item, or (2) functional materials (findings), such as zippers, buttons, or elastic bands, used in the construction
    of garments.

    (f)

    Test Criteria

    means the maximum char length which a sample or specimen may exhibit in order to pass an individual test.

    (g)

    Char Length

    means the distance from the original lower edge of the specimen exposed to the flame in accordance with the procedure specified in § 1615.4

    Test procedure

    to the end of the tear or void in the charred, burned, or damaged area, the tear being made in accordance with the procedure specified in § 1615.4(g)(2).

    (h) [Reserved]

    (i)

    Afterglow

    means the continuation of glowing of parts of a specimen after flaming has ceased.

    (j)

    Fabric Piece

    (Piece) means a continuous, unseamed length of fabric, one or more of which make up a unit.

    (k)

    Fabric Production Unit

    (Unit) means any quantity of finished fabric up to 5,000 linear yards for normal sampling or 10,000 linear yards for reduced sampling which has a specific identity that remains unchanged throughout
    the Unit except for color or print pattern as specified in § 1615.4(b). For purposes of this definition, finished fabric means fabric in its final form after completing its last processing steps as
    a fabric except for slitting.

    (l)

    Garment Production Unit

    (Unit) means any quantity of finished garments up to 500 dozen which have a

    specific identity that remains unchanged throughout the Unit except for size, trim, findings, color, and print patterns as specified in § 1615.4(b).

    (m)

    Sample

    means five test specimens.

    (n)

    Specimen

    means an 8.9 × 25.4 cm. (3.5 × 10 in.) section of fabric. For garment testing the specimen will include a seam or trim.

