- id: art-3
  title: § 1615.2
  text: '§ 1615.2

    Scope and application.

    (a) This Standard provides a test method to determine the flammability of items as defined in § 1615.1(d).

    (b) All items as defined in § 1615.1(d) are subject to requirements of this standard.

    (c) The flammability standards for clothing textiles and vinyl plastic film, parts 1610 and 1611 of this chapter, are superseded by this part insofar as they apply to items defined in § 1615.1(d).

    [40 FR 59903, Dec. 30, 1975, as amended at 64 FR 34533, June 28, 1999]'
- id: art-4
  title: § 1615.3
  text: '§ 1615.3

    General requirements.

    (a)

    Summary of test method.

    Five conditioned specimens, 8.9 × 25.4 cm. (3.5 × 10 in.), are suspended one at a time vertically in holders in a prescribed cabinet and subjected to a standard flame along their bottom edge for a specified
    time under controlled conditions. The char length is measured.

    (b)

    Test criteria.

    The test criteria when the testing is done in accordance with § 1615.4

    Test procedure

    are:

    (1)

    Average char length.

    The average char length of five specimens shall not exceed 17.8 cm. (7.0 in.).

    (2)

    Full specimen burn.

    No individual specimen shall have a char length of 25.4 cm. (10 in.).

    [40 FR 59903, Dec. 30, 1975, as amended at 43 FR 4853, Feb. 6, 1978]'
- id: art-5
  title: § 1615.4
  text: '§ 1615.4

    Test procedure.

    (a)

    Apparatus

    —(1)

    Test chamber.

    The test chamber shall be a steel cabinet with inside dimensions of 32.9 cm. (12

    15/16

    in.) wide, 32.9 cm. (12

    15/16

    in.) deep, and 76.2 cm. (30 in.) high. It shall have a frame which permits the suspension of the specimen holder over the center of the base of the cabinet at such a height that the bottom of the specimen
    holder is 1.7 cm. (

    3/4

    in.) above the highest point of the barrel of the gas burner specified in paragraph (c) of this section and perpendicular to the front of the cabinet. The front of the cabinet shall be a close fitting
    door with a glass insert to permit observation of the entire test. The cabinet floor may be covered with a piece of asbestos paper, whose length and width are approximately 2.5 cm. (1 in.) less than
    the cabinet floor dimensions. The cabinet to be used in this test method is illustrated in Figure 1 and detailed in Engineering Drawings, Nos. 1 to 7.

    (2)

    Specimen holder.

    The specimen holder is designed to permit suspension of the specimen in a fixed vertical position and to prevent curling of the specimen when the flame is applied. It shall consist of two U-shaped 0.20
    cm. (14 ga. USS) thick steel plates, 42.2 cm. (16

    5/8

    in.) long, and 8.9 cm. (3.5 in.) wide, with

    aligning pins. The openings in the plates shall be 35.6 cm. (14 in.) long and 5.1 cm. (2 in.) wide. The specimen shall be fixed between the plates, which shall be held together with side clamps. The
    holder to be used in this test method is illustrated in Figure 2 and detailed in Engineering Drawing No. 7.

    (3)

    Burner.

    The burner shall be substantially the same as that illustrated in Figure 1 and detailed in Engineering Drawing No. 6. It shall have a tube of 1.1 cm. (0.43 in.) inside diameter. The input line to the
    burner shall be equipped with a needle valve. It shall have a variable orifice to adjust the height of the flame. The barrel of the burner shall be at an angle of 25° from the vertical. The burner shall
    be equipped with an adjustable stop collar so that it may be positioned quickly under the test specimen. The burner shall be connected to the gas source by rubber or other flexible tubing.

    (4)

    Gas supply system.

    There shall be a pressure regulator to furnish gas to the burner under a pressure of 129±13mm. Hg (2

    1/2

    ±

    1/4

    lbs. per sq. in.) at the burner inlet.

    (5)

    Gas.

    The gas shall be at least 97 percent pure methane.

    (6)

    Hooks and weights.

    Metal hooks and weights shall be used to produce a series of loads for char length determinations. Suitable metal hooks consist of No. 19 gauge steel wire, or equivalent, made from 7.6 cm. (3 in.) lengths
    of the wire, bent 1.3 cm. (0.5 in.) from one end to a 45° angle hook. The longer end of the wire is fastened around the neck of the weight to be used and the other in the lower end of each burned specimen
    to one side of the burned area. The requisite loads are given in table 1.

