    (3) Has sleeves which do not exceed the maximum dimension for the upper arm at any point between the upper arm and the wrist, and which diminish in width gradually from the top of the shoulder (point
    G in Diagram 1) to the wrist;

    (4) Has legs which do not exceed the maximum dimension for the thigh at any point between the thigh and the ankle, and which diminish in width gradually from the thigh to the ankle;

    (5) In the case of a one-piece garment, has a width which does not exceed the maximum dimension for the chest at any point between the chest and the waist and which diminishes gradually from the chest
    to the waist; and has a width which does not exceed the maximum dimension for the seat at any point between the seat and the waist and which diminishes gradually from the seat to the waist;

    (6) In the case of a two-piece garment has an upper piece with a width which does not exceed the maximum dimension for the chest at any point between the chest and the bottom of that piece and which
    diminishes gradually from the chest to the bottom of that piece; in the case of an upper piece with fastenings, has the lowest fastening within 15 centimeters (6 inches) of the bottom of that piece;

    (7) In the case of a two-piece garment, has a lower piece with a width which does not exceed the maximum dimension for the seat at any point between the seat and the top of the lower piece and which
    diminishes gradually from the seat to the top of that piece;

    (8) Complies with all applicable requirements of the Standard for the Flammability of Clothing Textiles (16 CFR part 1610) and the Standard for the

    Flammability of Vinyl Plastic Film (16 CFR part 1611); and

    (9) Bears a label stating the size of the garment in terms of age in months, or by child''s size; for example: “Size 9 to 12 mos.” or “Size 2.” If the label is not visible to the consumer when the garment
    is offered for sale at retail, the same information must appear legibly on the package of the garment.

