    overall dimensions of the tray and the width of the flanges are not critical and should be chosen so that the tray essentially fills the open space in the sliding platform. Tray must be adequate to
    contain a specimen at least 100 cm long and 25 cm wide. It is important to note that the zero reference point on the dummy specimen coincides with the pilot burner flame impingement point (see Figure
    5).

    (5) The pilot burner used to ignite the specimen shall be a propane venturi torch with an axially sysmmetric burner tip having a propane supply tube with an orifice diameter of 0.0076±0.0013 cm (0.003±0.0005
    in). In operation, the propane flow is adjusted to give a pencil flame blue inner cone length of 1.3 cm (

