    stud bolts at each end.

    (4) The specimen tray (see Figure 7) shall be constructed from 14 gauge heat-resistant stainless steel (AISI Type 300 (UNA-N08330)) or equivalent, thickness 0.198 cm (0.078 in). The depth of the tray
    is 5.0±0.2 cm (2±

    5/64

