    1/32

    in) from the top. A temperature indicating device with a

    range of 100-500 °C (212-932 °F) may be used to determine the chamber temperatures prior to a test.

    (7) An exhaust duct with a capacity of 28.3-85 NTP m

    3

    per minute (1000-3000 standard cubic feet per minute) decoupled from the chamber stack by at least 7.6 cm (3 in) on all sides and with an effective area of the canopy slightly larger than the plane
    area of the chamber with the specimen platform in the out position shall be used to remove combustion products from the chamber. With the panel turned on and dummy specimen in place, there shall be
    no measurable difference in air flow through the chamber stack with the exhaust on or off.

