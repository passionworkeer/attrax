  title: § 1209.6
  text: '§ 1209.6

    Test procedures for critical radiant flux.

    This section provides the test procedure for determining the critical radiant flux of exposed attic floor insulation using a radiant heat energy source.

    (a)

    Apparatus and description of test procedure.

    Test chamber (Figures 3 and 4 paragraph (b) of this section). An air-gas fueled radiant heat energy panel or equivalent panel inclined at 30° above and directed at a horizontally-mounted attic floor
    insulation specimen. The radiant panel generates a radiant energy flux distribution ranging along the approximately 100-cm length of the test specimen from a nominal maximum of 1.0 W/cm.

    2

    to a minimum of 0.1 W/cm

    2

    . The test is initiated by open flame ignition from a pilot burner. The distance burned to flame-out is converted to W/cm

    2

    from the flux profile graph (Figure 8) and reported as critical radiant flux, W/cm

    2

    . Section 1209.8 provides a procedure for calibrating the radiation pyrometer used to standardize the thermal output of the panel.

    (b)

    Construction and instrumentation of the radiant panel test chamber.

    The radiant panel test chamber shall be constructed and instrumented as follows:

    (1) The radiant panel test chamber employed for this test shall be located in a draft protected area maintained at 21±3 °C (69.8±9 °F) and relative humidity of 50±20%. The radiant panel test chamber,
    (Figures 3 and 4) shall consist of an enclosure 140 cm (55 in) long by 50 cm (19

    1/2

    in) deep by 71 cm (28 in) above the test specimen. The sides, ends, and top shall be of 1.3 cm nominal (

    1/2

    in) calcium silicate board, such as Marinite I, 0.74 g/cm

    3

    (46 lb/ft

    3

    ) nominal density, with a thermal conductivity at 177 °C (350 °F) of 1.11 cal (g)/hr cm

    2

    °C/cm [0.89 Btu/(hr) (ft

    2

    ) (°F/in)]. One side shall be provided with an approximately 10 cm × 110 cm (4 × 44 inches) draft tight fire resistant glass window so that the entire length of the test specimen may be observed from
    ourside the fire test chamber. On the same side and below the observation window is a door which, when open, allows the specimen platform to be moved out for mounting or removal of test specimens. A
    draft tight, fire resistant observation window may be installed at the low flux end of the chamber.

    (2) The bottom of the test chamber shall consist of a sliding steel platform

    which has provisions for rigidly securing the test specimen holder in a fixed and level position. The free, or air access, area around the platform shall be in the range of 1935-3225 cm

    2

    (300-500 square in). The top of the chamber shall have an exhaust stack with interior dimensions of 10.2 cm (4 in) wide by 38 cm (15 in) deep by 31.8 cm (12.5 in) high at the opposite end of the chamber
    from the radiant energy source. The radiant heat energy source shall be a panel of porous refractory material mounted in a cast iron frame, with a radiation surface of 30.5 × 45.7 cm nominal (12 by
    18 in). The panel fuel system shall consist of a venturi-type aspirator or equivalent system for mixing gas and air at approximately atmospheric pressure, a clean dry air supply capable of providing
    28.3 NTP (Normal Temperature and Pressure m

    3

    per hr (1000 standard cubic feet per hour) at 7.6 cm (3.0 in) of water, and suitable instrumentation for monitoring and controlling the flow of fuel to the panel.

    (3) The radiant heat energy panel shall be mounted in the chamber 30±0.5° to the horizontal specimen plane. The horizontal distance from the 0 mark on the specimen fixture to the bottom edge (projected)
    of the radiating surface of the panel is 8.9 cm±0.1 (3

    1/2

    ±

    1/32

    in). The panel to specimen vertical distance is 14.0 cm±0.1 (5

    1/2

    ±

    1/32

    in) (see Figure 5). The angle and dimensions given above are critical in order to obtain the required radiant flux. The radiation pyrometer for standardizing the thermal output of the panel shall be
    suitable for viewing a circular area 25.0 cm (10 in) in diameter at a range of about 1.37 m (54 in). It shall be calibrated over the black body temperature range of 490-510 °C (914-950 °F) in accordance
    with the procedure described in § 1209.8. A high impedance voltmeter with a suitable millivolt range shall be used to monitor the output of the radiation pyrometer described. The dummy holder (see Figure
    6), shall be constructed from 14 gauge heat-resistant stainless steel (AISI Type 300 (UNA-N08330)) or equivalent thickness 0.198 cm (0.078 in), having overall dimension of 114 cm (45 in) by 32 cm (12

    3/4

