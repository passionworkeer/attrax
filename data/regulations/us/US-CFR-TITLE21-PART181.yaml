    Subpart A—General Provisions'
- id: art-2
  title: § 181.1
  text: '§ 181.1

    General.

    (a) An ingredient whose use in food or food packaging is subject to a prior sanction or approval within the meaning of section 201(s)(4) of the Act is exempt from classification as a food additive.
    The Commissioner will publish in this part all known prior sanctions. Any interested person may submit to the Commissioner a request for publication of a prior sanction, supported by evidence to show
    that it falls within section 201(s)(4) of the Act.

    (b) Based upon scientific data or information that shows that use of a prior-sanctioned food ingredient may be injurious to health, and thus in violation of section 402 of the Act, the Commissioner
    will establish or amend an applicable prior sanction regulation to impose whatever limitations or conditions are necessary for the safe use of the ingredient, or to prohibit use of the ingredient.

    (c) Where appropriate, an emergency action level may be issued for a prior-sanctioned substance, pending the issuance of a final regulation in accordance with paragraph (b) of this section. Such an
    action level shall be issued pursuant to section 402(a) of the Act to identify, based upon available data, conditions of use of the substance that may be injurious to health. Such an action level shall
    be issued in a notice published in the

    Federal Register

    and shall be followed as soon as practicable by a proposed regulation in accordance with paragraph (b) of this section. Where the available data demonstrate that the substance may be injurious at any
    level, use of the substance may be prohibited. The identification of a prohibited substance may be made in part 189 of this chapter when appropriate.

    [42 FR 14638, Mar. 15, 1977, as amended at 42 FR 52821, Sept. 30, 1977; 54 FR 39635, Sept. 27, 1989]'
- id: art-3
  title: § 181.5
  text: '§ 181.5

    Prior sanctions.

    (a) A prior sanction shall exist only for a specific use(s) of a substance in

    food, i.e., the level(s), condition(s), product(s), etc., for which there was explicit approval by the Food and Drug Administration or the United States Department of Agriculture prior to September
    6, 1958.

    (b) The existence of a prior sanction exempts the sanctioned use(s) from the food additive provisions of the Act but not from the other adulteration or the misbranding provisions of the Act.

    (c) All known prior sanctions shall be the subject of a regulation published in this part. Any such regulation is subject to amendment to impose whatever limitation(s) or condition(s) may be necessary
    for the safe use of the ingredient, or revocation to prohibit use of the ingredient, in order to prevent the adulteration of food in violation of section 402 of the Act.

    (d) In proposing, after a general evaluation of use of an ingredient, regulations affirming the GRAS status of substances added directly to human food in part 184 of this chapter or substances in food-contact
    surfaces in part 186 of this chapter, or establishing a food additive regulation for substances added directly to human food in parts 172 and 173 of this chapter or food additives in food-contact surfaces
    in parts 174, 175, 176, 177, 178 and § 179.45 of this chapter, the Commissioner shall, if he is aware of any prior sanction for use of the ingredient under conditions different from those proposed in
    the regulation, concurrently propose a separate regulation covering such use of the ingredient under this part. If the Commissioner is unaware of any such applicable prior sanction, the proposed regulation
    will so state and will require any person who intends to assert or rely on such sanction to submit proof of its existence. Any food additive or GRAS regulation promulgated after a general evaluation
    of use of an ingredient constitutes a determination that excluded uses would result in adulteration of the food in violation of section 402 of the Act, and the failure of any person to come forward
    with proof of such an applicable prior sanction in response to a proposal will constitute a waiver of the right to assert or rely on such sanction at any later time. The notice will also constitute
    a proposal to establish a regulation under this part, incorporating the same provisions, in the event that such a regulation is determined to be appropriate as a result of submission of proof of such
    an applicable prior sanction in response to the proposal.

    Subpart B—Specific Prior-Sanctioned Food Ingredients'
- id: art-4
  title: § 181.22
  text: '§ 181.22

    Certain substances employed in the manufacture of food-packaging materials.

    Prior to the enactment of the food additives amendment to the Federal Food, Drug, and Cosmetic Act, sanctions were granted for the usage of the substances listed in §§ 181.23, 181.24, 181.25, 181.26,
    181.27, 181.28, 181.29, and 181.30 in the manufacture of packaging materials. So used, these substances are not considered “food additives” within the meaning of section 201(s) of the Act, provided
    that they are of good commercial grade, are suitable for association with food, and are used in accordance with good manufacturing practice. For the purpose of this subpart, good manufacturing practice
    for food-packaging materials includes the restriction that the quantity of any of these substances which becomes a component of food as a result of use in food-packaging materials shall not be intended
    to accomplish any physical or technical effect in the food itself, shall be reduced to the least amount reasonably possible, and shall not exceed any limit specified in this subpart.

    [42 FR 56728, Oct. 28, 1977]'
- id: art-5
  title: § 181.23
  text: '§ 181.23

    Antimycotics.

    Substances classified as antimycotics, when migrating from food-packaging material shall include:

    Calcium propionate.

    Methylparaben (methyl

    p

    -hydroxybenzoate).

    Propylparaben (propyl

    p

    -hydroxybenzoate).

    Sodium benzoate.

    Sodium propionate.

    Sorbic acid.

    [42 FR 14638, Mar. 15, 1977; 42 FR 56728, Oct. 28, 1977]'
- id: art-6
  title: § 181.24
  text: '§ 181.24

    Antioxidants.

    Substances classified as antioxidants, when migrating from food-packaging

    material (limit of addition to food, 0.005 percent) shall include:

    Butylated hydroxyanisole.

    Butylated hydroxytoluene.

    Dilauryl thiodipropionate.

    Distearyl thiodipropionate.

    Gum guaiac.

    Nordihydroguairetic acid.

    Propyl gallate.

    Thiodipropionic acid.

    2,4,5-Trihydroxy butyrophenone.

    [42 FR 14638, Mar. 15, 1977; 42 FR 56728, Oct. 28, 1977]'
- id: art-7
  title: § 181.25
  text: '§ 181.25

    Driers.

    Substances classified as driers, when migrating from food-packaging material shall include:

    Cobalt caprylate.

    Cobalt linoleate.

    Cobalt naphthenate.

    Cobalt tallate.

    Iron caprylate.

    Iron linoleate.

    Iron naphthenate.

    Iron tallate.

    Manganese caprylate.

    Manganese linoleate.

    Manganese naphthenate.

    Manganese tallate.

    [42 FR 14638, Mar. 15, 1977; 42 FR 56728, Oct. 28, 1977]'
- id: art-8
  title: § 181.26
  text: '§ 181.26

    Drying oils as components of finished resins.

    Substances classified as drying oils, when migrating from food-packaging material (as components of finished resins) shall include:

    Chinawood oil (tung oil).

    Dehydrated castor oil.

    Linseed oil.

    Tall oil.

    [42 FR 14638, Mar. 15, 1977; 42 FR 56728, Oct. 28, 1977]'
- id: art-9
  title: § 181.27
  text: '§ 181.27

    Plasticizers.

