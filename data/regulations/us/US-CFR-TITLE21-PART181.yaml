    Magnesium phosphate.

    Magnesium hydrogen phosphate.

    Mono-, di-, and trisodium citrate.

    Mono-, di-, and tripotassium citrate.

    Potassium oleate.

    Potassium stearate.

    Sodium pyrophosphate.

