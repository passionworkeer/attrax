    Note 1:

    The most stringent packing group assigned to a hazard of the material takes precedence over other packing groups; for example, a material meeting Class 3 PG II and Division 6.1 PG I (oral toxicity)
    is classified as Class 3 PG I.

    Note 2:

    A material which meets the definition of Class 8 and has an inhalation toxicity by dusts and mists which meets criteria for Packing Group I specified in § 173.133(a)(1) must be classed as Division 6.1
    if the oral or dermal toxicity meets criteria for Packing Group I or II. If the oral or dermal toxicity meets criteria for Packing Group III or less, the material must be classed as Class 8.

    (c) The following materials are not subject to the provisions of paragraph (a) of this section because of their unique properties:

    (1) A Class 1 (explosive) material that meets any other hazard class or division as defined in this part shall be assigned a division in Class 1. Class 1 materials shall be classed and approved in accordance
    with § 173.56 of this part;

    (2) A Division 5.2 (organic peroxide) material that meets the definition of any other hazard class or division as defined in this part, shall be classed as Division 5.2;

    (3) A Division 6.2 (infectious substance) material that also meets the definition of another hazard class or division, other than Class 7, or that also is a limited quantity Class 7 material, shall
    be classed as Division 6.2;

    (4) A material that meets the definition of a wetted explosive in § 173.124(a)(1) of this subchapter (Division 4.1). Wetted explosives are either specifically listed in the § 172.101 table or are approved
    by the Associate Administrator (see § 173.124(a)(1) of this subchapter); and

    (5) A limited quantity of a Class 7 (radioactive) material that meets the definition for more than one hazard class or division shall be classed in accordance with § 173.423.

