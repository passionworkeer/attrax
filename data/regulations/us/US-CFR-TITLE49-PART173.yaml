  text: '§ 173.3

    Packaging and exceptions.

    (a) The packaging of hazardous materials for transportation by air, highway, rail, or water must be as specified in this part. Methods of manufacture, packing, and storage of hazardous materials, that
    affect safety in transportation, must be open to inspection by a

    duly authorized representative of the initial carrier or of the Department. Methods of manufacture and related functions necessary for completion of a DOT specification or U.N. standard packaging must
    be open to inspection by a representative of the Department.

    (b) The regulations setting forth packaging requirements for a specific material apply to all modes of transportation unless otherwise stated, or unless exceptions from packaging requirements are authorized.

    (c)

    Salvage drums.

    Packages of hazardous materials that are damaged, defective, or leaking; packages found to be not conforming to the requirements of this subchapter after having been placed in transportation; and, hazardous
    materials that have spilled or leaked may be placed in a metal or plastic removable head salvage drum that is compatible with the lading and shipped for repackaging or disposal under the following conditions:

    (1) Except as provided in paragraph (c)(7) of this section, the drum must be a UN 1A2, 1B2, 1N2 or 1H2 tested and marked for Packing Group III or higher performance standards for liquids or solids and
    a leakproofness test of 20 kPa (3 psig). Alternatively, a drum manufactured and marked prior to October 1, 1993 as a salvage drum, in accordance with the provisions of this section in effect on September
    30, 1991, is authorized. Capacity of the drum may not exceed 450 L (119 gallons).

    (2) Each drum shall be provided when necessary with sufficient cushioning and absorption material to prevent excessive shifting of the damaged package and to eliminate the presence of any free liquid
    at the time the salvage drum is closed. All cushioning and absorbent material used in the drum must be compatible with the hazardous material.

    (3) Each salvage packaging must be marked with the proper shipping name of the hazardous material inside the packaging and the name and address of the consignee. In addition, the packaging must be marked
    “SALVAGE”. The lettering of the marking must be at least 12 mm (0.5 inches) high.

    (i)

    Transitional exception.

    A marking in conformance with the requirements of this paragraph in effect on December 31, 2014, may continue to be used until December 31, 2016.

    (ii) For domestic transportation, a packaging marked prior to January 1, 2017 and in conformance with the requirements of this paragraph in effect on December 31, 2014, may continue in service until
    the end of its useful life.

    (4) Each drum shall be labeled as prescribed for the respective material.

    (5) The shipper shall prepare shipping papers in accordance with subpart C of part 172 of this subchapter.

    (6) The overpack requirements of § 173.25 do not apply to drums used in accordance with this paragraph.

    (7) A salvage packaging marked “T” in accordance with applicable provisions in the UN Recommendations may be used.

    (d)

    Salvage cylinders.

    Cylinders of hazardous materials that are damaged or leaking may be overpacked in a non-DOT specification full opening hinged head or fully removable head steel salvage cylinder under the following
    conditions:

    (1) Except for Class 1, Division 6.2, Class 7, or acetylene material, a cylinder containing a hazardous material may be overpacked in a salvage cylinder.

    (2) Each salvage cylinder—

    (i) Must be designed, constructed and marked in accordance with Section VIII, Division I of the ASME Code (IBR,

