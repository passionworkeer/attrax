    cylinder to prevent excessive shifting. The overpack requirements of § 173.25 do not apply to salvage cylinders used in accordance with this section.

    (ii) Must have a maximum water capacity of 450 L (119 gallons).

    (iii) Except for liquefied nitrous oxide and carbon dioxide, contents of the damaged or leaking cylinder must be limited in pressure and volume so that if totally discharged into the salvage cylinder,
    the pressure in the salvage cylinder will not exceed

    5/4

    of the MAWP at 55 °C (131 °F).

    (iv) Must have gaskets, valves and fittings that are compatible with the hazardous materials contained within.

    (3) Each salvage cylinder must be plainly and durably marked. Unless otherwise specified, the markings below must be in the same area on any portion of the upper end:

    (i) The proper shipping name of the hazardous material contained inside the packaging;

    (ii) The name and address of the consignee or consignor;

    (iii) The name and address or registered symbol of the manufacturer; and

    (iv) The word “SALVAGE” in letters at least 12 mm (0.5 inches) high on opposite sides near the middle of the cylinder; stamping on the sidewall is not authorized.

    (A)

    Transitional exception.

    A marking in conformance with the requirements of this paragraph in effect on December 31, 2014, may continue to be used until December 31, 2016.

    (B) For domestic transportation, a packaging marked prior to January 1, 2017 and in conformance with the requirements of this paragraph in effect on December 31, 2014, may continue in service until
    the end of its useful life.

    (4) Each salvage cylinder must be labeled for the hazardous material contained inside the packaging.

    (5) The shipper must prepare shipping papers in accordance with subpart C of part 172 of this subchapter.

    (6) Transportation is authorized by motor vehicle and cargo vessel only.

    (7) Each salvage cylinder must be cleaned and purged after each use.

    (8) In addition to the training requirements of §§ 172.700 through 172.704 of this subchapter, a person who loads, unloads or transports a salvage cylinder must be trained in handling, loading and unloading
    the salvage cylinder.

    (9) Cylinder Requalification: At least once every five years, each cylinder must be visually inspected (internally and externally) in accordance with CGA Pamphlet C-6 (IBR,

