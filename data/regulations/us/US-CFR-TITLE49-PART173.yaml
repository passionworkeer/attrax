    times MAWP must be maintained for at least 30 seconds. The cylinder must be examined under test pressure and removed from service if a leak or a defect is found.

    (i) The retest and inspection must be performed by a person familiar with salvage cylinders and trained and experienced in the use of the inspection and testing equipment.

    (ii) Each salvage cylinder that is successfully requalified must be durably and legibly marked with the word “Tested” followed by the requalification date (month/year),

    e.g.

    , “Tested 9/04.” The marking must be in letters and numbers at least 12 mm (0.5 inches) high. The requalification marking may be placed on any portion of the upper end of the cylinder near the marking
    required in (d)(3) of this section or on a metal plate permanently secured to the cylinder. Stamping on the cylinder sidewall is not authorized.

    (10) Record retention: The owner of each salvage cylinder or his authorized agent shall retain a record of the most recent visual inspection and pressure test until the salvage cylinder is requalified.
    The records must be made available to a DOT representative upon request.

    (e)

    Emergency transportation of DOT 3A480 or 3AA480 cylinders and DOT 106A500 multi-unit tank car tanks.

