    Antioxidants and/or stabilizers for polymers.

    The substances listed in paragraph (b) of this section may be safely used as antioxidants and/or stabilizers in polymers used in the manufacture of articles or components of articles intended for use
    in producing, manufacturing, packing, processing, preparing, treating, packaging, transporting, or holding food, subject to the provisions of this section:

    (a) The quantity used shall not exceed the amount reasonably required to accomplish the intended technical effect.

