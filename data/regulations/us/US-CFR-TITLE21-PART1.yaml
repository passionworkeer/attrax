- id: art-8
  title: Section 403(e) of the act (in this part 1, the term
  text: 'Section 403(e) of the act (in this part 1, the term

    act

    means the Federal Food, Drug, and Cosmetic Act) provides for the establishment by regulation of reasonable variations and exemptions for small packages from the required declaration of net quantity
    of contents. Section 403(i) of the act provides for the establishment by regulation of exemptions from the required declaration of ingredients where such declaration is impracticable, or results in
    deception or unfair competition. Section 502(b) of the act provides for the establishment by regulation of reasonable variations and exemptions for small packages from the required declaration of net
    quantity of contents. Section 602(b) of the act provides for the establishment by regulation of reasonable variations and exemptions for small packages from the required declaration of net quantity
    of contents. Section 5(b) of the Fair Packaging and Labeling Act provides for the establishment by regulation of exemptions from certain required declarations of net quantity of contents, identity of
    commodity, identity and location of manufacturer, packer, or distributor, and from declaration of net quantity of servings represented, based on a finding that full compliance with such required declarations
    is impracticable or not necessary for the adequate protection of consumers, and a further finding that the nature, form, or quantity of the packaged consumer commodity or other good and sufficient reasons
    justify such exemptions. The Commissioner, on his own initiative or on petition of an interested person, may propose a variation or exemption based upon any of the foregoing statutory provisions, including
    proposed findings if section 5(b) of the Fair Packaging and Labeling Act applies, pursuant to parts 10, 12, 13, 14, 15, 16, and 19 of this chapter.'
- id: art-9
  title: § 1.24
  text: '§ 1.24

    Exemptions from required label statements.

    The following exemptions are granted from label statements required by this part:

    (a)

    Foods.

    (1) While held for sale, a food shall be exempt from the required declaration of net quantity of contents specified in this part if said food is received in bulk containers at a retail establishment
    and is accurately weighed, measured, or counted either within the view of the purchaser or in compliance with the purchaser''s order.

    (2) Random food packages, as defined in § 101.7(j) of this chapter, bearing labels declaring net weight, price per pound or per specified number of pounds, and total price shall be exempt from the type
    size, dual declaration, and placement requirements of § 101.7 of this chapter if the accurate statement of net weight is presented conspicuously on the principal display panel of the package. In the
    case of food packed in random packages at one place for subsequent shipment and sale at another, the price sections of the label may be left blank provided they are filled in by the seller prior to
    retail sale. This exemption shall also apply to uniform weight packages of cheese and cheese products labeled in the same manner and by the same type of equipment as random food packages exempted by
    this paragraph (a)(2) except that the labels shall bear a declaration of price per pound and not price per specified number of pounds.

    (3) Individual serving-size packages of foods containing less than

    1/2

    ounce or less than

    1/2

    fluid ounce for use in restaurants, institutions, and passenger carriers, and not intended for sale at retail, shall be exempt from the required declaration of net quantity of contents specified in
    this part.

    (4) Individually wrapped pieces of

    penny candy

    and other confectionery of less than one-half ounce net weight per individual piece shall be exempt from the labeling requirements of this part when the container in which such confectionery is shipped
    is in conformance with the labeling requirements of this part. Similarly, when such confectionery items are sold in bags or boxes, such items shall be exempt from the labeling requirements of this part,
    including the required declaration of net quantity of contents specified in this part when the declaration on the bag or box meets the requirements of this part.

    (5)(i) Soft drinks packaged in bottles shall be exempt from the placement requirements for the statement of identity prescribed by § 101.3 (a) and (d) of this chapter if such statement appears conspicuously
    on the bottle closure. When such soft drinks are marketed in a multiunit retail package, the multiunit retail package shall be exempt from the statement of identity declaration requirements prescribed
    by § 101.3 of this chapter if the statement of identity on the unit container is not obscured by the multiunit retail package.

    (ii) A multiunit retail package for soft drinks shall be exempt from the declaration regarding name and place of business required by § 101.5 of this chapter if the package does not obscure the declaration
    on unit containers or if it bears a statement that the declaration can be found on the unit containers and the declaration on the unit containers complies with § 101.5 of this chapter. The declaration
    required by § 101.5 of this chapter may appear on the top or side of the closure of bottled soft drinks if the statement is conspicuous and easily legible.

    (iii) Soft drinks packaged in bottles which display other required label information only on the closure shall be exempt from the placement requirements for the declaration of contents prescribed by
    § 101.7(f) of this chapter if the required content declaration is blown, formed, or molded into the surface of the bottle in close proximity to the closure.

    (iv) Where a trademark on a soft drink package also serves as, or is, a statement of identity, the use of such trademark on the package in lines not parallel to the base on which the package rests shall
    be exempted from the requirement of § 101.3(d) of this chapter that the statement be in lines parallel to the base so long as there is also at least one statement of identity in lines generally parallel
    to the base.

    (v) A multiunit retail package for soft drinks in cans shall be exempt from the declaration regarding name and place of business required by § 101.5 of this chapter if the package does not obscure the
    declaration on unit containers or if it bears a statement that the declaration can be found on the unit containers and the declaration on

    the unit containers complies with § 101.5 of this chapter. The declaration required by § 101.5 of this chapter may appear on the top of soft drinks in cans if the statement is conspicuous and easily
    legible, provided that when the declaration is embossed, it shall appear in type size at least one-eighth inch in height, or if it is printed, the type size shall not be less than one-sixteenth inch
    in height. The declaration may follow the curvature of the lid of the can and shall not be removed or obscured by the tab which opens the can.

    (6)(i) Ice cream, french ice cream, ice milk, fruit sherbets, water ices, quiescently frozen confections (with or without dairy ingredients), special dietary frozen desserts, and products made in semblance
    of the foregoing, when measured by and packaged in

    1/2

    -liquid pint and

    1/2

    -gallon measure-containers, as defined in the “Measure Container Code of National Bureau of Standards Handbook 44,” Specifications, Tolerances, and Other Technical Requirements for Weighing and Measuring
    Devices, Sec. 4.45 “Measure-Containers,” which is incorporated by reference, are exempt from the requirements of § 101.7(b)(2) of this chapter to the extent that net contents of 8-fluid ounces and 64-fluid
    ounces (or 2 quarts) may be expressed as

    1/2

    pint and

    1/2

    gallon, respectively. Copies are available from the Center for Food Safety and Applied Nutrition (HFS-150), Food and Drug Administration, 5001 Campus Dr., College Park, MD 20740, or at the National
    Archives and Records Administration (NARA). For information on the availability of this material at NARA, call 202-741-6030, or go to:

    http://www.archives.gov/federal_register/code_of_federal_regulations/ibr_locations.html.

    (ii) The foods named in paragraph (a)(6)(i) of this section, when measured by and packaged in 1-liquid pint, 1-liquid quart, and

