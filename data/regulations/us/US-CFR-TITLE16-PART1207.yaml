    (3)

    Bracing of handrails.

    If handrail braces are used, they shall withstand intended use and reasonably foreseeable abuse.

    (4)

    Attachment and strength of handrails.

    Handrails and their fasteners shall withstand allowable shear, bending, and cyclical loading in intended use and reasonably foreseeable abuse. All fasteners for handrail connections shall be vibrationproof,
    selflocking, and tamperproof. Threaded fasteners shall be capable of withstanding a 1-foot-pound (1,356-newton meter) back-off torque.

    (i)

    Sockets performance test.

    If handrail sockets are used, the handrail end shall be permanently fixed in the socket so that it cannot be pulled out or bent at the socket by a moment of 233 foot-pounds (316 newton-meters) applied
    clockwise around point A in figure E. The socket shall not permanently deform under the maximum applied loads.

    EC03OC91.022

    (ii)

    Side forces.

    If the handrail is in a socket or attached to the side of the slide runway rail, the attachment methods must be capable of withstanding all shear and bending forces induced by a 172-foot-pound (233-newton-meter)
    moment counterclockwise around point A in figure F.

    EC03OC91.023

    (iii)

    Performance tests

    —(A)

    Strength for climbing and falls.

    (

    1

    ) Attach a pull loop to point C of the upper handrail (figure E). Point C is the point where a perpendicular to the axis of the handrail passes through point A, the socket, or other attachment point.
    Attach a stranded steel cable or wire rope to point C. All cables and ropes shall have at least a 1,000-pound (4,448-newton) tensile capacity. Attach a 162-pound (73.5-kg) weight to this cable at least
    4 feet (1.22 meters) below point C. Observe any permanent deformation or bending on the hand-rail at point A. If none exists, the handrail passes this performance test.

    (

    2

    ) Lift the weight one foot (30.48 cm) from its maximum static position and drop it. Observe any permanent deformation of the handrail or its attachments at point A. If each handrail will still support
    the 162-pound (73.5-kg) weight for a period of 15 minutes and has not been bent more than 45° from its original direction, it passes this performance test.

    (B)

    Transition handrail strength.

    Rotate the assembled slide into the horizontal position on its side on a loading dock or other platform. Move the slide into such a position that the entire

    handrail assembly overhangs the platform and level the slide. Fasten the slide firmly in this position and attach a 115-pound (52.2-kg) weight to point D, as shown in figure F, and check for any visible
    permanent deformation of the handrail at point A. If none exists, the handrails pass this performance test.

    (e)

    Lubrication.

    Swimming pool slides shall either be equipped with a method of lubrication (for example, water) or have a similar coefficient of friction so that the slider has a smooth, continuous slide. If water
    is used, the nozzles, piping, or hoses that deliver water to the runway shall be recessed or designed in such a fashion as not to interfere with a slider''s progress down the slide or create tripping
    hazards on the slide.

    (f)

    Runways

    —(1)

    Curvature.

    Slide runway curvature between the front and rear support legs of the slide shall be consistent with maintaining the slider safely on the slide during intended use and reasonably foreseeable abuse.

    (2)

    Dynamic equilibrium.

    (i) Swimming pool slide runways, whether straight or curved, shall be designed as “balanced curves.” On a balanced curve, the test fixture discussed in paragraph (f)(2)(ii) of this section shall stay
    on a trajectory that keeps it within a distance of ±41 percent of the runway width to the runway centerline at all points along the runway without contacting the runway rails.

    (ii)

    Performance test

    —(A)

    Direct measurement.

    Build a wooden pallet no larger than 5 by 5 inches (12.7 × 12.7 cm), as shown in figure G. Securely attach a lead rod or bar on the pallet. Size the bar so that the weight-to-area ratio of the assembly
    is 1.30±0.05 lbs./sq. in. (8,960±340 newtons/sq. meter) and the pallet does not tip over when in motion. Attach a felt pen or other suitable marking device to the pallet assembly as shown in figure
    G to mark the slide during descent.

    (B)

    Test.

    Lubricate the slide in accordance with the manufacturer''s instructions. Center the pallet at the top of the slide runway and release. Observe the pallet''s descent and note if it touches the slide''s
    side rails. If it touches, check alignment and installation again. With water off and the slide dry, center the pallet at the top of the runway and release. Measure the distance from the felt pen marked
    line to the centerline of the runway. If within ±41 percent of the width measured from the centerline along'
- id: art-7
  title: § 1207.9
  text: '§ 1207.9

    Product certification.

    (a) Certification shall be in accordance with section 14(a)(1) of the Consumer Product Safety Act (15 U.S.C. 2063(a)(1)).

    (b) A certificate shall accompany the swimming pool slide (in the form of a permanent label on the shipping container(s) or in the form of a separate certificate) to all distributors and retailers to
    whom the material is delivered certifying that the slide conforms to this part 1207. The certificate or permanent label issued under this section shall be based upon either a test of each product or
    a reasonable testing program, shall state the name of the manufacturer or private labeler issuing the certificate, and shall include the date and place of manufacture.

    (c) Any certificate shall be based upon the test procedures and requirements specified in this part 1207.'
- id: art-8
  title: § 1207.10
  text: '§ 1207.10

    Handling, storage, and marking.

    (a)

    Marking.

    The manufacturer''s or private labeler''s identification shall appear on the slide and shipping container. Such identification shall include the identity and address of the manufacturer or private labeler.
    If a private labeler''s name is used, the marking shall include a code mark that will permit an identification of the manufacturer.

    (b)

    Shipping, handling, and storage.

    The slide shall be designed, constructed, or packaged so that reasonably foreseeable shipping, handling, and storage will not cause defects in the slide that will prevent the slide from complying with
    the requirements of this part 1207.'
