  text: '§ 134.31

    Requirements of other agencies.

    Nothing in this subpart shall be construed as excepting any article (or its container) from the particular requirements of marking provided for in any other provision of any law, such as those of the
    Federal Trade Commission, Food and Drug Administration, and other agencies.'
