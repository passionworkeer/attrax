- id: art-2
  title: § 1511.1
  text: '§ 1511.1

    Scope of part 1511.

    This part 1511 sets forth the requirements whereby pacifiers (as defined in § 1511.2(a)) are not banned articles under § 1500.18(a)(8) of this chapter.'
- id: art-3
  title: § 1511.2
  text: '§ 1511.2

    Definitions.

    (a) A

    pacifier

    is an article consisting of a nipple that is intended for a young child to suck upon, but is not designed to facilitate a baby''s obtaining fluid, and usually includes a guard or shield and a handle
    or ring.

    (b)

    Guard or shield

    means the structure located at the base of the nipple used to prevent the pacifier from being completely drawn into the child''s mouth.

    (c)

    Handle or ring

    means the structure usually located adjacent to the guard or shield used for holding or grasping the pacifier. A hinged handle or ring is one that is free to pivot about an axis parallel to the plane
    of the guard or shield.'
- id: art-4
  title: § 1511.3
  text: '§ 1511.3

    Guard or shield requirements.

    (a)

    Performance requirements.

    Place the pacifier in the opening of the fixture illustrated in Figure 1(a) of this part so that the nipple of the pacifier is centered in the opening and protrudes through the back of the fixture as
    shown in Figure 1(b). For pacifiers with

    non-circular guards or shields, align the major axis of the guard or shield with the major axis of the opening in the fixture. Apply a tensile force to the pacifier nipple in the direction shown. The
    force shall be applied gradually attaining but not exceeding 2.0 pounds (8.9 newtons) within a period of 5 seconds and maintained at 2.0 pounds for an additional 10 seconds. Any pacifier which can be
    completely drawn through an opening with dimensions no greater than those of Figure 1(a) by such a force shall fail the test in this part.

    (b)

    Ventilation holes.

    The pacifier guard or shield shall contain at least two holes symmetrically located and each being at least 0.20 inches (5 millimeters) in minor dimension. The edge of any hole shall be no closer than
    0.20 inches (5 millimeters) to the perimeter of the pacifier guard or shield.'
- id: art-5
  title: § 1511.4
  text: '§ 1511.4

    Protrusions.

    (a)

    Protrusions limitation.

    No protrusion from the face of the guard or shield opposite from the nipple shall exceed 0.63 inches (16mm) when measured in accordance with the procedure specified in paragraph (b) of this section.

    (b)

    Protrusion test.

    Secure the pacifier by clamping the nipple with its axis horizontal. For pacifiers with hinged handles or rings the orientation of the hinge axis shall be horizontal. A plane surface shall be applied
    to any protrusion from the guard or shield with a force gradually attaining but not exceeding 2.0 pounds (8.9 newtons) applied in a direction along the axis of the nipple. The normal of the plane surface
    shall be maintained parallel to the axis of the nipple. Any protrusion shall be allowed to flex or rotate about its hinge as the plane surfact is applied to it. Measure the distance from the plane surface
    to the guard or shield at the base of the nipple.'
- id: art-6
  title: § 1511.5
  text: '§ 1511.5

    Structural integrity tests.

    (a)

    Nipple.

    Hold the pacifier by the shield or guard, grasp the nipple end of the pacifier and gradually apply a tensile force to the pacifier nipple in any possible direction. The force shall be applied gradually,
    attaining but not exceeding 10.0 pounds (44.5 newtons) within a period of 5 seconds and maintained at 10.0 pounds for an additional 10 seconds.

    (b)

    Handle or ring.

    Hold the pacifier by the shield or guard or base of the nipple, and push or pull on the handle or ring in any possible direction. The force shall be applied gradually attaining but not exceeding 10.0
    pounds (44.5 newtons) within a period of 5 seconds and maintained at 10.0 pounds for an additional 10 seconds.

    (c)

    Heat cycle deterioration.

    After the testing prescribed in paragraphs (a) and (b) of this section, all pacifiers shall be subject to the following: submerge the pacifier in boiling water for 5 minutes and then remove the pacifier
    and allow it to cool for 5 minutes in room temperature air, 60° to 80 °F. (16° to 27 °C). After the cooling period, resubmerge the pacifier in the boiling water for 5 minutes. The process shall be repeated
    for a total of 6 boiling/cooling cycles. After the sixth cycle, the pacifier shall again be subjected to the structural tests in paragraphs (a) and (b) of this section and section 1511.3.

    (d)

    Small parts.

    Any components or fragments which are released as a result of the tests specified in paragraphs (a), (b) and (c) of this section shall be placed in the truncated cylinder shown in Figure 2, such that
    the component or fragment is in the lowest position in the cylinder. If the uppermost edge of the component or fragment is below the plane of the top of the cylinder, the pacifier shall fail the test
    in this section.'
- id: art-7
  title: § 1511.6
  text: '§ 1511.6

    Ribbons, strings, cords, or other attachments.

    A pacifier shall not be sold or distributed with any ribbon, string, cord, chain, twine, leather, yarn or similar attachments.'
- id: art-8
  title: § 1511.7
  text: '§ 1511.7

    Labeling.

    (a) As required by paragraphs (b) and (c) of this section, pacifiers shall be labeled with the statement: “Warning—Do Not Tie Pacifier Around Child''s Neck as it Presents a Strangulation Danger.”

    (b) The labeling statement required by paragraph (a) of this section shall appear legibly and conspicuously on

    any retail display carton containing two or more pacifiers.

    (c) Each individually packaged pacifier shall bear the labeling statement required in paragraph (a) of this section on the package legibly and conspicuously.'
- id: art-9
  title: § 1511.8
  text: '§ 1511.8

