- id: art-2
  title: § 1633.1
  text: '§ 1633.1

    Purpose, scope and applicability.

    (a)

    Purpose.

    This part 1633 establishes flammability requirements that all mattress sets must meet before sale or introduction into commerce. The purpose of the standard is to reduce deaths and injuries associated
    with mattress fires by limiting the size of the fire generated by a mattress set during a thirty minute test.

    (b)

    Scope.

    (1) All mattress sets, as defined in § 1633.2(c), manufactured, imported, or renovated on or after the effective date of this standard are subject to the requirements of the standard.

    (2) One-of-a-kind mattress sets may be exempted from testing under this standard in accordance with § 1633.13(c).

    (c)

    Applicability.

    The requirements of this part 1633 shall apply to each “manufacturer” (as that term is defined in § 1633.2(k)) of mattress sets which are manufactured for sale in commerce.'
- id: art-3
  title: § 1633.2
  text: '§ 1633.2

    Definitions.

    In addition to the definitions given in section 2 of the Flammable Fabrics Act as amended (15 U.S.C. 1191), the following definitions apply for purposes of this part 1633.

    (a)

    Mattress

    means a resilient material or combination of materials enclosed by a ticking (used alone or in combination with other products) intended or promoted for sleeping upon. This includes mattresses that
    have undergone renovation as defined in paragraph (d) of this section.

    (1) This term includes, but is not limited to, adult mattresses, youth mattresses, crib mattresses (including portable crib mattresses), bunk bed mattresses, futons, flip chairs without a permanent
    back or arms, sleeper chairs, and water beds or air mattresses if they contain upholstery material between the ticking and the mattress core. Mattresses used in or as part of upholstered furniture are
    also included; examples are convertible sofa bed mattresses, corner group mattresses, day bed mattresses, roll-away bed mattresses, high risers, and trundle bed mattresses. See § 1633.9 Glossary of
    terms, for definitions of these items.

    (2) This term excludes mattress pads, mattress toppers (items with resilient filling, with or without ticking, intended to be used with or on top of a mattress), sleeping bags, pillows, liquid and gaseous
    filled tickings, such as water beds and air mattresses that contain no upholstery material between the ticking and the mattress core, upholstered furniture which does not contain a mattress, and juvenile
    product pads such as car bed pads, carriage pads, basket pads, infant carrier and lounge pads, dressing table pads, stroller pads, crib bumpers, and playpen pads. See § 1633.9 Glossary of terms, for
    definitions of these items.

    (b)

    Foundation

    means a ticking covered structure used to support a mattress or sleep surface. The structure may include constructed frames, foam, box springs, or other materials, used alone or in combination.

    (c)

    Mattress set

    means either a mattress and foundation labeled by the manufacturer for sale as a set, or a mattress labeled by the manufacturer for sale without any foundation.

    (d)

    Renovation

    means altering an existing mattress set for the purpose of resale.

    (1) This term includes any one, or any combination of the following: replacing the ticking or batting, stripping a mattress to its springs, rebuilding a mattress, or replacing components with new or
    recycled materials.

    (2) This term excludes alterations if the person who renovates the mattress intends to retain the renovated mattress for his or her own use, or if a customer or a renovator merely hires the services
    of the renovator and intends to take back the renovated mattress for his or her own use.

    (e)

    Ticking

    means the outermost layer of fabric or related material of a mattress or foundation. It does not include any other layers of fabric or related materials quilted together with, or otherwise attached
    to, the outermost layer of fabric or related material.

    (f)

    Upholstery material

    means all material, either loose or attached, between the mattress ticking and the core of a mattress.

    (g)

    Edge

    means the seamed, un-seamed or taped border edge of a mattress or foundation that joins the top and/or bottom with the side panels.

    (h)

    Tape edge

    means an edge made by using binding tape to encase and finish raw edges.

    (i)

    Binding tape

    means a fabric strip used in the construction of some edges.

    (j)

    Seam thread

    means the thread used to form stitches in construction features, seams, and tape edges.

    (k)

    Manufacturer

    means an individual plant or factory at which mattress sets are manufactured or assembled. For purposes of this part 1633, importers and renovators are considered manufacturers.

    (l)

    Prototype

    means a specific design of mattress set that serves as a model for production units intended to be introduced into commerce and is the same as the production units with respect to materials, components,
    design and methods of assembly. A mattress intended for sale with a foundation(s) shall be considered a separate and distinct prototype from a mattress intended for sale without a foundation.

    (m)

    Prototype developer

    means a third party that develops a prototype for use by a manufacturer. Such prototypes may be qualified by either the prototype developer or by the manufacturer.

    (n)

    Qualified prototype

    means a prototype that has been tested in accordance with § 1633.4(a) and meets the criteria stated in § 1633.3(b).

    (o)

    Confirmed prototype

    means a prototype that is part of a pooling arrangement and is the same as a qualified prototype with respect to materials, components, design and methods of assembly and has been tested in accordance
    with § 1633.5(a)(3) and meets the criteria stated in § 1633.3(b).

    (p)

    Subordinate prototype

    means a mattress set that is based on a qualified or confirmed prototype and is the same as the qualified or confirmed prototype, except as permitted by § 1633.4(b). A subordinate prototype is considered
    to be represented by a qualified or confirmed prototype and need not be tested in accordance with § 1633.4(a) or § 1633.5(a)(3).

    (q)

    Prototype pooling

    means a cooperative arrangement—whereby one or more manufacturers build mattress sets based on a qualified prototype produced by another manufacturer or prototype developer. A manufacturer who relies
    on another manufacturer''s or prototype developer''s qualified prototype must perform a confirmation test on the mattress set it manufactures.

    (r)

    Confirmation test

    means a pre-market test conducted by a manufacturer who is relying on a qualified prototype produced by another manufacturer or prototype developer. A confirmation test must be conducted in accordance
    with the procedures set forth in § 1633.7 and meet the criteria in § 1633.3(b).

    (s)

    Production lot

    means any quantity of finished mattress sets that are produced in production intervals defined by the manufacturer, and are intended to replicate a specific qualified, confirmed or subordinate prototype
    that complies with this part 1633.

    (t)

    Specimen

    means a mattress set tested under this regulation.

    (u)

    Twin size

    means any mattress with the dimensions 38 inches (in) (965 millimeters) × 74.5 in. (1892 mm); all dimensions may vary by ±

    1/2

    in. (±13 mm).

    (v)

    Core

    means the main support system that may be present in a mattress, such as springs, foam, water bladder, air bladder, or resilient filling.'
- id: art-4
  title: § 1633.3
  text: '§ 1633.3

    General requirements.

    (a)

    Summary of test method.

    The test method set forth in § 1633.7 measures the flammability (fire test response characteristics) of a mattress specimen by exposing the specimen to a specified flaming ignition source and allowing
    it to burn freely under well-ventilated, controlled environmental conditions. The flaming ignition source shall be a pair of propane burners. These burners impose differing fluxes for differing times
    on the top and sides of the specimen. During and after this exposure, measurements shall be made of the time-dependent heat release rate from the specimen, quantifying the energy generated by the fire.
    The rate of heat release must be measured by means of oxygen consumption calorimetry.

    (b)

    Test criteria.

    (1) When testing the mattress set in accordance with the test procedure set forth in § 1633.7, the specimen shall comply with both of the following criteria:

    (i) The peak rate of heat release shall not exceed 200 kilowatts (“kW”) at any time within the 30 minute test; and

    (ii) The total heat release shall not exceed 15 megajoules (“MJ”) for the first 10 minutes of the test.

    (2) In the interest of safety, the test operator should discontinue the test and record a failure if a fire develops to such a size as to require suppression for the safety of the facility.

    (c)

    Testing of mattress sets.

    Mattresses labeled for sale with a foundation shall be tested with such foundation. Mattresses labeled for sale without a foundation shall be tested alone.

    (d)

    Compliance with this standard.

    Each mattress set manufactured, imported, or renovated on or after the effective date of the standard shall meet the test criteria specified in paragraph (b) of this section and otherwise comply with
    all applicable requirements of this part 1633.'
- id: art-5
  title: § 1633.4
  text: '§ 1633.4

    Prototype testing requirements.

    (a) Except as otherwise provided in paragraph (b) of this section, each manufacturer shall cause three specimens of each prototype to be tested according to § 1633.7 and obtain passing test results
    according to § 1633.3(b) before selling or introducing into commerce any mattress set based on that prototype, unless the manufacturer complies with the prototype pooling and confirmation testing requirements
    in § 1633.5.

    (b) Notwithstanding the requirements of paragraph (a) of this section, a manufacturer may sell or introduce into commerce a mattress set that has not been tested according to § 1633.7 if that mattress
    set differs from a qualified or confirmed prototype only with respect to:

    (1) Mattress/foundation length and width, not depth (

    e.g.

    , twin, queen, king);

    (2) Ticking, unless the ticking of the qualified prototype has characteristics (such as chemical treatment or special fiber composition) designed to improve performance on the test prescribed in this
    part; and/or

    (3) Any component, material, design or method of assembly, so long as the manufacturer can demonstrate on an objectively reasonable basis that such differences will not cause the mattress set to exceed
    the test criteria specified in § 1633.3(b).

    (c) All tests must be conducted on specimens that are no smaller than a twin size, unless the largest size mattress set produced is smaller than a twin size, in which case the largest size must be tested.

    (d)(1) If each of the three specimens meets both the criteria specified in § 1633.3(b), the prototype shall be qualified. If any one (1) specimen fails to meet the test criteria of § 1633.3(b), the
    prototype is not qualified.

    (2) Any manufacturer may produce a mattress set for sale in reliance on prototype tests performed before the effective date of this Standard, provided:

    (i) The manufacturer has documentation showing that such tests were conducted in accordance with all requirements of this section and § 1633.7 and yielded passing results according to the test criteria
    of § 1633.3(b);

    (ii) Any tests conducted more than 30 days after publication of this standard in the

    Federal Register

    must comply

    with the recordkeeping requirements in § 1633.11;

    (iii) Such mattress sets may be used for prototype pooling only if the manufacturer complies with applicable recordkeeping requirements in § 1633.11; and

    (iv) Such mattress sets may serve as the basis for a subordinate prototype only if the manufacturer has all records required by § 1633.11.'
- id: art-6
  title: § 1633.5
  text: '§ 1633.5

    Prototype pooling and confirmation testing requirements.

    (a)

    Prototype pooling.

    One or more manufacturers may rely on a qualified prototype produced by another manufacturer or prototype developer provided that:

    (1) The prototype meets the requirements of § 1633.4;

    (2) The mattress sets being produced are the same as the qualified prototype with respect to materials, components, design and methods of assembly; and

    (3) The manufacturer producing mattress sets in reliance on a qualified prototype has performed a confirmation test on at least one (1) Specimen of the mattress set it produces in accordance with § 1633.7.
    The tested specimen must meet the criteria under § 1633.3(b) before any mattress sets based on the qualified prototype may be sold or introduced into commerce.

    (b)

    Confirmation test failure.

    (1) If the confirmation test specimen fails to meet the criteria of § 1633.3(b), the manufacturer thereof shall not sell any mattress set based on the same qualified prototype until that manufacturer
    takes corrective measures, tests a new specimen, and the new specimen meets the criteria of § 1633.3(b).

    (2) If a confirmation test specimen fails to meet the criteria of § 1633.3(b), the manufacturer thereof must notify the manufacturer of the prototype of the test failure.'
- id: art-7
  title: § 1633.6
  text: '§ 1633.6

    Quality assurance requirements.

    (a)

    Quality assurance.

    Each manufacturer shall implement a quality assurance program to ensure that mattress sets manufactured for sale are the same as the qualified and/or confirmed prototype on which they are based with
    respect to materials, components, design and methods of assembly, except as permitted by § 1633.4(b). At a minimum these procedures shall include:

    (1) Controls, including incoming inspection procedures, of all mattress set materials, components and methods of assembly to ensure that they are the same as those used in the prototype on which they
    are based;

    (2) Designation of a production lot that is represented by the prototype; and

    (3) Inspection of mattress sets produced for sale sufficient to demonstrate that they are the same as the prototype on which they are based with respect to materials, components, design and methods
    of assembly.

    (b)

    Production testing.

    Manufacturers are encouraged to conduct, as part of the quality assurance program, random testing of mattress sets being produced for sale according to the requirements of §§ 1633.3 and 1633.7.

    (c)

    Failure of mattress sets produced for sale to meet flammability standard

    —(1)

    Sale of mattress sets.

    If any test performed for quality assurance yields results which indicate that any mattress set of a production lot does not meet the criteria of § 1633.3(b), or if a manufacturer obtains test results
    or other evidence that a component or material or construction/assembly process used could negatively affect the test performance of the mattress set as set forth in § 1633.3(b), the manufacturer shall
    cease production and distribution in commerce of such mattress sets until corrective action is taken.

    (2)

    Corrective action.

    A manufacturer must take corrective action when any mattress set manufactured or imported for sale fails to meet the flammability test criteria set forth in § 1633.3(b).'
- id: art-8
  title: § 1633.7
  text: '§ 1633.7

    Mattress test procedure.

    (a)

    Apparatus and test materials

    —(1)

    Calorimetry.

    The rate of heat release must be measured by means of oxygen consumption calorimetry. The calibration should follow generally accepted practices for calibration. The calorimetry system shall be calibrated
    at a minimum of two (2) calibration points—at 75 kW and 200 kW.

    (2)

    Test area.

    The test area must have either Test Configuration A or B. The

    test area conditions shall be maintained at a temperature greater than 15 °C (59 °F) and less than 27 °C (80.6 °F) and a relative humidity less than 75 percent.

    (i)

    Test configuration A. (an open calorimeter (or furniture calorimeter)).

    In this configuration, the specimen to be tested is placed under the center of an open furniture calorimeter. Figure 1 of this part shows the test assembly atop a bed frame and catch surface. The specimen
    shall be placed under an open hood which captures the entire smoke plume and is instrumented for heat release rate measurements. The area surrounding the test specimen in an open calorimeter layout
    shall be sufficiently large that there are no heat re-radiation effects from any nearby materials or objects. The air flow to the test specimen should be symmetrical from all sides. The air flow to
    the calorimeter hood shall be sufficient to ensure that the entire fire plume is captured, even at peak burning. Skirts may be placed on the hood periphery to help assure this plume capture, if necessary,
    though they must not be of such an excessive length as to cause the incoming flow to disturb the burning process. Skirts must also not heat up to the point that they contribute significant re-radiation
    to the test specimen. The air supply to the hood shall be sufficient that the fire is not in any way limited or affected by the available air supply. The fire plume should not enter the hood exhaust
    duct. Brief (seconds) flickers of flame that occupy only a minor fraction of the hood exhaust duct inlet cross-section are acceptable since they do not signify appreciable suppression of flames.

    (ii)

    Test configuration B.

    The test room shall have dimensions 10 ft. by 12 ft. by 8 ft. (3048 mm × 3658 mm × 2438 mm) high. The specimen is placed within the burn room. All smoke exiting from the room is caught by a hood system
    instrumented for heat release rate measurements. The room shall have no openings permitting air infiltration other than a doorway opening 38 in ±0.25 in by 80 in ±0.25 in (965 mm ±6.4 mm × 2032 mm ±6.4
    mm) located as indicated in Figure 2 of this part and other small openings as necessary to make measurements. The test room shall be constructed of wood or metal studs and shall be lined with fire-rated
    wallboard or calcium silicate board. An exhaust hood shall be positioned outside of the doorway so as to collect all of the combustion gases. There shall be no obstructions in the air supply to the
    set-up.

    (3)

    Location of test specimen.

    The location of the test specimen is shown in Figure 2 of this part. The angled placement is intended to minimize the interaction of flames on the side surfaces of the test specimen with the room walls.
    One corner of the test specimen shall be 13 centimeters (cm) to 17 cm from the wall and the other corner shall be 25 cm to 30 cm from the wall. The test room shall contain no other furnishings or combustible
    materials except for the test specimen.

    (4)

    Bed frame.

    (i)

    Frame dimensions.

    The specimen shall be supported around its perimeter by the bed frame with a flat surface and no edges extending up from the surface (i.e., the angle is configured down). For twin size mattresses, the
    specimen shall be placed on top of a welded bed frame 1.90 m by 0.99 m (75 in by 39 in) made from 40 mm (1.50 in) steel angle. If testing a size other than twin, the test frame shall similarly match
    the dimensions of the specimen.

    (ii)

    Frame height.

    The frame shall be 115 mm (4.5 in) high, except if adjustments are necessary to accommodate the required burner position in paragraph (h)(2)(ii) of this section. The height of the test frame shall also
    be adjusted, as necessary, so that the burner is no less than 25mm (1 in) above the supporting surface.

    (iii)

    Frame crosspieces.

    The frame shall be completely open under the foundation except for two crosspieces, 25 mm wide (1 in) at the

    1/3

    length points, except when sagging of the specimen between the crosspieces exceeds 19 mm (

    3/4

    in) below the test frame. Minimal additional crosspieces shall then be added to prevent sagging of the specimen.

    (5)

    Catch pan.

    The bed frame feet shall rest on a surface of either calcium silicate board or fiber cement board, 13 mm (0.5 in) thick, 2.11 m by 1.19 m (83 in by 47 in). The board serves

    as a catch surface for any flaming melt/drip material falling from the bed assembly and may be the location of a pool fire that consumes such materials. This surface must be cleaned between tests to
    avoid build-up of combustible residues. Lining this surface with aluminum foil to facilitate cleaning is not recommended since this might increase fire intensity via reflected radiation.

    (6)

    Ignition source

    —(i)

    General.

    The ignition source shall consist of two T-shaped burners as shown in Figures 3 and 4 of this part. One burner impinges flames on the top surface of the mattress. The second burner impinges flames on
    the side of the mattress and on the side of the foundation. Each of the burners shall be constructed from stainless steel tubing (12.7 mm diameter with 0.89 ±0.5 mm wall thickness; 0.50 in diameter
    with 0.035 ±0.002 in wall). Each burner shall incorporate a stand-off foot to set its distance from the test specimen surface (Figure 5 of this part). Both burners shall be mounted with a mechanical
    pivot point but the side burner is locked in place to prevent movement about this pivot in normal usage. The top burner, however, is free to rotate about its pivot during a burner exposure and is lightly
    weighted so as to exert a downward force on the mattress top through its stand-off foot so that the burner follows a receding top surface on the test specimen (Figure 6 of this part). The combination
    of burner stand-off distance and propane gas flow rate to the burners determines the heat flux they impose on the surface of the test specimen so that both of these parameters are tightly controlled.

    (ii)

    Top surface burner.

    The T head of the top surface burner (horizontal burner, Figure 3 of this part) shall be 305 ±2 mm (12 ±0.08 in) long with gas tight plugs in each end. Each side of the T shall contain 17 holes equally
    spaced over a 135 mm length (8.5 mm ±0.1 mm apart; 0.333 ±0.005 in). The holes on each side shall begin 8.5 mm (0.33 in) from the centerline of the burner head. The holes shall be 1.45 mm to 1.53 mm
    (0.058 in to 0.061 in) in diameter (which corresponds to Grade 10 machining practice with a well formed #53 drill bit). The holes shall point 5° out of the plane of the diagram in Figure 3. This broadens
    the width of the heat flux profile imposed on the surface of the test specimen.

    (iii)

    Side surface burner.

    The T head of the side surface burner (vertical burner) shall be constructed similarly to the top surface burner, as shown in Figure 4 of this part, except that its overall length shall be 254 ±2 mm
    (10 ±0.08 in). Each side of the burner head shall contain 14 holes spaced evenly over a 110 mm length (8.5 mm ±0.1 mm apart; 0.333 ±0.005 in). The holes shall be 1.45 mm to 1.53 mm (0.058 in to 0.061
    in) in diameter (which corresponds to Grade 10 machining practice with a well formed #53 drill bit). The holes shall point 5° out of the plane of the diagram in Figure 4.

    (iv)

    Burner stand-off.

    The burner stand-off on each burner shall consist of a collar fixed by a set screw onto the inlet tube of the burner head (Figure 5 of this part). The collar shall hold a 3 mm diameter stainless steel
    rod having a 12.7 mm by 51 mm by (2-2.5 mm) thick (0.5 in by 2 in by (0.08-0.10 in) thick) stainless steel pad welded on its end with its face (and long axis) parallel to the T head of the burner. The
    foot pad shall be displaced about 10 mm to 12 mm from the longitudinal centerline of the burner head so that it does not rest on the test specimen in an area of peak heat flux.

    (v)

    Burner inlet lines.

    A short section (9.5 mm outer diameter (“OD”), about 80 mm long;

    3/8

    in OD, about 3.2 in long) of copper tubing shall be placed in the inlet gas line just before the burner to facilitate making the burner nominally parallel to the test specimen surface (by a procedure
    described below). The copper tube on the top surface burner should be protected from excessive heat and surface oxidation by wrapping it with a suitable layer of high temperature insulation to protect
    the equipment. Both copper tubes are to be bent by hand in the burner alignment process. They must be replaced if they become work-hardened or crimped in any way. The gas inlet lines (12.7 mm OD stainless
    steel tubing; 0.50 in) serve as arms leading back to the pivot points and beyond, as shown in Figure 6 of this part. The length to the pivot for the top burner shall be approximately 1000 mm (40 in).

    (vi)

    Burner frame.

    Figure 6 of this part shows the frame that holds the burners and their pivots, which are adjustable vertically in height. All adjustments (burner height, burner arm length from the pivot point, counterweight
    positions along the burner arm) are facilitated by the use of knobs or thumbscrews as the set screws. The three point footprint of the burner frame, with the two forward points on wheels, facilitates
    burner movement and burner stability when stationary.

    (vii)

    Arms.

    The metal arms attached to the burners shall be attached to a separate gas control console by flexible, reinforced plastic tubing.

    1

    The gas control console is mounted separately so as to facilitate its safe placement outside of the test room throughout the test procedure. The propane gas lines running between the console and the
    burner assembly must be anchored on the assembly before running to the burner inlet arms. A 1.5 m ±25 mm (58 in ±1 in) length of flexible, reinforced tubing between the anchor point and the end of each
    burner inlet allows free movement of the top burner about its pivot point. The top burner arm shall have a pair of moveable cylindrical counterweights that are used, as described below, to adjust the
    downward force on the stand-off foot.

    1

    Fiber-reinforced plastic tubing (6 mm ID by 9.5 mm OD; 0.25 inch ID by 0.4 inch OD) made of PVC should be used.

    (viii)

    Burner head.

    Each burner head shall have a separate pilot light consisting of a 3 mm OD (

    1/8

    in OD) copper tube with an independently-controlled supply of propane gas. The tube terminates within 10 mm of the center of the burner head. Care must be taken to set the pilot flame size small enough
    so as not to heat the test specimen before the timed burner exposure is begun.

    (ix)

    Flow control system.

    Each burner shall have a flow control system of the type shown in Figure 7 of this part. Propane gas from a source such as a bottle is reduced in pressure to approximately 140 ±5 kilopascals (“kPa”)
    (20 ±1 pounds per square inch gage (“psig”)) and fed to the system shown in Figure 7 of this part. The gas flow to the burner is delivered in a square-wave manner (constant flow with rapid onset and
    termination) by means of the solenoid valve upstream of the flowmeter. An interval timer (accurate to ±0.2 s) determines the burner flame duration. The pilot light assures that the burner will ignite
    when the solenoid valve opens.

    2

    The gas flow shall be set using a rotameter type of flowmeter, with a 150 mm scale, calibrated for propane. When calibrating the flowmeter, take into account that the flow resistance of the burner holes
    causes a finite pressure increase in the flowmeter above ambient. (If a calibration at one atmosphere is provided by the manufacturer, the flowmeter reading, at the internal pressure existing in the
    meter, required to get the flow'
- id: art-9
  title: § 1633.8
  text: '§ 1633.8

    Findings.

    (a)

    General.

    In order to issue a flammability standard under the FFA, the FFA requires the Commission to make certain findings and to include these in the regulation, 15 U.S.C. 1193(j)(2). These findings are discussed
    in this section.

    (b)

    Voluntary standards.

    No findings concerning compliance with and adequacy of a voluntary standard are necessary because no relevant voluntary standard addressing the risk of injury that is addressed by this regulation has
    been adopted and implemented.

    (c)

    Relationship of benefits to costs.

    The Commission estimates the potential total lifetime benefits of a mattress that complies with this standard to range from $45 to $57 per mattress set (based on a 10 year mattress life and a 3% discount
    rate). The Commission estimates total resource costs of the standard to range from $8 to $22 per mattress. This yields net benefits of $23 to $50 per mattress set. The Commission estimates that aggregate
    lifetime benefits associated with all mattresses produced the first year the standard becomes effective range from $1,024 to $1,307 million, and that aggregate resource costs associated with these mattresses
    range from $175 to $511 million, yielding net benefits of about $514 to $1,132 million. Accordingly, the Commission finds that the benefits from the regulation bear a reasonable relationship to its
    costs.

    (d)

    Least burdensome requirement.

    The Commission considered the following alternatives: alternative maximum peak heat release rate and test duration, alternative total heat released in the first 10 minutes of the test, mandatory production
    testing, a longer effective date, taking no action, relying on a voluntary standard, and requiring labeling alone (without any performance requirements). The alternatives of taking no action, relying
    on a voluntary standard (if one existed), and requiring labeling alone are unlikely to adequately reduce the risk. Requiring a criterion of 25 MJ total heat release during the first 10 minutes of the
    test instead of 15 MJ would likely reduce the estimated benefits (deaths and injuries reduced) without having much effect on costs. Both options of increasing the duration of the test from 30 minutes
    to 60 minutes and decreasing the peak rate of heat release from 200 kW to 150 kW would likely increase costs significantly without substantial increase in benefits. Requiring production testing would
    also likely increase costs. Therefore, the Commission finds that an open flame standard for mattresses with the testing requirements and criteria that are specified in the Commission rule is the least
    burdensome requirement that would prevent or adequately reduce the risk of injury for which the regulation is being promulgated.'
