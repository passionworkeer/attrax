  title: § 177.1040
  text: '§ 177.1040

    Acrylonitrile/styrene copoly-mer.

    Acrylonitrile/styrene copolymers identified in this section may be safely used as a component of packaging materials subject to the provisions of this section.

    (a)

    Identity.

    For the purposes of this section acrylonitrile/styrene copoly-mers are basic copolymers meeting the specifications prescribed in paragraph (c) of this section.

    (b)

    Adjuvants.

    (1) The copolymers identified in paragraph (c) of this section may contain adjuvant substances required in their production, with the exception that they shall not contain mercaptans or other substances
    which form reversible complexes with acryl-onitrile monomer. Permissible adjuvants may include substances generally recognized as safe in food, substances used in accordance with prior sanction, substances
    permitted under applicable regulations in this part, and those authorized in paragraph (b)(2) of this section.

    (2) The optional adjuvants for the acrylonitrile/styrene copolymer identified in paragraphs (c)(1) and (3) of this section are as follows:

