    132 STAT. 1636 PUBLIC LAW 115–232—AUG. 13, 2018

    Public Law 115–232

    115th Congress

    An Act

    To authorize appropriations for fiscal year 2019 for military activities of the Depart-

    Aug. 13, 2018 ment of Defense, for military construction, and for defense activities of the Depart-

    [H.R. 5515] ment of Energy, to prescribe military personnel strengths for such fiscal year,

    and for other purposes.

    Be it enacted by the Senate and House of Representatives of

    John S. McCain the United States of America in Congress assembled,

    National Defense

    Authorization SECTION 1. SHORT TITLE.

    Act for Fiscal (a) IN GENERAL.—This Act may be cited as the ‘‘John S. McCain

    Year 2019.

    National Defense Authorization Act for Fiscal Year 2019’’.

    (b) REFERENCES.—Any reference in this or any other Act to

    the ‘‘National Defense Authorization Act for Fiscal Year 2019’’ shall

    be deemed to be a reference to the ‘‘John S. McCain National

    Defense Authorization Act for Fiscal Year 2019’’.

    SEC. 2. ORGANIZATION OF ACT INTO DIVISIONS; TABLE OF CONTENTS.

    (a) DIVISIONS.—This Act is organized into four divisions as

    follows:

    (1) Division A—Department of Defense Authorizations.

    (2) Division B—Military Construction Authorizations.

    (3) Division C—Department of Energy National Security

    Authorizations and Other Authorizations.

    (4) Division D—Funding Tables.

    (b) TABLE OF CONTENTS.—The table of contents for this Act

    is as follows:

    Sec. 1. Short title.

    Sec. 2. Organization of Act into divisions; table of contents.

    Sec. 3. Congressional defense committees.

    Sec. 4. Budgetary effects of this Act.

