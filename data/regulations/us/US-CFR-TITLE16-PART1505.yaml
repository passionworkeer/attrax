    (e)

    Precautionary statements

    —(1)

    General.

    Electrically operated toys shall bear the statement: “CAUTION—ELECTRIC TOY.” The instruction booklet or sheet accompanying such toys shall bear on the front page thereof (in the type size specified
    in § 1500.121), as a preface to any written matter contained therein, and the shelf pack or package of such toys shall bear in the upper right hand quarter of the principal display panel, the statement:
    “CAUTION—ELECTRIC TOY: Not recommended for children under __ years of age. As with all electric products, precautions should be observed during handling and use to prevent electric shock.” The blank
    in the preceding statement shall be filled in by the manufacturer, but in no instance shall the manufacturer indicate that the article is recommended for children under 8 years of age if it contains
    a heating element. In the case of other electrically operated products which may not be considered to be “toys” but are intended for use by children, the term “ELECTRICALLY OPERATED PRODUCT” may be
    substituted for the term “ELECTRIC TOY.”

    (2)

    Thermal hazards.

    (i) Toys having Type C or Type D surfaces (described in § 1505.6(g)(2)) which reach temperatures greater than those shown in paragraph (e)(2)(ii) of this section shall be defined as hot and shall be
    marked where readily noticeable when the hot surface is in view with the statement: “HOT—Do Not Touch.” When the marking is on other than the hot surface, the word “HOT” shall be followed by appropriate
    descriptive words such as “Molten Material,” “Sole Plate,” or “Heating Element,” and the statement “Do Not Touch.” An alternative statement for a surface intended to be handheld as a functional part
    of the toy shall be “HOT ____ Handle Carefully,” the blank being filled in by the manufacturer with a description of the potential hazard such as “Curler” or “Cooking Surface.”

    (ii) Surfaces requiring precautionary statements of thermal hazards are those exceeding the following temperatures when measured by the test described in § 1505.6(g)(4):

