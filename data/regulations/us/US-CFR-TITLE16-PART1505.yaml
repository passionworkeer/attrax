    Register and which has been filed with the Office of the Federal Register.

    Weight of appliance (without cord) and cord type

    1/2

    lb. (0.227 kg) and lighter: SP-1, SPT-1, HPD. Heavier than

    1/2

    lb. (0.227 kg): SP-2, SPT-2, SV, SVO, SVT, SVTO, HPD, HPN, SJ, SJO, SJT, SJTO.

    (6) A flexible cord and plug shall have a current-carrying capacity of not less than the ampere rating of the toy, and the conductor of the cord shall have a cross sectional area no less than No. 18
    AWG (American wire gauge).

    (7) Cords on toys which are intended to come in direct contact with water or other liquids during use shall be of a jacketed type. Cords on toys with which water or other liquids are to be indirectly
    used (such as for cooling a mold) shall be plastic covered.

    (8) Transformers in which the primary coil connects directly to the branch circuit outlet shall not be subject to the requirements of paragraphs (e) (2), (4), and (5) of this section.

    (f)

    Bushings.

    (1) At the point where a power supply cord passes through an opening in a wall, barrier, or the overall enclosure of a toy, a suitable and substantial bushing, insulating bushing, or equivalent shall
    be reliably secured in place and shall have smooth surfaces and well-rounded edges against which the cord may bear.

    (2) If a cord hole is in wood, porcelain, phenolic composition, or other suitable insulating material, the surface of the hole is acceptable without a bushing if the edges of the hole are smooth and
    well-rounded. Where a separate insulating bushing is required, a bushing made of ceramic material or a suitable molded composition is acceptable if its edges are smooth and well-rounded.

    (3) In no instance shall a separate bushing of wood, rubber, or any of the hot-molded shellac-and-tar compositions be considered acceptable.

    (g)

    Wiring.

    (1) The internal wiring of a toy shall consist of suitable insulated conductors having adequate mechanical strength, dielectric properties, and

    electrical capacity for the particular application.

    (2) Wireways shall be smooth and entirely free of sharp edges, burrs, fins, and moving parts that may abrade conductor insulation. Each splice and connection shall be mechanically secure, shall provide
    adequate and reliable electrical contact, and shall be provided with insulation at least equivalent to that of the wire involved unless adequate spacing between the splice and all other metal parts
    is permanently assured.

    (3) A wire connector for making a splice in a toy shall be a type that is applied by a tool and for which the application force of the tool is independent of the force applied by the operator.

    (4) Soldered connections shall be made mechanically secure before soldering.

    (5) Current-carrying parts shall be made of silver, copper, a copper alloy, or other electrically conductive material suitable for the particular application.

    (h)

    Strain relief.

    (1) A means of strain relief shall be provided to prevent mechanical stress on a flexible cord from being transmitted to terminals, splices, or interior wiring.

    (2) If suitable auxiliary insulation is provided under a clamp for mechanical protection, clamps of any material are acceptable for use on Type SP-2 (as defined in the “National Electrical Code,” chapter
    4, article 400, pages 184-194 (1971)

    2

    ) or equivalent rubber-insulated cord. For heavier types of thermoplastic-insulated cord, clamps may be without auxiliary insulation unless the clamp may damage the cord insulation.

    2

