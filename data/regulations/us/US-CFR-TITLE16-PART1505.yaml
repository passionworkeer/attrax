  title: § 1505.5
  text: '§ 1505.5

    Electrical design and construction.

    (a)

    Switches.

    (1) Switches and other control devices of electrically operated toys shall be suitable for the application and shall have a rating not less than that of the load they control (see § 1505.6(e)(5)(ii)
    regarding electrical switch overload). A switch that controls a replaceable incandescent lamp, electrode, or lampholder contact which is at a potential of more than 30 volts r.m.s. (42.4 volts peak)
    to any other part or to ground shall open both sides of the circuit and shall have a marked “OFF” position. A switch that may reasonably be expected to be subjected to temperatures higher than 50 °C.
    (122 °F.) shall be constructed of materials which are suitable for use at such temperatures.

    (2) Switches shall be located and protected so that they are not subject to mechanical damage that would produce a hazard in normal use or from reasonably foreseeable damage or abuse (see § 1505.6(b)).

    (b)

    Lamps.

    (1) A replaceable incandescent lamp having a voltage of more than 30 volts r.m.s. (42.4 volts peak) between any of its electrodes or lampholder contacts and any other part or ground shall be in an enclosure
    that has at least one door or cover permitting access to the lamp. Such door(s) or cover(s) of the enclosure shall be so designed and constructed that they cannot be opened manually or with a flat bladed
    screwdriver or pliers.

    (2) With all access doors and covers closed, the lamp enclosure shall have no opening that will permit entry of a straight rod 6 inches long and one-fourth inch in diameter if such entry would present
    an electrical hazard. The lamp shall be located no less than one-half inch from any

    1/4

    -inch-diameter opening in the enclosure.

    (3) A toy having one or more lampholders shall be designed and constructed so that no live parts other than the contacts of the lampholders are exposed to contact by persons removing or replacing lamps.
    The shells of all lampholders for incandescent lamps shall be at the same potential.

    (4) If the potential between the contacts of a lampholder for a replaceable

    incandescent lamp and any other part or ground is greater than 30 volts r.m.s. (42.4 volts peak), the contacts shall be located in an insulating husk or equivalent.

    (c)

    Transformers.

    Transformers that are integral parts of toys shall be of the 2-coil insulated type.

    (d)

    Automatic controls.

    Automatic controls for temperature regulations shall have the necessary capacity and reliability for their particular application.

    (e)

    Power supply connections

    (

    cords and plugs

    ). (1) A toy shall be provided with a suitable means for attachement to the power supply circuit.

    (2) A toy requiring a power cord shall have a flexible cord that is permanently attached to the toy.

    (3) The perimeter of the face of the attachment-plug cap shall be not less than five-sixteenths of an inch from any point on either blade of the plug.

    (4) The body of the attachment-plug cap shall decrease in cross section from the face but shall have an expansion of the body, after a suitable distance from the face, sufficient to provide an effective
    finger grip.

    (5) A flexible electrical power cord provided on a toy shall be type SP-2 (as defined in the “National Electrical Code,” Chapter 4, article 400, pages 230-241 (1978)

    1

    , or its equivalent, or a heavier general-use type, and shall be not less than 5 feet nor more than 10 feet in length when measured as the overall length of the attached cord outside the enclosure of
    the toy, including fittings, up to the face of the attachment-plug cap. However, hand-held educational or hobby-type products intended for heating such as woodburning tools, shall use one of the type
    cords designated below, in accordance with the weight of the product without the cord:

    1

