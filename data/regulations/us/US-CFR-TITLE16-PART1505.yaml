- id: art-2
  title: § 1505.1
  text: '§ 1505.1

    Definitions.

    (a) The following definitions apply to this part 1505:

    (1) The term “electrically operated toy or other electrically operated article intended for use by children” means any toy, game, or other article designed, labeled, advertised, or otherwise intended
    for use by children which is intended to be powered by electrical current from nominal 120 volt (110-125 v.) branch circuits. Such articles are referred to in this part in various contexts as “toy”
    or “electrically operated toy.” If the package (including packing materials) of the toy or other article is intended to be used with the product, it is considered to be part of the toy or other article.
    This definition does not include components which are powered by circuits of 30 volts r.m.s. (42.4 volts peak) or less, articles designed primarily for use by adults which may be used incidentally by
    children, or video games.

    (2) The term

    video games

    means video game hardware systems, which are games that both produce a dynamic video image, either on a viewing screen that is part of the video game or,

    through connecting cables, on a television set, and have some way to control the movement of at least some portion of the video image.

    [38 FR 27032, Sept. 27, 1973, as amended at 58 FR 40335, July 28, 1993]'
- id: art-3
  title: § 1505.2
  text: '§ 1505.2

    Scope of part.

    This part sets forth the requirements whereby electrically operated toys and other electrically operated articles intended for use by children (as defined in § 1505.1(a)(1)) are not banned toys or banned
    articles under § 1500.18(b)(1) of this chapter.'
- id: art-4
  title: § 1505.3
  text: '§ 1505.3

    Labeling.

    (a)

    General.

    Electrically operated toys, and the instruction sheets and outer packaging thereof, shall be labeled in accordance with the requirements of this section and any other applicable requirements of the
    Federal Hazardous Substances Act and regulations promulgated thereunder. All labeling shall be prominently and conspicuously displayed under customary conditions of purchase, storage, and use. All required
    information shall be readily visible, noticeable, clear, and, except where coding is permitted, shall be in legible English (other languages may also be included as appropriate). Such factors governing
    labeling as location, type size, and contrast against background may be based on necessary condensations to provide a reasonable display.

    (b)

    Specific items.

    (1) The toy shall be marked in accordance with the provisions of paragraph (d) of this section to indicate:

    (i) The electrical ratings required by paragraph (c) of this section.

    (ii) Any precautionary statements required by paragraph (e) of this section.

    (iii) The date (month and year) of manufacture (or appropriate codes). As an alternative to putting this information on the toy itself, it may be included in the instructions provided with the toy (see
    paragraph (b)(3) of this section).

    (2) The shelf pack or package of the toy shall be labeled in accordance with the provisions of paragraph (d) of this section to indicate:

    (i) The date (month and year) of manufacture (or appropriate codes).

    (ii) The electrical ratings required by paragraph (c) of this section.

    (iii) Any precautionary statements required by paragraph (e) of this section.

    (3) Each toy shall be provided with adequate instructions that are easily understood by children of those ages for which the toy is intended. The instructions shall describe the applicable installation,
    assembly, use, cleaning, maintenance (including lubrication), and other functions as appropriate. Applicable precautions shall be included as well as the information required by paragraphs (b) (1) and
    (2) of this section, except that the date of manufacture information described in paragraph (b)(1)(iii) of this section need not be included in the instructions provided with the toy if it is placed
    on the toy itself. The instructions shall also contain a statement addressed to parents recommending that the toy be periodically examined for potential hazards and that any potentially hazardous parts
    be repaired or replaced.

    (4) If a toy is produced or assembled at more than one establishment, the toy and its shelf pack or package shall have a distinctive mark (which may be in code) identifying the toy as the product of
    a particular establishment.

    (c)

    Rating.

    (1) A toy shall be marked to indicate its rating in volts and also in amperes and/or watts.

    (2) If a toy utilizes a single motor as its only electric energy consuming component, the electrical rating may be marked on a motor nameplate and need not be marked elsewhere on the toy if the nameplate
    is readily visible after the motor has been installed in the toy.

    (3) A toy shall be rated for alternating current only, direct current only, or both alternating and direct current.

    (4) The alternating current rating shall include the frequency or frequency range requirement, if necessary because of a special component.

    (d)

    Markings.

    (1) The markings required on the toy by paragraph (b) of this section shall be of a permanent nature, such as paint-stenciled, die-stamped, molded, or indelibly stamped. The markings shall not be permanently
    obliterable by spillage of any material

    intended for use with the toy and shall not be readily removable by cleaning with ordinary household cleaning substances. All markings on the toy and labeling of the shelf pack or package required by
    paragraph (b) of this section shall contrast sharply with the background (whether by color, projection, or indentation) and shall be readily visible and legible. Such markings and labeling shall appear
    in lettering of a height not less than that specified in paragraph (d)(2) of this section, except that those words shown in capital letters in paragraph (e) of this section shall appear in capital lettering
    of a height not less than twice that specified in paragraph (d)(2) of this section.

    (2) Minimum lettering heights shall be as follows:

