  title: § 1505.6
  text: '§ 1505.6

    Performance.

    (a)

    General.

    Electrically operated toys and components thereof shall be tested by the appropriate methods described in this section and shall pass the tests in such a manner as to provide the necessary assurance
    that normal use and reasonably foreseeable damage or abuse will not produce a hazard or a potentially hazardous condition. The toy shall be capable of passing all applicable tests with any door, cover,
    handle, operable part, or accessory placed in any normal position. A toy shall not present a fire, casualty, or shock hazard when operated continuously for 6 hours under conditions of normal use and
    reasonably foreseeable damage or abuse, including the most hazardous position in which the toy can be left.

    (b)

    Enclosures.

    For the purposes of this section, the term

    enclosure

    means any surface or surrounding structure which prevents access to a real or potential hazard. An enclosure shall withstand impact, compression, and pressure tests (see paragraphs (b)(1),

    (2), and (3) of this section) without developing any openings above those specified, reduction of electrical spacings below those specified, or other fire, casualty, or shock hazards, including the
    loosening or displacement of components but excluding breakage of a lamp. After completion of each test, the toy shall comply with the requirements of the dielectric strength test described in paragraph
    (e)(2) of this section and, upon visual examination, shall not evidence the development of any hazards. Rupture of a fuse shall be considered a test failure.

