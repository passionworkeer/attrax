    (3)

    Lamp hazards

    —(i)

    Replaceable incandescent lamps.

    A toy with one or more replaceable incandescent lamps, having a potential difference of more than 30 volts r.m.s. (42.4 volts peak) between any of its electrodes or lampholder contacts and any other
    part or ground, shall be marked inside the lamp compartment where readily noticeable during lamp replacement with the statement: “WARNING—Do

    not use light bulbs larger than __ watts”, the blank being filled in by the manufacturer with a number specifying the wattage rating of the lamp. Such toys shall bear the statement: “WARNING—Shock Hazard.
    Pull plug before changing light bulb” on the outside of the lamp compartment where it will be readily noticed before gaining access to the lamp compartment.

    (ii)

    Nonreplacement incandescent lamps.

    A toy which utilizes one or more nonreplaceable incandescent lamps (other than pilot or indicator lamps) shall be marked where clearly visible with the statement: “SEALED UNIT—Do not attempt to change
    light bulb” or equivalent.

    (4)

    Water.

    If not suitable for immersion in water, a toy cooking appliance (such as a corn popper, skillet, or candy-maker) or other article which may conceivably be immersed in water shall be marked with the
    statement: “DANGER—To prevent electric shock, do not immerse in water; wipe clean with damp cloth” or equivalent.

