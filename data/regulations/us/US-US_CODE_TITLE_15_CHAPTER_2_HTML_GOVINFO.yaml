  title: §43. Office and place of meeting
  text: '§43. Office and place of meeting


    The principal office of the Commission shall be in the city of Washington, but it may meet and exercise all its powers at any other place. The Commission may, by one or more of its members, or by such
    examiners as it may designate, prosecute any inquiry necessary to its duties in any part of the United States.


    (Sept. 26, 1914, ch. 311, §3, 38 Stat. 719.)


    Executive Documents


    Transfer of Functions


    For transfer of functions of Federal Trade Commission, with certain exceptions, to Chairman of such Commission, see Reorg. Plan No. 8 of 1950, §1, eff. May 24, 1950, 15 F.R. 3175, 64 Stat. 1264, set
    out under section 41 of this title.'
- id: art-9
  title: §44. Definitions
  text: '§44. Definitions


    The words defined in this section shall have the following meaning when found in this subchapter, to wit:


    "Commerce" means commerce among the several States or with foreign nations, or in any Territory of the United States or in the District of Columbia, or between any such Territory and another, or between
    any such Territory and any State or foreign nation, or between the District of Columbia and any State or Territory or foreign nation.


    "Corporation" shall be deemed to include any company, trust, so-called Massachusetts trust, or association, incorporated or unincorporated, which is organized to carry on business for its own profit
    or that of its members, and has shares of capital or capital stock or certificates of interest, and any company, trust, so-called Massachusetts trust, or association, incorporated or unincorporated,
    without shares of capital or capital stock or certificates of interest, except partnerships, which is organized to carry on business for its own profit or that of its members.


    "Documentary evidence" includes all documents, papers, correspondence, books of account, and financial and corporate records.


    "Acts to regulate commerce" means subtitle IV of title 49 and the Communications Act of 1934 [47 U.S.C. 151 et seq.] and all Acts amendatory thereof and supplementary thereto.


    "Antitrust Acts" means the Act entitled "An Act to protect trade and commerce against un

    lawful restraints and monopolies", approved July 2, 1890; also sections 73 to 76, inclusive, of an Act entitled "An Act to reduce taxation, to provide revenue for the Government, and for other purposes",
    approved August 27, 1894; also the Act entitled "An Act to amend sections 73 and 76 of the Act of August 27, 1894, entitled ''An Act to reduce taxation, to provide revenue for the Government, and for
    other purposes'' ", approved February 12, 1913; and also the Act entitled "An Act to supplement existing laws against unlawful restraints and monopolies, and for other purposes", approved October 15,
    1914.


    "Banks" means the types of banks and other financial institutions referred to in section 57a(f)(2) of this title.


    "Foreign law enforcement agency" means—


    (1) any agency or judicial authority of a foreign government, including a foreign state, a political subdivision of a foreign state, or a multinational organization constituted by and comprised of foreign
    states, that is vested with law enforcement or investigative authority in civil, criminal, or administrative matters; and


    (2) any multinational organization, to the extent that it is acting on behalf of an entity described in paragraph (1).


    (Sept. 26, 1914, ch. 311, §4, 38 Stat. 719; Mar. 21, 1938, ch. 49, §2, 52 Stat. 111; Pub. L. 102–242, title II, §212(g)(1), Dec. 19, 1991, 105 Stat. 2302; Pub. L. 107–273, div. C, title IV, §14102(c)(2)(B),
    Nov. 2, 2002, 116 Stat. 1921; Pub. L. 109–455, §§2, 13, Dec. 22, 2006, 120 Stat. 3372, 3382; Pub. L. 112–203, §1, Dec. 4, 2012, 126 Stat. 1484.)


    Amendment of Section


    For repeal of amendment by section 13 of Pub. L. 109–455, see Termination Date of 2006 Amendment note below.


    Editorial Notes


    References in Text


    The Communications Act of 1934, referred to in text, is act June 19, 1934, ch. 652, 48 Stat. 1064, which is classified principally to chapter 5 (§151 et seq.) of Title 47, Telecommunications. For complete
    classification of this Act to the Code, see section 609 of Title 47 and Tables.


    The Act entitled "An Act to protect trade and commerce against unlawful restraints and monopolies," approved July 2, 1890, referred to in the text, is known as the Sherman Act, and is classified to
    sections 1 to 7 of this title.


    Sections 73 to 76, inclusive, of an Act entitled "An Act to reduce taxation, to provide revenue for the Government, and for other purposes", approved August 27, 1894, referred to in text, are known
    as the Wilson Tariff Act. Sections 73 to 76 are classified to sections 8 to 11 of this title.


    Act February 12, 1913, is set out as amendments to sections 8 and 11 of this title.


    The Act entitled "An Act to supplement existing laws against unlawful restraints and monopolies, and for other purposes", approved October 15, 1914, referred to in text, is the Clayton Act. For classification
    of the Act to the Code, see References in Text note set out under section 12 of this title.


    Codification


    "Subtitle IV of title 49" substituted in text for "the Act entitled ''An Act to regulate commerce'', approved February 14, 1887, and all Acts amendatory thereof and supplementary thereto" on authority
    of Pub. L. 95–473, §3(b), Oct. 17, 1978, 92 Stat. 1466, the first section of which enacted subtitle IV of Title 49, Transportation.


