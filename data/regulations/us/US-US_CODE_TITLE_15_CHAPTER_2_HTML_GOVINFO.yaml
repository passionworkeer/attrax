    Preservation of Existing Authority


    Pub. L. 109–455, §12, Dec. 22, 2006, 120 Stat. 3382, provided that: "The authority provided by this Act [see Termination Date of 2006 Amendment note above], and by the Federal Trade Commission Act (15
    U.S.C. 41 et seq.) and the Right to Financial Privacy Act [of 1978] (12 U.S.C. 3401 et seq.), as such Acts are amended by this Act, is in addition to, and not in lieu of, any other authority vested
    in the Federal Trade Commission or any other officer of the United States."


