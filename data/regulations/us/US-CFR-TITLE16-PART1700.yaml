  title: § 1700.1
  text: '§ 1700.1

    Definitions.

    (a) As used in this part:

    (1)

    Act

    means the Poison Prevention Packaging Act of 1970 (Pub. L. 91-601, 84 Stat. 1670-74; 15 U.S.C. 1471-75), enacted December 30, 1970.

    (2)

    Commission

    means the Consumer Product Safety Commission established by section 4 of the Consumer Product Safety Act (86 Stat. 1210; 15 U.S.C. 2053).

    (3)

    Dietary supplement

    means any vitamin and/or mineral preparation offered in tablet, capsule, wafer, or other similar uniform unit form; in powder, granule, flake, or liquid form; or in the physical form of a conventional
    food but which is not a conventional food; and which purports or is represented to be for special dietary use by humans to supplement their diets by increasing the total dietary intake of one or more
    of the essential vitamins and/or minerals.

    (b) Except for the definition of “Secretary,” which is obsolete, the definitions given in section 2 of the act are applicable to this part and are repeated herein for convenience as follows:

    (1) [Reserved]

    (2)

    Household substance

    means any substance which is customarily produced or distributed for sale for consumption or use, or customarily stored, by individuals in or about the household and which is:

    (i) A hazardous substance as that term is defined in section 2(f) of the Federal Hazardous Substances Act (15 U.S.C. 1261(f));

    (ii) A food, drug, or cosmetic as those terms are defined in section 201 of the Federal Food, Drug, and Cosmetic Act (21 U.S.C. 321); or

    (iii) A substance intended for use as fuel when stored in a portable container and used in the heating, cooking, or refrigeration system of a house.

    (3)

    Package

    means the immediate container or wrapping in which any household substance is contained for consumption, use, or storage by individuals in or about the household and, for purposes of section 4(a)(2)
    of the act, also means any outer container or wrapping used in the retail display of any such substance to consumers. “Package” does not include:

    (i) Any shipping container or wrapping used solely for the transportation of any household substance in bulk or in quantity to manufacturers, packers, or processors, or to wholesale or retail distributors
    thereof; or

    (ii) Any shipping container or outer wrapping used by retailers to ship or deliver any household substance to consumers unless it is the only such container or wrapping.

    (4)

    Special packaging

    means packaging that is designed or constructed to be significantly difficult for children under 5 years of age to open or obtain a toxic or harmful amount of the substance contained therein within
    a reasonable time and not difficult for normal adults to use properly, but does not mean packaging which all such children cannot open or obtain a toxic or harmful amount within a reasonable time.

    (5)

    Labeling

    means all labels and other written, printed, or graphic matter upon any household substance or

    its package, or accompanying such substance.

    (Pub. L. 92-573, sec. 30(a), 86 Stat. 1231; (15 U.S.C. 2079(a)))

    [38 FR 21247, Aug. 7, 1973, as amended at 41 FR 22266, June 2, 1976; 48 FR 57480, Dec. 30, 1983]'
