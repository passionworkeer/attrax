    Authority.

    Authority under the Poison Prevention Packaging Act of 1970 is vested in the Consumer Product Safety Commission by section 30(a) of the Consumer Product Safety Act (15 U.S.C. 2079(a)).'
- id: art-4
  title: § 1700.3
  text: '§ 1700.3

    Establishment of standards for special packaging.

    (a) Pursuant to section 3 of the act, the Commission, after consultation with the technical advisory committee provided for by section 6 of the act, may establish by regulation standards for the special
    packaging of any household substance if the Commission finds:

    (1) That the degree or nature of the hazard to children in the availability of such substance, by reason of its packaging, is such that special packaging is required to protect children from serious
    personal injury or serious illness resulting from handling, using, or ingesting such substance; and

    (2) That the special packaging to be required by such standard is technically feasible, practicable, and appropriate for such substance.

    (b) In establishing such a standard, the Commission shall consider:

    (1) The reasonableness of such standard;

    (2) Available scientific, medical, and engineering data concerning special packaging and concerning childhood accidental ingestions, illness, and injury caused by household substances;

    (3) The manufacturing practices of industries affected by the act; and

    (4) The nature and use of the household substance.

    (c) In the process of establishing such a standard, the Commission shall publish its findings and reasons therefor and shall cite the sections of the act that authorize its action.

    (d) In establishing such standards, the Commission shall not prescribe specific packaging designs, product content, package quantity, or labeling except for labeling under section 4(a)(2) of the act.
    Regarding a household substance for which special packaging is required by regulation, the Commission can prohibit the packaging of such substance in a package which the Commission determines is unnecessarily
    attractive to children.

    (e) Promulgations pursuant to section 3 of the act shall be in accordance with section 5 of the act as to procedure.'
- id: art-5
  title: § 1700.4
  text: '§ 1700.4

    Effective date of standards.

    (a) The FR document promulgating a regulation establishing a child protection packaging standard shall indicate the standard''s effective date. Section 9 of the act specifies that the effective date
    shall not be sooner than 180 days or later than 1 year from the date the standard is promulgated in the

    Federal Register

    unless the Commission, for good cause found, determines that an earlier effective date is in the public interest and publishes in the

    Federal Register

    the reason for such finding, in which case such earlier effective date shall apply.

    (b) Upon becoming effective, a child protection packaging standard shall apply only to household substances packaged on and after its effective date.'
- id: art-6
  title: § 1700.5
  text: '§ 1700.5

    Noncomplying package requirements.

    To make household substances that are subject to requirements for special packaging readily available to elderly or handicapped persons who are unable to use those substances in special packaging, section
    4(a) of the act authorizes manufacturers and packers to package such substances in noncomplying packaging of a single size provided that complying packaging is also supplied and the noncomplying packages
    are conspicuously labeled to indicate that they should not be used in households where young children are present. The purpose of this § 1700.5 is to implement section 4(a) of the act by prescribing
    requirements for the labeling of noncomplying packages.

    (a)

    Labeling statement.

    (1) The statement “This Package for Households Without Young Children” shall appear conspicuously, and in accordance with all of the requirements of paragraph (a)

    of this section, on the package of any household substance subject to the special packaging requirements of this part 1700 that is supplied in noncomplying packaging under section 4(a) of the act, unless
    the package bears the substitute labeling statement in accordance with all of the requirements of paragraph (b) of this section.

    (2) The statement required by paragraph (a)(1) of this section shall appear on the principal display panel of the immediate container as well as on the principal display panel of any outer container
    or wrapping used in the retail display of the substance. If a package bears more than one principal display panel, the required statement shall appear on each principal display panel of the immediate
    container as well as on each principal display panel of any outer container or wrapping used in the retail display of the substance. The principal display panel is the part of the labeling most likely
    to be displayed, presented, shown, or examined.

    (3) The required labeling statement shall appear within the borderline of a square or rectangle on the principal display panel in conspicuous and easily legible capital letters, shall be in distinct
    contrast, by typography, layout, color, or embossing, to other matter on the package, and shall appear in lines generally parallel to the base on which the package rests as it is designed to be displayed.

    (4) The declaration shall be in letters in type size established in relationship to the area of the principal display panel of the package and shall be uniform for all packages of substantially the
    same size by complying with the following type-size specifications:

    (i) Not less than

    1/16

    inch in height on packages the principal display panel of which has an area of 7 square inches or less.

    (ii) Not less than

    3/32

    inch in height on packages the principal display panel of which has an area of more than 7 but not more than 15 square inches.

    (iii) Not less than

    1/8

    inch in height on packages the principal display panel of which has an area of more than 15 but not more than 25 square inches.

    (iv) Not less than

    3/16

    inch in height on packages the principal display panel of which has an area of more than 25 but not more than 100 square inches.

    (v) Not less than

    1/4

    inch in height on packages the principal display panel of which has an area of more than 100 square inches.

    (5)(i) For the purpose of obtaining uniform type size for the required statement for all packages of substantially the same size, the area of the principal display panel is the area of the side or surface
    that bears the principal display panel, which shall be:

    (A) In the case of a rectangular package where one entire side properly can be considered to be the principal display panel, the product of the height times the width of that side.

    (B) In the case of a cylindrical or nearly cylindrical container, 40 percent of the product of the height of the container times the circumference.

    (C) In the case of any other shape of container, 40 percent of the total surface of the container; however, if such container presents an obvious principal display (such as the top of a triangular or
    circular package), the area shall consist of the entire area of such obvious principal display panel.

    (ii) In determining the area of the principal display panel exclude tops, bottoms, flanges at the tops and bottoms of cans, and shoulders and necks of bottles or jars. In the case of cylindrical or
    nearly cylindrical containers, the labeling statement required by this section to appear on the principal display panel shall appear within that 40 percent of the circumference most likely to be displayed,
    presented, shown, or examined.

    (b)

    Substitute labeling statement.

    If the area of the principal display panel, as determined in accordance with paragraph (a)(5) of this section, is too small to accommodate the statement required by paragraph (a)(1) using the type size
    required by paragraph (a)(4), the substitute statement “Package Not Child-Resistant” may be used. This substitute statement must comply with all of the requirements for size, placement, and conspicuousness
    prescribed by paragraph (a) of this section.

    [40 FR 4650, Jan. 31, 1975]'
- id: art-7
  title: § 1700.14
  text: '§ 1700.14

    Substances requiring special packaging.

    (a)

    Substances.

    The Commission has determined that the degree or nature of the hazard to children in the availability of the following substances, by reason of their packaging, is such that special packaging meeting
    the requirements of § 1700.20(a) is required to protect children from serious personal injury or serious illness resulting from handling, using, or ingesting such substances, and the special packaging
    herein required is technically feasible, practicable, and appropriate for these substances:

    (1)

    Aspirin.

    Any aspirin-containing preparation for human use in a dosage form intended for oral administration shall be packaged in accordance with the provisions of § 1700.15 (a), (b), and (c), except the following:

    (i) Effervescent tablets containing aspirin, other than those intended for pediatric use, provided the dry tablet contains not more than 15 percent aspirin and has an oral LD-50 in rats of 5 grams or
    more per kilogram of body weight.

    (ii) Unflavored aspirin-containing preparations in powder form (other than those intended for pediatric use) that are packaged in unit doses providing not more than 15.4 grains of aspirin per unit dose
    and that contain no other substance subject to the provisions of this section.

    (2)

    Furniture polish.

    Nonemulsion type liquid furniture polishes containing 10 percent or more of mineral seal oil and/or other petroleum distillates and having a viscosity of less than 100 Saybolt universal seconds at 100
    °F., other than those packaged in pressurized spray containers, shall be packaged in accordance with the provisions of § 1700.15 (a), (b), and (d).

    (3)

    Methyl salicylate.

    Liquid preparations containing more than 5 percent by weight of methyl salicylate, other than those packaged in pressurized spray containers, shall be packaged in accordance with the provisions of § 1700.15
    (a), (b), and (c).

    (4)

    Controlled drugs.

    Any preparation for human use that consists in whole or in part of any substance subject to control under the Comprehensive Drug Abuse Prevention and Control Act of 1970 (21 U.S.C. 801

    et seq.

    ) and that is in a dosage form intended for oral administration shall be packaged in accordance with the provisions of § 1700.15 (a), (b), and (c).

    (5)

    Sodium and/or potassium hydroxide.

    Household substances in dry forms such as granules, powder, and flakes, containing 10 percent or more by weight of free or chemically unneutralized sodium and/or potassium hydroxide, and all other household
    substances containing 2 percent or more by weight of free or chemically unneutralized sodium and/or potassium hydroxide, shall be packaged in accordance with the provisions of § 1700.15 (a) and (b).

    (6)

    Turpentine.

    Household substances in liquid form containing 10 percent or more by weight of turpentine shall be packaged in accordance with the provisions of § 1700.15 (a) and (b).

    (7)

    Kindling and/or illuminating preparations.

    Prepackaged liquid kindling and/or illuminating preparations, such as cigarette lighter fuel, charcoal lighter fuel, camping equipment fuel, torch fuel, and fuel for decorative or functional lanterns,
    which contain 10 percent or more by weight of petroleum distillates and have a viscosity of less than 100 Saybolt universal seconds at 100 °F., shall be packaged in accordance with the provisions of
    § 1700.15 (a) and (b).

    (8)

    Methyl alcohol

    (

    methanol

    ). Household substances in liquid form containing 4 percent or more by weight of methyl alcohol (methanol), other than those packaged in pressurized spray containers, shall be packaged in accordance
    with the provisions of § 1700.15 (a) and (b).

    (9)

    Sulfuric acid.

    Household substances containing 10 percent or more by weight of sulfuric acid, except such substances in wet-cell storage batteries, shall be packaged in accordance with the provisions of § 1700.15
    (a) and (b).

    (10)

    Prescription drugs.

    Any drug for human use that is in a dosage form intended for oral administration and that is required by Federal law to be dispensed only by or upon an oral or written prescription of a practitioner
    licensed by law to administer such drug shall be packaged in accordance with

    the provisions of § 1700.15 (a), (b), and (c), except for the following:

    (i) Sublingual dosage forms of nitroglycerin.

    (ii) Sublingual and chewable forms of isosorbide dinitrate in dosage strengths of 10 milligrams or less.

    (iii) Erythromycin ethylsuccinate granules for oral suspension and oral suspensions in packages containing not more than 8 grams of the equivalent of erythromycin.

    (iv) Cyclically administered oral contraceptives in manufacturers'' mnemonic (memory-aid) dispenser packages that rely solely upon the activity of one or more progestogen or estrogen substances.

    (v) Anhydrous cholestyramine in powder form.

    (vi) All unit dose forms of potassium supplements, including individually-wrapped effervescent tablets, unit dose vials of liquid potassium, and powdered potassium in unit-dose packets, containing not
    more than 50 milliequivalents of potassium per unit dose.

    (vii) Sodium fluoride drug preparations including liquid and tablet forms, containing not more than 110 milligrams of sodium fluoride (the equivalent of 50 mg of elemental fluoride) per package or not
    more than a concentration of 0.5 percent elemental fluoride on a weight-to-volume basis for liquids or a weight-to-weight basis for non-liquids and containing no other substances subject to this § 1700.14(a)(10).

    (viii) Betamethasone tablets packaged in manufacturers'' dispenser packages, containing no more than 12.6 milligrams betamethasone.

    (ix) Pancrelipase preparations in tablet, capsule, or powder form and containing no other substances subject to this § 1700.14(a)(10).

    (x) Prednisone in tablet form, when dispensed in packages containing no more than 105 mg. of the drug, and containing no other substances subject to this § 1700.14(a)(10).

    (xi)-(xii) [Reserved]

    (xiii) Mebendazole in tablet form in packages containing not more than 600 mg. of the drug, and containing no other substance subject to the provisions of this section.

    (xiv) Methylprednisolone in tablet form in packages containing not more than 84 mg of the drug and containing no other substance subject to the provisions of this section.

    (xv) Colestipol in powder form in packages containing not more than 5 grams of the drug and containing no other substance subject to the provisions of this section.

    (xvi) Erythromycin ethylsuccinate tablets in packages containing no more than the equivalent of 16 grams erythromycin.

    (xvii) Conjugated Estrogens Tablets, U.S.P., when dispensed in mnemonic packages containing not more than 32.0 mg of the drug and containing no other substances subject to this § 1700.14(a)(10).

    (xviii) Norethindrone Acetate Tablets, U.S.P., when dispensed in mnemonic packages containing not more than 50 mg of the drug and containing no other substances subject to this § 1700.14(a)(10).

    (xix) Medroxyprogesterone acetate tablets.

    (xx) Sacrosidase (sucrase) preparations in a solution of glycerol and water.

    (xxi) Hormone Replacement Therapy Products that rely solely upon the activity of one or more progestogen or estrogen substances.

    (xxii) Colesevelam hydrochloride in powder form in packages containing not more than 3.75 grams of the drug.

    (xxiii) Sevelamer carbonate in powder form in packages containing not more than 2.4 grams of the drug.

    (11)

    Ethylene glycol.

    Household substances in liquid form containing 10 percent or more by weight of ethylene glycol packaged on or after June 1, 1974, except those articles exempted by 16 CFR 1500.83, shall be packaged
    in accordance with the provisions of § 1700.15 (a) and (b).

    (12)

    Iron-containing drugs.

    With the exception of: (i) Animal feeds used as vehicles for the administration of drugs, and (ii) those preparations in which iron is present solely as a colorant, noninjectable animal and human drugs
    providing iron for therapeutic or prophylactic purposes, and containing a total amount of elemental iron, from any source, in a single package, equivalent to 250 mg or more elemental iron in a concentration
    of 0.025

    percent or more on a weight to volume basis for liquids and 0.025 percent or more on a weight to volume basis for liquids and 0.05 percent or more on a weight-to-weight basis for nonliquids (e.g., powders,
    granules, tablets, capsules, wafers, gels, viscous products, such as pastes and ointments, etc.) shall be packaged in accordance with the provisions of § 1700.15 (a), (b), and (c).

    (13)

    Dietary supplements containing iron.

    Dietary supplements, as defined in § 1700.1(a)(3), that contain an equivalent of 250 mg or more of elemental iron, from any source, in a single package in concentrations of 0.025 percent or more on
    a weight-to-volume basis for liquids and 0.05 percent or more on a weight-to-weight basis for nonliquids (e.g., powders, granules, tablets, capsules, wafers, gels, viscous products, such as pastes and
    ointments, etc.) shall be packaged in accordance with the provisions of § 1700.15 (a), (b), and (c), except for the following:

    (i) Preparations in which iron is present solely as a colorant; and

    (ii) Powdered preparations with no more than the equivalent of 0.12 percent weight-to-weight elemental iron.

    (14) [Reserved]

    (15)

    Solvents for paint or other similar surface-coating material.

    Prepackaged liquid solvents (such as removers, thinners, brush cleaners, etc.) for paints or other similar surface-coating materials (such as varnishes and lacquers), that contain 10 percent or more
    by weight of benzene (also known as benzol), toluene (also known as toluol), xylene (also known as xylol), petroleum distillates (such as gasoline, kerosene, mineral seal oil, mineral spirits, naphtha,
    and Stoddard solvent, etc.), or combinations thereof, and that have a viscosity of less than 100 Saybolt universal seconds at 100 °F., shall be packaged in accordance with the provisions of § 1700.15
    (a) and (b).

    (16)

    Acetaminophen.

    Preparations for human use in a dosage form intended for oral administration and containing in a single package a total of more than one gram acetaminophen shall be packaged in accordance with the provisions
    of § 1700.15 (a), (b), and (c), except the following—

    (i) Effervescent tablets or granules containing acetaminophen, provided the dry tablet or granules contain less than 15 percent acetaminophen, the tablet or granules have an oral LD-50 of 5 grams or
    greater per kilogram of body weight, and the tablet or granules contain no other substance subject to the provisions of this section.

    (ii) Unflavored acetaminophen-containing preparations in powder form (other than those intended for pediatric use) that are packaged in unit doses providing not more than 13 grains of acetaminophen
    per unit dose and that contain no other substance subject to this § 1700.14(a).

    (17)

    Diphenhydramine.

    Preparations for human use in a dosage form intended for oral administration and containing more than the equivalent of 66 mg diphenhydramine base in a single package shall be packaged in accordance
    with the provisions of § 1700.15 (a), (b), and (c), if packaged on or after February 11, 1985.

    (18)

    Glue removers containing acetonitrile.

    Household glue removers in a liquid form containing more than 500 mg of acetonitrile in a single container.

    (19)

    Permanent wave neutralizers containing sodium bromate or potassium bromate.

    Home permanent wave neutralizers, in a liquid form, containing in single container more than 600 mg of sodium bromate or more than 50 mg of potassium bromate.

    (20)

    Ibuprofen.

    Ibuprofen preparations for human use in a dosage form intended for oral administration and containing one gram (1,000 mg) or more of ibuprofen in a single package shall be packaged in accordance with
    the provisions of § 1700.15 (a), (b), and (c).

    (21)

    Loperamide.

