  text: '§ 1700.20

    Testing procedure for special packaging.

    (a)

    Test protocols

    —(1)

    General requirements

    —(i)

    Requirements for packaging.

    As specified in § 1700.15(b), special packaging is required to meet the child test requirements and the applicable adult test requirements of this § 1700.20.

    (ii)

    Condition of packages to be tested

    —(A)

    Tamper-resistant feature.

    Any tamper-resistant feature of the package to be tested shall be removed prior to testing unless it is part of the package''s child-resistant design. Where a package is supplied to the consumer in
    an outer package that is not part of the package''s child-resistant design, one of the following situations applies:

    (

    1

    ) In the child test, the package is removed from the outer package, and the outer package is not given to the child.

    (

    2

    ) In both the adult tests, if the outer package bears instructions for how to open or properly resecure the package, the package shall be given to the test subject in the outer package. The time required
    to remove the package from the outer package is not counted in the times allowed for attempting to open and, if appropriate, reclose the package.

    (

    3

    ) In both the adult tests, if the outer package does not bear any instructions relevant to the test, the package will be removed from the outer package, and the outer package will not be given to the
    test subject.

    (B)

    Reclosable packages—adult tests.

    In both the adult tests, reclosable packages, if assembled by the testing agency, shall be properly secured at least 72 hours prior to beginning the test to allow the materials (e.g., the closure liner)
    to “take a set.” If assembled by the testing agency, torque-dependent closures shall be secured at the same on-torque as applied on the packaging line. Application torques must be recorded in the test
    report. All packages shall be handled so that no damage or jarring will occur during storage or transportation. The packages shall not be exposed to extreme conditions of heat or cold. The packages
    shall be tested at room temperature.

    (2)

    Child test

