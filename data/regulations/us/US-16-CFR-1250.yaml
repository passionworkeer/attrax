articles:
- id: section-1250-2-a
  title: §1250.2(a) — Requirements for toy safety
  text: >-
    Each toy must comply with all applicable provisions of ASTM F963-23; the applicable edition depends on the manufacture date.
- id: cpsc-version-timeline
  title: CPSC toy guidance — ASTM F963 edition by manufacture date
  text: >-
    CPSC guidance states that toys manufactured after April 20, 2024 must meet ASTM F963-23, while toys manufactured after February 28, 2018 and on or before April 20, 2024 may be assessed against ASTM F963-17.
  source_url: https://www.cpsc.gov/Business--Manufacturing/Business-Education/Toy-Safety
