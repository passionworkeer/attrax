- id: art-18
  title: § 18.303
  text: '§ 18.303

    Prohibited frequency bands.

    Operation of ISM equipment within the following safety, search and rescue frequency bands is prohibited: 490-510 kHz, 2170-2194 kHz, 8354-8374 kHz, 121.4-121.6 MHz, 156.7-156.9 MHz, and 242.8-243.2
    MHz.'
