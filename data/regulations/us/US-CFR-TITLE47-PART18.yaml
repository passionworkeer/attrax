- id: art-22
  title: § 18.311
  text: '§ 18.311

    Methods of measurement.

    The measurement techniques used to determine compliance with the technical requirements of this part are set out in FCC MP-5, “FCC Methods of Measurements of Radio Noise Emissions from Industrial, Scientific,
    and Medical equipment,” or compliance measurements made in accordance with the specific procedures otherwise authorized by the Commission.

    [82 FR 50835, Nov. 2, 2017]'
- id: art-23
  title: § 18.313
  text: '§ 18.313

    Radio frequency exposure requirements.

    Radio frequency devices operating under the provisions of this part are subject to the radio frequency radiation exposure requirements specified in §§ 1.1307(b), 1.1310, 2.1091, and 2.1093 of this chapter,
    as appropriate.

    [85 FR 18150, Apr. 1, 2020]'
