  title: Children's Online Privacy Protection Rule ("COPPA") | Federa
  text: "Children's Online Privacy Protection Rule (\"COPPA\") | Federal Trade Commission\nSkip to main content\nAn official website of the United States government\nHere’s how you know\nHere's how you\
    \ know\nThe .gov means it’s official.\n                Federal government websites often end in .gov or .mil. Before sharing sensitive information, make sure you’re on a federal government site.\nThe\
    \ site is secure.\n                The \nhttps://\n ensures that you are connecting to the official website and that any information you provide is encrypted and transmitted securely.\nEspañol\nMenu\n\
    Children's Online Privacy Protection Rule (\"COPPA\")\nTags:\nConsumer Protection\nPrivacy and Security\nChildren's Privacy\n16 CFR Part 312\nChildren's Online  Privacy Protection Act of 1998, 15 U.S.C.\
    \ 6501–6505\nChildren's Privacy\nRule Summary\nCOPPA imposes certain requirements on operators of websites or online services directed to children under 13 years of age, and on operators of other websites\
    \ or online services that have actual knowledge that they are collecting personal information online from a child under 13 years of age.\nText of Rule\nFederal Register Notices\nAgency Information Collection\
    \ Activities; Proposed Collection; Comment Request (COPPA Rule)\n(\nOctober 2, 2018\n)\n16 CFR Part 312: Children’s Online Privacy Protection Rule Safe Harbor Proposed Self-Regulatory Guidelines; Entertainment\
    \ Software Rating Board’s COPPA Safe Harbor Program Application to Modify Program Requirements Federal Register Notice\n(\nApril 5, 2018\n)\n16 CFR Part 312: Children’s Online Privacy Protection Rule\
    \ Proposed Parental Consent Method; Jest8 Limited, Trading as Riyo, Application for Approval of Parental Consent Method\n(\nAugust 7, 2015\n)\nChildren's Online Privacy Protection Rule: Final Rule Amendments\
    \ To Clarify the Scope of the Rule and Strengthen Its Protections For Children's Personal Information; 16 C.F.R. Part 312\n(\nJanuary 17, 2013\n)\nChildren's Online Privacy Protection Rule: Supplemental\
    \ Notice of Proposed Rulemaking and Request For Comment - Proposal To Modify Certain Proposed Definitions, 16 C.F.R. Part 312\n(\nAugust 6, 2012\n)\n16 C.F.R. Part 312: Children's Online Privacy Protection\
    \ Rule: Proposed Rule; Request for Comment on Proposal to Amend Rule to Respond to Changes in Online Technology\n(\nSeptember 27, 2011\n)\nRequest for Public Comment on the Federal Trade Commission's\
    \ Implementation of the Children's Online Privacy Protection Rule - 16 CFR Part 312\n(\nApril 5, 2010\n)\nRequest for Public Comment on the Federal Trade Commission's Implementation of the Rule, 75\
    \ FR 17089\n(\nApril 5, 2010\n)\nChildren's Online Privacy Protection Rule - 16 CFR Part 312\n(\nApril 22, 2005\n)\nChildren's Online Privacy Protection Rule: Request for Comments - 16 CFR Part 312\n\
    (\nApril 22, 2005\n)\nChildren's Online Privacy Protection Rule - 16 CFR Part 312\n(\nJanuary 14, 2005\n)\nChildren's Online Privacy Protection Rule - 16 CFR Part 312\n(\nApril 17, 2002\n)\nChildren's\
    \ Online Privacy Protection Rule - 16 CFR Part 312\n(\nNovember 3, 1999\n)\nChildren's Online Privacy Protection Rule - 16 CFR Part 312\n(\nJuly 27, 1999\n)\nChildren's Online Privacy Protection Rule\
    \ - 16 CFR Part 312\n(\nApril 27, 1999\n)\nPress Releases\nFTC Issues COPPA Policy Statement to Incentivize the Use of Age Verification Technologies to Protect Children Online\n(February 25, 2026)\n\
    FTC Extends Deadline for Comments on COPPA Rule until December 11\n(December 9, 2019)\nFTC Extends Deadline for Comments on COPPA Rule until December 9\n(October 17, 2019)\nFTC Seeks Comments on Children’s\
    \ Online Privacy Protection Act Rule\n(July 25, 2019)\nFTC Seeks Comment on Proposed Modifications to Video Game Industry Self-Regulatory Program Approved under the COPPA Safe Harbor Program\n(April\
    \ 2, 2018)\nFTC Seeks Public Comment on Riyo Proposal for Parental Verification Method Under COPPA Rule\n(July 31, 2015)\nFTC Approves iKeepSafe COPPA “Safe Harbor” Oversight Program\n(August 6, 2014)\n\
