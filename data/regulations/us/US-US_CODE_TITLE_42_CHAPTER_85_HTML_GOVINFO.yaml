    Statutory Notes and Related Subsidiaries


    Effective Date of 1990 Amendment


    Pub. L. 101–549, title VII, §711(b), Nov. 15, 1990, 104 Stat. 2684, provided that:


    "(1) Except as otherwise expressly provided, the amendments made by this Act [see Tables for classification] shall be effective on the date of enactment of this Act [Nov. 15, 1990].


    "(2) The Administrator''s authority to assess civil penalties under section 205(c) of the Clean Air Act [42 U.S.C. 7524(c)], as amended by this Act, shall apply to violations that occur or continue
    on or after the date of enactment of this Act. Civil penalties for violations that occur prior to such date and do not continue after such date shall be assessed in accordance with the provisions of
    the Clean Air Act [42 U.S.C. 7401 et seq.] in effect immediately prior to the date of enactment of this Act.


    "(3) The civil penalties prescribed under sections 205(a) and 211(d)(1) of the Clean Air Act [42 U.S.C. 7524(a), 7545(d)(1)], as amended by this Act, shall apply to violations that occur on or after
    the date of enactment of this Act. Violations that occur prior to such date shall be subject to the civil penalty provisions prescribed in sections 205(a) and 211(d) of the Clean Air Act in effect immediately
    prior to the enactment of this Act. The injunctive authority prescribed under section 211(d)(2) of the Clean Air Act, as amended by this Act, shall apply to violations that occur or continue on or after
    the date of enactment of this Act.


    "(4) For purposes of paragraphs (2) and (3), where the date of a violation cannot be determined it will be assumed to be the date on which the violation is discovered."


    Effective Date of 1977 Amendment; Pending Actions; Continuation of Rules, Contracts, Authorizations, Etc.; Implementation Plans


    Pub. L. 95–95, title IV, §406, Aug. 7, 1977, 91 Stat. 795, as amended by Pub. L. 95–190, §14(b)(6), Nov. 16, 1977, 91 Stat. 1405, provided that:


    "(a) No suit, action, or other proceeding lawfully commenced by or against the Administrator or any other officer or employee of the United States in his official capacity or in relation to the discharge
    of his official duties under the Clean Air Act [this chapter], as in effect immediately prior to the date of enactment of this Act [Aug. 7, 1977] shall abate by reason of the taking effect of the amendments
    made by this Act [see Short Title of 1977 Amendment note below]. The court may, on its own motion or that of any party made at any time within twelve months after such taking effect, allow the same
    to be maintained by or against the Administrator or such officer or employee.


    "(b) All rules, regulations, orders, determinations, contracts, certifications, authorizations, delegations, or other actions duly issued, made, or taken by or pursuant to the Clean Air Act [this chapter],
    as in effect immediately prior to the date of enactment of this Act [Aug. 7, 1977], and pertaining to any functions, powers, requirements, and duties under the Clean Air Act, as in effect immediately
    prior to the date of enactment of this Act, and not suspended by the Administrator or the courts, shall continue in full force and effect after the date of enactment of this Act until modified or rescinded
    in accordance with the Clean Air Act as amended by this Act [see Short Title of 1977 Amendment note below].


    "(c) Nothing in this Act [see Short Title of 1977 Amendment note below] nor any action taken pursuant to this Act shall in any way affect any requirement of an approved implementation plan in effect
    under section 110 of the Clean Air Act [section 7410 of this title] or any other provision of the Act in effect under the Clean Air Act before the date of enactment of this section [Aug. 7, 1977] until
    modified or rescinded in accordance with the Clean Air Act [this chapter] as amended by this Act [see Short Title of 1977 Amendment note below].


    "(d)(1) Except as otherwise expressly provided, the amendments made by this Act [see Short Title of 1977 Amendment note below] shall be effective on date of enactment [Aug. 7, 1977].


    "(2) Except as otherwise expressly provided, each State required to revise its applicable implementation plan by reason of any amendment made by this Act [see Short Title of 1977 Amendment note below]
    shall adopt and submit to the Administrator of the Environmental Protection Administration such plan revision before the later of the date—


    "(A) one year after the date of enactment of this Act [Aug. 7, 1977], or


    "(B) nine months after the date of promulgation by the Administrator of the Environmental Protection Administration of any regulations under an amendment made by this Act which are necessary for the
    approval of such plan revision."


