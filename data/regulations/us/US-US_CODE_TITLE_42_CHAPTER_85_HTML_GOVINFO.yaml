  title: §7403. Research, investigation, training, and other activities
  text: '§7403. Research, investigation, training, and other activities


    (a) Research and development program for prevention and control of air pollution


    The Administrator shall establish a national research and development program for the prevention and control of air pollution and as part of such program shall—


    (1) conduct, and promote the coordination and acceleration of, research, investigations, experiments, demonstrations, surveys, and studies relating to the causes, effects (including health and welfare
    effects), extent, prevention, and control of air pollution;


    (2) encourage, cooperate with, and render technical services and provide financial assistance to air pollution control agencies and other appropriate public or private agencies, institutions, and organizations,
    and individuals in the conduct of such activities;


    (3) conduct investigations and research and make surveys concerning any specific problem of air pollution in cooperation with any air pollution control agency with a view to recommending a solution
    of such problem, if he is requested to do so by such agency or if, in his judgment, such problem may affect any community or communities in a State other than that in which the source of the matter
    causing or contributing to the pollution is located;


    (4) establish technical advisory committees composed of recognized experts in various aspects of air pollution to assist in the examination and evaluation of research progress and proposals and to avoid
    duplication of research; and


    (5) conduct and promote coordination and acceleration of training for individuals relating to the causes, effects, extent, prevention, and control of air pollution.


    (b) Authorized activities of Administrator in establishing research and development program


    In carrying out the provisions of the preceding subsection the Administrator is authorized to—


    (1) collect and make available, through publications and other appropriate means, the results of and other information, including appropriate recommendations by him in connection therewith, pertaining
    to such research and other activities;


    (2) cooperate with other Federal departments and agencies, with air pollution control agencies, with other public and private agencies, institutions, and organizations, and with any industries involved,
    in the preparation and conduct of such research and other activities;


    (3) make grants to air pollution control agencies, to other public or nonprofit private agencies, institutions, and organizations, and to individuals, for purposes stated in subsection (a)(1) of this
    section;


    (4) contract with public or private agencies, institutions, and organizations, and with individuals, without regard to section 3324(a) and (b) of title 31 and section 6101 of title 41;


    (5) establish and maintain research fellowships, in the Environmental Protection Agency and at public or nonprofit private educational institutions or research organizations;


    (6) collect and disseminate, in cooperation with other Federal departments and agencies, and with other public or private agencies, institutions, and organizations having related responsibilities, basic
    data on chemical, physical, and biological effects of varying air quality and other information pertaining to air pollution and the prevention and control thereof;


    (7) develop effective and practical processes, methods, and prototype devices for the prevention or control of air pollution; and


    (8) construct facilities, provide equipment, and employ staff as necessary to carry out this chapter.


    In carrying out the provisions of subsection (a), the Administrator shall provide training for, and make training grants to, personnel of air pollution control agencies and other persons with suitable
    qualifications and make grants to such agencies, to other public or nonprofit private agencies, institutions, and organizations for the purposes stated in subsection (a)(5). Reasonable fees may be charged
    for such training provided to persons other than personnel of air pollution control agencies but such training shall be provided to such personnel of air pollution control agencies without charge.


    (c) Air pollutant monitoring, analysis, modeling, and inventory research


    In carrying out subsection (a), the Administrator shall conduct a program of research, testing, and development of methods for sampling, measurement, monitoring, analysis, and modeling of air pollutants.
    Such program shall include the following elements:


    (1) Consideration of individual, as well as complex mixtures of, air pollutants and their chemical transformations in the atmosphere.


    (2) Establishment of a national network to monitor, collect, and compile data with quantification of certainty in the status and trends of air emissions, deposition, air quality, surface water quality,
    forest condition, and visibility impairment, and to ensure the comparability of air quality data collected in different States and obtained from different nations.


    (3) Development of improved methods and technologies for sampling, measurement, monitoring, analysis, and modeling to increase understanding of the sources of ozone precursors, ozone formation, ozone
    transport, regional influences on urban ozone, regional ozone trends, and interactions of ozone with other pollutants. Emphasis shall be placed on those techniques which—


    (A) improve the ability to inventory emissions of volatile organic compounds and nitrogen oxides that contribute to urban air pollution, including anthropogenic and natural sources;


    (B) improve the understanding of the mechanism through which anthropogenic and biogenic volatile organic compounds react to form ozone and other oxidants; and


    (C) improve the ability to identify and evaluate region-specific prevention and control options for ozone pollution.


    (4) Submission of periodic reports to the Congress, not less than once every 5 years, which evaluate and assess the effectiveness of air pollution control regulations and programs using monitoring and
    modeling data obtained pursuant to this subsection.


    (d) Environmental health effects research


    (1) The Administrator, in consultation with the Secretary of Health and Human Services, shall conduct a research program on the short-term and long-term effects of air pollutants, including wood smoke,
    on human health. In conducting such research program the Administrator—


    (A) shall conduct studies, including epidemiological, clinical, and laboratory and field studies, as necessary to identify and evaluate exposure to and effects of air pollutants on human health;


    (B) may utilize, on a reimbursable basis, the facilities of existing Federal scientific laboratories and research centers; and


    (C) shall consult with other Federal agencies to ensure that similar research being conducted in other agencies is coordinated to avoid duplication.


    (2) In conducting the research program under this subsection, the Administrator shall develop methods and techniques necessary to identify and assess the risks to human health from both routine and
