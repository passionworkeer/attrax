- id: art-4
  title: §7401. Congressional findings and declaration of purpose
  text: '§7401. Congressional findings and declaration of purpose


    (a) Findings


    The Congress finds—


    (1) that the predominant part of the Nation''s population is located in its rapidly expanding metropolitan and other urban areas, which generally cross the boundary lines of local jurisdictions and
    often extend into two or more States;


    (2) that the growth in the amount and complexity of air pollution brought about by urbanization, industrial development, and the increasing use of motor vehicles, has resulted

    in mounting dangers to the public health and welfare, including injury to agricultural crops and livestock, damage to and the deterioration of property, and hazards to air and ground transportation;


    (3) that air pollution prevention (that is, the reduction or elimination, through any measures, of the amount of pollutants produced or created at the source) and air pollution control at its source
    is the primary responsibility of States and local governments; and


    (4) that Federal financial assistance and leadership is essential for the development of cooperative Federal, State, regional, and local programs to prevent and control air pollution.


    (b) Declaration


    The purposes of this subchapter are—


    (1) to protect and enhance the quality of the Nation''s air resources so as to promote the public health and welfare and the productive capacity of its population;


    (2) to initiate and accelerate a national research and development program to achieve the prevention and control of air pollution;


    (3) to provide technical and financial assistance to State and local governments in connection with the development and execution of their air pollution prevention and control programs; and


    (4) to encourage and assist the development and operation of regional air pollution prevention and control programs.


    (c) Pollution prevention


    A primary goal of this chapter is to encourage or otherwise promote reasonable Federal, State, and local governmental actions, consistent with the provisions of this chapter, for pollution prevention.


    (July 14, 1955, ch. 360, title I, §101, formerly §1, as added Pub. L. 88–206, §1, Dec. 17, 1963, 77 Stat. 392; renumbered §101 and amended Pub. L. 89–272, title I, §101(2), (3), Oct. 20, 1965, 79 Stat.
    992; Pub. L. 90–148, §2, Nov. 21, 1967, 81 Stat. 485; Pub. L. 101–549, title I, §108(k), Nov. 15, 1990, 104 Stat. 2468.)


