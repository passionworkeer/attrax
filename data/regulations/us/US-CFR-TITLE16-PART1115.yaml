    Subpart A—General Interpretation'
- id: art-2
  title: § 1115.1
  text: '§ 1115.1

    Purpose.

    The purpose of this part 1115 is to set forth the Consumer Product Safety Commission''s (Commission''s) interpretation of the reporting requirements imposed on manufacturers (including importers), distributors,
    and retailers by section 15(b) of the Consumer Product Safety Act, as amended (CPSA) (15 U.S.C. 2064(b)) and to indicate the actions and sanctions which the Commission may require or impose to protect
    the public from substantial product hazards, as that term is defined in section 15(a) of the CPSA.'
- id: art-3
  title: § 1115.2
  text: '§ 1115.2

    Scope and finding.

    (a) Section 15(a) of the CPSA (15 U.S.C. 2064(a)) defines

    substantial product hazard

    as either:

    (1) A failure to comply with an applicable consumer product safety rule, which failure creates a substantial risk of injury to the public, or

    (2) A product defect which (because of the pattern of defect, the number of defective products distributed in commerce, the severity of the risk, or otherwise) creates a substantial risk of injury to
    the public.

    (b) Section 15(b) of the CPSA requires every manufacturer (including an importer), distributor, and retailer of a consumer product distributed in commerce who obtains information which reasonably supports
    the conclusion that the product fails to comply with an applicable consumer product safety rule, fails to comply with a voluntary consumer product safety standard upon which the Commission has relied
    under section 9 of the CPSA, contains a defect which could create a substantial product hazard described in subsection 15(a)(2) of the CPSA, or creates an unreasonable risk of serious injury or death,
    immediately to inform the Commission, unless the manufacturer (including an importer), distributor or retailer has actual knowledge that the Commission has been adequately informed of such failure to
    comply, defect, or risk. This provision indicates that a broad spectrum of safety related information should be reported under section 15(b) of the CPSA.

    (c) Sections 15 (c) and (d) of the CPSA, (15 U.S.C. 2064(c) and (d)), empower the Commission to order a manufacturer (including an importer), distributor, or retailer of a consumer product distributed
    in commerce that presents a substantial product hazard to give various forms of notice to the public of the defect or the failure to comply and/or to order the subject firm to elect either to repair,
    to replace, or to refund the purchase price of such product. However, information which should be reported under section 15(b) of the CPSA does not automatically indicate the presence of a substantial
    product hazard, because what must be reported under section 15(b) are failures to comply with consumer product safety rules or voluntary standards upon which the Commission has relied under section
    9, defects that could create a substantial product hazard, and

    products which create an unreasonable risk of serious injury or death. (See § 1115.12.)

    (d) The provisions of this part 1115 deal with all consumer products (including imports) subject to regulation under the Consumer Product Safety Act, as amended (15 U.S.C. 2051-2081) (CPSA), and the
    Refrigerator Safety Act (15 U.S.C. 1211-1214) (RSA). In addition, the Commission has found that risks of injury to the public from consumer products subject to regulation under the Flammable Fabrics
    Act (15 U.S.C. 1191-1204) (FFA), the Federal Hazardous Substances Act (15 U.S.C. 1261-1274) (FHSA), and the Poison Prevention Packaging Act of 1970 (15 U.S.C. 1471-1476) (PPPA) cannot be eliminated
    or reduced to a sufficient extent in a timely fashion under those acts. Therefore, pursuant to section 30(d) of the CPSA (15 U.S.C. 2079(d)), manufacturers (including importers), distributors, and retailers
    of consumer products which are subject to regulation under provisions of the FFA, FHSA, and PPPA must comply with the reporting requirements of section 15(b).

    [43 FR 34998, Aug. 7, 1978, as amended at 57 FR 34227, Aug. 4, 1992]'
- id: art-4
  title: § 1115.3
  text: '§ 1115.3

    Definitions.

    In addition to the definitions given in section 3 of the CPSA (15 U.S.C. 2052), the following definitions apply:

    (a)

    Adequately informed

    under section 15(b) of the CPSA means that the Commission staff has received the information requested under §§ 1115.12 and/or 1115.13 of this part insofar as it is reasonably available and applicable
    or that the staff has informed the subject firm that the staff is adequately informed.

    (b)

    Commission meeting

    means the joint deliberations of at least a majority of the Commission where such deliberations determine or result in the conduct or disposition of official Commission business. This term is synonymous
    with “Commission meeting” as defined in the Commission''s regulation issued under the Government in the Sunshine Act, 16 CFR part 1012.

    (c)

    Noncompliance

    means the failure of a consumer product to comply with an applicable consumer product safety rule or with a voluntary consumer product safety standard upon which the Commission has relied under section
    9 of the CPSA.

    (d) A

    person

    means a corporation, company, association, firm, partnership, society, joint stock company, or individual.

    (e)

    Staff

    means the staff of the Consumer Product Safety Commission unless otherwise stated.

    (f)

    Subject firm

    means any manufacturer (including an importer), distributor, or retailer of a consumer product.

    [43 FR 34998, Aug. 7, 1978, as amended at 57 FR 34227, Aug. 4, 1992]'
- id: art-5
  title: § 1115.4
  text: '§ 1115.4

    Defect.'
- id: art-6
  title: 'Section 15(b)(2) of the CPSA requires every manufacturer (including an importer), distributor, and retailer of a consumer product who obtains information which reasonably supports the conclusion
    that '
  text: 'Section 15(b)(2) of the CPSA requires every manufacturer (including an importer), distributor, and retailer of a consumer product who obtains information which reasonably supports the conclusion
    that the product contains a defect which could create a substantial product hazard to inform the Commission of such defect. Thus, whether the information available reasonably suggests a defect is the
    first determination which a subject firm must make in deciding whether it has obtained information which must be reported to the Commission. In determining whether it has obtained information which
    reasonably supports the conclusion that its consumer product contains a defect, a subject firm may be guided by the criteria the Commission and staff use in determining whether a defect exists. At a
    minimum, defect includes the dictionary or commonly accepted meaning of the word. Thus, a defect is a fault, flaw, or irregularity that causes weakness, failure, or inadequacy in form or function. A
    defect, for example, may be the result of a manufacturing or production error; that is, the consumer product as manufactured is not in the form intended by, or fails to perform in accordance with, its
    design. In addition, the design of and the materials used in a consumer product may also result in a defect. Thus, a product may contain a defect even if the product is manufactured exactly in accordance
    with its design and specifications, if the design presents a risk of injury to the public. A design defect may also

    be present if the risk of injury occurs as a result of the operation or use of the product or the failure of the product to operate as intended. A defect can also occur in a product''s contents, construction,
    finish, packaging, warnings, and/or instructions. With respect to instructions, a consumer product may contain a defect if the instructions for assembly or use could allow the product, otherwise safely
    designed and manufactured, to present a risk of injury. To assist subject firms in understanding the concept of defect as used in the CPSA, the following examples are offered:

    (a) An electric appliance presents a shock hazard because, through a manufacturing error, its casing can be electrically charged by full-line voltage. This product contains a defect as a result of manufacturing
    or production error.

    (b) Shoes labeled and marketed for long-distance running are so designed that they might cause or contribute to the causing of muscle or tendon injury if used for long-distance running. The shoes are
    defective due to the labeling and marketing.

    (c) A kite made of electrically conductive material presents a risk of electrocution if it is long enough to become entangled in power lines and be within reach from the ground. The electrically conductive
    material contributes both to the beauty of the kite and the hazard it presents. The kite contains a design defect.

    (d) A power tool is not accompanied by adequate instructions and safety warnings. Reasonably foreseeable consumer use or misuse, based in part on the lack of adequate instructions and safety warnings,
    could result in injury. Although there are no reports of injury, the product contains a defect because of the inadequate warnings and instructions.

    (e) An exhaust fan for home garages is advertised as activating when carbon monoxide fumes reach a dangerous level but does not exhaust when fumes have reached the dangerous level. Although the cause
    of the failure to exhaust is not known, the exhaust fan is defective because users rely on the fan to remove the fumes and the fan does not do so.

    However, not all products which present a risk of injury are defective. For example, a knife has a sharp blade and is capable of seriously injuring someone. This very sharpness, how- ever, is necessary
    if the knife is to function adequately. The knife does not contain a defect insofar as the sharpness of its blade is concerned, despite its potential for causing injury, because the risk of injury is
    outweighed by the usefulness of the product which is made possible by the same aspect which presents the risk of injury. In determining whether the risk of injury associated with a product is the type
    of risk which will render the product defective, the Commission and staff will consider, as appropriate: The utility of the product involved; the nature of the risk of injury which the product presents;
    the necessity for the product; the population exposed to the product and its risk of injury; the obviousness of such risk; the adequacy of warnings and instructions to mitigate such risk; the role of
    consumer misuse of the product and the foreseeability of such misuse; the Commission''s own experience and expertise; the case law interpreting Federal and State public health and safety statutes; the
    case law in the area of products liability; and other factors relevant to the determination. If the information available to a subject firm does not reasonably support the conclusion that a defect exists,
    the subject firm need not report. However, if the information does reasonably support the conclusion that a defect exists, the subject firm must then consider whether that defect could create a substantial
    product hazard. (See § 1115.12(f) for factors to be assessed in determining whether a substantial product hazard could exist.) If the subject firm determines that the defect could create a substantial
    product hazard, the subject firm must report to the Commission. Most defects could present a substantial product hazard if the public is exposed to significant numbers of defective products or if the
    possible injury is serious or is likely to occur. Since the extent of public exposure and/or the likelihood or seriousness of injury are ordinarily not known at the time a defect first manifests itself,
    subject firms are

    urged to report if in doubt as to whether a defect could present a substantial product hazard. On a case-by-case basis the Commission and the staff will determine whether a defect within the meaning
    of section 15 of the CPSA does, in fact, exist and whether that defect presents a substantial product hazard. Since a consumer product may be defective even if it is designed, manufactured, and marketed
    exactly as intended by a subject firm, subject firms should report if in doubt as to whether a defect exists. Defect, as discussed in this section and as used by the Commission and staff, pertains only
    to interpreting and enforcing the Consumer Product Safety Act. The criteria and discussion in this section are not intended to apply to any other area of the law.

    [43 FR 34998, Aug. 7, 1978, as amended at 71 FR 42030, July 25, 2006]'
- id: art-7
  title: § 1115.5
  text: '§ 1115.5

    Reporting of failures to comply with a voluntary consumer product safety standard relied upon by the Commission under section 9 of the CPSA.

    (a)

    General provision.

    Under the CPSA, the Commission may rely on voluntary standards in lieu of developing mandatory ones. In recognition of the role of voluntary standards under the CPSA, section 15(b)(1) requires reports
    if a product fails to comply with a voluntary standard “upon which the Commission has relied under section 9” of the CPSA. The Commission has relied upon a voluntary consumer product safety standard
    under section 9 of the CPSA if, since August 13, 1981 it has terminated a rulemaking proceeding or withdrawn an existing consumer product safety rule because it explicitly determined that an existing
    voluntary standard, or portion(s) thereof, is likely to result in an adequate reduction of the risk of injury and it is likely there will be substantial compliance with that voluntary standard. (See
    appendix to this part 1115 for a list of such voluntary standards.) This provision applies only when the Commission relies upon a voluntary standard in a rulemaking proceeding under section 9 of the
    CPSA. In evaluating whether or not to rely upon an existing voluntary standard, the Commission shall adhere to all the procedural safeguards currently required under the provisions of the CPSA, including
    publication in the

    Federal Register

    of the Commission''s intent to rely upon a voluntary standard in order to provide the public with a fair opportunity to comment upon such proposed action.

    (b)

    Reporting requirement.

    A firm must report under this section if it has distributed in commerce, subsequent to the effective date of the Consumer Product Safety Improvement Act of 1990 (November 16, 1990), a product that does
    not conform to a voluntary standard or portion(s) of a voluntary standard relied upon by the Commission since August 13, 1981. If the Commission relied upon only a portion(s) of a voluntary standard,
    a firm must report under this section only nonconformance with the portion(s) of the voluntary standard relied upon by the Commission. Pursuant to section 7(b)(2) of the CPSA, the Commission shall monitor
    any modifications of a voluntary standard upon which it has relied and determine, as a matter of policy, at the time any substantive safety related modification is adopted, whether it shall continue
    to rely upon the former standard or whether it shall rely, subsequently, upon the modified standard. The Commission shall publish such decisions in the

    Federal Register.

    Until the Commission makes such a decision, subject firms need not report under this provision a product which complies with either the original version of the voluntary standard relied upon by the
    Commission or the new version of the standard. A firm must continue to evaluate whether deviations from other portions of a voluntary standard, or other voluntary standards not relied upon by the Commission,
    either constitute a defect which could create a substantial product hazard or create an unreasonable risk of serious injury or death.

    [57 FR 34228, Aug. 4, 1992; 57 FR 39597, Sept. 1, 1992]'
- id: art-8
  title: § 1115.6
  text: '§ 1115.6

    Reporting of unreasonable risk of serious injury or death.

    (a)

    General provision.

    Every manufacturer, distributor, and retailer of a consumer product distributed in commerce

    who obtains information which reasonably supports the conclusion that its product creates an unreasonable risk of serious injury or death is required to notify the Commission immediately. 15 U.S.C.
    2064(b)(3). The requirement that notification occur when a responsible party “obtains information which reasonably supports the conclusion that” its product creates an unreasonable risk of serious injury
    or death is intended to require firms to report even when no final determination of the risk is possible. Firms must carefully analyze the information they obtain to determine whether such information
    “reasonably supports” a determination that the product creates an unreasonable risk of serious injury or death. (See § 1115.12(f) for a discussion of the kinds of information that firms must study and
    evaluate to determine whether they have an obligation to report.) Firms that obtain information indicating that their products present an unreasonable risk of serious injury or death should not wait
    for such serious injury or death to actually occur before reporting. Such information can include reports from experts, test reports, product liability lawsuits or claims, consumer or customer complaints,
    quality control data, scientific or epidemiological studies, reports of injury, information from other firms or governmental entities, and other relevant information. While such information shall not
    trigger a

    per se

    reporting requirement, in its evaluation of whether a subject firm is required to file a report under the provisions of section 15 of the CPSA, the Commission shall attach considerable significance
    if such firm learns that a court or jury has determined that one of its products has caused a serious injury or death and a reasonable person could conclude based on the lawsuit and other information
    obtained by the firm that the product creates an unreasonable risk of serious injury or death.

    (b)

    Unreasonable risk.

    The use of the term “unreasonable risk” suggests that the risk of injury presented by a product should be evaluated to determine if that risk is a reasonable one. In determining whether a product presents
    an unreasonable risk, the firm should examine the utility of the product, or the utility of the aspect of the product that causes the risk, the level of exposure of consumers to the risk, the nature
    and severity of the hazard presented, and the likelihood of resulting serious injury or death. In its analysis, the firm should also evaluate the state of the manufacturing or scientific art, the availability
    of alternative designs or products, and the feasibility of eliminating the risk. The Commission expects firms to report if a reasonable person could conclude given the information available that a product
    creates an unreasonable risk of serious injury or death. In its evaluation of whether a subject firm is required to file a report under the provisions of section 15 of the CPSA the Commission shall,
    as a practical matter, attach considerable significance if such firm obtains information which reasonably supports the conclusion that its product violates a standard or ban promulgated under the FHSA,
    FFA, PPPA or RSA and the violation could result in serious injury or death.

    (c)

    Serious injury or death.

    The term “serious injury” is not defined in the CPSA. The Commission believes that the term includes not only the concept of “grievous bodily injury,” defined at § 1115.12(d), but also any other significant
    injury. Injuries necessitating hospitalization which require actual medical or surgical treatment, fractures, lacerations requiring sutures, concussions, injuries to the eye, ear, or internal organs
    requiring medical treatment, and injuries necessitating absence from school or work of more than one day are examples of situations in which the Commission shall presume that such a serious injury has
    occurred. To determine whether an unreasonable risk of serious injury or death exists, the firm should evaluate chronic or long term health effects as well as immediate injuries.

    [57 FR 34228, Aug. 4, 1992]'
- id: art-9
  title: § 1115.7
  text: '§ 1115.7

    Relation to other provisions.

    The reporting requirements of section 37 of the CPSA (15 U.S.C. 2084) are in addition to the requirement in section 15 of the CPSA. Section 37 requires a product manufacturer to report certain kinds
    of lawsuit information. It is

    intended as a supplement to, not a substitute for, the requirements of section 15(b) of the CPSA. Whether or not a firm has an obligation to provide information under section 37, it must consider whether
    it has obtained information which reasonably supports the conclusion that its product violates a consumer product safety rule, does not comply with a voluntary safety standard upon which the Commission
    has relied under section 9, contains a defect which could create a substantial product hazard, or creates an unreasonable risk of serious injury or death. If a firm has obtained such information, it
    must report under section 15(b) of the CPSA, whether or not it is required to report under section 37. Further, in many cases the Commission would expect to receive reports under section 15(b) long
    before the obligation to report under section 37 arises since firms have frequently obtained reportable information before settlements or judgments in their product liability lawsuits.

    [57 FR 34229, Aug. 4, 1992]'
- id: art-10
  title: § 1115.8
  text: '§ 1115.8

    Compliance with product safety standards.

    (a)

    Voluntary standards.

    The CPSA and other federal statutes administered by the Commission generally encourage the private sector development of, and compliance with voluntary consumer product safety standards to help protect
    the public from unreasonable risks of injury associated with consumer products. To support the development of such consensus standards, Commission staff participates in many voluntary standards committees
    and other activities. The Commission also strongly encourages all firms to comply with voluntary consumer product safety standards and considers, where appropriate, compliance or non-compliance with
    such standards in exercising its authorities under the CPSA and other federal statutes, including when making determinations under section 15 of the CPSA. Thus, for example, whether a product is in
    compliance with applicable voluntary safety standards may be relevant to the Commission staff''s preliminary determination of whether that product presents a substantial product hazard under section
    15 of the CPSA.

    (b)

    Mandatory standards.

    The CPSA requires that firms comply with all applicable mandatory consumer product safety standards and to report to the Commission any products which do not comply with either mandatory standards or
    voluntary standards upon which the Commission has relied. As is the case with voluntary consumer product safety standards, compliance or non-compliance with applicable mandatory safety standards may
    be considered by the Commission and staff in making relevant determinations and exercising relevant authorities under the CPSA and other federal statutes. Thus, for example, while compliance with a
    relevant mandatory product safety standard does not, of itself, relieve a firm from the need to report to the Commission a product defect that creates a substantial product hazard under section 15 of
    the CPSA, it will be considered by staff in making the determination of whether and what type of corrective action may be required.

    [71 FR 42030, July 25, 2006]'
- id: art-11
  title: § 1115.9
  text: '§ 1115.9

    [Reserved]'
- id: art-12
  title: § 1115.10
  text: '§ 1115.10

    Persons who must report and where to report.

    (a) Every manufacturer (including importer), distributor, or retailer of a consumer product that has been distributed in commerce who obtains information that such consumer product contains a defect
    which could create a substantial risk of injury to the public shall immediately notify the Office of Compliance, Division of Corrective Actions, Consumer Product Safety Commission, Washington, DC 20207
    (telephone: 301-504-0608), or such other persons as may be designated. Manufacturers (including importers), distributors, and retailers of consumer products subject to regulation by the Commission under
    provisions of the FFA, FHSA, PPPA, as well as consumer products subject to regulation under the CPSA and RSA, must comply with this requirement.

    (b) Every manufacturer (including importer), distributor, or retailer of a consumer product that has been distributed in commerce who obtains information that such consumer product

    fails to comply with an applicable consumer product safety standard or ban issued under the CPSA shall immediately notify the Commission''s Office of Compliance and Enforcement, Division of Corrective
    Actions or such other persons as may be designated. A subject firm need not report a failure to comply with a standard or regulation issued under the provisions of the RSA, FFA, FHSA, or PPPA unless
    it can be reasonably concluded that the failure to comply results in a defect which could create a substantial product hazard. (See paragraph (a) of this section.)

    (c) Every manufacturer (including importer), distributor, and retailer of a consumer product that has been distributed in commerce who obtains information that such consumer product fails to comply
    with a voluntary consumer product safety standard upon which the Commission has relied under section 9 of the CPSA, shall immediately notify the Commission''s Office of Compliance and Enforcement, Division
    of Corrective Actions or such other persons as may be designated.

    (d) Every manufacturer (including importer), distributor, and retailer of a consumer product that has been distributed in commerce who obtains information that such consumer product creates an unreasonable
    risk of serious injury or death shall immediately notify the Commission''s Office of Compliance and Enforcement, Division of Corrective Actions or such other persons as may be designated. This obligation
    applies to manufacturers, distributors and retailers of consumer products subject to regulation by the Commission under the Flammable Fabrics Act, Federal Hazardous Substances Act, Poison Prevention
    Packaging Act, and Refrigerator Safety Act as well as products subject to regulation under the CPSA.

    (e) A distributor or retailer of a consumer product (who is neither a manufacturer nor an importer of that product) is subject to the reporting requirements of section 15(b) of the CPSA but may satisfy
    them by following the procedure detailed in § 1115.13(b).

    (f) A manufacturer (including an importer), distributor, or retailer need not inform the Commission under section 15(b) of the CPSA if that person has actual knowledge that the Commission has been adequately
    informed of the defect or failure to comply. (See section 15(b) of the CPSA.)

    [43 FR 34998, Aug. 7, 1978, as amended at 57 FR 34229, Aug. 4, 1992; 62 FR 46667, Sept. 4, 1997]'
- id: art-13
  title: § 1115.11
  text: '§ 1115.11

    Imputed knowledge.

    (a) In evaluating whether or when a subject firm should have reported, the Commission will deem a subject firm to have obtained reportable information when the information has been received by an official
    or employee who may reasonably be expected to be capable of appreciating the significance of the information. (See § 1115.14(b).)

    (b) In evaluating whether or when a subject firm should have reported, the Commission will deem a subject firm to know what a reasonable person acting in the circumstances in which the firm finds itself
    would know. Thus, the subject firm shall be deemed to know what it would have known if it had exercised due care to ascertain the truth of complaints or other representations. This includes the knowledge
    a firm would have if it conducted a reasonably expeditious investigation in order to evaluate the reportability of a death or grievous bodily injury or other information. (See § 1115.14.)'
- id: art-14
  title: § 1115.12
  text: '§ 1115.12

    Information which should be reported; evaluating substantial product hazard.

    (a)

    General.

    Subject firms should not delay reporting in order to determine to a certainty the existence of a reportable noncompliance, defect or unreasonable risk. The obligation to report arises upon receipt of
    information from which one could reasonably conclude the existence of a reportable noncompliance, defect which could create a substantial product hazard, or unreasonable risk of serious injury or death.
    Thus, an obligation to report may arise when a subject firm received the first information regarding a potential hazard, noncompliance or risk. (See § 1115.14(c).) A subject firm in its report to the
    Commission need not admit, or may specifically deny, that the information it submits reasonably supports the conclusion that its consumer product is noncomplying, contains a defect

    which could create a substantial product hazard within the meaning of section 15(b) of the CPSA, or creates an unreasonable risk of serious injury or death. After receiving the report, the staff may
    conduct further investigation and will preliminarily determine whether the product reported upon presents a substantial product hazard. This determination can be based on information supplied by a subject
    firm or from any other source. If the matter is adjudicated, the Commission will ultimately make the decision as to substantial product hazard or will seek to have a court make the decision as to imminent
    product hazard.

    (b)

    Failure to comply.

    A subject firm must report information indicating that a consumer product which it has distributed in commerce does not comply with an applicable consumer product safety standard or ban issued under
    the CPSA, or a voluntary consumer product safety standard upon which the Commission has relied under section 9 of the CPSA.

    (c)

    Unreasonable risk of serious injury or death.

    A subject firm must report when it obtains information indicating that a consumer product which it has distributed in commerce creates an unreasonable risk of serious injury or death.

    (d)

    Death or grievous bodily injury.

    Information indicating that a noncompliance or a defect in a consumer product has caused, may have caused, or contributed to the causing, or could cause or contribute to the causing of a death or grievous
    bodily injury (e.g., mutilation, amputation/dismemberment, disfigurement, loss of important bodily functions, debilitating internal disorders, severe burns, severe electrical shocks, and injuries likely
    to require extended hospitalization) must be reported, unless the subject firm has investigated and determined that the information is not reportable.

    (e)

    Other information indicating a defect or noncompliance.

    Even if there are no reports of a potential for or an actual death or grievous bodily injury, other information may indicate a reportable defect or noncompliance. In evaluating whether or when a subject
