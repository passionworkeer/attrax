  text: '§ 170.3

    Definitions.

    For the purposes of this subchapter, the following definitions apply:

    (a)

    Secretary

    means the Secretary of Health and Human Services.

    (b)

    Department

    means the Department of Health and Human Services.

    (c)

    Commissioner

    means the Commissioner of Food and Drugs.

    (d) As used in this part, the term

    act

    means the Federal Food, Drug, and Cosmetic Act approved June 25, 1936, 52 Stat. 1040

    et seq.,

    as amended (21 U.S.C. 301-392).

    (e)(1)

    Food additives

    includes all substances not exempted by section 201(s) of the act, the intended use of which results or may reasonably be expected to result, directly or indirectly, either in their becoming a component
    of food or otherwise affecting the characteristics of food. A material used in the production of containers and packages is subject to the definition if it may reasonably be expected to become a component,
    or to affect the characteristics, directly or indirectly, of food packed in the container. “Affecting the characteristics of food” does not include such physical effects, as protecting contents of packages,
    preserving shape, and preventing moisture loss. If there is no migration of a packaging component from the package to the food, it does not become a component of the food and thus is not a food additive.
    A substance that does not become a component of food, but that is used, for example, in preparing an ingredient of the food to give a different flavor, texture, or other characteristic in the food,
    may be a food additive.

    (2)

    Uses of food additives not requiring a listing regulation.

    Use of a substance in a food contact article (e.g., food-packaging or food-processing equipment) whereby the substance migrates, or may reasonably be expected to migrate, into food at such levels that
    the use has been exempted from regulation as a food additive under § 170.39, and food contact substances used in accordance with a notification submitted under section 409(h) of the act that is effective.

    (3)

    A food contact substance

    is any substance that is intended for use as a component of materials used in manufacturing, packing, packaging, transporting, or holding food if such use is not intended to have any technical effect
    in such food.

    (f)

    Common use in food

    means a substantial history of consumption of a substance for food use by a significant number of consumers.

    (g) The word

    substance

    in the definition of the term “food additive” includes a food or food component consisting of one or more ingredients.

    (h)

    Scientific procedures

    include the application of scientific data (including, as appropriate, data from human, animal, analytical, or other scientific studies), information, and methods, whether published or unpublished,
    as well as the application of scientific principles, appropriate to establish the safety of a substance under the conditions of its intended use.

    (i)

    Safe

    or

    safety

    means that there is a reasonable certainty in the minds of competent scientists that the substance is not harmful under the conditions of its intended use. It is impossible in the present state of scientific
    knowledge to establish with complete certainty the absolute harmlessness of the use of any substance. Safety may be determined by scientific procedures or by general recognition of safety. In determining
    safety, the following factors shall be considered:

    (1) The probable consumption of the substance and of any substance formed in or on food because of its use.

    (2) The cumulative effect of the substance in the diet, taking into account any chemically or pharmacologically related substance or substances in such diet.

    (3) Safety factors which, in the opinion of experts qualified by scientific training and experience to evaluate the safety of food and food ingredients, are generally recognized as appropriate.

    (j) The term

    nonperishable processed food

    means any processed food not subject to rapid decay or deterioration that would render it unfit for consumption. Examples are flour, sugar, cereals, packaged cookies, and crackers. Not included are
    hermetically sealed foods or manufactured dairy products and other processed foods requiring refrigeration.

    (k)

    General recognition of safety

    shall be in accordance with § 170.30.

    (l)

    Prior sanction

    means an explicit approval granted with respect to use of a substance in food prior to September

    6, 1958, by the Food and Drug Administration or the United States Department of Agriculture pursuant to the Federal Food, Drug, and Cosmetic Act, the Poultry Products Inspection Act, or the Meat Inspection
    Act.

    (m)

    Food

    includes human food, substances migrating to food from food-contact articles, pet food, and animal feed.

    (n) The following general food categories are established to group specific related foods together for the purpose of establishing tolerances or limitations for the use of direct human food ingredients.
    Individual food products will be included within these categories according to the detailed classifications lists contained in Exhibit 33B of the report of the National Academy of Sciences/National
    Research Council report, “A Comprehensive Survey of Industry on the Use of Food Chemicals Generally Recognized as Safe” (September 1972), which is incorporated by reference. Copies are available from
    the National Technical Information Service (NTIS), 5285 Port Royal Rd., Springfield, VA 22161, or at the National Archives and Records Administration (NARA). For information on the availability of this
    material at NARA, call 202-741-6030, or go to:

    http://www.archives.gov/federal_register/code_of_federal_regulations/ibr_locations.html.

    (1) Baked goods and baking mixes, including all ready-to-eat and ready-to-bake products, flours, and mixes requiring preparation before serving.

    (2) Beverages, alcoholic, including malt beverages, wines, distilled liquors, and cocktail mix.

    (3) Beverages and beverage bases, nonalcoholic, including only special or spiced teas, soft drinks, coffee substitutes, and fruit and vegetable flavored gelatin drinks.

    (4) Breakfast cereals, including ready-to-eat and instant and regular hot cereals.

    (5) Cheeses, including curd and whey cheeses, cream, natural, grating, processed, spread, dip, and miscellaneous cheeses.

    (6) Chewing gum, including all forms.

    (7) Coffee and tea, including regular, decaffeinated, and instant types.

    (8) Condiments and relishes, including plain seasoning sauces and spreads, olives, pickles, and relishes, but not spices or herbs.

    (9) Confections and frostings, including candy and flavored frostings, marshmallows, baking chocolate, and brown, lump, rock, maple, powdered, and raw sugars.

    (10) Dairy product analogs, including nondairy milk, frozen or liquid creamers, coffee whiteners, toppings, and other nondairy products.

    (11) Egg products, including liquid, frozen, or dried eggs, and egg dishes made therefrom, i.e., egg roll, egg foo young, egg salad, and frozen multicourse egg meals, but not fresh eggs.

    (12) Fats and oils, including margarine, dressings for salads, butter, salad oils, shortenings and cooking oils.

    (13) Fish products, including all prepared main dishes, salads, appetizers, frozen multicourse meals, and spreads containing fish, shellfish, and other aquatic animals, but not fresh fish.

    (14) Fresh eggs, including cooked eggs and egg dishes made only from fresh shell eggs.

    (15) Fresh fish, including only fresh and frozen fish, shellfish, and other aquatic animals.

    (16) Fresh fruits and fruit juices, including only raw fruits, citrus, melons, and berries, and home-prepared “ades” and punches made therefrom.

    (17) Fresh meats, including only fresh or home-frozen beef or veal, pork, lamb or mutton and home-prepared fresh meat-containing dishes, salads, appetizers, or sandwich spreads made therefrom.

    (18) Fresh poultry, including only fresh or home-frozen poultry and game birds and home-prepared fresh poultry-containing dishes, salads, appetizers, or sandwich spreads made therefrom.

    (19) Fresh vegetables, tomatoes, and potatoes, including only fresh and home-prepared vegetables.

    (20) Frozen dairy desserts and mixes, including ice cream, ice milks, sherbets, and other frozen dairy desserts and specialties.

    (21) Fruit and water ices, including all frozen fruit and water ices.

    (22) Gelatins, puddings, and fillings, including flavored gelatin desserts,

    puddings, custards, parfaits, pie fillings, and gelatin base salads.

    (23) Grain products and pastas, including macaroni and noodle products, rice dishes, and frozen multicourse meals, without meat or vegetables.

    (24) Gravies and sauces, including all meat sauces and gravies, and tomato, milk, buttery, and specialty sauces.

    (25) Hard candy and cough drops, including all hard type candies.

    (26) Herbs, seeds, spices, seasonings, blends, extracts, and flavorings, including all natural and artificial spices, blends, and flavors.

    (27) Jams and jellies, home-prepared, including only home-prepared jams, jellies, fruit butters, preserves, and sweet spreads.

    (28) Jams and jellies, commercial, including only commercially processed jams, jellies, fruit butters, preserves, and sweet spreads.

    (29) Meat products, including all meats and meat containing dishes, salads, appetizers, frozen multicourse meat meals, and sandwich ingredients prepared by commercial processing or using commercially
    processed meats with home preparation.

    (30) Milk, whole and skim, including only whole, lowfat, and skim fluid milks.

    (31) Milk products, including flavored milks and milk drinks, dry milks, toppings, snack dips, spreads, weight control milk beverages, and other milk origin products.

    (32) Nuts and nut products, including whole or shelled tree nuts, peanuts, coconut, and nut and peanut spreads.

    (33) Plant protein products, including the National Academy of Sciences/National Research Council “reconstituted vegetable protein” category, and meat, poultry, and fish substitutes, analogs, and extender
    products made from plant proteins.

    (34) Poultry products, including all poultry and poultry-containing dishes, salads, appetizers, frozen multicourse poultry meals, and sandwich ingredients prepared by commercial processing or using
    commercially processed poultry with home preparation.

    (35) Processed fruits and fruit juices, including all commercially processed fruits, citrus, berries, and mixtures; salads, juices and juice punches, concentrates, dilutions, “ades”, and drink substitutes
    made therefrom.

    (36) Processed vegetables and vegetable juices, including all commercially processed vegetables, vegetable dishes, frozen multicourse vegetable meals, and vegetable juices and blends.

    (37) Snack foods, including chips, pretzels, and other novelty snacks.

    (38) Soft candy, including candy bars, chocolates, fudge, mints, and other chewy or nougat candies.

    (39) Soups, home-prepared, including meat, fish, poultry, vegetable, and combination home-prepared soups.

    (40) Soups and soup mixes, including commercially prepared meat, fish, poultry, vegetable, and combination soups and soup mixes.

    (41) Sugar, white, granulated, including only white granulated sugar.

    (42) Sugar substitutes, including granulated, liquid, and tablet sugar substitutes.

    (43) Sweet sauces, toppings, and syrups, including chocolate, berry, fruit, corn syrup, and maple sweet sauces and toppings.

    (o) The following terms describe the physical or technical functional effects for which direct human food ingredients may be added to foods. They are adopted from the National Academy of Sciences/National
    Research Council national survey of food industries, reported to the Food and Drug Administration under the contract title “A Comprehensive Survey of Industry on the Use of Food Chemicals Generally
    Recognized as Safe” (September 1972), which is incorporated by reference. Copies are available from the National Technical Information Service (NTIS), 5285 Port Royal Rd., Springfield, VA 22161, or
    at the National Archives and Records Administration (NARA). For information on the availability of this '
