  title: § 170.6
  text: '§ 170.6

    Opinion letters on food additive status.

    (a) Over the years the Food and Drug Administration has given informal written opinions to inquiries as to the safety of articles intended for use as components of, or in contact with, food. Prior to
    the enactment of the Food Additives Amendment of 1958 (Pub. L. 85-929; Sept. 6, 1958), these opinions were given pursuant to section 402(a)(1) of the Federal Food, Drug, and Cosmetic Act, which reads
    in part: “A food shall be deemed to be adulterated if it bears or contains any poisonous or deleterious substance which may render it injurious to health”.

    (b) Since enactment of the Food Additives Amendment, the Food and Drug Administration has advised such inquirers that an article:

    (1) Is a food additive within the meaning of section 201(s) of the act; or

    (2) Is generally recognized as safe (GRAS); or

    (3) Has prior sanction or approval under that amendment; or

    (4) Is not a food additive under the conditions of intended use.

    (c) In the interest of the public health, such articles which have been considered in the past by the Food and Drug Administration to be safe under the provisions of section 402(a)(1), or to be generally
    recognized as safe for their intended use, or to have prior sanction or approval, or not to be food additives under the conditions of intended use, must be reexamined in the light of current scientific
    information and current principles for evaluating the safety of food additives if their use is to be continued.

    (d) Because of the time span involved, copies of many of the letters in which the Food and Drug Administration has expressed an informal opinion concerning the status of such articles may no longer
    be in the file of the Food and Drug Administration. In the absence of information concerning the names and uses made of all the articles referred to in such letters, their safety of use cannot be reexamined.
    For this reason all food additive status opinions of the kind described in paragraph (c) of this section given by the Food and Drug Administration are hereby revoked.

    (e) The prior opinions of the kind described in paragraph (c) of this section will be replaced by qualified and current opinions if the recipient of each such letter forwards a copy of each to the Department
    of Health and Human Services, Food and Drug Administration, Center for Food Safety and Applied Nutrition, 5001 Campus Dr., College Park, MD 20740, along with a copy of his letter of inquiry, on or before
    July 23, 1970.

    (f) This section does not apply to food additive status opinion letters pertaining to articles that were considered by the Food and Drug Administration

    to be food additives nor to articles included in regulations in parts 170 through 189 of this chapter if the articles are used in accordance with the requirements of such regulations.

    [42 FR 14483, Mar. 15, 1977, as amended at 54 FR 24896, June 12, 1989; 81 FR 49896, July 29, 2016]'
- id: art-4
  title: § 170.10
  text: '§ 170.10

    Food additives in standardized foods.

    (a) The inclusion of food ingredients in parts 170 through 189 of this chapter does not imply that these ingredients may be used in standardized foods unless they are recognized as optional ingredients
    in applicable food standards. Where a petition is received for the issuance or amendment of a regulation establishing a definition and standard of identity for a food under section 401 of the Act, which
    proposes the inclusion of a food additive in such definition and standard of identity, the provisions of the regulations in this part shall apply with respect to the information that must be submitted
    with respect to the food additive. Since section 409(b)(5) of the Act requires that the Secretary publish notice of a petition for the establishment of a food-additive regulation within 30 days after
    filing, notice of a petition relating to a definition and standard of identity shall also be published within that time limitation if it includes a request, so designated, for the establishment of a
    regulation pertaining to a food additive.

    (b) If a petition for a definition and standard of identity contains a proposal for a food-additive regulation, and the petitioner fails to designate it as such, the Commissioner, upon determining that
    the petition includes a proposal for a food-additive regulation, shall so notify the petitioner and shall thereafter proceed in accordance with the regulations in this part.

    (c) A regulation will not be issued allowing the use of a food additive in a food for which a definition and standard of identity is established, unless its issuance is in conformity with section 401
    of the Act or with the terms of a temporary permit issued under § 130.17 of this chapter. When the contemplated use of such additive complies with the terms of a temporary permit, the food additive
    regulation will be conditioned on such compliance and will expire with the expiration of the temporary permit.'
- id: art-5
  title: § 170.15
  text: '§ 170.15

    Adoption of regulation on initiative of Commissioner.

    (a) The Commissioner upon his own initiative may propose the issuance of a regulation prescribing, with respect to any particular use of a food additive, the conditions under which such additive may
    be safely used. Notice of such proposal shall be published in the

    Federal Register

    and shall state the reasons for the proposal.

    (b) Action upon a proposal made by the Commissioner shall proceed as provided in part 10 of this chapter.

    [42 FR 14486, Mar. 15, 1977, as amended at 42 FR 15673, Mar. 22, 1977]'
- id: art-6
  title: § 170.17
  text: '§ 170.17

    Exemption for investigational use and procedure for obtaining authorization to market edible products from experimental animals.

    A food additive or food containing a food additive intended for investigational use by qualified experts shall be exempt from the requirements of section 409 of the Act under the following conditions:

    (a) If intended for investigational use in vitro or in laboratory research animals, it bears a label which states prominently, in addition to the other information required by the act, the warning:

    Caution.

    Contains a new food additive for investigational use only in laboratory research animals or for tests in vitro. Not for use in humans.

    (b) If intended for use in animals other than laboratory research animals and if the edible products of the animals are to be marketed as food, permission for the marketing of the edible products as
    food has been requested by the sponsor, and authorization has been granted by the Food and Drug Administration in accordance with § 511.1 of this chapter or by the Department of Agriculture in accordance
    with 9 CFR 309.17, and it bears a label which states prominently, in addition to the other information required by the Act, the warning:

    Caution.

    Contains a new food additive for use only in investigational animals. Not for use in humans.

    Edible products of investigational animals are not to be used for food unless authorization has been granted by the U.S. Food and Drug Administration or by the U.S. Department of Agriculture.

    (c) If intended for nonclinical laboratory studies in food-producing animals, the study is conducted in compliance with the regulations set forth in part 58 of this chapter.

    [42 FR 14483, Mar. 15, 1977, as amended at 43 FR 60021, Dec. 22, 1978]'
- id: art-7
  title: § 170.18
  text: '§ 170.18

    Tolerances for related food additives.

    (a) Food additives that cause similar or related pharmacological effects will be regarded as a class, and in the absence of evidence to the contrary, as having additive toxic effects and will be considered
    as related food additives.

    (b) Tolerances established for such related food additives may limit the amount of a common component that may be present, or may limit the amount of biological activity (such as cholinesterase inhibition)
    that may be present or may limit the total amount of related food additives that may be present.

    (c) Where food additives from two or more chemicals in the same class are present in or on a food, the tolerance for the total of such additives shall be the same as that for the additive having the
    lowest numerical tolerance in this class, unless there are available methods that permit quantitative determination of the amount of each food additive present or unless it is shown that a higher tolerance
    is reasonably required for the combined additives to accomplish the physical or technical effect for which such combined additives are intended and that the higher tolerance will be safe.

    (d) Where residues from two or more additives in the same class are present in or on a food and there are available methods that permit quantitative determination of each residue, the quantity of combined
    residues that are within the tolerance may be determined as follows:

    (1) Determine the quantity of each residue present.

    (2) Divide the quantity of each residue by the tolerance that would apply if it occurred alone, and multiply by 100 to determine the percentage of the permitted amount of residue present.

    (3) Add the percentages so obtained for all residues present.

    (4) The sum of the percentage shall not exceed 100 percent.'
- id: art-8
  title: § 170.19
  text: '§ 170.19

    Pesticide chemicals in processed foods.

    When pesticide chemical residues occur in processed foods due to the use of raw agricultural commodities that bore or contained a pesticide chemical in conformity with an exemption granted or a tolerance
    prescribed under section 408 of the Act, the processed food will not be regarded as adulterated so long as good manufacturing practice has been followed in removing any residue from the raw agricultural
    commodity in the processing (such as by peeling or washing) and so long as the concentration of the residue in the processed food when ready to eat is not greater than the tolerance prescribed for the
    raw agricultural commodity. But when the concentration of residue in the processed food when ready to eat is higher than the tolerance prescribed for the raw agricultural commodity, the processed food
    is adulterated unless the higher concentration is permitted by a tolerance obtained under section 409 of the Act. For example, if fruit bearing a residue of 7 parts per million of DDT permitted on the
    raw agricultural commodity is dried and a residue in excess of 7 parts per million of DDT results on the dried fruit, the dehydrated fruit is adulterated unless the higher tolerance for DDT is authorized
    by the regulations in this part. Food that is itself ready to eat, and which contains a higher residue than allowed for the raw agricultural commodity, may not be legalized by blending or mixing with
    other foods to reduce the residue in the mixed food below the tolerance prescribed for the raw agricultural commodity.

    Subpart B—Food Additive Safety'
- id: art-9
  title: § 170.20
  text: '§ 170.20

    General principles for evaluating the safety of food additives.

    (a) In reaching a decision on any petition filed under section 409 of the Act, the Commissioner will give full consideration to the specific biological properties of the compound and the adequacy of
    the methods employed to demonstrate safety for the proposed use, and the Commissioner will be guided by the principles and procedures for establishing the safety of food additives stated in current
    publications of the National Academy of Sciences-National Research Council. A petition will not be denied, however, by reason of the petitioner''s having followed procedures other than those outlined
    in the publications of the National Academy of Sciences-National Research Council if, from available evidence, the Commissioner finds that the procedures used give results as reliable as, or more reliable
    than, those reasonably to be expected from the use of the outlined procedures. In reaching a decision, the Commissioner will give due weight to the anticipated levels and patterns of consumption of
    the additive specified or reasonably inferrable. For the purposes of this section, the principles for evaluating safety of additives set forth in the abovementioned publications will apply to any substance
    that may properly be classified as a food additive as defined in section 201(s) of the Act.

    (b) Upon written request describing the proposed use of an additive and the proposed experiments to determine its safety, the Commissioner will advise a person who wishes to establish the safety of
    a food additive whether he believes the experiments planned will yield data adequate for an evaluation of the safety of the additive.'
- id: art-10
  title: § 170.22
  text: '§ 170.22

    Safety factors to be considered.

    In accordance with section 409(c)(5)(C) of the Act, the following safety factors will be applied in determining whether the proposed use of a food additive will be safe: Except where evidence is submitted
    which justifies use of a different safety factor, a safety factor in applying animal experimentation data to man of 100 to 1, will be used; that is, a food additive for use by man will not be granted
    a tolerance that will exceed

    1/100

    th of the maximum amount demonstrated to be without harm to experimental animals.'
- id: art-11
  title: § 170.30
  text: '§ 170.30

    Eligibility for classification as generally recognized as safe (GRAS).

    (a) General recognition of safety may be based only on the views of experts qualified by scientific training and experience to evaluate the safety of substances directly or indirectly added to food.
    The basis of such views may be either (1) scientific procedures or (2) in the case of a substance used in food prior to January 1, 1958, through experience based on common use in food. General recognition
    of safety requires common knowledge throughout the scientific community knowledgeable about the safety of substances directly or indirectly added to food that there is reasonable certainty that the
    substance is not harmful under the conditions of its intended use (see § 170.3(i)).

    (b) General recognition of safety based upon scientific procedures shall require the same quantity and quality of scientific evidence as is required to obtain approval of a food additive. General recognition
    of safety through scientific procedures shall be based upon the application of generally available and accepted scientific data, information, or methods, which ordinarily are published, as well as the
    application of scientific principles, and may be corroborated by the application of unpublished scientific data, information, or methods.

    (c)(1) General recognition of safety through experience based on common use in food prior to January 1, 1958, may be achieved without the quantity or quality of scientific procedures required for approval
    of a food additive. General recognition of safety through experience based on common use in food prior to January 1, 1958, shall be based solely on food use of the substance prior to January 1, 1958,
    and shall ordinarily be based upon generally available data and information. An ingredient not in common use in food prior to January 1, 1958, may

    achieve general recognition of safety only through scientific procedures.

    (2) A substance used in food prior to January 1, 1958, may be generally recognized as safe through experience based on its common use in food when that use occurred exclusively or primarily outside
    of the United States if the information about the experience establishes that the substance is safe under the conditions of its intended use within the meaning of section 201(u) of the Federal Food,
    Drug, and Cosmetic Act (see also § 170.3(i)). Common use in food prior to January 1, 1958, that occurred outside of the United States shall be documented by published or other information and shall
    be corroborated by information from a second, independent source that confirms the history and circumstances of use of the substance. The information used to document and to corroborate the history
    and circumstances of use of the substance must be generally available; that is, it must be widely available in the country in which the history of use has occurred and readily available to interested
    qualified experts in the United States. A person who concludes that a use of a substance is GRAS through experience based on its common use in food outside of the United States should notify FDA of
    that view in accordance with subpart E of this part.

    (d) The food ingredients listed as GRAS in part 182 of this chapter or affirmed as GRAS in part 184 or part 186 of this chapter do not include all substances that are generally recognized as safe for
