  text: '§2053. Consumer Product Safety Commission


    (a) Establishment; Chairman


    An independent regulatory commission is hereby established, to be known as the Consumer Product Safety Commission, consisting of five Commissioners who shall be appointed by the President, by and with
    the advice and consent of the Senate. In making such appointments, the President shall consider individuals who, by reason of their background and expertise in areas related to consumer products and
    protection of the public from risks to safety, are qualified to serve as members of the Commission. The Chairman shall be appointed by the President, by and with the advice and consent of the Senate,
    from among the members of the Commission. An individual may be appointed as a member of the Commission and as Chairman at the same time. Any member of the Commission may be removed by the President
    for neglect of duty or malfeasance in office but for no other cause.


    (b) Term; vacancies


    (1) Except as provided in paragraph (2), (A) the Commissioners first appointed under this section shall be appointed for terms ending three, four, five, six, and seven years, respectively, after October
    27, 1972, the term of each to be designated by the President at the time of nomination; and (B) each of their successors shall be appointed for a term of seven years from the date of the expiration
    of the term for which his predecessor was appointed.


    (2) Any Commissioner appointed to fill a vacancy occurring prior to the expiration of the term for which his predecessor was appointed shall be appointed only for the remainder of such term. A Commissioner
    may continue to serve after the expiration of this term until his successor has taken office, except that he may not so continue to serve more than one year after the date on which his term would otherwise
    expire under this subsection.


    (c) Restrictions on Commissioner''s outside activities


    Not more than three of the Commissioners shall be affiliated with the same political party. No individual (1) in the employ of, or holding any official relation to, any person engaged in selling or
    manufacturing consumer products, or (2) owning stock or bonds of substantial value in a person so engaged, or (3) who is in any other manner pecuniarily interested in such a person, or in a substantial
    supplier of such a person, shall hold the office of Commissioner. A Commissioner may not engage in any other business, vocation, or employment.


    (d) Quorum; seal; Vice Chairman


    No vacancy in the Commission shall impair the right of the remaining Commissioners to exercise all the powers of the Commission, but three members of the Commission shall constitute a quorum for the
    transaction of business, except that if there are only three members serving on the Commission because of vacancies in the Commission, two members of the Commission shall constitute a quorum for the
