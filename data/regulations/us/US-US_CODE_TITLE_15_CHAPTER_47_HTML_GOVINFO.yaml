    note), section 16 of the Flammable Fabrics Act (15 U.S.C. 1203), and section 7 of the Poison Packaging Prevention Act of 1970 [Poison Prevention Packaging Act of 1970] (15 U.S.C. 1476) establishing
    the extent to which those Acts preempt, limit, or otherwise affect any other Federal, State, or local law, any rule, procedure, or regulation, or any cause of action under State or local law may not
    be expanded or contracted in scope, or limited, modified or extended in application, by any rule or regulation thereunder, or by reference in any preamble, statement of policy, executive branch statements,
    or other matter associated with the publication of any such rule or regulation. In accordance with the provisions of those Acts, the Commission may not construe any such Act as preempting any cause
    of action under State or local common law or State statutory law regarding damage claims.


    "(b)

