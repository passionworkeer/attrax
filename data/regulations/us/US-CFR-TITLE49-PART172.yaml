  title: § 172.101
  text: '§ 172.101

    Purpose and use of the hazardous materials table.

    (a) The Hazardous Materials Table (Table) in this section designates the materials listed therein as hazardous materials for the purpose of transportation of those materials. For each listed material,
    the Table identifies the hazard class or specifies that the material is forbidden in transportation, and gives the proper shipping name or directs the user to the preferred proper shipping name. In
    addition, the Table specifies or references requirements in this subchapter pertaining to labeling, packaging, quantity limits aboard aircraft and stowage of hazardous materials aboard vessels.

    (b)

    Column 1: Symbols.

    Column 1 of the Table contains six symbols (“ + ”, “A”, “D”, “G”, “I” and “W”) as follows:

    (1) The plus (+) sign fixes the proper shipping name, hazard class and packing group for that entry without regard to whether the material meets the definition of that class, packing group or any other
    hazard class definition. When the plus sign is assigned to a proper shipping name in Column (1) of the § 172.101 Table, it means that the material is known to pose a risk to humans. When a plus sign
    is assigned to mixtures or solutions containing a material where the hazard to humans is significantly different from that of the pure material or where no hazard to humans is posed, the material may
    be described using an alternative shipping name that represents the hazards posed by the material. An appropriate alternate proper shipping name and hazard class may be authorized by the Associate Administrator.

    (2) The letter “A” denotes a material that is subject to the requirements of this subchapter only when offered or intended for transportation by aircraft, unless the material is a hazardous substance
    or a hazardous waste. A shipping description entry preceded by an “A” may be used to describe a material for other modes of transportation provided all applicable requirements for the entry are met.

    (3) The letter “D” identifies proper shipping names which are appropriate for describing materials for domestic transportation but may be inappropriate for international transportation under the provisions
    of international regulations (e.g., IMO, ICAO). An alternate proper shipping name may be selected when either domestic or international transportation is involved.

    (4) The letter “G” identifies proper shipping names for which one or more technical names of the hazardous material must be entered in parentheses, in association with the basic description. (See § 172.203(k).)

    (5) The letter “I” identifies proper shipping names which are appropriate for describing materials in international transportation. An alternate proper shipping name may be selected when only domestic
    transportation is involved.

    (6) The letter “W” denotes a material that is subject to the requirements of this subchapter only when offered or intended for transportation by vessel, unless the material is a hazardous substance
    or a hazardous waste. A shipping description entry preceded by a “W” may be used to describe a material for other modes of transportation provided all applicable requirements for the entry are met.

    (c)

    Column 2: Hazardous materials descriptions and proper shipping names.

    Column 2 lists the hazardous materials descriptions and proper shipping names of materials designated as hazardous materials. Modification of a proper shipping name may otherwise be required or authorized
    by this section. Proper shipping names are limited to those shown in Roman type (not italics).

    (1) Proper shipping names may be used in the singular or plural and in either capital or lower case letters. Words may be alternatively spelled in the same manner as they appear in the ICAO Technical
    Instructions or the IMDG Code. For example “aluminum” may be spelled “aluminium” and “sulfur” may be spelled “sulphur”. However, the word “inflammable” may not

    be used in place of the word “flammable”.

    (2) Punctuation marks and words in italics are not part of the proper shipping name, but may be used in addition to the proper shipping name. The word “or” in italics indicates that there is a choice
    of terms in the sequence that may alternately be used as the proper shipping name or as part of the proper shipping name, as appropriate. For example, for the hazardous materials description “Carbon
    dioxide, solid or Dry ice” either “Carbon dioxide, solid” or “Dry ice” may be used as the proper shipping name; and for the hazardous materials description “Articles, pressurized pneumatic or hydraulic,”
    either “Articles, pressurized pneumatic” or “Articles, pressurized hydraulic” may be used as the proper shipping name.

    (3) The word “poison” or “poisonous” may be used interchangeably with the word “toxic” when only domestic transportation is involved. The abbreviation “n.o.i.” or “n.o.i.b.n.” may be used interchangeably
    with “n.o.s.”.

    (4) Except for hazardous wastes, when qualifying words are used as part of the proper shipping name, their sequence in the package markings and shipping paper description is optional. However, the entry
    in the Table reflects the preferred sequence.

    (5) When one entry references another entry by use of the word “see”, if both names are in Roman type, either name may be used as the proper shipping name (e.g., Ethyl alcohol,

    see

    Ethanol).

    (6) When a proper shipping name includes a concentration range as part of the shipping description, the actual concentration, if it is within the range stated, may be used in place of the concentration
    range. For example, an aqueous solution of hydrogen peroxide containing 30 percent peroxide may be described as “Hydrogen peroxide, aqueous solution

    with not less than 20 percent but not more than 40 percent hydrogen peroxide”

    or “Hydrogen peroxide, aqueous solution

    with 30 percent hydrogen peroxide.

    ” Also, the percent sign (%) may be used in place of the word “percent” when words in italics containing the word “percent” are used in addition to the proper shipping name.

    (7) Use of the prefix “mono” is optional in any shipping name, when appropriate. Thus, Iodine monochloride may be used interchangeably with Iodine chloride. In “Glycerol alpha-monochlorohydrin” the
    term “mono” is considered a prefix to the term “chlorohydrin” and may be deleted.

    (8) Use of the word “liquid” or “solid”. The word “liquid” or “solid” may be added to a proper shipping name when a hazardous material specifically listed by name may, due to differing physical states,
    be a liquid or solid. When the packaging specified in Column 8 is inappropriate for the physical state of the material, the table provided in paragraph (i)(4) of this section should be used to determine
    the appropriate packaging section.

    (9)

    Hazardous wastes.

    If the word “waste” is not included in the hazardous material description in Column 2 of the Table, the proper shipping name for a hazardous waste (as defined in § 171.8 of this subchapter), shall include
    the word “Waste” preceding the proper shipping name of the material. For example: Waste acetone.

    (10)

    Mixtures and solutions.

    (i) A mixture or solution meeting the definition of one or more hazard class that is not identified specifically by name, comprised of a single predominant hazardous material identified in the Table
    by technical name and one or more hazardous and/or non-hazardous material, must be described using the proper shipping name of the hazardous material and the qualifying word “mixture” or “solution”,
    as appropriate, unless—

    (A) Except as provided in § 172.101(i)(4) the packaging specified in Column 8 is inappropriate to the physical state of the material;

    (B) The shipping description indicates that the proper shipping name applies only to the pure or technically pure hazardous material;

    (C) The hazard class, packing group, or subsidiary hazard of the mixture or solution is different from that specified for the entry;

    (D) There is a significant change in the measures to be taken in emergencies;

    (E) The material is identified by special provision in Column 7 of the § 172.101 Table as a material poisonous

    by inhalation; however, it no longer meets the definition of poisonous by inhalation or it falls within a different hazard zone than that specified in the special provision; or

    (F) The material can be appropriately described by a shipping name that describes its intended application, such as “Coating solution”, “Extracts, flavoring” or “Compound, cleaning liquid.”.

    (ii) If one or more of the conditions in paragraphs (c)(10)(i)(A) through (F) of this section is satisfied then the proper shipping name selection process in (c)(12)(ii) must be used.

    (iii) A mixture or solution meeting the definition of one or more hazard class that is not identified in the Table specifically by name, comprised of two or more hazardous materials in the same hazard
    class, must be described using an appropriate shipping description (e.g., “Flammable liquid, n.o.s.”). The name that most appropriately describes the material shall be used; e.g., an alcohol not listed
    by its technical name in the Table shall be described as “Alcohol, n.o.s.” rather than “Flammable liquid, n.o.s.”. Some mixtures may be more appropriately described according to their application, such
    as “Coating solution” or “Extracts, flavoring liquid” rather than by an n.o.s. entry. Under the provisions of subparts C and D of this part, the technical names of at least two components most predominately
    contributing to the hazards of the mixture or solution may be required in association with the proper shipping name.

    (11) Except for a material subject to or prohibited by § 173.21, § 173.54, § 173.56(d), § 173.56(e), § 173.224(c) or § 173.225(b) of this subchapter, a material that is considered to be a hazardous
    waste or a sample of a material for which the hazard class is uncertain and must be determined by testing may be assigned a tentative proper shipping name, hazard class, identification number and packing
    group, if applicable, based on the shipper''s tentative determination according to:

    (i) Defining criteria in this subchapter;

    (ii) The hazard precedence prescribed in § 173.2a of this subchapter;

    (iii) The shipper''s knowledge of the material;

    (iv) In addition to paragraphs (c)(11)(i) through (iii) of this section, for a sample of a material other than a waste, the following must be met:

    (A) Except when the word “Sample” already appears in the proper shipping name, the word “Sample” must appear as part of the proper shipping name or in association with the basic description on the shipping
    paper.

    (B) When the proper shipping description for a sample is assigned a “G” in Column (1) of the § 172.101 Table, and the primary constituent(s) for which the tentative classification is based are not known,
    the provisions requiring a technical name for the constituent(s) do not apply; and

    (C) A sample must be transported in a combination packaging that conforms to the requirements of this subchapter that are applicable to the tentative packing group assigned, and may not exceed a net
    mass of 2.5 kg (5.5 pounds) per package.

    Note to paragraph (

    c

    )(11):

    For the transportation of samples of self-reactive materials, organic peroxides, explosives or lighters,

    see'
