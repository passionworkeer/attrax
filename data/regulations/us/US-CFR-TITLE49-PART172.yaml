    (5)

    Cylinders.

    For cylinders, both non-bulk and bulk packaging authorizations are set forth in Column (8B). Notwithstanding a designation of “None” in Column (8C), a bulk cylinder may be used when specified through
    the section reference in Column (8B).

    (j)

    Column 9: Quantity limitations.

    Columns 9A and 9B specify the maximum quantities that may be offered for transportation in one package by passenger-carrying aircraft or passenger-carrying rail car (Column 9A) or by cargo aircraft
    only (Column 9B), subject to the following:

    (1) “Forbidden” means the material may not be offered for transportation or transported in the applicable mode of transport.

    (2) The quantity limitation is “net” except where otherwise specified, such as for “Consumer commodity” which specifies “30 kg gross.”

    (3) When articles or devices are specifically listed by name, the net quantity limitation applies to the entire article or device (less packaging and packaging materials) rather than only to its hazardous
    components.

    (4) A package offered or intended for transportation by aircraft and which is filled with a material forbidden on passenger-carrying aircraft but permitted on cargo aircraft only, or which exceeds the
    maximum net quantity authorized on passenger-carrying aircraft, shall be labelled with the CARGO AIRCRAFT ONLY label specified in § 172.448 of this part.

    (5) The total net quantity of hazardous material for an outer non-bulk packaging that contains more than one hazardous material may not exceed the lowest permitted maximum net quantity per package as
    shown in Column 9A or 9B, as appropriate. If one material is a liquid and one is a solid, the maximum net quantity must be calculated in kilograms.

