  title: § 172.1
  text: '§ 172.1

    Purpose and scope.

    This part lists and classifies those materials which the Department has designated as hazardous materials for purposes of transportation and prescribes the requirements for shipping papers, package
    marking, labeling, and transport vehicle placarding applicable to the shipment and transportation of those hazardous materials.

    [Amdt. 172-29, 41 FR 15997, Apr. 15, 1976, as amended by 66 FR 45379, Aug. 28, 2001]'
- id: art-3
  title: § 172.3
  text: '§ 172.3

    Applicability.

    (a) This part applies to—

    (1) Each person who offers a hazardous material for transportation, and

    (2) Each carrier by air, highway, rail, or water who transports a hazardous material.

    (b) When a person, other than one of those provided for in paragraph (a) of this section, performs a packaging labeling or marking function required by

    this part, that person shall perform the function in accordance with this part.

    [Amdt. 172-29, 41 FR 15996, Apr. 15, 1976, as amended by Amdt. 172-32, 41 FR 38179, Sept. 9, 1976]

    Subpart B—Table of Hazardous Materials and Special Provisions'
