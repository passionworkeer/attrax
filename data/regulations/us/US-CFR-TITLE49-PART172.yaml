  title: § 173.224(c)(3), § 173.225(c)(2), § 173.56(d) or § 173.308(b)(2) of this subchapter, respectively.
  text: '§ 173.224(c)(3), § 173.225(c)(2), § 173.56(d) or § 173.308(b)(2) of this subchapter, respectively.

    (12) Except when the proper shipping name in the Table is preceded by a plus (+)—

    (i) If it is specifically determined that a material meets the definition of a hazard class, packing group or hazard zone, other than the class, packing group or hazard zone shown in association with
    the proper shipping name, or does not meet the defining criteria for a subsidiary hazard shown in Column 6 of the Table, the material shall be described by an appropriate proper shipping name listed
    in association with the correct hazard class, packing group, hazard zone, or subsidiary hazard for the material.

    (ii)

    Generic or n.o.s. descriptions.

    If an appropriate technical name is not shown in the Table, selection of a proper shipping name shall be made from the generic or n.o.s. descriptions corresponding to the specific hazard class, packing
    group, hazard zone, or subsidiary hazard, if any, for the material.

    The name that most appropriately describes the material shall be used,

    e.g.,

    an alcohol not listed by its technical name in the Table shall be described as “Alcohol, n.o.s.” rather than “Flammable liquid, n.o.s.” Some mixtures may be more appropriately described according to
    their application, such as “Coating solution” or “Extracts, liquid, for flavor or aroma,” rather than by an n.o.s. entry, such as “Flammable liquid, n.o.s.” It should be noted, however, that an n.o.s.
    description as a proper shipping name may not provide sufficient information for shipping papers and package markings. Under the provisions of subparts C and D of this part, the technical name of one
    or more constituents that makes the product a hazardous material may be required in association with the proper shipping name.

    (iii)

    Multiple hazard materials.

    If a material meets the definition of more than one hazard class, and is not identified in the Table specifically by name (e.g., acetyl chloride), the hazard class of the material shall be determined
    by using the precedence specified in § 173.2a of this subchapter, and an appropriate shipping description (e.g., “Flammable liquid, corrosive n.o.s.”) shall be selected as described in paragraph (c)(12)(ii)
    of this section.

    (iv) If it is specifically determined that a material is not a forbidden material and does not meet the definition of any hazard class, the material is not a hazardous material.

    (13)

    Self-reactive materials and organic peroxides.

    A generic proper shipping name for a self-reactive material or an organic peroxide, as listed in Column 2 of the Table, must be selected based on the material''s technical name and concentration, in
    accordance with the provisions of § 173.224 or § 173.225 of this subchapter, respectively.

    (14) A proper shipping name that describes all isomers of a material may be used to identify any isomer of that material if the isomer meets criteria for the same hazard class or division, subsidiary
    risk(s) and packing group, unless the isomer is specifically identified in the Table.

    (15) Unless a hydrate is specifically listed in the Table, a proper shipping name for the equivalent anhydrous substance may be used, if the hydrate meets the same hazard class or division, subsidiary
    risk(s) and packing group.

    (16) Unless it is already included in the proper shipping name in the § 172.101 Table, the qualifying words “liquid” or “solid” may be added in association with the proper shipping name when a hazardous
    material specifically listed by name in the § 172.101 Table may, due to the differing physical states of the various isomers of the material, be either a liquid or a solid (for example “Dinitrotoluenes,
    liquid” and “Dinitrotoluenes, solid”). Use of the words “liquid” or “solid” is subject to the limitations specified for the use of the words “mixture” or “solution” in paragraph (c)(10) of this section.
    The qualifying word “molten” may be added in association with the proper shipping name when a hazardous material, which is a solid in accordance with the definition in § 171.8 of this subchapter, is
    offered for transportation in the molten state (for example, “Alkylphenols, solid, n.o.s., molten”).

    (17) Unless it is already included in the proper shipping name in the § 172.101 Table, the qualifying word “stabilized” may be added in association with the proper shipping name, as appropriate, where
    without stabilization the substance would be forbidden for transportation according to § 173.21(f) of this subchapter.

    (d)

    Column 3: Hazard class or Division.

    Column 3 contains a designation of the hazard class or division corresponding to each proper shipping name, or the word “Forbidden”.

    (1) A material for which the entry in this column is “Forbidden” may not be offered for transportation or transported. This prohibition does not apply if the material is diluted, stabilized or incorporated
    in a device and it is classed in accordance with the definitions of hazardous materials contained in part 173 of this subchapter.

    (2) When a reevaluation of test data or new data indicates a need to modify the “Forbidden” designation or the hazard class or packing group specified for a material specifically identified in the Table,
    this data should be submitted to the Associate Administrator.

    (3) A basic description of each hazard class and the section reference for class definitions appear in § 173.2 of this subchapter.

    (4) Each reference to a Class 3 material is modified to read “Combustible liquid” when that material is reclassified in accordance with § 173.150(e) or (f) of this subchapter or has a flash point above
    60 °C (140 °F) but below 93 °C (200 °F).

    (e)

    Column 4: Identification number.

    Column 4 lists the identification number assigned to each proper shipping name. Those preceded by the letters “UN” are associated with proper shipping names considered appropriate for international
    transportation as well as domestic transportation. Those preceded by the letters “NA” are associated with proper shipping names not recognized for transportation outside of the United States. Identification
    numbers in the “NA9000” series are associated with proper shipping names not appropriately covered by international hazardous materials (dangerous goods) transportation standards, or not appropriately
    addressed by international transportation standards for emergency response information purposes, except for transportation in the United States. Those preceded by the letters “ID” are associated with
    proper shipping names recognized by the ICAO Technical Instructions (see § 171.7 of this subchapter for availability).

    (f)

    Column 5: Packing group.

    Column 5 specifies one or more packing groups assigned to a material corresponding to the proper shipping name and hazard class for that material. Class 2, Class 7, and Division 6.2 do not have packing
    groups. Articles in classes other than Class 1 are not assigned to packing groups. For packing purposes, any requirement for a specific packaging performance level is set out in the applicable packing
    authorizations of part 173. Packing Groups I, II, and III indicate the degree of danger presented by the material is great, medium, or minor, respectively. If more than one packing group is indicated
    for an entry, the packing group for the hazardous material is determined using the criteria for assignment of packing groups specified in subpart D of part 173. When a reevaluation of test data or new
    data indicates a need to modify the specified packing group(s), the data should be submitted to the Associate Administrator. Each reference in this column to a material that is a hazardous waste or
    a hazardous substance, and whose proper shipping name preceded in Column 1 of the Table by the letter “A” or “W,” is modified to read “III” on those occasions when the material is offered for transportation
    or transported by a mode in which its transportation is not otherwise subject to requirements of this subchapter.

    (g)

    Column 6: Labels.

    Column 6 specifies codes which represent the hazard warning labels required for a package filled with a material conforming to the associated hazard class and proper shipping name, unless the package
    is otherwise excepted from labeling by a provision in subpart E of this part, or part 173 of this subchapter. The first code is indicative of the primary hazard of the material. Additional label codes
    are indicative of subsidiary hazards. Provisions in § 172.402 may require that a label other than that specified in Column 6 be affixed to the package in addition to that specified in Column 6. No label
    is required for a material classed as a combustible liquid or for a Class 3 material that is reclassed as a combustible liquid. For “Empty” label requirements, see § 173.428 of this subchapter. The
