- id: art-6
  title: § 15.9
  text: '§ 15.9

    Prohibition against eavesdropping.

    Except for the operations of law enforcement officers conducted under lawful authority, no person shall use, either directly or indirectly, a device operated pursuant to the provisions of this part
    for the purpose of overhearing or recording the private conversations of others unless such use is authorized by all of the parties engaging in the conversation.'
- id: art-7
  title: § 15.11
  text: '§ 15.11

    Cross reference.

    The provisions of subparts A, H, I, J and K of part 2 apply to intentional and unintentional radiators, in addition to the provisions of this part. Also, a cable system terminal device and a cable input
    selector switch shall be subject to the relevant provisions of part 76 of this chapter.'
- id: art-8
  title: § 15.13
  text: '§ 15.13

    Incidental radiators.

    Manufacturers of these devices shall employ good engineering practices to minimize the risk of harmful interference.'
- id: art-9
  title: § 15.15
  text: '§ 15.15

    General technical requirements.

    (a) An intentional or unintentional radiator shall be constructed in accordance with good engineering design and manufacturing practice. Emanations from the device shall be suppressed as much as practicable,
    but in no case shall the emanations exceed the levels specified in these rules.

    (b) Except as follows, an intentional or unintentional radiator must be constructed such that the adjustments of any control that is readily accessible by or intended to be accessible to the user will
    not cause operation of the device in violation of the regulations. Access BPL equipment shall comply with the applicable standards at the control adjustment that is employed. The measurement report
    used in support of an application for Certification and the user instructions for Access BPL equipment shall clearly specify the user-or installer-control settings that are required for conformance
    with these regulations.

    (c) Parties responsible for equipment compliance should note that the limits specified in this part will not prevent harmful interference under all circumstances. Since the operators of part 15 devices
    are required to cease operation should harmful interference occur to authorized users of the radio frequency spectrum, the parties responsible for equipment compliance are encouraged to employ the minimum
    field strength necessary for communications, to provide greater attenuation of unwanted emissions than required by these regulations, and to advise the user as to how to resolve harmful interference
    problems (for example, see § 15.105(b)).

    [54 FR 17714, Apr. 25, 1989, as amended at 70 FR 1373, Jan. 7, 2005]'
- id: art-10
  title: § 15.17
  text: '§ 15.17

    Susceptibility to interference.

    (a) Parties responsible for equipment compliance are advised to consider the proximity and the high power of non-Government licensed radio stations, such as broadcast, amateur, land mobile, and non-geostationary
    mobile satellite feeder link earth stations, and of

    U.S. Government radio stations, which could include high-powered radar systems, when choosing operating frequencies during the design of their equipment so as to reduce the susceptibility for receiving
    harmful interference. Information on non-Government use of the spectrum can be obtained by consulting the Table of Frequency Allocations in § 2.106 of this chapter.

    (b) Information on U.S. Government operations can be obtained by contacting: Director, Spectrum Plans and Policy, National Telecommunications and Information Administration, Department of Commerce,
    Room 4096, Washington, DC 20230.

    [54 FR 17714, Apr. 25, 1989, as amended at 62 FR 4655, Jan. 31, 1997; 63 FR 40835, July 31, 1998]'
- id: art-11
  title: § 15.19
  text: '§ 15.19

    Labeling requirements.

    (a) In addition to the requirements in part 2 of this chapter, a device subject to certification, or Supplier''s Declaration of Conformity shall be labeled as follows:

    (1) Receivers associated with the operation of a licensed radio service,

    e.g.,

    FM broadcast under part 73 of this chapter, land mobile operation under part 90 of this chapter, etc., shall bear the following statement in a conspicuous location on the device:

    This device complies with part 15 of the FCC Rules. Operation is subject to the condition that this device does not cause harmful interference.

    (2) A stand-alone cable input selector switch, shall bear the following statement in a conspicuous location on the device:

    This device complies with part 15 of the FCC Rules for use with cable television service.

    (3) All other devices shall bear the following statement in a conspicuous location on the device:

    This device complies with part 15 of the FCC Rules. Operation is subject to the following two conditions: (1) This device may not cause harmful interference, and (2) this device must accept any interference
    received, including interference that may cause undesired operation.

    (4) Where a device is constructed in two or more sections connected by wires and marketed together, the statement specified under paragraph (a) of this section is required to be affixed only to the
    main control unit.

    (5) When the device is so small or for such use that it is impracticable to label it with the statement specified under paragraph (a) of this section in a font that is four-point or larger, and the
    device does not have a display that can show electronic labeling, then the information required by this paragraph shall be placed in the user manual and must also either be placed on the device packaging
    or on a removable label attached to the device.

    (b)-(c) [Reserved]

    (d) Consumer electronics TV receiving devices, including TV receivers, videocassette recorders, and similar devices, that incorporate features intended to be used with cable television service, but
    do not fully comply with the technical standards for cable ready equipment set forth in § 15.118, shall not be marketed with terminology that describes the device as “cable ready” or “cable compatible,”
    or that otherwise conveys the impression that the device is fully compatible with cable service. Factual statements about the various features of a device that are intended for use with cable service
    or the quality of such features are acceptable so long as such statements do not imply that the device is fully compatible with cable service. Statements relating to product features are generally acceptable
    where they are limited to one or more specific features of a device, rather than the device as a whole. This requirement applies to consumer TV receivers, videocassette recorders and similar devices
    manufactured or imported for sale in this country on or after October 31, 1994.

    [54 FR 17714, Apr. 25, 1989, as amended at 59 FR 25341, May 16, 1994; 61 FR 18509, Apr. 26, 1996; 61 FR 31048, June 19, 1996; 62 FR 41881, Aug. 4, 1997; 63 FR 36602, July 7, 1998; 65 FR 64391, Oct.
    27, 2000; 68 FR 66733, Nov. 28, 2003; 68 FR 68545, Dec. 9, 2003; 82 FR 50830, Nov. 2, 2017]'
- id: art-12
  title: § 15.21
  text: '§ 15.21

    Information to user.

    The users manual or instruction manual for an intentional or unintentional radiator shall caution the user that changes or modifications not expressly approved by the party responsible for compliance
    could void the user''s authority to operate the equipment. In cases where the manual is provided only in a form other than paper, such as on a computer disk or over the Internet, the information required
    by this section may be included in the manual in that alternative form, provided the user can reasonably be expected to have the capability to access information in that form.

    [54 FR 17714, Apr. 25, 1989, as amended at 68 FR 68545, Dec. 9, 2003]'
- id: art-13
  title: § 15.23
  text: '§ 15.23

    Home-built devices.

    (a) Equipment authorization is not required for devices that are not marketed, are not constructed from a kit, and are built in quantities of five or less for personal use.

    (b) It is recognized that the individual builder of home-built equipment may not possess the means to perform the measurements for determining compliance with the regulations. In this case, the builder
    is expected to employ good engineering practices to meet the specified technical standards to the greatest extent practicable. The provisions of § 15.5 apply to this equipment.'
- id: art-14
  title: § 15.25
  text: '§ 15.25

    Kits.

    A TV interface device, including a cable system terminal device, which is marketed as a kit shall comply with the following requirements:

    (a) All parts necessary for the assembled device to comply with the technical requirements of this part must be supplied with the kit. No mechanism for adjustment that can cause operation in violation
    of the requirements of this part shall be made accessible to the builder.

    (b) At least two units of the kit shall be assembled in exact accordance with the instructions supplied with the product to be marketed. If all components required to fully complete the kit (other than
    those specified in paragraph (a) of this section that are needed for compliance with the technical provisions and must be included with the kit) are not normally furnished with the kit, assembly shall
    be made using the recommended components. The assembled units shall be certified or authorized under Supplier''s Declaration of Conformity, as appropriate, pursuant to the requirements of this part.

    (1) The measurement data required for a TV interface device subject to certification shall be obtained for each of the two units and submitted with an application for certification pursuant to subpart
    J of part 2 of this chapter.

    (2) The measurement data required for a TV interface device subject to Supplier''s Declaration of Conformity shall be obtained for the units tested and retained on file pursuant to the provisions of
    subpart J of part 2 of this chapter.

    (c) A copy of the exact instructions that will be provided for assembly of the device shall be submitted with an application for certification. Those parts that are not normally furnished shall be detailed
    in the application for certification.

    (d) In lieu of the label required by § 15.19, the following label, along with the label bearing the FCC identifier and other information specified in §§ 2.925 and 2.926, shall be included in the kit
    with instructions to the builder that it shall be attached to the completed kit:

    (Name of Grantee)

    (FCC Identifier)

    This device can be expected to comply with part 15 of the FCC Rules provided it is assembled in exact accordance with the instructions provided with this kit. Operation is subject to the following conditions:
    (1) This device may not cause harmful interference, and (2) this device must accept any interference received including interference that may cause undesired operation.

    (e) For the purpose of this section, circuit boards used as repair parts for the replacement of electrically identical defective circuit boards are not considered to be kits.

    [54 FR 17714, Apr. 25, 1989,as amended at 63 FR 36602, July 7, 1998; 82 FR 50830, Nov. 2, 2017]'
