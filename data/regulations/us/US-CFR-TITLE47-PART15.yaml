- id: art-2
  title: § 15.1
  text: '§ 15.1

    Scope of this part.

    (a) This part sets out the regulations under which an intentional, unintentional, or incidental radiator may be operated without an individual license. It also contains the technical specifications,
    administrative requirements and other conditions relating to the marketing of part 15 devices.

    (b) The operation of an intentional or unintentional radiator that is not in accordance with the regulations in this part must be licensed pursuant to the provisions of section 301 of the Communications
    Act of 1934, as amended, unless otherwise exempted from the licensing requirements elsewhere in this chapter.

    (c) Unless specifically exempted, the operation or marketing of an intentional or unintentional radiator that is not in compliance with the administrative and technical provisions in this part, including
    prior equipment authorization, as appropriate, is prohibited under section 302 of the Communications Act of 1934, as amended, and subpart I of part 2 of this chapter. The equipment authorization procedures
    are detailed in subpart J of part 2 of this chapter.

    [54 FR 17714, Apr. 25, 1989, as amended at 82 FR 50830, Nov. 2, 2017]'
- id: art-3
  title: § 15.3
  text: '§ 15.3

    Definitions.

    (a)

    Auditory assistance device.

    An intentional radiator used to provide auditory assistance communications (including but not limited to applications such as assistive listening, auricular training, audio description for the blind,
    and simultaneous language translation) for:

    (1) Persons with disabilities: In the context of part 15 rules (47 CFR part 15), the term “disability,” with respect to the individual, has the meaning given to it by section 3(2)(A) of the Americans
    with Disabilities Act of 1990 (42 U.S.C. 12102(2)(A)),

    i.e.,

    a physical or mental impairment that substantially limits one or more of the major life activities of such individuals;

    (2) Persons who require language translation; or

    (3) Persons who may otherwise benefit from auditory assistance communications in places of public gatherings, such as a church, theater, auditorium, or educational institution.

    (b)

    Biomedical telemetry device.

    An intentional radiator used to transmit measurements of either human or animal biomedical phenomena to a receiver.

    (c)

    Cable input selector switch.

    A transfer switch that is intended as a means to alternate between the reception of broadcast signals via connection to an antenna and the reception of cable television service.

    (d)

    Cable locating equipment.

    An intentional radiator used intermittently by trained operators to locate buried cables, lines, pipes, and similar structures or elements. Operation entails coupling a radio frequency signal onto the
    cable, pipes, etc. and using a receiver to detect the location of that structure or element.

    (e)

    Cable system terminal device (CSTD).

    A TV interface device that serves, as its primary function, to connect a cable system operated under part 76 of this chapter to a TV broadcast receiver or other subscriber premise equipment. Any device
    which functions as a CSTD in one of its operating modes must comply with the technical requirements for such devices when operating in that mode.

    (f)

    Carrier current system.

    A system, or part of a system, that transmits radio frequency energy by conduction over the electric power lines. A carrier current system can be designed such that the signals are received by conduction
    directly from connection to the electric power lines (unintentional radiator) or the signals are received over-the-air due to radiation of the radio frequency signals from the electric power lines (intentional
    radiator).

    (g)

    CB receiver.

    Any receiver that operates in the Personal Radio Services on frequencies designated for CB Radio Service stations, as well as any receiver provided with a separate band specifically designed to receive
    the transmissions of CB stations in the Personal Radio Services. This includes the following:

    (1) A CB receiver sold as a separate unit of equipment;

    (2) The receiver section of a CB transceiver;

    (3) A converter to be used with any receiver for the purpose of receiving CB transmissions; and

    (4) A multiband receiver that includes a band labelled “CB” or “11-meter” in which such band can be separately selected, except that an Amateur Radio Service receiver that was manufactured prior to
    January 1, 1960, and which includes an 11-meter band shall not be considered to be a CB receiver.

    (h)

    Class A digital device.

    A digital device that is marketed for use in a commercial, industrial or business environment, exclusive of a device which is marketed for use by the general public or is intended to be used in the
    home.

    (i)

    Class B digital device.

    A digital device that is marketed for use in a residential environment notwithstanding use in commercial, business and industrial environments. Examples of such devices include, but are not limited
    to, personal computers, calculators, and similar electronic devices that are marketed for use by the general public.

    Note:

    The responsible party may also qualify a device intended to be marketed in a commercial, business or industrial environment as a Class B device, and in fact is encouraged to do so, provided the device
    complies with the technical specifications for a Class B digital device. In the event that a particular type of device has been found to repeatedly cause harmful interference to radio communications,
    the Commission may classify such a digital device as a Class B digital device, regardless of its intended use.

    (j)

    Cordless telephone system.

    A system consisting of two transceivers, one a base station that connects to the public switched telephone network and the other a mobile handset unit that communicates directly with the base station.
    Transmissions from the mobile unit are received by the base station and then placed on the public switched telephone network. Information received from the switched telephone network is transmitted
    by the base station to the mobile unit.

    Note:

    The Domestic Public Cellular Radio Telecommunications Service is considered to be part of the switched telephone network. In addition, intercom and paging operations are permitted provided these are
    not intended to be the primary modes of operation.

    (k)

    Digital device.

    (Previously defined as a computing device). An unintentional radiator (device or system) that generates and uses timing signals or pulses at a rate in excess of 9,000 pulses (cycles) per second and
    uses digital techniques; inclusive of telephone equipment that uses digital techniques or any device or system that generates and uses radio frequency energy for the purpose of performing data processing
    functions, such as electronic computations, operations, transformations, recording, filing, sorting, storage, retrieval, or transfer. A radio frequency device that is specifically subject to an emanation
    requirement in any other FCC Rule part or an intentional radiator subject to subpart C of this part that contains a digital device is not subject to the standards for digital devices, provided the digital
    device is used only to enable operation of the radio frequency device and the digital device does not control additional functions or capabilities.

    Note:

    Computer terminals and peripherals that are intended to be connected to a computer are digital devices.

    (l)

    Field disturbance sensor.

    A device that establishes a radio frequency field in its vicinity and detects changes in that field resulting from the movement of persons or objects within its range. A radar operating pursuant to
    the definition for radiodetermination station in § 2.1 of this chapter is an example of a field disturbance sensor.

    (m)

    Harmful interference.

    Any emission, radiation or induction that endangers the functioning of a radio navigation service or of other safety services or seriously degrades, obstructs or repeatedly interrupts a radiocommunications
    service operating in accordance with this chapter.

    (n)

    Incidental radiator.

    A device that generates radio frequency energy during the course of its operation although the device is not intentionally designed to generate or emit radio frequency energy. Examples of incidental
    radiators are dc motors, mechanical light switches, etc.

    (o)

    Intentional radiator.

    A device that intentionally generates and emits radio frequency energy by radiation or induction.

    (p)

    Kit.

    Any number of electronic parts, usually provided with a schematic diagram or printed circuit board, which, when assembled in accordance with instructions, results in a device subject to the regulations
    in this part, even if additional parts of any type are required to complete assembly.

    (q)

    Perimeter protection system.

    A field disturbance sensor that employs RF transmission lines as the radiating source. These RF transmission lines are installed in such a manner that allows the system to detect movement within the
    protected area.

    (r)

    Peripheral device.

    An input/output unit of a system that feeds data into and/or receives data from the central processing unit of a digital device. Peripherals to a digital device include any device that is connected
    external to the digital device, any device internal to the digital device that connects the digital device to an external device by wire or cable, and any circuit board designed for interchangeable
    mounting, internally or externally, that increases the operating or processing speed of a digital device, e.g., “turbo” cards and “enhancement” boards. Examples of peripheral devices include terminals,
    printers, external floppy disk drives and other data storage devices, video monitors, keyboards, interface boards, external memory expansion cards, and other input/output devices that may or may not
    contain digital circuitry. This definition does not include CPU boards, as defined in paragraph (bb) of this section, even though a CPU board may connect to an external keyboard or other components.

    (s)

    Personal computer.

    An electronic computer that is marketed for use in the home, notwithstanding business applications. Such computers are considered Class B digital devices. Computers which use a standard TV receiver
    as a display device or meet all of the following conditions are considered examples of personal computers:

    (1) Marketed through a retail outlet or direct mail order catalog.

    (2) Notices of sale or advertisements are distributed or directed to the general public or hobbyist users rather than restricted to commercial users.

    (3) Operates on a battery or 120 volt electrical supply.

    If the responsible party can demonstrate that because of price or performance the computer is not suitable for residential or hobbyist use, it may request that the computer be considered to fall outside
    of the scope of this definition for personal computers.

    (t)

    Power line carrier systems.

    An unintentional radiator employed as a carrier current system used by an electric power utility entity on transmission lines for protective relaying, telemetry, etc. for general supervision of the
    power system. The system operates by the transmission of radio frequency energy by conduction over the electric power transmission lines of the system. The system does not include those electric lines
    which connect the distribution substation to the customer or house wiring.

    (u)

    Radio frequency (RF) energy.

    Electromagnetic energy at any frequency in the radio spectrum between 9 kHz and 3,000,000 MHz.

    (v)

    Scanning receiver.

    For the purpose of this part, this is a receiver that automatically switches among two or more frequencies in the range of 30 to 960 MHz and that is capable of stopping at and receiving a radio signal
    detected on a frequency. Receivers designed solely for the reception of the broadcast signals under part 73 of this chapter, for the reception of NOAA broadcast weather band signals, or for operation
    as part of a licensed service are not included in this definition.

    (w)

    Television (TV) broadcast receiver.

    A device designed to receive television pictures that are broadcast simultaneously with sound on the television channels authorized under part 73 of this chapter.

    (x)

    Transfer switch.

    A device used to alternate between the reception of over-the-air radio frequency signals via connection to an antenna and the reception of radio frequency signals received by any other method, such
    as from a TV interface device.

    (y)

    TV interface device.

    An unintentional radiator that produces or translates in frequency a radio frequency carrier modulated by a video signal derived from an external or internal signal source, and which feeds the modulated
    radio frequency energy by conduction to the antenna terminals or

    other non-baseband input connections of a television broadcast receiver. A TV interface device may include a stand-alone RF modulator, or a composite device consisting of an RF modulator, video source
    and other components devices. Examples of TV interface devices are video cassette recorders and terminal devices attached to a cable system or used with a Master Antenna (including those used for central
    distribution video devices in apartment or office buildings).

    (z)

    Unintentional radiator.

    A device that intentionally gener'
- id: art-4
  title: § 15.5
  text: '§ 15.5

    General conditions of operation.

    (a) Persons operating intentional or unintentional radiators shall not be deemed to have any vested or recognizable right to continued use of any

    given frequency by virtue of prior registration or certification of equipment, or, for power line carrier systems, on the basis of prior notification of use pursuant to § 90.35(g) of this chapter.

    (b) Operation of an intentional, unintentional, or incidental radiator is subject to the conditions that no harmful interference is caused and that interference must be accepted that may be caused by
    the operation of an authorized radio station, by another intentional or unintentional radiator, by industrial, scientific and medical (ISM) equipment, or by an incidental radiator.

    (c) The operator of a radio frequency device shall be required to cease operating the device upon notification by a Commission representative that the device is causing harmful interference. Operation
    shall not resume until the condition causing the harmful interference has been corrected.

    (d) Intentional radiators that produce Class B emissions (damped wave) are prohibited.

    [54 FR 17714, Apr. 25, 1989, as amended at 75 FR 63031, Oct. 13, 2010]'
