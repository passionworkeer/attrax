  title: California Consumer Privacy Act (CCPA) | State of California
  text: "California Consumer Privacy Act (CCPA) | State of California - Department of Justice - Office of the Attorney General\nSkip to main content\nSubscribe to Our Newsletter\nSubscribe\nSubscribe\n\
    \       \t\tState \nof\n California Department \nof\n Justice \nRob Bonta\nAttorney General\nSearch\nSearch\nTranslate Website | \nTraducir Sitio Web\n×\nGoogle™ Translate Disclaimer\nThis Google™ translation\
    \ feature is provided for informational purposes only.\nThe Office of the Attorney General is unable to guarantee the accuracy of this translation and is therefore not liable for any inaccurate information\
    \ resulting from the translation application tool.\nPlease consult with a translator for accuracy if you are relying on the translation or are using this site for official business.\nIf you have any\
    \ questions please contact: Bilingual Services Program at \nEERROffice@doj.ca.gov\nA copy of this disclaimer can also be found on our \nDisclaimer\n page.\nSelect a Language Below / Seleccione el Idioma\
    \ Abajo\nClose\nCalifornia Consumer Privacy Act (CCPA)\nHome\nPrivacy\nCalifornia Consumer Privacy Act (CCPA)\nUpdated on August 28, 2026\nThe \nCalifornia Consumer Privacy Act of 2018\n (CCPA) gives\
    \ consumers more control over the personal information that businesses collect about them and the \nCCPA regulations\n provide guidance on how to implement the law.  This landmark law secures new privacy\
    \ rights for California consumers, including: \nThe \nright to know\n about the personal information a business collects about them and how it is used and shared;\nThe \nright to delete\n personal information\
    \ collected from them (with some exceptions);\nThe \nright to opt-out\n of the sale or sharing of their personal information including via the \nGPC\n;\nThe \nright to non-discrimination\n for exercising\
    \ their CCPA rights. \nIn November of 2020, California voters approved \nProposition 24, the CPRA\n, which amended the CCPA and added new additional privacy protections that began on January 1, 2023.\
    \ As of January 1, 2023, consumers have new rights in addition to those above, such as:\nThe \nright to correct\n inaccurate personal information that a business has about them; and\nThe \nright to\
    \ limit\n the use and disclosure of sensitive personal information collected about them.\nBusinesses\n that are subject to the CCPA have several responsibilities, including responding to consumer requests\
    \ to exercise these rights and giving consumers certain \nnotices explaining their privacy practices\n. The CCPA applies to many businesses, including \ndata brokers\n.\nCPRA amends the CCPA; it does\
    \ not create a separate, new law.  As a result, our office typically refers to the law as “CCPA” or “CCPA, as amended.”\nLinks to Topics\nA. GENERAL INFORMATION ABOUT THE CCPA\nB. RIGHT TO OPT-OUT OF\
    \ SALE OR SHARING\nC. REQUESTS TO KNOW\nD. REQUESTS TO DELETE\nE. REQUESTS TO CORRECT\nF. REQUESTS TO LIMIT USE OF PERSONAL INFORMATION\nG. RIGHT TO NON-DISCRIMINATION\nH. REQUIRED NOTICES\nI. DATA\
    \ BROKERS AND THE CCPA\nOther Consumer Resources on CCPA\nFrequently Asked Questions (FAQs)\nThese FAQs provide general consumer information about the CCPA and how you can exercise your rights under\
    \ the CCPA. They are not legal advice, regulatory guidance, or an opinion of the Attorney General. We will update this information periodically.\nA. GENERAL INFORMATION ABOUT THE CCPA\n          1.\
    \ What rights do I have under the CCPA?\nIf you are a California resident, you may ask businesses to disclose what personal information they have about you and what they do with that information, to\
    \ delete your personal information, to direct businesses not to sell or share your personal information, to correct inaccurate information that they have about you, and to limit businesses’ use and\
    \ disclosure of your sensitive personal information: \nRight to know"
- id: art-2
  title: ': You can request that a business disclose to you: (1) the c'
  text: ": You can request that a business disclose to you: (1) the categories and/or specific pieces of personal information they have collected about you, (2) the categories of sources for that personal\
    \ information, (3) the purposes for which the business uses that information, (4) the categories of third parties with whom the business discloses the information, and (5) the categories of information\
    \ that the business sells or discloses to third parties. You can make a request to know up to twice a year, free of charge.\nRight to delete\n: You can request that businesses delete personal information\
    \ they collected from you and tell their service providers to do the same, subject to certain exceptions (such as if the business is legally required to keep the information).\nRight to opt-out of sale\
    \ or sharing\n: You may request that businesses stop selling or sharing your personal information (“opt-out”), including via a user-enabled global privacy control. Businesses cannot sell or share your\
    \ personal information after they receive your opt-out request unless you later authorize them to do so again.\nRight to correct\n: You may ask businesses to correct inaccurate information that they\
    \ have about you.\nRight to limit use and disclosure of sensitive personal information\n: You can direct businesses to only use your sensitive personal information (for example, your social security\
    \ number, financial account information, your precise geolocation data, or your genetic data) for limited purposes, such as providing you with the services you requested.\nYou also have the right to\
    \ be notified, before or at the point businesses collect your personal information, of the types of personal information they are collecting and what they may do with that information. Generally, businesses\
    \ cannot discriminate against you for exercising your rights under the CCPA. Businesses cannot make you waive these rights, and any contract provision that says you waive these rights is unenforceable.\n\
    \          2. What if I am not a California resident?\nOnly California residents have rights under the CCPA. A California resident is a natural person (as opposed to a corporation or other business\
    \ entity) who resides in California, even if the person is temporarily outside of the state.\n          3. What is considered personal information and sensitive personal information under the CCPA?\
    \ \nPersonal information\n is information that identifies, relates to, or could reasonably be linked with you or your household. For example, it could include your name, social security number, email\
    \ address, records of products purchased, internet browsing history, geolocation data, fingerprints, and inferences from other personal information that could create a profile about your preferences\
    \ and characteristics.\nSensitive personal information\n is a specific subset of personal information that includes certain government identifiers (such as social security numbers); an account log-in,\
    \ financial account, debit card, or credit card number with any required security code, password, or credentials allowing access to an account; precise geolocation; contents of mail, email, and text\
    \ messages; genetic data; biometric information processed to identify a consumer; information concerning a consumer’s health, sex life, or sexual orientation; or information about racial or ethnic origin,\
    \ religious or philosophical beliefs, or union membership. Consumers have the right to also limit a business’s use and disclosure of their sensitive personal information.\nPersonal information does\
    \ not include publicly available information (including public real estate/property records) and certain \ntypes of information\n.\n          4. What is not considered personal information under the\
    \ CCPA?"
- id: art-3
  title: Personal information does not include publicly available inf
  text: "Personal information does not include publicly available information that is from federal, state, or local government records, such as professional licenses and public real estate/property records.\
    \  The definition of publicly available information also includes information that a business has a reasonable basis to believe is lawfully made available to the general public by the consumer or from\
    \ widely distributed media, or certain information disclosed by a consumer and made available if the consumer has not restricted the information to a specific audience.\nThe CCPA also exempts certain\
    \ types of information such as certain medical information and consumer credit reporting information.\n          5. What businesses does the CCPA apply to?\nThe CCPA applies to for-profit businesses\
    \ that do business in California and meet any of the following:\nHave a gross annual revenue of over $25 million;\nBuy, sell, or share the personal information of 100,000 or more California residents\
    \ or households; or\nDerive 50% or more of their annual revenue from selling California residents’ personal information.\n          6. Does the CCPA apply to nonprofits or government agencies?\nThe\
    \ CCPA generally does not apply to nonprofit organizations or government agencies.\n          7. What can I do if I think a business violated the CCPA?\nYou cannot sue businesses for most CCPA violations.\
    \ You can only sue a business under the CCPA if there is a data breach, and even then, only under limited circumstances. You can sue a business if your nonencrypted and nonredacted personal information\
    \ was stolen in a data breach as a result of the business’s failure to maintain reasonable security procedures and practices to protect it. If this happens, you can sue for the amount of monetary damages\
    \ you actually suffered from the breach or “statutory damages” of up to $750 per incident. Before suing, you must give the business written notice of which CCPA sections it violated and allow 30 days\
    \ to respond in writing that it has cured the violations and that no further violations will occur. If the business is able to actually cure the violation and gives you its written statement that it\
    \ has done so, you cannot sue the business, unless it continues to violate the CCPA contrary to its statement.\nFor all other violations of the CCPA, only the Attorney General or the California Privacy\
    \ Protection Agency may take legal action against non-compliant entities. The Attorney General does not represent individual California consumers. Using consumer complaints and other information, the\
    \ Attorney General may identify patterns of misconduct that may lead to investigations and actions on behalf of the collective legal interests of the people of California. If you believe a business\
    \ has violated the CCPA, you may \nfile a consumer complaint\n with the Office of the Attorney General. If you choose to file a complaint with our office, explain exactly how the business violated the\
    \ CCPA, and describe when and how the violation occurred. Please note that the Attorney General cannot represent you or give you legal advice on how to resolve your individual complaint.  Starting on\
    \ July 1, 2023, you also will be able to file complaints with the \nCalifornia Privacy Protection Agency\n for violations of the CCPA, as amended, occurring on or after that date.\n          8. What\
    \ kind of data breach can I sue a business for under the CCPA? \nYou can only sue businesses under the CCPA if certain conditions are met. The type of personal information that must have been stolen\
    \ is your first name (or first initial) and last name in combination with any of the following:\nYour social security number\nYour driver’s license number, tax identification number, passport number,\
    \ military identification number, or other unique identification number issued on a government document commonly used to identify a person's identity"
- id: art-4
  title: 'Your financial account number, credit card number, or debit '
  text: "Your financial account number, credit card number, or debit card number if combined with any required security code, access code, or password that would allow someone access to your account\nYour\
    \ medical or health insurance information\nYour fingerprint, retina or iris image, or other unique biometric data used to identify a person's identity (but not including photographs unless used or stored\
    \ for facial recognition purposes)\nThis personal information must have been stolen in nonencrypted and nonredacted form. In addition, the personal information must have been stolen in a data breach\
    \ as a result of the business’s failure to maintain reasonable security procedures and practices to protect it. If this happens, you can sue for the amount of monetary damages you actually suffered\
    \ from the breach or “statutory damages” of up to $750 per incident. Before suing, you must give the business written notice of which CCPA sections it violated and allow 30 days to respond in writing\
    \ that it has cured the violations and that no further violations will occur. If the business is able to actually cure the violation and gives you its written statement that it has done so, you cannot\
    \ sue the business, unless it continues to violate the CCPA contrary to its statement.\n          9. Do businesses need to comply with the statutory CPRA amendments to the CCPA that went into effect\
    \ on January 1, 2023? \nYes. As of January 1, 2023, the CPRA’s amendments to the CCPA are in effect, and businesses are required to comply with all express statutory requirements. Businesses are also\
    \ required to comply with those CCPA regulations currently in effect.\n          10. Are there any CCPA regulations currently in effect?  \nYes. The California Department of Justice promulgated an initial\
    \ round of regulations implementing the CCPA on August 14, 2020 and further amended on March 15, 2021. Those regulations were recently updated by the California Privacy Protection Agency. These regulations\
    \ appear in \nTitle 11, Division 6, Section 7001 et seq. of the California Code of Regulations\n and were effective on March 29, 2023.\n          11. Are the statutory exemptions for employee data and\
    \ business-to-business transactions still in effect?  \nNo. The exemptions for employment-related personal information and personal information reflecting business-to-business transactions described\
    \ in Civil Code Sec. 1798.145(m)-(n) expired on December 31, 2022.\n          12. Can I use an authorized agent to submit a request?\nYes.  You may authorize another person to submit a CCPA request\
    \ on your behalf.  You may also authorize a business entity registered with the California Secretary of State to submit a request on your behalf.\nPlease note that if you use an authorized agent, businesses\
    \ may require more information from either the authorized agent or from you to verify that you are the person directing the agent.  For example, for requests to know or delete your personal information,\
    \ the business may require the authorized agent to provide proof that you gave that agent signed permission to submit the request.  Businesses may also require you to verify your identity directly with\
    \ the business or directly confirm with the business that you gave the authorized agent permission to submit the request.\nBack To Top\nB. RIGHT TO OPT-OUT OF SALE OR SHARING\n          1. What is the\
    \ right to opt-out?\nYou may request that businesses stop selling or sharing your personal information (“opt-out”).  Note that sharing refers specifically to sharing for cross-context behavioral advertising,\
    \ which is the targeting of advertising to a \nconsumer\n based on the \nconsumer\n’s \npersonal information\n obtained from the \nconsumer"
- id: art-5
  title: ’s online activity across numerous websites. With some excep
  text: "’s online activity across numerous websites. With some exceptions, businesses cannot sell or share your personal information after they receive your opt-out request unless you later provide authorization\
    \ allowing them to do so again. Businesses must wait at least 12 months before asking you to opt back in to the sale or sharing of your personal information.\n          2. Can businesses sell a child’s\
    \ personal information?\nBusinesses can only sell the personal information of a child that they know to be under the age of 16 if they get affirmative authorization (“opt-in”) for the sale of the child’s\
    \ personal information. For children under the age of 13, that opt-in must come from the child’s parent or guardian. For children who are at least 13 years old but under the age of 16, the opt-in can\
    \ come from the child.\n          3. How do I submit my opt-out request?\nBusinesses that sell personal information are subject to the CCPA's requirement to provide a clear and conspicuous “Do Not Sell\
    \ or Share My Personal Information” link on their website that allows you to submit an opt-out request. Businesses cannot require you to create an account in order to submit your request. Businesses\
    \ also should not require you to verify your identity, though they can ask you basic questions to identify which personal information is associated with you.\nYou can also submit an opt-out request\
    \ via a user-enabled global privacy control, like the GPC, discussed in FAQ 8 & 9 below. If you can’t find a business’s “Do Not Sell or Share My Personal Information” link, review its privacy policy\
    \ to see if it sells or shares personal information. If the business does, it must also include that link in its privacy policy.\nIf a business’s \"Do Not Sell My Personal Information\" link or other\
    \ designated method of submitting opt-out requests is not working or difficult to find, you may report the business to our office (\nhttps://oag.ca.gov/contact/consumer-complaint-against-business-or-company\n\
    ). \n          4. How long does the business have to respond to my opt-out request? \nBusinesses must respond as soon as feasibly possible to your request, up to a maximum of 15 business days from the\
    \ date they received your request to opt-out.\n          5. Why is the business asking me for more information?\nWhile businesses are not required to verify that the person submitting an opt-out request\
    \ is really the consumer for whom the business has personal information, they may need to ask you for additional information to make sure they stop selling the right person’s personal information. If\
    \ the business asks for personal information to verify your identity, it can only use that information for this verification purpose.\n          6. Why did the business deny my opt-out request?\nThere\
    \ are some exceptions to the opt-out right. Common reasons why businesses may refuse to stop selling your personal information include:\nSale or sharing is necessary for the business to comply with\
    \ legal obligations, exercise legal claims or rights, or defend legal claims\nThe information is publicly available information, certain medical information, consumer credit reporting information, or\
    \ other types of information exempt from the CCPA.\nSee \nCivil Code section 1798.145\n for more exceptions.\nIf you do not know why a business denied your opt-out request, follow up with the business\
    \ to ask it for its reasons.\n          7. Why did I get a response that the business is a service provider that does not have to act on my request?\nMany businesses use other businesses to provide\
    \ services for them. For example, a retailer may contract with a payment card processor to process customer credit card transactions or a shipping company to deliver orders. These entities may qualify\
    \ as “service providers” under the CCPA."
- id: art-6
  title: The CCPA treats service providers differently than the busin
  text: "The CCPA treats service providers differently than the businesses they serve. It is the business that is responsible for responding to consumer requests.  If you submit a request to opt-out to\
    \ a service provider of a business instead of the business itself, the service provider may deny the request. You must submit your request to the business itself.\nIf a service provider has said that\
    \ it does not or cannot act on your request because it is a service provider, you may follow up to ask who the business is. However, sometimes the service provider will not be able to provide that information.\
    \ You may be able to determine who the business is based on the services that the service provider provides, although sometimes this may be difficult or impossible.\n          8. What is the GPC?\n\
    Businesses that sell or share personal information must offer two or more methods for consumers to submit requests to opt-out of the sale of their personal information. For businesses that collect personal\
    \ information from consumers online, one acceptable method for consumers to opt-out of sales or sharing is via a user-enabled global privacy control, like the \nGPC\n.  Developed in response to the\
    \ CCPA and to enhance consumer privacy rights, the GPC is a ‘stop selling or sharing my data switch’ that is available on some internet browsers, like Mozilla Firefox, Duck Duck Go, and Brave, or as\
    \ a browser extension. It is a proposed technical standard that reflects what the CCPA regulations contemplated – some consumers want a comprehensive option that broadly signals their opt-out request,\
    \ as opposed to making requests on multiple websites on different browsers or devices. Opting out of the sale or sharing of personal information should be easy for consumers, and the GPC is one option\
    \ for consumers who want to submit requests to opt-out of the sale or sharing of personal information via a user-enabled global privacy control. Under law, it must be honored by covered businesses as\
    \ a valid consumer request to stop the sale or sharing of personal information.\nTo learn more about the GPC, you can also visit \nhttps://oag.ca.gov/privacy/ccpa/gpc\n          9. How do I submit my\
    \ opt-out request using the GPC?\nTo learn more about the GPC, you can visit its website \nhere\n.  Developers have begun to innovate around the GPC and created different mechanisms for consumers, such\
    \ as EFF’s \nPrivacy Badger\n extension or the Brave Privacy Browser.\nBack To Top\nC. REQUESTS TO KNOW\n          1. What is the right to know?\nYou may request that businesses disclose to you what\
    \ personal information they have collected, used, shared, or sold about you, and why they collected, used, shared, or sold that information. Specifically, you may request that businesses disclose:\n\
    The categories of personal information collected\nSpecific pieces of personal information collected\nThe categories of sources from which the business collected personal information\nThe purposes for\
    \ which the business uses the personal information\nThe categories of third parties with whom the business shares the personal information\nThe categories of information that the business sells or discloses\
    \ to third parties\nBusinesses must provide you this information for the 12-month period preceding your request. They must provide this information to you free of charge.\n          2. How do I submit\
    \ my request to know?\nBusinesses must designate at least two methods for you to submit your request—for example, an email address, website form, or hard copy form. One of those methods has to be a\
    \ toll-free phone number and, if the business has a website, one of those methods has to be through its website. However, if a business operates exclusively online, it only needs to provide an email\
    \ address for submitting requests to know.\nBusinesses cannot make you create an account just to submit a request to know, but if you already have an account with the business, it may require you to\
    \ submit your request through that account."
- id: art-7
  title: Make sure you submit your request to know through one of the
  text: "Make sure you submit your request to know through one of the business’s designated methods, which may be different from its normal customer service contact information. If you can’t find a business’s\
    \ designated methods, review its privacy policy, which must include instructions on how you can submit your request.\nIf a business’s designated method of submitting requests to know is not working,\
    \ notify the business in writing and consider submitting your request through another designated method if possible.\n          3. How long does the business have to respond to my request to know?\n\
    Businesses must respond to your request within 45 calendar days. They can extend that deadline by another 45 days (90 days total) if they notify you.\nIf you submitted a request to know and have not\
    \ received any response within the timeline, check the business’s privacy policy to make sure you submitted your request through the designated way. Follow up with the business to see if the business\
    \ is subject to the CCPA and to follow up on your request.\n          4. Why is the business asking me for more information?\nBusinesses must verify that the person making a request to know is the consumer\
    \ about whom the business has personal information. Businesses may need to ask you for additional information for verification purposes. If the business asks for personal information to verify your\
    \ identity, it can only use that information for this verification purpose.\n          5. Why did the business deny my request to know?\nThere are some exceptions to the right to know. Common reasons\
    \ why businesses may refuse to disclose your personal information include:\nThe business cannot verify your request\nThe request is manifestly unfounded or excessive, or the business has already provided\
    \ personal information to you more than twice in a 12-month period\nBusinesses cannot disclose certain sensitive information, such as your social security number, financial account number, or account\
    \ passwords, but they must tell you if they’re collecting that type of information\nDisclosure would restrict the business’s ability to comply with legal obligations, exercise legal claims or rights,\
    \ or defend legal claims\nIf the personal information is certain medical information, consumer credit reporting information, or other types of information exempt from the CCPA\nSee \nCivil Code section\
    \ 1798.145\n for more exceptions.\nIf you do not know why a business denied your request to know, follow up with the business to ask it for its reasons.\n          6. Why did I get a response that the\
    \ business is a service provider that does not have to act on my request?\nMany businesses use other businesses to provide services for them. For example, a retailer may contract with a payment card\
    \ processor to process customer credit card transactions or a shipping company to deliver orders. These entities may qualify as “service providers” under the CCPA.\nThe CCPA treats service providers\
    \ differently than the businesses they serve. It is the business that is responsible for responding to consumer requests.  If you submit a request to know to a service provider of a business instead\
    \ of the business itself, the service provider may deny the request. You must submit your request to the business itself.\nIf a service provider has said that it does not or cannot act on your request\
    \ because it is a service provider, you may follow up to ask who the business is. However, sometimes the service provider will not be able to provide that information. You may be able to determine who\
    \ the business is based on the services that the service provider provides, although sometimes this may be difficult or impossible.\nBack To Top\nD. REQUESTS TO DELETE\n          1. What is my right\
    \ to delete personal information?\nYou may request that businesses delete personal information they collected from you and to tell their service providers to do the same. However, there are \nmany exceptions"
- id: art-8
  title: ' (see FAQ D.5) that allow businesses to keep your personal i'
  text: " (see FAQ D.5) that allow businesses to keep your personal information.\n          2. How do I submit my right to delete?\nReview the business’s privacy policy, which must include instructions\
    \ on how you can submit your request to delete.\nBusinesses must designate at least two methods for you to submit your request—for example, a toll-free number, email address, website form, or hard copy\
    \ form. However, if a business operates exclusively online, it only needs to provide an email address for submitting requests.\nBusinesses cannot make you create an account just to submit a deletion\
    \ request, but if you already have an account with the business, it may require you to submit your request through that account.\nMake sure you submit your deletion request through one of the business’s\
    \ designated methods, which may be different from its normal customer service contact information.\nIf a business’s designated method of submitting requests to delete is not working, notify the business\
    \ in writing and consider submitting your request through another designated method if possible.\n          3. How long does the business have to respond to my request to delete?\nBusinesses must respond\
    \ to your request within 45 calendar days. They can extend that deadline by another 45 days (90 days total) if they notify you. \nIf you submitted a request to delete and have not received any response\
    \ within the timeline, check the business’s privacy policy to make sure you submitted your request through the designated way. Follow up with the business to see if the business is subject to the CCPA\
    \ and to follow up on your request.\n          4. Why is the business asking me for more information?\nBusinesses must verify that the person making a request to delete is the consumer about whom the\
    \ business has personal information. Businesses may need to ask you for additional information for verification purposes. If the business asks for personal information to verify your identity, it can\
    \ only use that information for this verification purpose.\n          5. Why did the business deny my request to delete?\nThere are exceptions to the right to delete. Common reasons why businesses may\
    \ keep your personal information include:\nIf the information is exempt from the CCPA.  This includes: \nPublicly available information (such as your address, which is often in public real estate/property\
    \ records)\n.  However, if you are a law enforcement officer, public official, or Safe at Home participant (available to victims of domestic violence, stalking, sexual assault, human trafficking, elder\
    \ and dependent abuse, as well as reproductive health workers), you may request a website to not publicly post your address as described \nhere\n.\nCertain \ntypes of information\n such as medical information\
    \ or consumer credit reporting information.\nThe business cannot verify your request\nTo complete your transaction, provide a reasonably anticipated product or service, or for certain warranty and product\
    \ recall purposes\nFor certain business security practices\nFor certain internal uses that are compatible with reasonable consumer expectations or the context in which the information was provided\n\
    To comply with legal obligations, exercise legal claims or rights, or defend legal claims\nIf the personal information is certain medical information, consumer credit reporting information, or other\
    \ types of information exempt from the CCPA\nSee \nCivil Code sections 1798.105(d)\n and \n1798.145\n for more exceptions.\nIf you do not know why a business denied your request to delete, follow up\
    \ with the business to ask it for its reasons.\n          6. Why did I get a response that the business is a service provider that does not have to act on my request?"
- id: art-9
  title: Many businesses use other businesses to provide services for
  text: "Many businesses use other businesses to provide services for them. For example, a retailer may contract with a payment card processor to process customer credit card transactions or a shipping\
    \ company to deliver orders. These entities may qualify as “service providers” under the CCPA.\nThe CCPA treats service providers differently than the businesses they serve. It is the business that\
    \ is responsible for responding to consumer requests.  If you submit a request to delete to a service provider of a business instead of the business itself, the service provider may deny the request.\
    \ You must submit your request to the business itself.\nIf a service provider has said that it does not or cannot act on your request because it is a service provider, you may follow up to ask who the\
    \ business is. However, sometimes the service provider will not be able to provide that information. You may be able to determine who the business is based on the services that the service provider\
    \ provides, although sometimes this may be difficult or impossible.\n          7. Why is a debt collector still calling me about my debt even though I asked it to delete my information?\nCreditors,\
    \ collection agencies, and other debt collectors can still try to collect debts that you owe even if you asked them to delete your personal information. Learn more about debt collectors—including what\
    \ they can and can’t do—\nhere\n.\n          "
