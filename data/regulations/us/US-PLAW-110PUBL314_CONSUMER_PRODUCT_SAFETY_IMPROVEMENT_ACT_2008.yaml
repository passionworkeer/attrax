    (3) METHODS FOR SCREENING LEAD IN SMALL PAINTED

    AREAS.—In order to provide for effective and efficient enforce-

    ment of the limit set forth in section 1303.1 of title 16, Code

    of Federal Regulations, the Commission may rely on x-ray

    fluorescence technology or other alternative methods for meas-

    uring lead in paint or other surface coatings on products subject

    to such section where the total weight of such paint or surface

    coating is no greater than 10 milligrams or where such paint

    or surface coating covers no more than 1 square centimeter

    of the surface area of such products. Such alternative methods

    for measurement shall not permit more than 2 micrograms

    of lead in a total weight of 10 milligrams or less of paint

    or other surface coating or in a surface area of 1 square centi-

    meter or less.

