    regulation—

    ‘‘(A) initiate a program by which a manufacturer or

    private labeler may label a consumer product as complying

    with the certification requirements of subsection (a); and

    Protocols. ‘‘(B) establish protocols and standards—

    Standards. ‘‘(i) for ensuring that a children’s product tested

    for compliance with an applicable children’s product

    safety rule is subject to testing periodically and when

