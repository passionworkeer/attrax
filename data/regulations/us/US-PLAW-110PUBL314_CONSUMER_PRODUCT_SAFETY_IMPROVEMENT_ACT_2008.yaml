    (4) ALTERNATIVE METHODS OF MEASURING LEAD IN PAINT

    GENERALLY.—

    (A) STUDY.—Not later than 1 year after the date of Deadline.

    enactment of this Act, the Commission shall complete a

    study to evaluate the effectiveness, precision, and reliability

    of x-ray fluorescence technology and other alternative

    methods for measuring lead in paint or other surface

    coatings when used on a children’s product or furniture

    article in order to determine compliance with part 1303

    of title 16, Code of Federal Regulations, as modified pursu-

    ant to this subsection.

    (B) RULEMAKING.—If the Commission determines,

    based on the study in subparagraph (A), that x-ray fluores-

    cence technology or other alternative methods for meas-

    uring lead in paint are as effective, precise, and reliable

    as the methodology used by the Commission for compliance

    determinations prior to the date of enactment of this Act,

    the Commission may promulgate regulations governing the

    use of such methods in determining the compliance of

    products with part 1303 of title 16, Code of Federal Regula-

    tions, as modified pursuant to this subsection. Any regula-

    tions promulgated by the Commission shall ensure that

    such alternative methods are no less effective, precise, and

    reliable than the methodology used by the Commission

    prior to the date of enactment of this Act.

    (5) PERIODIC REVIEW.—The Commission shall, no less fre- Deadline.

    quently than every 5 years after the Commission completes

    the study required by paragraph (4)(A), review and revise any

    methods for measurement utilized by the Commission pursuant

    to paragraph (3) or pursuant to any regulations promulgated

    under paragraph (4) to ensure that such methods are the most

    effective methods available to protect children’s health. The

    Commission shall conduct an ongoing effort to study and

    encourage the further development of alternative methods for

    measuring lead in paint and other surface coating that can

    effectively, precisely, and reliably detect lead levels at or below

    the level set forth in part 1303 of title 16, Code of Federal

    Regulations, or any lower level established by regulation.

    (6) NO EFFECT ON LEGAL LIMIT.—Nothing in paragraph

    (3), nor reliance by the Commission on any alternative method

    of measurement pursuant to such paragraph, nor any rule

    prescribed pursuant to paragraph (4), nor any method estab-

    lished pursuant to paragraph (5) shall be construed to alter

    the limit set forth in section 1303 of title 16, Code of Federal

    Regulations, as modified pursuant to this subsection, or provide

    any exemption from such limit.

    (7) CONSTRUCTION.—Nothing in this subsection shall be

    construed to affect the authority of the Commission or any

    other person to use alternative methods for detecting lead as

    a screening method to determine whether further testing or

    action is needed.

