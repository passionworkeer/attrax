    Public Law 110–314

    110th Congress

    An Act

    To establish consumer product safety standards and other safety requirements

    Aug. 14, 2008

    for children’s products and to reauthorize and modernize the Consumer Product

    [H.R. 4040] Safety Commission.

    Be it enacted by the Senate and House of Representatives of

    Consumer the United States of America in Congress assembled,

    Product Safety

    Improvement Act SECTION 1. SHORT TITLE; TABLE OF CONTENTS.

