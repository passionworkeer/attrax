    ‘‘(ii) for the testing of random samples to ensure

    continued compliance;

    ‘‘(iii) for verifying that a children’s product tested

    by a conformity assessment body complies with

    applicable children’s product safety rules; and

    ‘‘(iv) for safeguarding against the exercise of undue

    influence on a third party conformity assessment body

    by a manufacturer or private labeler.

    ‘‘(e) WITHDRAWALOFACCREDITATION.—

    ‘‘(1) IN GENERAL.—The Commission may withdraw its

    accreditation or its acceptance of the accreditation of a third

    party conformity assessment body accredited under this section

    if the Commission finds, after notice and investigation, that—

    ‘‘(A) a manufacturer, private labeler, or governmental

    entity has exerted undue influence on such conformity

    assessment body or otherwise interfered with or com-

    promised the integrity of the testing process with respect

    to the certification of a children’s product under this sec-

    tion; or

    ‘‘(B) such conformity assessment body failed to comply

    with an applicable protocol, standard, or requirement estab-

    lished by the Commission under subsection (d).

    ‘‘(2) PROCEDURE.—In any proceeding to withdraw the

    accreditation of a conformity assessment body, the Commis-

    sion—

    ‘‘(A) shall consider the gravity of the conformity assess-

    ment body’s action or failure to act, including—

    ‘‘(i) whether the action or failure to act resulted

    in injury, death, or the risk of injury or death;

    ‘‘(ii) whether the action or failure to act constitutes

    an isolated incident or represents a pattern or practice;

    and

    ‘‘(iii) whether and when the conformity assessment

    body initiated remedial action; and

    ‘‘(B) may—

    ‘‘(i) withdraw its acceptance of the accreditation

    of the conformity assessment body on a permanent

    or temporary basis; and

    ‘‘(ii) establish requirements for reaccreditation of

    the conformity assessment body.

    ‘‘(3) FAILURE TO COOPERATE.—The Commission may sus-

    pend the accreditation of a conformity assessment body if it

    fails to cooperate with the Commission in an investigation

    under this section.

    ‘‘(f) DEFINITIONS.—In this section:

    ‘‘(1) CHILDREN’S PRODUCT SAFETY RULE.—The term ‘chil-

    dren’s product safety rule’ means a consumer product safety

    rule under this Act or similar rule, regulation, standard, or

    ban under any other Act enforced by the Commission, including

    a rule declaring a consumer product to be a banned hazardous

    product or substance.

    ‘‘(2) THIRDPARTYCONFORMITYASSESSMENTBODY.—

    ‘‘(A) IN GENERAL.—The term ‘third party conformity

    assessment body’ means a conformity assessment body

    that, except as provided in subparagraph (D), is not owned,

    managed, or controlled by the manufacturer or private

