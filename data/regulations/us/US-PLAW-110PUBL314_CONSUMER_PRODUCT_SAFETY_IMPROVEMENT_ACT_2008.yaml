    SEC. 2. REFERENCES.

    (a) DEFINEDTERMS.—As used in this Act— 15 USC 2051

    (1) the term ‘‘appropriate Congressional committees’’ means note.

    the Committee on Energy and Commerce of the House of Rep-

    resentatives and the Committee on Commerce, Science, and

    Transportation of the Senate; and

    (2) the term ‘‘Commission’’ means the Consumer Product

    Safety Commission.

    (b) CONSUMER PRODUCT SAFETY ACT.—Except as otherwise

    expressly provided, whenever in this Act an amendment is

    expressed as an amendment to a section or other provision, the

    reference shall be considered to be made to a section or other

    provision of the Consumer Product Safety Act (15 U.S.C. 2051

    et seq.).

    SEC. 3. AUTHORITY TO ISSUE IMPLEMENTING REGULATIONS. 15 USC 2051

    note.

    The Commission may issue regulations, as necessary, to imple-

    ment this Act and the amendments made by this Act.

    TITLE I—CHILDREN’S PRODUCT SAFETY

    SEC. 101. CHILDREN’S PRODUCTS CONTAINING LEAD; LEAD PAINT 15 USC 1278a.

    RULE.

    (a) GENERALLEADBAN.—

    (1) TREATMENT AS A BANNED HAZARDOUS SUBSTANCE.—

    Except as expressly provided in subsection (b) beginning on

    the dates provided in paragraph (2), any children’s product

    (as defined in section 3(a)(16) of the Consumer Product Safety

    Act (15 U.S.C. 2052(a)(16))) that contains more lead than the

    limit established by paragraph (2) shall be treated as a banned

    hazardous substance under the Federal Hazardous Substances

    Act (15 U.S.C. 1261 et seq.).

    (2) LEADLIMIT.— Effective dates.

    (A) 600 PARTS PER MILLION.—Except as provided in

    subparagraphs (B), (C), (D), and (E), beginning 180 days

    after the date of enactment of this Act, the lead limit

    referred to in paragraph (1) is 600 parts per million total

    lead content by weight for any part of the product.

    (B) 300 PARTS PER MILLION.—Except as provided by

    subparagraphs (C), (D), and (E), beginning on the date

