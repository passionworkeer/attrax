    Applicability. (C) 100 PARTS PER MILLION.—Except as provided in

    subparagraphs (D) and (E), beginning on the date that

    is 3 years after the date of enactment of this Act, subpara-

    graph (B) shall be applied by substituting ‘‘100 parts per

    million’’ for ‘‘300 parts per million’’ unless the Commission

    determines that a limit of 100 parts per million is not

    technologically feasible for a product or product category.

    The Commission may make such a determination only

    after notice and a hearing and after analyzing the public

    health protections associated with substantially reducing

    lead in children’s products.

    (D) ALTERNATE REDUCTION OF LIMIT.—If the Commis-

    sion determines under subparagraph (C) that the 100 parts

    per million limit is not technologically feasible for a product

    or product category, the Commission shall, by regulation,

    establish an amount that is the lowest amount of lead,

    lower than 300 parts per million, the Commission deter-

    mines to be technologically feasible to achieve for that

    product or product category. The amount of lead established

    by the Commission under the preceding sentence shall

    be substituted for the 300 parts per million limit under

    subparagraph (B) beginning on the date that is 3 years

    after the date of enactment of this Act.

    (E) PERIODIC REVIEW AND FURTHER REDUCTIONS.—The

    Commission shall, based on the best available scientific

    and technical information, periodically review and revise

    downward the limit set forth in this subsection, no less

    frequently than every 5 years after promulgation of the

    limit under subparagraph (C) or (D) to require the lowest

    amount of lead that the Commission determines is techno-

    logically feasible to achieve. The amount of lead established

    by the Commission under the preceding sentence shall

    be substituted for the lead limit in effect immediately before

    such revision.

    (b) EXCLUSION OF CERTAIN MATERIALS OR PRODUCTS AND

    INACCESSIBLECOMPONENTPARTS.—

    (1) CERTAIN PRODUCTS OR MATERIALS.—The Commission

    may, by regulation, exclude a specific product or material from

    the prohibition in subsection (a) if the Commission, after notice

    and a hearing, determines on the basis of the best-available,

    objective, peer-reviewed, scientific evidence that lead in such

    product or material will neither—

    (A) result in the absorption of any lead into the human

    body, taking into account normal and reasonably foresee-

    able use and abuse of such product by a child, including

    swallowing, mouthing, breaking, or other children’s activi-

    ties, and the aging of the product; nor

    (B) have any other adverse impact on public health

    or safety.

    (2) EXCEPTIONFORINACCESSIBLECOMPONENTPARTS.—

    (A) IN GENERAL.—The limits established under sub-

    section (a) shall not apply to any component part of a

    children’s product that is not accessible to a child through

