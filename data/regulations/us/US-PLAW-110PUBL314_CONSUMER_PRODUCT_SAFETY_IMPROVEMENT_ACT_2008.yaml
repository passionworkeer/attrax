    (B) INACCESSIBILITY PROCEEDING.—Within 1 year after Deadline.

    the date of enactment of this Act, the Commission shall

    promulgate a rule providing guidance with respect to what

    product components, or classes of components, will be

    considered to be inaccessible for purposes of subparagraph

    (A).

    (C) APPLICATION PENDING CPSC GUIDANCE.—Until the

    Commission promulgates a rule pursuant to subparagraph

    (B), the determination of whether a product component

    is inaccessible to a child shall be made in accordance with

    the requirements laid out in subparagraph (A) for consid-

    ering a component to be inaccessible to a child.

    (3) CERTAIN BARRIERS DISQUALIFIED.—For purposes of this

    subsection, paint, coatings, or electroplating may not be consid-

    ered to be a barrier that would render lead in the substrate

    inaccessible to a child, or to prevent absorption of any lead

    into the human body, through normal and reasonably foresee-

    able use and abuse of the product.

    (4) CERTAIN ELECTRONIC DEVICES.—If the Commission

    determines that it is not technologically feasible for certain

    electronic devices, including devices containing batteries, to

    comply with subsection (a), the Commission, by regulation,

    shall—

    (A) issue requirements to eliminate or minimize the Requirements.

    potential for exposure to and accessibility of lead in such

    electronic devices, which may include requirements that

    such electronic devices be equipped with a child-resistant

    cover or casing that prevents exposure to and accessibility

    of the parts of the product containing lead; and

    (B) establish a schedule by which such electronic

    devices shall be in full compliance with the limits in sub-

    section (a), unless the Commission determines that full

    compliance will not be technologically feasible for such

    devices within a schedule set by the Commission.

    (5) PERIODIC REVIEW.—The Commission shall, based on Deadline.

    the best available scientific and technical information, periodi-

    cally review and revise the regulations promulgated pursuant

    to this subsection no less frequently than every 5 years after

    the first promulgation of a regulation under this subsection

    to make them more stringent and to require the lowest amount

    of lead the Commission determines is technologically feasible

    to achieve.

