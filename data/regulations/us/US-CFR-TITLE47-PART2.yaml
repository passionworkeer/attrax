  text: '§ 2.1

    Terms and definitions.

    (a) Where a term or definition appears in this part of the Commission''s Rules, it shall be the definitive term or definition and shall prevail throughout the Commission''s Rules.

    (b) The source of each definition is indicated as follows:

    CS—Annex to the Constitution of the International Telecommunication Union (ITU)

    CV—Annex to the Convention of the ITU

    FCC—Federal Communications Commission

    RR—ITU Radio Regulations

    (c) The following terms and definitions are issued:

    Accepted Interference.

    1

    Interference at a higher level than defined as permissible interference and which has been agreed upon between two or more administrations without prejudice to other administrations. (RR)

    1

    The terms

    permissible interference

    and

    accepted interference

    are used in the coordination of frequency assignments between administrations.

    Active Satellite.

    A satellite carrying a station intended to transmit or retransmit radiocommunication signals. (RR)

    Active Sensor.

    A measuring instrument in the earth exploration-satellite service or in the space research service by means of which information is obtained by transmission and reception of radio waves. (RR)

    Adaptive System.

    A radiocommunication system which varies its radio characteristics according to channel quality. (RR)

    Administration.

    Any governmental department or service responsible for discharging the obligations undertaken in the Constitution of the International Telecommunication Union, in the Convention of the International
    Telecommunication Union and in the Administrative Regulations. (CS)

    Aeronautical Earth Station.

    An Earth station in the fixed-satellite service, or, in some cases, in the aeronautical mobile-satellite service, located at a specified fixed point on land to provide a feeder link for the aeronautical
    mobile-satellite service. (RR)

    Aeronautical Fixed Service.

    A radiocommunication service between specified fixed points provided primarily for the safety of air navigation and for the regular, efficient and economical operation of air transport. (RR)

    Aeronautical Fixed Station.

    A station in the aeronautical fixed service. (RR)

    Aeronautical Mobile Off-Route (OR) Service.

    An aeronautical mobile service intended for communications, including those relating to flight coordination, primarily outside national or international civil air routes. (RR)

    Aeronautical Mobile Route (R) Service.

    An aeronautical mobile service reserved for communications relating to safety and regularity of flight, primarily along national or international civil air routes. (RR)

    Aeronautical Mobile-Satellite Off-Route (OR) Service.

    An aeronautical mobile-satellite service intended for communications, including those relating to flight coordination, primarily outside national and international civil air routes. (RR)

    Aeronautical Mobile-Satellite Route (R) Service.

    An aeronautical mobile-satellite service reserved for communications relating to safety and regularity of flights, primarily along national or international civil air routes. (RR)

    Aeronautical Mobile-Satellite Service.

    A mobile-satellite service in which mobile earth stations are located on board aircraft; survival craft stations and emergency position-indicating radiobeacon stations may also participate in this service.
    (RR)

    Aeronautical Mobile Service.

    A mobile service between aeronautical stations and aircraft stations, or between aircraft stations, in which survival craft stations may participate; emergency position-indicating radiobeacon stations
    may also participate in this service on designated distress and emergency frequencies. (RR)

    Aeronautical Radionavigation-Satellite Service.

    A radionavigation-satellite service in which earth stations are located on board aircraft. (RR)

    Aeronautical Radionavigation Service.

    A radio-navigation service intended for the benefit and for the safe operation of aircraft. (RR)

    Aeronautical Station.

    A land station in the aeronautical mobile service.

    Note:

    In certain instances, an aeronautical station may be located, for example, on board ship or on a platform at sea. (RR)

    Aircraft Earth Station.

    A mobile earth station in the aeronautical mobile-satellite service located on board an aircraft. (RR)

    Aircraft Station.

    A mobile station in the aeronautical mobile service, other than a survival craft station, located on board an aircraft. (RR)

    Allocation (of a frequency band).

    Entry in the Table of Frequency Allocations of a given frequency band for the purpose of its use by one or more terrestrial or space radiocommunication services or the radio astronomy service under
    specified conditions. This term shall also be applied to the frequency band concerned. (RR)

    Allotment (of a radio frequency or radio frequency channel).

    Entry of a designated frequency channel in an agreed plan, adopted by a competent conference, for use by one or more administrations for a terrestrial or space radiocommunication service in one or more
    identified countries or geographical area and under specified conditions. (RR)

    Altitude of the Apogee or Perigee.

    The altitude of the apogee or perigee above a specified reference surface serving to represent the surface of the Earth. (RR)

    Amateur-Satellite Service.

    A radiocommunication service using space stations on earth satellites for the same purposes as those of the amateur service. (RR)

    Amateur Service.

    A radiocommunication service for the purpose of self-training, intercommunication and technical investigations carried out by amateurs, that is, by duly authorized persons interested in radio technique
    solely with a personal aim and without pecuniary interest. (RR)

    Amateur Station.

    A station in the amateur service. (RR)

    Assigned Frequency.

    The centre of the frequency band assigned to a station. (RR)

    Assigned Frequency Band.

    The frequency band within which the emission of a station is authorized; the width of the band equals the necessary bandwidth plus twice the absolute value of the frequency tolerance. Where space stations
    are concerned, the assigned frequency band includes twice the maximum Doppler shift that may occur in relation to any point of the Earth''s surface. (RR)

    Assignment (of a radio frequency or radio frequency channel).

    Authorization given by an administration for a radio station to use a radio frequency or radio frequency channel under specified conditions. (RR)

    Base Earth Station.

    An earth station in the fixed-satellite service or, in some cases, in the land mobile-satellite service, located at a specified fixed point or within a specified area on land to provide a feeder link
    for the land mobile-satellite service. (RR)

    Base Station.

    A land station in the land mobile service. (RR)

    Broadcasting-Satellite Service.

    A radiocommunication service in which signals transmitted or retransmitted by space stations are intended for direct reception by the general public.

    Note:

    In the broadcasting-satellite service, the term

    direct reception

    shall encompass both individual reception and community reception. (RR)

    Broadcasting Service.

    A radiocommunication service in which the transmissions are intended for direct reception by the general public. This service may include sound transmissions, television transmissions or other types
    of transmission. (CS)

    Broadcasting Station.

    A station in the broadcasting service. (RR)

    Carrier Power (of a radio transmitter).

    The average power supplied to the antenna transmission line by a transmitter during one radio frequency cycle taken under the condition of no modulation. (RR)

    Characteristic Frequency.

    A frequency which can be easily identified and measured in a given emission.

    Note:

    A carrier frequency may, for example, be designated as the characteristic frequency. (RR)

    Class of Emission.

    The set of characteristics of an emission, designated by standard symbols, e.g., type of modulation, modulating signal, type of information to be transmitted, and also if appropriate, any additional
    signal characteristics. (RR)

    Coast Earth Station.

    An earth station in the fixed-satellite service or, in some cases, in the maritime mobile-satellite service, located at a specified fixed point on land to provide a feeder link for the maritime mobile-satellite
    service. (RR)

    Coast Station.

    A land station in the maritime mobile service. (RR)

    Community Reception (in the broadcasting-satellite service).

    The reception of emissions from a space station in the broadcasting-satellite service by receiving equipment, which in some cases may be complex and have antennae larger than those for individual reception,
    and intended for use: (1) by a group of the general public at one location; or (2) through a distribution system covering a limited area. (RR)

    Conterminous United States.

    The contiguous 48 States and the District of Columbia. (FCC)

    Coordinated Universal Time (UTC).

    Time scale, based on the second (SI), as defined in Recommendation ITU-R TF.460-6.

    Note:

    For most practical purposes associated with the ITU

    Radio Regulations

    , UTC is equivalent to mean solar time at the prime meridian (0° longitude), formerly expressed in GMT. (RR)

    Coordination Area.

    When determining the need for coordination, the area surrounding an earth station sharing the same frequency band with terrestrial stations, or surrounding a transmitting earth station sharing the same
    bidirectionally allocated frequency band with receiving earth stations, beyond which the level of permissible interference will not be exceeded and coordination is therefore not required. (RR)

    Coordination Contour.

    The line enclosing the coordination area. (RR)

    Coordination Distance.

    When determining the need for coordination, the distance on a given azimuth from an earth station sharing the same frequency band with terrestrial stations, or from a transmitting earth station sharing
    the same bidirectionally allocated frequency band with receiving earth stations, beyond which the level of permissible interference will not be exceeded and coordination is therefore not required. (RR)

    Deep Space.

    Space at distance from the Earth equal to, or greater than, 2 × 10

    6

    kilometers. (RR)

    Differential Global Positioning System (DGPS) Station.

    A differential RNSS station for specific augmentation of GPS.

    Differential Radionavigation Satellite Service (Differential RNSS) Station.

    A station used for the transmission of differential correction data and related information (such as ionospheric data and RNSS satellite integrity information) as an augmentation to an RNSS system for
    the purpose of improved navigation accuracy.

    Direct Sequence Systems.

    A spread spectrum system in which the carrier has been modulated by a high speed spreading code and an information data stream. The high speed code sequence dominates the “modulating function” and is
    the direct cause of the wide spreading of the transmitted signal.

    Duplex Operation.

    Operating method in which transmission is possible simultaneously in both directions of a telecommunication channel.

    3

    (RR)

    3

    In general, duplex operation and semi-duplex operation require two frequencies in radiocommunication; simplex operation may use either one or two.

    Earth Exploration-Satellite Service.

    A radiocommunication service between earth stations and one or more space stations, which may include links between space stations, in which:

    (1) Information relating to the characteristics of the Earth and its natural phenomena, including data relating to

    the state of the environment, is obtained from active sensors or passive sensors on Earth satellites;

    (2) Similar information is collected from airborne or Earth-based platforms;

    (3) Such information may be distributed to earth stations within the system concerned; and

    (4) Platform interrogation may be included. This service may also include feeder links necessary for its operation. (RR)

    Earth Station.

    A station located either on the earth''s surface or within the major portion of earth''s atmosphere and intended for communication:

    (1) With one or more space stations; or

    (2) With one or more stations '
