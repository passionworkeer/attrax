- id: art-5
  title: § 1211.4
  text: '§ 1211.4

    General requirements for protection against risk of injury.

    (a) If an automatically reset protective device is employed, automatic restarting of a motor shall not result in a risk of injury to persons.

    (b) A residential garage door operator is considered to comply with the requirement in paragraph (a) of this section if some means is provided to prevent the motor from restarting when the protector
    closes.

    (c) An electronic or solid-state circuit that performs a back-up, limiting, or other function intended to reduce the risk of fire, electric shock, or injury to persons, including entrapment protection
    circuits, shall comply with the requirements in UL 991 (incorporated by reference, see § 1211.40), including environmental and stress tests appropriate to the intended usage of the end-product. Exception:
    A control or electronic circuit that complies with Supplement SA of UL 325-2017 (incorporated by reference, see § 1211.40) is considered to fulfill this requirement.

    [57 FR 60455, Dec. 21, 1992, as amended at 62 FR 46667, Sept. 4, 1997; 65 FR 70657, Nov. 27, 2000; 81 FR 20228, Apr. 7, 2016; 83 FR 32568, July 13, 2018]'
- id: art-6
