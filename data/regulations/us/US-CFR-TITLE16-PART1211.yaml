  title: § 1211.8
  text: '§ 1211.8

    Secondary entrapment protection requirements.

    (a)(1) For a vertically moving door operator, a secondary entrapment protection device supplied with, or as an accessory to, an operator shall consist of:

    (i) An external photoelectric sensor that when activated results in an operator that is closing a door to reverse direction of the door, returns the door to, and stops the door at the fully open position,
    and the sensor prevents an operator from closing an open door,

    (ii) An external edge sensor installed on the edge of the door that, when activated as tested per § 1211.12(a)(4)(1) results in an operator that is closing a door to reverse direction of the door, returns
    the door to, and stops the door at the fully open position, and the sensor prevents an operator from closing an open door,

    (iii) An inherent door sensor independent of the system used to comply with § 1211.7 that, when activated, results in an operator that is closing a door to reverse direction of the door and the sensor
    prevents an operator from closing an open door, or

    (iv) Any other external or internal device that provides entrapment protection equivalent to paragraph (a)(1)(i), (ii), or (iii) of this section.

    (2) The door operator is not required to return the door to, and stop the door at, the fully open position when an inherent entrapment circuit senses an obstruction during the opening travel.

    (3) The door operator is not required to return the door to, and stop the door at, the fully open position when a control is actuated to stop the door during the opening travel—but the door cannot be
    moved towards the closing direction until the operator has reversed the door a minimum of 2 inches (50.8 mm).

    (b) For horizontal sliding garage door operators, a secondary entrapment protection device supplied with, or as an accessory to, an operator shall consist of:

    (1) An external photoelectric sensor that, when activated, results in an operator that is closing or opening a door to reverse direction of the door for a minimum of 2 inches (50.8 mm); or

    (2) An external edge sensor installed on the edge of the door that, when activated as tested per § 1211.12 (a)(4)(2), results in an operator that is closing or opening a door to reverse direction of
    the door for a minimum of 2 inches (50.8 mm).

    (c) With respect to paragraphs (a) and (b) of this section, the operator shall monitor for the presence and correct operation of the device at least once during each close cycle. Should the device not
    be present or a fault condition occurs which precludes the sensing of an obstruction, including an interruption of the wireless signal to the wireless device or an open or short circuit in the wiring
    that connects an external entrapment protection device to the operator and device''s supply source, the operator shall be constructed such that:

    (1) For a vertically moving door, the closing door shall open and an open door shall not close more than 1 foot (305 mm) below the upmost position;

    (2) For a horizontally sliding door, the door shall not move in the opening or closing direction; or

    (3) The operator shall function as required by § 1211.6(b)(1).

    (d) An external entrapment protection device or system, when employing a wireless control, shall comply with paragraph (e) of this section when installed at its farthest distance from the operator as
    recommended in the installation instructions.

    (e) An external entrapment protection device shall comply with the applicable requirements in §§ 1211.10, 1211.11, and 1211.12.

    (f) An inherent secondary entrapment protection device described in § 1211.6(b)(3) shall comply with the applicable requirements in § 1211.13. Software used in an inherent entrapment protection device
    shall comply with UL 1998 (incorporated by reference, see § 1211.40).

    [81 FR 20230, Apr. 7, 2016, as amended at 83 FR 32569, July 13, 2018]'
- id: art-10
  title: § 1211.9
  text: '§ 1211.9

    Additional entrapment protection requirements.

    (a) A means to manually detach the door operator from the door shall be supplied. The gripping surface (handle) shall be colored red and shall be easily

    distinguishable from the rest of the operator. It shall be capable of being adjusted to a height of 6 feet (1.8 m) above the garage floor when the operator is installed according to the instructions
    specified in § 1211.16(a)(2). The means shall be constructed so that a hand firmly gripping it and applying a maximum of 50 pounds (223 N) of force shall detach the operator with the door obstructed
    in the down position. The obstructing object, as described in § 1211.7(b)(3)(i), is to be located in several different positions. A marking with instructions for detaching the operator shall be provided
    as required by § 1211.17(a), (b), and (j), as applicable.

    (b) A means to manually detach the door operator from the door is not required for a door operator that is not directly attached to the door and that controls movement of the door so that:

    (1) The door is capable of being moved open from any position other than the last (closing) 2 inches (50.8 mm) of travel, and

    (2) The door is capable of being moved to the 2-inch (50.8-mm) point from any position between closed and the 2-inch (50.8-mm) point.

    (c) Actuation of a control that initiates movement of a door shall stop and may reverse the door on the closing cycle. On the opening cycle, actuation of a control shall stop the door but not reverse
    it.

    (d) An operator shall be constructed so that adjustment of limit, force or other user controls and connection of external entrapment protection devices can be accomplished without exposing normally
    enclosed live parts or wiring.

    [57 FR 60455, Dec. 21, 1992, as amended at 65 FR 70658, Nov. 27, 2000; 81 FR 20231, Apr. 7, 2016]'
- id: art-11
  title: § 1211.10
  text: '§ 1211.10

    Requirements for all entrapment protection devices.

    (a)

    General requirements.

    (1) An external entrapment protection device shall perform its intended function when tested in accordance with paragraphs (a)(2) through (4) of this section.

    (2) The device is to be installed in the intended manner and its terminals connected to circuits of the door operator as indicated by the installation instructions.

    (3) The device is to be installed and tested at minimum and maximum heights and widths representative of recommended ranges specified in the installation instructions. For doors, if not specified, devices
    are to be tested on a minimum 7 foot (2.1 m) wide door and maximum 20 foot (6.1 m) wide door.

    (4) If powered by a separate source of power, the power-input supply terminals are to be connected to supply circuits of rated voltage and frequency.

    (5) An external entrapment protection device requiring alignment, such as a photoelectric sensor, shall be provided with a means, such as a visual indicator, to show proper alignment and operation of
    the device.

    (b)

    Current protection test.

    (1) There shall be no damage to the entrapment protection circuitry if low voltage field-wiring terminals or leads are shortened or miswired to adjacent terminals.

    (2) To determine compliance with paragraph (b)(1) of this section, an external entrapment protection device is to be connected to a door operator or other source of power in the intended manner, after
    which all connections to low voltage terminals or leads are to be reversed as pairs, reversed individually, or connected to any low voltage lead or adjacent terminal.

    (3) After restoring the connections in the intended manner:

    (i) A photoelectric sensor shall comply with the Normal Operation tests per § 1211.11(a) through (c); and

    (ii) An edge sensor shall comply with the applicable Normal Operation test, per § 1211.12(a).

    (c)

    Splash test.

    (1) An external entrapment protection device intended to be installed inside a garage 3 feet or less above the floor shall withstand a water exposure as described in paragraph (c)(2) of this section
    without resulting in a risk of electric shock and shall function as intended, per paragraph (c)(3) of this section. After exposure, the external surface of the device may be dried before determining
    its functionality.

    (2) External entrapment protection devices are to be indirectly sprayed using a hose having the free end fitted with a nozzle as illustrated in Figure 2 to subpart A and connected to a water

    supply capable of maintaining a flow rate of 5 gallons (19 liters) per minute as measured at the outlet orifice of the nozzle. The water from the hose is to be played, from all sides and at any angle
    against the floor under the device in such a manner most likely to cause water to splash the enclosure of electric components. However, the nozzle is not to be brought closer than 10 feet (3.05 m) horizontally
    to the device. The water is to be sprayed for 1 minute.

