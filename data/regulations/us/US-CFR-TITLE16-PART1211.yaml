  text: '§ 1211.5

    General testing parameters.

    (a) The following test parameters are to be used in the investigation of the circuit covered by § 1211.4(c) for compliance with either, UL 991, or Supplement SA of UL 325-2017 (incorporated by reference,
    see § 1211.40):

    (1) With regard to electrical supervision of critical components, an operator being inoperative with respect to

    closing movement of the door meets the criteria for trouble indication.

    (2) A field strength of 3 volts per meter is to be used for the Radiated EMI Test.

    (3) The Composite Operational and Cycling Test is to be used for 14 days at temperature extremes of minus 35 °Celsius (minus 31 °F) and 70 °C (158 °F).

    (4) Exposure Class H5 is to be used for the Humidity Test.

    (5) A vibration level of 5g is to be used for the Vibration Test.

    (6) When a Computational Investigation is conducted, λ

    p

    shall not be greater than 6 failures/10

    6

    hours for the entire system. For external secondary entrapment protection devices or systems that are sold separately, λ

    p

    shall not be greater than 0 failures/10

    6

    hours. For internal secondary entrapment protection devices or systems whether or not they are sold separately, λ

    p

    shall not be greater than 0 failures/10

    6

    hours. The operational test is conducted for 14 days. An external secondary entrapment protection device or system that is sold separately, and that has a λ

    p

    greater than 0 failures/10

    6

    hours meets the intent of the requirement when for the combination of the operator and the specified external secondary entrapment protection device or system λ

    p

    does not exceed 6 failures/10

    6

    hours. See § 1211.18(j) through (l).

    (7) When the Demonstrated Method Test is conducted, the multiplier is to be based on the continuous usage level, and a minimum of 24 units for a minimum of 24 hours per unit are to be tested.

    (8) The Endurance test is to be conducted concurrently with the Operational test. The control shall perform its intended function while being conditioned for fourteen days in an ambient air temperature
    of 60 °C (140 °F), or 10 °C (18 °F) greater than the operating temperature of the control, whichever is higher. During the test, the control is to be operated in a manner representing the opening and
    closing of the door at a rate of one open-close operation per minute.

    (9) For the Electrical Fast Transient Burst Test, test level 3 is to be used for residential garage door operators.

    (b) In the evaluation of entrapment protection circuits used in residential garage door operators, the critical condition flow chart shown in figure 1 to subpart A shall be used:

    (1) To conduct a failure-mode and effect analysis (FMEA);

    (2) In investigating the performance during the Environmental Stress Tests;

    (3) During the Power Cycling Safety for Tests in accordance with UL 991 (incorporated by reference, see § 1211.40); and

    (4) During evaluation of the circuit to the requirements of Supplement SA of UL 325-2017 (incorporated by reference, see § 1211.40).

    [57 FR 60455, Dec. 21, 1992, as amended at 62 FR 46667, Sept. 4, 1997; 65 FR 70657, Nov. 27, 2000; 81 FR 20228, Apr. 7, 2016; 83 FR 32568, July 13, 2018]'
- id: art-7
  title: § 1211.6
  text: '§ 1211.6

    General entrapment protection requirements.

    (a) A residential garage door operator system shall be provided with inherent primary entrapment protection that complies with the requirements as specified in § 1211.7.

    (b) In addition to the inherent primary entrapment protection as required by paragraph (a) of this section, a vertically moving residential garage door operator shall comply with one of the following:

    (1) Shall be constructed to:

    (i) Require constant pressure on a control intended to be installed and activated within line of sight of the door to lower the door;

    (ii) Reverse direction and open the door to the upmost position when constant pressure on a control is removed prior to operator reaching its lower limit, and

    (iii) Limit a portable transmitter, when supplied, to function only to cause the operator to open the door;

    (2) Shall be provided with a means for connection of an external secondary entrapment protection device as described in § 1211.8 (a) and (c) through (e), as applicable to vertically moving doors; or

    (3)(i) Shall be provided with an inherent secondary entrapment protection device as described in §§ 1211.8(a) and (f), 1211.10, and 1211.12 and is:

    (A) A combination sectional overhead garage door operator system as described in § 1211.6(c); and

    (B) For use only with vertically moving garage doors.

    (ii) With respect to § 1211.6(b)(3)(i)(A), trolley-driven operators do not meet the definition of a combination sectional overhead garage door operator system.

    (c) In the case of a vertically moving combination sectional overhead garage door operator system, the door shall comply with the requirements in ANSI/DASMA 102 (incorporated by reference, see § 1211.40).

    (d) In addition to the inherent primary entrapment protection as required by § 1211.6(a), a horizontally sliding residential garage door operator shall comply with one of the following:

    (1) Shall be constructed to:

    (i) Require constant pressure on a control to close the door;

    (ii) Reverse direction and open the door a minimum of 2 in (50.8 mm) when constant pressure on a control is removed prior to operator reaching its position limit; and

    (iii) Stop the door if a second obstruction is detected in the reverse direction.

    (2) Shall be provided with a means for connection of an external secondary entrapment protection device for each leading edge as described in § 1211.8(c) through (e), as applicable to horizontally moving
    doors.

    (e) A mechanical switch or a relay used in an entrapment protection circuit of an operator shall withstand 100,000 cycles of operation controlling a load no less severe (voltage, current, power factor,
    inrush and similar ratings) than it controls in the operator, and shall function normally upon completion of the test.

    (f) In addition to complying with paragraph (e) of this section, in the event of a malfunction of a switch or relay (open or short) described in paragraph (c) of this section results in loss of any
    entrapment protection required by § 1211.7(a), § 1211.7(b)(7), § 1211.7(c)(7), § 1211.8(a), or § 1211.8(b), the door operator shall become inoperative at the end of the opening or closing operation,
    the door operator shall move the door to, and stay within, 1 foot (305 mm) of the uppermost position.

    [81 FR 20228, Apr. 7, 2016, as amended at 83 FR 32569, July 13, 2018]'
- id: art-8
  title: § 1211.7
  text: '§ 1211.7

    Inherent primary entrapment protection requirements.

    (a)

    General requirements.

    A vertically moving residential garage door operator system shall be supplied with inherent primary entrapment protection that complies with the requirements as specified in paragraph (b) of this section.
    A horizontally sliding residential garage door operator system shall be supplied with inherent primary entrapment protection that complies with the requirements as specified in paragraph (c) of this
    section.

    (b)

    Inherent primary entrapment protection, vertically moving doors.

    (1)(i) For a vertically moving residential garage door operator system, other than for the first 1 foot (305mm) of door travel from the full upmost position both with and without any secondary external
    entrapment protection device functional, the operator of a downward moving residential garage door shall initiate reversal of the door within 2 seconds of contact with the obstruction as specified in
    subparagraph (b)(3) of this section. After reversing the door, the operator shall return the door to, and stop at, the full upmost position. Compliance shall be determined in accordance with paragraphs
    (b)(3) through (10) of this section.

    (ii) The door operator is not required to return the door to, and stop the door at, the full upmost position when the operator senses a second obstruction during the upward travel.

    (iii) The door operator is not required to return the door to, and stop the door at, the full upmost position when a control is actuated to stop the door during the upward travel—but the door can not
    be moved downward until the operator reverses the door a minimum of 2 inches (50.8 mm).

    (2) The test shall be performed on a representative operating system installed in accordance with the manufacturer''s installation instructions with the operator exerting a 25-lbf (111.21-N) pull or
    its rated pull, whichever is greater.

    (3)(i) A solid object is to be placed on the floor of the test installation and at various heights under the edge of the door and located in line with the driving point of the operator. When tested
    on the floor, the object shall be 1 inch

    (25.4 mm) high. In the test installation, the bottom edge of the door under the driving force of the operator is to be against the floor when the door is fully closed.

    (ii) For operators other than those attached to the door, a solid object is not required to be located in line with the driving point of the operator. The solid object is to be located at points at
    the center, and within 1 foot of each end of the door.

    (iii) To test operators for compliance with requirements in paragraphs (b)(1)(iii), (b)(7)(iii), and (b)(8)(iii) of this section and § 1211.13(c), a solid rectangular object measuring 4 inches (102
    mm) high by 6 inches (152 mm) wide by a minimum of 6 inches (152 mm)long is to be placed on the floor of the test installation to provide a 4-inch (102 mm) high obstruction when operated from a partially
    open position.

    (4) An operator is to be tested for compliance with paragraph (b)(1) of this section for 50 open-and-close cycles of operation while the operator is connected to the type of residential garage door
    with which it is intended to be used or with the doors specified in paragraph (b)(6) of this section. For an operator having a force adjustment on the operator, the force is to be adjusted to the maximum
    setting or at the setting that represents the most severe operating condition. Any accessories having an effect on the intended operation of entrapment protection functions that are intended for use
    with the operator, are to be attached and the test is to be repeated for one additional cycle.

    (5) For an operator that is to be adjusted (limit and force) according to instructions supplied with the operator, the operator is to be tested for 10 additional obstruction cycles using the solid object
    described in paragraph (b)(3) of this section at the maximum setting or at the setting that represents the most severe operating condition.

    (6) For an operator that is intended to be used with more than one type of door, one sample of the operator is to be tested on a sectional door with a curved track and one sample is to be tested on
    a one-piece door with jamb hardware and no track. For an operator that is not intended for use on either or both types of doors, a one-piece door with track hardware or a one-piece door with pivot hardware
    shall be used for the tests. For an operator that is intended for use with a specifically dedicated door or doors, a representative door or doors shall be used for the tests. See the marking requirements
    at § 1211.18.

    (7)(i) An operator, employing an inherent entrapment protection system that measures or monitors the actual position of the door, shall initiate reversal of the door and shall return the door to, and
    stop the door at, the full upmost position in the event the inherent door operating “profile” of the door differs from the originally set parameters. The entrapment protection system shall measure or
    monitor the position of the door at increments not greater than 1 inch (25.4 mm).

    (ii) The door operator is not required to return the door to, and stop the door at, the full upmost position when an inherent entrapment circuit senses an obstruction during the upward travel.

    (iii) The door operator is not required to return the door to, and stop the door at, the full upmost position when a control is actuated to stop the door during the upward travel—but the door can not
    be moved downward until the operator reverses the door a minimum of 2 inches (50.8 mm).

    (8)(i) An operator, using an inherent entrapment protection system that does not measure or monitor the actual position of the door, shall initiate reversal of the door and shall return the door, to
    and stop the door at the full upmost position, when the lower limiting device is not actuated in 30 seconds or less following the initiation of the close cycle.

    (ii) The door operator is not required to return the door to, and stop the door at, the full upmost position when an inherent entrapment circuit senses an obstruction during the upward travel. When
    the door is stopped manually during its descent, the 30 seconds shall be measured from the resumption of the close cycle.

    (iii) The door operator is not required to return the door to, and stop the door at, the full upmost position when a control is actuated to stop the door

    during the upward travel—but the door can not be moved downward until the operator reverses the door a minimum of 2 inches (50.8 mm). When the door is stopped manually during its descent, the 30 seconds
    shall be measured from the resumption of the close cycle.

    (9) To determine compliance with paragraph (b)(7) or (8) of this section, an operator is to be subjected to 10 open-and-close cycles of operation while connected to the door or doors specified in paragraphs
    (b)(4) and (6) of this section. The cycles are not required to be consecutive. Motor cooling-off periods during the test meet the intent of the requirement. The means supplied to comply with the requirement
    in paragraph (b)(1) of this section and § 1211.8(a) or (b) are to be defeated during the test. An obstructing object is to be used so that the door is not capable of activating a lower limiting device.

    (10) During the closing cycle referred to in paragraph (b)(9) of this section, the system providing compliance with paragraphs (b)(1) and (7) of this section or paragraphs (b)(1) and (8) of this section
    shall function regardless of a short- or open-circuit anywhere in any low-voltage external wiring, any external entrapment devices, or any other external component.

    (c)

    Inherent primary entrapment protection, horizontally sliding doors.

    (1)(i) For a horizontally sliding residential garage door operator system, other than for the first 1 foot (305mm) of door travel from the full closed position both with and without any external entrapment
    protection device functional, the operator of a closing residential garage door shall initiate reversal of the door within 2 seconds of contact with the obstruction as specified in paragraph (c)(3)
    of this section. After reversing the door, the operator shall open the door a minimum of 2 inches (50.8 mm) from the edge of the obstruction. Compliance shall be determined in accordance with paragraphs
    (c)(2) through (10) of this section.

    (ii) The door operator is not required to open the door a minimum 2 inches (50.8 mm) when the operator senses a second obstruction during the reversing travel.

    (iii) The door operator is not required to open the door a minimum 2 inches (50.8 mm) when a control is actuated to stop the door during movement towards the open position—but the door can not be moved
    towards the closed position until the operator reverses the door a minimum of 2 inches (50.8 mm).

    (2) The test shall be performed on a representative operating system installed in accordance with the manufacturer''s installation instructions with the operator exerting a 25-lbf (111.21-N) pull or
    its rated pull, whichever is greater.

    (3)(i) A solid object is to be placed on the floor of the test installation and rigidly supported within the bottom track and then repeated with the solid object placed on the floor and rigidly supported
    external to the track. The test shall then be repeated with the solid object rigidly supported at heights of 1 ft (305 mm), 3 ft (914 mm), 5 ft (1524 mm), and within 1 ft (305 mm) of the top edge. The
    object shall be 1 inch (25.4 mm) in width.

    (ii) For operators other than those attached to the door, a solid object is not required to be located in line with the driving point of the operator. The solid object is to be located at points at
    the center and within 1 ft of each end of the door opening.

    (iii) To test operators for compliance with paragraphs (c)(1)(iii), (c)(7)(iii), and (c)(8)(iii) of this section, and § 1211.13(c), a solid rectangular object measuring 4 inches (102 mm) high by 6 inches
    (152 mm) wide by a minimum of 6 in (152 mm) long is to be placed on the floor of the test installation to provide a 4 in (102 mm) high obstruction when operated from a partially open position with the
    test repeated with the bottom edge of the obstruction rigidly supported at heights of 1 ft (305 mm), 3ft (914 mm), 5ft (1524 mm), and within 1 ft (305 mm) of the top edge.

    (4) An operator is to be tested for compliance with paragraph (c)(1) of this section for 50 open-and-close cycles of operation while the operator is connected to the type of residential garage door
    with which it is intended to be used or with the doors specified in paragraph (c)(6) of this section. For an operator having a force adjustment on the operator, the force is to be adjusted

    to the maximum setting or at the setting that represents the most severe operating condition. Any accessories having an effect on the intended operation of entrapment protection functions that are intended
    for use with the operator, are to be attached and the test is to be repeated for one additional cycle.

    (5) For an operator that is to be adjusted (limit and force) according to instructions supplied with the operator, the operator is to be tested for 10 additional obstruction cycles using the solid object
    described in paragraph (c)(3) of this section at the maximum setting or at the setting that represents the most severe operating condition.

    (6) For an operator that is intended to be used with more than one type of door, one sample of the operator is to be tested on a sectional door with a curved track and one sample is to be tested on
    a one-piece door with jamb hardware and no track. For an operator that is not intended for use on either or both of these types of doors, a one-piece door with track hardware or a one-piece door with
    pivot hardware shall be used for the tests. For an operator that is intended for use with a specifically dedicated door or doors, a representative door or doors shall be '
