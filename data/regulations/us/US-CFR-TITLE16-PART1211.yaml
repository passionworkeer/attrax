- id: art-2
  title: § 1211.1
  text: '§ 1211.1

    Effective date.

    This standard applies to all residential garage door operators manufactured on or after January 1, 1993 for sale in the United States.'
- id: art-3
  title: § 1211.2
  text: '§ 1211.2

    Definition.

    As used in this part 1211:

    Residential garage door operator

    means a vehicular door operator which:

    (a) Serves a residential building of one to four single family units;

    (b) Is rated 600 volts or less; and

    (c) Is intended to be employed in ordinary locations in accordance with NFPA 70 (incorporated by reference, see § 1211.32).

    [57 FR 60455, Dec. 21, 1992, as amended at 62 FR 46667, Sept. 4, 1997; 65 FR 70657, Nov. 27, 2000; 81 FR 20228, Apr. 7, 2016]'
