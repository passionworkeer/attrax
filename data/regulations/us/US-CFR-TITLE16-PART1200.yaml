- id: art-2
  title: § 1200.1
  text: '§ 1200.1

    Purpose.

    This part provides guidance on the definition of children''s product and the factors the Commission will consider when making determinations regarding children''s products as set forth under 15 U.S.C.
    2052(2).'
- id: art-3
  title: § 1200.2
  text: '§ 1200.2

    Definition of children''s product.

    (a)

    Definition of “Children''s Product”

    —(1) Under section 3(a)(2) of the Consumer Product Safety Act (CPSA), a children''s product means a consumer product designed or intended primarily for children 12 years of age or younger. The term
    “designed or intended primarily” applies to those consumer products mainly for children 12 years old or younger. Whether a product is primarily intended for children 12 years of age or younger is determined
    by considering the four specified statutory factors. These factors are:

    (i) A statement by a manufacturer about the intended use of such product, including a label on such product if such statement is reasonable.

    (ii) Whether the product is represented in its packaging, display, promotion, or advertising as appropriate for use by children 12 years of age or younger.

    (iii) Whether the product is commonly recognized by consumers as being intended for use by a child 12 years of age or younger.

    (iv) The Age Determination Guidelines issued by the Commission staff in September 2002 and any successor to such guidelines.

    (2) The examples discussed herein may also be illustrative in making such determinations; however, the determination of whether a product meets the definition of a children''s product depends on factual
    information that may be unique to each product and, therefore, would need to be made on a case-by-case basis. The term “for use” by children 12 years or younger generally means that children will physically
    interact with such products based on the reasonably foreseeable use of such product. Toys and articles that are subject to the small parts regulations at 16 CFR Part 1501 and in ASTM F963 would fall
    within the definition of children''s product since they are intended for children 12 years of age or younger. Toys and other articles intended for children up to 96 months (8 years old) that are subject
    to the requirements at 16 CFR 1500.48 through 1500.49 and 16 CFR 1500.50 through 1500.53 would similarly fall within the definition of children''s product given their age grading for these other regulations.
    Therefore, a manufacturer could reasonably conclude on the basis of the age grading for these other regulations that its product also must comply with all requirements applicable to children''s products
    including, but not limited to, those under the Federal Hazardous Substances Act, ASTM F963, “Standard Consumer Safety Specification for Toy Safety,” and the Consumer Product Safety Improvement Act of
    2008.

    (b)

    Definition of “General Use Product”

    —(1) A general use product means a consumer product that is not designed or intended primarily for use by children 12 years old or younger. General use products are those consumer products designed
    or intended primarily for consumers older than age 12. Some products may be designed or intended for use by consumers of all ages, including children 12 years old or younger, but are intended mainly
    for consumers older than 12 years of age. Examples of general use products may include products with which a child would not likely interact, or products with which consumers older than 12 would be
    as likely, or more likely to interact. Products used by children 12 years of age or younger that have a declining appeal for teenagers are likely to be considered children''s products.

    (2) Other products are specifically not intended for children 12 years of age or younger. These products, such as cigarette lighters, candles, and fireworks, which the Commission has traditionally warned
    adults to keep away from children, are not subject to the CPSIA''s lead limits, tracking label requirement, and third-party testing and certification provisions. Similarly, products that incorporate
    performance requirements for child resistance are

    not children''s products as they are designed specifically to ensure that children cannot access the contents. This would include products such as portable gasoline containers and special packaging
    under the Poison Prevention Packaging Act.

    (c)

    Factors Considered

    —To determine whether a consumer product is primarily intended for a child 12 years of age or younger the four specified statutory factors must be considered together as a whole. The following four
    factors must be considered:

    (1) A statement by a manufacturer about the intended use of such product, including a label on such product if such statement is reasonable. A manufacturer''s statement about the product''s intended
    use, including the product''s label, should be reasonably consistent with the expected use patterns for a product. A manufacturer''s statement that the product is not intended for children does not
    preclude a product from being regulated as a children''s product if the primary appeal of the product is to children 12 years of age or younger, as indicated, for example, by decorations or embellishments
    that invite use by the child, being sized for a child or being marketed to appeal primarily to children. Similarly, a label indicating that a product is for ages 9 and up does not necessarily make it
    a children''s product if it is a general use product. Such a label may recommend 9 years old as the earliest age for a prospective user, but may or may not indicate the age for which the product is
    primarily intended. The manufacturer''s label, in and of itself, is not considered to be determinative.

    (2) Whether the product is represented in its packaging, display, promotion, or advertising as appropriate for use by children 12 years of age or younger.

    (i) These representations may be express or implied. For example, advertising by the manufacturer expressly declaring that the product is intended for children 12 years of age or younger will support
    a determination that a product is a children''s product. While, for example advertising by the manufacturer showing children 12 years of age or younger using the product may support a determination
    that the product is a children''s product. These representations may be found in packaging, text, illustrations and/or photographs depicting consumers using the product, instructions, assembly manuals,
    or advertising media used to market the product.

    (ii) The product''s physical location near, or visual association with, children''s products may be a factor in making an age determination, but is not determinative. For example, a product displayed
    in a children''s toy section of a store may support a determination that the product is a children''s product. However, where that same product is also sold in department stores and marketed for general
    use, further evaluation would be necessary. The Commission recognizes that manufacturers do not necessarily control where a product will be placed in a retail establishment and such lack of control
    will be considered. The Commission evaluates products more broadly than on a shelf-by-shelf or store-by-store basis.

    (iii) The product''s association or marketing in conjunction with nonchildren''s products may not be determinative as to whether the product is a children''s product. For example, packaging and selling
    a stuffed animal with a candle would not preclude a determination that the stuffed animal is a children''s product since stuffed animals are commonly recognized as being primarily intended for children.

    (3) Whether the product is commonly recognized by consumers as being intended for use by children 12 years of age or younger. Consumer perception of the product''s use by children, including its reasonably
    foreseeable use, will be evaluated. Sales data, market analyses, focus group testing, and other marketing studies may help support an analysis regarding this factor.

    (i) Features and Characteristics—additional considerations that may help distinguish children''s products from nonchildren''s products include:

    (A) Small sizes that would not be comfortable for the average adult;

    (B) Exaggerated features (large buttons, bright indicators) that simplify the product''s use;

    (C) Safety features that are not found on similar products intended for adults;

    (D) Colors commonly associated with childhood (pinks, blues, bright primary colors);

    (E) Decorative motifs commonly associated with childhood (such as animals, insects, small vehicles, alphabets, dolls, clowns, and puppets);

    (F) Features that do not enhance the product''s utility (such as cartoons) but contribute to its attractiveness to children 12 years of age or younger; and

    (G) Play value,

    i.e.

    , features primarily attractive to children 12 years of age or younger that promote interactive exploration and imagination for fanciful purposes (whimsical activities lacking utility for accomplishing
    mundane tasks; actions performed for entertainment and amusement).

    (ii) Principal use of the product—the principal uses of a product take precedence over other actions that are less likely to be performed with a product. For example, when a child pretends that a broom
    is a horse, that does not mean the item is a children''s product because the broom''s principal use is for sweeping;

    (iii) Cost—the cost of a given product may influence the determination of the age of intended users; and

    (iv) Children''s interactions, if any, with the product—products for use in a child''s environment by the caregiver but not for use by the child would not be considered to be primarily intended for
    a child 12 years of age or younger.

    (4) The Age Determination Guidelines issued by the Consumer Product Safety Commission staff in September 2002, and any successor to such guidelines. The product''s appeal to different age groups and
    the capabilities of those age groups may be considered when making determinations about the appropriate user groups for products.

    (d)

    Examples

    —To help manufacturers understand what constitutes a children''s product under the CPSA, the following additional examples regarding specific product categories are offered:

    (1) Furnishings and Fixtures—General home furnishings and fixtures (including, but not limited to: Rocking chairs, shelving units, televisions, digital music players, ceiling fans, humidifiers, air
    purifiers, window curtains, tissue boxes, rugs, carpets, lamps, clothing hooks and racks) that often are found in children''s rooms or schools would not be considered children''s products unless they
    are decorated or embellished with a childish theme and invite use by a child 12 years of age or younger, are sized for a child, or are marketed to appeal primarily to children. Examples of home or school
    furnishings that are designed or intended primarily for use by children and considered children''s products include: Infant tubs, bath seats, small bean bag chairs with childish decorations, beds with
    children''s themes, child-sized desks, and child-sized chairs. Decorative items, such as holiday decorations and household seasonal items that are intended only for display, with which children are
    not likely to interact, are generally not considered children''s products, since they are intended to be used by adults.

    (2) Collectibles—Adult collectibles may be distinguished from children''s collectibles by themes that are inappropriate for children 12 years of age or younger, have features that preclude use by children
    during play, such as high cost, limited production, fragile features, display features (such as hooks or pedestals), and are not marketed alongside children''s products (for example, in a children''s
    department) in ways that make them indistinguishable from children''s products. For example, collectible plush bears have high cost, are highly detailed, with fragile accessories, display cases, and
    platforms on which to pose and hold the bears. Children''s bears have lower costs and simple accessories that can be handled without fear of damage to the product. Another example of collectible items
    includes model railways and trains made for hobbyists.

