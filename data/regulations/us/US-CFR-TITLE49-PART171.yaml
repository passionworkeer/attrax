    Control numbers under the Paperwork Reduction Act.

    (a)

    Purpose and scope.

    This section collects and displays the control numbers assigned to the HMR collections of information by the Office of Management and Budget (OMB) under the Paperwork Reduction Act of 1995. This section
    complies with the requirements of 5 CFR 1320.7(f), 1320.12, 1320.13 and 1320.14 (OMB regulations implementing the Paperwork Reduction Act of 1995) for the display of control numbers assigned by OMB
    to collections of information of the HMR.

    (b)

    OMB control numbers.

    The table in paragraph (b)(2) of this section sets forth the control numbers assigned to collection of information in the HMR by the Office of Management and Budget (OMB) under the Paperwork Reduction
    Act of 1995.

    (1) Column 1 lists the OMB control number assigned to the HMR collections of information. Column 2 contains the Report Title of the approved collection of information. Column 3 lists the part(s) or
    section(s) in 49 CFR identified or described in the collection of information.

