  title: § 171.3
  text: '§ 171.3

    Hazardous waste.

    (a) No person may offer for transportation or transport a hazardous waste (as defined in § 171.8 of this subchapter) in interstate or intrastate commerce except in accordance with the requirements of
    this subchapter.

    (b) No person may accept for transportation, transport, or deliver a hazardous waste for which a manifest is required unless that person:

    (1) Has marked each motor vehicle used to transport hazardous waste in accordance with § 390.21 of this title even though placards may not be required;

    (2) Complies with the requirements for manifests set forth in § 172.205 of this subchapter; and

    (3) Delivers, as designated on the manifest by the generator, the entire quantity of the waste received from the generator or a transporter to:

    (i) The designated facility or, if not possible, to the designated alternate facility;

    (ii) The designated subsequent carrier; or

    (iii) A designated place outside the United States.

    Note:

    Federal law specifies penalties up to $250,000 fine for an individual and $500,000 for a company and 5 years imprisonment for the willful discharge of hazardous waste at other than designated facilities.
    49 U.S.C. 5124.

    (c) If a discharge of hazardous waste or other hazardous material occurs during transportation, and an official of a State or local government or a Federal agency, acting within the scope of his official
    responsibilities, determines that immediate removal of the waste is necessary to prevent further consequence, that official may authorize the removal of the waste without the preparation of a manifest.
    [

    Note:

    In such cases, EPA does not require carriers to have EPA identification numbers.]

    Note 1:

    EPA requires shippers (generators) and carriers (transporters) of hazardous wastes to have identification numbers which must be displayed on hazardous waste manifests. See 40 CFR parts 262 and 263.
    (Identification number application forms may be obtained from EPA regional offices.)

    Note 2:

    In 40 CFR part 263, the EPA sets forth requirements for the cleanup of releases of hazardous wastes.

    [Amdt. 171-53, 45 FR 34586, May 22, 1980, as amended by Amdt. 171-53, 45 FR 74648, Nov. 10, 1980; Amdt. 171-78, 49 FR 10510, Mar. 20, 1984; Amdt. 171-107, 54 FR 40068, Sept. 29, 1989; Amdt. 171-111,
    55 FR 52466, Dec. 21, 1990; 56 FR 66157, Dec. 20, 1991; Amdt. 171-2, 59 FR 49132, Sept. 26, 1994; Amdt. 171-141, 61 FR 21102, May 9, 1996; 73 FR 57004, Oct. 1, 2008]'
- id: art-5
  title: § 171.4
  text: '§ 171.4

    Marine pollutants.

    (a) Except as provided in paragraph (c) of this section, no person may offer for transportation or transport a marine pollutant, as defined in § 171.8, in intrastate or interstate commerce except in
    accordance with the requirements of this subchapter.

    (b) The requirements of this subchapter for the transportation of marine pollutants are based on the provisions of Annex III of the 1973 International Convention for Prevention of Pollution from Ships,
    as modified by the Protocol of 1978 (MARPOL 73/78).

    (c)

    Exceptions.

    (1) Except when all or part of the transportation is by vessel, the requirements of this subchapter specific to marine pollutants do not apply to non-bulk packagings transported by motor vehicle, rail
    car or aircraft.

    (2) Single or combination packagings containing a net quantity per single or inner packaging of 5 L or less for liquids or having a net mass of 5 kg or less for solids, are not subject to any other
    requirements of this subchapter provided the packagings meet the general requirements in §§ 173.24 and 173.24a. This exception does not apply

    to marine pollutants that are a hazardous waste or a hazardous substance. In the case of marine pollutants also meeting the criteria for inclusion in another hazard class, all provisions of this subchapter
    relevant to any additional hazards continue to apply.

    [Amdt. 171-116, 57 FR 52934, Nov. 5, 1993, as amended by Amdt. 107-39, 61 FR 51337, Oct. 1, 1996; 80 FR 1114, Jan. 8, 2015]'
