    SAFETY STANDARD FOR BUTTON CELL OR COIN BATTERIES AND CONSUMER PRODUCTS CONTAINING SUCH BATTERIES

    1263

    PART 1263

    Commercial Practices

    CONSUMER PRODUCT SAFETY COMMISSION

    CONSUMER PRODUCT SAFETY ACT REGULATIONS

    Pt. 1263

    PART 1263—SAFETY STANDARD FOR BUTTON CELL OR COIN BATTERIES AND CONSUMER PRODUCTS CONTAINING SUCH BATTERIES

    Sec.

    1263.1

    Scope, purpose, effective date, and exemption.

    1263.2

    Definitions.

    1263.3

    Requirements for consumer products containing button cell or coin batteries.

    1263.4

    Requirements for labeling of button cell or coin battery packaging.

    Authority:

    15 U.S.C. 2052, 2056e.

    Source:

    88 FR 65295, Sept. 21, 2023, unless otherwise noted.'
- id: art-2
  title: § 1263.1
  text: '§ 1263.1

    Scope, purpose, effective date, and exemption.

    (a)

    Scope and purpose.

    As required by Reese''s Law (15 U.S.C 2056e, Pub. L. 117-171), this part establishes performance and labeling requirements for consumer products containing button cell or coin batteries to prevent child
    access to batteries during reasonably foreseeable use and misuse of the consumer product. The part is intended to eliminate or adequately reduce the risk of injury and death to children 6 years old
    and younger from ingesting these batteries. This part also establishes warning label requirements for packaging of consumer products containing button cell or coin batteries, these consumer products,
    and instructions and manuals accompanying these consumer products.

    (b)

    Effective date.

    Except as provided in paragraph (c) of this section, the effective date of § 1263.3 is October 23, 2023.

    (c)

    Exemption for toy products.

    Any object designed, manufactured, or marketed as a plaything for children under 14 years of age that is in compliance with the battery accessibility and labeling requirements of 16 CFR part 1250 is
    exempt from the requirements of this part.

    (d)

    Batteries that do not present an ingestion hazard.

    Button cell or coin batteries that the Commission has determined do not present an ingestion hazard are not subject to this part. These are: zinc-air button cell or coin batteries.

    Effective Date Note:

    At 88 FR 65303, Sept. 21, 2023, § 1263.1 was amended by adding sentences at the end of paragraphs (a) and (b), effective Sept. 21, 2024. For the convenience of the user, the added text is set forth
    as follows:'
- id: art-3
  title: § 1263.1
  text: '§ 1263.1

    Scope, purpose, effective date, and exemption.

    (a) * * * Additionally, this part establishes warning label requirements for packaging of button cell or coin batteries, including button cell or coin batteries packaged separately with a consumer product.

    (b) * * * Packages of button cell or coin batteries manufactured or imported after September 21, 2024, must meet the labeling requirements for battery packaging in § 1263.4.'
- id: art-4
  title: § 1263.2
  text: '§ 1263.2

    Definitions.

    In addition to the definitions given in section 3 of the Consumer Product Safety Act (15 U.S.C. 2052) and section 5 of Reese''s Law (Notes to 15 U.S.C. 2056e), the following definitions apply for purposes
    of this part:

    Button cell or coin battery

    means:

    (1) A single cell battery with a diameter greater than the height of the battery; or

    (2) Any other battery, regardless of the technology used to produce an electrical charge, that is determined by the

    Commission to pose an ingestion hazard.

    Consumer product containing button cell or coin batteries

    means a consumer product containing or designed to use one or more button cell or coin batteries, regardless of whether such batteries are intended to be replaced by the consumer or are included with
    the product or sold separately.

    Ingestion hazard

    means a hazard caused by a person swallowing or inserting a button cell or coin battery into their body whereby:

    (1) The button cell or coin battery can become lodged in the digestive tract or airways; and

    (2) Can potentially cause death or serious injury through choking, generation of hazardous chemicals, leaking of hazardous chemicals, electrical burns, pressure necrosis, or other means.

    Effective Date Note:

    At 88 FR 65303, Sept. 21, 2023, § 1263.2 was amended by adding the definitions of “Principal display panel” and “Secondary display panel”, effective Sept. 21, 2024. For the convenience of the user,
    the added text is set forth as follows:'
- id: art-5
  title: § 1263.2
  text: '§ 1263.2

    Definitions.

    Principal display panel

    means the display panel for a retail package of button cell or coin batteries that is most likely to be displayed, shown, presented, or examined under normal or customary conditions of display for retail
    sale. The principal display panel is typically the front of the package.

    Secondary display panel

    means a display panel for a retail package of button cell or coin batteries that is opposite or next to the principal display panel. The secondary display panel is typically the rear or side panels
    of the package.'
- id: art-6
  title: § 1263.3
  text: '§ 1263.3

    Requirements for consumer products containing button cell or coin batteries.

    Each consumer product containing button cell or coin batteries shall comply with ANSI/UL 4200A,

    Standard for Safety for Products Incorporating Button Batteries or Coin Cell Batteries,

    approved on August 30, 2023. The Director of the Federal Register approves this incorporation by reference in accordance with 5 U.S.C. 552(a) and 1 CFR part 51. This material is available for inspection
    at the U.S. Consumer Product Safety Commission and at the National Archives and Records Administration (NARA). Contact the U.S. Consumer Product Safety Commission at: the Office of the Secretary, U.S.
    Consumer Product Safety Commission, 4330 East West Highway, Bethesda, MD 20814, telephone (301) 504-7479, email:

    cpsc-os@cpsc.gov.

    For information on the availability of this material at NARA, visit

    https://www.archives.gov/federal-register/cfr/ibr-locations

    or email

    fr.inspection@nara.gov.

    A free, read-only copy of the standard is available for viewing on UL''s website at

    https://www.ulstandards.com/IBR/logon.aspx.

    You may also obtain a copy from Underwriters Laboratories, Inc (UL), 333 Pfingsten Road, Northbrook, IL 60062, or through UL''s website:

    www.UL.com.'
- id: art-7
  title: § 1263.4
  text: '§ 1263.4

    Requirements for labeling of button cell or coin battery packaging.

    (a)

    General requirements for labeling of button cell or coin battery packaging.

    (1) All warning statements must be clearly visible, prominent, legible, and permanently marked.

    (2) Warning statements must be in contrasting color to the background onto which the warning statement is printed.

    (3) Warning statements must be in English.

    (4) The safety alert symbol, an exclamation mark in a triangle, when used with the signal word, must precede the signal word. The base of the safety alert symbol must be on the same horizontal line
    as the base of the letters of the signal word. The height of the safety alert symbol must equal or exceed the signal word letter height.

    (5) The signal word “WARNING” and safety alert symbol must be in black letters on an orange background unless this would conflict with paragraphs (a)(1) and (2) of this section or only one color is
    present, in which case, the signal word and safety alert symbol must contrast to the background on which they are printed. The signal word must appear in sans serif letters in upper case only.

    (6) Certain text in the message panel must be in bold and in capital letters as shown in the example warning labels (figure 1 to paragraph (b)(1) and figure

    3 to paragraph (b)(2)) to get the attention of the reader.

    (7) For labels that are required to be on the packaging of button cell and coin batteries, text size must be dependent on the area of the principal display panel. Text size must be determined based
    on table 1 to this paragraph (a)(7).

