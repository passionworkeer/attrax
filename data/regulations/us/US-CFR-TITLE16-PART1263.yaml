    (b)

    Warning label requirements for button cell or coin battery packaging.

    (1) The principal display panel of the packaging must include the warning label in figure 1 to this paragraph (b)(1). The icon must be at least 8 mm (0.3 inches) in diameter. The text must state the
    following warnings as shown in figure 1 to this paragraph (b)(1).

    Figure 1 to Paragraph (b)(1)

    ER21SE23.005

    (2) If space prohibits the full warning label shown in figure 1 to paragraph (b)(1), place the icon shown in figure 2 to this paragraph (b)(2) on the principal display panel with the text shown in figure
    3 to this paragraph (b)(2) on the secondary display panel. The icon must be at least 20 mm in diameter. The text must state the following warnings as shown on figure 3 to this paragraph (b)(2).

    Figure 2 to Paragraph (b)(2)

    ER21SE23.006

    (3) The following safety-related statements must be addressed on the principal display panel or secondary display panel:

    (i) Keep in original package until ready to use.

    (ii) Immediately dispose of used batteries and keep away from children. Do NOT dispose of batteries in household trash.

    (4) For button cell or coin battery packaging included separately with a consumer product, only paragraphs (b)(1) and (2) of this section apply.

    [88 FR 65303, Sept. 21, 2023]

    Effective Date Note:

    At 88 FR 65303, Sept. 21, 2023, § 1263.4 was added, effective Sept. 21, 2024.'
