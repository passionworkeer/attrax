  title: "\t\t\t\t  business may require authentication of the consumer th"
  text: "\t\t\t\t  business may require authentication of the consumer that is reasonable in light of the nature of the personal information requested, but shall not require the consumer to create an account\
    \ with the business in order to make a verifiable consumer request provided that if the consumer, has an account with the business, the business may require the consumer to use that account to submit\
    \ a verifiable consumer request.\n(B) The disclosure of the required information shall cover the 12-month period preceding the business’ receipt of the verifiable consumer request provided that, upon\
    \ the adoption of a regulation pursuant to paragraph (8) of subdivision (a) of Section 1798.185, a consumer may request that the business disclose the required information beyond the 12-month period,\
    \ and the business shall be required to provide that information unless doing so proves impossible or would involve a disproportionate effort. A consumer’s right to request\n\t\t\t\t  required information\
    \ beyond the 12-month period, and a business’ obligation to provide that information, shall only apply to personal information collected on or after January 1, 2022. Nothing in this subparagraph shall\
    \ require a business to keep personal information for any length of time.\n(3) (A) A business that receives a verifiable consumer request pursuant to Section 1798.110 or 1798.115 shall disclose any\
    \ personal information it has collected about a consumer, directly or indirectly, including through or by a service provider or contractor, to the consumer. A service provider or contractor shall not\
    \ be required to comply with a verifiable consumer request received directly from a consumer or a consumer’s authorized agent, pursuant to Section 1798.110 or 1798.115, to the extent that the service\
    \ provider or contractor has collected personal information about the consumer in its role as a service provider or contractor.\n\t\t\t\t  A service provider or contractor shall provide assistance to\
    \ a business with which it has a contractual relationship with respect to the business’ response to a verifiable consumer request, including, but not limited to, by providing to the business the consumer’s\
    \ personal information in the service provider or contractor’s possession, which the service provider or contractor obtained as a result of providing services to the business, and by correcting inaccurate\
    \ information or by enabling the business to do the same. A service provider or contractor that collects personal information pursuant to a written contract with a business shall be required to assist\
    \ the business through appropriate technical and organizational measures in complying with the requirements of subdivisions (d) to (f), inclusive, of Section 1798.100, taking into account the nature\
    \ of the processing.\n(B) For purposes of subdivision (b) of Section 1798.110:\n(i) To identify the consumer, associate the information provided by the consumer in the verifiable consumer request to\
    \ any personal information previously collected by the business about the consumer.\n(ii) Identify by category or categories the personal information collected about the consumer for the applicable\
    \ period of time by reference to the enumerated category or categories in subdivision (c) that most closely describes the personal information collected; the categories of sources from which the consumer’s\
    \ personal information was collected; the business or commercial purpose for collecting, selling, or sharing the consumer’s personal information; and the categories of third parties to whom the business\
    \ discloses the consumer’s personal information.\n(iii) Provide the specific pieces of personal information"
- id: art-9
  title: "\t\t\t\t  obtained from the consumer in a format that is easily "
  text: "\t\t\t\t  obtained from the consumer in a format that is easily understandable to the average consumer, and to the extent technically feasible, in a structured, commonly used, machine-readable\
    \ format that may also be transmitted to another entity at the consumer’s request without hindrance. “Specific pieces of information” do not include data generated to help ensure security and integrity\
    \ or as prescribed by regulation. Personal information is not considered to have been disclosed by a business when a consumer instructs a business to transfer the consumer’s personal information from\
    \ one business to another in the context of switching services.\n(4) For purposes of subdivision (b) of Section 1798.115:\n(A) Identify the consumer and associate the information provided by the consumer\
    \ in the verifiable consumer request to any personal information previously collected by the business about the\n\t\t\t\t  consumer.\n(B) Identify by category or categories the personal information\
    \ of the consumer that the business sold or shared during the applicable period of time by reference to the enumerated category in subdivision (c) that most closely describes the personal information,\
    \ and provide the categories of third parties to whom the consumer’s personal information was sold or shared during the applicable period of time by reference to the enumerated category or categories\
    \ in subdivision (c) that most closely describes the personal information sold"
