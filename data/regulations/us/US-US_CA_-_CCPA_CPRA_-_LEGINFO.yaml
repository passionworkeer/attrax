    Add To My Favorites\nCode Text\nCivil Code - CIV\nDIVISION 3. OBLIGATIONS [1427 - 3273.91]\n( Heading of Division 3 amended by Stats. 1988, Ch. 160, Sec. 14. )\nPART 4. OBLIGATIONS ARISING FROM PARTICULAR\
    \ TRANSACTIONS [1738 - 3273.91]\n( Part 4 enacted 1872. )\nTITLE 1.81.5. California Consumer Privacy Act of 2018 [1798.100 - 1798.199.100]\n( Title 1.81.5 added by Stats. 2018, Ch. 55, Sec. 3. )\n1798.100.\n\
    General Duties of Businesses that Collect Personal Information\n(a) A business that controls the collection of a consumer’s personal information shall, at or before the point of collection, inform consumers\
    \ of the following:\n(1) The categories of personal information to be collected and the purposes for which the categories of personal information are collected or used and whether that information is\
    \ sold or shared. A business shall not collect additional categories of personal information or use personal information collected for additional purposes that are incompatible with the disclosed purpose\
    \ for which the personal information was collected without providing the consumer with notice consistent with this section.\n(2) If the business collects sensitive personal information, the categories\
    \ of sensitive personal information to be collected and the purposes for which the categories of sensitive personal information are collected or used, and whether that information is sold or shared.\
    \ A business shall not collect additional categories of sensitive personal information or use sensitive personal information collected for additional purposes that are incompatible with the disclosed\
    \ purpose for which the sensitive personal information was collected without providing the consumer with notice consistent with this section.\n(3) The length of time the business intends to retain each\
    \ category of personal information, including sensitive personal information, or if that is not possible, the criteria used to determine that period provided that a business shall not retain a consumer’s\
    \ personal information or\n\t\t\t\tsensitive personal information for each disclosed purpose for which the personal information was collected for longer than is reasonably necessary for that disclosed\
    \ purpose.\n(b) A business that, acting as a third party, controls the collection of personal information about a consumer may satisfy its obligation under subdivision (a) by providing the required\
    \ information prominently and conspicuously on the homepage of its internet website. In addition, if a business acting as a third party controls the collection of personal information about a consumer\
    \ on its premises, including in a vehicle, then the business shall, at or before the point of collection, inform consumers as to the categories of personal information to be collected and the purposes\
    \ for which the categories of personal information are used, and whether that personal information is sold, in a clear and conspicuous manner at the location."
- id: art-2
  title: (c) A business’ collection, use, retention, and sharing of a
  text: "(c) A business’ collection, use, retention, and sharing of a consumer’s personal information shall be reasonably necessary and proportionate to achieve the purposes for which the personal information\
    \ was collected or processed, or for another disclosed purpose that is compatible with the context in which the personal information was collected, and not further processed in a manner that is incompatible\
    \ with those purposes.\n(d) A business that collects a consumer’s personal information and that sells that personal information to, or shares it with, a third party or that discloses it to a service\
    \ provider or contractor for a business purpose shall enter into an agreement with the third party, service provider, or contractor, that:\n(1) Specifies that the personal information is sold or disclosed\
    \ by the business only for\n\t\t\t\tlimited and specified purposes.\n(2) Obligates the third party, service provider, or contractor to comply with applicable obligations under this title and obligate\
    \ those persons to provide the same level of privacy protection as is required by this title.\n(3) Grants the business rights to take reasonable and appropriate steps to help ensure that the third party,\
    \ service provider, or contractor uses the personal information transferred in a manner consistent with the business’ obligations under this title.\n(4) Requires the third party, service provider, or\
    \ contractor to notify the business if it makes a determination that it can no longer meet its obligations under this title.\n(5) Grants the business the right, upon notice, including under paragraph\
    \ (4),\n\t\t\t\tto take reasonable and appropriate steps to stop and remediate unauthorized use of personal information.\n(e) A business that collects a consumer’s personal information shall implement\
    \ reasonable security procedures and practices appropriate to the nature of the personal information to protect the personal information from unauthorized or illegal access, destruction, use, modification,\
    \ or disclosure in accordance with Section 1798.81.5.\n(f) Nothing in this section shall require a business to disclose trade secrets, as specified in regulations adopted pursuant to paragraph (3) of\
    \ subdivision (a) of Section 1798.185.\n(Amended November 3, 2020, by initiative Proposition 24, Sec. 4.   Effective December 16, 2020.   Operative January 1, 2023, pursuant to Sec. 31 of Proposition\
    \ 24.)\n1798.105.\nConsumers’ Right to Delete Personal Information\n(a) A consumer shall have the right to request that a business delete any personal information about the consumer which the business\
    \ has collected from the consumer.\n(b) A business that collects personal information about consumers shall disclose, pursuant to Section 1798.130, the consumer’s rights to request the deletion of the\
    \ consumer’s personal information.\n(c) (1) A business that receives a verifiable consumer request from a consumer to delete the consumer’s personal information pursuant to subdivision (a) of this section\
    \ shall delete the consumer’s personal information from its records,\n\t\t\t\tnotify any service providers or contractors to delete the consumer’s personal information from their records, and notify\
    \ all third parties to whom the business has sold or shared the personal information to delete the consumer’s personal information unless this proves impossible or involves disproportionate effort.\n\
    (2) The business may maintain a confidential record of deletion requests solely for the purpose of preventing the personal information of a consumer who has submitted a deletion request from being sold,\
    \ for compliance with laws or for other purposes, solely to the extent permissible under this title.\n(3) A service provider or contractor shall cooperate with the business in responding to a verifiable\
    \ consumer request, and at the direction of the business, shall delete, or enable the business to delete and shall notify any of its own service providers or contractors to"
- id: art-3
  title: "\t\t\t\tdelete personal information about the consumer collected"
  text: "\t\t\t\tdelete personal information about the consumer collected, used, processed, or retained by the service provider or the contractor. The service provider or contractor shall notify any service\
    \ providers, contractors, or third parties who may have accessed personal information from or through the service provider or contractor, unless the information was accessed at the direction of the\
    \ business, to delete the consumer’s personal information unless this proves impossible or involves disproportionate effort. A service provider or contractor shall not be required to comply with a deletion\
    \ request submitted by the consumer directly to the service provider or contractor to the extent that the service provider or contractor has collected, used, processed, or retained the consumer’s personal\
    \ information in its role as a service provider or contractor to the business.\n(d) A business, or a service provider or contractor acting pursuant to its contract with\n\t\t\t\tthe business, another\
    \ service provider, or another contractor, shall not be required to comply with a consumer’s request to delete the consumer’s personal information if it is reasonably necessary for the business, service\
    \ provider, or contractor to maintain the consumer’s personal information in order to:\n(1) Complete the transaction for which the personal information was collected, fulfill the terms of a written\
    \ warranty or product recall conducted in accordance with federal law, provide a good or service requested by the consumer, or reasonably anticipated by the consumer within the context of a business’\
    \ ongoing business relationship with the consumer, or otherwise perform a contract between the business and the consumer.\n(2) Help to ensure security and integrity to the extent the use of the consumer’s\
    \ personal information is reasonably necessary and proportionate for those\n\t\t\t\tpurposes.\n(3) Debug to identify and repair errors that impair existing intended functionality.\n(4) Exercise free\
    \ speech, ensure the right of another consumer to exercise that consumer’s right of free speech, or exercise another right provided for by law.\n(5) Comply with the California Electronic Communications\
    \ Privacy Act pursuant to Chapter 3.6 (commencing with Section 1546) of Title 12 of Part 2 of the Penal Code.\n(6) Engage in public or peer-reviewed scientific, historical, or statistical research that\
    \ conforms or adheres to all other applicable ethics and privacy laws, when the business’ deletion of the information is likely to render impossible or seriously impair the ability to complete such\
    \ research, if the consumer has provided informed\n\t\t\t\tconsent.\n(7) To enable solely internal uses that are reasonably aligned with the expectations of the consumer based on the consumer’s relationship\
    \ with the business and compatible with the context in which the consumer provided the information.\n(8) Comply with a legal obligation.\n(Amended November 3, 2020, by initiative Proposition 24, Sec.\
    \ 5.   Effective December 16, 2020.   Operative January 1, 2023, pursuant to Sec. 31 of Proposition 24.)\n1798.106.\nConsumers’ Right to Correct Inaccurate Personal Information\n(a) A consumer shall\
    \ have the right to request a business that maintains inaccurate personal information about the consumer to correct that inaccurate personal information, taking into account the nature of the personal\
    \ information and the purposes of the processing of the personal information.\n(b) A business that collects personal information about consumers shall disclose, pursuant to Section 1798.130, the consumer’s\
    \ right to request correction of inaccurate personal information.\n(c) A business that receives a\n\t\t\t\t\t\tverifiable consumer request to correct inaccurate personal information shall use commercially\
    \ reasonable efforts to correct the inaccurate personal information as directed by the consumer, pursuant to Section 1798.130 and regulations adopted pursuant to paragraph (7) of subdivision (a) of\
    \ Section 1798.185."
