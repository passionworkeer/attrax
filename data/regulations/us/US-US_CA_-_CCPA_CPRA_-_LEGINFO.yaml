  text: "(Amended by Stats. 2024, Ch. 121, Sec. 1.   (AB 3286)   Effective January 1, 2025.)\n1798.110.\nConsumers’ Right to Know What Personal Information is Being Collected. Right to Access Personal Information\n\
    (a) A consumer shall have the right to request that a business that collects personal information about the consumer disclose to the consumer the following:\n(1) The categories of personal information\
    \ it has collected about that consumer.\n(2) The categories of sources from which the personal information is collected.\n(3) The business or commercial purpose for collecting, selling, or sharing personal\
    \ information.\n(4) The categories\n\t\t\t\tof third parties to whom the business discloses personal information.\n(5) The specific pieces of personal information it has collected about that consumer.\n\
    (b) A business that collects personal information about a consumer shall disclose to the consumer, pursuant to subparagraph (B) of paragraph (3) of subdivision (a) of Section 1798.130, the information\
    \ specified in subdivision (a) upon receipt of a verifiable consumer request from the consumer, provided that a business shall be deemed to be in compliance with paragraphs (1) to (4), inclusive, of\
    \ subdivision (a) to the extent that the categories of information and the business or commercial purpose for collecting, selling, or sharing personal information it would be required to disclose to\
    \ the consumer pursuant to paragraphs (1) to (4), inclusive, of subdivision (a) is the same as the information it has disclosed pursuant to\n\t\t\t\tparagraphs (1) to (4), inclusive, of subdivision\
    \ (c).\n(c) A business that collects personal information about consumers shall disclose, pursuant to subparagraph (B) of paragraph (5) of subdivision (a) of Section 1798.130:\n(1) The categories of\
    \ personal information it has collected about consumers.\n(2) The categories of sources from which the personal information is collected.\n(3) The business or commercial purpose for collecting, selling,\
    \ or sharing personal information.\n(4) The categories of third parties to whom the business discloses personal information.\n(5) That a consumer has the right to request the specific pieces of\n\t\t\
    \t\tpersonal information the business has collected about that consumer.\n(Amended November 3, 2020, by initiative Proposition 24, Sec. 7.   Effective December 16, 2020.   Operative January 1, 2023,\
    \ pursuant to Sec. 31 of Proposition 24.)\n1798.115.\nConsumers’ Right to Know What Personal Information is Sold or Shared and to Whom\n(a) A consumer shall have the right to request that a business\
    \ that sells or shares the consumer’s personal information, or that discloses it for a business purpose, disclose to that consumer:\n(1) The categories of personal information that the business collected\
    \ about the consumer.\n(2) The categories of personal information that the business sold or shared about the consumer and the categories of third parties to whom the personal information was sold or\
    \ shared, by category or categories of personal information for each category of third parties to whom the personal information was\n\t\t\t\tsold or shared.\n(3) The categories of personal information\
    \ that the business disclosed about the consumer for a business purpose and the categories of persons to whom it was disclosed for a business purpose.\n(b) A business that sells or shares personal information\
    \ about a consumer, or that discloses a consumer’s personal information for a business purpose, shall disclose, pursuant to paragraph (4) of subdivision (a) of Section 1798.130, the information specified\
    \ in subdivision (a) to the consumer upon receipt of a verifiable consumer request from the consumer.\n(c) A business that sells or shares consumers’ personal information, or that discloses consumers’\
    \ personal information for a business purpose, shall disclose, pursuant to subparagraph (C) of paragraph (5) of subdivision (a) of Section 1798.130:"
- id: art-5
  title: (1) The category or categories of consumers’ personal inform
  text: "(1) The category or categories of consumers’ personal information it has sold or shared, or if the business has not sold or shared consumers’ personal information, it shall disclose that fact.\n\
    (2) The category or categories of consumers’ personal information it has disclosed for a business purpose, or if the business has not disclosed consumers’ personal information for a business purpose,\
    \ it shall disclose that fact.\n(d) A third party shall not sell or share personal information about a consumer that has been sold to, or shared with, the third party by a business unless the consumer\
    \ has received explicit notice and is provided an opportunity to exercise the right to opt-out pursuant to Section 1798.120.\n(Amended November 3, 2020, by initiative Proposition 24, Sec. 8.   Effective\
    \ December 16, 2020.   Operative January 1, 2023, pursuant to Sec. 31 of Proposition 24.)\n1798.120.\nConsumers’ Right to Opt Out of Sale or Sharing of Personal Information\n(a) (1) A consumer shall\
    \ have the right, at any time, to direct a business that sells or shares personal information about the consumer to third parties not to sell or share the consumer’s personal information. This right\
    \ may be referred to as the right to opt out of sale or sharing.\n(2) A business to which another business transfers the personal information of a consumer as an asset that is part of a merger, acquisition,\
    \ bankruptcy, or other transaction in which the transferee assumes control of all of, or part of, the transferor shall comply with a consumer’s direction to the transferor made pursuant to this subdivision.\n\
    (b) A business that sells consumers’ personal information to, or shares it with, third parties shall provide notice to consumers, pursuant to subdivision (a) of Section 1798.135, that this information\
    \ may be sold or shared and that consumers have the “right to opt out” of the sale or sharing of their personal information.\n(c) Notwithstanding subdivision (a), a business shall not sell or share\
    \ the personal information of consumers if the business has actual knowledge that the consumer is less than 16 years of age, unless the consumer, in the case of consumers at least 13 years of age and\
    \ less than 16 years of age, or the consumer’s parent or guardian, in the case of consumers who are less than 13 years of age, has affirmatively authorized the sale or sharing of the consumer’s personal\
    \ information. A business that willfully disregards the consumer’s age shall be deemed to have had\n\t\t\t\t  actual knowledge of the consumer’s age.\n(d) A business that has received direction from\
    \ a consumer not to sell or share the consumer’s personal information or, in the case of a minor consumer’s personal information has not received consent to sell or share the minor consumer’s personal\
    \ information, shall be prohibited, pursuant to paragraph (4) of subdivision (c) of Section 1798.135, from selling or sharing the consumer’s personal information after its receipt of the consumer’s\
    \ direction, unless the consumer subsequently provides consent, for the sale or sharing of the consumer’s personal information.\n(Amended by Stats. 2024, Ch. 940, Sec. 1.   (AB 1824)   Effective January\
    \ 1, 2025.)\n1798.121.\nConsumers’ Right to Limit Use and Disclosure of Sensitive Personal Information\n(a) A consumer shall have the right, at any time, to direct a business that collects sensitive\
    \ personal information about the consumer to limit its use of the consumer’s sensitive personal information to that use which is necessary to perform the services or provide the goods reasonably expected\
    \ by an average consumer who requests those goods or services, to perform the services set forth in paragraphs (2), (4), (5), and (8) of subdivision (e) of Section 1798.140, and as authorized by regulations\
    \ adopted pursuant to subparagraph (C) of paragraph (18) of subdivision (a) of Section 1798.185. A business that uses or discloses"
- id: art-6
  title: "\t\t\t\t\t\ta consumer’s sensitive personal information for purpos"
  text: "\t\t\t\t\t\ta consumer’s sensitive personal information for purposes other than those specified in this subdivision shall provide notice to consumers, pursuant to subdivision (a) of Section 1798.135,\
    \ that this information may be used, or disclosed to a service provider or contractor, for additional, specified purposes and that consumers have the right to limit the use or disclosure of their sensitive\
    \ personal information.\n(b) A business that has received direction from a consumer not to use or disclose the consumer’s sensitive personal information, except as authorized by subdivision (a), shall\
    \ be prohibited, pursuant to paragraph (4) of subdivision (c) of Section 1798.135, from using or disclosing the consumer’s sensitive personal information for any other purpose after its receipt of the\
    \ consumer’s direction unless the consumer subsequently\n\t\t\t\t\t\tprovides consent for the use or disclosure of the consumer’s sensitive personal information for additional purposes.\n(c) A service\
    \ provider or contractor that assists a business in performing the purposes authorized by subdivision (a) may not use the sensitive personal information after it has received instructions from the business\
    \ and to the extent it has actual knowledge that the personal information is sensitive personal information for any other purpose. A service provider or contractor is only required to limit its use\
    \ of sensitive personal information received pursuant to a written contract with the business in response to instructions from the business and only with respect to its relationship with that business.\n\
    (d) Sensitive personal information that is collected or\n\t\t\t\t\t\tprocessed without the purpose of inferring characteristics about a consumer is not subject to this section, as further defined in\
    \ regulations adopted pursuant to subparagraph (C) of paragraph (18) of subdivision (a) of Section 1798.185, and shall be treated as personal information for purposes of all other sections of this act,\
    \ including Section 1798.100.\n(Amended by Stats. 2024, Ch. 121, Sec. 2.   (AB 3286)   Effective January 1, 2025.)\n1798.125.\nConsumers’ Right of No Retaliation Following Opt Out or Exercise of Other\
    \ Rights\n(a) (1) A business shall not discriminate against a consumer because the consumer exercised any of the consumer’s rights under this title, including, but not limited to, by:\n(A) Denying goods\
    \ or services to the consumer.\n(B) Charging different prices or rates for goods or services, including through the use of discounts or other benefits or imposing penalties.\n(C) Providing a different\
    \ level or quality of goods or services to the consumer.\n(D) Suggesting that the consumer will receive a different price or rate for goods or services or a different level or quality of goods or services.\n\
    (E) Retaliating against an employee, applicant for employment, or independent contractor, as defined in subparagraph (A) of paragraph (2) of subdivision (m) of Section 1798.145, for exercising their\
    \ rights under this title.\n(2) Nothing in this subdivision prohibits a business, pursuant to subdivision (b), from charging a consumer a different price or rate, or from providing a different level\
    \ or quality of goods or services to the consumer, if that difference is reasonably related to the value provided to the business by the consumer’s data.\n(3) This subdivision does not prohibit a business\
    \ from offering loyalty, rewards, premium features, discounts, or club\n\t\t\t\tcard programs consistent with this title.\n(b) (1) A business may offer financial incentives, including payments to consumers\
    \ as compensation, for the collection of personal information, the sale or sharing of personal information, or the retention of personal information. A business may also offer a different price, rate,\
    \ level, or quality of goods or services to the consumer if that price or difference is reasonably related to the value provided to the business by the consumer’s data."
- id: art-7
  title: (2) A business that offers any financial incentives pursuant
  text: "(2) A business that offers any financial incentives pursuant to this subdivision, shall notify consumers of the financial incentives pursuant to Section 1798.130.\n(3) A business may enter a consumer\
    \ into a financial incentive program only if the consumer gives the business prior opt-in consent pursuant to Section\n\t\t\t\t1798.130 that clearly describes the material terms of the financial incentive\
    \ program, and which may be revoked by the consumer at any time. If a consumer refuses to provide opt-in consent, then the business shall wait for at least 12 months before next requesting that the\
    \ consumer provide opt-in consent, or as prescribed by regulations adopted pursuant to Section 1798.185.\n(4) A business shall not use financial incentive practices that are unjust, unreasonable, coercive,\
    \ or usurious in nature.\n(Amended November 3, 2020, by initiative Proposition 24, Sec. 11.   Effective December 16, 2020.   Operative January 1, 2023, pursuant to Sec. 31 of Proposition 24.)\n1798.130.\n\
    Notice, Disclosure, Correction, and Deletion Requirements\n(a) In order to comply with Sections 1798.100, 1798.105, 1798.106, 1798.110, 1798.115, and 1798.125, a business shall, in a form that is reasonably\
    \ accessible to consumers:\n(1) (A) Make available to consumers two or more designated methods for submitting requests for information required to be disclosed pursuant to Sections 1798.110 and 1798.115,\
    \ or requests for deletion or correction pursuant to Sections 1798.105 and 1798.106, respectively, including, at a minimum, a toll-free telephone number. A business that operates exclusively online\
    \ and has a direct relationship with a consumer from whom it collects personal information shall only be\n\t\t\t\t  required to provide an email address for submitting requests for information required\
    \ to be disclosed pursuant to Sections 1798.110 and 1798.115, or for requests for deletion or correction pursuant to Sections 1798.105 and 1798.106, respectively.\n(B) If the business maintains an internet\
    \ website, make the internet website available to consumers to submit requests for information required to be disclosed pursuant to Sections 1798.110 and 1798.115, or requests for deletion or correction\
    \ pursuant to Sections 1798.105 and 1798.106, respectively.\n(2) (A) Disclose and deliver the required information to a consumer free of charge, correct inaccurate personal information, or delete a\
    \ consumer’s personal information, based on the consumer’s request, within 45 days of receiving a verifiable consumer request from the consumer. The business shall promptly take steps to\n\t\t\t\t \
    \ determine whether the request is a verifiable consumer request, but this shall not extend the business’ duty to disclose and deliver the information, to correct inaccurate personal information, or\
    \ to delete personal information within 45 days of receipt of the consumer’s request. The time period to provide the required information, to correct inaccurate personal information, or to delete personal\
    \ information may be extended once by an additional 45 days when reasonably necessary, provided the consumer is provided notice of the extension within the first 45-day period. The disclosure of the\
    \ required information shall be made in writing and delivered through the consumer’s account with the business, if the consumer maintains an account with the business, or by mail or electronically at\
    \ the consumer’s option if the consumer does not maintain an account with the business, in a readily useable format that allows the consumer to transmit this information from one entity to another entity\
    \ without hindrance. The"
