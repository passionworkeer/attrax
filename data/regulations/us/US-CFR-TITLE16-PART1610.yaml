- id: art-2
  title: § 1610.1
  text: '§ 1610.1

    Purpose, scope and applicability.

    (a)

    Purpose.

    The purpose of this standard is to reduce danger of injury and loss of life by providing, on a national basis, standard methods of testing and rating the flammability of textiles and textile products
    for clothing use, thereby prohibiting the use of any dangerously flammable clothing textiles.

    (b)

    Scope.

    The Standard provides methods of testing the flammability of clothing and textiles intended to be used for clothing, establishes three classes of flammability, sets forth the requirements which textiles
    shall meet to be classified, and warns against the use of those textiles which have burning characteristics unsuitable for clothing. Hereafter, “clothing and textiles intended to be used for clothing”
    shall be referred to as “textiles.”

    (c)

    Specific exceptions.

    This standard shall not apply to: (1) Hats, provided they do not constitute or form part of a covering for the neck, face, or shoulders when worn by individuals;

    (2) Gloves, provided they are not more than 14 inches in length and are not affixed to or do not form an integral part of another garment;

    (3) Footwear, provided it does not consist of hosiery in whole or part and is not affixed to or does not form an integral part of another garment;

    (4) Interlining fabrics, when intended or sold for use as a layer between an outer shell and an inner lining in wearing apparel.

    (d)

    Specific exemptions.

    Experience gained from years of testing in accordance with the Standard demonstrates that certain fabrics consistently yield acceptable results when tested in accordance with the Standard. Therefore,
    persons and firms issuing an initial guaranty of any of the following types of fabrics, or of products made entirely from one or more of these fabrics, are exempt from any requirement for testing to
    support guaranties of those fabrics:

    (1) Plain surface fabrics, regardless of fiber content, weighing 2.6 ounces per square yard or more; and

    (2) All fabrics, both plain surface and raised-fiber surface textiles, regardless of weight, made entirely from any of the following fibers or entirely from combination of the following fibers: acrylic,
    modacrylic, nylon, olefin, polyester, wool.

    (e)

    Applicability.

    The requirements of this part 1610 shall apply to textile fabric or related material in a form or state ready for use in an article of wearing apparel, including garments and costumes finished for consumer
    use.'
- id: art-3
  title: § 1610.2
  text: '§ 1610.2

    Definitions.

    In addition to the definitions given in Section 2 of the Flammable Fabrics Act as amended (15 U.S.C. 1191), the following definitions apply for this part 1610.

    (a)

    Base burn

    (also known as base fabric ignition or fusing) means the point at which the flame burns the ground (base) fabric of a raised surface textile fabric and provides a self-sustaining flame. Base burns,
    used to establish a Class 3 fabric, are those burns resulting from surface flash that occur on specimens in places other than the point of impingement when the warp and fill yarns of a raised surface
    textile fabric undergo combustion. Base burns can be identified by an opacity change, scorching on the reverse side of the fabric, or when a physical hole is evident.

    (b)

    Burn time

    means the time elapsed from ignition until the stop thread is severed as measured by the timing mechanism of the test apparatus.

    (c)

    Dry cleaning

    means the cleaning of samples in a commercial dry cleaning machine under the conditions described in § 1610.6.

    (d)

    Film

    means any non-rigid, unsupported plastic, rubber or other synthetic or natural film or sheeting, subject to the Act, or any combination thereof, including transparent, translucent, and opaque material,
    whether plain, embossed, molded, or otherwise surface treated, which is in a form or state ready for use in wearing apparel, and shall include film or sheeting of any thickness.

    (e)

    Flammability

    means those characteristics of a material that pertain to

    its relative ease of ignition and relative ability to sustain combustion.

    (f)

    Flame application

    time means the 1 second during which the ignition flame is applied to the test specimen.

    (g)

    Ignition

    means that there is a self-sustaining flame on the specimen after the test flame is removed.

    (h)

    Interlining

    means any textile which is intended for incorporation into an article of wearing apparel as a layer between an outer shell and an inner lining.

    (i)

    Laundering

    means washing with an aqueous detergent solution and includes rinsing, extraction and tumble drying as described in § 1610.6.

    (j)

    Long dimension

    means the 150 mm (6 in) length of test specimen.

    (k)

    Plain surface textile

    fabric means any textile fabric which does not have an intentionally raised fiber or yarn surface such as a pile, nap, or tuft, but shall include those fabrics that have fancy woven, knitted or flock-printed
    surfaces.

    (l)

    Raised surface textile fabric

    means any textile fabric with an intentionally raised fiber or yarn surface, such as a pile, including flocked pile, nap, or tufting.

    (m)

    Refurbishing

    means dry cleaning and laundering in accordance with § 1610.6.

    (n)

    Sample

    means a portion of a lot of material which is taken for testing or for record keeping purposes.

    (o)

    Specimen

    means a 50 mm by 150 mm (2 in by 6 in) section of sample.

    (p)

    Stop thread supply

    means No. 50, white, mercerized, 100% cotton sewing thread.

    (q)

    Surface flash

    means a rapid burning of the pile fibers and yarns on a raised fiber surface textile that may or may not result in base burning.

    (r)

    Textile fabric

    means any coated or uncoated material subject to the Act, except film and fabrics having a nitro-cellulose fiber, finish, or coating, which is woven, knitted, felted or otherwise produced from any natural
    or manmade fiber, or substitute therefore, or combination thereof, of 50 mm (2 in) or more in width, and which is in a form or state ready for use in wearing apparel, including fabrics which have undergone
    further processing, such as dyeing and finishing, in garment form, for consumer use.

