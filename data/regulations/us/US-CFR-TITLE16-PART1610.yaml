- id: art-5
  title: § 1610.3
  text: '§ 1610.3

    Summary of test method.

    The Standard provides methods of testing the flammability of textiles from or intended to be used for apparel; establishes three classes of flammability; sets forth the requirements for classifying
    textiles; and prohibits the use of single or multi-layer textile fabrics that have burning characteristics that make them unsuitable for apparel. All textiles shall be tested before and after refurbishing
    according to § 1610.6. Each specimen cut from the textile shall be inserted in a frame, brushed if it has a raised-fiber surface, and held in a special apparatus at an angle of 45°. A standardized flame
    shall be applied to the surface near the lower end of the specimen for 1 second, and the time required for the flame to proceed up the fabric a distance of 127 mm (5 in) shall be recorded. A notation
    shall be made as to whether the base of a raised-surface textile fabric ignites or fuses.'
- id: art-6
  title: § 1610.4
  text: '§ 1610.4

    Requirements for classifying textiles.

    (a)

    Class 1, Normal Flammability.

    Class 1 textiles exhibit normal flammability and are acceptable for use in clothing. This class shall include textiles which meet the minimum requirements set forth in paragraph (a)(1) or paragraph
    (a)(2) of this section.

    (1)

    Plain surface textile fabric.

    Such textiles in their original state and/or after being refurbished as described in § 1610.6(a) and § 1610.6(b), when tested as described in § 1610.6 shall be classified as Class 1, Normal flammability,
    when the burn time is 3.5 seconds or more.

    (2)

    Raised surface textile fabric.

    Such textiles in their original state and/or after being refurbished as described in § 1610.6(a) and § 1610.6(b), when tested as described in § 1610.6, shall be classified as Class 1, Normal flammability,
    when the burn time is more than 7 seconds, or when they burn with a rapid surface flash (0 to 7 seconds), provided the intensity of the flame is so low as not to ignite or fuse the base fabric.

    (b)

    Class 2, Intermediate flammability.

    Class 2 fabrics, applicable only to raised-fiber surface textiles, are considered to be of intermediate flammability, but may be used for clothing. This class shall include textiles which meet the minimum
    requirements set forth in paragraph (b)(2) of this section.

    (1)

    Plain surface textile fabric.

    Class 2 is not applicable to plain surface textile fabrics.

    (2)

    Raised surface textile fabric.

    Such textiles in their original state and/or after being refurbished as described in § 1610.6(a) and § 1610.6(b), when tested as described in § 1610.6, shall be classified as Class 2, Intermediate flammability,
    when the burn time is from 4 through 7 seconds, both inclusive, and the base fabric ignites or fuses.

    (c)

    Class 3, Rapid and intense burning.

    Class 3 textiles exhibit rapid and intense burning, are dangerously flammable and shall not be used for clothing. This class shall include textiles which have burning characteristics as described in
    paragraphs (c)(1) and (c)(2) of this section. Such textiles are considered dangerously flammable because of their rapid and intense burning.

    (1)

    Plain surface textile fabric.

    Such textiles in their original state and/or after refurbishing as described in § 1610.6(a) and § 1610.6(b), when tested as described in § 1610.6, shall be classified as Class 3 Rapid and Intense Burning
    when the time of flame spread is less than 3.5 seconds.

    (2)

    Raised surface textile fabric.

    Such textiles in their original state and/or after refurbishing as described in § 1610.6(a) and § 1610.6(b), when tested as described in § 1610.6, shall be classified as Class 3 Rapid and Intense Burning
    when the time of flame spread is less than 4 seconds, and the base fabric starts burning at places other than the point of impingement as a result of the surface flash (test result code SFBB).

    Table 1 to § 1610.4—Summary of Test Criteria for Specimen Classification

    [See § 1610.7]

    Class

    Plain surface textile fabric

    Raised surface textile fabric

    1

    Burn time is 3.5 seconds or more ACCEPTABLE (3.5 sec is a pass)

    (1) Burn time is greater than 7.0 seconds; or

    (2) Burn time is 0-7 seconds with no base burns (SFBB). Exhibits rapid surface flash only.

    ACCEPTABLE.

    2

    Class 2 is not applicable to plain surface textile fabrics

    Burn time is 4-7 seconds (inclusive) with base burn (SFBB).

    ACCEPTABLE.

    3

    Burn time is less than 3.5 seconds. NOT ACCEPTABLE

    Burn time is less than 4.0 seconds with base burn (SFBB).

    NOT ACCEPTABLE.'
