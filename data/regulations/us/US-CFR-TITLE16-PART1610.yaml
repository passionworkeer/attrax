- id: art-11
  title: § 1610.6
  text: '§ 1610.6

    Test procedure.

    The test procedure is divided into two steps. Step 1 is testing in the original state; Step 2 is testing after the fabric has been refurbished according to paragraph (b)(1) of this section.

    (a)

    Step 1—Testing in the original state.

    (1) Tests shall be conducted on the fabric in a form or state ready for use in wearing apparel. Determine whether the fabric to be tested is a plain surface textile fabric or a raised surface textile
    fabric as defined in § 1610.2 (k) and (l). There are some fabrics that require extra attention when preparing test specimens because of their particular construction characteristics. Examples of these
    fabrics are provided in paragraphs (a)(1)(i) through (vi) of this section along with guidelines for preparing specimens from these fabrics. This information is not intended to be all-inclusive.

    (i)

    Flocked fabrics.

    Fabrics that are flocked overall are treated as raised surface textile fabrics as defined in § 1610.2(l). Flock printed fabrics (usually in a pattern and not covering the entire surface) shall be treated
    as plain surface textile fabrics as defined in § 1610.2(k).

    (ii)

    Cut velvet fabrics.

    Cut velvet fabrics with a patterned construction shall be considered a raised surface textile fabric as defined in § 1610.2(l).

    (iii)

    Metallic thread fabrics.

    Metallic thread fabrics shall be considered plain surface textile fabrics provided the base fabric is smooth. The specimens shall be cut so that the metallic thread is parallel to the long dimension
    of the specimen and arranged so the test flame impinges on a metallic thread.

    (iv)

    Embroidery.

    Embroidery on netting material shall be tested with two sets of preliminary specimens to determine the most flammable area (which offers the greatest amount of netting or embroidery in the 150 mm (6
    in.) direction). One set of netting only shall be tested and the other set shall consist mainly of embroidery with the specimens cut so that the test flame impinges on the embroidered area. Test the
    most flammable area according to the plain surface textile fabric requirements. The full test shall be completed on a sample cut from the area that has the fastest burn rate.

    (v)

    Burn-out patterns.

    Flat woven constructions with burn-out patterns shall be considered plain surface textile fabrics as defined in § 1610.2(k).

    (vi)

    Narrow fabrics and loose fibrous materials.

    Narrow fabrics and loose fibrous materials manufactured less than 50 mm (2 in) in width in either direction shall not be tested. If a 50 mm by 150 mm (2 in by 6 in) specimen cannot be cut due to the
    nature of the item,

    i.e.

    hula skirts, leis, fringe, loose feathers, wigs, hairpieces, etc., do not conduct a test.

    (2)

    Plain surface textile fabrics:

    (i)

    Preliminary trials.

    Conduct preliminary trials to determine the quickest burning direction. The specimen size shall be 50 mm by 150 mm (2 in by 6 in). Cut one specimen from each direction of the fabric. Identify the fabric
    direction being careful not to make any identifying marks in the exposed area to be tested. Preliminary specimens shall be mounted and conditioned as described in paragraphs (a)(2)(ii) through (iv)
    of this section and then tested following the procedure in paragraph (c) of this section to determine if there is a difference in the burning characteristics with respect to the direction of the fabric.

    (ii)

    Identify and cut test specimens.

    Cut the required number of test specimens to be tested (refer to § 1610.7(b)(1)). Each specimen shall be 50 mm by 150 mm (2 in by 6 in), with the long dimension in the direction in which burning is
    most rapid as established in the preliminary trials. Be careful not to make any identifying marks in the exposed area to be tested.

    (iii)

    Mount specimens.

    Specimens shall be placed in the holders, with the side to be burned face up. Even though plain surface textile fabrics are not brushed, all specimens shall be mounted in a specimen holder placed on
    the carriage that rides on the brushing device to ensure proper position in the

    holder. A specimen shall be placed between the two metal plates of a specimen holder and clamped. Each specimen shall be mounted and clamped prior to conditioning and testing.

    (iv)

    Condition specimens.

    All specimens mounted in the holders shall then be placed in a horizontal position on an open metal shelf in the oven to permit free circulation of air around them. The specimens shall be dried in the
    oven for 30 ±2 minutes at 105° ±3 °C (221° ±5 °F), removed from the oven and placed over a bed of anhydrous silica gel desiccant in a desiccator until cool, but not less than 15 minutes.

    (v)

    Flammability test.

    Follow the test procedure in paragraph (c) of this section and also follow the test sequence in § 1610.7(b)(1).

    (3)

    Raised surface textile fabrics

    —(i)

    Preliminary trials.

    The most flammable surface of the fabric shall be tested. Conduct preliminary trials and/or visual examination to determine the quickest burning area. The specimen size shall be 50 mm by 150 mm (2 in
    by 6 in). For raised surface textile fabrics, the direction of the lay of the surface fibers shall be parallel with the long dimension of the specimen. Specimens shall be taken from that part of the
