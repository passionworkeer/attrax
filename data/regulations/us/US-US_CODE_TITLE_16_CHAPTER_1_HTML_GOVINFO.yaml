    made section applicable only to the National Wildlife Refuge System. See below. For provisions related to the National Park System, see section 104906 of Title 54, National Park Service and Related
    Programs.


    Pub. L. 113–287, §4(d), amended section generally. Prior to amendment, section related to the right of Americans to exercise their Second Amendment rights in the National Park System and the National
    Wildlife Refuge System.


    Statutory Notes and Related Subsidiaries


    Effective Date


    Section effective nine months after May 22, 2009, except as otherwise specifically provided, see section 3 of Pub. L. 111–24, set out as an Effective Date of 2009 Amendment note under section 1602 of
    Title 15, Commerce and Trade.'
