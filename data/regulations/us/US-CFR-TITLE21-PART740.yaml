    PART 740—COSMETIC PRODUCT WARNING STATEMENTS

    Subpart A—General

    Sec.

    740.1

    Establishment of warning statements.

    740.2

    Conspicuousness of warning statements.

    Subpart B—Warning Statements

    740.10

    Labeling of cosmetic products for which adequate substantiation of safety has not been obtained.

    740.11

    Cosmetics in self-pressurized containers.

    740.12

    Feminine deodorant sprays.

    740.17

    Foaming detergent bath products.

    740.18

    Coal tar hair dyes posing a risk of cancer.

