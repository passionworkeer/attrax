    Subpart A—The Standard'
- id: art-2
  title: § 1205.1
  text: '§ 1205.1

    Scope of the standard.

    (a)

    General.

    This subpart A of part 1205 is a consumer product safety standard which prescribes safety requirements for certain walk-behind power lawn mowers, including labeling and performance requirements. The
    performance requirements of the standard apply to rotary mowers. The labeling requirements apply to both rotary and reel-type mowers. The standard is intended to reduce the risk of injury to consumers
    caused by contact, primarily of the foot and hand, with the rotating blade of the mower. A detailed discussion of the risk of injury and of the anticipated costs, benefits, and other factors associated
    with the standard is contained in § 1205.8

    Findings.

    (b)

    Scope.

    (1) Except as provided in paragraph (c) of this section, all walk-behind rotary and reel-type power lawn mowers manufactured or imported on or after the effective date of the standard are subject to
    the requirements of this standard if they are “consumer products”. “Walk behind power lawn mower” is defined as a grass cutting machine with a minimum cutting width of 12 in (305 mm) that employs an
    engine or motor as a power source. Section 3(a)(1) of the Consumer Product Safety Act (“CPSA”), 15 U.S.C. 2052(a)(1), defines the term

    consumer product

    as an “article, or component part thereof, produced or distributed (i) for sale to a consumer for use in or around a permanent or temporary household or residence, a school, in recreation, or otherwise,
    or (ii) for the personal use, consumption or enjoyment of a consumer in or around a permanent or temporary household or residence, a school, in recreation, or otherwise.” The term does not include products
    that are not customarily produced or distributed for sale to, or for the use or consumption by, or enjoyment of, a consumer.

    (2) It is unlawful to manufacture for sale, offer for sale, distribute in commerce, or import into the United States any product subject to this standard that is not in conformity with the standard.
    The Commission is not applying the standard to rental transactions or to the ultimate sale of used rental mowers by rental firms.

    (c)

    Exclusions

    —(1)

    General.

    Mowers that have all three of the following characteristics are not covered by the standard:

    (i) A cutting width of 30 in (762 mm) or greater,

    (ii) A weight of 200 lb (90.7 kg) or more, and

    (iii) For engine-powered mowers, an engine of 8 horsepower (6 kw) or more.

    (2)

    Reel-type mowers.

    Reel-type power lawn mowers need not meet the performance requirements of the standard but they must be labeled as required by § 1205.6.'
