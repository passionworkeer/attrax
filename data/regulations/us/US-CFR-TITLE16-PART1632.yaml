  text: '§ 1632.5

    Mattress pad test procedure.

    (a)

    Testing.

    All mattress pads shall be tested, in the condition in which they are intended to be sold, according to § 1632.4 Mattress test procedure, using the glass fiberboard substrate.

    (b)

    Flame resistant mattress pads.

    The following additional requirements shall be applicable to mattress pads which contain a chemical fire retardant.

    (1) These mattress pads shall be tested in accordance with § 1632.4 Mattress test procedure after they have been washed and dried 10 times as described in § 1632.5(b)(2).

    (i) Such laundering is not required of mattress pads which are intended for one time use and/or are not intended to be laundered, as determined by the Consumer Product Safety Commission.

    (ii) Mattress pads which are not susceptible to being laundered and are labeled “dryclean only” shall be drycleaned by a procedure which has previously been found acceptable by the Consumer Product
    Safety Commission.

    (2)

    Laundering procedure.

    (i) Washing shall be performed in accordance with sections 8.2.2 and 8.2.3 of AATCC Test Method 124-1996, using wash temperature V (60° ±3 °C, 140° ±5 °F) specified in Table II of that method, and the
    water level, agitator speed, washing time, spin speed and final spin cycle specified for “Normal/Cotton Sturdy” in Table III.

    (ii) Drying shall be performed in accordance with section 8.3.1(A) of AATCC Test Method 124-1996 “Appearance of Fabrics after Repeated Home Laundering,” Tumble Dry, using the exhaust temperature (66°
    ±5 °C, 150° ±10 °F) and cool down time of 10 minutes specified in the “Durable Press” conditions of Table IV.

    (iii) Maximum washer load shall be 3.64 Kg (8 pounds) and may consist of any combination of test samples and dummy pieces.

    (iv) AATCC Test Method 124-1996 “Appearance of Fabrics after Repeated Home Laundering,” is found in Technical Manual of the American Association of Textile Chemists and Colorists, vol. 73, 1997, which
    is incorporated by reference. Copies of this document are available from the American Association of Textile Chemists and Colorists, P.O. Box 12215, Research Triangle Park, North Carolina 27709. This
    document is also available for inspection at the National Archives and Records Administration (NARA). For information on the availability of this material at NARA, call 202-741-6030, or go to:

    http://www.archives.gov/federal_register/code_of_federal_regulations/ibr_locations.html.

    This incorporation by reference was approved by the Director of the Federal Register in accordance with 5 U.S.C. 552(a) and 1 CFR part 51.

    (v) A different number of wash and dry cycles using another procedure may be specified and used, if that procedure has previously been found to be equivalent by the Consumer Product Safety Commission.

    (3)

    Labeling

    —(i)

    Treatment label.

    If a mattress pad contains a chemical fire retardant, it shall be labeled with the letter “T” pursuant to rules and regulations established by the Consumer Product Safety Commission.

    (ii)

    Care label.

    All mattress pads which contain a chemical fire retardant treatment shall be labeled with precautionary instructions to protect the pads from agents or treatments which are known to cause deterioration
    of their flame resistance. Such labels shall be permanent and otherwise in accordance with rules and regulations established by the Consumer Product Safety Commission in § 1632.31(b).

    (iii)

    Exception.

    One time use products as defined in § 1632.5(b)(1)(i) are not subject to these labeling requirements.

