  title: § 1632.1
  text: '§ 1632.1

    Definitions.

    In addition to the definitions given in section 2 of the Flammable Fabrics Act as amended (15 U.S.C. 1191), the following definitions apply for the purpose of the standard.

    (a)

    Mattress

    means a ticking filled with a resilient material used alone or in combination with other products intended or promoted for sleeping upon.

    (1) This definition includes, but is not limited to, adult mattresses, youth mattresses, crib mattresses including portable crib mattresses, bunk bed mattresses, futons, water beds and air mattresses
    which contain upholstery material between the ticking and the mattress core, and any detachable mattresses used in any item of upholstered furniture such as convertible sofa bed mattresses, corner group
    mattresses, day bed mattresses, roll-a-way bed mattresses, high risers, and trundle bed mattresses. See § 1632.8 Glossary of terms, for definitions of these items.

    (2) This definition excludes sleeping bags, pillows, mattress foundations, liquid and gaseous filled tickings such as water beds and air mattresses which do not contain upholstery material between the
    ticking and the mattress core, upholstered furniture which does not contain a detachable mattress such as chaise lounges, drop-arm love seats, press-back lounges, push-back sofas, sleep lounges, sofa
    beds (including jackknife sofa beds), sofa lounges (including glide-outs), studio couches and studio divans (including twin studio divans and studio beds), and juvenile product pads such as car bed
    pads, carriage pads, basket pads, infant carrier and lounge pads, dressing table pads, stroller pads, crib bumpers, and playpen pads. See § 1632.8 Glossary of terms, for definitions of these items.

    (b)

    Mattress Pad

    means a thin, flat mat or cushion, and/or ticking filled with resilient material for use on top of a mattress. This definition includes, but is not limited to, absorbent mattress pads, flat decubitus
    pads, and convoluted foam pads which are totally enclosed in ticking. This definition excludes convoluted foam pads which are not totally encased in ticking.

    (c)

    Ticking

    means the outermost layer of fabric or related material that encloses the core and upholstery materials of a mattress or mattress pad. A mattress ticking may consist of several layers of fabric or related
    materials quilted together.

    (d)

    Core

    means the main support system that may be present in a mattress, such as springs, foam, hair block, water bladder, air bladder, or resilient filling.

    (e)

    Upholstery material

    means all material, either loose or attached, between the mattress or mattress pad ticking and the core of a mattress, if a core is present.

    (f)

    Tape edge

    (edge) means the seam or border edge of a mattress or mattress pad.

    (g)

    Quilted

    means stitched with thread or by fusion through the ticking and one or more layers of upholstery material.

    (h)

    Tufted

    means buttoned or laced through the ticking and upholstery material and/or core, or having the ticking and upholstery material and/or core drawn together at intervals by any other method which produces
    a series of depressions on the surface.

    (i)

    Manufacturer

    means an individual plant or factory at which mattresses and/or mattress pads are produced or assembled.

    (j)

    Mattress prototype

    means mattresses of a particular design, sharing all materials and methods of assembly, but excluding differences in mattress size. If it has been shown as a result of prototype qualification testing
    that an upholstery material or core will not reduce the ignition resistance of the mattress prototype, substitution of another material for such material shall not be deemed a difference in materials
    for prototype definition. (See § 1632.31(c)(4) for records required to demonstrate that a change of materials has not reduced ignition resistance of a mattress prototype.) If it is determined or suspected
    that a material has influenced the ignition resistance of the mattress prototype, a change in that material, excluding an increase in thickness, shall be deemed a difference in materials for purposes
    of prototype definition unless it is previously shown to the satisfaction of the Consumer Product Safety Commission that such change will not reduce the ignition resistance of the mattress prototype.
    Ticking materials may be substituted in accordance with § 1632.6. Tape edge materials may be substituted in accordance with § 1632.7.

    (k)

    Mattress pad prototype

    means mattress pads of a particular design, sharing all materials and methods of assembly, but excluding differences in mattress pad size. A change in existing material, except an increase in thickness,
    shall be deemed a difference in materials for purposes of prototype definition unless it is previously shown to the satisfaction of the Consumer Product Safety Commission that such change will not reduce
    the ignition resistance of the mattress pad prototype. Ticking materials may be substituted in accordance with § 1632.6. Tape edge materials may be substituted in accordance with § 1632.7.

    (l)

    Surface

    means one side of a mattress or mattress pad which is intended for sleeping upon and which can be tested.'
- id: art-3
  title: § 1632.2
  text: '§ 1632.2

    Purpose, scope, and applicability.

    (a)

    Purpose.

    (1) This standard prescribes requirements for testing of prototype designs of mattresses and mattress pads before the sale in commerce or the introduction in commerce of any mattress or mattress pad
    which is subject to the standard. The standard prescribes a test to determine the ignition resistance of a mattress or a mattress pad when exposed to a lighted cigarette.

    (2) The standard sets forth a test at § 1632.6 which may be used to classify ticking materials for resistance to cigarette ignition.

    (3) The standard sets forth a test at § 1632.7 which may be used to demonstrate that the substitution of tape

    edge materials will not reduce the ignition resistance of a mattress prototype or a mattress pad prototype.

    (b)

    Scope.

    (1) All mattresses, as defined in § 1632.1(a), and all mattress pads, as defined in § 1632.1(b), manufactured or imported after the effective date of this amendment are subject to the requirements of
    the standard as amended.

    (2) All mattresses, as defined in § 1632.1(a), and all mattress pads, as defined in § 1632.1(b), manufactured or imported after June 22, 1973, and before the effective date of this amendment are subject
    to those requirements of the Standard for the Flammability of Mattresses (and Mattress Pads) (16 CFR part 1632) which were in effect before the effective date of this amendment.

    (3) Manufacturers or importers desiring to use the ticking substitution procedure provided in § 1632.6 may classify the ticking being used on each mattress prototype before or after the effective date
    of this amendment using the test procedure set forth in that section.

    (4) One-of-a-kind mattresses and mattress pads may be excluded from testing under this standard in accordance with rules established by the Consumer Product Safety Commission. (See § 1632.31(f): exemption
    for mattresses and mattress pads prescribed by a physician.)

    (c)

    Applicability.

    (1) The requirements for prototype testing prescribed by this standard are applicable to each “manufacturer” (as that term is defined in § 1632.1(i)) of mattresses or mattress pads subject to the standard
    which are manufactured for sale in commerce. The requirements of this standard for prototype testing are also applicable to all other persons or firms initially introducing mattresses or mattress pads
    into commerce, including importers; each such firm shall be deemed to be a “manufacturer” for purposes of this standard.

    (2) The test at § 1632.6 for classification of ticking materials may be used by manufacturers of mattresses or mattress pads and by manufacturers of ticking materials. The test at § 1632.7 may be used
    by manufacturers of mattresses to demonstrate that substitution of tape edge materials will not reduce ignition resistance of a mattress prototype or a mattress pad prototype. Use of the tests in §§ 1632.6
    and 1632.7 is optional.'
- id: art-4
  title: § 1632.3
  text: '§ 1632.3

    General requirements.

    (a)

    Summary of test method.

    The method measures the ignition resistance of a mattress or mattress pad by exposing the surface to lighted cigarettes in a draft-protected environment. The surfaces to be tested include smooth, tape
    edge, and quilted or tufted locations, if they exist on the mattress or mattress pad surface. A two-sheet test is also conducted on similar surface locations. In the latter test, the burning cigarettes
    are placed between the sheets.

    (b)

    Test criterion.

    When testing the mattress or mattress pad surface in accordance with the testing procedure set forth in § 1632.4

    Mattress test procedure,

    individual cigarette test locations pass the test if the char length is not more than 2 inches (5.1 cm) in any direction from the nearest point of the cigarette. In the interest of safety, the test
    operator should discontinue the test and record a failure before reaching the 2 inch char length if an obvious ignition has occurred.

    (c)

    Pre-market testing.

    Each manufacturer required to perform prototype testing by the standard shall perform the testing required by the standard with acceptable results before selling in commerce or introducing in commerce
    any mattress or mattress pad which is subject to the standard.

    (d)

    Specimen selection and qualification.

    (1) Each manufacturer required to perform prototype testing by the standard shall construct or select enough units of each proposed mattress prototype or proposed mattress pad prototype to provide six
    surfaces for testing. A minimum of three mattresses or mattress pads are required if both sides can be tested; six mattresses or mattress pads are required if only one side can be tested. Test each
    of the six surfaces according to § 1632.4(d). If all the cigarette test locations on all six mattress surfaces yield passing results using the criterion specified in § 1632.3(b), accept the mattress
    prototype. If all six surfaces of a mattress

    pad yield passing results using the criterion in § 1632.3(b), and all other applicable requirements prescribed by § 1632.5 are met, accept the mattress pad prototype. If one or more of the cigarette
    test locations on any of the six surfaces fail to meet the test criterion of § 1632.3(b), reject the mattress prototype or the mattress pad prototype.

    (2) Prototype qualification testing may be repeated after action has been taken to improve the resistance of the mattress prototype or the mattress pad prototype to cigarette ignition by changes in
    design, construction methods, materials selection, or other means. When prototype qualification is repeated after rejection of a prototype, such qualification testing shall be conducted in the same
    manner as original qualification testing.

    (3) Each mattress prototype and each mattress pad prototype must be accepted in prototype qualification before any mattress or mattress pad manufactured in accordance with such mattress prototype or
    mattress pad prototype is sold in commerce or introduced in commerce. Any manufacturer required to perform testing by the standard may rely on prototype tests performed before the effective date of
    this amended standard, provided that such tests were conducted in accordance with all requirements of §§ 1632.1(i), 1632.3(d), and 1632.4, and yield passing results when the test criterion of § 1632.3(b)
    is applied. If the ticking classification test at § 1632.6 is to be used when relying on prototype tests performed before the effective date of the standard, the ticking currently used on that mattress
    prototype must be classified before substitution of ticking using § 1632.6.

    (4) Rejected prototype mattresses or prototype mattress pads shall not be retested, offered for sale, sold, or promoted for use as a mattress (as defined in § 1632.1(a)) or for use as a mattress pad
    (as defined in § 1632.1(b)) except after reworking to improve the resistance to ignition by cigarettes, and subsequent retesting and acceptance of the mattress prototype (as defined in § 1632.1(j))
    or the mattress pad prototype (as defined in § 1632.1(k)).'
