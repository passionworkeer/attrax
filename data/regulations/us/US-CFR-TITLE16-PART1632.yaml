  title: § 1632.6
  text: '§ 1632.6

    Ticking substitution procedure.

    (a) This procedure may be used to verify acceptable equivalency if a mattress or mattress pad manufacturer wishes to change the ticking used on a particular mattress or mattress pad prototype without
    conducting a prototype test as specified in § 1632.4 or § 1632.5. The procedure includes a ticking classification test that may be used by a ticking, mattress or mattress pad manufacturer or by a distributor
    of ticking.

    (b)

    Definitions.

    For the purpose of this section the following definitions apply in addition to those in § 1632.1.

    (1)

    Mattress ticking prototype.

    Means a ticking of a specific construction, color, or combination of colors or color pattern, weave pattern design, finish application, fiber content, and weight per unit area. With respect to film-coated
    ticking, a mattress ticking prototype means in addition to the factors listed above, a given method of application, chemical formula, and thickness of application of film coating. With respect to a
    quilted ticking, a mattress ticking prototype means the combination of a specific ticking as described above; a specific filling, thickness, density, and chemical composition; a specific thread; a specific
    method of quilting; and a specific backing fabric construction, weave, finish, fiber content, and weight.

    (2)

    Mattress pad ticking prototype

    (i) Means a ticking of a specific construction, color, or combination of colors or color pattern, weave pattern design, finish application, fiber content, and weight per unit area. With respect to film-coated
    ticking, a mattress pad ticking prototype means in addition to the factors listed above, a given method of application, chemical formula, and thickness of application of film coating.

    (ii) Quilted ticking is excluded from this definition. Therefore, the following procedures may not be used to substitute quilted ticking used on or as a mattress pad.

    (c)

    Scope and application.

    (1) This procedure provides an independent evaluation of the cigarette ignition characteristics of ticking and for the classification of ticking into one of three performance classes. Class A represents
    tickings evaluated as acting as barriers against cigarette ignition; Class B represents tickings evaluated as having no effect on cigarette ignition; and Class

    C represents tickings evaluated as having the potential, in some manner, to act as a contributor to cigarette ignition.

    (2) Substitution of any ticking which has been evaluated as Class A using the procedure in this § 1632.6 for any other ticking material shall not be a “difference in materials” as that phrase is used
    in §§ 1632.1 (j) and (k). Consequently, any ticking material evaluated as Class A under this test procedure may be used on any qualified mattress prototype or on any qualified mattress pad prototype
    without conducting new prototype tests.

    (3) Substitution of any ticking which has been evaluated as Class B using the procedure in this § 1632.6 for the ticking material used on any mattress prototype or on any mattress pad prototype which
