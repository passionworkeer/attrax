- id: art-15
  title: § 1101.22
  text: '§ 1101.22

    Timing: request for time extensions.

    (a)

    Time for comment.

    (1) Generally firms will receive ten (10) calendar days from the date of the letter in which the Commission transmits the notice to furnish comments to the Commission. Firms that receive requests for
    comments by mail will receive an additional three (3) days to comment to account for time in the mail.

    (2) Upon his or her own initiative or upon request, the Freedom of Information Officer may provide a different amount of time for comment, particularly for firms that receive voluminous or complex material.
    In addition, the Commission may publish a finding that the public health and safety requires a lesser period of notice and may require a response in a shorter period of time (

    see'
- id: art-16
  title: § 1101.24).
  text: '§ 1101.24).

    (b)

    No response submitted.

    (1) If the Commission has not received a response within the time specified and if it has received no request for extension of time, the Commission will analyze the information as provided in subpart
    D. If no comments are submitted the Commission will not give the further notice provided in section 6(b)(2).

    (2) Unless the Commission publishes a finding that the public health and safety requires a lesser period of notice (see § 1101.23), the Commission will not disclose the information in fewer than 15
    days after providing a manufacturer or private labeler notice and opportunity to comment.

    (c)

    Requests for time extension.

    (1) Requests for extension of time to comment on information to be disclosed

    must be made to the person who provided the Commission''s notice and opportunity to comment. The request for time extension may be either oral or written. An oral request for a time extension must be
    promptly confirmed in writing.

    (2) Requests for extension of time must explain with specificity why the extension is needed and how much additional time is required.

    (3) The Commission will promptly respond to requests for extension of time.

    [48 FR 57430, Dec. 29, 1983, as amended at 73 FR 72335, Nov. 28, 2008]'
- id: art-17
  title: § 1101.23
  text: '§ 1101.23

    Providing less than 15 days notice before disclosing information.

    There are two circumstances in which the Commission may disclose to the public information subject to section 6(b)(1) in a time less than 15 days after providing notice to the manufacturer or private
    labeler.

    (a)

    Firm agrees to lesser period or does not object to disclosure.

    The Commission may disclose to the public information subject to section 6(b)(1) before the 15-day period expires when, after receiving the Commission''s notice and opportunity to comment, the firm
    involved agrees to the earlier disclosure; notifies the Commission that it has no comment; or notifies the Commission that it does not object to disclosure.

    (b)

    Commission finding a lesser period is required.'
- id: art-18
  title: Section 6(b)(1) provides that the Commission may publish a finding that the public health and safety requires a lesser period of notice than the 15 days advance notice that section 6(b)(1) generally
    r
  text: 'Section 6(b)(1) provides that the Commission may publish a finding that the public health and safety requires a lesser period of notice than the 15 days advance notice that section 6(b)(1) generally
    requires. The Commission may find that the public health and safety requires less than 15 days advance notice, for example, to warn the public quickly because individuals may be in danger from a product
    hazard or a potential hazard, or to correct product safety information released by third persons, which mischaracterizes statements made by the Commission about the product or which attributes to the
    Commission statements about the product which the Commission did not make.

    (c)

    Notice of finding.

    The Commission will inform a manufacturer or private labeler of a product which is the subject of a public health and safety finding that the public health and safety requires less than 15 days advance
    notice either orally or in writing, depending on the immediacy of the need for quick action. Where applicable, before releasing information, the Commission will comply with the requirements of section
    6(b) (1) and (2) by giving the firm the opportunity to comment on the information, either orally or in writing depending on the immediacy of the need for quick action, and by giving the firm advance
    notice before disclosing information claimed by a manufacturer or private labeler to be inaccurate (see § 1101.25).

    [48 FR 57430, Dec. 29, 1983, as amended at 73 FR 72335, Nov. 28, 2008]'
- id: art-19
  title: § 1101.24
  text: '§ 1101.24

    Scope of comments Commission seeks.

    (a)

    Comment in regard to the information.

    The section 6(b) opportunity to comment on information is intended to permit firms to furnish information and data to the Commission to assist the agency in its evaluation of the accuracy of the information.
    A firm''s submission, therefore, must be specific and should be accompanied by documentation, where available, if the comments are to assist the Commission in its evaluation of the information. Comments
    of a general nature, such as general suggestions or allegations that a document is inaccurate or that the Commission has not taken reasonable steps to assure accuracy, are not sufficient to assist the
    Commission in its evaluation of the information or to justify a claim of inaccuracy. The weight accorded a firm''s comments on the accuracy of information and the degree of scrutiny which the Commission
    will exercise in evaluating the information will depend on the specificity and completeness of the firm''s comments and of the accompanying documentation. In general, specific comments which are accompanied
    by documentation will be given more weight than those which are undocumented and general in nature.

    (b)

    Claims of confidentiality.

    If the manufacturer or private labeler believes the information involved cannot be disclosed because of section 6(a)(2) of the CPSA (15 U.S.C. 2055(a)(2)),

    which pertains to trade secret or other confidential material, the firm may make claims of confidentiality at the time it submits its comments to the Commission under this section. Such claims must
    identify the specific information which the firm believes to be confidential or trade secret material and must state with specificity the grounds on which the firm bases it claims. (See Commission''s
    Freedom of Information Act regulation, 16 CFR part 1015, particularly 16 CFR 1015.18.)

    (c)

    Requests for nondisclosure of comments.

    If a firm objects to disclosure of its comments or a portion thereof, it must notify the Commission at the time it submits its comments. If the firm objects to the disclosure of a portion of its comments,
    it must identify those portions which should be withheld.'
- id: art-20
  title: § 1101.25
  text: '§ 1101.25

    Notice of intent to disclose.

    (a)

    Notice to manufacturer or private labeler.

    In accordance with section 6(b)(2) of the CPSA, if the Commission, after following the notice provisions of section 6(b)(1), determines that information claimed to be inaccurate by a manufacturer or
    private labeler in comments submitted under section 6(b)(1) should be disclosed because the Commission believes it has complied with section 6(b)(1), the Commission shall notify the manufacturer or
    private labeler that it intends to disclose the information not less than 5 days after the date of the receipt of notification by the firm. The notice of intent to disclose will include an explanation
    of the reason for the Commission''s decision, copies of any additional materials, such as explanatory statements and letters to Freedom of Information Act requesters, which were not previously sent
    to the firm.

    (b)

    Commission finding a lesser period is required.

    The Commission may determine that the public health and safety requires less than 5 days advance notice of its intent to disclose information claimed to be inaccurate. For example, the Commission may
    determine it is necessary to warn the public quickly because individuals may be in danger from a product hazard or a potential hazard, or to correct product safety information released by third persons,
    which mischaracterized statements made by the Commission about the product or which attributes to the Commission statements about the product which the Commission did not make.

    (c)

    Notice of findings.

    The Commission will inform a manufacturer or private labeler of a product which is the subject of a public health and safety finding that the public health and safety requires less than 5 days advance
    notice either orally or in writing, depending on the immediacy of the need for quick action.

    [48 FR 57430, Dec. 29, 1983, as amended at 73 FR 72335, Nov. 28, 2008]'
- id: art-21
  title: § 1101.26
  text: '§ 1101.26

    Circumstances when the Commission does not provide notice and opportunity to comment.

    (a)

    Notice to the extent practicable.'
- id: art-22
  title: 'Section 6(b)(1) requires that “to the extent practicable” the Commission must provide manufacturers and private labelers notice and opportunity to comment before disclosing information from which
    the '
  text: 'Section 6(b)(1) requires that “to the extent practicable” the Commission must provide manufacturers and private labelers notice and opportunity to comment before disclosing information from which
    the public can ascertain readily their identity.

    (b)

    Circumstances when notice and opportunity to comment is not practicable.

    The Commission has determined that there are various circumstances when notice and opportunity to comment is

    not

    practicable. Examples include the following:

    (1) When the Commission has taken reasonable steps to assure that the company to which the information pertains is out of business and has no identifiable successor.

    (2) When the information is disclosed in testimony in response to an order of the court during litigation to which the Commission is not a party.

    Subpart D—Reasonable Steps Commission Will Take To Assure Information It Discloses Is Accurate, and That Disclosure Is Fair in the Circumstances and Reasonably Related to Effectuating the Purposes of
    the Acts It Administers'
- id: art-23
  title: § 1101.31
  text: '§ 1101.31

    General requirements.

    (a)

    Timing of decisions.

    The Commission will attempt to make its decision

    on disclosure so that it can disclose information in accordance with section 6(b) as soon as is reasonably possible after expiration of the statutory fifteen day moratorium on disclosure.

    (b)

    Inclusion of comments.

    In disclosing any information under this section, the Commission will include any comments or other information submitted by the manufacturer or private labeler unless the manufacturer or private labeler
    at the time it submits its section 6(b) comments specifically requests the Commission not to include the comments or to include only a designated portion of the comments and disclosure of the comments
    on such a designated portion is not necessary to assure that the disclosure of the information which is the subject of the comments is fair in the circumstances.

    (c)

    Explanatory statements.

    Where appropriate, the Commission will accompany the disclosure of information subject to this subpart with an explanatory statement that makes the nature of the information disclosed clear to the public.
    Inclusion of an explanatory statement is in addition to, and not a substitute for, taking reasonable steps to assure the accuracy of information. To the extent it is practical the Commission will also
    accompany the disclosure with any other relevant information in its possession that places the released information in context.

    (d)

    Information previously disclosed.

    If the Commission has previously disclosed, in accordance with section 6(b)(1), the identical information it intends to disclose again in the same format, it will not customarily take any additional
    steps to assure accuracy unless the Commission has some reason to question its accuracy or unless the firm, in its comments responding to the Commission''s initial section 6(b) notice, specifically
    requests the opportunity to comment on subsequent disclosures, or unless the Commission determines that sufficient time has passed to warrant seeking section 6(b) comment again. Before disclosing the
    information the Commission will again review the information to see if accuracy is called into question and will further look to whether disclosure is fair in the circumstances and reasonably related
    to effectuating the purposes of the Acts the Commission administers.

    [48 FR 57430, Dec. 29, 1983, as amended at 73 FR 72335, Nov. 28, 2008]'
- id: art-24
  title: § 1101.32
  text: '§ 1101.32

    Reasonable steps to assure information is accurate.

    (a) The Commission considers that the following types of actions are reasonable steps to assure the accuracy of information it proposes to release to the public:

    (1) The Commission staff or a qualified person or entity outside the Commission (e.g., someone with requisite training or experience, such as a fire marshal, a fire investigator, an electrical engineer,
    or an attending physician) conducts an investigation or an inspection which yields or corroborates the product information to be disclosed; or

    (2) The Commission staff conducts a technical, scientific, or other evaluation which yields or corroborates the product information to be disclosed or the staff obtains a copy of such an evaluation
    conducted by a qualified person or entity; or

    (3) The Commission staff provides the information to be disclosed to the person who submitted it to the Commission for review and, if necessary, correction, and the submitter confirms the information
    as accurate to the best of the submitter''s knowledge and belief, provided that:

    (i) The confirmation is made by the person injured or nearly injured in an incident involving the product; or

    (ii) The confirmation is made by a person who, on the basis of his or her own observation or experience, identifies an alleged safety-related defect in or problem with such a product even though no
    incident or injury associated with the defect or problem may have occurred; or

    (iii) The confirmation is made by an eyewitness to an injury or safety-related incident involving such a product; or

    (iv) The confirmation is made by an individual with requisite training or experience who has investigated and/or determined the cause of deaths, injuries or safety-related incidents involving such a
    product. Such persons would include, for example, a fire marshal, a

    fire investigator, an electrical engineer, an ambulance attendant, or an attending physician; or

    (v) The confirmation is made by a parent or guardian of a child involved in an incident involving such a product, or by a person to whom a child is entrusted on a temporary basis.

    (b) The steps set forth below are the steps the Commission will take to analyze the accuracy of information which it proposes to release to the public.

    (1) The Commission will review each proposed disclosure of information which is susceptible of factual verification to assure that reasonable steps have been taken to assure accuracy in accordance with
    § 1101.32(a).

    (2) As described in subpart C, the Commission will provide a manufacturer or private labeler with a summary or text of the information the Commission proposes to disclose and will invite comment with
    respect to that information.

    (3) If the Commission receives no comments or only general, undocumented comments claiming inaccuracy, the Commission will review the information in accordance with § 1101.32(a) and release it, generally
    without further investigating its accuracy if there is nothing on the face of the information that calls its accuracy into question.

    (4) If a firm comments on the accuracy of the information the Commission proposes to disclose, the Commission will review the information in light of the comments. The degree of review by the Commission
    and the weight accorded a firm''s comments will be directly related to the specificity and completeness of the firm''s comments on accuracy and the accompanying documentation. Documented comments will
    be given more weight than undocumented comments. Specific comments will be given more weight than general comments. Further steps may be taken to determine the accuracy of the information if the Commission
    determines such action appropriate.'
- id: art-25
  title: § 1101.33
  text: '§ 1101.33

    Reasonable steps to assure information release is fair in the circumstances.

    (a) The steps set forth below are the steps the Commission has determined are reasonable to take to assure disclosure of information to the public is fair in the circumstances:

    (1) The Commission will accompany information disclosed to the public with the manufacturer''s or private labeler''s comments unless the manufacturer or private labeler asks in its section 6(b) comments
    that its comments or a designated portion thereof not accompany the information.

    (2) The Commission generally will accompany the disclosure of information with an explanatory statement that makes the nature of the information disclosed clear to the public. The Commission will also
    take reasonable steps to disclose any other relevant information it its possession that will assure disclosure is fair in the circumstances.

    (3) The Commission will limit the form of disclosure to that which it considers appropriate in the circumstances. For example, the Commission may determine it is not appropriate to issue a nationwide
    press release in a particular situation and rather will issue a press release directed at certain localities, regions, or user populations.

    (4) The Commission may delay disclosure of information in some circumstances. For example, the Commission may elect to postpone an information release until an investigation, analysis or test of a product
    is complete, rather than releasing information piecemeal.

    (b) The Commission will not disclose information when it determines that disclosure would not be fair in the circumstances. The following are examples of disclosures which generally would not be fair
    in the circumstances.

    (1) Disclosure of information furnished by a firm to facilitate prompt remedial action or settlement of a case when the firm has a reasonable expectation that the information will be maintained by the
    Commission in concidence.

    (2) Disclosure of notes or minutes of meetings to discuss or negotiate settlement agreements and of drafts of documents prepared during settlement negotiations, where the firm has a reasonable expectation
    that such written materials will be maintained by the Commission in confidence.

    (3) Disclosure of the work-product of attorneys employed by a firm and information subject to an attorney/client privilege, if the Commission has obtained the information from the client or the attorney,
    the attorney or client advises the Commission of the confidential nature of the information at the time it is submitted to the Commission, and the information has been maintained in confidence by the
    client and the attorney.

    (4) Disclosure of a firm''s comments (or a portion thereof) submitted under section 6(b)(1) over the firm''s objection.'
