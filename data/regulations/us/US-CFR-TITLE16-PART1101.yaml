    Subpart B—Information Subject to Notice and Analysis Provisions of Section 6(b)(1)'
- id: art-9
  title: § 1101.11
  text: '§ 1101.11

    General application of provisions of section 6(b)(1).

    (a)

    Information subject to section 6(b)(1).

    To be subject to the notice and analysis provisions of section 6(b)(1), information must meet all the following criteria:

    (1) The information must pertain to a specific product which is either designated or described in a manner which permits its identity to be ascertained readily by the public.

    (2) The information must be obtained, generated or received by the Commission as an entity or by individual members, employees, agents, contractors or representatives of the Commission acting in their
    official capacities.

    (3) The Commission or its members, employees, agents or representatives must propose to disclose the information to the public (see § 1101.12).

    (4) The manner in which the product is designated or described in the information must permit the public to ascertain readily the identity of the manufacturer or private labeler. [See § 1101.13.]

    (b)

    Information not subject to section 6(b)(1).

    The requirements of section 6(b)(1) do not apply to:

    (1) Information described in the exclusions contained in section 6(b)(4) of the CPSA (see subpart E of this rule).

    (2) Information the Commission is required by law to make publicly available. This information includes, for example, Commission notifications to foreign governments regarding certain products to be
    exported, as required by section 18(b) of the CPSA, 15 U.S.C. 2068(b); section 14(d) of the FHSA, 15 U.S.C. 1273(d); and section 15(c) of the FFA, 15 U.S.C. 1202(c). (See the Commission''s Export Policy
    Statement, 16 CFR part 1017.)

    (3) Information required to be disclosed to the President and Congress pursuant to section 27(j) of the CPSA, 15 U.S.C. 2076(j).

    (4) Press releases issued by firms.

    (5) Information filed or presented in administrative proceedings or litigation to which the Commission is a party and which is not expressly subject to the section 6(b)(4) exceptions.'
- id: art-10
  title: § 1101.12
  text: '§ 1101.12

    Commission must disclose information to the public.

    Public.

    For the purposes of section 6(b)(1), the public includes any person except:

    (a) Members, employees, agents, representatives and contractors of the Commission, in their official capacity.

    (b) State officials who are commissioned officers under section 29(a)(2) of the CPSA, 15 U.S.C. 2078(a)(2), to the extent that the Commission furnishes them information necessary for them to perform
    their duties under that section. Such officials may not release to the public copies of such information unless the Commission has complied with section 6(b) or the information falls within an exception
    to section 6(b).

    (c) Members of a Commission Chronic Hazard Advisory Panel established under section 28 of the CPSA (15 U.S.C. 2077). However, disclosures of information by such a Panel are subject to section 6(b).

    (d) The persons or firms to whom the information to be disclosed pertains, or their legal representatives.

    (e) The persons or firms who provided the information to the Commission, or their legal representatives.

    (f) Other Federal agencies or state or local governments to whom accident and investigation reports are provided pursuant to section 29(e) of the CPSA (15 U.S.C. 2078(e)). However, as required by that
    section, employees of Federal agencies or state or local governments may not release to the public copies of any accident or investigation report made under the CPSA by an officer, employee or agent
    of the Commission unless CPSC has complied with the applicable requirements of section 6(b).

    (g) The Chairman or ranking minority member of a committee or subcommittee of Congress acting pursuant to committee business and having jurisdiction over the matter which is the subject of the information
    requested.

    (h) Any federal, state, local, or foreign government agency pursuant to, and in accordance with, section 29(f) of the Consumer Product Safety Improvement Act of 2008 (Pub. L. 110-314, 122 Stat. 3016
    (August 14, 2008)).

    [48 FR 57430, Dec. 29, 1983, as amended at 73 FR 72335, Nov. 28, 2008]'
- id: art-11
  title: § 1101.13
  text: '§ 1101.13

    Public ability to ascertain readily identity of manufacturer or private labeler.

    The advance notice and analysis provisions of section 6(b)(1) apply only when a reasonable person receiving the information in the form in which it is to be disclosed and lacking specialized expertise
    can readily ascertain from the information itself the identity of the manufacturer or private labeler of a particular product. The Commission will provide the advance notice and opportunity to comment
    if there is a question whether the public could readily ascertain the identity of a manufacturer or private labeler.

    Subpart C—Procedure for Providing Notice and Opportunity To Comment Under Section 6(b)(1)'
- id: art-12
  title: § 1101.21
  text: '§ 1101.21

    Form of notice and opportunity to comment.

    (a)

    Notice may be oral or written.

    The Commission will generally provide to manufacturers or private labelers written notice and opportunity to comment on information subject to section 6(b)(1). However, when the Commission publishes
    a finding that the public health and safety requires a lesser period of notice pursuant to section 6(b)(1) of the CPSA, the Commission may determine that it is necessary to provide the notice and opportunity
    to comment orally, either in person or by telephone.

    (b)

    Content of notice.

    The Commission will provide the manufacturer or private labeler with:

    (1) Either the actual text of the information to be disclosed or, if appropriate, a summary of the information.

    (2) A general description of the manner in which the Commission will disclose the information, including any other relevant information the Commission intends to include with the disclosure. If the
    Commission advises that the form of disclosure will be by press release, for example, the Commission need not provide further notice to disclose a summary of the press release.

    (3) A request for comment with respect to the information, including a request for explanatory data or other relevant information for the Commission''s consideration.

    (4) A statement that, in the absence of a specific request by a firm that its comments be withheld from disclosure, the Commission will release to the public the firm''s comments (or a summary thereof
    prepared by the firm or, if the firm declines to do so, by the Commission).

    (5) A statement that a request that comments be withheld from disclosure will be honored.

    (6) Notice that the firm may request confidential treatment for the information, in accordance with section 6(a)(3) of the Consumer Product Safety Act, 15 U.S.C. 2055(a)(3) (

    see'
- id: art-13
  title: § 1101.24(b)).
  text: '§ 1101.24(b)).

    (7) A statement that no further request for comment will be sought by the Commission if it intends to disclose the identical information in the same format, unless the firm specifically requests the
    opportunity to comment on subsequent information disclosures.

    (8) The name, address, and telephone number of the person to whom comments should be sent and the time when any comments are due (

    see'
