  text: '§ 182.99

    Adjuvants for pesticide chemicals.

    Adjuvants, identified and used in accordance with 40 CFR 180.910 and 40 CFR 180.920, which are added to pesticide use dilutions by a grower or applicator prior to application to the raw agricultural
