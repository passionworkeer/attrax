    CONSUMER PRODUCT SAFETY COMMISSION

    CONSUMER PRODUCT SAFETY ACT REGULATIONS

    Pt. 1307

    PART 1307—PROHIBITION OF CHILDREN''S TOYS AND CHILD CARE ARTICLES CONTAINING SPECIFIED PHTHALATES

    Sec.

    1307.1

    Scope and application.

    1307.2

    Definitions.

    1307.3

    Prohibition on children''s toys and child care articles containing specified phthalates.

    Authority:

    Sec. 108, Pub. L. 110-314, 122 Stat. 3016 (August 14, 2008); Pub. L. 112-28, 125 Stat. 273 (August 12, 2011).

    Source:

    82 FR 49982, Oct. 27, 2017, unless otherwise noted.'
- id: art-2
  title: § 1307.1
  text: '§ 1307.1

    Scope and application.

    This part prohibits the manufacture for sale, offer for sale, distribution in commerce or importation into the United States of any children''s toy or child care article containing any of the phthalates
    specified in § 1307.3.'
- id: art-3
  title: § 1307.2
  text: '§ 1307.2

    Definitions.

    The definitions of the Consumer Product Safety Act (CPSA) (15 U.S.C. 2052(a)) and the Consumer Product Safety Improvement Act of 2008 (CPSIA) (Pub. L. 110-314, sec. 108(g)) apply to this part. Specifically,
    as defined in the CPSIA:

    (a)

    Children''s toy

    means a consumer product designed or intended by the manufacturer for a child 12 years of age or younger for use by the child when the child plays.

    (b)

    Child care article

    means a consumer product designed or intended by the manufacturer to facilitate sleep or the feeding of children age 3 and younger, or to help such children with sucking or teething.'
- id: art-4
  title: § 1307.3
  text: '§ 1307.3

    Prohibition of children''s toys and child care articles containing specified phthalates.

    (a) As provided in section 108(a) of the CPSIA, the manufacture for sale,

    offer for sale, distribution in commerce, or importation into the United States of any children''s toy or child care article that contains concentrations of more than 0.1 percent of di-(2-ethylhexyl)
    phthalate (DEHP) , dibutyl phthalate (DBP), or benzyl butyl phthalate (BBP) is prohibited.

    (b) In accordance with section 108(b)(3) of the CPSIA, the manufacture for sale, offer for sale, distribution in commerce, or importation into the United States of any children''s toy or child care
    article that contains concentrations of more than 0.1 percent of diisononyl phthalate (DINP), diisobutyl phthalate (DIBP), di-

    n

    -pentyl phthalate (DPENP), di-

    n

    -hexyl phthalate (DHEXP), or dicyclohexyl phthalate (DCHP) is prohibited.

    (c) In accordance with section 108(c) of the CPSIA, the restrictions stated in paragraphs (a) and (b) of this section apply to any plasticized component part of a children''s toy or child care article
    or any other component part of a children''s toy or child care article that is made of other materials that may contain phthalates.

    [82 FR 49982, Oct. 27, 2017, as amended at 83 FR 34764, July 23, 2018]'
