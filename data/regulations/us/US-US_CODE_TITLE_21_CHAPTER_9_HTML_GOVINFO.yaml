  title: §321. Definitions; generally
  text: '§321. Definitions; generally


    For the purposes of this chapter—


    (a)(1) The term "State", except as used in the last sentence of section 372(a) of this title, means any State or Territory of the United States, the District of Columbia, and the Commonwealth of Puerto
    Rico.


    (2) The term "Territory" means any Territory or possession of the United States, including the District of Columbia, and excluding the Commonwealth of Puerto Rico and the Canal Zone.


    (b) The term "interstate commerce" means (1) commerce between any State or Territory and any place outside thereof, and (2) commerce within the District of Columbia or within any other Territory not
    organized with a legislative body.


    (c) The term "Department" means Department of Health and Human Services.


    (d) The term "Secretary" means the Secretary of Health and Human Services.


    (e) The term "person" includes individual, partnership, corporation, and association.


    (f) The term "food" means (1) articles used for food or drink for man or other animals, (2) chewing gum, and (3) articles used for components of any such article.


    (g)(1) The term "drug" means (A) articles recognized in the official United States Pharmacopoeia,

    1

    official Homoeopathic Pharmacopoeia of the United States, or official National Formulary, or any supplement to any of them; and (B) articles intended for use in the diagnosis, cure, mitigation, treatment,
    or prevention of disease in man or other animals; and (C) articles (other than food) intended to affect the structure or any function of the body of man or other animals; and (D) articles intended for
    use as a component of any article specified in clause (A), (B), or (C). A food or dietary supplement for which a claim, subject to sections 343(r)(1)(B) and 343(r)(3) of this title or sections 343(r)(1)(B)
    and 343(r)(5)(D) of this title, is made in accordance with the requirements of section 343(r) of this title is not a drug solely because the label or the labeling contains such a claim. A food, dietary
    ingredient, or dietary supplement for which a truthful and not misleading statement is made in accordance with section 343(r)(6) of this title is not a drug under clause (C) solely because the label
    or the labeling contains such a statement.


    (2) The term "counterfeit drug" means a drug which, or the container or labeling of which, without authorization, bears the trademark, trade name, or other identifying mark, imprint, or device, or any
    likeness thereof, of a drug manufacturer, processor, packer, or distributor other than the person or persons who in fact manufactured, processed, packed, or distributed such drug and which thereby falsely
    purports or is represented to be the product of, or to have been packed or distributed by, such other drug manufacturer, processor, packer, or distributor.


    (h)(1) The term "device" (except when used in paragraph (n) of this section and in sections 331(i), 343(f), 352(c), and 362(c) of this title) means an instrument, apparatus, implement, machine, contrivance,
    implant, in vitro reagent, or other similar or related article, including any component, part, or accessory, which is—


    (A) recognized in the official National Formulary, or the United States Pharmacopeia, or any supplement to them,


    (B) intended for use in the diagnosis of disease or other conditions, or in the cure, mitigation, treatment, or prevention of disease, in man or other animals, or


    (C) intended to affect the structure or any function of the body of man or other animals, and


    which does not achieve its primary intended purposes through chemical action within or on the body of man or other animals and which is not dependent upon being metabolized for the achievement of its
    primary intended purposes. The term "device" does not include software functions excluded pursuant to section 360j(o) of this title.


    (2) The term "counterfeit device" means a device which, or the container, packaging, or labeling of which, without authorization, bears a trademark, trade name, or other identifying mark or imprint,
    or any likeness thereof, or is manufactured using a design, of a device manufacturer, processor, packer, or distributor other than the person or persons who in fact manufactured, processed, packed,
    or distributed such device and which thereby falsely purports or is represented to be the product of, or to have been packed or distributed by, such other device manufacturer, processor, packer, or
    distributor.


    (i) The term "cosmetic" means (1) articles intended to be rubbed, poured, sprinkled, or sprayed on, introduced into, or otherwise applied to the human body or any part thereof for cleansing, beautifying,
    promoting attractiveness, or altering the appearance, and

    (2) articles intended for use as a component of any such articles; except that such term shall not include soap.


    (j) The term "official compendium" means the official United States Pharmacopoeia, official Homoeopathic Pharmacopoeia of the United States, official National Formulary, or any supplement to any of
    them.


    (k) The term "label" means a display of written, printed, or graphic matter upon the immediate container of any article; and a requirement made by or under authority of this chapter that any word, statement,
    or other information appear on the label shall not be considered to be complied with unless such word, statement, or other information also appears on the outside container or wrapper, if any there
    be, of the retail package of such article, or is easily legible through the outside container or wrapper.


    (l) The term "immediate container" does not include package liners.


    (m) The term "labeling" means all labels and other written, printed, or graphic matter (1) upon any article or any of its containers or wrappers, or (2) accompanying such article.


    (n) If an article is alleged to be misbranded because the labeling or advertising is misleading, then in determining whether the labeling or advertising is misleading there shall be taken into account
    (among other things) not only representations made or suggested by statement, word, design, device, or any combination thereof, but also the extent to which the labeling or advertising fails to reveal
    facts material in the light of such representations or material with respect to consequences which may result from the use of the article to which the labeling or advertising relates under the conditions
    of use prescribed in the labeling or advertising thereof or under such conditions of use as are customary or usual.


    (o) The representation of a drug, in its labeling, as an antiseptic shall be considered to be a representation that it is a germicide, except in the case of a drug purporting to be, or represented as,
    an antiseptic for inhibitory use as a wet dressing, ointment, dusting powder, or such other use as involves prolonged contact with the body.


    (p) The term "new drug" means—


    (1) Any drug (except a new animal drug or an animal feed bearing or containing a new animal drug) the composition of which is such that such drug is not generally recognized, among experts qualified
    by scientific training and experience to evaluate the safety and effectiveness of drugs, as safe and effective for use under the conditions prescribed, recommended, or suggested in the labeling thereof,
    except that such a drug not so recognized shall not be deemed to be a "new drug" if at any time prior to June 25, 1938, it was subject to the Food and Drugs Act of June 30, 1906, as amended, and if
    at such time its labeling contained the same representations concerning the conditions of its use; or


