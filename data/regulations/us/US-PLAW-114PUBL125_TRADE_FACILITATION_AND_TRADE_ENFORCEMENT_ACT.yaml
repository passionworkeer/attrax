    Deadlines. (a) IN GENERAL.—Not later than one year after the date of

    the enactment of this Act, and every 2 years thereafter, the Commis-

    sioner and the Director of U.S. Immigration and Customs Enforce-

    ment shall jointly develop and submit to the appropriate congres-

    sional committees a joint strategic plan.

    (b) CONTENTS.—The joint strategic plan required under this

    section shall be comprised of a comprehensive multiyear plan for

    trade enforcement and trade facilitation, and shall include—

    Summary. (1) a summary of actions taken during the 2-year period

    Time period. preceding the submission of the plan to improve trade enforce-

    ment and trade facilitation, including a description and analysis

    of specific performance measures to evaluate the progress of

    U.S. Customs and Border Protection and U.S. Immigration

    and Customs Enforcement in meeting each such responsibility;

    (2) a statement of objectives and plans for further

    improving trade enforcement and trade facilitation;

    (3) a specific identification of the priority trade issues

    described in section 117 that can be addressed in order to

    enhance trade enforcement and trade facilitation, and a descrip-

    tion of strategies and plans for addressing each such issue,

    including—

