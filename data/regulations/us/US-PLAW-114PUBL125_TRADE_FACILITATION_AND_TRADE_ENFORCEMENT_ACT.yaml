    (A) Collection of countervailing duties assessed under

    subtitle A of title VII of the Tariff Act of 1930 (19 U.S.C.

    1671 et seq.) and antidumping duties assessed under sub-

    title B of title VII of the Tariff Act of 1930 (19 U.S.C.

    1673 et seq.).

    (B) Addressing evasion of duties on imports of textiles.

    (C) Protection of intellectual property rights.

    (D) Enforcement of child labor laws.

    (3) APPROVAL OF COMMISSIONER AND DIRECTOR.—The

    instruction and related instructional materials at each edu-

    cational seminar carried out under this section shall be subject

    to the approval of the Commissioner and the Director.

    (c) SELECTIONPROCESS.—

    (1) IN GENERAL.—The Commissioner shall establish a

    process to solicit, evaluate, and select interested parties in

    the private sector for purposes of assisting in providing instruc-

    tion and related instructional materials described in subsection

    (b) at each educational seminar carried out under this section.

    (2) CRITERIA.—The Commissioner shall evaluate and select Evaluation.

    interested parties in the private sector under the process estab-

    lished under paragraph (1) based on—

    (A) availability and usefulness;

    (B) the volume, value, and incidence of mislabeling

    or misidentification of origin of imported articles; and

    (C) other appropriate criteria established by the

    Commissioner.

    (3) PUBLIC AVAILABILITY.—The Commissioner and the Federal Register,

    Director shall publish in the Federal Register a detailed descrip- publication.

    tion of the process established under paragraph (1) and the

    criteria established under paragraph (2).

    (d) SPECIAL RULE FOR ANTIDUMPING AND COUNTERVAILING

    DUTYORDERS.—

    (1) IN GENERAL.—The Commissioner shall give due consid-

    eration to carrying out an educational seminar under this sec-

    tion in whole or in part to improve the ability of personnel

    of U.S. Customs and Border Protection to enforce a counter-

    vailing or antidumping duty order issued under section 706

    or 736 of the Tariff Act of 1930 (19 U.S.C. 1671e or 1673e)

    upon the request of a petitioner in an action underlying such

    countervailing or antidumping duty order.

    (2) INTERESTED PARTY.—A petitioner described in para-

    graph (1) shall be treated as an interested party in the private

    sector for purposes of the requirements of this section.

    (e) PERFORMANCE STANDARDS.—The Commissioner and the

    Director shall establish performance standards to measure the

