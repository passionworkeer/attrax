- id: art-9
  title: § 145.0
  text: '§ 145.0

    Scope.

    (a) The provisions of this part apply only to mail subject to Customs examination as set forth in § 145.2. This part contains regulations pertaining specifically to the importation of merchandise through
    the mail but does not contain all the regulations applicable to mail importations. Importations by mail are subject to the same requirements and restrictions as importations by any other means, except
    where more specific procedures for mail importations are set forth in this part. The fee applicable to each item of dutiable mail (other than Inbound Express Mail Service (EMS) items) for which Customs
    prepares documentation, and the fee applicable to all EMS items, is set forth in § 24.22 of this chapter.

    (b) This part also contains regulations requiring the United States Postal Service (USPS) to transmit certain advance electronic data (AED) to U.S. Customs and Border Protection (CBP) for certain inbound
    international mail shipments as set forth in subpart G of this part.

    [86 FR 14278, Mar. 15, 2021]

    Subpart A—General Provisions'
- id: art-10
  title: § 145.1
  text: '§ 145.1

    Definitions.

    (a)

    Mail article.

    “Mail article” means any posted parcel, packet, package, envelope, letter, aerogramme, box, card, or similar article or container, or any contents thereof, which is transmitted in mail subject to customs
    examination.

    (b)

    Letter class mail.

    “Letter class mail” means any mail article, including packages, post cards, and aerogrammes, mailed at the letter rate or equivalent class or category of postage.

    (c)

    Sealed letter class mail.

    “Sealed letter class mail” means letter class mail sealed against postal inspection by the sender.

    [T.D. 78-102, 43 FR 14454, Apr. 6, 1978]'
- id: art-11
  title: § 145.2
  text: '§ 145.2

    Mail subject to Customs examination.

    (a)

    Restrictions.

    Customs examination of mail as provided in paragraph (b) of this section is subject to the restrictions and safeguards relating to the opening of letter class mail set forth in § 145.3.

    (b)

    Generally.

    All mail arriving from outside the Customs territory of the United States which is to be delivered within the Customs territory of the United States and all mail arriving from outside the U.S. Virgin
    Islands which is to be delivered within the U.S. Virgin Islands, is subject to Customs examination, except:

    (1) Mail known or believed to contain only official documents addressed to officials of the U.S. Government;

    (2) Mail addressed to Ambassadors and Ministers (Chiefs of Diplomatic Missions) of foreign countries; and

    (3) Letter class mail known or believed to contain only correspondence or documents addressed to diplomatic missions, consular posts, or the officers thereof, or to international organizations designated
    by the President as public international organizations pursuant to the International Organizations Act (see § 148.87(b) of this chapter). Mail, other than letter class mail, addressed to the designated
    international organizations is subject to Customs examination except where the organization certifies under its official seal that the mail contains no dutiable or prohibited articles. Any Customs examination
    made shall, upon request of the addressee international organization, take place in the presence of an appropriate representative of that organization.

    [T.D. 78-102, 43 FR 14454, Apr. 6, 1978]'
- id: art-12
  title: § 145.3
  text: '§ 145.3

    Opening of letter class mail; reading of correspondence prohibited.

    (a)

    Matter in addition to correspondence.

    Except as provided in paragraph (e), Customs officers and employees may open and examine sealed letter class mail subject to Customs examination which appears to contain matter in addition to, or other
    than, correspondence, provided they have reasonable cause to suspect the presence of merchandise or contraband.

    (b)

    Only correspondence.

    No Customs officer or employee shall open sealed letter class mail which appears to contain only correspondence unless prior to the opening:

    (1) A search warrant authorizing that action has been obtained from an appropriate judge of United States magistrate, or

    (2) The sender or the addressee has given written authorization for the opening.

    (c)

    Reading of correspondence.

    No Customs officer or employee shall read, or authorize or allow any other person to read, any correspondence contained in any letter class mail, whether or not sealed, unless prior to the reading:

    (1) A search warrant authorizing that action has been obtained from an appropriate judge or United States magistrate, or

    (2) The sender or the addressee has given written authorization for the reading.

    (d)

    Other types of correspondence.

    The provisions of paragraph (c) shall also apply to correspondence between school children and correspondence of the blind which are authorized to be mailed at other than the letter rate of postage
    in international mail.

    (e)

    Certain Virgin Islands mail.

    First class mail originating in the Customs territory of the United States and arriving in the U.S. Virgin Islands, which is to be delivered within the U.S. Virgin Islands, shall not be opened unless:

    (1) A search warrant authorizing that action has been obtained from an appropriate judge or United States magistrate, or

    (2) The sender or the addressee has been given written authorization for the opening.

    [T.D. 78-102, 43 FR 14454, Apr. 6, 1978]'
- id: art-13
  title: § 145.4
  text: '§ 145.4

    Dutiable merchandise without declaration or invoice, prohibited merchandise, and merchandise imported contrary to law.

    (a)

    Subject to seizure and forfeiture.

    When, upon CBP examination, a mail article is found to contain merchandise subject to duty or tax, and the mail article is not accompanied by an appropriate customs declaration and invoice or statement
    of value required by § 145.11, or is found to contain material prohibited importation or imported contrary to law, the merchandise is subject to seizure and forfeiture.

    (b)

    Mitigation of forfeiture.

    Any claimant incurring a forfeiture of merchandise for violation of this section may file a petition for relief pursuant to part 171 of this chapter. Mitigation of that forfeiture may occur consistent
    with mitigation guidelines.

    (c)

    Collection of mitigated forfeiture.

    When the shipment does not exceed $2,500 in value, CBP Form 3419 or 3419A or CBP Form 368 or 368A (serially numbered) or CBP Form 7501, or its electronic equivalent, must be used for the entry of the
    merchandise, and the duty, any tax, and the amount of the mitigated forfeiture must be entered as separate items thereon. If a mail article for which a mail fine entry has been issued in accordance
    with this paragraph is undeliverable, it will be returned to the director of the port where the entry was issued, for disposition in accordance with § 145.59 relating to articles subject to seizure.

    (d)

    Petition for relief.

    The addressee or sender may file a petition with the Fines, Penalties, and Forfeitures Officer having jurisdiction over the port where the mail fine entry was issued in accordance with part 171 of this
    chapter for relief from the forfeiture incurred and for release of the seized merchandise, or for additional relief from a mitigated forfeiture.

    [T.D. 73-135, 38 FR 13369, May 21, 1973]

    Editorial Note:

    For

    Federal Register

    citations affecting § 145.4, see the List of CFR Sections Affected, which appears in the Finding Aids section of the printed volume and at

    www.govinfo.gov.'
- id: art-14
  title: § 145.5
  text: '§ 145.5

    Undeliverable packages.

    Mail articles which are refused or undeliverable, except mail articles for which a mail fine entry has been issued in accordance with § 145.4(c), will be marked by the postmaster to show why delivery
    was not made, and will be forwarded to the proper exchange post office for return to the country of origin. Mail entries will be removed from the mail articles and returned to Customs for cancellation.
    If, for any reason, an undeliverable mail article known or supposed to be dutiable is not returned to the country of origin or forwarded to another country in accordance with the Postal regulations,
    it will be delivered to Customs for disposition under

    the Customs laws and regulations governing seized or unclaimed merchandise.

    Subpart B—Requirements and Procedures'
- id: art-15
  title: § 145.11
  text: '§ 145.11

    Declarations of value and invoices.

    (a)

    Customs declaration.

    A clear and complete Customs declaration on the form provided by the foreign post office, giving a full and accurate description of the contents and value of the merchandise, shall be securely attached
    to at least one mail article of each shipment, including shipments of special classes of merchandise treated in subpart D of this part. Although a Customs declaration is required to be attached to only
    one mail article of each shipment, examination and release of the merchandise will be expedited if such a declaration is attached to each individual mail article.

    (b)

    Invoice or statement of commercial value.

    Each shipment of merchandise shall have an invoice or bill of sale (or, in the case of merchandise not purchased or consigned for sale, a statement of the fair retail value in the country of shipment),
    giving an accurate description and the purchase price of the merchandise, securely attached to the outside of the mail article or enclosed therein. If the shipment consists of more than one mail article,
    a copy of the invoice should accompany each mail article, or else the invoice shall accompany the mail article bearing the declaration, and that mail article shall be marked “Invoice enclosed.”

    (c) [Reserved]

    (d)

    Shipments without declaration and invoice.

    Shipment of merchandise which are not accompanied by a Customs declaration and invoice in accordance with paragraphs (a) through (b) of this section may be subject to seizure and forfeiture in accordance
    with § 145.4.

    [T.D. 73-135, 38 FR 13369, May 21, 1973, as amended by T.D. 76-103, 41 FR 14731, Apr. 7, 1976; T.D. 78-102, 43 FR 14454, Apr. 6, 1978; T.D. 85-39, 50 FR 9612, Mar. 11, 1985]'
- id: art-16
  title: § 145.12
  text: '§ 145.12

    Entry of merchandise.

    (a)

    Formal entries

    —(1)

    Discretionary.

    CBP may require formal entry of any mail shipment regardless of value if it is necessary to protect the revenue.

    (2)

    Required.

    Formal entry at the customhouse will be required for every importation in the mails which exceeds $2,500 in value, except for special classes of merchandise which can be released without entry (see
    subpart D of this part), and except as provided in subparts B and C of part 143 and § 10.1 of this chapter.

    (3)

    Separate shipments.

    Separate shipments not exceeding $2,500 in value, if mailed abroad at different times (as shown by the declaration or other mailing indicia), cannot be combined for the purpose of requiring formal entry,
    even though they reach CBP at the same time and are covered by a single order or contract in excess of $2,500, unless there was a splitting of shipments in order to avoid the payment of customs duty.

    (4)

    Notice of formal entry requirement.

    When a formal entry is required, the addressee will be notified of the arrival of the shipment and of the place at which entry is to be made. If the shipment is addressed to a point which is not a CBP
    port or customs station, the port of entry specified in the notice will be the port nearest the destination of the shipment. When a formal entry is filed, it must contain all the statistical information
    as provided in § 141.61(e) of this chapter.

    (b)

    Mail and informal entries

    —(1)

    Preparation of entry form.

    Except as provided in paragraphs (c) and (e) of this section, CBP officers will prepare and attach a mail entry (CBP Form 3419 or 3419A) for each shipment not exceeding $2,500 in value which is to be
    delivered by the Postal Service, and return the shipment to the Postal Service for delivery and collection of duty. If the addressee has arranged to pick up such a shipment at the CBP office where it
    is being processed, the CBP officer will prepare an informal entry (CBP Form 368 or 368A (serially numbered), or an entry summary, CBP Form 7501, or its electronic equivalent and collect the duty in
    accordance with subpart C of part 143 of this chapter.

    (2)

    Rates of duty.

    Merchandise released under a mail or informal entry will be dutiable at the rates of duty in effect when the preparation of the

    entry is completed by a CBP employee, ready for transmittal with the merchandise to the addressee.

    (c)

    Dutiable shipments not over $2,500 for Government agencies.

    When a dutiable shipment not exceeding $2,500 in value is addressed to a U.S. Government department or agency, the port director may release the merchandise prior to the payment of duties under an entry
    on CBP Form 368 or 368A (serially numbered) or CBP Form 7501, or its electronic equivalent upon the receipt of a stipulation in the form set forth in § 141.102(d) of this chapter. If the stipulation
    does not accompany the shipment, the port director will notify the Government department or agency of the arrival of the shipment and request the stipulation. Upon receipt of the completed stipulation
    and preparation of the entry form, the port director will stamp all mail articles in the shipment to show that they have received customs treatment and will return the shipment to the Postal Service
    for delivery, unless the addressee has arranged to pick up the shipment at the CBP office where it is being processed. The proper Government department or agency will be billed later for any duties
    and taxes due.

    (d)

    Release without entry.

    Certain types of merchandise may be passed free of duty without issuing an entry (see subpart D of this part).

    (e)

    Unaccompanied shipments

    —(1)

    Mail entry to be attached.

    If the requirements of § 148.115(a) of this chapter are met, CBP officers will prepare and attach a mail entry, CBP Form 3419 or 3419A, for each shipment for which entry is claimed under subheading
    9816.00.40, Harmonized Tariff Schedule of the United States (19 U.S.C. 1202), which is to be delivered by the Postal Service, and return the shipment to the Postal Service for delivery and collection
    of duty. If the addressee has arranged to pick up the shipment at the CBP office where it is being processed, the CBP officer will prepare an informal entry, CBP Form 368 or 368A (serially numbered),
    or entry summary, CBP Form 7501, or its electronic equivalent and collect the duty in accordance with subpart C of part 143 of this chapter if the requirements of § 148.115(a) of this chapter are met.

    (2)

    Disposition of CBP Form 255.

    The Declaration of Unaccompanied Articles, CBP Form 255, affixed to the shipment must be removed by the CBP officer and retained for customs purposes. If a mail entry, CBP Form 3419 or 3419A, has been
    prepared, the mail entry number will be noted on the CBP Form 255.

    [T.D. 73-135, 38 FR 13369, May 21, 1973]

