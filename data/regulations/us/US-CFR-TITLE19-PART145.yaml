- id: art-17
  title: § 145.13
  text: '§ 145.13

    Internal revenue tax on mail entries.

    (a)

    Method of collection.

    Any internal revenue tax assessed on a mail entry shall be shown as a separate item on the entry, and collected in the same manner as Customs duties.

    (b)

    Release without payment of tax.

    A mail entry may not be used to release a shipment of cigars, cigarettes, or cigarette papers or tubes for a manufacturer without payment of tax as provided for in 27 CFR part 275 and § 11.2a of this
    chapter. If a claim for release without payment of tax is made by the addressee at the time of delivery, the shipment will be returned by the Postal Service to the port of entry or sent to the nearest
    Customs office at which appropriate release as claimed may be arranged by the addressee.

    [T.D. 73-135, 38 FR 13369, May 21, 1973, as amended by T.D. 78-329, 43 FR 43455, Sept. 26, 1978]'
- id: art-18
  title: § 145.14
  text: '§ 145.14

    Marking requirements.

    (a)

    Country of origin.

    Merchandise imported by mail shall be marked with the country of origin in accordance with part 134 of this chapter. If merchandise without the required marking is to be delivered from the post office
    where it has been given Customs examination, the Customs officer shall require compliance with the marking law and regulations. If it is to be delivered from another post office, the Customs officer
    shall place in the envelope containing the mail entry a copy of Customs Form 3475, containing instructions to the postmaster concerning the marking to be required before delivery.

    (b)

    Other marking requirements.

    Certain types of merchandise are subject to special marking requirements, such as those contained in the Textile Fiber Products Identification Act, the Wool Products Labeling Act, and the Trademark
    Act. Since there is no provision for post office supervision of these types of marking, the CBP shall require compliance with the law and regulations (see parts 11 and 133 of this chapter).

    (c)

    Failure to mark.

    If the addressee fails to comply with the marking requirements, the mail article will be treated as undeliverable in accordance with § 145.5.

    [T.D. 73-135, 38 FR 13369, May 21, 1973, as amended by T.D. 78-102, 43 FR 14454, Apr. 6, 1978; CBP Dec. No. 16-26, 81 FR 93020, Dec. 20, 2016]

    Subpart C—Administrative Review of Mail Entries'
- id: art-19
  title: § 145.21
  text: '§ 145.21

    Administrative review.

    Requests for adjustment of the amount of duty assessed under mail entries shall be handled as requests for administrative review in accordance with this subpart.'
- id: art-20
  title: § 145.22
  text: '§ 145.22

    Procedures for obtaining administrative review.

    If an addressee is dissatisfied with the amount of duty assessed under a mail entry made before December 18, 2004, he may obtain administrative review in the following ways:

    (a) He may pay the assessed duty, take delivery of the merchandise, and send a copy of the mail entry to the issuing CBP office indicated on the mail entry, together with a statement of the reason it
    is believed the duty assessed is incorrect. Any invoices, bills of sale, or other evidence should be submitted with the statement. The addressee may show the mail entry number and date on his statement
    instead of sending a copy of the mail entry, but this may result in delay.

    (b) He may postpone acceptance of the shipment, and within the time allowed by the Postal regulations provide the postmaster with a written statement of his objections. The postmaster will forward the
    mail entry together with the addressee''s statement and any invoices, bills of sale, or other evidence submitted by the addressee to the port director who issued the entry, and retain custody of the
    shipment until advice is received from the port director as to the disposition to be made. If the addressee is located near one of the ports at which CBP officers are authorized to review mail entries
    (see 39 CFR 10.5), the postmaster may send the mail entry to that port, together with the addressee''s statement and evidence, for reconsideration by the port director.

    (c) He may pay the assessed duty and take delivery of the merchandise, and file a protest under section 514, Tariff Act of 1930, as amended (19 U.S.C. 1514), in the form and manner prescribed in part
    174 of this chapter. For mail entries made before December 18, 2004, a protest must be filed no later than 90 days after payment of the duties by the addressee. All other mail entries must be protested
    within 180 days after payment of the duties by the addressee.

    [T.D. 73-175, 38 FR 13369, May 21, 1973, as amended by T.D. 78-99, 43 FR 13061, Mar. 29, 1978; CBP Dec. 11-02, 76 FR 2575, Jan. 14, 2011]'
- id: art-21
  title: § 145.23
  text: '§ 145.23

    Time limits.

    A mail entry made before December 18, 2004 may be amended under section 520(c), Tariff Act of 1930, as amended (19 U.S.C. 1520(c)), only if the addressee requests such amendment within the time limits
    prescribed therein (see §§ 173.4 and 173.5 of this chapter), and the claim is allowable under section 520(c). Requests for adjustment in the amount of duty assessed under mail entries made under § 145.22(a)
    must be made in such time that the request can be acted upon by the port director within 90 days after receipt of the mail article and payment of the duties by the addressee. For a mail entry made before
    December 18, 2004, protests under § 145.22(c) of this chapter must be filed no later than 90 days after payment of the duties by the addressee, but may be acted upon by CBP after expiration of that
    90-day period. For a mail entry made on or after December 18, 2004, protests under § 145.22(c) of this chapter must be filed no later than 180 days after payment of the duties by the addressee, but
    may be acted upon by

    CBP after expiration of that 180-day period.

    [T.D. 73-135, 38 FR 13369, May 21, 1973, as amended by T.D. 78-102, 43 FR 14454, Apr. 6, 1978; CBP Dec. 11-02, 76 FR 2576, Jan. 14, 2011]'
- id: art-22
  title: § 145.24
  text: '§ 145.24

    Amendment of entry.

    If the port director is satisfied that the objection is valid and timely, he shall amend the mail entry. If the duty has already been paid, Customs shall issue an appropriate refund of duty.'
- id: art-23
  title: § 145.25
  text: '§ 145.25

    Entry correct.

    If the port director believes the duty originally assessed was correct, he shall send the addressee a notice in writing that the request for refund of duty has been denied. If the duty has not been
    paid, the mail entry shall be returned to the postmaster concerned, together with a copy of the notice sent to the addressee. The postmaster will then collect the duty and deliver the shipment, or,
    if the addressee refuses to pay the duty, will treat the shipment as undeliverable.'
- id: art-24
  title: § 145.26
  text: '§ 145.26

    Rates of duty not binding.

    Rates of duty assessed on a mail entry, whether assessed on the original entry or as amendments under § 145.24, are not binding for future importations. A binding ruling on tariff classification may
    be obtained in accordance with the procedures set forth in part 177 of this chapter.

    [T.D. 73-175, 38 FR 13369, May 21, 1973, as amended at 38 FR 17469, July 2, 1973; T.D. 78-99, 43 FR 13061, Mar. 29, 1978]

    Subpart D—Special Classes of Merchandise'
- id: art-25
  title: § 145.31
  text: '§ 145.31

    Importations not over $800 in value.

    The port director will pass free of duty and tax, without preparing an entry as provided for in § 145.12, packages containing merchandise having an aggregate fair retail value in the country of shipment
    of not over $800, subject to the requirements set forth in §§ 10.151 and 10.153 of this chapter.

    [T.D. 94-51, 59 FR 30296, June 13, 1994, as amended by CBP Dec. 12-19, 77 FR 72721, Dec. 6, 2012; CBP Dec. No. 16-13, 81 FR 58834, Aug. 26, 2016]'
- id: art-26
  title: § 145.32
  text: '§ 145.32

    Bona-fide gifts.

    The port director shall pass free of duty and tax, without preparing an entry as provided for in § 145.12, articles sent as bona-fide gifts from persons in foreign countries to persons in the United
    States having an aggregate fair retail value in the country of shipment not exceeding $100 ($200, in the case of articles sent from persons in the Virgin Islands, Guam, and American Samoa), subject
    to the requirements set forth in §§ 10.152 and 10.153 of this chapter.

    [T.D. 94-51, 59 FR 30296, June 13, 1994]'
- id: art-27
  title: § 145.34
  text: '§ 145.34

    Personal and household effects and tools of trade.

    (a)

    U.S. military and civilian personnel returning from extended duty abroad.'
- id: art-28
  title: Section 148.74 of this chapter sets forth specific requirements for exemptions from duty under subheading 9805.00.50, Harmonized Tariff Schedule of the United States (19 U.S.C. 1202), for personal
    and
  text: 'Section 148.74 of this chapter sets forth specific requirements for exemptions from duty under subheading 9805.00.50, Harmonized Tariff Schedule of the United States (19 U.S.C. 1202), for personal
    and household effects of military and civilian personnel of the United States returning upon the completion of extended duty abroad. A copy of the official travel orders shall be attached to or enclosed
    in each mail article and the outside of each mail article shall be clearly marked to show that exemption from duty is being claimed.

    (b)

    Other personal and household effects, and tools of trade.

    Certain personal and household effects and tools of trade may be passed free of duty without issuing an entry, in accordance with § 148.53 of this chapter.

    [T.D. 73-135, 38 FR 13369, May 21, 1973, as amended by T.D. 78-102, 43 FR 14454, Apr. 6, 1978; T.D. 89-1, 53 FR 51263, Dec. 21, 1988]'
- id: art-29
  title: § 145.35
  text: '§ 145.35

    United States products returned.

    Products of the United States returned after having been exported, which have not been advanced in value or improved in condition while abroad, may be passed free of duty without issuing an entry and
    without the declarations provided for in § 10.1(a) of this chapter, provided the shipment is valued at not over $2,500 and the port director is satisfied that the merchandise is free of duty under subheading

    9801.00.10, Harmonized Tariff Schedule of the United States (19 U.S.C. 1202).

    [T.D. 73-135, 38 FR 13369, May 21, 1973, as amended by T.D. 85-123, 50 FR 29955, July 23, 1985; T.D. 89-1, 53 FR 51263, Dec. 21, 1988; T.D. 89-82, 54 FR 36026, Aug. 31, 1989; T.D. 94-47, 59 FR 25570,
    May 17, 1994; T.D. 98-28, 63 FR 16417, Apr. 3, 1998; CBP Dec. 12-19, 77 FR 72721, Dec. 6, 2012]'
- id: art-30
  title: § 145.36
  text: '§ 145.36

    Articles for institutions.

    Books and other articles classifiable under subheading 4903.00.00, 4904.00.00, 4905.91.00, 4905.99.00, 9701.10.00, 9701.90.00, 9810.00.05, Harmonized Tariff Schedule of the United States (HTSUS) (19
    U.S.C. 1202), imported by and addressed directly to a library or other institution described in subheading 9810.00.05 or 9101.30, HTSUS may be passed free of duty without issuing an entry, if the port
    director is satisfied that the merchandise is entitled to free entry. A declaration may be required in accordance with § 10.43 of this chapter under the procedure specified in § 145.42.

    [T.D. 73-135, 38 FR 13369, May 21, 1973, as amended by T.D. 85-123, 50 FR 29955, July 23, 1985; T.D. 89-1, 53 FR 51263, Dec. 21, 1988]'
- id: art-31
  title: § 145.37
  text: '§ 145.37

    Articles for the U.S. Government.

    (a)

    Mail articles for copyright.

    Mail articles marked for copyright which are addressed to the Library of Congress, to the U.S. Copyright Office, or to the office of the Register of Copyrights, Washington, DC, shall be passed free
    of duty without issuing an entry.

    (b)

    Books, engravings, and other articles.

    Books, classifiable under subheading 4903.00.00, Harmonized Tariff Schedule of the United States (HTSUS) (19 U.S.C. 1202), and engravings, etchings, and other articles enumerated in subheading 9808.00.10,
    HTSUS, shall be passed free of duty without issuing an entry when they are addressed to the Library of Congress or any department or agency of the U.S. Government.

    (c)

    Official Government documents.

    Other mail articles addressed to offices or officials of the U.S. Government, believed to contain only official documents, shall be passed free of duty without issuing an entry. Such mail articles,
    when believed to contain merchandise, shall be treated in the same manner as other mail articles of merchandise so addressed.

    [T.D. 73-135, 38 FR 13369, May 21, 1973, as amended by T.D. 78-102, 43 FR 14454, Apr. 6, 1978; T.D. 89-1, 53 FR 51263, Dec. 21, 1988; T.D. 91-77, 56 FR 46115, Sept. 10, 1991]'
- id: art-32
  title: § 145.38
  text: '§ 145.38

    Diplomatic pouches.

    Mail articles bearing the official seal of a foreign government with which the United States has diplomatic relations, accompanied by certificates bearing such seal to the effect that they contain only
    official communications or documents, shall be admitted free of duty without Customs examination.

    [T.D. 73-135, 38 FR 13369, May 21, 1973, as amended by T.D. 78-102, 43 FR 14454, Apr. 6, 1978]'
- id: art-33
  title: § 145.39
  text: '§ 145.39

    Articles for diplomatic officers, representatives of international organizations, and foreign military personnel.

    Free entry of articles in mail articles addressed to diplomatic officers, representatives of certain international organizations, and similar persons is governed by subpart I of part 148 of this chapter.

    [T.D. 73-175, 38 FR 13369, May 21, 1973, as amended by T.D. 73-227, 38 FR 22548, Aug. 22, 1973; T.D. 78-102, 43 FR 14454, Apr. 6, 1978]'
- id: art-34
  title: § 145.40
  text: '§ 145.40

    Plant material imported for immediate exportation.

    Plant material may be imported by mail free of duty for immediate exportation by mail subject to the following regulations, which have been approved by the Department of Agriculture and the Postal Service.
    This procedure shall not affect the movement of plant material in the internal mails through the United States:

    (a)

    Permit for entry.

    Each shipment shall be dispatched in the mails from abroad, accompanied by a yellow and green special mail tag bearing the serial number of the permit for entry for immediate exportation or immediate
    transportation and exportation, issued by the U.S. Department of Agriculture, and also by the postal form of Customs declaration.

    (b)

    Place of inspection.

    Upon arrival, the shipment shall be detained by or redispatched to the postmaster at

    Washington, DC, Brownsville, Tex., Hoboken, NJ, Honolulu, Hawaii, Laredo, Tex., Miami, Fla., San Francisco, Calif., San Juan, P.R., San Pedro, Calif., or Seattle, Wash., as may be appropriate, according
