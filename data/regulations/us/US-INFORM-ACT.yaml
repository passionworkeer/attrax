    117TH CONGRESS S. 936

    1ST SESSION

    To require online marketplaces to collect, verify, and disclose certain informa-

    tion regarding high-volume third party sellers of consumer products to

    inform consumers.

    IN THE SENATE OF THE UNITED STATES

    MARCH 23, 2021

    Mr. DURBIN (for himself, Mr. CASSIDY, Mr. GRASSLEY, Ms. HIRONO, Mr.

    COONS, and Mr. TILLIS) introduced the following bill; which was read

    twice and referred to the Committee on Commerce, Science, and Trans-

    portation

    A BILL

    To require online marketplaces to collect, verify, and disclose

    certain information regarding high-volume third party

    sellers of consumer products to inform consumers.

    1 Be it enacted by the Senate and House of Representa-

    2 tives of the United States of America in Congress assembled,

    3

    SECTION 1. SHORT TITLE.

    4 This Act may be cited as the ‘‘Integrity, Notification,

    5 and Fairness in Online Retail Marketplaces for Con-

    6 sumers Act’’ or the ‘‘INFORM Consumers Act’’.

