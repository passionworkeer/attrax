  text: '§ 176.170

    Components of paper and paperboard in contact with aqueous and fatty foods.

    Substances identified in this section may be safely used as components of the uncoated or coated food-contact surface of paper and paperboard intended for use in producing, manufacturing, packaging,
    processing, preparing, treating, packing, transporting, or holding aqueous and fatty foods, subject to the provisions of this section. Components of paper and paperboard in contact with dry food of
    the type identified under Type VIII of table 1 in paragraph (c) of this section are subject to the provisions of § 176.180.

    (a) Substances identified in paragraph (a)(1) through (5) of this section may be used as components of the food-contact surface of paper and paperboard. Paper and paperboard products shall be exempted
    from compliance with the extractives limitations prescribed in paragraph (c) of this section:

    Provided,

    That the components of the food-contact surface consist entirely of one or more of the substances identified in this paragraph:

    And provided further,

    That if the paper or paperboard when extracted under the conditions prescribed in paragraph (c) of this section exceeds the limitations on extractives contained in paragraph (c) of this section, information
    shall be available from manufacturing records from which it is possible to determine that only substances identified in this paragraph (a) are present in the food-contact surface of such paper or paperboard.

    (1) Substances generally recognized as safe in food.

    (2) Substances generally recognized as safe for their intended use in paper and paperboard products used in food packaging.

    (3) Substances used in accordance with a prior sanction or approval.

    (4) Substances that by regulation in parts 170 through 189 of this chapter may be safely used without extractives limitations as components of the uncoated or coated food-contact surface of paper and
    paperboard in contact with aqueous or fatty food, subject to the provisions of such regulation.

    (5) Substances identified in this paragraph, as follows:

