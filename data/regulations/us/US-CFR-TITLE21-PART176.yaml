- id: art-2
  title: § 176.110
  text: '§ 176.110

    Acrylamide-acrylic acid resins.

    Acrylamide-acrylic acid resins may be safely used as components of articles intended for use in producing, manufacturing, packing, processing, preparing, treating, packaging, transporting, or holding
    food, subject to the provisions of this section.

    (a) Acrylamide-acrylic acid resins are produced by the polymerization of acrylamide with partial hydrolysis or by the copolymerization of acrylamide and acrylic acid.

    (b) The acrylamide-acrylic acid resins contain less than 0.2 percent residual monomer.

    (c) The resins are used as adjuvants in the manufacture of paper and paperboard in amounts not to exceed that necessary to accomplish the technical effect and not to exceed 2 percent by weight of the
    paper or paperboard.'
- id: art-3
  title: § 176.120
  text: '§ 176.120

    Alkyl ketene dimers.

    Alkyl ketene dimers may be safely used as a component of articles intended for use in producing, manufacturing, packing, processing, preparing, treating, packaging, transporting, or holding food, subject
    to the provisions of this section.

    (a) The alkyl ketene dimers are manufactured by the dehydrohalogenation of the acyl halides derived from the fatty acids of animal or vegetable fats and oils.

    (b) The alkyl ketene dimers are used as an adjuvant in the manufacture of paper and paperboard under such conditions that the alkyl ketene dimers and their hydrolysis products dialkyl ketones do not
    exceed 0.4 percent by weight of the paper or paperboard.

    (c) The alkyl ketene dimers may be used in the form of an aqueous emulsion which may contain sodium lignosulfonate as a dispersant.'
- id: art-4
  title: § 176.130
  text: '§ 176.130

    Anti-offset substances.

    Substances named in paragraphs (b) and (c) of this section may be safely

    used to prevent the transfer of inks employed in printing and decorating paper and paperboard used for food packaging in accordance with the provisions of this section:

    (a) The substances are applied to the nonfood contact, printed side of the paper or paperboard in an amount not greater than that required to accomplish the technical effect nor greater than any specific
    limitations, where such are provided.

    (b) Anti-offset powders are prepared from substances that are generally recognized as safe in food, substances for which prior sanctions or approvals were granted and which are used in accordance with
    the specific provisions of such sanction or approval, and substances named in paragraph (c) of this section.

    (c) The substances permitted are as follows:

    Substances

    Limitations

    Carbon tetrachloride

    Methyl hydrogen polysiloxanes

    Industrial starch—modified

    Complying with § 178.3520 of this chapter.

    Stannous oleate

    Zinc-2-ethyl hexoate'
