  title: § 176.180
  text: '§ 176.180

    Components of paper and paperboard in contact with dry food.

    The substances listed in this section may be safely used as components of the uncoated or coated food-contact surface of paper and paperboard intended for use in producing, manufacturing, packing, processing,
    preparing, treating, packaging, transporting, or holding dry food of the type identified in § 176.170(c), table 1, under Type VIII, subject to the provisions of this section.

    (a) The substances are used in amounts not to exceed that required to accomplish their intended physical or technical effect, and are so used as to accomplish no effect in food other than that ordinarily
    accomplished by packaging.

    (b) The substances permitted to be used include the following:

    (1) Substances that by § 176.170 and other applicable regulations in parts 170 through 189 of this chapter may be safely used as components of the uncoated or coated food-contact surface of paper and
    paperboard, subject to the provisions of such regulation.

