  text: '§ 1201.40

    Interpretation concerning bathtub and shower doors and enclosures.

    (a)

    Purpose and background.

    The purpose of this section is to clarify the scope of the terms “bathtub doors and enclosures” and “shower door and enclosure” as they are used in the Standard in subpart A. The Standard lists the
    products that are subject to it (§ 1201.1(a)). This list includes

    bathtub doors and enclosures,

    a term defined in the Standard to mean “assemblies of panels and/or doors that are installed on the lip of or immediately surrounding a bathtub” (§ 1201.2(a)(2)). The list also includes

    shower doors and enclosures,

    a term defined to mean “(assemblies) of one or more panels installed to form all or part of the wall and/or door of a shower stall” (§ 1201.2(a)(30)). Since the Standard became effective on July 6,
    1977, the question has arisen whether the definitions of these products include glazing materials in a window that is located over a bathtub or within a shower stall and in the exterior wall of a building.
    The definitions of the terms “bathtub doors and enclosures” and “shower door and enclosure” contain no specific exemption for glazing materials in such windows. If read literally, the Standard could
