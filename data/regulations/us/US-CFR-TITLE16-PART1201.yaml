  title: § 1201.2
  text: '§ 1201.2

    Definitions.

    (a) As used in this part 1201:

    (1)

    Annealed glass

    means glass that has been subjected to a slow, controlled cooling process during manufacture to control residual stresses so that it can

    be cut or subjected to other fabrication. Regular polished plate, float, sheet, rolled, and some patterned surface glasses are examples of annealed glass.

    (2)

    Bathtub doors and enclosures

    means assemblies of panels and/or doors that are installed on the lip of or immediately surrounding a bathtub.

    (3)

    Category I products (Class B)

    means any of the following Architectural products:

    (i) Storm doors or combination doors that contain no single piece of glazing material greater than 9 square feet (0.83 square meters) in surface area of one side of the piece of glazing material.

    (ii) Doors that contain no single piece of glazing material greater than 9 square feet (0.83 square meters) in surface area of one side of the piece of glazing material.

    (4)

    Category II products (Class A)

    means any of the following architectural products:

    (i) Shower doors and enclosures.

    (ii) Bathtub doors and enclosures.

    (iii) Sliding glass doors (patio type).

    (iv) Storm doors or combination doors that contain any piece of glazing material greater than 9 square feet (0.83 square meters) in surface area of one side of the piece of glazing material.

    (v) Doors that contain any piece of glazing material greater than 9 square feet (0.83 square meters) in surface area of one side of the piece of glazing material.

    (5)

    Distributor

    means a person to whom a consumer product is delivered or sold for purposes of distribution in commerce, including persons cutting glazing material to size, except that such term does not include a
    manufacturer or retailer of such product.

    (6)

    Distribution in commerce

    means to sell in commerce, to introduce or deliver for introduction into commerce, or to hold for sale or distribution after introduction into commerce.

    (7)

    Door

    means an assembly that is installed in an interior or exterior wall; that is movable in a sliding, pivoting, hinged, or revolving manner of movement; and that is used by consumers to produce or close
    off an opening for use as a means of human passage.

    (8)

    Fabricator

    means any person who assembles or otherwise incorporates glazing materials into an architectural product listed in § 1201.1(a). A fabricator is considered a manufacturer as defined in paragraph (a)(16)
    of this section.

    (9)

    Glass

    means a hard, brittle, amorphous substance produced by fusion, usually consisting of mutually dissolved silica and silicates that also contains sods and lime. It may be transparent, translucent, or
    opaque.

    (10) [Reserved]

    (11)

    Glazing material

    means glass, including annealed glass, organic coated glass, tempered glass, laminated glass, wired glass; or combinations thereof where these are used:

    (i) In openings through the architectural products listed in § 1201.1(a), or

    (ii) As the architectural products themselves, e.g. unframed doors.

    (12)

    Jalousie door

    means a door (as “door” is defined in paragraph (a)(7) of this section) having an opening glazed with operable, overlapping louvers. Each louver is one of a series of overlapping pieces of glazing material
    designed to admit ventilation and light but exclude rain and is typically operated by a crank and gear mechanism.

    (13)

    Laminated glass

    means glazing material composed of two or more pieces of glass, each piece being either tempered glass, heat strengthened glass, annealed glass or wired glass, bonded to an intervening layer or layers
    of resilient plastic material.

    (14)

    Leaded glass

    means a decorative composite glazing material made of individual pieces of glass whose perimeter is enclosed by lengths of durable metal such as lead or zinc and the pieces of glass are completely held
    together and supported by such metal. Such pieces of glass can be clear, colored, beveled, painted, or flashed and etched.

    (15)

    Manufacture

    means to manufacture, produce or assemble.

    (16)

    Manufacturer

    means any person who manufactures, fabricates or imports a glazing material or architectural product listed in § 1201.1(a) that incorporates glazing material.

    (17)

    Mirror

    means a treated, polished or smooth glazing material that forms images by the reflection of light.

    (18)

    Mobile home

    means a structure transportable in one or more sections, which is eight body feet (2.4 body meters) or more in width and is thirty-two body feet (9.7 body meters) or more in length, and which is built
    on a permanent chassis and designed to be used as a dwelling with or without a permanent foundation when connected to the required utilities.

    (19)

    Other buildings or parts thereof

    means buildings or parts thereof (other than residential, school, public, or recreational buildings) in which all or part of the building is open to the public with or without specific invitation. Included
    are buildings or parts thereof such as banks and recreational or retail facilities in a building and multiuse buildings that contain residential units.

    (20)

    Organic-coated glass

    means a glazing material consisting of a piece of glass, coated and bonded on one or both sides with an applied polymeric coating, sheeting, or film.

    (21)

    Patio door

    (See “sliding glass doors (patio-type)” in paragraph (a)(31) of this section).

    (22)

    Permanent label

    means a label that will remain permanently legible and visible after installation of the glazing material and that would be destroyed in attempts to remove it from the glazing material and includes
    (but is not limited to) sandblast, acid etch, hot-stamp, and destructible polyester labels.

    (23) [Reserved]

    (24)

    Private labeler

    means an owner of a brand or trademark on the label of a consumer product which bears a private label, and includes any fabricator, distributor, or installer who cuts certified and permanently labeled
    glazing materials into smaller pieces.

    (25)

    Public building

    means a building of public assembly or meeting including (but not limited to) a museum, place of worship, or restaurant.

    (26)

    Recreational building

    means a building used for recreational purposes including (but not limited to) a theater, stadium, gymnasium, amusement park building or library.

    (27)

    Residential building

    means a building, permanent or temporary, such as a single or multifamily residence, including (but not limited to) a house, apartment building, lodging home, dormitory, hotel, motel, hospital, sanitarium,
    and nursing home, used as a dwelling for one or more persons or families and any structure which is attached to, a part of, or appurtenant to such a building. Public areas of all residential buildings,
    such as lobbies and other common facilities, are included within the definition of “other buildings or parts thereof” in paragraph (a)(19) of this section. For purposes of this part 1201, a mobile home
    as defined in paragraph (a)(18) of this section is not considered to be a residential building.

    (28)

    Retailer

    means a person to whom a consumer product is delivered or sold for purposes of sale or distribution by such person to a consumer; the term retailer includes a person who cuts glazing material to size
    for consumers.

    (29)

    School building

    means a building designed primarily for the conduct of educational instruction and includes the classrooms, libraries, administrative offices, auditoriums, eating and sanitary facilities, stadiums,
    gymnasiums and all other structures associated with such buildings.

    (30)

    Shower door and enclosure

    means an assembly of one or more panels installed to form all or part of the wall and or door of a shower stall.

    (31)

    Sliding glass door (patio-type)

    means an assembly of one or more panels, at least one of which is suitably movable for use as a means of human ingress or egress. The term includes the nonmovable and movable panels of such assembly.

    (32)

    Storm door (or combination door)

    means a movable assembly, used in tandem with an exterior door to protect the exterior door against weather elements and/or to improve indoor climate control.

    (33)

    Tempered glass

    means a piece of specially heat treated or chemically treated glass that cannot be cut, drilled, ground, or polished after treatment without fracture. When fractured at any point, if highly tempered,
    the entire piece breaks into small particles.

    (34)

    Wired glass

    means a single piece of annealed glass that contains wire embedded in the body of the glass.

    (35)

    Commission

    means the Consumer Product Safety Commission.

    (36)

    Carved glass

    means a decoration glazing material in which a permanent visible design has been produced by polishing, grinding, or otherwise removing portions of the surface.

    (37)

    Dalle glass

    or dalle de verre (including faceted glass) means a decorative composite glazing material made of individual pieces of glass which are imbedded in a cast matrix of concrete or epoxy.

    (b) Definitions given in the Consumer Product Safety Act, and not repeated in this section, are applicable to this part.

    (c) Test methods and recommended practices published by the American Society for Testing and Materials (ASTM)

    1

    , and referred to in this part 1201, are hereby incorporated by reference into this part.

    1

    ASTM test methods and recommended practices are approved by, published by, and available for purchase from the American Society for Testing and Materials, 1916 Race Street, Philadelphia, Pennsylvania
    19103.

    (d) Test methods and recommended practices published by the American National Standards Institute (ANSI) and referred to in this part 1201, are hereby incorporated by reference into this part.

    (Sec. 9(e), Pub. L. 92-573, 86 Stat. 1215; (15 U.S.C. 2058(e); (5 U.S.C. 553))

