  title: § 1201.3
  text: '§ 1201.3

    General requirements.

    (a) All glazing materials to which this standard applies, as described in § 1201.1, shall meet the impact and environmental test requirements in § 1201.4, and shall be labeled by manufacturers in accordance
    with § 1201.5.

    (b) Glazing materials used in architectural products not listed in § 1201.1(a) are not subject to this part. Any material not listed in the definition of “glazing material” in § 1201.2(a)(11) is not
    subject to this part 1201.

    [42 FR 1441, Jan. 6, 1977, as amended at 47 FR 27856, June 28, 1982]'
- id: art-5
  title: § 1201.4
  text: '§ 1201.4

    Test procedures.

    Except as provided in §§ 1201.1(c) and (d), architectural glazing products shall be tested in accordance with all of the applicable test provisions of ANSI Z97.1-2015 “

    American National Standard for Safety Glazing Materials Used in Building—Safety Performance Specifications and Methods of Test,”

    approved March 2015. The Director of the Federal Register approves the incorporation by reference in accordance with 5 U.S.C. 552(a) and 1 CFR part 51. You may obtain a copy from ANSI Customer Service
    Department, 25 W. 43rd Street, 4th Floor, New York, NY 10036. You may inspect a copy at the Office of the Secretary, U.S. Consumer Product Safety Commission, Room 820, 4330 East West Highway, Bethesda,
    MD 20814, telephone 301-504-7923, or at the National Archives and Records Administration (NARA). For information on the availability of this material at NARA, call 202-741-6030, or go to:

    http://www.archives.gov/federal-register/cfr/ibr-locations.html.

    [81 FR 15431, Mar. 23, 2016]'
- id: art-6
  title: § 1201.5
  text: '§ 1201.5

    Certification and labeling requirements.

    (a) Manufacturers and private labelers of glazing materials covered by this part 1201 shall comply with the requirements of section 14 CPSA (15 U.S.C. 2063) and regulations issued under section 14.

    (b) [Reserved]

    (c) Organic-coated glass that has been tested for environmental exposure from one side only must bear a permanent label on the coating stating “GLAZE THIS SIDE IN” and shall bear in the central 50 percent
    of the surface area the following message in letters at least

    1/4

    inch (7 millimeters) high: “SEE PERMANENT LABEL FOR IMPORTANT MOUNTING INSTRUCTION.” The latter message shall be attached to either side of the glazing by any means

    which shall ensure the message will remain in place until installation.

    [42 FR 1441, Jan. 6, 1977, as amended at 45 FR 66007, Oct. 6, 1980]'
- id: art-7
  title: § 1201.6
  text: '§ 1201.6

    Prohibited stockpiling.

    (a)

    Stockpiling.

    For the purposes of this section, the term

    stockpiling

    means manufacturing or importing the affected products between the date of issuance of this part in the

    Federal Register

    and the effective date set out below in § 1201.7 at a rate significantly greater (prescribed in paragraph (b) of this section) than the rate at which the affected products were produced or imported
    during a base period (prescribed in paragraph (c)(2) of this section).

    (b)

    Prohibited acts.

    Manufacturers and importers of glazing materials, fabricators, and manufacturers or importers of architectural products specified in § 1201.1(a) who incorporate glazing material shall not incorporate
    glazing materials which do not comply with the requirements of this part 1201 into such products between the date of issuance of this part in the

    Federal Register

    and the effective date set out in § 1201.7 below at a rate greater than the rate of production or importation during the base period (defined in paragraph (c)(2) of this section) plus ten percent. For
    wired glass used in doors or other assemblies subject to this part 1201 and intended to retard the passage of fire, when such doors or other assemblies are required by a Federal, State, local or municipal
    fire ordinance, the rate of production during the base period may be increased annually by no more than 10 percent.

    (c)

    Definitions.

    As used in this section:

    (1)

    Rate of production (or importation)

    means the total number of affected architectural products incorporating glazing material not complying with this part manufactured or imported during a stated base period.

    (2)

    Base period

    means, at the option of the manufacturer or importer, any period of 180 consecutive days prior to January 6, 1977, said period to be selected within an interval which begins July 6, 1975.'
