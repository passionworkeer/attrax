  title: § 1201.1
  text: '§ 1201.1

    Scope, application and findings.

    (a)

    Scope.

    This part 1201, a consumer product safety standard, prescribes the safety requirements for glazing materials used or intended for use in any of the following architectural products:

    (1) Storm doors or combination doors.

    (2) Doors.

    (3) Bathtub doors and enclosures.

    (4) Shower doors and enclosures.

    (5) [Reserved]

    (6) Sliding glass doors (patio-type).

    It also requires that these architectural products which incorporate glazing materials be constructed with glazing materials that meet the requirements of this part. The safety requirements are designed
    to reduce or eliminate unreasonable risks of death or serious injury to consumers when glazing material is broken by human contact.

    (b)

    Application.

    This part 1201 shall apply to glazing materials, as that term is defined in § 1201.2(a)(11), for use in the architectural products listed in paragraph (a) of this section; and to those architectural
    products listed in paragraph (a) of this section if they are made with, or incorporate glazing materials as that term is defined in § 1201.2(a)(11). The standard applies to glazing materials and architectural
    products incorporating glazing materials that are produced or distributed for sale to or for the personal use, consumption or enjoyment of consumers in or around a permanent or temporary household or
    residence or in recreational, school, public, or other buildings or parts thereof. This part 1201 applies only to those glazing materials manufactured after the effective date of the standard; and to
    those architectural products identified in paragraph (a) of this section that are manufactured after the effective date of the standard. Thus, architectural products identified in paragraph (a) of this
    section manufactured after the effective date of the standard must incorporate glazing materials that comply with the standard. For purposes of this standard, fabricators are considered to be manufacturers
    of the architectural products listed in paragraph (a) of this section. Architectural glazing materials used in the products listed in paragraph (a) of this section and used in mobile homes are not subject
    to the provisions of this part 1201. While this part 1201 prescribes a test method to determine whether glazing materials subject to this part 1201 standard meet the requirements of the standard, the
    standard itself does not require that a manufacturer test any glazing materials or products subject to the standard. All obligations of manufacturers to perform testing are imposed by section 14 of
    the Consumer Product Safety Act and certification regulations which will be established by a separate rulemaking proceeding. However, the Commission intends to use the test procedures set forth in this
    part 1201 to determine whether materials and products subject to the standard meet the requirements of the standard.

    (c)

    Exemptions.

    The following products, materials and uses are exempt from this part 1201:

    (1) Wired glass used in doors or other assemblies to retard the passage of fire, where such door or assembly is required by a federal, state, local, or municipal fire ordinance.

    (2) Louvers of jalousie doors;

    (3) Openings in doors through which a 3 inch diameter sphere is unable to pass;

    (4) Carved glass (as defined in § 1201.2(a)(36)), dalle glass (as defined in § 1201.2(a)(37)), or leaded glass (as defined in § 1201.2(a)(14)), which is used in doors and glazed panels (as defined in
    §§ 1201.2(a)(7) and (a)(10)) if the glazing material meets all of the following criteria:

    (i) The coloring, texturing, or other design qualities or components of the glazing material cannot be removed without destroying the material; and

    (ii) The primary purpose of such glazing is decorative or artistic; and

    (iii) The glazing material is conspicuously colored or textured so as to be plainly visible and plainly identifiable as aesthetic or decorative rather than functional (other than for the purpose of
    admitting or controlliing admission of light components or heat and cold); and

    (iv) The glazing material, or assembly into which it is incorporated, is divided into segments by conspicuous and plainly visible lines.

    (5) Glazing materials used as curved glazed panels in revolving doors;

    (6) Commercial refrigerated cabinet glazed doors.

    (d)

    Findings

    1

    —(1)

    The degree and nature of the risk of injury the rule is designed to eliminate or reduce.

    The Commission finds that the nature of the risks of injury this standard is designed to eliminate or reduce are as follows:

    1

    The Commission''s findings apply to the architectural glazing standard as issued at 42 FR 1426, on January 6, 1977. Since that date, the Commission has revoked portions of the standard which prescribed
    requirements for “glazed panels” (45 FR 57383, August 28, 1980); an accelerated environmental durability test for plastic glazing materials intended for outdoor exposure (45 FR 66002, October 6, 1980);
    and a modulus of elasticity test, a hardness test, and an indoor aging test applicable to plastic glazing materials (47 FR 27856, June 28, 1982). However, the findings have not been revised and they
    are therefore, not fully applicable to the remaining requirements of the standard.

    (i) Lacerations, contusions, abrasions, and other injury or death resulting from walking or running into glazed doors or sliding glass doors believed to be open or glazed panels mistaken as a means
    of ingress or egress, or pushing against glazing material in doors or glazed panels in an attempt to open a door.

    (ii) Lacerations, contusions, abrasions, and other injury or death resulting from accidentally falling into or through glazed doors, sliding glass doors, glazed panels, bathtub doors and enclosures
    and shower doors and enclosures.

    (iii) Lacerations, contusions, abrasions, and other injury or death resulting from the act of installing, replacing, storing or otherwise manipulating glazing material in doors, sliding glass doors,
    glazed panels, bathtub doors and enclosures and shower doors and enclosures, or from broken glazing material in doors, sliding glass doors, glazed panels, bathtub doors and enclosures and shower doors
    and enclosures. The Commission estimates that 73,000 injuries associated with architectural glazing materials in the architectural products within the scope of this standard were treated in hospital
    emergency rooms during 1975, and that about 2,400 of these injuries required the patients to be hospitalized. Extrapolating to total injuries in the United States the Commission further estimates that
    approximately 190,000 injuries were associated with architectural glazing products covered by this standard. Although injuries occur at any age, children aged 14 and under appear to be at particular
    risk of injury since as a group they represent approximately half the injuries while comprising less than 30 percent of the population. Lacerations are the most common injuries associated with architectural
    glazing materials and account for 72 percent to 93 percent of the injuries associated with the architectural products identified in paragraph (a) of this section. These lacerative injuries span a broad
    spectrum of severity and extent of body part affected. During 1975, an estimated 200 injuries were treated in emergency rooms for lacerations over 25 to 50 percent of the victims'' bodies and over 7,000
    persons were treated for lacerations to the head or face. On the basis of all injury information available to the Commission, it is apparent that the severity of the injuries associated with architectural
    glazing materials ranges from minor cuts to damage to tendons, nerves, muscles, and blood vessels resulting in extensive surgery. Peripheral nerve injuries result in varying degres of loss in sensation
    and motion which may never be restored completely. Tendon and muscle injuries may involve loss of movement. Some victims of architectural glazing material incidents are disfigured, and sustain emotional
    trauma as well. Severing of arteries and veins has led to

    death. One way of quantifying the extent of the public health problem relating to injuries associated with products is to estimate the total number of disability days resulting from the injuries. Using
    average days of restricted activity by age for specific injuries and body parts (Vital and Health Statistics, Series 10, Number 57, National Center for Health Statistics, U.S. Department of Health,
    Education, and Welfare), it is estimated that about 230,000 days of restricted activity resulted from injuries associated with architectural products which were treated in emergency rooms alone.

    (2)

    The approximate number of consumer products, or types or classes thereof, subject to the standard.

    The types of glazing materials affected by or subject to the standard are laminated glass, tempered glass, wired glass, organic-coated glass, annealed glass, and plastics. Architectural products that
    incorporate the aforementioned glazing materials that are also affected by or subject to the standard are: storm doors or combination doors, doors, bathtub doors, and enclosures, shower doors and enclosures,
    glazed panels and sliding glass doors (patio-type) (see paragraph (a) of this section). The Commission has estimated that 13 to 16 percent of the total market for glazing material incorporated in products
    within the scope of the standard will be affected by the standard. Most of the glazing subject to the standard is currently covered by state safety glazing legislation. To date, more than 30 states
    have enacted safety glazing legislation, but this legislation is neither consistent nor completely uniform among states. Annual markets for the architectural products which incorporate glazing material
    and that are within the scope of the standard have been estimated by the Commission in terms of square feet of glazed area and number of units. The market for glazing material incorporated in products
    within the scope of the standard was estimated to be 234.8 million square feet in 1975. These figures are discussed in the Economic Impact Statement, pp. 3-7, and appendix A to the Economic Impact Statement,
    pp. 18-30, which are available for review in the Office of the Secretary of the Commission, Washington, D.C. 20207.

    (3)

    The need of the public for the architectural glazing material and products incorporating that glazing material subject to the standard, and the probable effect of the standard upon the utility, cost
    or availability of those products to meet the need of the public

    —(i)

    The need of the public for the architectural glazing materials and products incorporating that glazing material.

    The need of the public for architectural products within the scope of the standard incorporating glazing material is substantial since these products serve such functions as transmission of light, visual
    communication, protection from weather, ventilation, and indoor climate control, and since reasonable substitutes for these products do not exist as a group. Each of the types of glazing material subject
    to the standard has individual properties which meet public needs, although one type of glazing material is often an acceptable substitute for another.

    (ii)

    Probable effect of the standard upon the cost of architectural glazing materials and architectural products incorporating the glazing material to meet the need of the public for the products.

    The probable cost effects of the standard for architectural glazing materials are listed below.

    (A) The cost impact of the standard on consumers will be concentrated in those states with no present state safety glazing legislation. In those states, the average increase in cost per housing start
    resulting from the standard is estimated to range from $30 to $50, or approximately one-tenth of one percent of the price of a typical new house; and the cost for residential remodeling and replacement
    is expected to be in the range of $0.25 to $0.30 per household'
