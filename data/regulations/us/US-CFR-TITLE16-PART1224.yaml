- id: art-2
  title: § 1224.1
  text: '§ 1224.1

    Scope, application, and effective date.

    This part establishes a consumer product safety standard for portable bed rails manufactured or imported on or after August 29, 2012.'
- id: art-3
  title: § 1224.2
  text: '§ 1224.2

    Requirements for portable bed rails.

    Each portable bed rail as defined in ASTM F2085-19,

    Standard Consumer Safety Specification for Portable Bed Rails,

    approved on November 1, 2019, must comply with all applicable provisions of ASTM F2085-19. The Director of the Federal Register approves the incorporation by reference listed in this section in accordance
    with 5 U.S.C. 552(a) and 1 CFR part 51. You may obtain a copy of this ASTM standard from ASTM International, 100 Barr Harbor Drive, PO Box C700, West Conshohocken, PA 19428-2959 USA; phone: 610-832-9585;

    www.astm.org.

    A read-only copy of the standard is available for viewing on the ASTM website

    at

    https://www.astm.org/READINGLIBRARY/.

    You may inspect a copy at the Division of the Secretariat, U.S. Consumer Product Safety Commission, Room 820, 4330 East West Highway, Bethesda, MD 20814, telephone 301-504-7479, email:

    cpsc-os@cpsc.gov,

    or at the National Archives and Records Administration (NARA). For information on the availability of this material at NARA, email

    fedreg.legal@nara.gov,

    or go to:

    www.archives.gov/federal-register/cfr/ibr-locations.html

    .

    [85 FR 10568, Feb. 25, 2020, as amended at 85 FR 40876, July 8, 2020]'
