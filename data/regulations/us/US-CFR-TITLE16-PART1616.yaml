    Shorter conditioning times may be used if the change in weight of a specimen in successive weighings made at intervals of not less than 2 hr does not exceed 0.2 pct of the weight of the specimen.

    (7)

    Stopwatch.

    A stopwatch or similar timing device shall be used to measure time to 0.1 second.

    (8)

    Scale.

    A linear scale graduated in mm. or 0.1-inch divisions shall be used to measure char length.

    (9)

    Circulating air oven.

    A forced circulation drying oven capable of maintaining the specimen at 105±2.8 °C. (221±5 °F.), shall be used to dry the specimen while mounted in the specimen holders.

