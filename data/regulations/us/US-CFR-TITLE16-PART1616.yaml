  text: '§ 1616.5

    Test procedure.

    (a)

    Apparatus.

    The following test apparatus shall be used for the test. Alternate test apparatus may be used only with prior approval of the Consumer Product Safety Commission.

    (1)

    Test chamber.

    The test chamber shall be a steel cabinet with inside dimensions of 32.9 cm. (12

    15/16

    in.) wide, 32.9 cm. (12

    15/16

    in.) deep and 76.2 cm. (30 in.) high. It shall have a frame which permits the suspension of the specimen holder over the center of the base of the cabinet at such a height that the bottom of the specimen
    is 1.7 cm. (

    3/4

    in.) above the highest point of the barrel of the gas burner specified in paragraph (a)(3) of this section,

    Burner

    and perpendicular to the front of the cabinet. The front of the cabinet shall be a close-fitting door with a transparent insert to permit observation of the entire test. The cabinet floor may be covered
    with a piece of asbestos paper, whose length and width are approximately 2.5 cm. (1 in.) less than the cabinet floor dimensions. The cabinet to be used in this test method is illustrated in Figure 1
    and detailed in Engineering Drawings, Numbers 1 through 7.

    EC03OC91.089

    EC03OC91.090

    EC03OC91.091

    EC03OC91.092

    EC03OC91.093

    EC03OC91.094

    EC03OC91.095

    EC03OC91.096

    (2)

    Specimen holder.

    The specimen holder to be used in this test method is detailed in Engineering Drawing Number 7. It is designed to permit suspension of the specimen in a fixed vertical position and to prevent curling
    of the specimen when the flame is applied. The specimen shall be fixed between the plates, which shall be held together with side clamps.

    (3)

    Burner.

    The burner shall be the same as that illustrated in Figure 1 and detailed in Engineering Drawing Number 6. It shall have a tube of 1.1 cm. (0.43 in.) inside diameter. The input line to the burner shall
    be equipped

    with a needle valve. It shall have a variable orifice to adjust the height of the flame. The barrel of the burner shall be at an angle of 25 degrees from the vertical. The burner may be equipped with
    an adjustable stop collar so that it may be positioned quickly under the test specimen. The burner shall be connected to the gas source by rubber or other flexible tubing.

    (4)

    Gas supply system.

    There shall be a pressure regulator to furnish gas to the burner under a pressure of 103-259 mm. Hg. (2-5 lbs. per sq. in.) at the burner inlet. (

    Caution.

    Precautionary laboratory practices must be followed to prevent the leakage of methane. Methane is a flammable gas which can be explosive when mixed with air and exposed to a source of ignition, and
    can cause asphyxiation because of the lack of air.)

    (5)

    Gas.

    The gas shall be at least 97 percent pure methane.

    (6)

    Hooks and weights.

    Metal hooks and weights shall be used to produce a series of loads for char length determinations. Suitable metal hooks consist of No. 19 gauge steel wire, or equivalent, made from 7.6 cm. (3 in.) lengths
    of the wire, bent 1.3 cm. (0.5 in.) from one end to a 45-degree angle hook. The longer end of the wire is fastened around the neck of the weight to be used and the other in the lower end of each burned
    specimen to one side of the burned area. The requisite loads are given in table 1.

