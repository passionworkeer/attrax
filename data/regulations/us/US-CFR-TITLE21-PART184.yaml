  text: '§ 184.1011

    Alginic acid.

    (a) Alginic acid is a colloidal, hydrophilic polysaccharide obtained from certain brown algae by alkaline extraction.

    (b) The ingredient meets the specifications of the Food Chemicals Codex, 3d Ed. (1981), p. 13, which is incorporated by reference. Copies are available from the National Academy Press, 2101 Constitution
    Ave. NW., Washington, DC 20418, or available for inspection at the National Archives and Records Administration (NARA). For information on the availability of this material at NARA, call 202-741-6030,
    or go to:

    http://www.archives.gov/federal_register/code_of_federal_regulations/ibr_locations.html.

    (c) In accordance with § 184.1(b)(2), the ingredient is used in food only within the following specific limitations:

    Category of food

    Maximum level of use in food (as served)

    Functional use

    Soup and soup mixes, § 170.3(n)(40) of this chapter

    Not to exceed current good manufacturing practice

    Emulsifier, emulsifier salt, § 170.3(o)(8) of this chapter; formulation aid, § 170.3(o)(14) of this chapter; stabilizer, thickener, § 170.3(o)(28) of this chapter.

    (d) Prior sanctions for this ingredient different from the use established in this section do not exist or have been waived.

    [47 FR 47375, Oct. 26, 1982]'
- id: art-7
  title: § 184.1012
  text: '§ 184.1012

    α-Amylase enzyme preparation from Bacillus stearothermophilus.

    (a) α-Amylase enzyme preparation is obtained from the culture filtrate that results from a pure culture fermentation of a nonpathogenic and nontoxicogenic strain of

    Bacillus stearothermophilus.

    Its characterizing enzyme activity is α-amylase (1,4 α-D glucan glucanohydrolase (E.C. 3.2.1.1)).

    (b) The ingredient meets the general and additional requirements for enzyme preparations in the “Food Chemicals Codex,” 3d ed. (1981), pp. 107-110, which is incorporated by reference in accordance with
    5 U.S.C. 552(a) and 1 CFR part 51. Copies are available from the National Academy Press, 2101 Constitution Ave. NW., Washington, DC 20418, or may be examined at the Office Food Additive Safety (HFS-200),
    Center for Food Safety and Applied Nutrition, Food and Drug Administration, 5001 Campus Dr., College Park, MD 20740, 240-402-1200, or at the National Archives and Records Administration (NARA). For
    information on the availability of this material at NARA, call 202-741-6030, or go to:

    http://www.archives.gov/federal_register/code_of_federal_regulations/ibr_locations.html.

    (c) In accordance with § 184.1(b)(1), the ingredient is used in food with no limitation other than current good manufacturing practices. The affirmation of this ingredient as GRAS as a direct human
    food ingredient is based upon the following current good manufacturing practice conditions of use:

    (1) The ingredient is used as an enzyme, as defined in § 170.3(o)(9) of this chapter, in the hydrolysis of edible starch to produce maltodextrins and nutritive carbohydrate sweeteners.

    (2) The ingredient is used at levels not to exceed current good manufacturing practices.

    [60 FR 55789, Nov. 3, 1995, as amended at 78 FR 14666, Mar. 7, 2013]'
- id: art-8
  title: § 184.1021
  text: '§ 184.1021

    Benzoic acid.

    (a) Benzoic acid is the chemical benzenecarboxylic acid (C

    7

    H

    6

    O

    2

    ), occurring in nature in free and combined forms. Among the foods in which benzoic acid occurs naturally are cranberries, prunes, plums, cinnamon, ripe cloves, and most berries. Benzoic acid is manufactured
    by treating molten phthalic anhydride with steam in the presence of a zinc oxide catalyst, by the hydrolysis of benzotrichloride, or by the oxidation of toluene with nitric acid or sodium bichromate
    or with air in the presence of a transition metal salt catalyst.

    (b) The ingredient meets the specifications of the “Food Chemicals Codex,” 3d Ed. (1981), p. 35, which is incorporated by reference. Copies may be obtained from the National Academy Press, 2101 Constitution
    Ave. NW., Washington, DC 20418, or may be examined at the National Archives and Records Administration (NARA). For information on the availability of this material at NARA, call 202-741-6030, or go
    to:

    http://www.archives.gov/federal_register/code_of_federal_regulations/ibr_locations.html.

    (c) The ingredient is used as an antimicrobial agent as defined in § 170.3(o)(2) of this chapter, and as a flavoring agent and adjuvant as defined in § 170.3(o)(12) of this chapter.

    (d) The ingredient is used in food at levels not to exceed good manufacturing practice. Current usage results in a maximum level of 0.1 percent in food. (The Food and Drug Administration has not determined
    whether significantly different conditions of use would be GRAS).

    (e) Prior sanctions for this ingredient different from those uses established in this section, or different from that set forth in part 181 of this chapter, do not exist or have been waived.

    [42 FR 14653, Mar. 15, 1977, as amended at 49 FR 5610, Feb. 14, 1984]'
- id: art-9
  title: § 184.1024
  text: '§ 184.1024

    Bromelain.

    (a) Bromelain (CAS Reg. No. 9001-00-7) is an enzyme preparation derived from the pineapples

    Ananas comosus

    and

    A. bracteatus

    L. It is a white to light tan amorphous powder. Its characterizing enzyme activity is that of a peptide hydrolase (EC 3.4.22.32).

    (b) The ingredient meets the general requirements and additional requirements for enzyme preparations in the Food Chemicals Codex, 3d ed. (1981), p. 110, which is incorporated by reference in accordance
    with 5 U.S.C. 552(a) and 1 CFR part 51. Copies are available from the National Academy Press, 2101 Constitution Ave. NW., Washington, DC, or may be examined at Office of Food Additive Safety (HFS-200),
    Center for Food Safety and Applied Nutrition, Food and Drug Administration, 5001 Campus Dr., College Park, MD 20740, 240-402-1200, and at the National Archives and Records Administration (NARA). For
    information on the availability of this material at NARA, call 202-741-6030, or go to:

    http://www.archives.gov/federal_register/code_of_federal_regulations/ibr_locations.html.

    (c) In accordance with § 184.1(b)(1), the ingredient is used in food with no limitation other than current good manufacturing practice. The affirmation of this ingredient as GRAS as a direct food ingredient
    is based upon the following current good manufacturing practice conditions of use:

    (1) The ingredient is used as an enzyme as defined in § 170.3(o)(9) of this chapter to hydrolyze proteins or polypeptides.

    (2) The ingredient is used in food at levels not to exceed current good manufacturing practice.

    [60 FR 32910, June 26, 1995, as amended at 78 FR 14666, Mar. 7, 2013]'
