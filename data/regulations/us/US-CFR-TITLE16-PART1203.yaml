    Purpose, basis, and scope.

    (a)

    Purpose.

    The purpose of this subpart is to establish requirements that manufacturers and importers of bicycle helmets subject to the Safety Standard for Bicycle Helmets (subpart A of this part 1203) shall issue
    certificates of compliance in the form specified.

    (b)

    Basis.'
