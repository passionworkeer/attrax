  title: § 101.1
  text: '§ 101.1

    Principal display panel of package form food.

    The term

    principal display panel

    as it applies to food in package form and as used in this part, means the part of a label that is most likely to be displayed, presented, shown, or examined under customary conditions of display for
    retail sale. The principal display panel shall be large enough to accommodate all the mandatory label information required to be placed thereon by this part with clarity and conspicuousness and without
    obscuring design, vignettes, or crowding. Where packages bear alternate principal display panels, information required to be placed on the principal display panel shall be duplicated on each principal
    display panel. For the purpose of obtaining uniform type size in declaring the quantity of contents for all packages of substantially the same size, the term

    area of the principal display panel

    means the area of the side or surface that bears the principal display panel, which area shall be:

    (a) In the case of a rectangular package where one entire side properly can be considered to be the principal display panel side, the product of the height times the width of that side;

    (b) In the case of a cylindrical or nearly cylindrical container, 40 percent of the product of the height of the container times the circumference;

    (c) In the case of any otherwise shaped container, 40 percent of the total surface of the container:

    Provided, however,

    That where such container presents an obvious “principal display panel” such as the top of a triangular or circular package of cheese, the area shall consist of the entire top surface. In determining
    the area of the principal display panel, exclude tops, bottoms, flanges at tops and bottoms of cans, and shoulders and necks of bottles or jars. In the case of cylindrical or nearly cylindrical containers,
    information required by this part to appear on the principal display panel shall appear within that 40 percent of the circumference which is most likely to be displayed, presented, shown, or examined
    under customary conditions of display for retail sale.'
- id: art-3
  title: § 101.2
  text: '§ 101.2

    Information panel of package form food.

    (a) The term

    information panel

    as it applies to packaged food means that part of the label immediately contiguous and to the right of the principal display panel as observed by an individual facing the principal display panel with
    the following exceptions:

    (1) If the part of the label immediately contiguous and to the right of the principal display panel is too small to accommodate the necessary information or is otherwise unusable label space, e.g.,
    folded flaps or can ends, the panel immediately contiguous and to

    the right of this part of the label may be used.

    (2) If the package has one or more alternate principal display panels, the information panel is immediately contiguous and to the right of any principal display panel.

    (3) If the top of the container is the principal display panel and the package has no alternate principal display panel, the information panel is any panel adjacent to the principal display panel.

    (b) All information required to appear on the label of any package of food under §§ 101.4, 101.5, 101.8, 101.9, 101.13, 101.17, 101.36, subpart D of part 101, and part 105 of this chapter shall appear
    either on the principal display panel or on the information panel, unless otherwise specified by regulations in this chapter.

    (c) All information appearing on the principal display panel or the information panel pursuant to this section shall appear prominently and conspicuously, but in no case may the letters and/or numbers
    be less than one-sixteenth inch in height unless an exemption pursuant to paragraph (f) of this section is established. The requirements for conspicuousness and legibility shall include the specifications
    of §§ 101.7(h)(1) and (2) and 101.15.

    (1)(i) Soft drinks packaged in bottles manufactured before October 31, 1975 shall be exempt from the requirements prescribed by this section to the extent that information which is blown, lithographed,
    or formed onto the surface of the bottle is exempt from the size and placement requirements of this section.

    (ii) Soft drinks packaged in bottles shall be exempt from the size and placement requirements prescribed by this section if all of the following conditions are met:

    (A) If the soft drink is packaged in a bottle bearing a paper, plastic foam jacket, or foil label, or is packaged in a nonreusable bottle bearing a label lithographed onto the surface of the bottle
    or is packaged in metal cans, the product shall not be exempt from any requirement of this section other than the exemptions created by § 1.24(a)(5) (ii) and (v) of this chapter and the label shall
    bear all required information in the specified minimum type size, except the label will not be required to bear the information required by § 101.5 if this information appears on the bottle closure
    or on the lid of the can in a type size not less than one-sixteenth inch in height, or if embossed on the lid of the can in a type size not less than one-eighth inch in height.

    (B) If the soft drink is packaged in a bottle which does not bear a paper, plastic foam jacket or foil label, or is packaged in a reusable bottle bearing a label lithographed onto the surface of the
    bottle:

    (

    1

    ) Neither the bottle nor the closure is required to bear nutrition labeling in compliance with § 101.9, except that any multiunit retail package in which it is contained shall bear nutrition labeling
    if required by § 101.9; and any vending machine in which it is contained shall bear nutrition labeling if nutrition labeling is not present on the bottle or closure, if required by § 101.9.

    (

    2

    ) All other information pursuant to this section shall appear on the top of the bottle closure prominently and conspicuously in letters and/or numbers no less than one thirty-second inch in height,
    except that if the information required by § 101.5 is placed on the side of the closure in accordance with § 1.24(a)(5)(ii) of this chapter, such information shall appear in letters and/or numbers no
    less than one-sixteenth inch in height.

    (

    3

    ) Upon the petition of any interested person demonstrating that the bottle closure is too small to accommodate this information, the Commissioner may by regulation establish an alternative method of
    disseminating such information. Information appearing on the closure shall appear in the following priority:

    (

    i

    ) The statement of ingredients.

    (

    ii

    ) The name and address of the manufacturer, packer, or distributor.

    (

    iii

    ) The statement of identity.

    (2) Individual serving-size packages of food served with meals in restaurants, institutions, and on board passenger carriers, and not intended for sale at retail, are exempt from type-size requirements
    of this paragraph, provided:

    (i) The package has a total area of 3 square inches or less available to bear labeling;

    (ii) There is insufficient area on the package available to print all required information in a type size of

    1/16

    inch in height;

    (iii) The information required by paragraph (b) of this section appears on the label in accordance with the provisions of this paragraph, except that the type size is not less than

    1/32

    inch in height.

    (d)(1) Except as provided by §§ 101.9(j)(13) and (j)(17) and 101.36(i)(2) and (i)(5), all information required to appear on the principal display panel or on the information panel under this section
    shall appear on the same panel unless there is insufficient space. In determining the sufficiency of the available space, except as provided by §§ 101.9(j)(17) and 101.36(i)(5), any vignettes, designs,
    and other nonmandatory label information shall not be considered. If there is insufficient space for all of this information to appear on a single panel, it may be divided between these two panels,
    except that the information required under any given section or part shall all appear on the same panel. A food whose label is required to bear the ingredient statement on the principal display panel
    may bear all other information specified in paragraph (b) of this section on the information panel.

    (2) Any food, not otherwise exempted in this section, if packaged in a container consisting of a separate lid and body, and bearing nutrition labeling pursuant to § 101.9, and if the lid qualifies for
    and is designed to serve as a principal display panel, shall be exempt from the placement requirements of this section in the following respects:

    (i) The name and place of business information required by § 101.5 shall not be required on the body of the container if this information appears on the lid in accordance with this section.

    (ii) The nutrition information required by § 101.9 shall not be required on the lid if this information appears on the container body in accordance with this section.

    (iii) The statement of ingredients required by § 101.4 shall not be required on the lid if this information appears on the container body in accordance with this section. Further, the statement of ingredients
    is not required on the container body if this information appears on the lid in accordance with this section.

    (e) All information appearing on the information panel pursuant to this section shall appear in one place without other intervening material.

    (f) If the label of any package of food is too small to accommodate all of the information required by §§ 101.4, 101.5, 101.8, 101.9, 101.13, 101.17, 101.36, subpart D of part 101, and part 105 of this
    chapter, the Commissioner may establish by regulation an acceptable alternative method of disseminating such information to the public, e.g., a type size smaller than one-sixteenth inch in height, or
    labeling attached to or inserted in the package or available at the point of purchase. A petition requesting such a regulation, as an amendment to this paragraph, shall be submitted under part 10 of
    this chapter.

    [42 FR 14308, Mar. 15, 1977, as amended at 42 FR 15673, Mar. 22, 1977; 42 FR 45905, Sept. 13, 1977; 42 FR 47191, Sept. 20, 1977; 44 FR 16006, Mar. 16, 1979; 49 FR 13339, Apr. 4, 1984; 53 FR 16068, May
    5, 1988; 58 FR 44030, Aug. 18, 1993; 60 FR 17205, Apr. 5, 1995; 62 FR 43074, Aug. 12, 1997; 62 FR 49847, Sept. 23, 1997; 63 FR 14817, Mar. 27, 1998; 81 FR 59131, Aug. 29, 2016]'
- id: art-4
  title: § 101.3
  text: '§ 101.3

    Identity labeling of food in packaged form.

    (a) The principal display panel of a food in package form shall bear as one of its principal features a statement of the identity of the commodity.

    (b) Such statement of identity shall be in terms of:

    (1) The name now or hereafter specified in or required by any applicable Federal law or regulation; or, in the absence thereof,

    (2) The common or usual name of the food; or, in the absence thereof,

    (3) An appropriately descriptive term, or when the nature of the food is obvious, a fanciful name commonly used by the public for such food.

    (c) Where a food is marketed in various optional forms (whole, slices, diced, etc.), the particular form shall be considered to be a necessary part of the statement of identity and shall be

    declared in letters of a type size bearing a reasonable relation to the size of the letters forming the other components of the statement of identity; except that if the optional form is visible through
    the container or is depicted by an appropriate vignette, the particular form need not be included in the statement. This specification does not affect the required declarations of identity under definitions
    and standards for foods promulgated pursuant to section 401 of the act.

    (d) This statement of identity shall be presented in bold type on the principal display panel, shall be in a size reasonably related to the most prominent printed matter on such panel, and shall be
    in lines generally parallel to the base on which the package rests as it is designed to be displayed.

    (e) Under the provisions of section 403(c) of the Federal Food, Drug, and Cosmetic Act, a food shall be deemed to be misbranded if it is an imitation of another food unless its label bears, in type
    of uniform size and prominence, the word “imitation” and, immediately thereafter, the name of the food imitated.

    (1) A food shall be deemed to be an imitation and thus subject to the requirements of section 403(c) of the act if it is a substitute for and resembles another food but is nutritionally inferior to
    that food.

    (2) A food that is a substitute for and resembles another food shall not be deemed to be an imitation provided it meets each of the following requirements:

    (i) It is not nutritionally inferior to the food for which it substitutes and which it resembles.

    (ii) Its label bears a common or usual name that complies with the provisions of § 102.5 of this chapter and that is not false or misleading, or in the absence of an existing common or usual name, an
    appropriately descriptive term that is not false or misleading. The label may, in addition, bear a fanciful name which is not false or misleading.

    (3) A food for which a common or usual name is established by regulation (e.g., in a standard of identity pursuant to section 401 of the act, in a common or usual name regulation pursuant to part 102
    of this chapter, or in a regulation establishing a nutritional quality guideline pursuant to part 104 of this chapter), and which complies with all of the applicable requirements of such regulation(s),
    shall not be deemed to be an imitation.

    (4) Nutritional inferiority includes:

    (i) Any reduction in the content of an essential nutrient that is present in a measurable amount, but does not include a reduction in the caloric or fat content provided the food is labeled pursuant
    to the provisions of § 101.9, and provided the labeling with respect to any reduction in caloric content complies with the provisions applicable to caloric content in part 105 of this chapter.

    (ii) For the purpose of this section, a measurable amount of an essential nutrient in a food shall be considered to be 2 percent or more of the Daily Reference Value (DRV) of protein listed under § 101.9(c)(7)(iii)
    and of potassium listed under § 101.9(c)(9) per reference amount customarily consumed and 2 percent or more of the Reference Daily Intake (RDI) of any vitamin or mineral listed under § 101.9(c)(8)(iv)
    per reference amount customarily consumed, except that selenium, molybdenum, chromium, and chloride need not be considered.

    (iii) If the Commissioner concludes that a food is a substitute for and resembles another food but is inferior to the food imitated for reasons other than those set forth in this paragraph, he may propose
    appropriate revisions to this regulation or he may propose a separate regulation governing the particular food.

    (f) A label may be required to bear the percentage(s) of a characterizing ingredient(s) or information concerning the presence or absence of an ingredient(s) or the need to add an ingredient(s) as part
    of the common or usual name of the food pursuant to subpart B of part 102 of this chapter.

    (g) Dietary supplements shall be identified by the term “dietary supplement” as a part of the statement of identity, except that the word “dietary” may be deleted and replaced by the name of the dietary
    ingredients in the product (e.g., calcium supplement) or an appropriately descriptive term

    indicating the type of dietary ingredients that are in the product (e.g., herbal supplement with vitamins).

    [42 FR 14308, Mar. 15, 1977, as amended at 48 FR 10811, Mar. 15, 1983; 58 FR 2227, Jan. 6, 1993; 60 FR 67174, Dec. 28, 1995; 62 FR 49847, Sept. 23, 1997]'
- id: art-5
  title: § 101.4
  text: '§ 101.4

    Food; designation of ingredients.

    (a)(1) Ingredients required to be declared on the label or labeling of a food, including foods that comply with standards of identity, except those ingredients exempted by § 101.100, shall be listed
    by common or usual name in descending order of predominance by weight on either the principal display panel or the information panel in accordance with the provisions of § 101.2, except that ingredients
    in dietary supplements that are listed in the nutrition label in accordance with § 101.36 need not be repeated in the ingredient list. Paragraph (g) of this section describes the ingredient list on
    dietary supplement products.

    (2) The descending order of predominance requirements of paragraph (a)(1) of this section do not apply to ingredients present in amounts of 2 percent or less by weight when a listing of these ingredients
    is placed at the end of the ingredient statement following an appropriate quantifying statement, e.g., “Contains __ percent or less of ______” or “Less than __ percent of ______.” The blank percentage
    within the quantifying statement shall be filled in with a threshold level of 2 percent, or, if desired, 1.5 percent, 1.0 percent, or 0.5 percent, as appropriate. No ingredient to which the quantifying
    phrase applies may be present in an amount greater than the stated threshold.

    (b) The name of an ingredient shall be a specific name and not a collective (generic) name, except that:

    (1) Spices, flavorings, colorings and chemical preservatives shall be declared according to the provisions of § 101.22.

    (2) An ingredient which itself contains two or more ingredients and which has an established common or usual name, conforms to a standard established pursuant to the Meat Inspection or Poultry Products
    Inspection Acts by the U.S. Department of Agriculture, or conforms to a definition and standard of identity established pursuant to section 401 of the Federal Food, Drug, and Cosmetic Act, shall be
    designated in the statement of ingredients on the label of such food by either of the following alternatives:

    (i) By declaring the established common or usual name of the ingredient followed by a parenthetical listing of all ingredients contained therein in descending order of predominance except that, if the
    ingredient is a food subject to a definition and standard of identity established in subchapter B of this chapter that has specific labeling provisions for optional ingredients, optional ingredients
    may be declared within the parenthetical listing in accordance with those provisions.

    (ii) By incorporating into the statement of ingredients in descending order of predominance in the finished food, the common or usual name of every component of the ingredient without listing the ingredient
    itself.

    (3) Skim milk, concentrated skim milk, reconstituted skim milk, and nonfat dry milk may be declared as “skim milk” or “nonfat milk”.

    (4) Milk, concentrated milk, reconstituted milk, and dry whole milk may be declared as “milk”.

    (5) Bacterial cultures may be declared by the word “cultured” followed by the name of the substrate, e.g., “made from cultured skim milk or cultured buttermilk”.

    (6) Sweetcream buttermilk, concentrated sweetcream buttermilk, reconstituted sweetcream buttermilk, and dried sweetcream buttermilk may be declared as “buttermilk”.

    (7) Whey, concentrated whey, reconstituted whey, and dried whey may be declared as “whey”.

    (8) Cream, reconstituted cream, dried cream, and plastic cream (sometimes known as concentrated milk fat) may be declared as “cream”.

    (9) Butteroil and anhydrous butterfat may be declared as “butterfat”.

    (10) Dried whole eggs, frozen whole eggs, and liquid whole eggs may be declared as “eggs”.

    (11) Dried egg whites, frozen egg whites, and liquid egg whites may be declared as “egg whites”.

    (12) Dried egg yolks, frozen egg yolks, and liquid egg yolks may be declared as “egg yolks”.

    (13) [Reserved]

    (14) Each individual fat and/or oil ingredient of a food intended for human consumption shall be declared by its specific common or usual name (e.g., “beef fat”, “cottonseed oil”) in its order of predominance
    in the food except that blends of fats and/or oils may be designated in their order of predominance in the foods as “______ shortening” or “blend of ______ oils”, the blank to be filled in with the
    word “vegetable”, “animal”, “marine”, with or without the terms “fat” or “oils”, or combination of these, whichever is applicable if, immediately following the term, the common or usual name of each
    individual vegetable, animal, or marine fat or oil is given in parentheses, e.g., “vegetable oil shortening (soybean and cottonseed oil)”. For products that are blends of fats and/or oils and for foods
    in which fats and/or oils constitute the predominant ingredient, i.e., in which the combined weight of all fat and/or oil ingredients equals or exceeds the weight of the most predominant ingredient
    that is not a fat or oil, the listing of the common or usual names of such fats and/or oils in parentheses shall be in descending order of predominance. In all other foods in which a blend of fats and/or
    oils is used as an ingredient, the listing of the common or usual names in parentheses need not be in descending order of predominance if the manufacturer, because of the use of varying mixtures, is
    unable to adhere to a constant pattern of fats and/or oils in the product. If the fat or oil is completely hydrogenated, the name shall include the term

    hydrogenated,

    or if partially hydrogenated, the name shall include the term

    partially hydrogenated.

    If each fat and/or oil in a blend or the blend is completely hydrogenated, the term “hydrogenated” may precede the term(s) describing the blend, e.g., “hydrogenated vegetable oil (soybean, cottonseed,
    and palm oils)”, rather than preceding the name of each individual fat and/or oil; if the blend of fats and/or oils is partially hydrogenated, the term “partially hydrogenated” may be used in the same
    manner. Fat and/or oil ingredients not present in the product may be listed if they may sometimes be used in the product. Such ingredients shall be identified by words indicating that they may not be
    present, such as “or”, “and/or”, “contains one or more of the following:”, e.g., “vegetable oil shortening (contains one or more of the following: cottonseed oil, palm oil, soybean oil)”. No fat or
    oil ingredient shall be listed unless actually present if the fats and/or oils constitute the predominant ingredient of the product, as defined in this paragraph (b)(14).

    (15) When all the ingredients of a wheat flour are declared in an ingredient statement, the principal ingredient of the flour shall be declared by the name(s) specified in §§ 137.105, 137.200, 137.220
    and 137.225 of this chapter, i.e., the first ingredient designated in the ingredient list of flour, or bromated flour, or enriched flour, or self-rising flour is “flour”, “white flour”, “wheat flour”,
    or “plain flour”; the first ingredient designated in the ingredient list of durum flour is “durum flour”; the first ingredient designated in the ingredient list of whole wheat flour, or bromated whole
    wheat flour is “whole wheat flour”, “graham flour”, or “entire wheat flour”; and the first ingredient designated in the ingredient list of whole durum wheat flour is “whole durum wheat flour”.

    (16) Ingredients that act as leavening agents in food may be declared in the ingredient statement by stating the specific common or usual name of each individual leavening agent in parentheses following
    the collective name “leavening”, e.g., “leavening (baking soda, monocalcium phosphate, and calcium carbonate)”. The listing of the common or usual name of each individual leavening agent in parentheses
    shall be in descending order of predominance:

    Except,

    That if the manufacturer is unable to adhere to a constant pattern of leavening agents in the product, the listing of individual leavening agents need not be in descending order of predominance. Leavening
    agents not present in the product may be listed if they are sometimes used in the product. Such ingredients shall be identified by words indicating that they may not be present, such as

    “or”, “and/or”, “contains one or more of the following:”.

    (17) Ingredients that act as yeast nutrients in foods may be declared in the ingredient statement by stating the specific common or usual name of each individual yeast nutrient in parentheses following
    the collective name “yeast nutrients”, e.g., “yeast nutrients (calcium sulfate and ammonium phosphate)”. The listing of the common or usual name of each individual yeast nutrient in parentheses shall
    be in descending order of predominance:

    Except,

    That if the manufacturer is unable to adhere to a constant pattern of yeast nutrients in the product, the listing of the common or usual names of individual yeast nutrients need not be in descending
    order of predominance. Yeast nutrients not present in the product may be listed if they are sometimes used in the product. Such ingredients shall be identified by words indicating that they may not
    be present, such as “or”, “and/or”, or “contains one or more of the following:”.

    (18) Ingredients that act as dough conditioners may be declared in the ingredient statement by stating the specific common or usual name of each individual dough conditioner in parentheses following
    the collective name “dough conditioner”, e.g., “dough conditioners (L-cysteine, ammonium sulfate)”. The listing of the common or usual name of each dough conditioner in parentheses shall be in descending
    order of predominance:

    Except,

    That if the manufacturer is unable to adhere to a constant pattern of dough conditioners in the product, the listing of the common or usual names of individual dough conditioners need not be in descending
    order of predominance. Dough conditioners not present in the product may be listed if they are sometimes used in the product. Such ingredients shall be identified by words indicating that they may not
    be present, such as “or”, “and/or”, or “contains one or more of the following:”.

    (19) Ingredients that act as firming agents in food (e.g., salts of calcium and other safe and suitable salts in canned vegetables) may be declared in the ingredient statement, in order of predominance
    appropriate for the total of all firming agents in the food, by stating the specific common or usual name of each individual firming agent in descending order of predominance in parentheses following
    the collective name “firming agents”. If the manufacturer is unable to adhere to a constant pattern of firming agents in the food, the listing of the individual firming agents need not be in descending
    order of predominance. Firming agents not present in the product may be listed if they are sometimes used in the product. Such ingredients shall be identified by words indicating that they may not be
    present, such as “or”, “and/or”, “contains one or more of the following:”.

    (20) For purposes of ingredient labeling, the term

    sugar

    shall refer to sucrose, which is obtained from sugar cane or sugar beets in accordance with the provisions of § 184.1854 of this chapter.

    (21) [Reserved]

    (22) Wax and resin ingredients on fresh produce when such produce is held for retail sale, or when held for other than retail sale by packers or repackers shall be declared collectively by the phrase
    “coated with food-grade animal-based wax, to maintain freshness” or the phrase “coated with food-grade vegetable-, petroleum-, beeswax-, and/or shellac-based wax or resin, to maintain freshness” as
    appropriate. The terms “food-grade” and “to maintain freshness” are optional. The term

    lac-resin

    may be substituted for the term

    shellac.

