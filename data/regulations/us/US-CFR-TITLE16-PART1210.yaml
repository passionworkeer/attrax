- id: art-2
  title: § 1210.1
  text: '§ 1210.1

    Scope, application, and effective date.

    This part 1210, a consumer product safety standard, prescribes requirements for disposable and novelty lighters. These requirements are intended to make the lighters subject to the standard''s provisions
    resistant to successful operation by children younger than 5 years of age. This standard applies to all disposable and novelty lighters, as defined in § 1210.2, that are manufactured or imported after
    July 12, 1994.'
- id: art-3
  title: § 1210.2
  text: '§ 1210.2

    Definitions.

    As used in this part 1210:

    (a)

    Cigarette lighter.

    See

    Lighter.

    (b)

    Disposable lighter

    —means a lighter that either is:

    (1) Not refillable with fuel or

    (2)(i) Its fuel is butane, isobutane, propane, or other liquified hydrocarbon, or a mixture containing any of these, whose vapor pressure at 75 °F (24 °C) exceeds a gage pressure of 15 psi (103 kPa),
    and

    (ii) It has a Customs Valuation or ex-factory price under $2.00, as adjusted every 5 years, to the nearest $0.25, in accordance with the percentage changes in the appropriate monthly Producer Price
    Index (Producer Price Index for Miscellaneous Fabricated Products) from June 1993. The adjusted figure, based on the change in that Index since June 1993, is $2.75.

    (c)

    Lighter,

    also referred to as

    cigarette lighter,

    means a flame-producing product commonly used by consumers to ignite cigarettes, cigars, and pipes, although they may be used to ignite other materials. This term does not include matches or any other
    lighting device intended primarily for igniting materials other than smoking materials, such as fuel for fireplaces or for charcoal or gas-fired grills. When used in this part 1210, the term

    lighter

    includes only the disposable and novelty lighters to which this regulation applies.

    (d)

    Novelty lighter

    means a lighter that has entertaining audio or visual effects, or that depicts (logos, decals, art work, etc.) or resembles in physical form or function articles commonly recognized as appealing to
    or intended for use by children under 5 years of age. This includes, but is not limited to, lighters that depict or resemble cartoon characters, toys, guns, watches, musical instruments, vehicles, toy
    animals, food or beverages, or that play musical notes or have flashing lights or other entertaining features. A novelty lighter may operate on any fuel, including butane or liquid fuel.

    (e)

    Successful operation

    means one signal of any duration from a surrogate lighter within either of the two 5-minute test periods specified in § 1210.4(f).

    (f)

    Surrogate lighter

    means a device that: approximates the appearance, size, shape, and weight of, and is identical in all other factors that affect child resistance (including operation and the force(s) required for operation),
    within reasonable manufacturing tolerances, to, a lighter intended for use by consumers; has no fuel; does not produce a flame; and produces an audible or visual signal that will be clearly discernible
    when the surrogate lighter is activated in each manner that would normally produce a flame in a production lighter. (This definition does not require a lighter to be modified with electronics or the
    like to produce a signal. Manufacturers may use a lighter without fuel as a surrogate lighter if a distinct signal such as a “click” can be heard clearly when the mechanism is operated in each manner
    that would produce a flame in a production lighter and if a flame cannot be produced in a production lighter without the signal.

    But see'
- id: art-4
  title: § 1210.4(f)(1).)
  text: '§ 1210.4(f)(1).)

    (g)

    Model

    means one or more cigarette lighters from the same manufacturer or importer that do not differ in design or other characteristics in any manner that may affect child-resistance. Lighter characteristics
    that may affect child-resistance include, but are not limited to, size, shape, case material, and ignition mechanism (including child-resistant features).

    [58 FR 37584, July 12, 1993, as amended at 69 FR 19763, Apr. 14, 2004; 78 FR 52679, Aug. 26, 2013; 83 FR 62241, Dec. 3, 2018]'
- id: art-5
  title: § 1210.3
  text: '§ 1210.3

    Requirements for cigarette lighters.

    (a) A lighter subject to this part 1210 shall be resistant to successful operation by at least 85 percent of the child-test panel when tested in the manner prescribed by § 1210.4.

    (b) The mechanism or system of a lighter subject to this part 1210 that makes the product resist successful operation by children must:

    (1) Reset itself automatically after each operation of the ignition mechanism of the lighter,

    (2) Not impair safe operation of the lighter when used in a normal and convenient manner,

    (3) Be effective for the reasonably expected life of the lighter, and

    (4) Not be easily overriden or deactivated.'
- id: art-6
  title: § 1210.4
  text: '§ 1210.4

    Test protocol.

    (a)

    Child test panel.

    (1) The test to determine if a lighter is resistant to successful operation by children uses a panel of children to test a surrogate lighter representing the production lighter intended for use. Written
    informed consent shall be obtained from a parent or legal guardian of a child before the child participates in the test.

    (2) The test shall be conducted using at least one, but no more than two, 100-child test panels in accordance with the provisions of § 1210.4(f).

    (3) The children for the test panel shall live within the United States.

    (4) The age and sex distribution of each 100-child panel shall be:

    (i) 30 + or- 2 children (20 + or- 1 males; 10 + or- 1 females) 42 through 44 months old;

    (ii) 40 + or- 2 children (26 + or- 1 males; 14 + or- 1 females) 45 through 48 months old;

    (iii) 30 + or- 2 children (20 + or- 1 males; 10 + or- 1 females) 49 through 51 months old.

    Note: To calculate a child''s age in months:

    1. Subtract the child''s birth date from the test date.

