    not

    add or subtract 1 month.

    (5) No child with a permanent or temporary illness, injury, or handicap that would interfere with the child''s ability to operate the surrogate lighter shall be selected for participation.

    (6) Two children at a time shall participate in testing of surrogate lighters. Extra children whose results will not be counted in the test may be used if necessary to provide the required partner for
    test subjects, if the extra children are within the required age range and a parent or guardian of each such child has signed a consent form.

    (7) No child shall participate in more than one test panel or test more than one surrogate lighter. No child shall participate in both child-resistant package testing and surrogate lighter testing on
    the same day.

    (b)

    Test sites, environment, and adult testers.

    (1) Surrogate lighters shall be tested within the United States at 5 or more test sites throughout the geographical area for each 100-child panel if the sites are the customary nursery schools or day
    care centers of the participating children. No more than 20 children shall be tested at each site. In the alternative, surrogate lighters may be tested within the United States at one or more central
    locations, provided the participating children are drawn from a variety of locations within the geographical area.

    (2) Testing of surrogate lighters shall be conducted in a room that is familiar to the children on the test panel (for example, a room the children frequent at their customary nursery school or day
    care center). If the testing is conducted in a room that initially is unfamiliar to the children (for example, a room at a central location), the tester shall allow at least 5 minutes for the children
    to become accustomed to the new environment before starting the test. The area in which the testing is conducted shall be well-lighted and isolated from distractions. The children shall be allowed freedom
    of movement to work with their surrogate lighters, as long as the tester can watch both children at the same time. Two children at a time shall participate in testing of surrogate lighters. The children
    shall be seated side by side in chairs approximately 6 inches apart, across a table from the tester. The table shall be normal table height for the children, so that they can sit up at the table with
    their legs underneath and so that their arms will be at a comfortable height when on top of the table. The children''s chairs shall be “child-size.”

    (3) Each tester shall be at least 18 years old. Five or 6 adult testers shall be used for each 100-child test panel. Each tester shall test an approximately equal number of children from a 100-child
    test panel (20 + or- 2 children each for 5 testers and 17 + or- 2 children each for 6 testers).

    Note:

    When a test is initiated with five testers and one tester drops out, a sixth tester may be added to complete the testing. When a test is initiated with six testers and one tester drops out, the test
    shall be completed using the five remaining testers. When a tester drops out, the requirement for each tester to test an approximately equal number of children does not apply to that tester. When testing
    is initiated with five testers, no tester shall test more than 19 children until it is certain that the test can be completed with five testers.

    (c)

    Surrogate lighters.

    (1) Six surrogate lighters shall be used for each 100-child panel. The six lighters shall represent the range of forces required for operation of lighters intended for use. All surrogate lighters shall
    be the same color. The surrogate lighters shall be labeled with sequential numbers beginning with the number one. The same six surrogate lighters shall be used for the entire 100-child panel. The surrogate
    lighters may be used in more than one 100-child panel test. The surrogate lighters shall not be damaged or jarred during storage or transportation. The surrogate lighters shall not be exposed to extreme
    heat or cold. The surrogate lighters shall be tested at room temperature. No surrogate lighter shall be left unattended.

    (2) Each surrogate lighter shall be tested by an approximately equal number of children in a 100-child test panel (17 + or- 2 children).

    Note:

    If a surrogate lighter is permanently damaged, testing shall continue with the remaining lighters. When a lighter is dropped out, the requirement that each lighter be tested by an approximately equal
    number of children does not apply to that lighter.

    (3) Before each 100-child panel is tested, each surrogate lighter shall be examined to verify that it approximates the appearance, size, shape, and weight of a production lighter intended for use.

    (4) Before and after each 100-child panel is tested, force measurements shall be taken on all operating components that could affect child resistance to verify that they are within reasonable operating
    tolerances for a production lighter intended for use.

    (5) Before and after testing surrogate lighters with each child, each surrogate lighter shall be operated outside the presence of any child participating in the test to verify that the lighters produce
    a signal. If the surrogate lighter will not produce a signal before the test, it shall be repaired before it is used in testing. If the surrogate lighter does not produce a signal when it is operated
    after the test, the results for the preceding test with that lighter shall be eliminated. The lighter shall be repaired and tested with another eligible child (as one of a pair of children) to complete
    the test panel.

    (d)

    Encouragement.

    (1) Prior to the test, the tester shall talk to the children in a normal and friendly tone to make them feel at ease and to gain their confidence.

    (2) The tester shall tell the children that he or she needs their help for a special job. The children shall not be promised a reward of any kind for participating, and shall not be told that the test
    is a game or contest or that it is fun.

    (3) The tester shall not discourage a child from attempting to operate the surrogate lighter at any time unless a child is in danger of hurting himself or another child. The tester shall not discuss
    the dangers of lighters or matches with the children to be tested prior to the end of the 10-minute test.

    (4) Whenever a child has stopped attempting to operate the surrogate lighter for a period of approximately one minute, the tester shall encourage the child to try by saying “keep trying for just a little
    longer.”

    (5) Whenever a child says that his or her parent, grandparent, guardian, etc., said never to touch lighters, say “that''s right — never touch a real lighter — but your [parent, etc.] said it was OK
    for you to try to make a noise with this special lighter because it can''t hurt you.”

    (6) The children in a pair being tested may encourage each other to operate the surrogate lighter and may tell or show each other how to operate it. (This interaction is

    not

    considered to be disruption as described in paragraph (e)(2) below.) However, neither child shall be allowed to operate the other child''s lighter. If one child takes the other child''s surrogate lighter,
    that surrogate lighter shall be immediately returned to the proper child. If this occurs, the tester shall say “No. He(she) has to try to do it himself(herself).”

    (e)

    Children who refuse to participate.

    (1) If a child becomes upset or afraid, and cannot be reassured before the test starts, select another eligible child for participation in that pair.

    (2) If a child disrupts the participation of another child for more than one minute during the test, the test shall be stopped and both children eliminated from the results. An explanation shall be
    recorded on the data collection record. These two children should be replaced with other eligible children to complete the test panel.

    (3) If a child is not disruptive but refuses to attempt to operate the surrogate lighter throughout the entire test period, that child shall be eliminated from the test results and an explanation shall
    be recorded on the data collection record. The child shall be replaced with another eligible child (as one of a pair of children) to complete the test panel.

    (f)

    Test procedure.

    (1) To begin the test, the tester shall say “I have a special lighter that will not make a flame. It makes a noise like this.” Except where doing so would block the child''s view of a visual signal,
    the adult tester shall place a 8

    1/2

    by 11 inch sheet of cardboard or other rigid opaque material upright on the table in front of the surrogate lighter, so that the surrogate lighter cannot be seen by the child, and shall operate the
    surrogate lighter once to produce its signal. The tester shall say “Your parents [or other guardian, if applicable] said it is OK for you to try to make that noise with your lighter.” The tester shall
    place a surrogate lighter in each child''s hand and say “now

    you

    try to make a noise with your lighter. Keep trying until I tell you to stop.”

    (2) The adult tester shall observe the children for 5 minutes to determine if

    either or both of the children can successfully operate the surrogate lighter by producing one signal of any duration. If a child achieves a spark without defeating the child-resistant feature, say
    “that''s a spark — it won''t hurt you — try to make the noise with your lighter.” If any child successfully operates the surrogate lighter during this period, the surrogate lighter shall be taken from
    that child and the child shall not be asked to try to operate the lighter again. The tester shall ask the successful child to remain until the other child is finished.

    (3) If either or both of the children are unable to successfully operate the surrogate lighter during the 5-minute period specified in § 1210.4(f)(2), the adult tester shall demonstrate the operation
    of the surrogate lighter. To conduct the demonstration, secure the children''s full attention by saying “Okay, give me your lighters now.” Take the lighters and place them on the table in front of you
    out of the children''s reach. Then say, “I''ll show you how to make the noise with your lighters. First I''ll show you with (child''s name)''s lighter and then I''ll show you with (child''s name)''s
    lighter.” Pick up the first child''s lighter. Hold the lighter approximately two feet in front of the children at their eye level. Hold the lighter in a vertical position in one hand with the child-resistant
