- id: art-10
  title: Section 14(a) of the Consumer Product Safety Act (CPSA), 15 U.S.C. 1263(a), requires every manufacturer, private labeler, or importer of a product that is subject to a consumer product safety standard
  text: Section 14(a) of the Consumer Product Safety Act (CPSA), 15 U.S.C. 1263(a), requires every manufacturer, private labeler, or importer of a product that is subject to a consumer product safety standard
    and that is distributed in commerce to issue a certificate that such product conforms to the applicable standard and to base that certificate upon a test of each item or upon a reasonable testing program.
    The purpose of this subpart B of part 1210 is to establish requirements that manufacturers, importers, and private labelers must follow to certify that their products comply with the Safety Standard
    for Cigarette Lighters. This subpart B describes the minimum features of a reasonable testing program and includes requirements for labeling, recordkeeping, and reporting pursuant to sections 14, 16(b),
    17(g), and 27(e) of the CPSA, 15 U.S.C. 2063, 2065(b), 2066(g), and 2076(e).
- id: art-11
  title: § 1210.12
  text: '§ 1210.12

    Certificate of compliance.

    (a)

    General requirements

    —(1)

    Manufacturers (including importers).

    Manufacturers of any lighter subject to the standard must issue the certificate of compliance required by section 14(a) of the CPSA and this subpart B, based on a reasonable testing program or a test
    of each product, as required by §§ 1210.13-1210.14 and 1210.16. Manufacturers must also label each lighter subject to the standard as required by paragraph (c) of this section and keep the records and
    make the reports required by §§ 1210.15 and 1210.17. For purposes of this requirement, an importer of lighters shall be considered the “manufacturer.”

    (2)

    Private labelers.

    Because private labelers necessarily obtain their products from a manufacturer or importer that is already required to issue the certificate, private labelers are not required to issue a certificate.
    However, private labelers must ensure that the lighters are labeled in accordance with paragraph (c) of this section and that any certificate of compliance that is supplied with each shipping unit of
    lighters in accordance with paragraph (b) of this section is supplied to any distributor or retailer who receives the product from the private labeler.

    (3)

    Testing on behalf of importers.

