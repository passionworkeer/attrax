- id: art-5
  title: § 701.9
  text: '§ 701.9

    Exemptions from labeling requirements.

    (a) Except as provided by paragraphs (b) and (c) of this section, a shipment or other delivery of a cosmetic which is, in accordance with the practice of the trade, to be processed, labeled, or repacked
    in substantial quantity at an establishment other than that where originally processed or packed, shall be exempt, during the time of introduction into and movement in interstate commerce and the time
    of holding in such establishment, from compliance with the labeling requirements of sections 601(a) and 602(b) of the act if:

    (1) The person who introduced such shipment or delivery into interstate commerce is the operator of the establishment where such cosmetic is to be processed, labeled, or repacked; or

    (2) In case such person is not such operator, such shipment or delivery is made to such establishment under a written agreement, signed by and containing the post office addresses of such person and
    such operator, and containing such specifications for the processing, labeling, or repacking, as the case may be, of such cosmetic in such establishment as will insure, if such specifications are followed,
    that such cosmetic will not be adulterated or misbranded within the meaning of the act upon completion of such processing, labeling, or repacking. Such person and such operator shall each keep a copy
    of such agreement until 2 years after the final shipment or delivery of such cosmetic from such establishment, and shall make such copies available for inspection at any reasonable hour to any officer
    or employee of the Department who requests them.

    (b) An exemption of a shipment or other delivery of a cosmetic under paragraph (a)(1) of this section shall, at the beginning of the act of removing such shipment or delivery, or any part thereof, from
    such establishment, become void ab initio if the cosmetic comprising such shipment, delivery, or part is adulterated or misbranded within the meaning of the act when so removed.

    (c) An exemption of a shipment or other delivery of a cosmetic under paragraph (a)(2) of this section shall become void ab initio with respect to the person who introduced such shipment or delivery
    into interstate commerce upon refusal by such person to make available for inspection a copy of the agreement, as required by such clause.

    (d) An exemption of a shipment or other delivery of a cosmetic under paragraph (a)(2) of this section shall expire:

    (1) At the beginning of the act of removing such shipment or delivery, or

    any part thereof, from such establishment if the cosmetic comprising such shipment, delivery, or part is adulterated or misbranded within the meaning of the act when so removed; or

    (2) Upon refusal by the operator of the establishment where such cosmetic is to be processed, labeled, or repacked, to make available for inspection a copy of the agreement, as required by such clause.

    Subpart B—Package Form'
- id: art-6
  title: § 701.10
  text: '§ 701.10

    Principal display panel.

    The term

    principal display panel

    as it applies to cosmetics in package form and as used in this part, means the part of a label that is most likely to be displayed, presented, shown, or examined under customary conditions of display
    for retail sale. The principal display panel shall be large enough to accommodate all the mandatory label information required to be placed thereon by this part with clarity and conspicuousness and
    without obscuring designs, vignettes, or crowding. Where packages bear alternate principal display panels, information required to be placed on the principal display panel shall be duplicated on each
    principal display panel. For the purpose of obtaining uniform type size in declaring the quantity of contents of all packages of substantially the same size, the term “area of the principal display
    panel” means the area of the side or surface that bears the principal display panel, which area shall be:

    (a) In the case of a rectangular package where one entire side properly can be considered to be the principal display panel side, the product of the height times the width of that side;

    (b) In the case of a cylindrical or nearly cylindrical container, 40 percent of the product of the height of the container times the circumference; and

    (c) In the case of any other shape of container, 40 percent of the total surface of the container:

    Provided, however,

    That where such container presents an obvious “principal display panel” such as the top of a triangular or circular package, the area shall consist of the entire top surface.

    In determining the area of the principal display panel, exclude tops, bottoms, flanges at the tops and bottoms of cans, and shoulders and necks of bottles or jars. In the case of cylindrical or nearly
    cylindrical containers, information required by this part to appear on the principal display panel shall appear within that 40 percent of the circumference which is most likely to be displayed, presented,
    shown, or examined under customary conditions of display for retail sale.'
- id: art-7
  title: § 701.11
  text: '§ 701.11

    Identity labeling.

    (a) The principal display panel of a cosmetic in package form shall bear as one of its principal features a statement of the identity of the commodity.

    (b) Such statement of identity shall be in terms of:

    (1) The common or usual name of the cosmetic; or

    (2) An appropriately descriptive name or, when the nature of the cosmetic is obvious, a fanciful name understood by the public to identify such cosmetic; or

    (3) An appropriate illustration or vignette representing the intended cosmetic use.

    (c) The statement of identity shall be presented in bold type on the principal display panel, shall be in a size reasonably related to the most prominent printed matter on such panel, and shall be in
    lines generally parallel to the base on which the package rests as it is designed to be displayed.'
- id: art-8
  title: § 701.12
  text: '§ 701.12

    Name and place of business of manufacturer, packer, or distributor.

    (a) The label of a cosmetic in package form shall specify conspicuously the name and place of business of the manufacturer, packer, or distributor.

    (b) The requirement for declaration of the name of the manufacturer, packer, or distributor shall be deemed to be satisfied in the case of a corporation only by the actual corporate name, which may
    be preceded or followed by the name of the particular division of the corporation. Abbreviations for “Company,” “Incorporated,” etc., may be used and “The” may be omitted. In the case of an individual,
    partnership, or association, the name under which the business is conducted shall be used.

    (c) Where the cosmetic is not manufactured by the person whose name appears on the label, the name shall be qualified by a phrase that reveals the connection such person has with such cosmetic; such
    as, “Manufactured for _______”, “Distributed by ________”, or any other wording that expresses the facts.

    (d) The statement of the place of business shall include the street address, city, State, and ZIP Code; however, the street address may be omitted if it is shown in a current city directory or telephone
    directory. The requirement for inclusion of the ZIP Code shall apply only to consumer commodity labels developed or revised after the effective date of this section. In the case of nonconsumer packages,
    the ZIP Code shall appear either on the label or the labeling (including the invoice).

    (e) If a person manufactures, packs, or distributes a cosmetic at a place other than his principal place of business, the label may state the principal place of business in lieu of the actual place
    where such cosmetic was manufactured or packed or is to be distributed, unless such statement would be misleading.'
- id: art-9
  title: § 701.13
  text: '§ 701.13

    Declaration of net quantity of contents.

    (a) The label of a cosmetic in package form shall bear a declaration of the net quantity of contents. This shall be expressed in terms of weight, measure, numerical count, or a combination of numerical
    count and weight or measure. The statement shall be in terms of fluid measure if the cosmetic is liquid or in terms of weight if the cosmetic is solid, semisolid, or viscous, or a mixture of solid and
    liquid. If there is a firmly established, general consumer usage and trade custom of declaring the net quantity of a cosmetic by numerical count, linear measure, or measure of area, such respective
    term may be used. If there is a firmly established, general consumer usage and trade custom of declaring the contents of a liquid cosmetic by weight, or a solid, semisolid, or viscous cosmetic by fluid
    measure, it may be used. Whenever the Commissioner determines for a specific packaged cosmetic that an existing practice of declaring net quantity of contents by weight, measure, numerical count, or
    a combination of these does not facilitate value comparisons by consumers, he shall by regulation designate the appropriate term or terms to be used for such cosmetic.

    (b) Statements of weight shall be in terms of avoirdupois pound and ounce. Statements of fluid measure shall be in terms of the U.S. gallon of 231 cubic inches and quart, pint, and fluid-ounce subdivisions
    thereof and shall express the volume at 68 °F. (20 °C.).

    (c) When the declaration of quantity of contents by numerical count, linear measure, or measure of area does not give accurate information as to the quantity of cosmetic in the package, it shall be
    augmented by such statement of weight, measure, or size of the individual units or the total weight or measure of the cosmetic as will give such information.

    (d) The declaration may contain common or decimal fractions. A common fraction shall be in terms of halves, quarters, eighths, sixteenths, or thirty-seconds; except that if there exists a firmly established,
    general consumer usage and trade custom of employing different common fractions in the net quantity declaration of a particular commodity they may be employed. A common fraction shall be reduced to
    its lowest terms; a decimal fraction shall not be carried out to more than two places. A statement that includes small fractions of an ounce shall be deemed to permit smaller variations than one which
    does not include such fractions.

    (e) The declaration shall be located on the principal display panel of the label; with respect to packages bearing alternate principal display panels, it shall be duplicated on each principal display
    panel:

    Provided,

    That:

    (1) The principal display panel of a cosmetic marketed in a “boudoir-type” container including decorative cosmetic containers of the “cartridge,” “pill box,” “compact,” or “pencil” variety, and those
    with a capacity of one-fourth ounce or less, may be considered to be a tear-away tag or tape affixed to the decorative container and bearing the mandatory label information as required by this part,
    but the type size of

    the net quantity of contents statement shall be governed by the dimensions of the decorative container; and

    (2) The principal display panel of a cosmetic marketed on a display card to which the immediate container is affixed may be considered to be the display panel of the card, and the type size of the net
    quantity of content statement is governed by the dimensions of the display card.

    (f) The declaration shall appear as a distinct item on the principal display panel, shall be separated (by at least a space equal to the height of the lettering used in the declaration) from other printed
    label information appearing above or below the declaration and (by at least a space equal to twice the width of the letter “N” of the style of type used in the quantity of contents statement) from other
    printed label information appearing to the left or right of the declaration. It shall not include any term qualifying a unit of weight, measure, or count (such as “giant pint” and “full quart”) that
    tends to exaggerate the amount of the cosmetic in the container. It shall be placed on the principal display panel within the bottom 30 percent of the area of the label panel in line generally parallel
    to the base on which the package rests as it is designed to be displayed:

    Provided,

    That:

    (1) On packages having a principal display panel of 5 square inches or less, the requirement for placement within the bottom 30 percent of the area of the label panel shall not apply when the declaration
    of net quantity of contents meets the other requirements of this part; and

    (2) In the case of a cosmetic that is marketed with both outer and inner retail containers bearing the mandatory label information required by this part, and the inner container is not intended to be
    sold separately, the net quantity of contents placement requirement of this section applicable to such inner containers is waived.

    (g) The declaration shall accurately reveal the quantity of cosmetic in the package exclusive of wrappers and other material packed therewith:

    Provided,

    That:

    (1) In the case of cosmetics packed in containers designed to deliver the cosmetic under pressure, the declaration shall state the net quantity of the contents that will be expelled when the instructions
    for use as shown on the container are followed. The propellant is included in the net quantity declaration; and

    (2) In the case of a package which contains the integral components making up a complete kit, and which is designed to deliver the components in the manner of an application (for example, a home permanent
    wave kit), the declaration may state the net quantity of the contents in nondeceptive terms of the number of applications available in the kit when the instructions for use as shown on the container
    are followed.

    (h) The declaration shall appear in conspicuous and easily legible boldface print or type in distinct contrast (by typography, layout, color, embossing, or molding) to other matter on the package; except
    that a declaration of net quantity blown, embossed, or molded on a glass or plastic surface is permissible when all label information is so formed on the surface. Requirements of conspicuousness and
    legibility shall include the specifications that:

    (1) The ratio of height to width (of the letter) shall not exceed a differential of 3 units to 1 unit (no more than 3 times as high as it is wide).

    (2) Letter heights pertain to upper case or capital letters. When upper and lower case or all lower case letters are used, it is the lower case letter “o” or its equivalent that shall meet the minimum
    standards.

    (3) When fractions are used, each component numeral shall meet one-half the minimum height standards.

    (i) The declaration shall be in letters and numerals in a type size established in relationship to the area of the principal display panel of the package and shall be uniform for all packages of substantially
    the same size by complying with the following type specifications:

    (1) Not less than one-sixteenth inch in height on packages the principal display panel of which has an area of 5 square inches or less.

    (2) Not less than one-eighth inch in height on packages the principal display panel of which has an area of more

    than 5 but not more than 25 square inches.

    (3) Not less than three-sixteenths inch in height on packages the principal display panel of which has an area of more than 25 but not more than 100 square inches.

    (4) Not less than one-fourth inch in height on packages the principal display panel of which has an area of more than 100 square inches, except not less than one-half inch in height if the area is more
    than 400 square inches.

