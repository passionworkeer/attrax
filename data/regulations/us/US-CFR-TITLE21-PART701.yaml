- id: art-2
  title: § 701.1
  text: '§ 701.1

    Misbranding.

    (a) Among representations in labeling of a cosmetic which render such cosmetic misbranded is a false or misleading representation with respect to another cosmetic or a food, drug, or device.

    (b) The labeling of a cosmetic which contains two or more ingredients may be misleading by reason (among other reasons) of the designation of such cosmetic in such labeling by a name which includes
    or suggests the name of one or more but not all such ingredients, even though the names of all such ingredients are stated elsewhere in the labeling.'
- id: art-3
  title: § 701.2
  text: '§ 701.2

    Form of stating labeling requirements.

    (a) A word, statement, or other information required by or under authority of the Act to appear on the label may lack that prominence and conspicuousness required by section 602(c) of the Act by reason
    (among other reasons) of:

    (1) The failure of such word, statement, or information to appear on the part or panel of the label which is presented or displayed under customary conditions of purchase;

    (2) The failure of such word, statement, or information to appear on two or more parts or panels of the label, each of which has sufficient space therefor, and each of which is so designed as to render
    it likely to be, under customary conditions of purchase, the part or panel displayed;

    (3) The failure of the label to extend over the area of the container or package available for such extension, so as to provide sufficient label space for the prominent placing of such word, statement,
    or information;

    (4) Insufficiency of label space (for the prominent placing of such word, statement, or information) resulting from the use of label space for any word, statement, design, or device which is not required
    by or under authority of the Act to appear on the label;

    (5) Insufficiency of label space (for the prominent placing of such word, statement, or information) resulting from the use of label space to give materially greater conspicuousness to any other word,
    statement, or information, or to any design or device;

    (6) Smallness or style of type in which such word, statement, or information appears, insufficient background contrast, obscuring designs or vignettes, or crowding with other written, printed, or graphic
    matter.

    (b)(1) All words, statements, and other information required by or under authority of the Act to appear on the label or labeling shall appear thereon in the English language:

    Provided, however,

    That in the case of articles distributed solely in the Commonwealth of Puerto Rico or in a Territory where the predominant language is one other than English, the predominant language may be substituted
    for English.

    (2) If the label contains any representation in a foreign language, all words, statements, and other information required by or under authority of the Act to appear on the label shall appear thereon
    in the foreign language.

    (3) If the labeling contains any representation in a foreign language, all words, statements, and other information required by or under authority of the Act to appear on the label or labeling shall
    appear on the labeling in the foreign language.'
- id: art-4
  title: § 701.3
  text: '§ 701.3

    Designation of ingredients.

    (a) The label on each package of a cosmetic shall bear a declaration of the name of each ingredient in descending order of predominance, except that fragrance or flavor may be listed as fragrance or
    flavor. An ingredient which is both fragrance and flavor shall be designated by each of the functions it performs unless such ingredient is identified by name. No ingredient may be designated as fragrance
    or flavor unless it is within the meaning of such term as commonly understood by consumers. Where one or more ingredients is accepted by the Food and Drug Administration as exempt from public disclosure
    pursuant to the procedure established in § 720.8(a) of this chapter, in lieu of label declaration of identity the phrase “and other ingredients” may be used at the end of the ingredient declaration.

    (b) The declaration of ingredients shall appear with such prominence and conspicuousness as to render it likely to be read and understood by ordinary individuals under normal conditions of purchase.
    The declaration shall appear on any appropriate information panel in letters not less than

    1/16

    of an inch in height and without obscuring design, vignettes, or crowding. In the absence of sufficient space for such declaration on the package, or where the manufacturer or distributor wishes to
    use a decorative container, the declaration may appear on a firmly affixed tag, tape, or card. In those cases where there is insufficient space for such declaration on the package, and it is not practical
    to firmly affix a tag, tape, or card, the Commissioner may establish

    by regulation an acceptable alternate, e.g., a smaller type size. A petition requesting such a regulation as an amendment to this paragraph shall be submitted pursuant to part 10 of this chapter.

    (c) A cosmetic ingredient shall be identified in the declaration of ingredients by:

    (1) The name specified in § 701.30 as established by the Commissioner for that ingredient for the purpose of cosmetic ingredient labeling pursuant to paragraph (e) of this section;

    (2) In the absence of the name specified in § 701.30, the name adopted for that ingredient in the following editions and supplements of the following compendia, listed in order as the source to be utilized:

    (i) CTFA (Cosmetic, Toiletry and Fragrance Association, Inc.) Cosmetic Ingredient Dictionary, Second Ed., 1977 (available from the Cosmetic, Toiletry and Fragrance Association, Inc. 1110 Vermont Ave.
    NW., Suite 800, Washington, DC 20005, or at the National Archives and Records Administration (NARA), which is incorporated by reference, except for the following deletions and revisions. (For information
    on the availability of this material at NARA, call 202-741-6030, or go to:

    http://www.archives.gov/federal_register/code_of_federal_regulations/ibr_locations.html.

    )

