    (3) In the absence of such a listing, the name generally recognized by consumers.

    (4) In the absence of any of the above, the chemical or other technical name or description.

    (d) Where a cosmetic product is also an over-the-counter drug product, the declaration shall declare the active drug ingredients as set forth in § 201.66(c)(2) and (d) of this chapter, and the declaration
    shall declare the cosmetic ingredients as set forth in § 201.66(c)(8) and (d) of this chapter.

    (e) Interested persons may submit a petition requesting the establishment of a specific name for a cosmetic ingredient pursuant to part 10 of this chapter. The Commissioner may also propose such a name
    on his own initiative.

    (f) As an alternative to listing all ingredients in descending order of predominance, ingredients may be grouped and the groups listed in the following manner and order:

    (1) Ingredients, other than color additives, present at a concentration greater than 1 percent, in descending order of predominance; followed by

    (2) Ingredients, other than color additives, present at a concentration of not more than 1 percent, without respect to order of predominance; followed by

    (3) Color additives, without respect to order of predominance. Ingredients specified in paragraph (f)(2) of this section may be included with those specified in paragraph (f)(1) of this section and
    listed in descending order of predominance.

    (g) A declaration of ingredients may include an ingredient not in the product if the ingredient is identified by the phrase “may contain” and:

    (1) It is a color additive added to some batches of the product for purposes of color matching; or

    (2)(i) The same declaration of ingredients is also used for other products similar in composition and intended for the same use, including products which may be assortments of products similar in composition
    and intended for the same use; and

    (ii) Such products are “shaded” products, i.e., those falling within the product categories identified in § 720.4 (c)(3), (7) and (8)(v) of this chapter; and

    (iii) All products sharing the common declaration of ingredients are sold by the labeler under a common trade name or brand designation, and no trade name or brand designation not common to all such
    products appears in the labeling of any of them; and

    (iv) The ingredient is a color additive.

    (h) As an alternative to a declaration of color additive ingredients for each product, the color additives of an assortment of cosmetic products that are sold together in the same package may be declared
    in a single composite list in a manner that is not misleading and that indicates that the list pertains to all the products.

    (i) As an alternative to the declaration of ingredients specified in paragraph (b) of this section, the declaration of ingredients may appear in letters not less than

    1/16

    of an inch in height in labeling accompanying the product, as for example, on padded sheets or in leaflets, if the total surface area of the package is less than 12 square inches. This paragraph is
    inapplicable to any packaged cosmetic product enclosed in an outer container, e.g., a folding carton. In addition, this paragraph is applicable only to cosmetic products meeting one of the following
    requirements:

    (1) The cosmetic products are held and displayed for sale in tightly compartmented trays or racks of a display unit. The holder of the labeling bearing the declaration of ingredients shall be attached
    to the display unit; or

    (2) The cosmetic products are “shaded” products, i.e., those falling within the product categories identified in § 720.4 (c)(3), (7) and (8)(v) of this chapter, and are held for sale in tightly compartmented
    trays or racks. The holder of the labeling bearing the declaration of ingredients shall be attached to a display chart bearing samples of the product shades, which is displayed to purchasers. Such a
    display chart shall be of such construction and design as to permit its continuous use as a display, such as on a counter, and shall be designed for the primary purpose of displaying samples of the
    shades of the products.

    (j) The holder of labeling bearing a declaration of ingredients and used in accordance with paragraph (i) of this section shall be attached to the display unit or chart and shall meet one of the following
    conditions:

    (1) The labeling is on the front of the display unit or chart and can be read in full by a purchaser facing the display unit or chart under customary conditions of retail sale; or

    (2) The labeling is on the front of the display unit or chart, is partially visible, and is accompanied by a conspicuous notice on the front of the display unit or chart describing the location of such
    labeling in letters not less than

    3/16

    of an inch in height, e.g., “Ingredient lists above”, that can be read by a purchaser facing the display unit or chart under customary conditions of retail sale, or by the notice required by provisions
    in paragraph (k)(3) of this section, if conspicuous at all times; or

    (3) The labeling is on a side of the display unit or chart, but not on the top, back, or bottom, and is accompanied by a conspicuous notice on the front of the display unit or chart describing the location
    of such labeling in letters not less than

    3/16

    of an inch in height, e.g., “Ingredient lists located on right side of display”, that can be read by a purchaser facing the display unit or chart under customary conditions of retail sale.

    (k) Any use of a display unit or chart bearing labeling under the provisions of paragraph (i) of this section shall meet the following requirements:

    (1) All articles of labeling bearing ingredient declarations and used in conjunction with any one display unit or chart shall be identical and shall declare the ingredients of all products sold in conjunction
