    PART 186—INDIRECT FOOD SUBSTANCES AFFIRMED AS GENERALLY RECOGNIZED AS SAFE

    Subpart A—General Provisions

    Sec.

    186.1

    Substances added indirectly to human food affirmed as generally recognized as safe (GRAS).

