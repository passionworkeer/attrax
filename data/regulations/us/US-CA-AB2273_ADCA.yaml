    The people of the State of California do enact as follows:'
- id: art-3
  title: SECTION 1.
  text: 'SECTION 1.

    (a) The Legislature hereby finds and declares all of the following:

    (1) The United Nations Convention on the Rights of the Child recognizes that children need special safeguards and care in all aspects of their lives.

    (2) As children spend more of their time interacting with the online world, the impact of the design of online products and services on children’s well-being has become a focus of significant concern.

    (3) There is bipartisan agreement at the international level, in both the United States and in the State of California, that more needs to be done to create a safer online

    space for children to learn, explore, and play.

    (4) Lawmakers around the globe have taken steps to enhance privacy protections for children on the understanding that, in relation to data protection, greater privacy necessarily means greater security
    and well-being.

    (5) Children should be afforded protections not only by online products and services specifically directed at them, but by all online products and services they are likely to access. In order to help
    support the design of online products, services, and features, businesses should take into account the unique needs of different age ranges, including the following developmental stages: 0 to 5 years
    of age or “preliterate and early literacy”; 6 to 9 years of age or “core primary school years”; 10 to 12 years of age or “transition years”; 13 to 15 years of age or “early teens”; and 16 to 17 years
    of age or “approaching

    adulthood.”

    (6) In 2019, 81 percent of voters said they wanted to prohibit companies from collecting personal information about children without parental consent, and a 2018 poll of Californian parents and teens
    found that only 36 percent of teenagers and 32 percent of parents say that social networking internet websites do a good job explaining what they do with users’ data.

    (7) While it is clear that the same data protection regime may not be appropriate for children of all ages, children of all ages should nonetheless be afforded privacy and protection, and online products
    and services should adopt data protection regimes appropriate for children of the ages likely to access those products and services.

    (8) Online services, products, or features that are likely to be accessed by children should offer strong

    privacy protections by design and by default, including by disabling features that profile children using their previous behavior, browsing history, or assumptions of their similarity to other children,
    to offer detrimental material.

    (9) Ensuring robust privacy protections for children by design is consistent with the intent of the Legislature in passing the California Consumer Privacy Act of 2018, and with the intent of the people
    of the State of California in passing the California Privacy Rights Act of 2020, which finds and declares that children are particularly vulnerable from a negotiating perspective with respect to their
    privacy rights.

    (10) The California Privacy Protection Agency, created by the California Privacy Rights Act of 2020, has substantial and growing expertise that is integral to the development of privacy policy in California.

    (b) Therefore, it is the intent of the Legislature to promote privacy protections for children pursuant to the California Age-Appropriate Design Code Act.

    (c) It is the intent of the Legislature that the California Age-Appropriate Design Code promote innovation by businesses whose online products, services, or features are likely to be accessed by children
    by ensuring that those online products, services, or features are designed in a manner that recognizes the distinct needs of children at different age ranges.

    (d) It is the intent of the Legislature that businesses covered by the California Age-Appropriate Design Code may look to guidance and innovation in response to the Age-Appropriate Design Code established
    in the United Kingdom when developing online services, products, or features likely to be accessed by

    children.

    (e) It is the intent of the Legislature that the California Children’s Data Protection Working Group consider the guidance provided by the Information Commissioner’s Office in the United Kingdom when
    developing and reviewing best practices or other recommendations related to the California Age-Appropriate Design Code.

    (f) It is the intent of the Legislature that the California Children’s Data Protection Working Group and the Department of Justice leverage the substantial and growing expertise of the California Privacy
    Protection Agency in the implementation of this title.

    SEC. 2.

    Title 1.81.47 (commencing with Section 1798.99.28) is added to Part 4 of Division 3 of the Civil Code, to read:

    TITLE 1.81.47. The California Age-Appropriate Design Code Act

    1798.99.28.

    This title shall be known, and may be cited, as the California Age-Appropriate Design Code Act.

    1798.99.29.

    The Legislature declares that children should be afforded protections not only by online products and services specifically directed at them but by all online products and services they are likely to
    access and makes the following findings:

    (a) Businesses that develop and provide online services, products, or features that children are likely to access should consider the best interests of children when designing, developing, and providing
    that online service, product, or feature.

    (b) If a conflict arises between commercial interests and the best interests of children, companies should prioritize the privacy, safety, and well-being of children over commercial

    interests.

    1798.99.30.

    (a) For purposes of this title, the definitions in Section 1798.140 shall apply unless otherwise specified in this title.

    (b) For the purposes of this title:

    (1) “Child” or “children,” unless otherwise specified, means a consumer or consumers who are under 18 years of age.

    (2) “Data Protection Impact Assessment” means a systematic survey to assess and mitigate risks that arise from the data management practices of the business to children who are reasonably likely to
    access the online service, product, or feature at issue that arises from the provision of that online service, product, or feature.

    (3) “Default” means a preselected option adopted by the business for the online service, product, or feature.

    (4) “Likely to be accessed by children” means it is reasonable to expect, based on the following indicators, that the online service, product, or feature would be accessed by children:

    (A) The online service, product, or feature is directed to children as defined by the Children’s Online Privacy Protection Act (15 U.S.C. Sec. 6501 et seq.).

    (B) The online service, product, or feature is determined, based on competent and reliable evidence regarding audience composition, to be routinely accessed by a significant number of children.

    (C) An online service, product, or feature with

    advertisements marketed to children.

    (D) An online service, product, or feature that is substantially similar or the same as an online service, product, or feature subject to subparagraph (B).

    (E) An online service, product, or feature that has design elements that are known to be of interest to children, including, but not limited to, games, cartoons, music, and celebrities who appeal to
    children.

    (F) A significant amount of the audience of the online service, product, or feature is determined, based on internal company research, to be children.

    (5) “Online service, product, or feature” does not mean any of the following:

    (A) A broadband internet access service, as defined in Section

    3100.

    (B) A telecommunications service, as defined in Section 153 of Title 47 of the United States Code.

    (C) The delivery or use of a physical product.

    (6) “Profiling” means any form of automated processing of personal information that uses personal information to evaluate certain aspects relating to a natural person, including analyzing or predicting
    aspects concerning a natural person’s performance at work, economic situation, health, personal preferences, interests, reliability, behavior, location, or movements.

    1798.99.31.

    (a) A business that provides an online service, product, or feature likely to be accessed by children shall take all of the following actions:

    (1) (A) Before any new online services, products, or features are offered to the public, complete a Data Protection Impact Assessment for any online service, product, or feature likely to be accessed
    by children and maintain documentation of this assessment as long as the online service, product, or feature is likely to be accessed by children. A business shall biennially review all Data Protection
    Impact Assessments.

    (B) The Data Protection Impact Assessment required by this paragraph shall identify the purpose

    of the online service, product, or feature, how it uses children’s personal information, and the risks of material detriment to children that arise from the data management practices of the business.
    The Data Protection Impact Assessment shall address, to the extent applicable, all of the following:

    (i) Whether the design of the online product, service, or feature could harm children, including by exposing children to harmful, or potentially harmful, content on the online product, service, or feature.

    (ii) Whether the design of the online product, service, or feature could lead to children experiencing or being targeted by harmful, or potentially harmful, contacts on the online product, service,
    or feature.

    (iii) Whether the design of the online product, service, or feature could permit children to witness,

    participate in, or be subject to harmful, or potentially harmful, conduct on the online product, service, or feature.

    (iv) Whether the design of the online product, service, or feature could allow children to be party to or exploited by a harmful, or potentially harmful, contact on the online product, service, or feature.

    (v) Whether algorithms used by the online product, service, or feature could harm children.

    (vi) Whether targeted advertising systems used by the online product, service, or feature could harm children.

    (vii) Whether and how the online product, service, or feature uses system design features to increase, sustain, or extend use of the online product, service, or feature by children, including the automatic
    playing of media, rewards for

    time spent, and notifications.

    (viii) Whether, how, and for what purpose the online product, service, or feature collects or processes sensitive personal information of children.

    (2) Document any risk of material detriment to children that arises from the data management practices of the business identified in the Data Protection Impact Assessment required by paragraph (1) and
    create a timed plan to mitigate or eliminate the risk before the online service, product, or feature is accessed by children.

    (3) Within three business days of a written request by the Attorney General, provide to the Attorney General a list of all Data Protection Impact Assessments the business has completed.

    (4) (A) For any Data Protection Impact Assessment

    completed pursuant to paragraph (1), make the Data Protection Impact Assessment available, within five business days, to the Attorney General pursuant to a written request.

    (B) Notwithstanding any other law, a Data Protection Impact Assessment is protected as confidential and shall be exempt from public disclosure, including under the California Public Records Act (Chapter
    3.5 (commencing with Section 6250) of Division 7 of Title 1 of the Government Code).

    (C) To the extent any information contained in a Data Protection Impact Assessment disclosed to the Attorney General includes information subject to attorney-client privilege or work product protection,
    disclosure pursuant to this paragraph shall not constitute a waiver of that privilege or protection.

    (5) Estimate the age of child users with a reasonable level of

    certainty appropriate to the risks that arise from the data management practices'
