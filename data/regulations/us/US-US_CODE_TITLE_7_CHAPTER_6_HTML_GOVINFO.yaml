- id: art-16
  title: §136. Definitions
  text: '§136. Definitions


    For purposes of this subchapter—


    (a) Active ingredient


    The term "active ingredient" means—


    (1) in the case of a pesticide other than a plant regulator, defoliant, desiccant, or nitrogen stabilizer, an ingredient which will prevent, destroy, repel, or mitigate any pest;


    (2) in the case of a plant regulator, an ingredient which, through physiological action, will accelerate or retard the rate of growth or rate of maturation or otherwise alter the behavior of ornamental
    or crop plants or the product thereof;


    (3) in the case of a defoliant, an ingredient which will cause the leaves or foliage to drop from a plant;


    (4) in the case of a desiccant, an ingredient which will artificially accelerate the drying of plant tissue; and


    (5) in the case of a nitrogen stabilizer, an ingredient which will prevent or hinder the process of nitrification, denitrification, ammonia volatilization, or urease production through action affecting
    soil bacteria.


    (b) Administrator


    The term "Administrator" means the Administrator of the Environmental Protection Agency.


    (c) Adulterated


    The term "adulterated" applies to any pesticide if—


    (1) its strength or purity falls below the professed standard of quality as expressed on its labeling under which it is sold;


    (2) any substance has been substituted wholly or in part for the pesticide; or


    (3) any valuable constituent of the pesticide has been wholly or in part abstracted.


    (d) Animal


    The term "animal" means all vertebrate and invertebrate species, including but not limited to man and other mammals, birds, fish, and shellfish.


    (e) Certified applicator, etc.


    (1) Certified applicator


    The term "certified applicator" means any individual who is certified under section 136i of this title as authorized to use or supervise the use of any pesticide which is classified for restricted use.
    Any applicator who holds or applies registered pesticides, or uses dilutions of registered pesticides consistent with subsection (ee), only to provide a service of controlling pests without delivering
    any unapplied pesticide to any person so served is not deemed to be a seller or distributor of pesticides under this subchapter.


    (2) Private applicator


    The term "private applicator" means a certified applicator who uses or supervises the use of any pesticide which is classified for restricted use for purposes of producing any agricultural commodity
    on property owned or rented by the applicator or the applicator''s employer or (if applied without compensation other than trading of personal services between producers of agricultural commodities)
    on the property of another person.


    (3) Commercial applicator


    The term "commercial applicator" means an applicator (whether or not the applicator is a private applicator with respect to some uses) who uses or supervises the use of any pesticide which is classified
    for restricted use for any purpose or on any property other than as provided by paragraph (2).


    (4) Under the direct supervision of a certified applicator


    Unless otherwise prescribed by its labeling, a pesticide shall be considered to be applied under the direct supervision of a certified applicator if it is applied by a competent person acting under
    the instructions and control of a certified applicator who is available if and when needed, even though such certified applicator is not physically present at the time and place the pesticide is applied.


    (f) Defoliant


    The term "defoliant" means any substance or mixture of substances intended for causing the

    leaves or foliage to drop from a plant, with or without causing abscission.


    (g) Desiccant


    The term "desiccant" means any substance or mixture of substances intended for artificially accelerating the drying of plant tissue.


    (h) Device


    The term "device" means any instrument or contrivance (other than a firearm) which is intended for trapping, destroying, repelling, or mitigating any pest or any other form of plant or animal life (other
    than man and other than bacteria, virus, or other microorganism on or in living man or other living animals); but not including equipment used for the application of pesticides when sold separately
    therefrom.


    (i) District court


    The term "district court" means a United States district court, the District Court of Guam, the District Court of the Virgin Islands, and the highest court of American Samoa.


    (j) Environment


    The term "environment" includes water, air, land, and all plants and man and other animals living therein, and the interrelationships which exist among these.


    (k) Fungus


    The term "fungus" means any non-chlorophyll-bearing thallophyte (that is, any non-chlorophyll-bearing plant of a lower order than mosses and liverworts), as for example, rust, smut, mildew, mold, yeast,
    and bacteria, except those on or in living man or other animals and those on or in processed food, beverages, or pharmaceuticals.


    (l) Imminent hazard


    The term "imminent hazard" means a situation which exists when the continued use of a pesticide during the time required for cancellation proceeding would be likely to result in unreasonable adverse
    effects on the environment or will involve unreasonable hazard to the survival of a species declared endangered or threatened by the Secretary pursuant to the Endangered Species Act of 1973 [16 U.S.C.
    1531 et seq.].


    (m) Inert ingredient


    The term "inert ingredient" means an ingredient which is not active.


    (n) Ingredient statement


    The term "ingredient statement" means a statement which contains—


    (1) the name and percentage of each active ingredient, and the total percentage of all inert ingredients, in the pesticide; and


    (2) if the pesticide contains arsenic in any form, a statement of the percentages of total and water soluble arsenic, calculated as elementary arsenic.


    (o) Insect


    The term "insect" means any of the numerous small invertebrate animals generally having the body more or less obviously segmented, for the most part belonging to the class insecta, comprising six-legged,
    usually winged forms, as for example, beetles, bugs, bees, flies, and to other allied classes of arthropods whose members are wingless and usually have more than six legs, as for example, spiders, mites,
    ticks, centipedes, and wood lice.


    (p) Label and labeling


    (1) Label


    The term "label" means the written, printed, or graphic matter on, or attached to, the pesticide or device or any of its containers or wrappers.


    (2) Labeling


    The term "labeling" means all labels and all other written, printed, or graphic matter—


    (A) accompanying the pesticide or device at any time; or


    (B) to which reference is made on the label or in literature accompanying the pesticide or device, except to current official publications of the Environmental Protection Agency, the United States Departments
    of Agriculture and Interior, the Department of Health and Human Services, State experiment stations, State agricultural colleges, and other similar Federal or State institutions or agencies authorized
    by law to conduct research in the field of pesticides.


    (q) Misbranded


    (1) A pesticide is misbranded if—


    (A) its labeling bears any statement, design, or graphic representation relative thereto or to its ingredients which is false or misleading in any particular;


    (B) it is contained in a package or other container or wrapping which does not conform to the standards established by the Administrator pursuant to section 136w(c)(3) of this title;


    (C) it is an imitation of, or is offered for sale under the name of, another pesticide;


    (D) its label does not bear the registration number assigned under section 136e of this title to each establishment in which it was produced;


    (E) any word, statement, or other information required by or under authority of this subchapter to appear on the label or labeling is not prominently placed thereon with such conspicuousness (as compared
    with other words, statements, designs, or graphic matter in the labeling) and in such terms as to render it likely to be read and understood by the ordinary individual under customary conditions of
    purchase and use;


    (F) the labeling accompanying it does not contain directions for use which are necessary for effecting the purpose for which the product is intended and if complied with, together with any requirements
    imposed under section 136a(d) of this title, are adequate to protect health and the environment;


    (G) the label does not contain a warning or caution statement which may be necessary and if complied with, together with any requirements imposed under section 136a(d) of this title, is adequate to
    protect health and the environment; or


    (H) in the case of a pesticide not registered in accordance with section 136a of this title

    and intended for export, the label does not contain, in words prominently placed thereon with such conspicuousness (as compared with other words, statements, designs, or graphic matter in the labeling)
    as to render it likely to be noted by the ordinary individual under customary conditions of purchase and use, the following: "Not Registered for Use in the United States of America".


    (2) A pesticide is misbranded if—


    (A) the label does not bear an ingredient statement on that part of the immediate container (and on the outside container or wrapper of the retail package, if there be one, through which the ingredient
    statement on the immediate container cannot be clearly read) which is presented or displayed under customary conditions of purchase, except that a pesticide is not misbranded under this subparagraph
    if—


    (i) the size or form of the immediate container, or the outside container or wrapper of the retail package, makes it impracticable to place the ingredient statement on the part which is presented or
    displayed under customary conditions of purchase; and


    (ii) the ingredient statement appears prominently on another part of the immediate container, or outside container or wrapper, permitted by the Administrator;


    (B) the labeling does not contain a statement of the use classification under which the product is registered;


    (C) there is not affixed to its container, and to the outside container or wrapper of the retail package, if there be one, through which the required information on the immediate container cannot be
    clearly read, a label bearing—


    (i) the name and address of the producer, registrant, or person for whom produced;


    (ii) the name, brand, or trademark under which the pesticide is sold;


    (iii) the net weight or measure of the content, except that the Administrator may permit reasonable variations; and


    (iv) when required by regulation of the Administrator to effectuate the purposes of this subchapter, the registration number assigned to the pesticide under this subchapter, and the use classification;
    and


    (D) the pesticide contains any substance or substances in quantities highly toxic to man, unless the label shall bear, in addition to any other matter required by this subchapter—


    (i) the skull and crossbones;


    (ii) the word "poison" prominently in red on a background of distinctly contrasting color; and


    (iii) a statement of a practical treatment (first aid or otherwise) in case of poisoning by the pesticide.


    (r) Nematode


    The term "nematode" means invertebrate animals of the phylum nemathelminthes and class nematoda, that is, unsegmented round worms with elongated, fusiform, or saclike bodies covered with cuticle, and
    inhabiting soil, water, plants, or plant parts; may also be called nemas or eelworms.


    (s) Person


    The term "person" means any individual, partnership, association, corporation, or any organized group of persons whether incorporated or not.


    (t) Pest


    The term "pest" means (1) any insect, rodent, nematode, fungus, weed, or (2) any other form of terrestrial or aquatic plant or animal life or virus, bacteria, or other micro-organism (except viruses,
    bacteria, or other micro-organisms on or in living man or other living animals) which the A'
