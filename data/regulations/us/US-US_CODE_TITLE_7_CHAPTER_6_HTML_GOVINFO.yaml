    SUBCHAPTER I—INSECTICIDES


    §§121 to 134. Repealed. June 25, 1947, ch. 125, §16, 61 Stat. 172


    Sections, act Apr. 26, 1910, ch. 191, 36 Stat. 335, formerly known as "The Insecticides Act", are covered by subchapter II of this chapter.


    Statutory Notes and Related Subsidiaries


    Effective Date of Repeal; Savings Provision


    Act June 25, 1947, ch. 125, §16, 61 Stat. 172, repealed this subchapter effective one year after June 25, 1947, and further provided that this subchapter should be deemed to remain in full force for
    the purpose of sustaining any proper suit, action, or other proceeding

    with respect to any violations, liabilities incurred, or appeals taken prior to such date of repeal or to sales, shipments, or deliveries of insecticides and fungicides exempted by the Secretary.


    SUBCHAPTER II—ENVIRONMENTAL PESTICIDE CONTROL


    §§135 to 135k. Omitted


