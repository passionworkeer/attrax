  title: §136a. Registration of pesticides
  text: '§136a. Registration of pesticides


    (a) Requirement of registration


    Except as provided by this subchapter, no person in any State may distribute or sell to any person any pesticide that is not registered under this subchapter. To the extent necessary to prevent unreasonable
    adverse effects on the environment, the Administrator may by regulation limit the distribution, sale, or use in any State of any pesticide that is not registered under this subchapter and that is not
    the subject of an experimental use permit under section 136c of this title or an emergency exemption under section 136p of this title.


    (b) Exemptions


    A pesticide which is not registered with the Administrator may be transferred if—


    (1) the transfer is from one registered establishment to another registered establishment operated by the same producer solely for packaging at the second establishment or for use as a constituent part
    of another pesticide produced at the second establishment; or


    (2) the transfer is pursuant to and in accordance with the requirements of an experimental use permit.


    (c) Procedure for registration


    (1) Statement required


    Each applicant for registration of a pesticide shall file with the Administrator a statement which includes—


    (A) the name and address of the applicant and of any other person whose name will appear on the labeling;


    (B) the name of the pesticide;


    (C) a complete copy of the labeling of the pesticide, a statement of all claims to be made for it, and any directions for its use;


    (D) the complete formula of the pesticide;


    (E) a request that the pesticide be classified for general use or for restricted use, or for both; and


    (F) except as otherwise provided in paragraph (2)(D), if requested by the Administrator, a full description of the tests made and the results thereof upon which the claims are based, or alternatively
    a citation to data that appear in the public literature or that previously had been submitted to the Administrator and that the Administrator may consider in accordance with the following provisions:


    (i) With respect to pesticides containing active ingredients that are initially registered under this subchapter after September 30, 1978, data submitted to support the application for the original
    registration of the pesticide, or an application for an amendment adding any new use to the registration and that pertains solely to such new use, shall not, without the written permission of the original
    data submitter, be considered by the Administrator to support an application by another person during a period of ten years following the date the Administrator first registers the pesticide, except
    that such permission shall not be required in the case of defensive data.


