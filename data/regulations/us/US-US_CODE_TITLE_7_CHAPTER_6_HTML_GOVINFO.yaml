    Statutory Notes and Related Subsidiaries


    Effective Date of 1988 Amendment


    Pub. L. 100–532, title IX, §901, Oct. 25, 1988, 102 Stat. 2688, provided that: "Except as otherwise provided in this Act, the amendments made by this Act [see Short Title of 1988 Amendment note below]
    shall take effect on the expiration of 60 days after the date of enactment of this Act [Oct. 25, 1988]."


    Effective Date of 1973 Amendment


    Amendment by Pub. L. 93–205 effective Dec. 28, 1973, see section 16 of Pub. L. 93–205, set out as an Effective Date note under section 1531 of Title 16, Conservation.


    Effective Date


    Pub. L. 92–516, §4, Oct. 21, 1972, 86 Stat. 998, as amended by Pub. L. 94–140, §4, Nov. 28, 1975, 89 Stat. 752; Pub. L. 95–396, §28, Sept. 30, 1978, 92 Stat. 842, provided that:


    "(a) Except as otherwise provided in the Federal Insecticide, Fungicide, and Rodenticide Act [this subchapter], as amended by this Act and as otherwise provided by this section, the amendments made
    by this Act [see Short Title note set out below] shall take effect at the close of the date of the enactment of this Act [Oct. 21, 1972], provided if regulations are necessary for the implementation
    of any provision that becomes effective on the date of enactment, such regulations shall be promulgated and shall become effective within 90 days from the date of enactment of this Act.


    "(b) The provisions of the Federal Insecticide, Fungicide, and Rodenticide Act [this subchapter] and the regulations thereunder as such existed prior to the enactment of this Act shall remain in effect
    until superseded by the amendments made by this Act and regulations thereunder.


    "(c)(1) Two years after the enactment of this Act the Administrator shall have promulgated regulations providing for the registration and classification of pesticides under the provisions of this Act
    and thereafter shall register all new applications under such provisions.


    "(2) Any requirements that a pesticide be registered for use only by a certified applicator shall not be effective until five years from the date of enactment of this Act.


    "(3) A period of five years from date of enactment shall be provided for certification of applicators.


    "(A) One year after the enactment of this Act the Administrator shall have prescribed the standards for the certification of applicators.


    "(B) Each State desiring to certify applicators shall submit a State plan to the Administrator for the purpose provided by section 4(b).


    "(C) As promptly as possible but in no event more than one year after submission of a State plan, the Administrator shall approve the State plan or disapprove it and indicate the reasons for disapproval.
    Consideration of plans resubmitted by States shall be expedited.


    "(4) One year after the enactment of this Act the Administrator shall have promulgated and shall make effective regulations relating to the registration of establishments, permits for experimental use,
    and the keeping of books and records under the provisions of this Act.


    "(d) No person shall be subject to any criminal or civil penalty imposed by the Federal Insecticide, Fungicide, and Rodenticide Act, as amended by this Act, for any act (or failure to act) occurring
    before the expiration of 60 days after the Administrator has published effective regulations in the Federal Register and taken such other action as may be necessary to permit compliance with the provisions
    under which the penalty is to be imposed.


    "(e) For purposes of determining any criminal or civil penalty or liability to any third person in respect of any act or omission occurring before the expiration of the periods referred to in this section,
    the Federal Insecticide, Fungicide, and Rodenticide Act shall be treated as continuing in effect as if this Act had not been enacted."


    Short Title of 2022 Amendment


