  text: 'Section 1.5 of this bill incorporates amendments to Section 1798.140 of the Civil Code proposed by both this bill and Assembly Bill 1008. That section of this bill shall become operative only if
    (1) both bills are enacted and become effective on or before January 1, 2025, (2) each bill amends Section 1798.140 of the Civil Code and (3) this bill is enacted after Assembly Bill 1008, in which
    case Section 1 of this bill shall not become operative.

    SEC. 3.

    The Legislature finds and declares that this act furthers the purposes and intent of the California Privacy Rights Act of 2020.'
