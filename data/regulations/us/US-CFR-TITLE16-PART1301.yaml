- id: art-3
  title: § 1301.2
  text: '§ 1301.2

    Purpose.

    The purpose of this rule is to ban those refuse bins which come under the scope of this ban because they present an unreasonable risk of injury due to tip-over that can result in serious injury or death
    from crushing.'
- id: art-4
  title: § 1301.3
  text: '§ 1301.3

    Findings.

    (a)

    Risk of injury.

    The Commission has studied 19 in-depth investigation reports of accidents associated with tip-over of unstable refuse bins. The 19 accidents, which involved 21 victims, resulted in 13 deaths. Of the
    21 victims, 20 were children 10 years of age and under. Additionally, Commission records show three death certificates for victims, under 5 years of age, who were killed by refuse bins tipping over.
    Therefore, the Commission finds that unreasonable risks of injury or death from crushing due to tip-over are associated with certain unstable refuse bins having an internal volume one cubic yard or
    greater, which unreasonable risk this banning rule is designed to eliminate or reduce.

    (b)

    Products subject to this ban.

    (1) The Commission finds that the types of products subject to this ban are those manufactured metal receptacles known in the solid waste collection trade as containers, refuse bins, buckets, boxes
    or hoppers, with actual internal volumes of one cubic yard or greater, used for the storage and transportation of solid waste. They are fabricated in numerous sizes and configurations for use with rear,
    side, front, hoist and roll-off loaded trash collection trucks and are used by private firms and public agencies.

    (2) Although unstable refuse bins subject to this ban may be in various forms and shapes, the Commission''s in-depth investigations into accidents associated with metal refuse containers indicate that
    most accidents have occurred with slant-sided metal refuse bins which are used by rear and side-loaded trucks. Therefore, the Commission bases its economic analysis of the potential impact of the ban
    upon the population of these bins. Certain refuse bins such as front loaded, roll-off, box and other types of large or broad based bins, because of their configuration, bulk and weight are likely to
    be inherently stable and are therefore not included in the population of potentially unstable bins studied in this economic analysis.

    (3) The Commission estimates that there may be approximately 638,000-716,000 slant-sided, metal refuse bins with an internal volume one cubic yard or greater, which may be unstable. The population of
    potentially unstable bins owned by some 10,000-15,000 private solid waste collection firms in all parts of the United States and its territories is estimated to be 359,000-371,000. These figures are
    discussed in the Commission''s

    Economic Impact Statement

    of April 22, 1977, which is available for review from the Commission''s Office of the Secretary, Washington, D.C. 20207.

    (c)

    Need of the public for the product and effects on utility, cost, and availability.

    (1) The public need for refuse bins is substantial since these products are used for the containment of solid waste and thus contribute to public hygiene. The U.S. Environmental Protection Agency estimates
    that 135,000,000 tons of solid waste were collected in 1976 from residential, commercial and industrial sources. Approximately 101,250,000 tons (75%) were collected by private firms and the remainder
    by public agencies.

    (2) The Commission finds that the ban will not affect the utility that consumers derive from the general use of refuse bins. The interest of the public is in continuity, availability and price of solid
    waste collection. The ban could result in a shift from bins which are subject to the ban to other types of storage containers. Such a shift would not affect solid waste collection and would entail a
    small price increase for individual consumers. To the extent that injuries and deaths associated with the use of unstable bins are reduced or eliminated as a result of the ban, the public utility derived
    from the use of the product will be increased.

    (3)(i) The Commission finds that, based on its analysis of industrial estimates, newly produced complying refuse bins will cost approximately 1-10% more than currently produced noncomplying bins and
    that existing inventories of unstable bins can be modified (depending upon size) for about $45-$75 each. This modification cost estimate includes the cost of material, shop labor, retrieval and return
    to service, and the substitution of one bin for another for on-site service.

    (ii) The Commission estimates that the ban will not result in any significant price increases for the delivery of solid waste collection service to the general public because of the competitive structure
    of the solid waste collection industry.

    (4) The Commission finds that the ban will have no effect on the availability of solid waste collection service to the general public. Solid waste collection haulers who use products subject to this
    ban can modify these refuse bins so that these products can continue to be used for solid waste collection.

    (d)

    Alternatives.

    (1) The Commission has considered other means of achieving the objective of this ban, but has found none that it believes would have fewer adverse effects on competition or that would cause less disruption
    or dislocation of manufacturing, servicing or other commercial practices consistent with public health and safety. The Commission estimates that this ban may, because of capital and testing costs and
    maintenance capacity limitations, have an adverse effect on individual firms within some markets.

    (2) The Commission estimates that the ban will not have an adverse effect on the competitive structure of the solid waste collection industry. The competitive nature of solid waste collection firms
    is fostered because of low starting costs, particularly if a firm is owner-operated. The rate of entry and exit into and out of the industry for small operators tends to be high relative to larger firms
    in the industry. The ban will most likely not increase the degree of market concentration among the larger firms nor affect the rate of entry into or exit out of the industry by relatively smaller firms.

    (3) Table 3 of the Economic Impact Statement indicates that about 85 percent of the private sector trash haulers are those with a fleet size of about 10 trucks and have annual revenues under $1 million.
    These might be classified as small business firms. All firms in the trash hauling business would have two possible problems associated with the ban: cost and time to retrofit, and access to capital
    for retrofitting. The problem of raising capital to retrofit should not be a burden to small firms

    unless they are denied credit for factors not associated with this ban. The revised effective date from 9 to 12 months will extend both the time to retrofit and the time to search for capital sources,
    if necessary. We conclude that the small firms in the trash hauling industry will not experience undue hardship relative to their larger competitors.

    (e)

    Conclusion.

    (1) The Commission finds that this rule is reasonably necessary to eliminate or reduce the unreasonable risks of injury associated with refuse bins, as they are defined in § 1301.4, and which fail to
    meet the criteria specified in § 1301.5

    (2) Based on all of the above findings, the Commission finds that the issuance of this rule is in the public interest.

    (3) The Commission is aware of the fact that refuse bins are used for many years before being discarded. Estimates of their useful life range from 10 to 15 years. Although other products which may be
    hazardous may also have a long life in the hands of individual consumers, a substantial number of unstable refuse bins remain in commerce because they are rented or leased and are constantly available
    for use by large numbers of consumers. The combination of the long life of refuse bins plus the fact that unstable refuse bins could remain in commerce and be available for use by many people, persuaded
    the Commission to make this finding that no feasible consumer product safety standard under the CPSA could adequately protect the public from the unreasonable risk of injury associated with those unstable
    refuse bins coming under the coverage of this ban.'
- id: art-5
  title: § 1301.4
  text: '§ 1301.4

    Definitions.

    (a) The definitions in section 3 of the Consumer Product Safety Act (15 U.S.C. 2052) apply to this part 1301.

    (b)

    Refuse bin

    means a metal receptacle having an internal volume one cubic yard or greater, by actual measurement, which temporarily receives and holds refuse for ultimate disposal either by unloading into the body
    or loading hopper of a refuse collection vehicle or by other means.

    (c)

    Internal volume

    means the actual volumetric capacity of the container. This may not necessarily correspond to the nominal size rating used by industry.

    (d)

    Tip over

    means that during the application of either test force described in § 1301.7(a), the refuse bin begins to rotate forward about its forwardmost ground supports.'
- id: art-6
  title: § 1301.5
  text: '§ 1301.5

    Banning criteria.

    (a) Any refuse bin of metal construction produced or distributed, for sale to, or for the personal use, consumption or enjoyment of consumers, in or around a permanent or temporary household or residence,
    a school, in recreation or otherwise, which is in commerce or being distributed in commerce on or after the effective date of this ban and which has an actual internal volume one cubic yard or greater
    and tips over when tested under the conditions of § 1301.6 and using the procedures described in § 1301.7, is a banned hazardous product.

    (b) The Commission considers a refuse bin to tip over when it begins to rotate forward about its forwardmost ground supports.'
- id: art-7
  title: § 1301.6
  text: '§ 1301.6

    Test conditions.

    (a) The refuse bin shall be empty and have its lids or covers in a position which would most adversely affect the stability of the bin when tested.

    (b) The refuse bin shall be tested on a hard, flat surface. During testing, the bin shall not be tilted from level in such a way as to increase its stability.

    (c) Those refuse bins equipped with casters or wheels shall have the casters or wheels positioned in a position which would most adversely affect the stability of the bin and shall be chocked to prevent
    movement.

    (d) The stability of the refuse bin shall be tested without dependence upon non-permanent attachments or restraints such as chains or guys.

    (e) For purposes of enforcement, bins will be tested by the Commission in that position which most adversely affects their stability.'
- id: art-8
  title: § 1301.7
  text: '§ 1301.7

    Test procedures.

    (a) The refuse bin shall be tested by applying forces as described in paragraphs (a) (1) and (2) of this section one after the other.

    (1) A horizontal force of 70 pounds (311 N) shall be applied at a point and in a direction most likely to cause tipping, and

    (2) A vertically downward force of 191 pounds (850 N) shall be applied to a point most likely to cause tipping. (See Figure 1.)

    EC03OC91.047

    (b) These forces shall be applied separately and the bin shall not tip over under the application of either action cited above in paragraph (a)(1) or (a)(2).'
- id: art-9
  title: § 1301.8
  text: '§ 1301.8

    Effective date.

    The effective date of this ban shall be June 13, 1978.'
