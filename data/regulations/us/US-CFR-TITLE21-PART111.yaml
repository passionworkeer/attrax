  text: '§ 111.8

    What are the requirements under this subpart B for written procedures?

    You must establish and follow written procedures for fulfilling the requirements of this subpart.'
- id: art-6
  title: § 111.10
  text: '§ 111.10

    What requirements apply for preventing microbial contamination from sick or infected personnel and for hygienic practices?

    (a)

    Preventing microbial contamination.

    You must take measures to exclude from any operations any person who might be a source of microbial contamination, due to a health condition, where such contamination may occur, of any material, including
    components, dietary supplements, and contact surfaces used in the manufacture, packaging, labeling, or holding of a dietary supplement. Such measures include the following:

    (1) Excluding from working in any operations that may result in contamination any person who, by medical examination, the person''s acknowledgement, or supervisory observation, is shown to have, or
    appears to have, an illness, infection, open lesion, or any other abnormal source of microbial contamination, that could result in microbial contamination of components, dietary supplements, or contact
    surfaces, until the health condition no longer exists; and

    (2) Instructing your employees to notify their supervisor(s) if they have or if there is a reasonable possibility that they have a health condition described in paragraph (a)(1) of this section that
    could result in microbial contamination of any components, dietary supplements, or any contact surface.

    (b)

    Hygienic practices.

    If you work in an operation during which adulteration of the component, dietary supplement, or contact surface could occur, you must use hygienic practices to the extent necessary to protect against
    such contamination of components, dietary supplements, or contact surfaces. These hygienic practices include the following:

    (1) Wearing outer garments in a manner that protects against the contamination of components, dietary supplements, or any contact surface;

    (2) Maintaining adequate personal cleanliness;

    (3) Washing hands thoroughly (and sanitizing if necessary to protect against contamination with microorganisms) in an adequate hand-washing facility:

    (i) Before starting work; and

    (ii) At any time when the hands may have become soiled or contaminated;

    (4) Removing all unsecured jewelry and other objects that might fall into components, dietary supplements, equipment, or packaging, and removing hand jewelry that cannot be adequately sanitized during
    periods in which components or dietary supplements are manipulated by hand. If hand jewelry cannot be removed, it must be covered by material that is maintained in an intact, clean, and sanitary condition
    and that effectively protects against contamination of components, dietary supplements, or contact surfaces;

    (5) Maintaining gloves used in handling components or dietary supplements in an intact, clean, and sanitary condition. The gloves must be of an impermeable material;

    (6) Wearing, where appropriate, in an effective manner, hair nets, caps, beard covers, or other effective hair restraints;

    (7) Not storing clothing or other personal belongings in areas where components, dietary supplements, or any contact surfaces are exposed or where contact surfaces are washed;

    (8) Not eating food, chewing gum, drinking beverages, or using tobacco products in areas where components, dietary supplements, or any contact surfaces are exposed, or where contact surfaces are washed;
    and

    (9) Taking any other precautions necessary to protect against the contamination of components, dietary supplements, or contact surfaces with microorganisms, filth, or any other extraneous materials,
    including perspiration, hair, cosmetics, tobacco, chemicals, and medicines applied to the skin.'
- id: art-7
  title: § 111.12
  text: '§ 111.12

    What personnel qualification requirements apply?

    (a) You must have qualified employees who manufacture, package, label, or hold dietary supplements.

    (b) You must identify who is responsible for your quality control operations. Each person who is identified to perform quality control operations must be qualified to do so and have distinct and separate
    responsibilities related to performing such operations from those responsibilities that the person otherwise has when not performing such operations.

    (c) Each person engaged in manufacturing, packaging, labeling, or holding, or in performing any quality control operations, must have the education, training, or experience to perform the person''s
    assigned functions.'
- id: art-8
  title: § 111.13
  text: '§ 111.13

    What supervisor requirements apply?

    (a) You must assign qualified personnel to supervise the manufacturing, packaging, labeling, or holding of dietary supplements.

    (b) Each supervisor whom you use must be qualified by education, training, or experience to supervise.'
- id: art-9
  title: § 111.14
  text: '§ 111.14

    Under this subpart B, what records must you make and keep?

    (a) You must make and keep records required under this subpart B in accordance with subpart P of this part.

    (b) You must make and keep the following records:

    (1) Written procedures for fulfilling the requirements of this subpart B; and

    (2) Documentation of training, including the date of the training, the type of training, and the person(s) trained.

    Subpart C—Physical Plant and Grounds'
- id: art-10
  title: § 111.15
  text: '§ 111.15

    What sanitation requirements apply to your physical plant and grounds?

    (a)

    Grounds.

    You must keep the grounds of your physical plant in a condition that protects against the contamination of components, dietary supplements, or contact surfaces. The methods for adequate ground maintenance
    include:

    (1) Properly storing equipment, removing litter and waste, and cutting weeds or grass within the immediate vicinity of the physical plant so that it does not attract pests, harbor pests, or provide
    pests a place for breeding;

    (2) Maintaining roads, yards, and parking lots so that they do not constitute a source of contamination in areas where components, dietary supplements, or contact surfaces are exposed;

    (3) Adequately draining areas that may contribute to the contamination of components, dietary supplements, or contact surfaces by seepage, filth or any other extraneous materials, or by providing a
    breeding place for pests;

    (4) Adequately operating systems for waste treatment and disposal so that they do not constitute a source of contamination in areas where components, dietary supplements, or contact surfaces are exposed;
    and

    (5) If your plant grounds are bordered by grounds not under your control, and if those other grounds are not maintained in the manner described in this section, you must exercise care in the plant by
    inspection, extermination, or other means to exclude pests, dirt, and filth or any other extraneous materials that may be a source of contamination.

    (b)

    Physical plant facilities.

    (1) You must maintain your physical plant in a clean and sanitary condition; and

    (2) You must maintain your physical plant in repair sufficient to prevent components, dietary supplements, or contact surfaces from becoming contaminated.

    (c)

    Cleaning compounds, sanitizing agents, pesticides, and other toxic materials.

    (1) You must use cleaning compounds and sanitizing agents that are free from microorganisms of public health significance and that are safe and adequate under the conditions of use.

    (2) You must not use or hold toxic materials in a physical plant in which components, dietary supplements, or contact surfaces are manufactured or exposed, unless those materials are necessary as follows:

    (i) To maintain clean and sanitary conditions;

    (ii) For use in laboratory testing procedures;

    (iii) For maintaining or operating the physical plant or equipment; or

    (iv) For use in the plant''s operations.

    (3) You must identify and hold cleaning compounds, sanitizing agents, pesticides, pesticide chemicals, and other toxic materials in a manner that protects against contamination of components, dietary
    supplements, or contact surfaces.

    (d)

    Pest control.

    (1) You must not allow animals or pests in any area of your physical plant. Guard or guide dogs are allowed in some areas of your physical plant if the presence of the dogs will not result in contamination
    of components, dietary supplements, or contact surfaces;

    (2) You must take effective measures to exclude pests from the physical plant and to protect against contamination of components, dietary supplements, and contact surfaces on the premises by pests;
    and

    (3) You must not use insecticides, fumigants, fungicides, or rodenticides, unless you take precautions to protect against the contamination of components, dietary supplements, or contact surfaces.

    (e)

    Water supply.

    (1) You must provide water that is safe and sanitary, at suitable temperatures, and under pressure as needed, for all uses where water does not become a component of the dietary supplement.

    (2) Water that is used in a manner such that the water may become a component of the dietary supplement, e.g., when such water contacts components, dietary supplements, or any contact surface, must,
    at a minimum, comply with applicable Federal, State, and local requirements and not contaminate the dietary supplement.

    (f)

    Plumbing.

    The plumbing in your physical plant must be of an adequate size and design and be adequately installed and maintained to:

    (1) Carry sufficient amounts of water to required locations throughout the physical plant;

    (2) Properly convey sewage and liquid disposable waste from your physical plant;

    (3) Avoid being a source of contamination to components, dietary supplements, water supplies, or any contact surface, or creating an unsanitary condition;

    (4) Provide adequate floor drainage in all areas where floors are subject to flooding-type cleaning or where normal operations release or discharge water or other liquid waste on the floor; and

    (5) Not allow backflow from, or cross connection between, piping systems that discharge waste water or sewage and piping systems that carry water used for manufacturing dietary supplements, for cleaning
    contact surfaces, or

    for use in bathrooms or hand-washing facilities.

    (g)

    Sewage disposal.

    You must dispose of sewage into an adequate sewage system or through other adequate means.

    (h)

    Bathrooms.

    You must provide your employees with adequate, readily accessible bathrooms. The bathrooms must be kept clean and must not be a potential source of contamination to components, dietary supplements,
    or contact surfaces.

    (i)

    Hand-washing facilities.

    You must provide hand-washing facilities that are designed to ensure that an employee''s hands are not a source of contamination of components, dietary supplements, or any contact surface, by providing
    facilities that are adequate, convenient, and furnish running water at a suitable temperature.

    (j)

    Trash disposal.

    You must convey, store, and dispose of trash to:

    (1) Minimize the development of odors;

    (2) Minimize the potential for the trash to attract, harbor, or become a breeding place for pests;

    (3) Protect against contamination of components, dietary supplements, any contact surface, water supplies, and grounds surrounding your physical plant; and

    (4) Control hazardous waste to prevent contamination of components, dietary supplements, and contact surfaces.

    (k)

    Sanitation supervisors.

    You must assign one or more employees to supervise overall sanitation. Each of these supervisors must be qualified by education, training, or experience to develop and supervise sanitation procedures.'
