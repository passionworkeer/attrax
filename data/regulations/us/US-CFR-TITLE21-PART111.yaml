    Do other statutory provisions and regulations apply?

    In addition to this part, you must comply with other applicable statutory provisions and regulations under the act related to dietary supplements. For importers of dietary supplements and dietary supplement
    components, the regulation on foreign supplier verification programs can be found in subpart L of part 1 of this chapter.

    [72 FR 34942, June 25, 2007, as amended at 80 FR 74352, Nov. 27, 2015]

    Subpart B—Personnel'
