    alkyl) ester, ammonium salt (also known as butanedioic acid sulfo-1, 4-diisodecyl ester, ammonium salt [CAS Reg. No. 144093-88-9]) as a surface active agent at a level not to exceed 3.0 percent by weight
    of the finished pressure-sensitive adhesive.

    (b) Pressure-sensitive adhesives prepared from one or a mixture of two or more of the substances listed in this paragraph may be used as the food-contact surface of labels and/or tapes applied to raw
