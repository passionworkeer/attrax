  title: § 175.210
  text: '§ 175.210

    Acrylate ester copolymer coating.

    Acrylate ester copolymer coating may safely be used as a food-contact surface of articles intended for packaging and holding food, including heating of prepared food, subject to the provisions of this
    section:

    (a) The acrylate ester copolymer is a fully polymerized copolymer of ethyl acrylate, methyl methacrylate, and methacrylic acid applied in emulsion form to molded virgin fiber and heat-cured to an insoluble
    resin.

    (b) Optional substances used in the preparation of the polymer and in the preparation and application of the emulsion may include substances named in this paragraph, in an amount not to exceed that
    required to accomplish the desired technical effect and subject to any limitation prescribed:

    Provided, however,

    That any substance named in this paragraph and covered by a specific regulation in subchapter B of this chapter must meet any specifications in such regulation.

    List of substances

    Limitations

    Aluminum stearate

    Ammonium lauryl sulfate

    Borax

    Not to exceed the amount required as a preservative in emulsion defoamer.

    Disodium hydrogen phosphate

    Do.

    Formaldehyde

    Glyceryl monostearate

    Methyl cellulose

    Mineral oil

    Paraffin wax

    Potassium hydroxide

    Potassium persulfate

    Tallow

    Tetrasodium pyrophosphate

    Titanium dioxide

    (c) The coating in the form in which it contacts food meets the following tests:

    (1) An appropriate sample when exposed to distilled water at 212 °F for 30 minutes shall yield total chloroform-soluble extractables not to exceed 0.5 milligram per square inch.

    (2) An appropriate sample when exposed to

    n-

    heptane at 120 °F for 30 minutes shall yield total chloroform-soluble extractables not to exceed 0.5 milligram per square inch.'
- id: art-5
  title: § 175.230
  text: '§ 175.230

    Hot-melt strippable food coatings.

    Hot-melt strippable food coatings may be safely applied to food, subject to the provisions of this section.

    (a) The coatings are applied to and used as removable coatings for food.

    (b) The coatings may be prepared, as mixtures, from the following substances:

    (1) Substances generally recognized as safe in food.

    (2) Substances identified in this subparagraph.

    List of substances

    Limitations

    Acetylated monoglycerides

    Complying with 172.828 of this chapter.

    Cellulose acetate butyrate

    Cellulose acetate propionate

    Mineral oil, white

    For use only as a component of hot-melt strippable food coatings applied to frozen meats and complying with § 172.878 of this chapter.'
- id: art-6
  title: § 175.250
  text: '§ 175.250

    Paraffin (synthetic).

    Synthetic paraffin may be safely used as an impregnant in, coating on, or component of coatings on articles used in producing, manufacturing, packing, processing, preparing, treating, packaging, transporting,
    or holding food in accordance with the following prescribed conditions:

    (a) The additive is synthesized by the Fischer-Tropsch process from carbon monoxide and hydrogen, which are catalytically converted to a mixture of paraffin hydrocarbons. Lower molecular-weight fractions
    are removed by distillation. The residue is hydrogenated and may be further treated by percolation through activated charcoal. This mixture can be fractionated into its components by a solvent separation
    method, using synthetic isoparaffinic petroleum hydrocarbons complying with § 178.3530 of this chapter.

    (b) Synthetic paraffin shall conform to the following specifications:

    (1)

    Congealing point.

    There is no specification for the congealing point of synthetic paraffin components, except those components that have a congealing point below 50 °C when used in contact with food Types III, IVA, V,
    VIIA, and IX identified in table 1 of § 176.170(c) of this chapter and under conditions of use E, F, and G described in table 2 of § 176.170(c) of this chapter shall be limited to a concentration not
    exceeding 15 percent by weight of the finished coating. The congealing point shall be determined by ASTM method D938-71 (Reapproved 1981), “Standard Test Method for Congealing Point of Petroleum Waxes,
    Including Petrolatum,” which is incorporated by reference. Copies may be obtained from the American Society for Testing Materials, 100 Barr Harbor Dr., West Conshohocken, Philadelphia, PA 19428-2959,
    or may be examined at the National Archives and Records Administration (NARA). For information on the availability of this material at NARA, call 202-741-6030, or go to:

    http://www.archives.gov/federal_register/code_of_federal_regulations/ibr_locations.html.

    (2)

    Oil content.

    The substance has an oil content not exceeding 2.5 percent as determined by ASTM method D721-56T, “Tentative Method of Test for Oil Content of Petroleum Waxes” (Revised 1956), which is incorporated
    by reference. See paragraph (b)(1) of this section for availability of the incorporation by reference.

    (3)

    Absorptivity.

    The substance has an absorptivity at 290 millimicrons in decahydronaphthalene at 88 °C not exceeding 0.01 as determined by ASTM method E131-81a, “Standard Definitions of Terms and Symbols Relating to
    Molecular-Spectroscopy,” which is incorporated by reference. See paragraph (b)(1) of this section for availability of the incorporation by reference.

    (c) The provisions of this section are not applicable to synthetic paraffin

    used in food-packaging adhesives complying with § 175.105.

    [42 FR 14534, Mar. 15, 1977, as amended at 47 FR 11839, Mar. 19, 1982; 49 FR 10106, Mar. 19, 1984; 51 FR 47010, Dec. 30, 1986; 60 FR 39645, Aug. 3, 1995]'
- id: art-7
  title: § 175.260
  text: '§ 175.260

    Partial phosphoric acid esters of polyester resins.

    Partial phosphoric acid esters of polyester resins identified in this section and applied on aluminum may be safely used as food-contact coatings, in accordance with the following prescribed conditions:

    (a) For the purpose of this section, partial phosphoric acid esters of polyester resins are prepared by the reaction of trimellitic anhydride with 2,2-dimethyl-1,3-propanediol followed by reaction of
    the resin thus produced with phosphoric acid anhydride to produce a resin having an acid number of 81 to 98 and a phosphorus content of 4.05 to 4.65 percent by weight.

    (b) The coating is chemically bonded to the metal and cured at temperatures exceeding 450 °F.

    (c) The finished food-contact coating, when extracted with the solvent or solvents characterizing the type of food and under the conditions of time and temperature characterizing the conditions of its
    intended use, as determined from tables 1 and 2 of § 175.300(d), yields total extractives in each extracting solvent not to exceed 0.3 milligrams per square inch of food-contact surface, as determined
    by the methods described in § 175.300(e), and the coating yields 2,2-dimethyl-1,3-propanediol in each extracting solvent not to exceed 0.3 micrograms per square inch of food-contact surface. In testing
    the finished food-contact articles, a separate test sample is to be used for each required extracting solvent.'
- id: art-8
  title: § 175.270
  text: '§ 175.270

    Poly(vinyl fluoride) resins.

    Poly(vinyl fluoride) resins identified in this section may be safely used as components of food-contact coatings for containers having a capacity of not less than 5 gallons, subject to the provisions
    of this section.

    (a) For the purpose of this section, poly(vinyl fluoride) resins consist of basic resins produced by the polymerization of vinyl fluoride.

    (b) The poly(vinyl fluoride) basic resins have an intrinsic viscosity of not less than 0.75 deciliter per gram as determined by ASTM method D1243-79, “Standard Test Method for Dilute Solution Viscosity
    of Vinyl Chloride Polymers,” which is incorporated by reference. Copies may be obtained from the American Society for Testing Materials, 100 Barr Harbor Dr., West Conshohocken, Philadelphia, PA 19428-2959,
    or may be examined at the National Archives and Records Administration (NARA). For information on the availability of this material at NARA, call 202-741-6030, or go to:

    http://www.archives.gov/federal_register/code_of_federal_regulations/ibr_locations.html.

    (1)

    Solvent. N,N-

    Dimethylacetamide, technical grade.

    (2)

    Solution.

    Powdered resin and solvent are heated at 120 °C until the resin is dissolved.

    (3)

    Temperature.

    Flow times of the solvent and solution are determined at 110 °C.

    (4)

    Viscometer.

    Cannon-Ubbelohde size 50 semimicro dilution viscometer (or equivalent).

    (5)

    Calculation.

    The calculation method used is that described in appendix X 1.3 (ASTM method D1243-79, “Standard Test Method for Dilute Solution Viscosity of Vinyl Chloride Polymers,” which is incorporated by reference;
    see paragraph (b) of this section for availability of the incorporation by reference) with the reduced viscosity determined for three concentration levels not greater than 0.5 gram per deciliter and
    extrapolated to zero concentration for intrinsic viscosity. The following formula is used for determining reduced viscosity:

    ER01JA93.387

    where:

    t

    = Solution efflux time.

    to

    = Solvent efflux time.

    c

    = Concentration of solution in terms of grams per deciliter.

    [42 FR 14534, Mar. 15, 1977, as amended at 47 FR 11839, Mar. 19, 1982; 49 FR 10107, Mar. 19, 1984]'
