  title: § 175.300
  text: '§ 175.300

    Resinous and polymeric coatings.

    Resinous and polymeric coatings may be safely used as the food-contact surface of articles intended for use in producing, manufacturing, packing, processing, preparing, treating, packaging, transporting,
    or holding food, in accordance with the following prescribed conditions:

    (a) The coating is applied as a continuous film or enamel over a metal substrate, or the coating is intended for repeated food-contact use and is applied to any suitable substrate as a continuous film
    or enamel that serves as a functional barrier between the food and the substrate. The coating is characterized by one or more of the following descriptions:

    (1) Coatings cured by oxidation.

    (2) Coatings cured by polymerization, condensation, and/or cross-linking without oxidation.

    (3) Coatings prepared from pre­poly­merized substances.

    (b) The coatings are formulated from optional substances that may include:

    (1) Substances generally recognized as safe in food.

    (2) Substances the use of which is permitted by regulations in this part or which are permitted by prior sanction or approval and employed under the specific conditions, if any, of the prior sanction
    or approval.

    (3) Any substance employed in the production of resinous and polymeric coatings that is the subject of a regulation in subchapter B of this chapter and conforms with any specification in such regulation.
    Substances named in this paragraph (b)(3) and further identified as required:

