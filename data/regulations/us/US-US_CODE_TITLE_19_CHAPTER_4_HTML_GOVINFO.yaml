- id: art-4
  title: §1202. Harmonized Tariff Schedule
  text: '§1202. Harmonized Tariff Schedule


    Publication of Harmonized Tariff Schedule


    The Harmonized Tariff Schedule of the United States is not published in the Code. A current version of the Harmonized Tariff Schedule is maintained and published periodically by the United States International
    Trade Commission and is available at their website and for sale by the Superintendent of Documents, U.S. Government Publishing Office, Washington, D.C. 20402.


    Statutory Notes and Related Subsidiaries


    Reference to Tariff Schedules To Be Treated as Reference to Harmonized Tariff Schedule


    Reference in any law to "Tariff Schedules of the United States", "the Tariff Schedules", "such Schedules", and any other general reference to the old Schedules to be treated as reference to Harmonized
    Tariff Schedule, see section 3012 of this title.


    SUBTITLE II—SPECIAL PROVISIONS


    Part I—Miscellaneous'
