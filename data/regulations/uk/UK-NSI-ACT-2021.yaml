  text: "18 January 2024\nUpdated the collection: Review of the operation of the NSI Act processes\n18 January 2024\nUpdated to remove the notice of the call for evidence as it has now closed.\n19 November\
    \ 2023\nUpdated to remove the notice for maintenance as it has now been completed.\n17 November 2023\nAdded a note that the NSI notification service will be unavailable for much of the day on Saturday\
    \ 18th of November 2023 while essential maintenance takes place.\n13 November 2023\nAdded a link to the page: Call for Evidence - National Security and Investment Act\n26 October 2023\nAdding a message\
    \ to say that the NSI notification service will be unavailable for much of the day on Saturday 28th October 2023 while essential maintenance takes place.\n25 September 2023\nUpdated to reflect the maintenance\
    \ work was completed and the service is available again.\n23 September 2023\nAdded a notice that the NSI notification service will be unavailable for much of the day on Saturday 23rd of September 2023\
    \ while essential maintenance takes place. We apologise for any inconvenience.\n11 July 2023\nAdded a link to the following page: National Security and Investment Act 2021: Annual Report 2023\n10 July\
    \ 2023\nRemoved an update regarding maintenance on the system as it has been completed.\n5 July 2023\nAdded a message to inform users that the NSI notification service will be unavailable for much of\
