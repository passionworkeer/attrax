- id: art-1
  title: National Security and Investment Act 2021 - GOV.UK
  text: "National Security and Investment Act 2021 - GOV.UK\nCookies on GOV.UK\nWe use some essential cookies to make this website work.\nWe’d like to set additional cookies to understand how you use GOV.UK,\
    \ remember your settings and improve government services.\nWe also use cookies set by other sites to help us deliver content from their services.\nYou have accepted additional cookies. \nYou can \n\
    change your cookie settings\n at any time.\nYou have rejected additional cookies. \nYou can \nchange your cookie settings\n at any time.\nAccept additional cookies\nReject additional cookies\nView cookies\n\
    \          Hide cookie message\nSkip to main content\n    Collection\n    National Security and Investment Act 2021\n    Guidance and information about the National Security and Investment Act.\nFrom:\n\
    Cabinet Office\nPublished\n11 November 2020\nLast updated\n        28 March 2026\n          — \n            See all updates\nGet emails about this page\nThe government has now published its \nresponse\
    \ to the consultation on the \nNSI\n Act Notifiable Acquisition Regulations (\nNARs\n)\n. This consultation response summarises the feedback received and sets out the changes that the government will\
    \ take forward for each schedule of the \nNARs\n.\nThe National Security and Investment Act (\nNSI\n) came into force on 4 January 2022.\nThe \nNSI\n Act gives the government powers to scrutinise and\
    \ intervene in business transactions, such as takeovers, to protect national security, while providing businesses and investors with the certainty and transparency they need to do business in the UK.\n\
    This page provides links to guidance on the rules and the accompanying legislation.\nSubmitting a notification about an acquisition\nWe have provided \nguidance on the information you need to complete\
    \ a notification form\n.\nWe have also published the forms here so you can collect all the information you need before submitting your answers via the \nNSI\n notification service.\nIn exercising its\
    \ statutory functions under the National Security and Investment Act 2021, the Investment Security Unit within the Cabinet Office may observe, monitor, record, retain and share within government internet\
    \ data which is available to anyone. This is known as ‘open source’ material and includes:\nNews reports\nInternet sites\nPublic records such as Companies House and Land Registry\nBlogs and social networking\
    \ sites where no privacy settings have been applied\nThe Cabinet Office may also use third party service providers, including aggregators of open-source information, to obtain information.\nSubmit a\
    \ notification about an acquisition via the \nNSI\n service\nPlease be aware that it is currently taking longer than usual to accept notifications, however this will not affect the 30 working days once\
    \ accepted. We appreciate your patience and understanding.\nNational Security and Investment notification service: mandatory, voluntary and retrospective forms\n                      28 March 2026\n\
    \                    Form\nStatement on the use of the call-in power\nThe Section 3 Statement sets out how the Secretary of State can exercise the power to give a call-in notice, as set out in section\
    \ 3 of the NSI Act.\nNational security and investment: statement about exercise of the call-in power\n                      21 May 2024\n                    Notice\nPrincipal guidance on the rules about\
    \ acquisitions that could harm the UK's national security\nNSI\n Act guidance overview\n: this guidance sets out what types of acquisitions are covered, when you need to tell the government about an\
    \ acquisition, and how the government will scrutinise the acquisition\nGuidance on notifiable acquisitions in the 17 mandatory areas\n: If an entity you are acquiring performs a certain activity, it\
    \ could put you in scope of the National Security and Investment Act and you may be legally required to tell the government about it (known as a ‘mandatory notification’). This guidance tells you what\
    \ these activities are.\nHow to submit a notification form"
- id: art-2
  title: ': assists parties when completing a notification form and ex'
  text: ": assists parties when completing a notification form and explains the information parties might need to include when completing the form. This is accompanied by a privacy notice explaining how\
    \ the ISU processes personal data and how it applies data protection principles.\nThis \nflowchart\n is to help you decide whether you need to notify the government about an acquisition\nMarket Guidance\
    \ notes: we will publish regular updates to the market on various aspects of the \nNSI\n Act.\nNational Security and Investment (NSI) Act: Market Guidance\n                      21 May 2024\n      \
    \              Guidance\nOther related guidance and documents\nOperation of the National Security and Investment Act 2021: memorandum of understanding between the Cabinet Office and the CMA\n      \
    \                26 March 2026\n                    Notice\nThe National Security and Investment Act alongside regulatory requirements\n                      19 June 2023\n                    Guidance\n\
    How the National Security and Investment Act could affect people or acquisitions outside the UK\n                      21 May 2024\n                    Guidance\nNational Security and Investment Act:\
    \ guidance for the higher education and research-intensive sectors\n                      21 May 2024\n                    Guidance\nNational Security and Investment Act 2021: guidance on compliance\
    \ and enforcement\n                       6 February 2024\n                    HTML Publication\nNational Security and Investment Act 2021: guidance for new build downstream gas and electricity assets\n\
    \                       6 February 2024\n                    Guidance\nNotice of final orders made under the Act\nNotices of final orders under the National Security and Investment Act 2021\n      \
    \                22 April 2026\n                    Collection\nAnnual reports\nNational Security and Investment Act 2021: Annual Report 2024-25\n                      22 July 2025\n               \
    \     Corporate report\nNational Security and Investment Act 2021: Annual Report 2023-24\n                       7 October 2024\n                    Corporate report\nNational Security and Investment\
    \ Act 2021: Annual Report 2022-23\n                      10 September 2024\n                    Corporate report\nNational Security and Investment Act 2021: annual report 2022\n                    \
    \   6 February 2024\n                    Corporate report\nLegislation\nRead the \nNational Security and Investment Act 2021\n on legislation.gov.uk.\nSecondary legislation\nNotifiable acquisition statutory\
    \ instrument\n - this sets out the acquisitions of qualifying entities in the 17 areas of the economy that are subject to the mandatory notification requirements\nMonetary Penalties statutory instrument\n\
    \ - this sets out the methods for calculating business turnover in the event of the Secretary of State issuing monetary penalties for non-compliance with the National Security and Investment Act\nForm\
    \ and Content of Notification Forms Statutory Instrument\n - this sets out the information required in the notification forms that parties can submit to the government under the Act\nProcedure for Service\
    \ Statutory Instrument\n - this sets out how the government sends and receives documents under the Act\nNational security and investment: statement about exercise of the call-in power\n            \
    \          21 May 2024\n                    Notice\nReview of the operation of the NSI Act processes\nThe government is monitoring closely how the NSI Act works in practice, analysing trends and risks\
    \ to ensure the system remains effective, efficient, and up to date.\nConsultation on the NSI Act Notifiable Acquisition Regulations\n                      12 March 2026\n                    Consultation\
    \ outcome\nReport on the NSI Act Notifiable Acquisition Regulations\n                      19 December 2024\n                    Corporate report\nCall for Evidence - National Security and Investment\
    \ Act\n                      18 April 2024\n                    Call for evidence outcome"
