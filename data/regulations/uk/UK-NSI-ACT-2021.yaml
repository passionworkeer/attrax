    \ of the National Security and Investment: Market Guidance April 2023\n24 April 2023\nAdded a new section: Information gathering\n6 April 2023\nThe NSI notification service will be unavailable for much\
    \ of the day on Monday 10 April 2023 while essential maintenance takes place.\n23 March 2023\nAdded link to Memorandum of Understanding concerning Parliamentary scrutiny of the work of the Investment\
    \ Security Unit (ISU).\n2 March 2023\nThe NSI notification service will be unavailable on Saturday 4 March 2023 while essential maintenance takes place.\n16 January 2023\nNSI notification service back\
    \ online.\n13 January 2023\nThe NSI notification service will be unavailable on the weekend of 14-15 January 2023 while essential maintenance takes place. We apologise for any inconvenience.\n21 September\
    \ 2022\nAdded link to Notice of Final Orders made under the National Security and Investment Act 2021.\n20 July 2022\nAdded guidance for new build downstream gas and electricity assets.\n16 June 2022\n\
    Added NSIA annual report 2022, and a Memorandum of understanding on the operation of the National Security and Investment Act 2021.\n11 April 2022\nAdded National Security and Investment Act 2021: guidance\
    \ on compliance and enforcement.\n18 March 2022\nThe NSI notification service will be unavailable from 4:00pm Sunday 20 March to 9:00am Monday 21 March 2022, due to routine maintenance work. If you\
    \ have any notifications in progress they will not be affected.\n14 January 2022\nThe National Security and Investment notification service will not be available on Saturday 15 January 2022 between\
    \ 8:00am and 9:00am while we undertake maintenance. If you have a notification in progress it won't be affected.\n4 January 2022\nThe National Security and Investment (NSI) Act came into force on 4\
    \ January 2022. The new rules have now started and the National Security and Investment notification service is open.\n17 December 2021\nAdded NSI notification service forms to provide details of the\
    \ information that will be required when you submit a notification. The service goes live on 4 January 2022.\n11 November 2020\nFirst published.\n    Contents\nIs this page useful?\n              Maybe\n\
