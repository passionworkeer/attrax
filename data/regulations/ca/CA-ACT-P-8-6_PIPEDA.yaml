    Her Majesty, by and with the advice and consent of the Senate and House of Commons of Canada, enacts as follows:

    Short Title

    Short title

    1

    This Act may be cited as the

    Personal Information Protection and Electronic Documents Act

    .

    PART 1

    Protection of Personal Information in the Private Sector

    Interpretation

    Definitions

    2

    (1)

    The definitions in this subsection apply in this Part.

    alternative format

    , with respect to personal information, means a format that allows a person with a sensory disability to read or listen to the personal information. (

    support de substitution

    )

    breach of security safeguards

    means the loss of, unauthorized access to or unauthorized disclosure of personal information resulting from a breach of an organization’s security safeguards that are referred to in clause 4.7 of Schedule
    1 or from a failure to establish those safeguards. (

    atteinte aux mesures de sécurité

    )

    business contact information

    means any information that is used for the purpose of communicating or facilitating communication with an individual in relation to their employment, business or profession such as the individual’s
    name, position name or title, work address, work telephone number, work fax number or work electronic address. (

    coordonnées d’affaires

    )

    business transaction

    includes

    (a)

    the purchase, sale or other acquisition or disposition of an organization or a part of an organization, or any of its assets;

    (b)

    the merger or amalgamation of two or more organizations;

    (c)

    the making of a loan or provision of other financing to an organization or a part of an organization;

    (d)

    the creating of a charge on, or the taking of a security interest in or a security on, any assets or securities of an organization;

    (e)

    the lease or licensing of any of an organization’s assets; and

    (f)

    any other prescribed arrangement between two or more organizations to conduct a business activity. (

    transaction commerciale

    )

    commercial activity

    means any particular transaction, act or conduct or any regular course of conduct that is of a commercial character, including the selling, bartering or leasing of donor, membership or other fundraising
    lists. (

    activité commerciale

    )

    Commissioner

    means the Privacy Commissioner appointed under section 53 of the

    Privacy Act

    . (

    commissaire

    )

    Court

    means the Federal Court. (

    Cour

    )

    federal work, undertaking or business

    means any work, undertaking or business that is within the legislative authority of Parliament. It includes

    (a)

    a work, undertaking or business that is operated or carried on for or in connection with navigation and shipping, whether inland or maritime, including the operation of ships and transportation by ship
    anywhere in Canada;

    (b)

    a railway, canal, telegraph or other work or undertaking that connects a province with another province, or that extends beyond the limits of a province;

    (c)

    a line of ships that connects a province with another province, or that extends beyond the limits of a province;

    (d)

    a ferry between a province and another province or between a province and a country other than Canada;

    (e)

    aerodromes, aircraft or a line of air transportation;

    (f)

    a radio broadcasting station;

    (g)

    a bank or an authorized foreign bank as defined in section 2 of the

    Bank Act

    ;

    (h)

    a work that, although wholly situated within a province, is before or after its execution declared by Parliament to be for the general advantage of Canada or for the advantage of two or more provinces;

