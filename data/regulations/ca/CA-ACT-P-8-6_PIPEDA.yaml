    Purpose

    Purpose

    3

    The purpose of this Part is to establish, in an era in which technology increasingly facilitates the circulation and exchange of information, rules to govern the collection, use and disclosure of personal
    information in a manner that recognizes the right of privacy of individuals with respect to their personal information and the need of organizations to collect, use or disclose personal information
    for purposes that a reasonable person would consider appropriate in the circumstances.

    Application

    Application

    4

    (1)

    This Part applies to every organization in respect of personal information that

    (a)

    the organization collects, uses or discloses in the course of commercial activities; or

    (b)

    is about an employee of, or an applicant for employment with, the organization and that the organization collects, uses or discloses in connection with the operation of a federal work, undertaking or
    business.

    Application

    (1.1)

    This Part applies to an organization set out in column 1 of Schedule 4 in respect of personal information set out in column 2.

    Limit

    (2)

    This Part does not apply to

    (a)

    any government institution to which the

    Privacy Act

    applies;

    (b)

    any individual in respect of personal information that the individual collects, uses or discloses for personal or domestic purposes and does not collect, use or disclose for any other purpose; or

    (c)

    any organization in respect of personal information that the organization collects, uses or discloses for journalistic, artistic or literary purposes and does not collect, use or disclose for any other
    purpose.

    Other Acts

    *

    (3)

    Every provision of this Part applies despite any provision, enacted after this subsection comes into force, of any other Act of Parliament, unless the other Act expressly declares that that provision
    operates despite the provision of this Part.

    *

    [Note: Subsection 4(3) in force January 1, 2001,

    see

    SI/2000-29.]

    2000, c. 5, s. 4; 2015, c. 32, s. 3, c. 36, s. 164

