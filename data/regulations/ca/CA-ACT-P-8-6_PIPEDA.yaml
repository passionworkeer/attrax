    DIVISION 1

    Protection of Personal Information

    Compliance with obligations

    5

    (1)

    Subject to sections 6 to 9, every organization shall comply with the obligations set out in Schedule 1.

    Meaning of

    should

    (2)

    The word

    should

    , when used in Schedule 1, indicates a recommendation and does not impose an obligation.

    Appropriate purposes

    (3)

    An organization may collect, use or disclose personal information only for purposes that a reasonable person would consider are appropriate in the circumstances.

    Effect of designation of individual

    6

    The designation of an individual under clause 4.1 of Schedule 1 does not relieve the organization of the obligation to comply with the obligations set out in that Schedule.

    Valid consent

    6.1

    For the purposes of clause 4.3 of Schedule 1, the consent of an individual is only valid if it is reasonable to expect that an individual to whom the organization’s activities are directed would understand
    the nature, purpose and consequences of the collection, use or disclosure of the personal information to which they are consenting.

    2015, c. 32, s. 5

