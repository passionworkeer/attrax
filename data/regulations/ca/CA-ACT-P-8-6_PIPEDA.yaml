  text: 'An organization that responds within the time limit and refuses a request shall inform the individual in writing of the refusal, setting out the reasons and any recourse that they may have under
    this Part.

    Retention of information

    (8)

    Despite clause 4.5 of Schedule 1, an organization that has personal information that is the subject of a request shall retain the information for as long as is necessary to allow the individual to exhaust
    any recourse under this Part that they may have.

    2000, c. 5, s. 8; 2015, c. 32, s. 8(F)

    When access prohibited

    9

    (1)

    Despite clause 4.9 of Schedule 1, an organization shall not give an individual access to personal information if doing so would likely reveal personal information about a third party. However, if the
    information about the third party is severable from the record containing the information about the individual, the organization shall sever the information about the third party before giving the individual
    access.

    Limit

    (2)

    Subsection (1) does not apply if the third party consents to the access or the individual needs the information because an individual’s life, health or security is threatened.

