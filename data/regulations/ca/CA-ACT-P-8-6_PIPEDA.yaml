    Collection of electronic addresses, etc.

    (2)

    Paragraphs 7(1)(a) and (b.1) to (d) and (2)(a) to (c.1) and the exception set out in clause 4.3 of Schedule 1 do not apply in respect of

    (a)

    the collection of an individual’s electronic address, if the address is collected by the use of a computer program that is designed or marketed primarily for use in generating or searching for, and
    collecting, electronic addresses; or

    (b)

    the use of an individual’s electronic address, if the address is collected by the use of a computer program described in paragraph (a).

    Accessing a computer system to collect personal information, etc.

    (3)

    Paragraphs 7(1)(a) to (d) and (2)(a) to (c.1) and the exception set out in clause 4.3 of Schedule 1 do not apply in respect of

    (a)

    the collection of personal information, through any means of telecommunication, if the collection is made by accessing a computer system or causing a computer system to be accessed in contravention
    of an Act of Parliament; or

    (b)

    the use of personal information that is collected in a manner described in paragraph (a).

    2010, c. 23, s. 82; 2015, c. 32, s. 26

    Prospective business transaction

    7.2

    (1)

    In addition to the circumstances set out in subsections 7(2) and (3), for the purpose of clause 4.3 of Schedule 1, and despite the note that accompanies that clause, organizations that are parties to
    a prospective business transaction may use and disclose personal information without the knowledge or consent of the individual if

    (a)

    the organizations have entered into an agreement that requires the organization that receives the personal information

    (i)

    to use and disclose that information solely for purposes related to the transaction,

    (ii)

    to protect that information by security safeguards appropriate to the sensitivity of the information, and

    (iii)

    if the transaction does not proceed, to return that information to the organization that disclosed it, or destroy it, within a reasonable time; and

    (b)

    the personal information is necessary

    (i)

    to determine whether to proceed with the transaction, and

    (ii)

    if the determination is made to proceed with the transaction, to complete it.

    Completed business transaction

    (2)

    In addition to the circumstances set out in subsections 7(2) and (3), for the purpose of clause 4.3 of Schedule 1, and despite the note that accompanies that clause, if the business transaction is completed,
    organizations that are parties to the transaction may use and disclose personal information, which was disclosed under subsection (1), without the knowledge or consent of the individual if

    (a)

    the organizations have entered into an agreement that requires each of them

