    Certificate under

    Canada Evidence Act

    4.1

    (1)

    If a certificate under section 38.13 or 38.41 of the

    Canada Evidence Act

    prohibiting the disclosure of personal information of a specific individual is issued before a complaint is filed by that individual under this Part in respect of a request for access to that information,
    the provisions of this Part respecting that individual’s right of access to their personal information do not apply to the information that is subject to the certificate.

    Certificate following filing of complaint

    (2)

    Despite any other provision of this Part, if a certificate under section 38.13 or 38.41 of the

    Canada Evidence Act

    prohibiting the disclosure of personal information of a specific individual is issued after the filing of a complaint under this Part in relation to a request for access to that information:

    (a)

    all proceedings under this Part in respect of that information, including an investigation, audit, appeal or judicial review, are discontinued;

    (b)

    the Commissioner shall not disclose the information and shall take all necessary precautions to prevent its disclosure; and

    (c)

    the Commissioner shall, within 10 days after the certificate is published in the

    Canada Gazette

    , return the information to the organization that provided the information.

    Information not to be disclosed

    (3)

    The Commissioner and every person acting on behalf or under the direction of the Commissioner, in carrying out their functions under this Part, shall not disclose information subject to a certificate
    issued under section 38.13 or 38.41 of the

    Canada Evidence Act

    , and shall take every reasonable precaution to avoid the disclosure of that information.

    Power to delegate

    (4)

    The Commissioner may not delegate the investigation of any complaint relating to information subject to a certificate issued under section 38.13 or 38.41 of the

    Canada Evidence Act

    except to one of a maximum of four officers or employees of the Commissioner specifically designated by the Commissioner for the purpose of conducting that investigation.

    2001, c. 41, s. 103

