    CANADA CONSUMER PRODUCT SAFETY ACT

    Consumer Chemicals and Containers Regulations, 2001

    P.C.

    2001-1343

    2001

    8

    1

    Her Excellency the Governor General in Council, on the recommendation of the Minister of Health, pursuant to section 5

    a

    of the

    Hazardous Products Act

    , hereby makes the annexed

    Consumer Chemicals and Containers Regulations, 2001

    .

    a

    R.S., c. 24 (3rd Supp.), s. 1

    Interpretation

    Definitions

    1

    (1)

    The definitions in this subsection apply in these Regulations.

    acid reserve

    means the quantity of an alkali, expressed in grams of sodium hydroxide, that is required to bring 100 mL of a liquid acidic product, or 100 g of an acidic product in the form of a solid, paste or gel,
    to a pH of 4.00 ± 0.05. (

    réserve acide

    )

    Act

    [Repealed, SOR/2011-24, s. 1]

    alkali reserve

    means the quantity of an alkali, expressed in grams of sodium hydroxide, that is neutralized when 100 mL of a liquid basic product, or 100 g of a basic product in the form of a solid, paste or gel,
    is brought to a pH of 10.00 ± 0.05 by the addition of hydrochloric acid or its equivalent. (

    réserve alcaline

    )

    aspiration

    means the entry of a liquid or solid chemical product directly through the oral or nasal cavity, or indirectly from vomiting, into the trachea or lower respiratory system. (

    aspiration

    )

    chemical product

    means a product used by a consumer that has the properties of one or more of the following:

    (a)

    a toxic product;

    (b)

    a corrosive product;

    (c)

    a flammable product; or

    (d)

    a quick skin-bonding adhesive.

    It does not include any of the following:

    (e)

    a product described in any of paragraphs (a) to (d) if it is not possible for a user to be exposed to the product or to any of its hazardous ingredients during reasonably foreseeable use;

    (f)

    a portable petroleum container that conforms with CSA B306 or CSA B376;

    (g)

    a lighter;

    (h)

    a fire extinguisher that conforms with ULC-S503, ULC-S504, ULC-S507 or ULC-S512; or

    (i)

    a container of fuel, such as gasoline, ethanol or propane, if the container is permanently attached to an internal combustion engine, a gas turbine or an appliance that uses the fuel. (

    produit chimique

    )

    complex mixture

    means a combination of chemicals that has a generic name that is not a trade name and is

    (a)

    a substance of natural origin;

    (b)

    a fraction obtained by a physical separation process from a substance of a natural origin; or

    (c)

    a chemical modification of a substance of natural origin or of a fraction obtained by a physical separation process from a substance of natural origin. (

    mélange complexe

    )

    container

    means

    (a)

    a Category 5 pressurized container that is or is likely to be used by a consumer, including an empty container, as described in Part 5;

    (b)

    an empty container that is destined for use by a consumer to store or dispense a chemical product; or

    (c)

    any other container that is or is likely to be used by a consumer to store or dispense a chemical product. (

    contenant

    )

    corrosive product

    means a chemical product that

    (a)

    is capable of inducing necrosis or ulceration of epithelial tissue;

    (b)

    is capable of causing an erythema or edema of the skin, corneal or iris damage or conjunctival swelling or redness; or

    (c)

    is identified in Part 2 as a Category 2 corrosive product. (

    produit corrosif

    )

    display surface

    means the portion of the surface area of a container on which the information required by these Regulations can be displayed. It does not include the surface area of the bottom, of any seam or of any
    concave or convex surface near the top or the bottom of a container. (

    aire d’affichage

    )

    dust

    means solid airborne particles that are mechanically generated. (

    poussière

    )

    first aid statement

    means

    (a)

    a list of the hazardous ingredients in the chemical product; and

    (b)'
- id: art-2
  title: a statement of the first aid treatment to be administered to
  text: 'a statement of the first aid treatment to be administered to anyone who has come into contact with a chemical product, such as through ingestion, absorption or inhalation, or information that may
    be helpful to someone who is assisting that individual. (

    énoncé de premiers soins

    )

    flame projection

    means the flame resulting from the ignition of a chemical product discharged from a spray container when tested in accordance with the procedure set out in Schedule 1. (

    projection de la flamme

    )

    flammable product

    means a chemical product that is capable of

    (a)

    spontaneous combustion;

    (b)

    becoming flammable when in contact with air; or

    (c)

    having a flash point below 60°C or a flame projection greater than 15 cm or exhibiting a flashback. (

    produit inflammable

    )

    flashback

    means the part of a flame projection that extends from the point of ignition back towards the spray container when a chemical product is tested in accordance with the procedure set out in Schedule 1. (

    retour de flamme

    )

    flash point

    means the minimum temperature at which a substance gives off a vapour in sufficient concentration to ignite under test conditions. (

    point d’éclair

    )

    fume

    means solid particles in the air that are generated by condensation from the vapour of a solid material. (

    fumée

    )

    fumes

    , in the context of the information that must be displayed on a container, means a vapour or a fume or both that may be given off by a chemical product under normal conditions of use or storage. (

    émanations

    )

    good scientific practices

    means

    (a)

    for the development of test data, conditions and procedures similar to those set out in the OECD Test Guidelines;

    (b)

    for laboratory practices, practices similar to those set out in the OECD Principles of Good Laboratory Practice; and

    (c)

    for human experience data, a peer-reviewed study of clinical cases. (

    bonnes pratiques scientifiques

    )

    hazard category

    means a category into which a chemical product or container is classified, in particular:

    (a)

    Category 1, toxic products set out in Part 1;

    (b)

    Category 2, corrosive products set out in Part 2;

    (c)

    Category 3, flammable products set out in Part 3;

    (d)

    Category 4, quick skin-bonding adhesives set out in Part 4; and

    (e)

    Category 5, pressurized containers set out in Part 5. (

    catégorie de danger

    )

    hazard symbol

    means a pictograph and its frame as set out in Schedule 2. (

    pictogramme de danger

    )

    hazardous ingredient

    means

    (a)

    a pure chemical product;

    (b)

    an ingredient present in a chemical product in a concentration of 1% or more that is taken into consideration when classifying the product and that

    (i)

    is a chemical product,

    (ii)

    the supplier believes on reasonable grounds may be harmful to humans,

    (iii)

    has toxicological properties that are not known to the supplier, or

    (iv)

    derives from a reaction between precursor constituents and the hazards associated with the chemical product are not known to the supplier; or

    (c)

    a complex mixture present in a chemical product in a concentration of 1% or more that is taken into consideration when classifying the product and that

    (i)

    is a chemical product,

    (ii)

    the supplier believes on reasonable grounds may be harmful to humans, or

    (iii)

    has toxicological properties that are not known to the supplier. (

    ingrédient dangereux

    )

    human experience data

    means data, collected in accordance with good scientific practices, that demonstrates that injury to or poisoning of a human has or has not resulted from

    (a)

    exposure to a chemical product; or

    (b)

    the reasonably foreseeable use of a chemical product or container by a consumer, including, in particular, the consumption of the product by a child. (

    données de l’expérience humaine

    )

    LC

    50

    means the concentration of a substance in air that, when administered by means of inhalation over a specified length of time in an animal assay, is expected to cause the death of at least 50% of a defined
    population of animals. (

    CL

    50

    )

    LD

    50'
- id: art-3
  title: means the single dose of a substance that, when administered
  text: 'means the single dose of a substance that, when administered by a defined route in an animal assay, is expected to cause the death of at least 50% of a defined population of animals. (

    DL

    50

    )

    main display panel

    means the part of the display surface that is displayed or visible under normal conditions of sale to the consumer. It includes

    (a)

    in the case of a rectangular container, the largest side of the display surface;

    (b)

    in the case of a cylindrical container, the larger of

    (i)

    the area of the top, or

    (ii)

    40% of the area obtained by multiplying the circumference of the container by the height of the display surface;

    (c)

    in the case of a bag, the largest side of the bag; and

    (d)

    in the case of any other container, the largest surface of the container that is not less than 40% of the display surface. (

    aire d’affichage principale

    )

    manufacturer

    includes a packager and a labeller. (

    fabricant

    )

    mist

    means droplets of liquid suspended in air that are produced by the condensation of a vapourized liquid or by the dispersion of a liquid by a spray container. (

    brouillard

    )

    mixture

    means a combination of two or more products, materials or substances that do not undergo a chemical change as a result of their interaction. (

    mélange

    )

    National Standard

    means a standard recognized by the National Standards System of the Standards Council of Canada. (

    norme nationale

    )

    normal atmospheric pressure

    means an absolute pressure of 101.324 kPa at 20°C. (

    pression atmosphérique normale

    )

    official languages

    means the English and French languages. (

    langues officielles

    )

    person responsible

    [Repealed, SOR/2016-170, s. 1]

    quick skin-bonding adhesive

    means a Category 4 adhesive set out in Part 4 that has properties similar to an alkyl cyanoacrylate adhesive and that is capable of bonding skin with skin instantly or nearly instantly. (

    adhésif qui colle rapidement la peau

    )

    responsible person

    means

    (a)

    the manufacturer, in the case of a chemical product or container that is manufactured in Canada; and

    (b)

    the importer, in the case of a chemical product or container that is imported. (

    responsable

    )

    single-use container

    means a non-reclosable container whose contents are to be used in their entirety immediately after the container is opened. (

    contenant à usage unique

    )

    spray container

    means a container that permits the dispersal of its contents in the form of a mist and includes a pressurized container and a pump-spray container. (

    contenant pulvérisateur

    )

    sub-category

    means one of the following classifications within a hazard category in which a chemical product may be classified, in particular:

    (a)

    in the case of a Category 1 toxic product, “very toxic”, “toxic” and “harmful”;

    (b)

    in the case of a Category 2 corrosive product, “very corrosive”, “corrosive” and “irritant”; and

    (c)

    in the case of a Category 3 flammable product, “spontaneously combustible”, “very flammable”, “flammable” and “combustible”. (

    sous-catégorie

    )

    toxic product

    means a chemical product that

    (a)

    is capable of causing a lethal effect on a human;

    (b)

    is capable of causing a serious and irreversible but non-lethal effect on a human, such as a depressed level of consciousness, muscular weakness or paralysis, acute renal or hepatic failure, arrhythmia,
    hypotension, dyspnea, respiratory depression, pulmonary edema or optic neuritis; or

    (c)

    is identified in Part 1 as a Category 1 toxic product. (

    produit toxique

    )

    vapour

    means the gaseous form of a substance that is found in a solid or liquid state at normal atmospheric pressure. (

    vapeur

    )

