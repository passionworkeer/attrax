    Data Sources

    Precedence of data sources

    6

    (1)

    The responsible person must determine the hazards arising from the reasonably foreseeable use of the chemical product or container from one or more of the following data sources in the following order
    of precedence:

    (a)

    human experience data pertaining to the product or container;

    (b)

    data, set out in peer-reviewed, scientific literature, from tests conducted using the product in accordance with the OECD Test Guidelines;

    (c)

    if tests using the product have not been conducted in accordance with the OECD Test Guidelines,

    (i)

    the peer-reviewed results of tests conducted with the product in accordance with

    (A)

    these Regulations,

    (B)

    a National Standard or an international standard recognized by the Standards Council of Canada, or

    (C)

    a generally accepted procedure that accorded with good scientific practices at the time the tests were conducted,

    (ii)

    the peer-reviewed results of tests conducted with a chemical product that has properties similar to those of the product under examination, in accordance with

    (A)

    OECD Test Guidelines,

    (B)

    a National Standard or an international standard recognized by the Standards Council of Canada, or

    (C)

    a generally accepted procedure that accorded with good scientific practices at the time the tests were conducted, or

    (iii)

    other current, peer-reviewed information about the product;

    (d)

    if the hazards associated with the product cannot be estimated from information referred to in paragraphs (a) to (c), data with respect to the hazards associated with

    (i)

    the hazardous ingredients, or

    (ii)

    a chemical product that has properties similar to those of the product under examination; or

    (e)

    the results of tests conducted by the responsible person in accordance with a test methodology that conforms with good scientific practices.

    Differing data sources

    (2)

    In the case of differing data sources,

    (a)

    an original literature source must be used in preference to literature that refers to the original study; and

    (b)

    a source that reports test results that conform with good scientific practices and that disclose the greatest hazard must be used.

    SOR/2016-170, s. 8(E)

    Containers

    Leakage test

    7

    A container of a liquid chemical product must pass the leakage test described in Schedule 3 or an equivalent test.

    Single-use containers

    8

    A single-use container must display, in the manner set out in sections 17 to 20, subsections 24(1) and (3) and sections 25 and 26, the following primary hazard statement:

    “USE ENTIRE CONTENTS ON OPENING.”

    “

    UTILISER LA TOTALITÉ DU CONTENU APRÈS OUVERTURE

    .”

    Child-resistant Containers

    Applicable standard

    9

    A child-resistant container must

    (a)

    be constructed so that it can be opened only by operating, puncturing or removing one of its functional and necessary parts using a tool that is not supplied with the container; or

    (b)

    meet the child test protocol requirements of one of CSA-Z76.1, ISO 8317 or 16 CFR 1700.20 or a standard that is at least equivalent.

    Maintain characteristics

    10

    (1)

    A child-resistant container must, when in contact with a chemical product, maintain its child-resistant characteristics throughout the useful life of the product.

    Evaluation

    (2)

    The responsible person, using good scientific practices, must evaluate

    (a)

    the compatibility of the chemical product with its child-resistant container, to determine that the chemical or physical properties of the product will not compromise or interfere with the proper functioning
    of the container; and

    (b)'
