    Alternatively, this diameter may be calculated by multiplying the square root of the area in cm

    2

    of the main display panel by 1.95.

    Signal word — height

    23

    The height of the signal word must be at least one quarter of the minimum diameter of a hazard symbol determined in accordance with section 22.'
