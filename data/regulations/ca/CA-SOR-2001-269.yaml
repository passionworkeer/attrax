    General Provisions

    Exceptions — importation to bring into compliance or to export

    3

    (1)

    A person may import a chemical product or container that does not comply with a requirement of these Regulations for the purpose of

    (a)

    bringing the product or container into compliance with the requirement;

    (b)

    reselling the product or container to a manufacturer in Canada who will bring it into compliance with the requirement; or

    (c)

    exporting the product or container to another country.

    Credible evidence

    (2)

    A person who imports a chemical product or a container for a purpose described in subsection (1) must, on the request of an inspector, provide credible evidence to the inspector that it is being brought
    into compliance with these Regulations or is being exported, as the case may be.

    (3)

    [Repealed, SOR/2009-165, s. 3]

    SOR/2009-165, s. 3

    Requirements

    Hazard Category, Container and Information

    Determination by responsible person

    4

    (1)

    The responsible person, using one or more of the applicable properties, data sources or test procedures set out in section 6 or Parts 1 to 5, must determine

    (a)

    the hazard categories of the chemical product or container and, if applicable, its appropriate sub-categories;

    (b)

    the type of container that is required; and

    (c)

    the information that is required to be displayed on the container.

    Multiple hazard categories

    (2)

    If a chemical product and its container fall into more than one hazard category, its container must display the information that is required for every applicable hazard category.

    Multiple sub-categories

    (3)

    Subject to subsection (4), if a chemical product falls into more than one sub-category within a hazard category, the responsible person must classify the product in the sub-category that represents
    the greatest hazard within each applicable hazard category.

    Multiple sub-categories — flammable products

    (4)

    If a chemical product falls into both the sub-category “spontaneously combustible” and another sub-category in the hazard category “Category 3, flammable product”, it must be classified in both sub-categories.

    Multiple routes of exposure

    (5)

    The container of a chemical product to which an individual may be exposed by more than one route of exposure must display the required information for each route of exposure.

    SOR/2016-170, s. 8(E)

    Documents

    5

    The responsible person must

    (a)'
