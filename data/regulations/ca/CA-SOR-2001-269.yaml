  title: 'the physical wear and stress factors and the force required '
  text: 'the physical wear and stress factors and the force required for opening and closing the container, to determine that the proper functioning of the container will be maintained for the number of
    openings and closings reasonably foreseeable for the size and contents of the container.

    SOR/2016-170, s. 8(E)

    Directions to open and close

    11

    (1)

    Subject to subsection (2), a child-resistant container that meets the requirements of paragraph 9(b) must display directions explaining how to open and, if applicable, to close the container

    (a)

    on the closure, using either or both of

    (i)

    words that comply with sections 17 to 19, or

    (ii)

    a diagram or self-explanatory symbol that complies with paragraph 17(b) and section 18; or

    (b)

    on the container, located after the positive instructions for the chemical product and set out in a manner that complies with requirements for a positive instruction in sections 17 to 19, subsection 24(1)
    and sections 25, 29 and 30.

    Exception

    (2)

    The directions for opening and, if applicable, closing a child-resistant container may be set out on the closure in only one official language if they are repeated on the container in the other official
    language in the manner set out in paragraph (1)(b).

    Documents

    12

    (1)

    The responsible person must prepare and maintain documents containing the following information and must keep those documents for a period of at least three years after the day on which the child-resistant
    container is manufactured in Canada or the day on which it is imported:

    (a)

    for a container that comes into direct contact with the chemical product, the specifications critical to the child-resistant characteristics of the container, which specifications must include

    (i)

    the physical measurements within which the container retains its child-resistant characteristics,

    (ii)

    if applicable, the torque that must be applied to open or close the container, and

    (iii)

    the compatibility of the container and its closure system with the chemical product that is to be put into it; and

    (b)

    the test results that demonstrate that the container and its closure system comply with the requirements of a standard set out in paragraph 9(b).

    Inspector’s request

    (2)

    The responsible person for a chemical product that is required by these Regulations to be packaged in a child-resistant container must provide an inspector with any of the documents that the inspector
    requests within 15 days after the day on which the request is received.

    SOR/2012-71, s. 4; SOR/2016-170, s. 4

    Child-resistant, single-use containers

    13

    A child-resistant, single-use container must display, in the manner set out in sections 17 to 20, subsections 24(1) and (3) and sections 25 and 26, the following primary hazard statement:

    “USE ENTIRE CONTENTS ON OPENING. THIS CONTAINER IS NOT CHILD-RESISTANT ONCE OPENED.”

    “

    UTILISER LA TOTALITÉ DU CONTENU APRÈS OUVERTURE. UNE FOIS OUVERT, LE CONTENANT N’EST PLUS UN CONTENANT PROTÈGE-ENFANTS

    .”

    Exception — large container

    14

    The requirements for child-resistant containers set out in sections 9 to 13 do not apply to a container with a capacity greater than 5 L, other than the container for a chemical product that is classified
    in one of the following:

    (a)

    the hazard category “Category 4, quick skin-bonding adhesives”; or

    (b)

    the sub-category “very corrosive”.

    (c)

    [Repealed, SOR/2011-24, s. 3]

    SOR/2009-165, s. 4(F); SOR/2011-24, s. 3

    Required Information

    Containers and packaging

    15

    (1)

    Subject to section 16, the information required by these Regulations must be displayed in the manner set out in these Regulations

    (a)

    on each container that is displayed to the consumer, other than in an advertisement; and

    (b)

    on any packaging of a container that is displayed to the consumer, including a display card to which a container may be fixed.

    Adaptation

    (1.1)'
