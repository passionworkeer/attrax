  title: 'For the purpose of the application of paragraph (1)(b), the '
  text: 'For the purpose of the application of paragraph (1)(b), the requirements for the display of information on a container apply to the display of information on the container’s package having regard
    to the size of the package.

    Additional information

    (2)

    Information in addition to that required by these Regulations may be displayed on a container if it does not disclaim or contradict the required information.

    SOR/2009-165, s. 5

    Exemption — packaging

    16

    (1)

    Packaging is exempt from the requirements of paragraph 15(1)(b) if the packaging

    (a)

    is transparent and

    (i)

    the required information displayed on the container is legible through the packaging, and

    (ii)

    the transparent packaging does not obscure any of the required information on the container; or

    (b)

    is not transparent and

    (i)

    encloses

    (A)

    a container and a product that is not subject to these Regulations, or

    (B)

    two or more containers that have different information requirements, and

    (ii)

    displays the following signal word and primary hazard statement, or a statement to the same effect, in the manner set out in sections 17 to 20 and 23, subsections 24(1) and (3) and sections 25, 26 and
    28:

    “CAUTION. CONTAINS PRODUCTS THAT MAY BE HARMFUL. READ WARNINGS ON EACH CONTAINER.”

    “

    ATTENTION. CONTIENT DES PRODUITS QUI PEUVENT ÊTRE NOCIFS. LIRE LES MISES EN GARDE SUR CHAQUE CONTENANT

    .”

    Exemption — packaging not customarily displayed

    (2)

    Packaging that is not customarily displayed to the consumer, such as a shipping carton, is exempt from the requirements of paragraph 15(1)(b).

    Presentation of Information — Technical Specifications

    Languages, legibility and durability

    17

    The information required by these Regulations to be displayed on a container must be

    (a)

    displayed in both official languages; and

    (b)

    clear and legible and remain so throughout the useful life of the chemical product, or in the case of a refillable container, throughout its useful life, under normal conditions of transportation, storage,
    sale and use.

    SOR/2009-165, s. 6

    Colour contrast

    18

    The colour contrast between the information and the background must be equivalent to at least a 70% screen of black on white.

    Print — general rules

    19

    (1)

    If the information is set out in words, they must be printed in a standard sans serif type that

    (a)

    is not compressed, expanded or decorative; and

    (b)

    as illustrated in Schedule 4, has a large “x-Height” relative to the ascender or descender of the type.

    Measurement of height of type

    (2)

    The height of the type referred to in subsection (1) is determined by measuring an upper-case letter or a lower-case letter that has an ascender or descender, such as “b” or “p”.

    SOR/2009-165, s. 7(E)

    Print — upper-case letters

    20

    The following information must be printed

    (a)

    in upper-case letters

    (i)

    the signal word,

    (ii)

    the primary hazard statement, and

    (iii)

    the specific hazard statement; and

    (b)

    in bold-faced, upper-case letters, the titles “

    FIRST AID TREATMENT

    ” and “

    PREMIERS SOINS

    ”.

    Hazard symbol — reproduction

    21

    The hazard symbol must be an exact reproduction of the applicable symbol depicted in Schedule 2, except with respect to size and colour.

    Hazard symbol — minimum diameter

    22

    The hazard symbol must, when the main display panel has the area set out in column 1 of the table to this section, have a diameter at least as large as that set out in column 2.

    TABLE TO SECTION 22

    Minimum Diameter of the Hazard Symbol

    Column 1

    Column 2

    Item

    Area of the main display panel

    Minimum diameter of the hazard symbol

    1

    less than 9.5 cm

    2

    6 mm

