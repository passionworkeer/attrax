    Application

    Restrictions on application

    12

    This Part does not apply in respect of the sale or importation of any

    (a) to (c)

    [Repealed, 2014, c. 20, s. 113]

    (d)

    nuclear substance, within the meaning of the

    Nuclear Safety and Control Act

    , that is radioactive;

    (e)

    hazardous waste, being a hazardous product that is sold for recycling or recovery or is intended for disposal;

    (f) and (g)

    [Repealed, 2014, c. 20, s. 113]

    (h)

    tobacco or a tobacco product as defined in section 2 of the

    Tobacco and Vaping Products Act

    ;

    (i)

    manufactured article; or

    (j)

    anything listed in Schedule 1.

    R.S., 1985, c. H-3, s. 12; R.S., 1985, c. 24 (3rd Supp.), s. 1; 1997, c. 9, s. 105, c. 13, s. 62; 2002, c. 28, s. 86; 2010, c. 21, s. 74; 2014, c. 20, s. 113; 2018, c. 9, s. 77

    Prohibitions

    Prohibition re sale

    13

    (1)

    Subject to the

    Hazardous Materials Information Review Act

    , no supplier shall sell a hazardous product that is intended for use, handling or storage in a work place in Canada unless

    (a)

    the supplier has in their possession a safety data sheet for the hazardous product that meets the requirements set out in the regulations made under subsection 15(1);

    (a.1)

    on the sale of the hazardous product to any person or government, the supplier provides to the person or government the safety data sheet referred to in paragraph (a), or causes it to be provided, if
    on that sale the person or government acquires possession or ownership of that hazardous product; and

    (b)

    the hazardous product or the container in which the hazardous product is packaged has a label that meets the requirements set out in the regulations made under subsection 15(1) affixed to it, printed
    on it or attached to it in a manner that meets the requirements set out in the regulations made under that subsection.

    Definition of

    government

    (2)

    In this section,

    government

    means any of the following or their institutions:

    (a)

    the federal government;

    (b)

    a corporation named in Schedule III to the

    Financial Administration Act

    ;

    (c)

    a provincial government or a public body established under an Act of the legislature of a province; and

    (d)

    an aboriginal government as defined in subsection 13(3) of the

    Access to Information Act

    .

    R.S., 1985, c. H-3, s. 13; R.S., 1985, c. 24 (3rd Supp.), s. 1; 1999, c. 31, s. 128(F); 2014, c. 20, s. 114

    Prohibition re importation

    14

    Subject to the

    Hazardous Materials Information Review Act

    , no supplier shall import a hazardous product that is intended for use, handling or storage in a work place in Canada unless

    (a)

    the supplier obtains or prepares, on or before the importation of the hazardous product, a safety data sheet for the hazardous product that meets the requirements set out in the regulations made under
    subsection 15(1); and

    (b)

    the hazardous product or the container in which the hazardous product is packaged has a label that meets the requirements set out in the regulations made under subsection 15(1) affixed to it, printed
    on it or attached to it in a manner that meets the requirements set out in the regulations made under that subsection.

    R.S., 1985, c. H-3, s. 14; R.S., 1985, c. 24 (3rd Supp.), s. 1; 2014, c. 20, s. 114

    Prohibition re sale

    14.1

    (1)

    Despite section 13, no supplier shall sell a hazardous product that contains asbestos and is intended for use, handling or storage in a work place in Canada unless, subject to the

    Hazardous Materials Information Review Act

    , the supplier complies with the requirements set out in paragraphs 13(1)(a) to (b) and the hazardous product meets the requirements set out in the regulations made under subsection 15(2).

    Prohibition re importation

    (2)

    Despite section 14, no supplier shall import a hazardous product that contains asbestos and is intended for use, handling or storage in a work place in Canada unless, subject to the

    Hazardous Materials Information Review Act

    , the supplier complies with the requirements set out in paragraphs 14(a) and (b) and the hazardous product meets the requirements set out in the regulations made under subsection 15(2).

    2014, c. 20, s. 114

    False information  — hazardous product or container

    14.2

    (1)

    No supplier shall sell or import a hazardous product that is intended for use, handling or storage in a work place in Canada if the hazardous product or the container in which the hazardous product
    is packaged has affixed to, printed on or attached to it information about the hazardous product that is false, misleading or likely to create an erroneous impression, with respect to the information
    that is required to be included in a label or safety data sheet for that hazardous product in order for the supplier to comply with the requirements set out in paragraphs 13(1)(a) to (b) or 14(a) and
    (b), as the case may be.

    Safety data sheet  —  sale

    (2)

    No supplier shall sell a hazardous product that is intended for use, handling or storage in a work place in Canada if the safety data sheet for the hazardous product that is in their possession in order
    to comply with the requirement set out in paragraph 13(1)(a), or that they provide or cause to be provided in order to comply with the requirement set out in paragraph 13(1)(a.1), is false, misleading
    or likely to create an erroneous impression, with respect to the information that is required to be included in a label or safety data sheet for that hazardous product in order for the supplier to meet
    the requirements set out in paragraphs 13(1)(a) to (b).

    Safety data sheet  — importation

    (3)

    No supplier shall import a hazardous product that is intended for use, handling or storage in a work place in Canada if the safety data sheet for the hazardous product that the supplier obtains or prepares
    in order to comply with the requirement set out in paragraph 14(a) is false, misleading or likely to create an erroneous impression, with respect to the information that is required to be included in
    a label or safety data sheet for that hazardous product in order for the supplier to comply with the requirements set out in paragraphs 14(a) and (b).

    Course of sale

    (4)

    No supplier who sells a hazardous product that is intended for use, handling or storage in a work place in Canada shall, in the course of selling the hazardous product, communicate by any means any
    information about the hazardous product that is false, misleading or likely to create an erroneous impression, with respect to the information that is required to be included in a label or safety data
    sheet for that hazardous product in order for the supplier to comply with the requirements set out in paragraphs 13(1)(a) to (b).

    2014, c. 20, s. 114

    Preparing and Maintaining Documents

    Requirements

    14.3

    (1)

    Every supplier who sells or imports a hazardous product that is intended for use, handling or storage in a work place in Canada shall prepare and maintain

    (a)

    a document containing a true copy of a label that represents the label that is affixed to, printed on or attached to the hazardous product or the container in wh'
