    Reference to regulations

    138

    For the purposes of sections

    130

    to

    137

    , any references in the former Act to the Ingredient Disclosure List, to regulations, or to anything prescribed by regulation, are considered to be references to that List or those regulations as they
    read immediately before the day on which section

    114

    comes into force.

    — 2022, c. 17, s. 76

    Clarification — immediate application

    76

    For greater certainty, but subject to sections

    77

    and

    78

    , the amendments made by this Act also apply with respect to proceedings that are ongoing on the day on which this Act comes into force.

    — 2022, c. 17, par. 77(2)(b)

    Certain applications for warrants

    77

    (2)

    Each of the following provisions, as it read immediately before the day on which this Act comes into force, continues to apply with respect to an application made for a warrant under the provision if
    the application is submitted, and no decision has been made in respect of the application, before that day:

    (b)

    subsection 22.1(4) of the

    Hazardous Products Act

    ;

    — 2022, c. 17, s. 78.1

    Impact of remote proceedings

    78.1

    (1)

    The Minister of Justice must, no later than three years after the day on which this Act receives royal assent, initiate one or more independent reviews on the use of remote proceedings in criminal justice
    matters that must include an assessment of whether remote proceedings

    (a)

    enhance, preserve or adversely affect access to justice;

    (b)

    maintain fundamental principles of the administration of justice; and

    (c)

    adequately address the rights and obligations of participants in the criminal justice system, including accused persons.

    Report

    (2)

    The Minister of Justice must, no later than five years after the day on which a review is initiated, cause a report on the review — including any findings or recommendations resulting from it — to be
    laid before each House of Parliament.

    — 2022, c. 17, s. 78.2

    Review by committee

    78.2

    (1)

    At the start of the fifth year after the day on which this Act receives royal assent, the provisions enacted or amended by this Act are to be referred to a committee of the Senate and a committee of
    the House of Commons that may be designated or established for the purpose of reviewing the provisions.

    Report

    (2)

    The committees to which the provisions are referred are to review them and the use of remote proceedings in criminal justice matters and submit reports to the Houses of Parliament of which they are
    committees, including statements setting out any changes to the provisions that they recommend.

    2022, c. 17

