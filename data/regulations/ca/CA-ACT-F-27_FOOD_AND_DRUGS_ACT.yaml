    Offences relating to therapeutic products

    31.2

    (1)

    Subject to section 31.4, every person who contravenes any provision of this Act or the regulations, as it relates to a therapeutic product, or an order made under any of sections 21.1 to 21.32 is guilty
    of an offence and liable

    (a)

    on conviction by indictment, to a fine not exceeding $5,000,000 or to imprisonment for a term not exceeding two years or to both; and

    (b)

    on summary conviction, for a first offence, to a fine not exceeding $250,000 or to imprisonment for a term not exceeding six months or to both and, for a subsequent offence, to a fine not exceeding
    $500,000 or to imprisonment for a term not exceeding 18 months or to both.

    Clarification

    (2)

    For greater certainty, subsection (1) applies in respect of the following provisions of this Act:

