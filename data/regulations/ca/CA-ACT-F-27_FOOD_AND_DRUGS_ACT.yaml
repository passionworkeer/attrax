  text: 'An Act respecting food, drugs, cosmetics and therapeutic devices

    Food and Drugs Act

    Food and Drugs

    2025

    4

    1

    F-27

    Short Title

    Short title

    1

    This Act may be cited as the

    Food and Drugs Act

    .

    R.S., c. F-27, s. 1

    Interpretation and Application

    Definitions

    2

    In this Act,

    advanced therapeutic product

    means a therapeutic product that is described in Schedule G or that belongs to a class of therapeutic products that is described in that Schedule; (

    produit thérapeutique innovant

    )

    advertisement

    includes any representation by any means whatever for the purpose of promoting directly or indirectly the sale or disposal of any food, drug, cosmetic or device; (

    publicité

    ou

    annonce

    )

    analyst

    means an individual designated as an analyst for the purposes of this Act under section 28 or under section 13 of the

    Canadian Food Inspection Agency Act

    ; (

    analyste

    )

    clinical trial

    means a study, involving human subjects, for the purpose of discovering or verifying the effects of a drug, a device or a food for a special dietary purpose; (

    essai clinique

    )

    confidential business information

    , in respect of a person to whose business or affairs the information relates, means — subject to the regulations — business information

    (a)

    that is not publicly available,

    (b)

    in respect of which the person has taken measures that are reasonable in the circumstances to ensure that it remains not publicly available, and

    (c)

    that has actual or potential economic value to the person or their competitors because it is not publicly available and its disclosure would result in a material financial loss to the person or a material
    financial gain to their competitors; (

    renseignements commerciaux confidentiels

    )

    contraceptive device

    means any instrument, apparatus, contrivance or substance other than a drug, that is manufactured, sold or represented for use in the prevention of conception; (

    moyen anticonceptionnel

    )

    cosmetic

    includes any substance or mixture of substances manufactured, sold or represented for use in cleansing, improving or altering the complexion, skin, hair or teeth, and includes deodorants and perfumes; (

    cosmétique

    )

    Department

    means the Department of Health; (

    ministère

    )

    device

    means an instrument, apparatus, contrivance or other similar article, or an

    in vitro

    reagent, including a component, part or accessory of any of them, that is manufactured, sold or represented for use in

    (a)

    diagnosing, treating, mitigating or preventing a disease, disorder or abnormal physical state, or any of their symptoms, in human beings or animals,

    (b)

    restoring, modifying or correcting the body structure of human beings or animals or the functioning of any part of the bodies of human beings or animals,

    (c)

    diagnosing pregnancy in human beings or animals,

    (d)

    caring for human beings or animals during pregnancy or at or after the birth of the offspring, including caring for the offspring, or

    (e)

    preventing conception in human beings or animals;

    however, it does not include such an instrument, apparatus, contrivance or article, or a component, part or accessory of any of them, that does any of the actions referred to in paragraphs (a) to (e)
    solely by pharmacological, immunological or metabolic means or solely by chemical means in or on the body of a human being or animal; (

    instrument

    )

    drug

    includes any substance or mixture of substances manufactured, sold or represented for use in

    (a)

    the diagnosis, treatment, mitigation or prevention of a disease, disorder or abnormal physical state, or its symptoms, in human beings or animals,

    (b)

    restoring, correcting or modifying organic functions in human beings or animals, or

    (c)

    disinfection in premises in which food is manufactured, prepared or kept; (

    drogue

    )

    food

    includes any article manufactured, sold or represented for use as food or drink for human beings, chewing gum, and any ingredient that may be mixed with food for any purpose whatever; (

    aliment

    )

    food for a special dietary purpose

    means a food that has been specially processed or formulated

    (a)

    to meet the particular requirements of an individual in whom a physical or physiological condition exists as a result of a disease, disorder or abnormal physical state, or

    (b)

    to be the sole or primary source of nutrition for an individual; (

    aliment à des fins diététiques spéciales

    )

    foreign regulatory authority

    means a government agency or other entity outside Canada that controls the manufacture, use or sale of therapeutic products or foods within its jurisdiction; (

    autorité réglementaire étrangère

    )

    inspector

    means an individual designated as an inspector for the purposes of this Act under subsection 22(1) or under section 13 of the

    Canadian Food Inspection Agency Act

    ; (

    inspecteur

    )

    label

    includes any legend, word or mark attached to, included in, belonging to or accompanying any food, drug, cosmetic, device or package; (

    étiquette

    )

    Minister

    means the Minister of Health; (

    ministre

    )

    package

    includes any thing in which any food, drug, cosmetic or device is wholly or partly contained, placed or packed; (

    emballage

    )

    person

    means an individual or an

    organization

    as defined in section 2 of the

    Criminal Code

    ; (

    personne

    )

    prescribed

    means prescribed by the regulations; (

    Version anglaise seulement

    )

    sell

    includes

    (a)

    offer for sale, expose for sale or have in possession for sale — or distribute to one or more persons, whether or not the distribution is made for consideration, and

    (b)

    lease, offer for lease, expose for lease or have in possession for lease; (

    vente

    )

    therapeutic product

    means a drug or device or any combination of drugs and devices; (

    produit thérapeutique

    )

    therapeutic product authorization

    means

    (a)

    an authorization, including a licence, that

    (i)

    authorizes the conduct of a clinical trial in respect of a therapeutic product and is issued under the regulations, or

    (ii)

    authorizes, as the case may be, the import, sale, advertisement, manufacture, preparation, preservation, packaging, labelling, storage or testing of a therapeutic product and is issued under subsection
    21.92(1) or the regulations, or

    (b)

    an authorization, including a licence, that would fall within paragraph (a) if the authorization were not suspended; (

    autorisation relative à un produit thérapeutique

    )

    unsanitary conditions

    means such conditions or circumstances as might contaminate with dirt or filth, or render injurious to health, a food, drug or cosmetic. (

    conditions non hygiéniques

    )

