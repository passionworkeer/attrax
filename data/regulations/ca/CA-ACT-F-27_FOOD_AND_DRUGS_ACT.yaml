    Due diligence

    31.3

    Due diligence is a defence in a prosecution for an offence under this Act, other than an offence under section 31.4.

    2014, c. 24, s. 9

    Offences — section 21.6 and serious risk

    31.4

    (1)

    A person who contravenes section 21.6, or who knowingly or recklessly causes a serious risk of injury to human health in contravening another provision of this Act or the regulations, as it relates
    to a therapeutic product, or an order made under any of sections 21.1 to 21.32 is guilty of an offence and liable

    (a)

    on conviction on indictment, to a fine the amount of which is at the discretion of the court or to imprisonment for a term not exceeding five years or to both; and

    (b)

    on summary conviction, for a first offence, to a fine not exceeding $500,000 or to imprisonment for a term not exceeding 18 months or to both and, for a subsequent offence, to a fine not exceeding $1,000,000
    or to imprisonment for a term not exceeding two years or to both.

    Clarification

    (2)

    For greater certainty, subsection (1) applies in respect of the following provisions of this Act:

