    (1.2)

    Despite subsection (1), any prescribed provision of the regulations applies to any food, drug, cosmetic or device.

    Exception — General Council Decision

    (2)

    Despite subsection (1), this Act applies in respect of any drug or device to be manufactured for the purpose of being exported in accordance with the

    General Council Decision

    , as defined in subsection 30(6), and the requirements of the Act and the regulations apply to the drug or device as though it were a drug or device to be manufactured and sold for consumption or use
    in Canada, unless the regulations provide otherwise.

    R.S., 1985, c. F-27, s. 37; 1993, c. 34, s. 73; 1996, c. 19, s. 80; 2004, c. 23, s. 3; 2016, c. 9, s. 11

    2020, c. 5, s. 34

    2021, c. 7, s. 10

    Conditions under which transhipment exempt

    38

    This Act does not apply to any packaged food, drug, cosmetic or device if

    (a)

    it is manufactured or prepared outside Canada;

    (b)

    it is imported solely for the purpose of export and is not sold for consumption or use in Canada; and

    (c)

    it meets any other prescribed requirement.

    2016, c. 9, s. 12

