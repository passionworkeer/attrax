    Sentencing considerations

    31.5

    A court that imposes a sentence for an offence under section 31.2 or 31.4 shall take into account, in addition to any other principles that it is required to consider, the following factors:

    (a)

    the harm or risk of harm caused by the commission of the offence; and

    (b)

    the vulnerability of consumers of the therapeutic product.

    2014, c. 24, s. 9

    Parties to offence

    31.6

    If a person other than an individual commits an offence under section 31.2, or commits an offence under section 31.4 by reason of contravening section 21.6, then any of the person’s directors, officers
    or agents or mandataries who directs, authorizes, assents to or acquiesces or participates in the commission of the offence is a party to the offence and is liable on conviction to the punishment provided
    for by this Act, even if the person is not prosecuted for the offence.

    2014, c. 24, s. 9

    Continuing offence

    31.7

    If an offence under section 31.2 or 31.4 is committed or continued on more than one day, it constitutes a separate offence for each day on which it is committed or continued.

    2014, c. 24, s. 9

    Limitation period

    32

    (1)

    A prosecution for a summary conviction offence under this Act may be instituted at any time within two years after the time the subject-matter of the prosecution becomes known to the Minister or, in
    the case of a contravention of a provision of the Act that relates to food, to the Minister of Agriculture and Agri-Food.

    Minister’s certificate

    (2)

    A document purporting to have been issued by the Minister referred to in subsection (1), certifying the day on which the subject-matter of any prosecution became known to the Minister, is admissible
    in evidence without proof of the signature or official character of the person appearing to have signed the document and is evidence of the matters asserted in it.

    R.S., 1985, c. F-27, s. 32; 1997, c. 6, s. 66

    Venue

    33

    A prosecution for a contravention of this Act or the regulations may be instituted, heard, tried or determined in the place in which the offence was committed or the subject-matter of the prosecution
    arose or in any place in which the accused is apprehended or happens to be.

    R.S., c. F-27, s. 28

    Want of knowledge

    34

    (1)

    Subject to subsection (2), in a prosecution for the sale of any article in contravention of this Act, except Parts III and IV, or of the regulations made under this Part, if the accused proves to the
    satisfaction of the court or judge that

    (a)

    the accused purchased the article from another person in packaged form and sold it in the same package and in the same condition the article was in at the time it was so purchased, and

    (b)

    that the accused could not with reasonable diligence have ascertained that the sale of the article would be in contravention of this Act or the regulations,

    the accused shall be acquitted.

    Notice of reliance on want of knowledge

    (2)

    Subsection (1) does not apply in any prosecution unless the accused, at least ten days before the day fixed for the trial, has given to the prosecutor notice in writing that the accused intends to avail
    himself of the provisions of subsection (1) and has disclosed to the prosecutor the name and address of the person from whom the accused purchased the article and the date of purchase.

    R.S., c. F-27, ss. 29, 39, 46

    Certificate of analyst

    35

    (1)

    Subject to this section, in any prosecution for an offence under any of sections 31 to 31.2 and 31.4, a certificate purporting to be signed by an analyst and stating that an article, sample or substance
    has been submitted to, and analysed or examined by, the analyst and stating the results of the analysis or examination is admissible in evidence and, in the absence of evidence to the contrary, is proof
    of the statements contained in the certificate without proof of the signature or official character of the person appearing to have signed it.

    Requiring attendance of analyst

    (2)

    The party against whom a certificate of an analyst is produced pursuant to subsection (1) may, with leave of the court, require the attendance of the analyst for the purposes of cross-examination.

    Notice of intention to produce certificate

    (3)

    No certificate shall be admitted in evidence pursuant to subsection (1) unless, before the trial, the party intending to produce the certificate has given reasonable notice of that intention, together
    with a copy of the certificate, to the party against whom it is intended to be produced.

    Proof of service

    (4)

    For the purposes of this Act, service of any certificate referred to in subsection (1) may be proved by oral evidence given under oath by, or by the affidavit or solemn declaration of, the person claiming
    to have served it.

    Attendance for examination

    (5)

    Notwithstanding subsection (4), the court may require the person who appears to have signed an affidavit or solemn declaration referred to in that subsection to appear before it for examination or cross-examination
    in respect of the issue of proof of service.

    R.S., 1985, c. F-27, s. 35; R.S., 1985, c. 27 (1st Supp.), s. 192; 1996, c. 19, s. 78; 2014, c. 24, s. 12

    Proof as to manufacturer or packager

    36

    (1)

    In a prosecution for a contravention of this Act or of the regulations made under this Part, proof that a package containing any article to which this Act or the regulations apply bore a name or address
    purporting to be the name or address of the person by whom it was manufactured or packaged is, in the absence of evidence to the contrary, proof that the article was manufactured or packaged, as the
    case may be, by the person whose name or address appeared on the package.

    Offence by employee or agent

    (2)

    In a prosecution for a contravention described in subsection (1), it is sufficient proof of the offence to establish that it was committed by an employee or agent of the accused whether or not the employee
    or agent is identified or has been prosecuted for the offence.

    Certified copies

    (3)

    In a prosecution for a contravention described in subsection (1), a copy of or extract from a document, including electronic data, that is certified to be a true copy by the inspector who made or took
    it under paragraph 23(2)(c), (d) or (f), as the case may be, is admissible in evidence and is, in the absence of evidence to the contrary, proof of its contents.

    Where accused had adulterating substances

    (4)

    Where a person is prosecuted under this Part for having manufactured an adulterated food or drug for sale, and it is established that the person had in his possession or on his premises any substance
    the addition of which to that food or drug has been declared by regulation to cause the adulteration of the food or drug, the onus of proving that the food or drug was not adulterated by the addition
    of that substance lies on the accused.

    R.S., 1985, c. F-27, s. 36; 1996, c. 19, s. 79

    2019, c. 29, s. 176

    Exports

    Conditions under which exports exempt

    37

    (1)

    This Act does not apply to any packaged food, drug, cosmetic or device if

    (a)

    it is manufactured or prepared in Canada;

    (b)

    it is intended for export and is not manufactured or prepared for consumption or use in Canada nor sold for consumption or use in Canada;

    (c)

    a certificate that the package and its contents do not contravene any known requirement of the law of the country to which it is or is about to be consigned has been issued in respect of the package
    and its contents in prescribed form and manner; and

    (d)

    the packaged food, drug, cosmetic or device meets any other prescribed requirement.

