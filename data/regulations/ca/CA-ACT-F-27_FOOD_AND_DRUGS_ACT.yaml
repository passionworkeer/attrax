    Non-corrective contact lenses

    2.1

    For the purposes of this Act, a non-corrective contact lens is deemed to be a device.

    2012, c. 25, s. 1

    Tobacco products

    2.2

    This Act does not apply to a

    tobacco product

    as defined in section 2 of the

    Tobacco and Vaping Products Act

    .

    2018, c. 9, s. 72

    Vaping products

    2.3

    (1)

    Despite the definition

    drug

    in section 2, this Act does not apply to a

    vaping product

    as defined in section 2 of the

    Tobacco and Vaping Products Act

    by reason that it contains nicotine, unless the vaping product is manufactured, sold or represented for use in the diagnosis, treatment, mitigation or prevention of a disease, disorder or abnormal physical
    state, or its symptoms, in human beings.

    Vaping products

    (2)

    Despite the definition

    device

    in section 2, this Act does not apply to a

    vaping product

    as defined in section 2 of the

    Tobacco and Vaping Products Act

    by reason that it is manufactured, sold or represented for use with a substance or mixture of substances that contains nicotine, unless the vaping product is manufactured, sold or represented for use
    in the diagnosis, treatment, mitigation or prevention of a disease, disorder or abnormal physical state, or its symptoms, in human beings.

    2018, c. 9, s. 72

    Classification — thing

    2.4

    (1)

    If the Minister believes that a thing falls within two or more of the definitions

    food

    ,

    drug

    ,

    cosmetic

    and

    device

    in section 2, the Minister may, by order, add a description of the thing to a single part of Schedule A that corresponds to one of the definitions in which the thing is believed to fall.

    Classification — class of things

    (2)

    If the Minister believes that every thing in a class of things falls within the same two or more definitions

    food

    ,

    drug

    ,

    cosmetic

    and

    device

    in section 2, the Minister may, by order, add a description of the class to a single part of Schedule A that corresponds to one of the definitions in which the things in the class are believed to fall.

    Factors

    (3)

    Before adding a description of a thing or a class of things to a part of Schedule A, the Minister shall consider the following factors:

    (a)

    the risk of injury that the thing or things present to human health;

    (b)

    the protection and promotion of health;

    (c)

    the possibility of a person being deceived or misled;

    (d)

    the purposes for which the thing or things are sold, represented or used and the history of use of the thing or things;

    (e)

    the treatment of similar things that have been regulated as foods, drugs, cosmetics or devices under this Act; and

    (f)

    the prescribed factors, if any.

    Effect of addition

    (4)

    A thing that either is described in or belongs to a class of things that is described in

    (a)

    Part 1 of Schedule A falls within the definition

    food

    in section 2 and does not fall within any of the other definitions referred to in subsections (1) and (2);

    (b)

    Part 2 of Schedule A falls within the definition

    drug

    in section 2 and does not fall within any of the other definitions referred to in subsections (1) and (2);

    (c)

    Part 3 of Schedule A falls within the definition

    cosmetic

    in section 2 and does not fall within any of the other definitions referred to in subsections (1) and (2); and

    (d)

    Part 4 of Schedule A falls within the definition

    device

    in section 2 and does not fall within any of the other definitions referred to in subsections (1) and (2).

    Deletion from Schedule A

    (5)

    The Minister may, by order, delete the description of a thing or a class of things from Schedule A.

    Interpretation — definitions

    food

    ,

    drug

    ,

    cosmetic

    and

    device

    (6)

    For greater certainty, the definitions

    food

    ,

    drug

    ,

    cosmetic

    and

    device

    in section 2 are subject to subsection (4).

    2019, c. 29, s. 164

    PART I

    Foods, Drugs, Cosmetics and Devices

    General

    Prohibited advertising

    3

    (1)

    No person shall advertise any food, drug, cosmetic or device to the general public as a treatment, preventative or cure for any of the diseases, disorders or abnormal physical states referred to in
    Schedule A.1.

    Prohibited sales

    (2)

    No person shall sell any food, drug, cosmetic or device if

    (a)

    it is represented by label as a treatment, preventative or cure for any of the diseases, disorders or abnormal physical states referred to in Schedule A.1; or

    (b)

    the person advertises it to the general public as a treatment, preventative or cure for any of the diseases, disorders or abnormal physical states referred to in Schedule A.1.

    Unauthorized advertising of contraceptive device prohibited

    (3)

    Except as authorized by regulation, no person shall advertise to the general public any contraceptive device or any drug manufactured, sold or represented for use in the prevention of conception.

    R.S., 1985, c. F-27, s. 3; 1993, c. 34, s. 72(F)

    2019, c. 29, s. 165

    Prohibition — clinical trials

    3.1

    No person shall conduct a clinical trial in respect of a drug, device or prescribed food for a special dietary purpose unless the person holds an authorization issued under the regulations that authorizes
    the conduct of the clinical trial.

    2019, c. 29, s. 166

