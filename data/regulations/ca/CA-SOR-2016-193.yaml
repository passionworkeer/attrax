    Calculation of display panel area

    (2)

    In the calculation of the area of a display panel, any seam and any convex or concave surface at the top or bottom of the container are to be excluded.

    Curved container — display panel area

    (3)

    In the case of a container that is curved in any way, other than a bag, the display panel area is 40% of the total area of the container, excluding the top and bottom.

    Determination of minimum height of type

    (4)

    For the purpose of paragraph (1)(d), the minimum height of type is determined by measuring an upper case letter or a lower case letter that has an ascender or descender, such as “b” or “p”.

    Mercury

    Mercury content and test method

    5

    A surface coating material must not contain more than 10 mg/kg total mercury when a dried sample is tested in accordance with a method that conforms to good laboratory practices.

    SOR/2022-122, s. 7(E)

    Products With Applied Stickers, Films or Surface Coating Materials

    Lead content

    6

    A sticker, film or other similar material that can be removed, or a surface coating material, that is applied to an accessible part of the following products must not contain more than 90 mg/kg total
    lead when it is tested in accordance with a method that conforms to good laboratory practices:

    (a)

    furniture;

    (b)

    products for children;

    (c)

    pencils; and

    (d)

    artist brushes.

    SOR/2022-122, s. 8

    Repeal

    7

    [Repeal]

    Coming into Force

    Registration

    8

    These Regulations come into force on the day on which they are registered.

    SOR/2022-122

    2022-12-19'
