  title: SOR/2016-193
  text: 'SOR/2016-193

    2016

    6

    22

    2023

    1

    1

    CANADA CONSUMER PRODUCT SAFETY ACT

    Surface Coating Materials Regulations

    P.C.

    2016-620

    2016

    6

    21

    His Excellency the Governor General in Council, on the recommendation of the Minister of Health, pursuant to section 37 of the

    Canada Consumer Product Safety Act

    a

    , makes the annexed

    Surface Coating Materials Regulations

    .

    a

    S.C. 2010, c. 21

    Interpretation

    Definitions

    1

    The following definitions apply in these Regulations.

    accessible part

    means any part of a product that may be touched, licked, mouthed or swallowed during the reasonably foreseeable use of the product. (

    partie accessible

    )

    container

    means a container in which a surface coating material is sold to a consumer. (

    contenant

    )

    display panel

    means any part of a container on which the common or generic name of a surface coating material, or the description of its function, is displayed. (

    aire d’affichage

    )

    good laboratory practices

    means practices that are in accordance with the principles set out in the Organisation for Economic Co-operation and Development document entitled

    OECD Principles of Good Laboratory Practice

    , Number 1 of the

    OECD Series on Principles of Good Laboratory Practice and Compliance Monitoring

    , ENV/MC/CHEM(98)17, the English version of which is dated January 21, 1998 and the French version of which is dated March 6, 1998. (

    bonnes pratiques de laboratoire

    )

    surface coating material

    means a paint or other similar material, with or without pigment, that forms a solid film after it is applied to a surface and that can be removed. (

    revêtement

    )

    SOR/2022-122, s. 6

    Surface Coating Materials

    Lead

    Lead content and test method

    2

    (1)

    A surface coating material must not contain more than 90 mg/kg total lead when a dried sample is tested in accordance with a method that conforms to good laboratory practices.

    Exceptions

    (2)

    Subsection (1) does not apply to a surface coating material that is used

    (a)

    as an anti-corrosive or anti-weathering coating on the interior or exterior surface of a building having an agricultural purpose or on equipment having an agricultural purpose;

    (b)

    as an anti-corrosive or anti-weathering coating on a structure, other than a building, having an agricultural or public purpose;

    (c)

    as a touch-up coating on metal surfaces;

    (d)

    in the production of outdoor graphic art, including billboard displays; or

    (e)

    in an art, craft or hobby activity, except if the surface coating material is used by children.

    Warning

    3

    (1)

    Subject to subsections (2) and (3), if a surface coating material that is used for a purpose mentioned in subsection 2(2) contains more than 90 mg/kg total lead, the display panel on the container must
    contain the following warning, or its equivalent, with the italicized portion being replaced by the applicable uses:

    DANGER

    CONTAINS LEAD /

    CONTIENT DU PLOMB

    DO NOT APPLY TO SURFACES ACCESSIBLE TO CHILDREN OR PREGNANT WOMEN /

    NE PAS APPLIQUER SUR UNE SURFACE ACCESSIBLE AUX ENFANTS OU AUX FEMMES ENCEINTES

    Must be used exclusively [

    Insert the applicable uses mentioned in subsection 2(2)

    ]. /

    Utiliser uniquement aux fins suivantes : [

    insérer les fins mentionnées au paragraphe 2(2) qui s’appliquent

    ].

    Small containers

    (2)

    Subject to subsection (3), if the area of the display panel is less than 35 cm

    2

    , the display panel may contain only the following warning:

    DANGER

    CONTAINS LEAD /

    CONTIENT DU PLOMB

    Signal word “DANGER”

    (3)

    If the warning required by subsection (1) or (2) is displayed in separate English and French display panels, the signal word “

    DANGER

    ” must be displayed in each display panel, but if the warning is displayed in one bilingual display panel, the signal word “

    DANGER

    ” need only be displayed once.

    Legibility and type

    4

    (1)

    The warning required by section 3 must appear in

    (a)

    a permanent, clear and legible manner;

    (b)

    capital letters, except for the portion dealing with uses in the warning under subsection 3(1);

    (c)

    bold-face or medium-face sans serif type; and

    (d)'
