    means a name or information used to identify a source of data on a computer system, and includes a URL; (

    localisateur

    )

    merger

    [Repealed, R.S., 1985, c. 19 (2nd Supp.), s. 20]

    Minister

    means the Minister of Industry; (

    ministre

