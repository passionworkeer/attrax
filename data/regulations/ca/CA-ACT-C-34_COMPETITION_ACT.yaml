  text: 'Section 45 does not apply in respect of an agreement or arrangement between persons who are members of a class of persons who ordinarily engage in the business of dealing in securities or between
    such persons and the issuer of a specific security, in the case of a primary distribution, or the vendor of a specific security, in the case of a secondary distribution, if the agreement or arrangement
    has a reasonable relationship to the underwriting of a specific security.

    Definition of

    underwriting

    (2)

    For the purposes of this section,

    underwriting

    of a security means the primary or secondary distribution of the security, in respect of which distribution

    (a)

    a prospectus is required to be filed, accepted or otherwise approved pursuant to a law enacted in Canada or in a jurisdiction outside Canada for the supervision or regulation of trade in securities;
    or

    (b)

    a prospectus would be required to be filed, accepted or otherwise approved but for an express exemption contained in or given pursuant to a law mentioned in paragraph (a).

    R.S., 1985, c. C-34, s. 5; 1999, c. 2, s. 2; 2009, c. 2, s. 408

    Amateur sport

    6

    (1)

    This Act does not apply in respect of agreements or arrangements between or among teams, clubs and leagues pertaining to participation in amateur sport.

    Definition of

    amateur sport

    (2)

    For the purposes of this section,

    amateur sport

    means sport in which the participants receive no remuneration for their services as participants.

    1974-75-76, c. 76, s. 2

    PART II

    Administration

    Commissioner of Competition

    7

    (1)

    The Governor in Council may appoint an officer to be known as the Commissioner of Competition, who shall be responsible for

    (a)

    the administration and enforcement of this Act; and

    (b)

    the administration and enforcement of the

    Consumer Packaging and Labelling Act

    , the

    Precious Metals Marking Act

    and the

    Textile Labelling Act

    .

    (c)

    [Repealed, 2012, c. 24, s. 79]

    (d)

    [Repealed, 2012, c. 24, s. 79]

    Oath of office

    (2)

    The Commissioner shall, before taking up the duties of the Commissioner, take and subscribe, before the Clerk of the Privy Council, an oath or solemn affirmation, which shall be filed in the office
    of the Clerk, in the following form:

    I do solemnly swear (or affirm) that I will faithfully, truly and impartially, and to the best of my judgment, skill and ability, execute the powers and trusts reposed in me as Commissioner of Competition.
    (

    In the case where an oath is taken add

    “So help me God”.)

    Salary

    (3)

    The Commissioner shall be paid such salary as may be from time to time fixed and allowed by the Governor in Council.

    R.S., 1985, c. C-34, s. 7; 1999, c. 2, ss. 4, 37

    2012, c. 24, s. 79

    Deputy Commissioners

    8

    (1)

    One or more persons may be appointed Deputy Commissioners of Competition in the manner authorized by law.

    Powers of Deputy

    (2)

    The Governor in Council may authorize a Deputy Commissioner to exercise the powers and perform the duties of the Commissioner whenever the Commissioner is absent or unable to act or whenever there is
    a vacancy in the office of Commissioner.

    Powers of other persons

    (3)

    The Governor in Council may authorize any person to exercise the powers and perform the duties of the Commissioner whenever the Commissioner and the Deputy Commissioners are absent or unable to act
    or, if one or more of those offices are vacant, whenever the holders of the other of those offices are absent or unable to act.

    Inquiry by Deputy

    (4)

    The Commissioner may authorize a Deputy Commissioner to make inquiry regarding any matter into which the Commissioner has power to inquire, and when so authorized a Deputy Commissioner shall perform
    the duties and may exercise the powers of the Commissioner in respect of that matter.

    Powers of Commissioner unaffected

    (5)

    The exercise, pursuant to this Act, of any of the powers or the performance of any of the duties of the Commissioner by a Deputy Commissioner or other person does not in any way limit, restrict or qualify
    the powers or duties of the Commissioner, either generally or with respect to any particular matter.

    R.S., 1985, c. C-34, s. 8; 1999, c. 2, s. 5

    Application for inquiry

    9

    (1)

    Any six persons resident in Canada who are not less than eighteen years of age and who are of the opinion that

    (a)

    a person has contravened an order made pursuant to section 32, 33 or 34, or Part VII.1 or VIII,

    (b)

    grounds exist for the making of an order under Part VII.1 or VIII, or

    (c)

    an offence under Part VI or VII has been or is about to be committed,

    may apply to the Commissioner for an inquiry into the matter.

    Material to be submitted

    (2)

    An application made under subsection (1) shall be accompanied by a statement in the form of a solemn or statutory declaration showing

    (a)

    the names and addresses of the applicants, and at their election the name and address of any one of their number, or of any attorney, solicitor or counsel, whom they may, for the purpose of receiving
    any communication to be made pursuant to this Act, have authorized to represent them;

    (b)

    the nature of

    (i)

    the alleged contravention,

    (ii)

    the grounds alleged to exist for the making of an order, or

    (iii)

    the alleged offence

    and the names of the persons believed to be concerned therein and privy thereto; and

    (c)

    a concise statement of the evidence supporting their opinion.

    R.S., 1985, c. C-34, s. 9; R.S., 1985, c. 19 (2nd Supp.), s. 22; 1999, c. 2, ss. 6, 37

    Inquiry by Commissioner

    10

    (1)

    The Commissioner shall

    (a)

    on application made under section 9,

    (b)

    whenever the Commissioner has reason to believe that

    (i)

    a person has contravened an order made pursuant to section 32, 33 or 34, or Part VII.1 or Part VIII,

    (ii)

    grounds exist for the making of an order under Part VII.1 or Part VIII, or

    (iii)

    an offence under Part VI or VII has been or is about to be committed, or

    (c)

    whenever directed by the Minister to inquire whether any of the circumstances described in subparagraphs (b)(i) to (iii) exists,

    cause an inquiry to be made into all such matters as the Commissioner considers necessary to inquire into with the view of determining the facts.

    Information on inquiry

    (2)

    The Commissioner shall, on the written request of any person whose conduct is being inquired into under this Act or any person who applies for an inquiry under section 9, inform that person or cause
    that person to be informed as to the progress of the inquiry.

    Inquiries to be in private

    (3)

    All inquiries under this section shall be conducted in private.

    R.S., 1985, c. C-34, s. 10; R.S., 1985, c. 19 (2nd Supp.), s. 23; 1999, c. 2, ss. 7, 37, c. 31, s. 45

    Market or industry inquiry

    10.1

    (1)

    The Commissioner may, after consulting the Minister, conduct an inquiry into the state of competition in a market or industry if the Commissioner is of the opinion that it is in the public interest
    to do so.

    Direction to conduct inquiry

    (2)

    The Minister may direct the Commissioner to conduct an inquiry into the state of competition in a market or industry if the Minister is of the opinion that it is in the public interest that such an
    inquiry be conducted. Before making the direction, the Minister must consult the Commissioner to determine whether the inquiry would be feasible, including with regard to its cost.

    Proposed terms of reference

    (3)

    If, after the consultation referred to in subsection (1) or (2), it is decided to proceed with the inquiry, the Commissioner must prepare proposed terms of reference for the inquiry and publish them
    on a publicly available website and invite the public to provide comments during a period of not less than 15 days.

    Final terms of reference

    (4)

    After having taken into account any comments received from the public, the Commissioner must submit to the Minister for approval the Commissioner’s final terms of reference and, if they are approved,
    the Commissioner must publish them on a publicly available website.

    Duration of inquiry

    (5)

    The inquiry commences on the day on which the final terms of reference are published and the Commissioner must complete the inquiry and publish a report of the Commissioner’s findings on a publicly
    available website before the expiry of the period specified by the Minister, which period, subject to subsection (6), is not to exceed 18 months.

    Extension

    (6)

    The Minister may extend the specified period for periods of up to three months.

    Sending draft to certain persons

    (7)

    Before the report is published, the Commissioner must send to every person who was required to do anything under an order made under subsection 11(1) a complete or partial draft of the report and inform
    the person that they may, within three working days after the day on which it was sent, provide the Commissioner with the person’s concerns regarding factual inaccuracies or confidential information
    that should not be disclosed in the final report.

    2023, c. 31, s. 3

    Order for oral examination, production or written return

    11

    (1)

    If, on the

    ex parte

    application of the Commissioner or his or her authorized representative, a judge of a superior or county court is satisfied by information on oath or solemn affirmation that an inquiry is being made
    under section 10 or 10.1 and that a person has or is likely to have information that is relevant to the inquiry, the judge may order the person to

    (a)

    attend as specified in the order and be examined on oath or solemn affirmation by the Commissioner or the authorized representative of the Commissioner on any matter that is relevant to the inquiry
    before a person, in this section and sections 12 to 14 referred to as a “presiding officer”, designated in the order;

    (b)

    produce to the Commissioner or the authorized representative of the Commissioner within a time and at a place specified in the order, a record, a copy of a record certified by affidavit to be a true
    copy, or any other thing, specified in the order; or

    (c)

    make and deliver to the Commissioner or the authorized representative of the Commissioner, within a time specified in the order, a written return under oath or solemn affirmation showing in detail such
    information as is by the order required.

    Records or information in possession of affiliate

    (2)

    If the person against whom an order is sought under paragraph (1)(b) or (c) in relation to an inquiry is a corporation and the judge to whom the application is made under subsection (1) is satisfied
    by information on oath or solemn affirmation that an affiliate of the corporation, whether the affiliate is located in Canada or outside Canada, has or is likely to have records or information relevant
    to the inquiry, the judge may order the corporation to

    (a)

    produce the records; or

    (b)

    make and deliver a written return of the information.

    No person excused from complying with order

    (3)

    No person shall be excused from complying with an order under subsection (1) or (2) on the ground that the testimony, record or other thing or return required of the person may tend to criminate the
    person or subject him to any proceeding or penalty, but no testimony given by an individual pursuant to an order made under paragraph (1)(a), or return made by an individual pursuant to an order made
    under paragraph (1)(c), shall be used or received against that individual in any criminal proceedings thereafter instituted against him, other than a prosecution under section 132 or 136 of the

    Criminal Code

    .

    Effect of order

    (4)

    An order made under this section has effect anywhere in Canada.

    Person outside Canada

    (5)

    An order may be made under subsection (1) against a person outside Canada who carries on business in Canada or sells products into Canada.

    R.S., 1985, c. C-34, s. 11; R.S., 1985, c. 19 (2nd Supp.), s. 24; 1999, c. 2, s. 37; 2002, c. 8, s. 126, c. 16, s. 1

    2022, c. 10, s. 256

    2023, c. 31, s. 4

    Witness competent and compellable

    12

    (1)

    Any person summoned to attend pursuant to paragraph 11(1)(a) is competent and may be compelled to give evidence.

    Fees

    (2)

    Every person summoned to attend pursuant to paragraph 11(1)(a) is entitled to the like fees and allow'
