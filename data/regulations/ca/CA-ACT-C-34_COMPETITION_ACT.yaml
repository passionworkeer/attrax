    Civil rights not affected

    62

    Except as otherwise provided in this Part, nothing in this Part shall be construed as depriving any person of any civil right of action.

    R.S., c. C-23, s. 39; 1974-75-76, c. 76, s. 18

    PART VII

    Other Offences

    Offences

    63

    [Repealed, R.S., 1985, c. 19 (2nd Supp.), s. 37]

    Obstruction

    64

    (1)

    No person shall in any manner impede or prevent or attempt to impede or prevent any inquiry or examination under this Act.

    Offence and punishment

    (2)

    Every person who contravenes subsection (1) is guilty of an offence and

    (a)

    liable on conviction on indictment to a fine in the discretion of the court or to imprisonment for a term not exceeding 10 years, or to both; or

    (b)

    liable on summary conviction to a fine not exceeding $100,000 or to imprisonment for a term not exceeding two years, or to both.

    R.S., 1985, c. C-34, s. 64; 2009, c. 2, s. 418

    Contravention of Part II provisions

    65

    (1)

    Every person who, without good and sufficient cause, the proof of which lies on that person, fails to comply with an order made under section 11 and every person who contravenes subsection 15(5) or
    16(2) is guilty of an offence and

    (a)

    liable on conviction on indictment to a fine in the discretion of the court or to imprisonment for a term not exceeding two years, or to both; or

    (b)

    liable on summary conviction to a fine not exceeding $100,000 or to imprisonment for a term not exceeding two years, or to both.

    Failure to supply information

    (2)

    Every person who, without good and sufficient cause, the proof of which lies on that person, contravenes subsection 114(1) is guilty of an offence and liable on conviction on indictment or on summary
    conviction to a fine not exceeding $50,000.

    Destruction or alteration of records or things

    (3)

    Every person who destroys or alters, or causes to be destroyed or altered, any record or other thing that is required to be produced under section 11 or in respect of which a warrant is issued under
    section 15 is guilty of an offence and

    (a)

    liable on conviction on indictment to a fine in the discretion of the court or to imprisonment for a term not exceeding 10 years, or to both; or

    (b)

    liable on summary conviction to a fine not exceeding $100,000 or to imprisonment for a term not exceeding two years, or to both.

    Liability of directors

    (4)

    Where a corporation commits an offence under this section, any officer, director or agent of the corporation who directed, authorized, assented to, acquiesced in or participated in the commission of
    the offence is a party to and guilty of the offence and is liable to the punishment provided for the offence whether or not the corporation has been prosecuted or convicted.

    R.S., 1985, c. C-34, s. 65; R.S., 1985, c. 19 (2nd Supp.), s. 38; 1999, c. 2, s. 18; 2009, c. 2, s. 419

    Contravention of subsection 30.06(5)

    65.1

    (1)

    Every person who, without good and sufficient cause, the proof of which lies on that person, contravenes subsection 30.06(5) is guilty of an offence and liable on summary conviction or on conviction
    on indictment to a fine not exceeding $5,000 or to imprisonment for a term not exceeding two years, or to both.

    Destruction or alteration of records or things

    (2)

    Every person who destroys or alters, or causes to be destroyed or altered, any record or thing in respect of which a search warrant is issued under section 30.06 or that is required to be produced pursuant
    to an order made under subsection 30.11(1) or 30.16(1) is guilty of an offence and liable

    (a)

    on conviction on indictment to a fine not exceeding $50,000 or to imprisonment for a term not exceeding five years, or to both; or

    (b)

    on summary conviction to a fine not exceeding $25,000 or to imprisonment for a term not exceeding two years, or to both.

    2002, c. 16, s. 7

    Refusal after objection overruled

    65.2

    (1)

    Every person who, without good and sufficient cause, the proof of which lies on that person, refuses to answer a question or to produce a record or thing to the person designated under paragraph 30.11(2)(c)
    after a judge has ruled against the objection under paragraph 30.11(8)(a), is guilty of an offence and liable on conviction on indictment or on summary conviction to a fine not exceeding $5,000 or to
    imprisonment for a term not exceeding two years, or to both.

    Refusal where no ruling made on objection

    (2)

    Every person is guilty of an offence and liable on summary conviction or on conviction on indictment to a fine not exceeding $5,000 or to imprisonment for a term not exceeding two years, or to both,
    who, without good and sufficient cause, the proof of which lies on that person, refuses to answer a question or to produce a record or thing to the person designated under paragraph 30.11(2)(c), where
    no ruling has been made under paragraph 30.11(8)(a),

    (a)

    without giving the detailed statement required by subsection 30.11(9); or

    (b)

    if the person was previously asked the same question or requested to produce the same record or thing and refused to do so and the reasons on which that person based the previous refusal were determined
    not to be well-founded by

    (i)

    a judge, if the reasons were based on the Canadian law of non-disclosure of information or privilege, or

    (ii)

    a court of the foreign state or by a person designated by the foreign state, if the reasons were based on a law that applies to the foreign state.

    2002, c. 16, s. 7

    Contravention of order under Part VII.1 or VIII

    66

    Every person who contravenes an order made under Part VII.1, except paragraphs 74.1(1)(c) and (d), or under Part VIII, except subsection 79(3.1), is guilty of an offence and liable

    (a)

    on conviction on indictment, to a fine in the discretion of the court or to imprisonment for a term not exceeding five years, or to both; or

    (b)

    on summary conviction, to a fine not exceeding $25,000 or to imprisonment for a term not exceeding one year, or to both.

    R.S., 1985, c. C-34, s. 66; R.S., 1985, c. 19 (2nd Supp.), s. 39; 1999, c. 2, s. 19; 2009, c. 2, s. 420

    Whistleblowing

    66.1

    (1)

    Any person who has reasonable grounds to believe that a person has committed or intends to commit an offence under the Act, may notify the Commissioner of the particulars of the matter and may request
    that his or her identity be kept confidential with respect to the notification.

    Confidentiality

    (2)

    The Commissioner shall keep confidential the identity of a person who has notified the Commissioner under subsection (1) and to whom an assurance of confidentiality has been provided by any person who
    performs duties or functions in the administration or enforcement of this Act.

    1999, c. 2, s. 19

    Prohibition

    66.2

    (1)

    No employer shall dismiss, suspend, demote, discipline, harass or otherwise disadvantage an employee, or deny an employee a benefit of employment, by reason that

    (a)

    the employee, acting in good faith and on the basis of reasonable belief, has disclosed to the Commissioner that the employer or any other person has committed or intends to commit an offence under
    this Act;

    (b)

    the employee, acting in good faith and on the basis of reasonable belief, has refused or stated an intention of refusing to do anything that is an offence under this Act;

    (c)

    the employee, acting in good faith and on the basis of reasonable belief, has done or stated an intention of doing anything that is required to be done in order that an offence not be committed under
    this Act; or

    (d)

    the employer believes that the employee will do anything referred to in paragraph (a) or (c) or will refuse to do anything referred to in paragraph (b).

    Saving

    (2)

    Nothing in this section impairs any right of an employee either at law or under an employment contract or collective agreement.

    Definitions

    (3)

    In this section,

    employee

    includes an independent contractor and

    employer

    has the corresponding meaning.

    1999, c. 2, s. 19

    Procedure

    Procedure for enforcing punishment

    67

    (1)

    Where an indictment is found against an accused, other than a corporation, for any offence against this Act, the accused may elect to be tried without a jury and where he so elects, he shall be tried
    by the judge presiding at the court at which the indictment is found, or the judge presiding at any subsequent sittings of that court, or at any court where the indictment comes on for trial.

    Application of

    Criminal Code

    (2)

    Where an election is made under subsection (1), the proceedings subsequent to the election shall be regulated in so far as may be applicable by the provisions of the

    Criminal Code

    relating to the trial of indictable offences by a judge without a jury.

    Jurisdiction of courts

    (3)

    No court other than a superior court of criminal jurisdiction, as defined in the

    Criminal Code

    , has power to try any offence under section 45, 46, 47, 48 or 49.

    Corporations — trials with or without jury

    (4)

    Despite anything in the

    Criminal Code

    or in any other statute or law, the following rules apply to corporations charged with an offence under this Act:

    (a)

    if one or more corporations are charged and no individual is charged in the same indictment, the corporation or corporations are to be tried without a jury;

    (b)

    if one or more corporations and a single individual are charged in the same indictment, then, unless the court is satisfied that the ends of justice require otherwise, the corporation or corporations
    are to be tried

    (i)

    without a jury if the individual elects or re-elects to be tried without a jury, or

    (ii)

    with a jury if the individual elects or re-elects to be tried with a jury; and

    (c)

    if one or more corporations and two or more individuals are charged in the same indictment, then, unless the court is satisfied that the ends of justice require otherwise, the corporation or corporations
    are to be tried

    (i)

    without a jury if all the individuals elect or re-elect to be tried without a jury,

    (ii)

    with a jury if all the individuals elect or re-elect to be tried with a jury, or

    (iii)

    either with or without a jury, as determined by the Attorney General of Canada for each corporation, if some but not all of the individuals elect or re-elect to be tried without a jury.

    Option as to procedure under subsection 34(2)

    (5)

    In any case where subsection 34(2) is applicable, the Attorney General of Canada or the attorney general of the province may in his discretion institute proceedings either by way of an information under
    that subsection or by way of prosecution.

    Limitation period

    (6)

    Proceedings in respect of an offence that is declared by this Act to be punishable on summary conviction may be instituted at any time within but not later than two years after the time when the subject-matter
    of the proceedings arose.

    R.S., 1985, c. C-34, s. 67

