  title: An Act to provide for the general regulation of trade and co
  text: 'An Act to provide for the general regulation of trade and commerce in respect of conspiracies, trade practices and mergers affecting competition

    Competition Act

    Competition

    2026

    4

    1

    C-34

    Short Title

    Short title

    1

    This Act may be cited as the

    Competition Act

    .

    R.S., 1985, c. C-34, s. 1; R.S., 1985, c. 19 (2nd Supp.), s. 19

    PART I

    Purpose and Interpretation

    Purpose

    Purpose of Act

    1.1

    The purpose of this Act is to maintain and encourage competition in Canada in order to promote the efficiency and adaptability of the Canadian economy, in order to expand opportunities for Canadian
    participation in world markets while at the same time recognizing the role of foreign competition in Canada, in order to ensure that small and medium-sized enterprises have an equitable opportunity
    to participate in the Canadian economy and in order to provide consumers with competitive prices and product choices.

    R.S., 1985, c. 19 (2nd Supp.), s. 19

    Interpretation

    Definitions

    2

    (1)

    In this Act,

    article

    means real and personal property of every description including

    (a)

    money,

    (b)

    deeds and instruments relating to or evidencing the title or right to property or an interest, immediate, contingent or otherwise, in a corporation or in any assets of a corporation,

    (c)

    deeds and instruments giving a right to recover or receive property,

    (d)

    tickets or like evidence of right to be in attendance at a particular place at a particular time or times or of a right to transportation, and

    (e)

    energy, however generated; (

    article

    )

    business

    includes the business of

    (a)

    manufacturing, producing, transporting, acquiring, supplying, storing and otherwise dealing in articles, and

    (b)

    acquiring, supplying and otherwise dealing in services.

    It also includes the raising of funds for charitable or other non-profit purposes. (

    entreprise

    )

    Commission

    [Repealed, R.S., 1985, c. 19 (2nd Supp.), s. 20]

    Commissioner

    means the Commissioner of Competition appointed under subsection 7(1); (

    commissaire

    )

    computer system

    has the same meaning as in subsection 342.1(2) of the

    Criminal Code

    ; (

    ordinateur

    )

    data

    means representations, including signs, signals or symbols, that are capable of being understood by an individual or processed by a computer system or other device; (

    données

    )

    Director

    [Repealed, 1999, c. 2, s. 1]

    electronic message

    means a message sent by any means of telecommunication, including a text, sound, voice or image message; (

    message électronique

    )

    entity

    means a corporation or a partnership, sole proprietorship, trust or other unincorporated organization capable of conducting business; (

    entité

    )

