    Affiliation

    (2)

    For the purposes of this Act,

    (a)

    one entity is affiliated with another entity if one of them is the subsidiary of the other or both are subsidiaries of the same entity or each of them is controlled by the same entity or individual;

    (b)

    if two entities are affiliated with the same entity at the same time, they are deemed to be affiliated with each other; and

    (c)

    an individual is affiliated with an entity if the individual controls the entity.

    Subsidiary entity

    (3)

    For the purposes of this Act, an entity is a subsidiary of another entity if it is controlled by that other entity.

    Control

    (4)

    For the purposes of this Act,

    (a)

    a corporation is controlled by an entity or an individual other than Her Majesty if

    (i)

    securities of the corporation to which are attached more than 50% of the votes that may be cast to elect directors of the corporation are held, directly or indirectly, whether through one or more subsidiaries
    or otherwise, otherwise than by way of security only, by or for the benefit of that entity or individual, and

    (ii)

    the votes attached to those securities are sufficient, if exercised, to elect a majority of the directors of the corporation;

    (b)

    a corporation is controlled by Her Majesty in right of Canada or a province if

    (i)

    the corporation is controlled by Her Majesty in the manner described in paragraph (a), or

    (ii)

    in the case of a corporation without share capital, a majority of the directors of the corporation, other than

    ex officio

    directors, are appointed by

    (A)

    the Governor in Council or the Lieutenant Governor in Council of the province, as the case may be, or

    (B)

    a Minister of the government of Canada or the province, as the case may be; and

    (c)

    an entity other than a corporation is controlled by an entity or individual if the entity or individual, directly or indirectly, whether through one or more subsidiaries or otherwise, holds an interest
    in the entity that is not a corporation that entitles them to receive more than 50% of the profits of that entity or more than 50% of its assets on dissolution.

    R.S., 1985, c. C-34, s. 2; R.S., 1985, c. 19 (2nd Supp.), s. 20; 1992, c. 1, s. 145(F); 1995, c. 1, s. 62; 1999, c. 2, s. 1, c. 31, s. 44(F); 2010, c. 23, s. 70; 2014, c. 31, ss. 28, 46; 2018, c. 8,
    s. 109

    Binding on agents of Her Majesty in certain cases

    2.1

    This Act is binding on and applies to an agent of Her Majesty in right of Canada or a province that is a corporation, in respect of commercial activities engaged in by the corporation in competition,
    whether actual or potential, with other persons to the extent that it would apply if the agent were not an agent of Her Majesty.

    R.S., 1985, c. 19 (2nd Supp.), s. 21

    Defects of form

    3

    No proceedings under this Act shall be deemed invalid by reason of any defect of form or any technical irregularity.

    R.S., c. C-23, s. 3

    Collective bargaining activities

    4

    (1)

    Nothing in this Act applies in respect of

    (a)

    combinations or activities of workmen or employees for their own reasonable protection as such workmen or employees;

    (b)

    contracts, agreements or arrangements between or among fishermen or associations of fishermen and persons or associations of persons engaged in the buying or processing of fish relating to the prices,
    remuneration or other like conditions under which fish will be caught and supplied to those persons by fishermen; or

    (c)

    contracts, agreements or arrangements between or among two or more employers in a trade, industry or profession, whether effected directly between or among the employers or through the instrumentality
    of a corporation or association of which the employers are members, pertaining to collective bargaining with their employees in respect of salary or wages and terms or conditions of employment.

    Limitation

    (2)

    Nothing in this section exempts from the application of any provision of this Act a contract, agreement or arrangement entered into by an employer to withhold any product from any person, or to refrain
    from acquiring from any person any product other than the services of workmen or employees.

    R.S., c. C-23, s. 4; 1974-75-76, c. 76, s. 2

