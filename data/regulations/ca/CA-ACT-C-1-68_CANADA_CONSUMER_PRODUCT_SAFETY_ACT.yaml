    Purpose

    Purpose

    3

    The purpose of this Act is to protect the public by addressing or preventing dangers to human health or safety that are posed by consumer products in Canada, including those that circulate within Canada
    and those that are imported.

    Application

    Consumer products

    4

    (1)

    This Act applies to consumer products with the exception of those listed in Schedule 1.

    Tobacco products

    (2)

    This Act does not apply to a

    tobacco product

    as defined in section 2 of the

    Tobacco and Vaping Products Act

    , except in respect of

    (a)

    the ignition propensity of that product; and

    (b)

    the devices and parts referred to in that definition.

    For greater certainty — devices and parts made of tobacco

    (2.1)

    For greater certainty, the devices and parts referred to in paragraph (2)(b) do not include those made in whole or in part of tobacco.

    Natural health products

    (3)

    For greater certainty, this Act does not apply to natural health products as defined in subsection 1(1) of the

    Natural Health Products Regulations

    made under the

    Food and Drugs Act

    .

    (4)

