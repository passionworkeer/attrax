    (h)

    take photographs and make recordings and sketches; and

    (i)

    order the owner or person in charge of the place or a person who manufactures, imports, packages, stores, advertises, sells, labels, tests or transports a consumer product at the place to establish
    their identity to the inspector’s satisfaction or to stop or start the activity.

    Conveyance

    (3)

    For the purpose of entering the conveyance, an inspector may order the owner or person having possession, care or control of the conveyance to stop it or move it to a place where the inspector can enter
    it.

