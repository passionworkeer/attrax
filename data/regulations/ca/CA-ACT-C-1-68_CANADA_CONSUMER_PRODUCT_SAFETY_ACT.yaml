    Removal or Forfeiture of Unlawful Imports

    Unlawful imports

    28.1

    (1)

    An inspector who has reasonable grounds to believe that an imported consumer product does not meet the requirements of the regulations or was imported in contravention of a provision of this Act or
    the regulations may decide whether to give the owner or importer, or the person having possession, care or control of the product, the opportunity to take a measure in respect of it.

    Factors

    (2)

    In making a decision under subsection (1), the inspector shall consider, among other factors

    (a)

    whether the consumer product is a danger to human health or safety; and

    (b)

    any other prescribed factors.

    Duty of inspector

    (3)

    If the inspector decides under subsection (1) not to give the owner, importer or the person having possession, care or control of the consumer product the opportunity to take a measure in respect of
    it, the inspector shall exercise, in respect of the product, any of the powers conferred by the provisions of this Act, other than this section, or of the regulations.

    Measures that may be taken and notice

    (4)

    However, if the inspector decides under subsection (1) to give the owner, importer or person having possession, care or control of the consumer product the opportunity to take a measure in respect of
    it, the inspector, or any other inspector who is informed of the decision, shall decide whether the owner, importer or person having possession, care or control of it may remove it from Canada at their
    expense, consent to its forfeiture or take either of these measures, and shall notify or cause to be notified the owner, importer or person having possession, care or control of the product that they
    may take that measure within the period specified by the inspector or other inspector, as the case may be.

    Forfeiture

    (5)

    If a person is notified under subsection (4) that they may consent to the forfeiture of the consumer product and the person consents to its forfeiture, the product is forfeited to Her Majesty in right
    of Canada and may be disposed of, as the Minister may direct, at the person’s expense.

    2016, c. 9, s. 65

    Analysis

    Analysts

    29

    The Minister may designate any individual or class of individuals as analysts for the administration and enforcement of this Act and the regulations.

    Analysis and examination

    30

    (1)

    An inspector may submit to an analyst, for analysis or examination, anything seized by the inspector, or any sample of it, or any samples taken by the inspector.

    Certificate or report

    (2)

    An analyst who has made an analysis or examination may issue a certificate or report setting out the results of the analysis or examination.

    Orders for Recalls and Taking Measures

    Recall

    31

    (1)

    If the Minister believes on reasonable grounds that a consumer product is a danger to human health or safety, he or she may order a person who manufactures, imports or sells the product for commercial
    purposes to recall it.

    Notice

    (2)

    The order shall be provided in the form of a written notice and must include

    (a)

    a statement of the reasons for the recall; and

    (b)

    the time and manner in which the recall is to be carried out.

    Taking measures

    32

    (1)

    The Minister may order a person who manufactures, imports, advertises or sells a consumer product to take any measure referred to in subsection (2) if

    (a)

    that person does not comply with an order made under section

    12

    with respect to the product;

    (b)

    the Minister has made an order under section

    31

    with respect to the product;

    (c)

    the Minister believes on reasonable grounds that the product is the subject of a measure or recall undertaken voluntarily by the manufacturer or importer; or

    (d)

    the Minister believes on reasonable grounds that there is a contravention of this Act or the regulations in relation to the product.

    Measures

    (2)

    The measures include'
