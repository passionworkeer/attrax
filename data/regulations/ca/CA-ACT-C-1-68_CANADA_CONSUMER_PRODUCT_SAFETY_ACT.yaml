    Review of Orders for Recalls and Taking Measures

    Review officer

    34

    The Minister may designate any individual or class of individuals that are qualified as review officers for the purpose of reviewing orders under section

    35

    .

    Request for review

    35

    (1)

    Subject to any other provision of this section, an order that is made under section

    31

    or

    32

    shall be reviewed on the written request of the person who was ordered to recall a consumer product or to take another measure — but only on grounds that involve questions of fact alone or questions
    of mixed law and fact — by a review officer other than the individual who made the order.

    Contents of and time for making request

    (2)

    The written request must state the grounds for review and set out the evidence — including evidence that was not considered by the individual who made the order — that supports those grounds and the
    decision that is sought. It shall be provided to the Minister within seven days after the day on which the order was provided or, in the event of a serious and imminent danger to human health or safety,
    any shorter period that may be specified in the order.

    No authority to review

    (3)

    The review is not to be done if the request does not comply with subsection (2) or is frivolous, vexatious or not made in good faith.

    Reasons for refusal

    (4)

    The person who made the request shall, without delay, be notified in writing of the reasons for not doing the review.

    Review initiated by review officer

    (5)

    A review officer — other than the individual who made the order — may review an order, whether or not a request is made under subsection (1).

    Order in effect

    (6)

    An order continues to apply during a review unless the review officer decides otherwise.

    Completion of review

    (7)

    A review officer shall complete the review no later than 30 days after the day on which the request is provided to the Minister.

    Extension of period for review

    (8)

    The review officer may extend the review period by no more than 30 days if they are of the opinion that more time is required to complete the review. They may extend the review period more than once.

    Reasons for extension

    (9)

    If the review period is extended, the person who made the request shall, without delay, be notified in writing of the reasons for extending it.

    Decision on completion of review

    (10)

    On completion of a review, the review officer shall confirm, amend, terminate or cancel the order.

    Notice

    (11)

    The person who made the request or, if there is no request, the person who was ordered to recall the consumer product or to take another measure shall, without delay, be notified in writing of the reasons
    for the review officer’s decision under subsection (10).

    Effect of amendment

    (12)

    An order that is amended is subject to review under this section.

