    Duties in the Event of an Incident

    Definition of

    incident

    14

    (1)

    In this section,

    incident

    means, with respect to a consumer product,

    (a)

    an occurrence in Canada or elsewhere that resulted or may reasonably have been expected to result in an individual’s death or in serious adverse effects on their health, including a serious injury;

    (b)

    a defect or characteristic that may reasonably be expected to result in an individual’s death or in serious adverse effects on their health, including a serious injury;

    (c)

    incorrect or insufficient information on a label or in instructions — or the lack of a label or instructions — that may reasonably be expected to result in an individual’s death or in serious adverse
    effects on their health, including a serious injury; or

    (d)

    a recall or measure that is initiated for human health or safety reasons by

    (i)

    a foreign entity,

    (ii)

    a provincial government,

    (iii)

    a public body that is established under an Act of the legislature of a province,

    (iv)

    an aboriginal government as defined in subsection 13(3) of the

    Access to Information Act

    , or

    (v)

    an institution of an entity referred to in subparagraphs (ii) to (iv).

    Requirement to provide information

    (2)

    A person who manufactures, imports or sells a consumer product for commercial purposes shall provide the Minister and, if applicable, the person from whom they received the consumer product with all
    the information in their control regarding any incident related to the product within two days after the day on which they become aware of the incident.

    Report

    (3)

    The manufacturer of the consumer product, or if the manufacturer carries on business outside Canada, the importer, shall provide the Minister with a written report — containing information about the
    incident, the product involved in the incident, any products that they manufacture or import, as the case may be, that to their knowledge could be involved in a similar incident and any measures they
    propose be taken with respect to those products — within 10 days after the day on which they become aware of the incident or within the period that the Minister specifies by written notice.

    Disclosure of Information by the Minister

    Personal information

    15

    (1)

    The Minister may disclose personal information to a person or a government that carries out functions relating to the protection of human health or safety without the consent of the individual to whom
    the personal information relates if the disclosure is necessary to identify or address a serious danger to human health or safety.

    Privacy Act

    not affected

    (2)

    For greater certainty, nothing in this section affects the provisions of the

    Privacy Act

    .

    Confidential business information — agreement

    16

    The Minister may disclose confidential business information to a person or a government that carries out functions relating to the protection of human health or safety or the environment — in relation
    to a consumer product — without the consent of the person to whose business or affairs the information relates and without notifying that person if the person to whom or government to which the information
    may be disclosed agrees in writing to maintain the confidentiality of the information and to use it only for the purpose of carrying out those functions.

    Confidential business information — serious and imminent danger

    17

    (1)

    The Minister may, without the consent of the person to whose business or affairs the information relates and without notifying that person beforehand, disclose confidential business information about
    a consumer product that is a serious and imminent danger to human health or safety or the environment, if the disclosure of the information is essential to address the danger.'
