    Preamble

    Whereas the Parliament of Canada recognizes the objective of protecting the public by addressing dangers to human health or safety that are posed by consumer products;

    Whereas the Parliament of Canada recognizes that the growing number of consumer products that flow across the borders of an increasingly global marketplace make the realization of that objective a challenge;

    Whereas the Parliament of Canada recognizes that along with the Government of Canada, individuals and suppliers of consumer products have an important role to play in addressing dangers to human health
    or safety that are posed by consumer products;

    Whereas the Parliament of Canada wishes to foster cooperation within the Government of Canada, between the governments in this country and with foreign governments and international organizations, in
    particular by sharing information, in order to effectively address those dangers;

    Whereas the Parliament of Canada recognizes that, given the impact activities with respect to consumer products may have on the environment, there is a need to create a regulatory system regarding consumer
    products that is complementary to the regulatory system regarding the environment;

    Whereas the Parliament of Canada recognizes that a lack of full scientific certainty is not to be used as a reason for postponing measures that prevent adverse effects on human health if those effects
    could be serious or irreversible;

    And whereas the Parliament of Canada recognizes that the application of effective measures to encourage compliance with the federal regulatory system for consumer products is key to addressing the dangers
    to human health or safety posed by those products;

    Now, therefore, Her Majesty, by and with the advice and consent of the Senate and House of Commons of Canada, enacts as follows:

    Short Title

