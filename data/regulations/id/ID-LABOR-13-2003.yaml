articles:
- id: art-1
  title: 'LAW

    NUMBER 13/2003

    CONCERNING

    MANPOWER

    BY GRACE OF GOD THE A'
  text: 'LAW

    NUMBER 13/2003

    CONCERNING

    MANPOWER

    BY GRACE OF GOD THE ALMIGHTY

    THE PRESIDENT OF THE REPUBLIC OF INDONESIA

    Considering: a. That national development is executed in the framework of building

    Indonesian people totally and the Indonesian communities as whole

    to realize a prosperous, just, wealthy, even society materially and

    spiritually on the basis of the state ideology Pancasila and the

    Constitution of 1945;

    b. That in the implementation of the national development, manpower

    play vital role and has crucial status as actor and objective of the

    development;

    c. That in line with the role and status of the manpower, manpower

    development is needed for enhancing the quality of manpower and

    their participation in the development as well as improving the

    protection of manpower and their families in accordance with human

    status and dignity;

    d. That manpower protection aims at guaranteeing the basic rights of

    workers/labor and equal opportunity as well as non-discriminatory

    treatment on whatever basis by observing the growth of business

    communities continuously;

    e. That since several manpower laws are deemed no longer suitable to

    the need and demand of the manpower development, they need to

    be revoked and/or withdrawn again;

    f. That based on the considerations as meant in letters a, b, c, d and e,

    it is necessary to enact a law on manpower affairs.

    In view of: Article 5 paragraph (1), Article 20 paragraph (2), Article 28 and Article 31

    paragraph (1) of the Constitution of 1945

    With the collective approval of

    THE HOUSE OF REPRESENTATIVES OF

    THE REPUBLIC OF INDONESIA

    AND

    THE PRESIDENT OF THE REPUBLIC OF INDONESIA

    D E C I D E S

    To stipulate: THE LAW ON MANPOWER AFFAIRS'
- id: art-2
  title: CHAPTER I
  text: 'CHAPTER I

    GENERAL PROVISION'
- id: art-3
  title: Article 1
  text: 'Article 1

    Referred to in this law as:

    1. Manpower affairs shall be everything related to manpower before, during and after the

    working period.

    2. Manpower shall be everyone capable of undertaking job to produce goods and/or

    services for fulfilling the need of either the relevant person or the society.

    3. Worker/labor shall be everyone working by receiving a wage or compensation in other

    forms.

    4. Employer shall be individual, entrepreneur, statutory body or other agencies

    employing manpower by paying a wage or compensation in other form.

    5. Entrepreneur shall be:

    a. Individual, partnership or statutory body undertaking a proprietary company.

    b. Individual, partnership or statutory body undertaking a company belonging to the

    other;

    c. Individual, partnership or statutory body located in Indonesia to represent the

    company as meant in letters a and b, which is domiciled outside Indonesia.

    6. The company shall be:

    a. Every business having statutory body or not, belonging to individual, partnership

    or statutory body, owned by the private or the state, which employ workers/labor

    by paying a wage or compensation in other forms.

    b. Social and other businesses having executives and employing other people by

    paying a wage or compensation in other forms.

    7. Manpower planning shall be systematic formulation of manpower plan used as the

    basis and reference in formulating policies, strategies, and implementing sustainable

    manpower-development programs.

    8. Manpower information shall be combination, series and analyses of data in the form

    of processed figures, texts and documents having certain meanings, values and

    nuances regarding manpower affairs.

    9. Vocational training shall be all activities to provide, acquire, and enhance as well as to

    develop work competence, productivity, discipline, behavior and ethos at certain

    grade of skill and expertise in accordance with the level and qualification of position or

    occupation.

    10. Work competence shall be work capability of every individual, covering aspects of

    knowledge, skill and work behavior in accordance with the stipulated standards.

    11. Apprenticeship shall be part of the vocational training system organized integrated

    between training in training center and direct assignment under guidance and

    supervision of instructors or better experienced workers/labor in the production of

    goods and/or services in companies, in the framework of mastering certain skill or

    expertise.

    12. Manpower placement service shall be an activity to unite manpower and employers

    so that the manpower can obtain occupation in accordance with their talent, interest

    and capability and the employer can obtain manpower in accordance with their need.

    13. Expatriates shall be foreign citizens holding visa with the intention to work in the

    Indonesian territory.

    14. Working agreement shall be an agreement between workers/labor and entrepreneurs

    or employers that contain working requirements, rights and obligations of parties.

    15. Working relations shall be relations between entrepreneurs and workers/labor on the

    basis of a working agreement having elements of occupation, wage and order.

    16. Industrial relations shall be a relations system established between actors in the

    production of goods and/or services, which consists of representatives of

    entrepreneurs, workers/labors, and the government on the basis of values of

    Pancasila and the Constitution of 1945.

    17. Workers/labor union shall be an organization established from, by and for

    workers/labor both inside and outside company, which is independent, transparent,

    autonomous, democratic and responsible for struggling, defending as well as

    protecting rights and interests of workers/labor as well as enhancing welfare of

    workers/labor and their families.

    18. Bipartite cooperation institute shall be a communications and consultation forum

    concerning matters related to industrial relations in a company, whose members

    consists of entrepreneurs and worker/labor union already registered at the institution

    responsible for manpower affairs or representatives of workers/labor.

    19. Tripartite cooperation institute shall be a communications, consultation and

    deliberation forum regarding manpower affairs, whose members consist of

    representatives of entrepreneur organizations, worker/labor units and the government.

    20. Corporate rule shall be a written regulation made by entrepreneur, which contains

    working requirements and corporate procedures.

    21. Collective working agreement shall be an agreement resulting from negotiation

    between a worker/labor union or several worker/labor unions registered at the

    institution in charge of the manpower affairs and entrepreneurs or group of

    entrepreneurs, which contains working requirements, rights and obligations of parties.

    22. Industrial relations dispute shall be a divergent view resulting in a conflict between

    entrepreneurs and worker/labor or worker/labor union because of a dispute over

    rights, interests, and labor dismissal as well as dispute between worker/labor unions

    only in a company.

    23. Labor strike shall be an action of workers/labor planned and implemented collectively

    and/or by worker/labor union to discontinue or slow down a job.

    24. Lock out shall be an action of entrepreneur to deny workers/ labor partly or wholly to

    execute a job.

    25. Labor dismissal shall be termination of working relations because of a certain matter

    that discontinues rights and obligations between workers/labor and entrepreneur.

    26. Child shall be everyone aging below 18 (eighteen) years.

    27. Daytime shall be the period between 06.00 and 18.00

    28. One day shall be a period of 24 (twenty four) days.

    29. A week shall be a period of 7 (seven) days.

    30. Wage shall be a right of workers/labor received and denominated in the form of

    money as a compensation from entrepreneur or employer to workers/labor, which is

    stipulated and paid in accordance with a working agreement, commitment or

    legislation, including allowance of workers/labor and their families for a job and/or

    service already or to be executed/rendered.

    31. Worker/labor welfare shall be the fulfillment of material and spiritual need and/or

    necessity both inside and outside working relations, which directly and indirectly can

    enhance working productivity in a safe and healthy working environment.

    32. Manpower supervision shall be an activity to supervise and enforce manpower

    legislation.

    33. Minister shall be the minister in charge of manpower affairs.'
- id: art-4
  title: CHAPTER II
  text: 'CHAPTER II

    BASIS, PRINCIPLE AND OBJECTIVE'
- id: art-5
  title: Article 2
  text: 'Article 2

    Manpower development shall be based on state ideology Pancasila and the Constitution

    of 1945.'
- id: art-6
  title: Article 3
  text: 'Article 3

    Manpower development shall be implemented on the basis of principle of integration

    through inter-sector functional coordination at the central and regional levels.'
- id: art-7
  title: Article 4
  text: 'Article 4

    Manpower development shall aims at:

    a. Empowering and enhancing the efficiency of manpower optimally and humanely;

    b. Realizing equal working opportunity and providing manpower in accordance with the

    need of the national and regional development;

    c. Providing protection for manpower in realizing welfare;

    d. Enhancing the welfare of manpower and their families.'
- id: art-8
  title: CHAPTER III
  text: 'CHAPTER III

    EQUAL OPPORTUNITY AND TREATMENT'
- id: art-9
  title: Article 5
  text: 'Article 5

    Every manpower shall have equal opportunity to obtain a job without discrimination.'
- id: art-10
  title: Article 6
  text: 'Article 6

    Every worker/labor shall entitle to obtain equal treatment without discrimination from

    entrepreneur.'
- id: art-11
  title: CHAPTER IV
  text: 'CHAPTER IV

    MANPOWER PLANNING AND INFORMATION'
- id: art-12
  title: Article 7
  text: 'Article 7

    (1) In the framework of manpower development, the government shall stipulate policies

    and formulate manpower planning.

    (2) Manpower planning shall include:

    a. Macro manpower planning; and

    b. Micro manpower planning

    (3) In formulating policies, strategies and implementing sustainable manpower

    development programs, the government shall refer to the manpower planning as

    meant in paragraph (1).'
- id: art-13
  title: Article 8
  text: 'Article 8

    (1) The manpower planning shall be formulated on the basis of manpower information

    including:

    a. Population and manpower;

    b. Job opportunity;

    c. Vocational training, including work competence;

    d. Manpower productivity;

    e. Industrial relations;

    f. Working environment condition

    g. Wage system and welfare of manpower; and

    h. Manpower social insurance

    (2) The manpower information as meant in paragraph (1) shall be collected from all

    parties, both government and private institutions.

    (3) Provisions on procedures for obtaining manpower information and formulation as well

    as implementation of the manpower planning as meant in paragraph (1) shall be

    regulated by a government regulation.'
- id: art-14
  title: CHAPTER V
  text: 'CHAPTER V

    VOCATIONAL TRAINING'
- id: art-15
  title: Article 9
  text: 'Article 9

    Vocational training shall be organized and directed to provide, enhance and develop work

    competence for driving up capability, productivity and welfare.'
- id: art-16
  title: Article 10
  text: 'Article 10

    (1) Vocational training shall be executed by observing the need of labor market and

    business communities both inside and outside working relations.

    (2) Vocational training shall be organized on the basis of training programs reference to

    work competence standards

    (3) Vocational training can be implemented in levels.

    (4) Provisions on procedures for stipulating the work competence standards as meant in

    paragraph (2) shall be stipulated by a decree of the Minister.'
- id: art-17
  title: Article 11
  text: 'Article 11

    Every manpower shall entitle to obtain and/or enhance and/or develop work competence

    in accordance with talent, interest, and capability through vocational training.'
- id: art-18
  title: Article 12
  text: 'Article 12

    (1) Entrepreneurs shall be responsible for enhancing and/or developing competence of

    their workers through vocational training.

    (2) The enhancement and/or development of the competence as meant in paragraph (1)

    shall be compulsory for entrepreneurs fulfilling the requirements regulated by a

    decree of the Minister.

    (3) Every worker/labor shall have equal opportunity to participate in vocational training in

    accordance with their respective fields of tasks.'
- id: art-19
  title: Article 13
  text: 'Article 13

    (1) Vocational training shall be organized by government and/or private owned vocational

    training institutions.

    (2) Vocational training can be organized in training place or workplace.

    (3) The government-owned vocational training institutions as meant in paragraph (1) can

    cooperate with private institutions in organizing vocational training.'
- id: art-20
  title: Article 14
  text: 'Article 14

    (1) Private-owned vocational training institutions can be in the form of Indonesian

    statutory body or individual business.

    (2) The private vocational training institution as meant in Article (1) shall secure license

    from or register at the institution responsible for manpower affairs in regencies/cities.

    (3) Vocational training institutions organized by government institutions shall register their

    activities to the institution in charge of manpower affairs in regencies/cities.

    (4) Provisions on procedures for licensing and registering the vocational training

    institutions as meant in paragraphs (2) and (3) shall be regulated by a decree of the

    Minister.'
- id: art-21
  title: Article 15
  text: 'Article 15

    Organizers of vocational training shall fulfill the following requirements:

    a. The availability of trainers;

    b. The availability of curriculum in accordance with the training grades;

    c. The availability of vocational training facilities and infrastructure; and

    d. The availability of fund for ensuring the continuation of vocational training activities.'
- id: art-22
  title: Article 16
  text: 'Article 16

    (1) Private-owned vocational training institutions already securing license and

    government-owned vocational training institutions already registered can earn

    accreditation from accreditation institution.

    (2) The accreditation institution as mean tin paragraph (1) shall be independent and

    consist of representatives of the society and government and be stipulated by a

    decree of the minister.

    (3) The organization and working arrangement of the accreditation institution as meant in

    paragraph (2) shall be regulated by a decree of the minister.'
- id: art-23
  title: Article 17
  text: 'Article 17

    (1) The institution in charge of manpower affairs in regencies/cities can suspend

    vocational training if in the implementation, the training:

    a. Is not in accordance with the direction of the vocation training as meant in Article

    9; and/or

    b. Fails to meet the requirements as meant in Article 15.

    (2) The provisional suspension of vocational training as meant in paragraph (1) shall be

    accompanied by reasons and corrective recommendations and apply for 6 (six)

    months at the maximum.

    (3) The provisional suspension of vocational training shall only be applied to training

    programs failing to meet the requirements as meant in Articles 9 and 15.

    (4) In the case of organizers of vocational training failing to fulfill and complete the

    corrective recommendations as meant in paragraph (2) in 6 (six) months, they shall

    be subjected to a sanction in the form of discontinuation of training programs.

    (5) Organizers of vocational training not obeying and still organizing vocational training

    programs already stopped as meant in paragraph (4) shall be subjected to a sanction

    in the form of revocation of license and nullification or registration of training

    organizers.

    (6) Provisions on procedures for suspension, discontinuation, revocation of license and

    nullification of registration shall be regulated by a decree of the minister.'
- id: art-24
  title: Article 18
  text: 'Article 18

    (1) Manpower shall entitle to obtain recognition of work competence after attending

    vocational training organized by government-owned vocational training institution,

    private vocational training institutions or on-job training.

    (2) The recognition of the work competence as meant in paragraph (1) shall be done

    through a work competence certificate.

    (3) The certification of work competence as meant in paragraph (2) also can be attended

    by experienced manpower.

    (4) An independent national agency for certification of profession shall be established to

    undertake certification of work competence.

    (5) The establishment of the independent national agency for certification of profession

    as meant in paragraph (4) shall be regulated by a government regulation.'
- id: art-25
  title: Article 19
  text: 'Article 19

    Vocational training of disabled manpower shall be organized by observing kind, degree of

    disability and capability of the relevant manpower.'
- id: art-26
  title: Article 20
  text: 'Article 20

    (1) In order to support the enhancement of vocational training in the framework of

    manpower development, a national vocational-training system which constitutes a

    reference to the implementation of vocational training in all fields and/or sectors shall

    be developed.

    (2) Provisions on model, mechanism and institution of the national vocational training

    system as meant in paragraph (1) shall be regulated by a government regulation.'
- id: art-27
  title: Article 21
  text: 'Article 21

    Vocational training can be organized by an apprenticeship system.'
- id: art-28
  title: Article 22
  text: 'Article 22

    (1) The apprenticeship shall be done on the basis of a written apprenticeship agreement

    between participants and entrepreneurs.

    (2) The apprenticeship agreement as meant in paragraph (1) shall contain at least rights

    and obligations of participant and entrepreneurs as well as the period of

    apprenticeship.

    (3) The apprenticeship not organized through the apprenticeship agreement as meant in

    paragraph (1) shall be deemed illegitimate and the status of participants shall change

    into works/labor of the said companies.'
- id: art-29
  title: Article 23
  text: 'Article 23

    Manpower already attending the apprenticeship program shall be entitled to obtain

    recognition of work competence qualification from companies or certification institution.'
- id: art-30
  title: Article 24
  text: 'Article 24

    Apprenticeship can be implemented in company or vocational training or other companies

    inside or outside the Indonesian territory.

    Article25

    (1) The apprenticeship executed outside in Indonesian territory shall secure a license

    from the minister or the appointed official.

    (2) In order to obtain the license as meant in paragraph (1), organizers of apprenticeship

    shall be in the form of Indonesian statutory body in accordance with the provisions of

    laws in force.

    (3) Provisions on procedures for licensing the apprenticeship outside the Indonesian

    territory as meant in paragraphs (1) and (2) shall be regulated by a decree of the

    minister.'
- id: art-31
  title: Article 26
  text: 'Article 26

    (1) Organizers of apprenticeship outside the Indonesian territory shall pay attention to:

    a. Dignity and status of the Indonesian people;

    b. Mastery of higher competence; and

    c. Protection and welfare of apprenticeship participants, including the right to

    perform worship

    (2) The minister or the appointed official can discontinue the apprenticeship outside the

    Indonesian territory if in the implementation, the program is not in accordance with the

    provision as meant in paragraph (1).'
- id: art-32
  title: Article 27
  text: 'Article 27

    (1) The minister can require companies fulfilling requirements for undertaking

    apprenticeship programs.

    (2) In stipulating the requirements as meant in paragraph (1), the minister shall observe

    interests of companies, society and the state.'
- id: art-33
  title: Article 28
  text: 'Article 28

    (1) A national vocational-training coordinating institution shall be established to provide

    recommendations and considerations in stipulating policies as well as coordinating

    vocational training and apprenticeship.

    (2) The establishment, membership and working arrangement of the vocational-training

    coordinating institution as meant in paragraph (1) shall be regulated by a presidential

    decree.'
- id: art-34
  title: Article 29
  text: 'Article 29

    (1) The central and/or regional governments can foster vocational training and

    apprenticeship.

    (2) The fostering of the vocational training and apprenticeship shall be directed to

    enhance relevance, quality and efficiency of vocational training and productivity.

    (3) The enhancement of productivity as meant in paragraph (2) shall be done through the

    development of productive culture, working ethos, technology, and efficiency of

    economic activities towards the realization of national productivity.'
- id: art-35
  title: Article 30
  text: 'Article 30

    (1) A national productivity institution shall be established to enhance the productivity as

    meant in Article 29 paragraph (2).

    (2) The productivity institution as meant in paragraph (1) shall be in the form of inter-

    sector and regional institutional networks of productivity enhancement service.

    (3) The establishment, membership and working arrangement of the national productivity

    institution as meant in paragraph (1) shall be regulated by a presidential decree.'
- id: art-36
  title: CHAPTER VI
  text: 'CHAPTER VI

    MANPOWER PLACEMENT'
- id: art-37
  title: Article 31
  text: 'Article 31

    Every manpower shall have equal rights and opportunity to choose, obtain and move to

    other job and earn adequate income in the country or abroad.'
- id: art-38
  title: Article 32
  text: 'Article 32

    (1) Manpower placement shall be done on the basis of the transparent, free, objectives

    as well as just and equal non-discriminatory principles.

    (2) Manpower placement shall be directed to place manpower in appropriate positions in

    accordance with the expertise, skill, talent, interest and capability by observing

    dignity, status, human rights and legal protection.

    (3) Manpower placement shall be done by observing equitable distribution of job

    opportunity and provision of manpower in accordance with the need of national and

    regional programs.'
- id: art-39
  title: Article 33
  text: 'Article 33

    Manpower placement shall consist of:

    a. Domestic manpower placement, and

    b. Overseas manpower placement'
- id: art-40
  title: Article 34
  text: 'Article 34

    Provisions on the overseas manpower placement as meant in Article 33 letter b shall be

    regulated by a law.'
- id: art-41
  title: Article 35
  text: 'Article 35

    (1) Employers needing manpower can recruit the needed manpower directly or through

    manpower placement service providers.

    (2) The manpower placement service providers as meant in paragraph (1) shall provide

    protection as from the recruitment to the manpower placement.

    (3) The employers as meant in paragraph (1) in employing manpower shall provide

    protection covering welfare, safety and physical and mental health of manpower.'
- id: art-42
  title: Article 36
  text: 'Article 36

    (1) Manpower placement by the providers as meant in Article 35 paragraph (1) shall be

    done by providing manpower placement service.

    (2) The manpower placement service as meant in paragraph (1) shall be integrated in a

    manpower placement system covering components of:

    a. Job seekers;

    b. Job vacancies;

    c. Labor market information;

    d. Inter-job mechanism; and

    e. Manpower placement institution

    (3) The components of the manpower placement system as meant in paragraph (1) can

    be implemented separately for realizing manpower placement.'
- id: art-43
  title: Article 37
  text: 'Article 37

    (1) The manpower placement service providers as meant in Article 35 paragraph (1) shall

    consist of:

    a. Government institution responsible for manpower affairs;

    b. Private institutions having statutory body

    (2) The private manpower-placement institutions as meant in paragraph (1) letter b in

    providing manpower placement service shall secure a license from the minister or the

    appointed official.'
- id: art-44
  title: Article 38
  text: 'Article 38

    (1) The manpower placement service provider as meant in Article 37 paragraph (1) letter

    a shall be prohibited from collecting placement cost, directly or indirectly, partly or

    wholly from manpower users.

    (2) The manpower placement service provider as meant in Article 37 paragraph (1) letter

    b only can collect manpower placement cost from manpower users and manpower of

    certain categories and positions.

    (3) The categories and positions as meant in paragraph (2) shall be stipulated by a

    decree of the minister.'
- id: art-45
  title: CHAPTER VII
  text: 'CHAPTER VII

    EXPANSION OF JOB OPPORTUNITY'
- id: art-46
  title: Article 39
  text: 'Article 39

    (1) The government shall be responsible for making efforts to expand job opportunity

    both inside and outside working relations.

    (2) The government and society shall collectively make efforts to expand job opportunity

    both inside and outside working relations.

    (3) All policies of the central and regional governments in every sector shall be directly to

    realize the expansion of job opportunity both inside and outside working relations.

    (4) Financial institutions being banks or non-banks and business communities shall need

    to assist and provide facilities for every social activity that can create or expand job

    opportunity.'
- id: art-47
  title: Article 40
  text: 'Article 40

    (1) The expansion of job opportunity outside working relations shall be done through the

    creations of productive and sustainable activities by enhancing the efficiency of

    potentials of natural resources, human resources and appropriate technology.

    (2) The creation of job opportunity expansion as meant in paragraph (1) shall be done by

    pattern of self employment promotion and fostering, application of labor intensive

    system, appropriate technology and enhancement of efficiency of voluntary

    manpower or other pattern that can encourage the expansion of job opportunity.'
- id: art-48
  title: Article 41
  text: 'Article 41

    (1) The government shall stipulate policies on manpower affairs and job opportunity

    expansion.

    (2) The government and society shall collectively supervise the implementation of the

    policies as meant in paragraph (1).

    (3) In executing the task as meant in paragraph (2), according agency consisting of

    representatives of the government and society can be established.'
- id: art-49
  title: CHAPTER VIII
  text: 'CHAPTER VIII

    ASSIGNMENT OF EXPATRIATES'
- id: art-50
  title: Article 42
  text: 'Article 42

    (1) Every employer employing expatriates shall secure a written license from the minister

    or the appointed official.

    (2) Individual employers shall be prohibited form employing expatriates.

    (3) The obligation to possess the license as meant in paragraph (1) shall not apply to

    foreign representative offices employing expatriates as diplomatic and consular

    employees.

    (4) Expatriates can be employed in Indonesia only inside working relations for certain

    positions and period.

    (5) Provisions on the certain positions and period as meant in paragraph (4) shall be

    stipulated by a decree of the minister.

    (6) The expatriates as meant in paragraph (4) having their working period expiring and

    un-extendable could be replaced by other expatriates.'
- id: art-51
  title: Article 43
  text: 'Article 43

    (1) Employers employing expatriates shall have an expatriate assignment plan ratified by

    the minister or the appointed official.

    (2) The expatriate assignment plan as meant in paragraph (1) shall contain at least

    information about:

    a. Reason for employing expatriates;

    b. Position and/or status of expatriates in the organizational structure of the said

    companies;

    c. Period of assignment of expatriates;

    d. Appointment of manpower being Indonesian citizens as counterpart of the

    employed expatriates.

    (3) The provision as meant in paragraph (1) shall not apply to government institutions,

    international agencies and representative offices of foreign countries.

    (4) The provision on procedures for ratification of the expatriates assignment plan shall

    be stipulated by a decree of the minister'
- id: art-52
  title: Article 44
  text: 'Article 44

    (1) Employers of expatriates shall abide by the provisions on positions and competence

    standards in force.

    (2) Provisions on the positions and competence standards as meant in paragraph (1)

    shall be regulated by a decree of the minister.'
- id: art-53
  title: Article 45
  text: 'Article 45

    (1) Employers of expatriates shall:

    a. Appoint manpower being Indonesian citizens as counterpart of the employed

    expatriates for the transfer of technology and expertise from the said expatriates;

    and

    b. Organize education and training for the Indonesian manpower as meant in letter

    a according to the qualification of positions assumed by the expatriates

    (2) The provision as meant in paragraph (1) shall not apply to expatriates assuming the

    position of executive directors and/or commissioners.'
- id: art-54
  title: Article 46
  text: 'Article 46

    (1) Expatriates shall be prohibited from assuming positions in charge of personnel affairs

    and/or certain positions.

    (2) The certain positions as meant in paragraph (1) shall be regulated by a decree of the

    minister.'
- id: art-55
  title: Article 47
  text: 'Article 47

    (1) Employers shall pay compensation to every expatriate that they employ.

    (2) The obligation to pay the compensation as meant in paragraph (1) shall not apply to

    government institutions, representative offices of foreign countries, international

    agencies, social institutions, religious institutions and certain positions in educational

    institutions.

    (3) Provisions on the certain positions in the educational institutions as meant in

    paragraph (2) shall be regulated by a decree of the minister.

    (4) Provision on the amount of compensation and its allocation shall be regulated by a

    government regulation.'
- id: art-56
  title: Article 48
  text: 'Article 48

    Employers employing expatriates shall return the expatriates to their countries of origin

    after the working relations expire.'
- id: art-57
  title: Article 49
  text: 'Article 49

    Provisions on assignment or expatriates and the organization of education and training for

    counterpart manpower shall be regulated by a presidential decree.'
- id: art-58
  title: CHAPTER IX
  text: 'CHAPTER IX

    WORKING RELATIONS'
- id: art-59
  title: Article 50
  text: 'Article 50

    Working relations shall arise from working agreement between entrepreneurs and/or

    workers/labor.'
- id: art-60
  title: Article 51
  text: 'Article 51

    (1) A working agreement shall be made in writing or verbally.

    (2) Working agreements required in writing shall be implemented in accordance with the

    provisions of laws in force.'
