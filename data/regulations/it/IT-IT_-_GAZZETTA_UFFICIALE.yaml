    \tL'Istituto Poligrafico e Zecca dello Stato S.p.A. promuove la più ampia fruibilità della Gazzetta Ufficiale della Repubblica Italiana in formato digitale.\nSi segnala che l'unico testo definitivo\
    \ è quello pubblicato sulla Gazzetta Ufficiale a mezzo stampa, che prevale in caso di discordanza.\n La riproduzione dei testi forniti nel formato elettronico è consentita purché venga menzionata la\
    \ fonte, il carattere non autentico e gratuito.\ninformazioni\nGazzetta Ufficiale Certificata\nPrivacy\nFormato Grafico PDF\nconcessionari\nInserzioni\nLibrerie\nDichiarazione di accessibilità\ncontatti\n\
