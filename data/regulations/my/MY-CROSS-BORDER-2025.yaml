- id: art-1
  title: Jabatan Perlindungan Data Peribadi (PDP), Malaysia
  text: "Jabatan Perlindungan Data Peribadi (PDP), Malaysia\nSkip to content\nMenu\nFacebook\nLinkedin\nX-twitter\nTiktok\nInstagram\nWhatsapp\nBahasa Melayu\nEnglish\nMenu\nPOSTER DBN\nWhatsApp Image 2025-09-02\n\
    2025-08-21\nWeb Banner Timeline Akta Perlindungan Data Peribadi\nWebBannerPersidangandanMajlisPeluncuran\nWhatsApp Image 2025-07-23 at 16.45.05_2d27a5c9\nWhatsApp Image 2025-07-24 at 10.15.20_a1402e3c\n\
    WhatsApp Image 2025-07-29 at 08.42.47_4257295e\nWhatsApp Image 2025-07-30 at 09.25.55_1ba55930\nWhatsApp Image 2025-07-31 at 10.33.54_787376c9\nWhatsApp Image 2025-08-01 at 09.51.13_2cc776ce\nPEJABAT\
    \ PESURUHJAYA \nPERLINDUNGAN DATA \nPERIBADI\nSearch\nSearch\nPengumuman\n\t\t\t\tIKLAN KEKOSONGAN JAWATAN  PERSONEL MySTEP DI JABATAN PERLINDUNGAN DATA PERIBADI\t\t\t\n\t\t\tMac 7, 2026\t\t\n\t\t\t\
    \tPENGIKLANAN SEMULA SEBUT HARGA: PERKHIDMATAN SEWAAN PERALATAN ICT (PDP:SH5/2025)\t\t\t\n\t\t\tDisember 23, 2025\t\t\n\t\t\t\tKERTAS KONSULTASI AWAM BIL. 4/2025 : CADANGAN PINDAAN KE ATAS PERATURAN-PERATURANPERLINDUNGAN\
    \ DATA PERIBADI 2013 [P.U.A. 335/2013]\t\t\t\n\t\t\tOgos 25, 2025\t\t\nLihat Semua\n\t\t\t\t\t\t\tAwam\t\t\t\t\t\t\n\t\t\t\t\t\tMaklumat yang perlu anda tahu tentang perlindungan data peribadi\t\t\t\
    \t\t\n\t\t\t\t\t\t\tLapor Aduan\t\t\t\t\t\t\n\t\t\t\t\t\t\tOrganisasi\t\t\t\t\t\t\n\t\t\t\t\t\tPanduan untuk badan awam dan organisasi yang merupakan pengawal data\t\t\t\t\t\n\t\t\t\t\t\t\tPendaftaran\
    \ Pengawal Data\t\t\t\t\t\t\n\t\t\t\t\t\t\tPembaharuan Sijil\t\t\t\t\t\t\n\t\t\t\t\t\t\tLapor DBN\t\t\t\t\t\t\nAkta Perlindungan Data Peribadi [Akta 709]\n\t\t\t\t\t\t\tAkta Perlindungan Data Peribadi\
    \ 2010\t\t\t\t\t\t\n\t\t\t\t\t\tAkta Perlindungan Data Peribadi 2010 (Akta 709) atau APDP merupakan salah satu bentuk perundangan siber yang diperakukan dalam pelaksanaan Koridor Raya Multimedia (MSC).\
    \ Akta ini merupakan...\t\t\t\t\t\n\t\t\t\t\t\t\tApakah pemakaian bagi akta 709?​\t\t\t\t\t\t\n\t\t\t\t\t\tMana-mana orang yang memproses dan mempunyai kawalan terhadap atau membenarkan pemprosesan\
    \ apa-apa data peribadi berkenaan dengan transaksi komersial...\t\t\t\t\t\n\t\t\t\t\t\t\tPrinsip Perlindungan Data Peribadi\t\t\t\t\t\t\n\t\t\t\t\t\tWajar orang ramai mengetahui bagaimana data peribadi\
    \ kita diperolehi dan menyedari akan 7 Prinsip Perlindungan Data Peribadi yang disaran oleh APDP 2010 (Akta 709)\t\t\t\t\t\n\t\t\t\t\t\t\tStandard Perlindungan Data Peribadi\t\t\t\t\t\t\n\t\t\t\t\t\t\
    Senarai kesalahan dan hukuman dibawah Akta Perlidungan Data Peribadi 2010 (akta 709) dan perundangan subsidiari di bawahnya...\t\t\t\t\t\nAktiviti Pemeriksaan\n\t\t\t\tSerahan Notis Peringatan 14 Hari\
    \ Pendaftaran Pengguna Data Di Sekitar Bandar Larkin, Johor\t\t\t\nSERAHAN NOTIS PERINGATAN 14 HARI PENDAFTARAN PENGGUNA DATA DI BAWAH AKTA PERLINDUNGAN DATA PERIBADI 2010 [AKTA 709] DI SEKITAR BANDAR\
    \ LARKIN, JOHOR Pasukan Penguatkuasa Pejabat Pesuruhjaya Perlindungan Data Peribadi (PDP)\n\t\t\tSeptember 17, 2024\t\t\n\t\t\t\tLawatan Pemeriksaan Sistem Perlindungan Data Peribadi di Bawah Seksyen\
    \ 101, Akta 709 ke Atas Mindtech Education Sdn. Bhd., Kota Damansara, Selangor\t\t\t\nLAWATAN PEMERIKSAAN SISTEM PERLINDUNGAN DATA PERIBADI DI BAWAH SEKSYEN 101, AKTA PERLINDUNGAN DATA PERIBADI 2010\
    \ [AKTA 709] KE ATAS MINDTECH EDUCATION SDN. BHD., KOTA DAMANSARA, SELANGOR Pasukan Penguatkuasa Pejabat Pesuruhjaya\n\t\t\tSeptember 2, 2024\t\t\n\t\t\t\tLawatan Pemeriksaan Sistem Data Peribadi di\
    \ Bawah Seksyen 101, Akta 709 ke Atas KY Maju Development Sdn. Bhd, Pulau Pinang\t\t\t\nLAWATAN PEMERIKSAAN SISTEM DATA PERIBADI DI BAWAH SEKSYEN 101, AKTA PERLINDUNGAN DATA PERIBADI 2010 [ AKTA 709\
    \ ] KE ATAS KY MAJU DEVELOPMENT SDN. BHD, PULAU PINANG Pasukan Penguatkuasa Pejabat\n\t\t\tOgos 23, 2024\t\t\nLihat Semua\nProgram Kesedaran\n\t\t\t\tPerbincangan Program Satu Pemimpin Satu Kampung\
    \ (Santuni Madani)\t\t\t\nPERBINCANGAN PROGRAM SATU PEMIMPIN SATU KAMPUNG (SANTUNI MADANI) YBrs. Profesor Dr. Mohd Nazri bin Kama, Ketua Pengarah merangkap Pesuruhjaya Perlindungan Data Peribadi telah\
    \ turun padang untuk bertemu dengan penduduk Kampung\n\t\t\tSeptember 5, 2024\t\t\n\t\t\t\tBengkel Pembangunan Standard Perlindungan Data Peribadi serta Garis Panduan Mekanisme dan Pelaksanaan Pemindahan\
    \ Data Merentas Sempadan\t\t\t"
- id: art-2
  title: Pejabat Pesuruhjaya Perlindungan Data Peribadi dengan kerjas
  text: "Pejabat Pesuruhjaya Perlindungan Data Peribadi dengan kerjasama Futurise Sdn. Bhd. telah menganjurkan Bengkel Pembangunan Standard Perlindungan Data Peribadi serta Garis Panduan Mekanisme dan Pelaksanaan\
    \ Pemindahan Data Merentas Sempadan pada 26\n\t\t\tOgos 26, 2024\t\t\n\t\t\t\tBengkel Penyediaan Dan Pengurusan Kertas Siasatan Pejabat Pesuruhjaya Perlindungan Data Peribadi\t\t\t\nBENGKEL PENYEDIAAN\
    \ DAN PENGURUSAN KERTAS SIASATAN PEJABAT PESURUHJAYA PERLINDUNGAN DATA PERIBADI Bengkel Siasatan dan Pengurusan Kertas Siasatan telah diadakan pada 8 Ogos hingga 10 Ogos 2024 bertempat di Imperial Heritage,\n\
    \t\t\tOgos 10, 2024\t\t\nLihat Semua\nTindakan Penguatkuasaan\n\t\t\t\tSenarai Kes Kompaun Di Bawah Akta Perlindungan Data Peribadi 2010 (AKTA 709)\t\t\t\n\t\t\tFebruari 18, 2025\t\t\n\t\t\t\tAgensi\
    \ pekerjaan berstatus Sdn. Bhd.\t\t\t\nTahun: 2018 Sektor: Perkhidmatan Jenis Kesalahan: Seksyen 16(4) – Perakuan Pendaftaran Kadar Tawaran Kompaun: RM 10 000 .00\n\t\t\tJun 26, 2024\t\t\n\t\t\t\tAgensi\
    \ pelancongan berstatus Sdn. Bhd.\t\t\t\nTahun: 2018 Sektor: Pelancongan dan Hospitaliti Jenis Kesalahan: Seksyen 16(4) – Perakuan Pendaftaran Kadar Tawaran Kompaun: RM 10 000 .00\n\t\t\tJun 26, 2024\t\
    \t\nLihat Semua\nAras 8, Galeria PjH, Jalan P4W, Persiaran Perdana,\nPresint 4, Pusat Pentadbiran Kerajaan Persekutuan\n62100 Putrajaya, Malaysia. \nTel : \n03-7456 3888 (Pusat Panggilan JPDP)\nTel \n\
    : 03-8000 8000 (MyGCC)\nEmel \n: aduan(at)pdp.gov.my\nLaman ini sesuai dipapar menggunakan pelayar web Google Chrome \nPaparan Terbaik pada resolusi tinggi 1920×1080\nPengenalan\nApakah PPDP?\nPesuruhjaya\
