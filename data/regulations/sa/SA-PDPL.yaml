    The Controller shall respond to the requests of the data subject pertaining to their rights under the

    PDPL within a period not exceeding thirty (30) days and without delay. This period may be

    extended by the Controller in case the response requires disproportionate effort, or if the Controller

    receives multiple requests from the data subject, provided that the extension does not exceed an

    additional (30) days and the data subject is notified in advance of the extension with the reasons for

    the delay.

    In order to effectively respond to the above rights, a Controller should have in place, for instance, the

    following:

    • a policy and procedure on responding to the rights of data subjects;

    • a form for raising data subject requests (this could be for various channels);

    • dedicated and trained data privacy team that can effectively respond to the rights of data

    subjects;

    • technology tools that the data privacy team can use to respond to the requests of data subjects.

