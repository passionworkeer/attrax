    PwC | KSA Personal Data Protection Law Series 6

    C. What are the key obligations of a Processor?

    • To process personal data for the Controller based on a data processing agreement.

    • To comply with instructions of the Controller regarding the personal data processing.

    • To assist the Controller by implementing appropriate organisational, administrative and technical

    measures to protect personal data that it is processing for the Controller.

    • Before a Processor engages with any sub-processor for the processing, to ensure the following:

    – the contracts with sub-processors will not impact the level of protection provided to the

    personal data being processed;

    – the sub-processors will provide sufficient guarantees to comply with the PDPL and the

    Regulations; and

    – the Processor shall notify the Controller on engaging a sub-processor and the Controller shall

    have the right to object to such engagement within a timeframe agreed upon between the

    Controller and the Processor.

