    Lawful bases for disclosure of personal

    data

    In addition to having a lawful basis for processing, a separate lawful basis is required when a

    Controller discloses personal data (e.g. disclosure of personal data to another legal entity – including

    within the same group).

    Lawful bases for disclosure8 of personal data

    (Art. 15 of the PDPL)

    • Consent – data subject has given consent to disclosure of his or her personal data.

    • Publicly available data – personal data has been collected from a publicly available source.

    • Public interest or security purposes – the entity requesting disclosure is a public entity, and

    the collection or processing of the personal data is required for public interest or security

    purposes, or to implement another law, to fulfill judicial requirements.

    • Public health and safety – the disclosure is necessary to protect public health, public safety, or

    to protect the lives or health of specific individuals.

    • Anonymised data – the disclosure will only involve subsequent Processing in a form that

    makes it impossible to directly or indirectly identify the data subject.

    • Legitimate interest – the disclosure is necessary to achieve legitimate interests of the

    Controller, without prejudice to the rights and interests of the data subject, and provided that no

    sensitive data is to be processed.

    8 Please note that in any case the Controller must comply with the restrictions on the disclosure, as they are specified in

    Art. 16 of the PDPL.

    PwC | KSA Personal Data Protection Law Series 10

    Rights of data subjects

    The PDPL provides individuals with certain rights regarding processing of their personal data. The

    Controller must enable individuals to effectively exercise all such rights.

