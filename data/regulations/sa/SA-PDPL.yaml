    • only collect and process personal data to fulfill a legitimate purpose, which is

    specified in the RoPA, and not process personal data beyond such a purpose.

    Data minimisation Entity must only collect and process the minimum amount of personal data that is

    relevant, necessary, and adequate to fulfill the purposes for which it is processed.

    Entity must process personal data no longer than is necessary for the purposes for

