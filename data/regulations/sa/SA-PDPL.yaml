    processing

    The Controller must ensure that it processes personal data only if having an appropriate lawful basis

    (ground) for such processing. The PDPL provides for several sets of lawful bases that should be

    used depending on particular circumstances of processing.

    General lawful bases Lawful bases for (i) collection of personal

