    Principles of personal data

    processing

    Although the PDPL does not explicitly list any data protection principles, such principles are

    embedded in the PDPL’s provisions. Understanding these principles helps to understand many of the

    requirements of the PDPL.

    Principle Description of the principle

    Entity must:

    Lawfulness, fairness • ensure that it processes and discloses personal data only after having an

    and transparency appropriate lawful basis for such processing;

    • process personal data only in ways that data subject would reasonably expect;

    • be open and clear towards data subjects when processing personal data.

    Entity must:

    • have a specific purpose for processing the personal data, which must be

