  text: 'Kingdom of Saudi Arabia

    Personal Data Protection

    Law Series

    Part 1 - Summary of the Personal Data Protection Law

    Introduction

    This “Kingdom of Saudi Arabia Personal Data Protection Law Series” addresses the following

    three aspects:

    Part 1: A summary of the Part 2: A summary of the Part 3: A step-by-step guide

    Personal Data Protection Implementing Regulation to personal data transfers

    Law (“PDPL”) of the PDPL outside of the Kingdom of

    (“Implementing Saudi Arabia, based on the

    Regulation”) Regulation on Personal Data

    Transfer outside the Kingdom

    (“Data Transfer

    Regulation”)1

    On 14 September 2023, the PDPL came into force in the

    Kingdom of Saudi Arabia (“KSA”). The PDPL is the main law in

    KSA regulating the use of personal data. From 14 September

    2023, entities have one year to achieve compliance with the

    PDPL and Regulations, which will all become fully enforceable

    from 14 September 2024.

    All public and private entities must comply with the PDPL

    and Regulations.

    The Saudi Authority for Data and Artificial Intelligence

    (“SDAIA”) is the Competent Authority that shall supervise the

    implementation of the PDPL and Regulations. The Competent

    Authority may request documents or information from entities

    to check their compliance.

    The PDPL provides fines (up to SAR 5,000,000) for breach of

    its provisions and provisions of Regulations. The competent

    court may double the amount of the fine for data breaches in

    case of repetitive violations. The PDPL also provides for

    imprisonment (up to two years) for disclosure or publication of

    sensitive data (done in violation of the PDPL) with the intention

    to harm an individual or to achieve personal gain.

    In this part 1 of our series, we look at the core concepts

    of the PDPL and what these will mean for the entities

    doing business in the KSA.

    1 In our series we refer jointly to Implementing Regulation and to Data Transfer

    Regulation as “Regulations”.

