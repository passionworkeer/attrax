    Roles and obligations of an entity under

    the PDPL

    A. What are the roles that an entity can assume under the PDPL?

    The PDPL provides for two roles for an entity in respect of the processing of personal data – a

    Controller and a Processor.

    A Controller is an entity that makes decisions A Processor is an entity that processes

    about the purposes and ways of the processing personal data on behalf of a Controller. As

    of personal data. The Controller is ultimately opposed to the Controller, the Processor does

    responsible for the processing under the not make decisions about the purposes and

    PDPL. ways of personal data processing and instead

    takes direction from the Controller.

    PwC | KSA Personal Data Protection Law Series 5

    B. What are the key obligations of a Controller?

    • To define the purpose of the processing of personal data.

    • To ensure that there is a suitable lawful basis for the processing of personal data (e.g., consent,

    legal obligation, legitimate interest, etc.).

    • To ensure that personal data is processed pursuant to the principles of personal data processing

    (for example storage limitation, see further Principles of personal data processing).

    • To notify data subjects6 on how their personal data is processed (for example, via a privacy

    notice).

    • To enable data subjects to exercise their rights under the PDPL.

    • To maintain records of processing activities register (“RoPA”) for all processing of personal data

    across the entity.

    • To conduct impact assessments of personal data processing (for example, Data Protection

    Impact Assessment; Data Transfer Impact Assessment or Legitimate Interest Assessment).

    • To ensure lawful cross-border transfers of personal data outside the KSA.

    • To implement all the necessary organisational, administrative and technical measures to protect

    personal data.

    • To cooperate only with those Processors that provide necessary guarantees to implement the

    provisions of the PDPL and the Regulations, to enter into data processing agreements with

    Processors, and to monitor compliance of Processors with such agreements.

    • To notify any changes in personal data to entities to which the personal data was transferred.

    • To notify the Competent Authority and data subjects of personal data breaches.

    • To appoint a Data Protection Officer, where required by the Implementing Regulation7.

    • To comply with requirements of the PDPL and Implementing Regulation to specific types of

    processing activities, for example:

    – processing of health data and credit data;

    – processing of personal data for sending advertising or awareness-raising materials;

    – processing of personal data for scientific, research, or statistical purposes;

    – disclosure of personal data;'
