- id: art-2
  title: Select your industry
  text: "Select your industry\nFood & Food Packaging\nBodycare Fashion & Accessories\nElectrical & Electronic Products\nGifts & Premiums\nHomeware & Gardenware\nIndustrial Construction & Mechanical Items\n\
    Printing & Packaging\nTextile Apparel Footwear & Accessories\nToys & Recreational Items\nEyewear\nTechnical Parts\nLife Sciences\nYour question is about...\nOur services (prices, locations, products...)\n\
    The QIMA website\nA current Order with QIMA\nA job application\nOther\nReceive supply chain insights and updates from QIMA. You can always unsubscribe and manage your email preferences later.\nContact\
    \ Us\nBy contacting QIMA you agree to our \nprivacy policy\n and \nterms and conditions\n.\nQIMA: A SASO-Approved Conformity Assessment Body\nQIMA is one of the SASO approved Conformity Assessment Bodies\
    \ (CB) and is authorized to issue Certificates of Conformity for products exporting from the following regions:\nAsia and Australia, see our approved product scope\nEurope,   see our approved product\
    \ scope\nAmericas (North and South)\n,\n see our approved product scope\nMiddle East and North African countries\n, \nsee our approved product scope\nMiddle and South Africa region, see our approved\
    \ product scope\nAdditionally, QIMA has received accreditation from the Saudi Accreditation Center (SAAC) for \nISO/IEC 17065:2012\n, encompassing the SASO and SFDA scopes for the Middle East region.\n\
    SABER System\nSABER is a platform that allows importers and local manufacturers to electronically obtain the required Certificate of Conformity and Certificate of Shipment Conformity for consumer goods,\
    \ whether they were imported or locally manufactured to enter the Saudi market. The platform aims to protect the businesses from fraud and ensure that products are free from defects that may affect\
    \ the health and safety of consumers.\nImporters and local manufacturers can request a Certificate of Conformity (both Product and Shipment Certificates of Conformity) for their products easily through\
    \ SABER.\nThe mechanism of the SABER system is divided into 3 steps as below.\n*Risk level of product\nThe risk level of a product is assigned by the system based on the supplied HS code and product\
    \ category. Those items that are not regulated by any Saudi Arabian technical regulations are classified as low-risk items. \nProduct Registration\nThe importer inputs details of the product into SABER\n\
    The SABER system verifies if the product is regulated or not based on HS code or product category\nType Approval Certificate (Product Certificate of Conformity)\nScope: Products that are regulated by\
    \ Saudi Arabia TR. Click \nhere\n for a list of technical regulations. \nFor products not regulated by Saudi Arabia TR, self-declaration according to the approved forms by SASO is sufficient – , Type\
    \ Approval Certificates are not needed\n.\nValidity: One year\nRequired documents:\nConformity documents such as test reports, quality certificates, risk assessment reports, inspection report etc.,\
    \ if applicable\nDesign, dimensions, plans, specification photo of the products, if applicable\nThe Type Approval Certificate will be issued through the SABER system after compliance to relevant standards\
    \ is proven and after approval by SASO Approved Conformity Assessment Body.\nShipment Certificate of Conformity\nScope: All products\nValidity: Per consignment\nRequired documents:\nType Approval Certificate\
    \ or self-declaration\nShipment document, such as invoice, packing list etc.\nA Shipment Certificate is required for each consignment. Issuance of Shipment Certificates for shipments of non-regulated\
    \ products and regulated products are done through SABER.\nOn July 1, 2020 the SABER platform was linked with the FASAH system. This integration ensures the automatic verification of Shipment Certificates\
    \ – there is no need to print a Shipment Certificate of Conformity (SCoC) as it will automatically be in the FASAH system. Any shipment to Saudi Arabia that does not have an SCoC will be required to\
    \ be re-exported.\nSASO Approved Technical Regulations"
- id: art-3
  title: QIMA is able to approve Product Certificates of Conformity f
  text: "QIMA is able to approve Product Certificates of Conformity for a number of product categories. The table below contains details on these SASO approved Technical Regulations, their scope and type\
    \ of approval.\nA note on approval types:\n Approval types 1a, 3 and 5 refer to the assessment types defined in ISO/IEC 17067. Different conformity assessment activities are required for each type as\
    \ applicable:\nType 1a: \nProduct testing / inspection\nType 3: \nProduct testing / factory inspection / audit\nType 5: \nProduct testing / factory inspection / surveillance factory audit\n*Textile\
    \ Products & Auto Spare Parts are subject to a Categorized Conformity Assessment which enables similar products to be grouped together covered by a single PCoC. This effectively reduces the number of\
    \ PCoCs required for importing products into Saudi Arabia and streamlines the certification process.\nFor a full list of SASO approved Technical Regulations, \nclick here\n.\nPlease note the following:\n\
    QIMA will stop issuing any SASO CoC for regulated products under the remaining technical regulations (TR) from the SABER system / SABER CoC program starting on 15/01/2020.\nQIMA will issue only the\
    \ PCoCs for regulated products from the SABER platform.\nAll traders shall obtain the shipment certificate for all non-regulated products via the ​SABER platform.\nStarting from 15/02/2020, no shipment\
    \ will enter Saudi Arabia unless it has the required certifications via SABER only.\nStarting from 01/01/2025 : ALL Shipments need to have SABER Shipment COC (Regulated and Non-Regulated) and no undertaking\
    \ will be allowed at Saudi Customs. \nNeed more information?\nSelect your country\nAfghanistan\nAlbania\nAlgeria\nAmerican Samoa\nAndorra\nAngola\nAnguilla (UK)\nAntarctica\nAntigua And Barbuda\nArgentina\n\
