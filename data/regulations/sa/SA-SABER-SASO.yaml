  title: Certificate of Conformity for Exports to Saudi Arabia | QIMA
  text: "Certificate of Conformity for Exports to Saudi Arabia | QIMA\nSASO Certification \nGet your products certified and ready for export to Saudi Arabia. \n Download our Handbook Guide \nConsumer Products\n\
    Certifications\nCertificate of Conformity for Exports to Saudi Arabia\nSASO Compliance: Streamlined Certification with SABER and FASAH\n The Saudi Standards, Metrology and Quality Organization (SASO)\
    \ oversees the Saudi Product Safety Program, \nSALEEM\n, ensuring products entering the Saudi market are safe, secure, and free from defects that could harm consumers or the environment. The \nSABER\n\
    \ platform, fully integrated with the \nFASAH\n system since July 2020, simplifies the certification process by enabling automatic verification of Shipment Certificates of Conformity (SCoC), facilitating\
    \ smooth and efficient customs clearance.\nKey Updates:\nEffective January 1, 2025:\n All shipments to Saudi Arabia require both a Product Certificate of Conformity (PCoC) and an SCoC issued through\
    \ the SABER platform. Letters of Undertaking are no longer accepted for customs clearance, and obtaining certificates post-arrival is considered a violation, risking shipment re-export.\nEffective September\
    \ 15, 2025:\n New list of HS CODE Added which requires importers to provide a declaration approved by the Ministry of Industry and Mineral Resources when requesting SCoCs via SABER, enhancing compliance\
    \ with technical regulations.\nImporters of regulated products must register via SABER to obtain Product Certificates of Conformity, ensuring compliance with SASO’s Technical Regulations (TRs). All\
    \ consignments (regulated and non-regulated) require SABER Shipment certificates for smooth customs clearance at Saudi ports.\nNeed more information?\nSelect your country\nAfghanistan\nAlbania\nAlgeria\n\
    American Samoa\nAndorra\nAngola\nAnguilla (UK)\nAntarctica\nAntigua And Barbuda\nArgentina\nArmenia\nAruba\nAustralia\nAustria\nAzerbaijan\nBahamas\nBahrain\nBangladesh\nBarbados\nBarbuda\nBelgium\n\
