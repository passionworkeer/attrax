- id: art-1
  title: Saudi Arabia Testing, Inspection and Certification
  text: "Saudi Arabia Testing, Inspection and Certification\n      Skip to main content\nOfficial Website of the United States government.   \nHere’s how you know\nOfficial websites use .gov\nA \n.gov\n\
    \ website belongs to an official government organization in the United States.\nSecure .gov websites use HTTPS\nA \nlock\n ( \n) or \nhttps://\n means you’ve safely connected to the .gov website. Share\
    \ sensitive information only on official, secure websites.\nSearch ITA\nSearch\nMenu\n        Saudi Arabia Testing, Inspection, and Certification\n        An electronic certification and conformity\
    \ assessment is mandatory for all imported goods entering Saudi Arabia.  \nSaudi Arabia Testing, Inspection and Certification\nSASO (Saudi Standards, Metrology and Quality Organization) is introducing\
    \ SALEEM SABER, an electronic certification and conformity assessment system that will be mandatory for all imported goods entering Saudi Arabia by December 2018.  With nearly $20 billion in U.S. annual\
    \ exports to the Kingdom, it is critical that U.S. exporters are aware of how to use this new system, so goods can easily enter the Saudi market.\nReferred to simply as Saber, the system is an online\
    \ verification tool which connects importers, SASO-approved certification bodies, and Saudi customs & related trade authorities in one online system. Saudi Arabia’s purpose for initiating this program\
    \ is to accelerate the clearance of the upcoming shipments, reduce counterfeit consumer products, more easily track products, and raise the number of SASO-standard-conforming products in the Saudi market.\
    \ Saber replaces the current certificate of conformity and pre-shipment inspection requirements.\nSaber works like an online portal and covers both regulated and unregulated products. To submit a regulated\
    \ product for importation, the importer will have to initiate the certification request by first, registering their product into the Saber system by entering the product details; then, selecting the\
    \ product’s classification; next, have a SASO-approved certification body assigned to the product for conformity assessment; and finally, await an approval certificate. If the product receives its approval\
    \ certificate (which is a Certificate of Conformity), the importer is then issued a shipment certificate, and is sent to Saudi customs before the product can enter the market. The entire process is\
    \ done online through the Saber system.\nFor unregulated products, the importer must simply self-declare the product or products to be imported into the Saudi market. To self-declare a product, the\
    \ importer must enter the product details into Saber, attach technical files and documents, and then be issued a Requester Declaration (SDoC). The importer is then allowed to receive a shipment certificate,\
    \ their product is sent to customs and then may enter the market.\nSaber will have an initial launch for all traders inside Saudi Arabia in July 2018. From July to December, Saudi customs will give\
    \ priority to products that went through the Saber process. After December, customs will only give clearance to products logged through Saber. All products going through the Saber system must comply\
    \ with SASO’s Technical Regulations.\nSASO has stated there will be a soft launch of Saber in July and it will be mandatory starting from December 2018. The website for SALEEM SABER is \nhttps://saber.sa/\n\
    ×\nGlobal Business Navigator Chatbot \nBeta"
- id: art-2
  title: Welcome to the Global Business Navigator, an artificial inte
  text: "Welcome to the Global Business Navigator, an artificial intelligence (AI) Chatbot from the International Trade Administration (ITA). This tool, currently in beta version testing, is designed to\
    \ provide general information on the exporting process and the resources available to assist new and experienced U.S. exporters. The Chatbot, developed using Microsoft’s Azure AI services, is trained\
    \ on ITA’s export-related content and aims to quickly get users the information they need. The Chatbot is intended to make the benefits of exporting more accessible by understanding non-expert language,\
    \ idiomatic expressions, and foreign languages.\nLimitations\nAs a beta product, the Chatbot is currently being tested and its responses may occasionally produce inaccurate or incomplete information.\
    \ The Chatbot is trained to decline out of scope or inappropriate requests. The Chatbot’s knowledge is limited to the public information on the \nExport Solutions\n web pages of Trade.gov, which covers\
    \ a wide range of topics on exporting. While it cannot provide responses specific to a company’s product or a specific foreign market, its reference pages will guide you to other relevant government\
    \ resources and market research. Always double-check the Chatbot’s responses using the provided references or by visiting the \nExport Solutions\n web pages on Trade.gov. Do not use its responses as\
    \ legal or professional advice. Inaccurate advice from the Chatbot would not be a defense to violating any export rules or regulations.\nPrivacy\nThe Chatbot does not collect information about users\
    \ and does not use the contents of users’ chat history to learn new information. All feedback is anonymous. Please do not enter personally identifiable information (PII), sensitive, or proprietary information\
    \ into the Chatbot. Your conversations will not be connected to other interactions or accounts with ITA. Conversations with the Chatbot may be reviewed to help ITA improve the tool and address harmful,\
    \ illegal, or otherwise inappropriate questions.\nTranslation\nThe Chatbot supports a wide range of languages. Because the Chatbot is trained in English and responses are translated, you should verify\
    \ the translation. For example, the Chatbot may have difficulty with acronyms, abbreviations, and nuances in a language other than English.\nPrivacy Program\n | \nInformation Quality Guidelines\n |\
    \ \nAccessibility\nInternational Trade Administration\nU.S. Department of Commerce\n1401 Constitution Ave NW\nWashington, DC 20230\nConnect With ITA\nTwitter\nFacebook\nYouTube\nLinkedIn\nThe \nInternational\
    \ Trade Administration\n, \nU.S. Department of Commerce\n,\n manages this global trade site to provide access to ITA information on promoting trade and investment, strengthening the competitiveness\
    \ of U.S. industry, and ensuring fair trade and compliance with trade laws and agreements. External links to other Internet sites should not be construed as an endorsement of the views or privacy policies\
    \ contained therein. This site contains PDF documents. A \nPDF reader\n is available from Adobe Systems Incorporated.\nUSA.gov\n | \nFOIA\n | \nPrivacy Program\n | \nDisclaimer\n | \nInformation Quality\
    \ Guidelines\n | \nAccessibility\n×\nGlobal Business Navigator Chatbot \nBeta\nWelcome to the Global Business Navigator, an artificial intelligence (AI) Chatbot from the International Trade Administration\
    \ (ITA). This tool, currently in beta version testing, is designed to provide general information on the exporting process and the resources available to assist new and experienced U.S. exporters. The\
    \ Chatbot, developed using Microsoft’s Azure AI services, is trained on ITA’s export-related content and aims to quickly get users the information they need. The Chatbot is intended to make the benefits\
    \ of exporting more accessible by understanding non-expert language, idiomatic expressions, and foreign languages.\nLimitations"
