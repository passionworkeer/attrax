- id: art-1
  title: Ein Service des Bundesministerium der Justiz und für Verbrau
  text: 'Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    1

    Gesetz zum Schutz vor gefährlichen Stoffen (Chemikaliengesetz -

    ChemG)

    ChemG

    Ausfertigungsdatum: 16.09.1980

    Vollzitat:

    "Chemikaliengesetz in der Fassung der Bekanntmachung vom 28. August 2013 (BGBl. I S. 3498, 3991), das

    zuletzt durch Artikel 1 des Gesetzes vom 29. März 2026 (BGBl. 2026 I Nr. 86) geändert worden ist"

    Stand: Neugefasst durch Bek. v. 28.8.2013 I 3498, 3991;

    zuletzt geändert durch Art. 1 G v. 29.3.2026 I Nr. 86

    1 Das Gesetz dient der Umsetzung folgender Richtlinien:

    – Richtlinie 67/548/EWG des Rates vom 27. Juni 1967 zur Angleichung der Rechts- und

    Verwaltungsvorschriften für die Einstufung, Verpackung und Kennzeichnung gefährlicher Stoffe

    (ABl. EG Nr. 196 S. 1), die zuletzt durch die Richtlinie 2013/21/EU (ABl. L 158 vom 10.6.2013, S.

    240) geändert worden ist,

    – Richtlinie 98/24/EG des Rates vom 7. April 1998 zum Schutz von Gesundheit und Sicherheit

    der Arbeitnehmer vor der Gefährdung durch chemische Arbeitsstoffe bei der Arbeit (vierzehnte

    Einzelrichtlinie im Sinne des Artikels 16 Absatz 1 der Richtlinie 89/391/EWG) (ABl. EG Nr. L 131

    S. 11), die zuletzt durch die Richtlinie 2009/148/EG (ABl. L 330 vom 16.12.2009, S. 28) geändert

    worden ist,

    – Richtlinie 1999/45/EG des Europäischen Parlaments und des Rates vom 31. Mai 1999 zur

    Angleichung der Rechts- und Verwaltungsvorschriften der Mitgliedstaaten für die Einstufung,

    Verpackung und Kennzeichnung gefährlicher Zubereitungen (ABl. EG Nr. L 200 S. 1, 2002 Nr. L 6

    S. 71), die zuletzt durch die Richtlinie 2013/21/EU (ABl. L 158 vom 10.6.2013, S. 240) geändert

    worden ist,

    – Richtlinie 2004/9/EG des Europäischen Parlaments und des Rates vom 11. Februar 2004 über

    die Inspektion und Überprüfung der Guten Laborpraxis (GLP) (kodifizierte Fassung) (ABl. EU Nr. L

    50 S. 28), die zuletzt durch die Verordnung (EG) Nr. 219/2009 (ABl. L 87 vom 31.3.2009, S. 109)

    geändert worden ist, und

    – Richtlinie 2004/10/EG des Europäischen Parlaments und des Rates vom 11. Februar 2004 zur

    Angleichung der Rechts- und Verwaltungsvorschriften für die Anwendung der Grundsätze der

    Guten Laborpraxis und zur Kontrolle ihrer Anwendung bei Versuchen mit chemischen Stoffen

    (kodifizierte Fassung) (ABl. EU Nr. L 50 S. 44), die zuletzt durch die Verordnung (EG) Nr. 219/2009

    (ABl. L 87 vom 31.3.2009, S. 109) geändert worden ist.

    Fußnote

