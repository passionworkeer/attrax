- id: art-1
  title: Ein Service des Bundesministerium der Justiz und für Verbrau
  text: 'Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Gesetz zur Durchführung der Verordnung (EU) 2025/40 betreffend

    2

    Verpackungen (Verpackungsrecht-Durchführungsgesetz -

    VerpackDG)

    VerpackDG

    Ausfertigungsdatum: 13.07.2026

    Vollzitat:

    "Verpackungsrecht-Durchführungsgesetz vom 13. Juli 2026 (BGBl. 2026 I Nr. 207), das durch Artikel 4 des

    Gesetzes vom 13. Juli 2026 (BGBl. 2026 I Nr. 207) geändert worden ist"

    Hinweis: Änderung durch Art. 4 G v. 13.7.2026 I Nr. 207 textlich nachgewiesen, dokumentarisch noch nicht

    abschließend bearbeitet

    2 Dieses Gesetz dient auch der Umsetzung der

    – Richtlinie 2008/98/EG des Europäischen Parlaments und des Rates vom 19. November 2008 über

    Abfälle und zur Aufhebung bestimmter Richtlinien (ABl. L 312 vom 22.11.2008, S. 3; L 127 vom

    26.5.2009, S. 24; L 297 vom 13.11.2015, S. 9; L 42 vom 18.2.2017, S. 43; L, 2024/90243 vom

    17.4.2024, S. 1), die zuletzt durch die Richtlinie (EU) 2025/1892 vom 10. September 2025 (ABl. L,

    2025/1892, 26.9.2025) geändert worden ist,

    – Richtlinie (EU) 2019/904 des Europäischen Parlaments und des Rates vom 5. Juni 2019 über die

    Verringerung der Auswirkungen bestimmter Kunststoffprodukte auf die Umwelt (ABl. L 155 vom

    12.6.2019, S. 1; L, 2025/90573, 4.7.2025), die zuletzt durch die Verordnung (EU) 2025/40 vom 19.

    Dezember 2024 (ABl. L, 2025/40, 22.1.2025) geändert worden ist.

    Fußnote

    (+++ Nachgewiesener Text dokumentarisch noch nicht bearbeitet +++)

    (+++ Amtlicher Hinweis des Normgebers auf EG-Recht:

    Durchführung der

    EUV 2025/40 (CELEX Nr: 32025L0040)

    Umsetzung der

    EGRL 98/2008 (CELEX Nr: 32008L0098)

    EURL 2019/904 (CELEX Nr: 32019L0904) +++)

    Das G wurde als Artikel 1 des G v. 13.7.2026 I Nr. 207 vom Bundestag beschlossen. Es tritt gem. Art. 8 Abs. 7

    dieses G am 12.8.2026 in Kraft.

