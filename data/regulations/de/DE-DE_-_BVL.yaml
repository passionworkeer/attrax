  title: BVL  -  Startseite
  text: "BVL  -  Startseite\nWebseite des Bundesamts für Verbraucherschutz und Lebensmittelsicherheit\nMenü\nSuche\nAktuelle Meldungen\nAndrii Zastrozhnov - stock.adobe.com\nCereulid in Säuglingsnahrung\
    \ zeigt Bedeutung des Schnellwarnsystems\nBVL veröffentlicht aktuellen Bericht zum RASFF\nMehr erfahren\nTorpix - stock.adobe.com\nEinnahme von Lithium nur unter ärztlicher Aufsicht\nLithiumhaltige\
    \ Nahrungsergänzungsmittel sind verboten\nMehr erfahren\nMehr Übersicht bei Rückrufen in der App lebensmittelwarnung.de\nNeue Funktionen können ab sofort per Update installiert werden\nMehr erfahren\n\
    Themen im Fokus\nPilzsaison: Sicher sammeln und genießen\nWildpilze bereichern den Speiseplan – doch bei der Auswahl und Verwendung ist Vorsicht geboten\n18.09.2026\nAnna - stock.adobe.com\nRegelungen\
    \ zum Reisen mit Hunden, Katzen und Frettchen\nSeit dem 22. April 2026 gelten strengere EU-Regeln für Reisen mit Hunden, Katzen und Frettchen. Sie verbessern die Kontrolle und Rückverfolgbarkeit, um\
    \ illegalen Handel zu verhindern. Bei Besitzerwechsel oder Verkauf gelten die EU-Handelsbedingungen.\n03.09.2026\npinuu - pixabay.com\nVorsicht vor illegalen Unkrautvernichtern im Internet\nNicht zugelassene\
    \ Pflanzenschutzmittel werden online als wirksame Unkrautvernichter beworben.\n28.08.2026\nmomius/Fotolia\n                                Weitere Themen im Fokus\nAktuelle Pressemitteilungen\nKategorie\
    \ der Nachricht: \nPressemitteilung\nDatum: \n17.09.2026\nCereulid in Säuglingsnahrung zeigt Bedeutung des Schnellwarnsystems\nBVL\n veröffentlicht aktuellen Bericht zum \nRASFF\nÜber das Europäische\
    \ Schnellwarnsystem für Lebens- und Futtermittel (\nRASFF\n) wurden im Jahr 2025 erneut mehr als 5.300 Original- und rund 18.000 Folgemeldungen übermittelt. Die Cereulid-Kontamination in Säuglingsnahrung,\
    \ die im Dezember 2025 …\nWeiterlesen\nKategorie der Nachricht: \nPressemitteilung\nDatum: \n31.08.2026\nEinnahme von Lithium nur unter ärztlicher Aufsicht\nLithiumhaltige Nahrungsergänzungsmittel sind\
    \ verboten\n„Neuronale Gesundheit“, „mentale Klarheit“, „innere Ruhe“ oder „kraftvolle kognitive Präsenz“: mit solchen oder ähnlichen Wirkversprechen werden als Nahrungsergänzungsmittel angebotene lithiumhaltige\
    \ Erzeugnisse im Onlinehandel beworben. Allerdings …\nWeiterlesen\n                                Alle Pressemitteilungen\nViele Themen, ein Ziel\nSichere Lebensmittel und der Schutz Ihrer Gesundheit\
    \ - als Verbraucherin und Verbraucher! Dafür erfüllen wir ein breites Spektrum an Aufgaben in den Bereichen…\nLebensmittel\nFuttermittel\nVerbraucherprodukte\nPflanzenschutzmittel\nTierarzneimittel\n\
