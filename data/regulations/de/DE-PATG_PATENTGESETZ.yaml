- id: art-31
  title: § 24
  text: '§ 24

    (1) Die nicht ausschließliche Befugnis zur gewerblichen Benutzung einer Erfindung wird durch das Patentgericht

    im Einzelfall nach Maßgabe der nachfolgenden Vorschriften erteilt (Zwangslizenz), sofern

