    Das Patent'
- id: art-2
  title: § 1
  text: '§ 1

    (1) Patente werden für Erfindungen auf allen Gebieten der Technik erteilt, sofern sie neu sind, auf einer

    erfinderischen Tätigkeit beruhen und gewerblich anwendbar sind.

    (2) Patente werden für Erfindungen im Sinne von Absatz 1 auch dann erteilt, wenn sie ein Erzeugnis, das aus

    biologischem Material besteht oder dieses enthält, oder wenn sie ein Verfahren, mit dem biologisches Material

    hergestellt oder bearbeitet wird oder bei dem es verwendet wird, zum Gegenstand haben. Biologisches Material,

    das mit Hilfe eines technischen Verfahrens aus seiner natürlichen Umgebung isoliert oder hergestellt wird, kann

    auch dann Gegenstand einer Erfindung sein, wenn es in der Natur schon vorhanden war.

    (3) Als Erfindungen im Sinne des Absatzes 1 werden insbesondere nicht angesehen:

    1. Entdeckungen sowie wissenschaftliche Theorien und mathematische Methoden;

    2. ästhetische Formschöpfungen;

    3. Pläne, Regeln und Verfahren für gedankliche Tätigkeiten, für Spiele oder für geschäftliche Tätigkeiten

    sowie Programme für Datenverarbeitungsanlagen;

    4. die Wiedergabe von Informationen.

    (4) Absatz 3 steht der Patentfähigkeit nur insoweit entgegen, als für die genannten Gegenstände oder Tätigkeiten

    als solche Schutz begehrt wird.'
- id: art-3
  title: § 1a
  text: '§ 1a

    (1) Der menschliche Körper in den einzelnen Phasen seiner Entstehung und Entwicklung, einschließlich der

    Keimzellen, sowie die bloße Entdeckung eines seiner Bestandteile, einschließlich der Sequenz oder Teilsequenz

    eines Gens, können keine patentierbaren Erfindungen sein.

    (2) Ein isolierter Bestandteil des menschlichen Körpers oder ein auf andere Weise durch ein technisches Verfahren

    gewonnener Bestandteil, einschließlich der Sequenz oder Teilsequenz eines Gens, kann eine patentierbare

    Erfindung sein, selbst wenn der Aufbau dieses Bestandteils mit dem Aufbau eines natürlichen Bestandteils

    identisch ist.

    (3) Die gewerbliche Anwendbarkeit einer Sequenz oder Teilsequenz eines Gens muss in der Anmeldung konkret

    unter Angabe der von der Sequenz oder Teilsequenz erfüllten Funktion beschrieben werden.

    (4) Ist Gegenstand der Erfindung eine Sequenz oder Teilsequenz eines Gens, deren Aufbau mit dem Aufbau einer

    natürlichen Sequenz oder Teilsequenz eines menschlichen Gens übereinstimmt, so ist deren Verwendung, für die

    die gewerbliche Anwendbarkeit nach Absatz 3 konkret beschrieben ist, in den Patentanspruch aufzunehmen.'
- id: art-4
  title: § 2
  text: '§ 2

    (1) Für Erfindungen, deren gewerbliche Verwertung gegen die öffentliche Ordnung oder die guten Sitten

    verstoßen würde, werden keine Patente erteilt; ein solcher Verstoß kann nicht allein aus der Tatsache hergeleitet

    werden, dass die Verwertung durch Gesetz oder Verwaltungsvorschrift verboten ist.

    (2) Insbesondere werden Patente nicht erteilt für

    1. Verfahren zum Klonen von menschlichen Lebewesen;

    2. Verfahren zur Veränderung der genetischen Identität der Keimbahn des menschlichen Lebewesens;

    3. die Verwendung von menschlichen Embryonen zu industriellen oder kommerziellen Zwecken;

    - Seite 2 von 48 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    4. Verfahren zur Veränderung der genetischen Identität von Tieren, die geeignet sind, Leiden dieser Tiere

    ohne wesentlichen medizinischen Nutzen für den Menschen oder das Tier zu verursachen, sowie die mit

    Hilfe solcher Verfahren erzeugten Tiere.

    Bei der Anwendung der Nummern 1 bis 3 sind die entsprechenden Vorschriften des Embryonenschutzgesetzes

    maßgeblich.'
- id: art-5
  title: § 2a
  text: '§ 2a

    (1) Patente werden nicht erteilt für

    1. Pflanzensorten und Tierrassen sowie im Wesentlichen biologische Verfahren zur Züchtung von Pflanzen

    und Tieren und die ausschließlich durch solche Verfahren gewonnenen Pflanzen und Tiere;

    2. Verfahren zur chirurgischen oder therapeutischen Behandlung des menschlichen oder tierischen Körpers

    und Diagnostizierverfahren, die am menschlichen oder tierischen Körper vorgenommen werden. Dies gilt

    nicht für Erzeugnisse, insbesondere Stoffe oder Stoffgemische, zur Anwendung in einem der vorstehend

    genannten Verfahren.

    (2) Patente können erteilt werden für Erfindungen,

    1. deren Gegenstand Pflanzen oder Tiere sind, wenn die Ausführung der Erfindung technisch nicht auf eine

    bestimmte Pflanzensorte oder Tierrasse beschränkt ist;

    2. die ein mikrobiologisches oder ein sonstiges technisches Verfahren oder ein durch ein solches Verfahren

    gewonnenes Erzeugnis zum Gegenstand haben, sofern es sich dabei nicht um eine Pflanzensorte oder

    Tierrasse handelt.'
- id: art-6
  title: § 1a Ab s. 3 gilt entsprechend.
  text: '§ 1a Ab s. 3 gilt entsprechend.

    (3) Im Sinne dieses Gesetzes bedeuten:

    1. "biologisches Material" ein Material, das genetische Informationen enthält und sich selbst reproduzieren

    oder in einem biologischen System reproduziert werden kann;

    2. "mikrobiologisches Verfahren" ein Verfahren, bei dem mikrobiologisches Material verwendet, ein Eingriff in

    mikrobiologisches Material durchgeführt oder mikrobiologisches Material hervorgebracht wird;

    3. "im Wesentlichen biologisches Verfahren" ein Verfahren zur Züchtung von Pflanzen oder Tieren, das

    vollständig auf natürlichen Phänomenen wie Kreuzung oder Selektion beruht;

    4. "Pflanzensorte" eine Sorte im Sinne der Definition der Verordnung (EG) Nr. 2100/94 des Rates vom 27. Juli

    1994 über den gemeinschaftlichen Sortenschutz (ABl. EG Nr. L 227 S. 1) in der jeweils geltenden Fassung.'
- id: art-7
  title: § 3
  text: '§ 3

    (1) Eine Erfindung gilt als neu, wenn sie nicht zum Stand der Technik gehört. Der Stand der Technik umfaßt alle

    Kenntnisse, die vor dem für den Zeitrang der Anmeldung maßgeblichen Tag durch schriftliche oder mündliche

    Beschreibung, durch Benutzung oder in sonstiger Weise der Öffentlichkeit zugänglich gemacht worden sind.

    (2) Als Stand der Technik gilt auch der Inhalt folgender Patentanmeldungen mit älterem Zeitrang, die erst an oder

    nach dem für den Zeitrang der jüngeren Anmeldung maßgeblichen Tag der Öffentlichkeit zugänglich gemacht

    worden sind:

    1. der nationalen Anmeldungen in der beim Deutschen Patent- und Markenamt ursprünglich eingereichten

    Fassung;

    2. der europäischen Anmeldungen in der bei der zuständigen Behörde ursprünglich eingereichten

    Fassung, wenn mit der Anmeldung für die Bundesrepublik Deutschland Schutz begehrt wird und die

    Benennungsgebühr für die Bundesrepublik Deutschland nach Artikel 79 Abs. 2 des Europäischen

    Patentübereinkommens gezahlt ist und, wenn es sich um eine Euro-PCT-Anmeldung (Artikel 153 Abs.

    2 des Europäischen Patentübereinkommens) handelt, die in Artikel 153 Abs. 5 des Europäischen

    Patentübereinkommens genannten Voraussetzungen erfüllt sind;

    3. der internationalen Anmeldungen nach dem Patentzusammenarbeitsvertrag in der beim Anmeldeamt

    ursprünglich eingereichten Fassung, wenn für die Anmeldung das Deutsche Patent- und Markenamt

    Bestimmungsamt ist.

    - Seite 3 von 48 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Beruht der ältere Zeitrang einer Anmeldung auf der Inanspruchnahme der Priorität einer Voranmeldung, so ist

    Satz 1 nur insoweit anzuwenden, als die danach maßgebliche Fassung nicht über die Fassung der Voranmeldung

    hinausgeht. Patentanmeldungen nach Satz 1 Nr. 1, für die eine Anordnung nach § 50 Abs. 1 oder Abs. 4 erlassen

    worden ist, gelten vom Ablauf des achtzehnten Monats nach ihrer Einreichung an als der Öffentlichkeit zugänglich

    gemacht.

    (3) Gehören Stoffe oder Stoffgemische zum Stand der Technik, so wird ihre Patentfähigkeit durch die Absätze

    1 und 2 nicht ausgeschlossen, sofern sie zur Anwendung in einem der in § 2a Abs. 1 Nr. 2 genannten Verfahren

    bestimmt sind und ihre Anwendung zu einem dieser Verfahren nicht zum Stand der Technik gehört.

    (4) Ebenso wenig wird die Patentfähigkeit der in Absatz 3 genannten Stoffe oder Stoffgemische zur spezifischen

    Anwendung in einem der in § 2a Abs. 1 Nr. 2 genannten Verfahren durch die Absätze 1 und 2 ausgeschlossen,

    wenn diese Anwendung nicht zum Stand der Technik gehört.

    (5) Für die Anwendung der Absätze 1 und 2 bleibt eine Offenbarung der Erfindung außer Betracht, wenn sie nicht

    früher als sechs Monate vor Einreichung der Anmeldung erfolgt ist und unmittelbar oder mittelbar zurückgeht

    1. auf einen offensichtlichen Mißbrauch zum Nachteil des Anmelders oder seines Rechtsvorgängers oder

    2. auf die Tatsache, daß der Anmelder oder sein Rechtsvorgänger die Erfindung auf amtlichen oder amtlich

    anerkannten Ausstellungen im Sinne des am 22. November 1928 in Paris unterzeichneten Abkommens

    über internationale Ausstellungen zur Schau gestellt hat.

    Satz 1 N r. 2 ist nur anzuwenden, wenn der Anmelder bei Einreichung der Anmeldung angibt, daß die Erfindung

    tatsächlich zur Schau gestellt worden ist und er innerhalb von vier Monaten nach der Einreichung hierüber eine

    Bescheinigung einreicht. Die in Satz 1 Nr. 2 bezeichneten Ausstellungen werden vom Bundesminister der Justiz

    und für Verbraucherschutz im Bundesanzeiger bekanntgemacht.'
- id: art-8
  title: § 4
  text: '§ 4

    Eine Erfindung gilt als auf einer erfinderischen Tätigkeit beruhend, wenn sie sich für den Fachmann nicht in

    naheliegender Weise aus dem Stand der Technik ergibt. Gehören zum Stand der Technik auch Unterlagen im

    Sinne des § 3 Abs. 2, so werden diese bei der Beurteilung der erfinderischen Tätigkeit nicht in Betracht gezogen.'
- id: art-9
  title: § 5
  text: '§ 5

    Eine Erfindung gilt als gewerblich anwendbar, wenn ihr Gegenstand auf irgendeinem gewerblichen Gebiet

    einschließlich der Landwirtschaft hergestellt oder benutzt werden kann.'
- id: art-10
  title: § 6
  text: '§ 6

    Das Recht auf das Patent hat der Erfinder oder sein Rechtsnachfolger. Haben mehrere gemeinsam eine Erfindung

    gemacht, so steht ihnen das Recht auf das Patent gemeinschaftlich zu. Haben mehrere die Erfindung unabhängig

    voneinander gemacht, so steht das Recht dem zu, der die Erfindung zuerst beim Deutschen Patent- und

    Markenamt angemeldet hat.'
- id: art-11
  title: § 7
  text: '§ 7

    (1) Damit die sachliche Prüfung der Patentanmeldung durch die Feststellung des Erfinders nicht verzögert wird,

    gilt im Verfahren vor dem Deutschen Patent- und Markenamt der Anmelder als berechtigt, die Erteilung des

    Patents zu verlangen.

    (2) Wird ein Patent auf Grund eines auf widerrechtliche Entnahme (§ 21 Abs. 1 Nr. 3) gestützten Einspruchs

    widerrufen oder führt der Einspruch zum Verzicht auf das Patent, so kann der Einsprechende innerhalb eines

    Monats nach der amtlichen Mitteilung hierüber die Erfindung selbst anmelden und die Priorität des früheren

    Patents in Anspruch nehmen.'
- id: art-12
  title: § 8
  text: '§ 8

    Der Berechtigte, dessen Erfindung von einem Nichtberechtigten angemeldet ist, oder der durch widerrechtliche

    Entnahme Verletzte kann vom Patentsucher verlangen, daß ihm der Anspruch auf Erteilung des Patents

    abgetreten wird. Hat die Anmeldung bereits zum Patent geführt, so kann er vom Patentinhaber die Übertragung

    des Patents verlangen. Der Anspruch kann vorbehaltlich der Sätze 4 und 5 nur innerhalb einer Frist von zwei

    Jahren nach der Veröffentlichung der Erteilung des Patents (§ 58 Abs. 1) durch Klage geltend gemacht werden.

    Hat der Verletzte Einspruch wegen widerrechtlicher Entnahme (§ 21 Abs. 1 Nr. 3) erhoben, so kann er die Klage

    - Seite 4 von 48 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    noch innerhalb eines Jahres nach rechtskräftigem Abschluß des Einspruchsverfahrens erheben. Die Sätze 3 und 4

    sind nicht anzuwenden, wenn der Patentinhaber beim Erwerb des Patents nicht in gutem Glauben war.'
- id: art-13
  title: § 9
  text: '§ 9

    Das Patent hat die Wirkung, dass allein der Patentinhaber befugt ist, die patentierte Erfindung im Rahmen des

    geltenden Rechts zu benutzen. Jedem Dritten ist es verboten, ohne seine Zustimmung

    1. ein Erzeugnis, das Gegenstand des Patents ist, herzustellen, anzubieten, in Verkehr zu bringen oder zu

    gebrauchen oder zu den genannten Zwecken entweder einzuführen oder zu besitzen;

    2. ein Verfahren, das Gegenstand des Patents ist, anzuwenden oder, wenn der Dritte weiß oder es auf Grund

    der Umstände offensichtlich ist, daß die Anwendung des Verfahrens ohne Zustimmung des Patentinhabers

    verboten ist, zur Anwendung im Geltungsbereich dieses Gesetzes anzubieten;

    3. das durch ein Verfahren, das Gegenstand des Patents ist, unmittelbar hergestellte Erzeugnis anzubieten,

    in Verkehr zu bringen oder zu gebrauchen oder zu den genannten Zwecken entweder einzuführen oder zu

    besitzen.'
- id: art-14
  title: § 9a
  text: '§ 9a

    (1) Betrifft das Patent biologisches Material, das auf Grund einer Erfindung mit bestimmten Eigenschaften

    ausgestattet ist, so erstrecken sich die Wirkungen von § 9 auf jedes biologische Material, das aus diesem

    biologischen Material durch generative oder vegetative Vermehrung in gleicher oder abweichender Form

    gewonnen wird und mit denselben Eigenschaften ausgestattet ist.

    (2) Betrifft das Patent ein Verfahren, das es ermöglicht, biologisches Material zu gewinnen, das auf Grund

    einer Erfindung mit bestimmten Eigenschaften ausgestattet ist, so erstrecken sich die Wirkungen von § 9

    auf das mit diesem Verfahren unmittelbar gewonnene biologische Material und jedes andere mit denselben

    Eigenschaften ausgestattete biologische Material, das durch generative oder vegetative Vermehrung in gleicher

    oder abweichender Form aus dem unmittelbar gewonnenen Material gewonnen wird.

    (3) Betrifft das Patent ein Erzeugnis, das auf Grund einer Erfindung aus einer genetischen Information besteht

    oder sie enthält, so erstrecken sich die Wirkungen von § 9 auf jedes Material, in das dieses Erzeugnis Eingang

    findet und in dem die genetische Information enthalten ist und ihre Funktion erfüllt. § 1a Abs. 1 bleibt unberührt.'
- id: art-15
  title: § 9b
  text: '§ 9b

    Bringt der Patentinhaber oder mit seiner Zustimmung ein Dritter biologisches Material, das auf Grund

    der Erfindung mit bestimmten Eigenschaften ausgestattet ist, im Hoheitsgebiet eines Mitgliedstaates der

    Europäischen Union oder in einem Vertragsstaat des Abkommens über den Europäischen Wirtschaftsraum in

    Verkehr und wird aus diesem biologischen Material durch generative oder vegetative Vermehrung weiteres

    biologisches Material gewonnen, so treten die Wirkungen von § 9 nicht ein, wenn die Vermehrung des

    biologischen Materials der Zweck war, zu dem es in den Verkehr gebracht wurde. Dies gilt nicht, wenn das

    auf diese Weise gewonnene Material anschließend für eine weitere generative oder vegetative Vermehrung

    verwendet wird.'
- id: art-16
  title: § 9c
  text: '§ 9c

    (1) Wird pflanzliches Vermehrungsmaterial durch den Patentinhaber oder mit dessen Zustimmung durch

    einen Dritten an einen Landwirt zum Zweck des landwirtschaftlichen Anbaus in Verkehr gebracht, so darf

    dieser entgegen den §§ 9, 9a und 9b Satz 2 sein Erntegut für die generative oder vegetative Vermehrung

    durch ihn selbst im eigenen Betrieb verwenden. Für Bedingungen und Ausmaß dieser Befugnis gelten Artikel

    14 der Verordnung (EG) Nr. 2100/94 in seiner jeweils geltenden Fassung sowie die auf dessen Grundlage

    erlassenen Durchführungsbestimmungen entsprechend. Soweit sich daraus Ansprüche des Patentinhabers

    ergeben, sind diese entsprechend den auf Grund Artikel 14 Abs. 3 der Verordnung (EG) Nr. 2100/94 erlassenen

    Durchführungsbestimmungen geltend zu machen.

    (2) Werden landwirtschaftliche Nutztiere oder tierisches Vermehrungsmaterial durch den Patentinhaber oder

    mit dessen Zustimmung durch einen Dritten an einen Landwirt in Verkehr gebracht, so darf der Landwirt

    die landwirtschaftlichen Nutztiere oder das tierische Vermehrungsmaterial entgegen den §§ 9, 9a und 9b

    Satz 2 zu landwirtschaftlichen Zwecken verwenden. Diese Befugnis erstreckt sich auch auf die Überlassung

    der landwirtschaftlichen Nutztiere oder anderen tierischen Vermehrungsmaterials zur Fortführung seiner

    - Seite 5 von 48 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    landwirtschaftlichen Tätigkeit, jedoch nicht auf den Verkauf mit dem Ziel oder im Rahmen einer Vermehrung zu

    Erwerbszwecken.

    (3) § 9a Abs. 1 bis 3 gilt nicht für biologisches Material, das im Bereich der Landwirtschaft zufällig oder technisch

    nicht vermeidbar gewonnen wurde. Daher kann ein Landwirt im Regelfall nicht in Anspruch genommen werden,

    wenn er nicht diesem Patentschutz unterliegendes Saat- oder Pflanzgut angebaut hat.'
- id: art-17
  title: § 10
  text: '§ 10

    (1) Das Patent hat ferner die Wirkung, daß es jedem Dritten verboten ist, ohne Zustimmung des Patentinhabers

    im Geltungsbereich dieses Gesetzes anderen als zur Benutzung der patentierten Erfindung berechtigten

    Personen Mittel, die sich auf ein wesentliches Element der Erfindung beziehen, zur Benutzung der Erfindung

    im Geltungsbereich dieses Gesetzes anzubieten oder zu liefern, wenn der Dritte weiß oder es auf Grund der

    Umstände offensichtlich ist, daß diese Mittel dazu geeignet und bestimmt sind, für die Benutzung der Erfindung

    verwendet zu werden.

    (2) Absatz 1 ist nicht anzuwenden, wenn es sich bei den Mitteln um allgemein im Handel erhältliche Erzeugnisse

    handelt, es sei denn, daß der Dritte den Belieferten bewußt veranlaßt, in einer nach § 9 Satz 2 verbotenen Weise

    zu handeln.

    (3) Personen, die die in § 11 Nr. 1 bis 3 genannten Handlungen vornehmen, gelten im Sinne des Absatzes 1 nicht

    als Personen, die zur Benutzung der Erfindung berechtigt sind.'
- id: art-18
  title: § 11
  text: '§ 11

    Die Wirkung des Patents erstreckt sich nicht auf

    1. Handlungen, die im privaten Bereich zu nichtgewerblichen Zwecken vorgenommen werden;

    2. Handlungen zu Versuchszwecken, die sich auf den Gegenstand der patentierten Erfindung beziehen;

    2a. die Nutzung biologischen Materials zum Zweck der Züchtung, Entdeckung und Entwicklung einer neuen

    Pflanzensorte;

    2b. Studien und Versuche und die sich daraus ergebenden praktischen Anforderungen, die für die Erlangung

    einer arzneimittelrechtlichen Genehmigung für das Inverkehrbringen in der Europäischen Union oder einer

    arzneimittelrechtlichen Zulassung in den Mitgliedstaaten der Europäischen Union oder in Drittstaaten

    erforderlich sind;

    3. die unmittelbare Einzelzubereitung von Arzneimitteln in Apotheken auf Grund ärztlicher Verordnung sowie

    auf Handlungen, welche die auf diese Weise zubereiteten Arzneimittel betreffen;

    4. den an Bord von Schiffen eines anderen Mitgliedstaates der Pariser Verbandsübereinkunft zum Schutz

    des gewerblichen Eigentums stattfindenden Gebrauch des Gegenstands der patentierten Erfindung im

    Schiffskörper, in den Maschinen, im Takelwerk, an den Geräten und sonstigem Zubehör, wenn die Schiffe

    vorübergehend oder zufällig in die Gewässer gelangen, auf die sich der Geltungsbereich dieses Gesetzes

    erstreckt, vorausgesetzt, daß dieser Gegenstand dort ausschließlich für die Bedürfnisse des Schiffes

    verwendet wird;

    5. den Gebrauch des Gegenstands der patentierten Erfindung in der Bauausführung oder für den Betrieb der

    Luft- oder Landfahrzeuge eines anderen Mitgliedstaates der Pariser Verbandsübereinkunft zum Schutz des

    gewerblichen Eigentums oder des Zubehörs solcher Fahrzeuge, wenn diese vorübergehend oder zufällig in

    den Geltungsbereich dieses Gesetzes gelangen;

    6. die in Artikel 27 des Abkommens vom 7. Dezember 1944 über die Internationale Zivilluftfahrt (BGBl. 1956

    II S. 411) vorgesehenen Handlungen, wenn diese Handlungen ein Luftfahrzeug eines anderen Staates

    betreffen, auf den dieser Artikel anzuwenden ist.'
- id: art-19
  title: § 12
  text: '§ 12

    (1) Die Wirkung des Patents tritt gegen den nicht ein, der zur Zeit der Anmeldung bereits im Inland die Erfindung

    in Benutzung genommen oder die dazu erforderlichen Veranstaltungen getroffen hatte. Dieser ist befugt, die

    Erfindung für die Bedürfnisse seines eigenen Betriebs in eigenen oder fremden Werkstätten auszunutzen. Die

    Befugnis kann nur zusammen mit dem Betrieb vererbt oder veräußert werden. Hat der Anmelder oder sein

    Rechtsvorgänger die Erfindung vor der Anmeldung anderen mitgeteilt und sich dabei seine Rechte für den Fall der

    - Seite 6 von 48 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Patenterteilung vorbehalten, so kann sich der, welcher die Erfindung infolge der Mitteilung erfahren hat, nicht auf

    Maßnahmen nach Satz 1 berufen, die er innerhalb von sechs Monaten nach der Mitteilung getroffen hat.

    (2) Steht dem Patentinhaber ein Prioritätsrecht zu, so ist an Stelle der in Absatz 1 bezeichneten Anmeldung die

    frühere Anmeldung maßgebend. Dies gilt jedoch nicht für Angehörige eines ausländischen Staates, der hierin

    keine Gegenseitigkeit verbürgt, soweit sie die Priorität einer ausländischen Anmeldung in Anspruch nehmen.'
- id: art-20
  title: § 13
  text: '§ 13

    (1) Die Wirkung des Patents tritt insoweit nicht ein, als die Bundesregierung anordnet, daß die Erfindung im

    Interesse der öffentlichen Wohlfahrt benutzt werden soll. Sie erstreckt sich ferner nicht auf eine Benutzung der

    Erfindung, die im Interesse der Sicherheit des Bundes von der zuständigen obersten Bundesbehörde oder in deren

    Auftrag von einer nachgeordneten Stelle angeordnet wird.

    (2) Für die Anfechtung einer Anordnung nach Absatz 1 ist das Bundesverwaltungsgericht zuständig, wenn sie von

    der Bundesregierung oder der zuständigen obersten Bundesbehörde getroffen ist.

    (3) Der Patentinhaber hat in den Fällen des Absatzes 1 gegen den Bund Anspruch auf angemessene Vergütung.

    Wegen deren Höhe steht im Streitfall der Rechtsweg vor den ordentlichen Gerichten offen. Eine Anordnung der

    Bundesregierung nach Absatz 1 Satz 1 ist dem im Register (§ 30 Abs. 1) als Patentinhaber Eingetragenen vor

    Benutzung der Erfindung mitzuteilen. Erlangt die oberste Bundesbehörde, von der eine Anordnung oder ein

    Auftrag nach Absatz 1 Satz 2 ausgeht, Kenntnis von der Entstehung eines Vergütungsanspruchs nach Satz 1, so

    hat sie dem als Patentinhaber Eingetragenen davon Mitteilung zu machen.'
- id: art-21
  title: § 14
  text: '§ 14

    Der Schutzbereich des Patents und der Patentanmeldung wird durch die Patentansprüche bestimmt. Die

    Beschreibung und die Zeichnungen sind jedoch zur Auslegung der Patentansprüche heranzuziehen.'
- id: art-22
  title: § 15
  text: '§ 15

    (1) Das Recht auf das Patent, der Anspruch auf Erteilung des Patents und das Recht aus dem Patent gehen auf die

    Erben über. Sie können beschränkt oder unbeschränkt auf andere übertragen werden.

    (2) Die Rechte nach Absatz 1 können ganz oder teilweise Gegenstand von ausschließlichen oder nicht

    ausschließlichen Lizenzen für den Geltungsbereich dieses Gesetzes oder einen Teil desselben sein. Soweit ein

    Lizenznehmer gegen eine Beschränkung seiner Lizenz nach Satz 1 verstößt, kann das Recht aus dem Patent

    gegen ihn geltend gemacht werden.

    (3) Ein Rechtsübergang oder die Erteilung einer Lizenz berührt nicht Lizenzen, die Dritten vorher erteilt worden

    sind.'
- id: art-23
  title: § 16
  text: '§ 16

    Das Patent dauert zwanzig Jahre, die mit dem Tag beginnen, der auf die Anmeldung der Erfindung folgt.'
- id: art-24
  title: § 16a
  text: '§ 16a

    (1) Für das Patent kann nach Maßgabe von Verordnungen der Europäischen Gemeinschaften über die Schaffung

    von ergänzenden Schutzzertifikaten, auf die im Bundesgesetzblatt hinzuweisen ist, ein ergänzender Schutz

    beantragt werden, der sich an den Ablauf des Patents nach § 16 unmittelbar anschließt. Für den ergänzenden

    Schutz sind Jahresgebühren zu zahlen.

    (2) Soweit das Recht der Europäischen Gemeinschaften nichts anderes bestimmt, gelten die Vorschriften dieses

    Gesetzes über die Berechtigung des Anmelders (§§ 6 bis 8), über die Wirkung des Patents und die Ausnahmen

    davon (§§ 9 bis 12), über die Benutzungsanordnung und die Zwangslizenz (§§ 13, 24), über den Schutzbereich (§

    14), über Lizenzen und deren Eintragung (§§ 15, 30), über das Erlöschen des Patents (§ 20), über die Nichtigkeit

    (§ 22), über die Lizenzbereitschaft (§ 23), über den Inlandsvertreter (§ 25), über den Widerruf (§ 64 Absatz 1 erste

    Alternative, Absatz 2 und 3 Satz 1 bis 3), über das Patentgericht und das Verfahren vor dem Patentgericht (§§

    65 bis 99), über das Verfahren vor dem Bundesgerichtshof (§§ 100 bis 122a), über die Wiedereinsetzung (§ 123),

    über die Weiterbehandlung (§ 123a), über die Wahrheitspflicht (§ 124), über das elektronische Dokument (§ 125a),

    über die Amtssprache, die Zustellungen und die Rechtshilfe (§§ 126 bis 128), über die Rechtsverletzungen (§§ 139

    - Seite 7 von 48 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    bis 141a, 142a und 142b), über die Klagenkonzentration und über die Patentberühmung (§§ 145 und 146) für den

    ergänzenden Schutz entsprechend.

    (3) Lizenzen und Erklärungen nach § 23, die für ein Patent wirksam sind, gelten auch für den ergänzenden Schutz.'
- id: art-25
  title: § 17
  text: '§ 17

    Für jede Anmeldung und jedes Patent ist für das dritte und jedes folgende Jahr, gerechnet vom Anmeldetag an,

    eine Jahresgebühr zu entrichten.

    §§ 18 und 19 (weggefallen)'
- id: art-26
  title: § 20
  text: '§ 20

    (1) Das Patent erlischt, wenn

    1. der Patentinhaber darauf durch schriftliche Erklärung an das Deutsche Patent- und Markenamt verzichtet

    oder

    2. die Jahresgebühr oder der Unterschiedsbetrag nicht rechtzeitig (§ 7 Abs. 1, § 13 Absatz 4 oder § 14 Abs. 2

    und 5 des Patentkostengesetzes, § 23 Abs. 7 Satz 4 dieses Gesetzes) gezahlt wird.

    (2) Über die Rechtzeitigkeit der Zahlung entscheidet nur das Deutsche Patent- und Markenamt; die §§ 73 und 100

    bleiben unberührt.'
- id: art-27
  title: § 21
  text: '§ 21

    (1) Das Patent wird widerrufen (§ 61), wenn sich ergibt, daß

    1. der Gegenstand des Patents nach den §§ 1 bis 5 nicht patentfähig ist,

    2. das Patent die Erfindung nicht so deutlich und vollständig offenbart, daß ein Fachmann sie ausführen

    kann,

    3. der wesentliche Inhalt des Patents den Beschreibungen, Zeichnungen, Modellen, Gerätschaften oder

    Einrichtungen eines anderen oder einem von diesem angewendeten Verfahren ohne dessen Einwilligung

    entnommen worden ist (widerrechtliche Entnahme),

    4. der Gegenstand des Patents über den Inhalt der Anmeldung in der Fassung hinausgeht, in der sie bei

    der für die Einreichung der Anmeldung zuständigen Behörde ursprünglich eingereicht worden ist; das

    gleiche gilt, wenn das Patent auf einer Teilanmeldung oder einer nach § 7 Abs. 2 eingereichten neuen

    Anmeldung beruht und der Gegenstand des Patents über den Inhalt der früheren Anmeldung in der

    Fassung hinausgeht, in der sie bei der für die Einreichung der früheren Anmeldung zuständigen Behörde

    ursprünglich eingereicht worden ist.

    (2) Betreffen die Widerrufsgründe nur einen Teil des Patents, so wird es mit einer entsprechenden Beschränkung

    aufrechterhalten. Die Beschränkung kann in Form einer Änderung der Patentansprüche, der Beschreibung oder

    der Zeichnungen vorgenommen werden.

    (3) Mit dem Widerruf gelten die Wirkungen des Patents und der Anmeldung als von Anfang an nicht eingetreten.

    Bei beschränkter Aufrechterhaltung ist diese Bestimmung entsprechend anzuwenden.'
- id: art-28
  title: § 22
  text: '§ 22

    (1) Das Patent wird auf Antrag (§ 81) für nichtig erklärt, wenn sich ergibt, daß einer der in § 21 Abs. 1

    aufgezählten Gründe vorliegt oder der Schutzbereich des Patents erweitert worden ist.

    (2) § 21 Abs. 2 und 3 ist entsprechend anzuwenden.'
- id: art-29
  title: § 23
  text: '§ 23

    (1) Erklärt sich der Patentanmelder oder der im Register (§ 30 Abs. 1) als Patentinhaber Eingetragene dem

    Deutschen Patent- und Markenamt gegenüber schriftlich im Sinne des § 125a bereit, jedermann die Benutzung

    der Erfindung gegen angemessene Vergütung zu gestatten, so ermäßigen sich die für das Patent nach Eingang

    der Erklärung fällig werdenden Jahresgebühren auf die Hälfte. Die Erklärung ist im Register einzutragen und im

    Patentblatt zu veröffentlichen.

    - Seite 8 von 48 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    (2) Die Erklärung ist unzulässig, solange im Register ein Vermerk über die Einräumung einer ausschließlichen

    Lizenz (§ 30 Abs. 4) eingetragen ist oder ein Antrag auf Eintragung eines solchen Vermerks dem Deutschen

    Patent- und Markenamt vorliegt.

    (3) Wer nach Eintragung der Erklärung die Erfindung benutzen will, hat seine Absicht dem Patentinhaber

    anzuzeigen. Die Anzeige gilt als bewirkt, wenn sie durch Aufgabe eines eingeschriebenen Briefes an den im

    Register als Patentinhaber Eingetragenen oder seinen eingetragenen Vertreter oder Zustellungsbevollmächtigten

    (§ 25) abgesandt worden ist. In der Anzeige ist anzugeben, wie die Erfindung benutzt werden soll. Nach der

    Anzeige ist der Anzeigende zur Benutzung in der von ihm angegebenen Weise berechtigt. Er ist verpflichtet,

    dem Patentinhaber nach Ablauf jedes Kalendervierteljahres Auskunft über die erfolgte Benutzung zu geben und

    die Vergütung dafür zu entrichten. Kommt er dieser Verpflichtung nicht in gehöriger Zeit nach, so kann der als

    Patentinhaber Eingetragene ihm hierzu eine angemessene Nachfrist setzen und nach fruchtlosem Ablauf die

    Weiterbenutzung der Erfindung untersagen.

    (4) Die Vergütung wird auf schriftlichen Antrag eines Beteiligten durch die Patentabteilung festgesetzt. Für das

    Verfahren sind die §§ 46, 47 und 62 entsprechend anzuwenden. Der Antrag kann gegen mehrere Beteiligte

    gerichtet werden. Das Deutsche Patent- und Markenamt kann bei der Festsetzung der Vergütung anordnen, dass

    die Kosten des Festsetzungsverfahrens ganz oder teilweise vom Antragsgegner zu erstatten sind.

    (5) Nach Ablauf eines Jahres seit der letzten Festsetzung kann jeder davon Betroffene ihre Änderung beantragen,

    wenn inzwischen Umstände eingetreten oder bekanntgeworden sind, welche die festgesetzte Vergütung offenbar

    unangemessen erscheinen lassen. Im übrigen gilt Absatz 4 entsprechend.

    (6) Wird die Erklärung für eine Anmeldung abgegeben, so sind die Bestimmungen der Absätze 1 bis 5

    entsprechend anzuwenden.

    (7) Die Erklärung kann jederzeit gegenüber dem Deutschen Patent- und Markenamt schriftlich im Sinne des'
