  title: Ein Service des Bundesministerium der Justiz und für Verbrau
  text: 'Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Telekommunikationsgesetz (TKG)

    TKG

    Ausfertigungsdatum: 23.06.2021

    Vollzitat:

    "Telekommunikationsgesetz vom 23. Juni 2021 (BGBl. I S. 1858), das zuletzt durch Artikel 2 des Gesetzes vom 12.

    Mai 2026 (BGBl. 2026 I Nr. 138) geändert worden ist"

    Stand: Zuletzt geändert durch Art. 6 G v. 11.3.2026 I Nr. 66

    Hinweis: Änderung durch Art. 2 G v. 12.5.2026 I Nr. 138 textlich nachgewiesen, dokumentarisch noch nicht

    abschließend bearbeitet

    Ersetzt G v. 22.6.2004 I 1190 (TKG 2004)

    Fußnote

    (+++ Textnachweis ab: 1.12.2021 +++)

    (+++ Zur Anwendung vgl. § 230 +++)

    (+++ EU-Vollzitate: vgl. Liste EU-Rechtsakte G v. 10.3.2026 I Nr. 64,

    G v. 12.5.2026 I Nr. 138 +++)

    Das G wurde als Artikel 1 des G v. 23.6.2021 I 1858 vom Bundestag mit Zustimmung des Bundesrates

    beschlossen. Es ist gem. Art. 61 Abs. 1 Satz 1 dieses G am 1.12.2021 in Kraft getreten.

