- id: art-54
  title: § 1 Abfallwirtschaftliche Ziele
  text: '§ 1 Abfallwirtschaftliche Ziele

    Dieses Gesetz legt Anforderungen an die Produktverantwortung nach § 23 des Kreislaufwirtschaftsgesetzes

    für Elektro- und Elektronikgeräte fest. Es bezweckt vorrangig die Vermeidung von Abfällen von Elektro- und

    Elektronikgeräten und darüber hinaus die Vorbereitung zur Wiederverwendung, das Recycling und andere Formen

    der Verwertung solcher Abfälle, um die zu beseitigende Abfallmenge zu reduzieren und dadurch die Effizienz

    der Ressourcennutzung zu verbessern. Um diese abfallwirtschaftlichen Ziele zu erreichen, soll das Gesetz das

    Marktverhalten der Verpflichteten regeln.'
- id: art-55
  title: § 2 Anwendungsbereich
  text: '§ 2 Anwendungsbereich

    (1) Dieses Gesetz gilt für sämtliche Elektro- und Elektronikgeräte. Sie sind in die folgenden Kategorien unterteilt:

    1. Wärmeüberträger,

    2. Bildschirme, Monitore und Geräte, die Bildschirme mit einer Oberfläche von mehr als 100

    Quadratzentimetern enthalten,

    3. Lampen,

    4. Geräte, bei denen mindestens eine der äußeren Abmessungen mehr als 50 Zentimeter beträgt

    (Großgeräte),

    5. Geräte, bei denen keine der äußeren Abmessungen mehr als 50 Zentimeter beträgt (Kleingeräte), und

    6. kleine Geräte der Informations- und Telekommunikationstechnik, bei denen keine der äußeren

    Abmessungen mehr als 50 Zentimeter beträgt.

    Elektro- und Elektronikgeräte im Sinne des Satzes 1 sind insbesondere die in Anlage 1 aufgeführten Geräte.

    - Seite 3 von 40 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    (2) Dieses Gesetz gilt nicht für folgende Elektro- und Elektronikgeräte:

    1. Geräte, die der Wahrung der wesentlichen Sicherheitsinteressen der Bundesrepublik Deutschland dienen,

    einschließlich Waffen, Munition und Wehrmaterial, die nur für militärische Zwecke bestimmt sind,

    2. Geräte, die

    a) als Teil eines anderen Gerätes, das vom Geltungsbereich dieses Gesetzes ausgenommen ist oder

    nicht in den Geltungsbereich dieses Gesetzes fällt, in dieses eingebaut sind und

    b) ihre Funktion nur speziell als Teil dieses anderen Gerätes erfüllen können,

    3. Glühlampen,

    4. Ausrüstungsgegenstände für einen Einsatz im Weltraum,

    5. ortsfeste industrielle Großwerkzeuge,

    6. ortsfeste Großanlagen; dieses Gesetz gilt jedoch für Geräte, die nicht speziell als Teil dieser Anlagen

    konzipiert und darin eingebaut sind,

    7. Verkehrsmittel zur Personen- und Güterbeförderung; dieses Gesetz gilt jedoch für elektrische

    Zweiradfahrzeuge, für die eine Typgenehmigung nicht erforderlich ist,

    8. bewegliche Maschinen,

    9. Geräte, die ausschließlich zu Zwecken der Forschung und Entwicklung speziell entworfen wurden und nur

    auf zwischenbetrieblicher Ebene bereitgestellt werden, und

    10. medizinische Geräte und In-vitro-Diagnostika, bei denen jeweils zu erwarten ist, dass sie vor Ablauf ihrer

    Lebensdauer infektiös werden, und aktive implantierbare medizinische Geräte.

    (3) Soweit dieses Gesetz keine abweichenden Vorschriften enthält, sind das Kreislaufwirtschaftsgesetz,

    mit Ausnahme von § 17 Absatz 4 und § 54, und diejenigen Rechtsverordnungen in der jeweils geltenden

    Fassung anzuwenden, die auf der Grundlage des Kreislaufwirtschaftsgesetzes oder des bis zum 31. Mai

    2012 geltenden Kreislaufwirtschafts- und Abfallgesetzes erlassen wurden. Die §§ 27, 47 Absatz 1 bis 6, §

    50 Absatz 3, § 59 Absatz 1 Satz 1 und Absatz 2 sowie die §§ 60, 62 und 66 des Kreislaufwirtschaftsgesetzes

    gelten entsprechend. Rechtsvorschriften, die besondere Anforderungen an die Bewirtschaftung von Altgeräten

    oder an die Produktkonzeption enthalten, sowie solche, die aus Gründen der Sicherheit im Zusammenhang

    mit der Beförderung gefährlicher Güter erlassen sind, bleiben unberührt. Die Nachweispflichten nach § 50

    Absatz 1 des Kreislaufwirtschaftsgesetzes gelten nicht für die Überlassung von Altgeräten an Einrichtungen

    zur Erfassung und Erstbehandlung von Altgeräten. Abweichend von Satz 1 gelten § 17 Absatz 4 Satz 1

    und § 54 des Kreislaufwirtschaftsgesetzes für aus Altgeräten ausgebaute Bauteile, Unterbaugruppen und

    Verbrauchsmaterialien.'
- id: art-56
  title: § 3 Begriffsbestimmungen
  text: '§ 3 Begriffsbestimmungen

    Im Sinne dieses Gesetzes sind

    1. Elektro- und Elektronikgeräte:

    Geräte, die für den Betrieb mit Wechselspannung von höchstens 1 000 Volt oder Gleichspannung von

    höchstens 1 500 Volt ausgelegt sind und

    a) zu ihrem ordnungsgemäßen Betrieb von elektrischen Strömen oder elektromagnetischen Feldern

    abhängig sind oder

    b) der Erzeugung, Übertragung und Messung von elektrischen Strömen und elektromagnetischen

    Feldern dienen;

    2. Geräteart:

    Zusammenfassung von Geräten innerhalb einer Kategorie, die hinsichtlich der Art ihrer Nutzung oder

    ihrer Funktionen vergleichbare Merkmale aufweisen;

    3. Altgeräte:

    Elektro- und Elektronikgeräte, die Abfall im Sinne des § 3 Absatz 1 Satz 1 des

    Kreislaufwirtschaftsgesetzes sind, einschließlich aller Bauteile, Unterbaugruppen und

    Verbrauchsmaterialien, die zum Zeitpunkt des Eintritts der Abfalleigenschaft Teil des Altgerätes sind;

    4. historische Altgeräte:

    - Seite 4 von 40 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    a) Altgeräte, die vor dem 13. August 2005 in Verkehr gebracht wurden,

    b) Leuchten aus privaten Haushalten und Photovoltaikmodule, die Altgeräte sind und vor dem 24.

    Oktober 2015 in Verkehr gebracht wurden, oder

    c) Altgeräte, die vor dem 15. August 2018 in Verkehr gebracht wurden, soweit sie vom

    Anwendungsbereich dieses Gesetzes in der Fassung vom 20. Oktober 2015 nicht erfasst waren;

    5. Altgeräte aus privaten Haushalten:

    Altgeräte aus privaten Haushaltungen im Sinne des Kreislaufwirtschaftsgesetzes sowie Altgeräte aus

    sonstigen Herkunftsbereichen, soweit die Beschaffenheit und Menge der dort anfallenden Altgeräte mit

    der Beschaffenheit und Menge von üblicherweise in privaten Haushaltungen anfallenden Altgeräten

    vergleichbar ist; Elektro- und Elektronikgeräte, die potentiell sowohl von privaten Haushalten als auch

    von anderen Nutzern als privaten Haushalten genutzt werden, gelten, wenn sie Abfall werden, als

    Altgeräte aus privaten Haushalten;

    6. Anbieten:

    das im Rahmen einer gewerbsmäßigen Tätigkeit auf den Abschluss eines Kaufvertrages gerichtete

    Präsentieren oder öffentliche Zugänglichmachen von Elektro- oder Elektronikgeräten im Geltungsbereich

    dieses Gesetzes; dies umfasst auch die Aufforderung, ein Angebot abzugeben;

    7. Bereitstellung auf dem Markt:

    jede entgeltliche oder unentgeltliche Abgabe eines Elektro- oder Elektronikgerätes zum

    Vertrieb, Verbrauch oder zur Verwendung im Geltungsbereich dieses Gesetzes im Rahmen einer

    Geschäftstätigkeit;

    8. Inverkehrbringen:

    die erstmalige Bereitstellung eines Elektro- oder Elektronikgerätes auf dem Markt im Geltungsbereich

    dieses Gesetzes; als Inverkehrbringen gilt auch die erste Wiederbereitstellung eines Elektro- oder

    Elektronikgerätes auf dem Markt im Geltungsbereich dieses Gesetzes, das nach der erstmaligen

    Bereitstellung auf dem Markt aus dem Geltungsbereich des Gesetzes ausgeführt worden war;

    9. Hersteller:

    jede natürliche oder juristische Person oder rechtsfähige Personengesellschaft, die unabhängig von

    der Verkaufsmethode, einschließlich der Fernkommunikationsmittel im Sinne des § 312c Absatz 2 des

    Bürgerlichen Gesetzbuchs,

    a) Elektro- oder Elektronikgeräte

    aa) unter ihrem Namen oder ihrer Marke herstellt und innerhalb des Geltungsbereiches

    dieses Gesetzes anbietet oder

    bb) konzipieren oder herstellen lässt und sie unter ihrem Namen oder ihrer Marke innerhalb

    des Geltungsbereiches dieses Gesetzes anbietet,

    b) Elektro- oder Elektronikgeräte anderer Hersteller unter ihrem eigenen Namen oder ihrer Marke

    im Geltungsbereich dieses Gesetzes anbietet oder gewerbsmäßig weiterverkauft, wobei der

    Anbieter oder Weiterverkäufer dann nicht als Hersteller anzusehen ist, wenn der Name oder die

    Marke des Herstellers gemäß Buchstabe a auf dem Gerät erscheint,

    c) erstmals aus einem anderen Mitgliedstaat der Europäischen Union oder aus einem Drittland

    stammende Elektro- oder Elektronikgeräte auf dem Markt im Geltungsbereich dieses Gesetzes

    anbietet oder

    d) Elektro- oder Elektronikgeräte unter Verwendung von Fernkommunikationsmitteln direkt

    Endnutzern im Geltungsbereich dieses Gesetzes anbietet und in einem anderen Mitgliedstaat der

    Europäischen Union oder einem Drittland niedergelassen ist;

    als Hers teller gilt zugleich auch jeder Vertreiber nach Nummer 11, der entgegen § 6 Absatz 2

    Satz 2 Nummer 1 vorsätzlich oder fahrlässig neue Elektro- oder Elektronikgeräte nicht oder nicht

    ordnungsgemäß registrierter Hersteller oder von Herstellern, deren Bevollmächtigte nicht oder nicht

    ordnungsgemäß registriert sind, zum Verkauf anbietet; in diesem Fall gilt abweichend von Nummer 8 die

    Bereitstellung als Inverkehrbringen; Nummer 11 bleibt unberührt;

    10. Bevollmächtigter:

    jede im Geltungsbereich dieses Gesetzes niedergelassene natürliche oder juristische Person oder

    rechtsfähige Personengesellschaft, die ein Hersteller ohne Niederlassung im Geltungsbereich

    dieses Gesetzes beauftragt hat, in eigenem Namen sämtliche Aufgaben wahrzunehmen, um die

    - Seite 5 von 40 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Herstellerpflichten nach diesem Gesetz zu erfüllen; Bevollmächtigter kann auch ein Hersteller nach

    Nummer 9 Buchstabe c oder ein Vertreiber nach Nummer 11, ein Betreiber eines elektronischen

    Marktplatzes nach Nummer 11b oder ein Fulfilment-Dienstleister nach Nummer 11c sein, sofern die

    Voraussetzungen nach dem ersten Halbsatz vorliegen;

    11. Vertreiber:

    jede natürliche oder juristische Person oder rechtsfähige Personengesellschaft, die Elektro- oder

    Elektronikgeräte im Geltungsbereich dieses Gesetzes anbietet oder auf dem Markt bereitstellt;

    11a. elektronischer Marktplatz:

    eine Website oder jedes andere Instrument, mit dessen Hilfe Informationen über das Internet zur

    Verfügung gestellt werden, die oder das es Herstellern oder Vertreibern, die nicht Betreiber des

    elektronischen Marktplatzes sind, ermöglicht, Elektro- und Elektronikgeräte in eigenem Namen im

    Geltungsbereich dieses Gesetzes anzubieten oder bereitzustellen;

    11b. Betreiber eines elektronischen Marktplatzes:

    jede natürliche oder juristische Person oder Personengesellschaft, die einen elektronischen Marktplatz

    unterhält und es Dritten ermöglicht, auf diesem Marktplatz Elektro- und Elektronikgeräte im

    Geltungsbereich dieses Gesetzes anzubieten oder bereitzustellen;

    11c. Fulfilment-Dienstleister:

    jede natürliche oder juristische Person oder Personengesellschaft, die im Rahmen einer

    Geschäftstätigkeit mindestens zwei der folgenden Dienstleistungen im Geltungsbereich dieses Gesetzes

    anbietet: Lagerhaltung, Verpackung, Adressierung oder Versand von Elektro- oder Elektronikgeräten, an

    denen sie kein Eigentumsrecht hat; Post-, Paketzustell- oder sonstige Frachtverkehrsdienstleister gelten

    nicht als Fulfilment-Dienstleister;

    11d. Lager- und Versandfläche:

    alle im In- oder Ausland gelegenen Flächen, die genutzt werden, um beim Vertrieb unter Verwendung

    von Fernkommunikationsmitteln den Verkaufsprozess durch Lagerung, Kommissionierung oder

    Verpacken der Elektro- und Elektronikgeräte für den Endnutzer zu ermöglichen oder zu unterstützen;

    zur Lagerfläche gehört, unabhängig von der Regalgrundfläche, die gesamte Fläche der einzelnen

    Regalböden;

    12. öffentlich-rechtlicher Entsorgungsträger:

    die nach Landesrecht zur Entsorgung verpflichtete juristische Person;

    13. Photovoltaikmodule:

    elektrische Vorrichtungen, die zur Verwendung in einem System bestimmt sind und zur Erzeugung von

    Strom aus solarer Strahlungsenergie entworfen, zusammengesetzt und installiert werden;

    14. Lampen:

    Einrichtungen zur Erzeugung von Licht;

    15. Leuchten:

    Geräte zur Verteilung, Filterung oder Umwandlung des von einer oder mehreren Lampen übertragenen

    Lichts, die alle zur Aufnahme, zur Fixierung und zum Schutz der Lampen notwendigen Teile und

    erforderlichenfalls Hilfselemente zusammen mit den Vorrichtungen zu ihrem Anschluss an die

    Stromquelle umfassen; dazu gehören alle Lampen, sofern diese nicht entfernt werden können, ohne dass

    die Einheit dauerhaft beschädigt wird;

    16. ortsfeste industrielle Großwerkzeuge:

    eine groß angelegte Anordnung von industriellen Maschinen, Geräten oder Bauteilen mit einer

    gemeinsamen Funktion für eine bestimmte Anwendung, die

    a) von Fachpersonal dauerhaft an einem bestimmten Ort installiert und abgebaut wird und

    b) von Fachpersonal in einer industriellen Fertigungsanlage oder einer Forschungs- und

    Entwicklungsanlage eingesetzt und instand gehalten wird;

    17. ortsfeste Großanlagen:

    eine groß angelegte Kombination von Geräten unterschiedlicher Art und gegebenenfalls weiterer

    Einrichtungen, die

    a) von Fachpersonal montiert, installiert und abgebaut wird,

    b) dazu bestimmt ist, auf Dauer als Teil eines Gebäudes oder Bauwerks an einem vorbestimmten

    und eigens dafür vorgesehenen Standort betrieben zu werden, und

    - Seite 6 von 40 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    c) nur durch die gleichen, speziell konstruierten Geräte ersetzt werden kann;

    18. bewegliche Maschinen:

    Maschinen mit eigener Energieversorgung, die

    a) nicht für den Straßenverkehr bestimmt sind,

    b) ausschließlich bei einer beruflichen Tätigkeit genutzt werden und

    c) beim Betrieb entweder beweglich sein müssen oder kontinuierlich oder halbkontinuierlich zu

    verschiedenen festen Betriebsorten bewegt werden müssen;

    19. medizinisches Gerät:

    ein Medizinprodukt im Sinne von Artikel 2 Nummer 1 der Verordnung (EU) 2017/745 des Europäischen

    Parlaments und des Rates vom 5. April 2017 über Medizinprodukte, zur Änderung der Richtlinie 2001/83/

    EG, der Verordnung (EG) Nr. 178/2002 und der Verordnung (EG) Nr. 1223/2009 und zur Aufhebung der

    Richtlinien 90/385/EWG und 93/42/EWG des Rates (ABl. L 117 vom 5.5.2017, S. 1; L 117 vom 3.5.2019,

    S. 9; L 334 vom 27.12.2019, S. 165), die durch die Verordnung (EU) 2020/561 (ABl. L 130 vom 24.4.2020,

    S. 18) geändert worden ist, in der jeweils geltenden Fassung oder Zubehör eines Medizinproduktes im

    Sinne von Artikel 2 Nummer 2 der Verordnung (EU) 2017/745, das ein Elektro- oder Elektronikgerät ist;

    20. In-vitro-Diagnostikum:

    ein In-vitro-Diagnostikum oder dessen Zubehör im Sinne von Artikel 2 Nummer 2 oder 4 der Verordnung

    (EU) 2017/746 des Europäischen Parlaments und des Rates vom 5. April 2017 über In-vitro-Diagnostika

    und zur Aufhebung der Richtlinie 98/79/EG und des Beschlusses 2010/227/EU der Kommission (ABl.

    L 117 vom 5.5.2017, S. 176; L 117 vom 3.5.2019, S. 11; L 334 vom 27.12.2019, S. 167) in der jeweils

    geltenden Fassung, das ein Elektro- oder Elektronikgerät ist;

    21. aktives implantierbares medizinisches Gerät:

    ein aktives implantierbares Medizinprodukt im Sinne von Artikel 2 Nummer 4 und 5 der Verordnung (EU)

    2017/745, das ein Elektro- oder Elektronikgerät ist;

    21a. elektronische Zigarette:

    elektronische Zigarette nach Artikel 2 Nummer 16 Satz 1 der Richtlinie 2014/40 (EU);

    21b. elektronischer Tabakerhitzer:

    ein elektronisches Heizsystem, das zum Erhitzen von neuartigen Tabakerzeugnissen im Sinne des

    Artikels 7 Absatz 12 Unterabsatz 2 der Richtlinie 2014/40/EU geeignet und bestimmt ist;

    22. Erfassung

    die Sammlung sowie die Rücknahme von Altgeräten;

    23. Behandlung:

    Tätigkeiten, die nach der Übergabe von Altgeräten an eine Anlage zur Vorbereitung zur

    Wiederverwendung, zur Entfrachtung von Schadstoffen, zur Separierung von Wertstoffen, zur

    Demontage, zum Schreddern, zur Verwertung oder zur Vorbereitung der Beseitigung durchgeführt

    werden, sowie sonstige Tätigkeiten, die der Verwertung oder Beseitigung der Altgeräte dienen;

    24. Erstbehandlung:

    die erste Behandlung von Altgeräten, bei der die Altgeräte

    a) zur Wiederverwendung vorbereitet oder

    b) von Schadstoffen entfrachtet und Wertstoffe aus den Altgeräten separiert

    werden , einschließlich hierauf bezogener Vorbereitungshandlungen; die Erstbehandlung umfasst

    auch die Verwertungsverfahren R 12 und R 13 nach Anlage 2 zum Kreislaufwirtschaft'
- id: art-57
  title: § 4 Produktkonzeption
  text: '§ 4 Produktkonzeption

    (1) Hersteller haben ihre Elektro- und Elektronikgeräte möglichst so zu gestalten, dass insbesondere die

    Wiederverwendung, die Demontage und die Verwertung von Altgeräten, ihren Bauteilen und Werkstoffen

    berücksichtigt und erleichtert werden. Elektro- und Elektronikgeräte, die vollständig oder teilweise mit

    Batterien oder Akkumulatoren betrieben werden können, sind möglichst so zu gestalten, dass Altbatterien

    und Altakkumulatoren durch Endnutzer problemlos und zerstörungsfrei entnommen werden können. Sind

    Altbatterien oder Altakkumulatoren nicht problemlos durch den Endnutzer entnehmbar, sind die Elektro- und

    Elektronikgeräte so zu gestalten, dass die Altbatterien und Altakkumulatoren problemlos und zerstörungsfrei und

    mit handelsüblichem Werkzeug durch vom Hersteller unabhängiges Fachpersonal entnommen werden können.

    (2) Die Hersteller sollen die Wiederverwendung nicht durch besondere Konstruktionsmerkmale oder

    Herstellungsprozesse verhindern, es sei denn, dass die Konstruktionsmerkmale rechtlich vorgeschrieben sind oder

    die Vorteile dieser besonderen Konstruktionsmerkmale oder Herstellungsprozesse überwiegen, beispielsweise im

    Hinblick auf den Gesundheitsschutz, den Umweltschutz oder auf Sicherheitsvorschriften.

    (3) Absatz 1 Satz 2 und 3 gilt nicht für Elektro- und Elektronikgeräte, in denen aus Gründen der Sicherheit, der

    Leistung, aus medizinischen Gründen oder aus Gründen der Vollständigkeit von Daten eine ununterbrochene

    Stromversorgung notwendig und eine ständige Verbindung zwischen dem Gerät und der Batterie oder dem

    Akkumulator erforderlich sind.

    (4) Jeder Hersteller hat Elektro- und Elektronikgeräten, die eine Batterie oder einen Akkumulator enthalten,

    Angaben beizufügen, welche den Endnutzer informieren über

    1. den Typ und das chemische System der Batterie oder des Akkumulators und

    2. deren oder dessen sichere Entnahme.

    Satz 1 g ilt nicht für Elektro- und Elektronikgeräte nach Absatz 3.'
- id: art-58
  title: § 5 Einrichten der Gemeinsamen Stelle
  text: '§ 5 Einrichten der Gemeinsamen Stelle

    (1) Die Hersteller oder im Fall der Bevollmächtigung nach § 8 deren Bevollmächtigte sind verpflichtet, eine

    Gemeinsame Stelle einzurichten.

    (2) Ist die Gemeinsame Stelle nicht eingerichtet oder nimmt sie ihre Aufgaben nach § 31 Absatz 5 Satz 1

    oder Absatz 7 Satz 1 und 3 nicht wahr, ist jeder Hersteller oder im Fall der Bevollmächtigung nach § 8 dessen

    Bevollmächtigter verpflichtet, den öffentlich-rechtlichen Entsorgungsträgern die Kosten für die Sammlung,

    Sortierung und Entsorgung seiner Altgeräte zu erstatten. Die nach Landesrecht zuständige Behörde setzt die

    Kosten durch Verwaltungsakt fest.'
- id: art-59
  title: § 6 Registrierung
  text: '§ 6 Registrierung

    (1) Bevor ein Hersteller Elektro- oder Elektronikgeräte in Verkehr bringt, ist er oder im Fall der Bevollmächtigung

    nach § 8 sein Bevollmächtigter verpflichtet, sich bei der zuständigen Behörde mit der Geräteart und

    Marke registrieren zu lassen. Der Registrierungsantrag muss die Angaben nach Anlage 2 enthalten. Dem

    Registrierungsantrag ist oder sind

    1. eine Garantie nach § 7 Absatz 1 Satz 1 oder

    2. eine Glaubhaftmachung nach § 7 Absatz 3 Satz 1 und ein Rücknahmekonzept nach § 7a

    beizufü gen. Der Hersteller oder im Fall der Bevollmächtigung nach § 8 sein Bevollmächtigter hat der zuständigen

    Behörde Änderungen von im Registrierungsantrag enthaltenen Daten sowie die dauerhafte Aufgabe des

    Inverkehrbringens unverzüglich mitzuteilen.

    - Seite 8 von 40 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    (2) Hersteller dürfen Elektro- oder Elektronikgeräte nicht in Verkehr bringen, wenn sie oder im Fall der

    Bevollmächtigung nach § 8 deren Bevollmächtigte nicht oder nicht ordnungsgemäß registriert sind. Ist ein

    Hersteller oder im Fall der Bevollmächtigung nach § 8 dessen Bevollmächtigter entgegen Absatz 1 Satz 1 nicht

    oder nicht ordnungsgemäß registriert, dürfen

    1. Vertreiber die Elektro- oder Elektronikgeräte dieses Herstellers nicht zum Verkauf anbieten,

    2. Betreiber von elektronischen Marktplätzen das Anbieten oder Bereitstellen von Elektro- oder

    Elektronikgeräten dieses Herstellers nicht ermöglichen und

    3. Fulfilment-Dienstleister die Lagerhaltung, Verpackung, Adressierung oder den Versand in Bezug auf

    Elektro- oder Elektronikgeräte dieses Herstellers nicht vornehmen.

    (3) Jeder Hersteller ist verpflichtet, beim Anbieten und auf Rechnungen seine Registrierungsnummer anzugeben.'
- id: art-60
  title: § 7 Finanzierungsgarantie
  text: '§ 7 Finanzierungsgarantie

    (1) Jeder Hersteller oder im Fall der Bevollmächtigung nach § 8 dessen Bevollmächtigter ist verpflichtet, der

    zuständigen Behörde kalenderjährlich eine insolvenzsichere Garantie für die Finanzierung der Rücknahme und

    Entsorgung der Elektro- und Elektronikgeräte nachzuweisen, die der Hersteller nach dem 13. August 2005 im

    Geltungsbereich dieses Gesetzes in Verkehr bringt oder gebracht hat und die in privaten Haushalten genutzt

    werden können. Die Garantie hat den Rückgriffsanspruch der Gemeinsamen Stelle gemäß § 34 Absatz 2 zu

    sichern.

    (2) Für die Garantie sind folgende Formen möglich:

    1. eine Bürgschaft auf erstes Anfordern eines Kreditinstituts oder Kreditversicherers,

    2. eine Garantie auf erstes Anfordern eines Kreditinstituts oder Kreditversicherers,

    3. die Hinterlegung von Geld zur Sicherheitsleistung im Sinne von § 232 Absatz 1 des Bürgerlichen

    Gesetzbuchs nach näherer Maßgabe der Hinterlegungsgesetze der Länder oder

    4. die Teilnahme an Systemen, die für die Finanzierung der Entsorgung von Altgeräten geeignet sind; die

    Eignung eines solches Systems ist durch die zuständige Behörde gemäß § 37 Absatz 6 festzustellen.

    Eine Bü rgschaft oder Garantie auf erstes Anfordern kann auch formularmäßig übernommen werden, ohne dass

    dadurch gegen die §§ 305 bis 310 des Bürgerlichen Gesetzbuchs verstoßen wird.

    (3) Absatz 1 gilt nicht für Elektro- oder Elektronikgeräte, für die der Hersteller oder im Fall der Bevollmächtigung

    nach § 8 dessen Bevollmächtigter glaubhaft macht, dass sie ausschließlich in anderen als privaten Haushalten

    genutzt werden oder dass solche Geräte gewöhnlich nicht in privaten Haushalten genutzt werden. Die Pflicht nach

    Absatz 1 gilt für Hersteller von Elektro- und Elektronikgeräten, die nicht vom Anwendungsbereich des Elektro-

    und Elektronikgerätegesetzes vom 16. März 2005 (BGBl. I S. 762), das zuletzt durch Artikel 14 des Gesetzes vom

    20. September 2013 (BGBl. I S. 3642) geändert worden ist, erfasst waren, oder im Fall der Bevollmächtigung

    nach § 8 für ihre Bevollmächtigten nur in Bezug auf Geräte, die nach dem 24. Oktober 2015 in Verkehr gebracht

    wurden oder werden. Für Hersteller von Elektro- und Elektronikgeräten, die ab dem 15. August 2018 in den

    Anwendungsbereich dieses Gesetzes fallen, oder im Fall der Bevollmächtigung nach § 8 deren Bevollmächtigte

    gilt Absatz 1 in Bezug auf Geräte, die nach diesem Zeitpunkt in Verkehr gebracht werden.

    (4) Der Hersteller darf die Kosten für die Entsorgung von Elektro- und Elektronikgeräten gegenüber dem

    Endkunden nicht ausweisen.'
