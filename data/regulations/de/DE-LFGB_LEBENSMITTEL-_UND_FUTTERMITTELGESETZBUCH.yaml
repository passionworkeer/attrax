- id: art-1
  title: Ein Service des Bundesministerium der Justiz und für Verbrau
  text: 'Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Lebensmittel-, Bedarfsgegenstände- und

    1)2)3)

    Futtermittelgesetzbuch (Lebensmittel- und

    Futtermittelgesetzbuch - LFGB)

    LFGB

    Ausfertigungsdatum: 01.09.2005

    Vollzitat:

    "Lebensmittel- und Futtermittelgesetzbuch in der Fassung der Bekanntmachung vom 15. September 2021 (BGBl.

    I S. 4253, 2022 I S. 28), das zuletzt durch Artikel 3 des Gesetzes vom 3. Februar 2026 (BGBl. 2026 I Nr. 29)

    geändert worden ist"

    Stand: Neugefasst durch Bek. v. 15.9.2021 I 4253, 2022 I 28;

    zuletzt geändert durch Art. 3 G v. 3.2.2026 I Nr. 29

    1) 1

    Das Gesetz dient der Umsetzung der in der Anlage zu Fußnote ) des Gesetzes zur Neuordnung des

    Lebensmittel- und des Futtermittelrechts vom 1. September 2005 (BGBl. I S. 2618, 3007) in den Nummern

    1 bis 72 und 75 aufgeführten Rechtsakte.

    2) Die Verpflichtungen aus der Richtlinie 98/34/EG des Europäischen Parlaments und des Rates vom 22. Juni

    1998 über ein Informationsverfahren auf dem Gebiet der Normen und technischen Vorschriften und der

    Vorschriften für die Dienste der Informationsgesellschaft (ABl. L 204 vom 21.7.1998, S. 37), die zuletzt

    durch die Richtlinie 2006/96/EG (ABl. L 363 vom 20.12.2006, S. 81) geändert worden ist, sind beachtet

    worden.

    3) Das Gesetz dient der Umsetzung der Richtlinie 2008/112/EG des Europäischen Parlaments und des Rates

    vom 16. Dezember 2008 zur Änderung der Richtlinien 76/768/EWG, 88/378/EWG und 1999/13/EG des

    Rates sowie der Richtlinien 2000/53/EG, 2002/96/EG und 2004/42/EG des Europäischen Parlaments

    und des Rates zwecks ihrer Anpassung an die Verordnung (EG) Nr. 1272/2008 über die Einstufung,

    Kennzeichnung und Verpackung von Stoffen und Gemischen (ABl. L 345 vom 23.12.2008, S. 68).

    Fußnote

    (+++ Textnachweis ab: 7.9.2005 +++)

    Das G wurde als Artikel 1 d. G v. 1.9.2005 I 2618 vom Bundestag mit der Mehrheit seiner Mitglieder und mit

    Zustimmung des Bundesrates beschlossen. Es ist gem. Art. 9 dieses G am 7.9.2005 in Kraft getreten.

