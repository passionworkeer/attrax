  title: Ein Service des Bundesministerium der Justiz und für Verbrau
  text: 'Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Gesetz über den Schutz von Marken und sonstigen Kennzeichen

    (Markengesetz - MarkenG)

    MarkenG

    Ausfertigungsdatum: 25.10.1994

    Vollzitat:

    "Markengesetz vom 25. Oktober 1994 (BGBl. I S. 3082; 1995 I S. 156); 1996 I S. 682), das zuletzt durch Artikel 14

    des Gesetzes vom 20. Mai 2026 (BGBl. 2026 I Nr. 152) geändert worden ist"

    Stand: Zuletzt geändert durch Art. 14 G v. 20.5.2026 I Nr. 152

    Die §§ 119 bis 125 sind gem. Bek. v. 24.4.1996 I 682 mWv 20.3.1996 in Kraft getreten.

    Fußnote

    (+++ Textnachweis ab: 1.1.1995 +++)

    (+++ Amtlicher Hinweis des Normgebers auf EG-Recht:

    Umsetzung der

    EWGRL 104/89 (CELEX Nr: 389L0104) +++)

    (+++ EU-Vollzitate: vgl. Liste EU-Rechtsakte G v. 11.1.2026 I Nr. 9 +++)

    Das G wurde als Artikel 1 G (423-5-1) v. 25.10.1994 I 3082 vom Bundestag mit Zustimmung des Bundesrates

    beschlossen. Es ist gem. Art. 50 Abs. 3 dieses G nach Maßgabe der Abs. 1 und 2 mWv 1.1.1995 in Kraft getreten.

