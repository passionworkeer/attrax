  title: Ein Service des Bundesministerium der Justiz und für Verbrau
  text: 'Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Bundesdatenschutzgesetz (BDSG)

    BDSG

    Ausfertigungsdatum: 30.06.2017

    Vollzitat:

    "Bundesdatenschutzgesetz vom 30. Juni 2017 (BGBl. I S. 2097), das zuletzt durch Artikel 3 des Gesetzes vom 3.

    Juli 2026 (BGBl. 2026 I Nr. 199) geändert worden ist"

    Stand: Zuletzt geändert durch Art. 3 G v. 12.5.2026 I Nr. 139

    Hinweis: Änderung durch Art. 3 G v. 3.7.2026 I Nr. 199 textlich nachgewiesen, dokumentarisch noch nicht

    abschließend bearbeitet

    Ersetzt G 204-3 v. 20.12.1990 I 2954, 2955 (BDSG 1990)

    Fußnote

    (+++ Textnachweis ab: 25.5.2018 +++)

    (+++ Zur Anwendung vgl. §§ 4 Abs. 4, 12 Abs. 3, 16 Abs. 5, 26 Abs. 3,

    38 Abs. 2, 40 Abs. 3 u. 5, 56 Abs. 4, 65 Abs. 7, 66 Abs. 6, 75 Abs. 3,

    80 Abs. 3, 81 Abs. 3, 84, 85 Abs. 2 u. 3 +++)

    (+++ § 22 Abs. 2: zur Anwendung vgl. § 10 HinSchG +++)

    (+++ EU-Vollzitate: vgl. Liste EU-Rechtsakte G v. 12.5.2026 I Nr. 139 +++)

    Das G wurde als Art. 1 des G v. 30.6.2017 I 2097 vom Bundestag mit Zustimmung des Bundesrates beschlossen.

    Es ist gem. Art. 8 Abs. 1 Satz 1 dieses G am 25.5.2018 in Kraft getreten.

