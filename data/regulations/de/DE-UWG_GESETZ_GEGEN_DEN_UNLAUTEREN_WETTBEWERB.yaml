    Kapitel 1

    Allgemeine Bestimmungen'
- id: art-2
  title: § 1 Zweck des Gesetzes; Anwendungsbereich
  text: '§ 1 Zweck des Gesetzes; Anwendungsbereich

    (1) Dieses Gesetz dient dem Schutz der Mitbewerber, der Verbraucher sowie der sonstigen Marktteilnehmer

    vor unlauteren geschäftlichen Handlungen. Es schützt zugleich das Interesse der Allgemeinheit an einem

    unverfälschten Wettbewerb.

    (2) Vorschriften zur Regelung besonderer Aspekte unlauterer geschäftlicher Handlungen gehen bei der

    Beurteilung, ob eine unlautere geschäftliche Handlung vorliegt, den Regelungen dieses Gesetzes vor.'
- id: art-3
  title: § 2 Begriffsbestimmungen
  text: '§ 2 Begriffsbestimmungen

    - Seite 1 von 18 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    (1) Im Sinne dieses Gesetzes ist

    1. „geschäftliche Entscheidung“ jede Entscheidung eines Verbrauchers oder sonstigen Marktteilnehmers

    darüber, ob, wie und unter welchen Bedingungen er ein Geschäft abschließen, eine Zahlung leisten,

    eine Ware oder Dienstleistung behalten oder abgeben oder ein vertragliches Recht im Zusammenhang

    mit einer Ware oder Dienstleistung ausüben will, unabhängig davon, ob der Verbraucher oder sonstige

    Marktteilnehmer sich entschließt, tätig zu werden;

    2. „geschäftliche Handlung“ jedes Verhalten einer Person zugunsten des eigenen oder eines fremden

    Unternehmens vor, bei oder nach einem Geschäftsabschluss, das mit der Förderung des Absatzes

    oder des Bezugs von Waren oder Dienstleistungen oder mit dem Abschluss oder der Durchführung

    eines Vertrags über Waren oder Dienstleistungen unmittelbar und objektiv zusammenhängt; als Waren

    gelten auch Grundstücke und digitale Inhalte, Dienstleistungen sind auch digitale Dienstleistungen, als

    Dienstleistungen gelten auch Rechte und Verpflichtungen;

    3. „Marktteilnehmer“ neben Mitbewerber und Verbraucher auch jede weitere Person, die als Anbieter oder

    Nachfrager von Waren oder Dienstleistungen tätig ist;

    4. „Mitbewerber“ jeder Unternehmer, der mit einem oder mehreren Unternehmern als Anbieter oder

    Nachfrager von Waren oder Dienstleistungen in einem konkreten Wettbewerbsverhältnis steht;

    5. „Nachricht“ jede Information, die zwischen einer endlichen Zahl von Beteiligten über einen öffentlich

    zugänglichen elektronischen Kommunikationsdienst ausgetauscht oder weitergeleitet wird; nicht umfasst

    sind Informationen, die als Teil eines Rundfunkdienstes über ein elektronisches Kommunikationsnetz

    an die Öffentlichkeit weitergeleitet werden, soweit diese Informationen nicht mit dem identifizierbaren

    Teilnehmer oder Nutzer, der sie erhält, in Verbindung gebracht werden können;

    6. „Online-Marktplatz“ ein Dienst, der es Verbrauchern ermöglicht, durch die Verwendung von Software, die

    von einem Unternehmer oder in dessen Namen betrieben wird, einschließlich einer Website, eines Teils

    einer Website oder einer Anwendung, Fernabsatzverträge (§ 312c des Bürgerlichen Gesetzbuchs) mit

    anderen Unternehmern oder Verbrauchern abzuschließen;

    7. „Ranking“ die von einem Unternehmer veranlasste relative Hervorhebung von Waren oder

    Dienstleistungen, unabhängig von den hierfür verwendeten technischen Mitteln;

    8. „Unternehmer“ jede natürliche oder juristische Person, die geschäftliche Handlungen im Rahmen ihrer

    gewerblichen, handwerklichen oder beruflichen Tätigkeit vornimmt, und jede Person, die im Namen oder

    Auftrag einer solchen Person handelt;

    9. „unternehmerische Sorgfalt“ der Standard an Fachkenntnissen und Sorgfalt, von dem billigerweise

    angenommen werden kann, dass ein Unternehmer ihn in seinem Tätigkeitsbereich gegenüber

    Verbrauchern nach Treu und Glauben unter Berücksichtigung der anständigen Marktgepflogenheiten

    einhält;

    10. „Verhaltenskodex“ jede Vereinbarung oder Vorschrift über das Verhalten von Unternehmern, zu welchem

    diese sich in Bezug auf Wirtschaftszweige oder einzelne geschäftliche Handlungen verpflichtet haben,

    ohne dass sich solche Verpflichtungen aus Gesetzes- oder Verwaltungsvorschriften ergeben;

    11. „wesentliche Beeinflussung des wirtschaftlichen Verhaltens des Verbrauchers“ die Vornahme einer

    geschäftlichen Handlung, um die Fähigkeit des Verbrauchers, eine informierte Entscheidung zu treffen,

    spürbar zu beeinträchtigen und damit den Verbraucher zu einer geschäftlichen Entscheidung zu

    veranlassen, die er andernfalls nicht getroffen hätte.

    (2) Für den Verbraucherbegriff ist § 13 des Bürgerlichen Gesetzbuchs entsprechend anwendbar.'
- id: art-4
  title: § 3 Verbot unlauterer geschäftlicher Handlungen
  text: '§ 3 Verbot unlauterer geschäftlicher Handlungen

    (1) Unlautere geschäftliche Handlungen sind unzulässig.

    (2) Geschäftliche Handlungen, die sich an Verbraucher richten oder diese erreichen, sind unlauter, wenn sie

    nicht der unternehmerischen Sorgfalt entsprechen und dazu geeignet sind, das wirtschaftliche Verhalten des

    Verbrauchers wesentlich zu beeinflussen.

    (3) Die im Anhang dieses Gesetzes aufgeführten geschäftlichen Handlungen gegenüber Verbrauchern sind stets

    unzulässig.

    - Seite 2 von 18 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    (4) Bei der Beurteilung von geschäftlichen Handlungen gegenüber Verbrauchern ist auf den durchschnittlichen

    Verbraucher oder, wenn sich die geschäftliche Handlung an eine bestimmte Gruppe von Verbrauchern wendet,

    auf ein durchschnittliches Mitglied dieser Gruppe abzustellen. Geschäftliche Handlungen, die für den Unternehmer

    vorhersehbar das wirtschaftliche Verhalten nur einer eindeutig identifizierbaren Gruppe von Verbrauchern

    wesentlich beeinflussen, die auf Grund von geistigen oder körperlichen Beeinträchtigungen, Alter oder

    Leichtgläubigkeit im Hinblick auf diese geschäftlichen Handlungen oder die diesen zugrunde liegenden Waren

    oder Dienstleistungen besonders schutzbedürftig sind, sind aus der Sicht eines durchschnittlichen Mitglieds dieser

    Gruppe zu beurteilen.'
- id: art-5
  title: § 3a Rechtsbruch
  text: '§ 3a Rechtsbruch

    Unlauter handelt, wer einer gesetzlichen Vorschrift zuwiderhandelt, die auch dazu bestimmt ist, im Interesse der

    Marktteilnehmer das Marktverhalten zu regeln, und der Verstoß geeignet ist, die Interessen von Verbrauchern,

    sonstigen Marktteilnehmern oder Mitbewerbern spürbar zu beeinträchtigen.'
- id: art-6
  title: § 4 Mitbewerberschutz
  text: '§ 4 Mitbewerberschutz

    Unlauter handelt, wer

    1. die Kennzeichen, Waren, Dienstleistungen, Tätigkeiten oder persönlichen oder geschäftlichen Verhältnisse

    eines Mitbewerbers herabsetzt oder verunglimpft;

    2. über die Waren, Dienstleistungen oder das Unternehmen eines Mitbewerbers oder über den Unternehmer

    oder ein Mitglied der Unternehmensleitung Tatsachen behauptet oder verbreitet, die geeignet sind,

    den Betrieb des Unternehmens oder den Kredit des Unternehmers zu schädigen, sofern die Tatsachen

    nicht erweislich wahr sind; handelt es sich um vertrauliche Mitteilungen und hat der Mitteilende oder der

    Empfänger der Mitteilung an ihr ein berechtigtes Interesse, so ist die Handlung nur dann unlauter, wenn

    die Tatsachen der Wahrheit zuwider behauptet oder verbreitet wurden;

    3. Waren oder Dienstleistungen anbietet, die eine Nachahmung der Waren oder Dienstleistungen eines

    Mitbewerbers sind, wenn er

    a) eine vermeidbare Täuschung der Abnehmer über die betriebliche Herkunft herbeiführt,

    b) die Wertschätzung der nachgeahmten Ware oder Dienstleistung unangemessen ausnutzt oder

    beeinträchtigt oder

    c) die für die Nachahmung erforderlichen Kenntnisse oder Unterlagen unredlich erlangt hat;

    4. Mitbewerber gezielt behindert.'
- id: art-7
  title: § 4a Aggressive geschäftliche Handlungen
  text: '§ 4a Aggressive geschäftliche Handlungen

    (1) Unlauter handelt, wer eine aggressive geschäftliche Handlung vornimmt, die geeignet ist, den Verbraucher

    oder sonstigen Marktteilnehmer zu einer geschäftlichen Entscheidung zu veranlassen, die dieser andernfalls nicht

    getroffen hätte. Eine geschäftliche Handlung ist aggressiv, wenn sie im konkreten Fall unter Berücksichtigung

    aller Umstände geeignet ist, die Entscheidungsfreiheit des Verbrauchers oder sonstigen Marktteilnehmers

    erheblich zu beeinträchtigen durch

    1. Belästigung,

    2. Nötigung einschließlich der Anwendung körperlicher Gewalt oder

    3. unzulässige Beeinflussung.

    Eine un zulässige Beeinflussung liegt vor, wenn der Unternehmer eine Machtposition gegenüber dem Verbraucher

    oder sonstigen Marktteilnehmer zur Ausübung von Druck, auch ohne Anwendung oder Androhung von

    körperlicher Gewalt, in einer Weise ausnutzt, die die Fähigkeit des Verbrauchers oder sonstigen Marktteilnehmers

    zu einer informierten Entscheidung wesentlich einschränkt.

    (2) Bei der Feststellung, ob eine geschäftliche Handlung aggressiv im Sinne des Absatzes 1 Satz 2 ist, ist

    abzustellen auf

    1. Zeitpunkt, Ort, Art oder Dauer der Handlung;

    2. die Verwendung drohender oder beleidigender Formulierungen oder Verhaltensweisen;

    - Seite 3 von 18 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    3. die bewusste Ausnutzung von konkreten Unglückssituationen oder Umständen von solcher Schwere, dass

    sie das Urteilsvermögen des Verbrauchers oder sonstigen Marktteilnehmers beeinträchtigen, um dessen

    Entscheidung zu beeinflussen;

    4. belastende oder unverhältnismäßige Hindernisse nichtvertraglicher Art, mit denen der Unternehmer den

    Verbraucher oder sonstigen Marktteilnehmer an der Ausübung seiner vertraglichen Rechte zu hindern

    versucht, wozu auch das Recht gehört, den Vertrag zu kündigen oder zu einer anderen Ware oder

    Dienstleistung oder einem anderen Unternehmer zu wechseln;

    5. Drohungen mit rechtlich unzulässigen Handlungen.

    Zu den Umständen, die nach Nummer 3 zu berücksichtigen sind, zählen insbesondere geistige und körperliche

    Beeinträchtigungen, das Alter, die geschäftliche Unerfahrenheit, die Leichtgläubigkeit, die Angst und die

    Zwangslage von Verbrauchern.'
- id: art-8
  title: § 5 Irreführende geschäftliche Handlungen
  text: '§ 5 Irreführende geschäftliche Handlungen

    (1) Unlauter handelt, wer eine irreführende geschäftliche Handlung vornimmt, die geeignet ist, den Verbraucher

    oder sonstigen Marktteilnehmer zu einer geschäftlichen Entscheidung zu veranlassen, die er andernfalls nicht

    getroffen hätte.

    (2) Eine geschäftliche Handlung ist irreführend, wenn sie unwahre Angaben enthält oder sonstige zur Täuschung

    geeignete Angaben über folgende Umstände enthält:

    1. die wesentlichen Merkmale der Ware oder Dienstleistung wie Verfügbarkeit, Art, Ausführung, Vorteile,

    Risiken, Zusammensetzung, Zubehör, Verfahren oder Zeitpunkt der Herstellung, Lieferung oder

    Erbringung, Zwecktauglichkeit, Verwendungsmöglichkeit, Menge, Beschaffenheit, Kundendienst

    und Beschwerdeverfahren, geographische oder betriebliche Herkunft, von der Verwendung zu

    erwartende Ergebnisse oder die Ergebnisse oder wesentlichen Bestandteile von Tests der Waren oder

    Dienstleistungen;

    2. den Anlass des Verkaufs wie das Vorhandensein eines besonderen Preisvorteils, den Preis oder die Art

    und Weise, in der er berechnet wird, oder die Bedingungen, unter denen die Ware geliefert oder die

    Dienstleistung erbracht wird;

    3. die Person, Eigenschaften oder Rechte des Unternehmers wie Identität, Vermögen einschließlich der

    Rechte des geistigen Eigentums, den Umfang von Verpflichtungen, Befähigung, Status, Zulassung,

    Mitgliedschaften oder Beziehungen, Auszeichnungen oder Ehrungen, Beweggründe für die geschäftliche

    Handlung oder die Art des Vertriebs;

    4. Aussagen oder Symbole, die im Zusammenhang mit direktem oder indirektem Sponsoring stehen oder

    sich auf eine Zulassung des Unternehmers oder der Waren oder Dienstleistungen beziehen;

    5. die Notwendigkeit einer Leistung, eines Ersatzteils, eines Austauschs oder einer Reparatur;

    6. die Einhaltung eines Verhaltenskodexes, auf den sich der Unternehmer verbindlich verpflichtet hat, wenn

    er auf diese Bindung hinweist, oder

    7. Rechte des Verbrauchers, insbesondere solche auf Grund von Garantieversprechen oder

    Gewährleistungsrechte bei Leistungsstörungen.

    (3) Eine geschäftliche Handlung ist auch irreführend, wenn

    1. sie im Zusammenhang mit der Vermarktung von Waren oder Dienstleistungen einschließlich

    vergleichender Werbung eine Verwechslungsgefahr mit einer anderen Ware oder Dienstleistung oder mit

    der Marke oder einem anderen Kennzeichen eines Mitbewerbers hervorruft oder

    2. mit ihr eine Ware in einem Mitgliedstaat der Europäischen Union als identisch mit einer in anderen

    Mitgliedstaaten der Europäischen Union auf dem Markt bereitgestellten Ware vermarktet wird, obwohl sich

    diese Waren in ihrer Zusammensetzung oder in ihren Merkmalen wesentlich voneinander unterscheiden,

    sofern dies nicht durch legitime und objektive Faktoren gerechtfertigt ist.

    (4) Angaben im Sinne von Absatz 2 sind auch Angaben im Rahmen vergleichender Werbung sowie bildliche

    Darstellungen und sonstige Veranstaltungen, die darauf zielen und geeignet sind, solche Angaben zu ersetzen.

    (5) Es wird vermutet, dass es irreführend ist, mit der Herabsetzung eines Preises zu werben, sofern der Preis

    nur für eine unangemessen kurze Zeit gefordert worden ist. Ist streitig, ob und in welchem Zeitraum der Preis

    gefordert worden ist, so trifft die Beweislast denjenigen, der mit der Preisherabsetzung geworben hat.

    - Seite 4 von 18 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    (6) Eine geschäftliche Handlung, die gegen § 312d Absatz 2 Satz 2 des Bürgerlichen Gesetzbuchs verstößt, ist

    irreführend.'
- id: art-9
  title: § 5a Irreführung durch Unterlassen
  text: '§ 5a Irreführung durch Unterlassen

    (1) Unlauter handelt auch, wer einen Verbraucher oder sonstigen Marktteilnehmer irreführt, indem er ihm eine

    wesentliche Information vorenthält,

    1. die der Verbraucher oder der sonstige Marktteilnehmer nach den jeweiligen Umständen benötigt, um eine

    informierte geschäftliche Entscheidung zu treffen, und

    2. deren Vorenthalten dazu geeignet ist, den Verbraucher oder den sonstigen Marktteilnehmer zu einer

    geschäftlichen Entscheidung zu veranlassen, die er andernfalls nicht getroffen hätte.

    (2) Als Vorenthalten gilt auch

    1. das Verheimlichen wesentlicher Informationen,

    2. die Bereitstellung wesentlicher Informationen in unklarer, unverständlicher oder zweideutiger Weise sowie

    3. die nicht rechtzeitige Bereitstellung wesentlicher Informationen.

    (3) Bei der Beurteilung, ob wesentliche Informationen vorenthalten wurden, sind zu berücksichtigen:

    1. räumliche oder zeitliche Beschränkungen durch das für die geschäftliche Handlung gewählte

    Kommunikationsmittel sowie

    2. alle Maßnahmen des Unternehmers, um dem Verbraucher oder sonstigen Marktteilnehmer

    die Informationen auf andere Weise als durch das für die geschäftliche Handlung gewählte

    Kommunikationsmittel zur Verfügung zu stellen.

    (4) Unlauter handelt auch, wer den kommerziellen Zweck einer geschäftlichen Handlung nicht kenntlich macht,

    sofern sich dieser nicht unmittelbar aus den Umständen ergibt, und das Nichtkenntlichmachen geeignet ist,

    den Verbraucher oder sonstigen Marktteilnehmer zu einer geschäftlichen Entscheidung zu veranlassen, die er

    andernfalls nicht getroffen hätte. Ein kommerzieller Zweck liegt bei einer Handlung zugunsten eines fremden

    Unternehmens nicht vor, wenn der Handelnde kein Entgelt oder keine ähnliche Gegenleistung für die Handlung

    von dem fremden Unternehmen erhält oder sich versprechen lässt. Der Erhalt oder das Versprechen einer

    Gegenleistung wird vermutet, es sei denn der Handelnde macht glaubhaft, dass er eine solche nicht erhalten hat.'
- id: art-10
  title: § 5b Wesentliche Informationen
  text: '§ 5b Wesentliche Informationen

    (1) Werden Waren oder Dienstleistungen unter Hinweis auf deren Merkmale und Preis in einer dem verwendeten

    Kommunikationsmittel angemessenen Weise so angeboten, dass ein durchschnittlicher Verbraucher das Geschäft

    abschließen kann, so gelten die folgenden Informationen als wesentlich im Sinne des § 5a Absatz 1, sofern sie sich

    nicht unmittelbar aus den Umständen ergeben:

    1. alle wesentlichen Merkmale der Ware oder Dienstleistung in dem der Ware oder Dienstleistung und dem

    verwendeten Kommunikationsmittel angemessenen Umfang,

    2. die Identität und Anschrift des Unternehmers, gegebenenfalls die Identität und Anschrift desjenigen

    Unternehmers, für den er handelt,

    3. der Gesamtpreis oder in Fällen, in denen ein solcher Preis auf Grund der Beschaffenheit der Ware oder

    Dienstleistung nicht im Voraus berechnet werden kann, die Art der Preisberechnung sowie gegebenenfalls

    alle zusätzlichen Fracht-, Liefer- und Zustellkosten oder in Fällen, in denen diese Kosten nicht im Voraus

    berechnet werden können, die Tatsache, dass solche zusätzlichen Kosten anfallen können,

    4. Zahlungs-, Liefer- und Leistungsbedingungen, soweit diese von den Erfordernissen unternehmerischer

    Sorgfalt abweichen,

    5. das Bestehen des Rechts auf Rücktritt oder Widerruf und

    6. bei Waren oder Dienstleistungen, die über einen Online-Marktplatz angeboten werden, die Information, ob

    es sich bei dem Anbieter der Waren oder Dienstleistungen nach dessen eigener Erklärung gegenüber dem

    Betreiber des Online-Marktplatzes um einen Unternehmer handelt.

    - Seite 5 von 18 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    (2) Bietet ein Unternehmer Verbrauchern die Möglichkeit, nach Waren oder Dienstleistungen zu suchen, die von

    verschiedenen Unternehmern oder von Verbrauchern angeboten werden, so gelten unabhängig davon, wo das

    Rechtsgeschäft abgeschlossen werden kann, folgende allgemeine Informationen als wesentlich:

    1. die Hauptparameter zur Festlegung des Rankings der dem Verbraucher als Ergebnis seiner Suchanfrage

    präsentierten Waren oder Dienstleistungen sowie

    2. die relative Gewichtung der Hauptparameter zur Festlegung des Rankings im Vergleich zu anderen

    Parametern.

    Die Info rmationen nach Satz 1 müssen von der Anzeige der Suchergebnisse aus unmittelbar und leicht zugänglich

    sein. Die Sätze 1 und 2 gelten nicht für Betreiber von Online-Suchmaschinen im Sinne des Artikels 2 Nummer 6

    der Verordnung (EU) 2019/1150 des Europäischen Parlaments und des Rates vom 20. Juni 2019 zur Förderung

    von Fairness und Transparenz für gewerbliche Nutzer von Online-Vermittlungsdiensten (ABl. L 186 vom

    11.7.2019, S. 57).

    (3) Macht ein Unternehmer Bewertungen zugänglich, die Verbraucher im Hinblick auf Waren oder

    Dienstleistungen vorgenommen haben, so gelten als wesentlich Informationen darüber, ob und wie der

    Unternehmer sicherstellt, dass die veröffentlichten Bewertungen von solchen Verbrauchern stammen, die die

    Waren oder Dienstleistungen tatsächlich genutzt oder erworben haben.

    (4) Als wesentlich im Sinne des § 5a Absatz 1 gelten auch solche Informationen, die dem Verbraucher auf Grund

    unionsrechtlicher Verordnungen oder nach Rechtsvorschriften zur Umsetzung unionsrechtlicher Richtlinien für

    kommerzielle Kommunikation einschließlich Werbung und Marketing nicht vorenthalten werden dürfen.'
- id: art-11
  title: § 5c Verbotene Verletzung von Verbraucherinteressen durch unlautere geschäftliche Handlungen
  text: '§ 5c Verbotene Verletzung von Verbraucherinteressen durch unlautere geschäftliche Handlungen

    (1) Die Verletzung von Verbraucherinteressen durch unlautere geschäftliche Handlungen ist verboten, wenn

    es sich um einen weitverbreiteten Verstoß gemäß Artikel 3 Nummer 3 der Verordnung (EU) 2017/2394 des

    Europäischen Parlaments und des Rates vom 12. Dezember 2017 über die Zusammenarbeit zwischen den für

    die Durchsetzung der Verbraucherschutzgesetze zuständigen nationalen Behörden und zur Aufhebung der

    Verordnung (EG) Nr. 2006/2004 (ABl. L 345 vom 27.12.2017, S. 1), die zuletzt durch die Richtlinie (EU) 2019/771

    (ABl. L 136 vom 22.5.2019, S. 28; L 305 vom 26.11.2019, S. 66) geändert worden ist, oder einen weitverbreiteten

    Verstoß mit UnionsDimension gemäß Artikel 3 Nummer 4 der Verordnung (EU) 2017/2394 handelt.

    (2) Eine Verletzung von Verbraucherinteressen durch unlautere geschäftliche Handlungen im Sinne des Absatzes

    1 liegt vor, wenn

    1. eine unlautere geschäftliche Handlung nach § 3 Absatz 3 in Verbindung mit den Nummern 1 bis 31 des

    Anhangs vorgenommen wird,

    2. eine aggressive geschäftliche Handlung nach § 4a Absatz 1 Satz 1 vorgenommen wird,

    3. eine irreführende geschäftliche Handlung nach § 5 Absatz 1 oder § 5a Absatz 1 vorgenommen wird oder

    4. eine unlautere geschäftliche Handlung nach § 3 Absatz 1 fortgesetzt vorgenommen wird, die durch eine

    vollziehbare Anordnung der zuständigen Behörde im Sinne des Artikels 3 Nummer 6 der Verordnung (EU)

    2017/2394 oder durch eine vollstreckbare Entscheidung eines Gerichts untersagt worden ist, sofern die

    Handlung nicht bereits von den Nummern 1 bis 3 erfasst ist.

    (3) Eine Verletzung von Verbraucherinteressen durch unlautere geschäftliche Handlungen im Sinne des Absatzes

    1 liegt auch vor, wenn

    1. eine geschäftliche Handlung die tatsächlichen Voraussetzungen eines der in Absatz 2 geregelten Fälle

    erfüllt und

    2. auf die geschäftliche Handlung das nationale Recht eines anderen Mitgliedstaates der Europäischen

    Union anwendbar ist, welches eine Vorschrift enthält, die der jeweiligen in Absatz 2 genannten Vorschrift

    entspricht.'
- id: art-12
  title: § 6 Vergleichende Werbung
  text: '§ 6 Vergleichende Werbung

    (1) Vergleichende Werbung ist jede Werbung, die unmittelbar oder mittelbar einen Mitbewerber oder die von

    einem Mitbewerber angebotenen Waren oder Dienstleistungen erkennbar macht.

    - Seite 6 von 18 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    (2) Unlauter handelt, wer vergleichend wirbt, wenn der Vergleich

    1. sich nicht auf Waren oder Dienstleistungen für den gleichen Bedarf oder dieselbe Zweckbestimmung

    bezieht,

    2. nicht objektiv auf eine oder mehrere wesentliche, relevante, nachprüfbare und typische Eigenschaften

    oder den Preis dieser Waren oder Dienstleistungen bezogen ist,

    3. im geschäftlichen Verkehr zu einer Gefahr von Verwechslungen zwischen dem Werbenden und einem

    Mitbewerber oder zwischen den von diesen angebotenen Waren oder Dienstleistungen oder den von ihnen

    verwendeten Kennzeichen führt,

    4. den Ruf des von einem Mitbewerber verwendeten Kennzeichens in unlauterer Weise ausnutzt oder

    beeinträchtigt,

    5. die Waren, Dienstleistungen, Tätigkeiten oder persönlichen oder geschäftlichen Verhältnisse eines

    Mitbewerbers herabsetzt oder verunglimpft oder

    6. eine Ware oder Dienstleistung als Imitation oder Nachahmung einer unter einem geschützten Kennzeichen

    vertriebenen Ware oder Dienstleistung darstellt.'
- id: art-13
  title: § 7 Unzumutbare Belästigungen
  text: '§ 7 Unzumutbare Belästigungen

    (1) Eine geschäftliche Handlung, durch die ein Marktteilnehmer in unzumutbarer Weise belästigt wird, ist

    unzulässig. Dies gilt insbesondere für Werbung, obwohl erkennbar ist, dass der angesprochene Marktteilnehmer

    diese Werbung nicht wünscht.

    (2) Eine unzumutbare Belästigung ist stets anzunehmen

    1. bei Werbung mit einem Telefonanruf gegenüber einem Verbraucher ohne dessen vorherige ausdrückliche

    Einwilligung oder gegenüber einem sonstigen Marktteilnehmer ohne dessen zumindest mutmaßliche

    Einwilligung,

    2. bei Werbung unter Verwendung einer automatischen Anrufmaschine, eines Faxgerätes oder

    elektronischer Post, ohne dass eine vorherige ausdrückliche Einwilligung des Adressaten vorliegt, oder

    3. bei Werbung mit einer Nachricht,

    a) bei der die Identität des Absenders, in dessen Auftrag die Nachricht übermittelt wird, verschleiert

    oder verheimlicht wird oder

    b) bei der gegen § 6 Absatz 1 des Digitale-Dienste-Gesetzes verstoßen wird oder in der der

    Empfänger aufgefordert wird, eine Website aufzurufen, die gegen diese Vorschrift verstößt, oder

    c) bei der keine gültige Adresse vorhanden ist, an die der Empfänger eine Aufforderung

    zur Einstellung solcher Nachrichten richten kann, ohne dass hierfür andere als die

    Übermittlungskosten nach den Basistarifen entstehen.

    (3) Abweichend von Absatz 2 Nummer 2 ist eine unzumutbare Belästigung bei einer Werbung unter Verwendung

    elektronischer Post nicht anzunehmen, wenn

    1. ein Unternehmer im Zusammenhang mit dem Verkauf einer Ware oder Dienstleistung von dem Kunden

    dessen elektronische Postadresse erhalten hat,

    2. der Unternehmer die Adresse zur Direktwerbung für eigene ähnliche Waren oder Dienstleistungen

    verwendet,

    3. der Kunde der Verwendung nicht widersprochen hat und

    4. der Kunde bei Erhebung der Adresse und bei jeder Verwendung klar und deutlich darauf hingewiesen

    wird, dass er der Verwendung jederzeit widersprechen kann, ohne dass hierfür andere als die

    Übermittlungskosten nach den Basistarifen entstehen.'
- id: art-14
  title: § 7a Einwilligung in Telefonwerbung
  text: '§ 7a Einwilligung in Telefonwerbung

    (1) Wer mit einem Telefonanruf gegenüber einem Verbraucher wirbt, hat dessen vorherige ausdrückliche

    Einwilligung in die Telefonwerbung zum Zeitpunkt der Erteilung in angemessener Form zu dokumentieren und

    gemäß Absatz 2 Satz 1 aufzubewahren.

    - Seite 7 von 18 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    (2) Die werbenden Unternehmen müssen den Nachweis nach Absatz 1 ab Erteilung der Einwilligung sowie nach

    jeder Verwendung der Einwilligung fünf Jahre aufbewahren. Die werbenden Unternehmen haben der nach § 20

    Absatz 3 zuständigen Verwaltungsbehörde den Nachweis nach Absatz 1 auf Verlangen unverzüglich vorzulegen.

    Kapitel 2

    Rechtsfolgen'
- id: art-15
  title: § 8 Beseitigung und Unterlassung
  text: '§ 8 Beseitigung und Unterlassung

    (1) Wer eine nach § 3 oder § 7 unzulässige geschäftliche Handlung vornimmt, kann auf Beseitigung und bei

    Wiederholungsgefahr auf Unterlassung in Anspruch genommen werden. Der Anspruch auf Unterlassung besteht

    bereits dann, wenn eine derartige Zuwiderhandlung gegen § 3 oder § 7 droht.

    (2) Werden die Zuwiderhandlungen in einem Unternehmen von einem Mitarbeiter oder Beauftragten begangen,

    so sind der Unterlassungsanspruch und der Beseitigungsanspruch auch gegen den Inhaber des Unternehmens

    begründet.

    (3) Die Ansprüche aus Absatz 1 stehen zu:

    1. jedem Mitbewerber, der Waren oder Dienstleistungen in nicht unerheblichem Maße und nicht nur

    gelegentlich vertreibt oder nachfragt,

    2. denjenigen rechtsfähigen Verbänden zur Förderung gewerblicher oder selbstständiger beruflicher

    Interessen, die in der Liste der qualifizierten Wirtschaftsverbände nach § 8b eingetragen sind, soweit

    ihnen eine erhebliche Zahl von Unternehmern angehört, die Waren oder Dienstleistungen gleicher oder

    verwandter Art auf demselben Markt vertreiben, und die Zuwiderhandlung die Interessen ihrer Mitglieder

    berührt,

    3. den qualifizierten Verbraucherverbänden, die in der Liste nach § 4 des Unterlassungsklagengesetzes

    eingetragen sind, und den qualifizierten Einrichtungen aus anderen Mitgliedstaaten der Europäischen

    Union, die in dem Verzeichnis der Europäischen Kommission nach Artikel 5 Absatz 1 Satz 4 der

    Richtlinie (EU) 2020/1828 des Europäischen Parlaments und des Rates vom 25. November 2020 über

    Verbandsklagen zum Schutz der Kollektivinteressen der Verbraucher und zur Aufhebung der Richtlinie

    2009/22/EG (ABl. L 409 vom 4.12.2020, S. 1) eingetragen sind,

    4. den Industrie- und Handelskammern, den nach der Handwerksordnung errichteten Organisationen

    und anderen berufsständischen Körperschaften des öffentlichen Rechts im Rahmen der Erfüllung ihrer

    Aufgaben sowie den Gewerkschaften im Rahmen der Erfüllung ihrer Aufgaben bei der Vertretung

    selbstständiger beruflicher Interessen.

    (4) Stellen nach Absatz 3 Nummer 2 und 3 können die Ansprüche nicht geltend machen, solange ihre Eintragung

    ruht.

    (5) § 13 des Unterlassungsklagengesetzes ist entsprechend anzuwenden; in § 13 Absatz 1 und 3 Satz

    2 des Unterlassungsklagengesetzes treten an die Stelle der dort aufgeführten Ansprüche nach dem

    Unterlassungsklagengesetz die Ansprüche nach dieser Vorschrift. Macht eine anspruchsberechtigte Stelle

    nach Absatz 3 Nummer 3 Ansprüche nach Absatz 1 gerichtlich geltend, so sind die §§ 5a und 6a des

    Unterlassungsklagengesetzes entsprechend anzuwenden. Im Übrigen findet das Unterlassungsklagengesetz keine

    Anwendung, es sei denn, es liegt ein Fall des § 2a des Unterlassungsklagengesetzes vor.'
- id: art-16
  title: § 8a Anspruchsberechtigte bei einem Verstoß gegen die Verordnung (EU) 2019/1150
  text: '§ 8a Anspruchsberechtigte bei einem Verstoß gegen die Verordnung (EU) 2019/1150

    Anspruchsberechtigt nach § 8 Absatz 1 sind bei einem Verstoß gegen die Verordnung (EU) 2019/1150 des

    Europäischen Parlaments und des Rates vom 20. Juni 2019 zur Förderung von Fairness und Transparenz für

    gewerbliche Nutzer von Online-Vermittlungsdiensten (ABl. L 186 vom 11.7.2019, S. 57) abweichend von § 8

    Absatz 3 die Verbände, Organisationen und öffentlichen Stellen, die die Voraussetzungen des Artikels 14 Absatz 3

    und 4 der Verordnung (EU) 2019/1150 erfüllen.'
- id: art-17
  title: § 8b Liste der qualifizierten Wirtschaftsverbände
  text: '§ 8b Liste der qualifizierten Wirtschaftsverbände

    (1) Das Bundesamt für Justiz führt eine Liste der qualifizierten Wirtschaftsverbände und veröffentlicht sie in der

    jeweils aktuellen Fassung auf seiner Internetseite.

    - Seite 8 von 18 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    (2) Ein rechtsfähiger Verband, zu dessen satzungsmäßigen Aufgaben es gehört, gewerbliche oder selbstständige

    berufliche Interessen zu verfolgen und zu fördern sowie zu Fragen des lauteren Wettbewerbs zu beraten und zu

    informieren, wird auf seinen Antrag in die Liste eingetragen, wenn

    1. er mindestens 75 Unternehmer als Mitglieder hat,

    2. er zum Zeitpunkt der Antragstellung seit mindestens einem Jahr seine satzungsmäßigen Aufgaben

    wahrgenommen hat,

    3. auf Grund seiner bisherigen Tätigkeit sowie seiner personellen, sachlichen und finanziellen Ausstattung

    gesichert erscheint, dass er

    a) seine satzungsmäßigen Aufgaben auch künftig dauerhaft wirksam und sachgerecht erfüllen wird

    und

    b) seine Ansprüche nicht vorwiegend geltend machen wird, um für sich Einnahmen aus

    Abmahnungen oder Vertragsstrafen zu erzielen,

    4. seinen Mitgliedern keine Zuwendungen aus dem Verbandsvermögen gewährt werden und Personen, die

    für den Verband tätig sind, nicht durch unangemessen hohe Vergütungen oder andere Zuwendungen

    begünstigt werden.

    (3) Die Vorschriften für qualifizierte Verbraucherverbände in §'
