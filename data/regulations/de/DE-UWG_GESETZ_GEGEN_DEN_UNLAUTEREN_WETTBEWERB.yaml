- id: art-1
  title: Ein Service des Bundesministerium der Justiz und für Verbrau
  text: 'Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Gesetz gegen den unlauteren Wettbewerb (UWG)

    UWG

    Ausfertigungsdatum: 03.07.2004

    Vollzitat:

    "Gesetz gegen den unlauteren Wettbewerb in der Fassung der Bekanntmachung vom 3. März 2010 (BGBl. I S.

    254), das zuletzt durch Artikel 6 des Gesetzes vom 12. Mai 2026 (BGBl. 2026 I Nr. 139) geändert worden ist"

    Stand: Neugefasst durch Bek. v. 3.3.2010 I 254;

    Zuletzt geändert durch Art. 6 G v. 12.5.2026 I Nr. 139

    Dieses Gesetz dient der Umsetzung der Richtlinie 2005/29/EG des Europäischen Parlaments und des Rates vom

    11. Mai 2005 über unlautere Geschäftspraktiken von Unternehmen gegenüber Verbrauchern im Binnenmarkt

    und zur Änderung der Richtlinie 84/450/EWG des Rates, der Richtlinien 97/7/EG, 98/27/EG und 2002/65/EG des

    Europäischen Parlaments und des Rates sowie der Verordnung (EG) Nr. 2006/2004 des Europäischen Parlaments

    und des Rates (ABl. L 149 vom 11.6.2005, S. 22; berichtigt im ABl. L 253 vom 25.9.2009, S. 18) sowie der

    Richtlinie 2006/114/EG des Europäischen Parlaments und des Rates vom 12. Dezember 2006 über irreführende

    und vergleichende Werbung (kodifizierte Fassung) (ABl. L 376 vom 27.12.2006, S. 21). Es dient ferner der

    Umsetzung von Artikel 13 der Richtlinie 2002/58/EG des Europäischen Parlaments und des Rates vom 12. Juli

    2002 über die Verarbeitung personenbezogener Daten und den Schutz der Privatsphäre in der elektronischen

    Kommunikation (ABl. L 201 vom 31.7.2002, S. 37), der zuletzt durch Artikel 2 Nummer 7 der Richtlinie 2009/136/

    EG (ABl. L 337 vom 18.12.2009, S. 11) geändert worden ist.

    Die Verpflichtungen aus der Richtlinie 98/34/EG des Europäischen Parlaments und des Rates vom 22. Juni 1998

    über ein Informationsverfahren auf dem Gebiet der Normen und technischen Vorschriften und der Vorschriften

    für die Dienste der Informationsgesellschaft (ABl. L 204 vom 21.7.1998, S. 37), die zuletzt durch die Richtlinie

    2006/96/EG (ABl. L 363 vom 20.12.2006, S. 81) geändert worden ist, sind beachtet worden.

    Fußnote

