  title: Ein Service des Bundesministerium der Justiz und für Verbrau
  text: 'Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    *

    Gesetz über die Bereitstellung von Produkten auf dem Markt

    (Produktsicherheitsgesetz - ProdSG)

    ProdSG

    Ausfertigungsdatum: 27.07.2021

    Vollzitat:

    "Produktsicherheitsgesetz vom 27. Juli 2021 (BGBl. I S. 3146, 3147), das zuletzt durch Artikel 1 des Gesetzes vom

    3. Februar 2026 (BGBl. 2026 I Nr. 29) geändert worden ist"

    Stand: Zuletzt geändert durch Art. 1 G v. 3.2.2026 I Nr. 29

    Ersetzt V 8053-8 v. 8.11.2011 I 2178, 2179; 2012 I 131 (ProdSG 2011)

    * Dieses Gesetz dient der Umsetzung

    1. der Richtlinie 75/324/EWG des Rates vom 20. Mai 1975 zur Angleichung der Rechtsvorschriften

    der Mitgliedstaaten über Aerosolpackungen (ABl. L 147 vom 9.6.1975, S. 40), die zuletzt durch die

    Richtlinie (EU) 2016/2037 (ABl. L 314 vom 22.11.2016, S. 11) geändert worden ist,

    2. der Richtlinie 2000/14/EG des Europäischen Parlaments und des Rates vom 8. Mai 2000

    zur Angleichung der Rechtsvorschriften der Mitgliedstaaten über umweltbelastende

    Geräuschemissionen von zur Verwendung im Freien vorgesehenen Geräten und Maschinen (ABl.

    L 162 vom 3.7.2000, S. 1; L 311 vom 12.12.2000, S. 50), die zuletzt durch die Verordnung (EU)

    2019/1243 (ABl. L 198 vom 25.7.2019, S. 241) geändert worden ist,

    3. der Richtlinie 2001/95/EG des Europäischen Parlaments und des Rates vom 3. Dezember 2001

    über die allgemeine Produktsicherheit (ABl. L 11 vom 15.1.2002, S. 4), die zuletzt durch die

    Verordnung (EG) Nr. 596/2009 (ABl. L 188 vom 18.7.2009, S. 14) geändert worden ist,

    4. der Richtlinie 2006/42/EG des Europäischen Parlaments und des Rates vom 17. Mai 2006 über

    Maschinen und zur Änderung der Richtlinie 95/16/EG (ABl. L 157 vom 9.6.2006, S. 24; L 76 vom

    16.3.2007, S. 35), die zuletzt durch die Verordnung (EU) 2019/1243 (ABl. L 198 vom 25.7.2019, S.

    241) geändert worden ist,

    5. des Beschlusses Nr. 768/2008/EG des Europäischen Parlaments und des Rates vom 9. Juli 2008

    über einen gemeinsamen Rechtsrahmen für die Vermarktung von Produkten und zur Aufhebung

    des Beschlusses 93/465/EWG des Rates (ABl. L 218 vom 13.8.2008, S. 82),

    6. der Richtlinie 2009/48/EG des Europäischen Parlaments und des Rates vom 18. Juni 2009 über

    die Sicherheit von Spielzeug (ABl. L 170 vom 30.6.2009, S. 1; L 355 vom 31.12.2013, S. 92), die

    zuletzt durch die Richtlinie (EU) 2019/1929 (ABl. L 299 vom 20.11.2019, S. 51) geändert worden

    ist,

    7. der Richtlinie 2013/53/EU des Europäischen Parlaments und des Rates vom 20. November 2013

    über Sportboote und Wassermotorräder und zur Aufhebung der Richtlinie 94/25/EG (ABl. L 354

    vom 28.12.2013, S. 90; L 297 vom 13.11.2015, S. 9),

    8. der Richtlinie 2014/29/EU des Europäischen Parlaments und des Rates vom 26. Februar 2014

    zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über die Bereitstellung einfacher

    Druckbehälter auf dem Markt (ABl. L 96 vom 29.3.2014, S. 45),

    9. der Richtlinie 2014/34/EU des Europäischen Parlaments und des Rates vom 26. Februar 2014 zur

    Harmonisierung der Rechtsvorschriften der Mitgliedstaaten für Geräte und Schutzsysteme zur

    bestimmungsgemäßen Verwendung in explosionsgefährdeten Bereichen (ABl. L 96 vom 29.3.2014,

    S. 309),

    10. der Richtlinie 2014/35/EU des Europäischen Parlaments und des Rates vom 26. Februar 2014 zur

    Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über die Bereitstellung elektrischer

    Betriebsmittel zur Verwendung innerhalb bestimmter Spannungsgrenzen auf dem Markt (ABl. L 96

    vom 29.3.2014, S. 357),

    - Seite 1 von 22 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    11. der Richtlinie 2014/33/EU des Europäischen Parlaments und des Rates vom 26. Februar 2014 zur

    Angleichung der Rechtsvorschriften der Mitgliedstaaten über Aufzüge und Sicherheitsbauteile für

    Aufzüge (ABl. L 96 vom 29.3.2014, S. 251),

    12. der Richtlinie 2014/68/EU des Europäischen Parlaments und des Rates vom 15. Mai 2014

    zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über die Bereitstellung von

    Druckgeräten auf dem Markt (ABl. L 189 vom 27.6.2014, S. 164; L 157 vom 23.6.2015, S. 112).

