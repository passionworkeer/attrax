- id: art-32
  title: § 1 Zweck und Anwendungsbereich
  text: '§ 1 Zweck und Anwendungsbereich

    (1) Dieses Gesetz dient der Umsetzung der im Folgenden genannten Richtlinien und ist anzuwenden, wenn

    im Rahmen einer Geschäftstätigkeit Produkte aus dem Anwendungsbereich dieser Richtlinien auf dem Markt

    bereitgestellt, ausgestellt oder erstmals verwendet werden:

    1. Richtlinie 75/324/EWG betreffend Aerosolpackungen,

    2. Richtlinie 2000/14/EG betreffend die Geräuschemissionen von zur Verwendung im Freien vorgesehenen

    Geräten und Maschinen,

    3. Richtlinie 2006/42/EG betreffend Maschinen,

    4. Richtlinie 2009/48/EG betreffend die Sicherheit von Spielzeug,

    5. Richtlinie 2013/53/EU betreffend Sportboote und Wassermotorräder,

    6. Richtlinie 2014/29/EU betreffend einfache Druckbehälter,

    7. Richtlinie 2014/33/EU betreffend Aufzüge,

    8. Richtlinie 2014/34/EU betreffend Geräte und Schutzsysteme zur bestimmungsgemäßen Verwendung in

    explosionsgefährdeten Bereichen,

    - Seite 3 von 22 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    9. Richtlinie 2014/35/EU betreffend die Bereitstellung elektrischer Betriebsmittel zur Verwendung innerhalb

    bestimmter Spannungsgrenzen auf dem Markt,

    10. Richtlinie 2014/68/EU betreffend Druckgeräte.

    (2) Die §§ 6, 8, 25 Absatz 3 und 10, § 28 Absatz 2 und 3 sowie § 29 dienen der Durchführung der Verordnung (EU)

    2023/988 in Bezug auf Produkte im Sinne von Artikel 3 Nummer 1 der Verordnung (EU) 2023/988. Dieses Gesetz

    gilt auch für das Ausstellen von solchen Produkten.

    (3) Dieses Gesetz ist mit Ausnahme der §§ 6, 25 Absatz 3 und 10 sowie des § 28 Absatz 2 außerdem anzuwenden,

    wenn im Rahmen einer Geschäftstätigkeit verwendungsfertige Produkte auf dem Markt bereitgestellt oder

    ausgestellt werden, die nicht der Verordnung (EU) 2023/988 unterliegen und die auch nicht durch andere

    Rechtsvorschriften der Europäischen Union, die Vorgaben für die Sicherheit von Produkten regeln, harmonisiert

    sind.

    (4) Dieses Gesetz ist, soweit es nicht der Durchführung der Verordnung (EU) 2023/988 dient, nicht anzuwenden

    auf

    1. Antiquitäten,

    2. gebrauchte Produkte, die vor ihrer Verwendung instandgesetzt oder wiederaufgearbeitet werden müssen,

    sofern der Wirtschaftsakteur denjenigen, an den sie abgegeben werden, darüber ausreichend unterrichtet,

    3. Produkte, die ihrer Bauart nach ausschließlich zur Verwendung für militärische Zwecke bestimmt sind, und

    4. Umschließungen, wie ortsbewegliche Druckgeräte, Verpackungen und Tanks, für die Beförderung

    gefährlicher Güter, sofern diese verkehrsrechtlichen Vorschriften unterliegen.

    (5) Dieses Gesetz ist im Rahmen der Vorgaben des Seerechtsübereinkommens der Vereinten Nationen vom

    10. Dezember 1982 (BGBl. 1994 II S. 1798, 1799) auch in der deutschen ausschließlichen Wirtschaftszone

    anzuwenden.

    (6) Dieses Gesetz ist im Übrigen anzuwenden, wenn im Rahmen einer Geschäftstätigkeit Produkte auf dem Markt

    bereitgestellt, ausgestellt oder erstmals verwendet werden, soweit nicht in anderen Rechtsvorschriften, die

    Vorgaben für die Sicherheit von Produkten regeln, entsprechende oder weitergehende Vorschriften vorgesehen

    werden.'
- id: art-33
  title: § 2 Begriffsbestimmungen
  text: '§ 2 Begriffsbestimmungen

    (1) Im Sinne dieses Gesetzes bedeutet

    1. Akkreditierung die Bestätigung durch eine nationale Akkreditierungsstelle, dass eine

    Konformitätsbewertungsstelle die in harmonisierten Normen festgelegten Anforderungen und

    gegebenenfalls zusätzliche Anforderungen, einschließlich solcher in relevanten sektoralen

    Akkreditierungssystemen, erfüllt, um eine spezielle Konformitätsbewertungstätigkeit durchzuführen,

    2. Ausstellen das Aufstellen oder Vorführen von Produkten zu Zwecken der Werbung,

    3. Aussteller jede natürliche oder juristische Person, die ein Produkt ausstellt,

    4. Bereitstellung auf dem Markt jede entgeltliche oder unentgeltliche Abgabe eines Produkts zum Vertrieb,

    zum Verbrauch oder zur Verwendung auf dem Unionsmarkt im Rahmen einer Geschäftstätigkeit,

    5. bestimmungsgemäße Verwendung

    a) die Verwendung, für die ein Produkt nach den Angaben derjenigen Person, die es in den Verkehr

    bringt, vorgesehen ist oder

    b) die übliche Verwendung, die sich aus der Bauart und der Ausführung des Produkts ergibt,

    6. Bevollmächtigter jede in der Europäischen Union ansässige natürliche oder juristische Person, die

    vom Hersteller schriftlich beauftragt wurde, in seinem Namen bestimmte Aufgaben in Erfüllung der

    einschlägigen Harmonisierungsrechtsvorschriften der Europäischen Union oder der Anforderungen dieses

    Gesetzes wahrzunehmen,

    7. CE-Kennzeichnung die Kennzeichnung, durch die der Hersteller erklärt, dass das Produkt den geltenden

    Anforderungen genügt, die in den Harmonisierungsrechtsvorschriften der Europäischen Union festgelegt

    sind, die die Anbringung der CE-Kennzeichnung vorschreiben,

    - Seite 4 von 22 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    8. Einführer jede in der Europäischen Union ansässige natürliche oder juristische Person, die ein Produkt

    einführt,

    9. Einfuhr die erstmalige Bereitstellung eines Produktes aus einem Drittstaat auf dem Unionsmarkt; dabei

    werden gebrauchte Produkte wie neue Produkte behandelt,

    10. ernstes Risiko, dass ein Produkt ein Risiko birgt, bei dem das Verhältnis zwischen der

    Eintrittswahrscheinlichkeit einer Gefahr, die einen Schaden verursacht, und der Schwere des Schadens

    auf der Grundlage einer Risikobewertung und unter Berücksichtigung der normalen und vorhersehbaren

    Verwendung des Produkts ein rasches Eingreifen der Marktüberwachungsbehörden erforderlich macht,

    auch wenn das Risiko keine unmittelbare Auswirkung hat,

    11. GS-Stelle eine Konformitätsbewertungsstelle, der von der Befugnis erteilenden Behörde die Befugnis

    erteilt wurde, das GS-Zeichen zuzuerkennen,

    12. Händler jede natürliche oder juristische Person in der Lieferkette, die ein Produkt auf dem Markt

    bereitstellt, mit Ausnahme des Herstellers und des Einführers,

    13. harmonisierte Norm eine Norm im Sinne des Artikels 2 Nummer 1 Buchstabe c der Verordnung (EU) Nr.

    1025/2012,

    14. Hersteller jede natürliche oder juristische Person, die ein Produkt herstellt oder entwickeln oder herstellen

    lässt und dieses Produkt in ihrem eigenen Namen oder unter ihrer eigenen Handelsmarke vermarktet; als

    Hersteller gilt auch jeder, der

    a) geschäftsmäßig seinen Namen, seine Handelsmarke oder ein anderes unterscheidungskräftiges

    Kennzeichen an einem Produkt anbringt und sich dadurch als Hersteller ausgibt oder

    b) ein Produkt wiederaufarbeitet oder die Sicherheitseigenschaften eines Verbraucherprodukts

    beeinflusst und dieses anschließend auf dem Markt bereitstellt,

    15. Inverkehrbringen die erstmalige Bereitstellung eines Produkts auf dem Unionsmarkt,

    16. Konformitätsbewertung das Verfahren zur Bewertung, ob spezifische Anforderungen an ein Produkt, ein

    Verfahren, eine Dienstleistung, ein System, eine Person oder eine Stelle erfüllt worden sind,

    17. Konformitätsbewertungsstelle eine Stelle, die Konformitätsbewertungstätigkeiten einschließlich

    Kalibrierungen, Prüfungen, Zertifizierungen und Inspektionen durchführt,

    18. notifizierte Stelle eine Konformitätsbewertungsstelle,

    a) der die Befugnis erteilende Behörde die Befugnis erteilt hat, Konformitätsbewertungsaufgaben

    nach den Rechtsverordnungen nach § 8 Absatz 1, die erlassen wurden, um Rechtsvorschriften

    der Europäischen Union umzusetzen oder durchzuführen, wahrzunehmen, und die von der

    Befugnis erteilenden Behörde der Europäischen Kommission und den anderen Mitgliedstaaten der

    Europäischen Union notifiziert worden ist oder

    b) die der Europäischen Kommission und den anderen Mitgliedstaaten der Europäischen Union von

    einem Mitgliedstaat der Europäischen Union oder einem anderen Vertragsstaat des Abkommens

    über den Europäischen Wirtschaftsraum auf Grund eines europäischen Rechtsaktes als notifizierte

    Stelle mitgeteilt worden ist,

    19. Notifizierung die Mitteilung der Befugnis erteilenden Behörde an die Europäische Kommission und

    die anderen Mitgliedstaaten der Europäischen Union, dass eine Konformitätsbewertungsstelle

    Konformitätsbewertungsaufgaben gemäß den nach § 8 Absatz 1 zur Umsetzung oder Durchführung von

    Rechtsvorschriften der Europäischen Union erlassenen Rechtsverordnungen wahrnehmen kann,

    20. Produkt ein Gegenstand, der durch einen Fertigungsprozess hergestellt worden ist,

    21. Risiko die Kombination aus der Eintrittswahrscheinlichkeit einer Gefahr, die einen Schaden verursacht,

    und der Schwere des möglichen Schadens,

    22. Rücknahme vom Markt jede Maßnahme, mit der verhindert werden soll, dass ein in der Lieferkette

    befindliches Produkt auf dem Unionsmarkt bereitgestellt wird,

    23. Rückruf jede Maßnahme, die auf Erwirkung der Rückgabe eines dem Endnutzer bereits bereitgestellten

    Produkts abzielt,

    24. verwendungsfertig, wenn ein Produkt bestimmungsgemäß verwendet werden kann, ohne dass weitere

    Teile eingefügt werden müssen; verwendungsfertig ist ein Produkt auch, wenn

    - Seite 5 von 22 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    a) alle Teile, aus denen es zusammengesetzt werden soll, zusammen von einer Person in den

    Verkehr gebracht werden,

    b) es nur noch aufgestellt oder angeschlossen werden muss oder

    c) es ohne die Teile in den Verkehr gebracht wird, die üblicherweise gesondert beschafft und bei der

    bestimmungsgemäßen Verwendung eingefügt werden,

    25. vorhersehbare Verwendung die Verwendung eines Produkts in einer Weise, die von derjenigen Person, die

    es in den Verkehr bringt, nicht vorgesehen, jedoch nach vernünftigem Ermessen vorhersehbar ist,

    26. Wirtschaftsakteur der Hersteller, Bevollmächtigte, Einführer, Händler oder jede andere natürliche oder

    juristische Person, die Verpflichtungen im Zusammenhang mit der Herstellung von Produkten, deren

    Bereitstellung auf dem Markt oder deren Inbetriebnahme gemäß den einschlägigen Rechtsvorschriften

    unterliegt.

    (2) Soweit dieses Gesetz der Durchführung der Verordnung (EU) 2023/988 dient, sind bei seiner Anwendung die

    Begriffsbestimmungen nach der Verordnung (EU) 2023/988 maßgeblich. Davon abweichend gilt Absatz 1 Nummer

    23 auch für Produkte im Sinne von Artikel 3 Nummer 1 der Verordnung (EU) 2023/988.

    Abschnitt 2

    Voraussetzungen für die Bereitstellung von Produkten auf dem Markt sowie für das

    Ausstellen von Produkten'
- id: art-34
  title: § 3 Allgemeine Anforderungen an die Bereitstellung von Produkten auf dem Markt
  text: '§ 3 Allgemeine Anforderungen an die Bereitstellung von Produkten auf dem Markt

    (1) Sofern ein Produkt einer oder mehreren Rechtsverordnungen nach § 8 Absatz 1 unterliegt, darf es nur auf dem

    Markt bereitgestellt werden, wenn es

    1. die in den Rechtsverordnungen vorgesehenen Anforderungen erfüllt und

    2. die Sicherheit und Gesundheit von Personen oder sonstige in den Rechtsverordnungen nach § 8 Absatz 1

    aufgeführte Rechtsgüter bei bestimmungsgemäßer oder vorhersehbarer Verwendung nicht gefährdet.

    (2) Ein Produkt im Sinne des § 1 Absatz 3 darf nur auf dem Markt bereitgestellt werden, wenn es bei

    bestimmungsgemäßer oder vorhersehbarer Verwendung die Sicherheit und Gesundheit von Personen nicht

    gefährdet. Bei der Beurteilung, ob ein Produkt der Anforderung nach Satz 1 entspricht, sind insbesondere zu

    berücksichtigen:

    1. die Eigenschaften des Produkts einschließlich seiner Zusammensetzung, seine Verpackung, die

    Anleitungen für seinen Zusammenbau, die Installation, die Wartung und die Gebrauchsdauer,

    2. die Einwirkungen des Produkts auf andere Produkte, soweit zu erwarten ist, dass es zusammen mit

    anderen Produkten verwendet wird,

    3. die Aufmachung des Produkts, seine Kennzeichnung, die Warnhinweise, die Gebrauchs- und

    Bedienungsanleitung, die Angaben zu seiner Beseitigung sowie alle sonstigen produktbezogenen Angaben

    oder Informationen,

    4. die Gruppen von Verwendern, die bei der Verwendung des Produkts stärker gefährdet sind als andere.

    Die Mög lichkeit, einen höheren Sicherheitsgrad zu erreichen, oder die Verfügbarkeit anderer Produkte, die ein

    geringeres Risiko darstellen, ist kein ausreichender Grund, ein Produkt als gefährlich anzusehen.

    (3) Wenn der Schutz der Sicherheit und Gesundheit von Personen erst durch die Art der Aufstellung eines

    Produkts gewährleistet wird, ist hierauf bei der Bereitstellung auf dem Markt ausreichend hinzuweisen, sofern in

    den Rechtsverordnungen nach § 8 keine anderen Regelungen vorgesehen sind.

    (4) Sind bei der Verwendung, Ergänzung oder Instandhaltung eines Produkts bestimmte Regeln zu beachten, um

    den Schutz der Sicherheit und Gesundheit von Personen zu gewährleisten, so ist bei der Bereitstellung auf dem

    Markt eine Gebrauchs- und Bedienungsanleitung für das Produkt in deutscher Sprache mitzuliefern, sofern in den

    Rechtsverordnungen nach § 8 keine anderen Regelungen vorgesehen sind.

    (5) Ein Produkt, das die Anforderungen nach Absatz 1 oder 2 oder nach der Verordnung (EU) 2023/988

    nicht erfüllt, darf nur dann ausgestellt werden, wenn der Aussteller deutlich darauf hinweist, dass es diese

    Anforderungen nicht erfüllt und erst erworben werden kann, wenn die entsprechende Übereinstimmung

    - Seite 6 von 22 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    hergestellt ist. Bei einer Vorführung dieser Produkte sind die erforderlichen Vorkehrungen zum Schutz der

    Sicherheit und Gesundheit von Personen zu treffen.'
- id: art-35
  title: § 4 Harmonisierte Normen
  text: '§ 4 Harmonisierte Normen

    (1) Bei der Beurteilung, ob ein Produkt den Anforderungen nach § 3 Absatz 1 entspricht, können harmonisierte

    Normen zugrunde gelegt werden.

    (2) Bei einem Produkt, das harmonisierten Normen, deren Fundstellen im Amtsblatt der Europäischen Union

    veröffentlicht worden sind, oder Teilen dieser Normen entspricht, wird vermutet, dass es den Anforderungen nach'
- id: art-36
  title: § 3 Absatz 1 genügt, soweit diese Anforderungen von den betreffenden Normen oder von Teilen dieser Normen
  text: '§ 3 Absatz 1 genügt, soweit diese Anforderungen von den betreffenden Normen oder von Teilen dieser Normen

    abgedeckt sind.

    (3) Ist die Marktüberwachungsbehörde der Auffassung, dass eine harmonisierte Norm oder eine gemeinsame

    Spezifikation den von ihr abgedeckten Anforderungen nach § 3 Absatz 1 oder nach der Verordnung (EU)

    2016/425, nach der Verordnung (EU) 2016/426, nach der Verordnung (EU) 2023/988 oder nach der Verordnung

    (EU) 2023/1230 nicht vollständig entspricht, so unterrichtet sie hiervon unter Angabe der Gründe die

    Bundesanstalt für Arbeitsschutz und Arbeitsmedizin. Die Bundesanstalt für Arbeitsschutz und Arbeitsmedizin

    überprüft die Vollständigkeit und Schlüssigkeit der eingegangenen Meldungen und informiert den Ausschuss

    für Produktsicherheit. Sie leitet die Meldungen dem zuständigen Bundesministerium zur Weitergabe an die

    Europäische Kommission zu.'
- id: art-37
  title: § 5 Normen und andere technische Spezifikationen
  text: '§ 5 Normen und andere technische Spezifikationen

    (1) Bei der Beurteilung, ob ein Produkt den Anforderungen nach § 3 Absatz 2 entspricht, können Normen und

    andere technische Spezifikationen zugrunde gelegt werden.

    (2) Bei einem Produkt, das Normen oder anderen technischen Spezifikationen, die vom Ausschuss für

    Produktsicherheit ermittelt und deren Fundstellen von der Bundesanstalt für Arbeitsschutz und Arbeitsmedizin im

    Gemeinsamen Ministerialblatt bekannt gegeben worden sind, oder Teilen von diesen entspricht, wird vermutet,

    dass es den Anforderungen nach § 3 Absatz 2 genügt, soweit diese Anforderungen von den betreffenden Normen

    oder anderen technischen Spezifikationen oder deren Teilen abgedeckt sind.

    (3) Ist die Marktüberwachungsbehörde der Auffassung, dass eine Norm oder eine andere technische Spezifikation

    den von ihr abgedeckten Anforderungen nach § 3 Absatz 2 oder nach der Verordnung (EU) 2023/988 nicht

    vollständig entspricht, so unterrichtet sie hiervon unter Angabe der Gründe die Bundesanstalt für Arbeitsschutz

    und Arbeitsmedizin. Diese informiert den Ausschuss für Produktsicherheit, der die Ermittlung der Norm oder der

    technischen Spezifikation überprüft. Wenn die Norm oder die technische Spezifikation den Anforderungen nach'
- id: art-38
  title: § 3 Absatz 2 oder nach der Verordnung (EU) 2023/988 nicht vollständig entspricht, wird die Veröffentlichung der
  text: '§ 3 Absatz 2 oder nach der Verordnung (EU) 2023/988 nicht vollständig entspricht, wird die Veröffentlichung der

    Norm oder der technischen Spezifikation eingeschränkt oder rückgängig gemacht.'
- id: art-39
  title: § 6 Sprache der Informationen, Sicherheitsinformationen, Anweisungen und Warnhinweise
  text: '§ 6 Sprache der Informationen, Sicherheitsinformationen, Anweisungen und Warnhinweise

    Bei Produkten nach Artikel 2 der Verordnung (EU) 2023/988 sind in deutscher Sprache abzufassen:

    1. die Anweisungen und Sicherheitsinformationen nach Artikel 9 Absatz 7 Satz 1 der Verordnung (EU)

    2023/988,

    2. die Anweisungen und Sicherheitsinformationen nach Artikel 11 Absatz 4 der Verordnung (EU) 2023/988,

    3. die Warnhinweise und Sicherheitsinformationen nach Artikel 19 Buchstabe d der Verordnung (EU)

    2023/988,

    4. die Informationen nach Artikel 21 Satz 2 der Verordnung (EU) 2023/988,

    5. die Warnhinweise und Sicherheitsinformationen nach Artikel 22 Absatz 9 Buchstabe d der Verordnung

    (EU) 2023/988.'
- id: art-40
  title: § 7 CE-Kennzeichnung
  text: '§ 7 CE-Kennzeichnung

    (1) Für die CE-Kennzeichnung gelten die allgemeinen Grundsätze nach Artikel 30 der Verordnung (EG) Nr.

    765/2008.

    (2) Es ist verboten, ein Produkt auf dem Markt bereitzustellen,

    - Seite 7 von 22 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    1. wenn das Produkt, seine Verpackung oder ihm beigefügte Unterlagen mit der CE-Kennzeichnung versehen

    sind, ohne dass die Rechtsverordnungen nach § 8 Absatz 1 oder andere Rechtsvorschriften dies vorsehen

    oder ohne dass die Anforderungen der Absätze 3 bis 5 erfüllt sind, oder

    2. das nicht mit der CE-Kennzeichnung versehen ist, obwohl eine Rechtsverordnung nach § 8 Absatz 1 oder

    eine andere Rechtsvorschrift ihre Anbringung vorschreibt.

    (3) Sofern eine Rechtsverordnung nach § 8 Absatz 1 oder eine andere Rechtsvorschrift nichts Anderes vorsieht,

    muss die CE-Kennzeichnung sichtbar, lesbar und dauerhaft auf dem Produkt oder seinem Typenschild angebracht

    sein. Falls die Art des Produkts dies nicht zulässt oder nicht rechtfertigt, wird die CE-Kennzeichnung auf der

    Verpackung angebracht sowie auf den Begleitunterlagen, sofern entsprechende Unterlagen vorgeschrieben sind.

    (4) Nach der CE-Kennzeichnung steht die Kennnummer der notifizierten Stelle nach § 2 Nummer 19, soweit

    die notifizierte Stelle in der Phase der Fertigungskontrolle tätig war. Die Kennnummer ist entweder von der

    notifizierten Stelle selbst anzubringen oder vom Hersteller oder seinem Bevollmächtigten nach den Anweisungen

    der notifizierten Stelle.

    (5) Die CE-Kennzeichnung muss angebracht werden, bevor das Produkt in den Verkehr gebracht wird. Nach der

    CE-Kennzeichnung und gegebenenfalls nach der Kennnummer kann ein Piktogramm oder ein anderes Zeichen

    stehen, das auf ein besonderes Risiko oder eine besondere Verwendung hinweist.'
- id: art-41
  title: § 8 Ermächtigung zum Erlass von Rechtsverordnungen
  text: '§ 8 Ermächtigung zum Erlass von Rechtsverordnungen

    (1) Das Bundesministerium des Innern, das Bundesministerium der Verteidigung, das Bundesministerium für

    Wirtschaft und Energie, das Bundesministerium für Arbeit und Soziales, das Bundesministerium für Verkehr,

    das Bundesministerium für Umwelt, Klimaschutz, Naturschutz und nukleare Sicherheit, das Bundesministerium

    für Landwirtschaft, Ernährung und Heimat sowie das Bundesministerium für Wohnen, Stadtentwicklung und

    Bauwesen werden ermächtigt, jeweils für Produkte in ihrem Zuständigkeitsbereich im Einvernehmen mit den

    anderen zuvor genannten Bundesministerien Rechtsverordnungen zu erlassen. Rechtsverordnungen nach

    Satz 1 bedürfen der Anhörung des Ausschusses für Produktsicherheit und der Zustimmung des Bundesrates.

    Rechtsverordnungen nach Satz 1 dürfen erlassen werden zum Schutz der Sicherheit und Gesundheit von

    Personen, zum Schutz der Umwelt und sonstiger Rechtsgüter vor Risiken, die von Produkten ausgehen,

    insbesondere auch um Verpflichtungen aus zwischenstaatlichen Vereinbarungen zu erfüllen oder um die

    von der Europäischen Union erlassenen Rechtsvorschriften umzusetzen oder durchzuführen. Durch diese

    Rechtsverordnungen können geregelt werden:

    1. Anforderungen an

    a) die Beschaffenheit von Produkten,

    b) das Inverkehrbringen von Produkten oder das Bereitstellen von Produkten auf dem Markt,

    c) das Ausstellen von Produkten,

    d) die erstmalige Verwendung von Produkten,

    e) die Kennzeichnung von Produkten,

    f) Konformitätsbewertungsstellen,

    2. produktbezogene Aufbewahrungs- und Mitteilungspflichten und

    3. Handlungspflichten von Konformitätsbewertungsstellen.

    Die Rec htsverordnungen können auch die mit Satz 3 Nummer 1 bis 3 verbundenen behördlichen Maßnahmen

    und Zuständigkeiten regeln, die erforderlich sind, um die von der Europäischen Union erlassenen Rechtsakte

    umzusetzen oder durchzuführen.

    (2) Die Bundesregierung wird ermächtigt, mit Zustimmung des Bundesrates durch Rechtsverordnung die

    Beschränkung und das Verbot der Bereitstellung sowie des Inverkehrbringens von Produkten zu regeln, die ein

    hohes Risiko für die Sicherheit oder Gesundheit von Personen, für Tiere, für Pflanzen, für den Boden, für das

    Wasser, für die Atmosphäre oder für bedeutende Sachwerte darstellen.

    (3) Die Bundesregierung wird ermächtigt, mit Zustimmung des Bundesrates durch Rechtsverordnung für einzelne

    Produktbereiche zu bestimmen, dass eine Stelle, die Aufgaben der Konformitätsbewertung oder der Bewertung

    und Überprüfung der Leistungsbeständigkeit von Produkten wahrnimmt, für den Nachweis der an sie gestellten

    rechtlichen Anforderungen eine von einer nationalen Akkreditierungsstelle ausgestellte Akkreditierungsurkunde

    - Seite 8 von 22 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    vorlegen muss. In einer Rechtsverordnung nach Satz 1 kann auch vorgesehen werden, die Überwachung der

    Tätigkeit der Stellen für einzelne Produktbereiche der Deutschen Akkreditierungsstelle zu übertragen. Sofern die

    Bundesregierung keine Rechtsverordnung nach Satz 1 erlassen hat, werden die Landesregierungen ermächtigt,

    eine solche Rechtsverordnung zu erlassen.

    (4) Rechtsverordnungen nach Absatz 1, 2 oder 3 können in dringenden Fällen, insbesondere wenn es zur

    unverzüglichen Umsetzung oder Durchführung von Rechtsakten der Europäischen Union erforderlich ist, ohne

    Zustimmung des Bundesrates erlassen werden; sie treten spätestens sechs Monate nach ihrem Inkrafttreten

    außer Kraft. Ihre Geltungsdauer kann nur mit Zustimmung des Bundesrates verlängert werden.

    Abschnitt 3

    Bestimmungen über die Befugnis erteilende Behörde'
- id: art-42
  title: § 9 Aufgaben der Befugnis erteilenden Behörde
  text: '§ 9 Aufgaben der Befugnis erteilenden Behörde

    (1) Die Befugnis erteilende Behörde erteilt Konformitätsbewertungsstellen auf Antrag die Befugnis, bestimmte

    Konformitätsbewertungstätigkeiten durchzuführen. Sie ist zuständig für die Einrichtung und Durchführung der

    dazu erforderlichen Verfahren. Sie ist auch zuständig für die Einrichtung und Durchführung der Verfahren, die

    zur Überwachung der Konformitätsbewertungsstellen erforderlich sind, denen sie die Befugnis zur Durchführung

    bestimmter Konformitätsbewertungstätigkeiten erteilt hat.

    (2) Die Befugnis erteilende Behörde führt die Notifizierung von Konformitätsbewertungsstellen, denen sie eine

    Befugnis erteilt hat, durch.

    (3) Die Befugnis erteilende Behörde überwacht, ob die Konformitätsbewertungsstellen, denen sie die Befugnis zur

    Durchführung bestimmter Konformitätsbewertungstätigkeiten erteilt hat, die Anforderungen erfüllen und ihren

    gesetzlichen Verpflichtungen nachkommen. Sie trifft die notwendigen Anordnungen zur Beseitigung festgestellter

    Mängel oder zur Verhütung künftiger Verstöße.

    (4) Die Befugnis erteilende Behörde übermittelt der zuständigen Marktüberwachungsbehörde auf

    Anforderung die Informationen, die für deren Aufgabenerfüllung erforderlich sind. Dazu gehören insbesondere

    die Befugniserteilungsbescheide und sonstige Informationen, die Einfluss auf die Durchführung der

    Konformitätsbewertungsverfahren haben.'
- id: art-43
  title: § 10 Anforderungen an die Befugnis erteilende Behörde
  text: '§ 10 Anforderungen an die Befugnis erteilende Behörde

    (1) Die Länder haben die Befugnis erteilende Behörde so einzurichten, dass es zu keinerlei Interessenkonflikt

    mit den Konformitätsbewertungsstellen kommt; insbesondere darf die Befugnis erteilende Behörde weder

    Tätigkeiten, die Konformitätsbewertungsstellen durchführen, noch Beratungsleistungen auf einer gewerblichen

    oder wettbewerblichen Basis anbieten oder erbringen.

    (2) Bedienstete der Befugnis erteilenden Behörde, die die Begutachtung einer Konformitätsbewertungsstelle

    durchgeführt haben, dürfen nicht mit der Entscheidung über die Erteilung der Befugnis, als

    Konformitätsbewertungsstelle tätig werden zu dürfen, betraut werden.

    (3) Der Befugnis erteilenden Behörde muss kompetentes Personal in ausreichender Zahl zur Verfügung stehen, so

    dass sie ihre Aufgaben ordnungsgemäß wahrnehmen kann.'
- id: art-44
  title: § 11 Befugnisse der Befugnis erteilenden Behörde
  text: '§ 11 Befugnisse der Befugnis erteilenden Behörde

    (1) Die Befugnis erteilende Behörde kann von den Konformitätsbewertungsstellen, denen sie die Befugnis

    zur Durchführung bestimmter Konformitätsbewertungstätigkeiten erteilt hat, die zur Erfüllung ihrer

    Überwachungsaufgaben erforderlichen Auskünfte einschließlich der Herausgabe personenbezogener Daten,

    soweit dies zur Überprüfung der Kompetenz der Stelle erforderlich ist, und sonstige Unterstützung verlangen

