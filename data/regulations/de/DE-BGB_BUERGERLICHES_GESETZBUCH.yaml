- id: art-2
  title: § 1 Beginn der Rechtsfähigkeit
  text: '§ 1 Beginn der Rechtsfähigkeit

    Die Rechtsfähigkeit des Menschen beginnt mit der Vollendung der Geburt.'
- id: art-3
  title: § 2 Eintritt der Volljährigkeit
  text: '§ 2 Eintritt der Volljährigkeit

    Die Volljährigkeit tritt mit der Vollendung des 18. Lebensjahres ein.

    §§ 3 bis 6 (weggefallen)'
- id: art-4
  title: § 7 Wohnsitz; Begründung und Aufhebung
  text: '§ 7 Wohnsitz; Begründung und Aufhebung

    (1) Wer sich an einem Orte ständig niederlässt, begründet an diesem Orte seinen Wohnsitz.

    (2) Der Wohnsitz kann gleichzeitig an mehreren Orten bestehen.

    (3) Der Wohnsitz wird aufgehoben, wenn die Niederlassung mit dem Willen aufgehoben wird, sie aufzugeben.'
- id: art-5
  title: § 8 Wohnsitz nicht voll Geschäftsfähiger
  text: '§ 8 Wohnsitz nicht voll Geschäftsfähiger

    Wer geschäftsunfähig oder in der Geschäftsfähigkeit beschränkt ist, kann ohne den Willen seines gesetzlichen

    Vertreters einen Wohnsitz weder begründen noch aufheben.

    - Seite 27 von 490 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de'
- id: art-6
  title: § 9 Wohnsitz eines Soldaten
  text: '§ 9 Wohnsitz eines Soldaten

    (1) Ein Soldat hat seinen Wohnsitz am Standort. Als Wohnsitz eines Soldaten, der im Inland keinen Standort hat,

    gilt der letzte inländische Standort.

    (2) Diese Vorschriften finden keine Anwendung auf Soldaten, die nur auf Grund der Wehrpflicht Wehrdienst leisten

    oder die nicht selbständig einen Wohnsitz begründen können.'
- id: art-7
  title: § 10 (weggefallen)
  text: § 10 (weggefallen)
- id: art-8
  title: § 11 Wohnsitz des Kindes
  text: '§ 11 Wohnsitz des Kindes

    Ein minderjähriges Kind teilt den Wohnsitz der Eltern; es teilt nicht den Wohnsitz eines Elternteils, dem das Recht

    fehlt, für die Person des Kindes zu sorgen. Steht keinem Elternteil das Recht zu, für die Person des Kindes zu

    sorgen, so teilt das Kind den Wohnsitz desjenigen, dem dieses Recht zusteht. Das Kind behält den Wohnsitz, bis

    es ihn rechtsgültig aufhebt.'
- id: art-9
  title: § 12 Namensrecht
  text: '§ 12 Namensrecht

    Wird das Recht zum Gebrauch eines Namens dem Berechtigten von einem anderen bestritten oder wird das

    Interesse des Berechtigten dadurch verletzt, dass ein anderer unbefugt den gleichen Namen gebraucht, so kann

    der Berechtigte von dem anderen Beseitigung der Beeinträchtigung verlangen. Sind weitere Beeinträchtigungen

    zu besorgen, so kann er auf Unterlassung klagen.'
- id: art-10
  title: § 13 Verbraucher
  text: '§ 13 Verbraucher

    Verbraucher ist jede natürliche Person, die ein Rechtsgeschäft zu Zwecken abschließt, die überwiegend weder

    ihrer gewerblichen noch ihrer selbständigen beruflichen Tätigkeit zugerechnet werden können.'
- id: art-11
  title: § 14 Unternehmer
  text: '§ 14 Unternehmer

    *)

    (1) Unternehmer ist eine natürliche oder juristische Person oder eine rechtsfähige Personengesellschaft, die

    bei Abschluss eines Rechtsgeschäfts in Ausübung ihrer gewerblichen oder selbständigen beruflichen Tätigkeit

    handelt.

    (2) Eine rechtsfähige Personengesellschaft ist eine Personengesellschaft, die mit der Fähigkeit ausgestattet ist,

    Rechte zu erwerben und Verbindlichkeiten einzugehen.

    *) Amtlicher Hinweis:

    Diese Vorschrift dient der Umsetzung der eingangs zu den Nummern 3, 4, 6, 7, 9 und 11 genannten

    Richtlinien.

    §§ 15 bis 20 (weggefallen)

    Titel 2

    Juristische Personen

    Untertitel 1

    Vereine

    Kapitel 1

    Allgemeine Vorschriften'
- id: art-12
  title: § 21 Nicht wirtschaftlicher Verein
  text: '§ 21 Nicht wirtschaftlicher Verein

    Ein Verein, dessen Zweck nicht auf einen wirtschaftlichen Geschäftsbetrieb gerichtet ist, erlangt Rechtsfähigkeit

    durch Eintragung in das Vereinsregister des zuständigen Amtsgerichts.'
- id: art-13
  title: § 22 Wirtschaftlicher Verein
  text: '§ 22 Wirtschaftlicher Verein

    - Seite 28 von 490 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Ein Verein, dessen Zweck auf einen wirtschaftlichen Geschäftsbetrieb gerichtet ist, erlangt in Ermangelung

    besonderer bundesgesetzlicher Vorschriften Rechtsfähigkeit durch staatliche Verleihung. Die Verleihung steht

    dem Land zu, in dessen Gebiet der Verein seinen Sitz hat.'
- id: art-14
  title: § 23 (weggefallen)
  text: '§ 23 (weggefallen)

    -'
- id: art-15
  title: § 24 Sitz
  text: '§ 24 Sitz

    Als Sitz eines Vereins gilt, wenn nicht ein anderes bestimmt ist, der Ort, an welchem die Verwaltung geführt wird.'
- id: art-16
  title: § 25 Verfassung
  text: '§ 25 Verfassung

    Die Verfassung eines rechtsfähigen Vereins wird, soweit sie nicht auf den nachfolgenden Vorschriften beruht,

    durch die Vereinssatzung bestimmt.'
- id: art-17
  title: § 26 Vorstand und Vertretung
  text: '§ 26 Vorstand und Vertretung

    (1) Der Verein muss einen Vorstand haben. Der Vorstand vertritt den Verein gerichtlich und außergerichtlich; er

    hat die Stellung eines gesetzlichen Vertreters. Der Umfang der Vertretungsmacht kann durch die Satzung mit

    Wirkung gegen Dritte beschränkt werden.

    (2) Besteht der Vorstand aus mehreren Personen, so wird der Verein durch die Mehrheit der Vorstandsmitglieder

    vertreten. Ist eine Willenserklärung gegenüber einem Verein abzugeben, so genügt die Abgabe gegenüber einem

    Mitglied des Vorstands.'
- id: art-18
  title: § 27 Bestellung und Geschäftsführung des Vorstands
  text: '§ 27 Bestellung und Geschäftsführung des Vorstands

    (1) Die Bestellung des Vorstands erfolgt durch Beschluss der Mitgliederversammlung.

    (2) Die Bestellung ist jederzeit widerruflich, unbeschadet des Anspruchs auf die vertragsmäßige Vergütung.

    Die Widerruflichkeit kann durch die Satzung auf den Fall beschränkt werden, dass ein wichtiger Grund

    für den Widerruf vorliegt; ein solcher Grund ist insbesondere grobe Pflichtverletzung oder Unfähigkeit zur

    ordnungsmäßigen Geschäftsführung.

    (3) Auf die Geschäftsführung des Vorstands finden die für den Auftrag geltenden Vorschriften der §§ 664 bis 670

    entsprechende Anwendung. Die Mitglieder des Vorstands sind unentgeltlich tätig.'
- id: art-19
  title: § 28 Beschlussfassung des Vorstands
  text: '§ 28 Beschlussfassung des Vorstands

    Bei einem Vorstand, der aus mehreren Personen besteht, erfolgt die Beschlussfassung nach den für die

    Beschlüsse der Mitglieder des Vereins geltenden Vorschriften der §§ 32 und 34.'
- id: art-20
  title: § 29 Notbestellung durch Amtsgericht
  text: '§ 29 Notbestellung durch Amtsgericht

    Soweit die erforderlichen Mitglieder des Vorstands fehlen, sind sie in dringenden Fällen für die Zeit bis zur

    Behebung des Mangels auf Antrag eines Beteiligten von dem Amtsgericht zu bestellen, das für den Bezirk, in dem

    der Verein seinen Sitz hat, das Vereinsregister führt.'
- id: art-21
  title: § 30 Besondere Vertreter
  text: '§ 30 Besondere Vertreter

    Durch die Satzung kann bestimmt werden, dass neben dem Vorstand für gewisse Geschäfte besondere

    Vertreter zu bestellen sind. Die Vertretungsmacht eines solchen Vertreters erstreckt sich im Zweifel auf alle

    Rechtsgeschäfte, die der ihm zugewiesene Geschäftskreis gewöhnlich mit sich bringt.'
- id: art-22
  title: § 31 Haftung des Vereins für Organe
  text: '§ 31 Haftung des Vereins für Organe

    Der Verein ist für den Schaden verantwortlich, den der Vorstand, ein Mitglied des Vorstands oder ein anderer

    verfassungsmäßig berufener Vertreter durch eine in Ausführung der ihm zustehenden Verrichtungen begangene,

    zum Schadensersatz verpflichtende Handlung einem Dritten zufügt.'
- id: art-23
  title: § 31a Haftung von Organmitgliedern und besonderen Vertretern
  text: '§ 31a Haftung von Organmitgliedern und besonderen Vertretern

    - Seite 29 von 490 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    (1) Sind Organmitglieder oder besondere Vertreter unentgeltlich tätig oder erhalten sie für ihre Tätigkeit eine

    Vergütung, die 3 300 Euro jährlich nicht übersteigt, haften sie dem Verein für einen bei der Wahrnehmung ihrer

    Pflichten verursachten Schaden nur bei Vorliegen von Vorsatz oder grober Fahrlässigkeit. Satz 1 gilt auch für die

    Haftung gegenüber den Mitgliedern des Vereins. Ist streitig, ob ein Organmitglied oder ein besonderer Vertreter

    einen Schaden vorsätzlich oder grob fahrlässig verursacht hat, trägt der Verein oder das Vereinsmitglied die

    Beweislast.

    (2) Sind Organmitglieder oder besondere Vertreter nach Absatz 1 Satz 1 einem anderen zum Ersatz eines

    Schadens verpflichtet, den sie bei der Wahrnehmung ihrer Pflichten verursacht haben, so können sie von dem

    Verein die Befreiung von der Verbindlichkeit verlangen. Satz 1 gilt nicht, wenn der Schaden vorsätzlich oder grob

    fahrlässig verursacht wurde.'
- id: art-24
  title: § 31b Haftung von Vereinsmitgliedern
  text: '§ 31b Haftung von Vereinsmitgliedern

    (1) Sind Vereinsmitglieder unentgeltlich für den Verein tätig oder erhalten sie für ihre Tätigkeit eine Vergütung,

    die 3 300 Euro jährlich nicht übersteigt, haften sie dem Verein für einen Schaden, den sie bei der Wahrnehmung

    der ihnen übertragenen satzungsgemäßen Vereinsaufgaben verursachen, nur bei Vorliegen von Vorsatz oder

    grober Fahrlässigkeit. § 31a Absatz 1 Satz 3 ist entsprechend anzuwenden.

    (2) Sind Vereinsmitglieder nach Absatz 1 Satz 1 einem anderen zum Ersatz eines Schadens verpflichtet, den sie

    bei der Wahrnehmung der ihnen übertragenen satzungsgemäßen Vereinsaufgaben verursacht haben, so können

    sie von dem Verein die Befreiung von der Verbindlichkeit verlangen. Satz 1 gilt nicht, wenn die Vereinsmitglieder

    den Schaden vorsätzlich oder grob fahrlässig verursacht haben.'
- id: art-25
  title: § 32 Mitgliederversammlung; Beschlussfassung
  text: '§ 32 Mitgliederversammlung; Beschlussfassung

    (1) Die Angelegenheiten des Vereins werden, soweit sie nicht von dem Vorstand oder einem anderen

    Vereinsorgan zu besorgen sind, durch Beschlussfassung in einer Versammlung der Mitglieder geordnet. Zur

    Gültigkeit des Beschlusses ist erforderlich, dass der Gegenstand bei der Berufung bezeichnet wird. Bei der

    Beschlussfassung entscheidet die Mehrheit der abgegebenen Stimmen.

    (2) Bei der Berufung der Versammlung kann vorgesehen werden, dass Mitglieder auch ohne Anwesenheit

    am Versammlungsort im Wege der elektronischen Kommunikation an der Versammlung teilnehmen und

    andere Mitgliederrechte ausüben können (hybride Versammlung). Die Mitglieder können beschließen, dass

    künftige Versammlungen auch als virtuelle Versammlungen einberufen werden können, an der Mitglieder ohne

    Anwesenheit am Versammlungsort im Wege der elektronischen Kommunikation teilnehmen und ihre anderen

    Mitgliederrechte ausüben müssen. Wird eine hybride oder virtuelle Versammlung einberufen, so muss bei der

    Berufung auch angegeben werden, wie die Mitglieder ihre Rechte im Wege der elektronischen Kommunikation

    ausüben können.

    (3) Auch ohne Versammlung der Mitglieder ist ein Beschluss gültig, wenn alle Mitglieder ihre Zustimmung zu dem

    Beschluss in Textform erklären.'
- id: art-26
  title: § 33 Satzungsänderung
  text: '§ 33 Satzungsänderung

    (1) Zu einem Beschluss, der eine Änderung der Satzung enthält, ist eine Mehrheit von drei Vierteln der

    abgegebenen Stimmen erforderlich. Zur Änderung des Zweckes des Vereins ist die Zustimmung aller Mitglieder

    erforderlich; die Zustimmung der nicht erschienenen Mitglieder muss in Textform erfolgen.

    (2) Beruht die Rechtsfähigkeit des Vereins auf Verleihung, so ist zu jeder Änderung der Satzung die Genehmigung

    der zuständigen Behörde erforderlich.'
- id: art-27
  title: § 34 Ausschluss vom Stimmrecht
  text: '§ 34 Ausschluss vom Stimmrecht

    Ein Mitglied ist nicht stimmberechtigt, wenn die Beschlussfassung die Vornahme eines Rechtsgeschäfts mit ihm

    oder die Einleitung oder Erledigung eines Rechtsstreits zwischen ihm und dem Verein betrifft.'
- id: art-28
  title: § 35 Sonderrechte
  text: '§ 35 Sonderrechte

    Sonderrechte eines Mitglieds können nicht ohne dessen Zustimmung durch Beschluss der Mitgliederversammlung

    beeinträchtigt werden.

    - Seite 30 von 490 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de'
- id: art-29
  title: § 36 Berufung der Mitgliederversammlung
  text: '§ 36 Berufung der Mitgliederversammlung

    Die Mitgliederversammlung ist in den durch die Satzung bestimmten Fällen sowie dann zu berufen, wenn das

    Interesse des Vereins es erfordert.'
- id: art-30
  title: § 37 Berufung auf Verlangen einer Minderheit
  text: '§ 37 Berufung auf Verlangen einer Minderheit

    (1) Die Mitgliederversammlung ist zu berufen, wenn der durch die Satzung bestimmte Teil oder in Ermangelung

    einer Bestimmung der zehnte Teil der Mitglieder die Berufung schriftlich unter Angabe des Zweckes und der

    Gründe verlangt.

    (2) Wird dem Verlangen nicht entsprochen, so kann das Amtsgericht die Mitglieder, die das Verlangen gestellt

    haben, zur Berufung der Versammlung ermächtigen; es kann Anordnungen über die Führung des Vorsitzes in der

    Versammlung treffen. Zuständig ist das Amtsgericht, das für den Bezirk, in dem der Verein seinen Sitz hat, das

    Vereinsregister führt. Auf die Ermächtigung muss bei der Berufung der Versammlung Bezug genommen werden.'
- id: art-31
  title: § 38 Mitgliedschaft
  text: '§ 38 Mitgliedschaft

    Die Mitgliedschaft ist nicht übertragbar und nicht vererblich. Die Ausübung der Mitgliedschaftsrechte kann nicht

    einem anderen überlassen werden.'
- id: art-32
  title: § 39 Austritt aus dem Verein
  text: '§ 39 Austritt aus dem Verein

    (1) Die Mitglieder sind zum Austritt aus dem Verein berechtigt.

    (2) Durch die Satzung kann bestimmt werden, dass der Austritt nur am Schluss eines Geschäftsjahrs oder erst

    nach dem Ablauf einer Kündigungsfrist zulässig ist; die Kündigungsfrist kann höchstens zwei Jahre betragen.'
- id: art-33
  title: § 40 Nachgiebige Vorschriften
  text: '§ 40 Nachgiebige Vorschriften

    Die Vorschriften des § 26 Absatz 2 Satz 1, des § 27 Absatz 1 und 3, der §§ 28, 31a Abs. 1 Satz 2 sowie der §§ 32,

    33 und 38 finden insoweit keine Anwendung als die Satzung ein anderes bestimmt. Von § 34 kann auch für die

    Beschlussfassung des Vorstands durch die Satzung nicht abgewichen werden.

    Fußnote'
- id: art-34
  title: '§ 40 Satz 1 Kursivdruck: Änderung gem. Art. 1 Nr. 3 G v. 28.9.2009 I 3161 mWv 3.10.2009 führt vor "der §§ 28,'
  text: '§ 40 Satz 1 Kursivdruck: Änderung gem. Art. 1 Nr. 3 G v. 28.9.2009 I 3161 mWv 3.10.2009 führt vor "der §§ 28,

    31a Abs. 1 Satz 2" zu zwei aufeinanderfolgenden Kommata. Aufgrund offensichtlicher Unrichtigkeit wurde ein

    Komma entfernt.'
- id: art-35
  title: § 41 Auflösung des Vereins
  text: '§ 41 Auflösung des Vereins

    Der Verein kann durch Beschluss der Mitgliederversammlung aufgelöst werden. Zu dem Beschluss ist eine

    Mehrheit von drei Vierteln der abgegebenen Stimmen erforderlich, wenn nicht die Satzung ein anderes bestimmt.'
- id: art-36
  title: § 42 Insolvenz
  text: '§ 42 Insolvenz

    (1) Der Verein wird durch die Eröffnung des Insolvenzverfahrens und mit Rechtskraft des Beschlusses, durch den

    die Eröffnung des Insolvenzverfahrens mangels Masse abgewiesen worden ist, aufgelöst. Wird das Verfahren

    auf Antrag des Schuldners eingestellt oder nach der Bestätigung eines Insolvenzplans, der den Fortbestand des

    Vereins vorsieht, aufgehoben, so kann die Mitgliederversammlung die Fortsetzung des Vereins beschließen.

    Durch die Satzung kann bestimmt werden, dass der Verein im Falle der Eröffnung des Insolvenzverfahrens als

    nicht rechtsfähiger Verein fortbesteht; auch in diesem Falle kann unter den Voraussetzungen des Satzes 2 die

    Fortsetzung als rechtsfähiger Verein beschlossen werden.

    (2) Der Vorstand hat im Falle der Zahlungsunfähigkeit oder der Überschuldung die Eröffnung des

    Insolvenzverfahrens zu beantragen. Wird die Stellung des Antrags verzögert, so sind die Vorstandsmitglieder,

    denen ein Verschulden zur Last fällt, den Gläubigern für den daraus entstehenden Schaden verantwortlich; sie

    haften als Gesamtschuldner.'
- id: art-37
  title: § 43 Entziehung der Rechtsfähigkeit
  text: '§ 43 Entziehung der Rechtsfähigkeit

    - Seite 31 von 490 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Einem Verein, dessen Rechtsfähigkeit auf Verleihung beruht, kann die Rechtsfähigkeit entzogen werden, wenn er

    einen anderen als den in der Satzung bestimmten Zweck verfolgt.'
- id: art-38
  title: § 44 Zuständigkeit und Verfahren
  text: '§ 44 Zuständigkeit und Verfahren

    Die Zuständigkeit und das Verfahren für die Entziehung der Rechtsfähigkeit nach § 43 bestimmen sich nach dem

    Recht des Landes, in dem der Verein seinen Sitz hat.'
- id: art-39
  title: § 45 Anfall des Vereinsvermögens
  text: '§ 45 Anfall des Vereinsvermögens

    (1) Mit der Auflösung des Vereins oder der Entziehung der Rechtsfähigkeit fällt das Vermögen an die in der

    Satzung bestimmten Personen.

    (2) Durch die Satzung kann vorgeschrieben werden, dass die Anfallberechtigten durch Beschluss der

    Mitgliederversammlung oder eines anderen Vereinsorgans bestimmt werden. Ist der Zweck des Vereins nicht

    auf einen wirtschaftlichen Geschäftsbetrieb gerichtet, so kann die Mitgliederversammlung auch ohne eine solche

    Vorschrift das Vermögen einer öffentlichen Stiftung oder Anstalt zuweisen.

    (3) Fehlt es an einer Bestimmung der Anfallberechtigten, so fällt das Vermögen, wenn der Verein nach der

    Satzung ausschließlich den Interessen seiner Mitglieder diente, an die zur Zeit der Auflösung oder der Entziehung

    der Rechtsfähigkeit vorhandenen Mitglieder zu gleichen Teilen, anderenfalls an den Fiskus des Landes, in dessen

    Gebiet der Verein seinen Sitz hatte.'
- id: art-40
  title: § 46 Anfall an den Fiskus
  text: '§ 46 Anfall an den Fiskus

    Fällt das Vereinsvermögen an den Fiskus, so finden die Vorschriften über eine dem Fiskus als gesetzlichem Erben

    anfallende Erbschaft entsprechende Anwendung. Der Fiskus hat das Vermögen tunlichst in einer den Zwecken des

    Vereins entsprechenden Weise zu verwenden.'
- id: art-41
  title: § 47 Liquidation
  text: '§ 47 Liquidation

    Fällt das Vereinsvermögen nicht an den Fiskus, so muss eine Liquidation stattfinden, sofern nicht über das

    Vermögen des Vereins das Insolvenzverfahren eröffnet ist.'
- id: art-42
  title: § 48 Liquidatoren
  text: '§ 48 Liquidatoren

    (1) Die Liquidation erfolgt durch den Vorstand. Zu Liquidatoren können auch andere Personen bestellt werden; für

    die Bestellung sind die für die Bestellung des Vorstands geltenden Vorschriften maßgebend.

    (2) Die Liquidatoren haben die rechtliche Stellung des Vorstands, soweit sich nicht aus dem Zwecke der

    Liquidation ein anderes ergibt.

    (3) Sind mehrere Liquidatoren vorhanden, so sind sie nur gemeinschaftlich zur Vertretung befugt und können

    Beschlüsse nur einstimmig fassen, sofern nicht ein anderes bestimmt ist.'
- id: art-43
  title: § 49 Aufgaben der Liquidatoren
  text: '§ 49 Aufgaben der Liquidatoren

    (1) Die Liquidatoren haben die laufenden Geschäfte zu beendigen, die Forderungen einzuziehen, das übrige

    Vermögen in Geld umzusetzen, die Gläubiger zu befriedigen und den Überschuss den Anfallberechtigten

    auszuantworten. Zur Beendigung schwebender Geschäfte können die Liquidatoren auch neue Geschäfte

    eingehen. Die Einziehung der Forderungen sowie die Umsetzung des übrigen Vermögens in Geld darf

    unterbleiben, soweit diese Maßregeln nicht zur Befriedigung der Gläubiger oder zur Verteilung des Überschusses

    unter die Anfallberechtigten erforderlich sind.

    (2) Der Verein gilt bis zur Beendigung der Liquidation als fortbestehend, soweit der Zweck der Liquidation es

    erfordert.'
- id: art-44
  title: § 50 Bekanntmachung des Vereins in Liquidation
  text: '§ 50 Bekanntmachung des Vereins in Liquidation

    (1) Die Auflösung des Vereins oder die Entziehung der Rechtsfähigkeit ist durch die Liquidatoren öffentlich

    bekannt zu machen. In der Bekanntmachung sind die Gläubiger zur Anmeldung ihrer Ansprüche aufzufordern. Die

    Bekanntmachung erfolgt durch das in der Satzung für Veröffentlichungen bestimmte Blatt. Die Bekanntmachung

    gilt mit dem Ablauf des zweiten Tages nach der Einrückung oder der ersten Einrückung als bewirkt.

    - Seite 32 von 490 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    (2) Bekannte Gläubiger sind durch besondere Mitteilung zur Anmeldung aufzufordern.'
- id: art-45
  title: § 50a Bekanntmachungsblatt
  text: '§ 50a Bekanntmachungsblatt

    Hat ein Verein in der Satzung kein Blatt für Bekanntmachungen bestimmt oder hat das bestimmte

    Bekanntmachungsblatt sein Erscheinen eingestellt, sind Bekanntmachungen des Vereins in dem Blatt zu

    veröffentlichen, welches für Bekanntmachungen des Amtsgerichts bestimmt ist, in dessen Bezirk der Verein

    seinen Sitz hat.'
- id: art-46
  title: § 51 Sperrjahr
  text: '§ 51 Sperrjahr

    Das Vermögen darf den Anfallberechtigten nicht vor dem Ablauf eines Jahres nach der Bekanntmachung der

    Auflösung des Vereins oder der Entziehung der Rechtsfähigkeit ausgeantwortet werden.'
- id: art-47
  title: § 52 Sicherung für Gläubiger
  text: '§ 52 Sicherung für Gläubiger

    (1) Meldet sich ein bekannter Gläubiger nicht, so ist der geschuldete Betrag, wenn die Berechtigung zur

    Hinterlegung vorhanden ist, für den Gläubiger zu hinterlegen.

    (2) Ist die Berichtigung einer Verbindlichkeit zur Zeit nicht ausführbar oder ist eine Verbindlichkeit streitig, so darf

    das Vermögen den Anfallberechtigten nur ausgeantwortet werden, wenn dem Gläubiger Sicherheit geleistet ist.'
- id: art-48
  title: § 53 Schadensersatzpflicht der Liquidatoren
  text: '§ 53 Schadensersatzpflicht der Liquidatoren

    Liquidatoren, welche die ihnen nach dem § 42 Abs. 2 und den §§ 50, 51 und 52 obliegenden Verpflichtungen

    verletzen oder vor der Befriedigung der Gläubiger Vermögen den Anfallberechtigten ausantworten, sind, wenn

    ihnen ein Verschulden zur Last fällt, den Gläubigern für den daraus entstehenden Schaden verantwortlich; sie

    haften als Gesamtschuldner.'
- id: art-49
  title: § 54 Vereine ohne Rechtspersönlichkeit
  text: '§ 54 Vereine ohne Rechtspersönlichkeit

    (1) Für Vereine, deren Zweck nicht auf einen wirtschaftlichen Geschäftsbetrieb gerichtet ist und die nicht durch

    Eintragung in das Vereinsregister Rechtspersönlichkeit erlangt haben, sind die Vorschriften der §§ 24 bis 53

    entsprechend anzuwenden. Für Vereine, deren Zweck auf einen wirtschaftlichen Geschäftsbetrieb gerichtet ist

    und die nicht durch staatliche Verleihung Rechtspersönlichkeit erlangt haben, sind die Vorschriften über die

    Gesellschaft entsprechend anzuwenden.

    (2) Aus einem Rechtsgeschäft, das im Namen eines Vereins ohne Rechtspersönlichkeit einem Dritten gegenüber

    vorgenommen wird, haftet der Handelnde persönlich; handeln mehrere, haften sie als Gesamtschuldner.

    Kapitel 2

    Eingetragene Vereine'
- id: art-50
  title: § 55 Zuständigkeit für die Registereintragung
  text: '§ 55 Zuständigkeit für die Registereintragung

    Die Eintragung eines Vereins der in § 21 bezeichneten Art in das Vereinsregister hat bei dem Amtsgericht zu

    geschehen, in dessen Bezirk der Verein seinen Sitz hat.'
- id: art-51
