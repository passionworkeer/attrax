- id: art-1
  title: Gesetze im Internet - Translations
  text: "Gesetze im Internet - Translations\nStartseite\nGesetze /                                Verordnungen\nAktualitätendienst\nTitelsuche\nVolltextsuche\nTranslations\nHinweise\nTastenkombinationen\n\
    Landesrecht\nRechtsprechung im Internet\nVerwaltungsvorschriften im Internet\nN-Lex\nStatutes/Ordinances\nTranslations of these materials into languages other than German                           \
    \         are intended solely as a convenience to the non-German-reading                                    public. Any discrepancies or differences that may arise in                               \
    \     translations of the official German versions of these materials                                    are not binding and have no legal effect for compliance or                                  \
    \  enforcement purposes. \nNutzungshinweis:\nDie im Bereich \"Translations\" veröffentlichten Übersetzungen                                    können innerhalb der Schranken des jeweils geltenden  \
    \                                  Urheberrechts genutzt werden. Zulässig sind insbesondere                                    einzelne Vervielfältigungen wie Downloads oder Ausdrucke zum          \
    \                          privaten, nicht kommerziellen Gebrauch. Die Vervielfältigung,                                    Bearbeitung und Verbreitung sowie jede andere Art der Nutzung            \
    \                        der Übersetzungen außerhalb der Schranken des jeweils geltenden                                    Urheberrechts bedarf der vorherigen Zustimmung des Urhebers oder         \
    \                           sonstigen Rechteinhabers. Entsprechende Anfragen richten Sie                                    bitte an das Kompetenzzentrum Rechtsinformationssystem des               \
    \                     Bundes. Sie erreichen das Kompetenzzentrum unter folgender                                    E-Mail-Adresse: \nkompetenzzentrum-ris@bfj.bund.de.\nUser notice:\nThe translations\
    \ published on this website may be used in                                    accordance with the applicable copyright exceptions. In                                    particular, single copies may\
    \ be made including in the form of                                    downloads or printouts for private, non-commercial use. Any                                    reproduction, processing, distribution\
    \ or other type of use of                                    these translations that does not fall within the relevant                                    copyright exceptions requires the prior consent\
    \ of the author or                                    other rights holder. For inquiries in this regard, please                                    contact the Competence Centre for the Federal Legal\
    \ Information                                    System. You can reach the Competence Centre via the following                                    email address: \nkompetenzzentrum-ris@bfj.bund.de.\n\
    AbgG\nMembers of the Bundestag Act\nÜbersetzung durch den Sprachendienst des Deutschen Bundestages in Zusammenarbeit mit Raymond Kerr.\nTranslation provided by the Language Service of the German Bundestag\
    \ in cooperation with Raymond Kerr.\nAdVermiG\nAct on Adoption Placement and Support and on the Prohibition of Surrogacy Placement\nÜbersetzung durch Ute Reusch für das Bundesministerium für Familie,\
    \ Senioren, Frauen und Jugend.\nTranslation provided by Ute Reusch for the Federal Ministry for Family Affairs, Senior Citizens, Women and Youth.\nAEntG\nAct on Mandatory Working Conditions for Workers\
    \ Posted Across Borders and for Workers Regularly Employed in Germany\nÜbersetzung durch das Bundesministerium für Arbeit und Soziales.\nTranslation provided by the Federal Ministry of Labour and Social\
    \ Affairs.\nAGG\nGeneral Act on Equal Treatment\nÜbersetzung durch Ute Reusch für die Antidiskriminierungsstelle des Bundes.\nTranslation provided by Ute Reusch for the Federal Anti-Discrimination Agency.\n\
    AktG\nStock Corporation Act (Aktiengesetz - AktG)"
