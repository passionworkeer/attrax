    betreffend Batterien und Altbatterien (Batterierecht-

    Durchführungsgesetz - BattDG)

    BattDG

    Ausfertigungsdatum: 30.09.2025

    Vollzitat:

    "Batterierecht-Durchführungsgesetz vom 30. September 2025 (BGBl. 2025 I Nr. 233), das durch Artikel 2 des

    Gesetzes vom 25. November 2025 (BGBl. 2025 I Nr. 286) geändert worden ist"

    Stand: Geändert durch Art. 2 G v. 25.11.2025 I Nr. 286

    mittelbare Änderung durch Art. 3 G v. 25.11.2025 I Nr. 286 ist berücksichtigt

    Ersetzt G 2129-53 v. 25.6.2009 I 1582 (BattG)

    Fußnote

    (+++ Textnachweis ab: 7.10.2025 +++)

    (+++ EU-Vollzitate: vgl. Liste EU-Rechtsakte G v. 25.11.2025 I Nr. 286 +++)

    Das G wurde als Artikel 1 des G v. 30.9.2025 I Nr. 233 vom Bundestag beschlossen. Es tritt gem. Art. 11 Abs. 1

    dieses G am 7.10.2025 in Kraft.

