articles:
- id: art-1
  title: Ein Service des Bundesministerium der Justiz und für Verbrau
  text: 'Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Gesetz über die Haftung für fehlerhafte Produkte

    (Produkthaftungsgesetz - ProdHaftG)

    ProdHaftG

    Ausfertigungsdatum: 15.12.1989

    Vollzitat:

    "Produkthaftungsgesetz vom 15. Dezember 1989 (BGBl. I S. 2198), das zuletzt durch Artikel 5 des Gesetzes vom

    17. Juli 2017 (BGBl. I S. 2421) geändert worden ist"

    Stand: Zuletzt geändert durch Art. 5 G v. 17.7.2017 I 2421

    Fußnote

    (+++ Textnachweis ab: 1.1.1990 +++)

    (+++ Maßgaben aufgrund EinigVtr vgl ProdHaftG Anhang EV,

    nicht mehr anzuwenden +++)'
- id: art-2
  title: § 1 Haftung
  text: '§ 1 Haftung

    (1) Wird durch den Fehler eines Produkts jemand getötet, sein Körper oder seine Gesundheit verletzt oder eine

    Sache beschädigt, so ist der Hersteller des Produkts verpflichtet, dem Geschädigten den daraus entstehenden

    Schaden zu ersetzen. Im Falle der Sachbeschädigung gilt dies nur, wenn eine andere Sache als das fehlerhafte

    Produkt beschädigt wird und diese andere Sache ihrer Art nach gewöhnlich für den privaten Ge- oder Verbrauch

    bestimmt und hierzu von dem Geschädigten hauptsächlich verwendet worden ist.

    (2) Die Ersatzpflicht des Herstellers ist ausgeschlossen, wenn

    1. er das Produkt nicht in den Verkehr gebracht hat,

    2. nach den Umständen davon auszugehen ist, daß das Produkt den Fehler, der den Schaden verursacht hat,

    noch nicht hatte, als der Hersteller es in den Verkehr brachte,

    3. er das Produkt weder für den Verkauf oder eine andere Form des Vertriebs mit wirtschaftlichem Zweck

    hergestellt noch im Rahmen seiner beruflichen Tätigkeit hergestellt oder vertrieben hat,

    4. der Fehler darauf beruht, daß das Produkt in dem Zeitpunkt, in dem der Hersteller es in den Verkehr

    brachte, dazu zwingenden Rechtsvorschriften entsprochen hat, oder

    5. der Fehler nach dem Stand der Wissenschaft und Technik in dem Zeitpunkt, in dem der Hersteller das

    Produkt in den Verkehr brachte, nicht erkannt werden konnte.

    (3) Die Ersatzpflicht des Herstellers eines Teilprodukts ist ferner ausgeschlossen, wenn der Fehler durch die

    Konstruktion des Produkts, in welches das Teilprodukt eingearbeitet wurde, oder durch die Anleitungen des

    Herstellers des Produkts verursacht worden ist. Satz 1 ist auf den Hersteller eines Grundstoffs entsprechend

    anzuwenden.

    (4) Für den Fehler, den Schaden und den ursächlichen Zusammenhang zwischen Fehler und Schaden trägt der

    Geschädigte die Beweislast. Ist streitig, ob die Ersatzpflicht gemäß Absatz 2 oder 3 ausgeschlossen ist, so trägt

    der Hersteller die Beweislast.'
- id: art-3
  title: § 2 Produkt
  text: '§ 2 Produkt

    Produkt im Sinne dieses Gesetzes ist jede bewegliche Sache, auch wenn sie einen Teil einer anderen beweglichen

    Sache oder einer unbeweglichen Sache bildet, sowie Elektrizität.'
- id: art-4
  title: § 3 Fehler
  text: '§ 3 Fehler

    (1) Ein Produkt hat einen Fehler, wenn es nicht die Sicherheit bietet, die unter Berücksichtigung aller Umstände,

    insbesondere

    - Seite 1 von 4 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    a) seiner Darbietung,

    b) des Gebrauchs, mit dem billigerweise gerechnet werden kann,

    c) des Zeitpunkts, in dem es in den Verkehr gebracht wurde,

    berecht igterweise erwartet werden kann.

    (2) Ein Produkt hat nicht allein deshalb einen Fehler, weil später ein verbessertes Produkt in den Verkehr gebracht

    wurde.'
- id: art-5
  title: § 4 Hersteller
  text: '§ 4 Hersteller

    (1) Hersteller im Sinne dieses Gesetzes ist, wer das Endprodukt, einen Grundstoff oder ein Teilprodukt hergestellt

    hat. Als Hersteller gilt auch jeder, der sich durch das Anbringen seines Namens, seiner Marke oder eines anderen

    unterscheidungskräftigen Kennzeichens als Hersteller ausgibt.

    (2) Als Hersteller gilt ferner, wer ein Produkt zum Zweck des Verkaufs, der Vermietung, des Mietkaufs oder

    einer anderen Form des Vertriebs mit wirtschaftlichem Zweck im Rahmen seiner geschäftlichen Tätigkeit in den

    Geltungsbereich des Abkommens über den Europäischen Wirtschaftsraum einführt oder verbringt.

    (3) Kann der Hersteller des Produkts nicht festgestellt werden, so gilt jeder Lieferant als dessen Hersteller, es

    sei denn, daß er dem Geschädigten innerhalb eines Monats, nachdem ihm dessen diesbezügliche Aufforderung

    zugegangen ist, den Hersteller oder diejenige Person benennt, die ihm das Produkt geliefert hat. Dies gilt auch für

    ein eingeführtes Produkt, wenn sich bei diesem die in Absatz 2 genannte Person nicht feststellen läßt, selbst wenn

    der Name des Herstellers bekannt ist.'
- id: art-6
  title: § 5 Mehrere Ersatzpflichtige
  text: '§ 5 Mehrere Ersatzpflichtige

    Sind für denselben Schaden mehrere Hersteller nebeneinander zum Schadensersatz verpflichtet, so haften sie als

    Gesamtschuldner. Im Verhältnis der Ersatzpflichtigen zueinander hängt, soweit nichts anderes bestimmt ist, die

    Verpflichtung zum Ersatz sowie der Umfang des zu leistenden Ersatzes von den Umständen, insbesondere davon

    ab, inwieweit der Schaden vorwiegend von dem einen oder dem anderen Teil verursacht worden ist; im übrigen

    gelten die §§ 421 bis 425 sowie § 426 Abs. 1 Satz 2 und Abs. 2 des Bürgerlichen Gesetzbuchs.'
- id: art-7
  title: § 6 Haftungsminderung
  text: '§ 6 Haftungsminderung

    (1) Hat bei der Entstehung des Schadens ein Verschulden des Geschädigten mitgewirkt, so gilt § 254 des

    Bürgerlichen Gesetzbuchs; im Falle der Sachbeschädigung steht das Verschulden desjenigen, der die tatsächliche

    Gewalt über die Sache ausübt, dem Verschulden des Geschädigten gleich.

    (2) Die Haftung des Herstellers wird nicht gemindert, wenn der Schaden durch einen Fehler des Produkts und

    zugleich durch die Handlung eines Dritten verursacht worden ist. § 5 Satz 2 gilt entsprechend.'
- id: art-8
  title: § 7 Umfang der Ersatzpflicht bei Tötung
  text: '§ 7 Umfang der Ersatzpflicht bei Tötung

    (1) Im Falle der Tötung ist Ersatz der Kosten einer versuchten Heilung sowie des Vermögensnachteils zu leisten,

    den der Getötete dadurch erlitten hat, daß während der Krankheit seine Erwerbsfähigkeit aufgehoben oder

    gemindert war oder seine Bedürfnisse vermehrt waren. Der Ersatzpflichtige hat außerdem die Kosten der

    Beerdigung demjenigen zu ersetzen, der diese Kosten zu tragen hat.

    (2) Stand der Getötete zur Zeit der Verletzung zu einem Dritten in einem Verhältnis, aus dem er diesem

    gegenüber kraft Gesetzes unterhaltspflichtig war oder unterhaltspflichtig werden konnte, und ist dem

    Dritten infolge der Tötung das Recht auf Unterhalt entzogen, so hat der Ersatzpflichtige dem Dritten insoweit

    Schadensersatz zu leisten, als der Getötete während der mutmaßlichen Dauer seines Lebens zur Gewährung des

    Unterhalts verpflichtet gewesen wäre. Die Ersatzpflicht tritt auch ein, wenn der Dritte zur Zeit der Verletzung

    gezeugt, aber noch nicht geboren war.

    (3) Der Ersatzpflichtige hat dem Hinterbliebenen, der zur Zeit der Verletzung zu dem Getöteten in einem

    besonderen persönlichen Näheverhältnis stand, für das dem Hinterbliebenen zugefügte seelische Leid eine

    angemessene Entschädigung in Geld zu leisten. Ein besonderes persönliches Näheverhältnis wird vermutet, wenn

    der Hinterbliebene der Ehegatte, der Lebenspartner, ein Elternteil oder ein Kind des Getöteten war.'
- id: art-9
  title: § 8 Umfang der Ersatzpflicht bei Körperverletzung
  text: '§ 8 Umfang der Ersatzpflicht bei Körperverletzung

    - Seite 2 von 4 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Im Falle der Verletzung des Körpers oder der Gesundheit ist Ersatz der Kosten der Heilung sowie des

    Vermögensnachteils zu leisten, den der Verletzte dadurch erleidet, daß infolge der Verletzung zeitweise oder

    dauernd seine Erwerbsfähigkeit aufgehoben oder gemindert ist oder seine Bedürfnisse vermehrt sind. Wegen des

    Schadens, der nicht Vermögensschaden ist, kann auch eine billige Entschädigung in Geld gefordert werden.'
- id: art-10
  title: § 9 Schadensersatz durch Geldrente
  text: '§ 9 Schadensersatz durch Geldrente

    (1) Der Schadensersatz wegen Aufhebung oder Minderung der Erwerbsfähigkeit und wegen vermehrter

    Bedürfnisse des Verletzten sowie der nach § 7 Abs. 2 einem Dritten zu gewährende Schadensersatz ist für die

    Zukunft durch eine Geldrente zu leisten.

    (2) § 843 Abs. 2 bis 4 des Bürgerlichen Gesetzbuchs ist entsprechend anzuwenden.'
- id: art-11
  title: § 10 Haftungshöchstbetrag
  text: '§ 10 Haftungshöchstbetrag

    (1) Sind Personenschäden durch ein Produkt oder gleiche Produkte mit demselben Fehler verursacht worden, so

    haftet der Ersatzpflichtige nur bis zu einem Höchstbetrag von 85 Millionen Euro.

    (2) Übersteigen die den mehreren Geschädigten zu leistenden Entschädigungen den in Absatz 1 vorgesehenen

    Höchstbetrag, so verringern sich die einzelnen Entschädigungen in dem Verhältnis, in dem ihr Gesamtbetrag zu

    dem Höchstbetrag steht.'
- id: art-12
  title: § 11 Selbstbeteiligung bei Sachbeschädigung
  text: '§ 11 Selbstbeteiligung bei Sachbeschädigung

    Im Falle der Sachbeschädigung hat der Geschädigte einen Schaden bis zu einer Höhe von 500 Euro selbst zu

    tragen.'
- id: art-13
  title: § 12 Verjährung
  text: '§ 12 Verjährung

    (1) Der Anspruch nach § 1 verjährt in drei Jahren von dem Zeitpunkt an, in dem der Ersatzberechtigte von dem

    Schaden, dem Fehler und von der Person des Ersatzpflichtigen Kenntnis erlangt hat oder hätte erlangen müssen.

    (2) Schweben zwischen dem Ersatzpflichtigen und dem Ersatzberechtigten Verhandlungen über den zu leistenden

    Schadensersatz, so ist die Verjährung gehemmt, bis die Fortsetzung der Verhandlungen verweigert wird.

    (3) Im übrigen sind die Vorschriften des Bürgerlichen Gesetzbuchs über die Verjährung anzuwenden.'
- id: art-14
  title: § 13 Erlöschen von Ansprüchen
  text: '§ 13 Erlöschen von Ansprüchen

    (1) Der Anspruch nach § 1 erlischt zehn Jahre nach dem Zeitpunkt, in dem der Hersteller das Produkt, das den

    Schaden verursacht hat, in den Verkehr gebracht hat. Dies gilt nicht, wenn über den Anspruch ein Rechtsstreit

    oder ein Mahnverfahren anhängig ist.

    (2) Auf den rechtskräftig festgestellten Anspruch oder auf den Anspruch aus einem anderen Vollstreckungstitel

    ist Absatz 1 Satz 1 nicht anzuwenden. Gleiches gilt für den Anspruch, der Gegenstand eines außergerichtlichen

    Vergleichs ist oder der durch rechtsgeschäftliche Erklärung anerkannt wurde.'
- id: art-15
  title: § 14 Unabdingbarkeit
  text: '§ 14 Unabdingbarkeit

    Die Ersatzpflicht des Herstellers nach diesem Gesetz darf im voraus weder ausgeschlossen noch beschränkt

    werden. Entgegenstehende Vereinbarungen sind nichtig.'
- id: art-16
  title: § 15 Arzneimittelhaftung, Haftung nach anderen Rechtsvorschriften
  text: '§ 15 Arzneimittelhaftung, Haftung nach anderen Rechtsvorschriften

    (1) Wird infolge der Anwendung eines zum Gebrauch bei Menschen bestimmten Arzneimittels, das im

    Geltungsbereich des Arzneimittelgesetzes an den Verbraucher abgegeben wurde und der Pflicht zur Zulassung

    unterliegt oder durch Rechtsverordnung von der Zulassung befreit worden ist, jemand getötet, sein Körper oder

    seine Gesundheit verletzt, so sind die Vorschriften des Produkthaftungsgesetzes nicht anzuwenden.

    (2) Eine Haftung aufgrund anderer Vorschriften bleibt unberührt.'
- id: art-17
  title: § 16 Übergangsvorschrift
  text: '§ 16 Übergangsvorschrift

    - Seite 3 von 4 -

    Ein Service des Bundesministerium der Justiz und für Verbraucherschutz

    sowie des Bundesamts für Justiz ‒ www.gesetze-im-internet.de

    Dieses Gesetz ist nicht auf Produkte anwendbar, die vor seinem Inkrafttreten in den Verkehr gebracht worden

    sind.'
- id: art-18
  title: § 17 Erlaß von Rechtsverordnungen
  text: '§ 17 Erlaß von Rechtsverordnungen

    Das Bundesministerium der Justiz und für Verbraucherschutz wird ermächtigt, durch Rechtsverordnung die

    Beträge der §§ 10 und 11 zu ändern oder das Außerkrafttreten des § 10 anzuordnen, wenn und soweit dies zur

    Umsetzung einer Richtlinie des Rates der Europäischen Gemeinschaften auf der Grundlage der Artikel 16 Abs. 2

    und 18 Abs. 2 der Richtlinie des Rates vom 25. Juli 1985 zur Angleichung der Rechts- und Verwaltungsvorschriften

    der Mitgliedstaaten über die Haftung für fehlerhafte Produkte erforderlich ist.'
- id: art-19
  title: § 18 Berlin-Klausel
  text: '§ 18 Berlin-Klausel

    Dieses Gesetz gilt nach Maßgabe des § 13 Abs. 1 des Dritten Überleitungsgesetzes auch im Land Berlin.

    Rechtsverordnungen, die aufgrund dieses Gesetzes erlassen werden, gelten nach Maßgabe des § 14 des Dritten

    Überleitungsgesetzes auch im Land Berlin.'
- id: art-20
  title: § 19 Inkrafttreten
  text: '§ 19 Inkrafttreten

    Dieses Gesetz tritt am 1. Januar 1990 in Kraft.

    - Seite 4 von 4 -'
