- id: art-20
  title: 第一章　総則
  text: '第一章　総則

    （目的）'
- id: art-21
  title: 第一条
  text: '第一条

    この法律は、医薬品、医薬部外品、化粧品、医療機器及び再生医療等製品（以下「医薬品等」という。）の品質、有効性及び安全性の確保並びにこれらの使用による保健衛生上の危害の発生及び拡大の防止のために必要な規制を行うとともに、指定薬物の規制に関する措置を講ずるほか、医療上特にその必要性が高い医薬品、医療機器及び再生医療等製品の研究開発の促進のために必要な措置を講ずることにより、保健衛生の向上を図ることを目的とする。

    （国の責務）'
- id: art-22
  title: 第一条の二
  text: '第一条の二

    国は、この法律の目的を達成するため、医薬品等の品質、有効性及び安全性の確保、これらの使用による保健衛生上の危害の発生及び拡大の防止その他の必要な施策を策定し、及び実施しなければならない。

    （都道府県等の責務）'
- id: art-23
  title: 第一条の三
  text: '第一条の三

    都道府県、地域保健法（昭和二十二年法律第百一号）第五条第一項の政令で定める市（以下「保健所を設置する市」という。）及び特別区は、前条の施策に関し、国との適切な役割分担を踏まえて、当該地域の状況に応じた施策を策定し、及び実施しなければならない。

    （医薬品等関連事業者等の責務）'
- id: art-24
  title: 第一条の四
  text: '第一条の四

    医薬品等の製造販売、製造（小分けを含む。以下同じ。）、販売、貸与若しくは修理を業として行う者、第四条第一項の許可を受けた者（以下「薬局開設者」という。）又は病院、診療所若しくは飼育動物診療施設（獣医療法（平成四年法律第四十六号）第二条第二項に規定する診療施設をいい、往診のみによつて獣医師に飼育動物の診療業務を行わせる者の住所を含む。以下同じ。）の開設者は、その相互間の情報交換を行うことその他の必要な措置を講ずることにより、医薬品等の品質、有効性及び安全性の確保並びにこれらの使用による保健衛生上の危害の発生及び拡大の防止に努めなければならない。

    （医薬関係者の責務）'
- id: art-25
  title: 第一条の五
  text: '第一条の五

    医師、歯科医師、薬剤師、獣医師その他の医薬関係者は、医薬品等の有効性及び安全性その他これらの適正な使用に関する知識と理解を深めるとともに、これらの使用の対象者（動物への使用にあつては、その所有者又は管理者。第六十八条の四、第六十八条の七第三項及び第四項、第六十八条の二十一並びに第六十八条の二十二第三項及び第四項において同じ。）及びこれらを購入し、又は譲り受けようとする者に対し、これらの適正な使用に関する事項に関する正確かつ適切な情報の提供に努めなければならない。

    ２

    薬局において調剤又は調剤された薬剤若しくは医薬品の販売若しくは授与の業務に従事する薬剤師は、薬剤又は医薬品の適切かつ効率的な提供に資するため、地域における医療及び介護の総合的な確保の促進に関する法律（平成元年法律第六十四号）第十二条の二第三項の規定による情報の提供その他の厚生労働省令で定める方法によつて、医療を受ける者の薬剤又は医薬品の使用に関する情報を他の医療提供施設（医療法（昭和二十三年法律第二百五号）第一条の二第二項に規定する医療提供施設をいう。以下同じ。）において診療又は調剤に従事する医師若しくは歯科医師又は薬剤師に提供することにより、医療提供施設相互間の業務の連携の推進に努めなければならない。

    ３

    薬局開設者は、医療を受ける者に必要な薬剤及び医薬品の安定的な供給を図るとともに、当該薬局において薬剤師による前項の情報の提供が円滑になされるよう配慮しなければならない。

    （国民の役割）'
- id: art-26
  title: 第一条の六
  text: '第一条の六

    国民は、医薬品等を適正に使用するとともに、これらの有効性及び安全性に関する知識と理解を深めるよう努めなければならない。

    （定義）'
- id: art-27
  title: 第二条
  text: '第二条

    この法律で「医薬品」とは、次に掲げる物をいう。

    一

    日本薬局方に収められている物

    二

    人又は動物の疾病の診断、治療又は予防に使用されることが目的とされている物であつて、機械器具等（機械器具、歯科材料、医療用品、衛生用品並びにプログラム（電子計算機に対する指令であつて、一の結果を得ることができるように組み合わされたものをいう。以下同じ。）及びこれを記録した記録媒体をいう。以下同じ。）でないもの（医薬部外品及び再生医療等製品を除く。）

    三

    人又は動物の身体の構造又は機能に影響を及ぼすことが目的とされている物であつて、機械器具等でないもの（医薬部外品、化粧品及び再生医療等製品を除く。）

    ２

    この法律で「医薬部外品」とは、次に掲げる物であつて人体に対する作用が緩和なものをいう。

    一

    次のイからハまでに掲げる目的のために使用される物（これらの使用目的のほかに、併せて前項第二号又は第三号に規定する目的のために使用される物を除く。）であつて機械器具等でないもの

    イ

    吐きけその他の不快感又は口臭若しくは体臭の防止

    ロ

    あせも、ただれ等の防止

    ハ

    脱毛の防止、育毛又は除毛

    二

    人又は動物の保健のためにするねずみ、はえ、蚊、のみその他これらに類する生物の防除の目的のために使用される物（この使用目的のほかに、併せて前項第二号又は第三号に規定する目的のために使用される物を除く。）であつて機械器具等でないもの

    三

    前項第二号又は第三号に規定する目的のために使用される物（前二号に掲げる物を除く。）のうち、厚生労働大臣が指定するもの

    ３

    この法律で「化粧品」とは、人の身体を清潔にし、美化し、魅力を増し、容

    貌

    ぼう

    を変え、又は皮膚若しくは毛髪を健やかに保つために、身体に塗擦、散布その他これらに類似する方法で使用されることが目的とされている物で、人体に対する作用が緩和なものをいう。

    ただし、これらの使用目的のほかに、第一項第二号又は第三号に規定する用途に使用されることも併せて目的とされている物及び医薬部外品を除く。

    ４

    この法律で「医療機器」とは、人若しくは動物の疾病の診断、治療若しくは予防に使用されること、又は人若しくは動物の身体の構造若しくは機能に影響を及ぼすことが目的とされている機械器具等（再生医療等製品を除く。）であつて、政令で定めるものをいう。

    ５

    この法律で「高度管理医療機器」とは、医療機器であつて、副作用又は機能の障害が生じた場合（適正な使用目的に従い適正に使用された場合に限る。次項及び第七項において同じ。）において人の生命及び健康に重大な影響を与えるおそれがあることからその適切な管理が必要なものとして、厚生労働大臣が薬事審議会の意見を聴いて指定するものをいう。

    ６

    この法律で「管理医療機器」とは、高度管理医療機器以外の医療機器であつて、副作用又は機能の障害が生じた場合において人の生命及び健康に影響を与えるおそれがあることからその適切な管理が必要なものとして、厚生労働大臣が薬事審議会の意見を聴いて指定するものをいう。

    ７

    この法律で「一般医療機器」とは、高度管理医療機器及び管理医療機器以外の医療機器であつて、副作用又は機能の障害が生じた場合においても、人の生命及び健康に影響を与えるおそれがほとんどないものとして、厚生労働大臣が薬事審議会の意見を聴いて指定するものをいう。

    ８

    この法律で「特定保守管理医療機器」とは、医療機器のうち、保守点検、修理その他の管理に専門的な知識及び技能を必要とすることからその適正な管理が行われなければ疾病の診断、治療又は予防に重大な影響を与えるおそれがあるものとして、厚生労働大臣が薬事審議会の意見を聴いて指定するものをいう。

    ９

    この法律で「再生医療等製品」とは、次に掲げる物（医薬部外品及び化粧品を除く。）であつて、政令で定めるものをいう。

    一

    次に掲げる医療又は獣医療に使用されることが目的とされている物のうち、人又は動物の細胞に培養その他の加工を施したもの

    イ

    人又は動物の身体の構造又は機能の再建、修復又は形成

    ロ

    人又は動物の疾病の治療又は予防

    二

    人又は動物の疾病の治療に使用されることが目的とされている物のうち、人又は動物の細胞に導入され、これらの体内で発現する遺伝子を含有させたもの

    １０

    この法律で「生物由来製品」とは、人その他の生物（植物を除く。）に由来するものを原料又は材料として製造をされる医薬品、医薬部外品、化粧品又は医療機器のうち、保健衛生上特別の注意を要するものとして、厚生労働大臣が薬事審議会の意見を聴いて指定するものをいう。

    １１

    この法律で「特定生物由来製品」とは、生物由来製品のうち、販売し、貸与し、又は授与した後において当該生物由来製品による保健衛生上の危害の発生又は拡大を防止するための措置を講ずることが必要なものであつて、厚生労働大臣が薬事審議会の意見を聴いて指定するものをいう。

    １２

    この法律で「薬局」とは、薬剤師が販売又は授与の目的で調剤の業務並びに薬剤及び医薬品の適正な使用に必要な情報の提供及び薬学的知見に基づく指導の業務を行う場所（その開設者が併せ行う医薬品の販売業に必要な場所を含む。）をいう。

    ただし、病院若しくは診療所又は飼育動物診療施設の調剤所を除く。

    １３

    この法律で「製造販売」とは、その製造（他に委託して製造をする場合を含み、他から委託を受けて製造をする場合を除く。以下「製造等」という。）をし、又は輸入をした医薬品（原薬たる医薬品を除く。）、医薬部外品、化粧品、医療機器若しくは再生医療等製品を、それぞれ販売し、貸与し、若しくは授与し、又は医療機器プログラム（医療機器のうちプログラムであるものをいう。以下同じ。）を電気通信回線を通じて提供することをいう。

    １４

    この法律で「体外診断用医薬品」とは、専ら疾病の診断に使用されることが目的とされている医薬品のうち、人又は動物の身体に直接使用されることのないものをいう。

    １５

    この法律で「指定薬物」とは、中枢神経系の興奮若しくは抑制又は幻覚の作用（当該作用の維持又は強化の作用を含む。以下「精神毒性」という。）を有する蓋然性が高く、かつ、人の身体に使用された場合に保健衛生上の危害が発生するおそれがある物（覚醒剤取締法（昭和二十六年法律第二百五十二号）に規定する覚醒剤、麻薬及び向精神薬取締法（昭和二十八年法律第十四号）に規定する麻薬及び向精神薬並びにあへん法（昭和二十九年法律第七十一号）に規定するあへん及びけしがらを除く。）として、厚生労働大臣が薬事審議会の意見を聴いて指定するものをいう。

    １６

    この法律で「希少疾病用医薬品」とは、第七十七条の二第一項の規定による指定を受けた医薬品を、「希少疾病用医療機器」とは、同項の規定による指定を受けた医療機器を、「希少疾病用再生医療等製品」とは、同項の規定による指定を受けた再生医療等製品を、「先駆的医薬品」とは、同条第二項の規定による指定を受けた医薬品を、「先駆的医療機器」とは、同項の規定による指定を受けた医療機器を、「先駆的再生医療等製品」とは、同項の規定による指定を受けた再生医療等製品を、「特定用途医薬品」とは、同条第三項の規定による指定を受けた医薬品を、「特定用途医療機器」とは、同項の規定による指定を受けた医療機器を、「特定用途再生医療等製品」とは、同項の規定による指定を受けた再生医療等製品をいう。

    １７

    この法律で「特定医薬品」とは、医薬品のうち、次に掲げる医薬品以外の医薬品（専ら動物のために使用されることが目的とされているものを除く。）をいう。

    一'
- id: art-28
  title: 第四条第五項第三号に規定する要指導医薬品
  text: '第四条第五項第三号に規定する要指導医薬品

    二'
- id: art-29
  title: 第四条第五項第四号に規定する一般用医薬品
  text: '第四条第五項第四号に規定する一般用医薬品

    三

    薬局開設者が当該薬局における設備及び器具をもつて製造し、当該薬局において直接需要者に販売し、又は授与する医薬品（体外診断用医薬品を除き、厚生労働大臣の指定する有効成分以外の有効成分を含有しない医薬品に限る。）

    四

    その他製造販売又は販売の状況を把握する必要がないものとして厚生労働省令で定める医薬品

    １８

    この法律で「治験」とは、第十四条第三項（同条第十三項及び第十九条の二第五項において準用する場合を含む。）、第二十三条の二の五第三項（同条第十三項及び第二十三条の二の十七第五項において準用する場合を含む。）又は第二十三条の二十五第三項（同条第十三項及び第二十三条の三十七第五項において準用する場合を含む。）の規定により提出すべき資料のうち臨床試験の試験成績に関する資料の収集を目的とする試験の実施をいう。

    １９

    この法律にいう「物」には、プログラムを含むものとする。'
- id: art-30
  title: 第二章　地方薬事審議会
  text: 第二章　地方薬事審議会
- id: art-31
  title: 第三条
  text: '第三条

    都道府県知事の諮問に応じ、薬事（医療機器及び再生医療等製品に関する事項を含む。以下同じ。）に関する当該都道府県の事務及びこの法律に基づき当該都道府県知事の権限に属する事務のうち政令で定めるものに関する重要事項を調査審議させるため、各都道府県に、地方薬事審議会を置くことができる。

    ２

    地方薬事審議会の組織、運営その他地方薬事審議会に関し必要な事項は、当該都道府県の条例で定める。'
- id: art-32
  title: 第三章　薬局
  text: '第三章　薬局

    （開設の許可）'
- id: art-33
  title: 第四条
  text: '第四条

    薬局は、その所在地の都道府県知事（その所在地が保健所を設置する市又は特別区の区域にある場合においては、市長又は区長。次項、第七条第四項並びに第十条第一項（第三十八条第一項並びに第四十条第一項及び第二項において準用する場合を含む。）及び第二項（第三十八条第一項において準用する場合を含む。）において同じ。）の許可を受けなければ、開設してはならない。

    ２

    前項の許可を受けようとする者は、厚生労働省令で定めるところにより、次に掲げる事項を記載した申請書をその薬局の所在地の都道府県知事に提出しなければならない。

    一

    氏名又は名称及び住所並びに法人にあつては、その代表者の氏名

    二

    その薬局の名称及び所在地

    三

    その薬局の構造設備の概要

    四

    その薬局において調剤及び調剤された薬剤の販売又は授与の業務を行う体制の概要並びにその薬局において医薬品の販売業を併せ行う場合にあつては医薬品の販売又は授与の業務を行う体制の概要

    五

    法人にあつては、薬事に関する業務に責任を有する役員の氏名

    六

    次条第三号イからトまでに該当しない旨その他厚生労働省令で定める事項

    ３

    前項の申請書には、次に掲げる書類を添付しなければならない。

    一

    その薬局の平面図

    二'
- id: art-34
  title: 第七条第一項ただし書又は第二項の規定により薬局の管理者を指定してその薬局を実地に管理させる場合にあつては、その薬局の管理者の氏名及び住所を記載した書類
  text: '第七条第一項ただし書又は第二項の規定により薬局の管理者を指定してその薬局を実地に管理させる場合にあつては、その薬局の管理者の氏名及び住所を記載した書類

    三

    第一項の許可を受けようとする者及び前号の薬局の管理者以外にその薬局において薬事に関する実務に従事する薬剤師又は登録販売者を置く場合にあつては、その薬剤師又は登録販売者の氏名及び住所を記載した書類

    四

    その薬局において医薬品の販売業を併せ行う場合にあつては、次のイ及びロに掲げる書類

    イ

    その薬局において販売し、又は授与する医薬品の薬局医薬品、要指導医薬品及び一般用医薬品に係る厚生労働省令で定める区分を記載した書類

    ロ

    その薬局においてその薬局以外の場所にいる者に対して要指導医薬品（その適正な使用のために薬剤師の対面による販売又は授与が行われることが特に必要な要指導医薬品として、厚生労働大臣が薬事審議会の意見を聴いて指定する要指導医薬品（以下「特定要指導医薬品」という。）を除く。）又は一般用医薬品を販売し、又は授与する場合にあつては、その者との間の通信手段その他の厚生労働省令で定める事項を記載した書類

    五

    その他厚生労働省令で定める書類

    ４

    第一項の許可は、六年ごとにその更新を受けなければ、その期間の経過によつて、その効力を失う。

    ５

    この条において、次の各号に掲げる用語の意義は、当該各号に定めるところによる。

    一

    登録販売者'
- id: art-35
  title: 第三十六条の八第二項の登録を受けた者をいう。
  text: '第三十六条の八第二項の登録を受けた者をいう。

    二

    薬局医薬品

    要指導医薬品及び一般用医薬品以外の医薬品（専ら動物のために使用されることが目的とされているものを除く。）をいう。

    三

    要指導医薬品

    次のイからホまでに掲げる医薬品（専ら動物のために使用されることが目的とされているものを除く。）のうち、その効能及び効果において人体に対する作用が著しくないものであつて、薬剤師その他の医薬関係者から提供された情報に基づく需要者の選択により使用されることが目的とされているものであり、かつ、その適正な使用のために薬剤師の対面又は映像及び音声の送受信により相手の状態を相互に認識しながら通話をすることが可能な方法その他の方法により薬剤若しくは医薬品の適正な使用を確保することが可能であると認められる方法として厚生労働省令で定めるもの（以下「対面等」という。）による情報の提供及び薬学的知見に基づく指導が行われることが必要なものとして、厚生労働大臣が薬事審議会の意見を聴いて指定するものをいう。

    イ

    その製造販売の承認の申請に際して第十四条第十二項に該当するとされた医薬品であつて、当該申請に係る承認を受けてから厚生労働省令で定める期間を経過しないもの（ホに掲げる医薬品を除く。）

    ロ

    その製造販売の承認の申請に際してイに掲げる医薬品と有効成分、分量、用法、用量、効能、効果等が同一性を有すると認められた医薬品であつて、当該申請に係る承認を受けてから厚生労働省令で定める期間を経過しないもの（ホに掲げる医薬品を除く。）

    ハ'
- id: art-36
  title: 第四十四条第一項に規定する毒薬
  text: '第四十四条第一項に規定する毒薬

    ニ'
- id: art-37
  title: 第四十四条第二項に規定する劇薬
  text: '第四十四条第二項に規定する劇薬

    ホ

    次項の規定による指定を受けた医薬品

    四

    一般用医薬品

    医薬品のうち、その効能及び効果において人体に対する作用が著しくないものであつて、薬剤師その他の医薬関係者から提供された情報に基づく需要者の選択により使用されることが目的とされているもの（要指導医薬品を除く。）をいう。

    ６

    厚生労働大臣は、次の各号に掲げる医薬品の区分に応じ、それぞれ当該各号に定める場合に該当すると認めるときは、当該医薬品を薬事審議会の意見を聴いて要指導医薬品として指定することができる。

    一

    イ又はロに掲げる医薬品

    医薬品の特性その他を勘案して、その適正な使用のために薬剤師の対面等による情報の提供及び薬学的知見に基づく指導が行われる必要がある場合

    イ

    その製造販売の承認の申請に際して第十四条第十二項に該当するとされた医薬品

    ロ

    その製造販売の承認の申請に際してイに掲げる医薬品と有効成分、分量、用法、用量、効能、効果等が同一性を有すると認められた医薬品

    二

    一般用医薬品

    医薬品の特性及び使用の実態その他を勘案して、その適正な使用のために薬剤師の対面等による情報の提供及び薬学的知見に基づく指導が行われる必要がある場合

    （許可の基準）'
- id: art-38
  title: 第五条
  text: '第五条

    次の各号のいずれかに該当するときは、前条第一項の許可を与えないことができる。

    一

    その薬局の構造設備が、厚生労働省令で定める基準に適合しないとき。

    二

    その薬局において調剤及び調剤された薬剤の販売又は授与の業務を行う体制並びにその薬局において医薬品の販売業を併せ行う場合にあつては医薬品の販売又は授与の業務を行う体制が厚生労働省令で定める基準に適合しないとき。

    三

    申請者（申請者が法人であるときは、薬事に関する業務に責任を有する役員を含む。第六条の四第一項、第十九条の二第二項、第二十三条の二の十七第二項及び第二十三条の三十七第二項において同じ。）が、次のイからトまでのいずれかに該当するとき。

    イ'
- id: art-39
  title: 第七十五条第一項の規定により許可を取り消され、取消しの日から三年を経過していない者
  text: '第七十五条第一項の規定により許可を取り消され、取消しの日から三年を経過していない者

    ロ'
- id: art-40
  title: 第七十五条の二第一項の規定により登録を取り消され、取消しの日から三年を経過していない者
  text: '第七十五条の二第一項の規定により登録を取り消され、取消しの日から三年を経過していない者

    ハ

    拘禁刑以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなつた後、三年を経過していない者

    ニ

    イからハまでに該当する者を除くほか、この法律、麻薬及び向精神薬取締法、毒物及び劇物取締法（昭和二十五年法律第三百三号）その他薬事に関する法令で政令で定めるもの又はこれに基づく処分に違反し、その違反行為があつた日から二年を経過していない者

    ホ

    麻薬、大麻、あへん又は覚醒剤の中毒者

    ヘ

    心身の障害により薬局開設者の業務を適正に行うことができない者として厚生労働省令で定めるもの

    ト

    薬局開設者の業務を適切に行うことができる知識及び経験を有すると認められない者

    （名称の使用制限）'
- id: art-41
  title: 第六条
  text: '第六条

    医薬品を取り扱う場所であつて、第四条第一項の許可を受けた薬局（以下単に「薬局」という。）でないものには、薬局の名称を付してはならない。

    ただし、厚生労働省令で定める場所については、この限りでない。

    （地域連携薬局）'
- id: art-42
  title: 第六条の二
  text: '第六条の二

    薬局であつて、その機能が、医師若しくは歯科医師又は薬剤師が診療又は調剤に従事する他の医療提供施設と連携し、地域における薬剤及び医薬品の適正な使用の推進及び効率的な提供に必要な情報の提供及び薬学的知見に基づく指導を実施するために必要な機能に関する次に掲げる要件に該当するものは、その所在地の都道府県知事の認定を受けて地域連携薬局と称することができる。

    一

    構造設備が、薬剤及び医薬品について情報の提供又は薬学的知見に基づく指導を受ける者（次号及び次条第一項において「利用者」という。）の心身の状況に配慮する観点から必要なものとして厚生労働省令で定める基準に適合するものであること。

    二

    利用者の薬剤及び医薬品の使用に関する情報を他の医療提供施設と共有する体制が、厚生労働省令で定める基準に適合するものであること。

    三

    地域の患者に対し安定的に薬剤を供給するための調剤及び調剤された薬剤の販売又は授与の業務を行う体制が、厚生労働省令で定める基準に適合するものであること。

    四

    居宅等（薬剤師法（昭和三十五年法律第百四十六号）第二十二条に規定する居宅等をいう。以下同じ。）における調剤並びに情報の提供及び薬学的知見に基づく指導を行う体制が、厚生労働省令で定める基準に適合するものであること。

    ２

    前項の認定を受けようとする者は、厚生労働省令で定めるところにより、次の各号に掲げる事項を記載した申請書をその薬局の所在地の都道府県知事に提出しなければならない。

    一

    氏名又は名称及び住所並びに法人にあつては、その代表者の氏名

    二

    その薬局の名称及び所在地

    三

    前項各号に掲げる事項の概要

    四

    その他厚生労働省令で定める事項

    ３

    地域連携薬局でないものは、これに地域連携薬局又はこれに紛らわしい名称を用いてはならない。

    ４

    第一項の認定は、一年ごとにその更新を受けなければ、その期間の経過によつて、その効力を失う。

    （専門医療機関連携薬局）'
- id: art-43
  title: 第六条の三
  text: '第六条の三

    薬局であつて、その機能が、医師若しくは歯科医師又は薬剤師が診療又は調剤に従事する他の医療提供施設と連携し、薬剤の適正な使用の確保のために専門的な薬学的知見に基づく指導を実施するために必要な機能に関する次に掲げる要件に該当するものは、厚生労働省令で定めるがんその他の傷病の区分ごとに、その所在地の都道府県知事の認定を受けて専門医療機関連携薬局と称することができる。

    一

    構造設備が、利用者の心身の状況に配慮する観点から必要なものとして厚生労働省令で定める基準に適合するものであること。

    二

    利用者の薬剤及び医薬品の使用に関する情報を他の医療提供施設と共有する体制が、厚生労働省令で定める基準に適合するものであること。

    三

    専門的な薬学的知見に基づく調剤及び指導の業務を行う体制が、厚生労働省令で定める基準に適合するものであること。

    ２

    前項の認定を受けようとする者は、厚生労働省令で定めるところにより、次の各号に掲げる事項を記載した申請書をその薬局の所在地の都道府県知事に提出しなければならない。

    一

    氏名又は名称及び住所並びに法人にあつては、その代表者の氏名

    二

    その薬局において専門的な薬学的知見に基づく調剤及び指導の業務を行うために必要なものとして厚生労働省令で定める要件を満たす薬剤師の氏名

    三

    その薬局の名称及び所在地

    四

    前項各号に掲げる事項の概要

    五

    その他厚生労働省令で定める事項

    ３

    第一項の認定を受けた者は、専門医療機関連携薬局と称するに当たつては、厚生労働省令で定めるところにより、同項に規定する傷病の区分を明示しなければならない。

    ４

    専門医療機関連携薬局でないものは、これに専門医療機関連携薬局又はこれに紛らわしい名称を用いてはならない。

    ５

    第一項の認定は、一年ごとにその更新を受けなければ、その期間の経過によつて、その効力を失う。

    （認定の基準）'
- id: art-44
  title: 第六条の四
  text: 第六条の四
- id: art-45
  title: 第六条の二第一項又は前条第一項の認定の申請者が、第七十五条第四項又は第五項の規定によりその受けた認定を取り消され、その取消しの日から三年を経過しない者であるときは、第六条の二第一項又は前条第一項の認定を与えないことができる。
  text: '第六条の二第一項又は前条第一項の認定の申請者が、第七十五条第四項又は第五項の規定によりその受けた認定を取り消され、その取消しの日から三年を経過しない者であるときは、第六条の二第一項又は前条第一項の認定を与えないことができる。

    ２'
- id: art-46
  title: 第五条（第三号に係る部分に限る。）の規定は、第六条の二第一項及び前条第一項の認定について準用する。
  text: '第五条（第三号に係る部分に限る。）の規定は、第六条の二第一項及び前条第一項の認定について準用する。

    （薬局の管理）'
- id: art-47
  title: 第七条
  text: '第七条

    薬局開設者が薬剤師（薬剤師法第八条の二第一項の規定による厚生労働大臣の命令を受けた者にあつては、同条第二項の規定による登録を受けた者に限る。以下この項及び次項、第二十八条第二項、第三十一条の二第二項、第三十五条第一項並びに第四十五条において同じ。）であるときは、自らその薬局を実地に管理しなければならない。

    ただし、その薬局において薬事に関する実務に従事する他の薬剤師のうちから薬局の管理者を指定してその薬局を実地に管理させるときは、この限りでない。

    ２

    薬局開設者が薬剤師でないときは、その薬局において薬事に関する実務に従事する薬剤師のうちから薬局の管理者を指定してその薬局を実地に管理させなければならない。

    ３

    薬局の管理者は、次条第一項及び第二項に規定する義務並びに同条第三項に規定する厚生労働省令で定める業務を遂行し、並びに同項に規定する厚生労働省令で定める事項を遵守するために必要な能力及び経験を有する者でなければならない。

    ４

    薬局の管理者（第一項の規定により薬局を実地に管理する薬局開設者を含む。次条第一項及び第三項において同じ。）は、その薬局以外の場所で業として薬局の管理その他薬事に関する実務に従事する者であつてはならない。

    ただし、その薬局の所在地の都道府県知事の許可を受けたときは、この限りでない。

    （管理者の義務）'
- id: art-48
  title: 第八条
  text: '第八条

    薬局の管理者は、保健衛生上支障を生ずるおそれがないように、その薬局に勤務する薬剤師その他の従業者を監督し、その薬局の構造設備及び医薬品その他の物品を管理し、その他その薬局の業務につき、必要な注意をしなければならない。

    ２

    薬局の管理者は、保健衛生上支障を生ずるおそれがないように、その薬局の業務につき、薬局開設者に対し、必要な意見を書面により述べなければならない。

    ３

    薬局の管理者が行う薬局の管理に関する業務及び薬局の管理者が遵守すべき事項については、厚生労働省令で定める。

    （薬局開設者による薬局に関する情報の提供等）'
- id: art-49
  title: 第八条の二
  text: '第八条の二

    薬局開設者は、厚生労働省令で定めるところにより、医療を受ける者が薬局の選択を適切に行うために必要な情報として厚生労働省令で定める事項を当該薬局の所在地の都道府県知事に報告するとともに、当該事項を記載した書面を当該薬局において閲覧に供しなければならない。

    ２

    薬局開設者は、前項の規定により報告した事項について変更が生じたときは、厚生労働省令で定めるところにより、速やかに、当該薬局の所在地の都道府県知事に報告するとともに、同項に規定する書面の記載を変更しなければならない。

    ３

    薬局開設者は、第一項の規定による書面の閲覧に代えて、厚生労働省令で定めるところにより、当該書面に記載すべき事項を電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法であつて厚生労働省令で定めるものにより提供することができる。

    ４

    都道府県知事は、第一項又は第二項の規定による報告の内容を確認するために必要があると認めるときは、市町村その他の官公署に対し、当該都道府県の区域内に所在する薬局に関し必要な情報の提供を求めることができる。

    ５

    都道府県知事は、厚生労働省令で定めるところにより、第一項及び第二項の規定により報告された事項を公表しなければならない。

    （薬局開設者の遵守事項）'
- id: art-50
  title: 第九条
  text: '第九条

    厚生労働大臣は、厚生労働省令で、次に掲げる事項その他薬局の業務に関し薬局開設者が遵守すべき事項を定めることができる。

    一

    薬局における医薬品の試験検査その他の医薬品の管理の実施方法に関する事項

    二

    薬局における調剤並びに調剤された薬剤及び医薬品の販売又は授与の実施方法（その薬局においてその薬局以外の場所にいる者に対して次のイ又はロに掲げる医薬品を販売し、又は授与する場合におけるその者との間の通信手段に応じた当該実施方法を含む。）に関する事項

    イ

    要指導医薬品（第四条第五項第三号に規定する要指導医薬品をいう。以下同じ。）（特定要指導医薬品を除く。）

    ロ

    一般用医薬品（第四条第五項第四号に規定する一般用医薬品をいう。以下同じ。）

    ２

    薬局開設者は、第七条第一項ただし書又は第二項の規定によりその薬局の管理者を指定したときは、第八条第二項の規定により述べられた薬局の管理者の意見を尊重するとともに、法令遵守のために措置を講ずる必要があるときは、当該措置を講じ、かつ、講じた措置の内容（措置を講じない場合にあつては、その旨及びその理由）を記録し、これを適切に保存しなければならない。

    （薬局開設者の法令遵守体制）'
- id: art-51
  title: 第九条の二
  text: '第九条の二

    薬局開設者は、薬局の管理に関する業務その他の薬局開設者の業務を適正に遂行することにより、薬事に関する法令の規定の遵守を確保するために、厚生労働省令で定めるところにより、次の各号に掲げる措置を講じなければならない。

    一

    薬局の管理に関する業務について、薬局の管理者が有する権限を明らかにすること。

    二

    薬局の管理に関する業務その他の薬局開設者の業務の遂行が法令に適合することを確保するための体制、当該薬局開設者の薬事に関する業務に責任を有する役員及び従業者の業務の監督に係る体制その他の薬局開設者の業務の適正を確保するために必要なものとして厚生労働省令で定める体制を整備すること。

    三

    前二号に掲げるもののほか、薬局開設者の従業者に対して法令遵守のための指針を示すことその他の薬局開設者の業務の適正な遂行に必要なものとして厚生労働省令で定める措置

    ２

    薬局開設者は、前項各号に掲げる措置の内容を記録し、これを適切に保存しなければならない。

    （調剤された薬剤の販売に従事する者）'
- id: art-52
  title: 第九条の三
  text: '第九条の三

    薬局開設者は、厚生労働省令で定めるところにより、医師又は歯科医師から交付された処方箋により調剤された薬剤につき、薬剤師に販売させ、又は授与させなければならない。

    （調剤された薬剤に関する情報提供及び指導等）'
- id: art-53
  title: 第九条の四
  text: '第九条の四

    薬局開設者は、医師又は歯科医師から交付された処方箋により調剤された薬剤の適正な使用のため、当該薬剤を販売し、又は授与する場合には、厚生労働省令で定めるところにより、その薬局において薬剤の販売又は授与に従事する薬剤師に、対面等により、厚生労働省令で定める事項を記載した書面（当該事項が電磁的記録（電子的方式、磁気的方式その他人の知覚によつては認識することができない方式で作られる記録であつて、電子計算機による情報処理の用に供されるものをいう。以下第三十六条の十一までにおいて同じ。）に記録されているときは、当該電磁的記録に記録された事項を厚生労働省令で定める方法により表示したものを含む。）を用いて必要な情報を提供させ、及び必要な薬学的知見に基づく指導を行わせなければならない。

    ２

    薬局開設者は、前項の規定による情報の提供及び指導を行わせるに当たつては、当該薬剤師に、あらかじめ、当該薬剤を使用しようとする者の年齢、他の薬剤又は医薬品の使用の状況その他の厚生労働省令で定める事項を確認させなければならない。

    ３

    薬局開設者は、第一項に規定する場合において、同項の規定による情報の提供又は指導ができないとき、その他同項に規定する薬剤の適正な使用を確保することができないと認められるときは、当該薬剤を販売し、又は授与してはならない。

    ４

    薬局開設者は、医師又は歯科医師から交付された処方箋により調剤された薬剤の適正な使用のため、当該薬剤を購入し、若しくは譲り受けようとする者又は当該薬局開設者から当該薬剤を購入し、若しくは譲り受けた者から相談があつた場合には、厚生労働省令で定めるところにより、その薬局において薬剤の販売又は授与に従事する薬剤師に、必要な情報を提供させ、又は必要な薬学的知見に基づく指導を行わせなければならない。

    ５

    第一項又は前項に定める場合のほか、薬局開設者は、医師又は歯科医師から交付された処方箋により調剤された薬剤の適正な使用のため必要がある場合として厚生労働省令で定める場合には、厚生労働省令で定めるところにより、その薬局において薬剤の販売又は授与に従事する薬剤師に、その調剤した薬剤を購入し、又は譲り受けた者の当該薬剤の使用の状況を継続的かつ的確に把握させるとともに、その調剤した薬剤を購入し、又は譲り受けた者に対して必要な情報を提供させ、又は必要な薬学的知見に基づく指導を行わせなければならない。

    ６

    薬局開設者は、その薬局において薬剤の販売又は授与に従事する薬剤師に第一項又は前二項に規定する情報の提供及び指導を行わせたときは、厚生労働省令で定めるところにより、当該薬剤師にその内容を記録させなければならない。

    （薬局における掲示）'
- id: art-54
  title: 第九条の五
  text: '第九条の五

    薬局開設者は、厚生労働省令で定めるところにより、当該薬局を利用するために必要な情報であつて厚生労働省令で定める事項を、当該薬局の見やすい場所に掲示しなければならない。

    （休廃止等の届出）'
- id: art-55
  title: 第十条
  text: '第十条

    薬局開設者は、その薬局を廃止し、休止し、若しくは休止した薬局を再開したとき、又はその薬局の管理者その他厚生労働省令で定める事項を変更したときは、三十日以内に、厚生労働省令で定めるところにより、その薬局の所在地の都道府県知事にその旨を届け出なければならない。

    ２

    薬局開設者は、その薬局の名称その他厚生労働省令で定める事項を変更しようとするときは、あらかじめ、厚生労働省令で定めるところにより、その薬局の所在地の都道府県知事にその旨を届け出なければならない。

    （政令への委任）'
- id: art-56
  title: 第十一条
  text: '第十一条

    この章に定めるもののほか、薬局の開設の許可、許可の更新、管理その他薬局に関し必要な事項は、政令で定める。'
- id: art-57
  title: 第四章　医薬品、医薬部外品及び化粧品の製造販売業及び製造業
  text: '第四章　医薬品、医薬部外品及び化粧品の製造販売業及び製造業

    （製造販売業の許可）'
- id: art-58
  title: 第十二条
  text: '第十二条

    次の表の上欄に掲げる医薬品（体外診断用医薬品を除く。以下この章において同じ。）、医薬部外品又は化粧品の種類に応じ、それぞれ同表の下欄に定める厚生労働大臣の許可を受けた者でなければ、それぞれ、業として、医薬品、医薬部外品又は化粧品の製造販売をしてはならない。

    医薬品、医薬部外品又は化粧品の種類

    許可の種類'
- id: art-59
  title: 第四十九条第一項に規定する厚生労働大臣の指定する医薬品
  text: '第四十九条第一項に規定する厚生労働大臣の指定する医薬品

    第一種医薬品製造販売業許可

    前項に該当する医薬品以外の医薬品

    第二種医薬品製造販売業許可

    医薬部外品

    医薬部外品製造販売業許可

    化粧品

    化粧品製造販売業許可

    ２

    前項の許可を受けようとする者は、厚生労働省令で定めるところにより、次の各号に掲げる事項を記載した申請書を厚生労働大臣に提出しなければならない。

    一

    氏名又は名称及び住所並びに法人にあつては、その代表者の氏名

    二

    法人にあつては、薬事に関する業務に責任を有する役員の氏名

    三'
- id: art-60
  title: 第十七条第二項に規定する医薬品等総括製造販売責任者の氏名
  text: '第十七条第二項に規定する医薬品等総括製造販売責任者の氏名

    四

    次条第二項において準用する第五条第三号イからトまでに該当しない旨その他厚生労働省令で定める事項

    ３

    前項の申請書には、次の各号に掲げる書類を添付しなければならない。

    一

    法人にあつては、その組織図

    二

    次条第一項第一号に規定する申請に係る医薬品、医薬部外品又は化粧品の品質管理に係る体制に関する書類

    三

    次条第一項第二号に規定する申請に係る医薬品、医薬部外品又は化粧品の製造販売後安全管理に係る体制に関する書類

    四

    その他厚生労働省令で定める書類

    ４

    第一項の許可は、三年を下らない政令で定める期間ごとにその更新を受けなければ、その期間の経過によつて、その効力を失う。

    （許可の基準）'
