- id: art-10
  title: 第一章　総則
  text: '第一章　総則

    （目的）'
- id: art-11
  title: 第一条
  text: '第一条

    この法律は、電気用品の製造、販売等を規制するとともに、電気用品の安全性の確保につき民間事業者の自主的な活動を促進することにより、電気用品による危険及び障害の発生を防止することを目的とする。

    （定義）'
- id: art-12
  title: 第二条
  text: '第二条

    この法律において「電気用品」とは、次に掲げる物をいう。

    一

    一般用電気工作物等（電気事業法（昭和三十九年法律第百七十号）第三十八条第一項に規定する一般用電気工作物及び同条第三項に規定する小規模事業用電気工作物をいう。）の部分となり、又はこれに接続して用いられる機械、器具又は材料であつて、政令で定めるもの

    二

    携帯発電機であつて、政令で定めるもの

    三

    蓄電池であつて、政令で定めるもの

    ２

    この法律において「特定電気用品」とは、構造又は使用方法その他の使用状況からみて特に危険又は障害の発生するおそれが多い電気用品であつて、政令で定めるものをいう。

    ３

    この法律において「取引デジタルプラットフォーム」とは、特定デジタルプラットフォームの透明性及び公正性の向上に関する法律（令和二年法律第三十八号）第二条第一項に規定するデジタルプラットフォームのうち、当該デジタルプラットフォームにより提供される場が次の各号のいずれかの機能を有するものをいう。

    一

    当該デジタルプラットフォームを利用する者が、その使用に係る電子計算機の映像面に表示される手続に従つて当該電子計算機を用いて送信することによつて、電気用品の製造、輸入又は販売の事業を行う者（自らが提供する当該デジタルプラットフォームを利用して電気用品の販売を行う場合におけるものを除く。次号において同じ。）に対し、電気用品の通信販売（特定商取引に関する法律（昭和五十一年法律第五十七号）第二条第二項に規定する通信販売をいう。同号及び第四十二条の六において同じ。）に係る売買契約の申込みの意思表示を行うことができる機能

    二

    当該デジタルプラットフォームを利用する者が、その使用に係る電子計算機の映像面に表示される手続に従つて当該電子計算機を用いて送信することによつて、競りその他の政令で定める方法により電気用品の製造、輸入又は販売の事業を行う者の電気用品の通信販売に係る売買契約の相手方となるべき者を決定する手続に参加することができる機能（前号に該当するものを除く。）

    ４

    この法律において「取引デジタルプラットフォーム提供者」とは、事業として、取引デジタルプラットフォームを単独で又は共同して提供する者をいう。

    ５

    この法律において、輸入する行為には、外国にある者が外国から日本国内に他人をして持ち込ませ、一般消費者に引き取らせる行為が含まれるものとする。'
- id: art-13
  title: 第二章　事業の届出等
  text: '第二章　事業の届出等

    （事業の届出）'
- id: art-14
  title: 第三条
  text: '第三条

    電気用品の製造又は輸入の事業を行う者は、経済産業省令で定めるところにより、経済産業省令で定める電気用品の区分（以下単に「電気用品の区分」という。）に従い、事業開始の日から三十日以内に、次の事項を経済産業大臣に届け出なければならない。

    一

    氏名又は名称及び住所並びに法人にあつては、その代表者の氏名

    二

    電気用品の輸入の事業を行う者（外国にある者に限る。以下「特定輸入事業者」という。）にあつては、日本国内においてその輸入に係る電気用品による危険及び障害の拡大を防止するために必要な措置をとらせるための者（以下「国内管理人」という。）の氏名又は名称及び住所並びに法人である国内管理人にあつてはその代表者の氏名

    三

    経済産業省令で定める電気用品の型式の区分

    四

    当該電気用品の設計を行う者であることその他の経済産業省令で定める要件に該当しない者にあつては、当該電気用品を製造する工場又は事業場の名称及び所在地（電気用品の輸入の事業を行う者にあつては、当該電気用品の製造事業者の氏名又は名称及び住所）

    （承継）'
- id: art-15
  title: 第四条
  text: '第四条

    前条の届出をした者（以下「届出事業者」という。）が当該届出に係る事業の全部を譲り渡し、又は届出事業者について相続、合併若しくは分割（当該届出に係る事業の全部を承継させるものに限る。）があつたときは、その事業の全部を譲り受けた者又は相続人（相続人が二人以上ある場合において、その全員の同意により事業を承継すべき相続人を選定したときは、その者）、合併後存続する法人若しくは合併により設立した法人若しくは分割によりその事業の全部を承継した法人は、その届出事業者の地位を承継する。

    ２

    前項の規定により届出事業者の地位を承継した者は、遅滞なく、その事実を証する書面を添えて、その旨を経済産業大臣に届け出なければならない。

    （変更の届出）'
- id: art-16
  title: 第五条
  text: '第五条

    届出事業者は、第三条各号の事項に変更があつたときは、遅滞なく、その旨を経済産業大臣に届け出なければならない。

    ただし、その変更が経済産業省令で定める軽微なものであるときは、この限りでない。

    ２

    届出事業者は、第三条第四号の経済産業省令で定める要件に該当しなくなつたときは、遅滞なく、同号の事項を経済産業大臣に届け出なければならない。

    （廃止の届出）'
- id: art-17
  title: 第六条
  text: '第六条

    届出事業者は、当該届出に係る事業を廃止したときは、遅滞なく、その旨を経済産業大臣に届け出なければならない。

    （届出事項に係る情報の公表）'
- id: art-18
  title: 第七条
  text: '第七条

    経済産業大臣は、第三条の規定による届出又は第五条第一項の規定による届出（第三条第一号から第三号までの事項に係るものに限る。）があつたときは、これらの届出に係る第三条第一号から第三号までの事項に係る情報を公表するものとする。

    ２

    経済産業大臣は、前条の規定による届出があつたときは、その旨を公表するものとする。'
- id: art-19
  title: 第三章　電気用品の適合性検査等
  text: '第三章　電気用品の適合性検査等

    （基準適合義務等）'
- id: art-20
  title: 第八条
  text: '第八条

    届出事業者は、第三条の規定による届出に係る型式（以下単に「届出に係る型式」という。）の電気用品を製造し、又は輸入する場合においては、経済産業省令で定める技術上の基準（以下「技術基準」という。）に適合するようにしなければならない。

    ただし、次に掲げる場合に該当するときは、この限りでない。

    一

    特定の用途に使用される電気用品を製造し、又は輸入する場合において、経済産業大臣の承認を受けたとき。

    二

    試験的に製造し、又は輸入するとき。

    ２

    届出事業者は、経済産業省令で定めるところにより、その製造又は輸入に係る前項の電気用品（同項ただし書の規定の適用を受けて製造され、又は輸入されるものを除く。）について検査を行い、その検査記録を作成し、これを保存しなければならない。

    ３

    特定輸入事業者である届出事業者は、前項の検査記録の写しをその国内管理人に提供しなければならない。

    この場合において、当該国内管理人は、当該写しを保存しなければならない。

    ４

    特定輸入事業者である届出事業者は、その国内管理人が経済産業省令で定める基準に適合するようにしなければならない。

    （特定電気用品の適合性検査）'
- id: art-21
  title: 第九条
  text: '第九条

    届出事業者は、その製造又は輸入に係る前条第一項の電気用品（同項ただし書の規定の適用を受けて製造され、又は輸入されるものを除く。）が特定電気用品である場合には、当該特定電気用品を販売する時までに、次の各号のいずれかに掲げるものについて、経済産業大臣の登録を受けた者の次項の規定による検査（以下「適合性検査」という。）を受け、かつ、同項の証明書の交付を受け、これを保存しなければならない。

    ただし、当該特定電気用品と同一の型式に属する特定電気用品について既に第二号に係る同項の証明書の交付を受けこれを保存している場合において当該証明書の交付を受けた日から起算して特定電気用品ごとに政令で定める期間を経過していないとき又は同項の証明書と同等なものとして経済産業省令で定めるものを保存している場合は、この限りでない。

    一

    当該特定電気用品

    二

    試験用の特定電気用品及び当該特定電気用品に係る届出事業者の工場又は事業場における検査設備その他経済産業省令で定めるもの

    ２

    前項の登録を受けた者は、同項各号に掲げるものについて経済産業省令で定める方法により検査を行い、これらが技術基準又は経済産業省令で定める同項第二号の検査設備その他経済産業省令で定めるものに関する基準に適合しているときは、経済産業省令で定めるところにより、その旨を記載した証明書を当該届出事業者に交付することができる。

    ３

    特定輸入事業者である届出事業者は、その輸入に係る電気用品が特定電気用品である場合には、前項の証明書（特定機器に係る適合性評価手続の結果の外国との相互承認の実施に関する法律（平成十三年法律第百十一号）第三十五条の規定により保存している同条各号に掲げる証明書を含み、第一項第二号に係るものにあつては、同項ただし書の政令で定める期間を経過していないものに限る。）又は第一項ただし書の経済産業省令で定めるものの写しをその国内管理人に提供しなければならない。

    この場合において、当該国内管理人は、当該写しを保存しなければならない。

    （表示）'
- id: art-22
  title: 第十条
  text: '第十条

    届出事業者（特定輸入事業者である者を除く。）は、その届出に係る型式の電気用品の技術基準に対する適合性について、第八条第二項（特定電気用品の場合にあつては、同項及び前条第一項）の規定による義務を履行したときは、当該電気用品に経済産業省令で定める方式による表示を付することができる。

    ２

    特定輸入事業者である届出事業者は、その届出に係る型式の電気用品の技術基準に対する適合性について、第八条第二項及び第三項前段（特定電気用品の場合にあつては、同条第二項及び第三項前段並びに前条第一項及び第三項前段）の規定による義務を履行し、かつ、その国内管理人が第八条第三項後段（特定電気用品の場合にあつては、同項後段及び前条第三項後段）の規定による義務を履行していることを確認したときは、当該電気用品に前項の表示を付することができる。

    ３

    届出事業者がその届出に係る型式の電気用品について前二項の規定により表示を付する場合でなければ、何人も、電気用品に第一項の表示又はこれと紛らわしい表示を付してはならない。

    （改善命令）'
- id: art-23
  title: 第十一条
  text: '第十一条

    経済産業大臣は、届出事業者が第八条第一項の規定に違反していると認める場合には、届出事業者に対し、電気用品の製造、輸入又は検査の方法その他の業務の方法の改善に関し必要な措置をとるべきことを命ずることができる。

    （表示の禁止）'
- id: art-24
  title: 第十二条
  text: '第十二条

    経済産業大臣は、次の各号に掲げる場合には、届出事業者に対し、一年以内の期間を定めて当該各号に定める届出に係る型式の電気用品に第十条第一項（当該届出事業者が特定輸入事業者である場合にあつては、同条第二項）の規定により表示を付することを禁止することができる。

    一

    届出事業者が製造し、又は輸入したその届出に係る型式の電気用品（第八条第一項ただし書の規定の適用を受けて製造し、又は輸入したものを除く。）が技術基準に適合していない場合において、危険又は障害の発生を防止するため特に必要があると認めるとき

    当該技術基準に適合していない電気用品の属する届出に係る型式

    二

    届出事業者が製造し、又は輸入したその届出に係る型式の電気用品について、第八条第二項又は第九条第一項の規定に違反したとき

    当該違反に係る電気用品の属する届出に係る型式

    三

    特定輸入事業者である届出事業者が輸入したその届出に係る型式の電気用品について、第八条第三項前段又は第九条第三項前段の規定に違反したとき

    当該違反に係る電気用品の属する届出に係る型式

    四

    国内管理人が第八条第三項後段又は第九条第三項後段の規定に違反したとき

    当該違反に係る電気用品の属する届出に係る型式

    五

    届出事業者が製造し、又は輸入したその届出に係る型式の電気用品について、前条の規定による命令に違反したとき

    当該違反に係る電気用品の属する届出に係る型式

    ２

    経済産業大臣は、次に掲げる場合には、特定輸入事業者である届出事業者に対し、一年以内の期間を定めてその届出に係る電気用品の区分に属する届出に係る型式の電気用品に第十条第二項の規定により表示を付することを禁止することができる。

    一

    国内管理人が第八条第四項の経済産業省令で定める基準に適合しなくなつたと認めるとき。

    二

    国内管理人が欠けた場合において新たに国内管理人を選任しなかつたとき。'
- id: art-25
  title: 第十三条から第二十六条まで
  text: '第十三条から第二十六条まで

    削除'
- id: art-26
  title: 第四章　販売等の制限
  text: '第四章　販売等の制限

    （販売の制限）'
- id: art-27
  title: 第二十七条
  text: '第二十七条

    電気用品の製造、輸入又は販売の事業を行う者は、第十条第一項の表示が付されているものでなければ、電気用品を販売し、又は販売の目的で陳列してはならない。

    ２

    前項の規定は、同項に規定する者が次に掲げる場合に該当するときは、適用しない。

    一

    特定の用途に使用される電気用品を販売し、又は販売の目的で陳列する場合において、経済産業大臣の承認を受けたとき。

    二'
- id: art-28
  title: 第八条第一項第一号の承認に係る電気用品を販売し、又は販売の目的で陳列するとき。
  text: '第八条第一項第一号の承認に係る電気用品を販売し、又は販売の目的で陳列するとき。

    （使用の制限）'
- id: art-29
  title: 第二十八条
  text: '第二十八条

    電気事業法第二条第一項第十七号に規定する電気事業者、同法第三十八条第四項に規定する自家用電気工作物を設置する者、電気工事士法（昭和三十五年法律第百三十九号）第二条第四項に規定する電気工事士、同法第三条第三項に規定する特種電気工事資格者又は同条第四項に規定する認定電気工事従事者は、第十条第一項の表示が付されているものでなければ、電気用品を電気事業法第二条第一項第十八号に規定する電気工作物の設置又は変更の工事に使用してはならない。

    ２

    電気用品を部品又は附属品として使用して製造する物品であつて、政令で定めるものの製造の事業を行う者は、第十条第一項の表示が付されているものでなければ、電気用品をその製造に使用してはならない。

    ３

    前条第二項の規定は、前二項の場合に準用する。'
- id: art-30
  title: 第五章　検査機関の登録等
  text: '第五章　検査機関の登録等

    第一節　検査機関の登録

    （登録）'
- id: art-31
  title: 第二十九条
  text: 第二十九条
- id: art-32
  title: 第九条第一項の登録は、経済産業省令で定めるところにより、経済産業省令で定める特定電気用品の区分（以下単に「特定電気用品の区分」という。）ごとに、適合性検査を行おうとする者の申請により行う。
  text: '第九条第一項の登録は、経済産業省令で定めるところにより、経済産業省令で定める特定電気用品の区分（以下単に「特定電気用品の区分」という。）ごとに、適合性検査を行おうとする者の申請により行う。

    ２

    経済産業大臣は、前項の規定による申請があつた場合において、必要があると認めるときは、独立行政法人製品評価技術基盤機構（以下「機構」という。）に、当該申請が第三十一条第一項各号に適合しているかどうかについて、必要な調査を行わせることができる。

    （欠格条項）'
- id: art-33
  title: 第三十条
  text: '第三十条

    次の各号のいずれかに該当する者は、第九条第一項の登録を受けることができない。

    一

    この法律又はこの法律に基づく処分に違反し、罰金以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなつた日から二年を経過しない者

    二'
- id: art-34
  title: 第四十一条又は第四十二条の四第一項の規定により登録を取り消され、その取消しの日から二年を経過しない者
  text: '第四十一条又は第四十二条の四第一項の規定により登録を取り消され、その取消しの日から二年を経過しない者

    三

    法人であつて、その業務を行う役員のうちに前二号のいずれかに該当する者があるもの

    （登録の基準）'
- id: art-35
  title: 第三十一条
  text: '第三十一条

    経済産業大臣は、第二十九条第一項の規定により登録を申請した者（以下この項において「登録申請者」という。）が次に掲げる要件のすべてに適合しているときは、その登録をしなければならない。

    この場合において、登録に関して必要な手続は、経済産業省令で定める。

    一

    国際標準化機構及び国際電気標準会議が定めた製品の認証を行う機関に関する基準に適合するものであること。

    二

    登録申請者が、第九条第一項の規定により適合性検査を受けなければならないこととされる特定電気用品を製造し、又は輸入する届出事業者（以下この号及び第三十七条第二項において「受検事業者」という。）に支配されているものとして次のいずれかに該当するものでないこと。

    イ

    登録申請者が株式会社である場合にあつては、受検事業者がその親法人（会社法（平成十七年法律第八十六号）第八百七十九条第一項に規定する親法人をいう。）であること。

    ロ

    登録申請者の役員（持分会社（会社法第五百七十五条第一項に規定する持分会社をいう。）にあつては、業務を執行する社員）に占める受検事業者の役員又は職員（過去二年間に当該受検事業者の役員又は職員であつた者を含む。）の割合が二分の一を超えていること。

    ハ

    登録申請者（法人にあつては、その代表権を有する役員）が、受検事業者の役員又は職員（過去二年間に当該受検事業者の役員又は職員であつた者を含む。）であること。

    ２'
- id: art-36
  title: 第九条第一項の登録は、検査機関登録簿に次に掲げる事項を記載してするものとする。
  text: '第九条第一項の登録は、検査機関登録簿に次に掲げる事項を記載してするものとする。

    一

    登録年月日及び登録番号

    二

    登録を受けた者の氏名又は名称及び住所並びに法人にあつては、その代表者の氏名

    三

    登録を受けた者が適合性検査を行う特定電気用品の区分

    四

    登録を受けた者が適合性検査を行う事業所の名称及び所在地

    （登録の更新）'
- id: art-37
  title: 第三十二条
  text: 第三十二条
- id: art-38
  title: 第九条第一項の登録は、三年を下らない政令で定める期間ごとにその更新を受けなければ、その期間の経過によつて、その効力を失う。
  text: '第九条第一項の登録は、三年を下らない政令で定める期間ごとにその更新を受けなければ、その期間の経過によつて、その効力を失う。

    ２

    前三条の規定は、前項の登録の更新に準用する。

    第二節　国内登録検査機関

    （適合性検査の義務）'
- id: art-39
  title: 第三十三条
  text: 第三十三条
- id: art-40
  title: 第九条第一項の登録を受けた者（国内にある事業所において適合性検査を行うことにつき、その登録を受けた者に限る。以下「国内登録検査機関」という。）は、適合性検査を行うことを求められたときは、正当な理由がある場合を除き、遅滞なく、適合性検査を行わなければならない。
  text: '第九条第一項の登録を受けた者（国内にある事業所において適合性検査を行うことにつき、その登録を受けた者に限る。以下「国内登録検査機関」という。）は、適合性検査を行うことを求められたときは、正当な理由がある場合を除き、遅滞なく、適合性検査を行わなければならない。

    ２

    国内登録検査機関は、公正に、かつ、技術基準に適合する方法により適合性検査を行わなければならない。

    （事業所の変更）'
- id: art-41
  title: 第三十四条
  text: '第三十四条

    国内登録検査機関は、適合性検査を行う事業所の所在地を変更しようとするときは、変更しようとする日の二週間前までに、経済産業大臣に届け出なければならない。

    （業務規定）'
- id: art-42
  title: 第三十五条
  text: '第三十五条

    国内登録検査機関は、適合性検査の業務に関する規定（以下「業務規定」という。）を定め、適合性検査の業務の開始前に、経済産業大臣に届け出なければならない。

    これを変更しようとするときも、同様とする。

    ２

    業務規定には、適合性検査の実施方法、適合性検査に関する料金の算定方法その他の経済産業省令で定める事項を定めておかなければならない。

    （業務の休廃止）'
- id: art-43
  title: 第三十六条
  text: '第三十六条

    国内登録検査機関は、適合性検査の業務の全部又は一部を休止し、又は廃止しようとするときは、経済産業省令で定めるところにより、あらかじめ、その旨を経済産業大臣に届け出なければならない。

    （財務諸表等の備置き及び閲覧等）'
- id: art-44
  title: 第三十七条
  text: '第三十七条

    国内登録検査機関は、毎事業年度経過後三月以内に、その事業年度の財産目録、貸借対照表及び損益計算書又は収支計算書並びに事業報告書（これらのものが電磁的記録（電子的方式、磁気的方式その他の人の知覚によつては認識することができない方式で作られる記録であつて、電子計算機による情報処理の用に供されるものをいう。以下この条において同じ。）で作成され、又はその作成に代えて電磁的記録の作成がされている場合における当該電磁的記録を含む。次項及び第六十条第二号において「財務諸表等」という。）を作成し、五年間事業所に備え置かなければならない。

    ２

    受検事業者その他の利害関係人は、国内登録検査機関の業務時間内は、いつでも、次に掲げる請求をすることができる。

    ただし、第二号又は第四号の請求をするには、国内登録検査機関の定めた費用を支払わなければならない。

    一

    財務諸表等が書面をもつて作成されているときは、当該書面の閲覧又は謄写の請求

    二

    前号の書面の謄本又は抄本の請求

    三

    財務諸表等が電磁的記録をもつて作成されているときは、当該電磁的記録に記録された事項を経済産業省令で定める方法により表示したものの閲覧又は謄写の請求

    四

    前号の電磁的記録に記録された事項を電磁的方法であつて経済産業省令で定めるものにより提供することの請求又は当該事項を記載した書面の交付の請求'
- id: art-45
  title: 第三十八条及び第三十九条
  text: '第三十八条及び第三十九条

    削除

    （適合命令）'
- id: art-46
  title: 第四十条
  text: '第四十条

    経済産業大臣は、国内登録検査機関が第三十一条第一項各号のいずれかに適合しなくなつたと認めるときは、その国内登録検査機関に対し、これらの規定に適合するため必要な措置をとるべきことを命ずることができる。

    （改善命令）'
- id: art-47
  title: 第四十条の二
  text: '第四十条の二

    経済産業大臣は、国内登録検査機関が第三十三条の規定に違反していると認めるときは、当該国内登録検査機関に対し、適合性検査を行うべきこと又は適合性検査の方法その他の業務の方法の改善に関し必要な措置をとるべきことを命ずることができる。

    （登録の取消し等）'
- id: art-48
  title: 第四十一条
  text: '第四十一条

    経済産業大臣は、国内登録検査機関が次の各号のいずれかに該当するときは、その登録を取り消し、又は期間を定めて適合性検査の業務の全部若しくは一部の停止を命ずることができる。

    一'
- id: art-49
  title: 第三十条第一号又は第三号に該当するに至つたとき。
  text: '第三十条第一号又は第三号に該当するに至つたとき。

    二'
- id: art-50
  title: 第三十三条、第三十四条、第三十五条第一項、第三十六条、第三十七条第一項又は次条の規定に違反したとき。
  text: '第三十三条、第三十四条、第三十五条第一項、第三十六条、第三十七条第一項又は次条の規定に違反したとき。

    三

    正当な理由がないのに第三十七条第二項各号の規定による請求を拒んだとき。

    四

    前二条の規定による命令に違反したとき。

    五

    不正の手段により第九条第一項の登録を受けたとき。

    （帳簿の記載）'
- id: art-51
  title: 第四十二条
  text: '第四十二条

    国内登録検査機関は、帳簿を備え、適合性検査に関し経済産業省令で定める事項を記載しなければならない。

    ２

    前項の帳簿は、経済産業省令で定めるところにより、保存しなければならない。

    （経済産業大臣による適合性検査業務実施等）'
- id: art-52
  title: 第四十二条の二
  text: '第四十二条の二

    経済産業大臣は、第九条第一項の登録を受ける者がいないとき、第三十六条の規定による適合性検査の業務の全部又は一部の休止又は廃止の届出があつたとき、第四十一条の規定により同項の登録を取り消し、又は国内登録検査機関に対し適合性検査の業務の全部若しくは一部の停止を命じたとき、国内登録検査機関が天災その他の事由により適合性検査の業務の全部又は一部を実施することが困難となつたときその他必要があると認めるときは、当該適合性検査の業務の全部又は一部を自ら行うことができる。

    ２

    経済産業大臣は、前項の場合において必要があると認めるときは、国立研究開発法人産業技術総合研究所（以下「研究所」という。）又は機構に、当該適合性検査の業務の全部又は一部を行わせることができる。

    ３

    経済産業大臣が前二項の規定により適合性検査の業務の全部若しくは一部を自ら行い、又は研究所若しくは機構に行わせる場合における適合性検査の業務の引継ぎその他の必要な事項については、経済産業省令で定める。

    第三節　外国登録検査機関

    （適合性検査の義務等）'
- id: art-53
  title: 第四十二条の三
  text: 第四十二条の三
- id: art-54
  title: 第九条第一項の登録を受けた者（外国にある事業所において適合性検査を行うことにつき、その登録を受けた者に限る。以下「外国登録検査機関」という。）は、適合性検査を行うことを求められたときは、正当な理由がある場合を除き、遅滞なく、適合性検査を行わなければならない。
  text: '第九条第一項の登録を受けた者（外国にある事業所において適合性検査を行うことにつき、その登録を受けた者に限る。以下「外国登録検査機関」という。）は、適合性検査を行うことを求められたときは、正当な理由がある場合を除き、遅滞なく、適合性検査を行わなければならない。

    ２'
- id: art-55
  title: 第三十三条第二項、第三十四条から第三十七条まで、第四十条、第四十条の二及び第四十二条の規定は、外国登録検査機関に準用する。
  text: '第三十三条第二項、第三十四条から第三十七条まで、第四十条、第四十条の二及び第四十二条の規定は、外国登録検査機関に準用する。

    この場合において、第四十条及び第四十条の二中「命ずる」とあるのは、「請求する」と読み替えるものとする。

    （登録の取消し等）'
- id: art-56
  title: 第四十二条の四
  text: '第四十二条の四

    経済産業大臣は、外国登録検査機関が次の各号のいずれかに該当するときは、その登録を取り消すことができる。

    一'
- id: art-57
  title: 第三十条第一号又は第三号に該当するに至つたとき。
  text: '第三十条第一号又は第三号に該当するに至つたとき。

    二

    前条第一項の規定又は同条第二項において準用する第三十三条第二項、第三十四条、第三十五条第一項、第三十六条、第三十七条第一項若しくは第四十二条の規定に違反したとき。

    三

    正当な理由がないのに前条第二項において準用する第三十七条第二項各号の規定による請求を拒んだとき。

    四

    前条第二項において準用する第四十条又は第四十条の二の規定による請求に応じなかつたとき。

    五

    不正の手段により第九条第一項の登録を受けたとき。

    六

    経済産業大臣が、外国登録検査機関が前各号のいずれかに該当すると認めて、期間を定めて適合性検査の業務の全部又は一部の停止を請求した場合において、その請求に応じなかつたとき。

    七

    経済産業大臣が必要があると認めて外国登録検査機関に対しその業務に関し報告を求めた場合において、その報告がされず、又は虚偽の報告がされたとき。

    八

    経済産業大臣が必要があると認めてその職員に外国登録検査機関の事務所又は事業所において第四十六条第二項に規定する事項についての検査をさせ、又は関係者に質問をさせようとした場合において、その検査が拒まれ、妨げられ、若しくは忌避され、又はその質問に対して、正当な理由なく陳述がされず、若しくは虚偽の陳述がされたとき。

    九

    次項の規定による費用の負担をしないとき。

    ２

    前項第八号の検査に要する費用（政令で定めるものに限る。）は、当該検査を受ける外国登録検査機関の負担とする。

    ３

    経済産業大臣は、必要があると認めるときは、機構に、第一項第八号の規定による検査又は質問を行わせることができる。

    ４

    経済産業大臣は、前項の規定により機構に検査又は質問を行わせる場合には、機構に対し、当該検査の場所その他必要な事項を示してこれを実施すべきことを指示するものとする。

    ５

    機構は、前項の指示に従つて第三項に規定する検査又は質問を行つたときは、その結果を経済産業大臣に報告しなければならない。'
- id: art-58
  title: 第五章の二　危険等防止命令等
  text: '第五章の二　危険等防止命令等

    （危険等防止命令）'
- id: art-59
  title: 第四十二条の五
  text: '第四十二条の五

    経済産業大臣は、次の各号に掲げる事由により危険又は障害が発生するおそれがあると認める場合において、当該危険又は障害の拡大を防止するため特に必要があると認めるときは、当該各号に規定する者に対し、販売した当該電気用品の回収を図ることその他当該電気用品による危険及び障害の拡大を防止するために必要な措置をとるべきことを命ずることができる。

    一

    電気用品の製造、輸入又は販売の事業を行う者が第二十七条第一項の規定に違反して電気用品を販売したこと。

    二

    届出事業者がその届出に係る型式の電気用品で技術基準に適合しないものを製造し、輸入し、又は販売したこと（第八条第一項ただし書の規定の適用を受けて製造し、又は輸入した場合を除く。）。

    （取引デジタルプラットフォーム提供者の責務）'
- id: art-60
  title: 第四十二条の六
  text: '第四十二条の六

    取引デジタルプラットフォーム提供者は、電気用品（その提供する取引デジタルプラットフォームを利用して行われる通信販売に係るものに限る。）の製造、輸入又は販売の事業を行う者が前条の規定による命令を受けてとる措置に協力するよう努めなければならない。

    （危険等防止要請）'
