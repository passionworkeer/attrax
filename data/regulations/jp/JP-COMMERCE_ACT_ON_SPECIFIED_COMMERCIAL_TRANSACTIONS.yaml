- id: art-12
  title: 第一条
  text: '第一条

    この法律は、特定商取引（訪問販売、通信販売及び電話勧誘販売に係る取引、連鎖販売取引、特定継続的役務提供に係る取引、業務提供誘引販売取引並びに訪問購入に係る取引をいう。以下同じ。）を公正にし、及び購入者等が受けることのある損害の防止を図ることにより、購入者等の利益を保護し、あわせて商品等の流通及び役務の提供を適正かつ円滑にし、もつて国民経済の健全な発展に寄与することを目的とする。'
- id: art-13
  title: 第二章　訪問販売、通信販売及び電話勧誘販売
  text: '第二章　訪問販売、通信販売及び電話勧誘販売

    第一節　定義'
- id: art-14
  title: 第二条
  text: '第二条

    この章及び第五十八条の十八第一項において「訪問販売」とは、次に掲げるものをいう。

    一

    販売業者又は役務の提供の事業を営む者（以下「役務提供事業者」という。）が営業所、代理店その他の主務省令で定める場所（以下「営業所等」という。）以外の場所において、売買契約の申込みを受け、若しくは売買契約を締結して行う商品若しくは特定権利の販売又は役務を有償で提供する契約（以下「役務提供契約」という。）の申込みを受け、若しくは役務提供契約を締結して行う役務の提供

    二

    販売業者又は役務提供事業者が、営業所等において、営業所等以外の場所において呼び止めて営業所等に同行させた者その他政令で定める方法により誘引した者（以下「特定顧客」という。）から売買契約の申込みを受け、若しくは特定顧客と売買契約を締結して行う商品若しくは特定権利の販売又は特定顧客から役務提供契約の申込みを受け、若しくは特定顧客と役務提供契約を締結して行う役務の提供

    ２

    この章及び第五十八条の十九において「通信販売」とは、販売業者又は役務提供事業者が郵便その他の主務省令で定める方法（以下「郵便等」という。）により売買契約又は役務提供契約の申込みを受けて行う商品若しくは特定権利の販売又は役務の提供であつて電話勧誘販売に該当しないものをいう。

    ３

    この章及び第五十八条の二十第一項において「電話勧誘販売」とは、販売業者又は役務提供事業者が、電話をかけ又は政令で定める方法により電話をかけさせ、その電話において行う売買契約又は役務提供契約の締結についての勧誘（以下「電話勧誘行為」という。）により、その相手方（以下「電話勧誘顧客」という。）から当該売買契約の申込みを郵便等により受け、若しくは電話勧誘顧客と当該売買契約を郵便等により締結して行う商品若しくは特定権利の販売又は電話勧誘顧客から当該役務提供契約の申込みを郵便等により受け、若しくは電話勧誘顧客と当該役務提供契約を郵便等により締結して行う役務の提供をいう。

    ４

    この章並びに第五十八条の十九第一号及び第六十七条第一項において「特定権利」とは、次に掲げる権利をいう。

    一

    施設を利用し又は役務の提供を受ける権利のうち国民の日常生活に係る取引において販売されるものであつて政令で定めるもの

    二

    社債その他の金銭債権

    三

    株式会社の株式、合同会社、合名会社若しくは合資会社の社員の持分若しくはその他の社団法人の社員権又は外国法人の社員権でこれらの権利の性質を有するもの

    第二節　訪問販売

    （訪問販売における氏名等の明示）'
- id: art-15
  title: 第三条
  text: '第三条

    販売業者又は役務提供事業者は、訪問販売をしようとするときは、その勧誘に先立つて、その相手方に対し、販売業者又は役務提供事業者の氏名又は名称、売買契約又は役務提供契約の締結について勧誘をする目的である旨及び当該勧誘に係る商品若しくは権利又は役務の種類を明らかにしなければならない。

    （契約を締結しない旨の意思を表示した者に対する勧誘の禁止等）'
- id: art-16
  title: 第三条の二
  text: '第三条の二

    販売業者又は役務提供事業者は、訪問販売をしようとするときは、その相手方に対し、勧誘を受ける意思があることを確認するよう努めなければならない。

    ２

    販売業者又は役務提供事業者は、訪問販売に係る売買契約又は役務提供契約を締結しない旨の意思を表示した者に対し、当該売買契約又は当該役務提供契約の締結について勧誘をしてはならない。

    （訪問販売における書面の交付）'
- id: art-17
  title: 第四条
  text: '第四条

    販売業者又は役務提供事業者は、営業所等以外の場所において商品若しくは特定権利につき売買契約の申込みを受け、若しくは役務につき役務提供契約の申込みを受けたとき又は営業所等において特定顧客から商品若しくは特定権利につき売買契約の申込みを受け、若しくは役務につき役務提供契約の申込みを受けたときは、直ちに、主務省令で定めるところにより、次の事項についてその申込みの内容を記載した書面をその申込みをした者に交付しなければならない。

    ただし、その申込みを受けた際その売買契約又は役務提供契約を締結した場合においては、この限りでない。

    一

    商品若しくは権利又は役務の種類

    二

    商品若しくは権利の販売価格又は役務の対価

    三

    商品若しくは権利の代金又は役務の対価の支払の時期及び方法

    四

    商品の引渡時期若しくは権利の移転時期又は役務の提供時期

    五'
- id: art-18
  title: 第九条第一項の規定による売買契約若しくは役務提供契約の申込みの撤回又は売買契約若しくは役務提供契約の解除に関する事項（同条第二項から第七項までの規定に関する事項（第二十六条第二項、第四項又は第五項の規定の適用がある場合にあつては、当該各項の規定に関する事項を含む。）を含む。）
  text: '第九条第一項の規定による売買契約若しくは役務提供契約の申込みの撤回又は売買契約若しくは役務提供契約の解除に関する事項（同条第二項から第七項までの規定に関する事項（第二十六条第二項、第四項又は第五項の規定の適用がある場合にあつては、当該各項の規定に関する事項を含む。）を含む。）

    六

    前各号に掲げるもののほか、主務省令で定める事項

    ２

    販売業者又は役務提供事業者は、前項の規定による書面の交付に代えて、政令で定めるところにより、当該申込みをした者の承諾を得て、当該書面に記載すべき事項を電磁的方法（電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法であつて主務省令で定めるものをいう。以下同じ。）により提供することができる。

    この場合において、当該販売業者又は当該役務提供事業者は、当該書面を交付したものとみなす。

    ３

    前項前段の規定による書面に記載すべき事項の電磁的方法（主務省令で定める方法を除く。）による提供は、当該申込みをした者の使用に係る電子計算機に備えられたファイルへの記録がされた時に当該申込みをした者に到達したものとみなす。'
- id: art-19
  title: 第五条
  text: '第五条

    販売業者又は役務提供事業者は、次の各号のいずれかに該当するときは、次項に規定する場合を除き、遅滞なく（前条第一項ただし書に規定する場合に該当するときは、直ちに）、主務省令で定めるところにより、同条第一項各号の事項（同項第五号の事項については、売買契約又は役務提供契約の解除に関する事項に限る。）についてその売買契約又は役務提供契約の内容を明らかにする書面を購入者又は役務の提供を受ける者に交付しなければならない。

    一

    営業所等以外の場所において、商品若しくは特定権利につき売買契約を締結したとき又は役務につき役務提供契約を締結したとき（営業所等において特定顧客以外の顧客から申込みを受け、営業所等以外の場所において売買契約又は役務提供契約を締結したときを除く。）。

    二

    営業所等以外の場所において商品若しくは特定権利又は役務につき売買契約又は役務提供契約の申込みを受け、営業所等においてその売買契約又は役務提供契約を締結したとき。

    三

    営業所等において、特定顧客と商品若しくは特定権利につき売買契約を締結したとき又は役務につき役務提供契約を締結したとき。

    ２

    販売業者又は役務提供事業者は、前項各号のいずれかに該当する場合において、その売買契約又は役務提供契約を締結した際に、商品を引き渡し、若しくは特定権利を移転し、又は役務を提供し、かつ、商品若しくは特定権利の代金又は役務の対価の全部を受領したときは、直ちに、主務省令で定めるところにより、前条第一項第一号及び第二号の事項並びに同項第五号の事項のうち売買契約又は役務提供契約の解除に関する事項その他主務省令で定める事項を記載した書面を購入者又は役務の提供を受ける者に交付しなければならない。

    ３

    前条第二項及び第三項の規定は、前二項の規定による書面の交付について準用する。

    この場合において、同条第二項及び第三項中「申込みをした者」とあるのは、「購入者又は役務の提供を受ける者」と読み替えるものとする。

    （禁止行為）'
- id: art-20
  title: 第六条
  text: '第六条

    販売業者又は役務提供事業者は、訪問販売に係る売買契約若しくは役務提供契約の締結について勧誘をするに際し、又は訪問販売に係る売買契約若しくは役務提供契約の申込みの撤回若しくは解除を妨げるため、次の事項につき、不実のことを告げる行為をしてはならない。

    一

    商品の種類及びその性能若しくは品質又は権利若しくは役務の種類及びこれらの内容その他これらに類するものとして主務省令で定める事項

    二

    商品若しくは権利の販売価格又は役務の対価

    三

    商品若しくは権利の代金又は役務の対価の支払の時期及び方法

    四

    商品の引渡時期若しくは権利の移転時期又は役務の提供時期

    五

    当該売買契約若しくは当該役務提供契約の申込みの撤回又は当該売買契約若しくは当該役務提供契約の解除に関する事項（第九条第一項から第七項までの規定に関する事項（第二十六条第二項、第四項又は第五項の規定の適用がある場合にあつては、当該各項の規定に関する事項を含む。）を含む。）

    六

    顧客が当該売買契約又は当該役務提供契約の締結を必要とする事情に関する事項

    七

    前各号に掲げるもののほか、当該売買契約又は当該役務提供契約に関する事項であつて、顧客又は購入者若しくは役務の提供を受ける者の判断に影響を及ぼすこととなる重要なもの

    ２

    販売業者又は役務提供事業者は、訪問販売に係る売買契約又は役務提供契約の締結について勧誘をするに際し、前項第一号から第五号までに掲げる事項につき、故意に事実を告げない行為をしてはならない。

    ３

    販売業者又は役務提供事業者は、訪問販売に係る売買契約若しくは役務提供契約を締結させ、又は訪問販売に係る売買契約若しくは役務提供契約の申込みの撤回若しくは解除を妨げるため、人を威迫して困惑させてはならない。

    ４

    販売業者又は役務提供事業者は、訪問販売に係る売買契約又は役務提供契約の締結について勧誘をするためのものであることを告げずに営業所等以外の場所において呼び止めて同行させることその他政令で定める方法により誘引した者に対し、公衆の出入りする場所以外の場所において、当該売買契約又は当該役務提供契約の締結について勧誘をしてはならない。

    （合理的な根拠を示す資料の提出）'
- id: art-21
  title: 第六条の二
  text: '第六条の二

    主務大臣は、前条第一項第一号に掲げる事項につき不実のことを告げる行為をしたか否かを判断するため必要があると認めるときは、当該販売業者又は当該役務提供事業者に対し、期間を定めて、当該告げた事項の裏付けとなる合理的な根拠を示す資料の提出を求めることができる。

    この場合において、当該販売業者又は当該役務提供事業者が当該資料を提出しないときは、次条第一項及び第八条第一項の規定の適用については、当該販売業者又は当該役務提供事業者は、同号に掲げる事項につき不実のことを告げる行為をしたものとみなす。

    （指示等）'
- id: art-22
  title: 第七条
  text: '第七条

    主務大臣は、販売業者又は役務提供事業者が第三条、第三条の二第二項、第四条第一項、第五条第一項若しくは第二項若しくは第六条の規定に違反し、又は次に掲げる行為をした場合において、訪問販売に係る取引の公正及び購入者又は役務の提供を受ける者の利益が害されるおそれがあると認めるときは、その販売業者又は役務提供事業者に対し、当該違反又は当該行為の是正のための措置、購入者又は役務の提供を受ける者の利益の保護を図るための措置その他の必要な措置をとるべきことを指示することができる。

    一

    訪問販売に係る売買契約若しくは役務提供契約に基づく債務又は訪問販売に係る売買契約若しくは役務提供契約の解除によつて生ずる債務の全部又は一部の履行を拒否し、又は不当に遅延させること。

    二

    訪問販売に係る売買契約又は役務提供契約の締結について勧誘をするに際し、当該売買契約又は当該役務提供契約に関する事項であつて、顧客の判断に影響を及ぼすこととなる重要なもの（第六条第一項第一号から第五号までに掲げるものを除く。）につき、故意に事実を告げないこと。

    三

    訪問販売に係る売買契約又は役務提供契約の申込みの撤回又は解除を妨げるため、当該売買契約又は当該役務提供契約に関する事項であつて、顧客又は購入者若しくは役務の提供を受ける者の判断に影響を及ぼすこととなる重要なものにつき、故意に事実を告げないこと。

    四

    正当な理由がないのに訪問販売に係る売買契約又は役務提供契約であつて日常生活において通常必要とされる分量を著しく超える商品若しくは特定権利（第二条第四項第一号に掲げるものに限る。）の売買契約又は日常生活において通常必要とされる回数、期間若しくは分量を著しく超えて役務の提供を受ける役務提供契約の締結について勧誘することその他顧客の財産の状況に照らし不適当と認められる行為として主務省令で定めるもの

    五

    前各号に掲げるもののほか、訪問販売に関する行為であつて、訪問販売に係る取引の公正及び購入者又は役務の提供を受ける者の利益を害するおそれがあるものとして主務省令で定めるもの

    ２

    主務大臣は、前項の規定による指示をしたときは、その旨を公表しなければならない。

    （販売業者等に対する業務の停止等）'
- id: art-23
  title: 第八条
  text: '第八条

    主務大臣は、販売業者若しくは役務提供事業者が第三条、第三条の二第二項、第四条第一項、第五条第一項若しくは第二項若しくは第六条の規定に違反し若しくは前条第一項各号に掲げる行為をした場合において訪問販売に係る取引の公正及び購入者若しくは役務の提供を受ける者の利益が著しく害されるおそれがあると認めるとき、又は販売業者若しくは役務提供事業者が同項の規定による指示に従わないときは、その販売業者又は役務提供事業者に対し、二年以内の期間を限り、訪問販売に関する業務の全部又は一部を停止すべきことを命ずることができる。

    この場合において、主務大臣は、その販売業者又は役務提供事業者が個人である場合にあつては、その者に対して、当該停止を命ずる期間と同一の期間を定めて、当該停止を命ずる範囲の業務を営む法人（人格のない社団又は財団で代表者又は管理人の定めのあるものを含む。以下同じ。）の当該業務を担当する役員（業務を執行する社員、取締役、執行役、代表者、管理人又はこれらに準ずる者をいい、相談役、顧問その他いかなる名称を有する者であるかを問わず、法人に対し業務を執行する社員、取締役、執行役、代表者、管理人又はこれらに準ずる者と同等以上の支配力を有するものと認められる者を含む。以下同じ。）となることの禁止を併せて命ずることができる。

    ２

    主務大臣は、前項前段の規定により業務の停止を命ずる場合において、当該販売業者又は当該役務提供事業者が個人であり、かつ、その特定関係法人（販売業者若しくは役務提供事業者又はその役員若しくはその営業所の業務を統括する者その他の政令で定める使用人（以下単に「使用人」という。）（当該命令の日前一年以内において役員又は使用人であつた者を含む。次条第二項、第十五条の二第二項及び第二十三条の二第二項において同じ。）が事業経営を実質的に支配する法人その他の政令で定める法人をいう。以下この章において同じ。）において、当該停止を命ずる範囲の業務と同一の業務を行つていると認められるときは、当該販売業者又は当該役務提供事業者に対して、当該停止を命ずる期間と同一の期間を定めて、その特定関係法人で行つている当該同一の業務を停止すべきことを命ずることができる。

    ３

    主務大臣は、前二項の規定による命令をしたときは、その旨を公表しなければならない。

    （役員等に対する業務の禁止等）'
- id: art-24
  title: 第八条の二
  text: '第八条の二

    主務大臣は、販売業者又は役務提供事業者に対して前条第一項前段の規定により業務の停止を命ずる場合において、次の各号に掲げる場合の区分に応じ、当該各号に定める者が当該命令の理由となつた事実及び当該事実に関してその者が有していた責任の程度を考慮して当該命令の実効性を確保するためにその者による訪問販売に関する業務を制限することが相当と認められる者として主務省令で定める者に該当するときは、その者に対して、当該停止を命ずる期間と同一の期間を定めて、当該停止を命ずる範囲の業務を新たに開始すること（当該業務を営む法人の当該業務を担当する役員となることを含む。）の禁止を命ずることができる。

    一

    当該販売業者又は当該役務提供事業者が法人である場合

    その役員及び当該命令の日前一年以内においてその役員であつた者並びにその使用人及び当該命令の日前一年以内においてその使用人であつた者

    二

    当該販売業者又は当該役務提供事業者が個人である場合

    その使用人及び当該命令の日前一年以内においてその使用人であつた者

    ２

    主務大臣は、前項の規定により業務の禁止を命ずる役員又は使用人が、次の各号に掲げる者に該当するときは、当該役員又は当該使用人に対して、当該禁止を命ずる期間と同一の期間を定めて、その行つている当該各号に規定する同一の業務を停止すべきことを命ずることができる。

    一

    当該命令の理由となつた行為をしたと認められる販売業者又は役務提供事業者の特定関係法人において、当該命令により禁止を命ずる範囲の業務と同一の業務を行つていると認められる者

    二

    自ら販売業者又は役務提供事業者として当該命令により禁止を命ずる範囲の業務と同一の業務を行つていると認められる者

    ３

    主務大臣は、前二項の規定による命令をしたときは、その旨を公表しなければならない。

    （訪問販売における契約の申込みの撤回等）'
- id: art-25
  title: 第九条
  text: '第九条

    販売業者若しくは役務提供事業者が営業所等以外の場所において商品若しくは特定権利若しくは役務につき売買契約若しくは役務提供契約の申込みを受けた場合若しくは販売業者若しくは役務提供事業者が営業所等において特定顧客から商品若しくは特定権利若しくは役務につき売買契約若しくは役務提供契約の申込みを受けた場合におけるその申込みをした者又は販売業者若しくは役務提供事業者が営業所等以外の場所において商品若しくは特定権利若しくは役務につき売買契約若しくは役務提供契約を締結した場合（営業所等において申込みを受け、営業所等以外の場所において売買契約又は役務提供契約を締結した場合を除く。）若しくは販売業者若しくは役務提供事業者が営業所等において特定顧客と商品若しくは特定権利若しくは役務につき売買契約若しくは役務提供契約を締結した場合におけるその購入者若しくは役務の提供を受ける者（以下この条から第九条の三までにおいて「申込者等」という。）は、書面又は電磁的記録（電子的方式、磁気的方式その他人の知覚によつては認識することができない方式で作られる記録であつて、電子計算機による情報処理の用に供されるものをいう。以下同じ。）によりその売買契約若しくは役務提供契約の申込みの撤回又はその売買契約若しくは役務提供契約の解除（以下この条において「申込みの撤回等」という。）を行うことができる。

    ただし、申込者等が第五条第一項又は第二項の書面を受領した日（その日前に第四条第一項の書面を受領した場合にあつては、その書面を受領した日）から起算して八日を経過した場合（申込者等が、販売業者若しくは役務提供事業者が第六条第一項の規定に違反して申込みの撤回等に関する事項につき不実のことを告げる行為をしたことにより当該告げられた内容が事実であるとの誤認をし、又は販売業者若しくは役務提供事業者が同条第三項の規定に違反して威迫したことにより困惑し、これらによつて当該期間を経過するまでに申込みの撤回等を行わなかつた場合には、当該申込者等が、当該販売業者又は当該役務提供事業者が主務省令で定めるところにより当該売買契約又は当該役務提供契約の申込みの撤回等を行うことができる旨を記載して交付した書面を受領した日から起算して八日を経過した場合）においては、この限りでない。

    ２

    申込みの撤回等は、当該申込みの撤回等に係る書面又は電磁的記録による通知を発した時に、その効力を生ずる。

    ３

    申込みの撤回等があつた場合においては、販売業者又は役務提供事業者は、その申込みの撤回等に伴う損害賠償又は違約金の支払を請求することができない。

    ４

    申込みの撤回等があつた場合において、その売買契約に係る商品の引渡し又は権利の移転が既にされているときは、その引取り又は返還に要する費用は、販売業者の負担とする。

    ５

    販売業者又は役務提供事業者は、商品若しくは特定権利の売買契約又は役務提供契約につき申込みの撤回等があつた場合には、既に当該売買契約に基づき引き渡された商品が使用され若しくは当該権利が行使され又は当該役務提供契約に基づき役務が提供されたときにおいても、申込者等に対し、当該商品の使用により得られた利益若しくは当該権利の行使により得られた利益に相当する金銭又は当該役務提供契約に係る役務の対価その他の金銭の支払を請求することができない。

    ６

    役務提供事業者は、役務提供契約につき申込みの撤回等があつた場合において、当該役務提供契約に関連して金銭を受領しているときは、申込者等に対し、速やかに、これを返還しなければならない。

    ７

    役務提供契約又は特定権利の売買契約の申込者等は、その役務提供契約又は売買契約につき申込みの撤回等を行つた場合において、当該役務提供契約又は当該特定権利に係る役務の提供に伴い申込者等の土地又は建物その他の工作物の現状が変更されたときは、当該役務提供事業者又は当該特定権利の販売業者に対し、その原状回復に必要な措置を無償で講ずることを請求することができる。

    ８

    前各項の規定に反する特約で申込者等に不利なものは、無効とする。

    （通常必要とされる分量を著しく超える商品の売買契約等の申込みの撤回等）'
- id: art-26
  title: 第九条の二
  text: '第九条の二

    申込者等は、次に掲げる契約に該当する売買契約若しくは役務提供契約の申込みの撤回又は売買契約若しくは役務提供契約の解除（以下この条において「申込みの撤回等」という。）を行うことができる。

    ただし、申込者等に当該契約の締結を必要とする特別の事情があつたときは、この限りでない。

    一

    その日常生活において通常必要とされる分量を著しく超える商品若しくは特定権利（第二条第四項第一号に掲げるものに限る。次号において同じ。）の売買契約又はその日常生活において通常必要とされる回数、期間若しくは分量を著しく超えて役務の提供を受ける役務提供契約

    二

    当該販売業者又は役務提供事業者が、当該売買契約若しくは役務提供契約に基づく債務を履行することにより申込者等にとつて当該売買契約に係る商品若しくは特定権利と同種の商品若しくは特定権利の分量がその日常生活において通常必要とされる分量を著しく超えることとなること若しくは当該役務提供契約に係る役務と同種の役務の提供を受ける回数若しくは期間若しくはその分量がその日常生活において通常必要とされる回数、期間若しくは分量を著しく超えることとなることを知り、又は申込者等にとつて当該売買契約に係る商品若しくは特定権利と同種の商品若しくは特定権利の分量がその日常生活において通常必要とされる分量を既に著しく超えていること若しくは当該役務提供契約に係る役務と同種の役務の提供を受ける回数若しくは期間若しくはその分量がその日常生活において通常必要とされる回数、期間若しくは分量を既に著しく超えていることを知りながら、申込みを受け、又は締結した売買契約又は役務提供契約

    ２

    前項の規定による権利は、当該売買契約又は当該役務提供契約の締結の時から一年以内に行使しなければならない。

    ３

    前条第三項から第八項までの規定は、第一項の規定による申込みの撤回等について準用する。

    この場合において、同条第八項中「前各項」とあるのは、「次条第一項及び第二項並びに同条第三項において準用する第三項から前項まで」と読み替えるものとする。

    （訪問販売における契約の申込み又はその承諾の意思表示の取消し）'
- id: art-27
  title: 第九条の三
  text: '第九条の三

    申込者等は、販売業者又は役務提供事業者が訪問販売に係る売買契約又は役務提供契約の締結について勧誘をするに際し次の各号に掲げる行為をしたことにより、当該各号に定める誤認をし、それによつて当該売買契約若しくは当該役務提供契約の申込み又はその承諾の意思表示をしたときは、これを取り消すことができる。

    一'
- id: art-28
  title: 第六条第一項の規定に違反して不実のことを告げる行為
  text: '第六条第一項の規定に違反して不実のことを告げる行為

    当該告げられた内容が事実であるとの誤認

    二'
- id: art-29
  title: 第六条第二項の規定に違反して故意に事実を告げない行為
  text: '第六条第二項の規定に違反して故意に事実を告げない行為

    当該事実が存在しないとの誤認

    ２

    前項の規定による訪問販売に係る売買契約若しくは役務提供契約の申込み又はその承諾の意思表示の取消しは、これをもつて善意でかつ過失がない第三者に対抗することができない。

    ３

    第一項の規定は、同項に規定する訪問販売に係る売買契約若しくは役務提供契約の申込み又はその承諾の意思表示に対する民法（明治二十九年法律第八十九号）第九十六条の規定の適用を妨げるものと解してはならない。

    ４

    第一項の規定による取消権は、追認をすることができる時から一年間行わないときは、時効によつて消滅する。

    当該売買契約又は当該役務提供契約の締結の時から五年を経過したときも、同様とする。

    ５

    民法第百二十一条の二第一項の規定にかかわらず、訪問販売に係る売買契約又は役務提供契約に基づく債務の履行として給付を受けた申込者等は、第一項の規定により当該売買契約若しくは当該役務提供契約の申込み又はその承諾の意思表示を取り消した場合において、給付を受けた当時その意思表示が取り消すことができるものであることを知らなかつたときは、当該売買契約又は当該役務提供契約によつて現に利益を受けている限度において、返還の義務を負う。

    （訪問販売における契約の解除等に伴う損害賠償等の額の制限）'
- id: art-30
  title: 第十条
  text: '第十条

    販売業者又は役務提供事業者は、第五条第一項各号のいずれかに該当する売買契約又は役務提供契約の締結をした場合において、その売買契約又はその役務提供契約が解除されたときは、損害賠償額の予定又は違約金の定めがあるときにおいても、次の各号に掲げる場合に応じ当該各号に定める額にこれに対する法定利率による遅延損害金の額を加算した金額を超える額の金銭の支払を購入者又は役務の提供を受ける者に対して請求することができない。

    一

    当該商品又は当該権利が返還された場合

    当該商品の通常の使用料の額又は当該権利の行使により通常得られる利益に相当する額（当該商品又は当該権利の販売価格に相当する額から当該商品又は当該権利の返還された時における価額を控除した額が通常の使用料の額又は当該権利の行使により通常得られる利益に相当する額を超えるときは、その額）

    二

    当該商品又は当該権利が返還されない場合

    当該商品又は当該権利の販売価格に相当する額

    三

    当該役務提供契約の解除が当該役務の提供の開始後である場合

    提供された当該役務の対価に相当する額

    四

    当該契約の解除が当該商品の引渡し若しくは当該権利の移転又は当該役務の提供の開始前である場合

    契約の締結及び履行のために通常要する費用の額

    ２

    販売業者又は役務提供事業者は、第五条第一項各号のいずれかに該当する売買契約又は役務提供契約の締結をした場合において、その売買契約についての代金又はその役務提供契約についての対価の全部又は一部の支払の義務が履行されない場合（売買契約又は役務提供契約が解除された場合を除く。）には、損害賠償額の予定又は違約金の定めがあるときにおいても、当該商品若しくは当該権利の販売価格又は当該役務の対価に相当する額から既に支払われた当該商品若しくは当該権利の代金又は当該役務の対価の額を控除した額にこれに対する法定利率による遅延損害金の額を加算した金額を超える額の金銭の支払を購入者又は役務の提供を受ける者に対して請求することができない。

    第三節　通信販売

    （通信販売についての広告）'
- id: art-31
  title: 第十一条
  text: '第十一条

    販売業者又は役務提供事業者は、通信販売をする場合の商品若しくは特定権利の販売条件又は役務の提供条件について広告をするときは、主務省令で定めるところにより、当該広告に、当該商品若しくは当該権利又は当該役務に関する次の事項を表示しなければならない。

    ただし、当該広告に、請求により、これらの事項を記載した書面を遅滞なく交付し、又はこれらの事項を記録した電磁的記録を遅滞なく提供する旨の表示をする場合には、販売業者又は役務提供事業者は、主務省令で定めるところにより、これらの事項の一部を表示しないことができる。

    一

    商品若しくは権利の販売価格又は役務の対価（販売価格に商品の送料が含まれない場合には、販売価格及び商品の送料）

    二

    商品若しくは権利の代金又は役務の対価の支払の時期及び方法

    三

    商品の引渡時期若しくは権利の移転時期又は役務の提供時期

    四

    商品若しくは特定権利の売買契約又は役務提供契約に係る申込みの期間に関する定めがあるときは、その旨及びその内容

    五

    商品若しくは特定権利の売買契約又は役務提供契約の申込みの撤回又は解除に関する事項（第十五条の三第一項ただし書に規定する特約がある場合にはその内容を、第二十六条第二項の規定の適用がある場合には同項の規定に関する事項を含む。）

    六

    前各号に掲げるもののほか、主務省令で定める事項

    （誇大広告等の禁止）'
- id: art-32
  title: 第十二条
  text: '第十二条

    販売業者又は役務提供事業者は、通信販売をする場合の商品若しくは特定権利の販売条件又は役務の提供条件について広告をするときは、当該商品の性能又は当該権利若しくは当該役務の内容、当該商品若しくは当該権利の売買契約又は当該役務の役務提供契約の申込みの撤回又は解除に関する事項（第十五条の三第一項ただし書に規定する特約がある場合には、その内容を含む。）その他の主務省令で定める事項について、著しく事実に相違する表示をし、又は実際のものよりも著しく優良であり、若しくは有利であると人を誤認させるような表示をしてはならない。

    （合理的な根拠を示す資料の提出）'
- id: art-33
  title: 第十二条の二
  text: '第十二条の二

    主務大臣は、前条に規定する表示に該当するか否かを判断するため必要があると認めるときは、当該表示をした販売業者又は役務提供事業者に対し、期間を定めて、当該表示の裏付けとなる合理的な根拠を示す資料の提出を求めることができる。

    この場合において、当該販売業者又は当該役務提供事業者が当該資料を提出しないときは、第十四条第一項及び第十五条第一項の規定の適用については、当該表示は、前条に規定する表示に該当するものとみなす。

    （承諾をしていない者に対する電子メール広告の提供の禁止等）'
- id: art-34
  title: 第十二条の三
  text: '第十二条の三

    販売業者又は役務提供事業者は、次に掲げる場合を除き、通信販売をする場合の商品若しくは特定権利の販売条件又は役務の提供条件について、その相手方となる者の承諾を得ないで電子メール広告（当該広告に係る通信文その他の情報を電磁的方法により送信し、これを当該広告の相手方の使用に係る電子計算機の映像面に表示されるようにする方法により行う広告をいう。以下同じ。）をしてはならない。

    一

    相手方となる者の請求に基づき、通信販売をする場合の商品若しくは特定権利の販売条件又は役務の提供条件に係る電子メール広告（以下この節において「通信販売電子メール広告」という。）をするとき。

    二

    当該販売業者の販売する商品若しくは特定権利若しくは当該役務提供事業者の提供する役務につき売買契約若しくは役務提供契約の申込みをした者又はこれらにつき売買契約若しくは役務提供契約を締結した者に対し、主務省令で定める方法により当該申込み若しくは当該契約の内容又は当該契約の履行に関する事項を通知する場合において、主務省令で定めるところにより通信販売電子メール広告をするとき。

    三

    前二号に掲げるもののほか、通常通信販売電子メール広告の提供を受ける者の利益を損なうおそれがないと認められる場合として主務省令で定める場合において、通信販売電子メール広告をするとき。

    ２

    前項に規定する承諾を得、又は同項第一号に規定する請求を受けた販売業者又は役務提供事業者は、当該通信販売電子メール広告の相手方から通信販売電子メール広告の提供を受けない旨の意思の表示を受けたときは、当該相手方に対し、通信販売電子メール広告をしてはならない。

    ただし、当該意思の表示を受けた後に再び通信販売電子メール広告をすることにつき当該相手方から請求を受け、又は当該相手方の承諾を得た場合には、この限りでない。

    ３

    販売業者又は役務提供事業者は、通信販売電子メール広告をするときは、第一項第二号又は第三号に掲げる場合を除き、当該通信販売電子メール広告をすることにつきその相手方の承諾を得、又はその相手方から請求を受けたことの記録として主務省令で定めるものを作成し、主務省令で定めるところによりこれを保存しなければならない。

    ４

    販売業者又は役務提供事業者は、通信販売電子メール広告をするときは、第一項第二号又は第三号に掲げる場合を除き、当該通信販売電子メール広告に、第十一条各号に掲げる事項のほか、主務省令で定めるところにより、その相手方が通信販売電子メール広告の提供を受けない旨の意思の表示をするために必要な事項として主務省令で定めるものを表示しなければならない。

    ５

    前二項の規定は、販売業者又は役務提供事業者が他の者に次に掲げる業務の全てにつき一括して委託しているときは、その委託に係る通信販売電子メール広告については、適用しない。

    一

    通信販売電子メール広告をすることにつきその相手方の承諾を得、又はその相手方から請求を受ける業務

    二

    第三項に規定する記録を作成し、及び保存する業務

    三

    前項に規定する通信販売電子メール広告の提供を受けない旨の意思の表示をするために必要な事項を表示する業務'
- id: art-35
  title: 第十二条の四
  text: '第十二条の四

    販売業者又は役務提供事業者から前条第五項各号に掲げる業務の全てにつき一括して委託を受けた者（以下この節並びに第六十六条第六項及び第六十七条第一項第四号において「通信販売電子メール広告受託事業者」という。）は、次に掲げる場合を除き、当該業務を委託した販売業者又は役務提供事業者（以下この節において「通信販売電子メール広告委託者」という。）が通信販売をする場合の商品若しくは特定権利の販売条件又は役務の提供条件について、その相手方となる者の承諾を得ないで通信販売電子メール広告をしてはならない。

    一

    相手方となる者の請求に基づき、通信販売電子メール広告委託者に係る通信販売電子メール広告をするとき。

    二

    前号に掲げるもののほか、通常通信販売電子メール広告委託者に係る通信販売電子メール広告の提供を受ける者の利益を損なうおそれがないと認められる場合として主務省令で定める場合において、通信販売電子メール広告委託者に係る通信販売電子メール広告をするとき。

    ２

    前条第二項から第四項までの規定は、通信販売電子メール広告受託事業者による通信販売電子メール広告委託者に係る通信販売電子メール広告について準用する。

    この場合において、同条第三項及び第四項中「第一項第二号又は第三号」とあるのは、「次条第一項第二号」と読み替えるものとする。

    （承諾をしていない者に対するファクシミリ広告の提供の禁止等）'
- id: art-36
  title: 第十二条の五
  text: '第十二条の五

    販売業者又は役務提供事業者は、次に掲げる場合を除き、通信販売をする場合の商品若しくは特定権利の販売条件又は役務の提供条件について、その相手方となる者の承諾を得ないでファクシミリ広告（当該広告に係る通信文その他の情報をファクシミリ装置を用いて送信する方法により行う広告をいう。第一号において同じ。）をしてはならない。

    一

    相手方となる者の請求に基づき、通信販売をする場合の商品若しくは特定権利の販売条件又は役務の提供条件に係るファクシミリ広告（以下この条において「通信販売ファクシミリ広告」という。）をするとき。

    二

    当該販売業者の販売する商品若しくは特定権利若しくは当該役務提供事業者の提供する役務につき売買契約若しくは役務提供契約の申込みをした者又はこれらにつき売買契約若しくは役務提供契約を締結した者に対し、主務省令で定める方法により当該申込み若しくは当該契約の内容又は当該契約の履行に関する事項を通知する場合において、主務省令で定めるところにより通信販売ファクシミリ広告をするとき。

    三

    前二号に掲げるもののほか、通常通信販売ファクシミリ広告の提供を受ける者の利益を損なうおそれがないと認められる場合として主務省令で定める場合において、通信販売ファクシミリ広告をするとき。

    ２

    前項に規定する承諾を得、又は同項第一号に規定する請求を受けた販売業者又は役務提供事業者は、当該通信販売ファクシミリ広告の相手方から通信販売ファクシミリ広告の提供を受けない旨の意思の表示を受けたときは、当該相手方に対し、通信販売ファクシミリ広告をしてはならない。

    ただし、当該意思の表示を受けた後に再び通信販売ファクシミリ広告をすることにつき当該相手方から請求を受け、又は当該相手方の承諾を得た場合には、この限りでない。

    ３

    販売業者又は役務提供事業者は、通信販売ファクシミリ広告をするときは、第一項第二号又は第三号に掲げる場合を除き、当該通信販売ファクシミリ広告をすることにつきその相手方の承諾を得、又はその相手方から請求を受けたことの記録として主務省令で定めるものを作成し、主務省令で定めるところによりこれを保存しなければならない。

    ４

    販売業者又は役務提供事業者は、通信販売ファクシミリ広告をするときは、第一項第二号又は第三号に掲げる場合を除き、当該通信販売ファクシミリ広告に、第十一条各号に掲げる事項のほか、主務省令で定めるところにより、その相手方が通信販売ファクシミリ広告の提供を受けない旨の意思の表示をするために必要な事項として主務省令で定めるものを表示しなければならない。

    （特定申込みを受ける際の表示）'
- id: art-37
  title: 第十二条の六
  text: '第十二条の六

    販売業者又は役務提供事業者は、当該販売業者若しくは当該役務提供事業者若しくはそれらの委託を受けた者が定める様式の書面により顧客が行う通信販売に係る売買契約若しくは役務提供契約の申込み又は当該販売業者若しくは当該役務提供事業者若しくはそれらの委託を受けた者が電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法により顧客の使用に係る電子計算機の映像面に表示する手続に従つて顧客が行う通信販売に係る売買契約若しくは役務提供契約の申込み（以下「特定申込み」と総称する。）を受ける場合には、当該特定申込みに係る書面又は手続が表示される映像面に、次に掲げる事項を表示しなければならない。

    一

    当該売買契約に基づいて販売する商品若しくは特定権利又は当該役務提供契約に基づいて提供する役務の分量

    二

    当該売買契約又は当該役務提供契約に係る第十一条第一号から第五号までに掲げる事項

    ２

    販売業者又は役務提供事業者は、特定申込みに係る書面又は手続が表示される映像面において、次に掲げる表示をしてはならない。

    一

    当該書面の送付又は当該手続に従つた情報の送信が通信販売に係る売買契約又は役務提供契約の申込みとなることにつき、人を誤認させるような表示

    二

    前項各号に掲げる事項につき、人を誤認させるような表示

    （通信販売における承諾等の通知）'
- id: art-38
  title: 第十三条
  text: '第十三条

    販売業者又は役務提供事業者は、商品若しくは特定権利又は役務につき売買契約又は役務提供契約の申込みをした者から当該商品の引渡し若しくは当該権利の移転又は当該役務の提供に先立つて当該商品若しくは当該権利の代金又は当該役務の対価の全部又は一部を受領することとする通信販売をする場合において、郵便等により当該商品若しくは当該権利又は当該役務につき売買契約又は役務提供契約の申込みを受け、かつ、当該商品若しくは当該権利の代金又は当該役務の対価の全部又は一部を受領したときは、遅滞なく、主務省令で定めるところにより、その申込みを承諾する旨又は承諾しない旨（その受領前にその申込みを承諾する旨又は承諾しない旨をその申込みをした者に通知している場合には、その旨）その他の主務省令で定める事項をその者に書面により通知しなければならない。

    ただし、当該商品若しくは当該権利の代金又は当該役務の対価の全部又は一部を受領した後遅滞なく当該商品を送付し、若しくは当該権利を移転し、又は当該役務を提供したときは、この限りでない。

    ２

    販売業者又は役務提供事業者は、前項の規定による書面による通知に代えて、政令で定めるところにより、当該申込みをした者の承諾を得て、当該書面に記載すべき事項を電磁的方法により提供することができる。

    この場合において、当該販売業者又は当該役務提供事業者は、当該書面による通知をしたものとみなす。

    （不実の告知の禁止）'
- id: art-39
  title: 第十三条の二
  text: '第十三条の二

    販売業者又は役務提供事業者は、通信販売に係る売買契約又は役務提供契約の申込みの撤回又は解除を妨げるため、当該売買契約若しくは当該役務提供契約の申込みの撤回若しくは当該売買契約若しくは当該役務提供契約の解除に関する事項（第十五条の三の規定に関する事項を含む。）又は顧客が当該売買契約若しくは当該役務提供契約の締結を必要とする事情に関する事項につき、不実のことを告げる行為をしてはならない。

    （指示等）'
- id: art-40
  title: 第十四条
  text: '第十四条

    主務大臣は、販売業者又は役務提供事業者が第十一条、第十二条、第十二条の三（第五項を除く。）、第十二条の五、第十二条の六、第十三条第一項若しくは前条の規定に違反し、又は次に掲げる行為をした場合において、通信販売に係る取引の公正及び購入者又は役務の提供を受ける者の利益が害されるおそれがあると認めるときは、その販売業者又は役務提供事業者に対し、当該違反又は当該行為の是正のための措置、購入者又は役務の提供を受ける者の利益の保護を図るための措置その他の必要な措置をとるべきことを指示することができる。

    一

    通信販売に係る売買契約若しくは役務提供契約に基づく債務又は通信販売に係る売買契約若しくは役務提供契約の解除によつて生ずる債務の全部又は一部の履行を拒否し、又は不当に遅延させること。

    二

    顧客の意に反して通信販売に係る売買契約又は役務提供契約の申込みをさせようとする行為として主務省令で定めるもの

    三

    前二号に掲げるもののほか、通信販売に関する行為であつて、通信販売に係る取引の公正及び購入者又は役務の提供を受ける者の利益を害するおそれがあるものとして主務省令で定めるもの

    ２

    主務大臣は、通信販売電子メール広告受託事業者が第十二条の四第一項若しくは同条第二項において準用する第十二条の三第二項から第四項までの規定に違反し、又は次に掲げる行為をした場合において、通信販売に係る取引の公正及び購入者又は役務の提供を受ける者の利益が害されるおそれがあると認めるときは、その通信販売電子メール広告受託事業者に対し、必要な措置をとるべきことを指示することができる。

    一

    顧客の意に反して通信販売電子メール広告委託者に対する通信販売に係る売買契約又は役務提供契約の申込みをさせようとする行為として主務省令で定めるもの

    二

    前号に掲げるもののほか、通信販売に関する行為であつて、通信販売に係る取引の公正及び購入者又は役務の提供を受ける者の利益を害するおそれがあるものとして主務省令で定めるもの

    ３

    主務大臣は、第一項の規定による指示をしたときは、その旨を公表しなければならない。

    ４

    主務大臣は、第二項の規定による指示をしたときは、その旨を公表しなければならない。

    （販売業者等に対する業務の停止等）'
- id: art-41
  title: 第十五条
  text: '第十五条

    主務大臣は、販売業者若しくは役務提供事業者が第十一条、第十二条、第十二条の三（第五項を除く。）、第十二条の五、第十二条の六、第十三条第一項若しくは第十三条の二の規定に違反し若しくは前条第一項各号に掲げる行為をした場合において通信販売に係る取引の公正及び購入者若しくは役務の提供を受ける者の利益が著しく害されるおそれがあると認めるとき、又は販売業者若しくは役務提供事業者が同項の規定による指示に従わないときは、その販売業者又は役務提供事業者に対し、二年以内の期間を限り、通信販売に関する業務の全部又は一部を停止すべきことを命ずることができる。

    この場合において、主務大臣は、その販売業者又は役務提供事業者が個人である場合にあつては、その者に対して、当該停止を命ずる期間と同一の期間を定めて、当該停止を命ずる範囲の業務を営む法人の当該業務を担当する役員となることの禁止を併せて命ずることができる。

    ２

    主務大臣は、前項前段の規定により業務の停止を命ずる場合において、当該販売業者又は当該役務提供事業者が個人であり、かつ、その特定関係法人において、当該停止を命ずる範囲の業務と同一の業務を行つていると認められるときは、当該販売業者又は当該役務提供事業者に対して、当該停止を命ずる期間と同一の期間を定めて、その特定関係法人で行つている当該同一の業務を停止すべきことを命ずることができる。

    ３

    主務大臣は、通信販売電子メール広告受託事業者が第十二条の四第一項若しくは同条第二項において準用する第十二条の三第二項から第四項までの規定に違反し若しくは前条第二項各号に掲げる行為をした場合において通信販売に係る取引の公正及び購入者若しくは役務の提供を受ける者の利益が著しく害されるおそれがあると認めるとき、又は通信販売電子メール広告受託事業者が同項の規定による指示に従わないときは、その通信販売電子メール広告受託事業者に対し、一年以内の期間を限り、通信販売電子メール広告に関する業務の全部又は一部を停止すべきことを命ずることができる。

    ４

    主務大臣は、第一項又は第二項の規定による命令をしたときは、その旨を公表しなければならない。

    ５

    主務大臣は、第三項の規定による命令をしたときは、その旨を公表しなければならない。

    （役員等に対する業務の禁止等）'
- id: art-42
  title: 第十五条の二
  text: '第十五条の二

    主務大臣は、販売業者又は役務提供事業者に対して前条第一項前段の規定により業務の停止を命ずる場合において、次の各号に掲げる場合の区分に応じ、当該各号に定める者が当該命令の理由となつた事実及び当該事実に関してその者が有していた責任の程度を考慮して当該命令の実効性を確保するためにその者による通信販売に関する業務を制限することが相当と認められる者として主務省令で定める者に該当するときは、その者に対して、当該停止を命ずる期間と同一の期間を定めて、当該停止を命ずる範囲の業務を新たに開始すること（当該業務を営む法人の当該業務を担当する役員となることを含む。）の禁止を命ずることができる。

    一

    当該販売業者又は当該役務提供事業者が法人である場合

    その役員及び当該命令の日前一年以内においてその役員であつた者並びにその使用人及び当該命令の日前一年以内においてその使用人であつた者

    二

    当該販売業者又は当該役務提供事業者が個人である場合

    その使用人及び当該命令の日前一年以内においてその使用人であつた者

    ２

    主務大臣は、前項の規定により業務の禁止を命ずる役員又は使用人が、次の各号に掲げる者に該当するときは、当該役員又は当該使用人に対して、当該禁止を命ずる期間と同一の期間を定めて、その行つている当該各号に規定する同一の業務を停止すべきことを命ずることができる。

    一

    当該命令の理由となつた行為をしたと認められる販売業者又は役務提供事業者の特定関係法人において、当該命令により禁止を命ずる範囲の業務と同一の業務を行つていると認められる者

    二

    自ら販売業者又は役務提供事業者として当該命令により禁止を命ずる範囲の業務と同一の業務を行つていると認められる者

    ３

    主務大臣は、前二項の規定による命令をしたときは、その旨を公表しなければならない。

    （通信販売における契約の解除等）'
- id: art-43
  title: 第十五条の三
  text: '第十五条の三

    通信販売をする場合の商品又は特定権利の販売条件について広告をした販売業者が当該商品若しくは当該特定権利の売買契約の申込みを受けた場合におけるその申込みをした者又は売買契約を締結した場合におけるその購入者（次項において単に「購入者」という。）は、その売買契約に係る商品の引渡し又は特定権利の移転を受けた日から起算して八日を経過するまでの間は、その売買契約の申込みの撤回又はその売買契約の解除（以下この条において「申込みの撤回等」という。）を行うことができる。

    ただし、当該販売業者が申込みの撤回等についての特約を当該広告に表示していた場合（当該売買契約が電子消費者契約に関する民法の特例に関する法律（平成十三年法律第九十五号）第二条第一項に規定する電子消費者契約に該当する場合その他主務省令で定める場合にあつては、当該広告に表示し、かつ、広告に表示する方法以外の方法であつて主務省令で定める方法により表示していた場合）には、この限りでない。

    ２

    申込みの撤回等があつた場合において、その売買契約に係る商品の引渡し又は特定権利の移転が既にされているときは、その引取り又は返還に要する費用は、購入者の負担とする。

    （通信販売における契約の申込みの意思表示の取消し）'
- id: art-44
  title: 第十五条の四
  text: '第十五条の四

    特定申込みをした者は、販売業者又は役務提供事業者が当該特定申込みを受けるに際し次の各号に掲げる行為をしたことにより、当該各号に定める誤認をし、それによつて当該特定申込みの意思表示をしたときは、これを取り消すことができる。

    一'
- id: art-45
  title: 第十二条の六第一項の規定に違反して不実の表示をする行為
  text: '第十二条の六第一項の規定に違反して不実の表示をする行為

    当該表示が事実であるとの誤認

    二'
- id: art-46
  title: 第十二条の六第一項の規定に違反して表示をしない行為
  text: '第十二条の六第一項の規定に違反して表示をしない行為

    当該表示がされていない事項が存在しないとの誤認

    三'
- id: art-47
  title: 第十二条の六第二項第一号に掲げる表示をする行為
  text: '第十二条の六第二項第一号に掲げる表示をする行為

    同号に規定する書面の送付又は手続に従つた情報の送信が通信販売に係る売買契約又は役務提供契約の申込みとならないとの誤認

    四'
- id: art-48
  title: 第十二条の六第二項第二号に掲げる表示をする行為
  text: '第十二条の六第二項第二号に掲げる表示をする行為

    同条第一項各号に掲げる事項についての誤認

    ２'
- id: art-49
  title: 第九条の三第二項から第五項までの規定は、前項の規定による特定申込みの意思表示の取消しについて準用する。
  text: '第九条の三第二項から第五項までの規定は、前項の規定による特定申込みの意思表示の取消しについて準用する。

    第四節　電話勧誘販売

    （電話勧誘販売における氏名等の明示）'
- id: art-50
  title: 第十六条
  text: '第十六条

    販売業者又は役務提供事業者は、電話勧誘販売をしようとするときは、その勧誘に先立つて、その相手方に対し、販売業者又は役務提供事業者の氏名又は名称及びその勧誘を行う者の氏名並びに商品若しくは権利又は役務の種類並びにその電話が売買契約又は役務提供契約の締結について勧誘をするためのものであることを告げなければならない。

    （契約を締結しない旨の意思を表示した者に対する勧誘の禁止）'
- id: art-51
  title: 第十七条
  text: '第十七条

    販売業者又は役務提供事業者は、電話勧誘販売に係る売買契約又は役務提供契約を締結しない旨の意思を表示した者に対し、当該売買契約又は当該役務提供契約の締結について勧誘をしてはならない。

    （電話勧誘販売における書面の交付）'
- id: art-52
  title: 第十八条
  text: '第十八条

    販売業者又は役務提供事業者は、電話勧誘行為により、電話勧誘顧客から商品若しくは特定権利につき当該売買契約の申込みを郵便等により受け、又は役務につき当該役務提供契約の申込みを郵便等により受けたときは、遅滞なく、主務省令で定めるところにより、次の事項についてその申込みの内容を記載した書面をその申込みをした者に交付しなければならない。

    ただし、その申込みを受けた際その売買契約又は役務提供契約を締結した場合においては、この限りでない。

    一

    商品若しくは権利又は役務の種類

    二

    商品若しくは権利の販売価格又は役務の対価

    三

    商品若しくは権利の代金又は役務の対価の支払の時期及び方法

    四

    商品の引渡時期若しくは権利の移転時期又は役務の提供時期

    五'
- id: art-53
  title: 第二十四条第一項の規定による売買契約若しくは役務提供契約の申込みの撤回又は売買契約若しくは役務提供契約の解除に関する事項（同条第二項から第七項までの規定に関する事項（第二十六条第二項、第四項又は第五項の規定の適用がある場合にあつては、当該各項の規定に関する事項を含む。）を含む。）
  text: '第二十四条第一項の規定による売買契約若しくは役務提供契約の申込みの撤回又は売買契約若しくは役務提供契約の解除に関する事項（同条第二項から第七項までの規定に関する事項（第二十六条第二項、第四項又は第五項の規定の適用がある場合にあつては、当該各項の規定に関する事項を含む。）を含む。）

    六

    前各号に掲げるもののほか、主務省令で定める事項

    ２

    販売業者又は役務提供事業者は、前項の規定による書面の交付に代えて、政令で定めるところにより、当該申込みをした者の承諾を得て、当該書面に記載すべき事項を電磁的方法により提供することができる。

    この場合において、当該販売業者又は当該役務提供事業者は、当該書面を交付したものとみなす。

    ３

    前項前段の規定による書面に記載すべき事項の電磁的方法（主務省令で定める方法を除く。）による提供は、当該申込みをした者の使用に係る電子計算機に備えられたファイルへの記録がされた時に当該申込みをした者に到達したものとみなす。'
- id: art-54
  title: 第十九条
  text: '第十九条

    販売業者又は役務提供事業者は、次の各号のいずれかに該当するときは、次項に規定する場合を除き、遅滞なく、主務省令で定めるところにより、前条第一項各号の事項（同項第五号の事項については、売買契約又は役務提供契約の解除に関する事項に限る。）についてその売買契約又は役務提供契約の内容を明らかにする書面を購入者又は役務の提供を受ける者に交付しなければならない。

    一

    電話勧誘行為により、電話勧誘顧客と商品若しくは特定権利につき当該売買契約を郵便等により締結したとき又は役務につき当該役務提供契約を郵便等により締結したとき。

    二

    電話勧誘行為により電話勧誘顧客から商品若しくは特定権利又は役務につき当該売買契約又は当該役務提供契約の申込みを郵便等により受け、その売買契約又は役務提供契約を締結したとき。

    ２

    販売業者又は役務提供事業者は、前項第二号に該当する場合において、その売買契約又は役務提供契約を締結した際に、商品を引き渡し、若しくは特定権利を移転し、又は役務を提供し、かつ、商品若しくは特定権利の代金又は役務の対価の全部を受領したときは、直ちに、主務省令で定めるところにより、前条第一項第一号及び第二号の事項並びに同項第五号の事項のうち売買契約又は役務提供契約の解除に関する事項その他主務省令で定める事項を記載した書面を購入者又は役務の提供を受ける者に交付しなければならない。

    ３

    前条第二項及び第三項の規定は、前二項の規定による書面の交付について準用する。

    この場合において、同条第二項及び第三項中「申込みをした者」とあるのは、「購入者又は役務の提供を受ける者」と読み替えるものとする。

    （電話勧誘販売における承諾等の通知）'
- id: art-55
  title: 第二十条
  text: '第二十条

    販売業者又は役務提供事業者は、商品若しくは特定権利又は役務につき売買契約又は役務提供契約の申込みをした者から当該商品の引渡し若しくは当該権利の移転又は当該役務の提供に先立つて当該商品若しくは当該権利の代金又は当該役務の対価の全部又は一部を受領することとする電話勧誘販売をする場合において、郵便等により当該商品若しくは当該権利又は当該役務につき売買契約又は役務提供契約の申込みを受け、かつ、当該商品若しくは当該権利の代金又は当該役務の対価の全部又は一部を受領したときは、遅滞なく、主務省令で定めるところにより、その申込みを承諾する旨又は承諾しない旨（その受領前にその申込みを承諾する旨又は承諾しない旨をその申込みをした者に通知している場合には、その旨）その他の主務省令で定める事項をその者に書面により通知しなければならない。

    ただし、当該商品若しくは当該権利の代金又は当該役務の対価の全部又は一部を受領した後遅滞なく当該商品を送付し、若しくは当該権利を移転し、又は当該役務を提供したときは、この限りでない。

    ２

    販売業者又は役務提供事業者は、前項の規定による書面による通知に代えて、政令で定めるところにより、当該申込みをした者の承諾を得て、当該書面に記載すべき事項を電磁的方法により提供することができる。

    この場合において、当該販売業者又は当該役務提供事業者は、当該書面による通知をしたものとみなす。

    （禁止行為）'
- id: art-56
  title: 第二十一条
  text: '第二十一条

    販売業者又は役務提供事業者は、電話勧誘販売に係る売買契約若しくは役務提供契約の締結について勧誘をするに際し、又は電話勧誘販売に係る売買契約若しくは役務提供契約の申込みの撤回若しくは解除を妨げるため、次の事項につき、不実のことを告げる行為をしてはならない。

    一

    商品の種類及びその性能若しくは品質又は権利若しくは役務の種類及びこれらの内容その他これらに類するものとして主務省令で定める事項

    二

    商品若しくは権利の販売価格又は役務の対価

    三

    商品若しくは権利の代金又は役務の対価の支払の時期及び方法

    四

    商品の引渡時期若しくは権利の移転時期又は役務の提供時期

    五

    当該売買契約若しくは当該役務提供契約の申込みの撤回又は当該売買契約若しくは当該役務提供契約の解除に関する事項（第二十四条第一項から第七項までの規定に関する事項（第二十六条第二項、第四項又は第五項の規定の適用がある場合にあつては、当該各項の規定に関する事項を含む。）を含む。）

    六

    電話勧誘顧客が当該売買契約又は当該役務提供契約の締結を必要とする事情に関する事項

    七

    前各号に掲げるもののほか、当該売買契約又は当該役務提供契約に関する事項であつて、電話勧誘顧客又は購入者若しくは役務の提供を受ける者の判断に影響を及ぼすこととなる重要なもの

    ２

    販売業者又は役務提供事業者は、電話勧誘販売に係る売買契約又は役務提供契約の締結について勧誘をするに際し、前項第一号から第五号までに掲げる事項につき、故意に事実を告げない行為をしてはならない。

    ３

    販売業者又は役務提供事業者は、電話勧誘販売に係る売買契約若しくは役務提供契約を締結させ、又は電話勧誘販売に係る売買契約若しくは役務提供契約の申込みの撤回若しくは解除を妨げるため、人を威迫して困惑させてはならない。

    （合理的な根拠を示す資料の提出）'
- id: art-57
  title: 第二十一条の二
  text: '第二十一条の二

    主務大臣は、前条第一項第一号に掲げる事項につき不実のことを告げる行為をしたか否かを判断するため必要があると認めるときは、当該販売業者又は当該役務提供事業者に対し、期間を定めて、当該告げた事項の裏付けとなる合理的な根拠を示す資料の提出を求めることができる。

    この場合において、当該販売業者又は当該役務提供事業者が当該資料を提出しないときは、次条第一項及び第二十三条第一項の規定の適用については、当該販売業者又は当該役務提供事業者は、同号に掲げる事項につき不実のことを告げる行為をしたものとみなす。

    （指示等）'
- id: art-58
  title: 第二十二条
  text: '第二十二条

    主務大臣は、販売業者又は役務提供事業者が第十六条、第十七条、第十八条第一項、第十九条第一項若しくは第二項、第二十条第一項若しくは第二十一条の規定に違反し、又は次に掲げる行為をした場合において、電話勧誘販売に係る取引の公正及び購入者又は役務の提供を受ける者の利益が害されるおそれがあると認めるときは、その販売業者又は役務提供事業者に対し、当該違反又は当該行為の是正のための措置、購入者又は役務の提供を受ける者の利益の保護を図るための措置その他の必要な措置をとるべきことを指示することができる。

    一

    電話勧誘販売に係る売買契約若しくは役務提供契約に基づく債務又は電話勧誘販売に係る売買契約若しくは役務提供契約の解除によつて生ずる債務の全部又は一部の履行を拒否し、又は不当に遅延させること。

    二

    電話勧誘販売に係る売買契約又は役務提供契約の締結について勧誘をするに際し、当該売買契約又は当該役務提供契約に関する事項であつて、電話勧誘顧客の判断に影響を及ぼすこととなる重要なもの（第二十一条第一項第一号から第五号までに掲げるものを除く。）につき、故意に事実を告げないこと。

    三

    電話勧誘販売に係る売買契約又は役務提供契約の申込みの撤回又は解除を妨げるため、当該売買契約又は当該役務提供契約に関する事項であつて、電話勧誘顧客又は購入者若しくは役務の提供を受ける者の判断に影響を及ぼすこととなる重要なものにつき、故意に事実を告げないこと。

    四

    正当な理由がないのに電話勧誘販売に係る売買契約又は役務提供契約であつて日常生活において通常必要とされる分量を著しく超える商品若しくは特定権利（第二条第四項第一号に掲げるものに限る。）の売買契約又は日常生活において通常必要とされる回数、期間若しくは分量を著しく超えて役務の提供を受ける役務提供契約の締結について勧誘することその他電話勧誘顧客の財産の状況に照らし不適当と認められる行為として主務省令で定めるもの

    五

    前各号に掲げるもののほか、電話勧誘販売に関する行為であつて、電話勧誘販売に係る取引の公正及び購入者又は役務の提供を受ける者の利益を害するおそれがあるものとして主務省令で定めるもの

    ２

    主務大臣は、前項の規定による指示をしたときは、その旨を公表しなければならない。

    （販売業者等に対する業務の停止等）'
- id: art-59
  title: 第二十三条
  text: '第二十三条

    主務大臣は、販売業者若しくは役務提供事業者が第十六条、第十七条、第十八条第一項、第十九条第一項若しくは第二項、第二十条第一項若しくは第二十一条の規定に違反し若しくは前条第一項各号に掲げる行為をした場合において電話勧誘販売に係る取引の公正及び購入者若しくは役務の提供を受ける者の利益が著しく害されるおそれがあると認めるとき、又は販売業者若しくは役務提供事業者が同項の規定による指示に従わないときは、その販売業者又は役務提供事業者に対し、二年以内の期間を限り、電話勧誘販売に関する業務の全部又は一部を停止すべきことを命ずることができる。

    この場合において、主務大臣は、その販売業者又は役務提供事業者が個人である場合にあつては、その者に対して、当該停止を命ずる期間と同一の期間を定めて、当該停止を命ずる範囲の業務を営む法人の当該業務を担当する役員となることの禁止を併せて命ずることができる。

    ２

    主務大臣は、前項前段の規定により業務の停止を命ずる場合において、当該販売業者又は当該役務提供事業者が個人であり、かつ、その特定関係法人において、当該停止を命ずる範囲の業務と同一の業務を行つていると認められるときは、当該販売業者又は当該役務提供事業者に対して、当該停止を命ずる期間と同一の期間を定めて、その特定関係法人で行つている当該同一の業務を停止すべきことを命ずることができる。

    ３

    主務大臣は、前二項の規定による命令をしたときは、その旨を公表しなければならない。

    （役員等に対する業務の禁止等）'
- id: art-60
  title: 第二十三条の二
  text: '第二十三条の二

    主務大臣は、販売業者又は役務提供事業者に対して前条第一項前段の規定により業務の停止を命ずる場合において、次の各号に掲げる場合の区分に応じ、当該各号に定める者が当該命令の理由となつた事実及び当該事実に関してその者が有していた責任の程度を考慮して当該命令の実効性を確保するためにその者による電話勧誘販売に関する業務を制限することが相当と認められる者として主務省令で定める者に該当するときは、その者に対して、当該停止を命ずる期間と同一の期間を定めて、当該停止を命ずる範囲の業務を新たに開始すること（当該業務を営む法人の当該業務を担当する役員となることを含む。）の禁止を命ずることができる。

    一

    当該販売業者又は当該役務提供事業者が法人である場合

    その役員及び当該命令の日前一年以内においてその役員であつた者並びにその使用人及び当該命令の日前一年以内においてその使用人であつた者

    二

    当該販売業者又は当該役務提供事業者が個人である場合

    その使用人及び当該命令の日前一年以内においてその使用人であつた者

    ２

    主務大臣は、前項の規定により業務の禁止を命ずる役員又は使用人が、次の各号に掲げる者に該当するときは、当該役員又は当該使用人に対して、当該禁止を命ずる期間と同一の期間を定めて、その行つている当該各号に規定する同一の業務を停止すべきことを命ずることができる。

    一

    当該命令の理由となつた行為をしたと認められる販売業者又は役務提供事業者の特定関係法人において、当該命令により禁止を命ずる範囲の業務と同一の業務を行つていると認められる者

    二

    自ら販売業者又は役務提供事業者として当該命令により禁止を命ずる範囲の業務と同一の業務を行つていると認められる者

    ３

    主務大臣は、前二項の規定による命令をしたときは、その旨を公表しなければならない。

    （電話勧誘販売における契約の申込みの撤回等）'
