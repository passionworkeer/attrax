  title: 第一章　総則
  text: '第一章　総則

    （目的）'
- id: art-8
  title: 第一条
  text: '第一条

    この法律は、消費者と事業者との間の情報の質及び量並びに交渉力の格差に鑑み、事業者の一定の行為により消費者が誤認し、又は困惑した場合等について契約の申込み又はその承諾の意思表示を取り消すことができることとするとともに、事業者の損害賠償の責任を免除する条項その他の消費者の利益を不当に害することとなる条項の全部又は一部を無効とするほか、消費者の被害の発生又は拡大を防止するため適格消費者団体が事業者等に対し差止請求をすることができることとすることにより、消費者の利益の擁護を図り、もって国民生活の安定向上と国民経済の健全な発展に寄与することを目的とする。

    （定義）'
- id: art-9
  title: 第二条
  text: '第二条

    この法律において「消費者」とは、個人（事業として又は事業のために契約の当事者となる場合におけるものを除く。）をいう。

    ２

    この法律（第四十三条第二項第二号を除く。）において「事業者」とは、法人その他の団体及び事業として又は事業のために契約の当事者となる場合における個人をいう。

    ３

    この法律において「消費者契約」とは、消費者と事業者との間で締結される契約をいう。

    ４

    この法律において「適格消費者団体」とは、不特定かつ多数の消費者の利益のためにこの法律の規定による差止請求権を行使するのに必要な適格性を有する法人である消費者団体（消費者基本法（昭和四十三年法律第七十八号）第八条の消費者団体をいう。以下同じ。）として第十三条の定めるところにより内閣総理大臣の認定を受けた者をいう。

    （事業者及び消費者の努力）'
- id: art-10
  title: 第三条
  text: '第三条

    事業者は、次に掲げる措置を講ずるよう努めなければならない。

    一

    消費者契約の条項を定めるに当たっては、消費者の権利義務その他の消費者契約の内容が、その解釈について疑義が生じない明確なもので、かつ、消費者にとって平易なものになるよう配慮すること。

    二

    消費者契約の締結について勧誘をするに際しては、消費者の理解を深めるために、物品、権利、役務その他の消費者契約の目的となるものの性質に応じ、事業者が知ることができた個々の消費者の年齢、心身の状態、知識及び経験を総合的に考慮した上で、消費者の権利義務その他の消費者契約の内容についての必要な情報を提供すること。

    三

    民法（明治二十九年法律第八十九号）第五百四十八条の二第一項に規定する定型取引合意に該当する消費者契約の締結について勧誘をするに際しては、消費者が同項に規定する定型約款の内容を容易に知り得る状態に置く措置を講じているときを除き、消費者が同法第五百四十八条の三第一項に規定する請求を行うために必要な情報を提供すること。

    四

    消費者の求めに応じて、消費者契約により定められた当該消費者が有する解除権の行使に関して必要な情報を提供すること。

    ２

    消費者は、消費者契約を締結するに際しては、事業者から提供された情報を活用し、消費者の権利義務その他の消費者契約の内容について理解するよう努めるものとする。'
- id: art-11
  title: 第二章　消費者契約
  text: '第二章　消費者契約

    第一節　消費者契約の申込み又はその承諾の意思表示の取消し

    （消費者契約の申込み又はその承諾の意思表示の取消し）'
- id: art-12
  title: 第四条
  text: '第四条

    消費者は、事業者が消費者契約の締結について勧誘をするに際し、当該消費者に対して次の各号に掲げる行為をしたことにより当該各号に定める誤認をし、それによって当該消費者契約の申込み又はその承諾の意思表示をしたときは、これを取り消すことができる。

    一

    重要事項について事実と異なることを告げること。　当該告げられた内容が事実であるとの誤認

    二

    物品、権利、役務その他の当該消費者契約の目的となるものに関し、将来におけるその価額、将来において当該消費者が受け取るべき金額その他の将来における変動が不確実な事項につき断定的判断を提供すること。　当該提供された断定的判断の内容が確実であるとの誤認

    ２

    消費者は、事業者が消費者契約の締結について勧誘をするに際し、当該消費者に対してある重要事項又は当該重要事項に関連する事項について当該消費者の利益となる旨を告げ、かつ、当該重要事項について当該消費者の不利益となる事実（当該告知により当該事実が存在しないと消費者が通常考えるべきものに限る。）を故意又は重大な過失によって告げなかったことにより、当該事実が存在しないとの誤認をし、それによって当該消費者契約の申込み又はその承諾の意思表示をしたときは、これを取り消すことができる。

    ただし、当該事業者が当該消費者に対し当該事実を告げようとしたにもかかわらず、当該消費者がこれを拒んだときは、この限りでない。

    ３

    消費者は、事業者が消費者契約の締結について勧誘をするに際し、当該消費者に対して次に掲げる行為をしたことにより困惑し、それによって当該消費者契約の申込み又はその承諾の意思表示をしたときは、これを取り消すことができる。

    一

    当該事業者に対し、当該消費者が、その住居又はその業務を行っている場所から退去すべき旨の意思を示したにもかかわらず、それらの場所から退去しないこと。

    二

    当該事業者が当該消費者契約の締結について勧誘をしている場所から当該消費者が退去する旨の意思を示したにもかかわらず、その場所から当該消費者を退去させないこと。

    三

    当該消費者に対し、当該消費者契約の締結について勧誘をすることを告げずに、当該消費者が任意に退去することが困難な場所であることを知りながら、当該消費者をその場所に同行し、その場所において当該消費者契約の締結について勧誘をすること。

    四

    当該消費者が当該消費者契約の締結について勧誘を受けている場所において、当該消費者が当該消費者契約を締結するか否かについて相談を行うために電話その他の内閣府令で定める方法によって当該事業者以外の者と連絡する旨の意思を示したにもかかわらず、威迫する言動を交えて、当該消費者が当該方法によって連絡することを妨げること。

    五

    当該消費者が、社会生活上の経験が乏しいことから、次に掲げる事項に対する願望の実現に過大な不安を抱いていることを知りながら、その不安をあおり、裏付けとなる合理的な根拠がある場合その他の正当な理由がある場合でないのに、物品、権利、役務その他の当該消費者契約の目的となるものが当該願望を実現するために必要である旨を告げること。

    イ

    進学、就職、結婚、生計その他の社会生活上の重要な事項

    ロ

    容姿、体型その他の身体の特徴又は状況に関する重要な事項

    六

    当該消費者が、社会生活上の経験が乏しいことから、当該消費者契約の締結について勧誘を行う者に対して恋愛感情その他の好意の感情を抱き、かつ、当該勧誘を行う者も当該消費者に対して同様の感情を抱いているものと誤信していることを知りながら、これに乗じ、当該消費者契約を締結しなければ当該勧誘を行う者との関係が破綻することになる旨を告げること。

    七

    当該消費者が、加齢又は心身の故障によりその判断力が著しく低下していることから、生計、健康その他の事項に関しその現在の生活の維持に過大な不安を抱いていることを知りながら、その不安をあおり、裏付けとなる合理的な根拠がある場合その他の正当な理由がある場合でないのに、当該消費者契約を締結しなければその現在の生活の維持が困難となる旨を告げること。

    八

    当該消費者に対し、霊感その他の合理的に実証することが困難な特別な能力による知見として、当該消費者又はその親族の生命、身体、財産その他の重要な事項について、そのままでは現在生じ、若しくは将来生じ得る重大な不利益を回避することができないとの不安をあおり、又はそのような不安を抱いていることに乗じて、その重大な不利益を回避するためには、当該消費者契約を締結することが必要不可欠である旨を告げること。

    九

    当該消費者が当該消費者契約の申込み又はその承諾の意思表示をする前に、当該消費者契約を締結したならば負うこととなる義務の内容の全部若しくは一部を実施し、又は当該消費者契約の目的物の現状を変更し、その実施又は変更前の原状の回復を著しく困難にすること。

    十

    前号に掲げるもののほか、当該消費者が当該消費者契約の申込み又はその承諾の意思表示をする前に、当該事業者が調査、情報の提供、物品の調達その他の当該消費者契約の締結を目指した事業活動を実施した場合において、当該事業活動が当該消費者からの特別の求めに応じたものであったことその他の取引上の社会通念に照らして正当な理由がある場合でないのに、当該事業活動が当該消費者のために特に実施したものである旨及び当該事業活動の実施により生じた損失の補償を請求する旨を告げること。

    ４

    消費者は、事業者が消費者契約の締結について勧誘をするに際し、物品、権利、役務その他の当該消費者契約の目的となるものの分量、回数又は期間（以下この項において「分量等」という。）が当該消費者にとっての通常の分量等（消費者契約の目的となるものの内容及び取引条件並びに事業者がその締結について勧誘をする際の消費者の生活の状況及びこれについての当該消費者の認識に照らして当該消費者契約の目的となるものの分量等として通常想定される分量等をいう。以下この項において同じ。）を著しく超えるものであることを知っていた場合において、その勧誘により当該消費者契約の申込み又はその承諾の意思表示をしたときは、これを取り消すことができる。

    事業者が消費者契約の締結について勧誘をするに際し、消費者が既に当該消費者契約の目的となるものと同種のものを目的とする消費者契約（以下この項において「同種契約」という。）を締結し、当該同種契約の目的となるものの分量等と当該消費者契約の目的となるものの分量等とを合算した分量等が当該消費者にとっての通常の分量等を著しく超えるものであることを知っていた場合において、その勧誘により当該消費者契約の申込み又はその承諾の意思表示をしたときも、同様とする。

    ５

    第一項第一号及び第二項の「重要事項」とは、消費者契約に係る次に掲げる事項（同項の場合にあっては、第三号に掲げるものを除く。）をいう。

    一

    物品、権利、役務その他の当該消費者契約の目的となるものの質、用途その他の内容であって、消費者の当該消費者契約を締結するか否かについての判断に通常影響を及ぼすべきもの

    二

    物品、権利、役務その他の当該消費者契約の目的となるものの対価その他の取引条件であって、消費者の当該消費者契約を締結するか否かについての判断に通常影響を及ぼすべきもの

    三

    前二号に掲げるもののほか、物品、権利、役務その他の当該消費者契約の目的となるものが当該消費者の生命、身体、財産その他の重要な利益についての損害又は危険を回避するために通常必要であると判断される事情

    ６

    第一項から第四項までの規定による消費者契約の申込み又はその承諾の意思表示の取消しは、これをもって善意でかつ過失がない第三者に対抗することができない。

    （媒介の委託を受けた第三者及び代理人）'
- id: art-13
  title: 第五条
  text: '第五条

    前条の規定は、事業者が第三者に対し、当該事業者と消費者との間における消費者契約の締結について媒介をすることの委託（以下この項において単に「委託」という。）をし、当該委託を受けた第三者（その第三者から委託（二以上の段階にわたる委託を含む。）を受けた者を含む。以下「受託者等」という。）が消費者に対して同条第一項から第四項までに規定する行為をした場合について準用する。

    この場合において、同条第二項ただし書中「当該事業者」とあるのは、「当該事業者又は次条第一項に規定する受託者等」と読み替えるものとする。

    ２

    消費者契約の締結に係る消費者の代理人（復代理人（二以上の段階にわたり復代理人として選任された者を含む。）を含む。以下同じ。）、事業者の代理人及び受託者等の代理人は、前条第一項から第四項まで（前項において準用する場合を含む。次条から第七条までにおいて同じ。）の規定の適用については、それぞれ消費者、事業者及び受託者等とみなす。

    （解釈規定）'
- id: art-14
  title: 第六条
  text: 第六条
- id: art-15
  title: 第四条第一項から第四項までの規定は、これらの項に規定する消費者契約の申込み又はその承諾の意思表示に対する民法第九十六条の規定の適用を妨げるものと解してはならない。
  text: '第四条第一項から第四項までの規定は、これらの項に規定する消費者契約の申込み又はその承諾の意思表示に対する民法第九十六条の規定の適用を妨げるものと解してはならない。

    （取消権を行使した消費者の返還義務）'
- id: art-16
  title: 第六条の二
  text: '第六条の二

    民法第百二十一条の二第一項の規定にかかわらず、消費者契約に基づく債務の履行として給付を受けた消費者は、第四条第一項から第四項までの規定により当該消費者契約の申込み又はその承諾の意思表示を取り消した場合において、給付を受けた当時その意思表示が取り消すことができるものであることを知らなかったときは、当該消費者契約によって現に利益を受けている限度において、返還の義務を負う。

    （取消権の行使期間等）'
- id: art-17
  title: 第七条
  text: 第七条
- id: art-18
  title: 第四条第一項から第四項までの規定による取消権は、追認をすることができる時から一年間（同条第三項第八号に係る取消権については、三年間）行わないときは、時効によって消滅する。
  text: '第四条第一項から第四項までの規定による取消権は、追認をすることができる時から一年間（同条第三項第八号に係る取消権については、三年間）行わないときは、時効によって消滅する。

    当該消費者契約の締結の時から五年（同号に係る取消権については、十年）を経過したときも、同様とする。

    ２

    会社法（平成十七年法律第八十六号）その他の法律により詐欺又は強迫を理由として取消しをすることができないものとされている株式若しくは出資の引受け又は基金の拠出が消費者契約としてされた場合には、当該株式若しくは出資の引受け又は基金の拠出に係る意思表示については、第四条第一項から第四項までの規定によりその取消しをすることができない。

    第二節　消費者契約の条項の無効

    （事業者の損害賠償の責任を免除する条項等の無効）'
- id: art-19
  title: 第八条
  text: '第八条

    次に掲げる消費者契約の条項は、無効とする。

    一

    事業者の債務不履行により消費者に生じた損害を賠償する責任の全部を免除し、又は当該事業者にその責任の有無を決定する権限を付与する条項

    二

    事業者の債務不履行（当該事業者、その代表者又はその使用する者の故意又は重大な過失によるものに限る。）により消費者に生じた損害を賠償する責任の一部を免除し、又は当該事業者にその責任の限度を決定する権限を付与する条項

    三

    消費者契約における事業者の債務の履行に際してされた当該事業者の不法行為により消費者に生じた損害を賠償する責任の全部を免除し、又は当該事業者にその責任の有無を決定する権限を付与する条項

    四

    消費者契約における事業者の債務の履行に際してされた当該事業者の不法行為（当該事業者、その代表者又はその使用する者の故意又は重大な過失によるものに限る。）により消費者に生じた損害を賠償する責任の一部を免除し、又は当該事業者にその責任の限度を決定する権限を付与する条項

    ２

    前項第一号又は第二号に掲げる条項のうち、消費者契約が有償契約である場合において、引き渡された目的物が種類又は品質に関して契約の内容に適合しないとき（当該消費者契約が請負契約である場合には、請負人が種類又は品質に関して契約の内容に適合しない仕事の目的物を注文者に引き渡したとき（その引渡しを要しない場合には、仕事が終了した時に仕事の目的物が種類又は品質に関して契約の内容に適合しないとき。）。以下この項において同じ。）に、これにより消費者に生じた損害を賠償する事業者の責任を免除し、又は当該事業者にその責任の有無若しくは限度を決定する権限を付与するものについては、次に掲げる場合に該当するときは、前項の規定は、適用しない。

    一

    当該消費者契約において、引き渡された目的物が種類又は品質に関して契約の内容に適合しないときに、当該事業者が履行の追完をする責任又は不適合の程度に応じた代金若しくは報酬の減額をする責任を負うこととされている場合

    二

    当該消費者と当該事業者の委託を受けた他の事業者との間の契約又は当該事業者と他の事業者との間の当該消費者のためにする契約で、当該消費者契約の締結に先立って又はこれと同時に締結されたものにおいて、引き渡された目的物が種類又は品質に関して契約の内容に適合しないときに、当該他の事業者が、その目的物が種類又は品質に関して契約の内容に適合しないことにより当該消費者に生じた損害を賠償する責任の全部若しくは一部を負い、又は履行の追完をする責任を負うこととされている場合

    ３

    事業者の債務不履行（当該事業者、その代表者又はその使用する者の故意又は重大な過失によるものを除く。）又は消費者契約における事業者の債務の履行に際してされた当該事業者の不法行為（当該事業者、その代表者又はその使用する者の故意又は重大な過失によるものを除く。）により消費者に生じた損害を賠償する責任の一部を免除する消費者契約の条項であって、当該条項において事業者、その代表者又はその使用する者の重大な過失を除く過失による行為にのみ適用されることを明らかにしていないものは、無効とする。

    （消費者の解除権を放棄させる条項等の無効）'
- id: art-20
  title: 第八条の二
  text: '第八条の二

    事業者の債務不履行により生じた消費者の解除権を放棄させ、又は当該事業者にその解除権の有無を決定する権限を付与する消費者契約の条項は、無効とする。

    （事業者に対し後見開始の審判等による解除権を付与する条項の無効）'
- id: art-21
  title: 第八条の三
  text: '第八条の三

    事業者に対し、消費者が後見開始、保佐開始又は補助開始の審判を受けたことのみを理由とする解除権を付与する消費者契約（消費者が事業者に対し物品、権利、役務その他の消費者契約の目的となるものを提供することとされているものを除く。）の条項は、無効とする。

    （消費者が支払う損害賠償の額を予定する条項等の無効等）'
- id: art-22
  title: 第九条
  text: '第九条

    次の各号に掲げる消費者契約の条項は、当該各号に定める部分について、無効とする。

    一

    当該消費者契約の解除に伴う損害賠償の額を予定し、又は違約金を定める条項であって、これらを合算した額が、当該条項において設定された解除の事由、時期等の区分に応じ、当該消費者契約と同種の消費者契約の解除に伴い当該事業者に生ずべき平均的な損害の額を超えるもの

    当該超える部分

    二

    当該消費者契約に基づき支払うべき金銭の全部又は一部を消費者が支払期日（支払回数が二以上である場合には、それぞれの支払期日。以下この号において同じ。）までに支払わない場合における損害賠償の額を予定し、又は違約金を定める条項であって、これらを合算した額が、支払期日の翌日からその支払をする日までの期間について、その日数に応じ、当該支払期日に支払うべき額から当該支払期日に支払うべき額のうち既に支払われた額を控除した額に年十四・六パーセントの割合を乗じて計算した額を超えるもの

    当該超える部分

    ２

    事業者は、消費者に対し、消費者契約の解除に伴う損害賠償の額を予定し、又は違約金を定める条項に基づき損害賠償又は違約金の支払を請求する場合において、当該消費者から説明を求められたときは、損害賠償の額の予定又は違約金の算定の根拠（第十二条の四において「算定根拠」という。）の概要を説明するよう努めなければならない。

    （消費者の利益を一方的に害する条項の無効）'
- id: art-23
  title: 第十条
  text: '第十条

    消費者の不作為をもって当該消費者が新たな消費者契約の申込み又はその承諾の意思表示をしたものとみなす条項その他の法令中の公の秩序に関しない規定の適用による場合に比して消費者の権利を制限し又は消費者の義務を加重する消費者契約の条項であって、民法第一条第二項に規定する基本原則に反して消費者の利益を一方的に害するものは、無効とする。

    第三節　補則

    （他の法律の適用）'
- id: art-24
  title: 第十一条
  text: '第十一条

    消費者契約の申込み又はその承諾の意思表示の取消し及び消費者契約の条項の効力については、この法律の規定によるほか、民法及び商法（明治三十二年法律第四十八号）の規定による。

    ２

    消費者契約の申込み又はその承諾の意思表示の取消し及び消費者契約の条項の効力について民法及び商法以外の他の法律に別段の定めがあるときは、その定めるところによる。'
- id: art-25
  title: 第三章　差止請求
  text: '第三章　差止請求

    第一節　差止請求権等

    （差止請求権）'
- id: art-26
  title: 第十二条
  text: '第十二条

    適格消費者団体は、事業者、受託者等又は事業者の代理人若しくは受託者等の代理人（以下この項及び第四十三条第二項第一号において「事業者等」と総称する。）が、消費者契約の締結について勧誘をするに際し、不特定かつ多数の消費者に対して第四条第一項から第四項までに規定する行為（同条第二項に規定する行為にあっては、同項ただし書の場合に該当するものを除く。次項において同じ。）を現に行い又は行うおそれがあるときは、その事業者等に対し、当該行為の停止若しくは予防又は当該行為に供した物の廃棄若しくは除去その他の当該行為の停止若しくは予防に必要な措置をとることを請求することができる。

    ただし、民法及び商法以外の他の法律の規定によれば当該行為を理由として当該消費者契約を取り消すことができないときは、この限りでない。

    ２

    適格消費者団体は、次の各号に掲げる者が、消費者契約の締結について勧誘をするに際し、不特定かつ多数の消費者に対して第四条第一項から第四項までに規定する行為を現に行い又は行うおそれがあるときは、当該各号に定める者に対し、当該各号に掲げる者に対する是正の指示又は教唆の停止その他の当該行為の停止又は予防に必要な措置をとることを請求することができる。

    この場合においては、前項ただし書の規定を準用する。

    一

    受託者等

    当該受託者等に対して委託（二以上の段階にわたる委託を含む。）をした事業者又は他の受託者等

    二

    事業者の代理人又は受託者等の代理人

    当該代理人を自己の代理人とする事業者若しくは受託者等又はこれらの他の代理人

    ３

    適格消費者団体は、事業者又はその代理人が、消費者契約を締結するに際し、不特定かつ多数の消費者との間で第八条から第十条までに規定する消費者契約の条項（第八条第一項第一号又は第二号に掲げる消費者契約の条項にあっては、同条第二項の場合に該当するものを除く。次項及び第十二条の三第一項において同じ。）を含む消費者契約の申込み又はその承諾の意思表示を現に行い又は行うおそれがあるときは、その事業者又はその代理人に対し、当該行為の停止若しくは予防又は当該行為に供した物の廃棄若しくは除去その他の当該行為の停止若しくは予防に必要な措置をとることを請求することができる。

    ただし、民法及び商法以外の他の法律の規定によれば当該消費者契約の条項が無効とされないときは、この限りでない。

    ４

    適格消費者団体は、事業者の代理人が、消費者契約を締結するに際し、不特定かつ多数の消費者との間で第八条から第十条までに規定する消費者契約の条項を含む消費者契約の申込み又はその承諾の意思表示を現に行い又は行うおそれがあるときは、当該代理人を自己の代理人とする事業者又は他の代理人に対し、当該代理人に対する是正の指示又は教唆の停止その他の当該行為の停止又は予防に必要な措置をとることを請求することができる。

    この場合においては、前項ただし書の規定を準用する。

    （差止請求の制限）'
- id: art-27
  title: 第十二条の二
  text: '第十二条の二

    前条、不当景品類及び不当表示防止法（昭和三十七年法律第百三十四号）第三十四条第一項、特定商取引に関する法律（昭和五十一年法律第五十七号）第五十八条の十八から第五十八条の二十四まで又は食品表示法（平成二十五年法律第七十号）第十一条の規定による請求（以下「差止請求」という。）は、次に掲げる場合には、することができない。

    一

    当該適格消費者団体若しくは第三者の不正な利益を図り又は当該差止請求に係る相手方に損害を加えることを目的とする場合

    二

    他の適格消費者団体を当事者とする差止請求に係る訴訟等（訴訟並びに和解の申立てに係る手続、調停及び仲裁をいう。以下同じ。）につき既に確定判決等（確定判決及びこれと同一の効力を有するものをいい、次のイからハまでに掲げるものを除く。以下同じ。）が存する場合において、請求の内容及び相手方が同一である場合。

    ただし、当該他の適格消費者団体について、当該確定判決等に係る訴訟等の手続に関し、第十三条第一項の認定が第三十四条第一項第四号に掲げる事由により取り消され、又は同条第三項の規定により同号に掲げる事由があった旨の認定がされたときは、この限りでない。

    イ

    訴えを却下した確定判決

    ロ

    前号に掲げる場合に該当することのみを理由として差止請求を棄却した確定判決及び仲裁判断

    ハ

    差止請求をする権利（以下「差止請求権」という。）の不存在又は差止請求権に係る債務の不存在の確認の請求（第二十四条において「差止請求権不存在等確認請求」という。）を棄却した確定判決及びこれと同一の効力を有するもの

    ２

    前項第二号本文の規定は、当該確定判決に係る訴訟の口頭弁論の終結後又は当該確定判決と同一の効力を有するものの成立後に生じた事由に基づいて同号本文に掲げる場合の当該差止請求をすることを妨げない。

    （消費者契約の条項の開示要請）'
- id: art-28
  title: 第十二条の三
  text: '第十二条の三

    適格消費者団体は、事業者又はその代理人が、消費者契約を締結するに際し、不特定かつ多数の消費者との間で第八条から第十条までに規定する消費者契約の条項を含む消費者契約の申込み又はその承諾の意思表示を現に行い又は行うおそれがあると疑うに足りる相当の理由があるときは、内閣府令で定めるところにより、その事業者又はその代理人に対し、その理由を示して、当該条項を開示するよう要請することができる。

    ただし、当該事業者又はその代理人が、当該条項を含む消費者契約の条項をインターネットの利用その他の適切な方法により公表しているときは、この限りでない。

    ２

    事業者又はその代理人は、前項の規定による要請に応じるよう努めなければならない。

    （損害賠償の額を予定する条項等に関する説明の要請等）'
- id: art-29
  title: 第十二条の四
  text: '第十二条の四

    適格消費者団体は、消費者契約の解除に伴う損害賠償の額を予定し、又は違約金を定める条項におけるこれらを合算した額が第九条第一項第一号に規定する平均的な損害の額を超えると疑うに足りる相当な理由があるときは、内閣府令で定めるところにより、当該条項を定める事業者に対し、その理由を示して、当該条項に係る算定根拠を説明するよう要請することができる。

    ２

    事業者は、前項の算定根拠に営業秘密（不正競争防止法（平成五年法律第四十七号）第二条第六項に規定する営業秘密をいう。）が含まれる場合その他の正当な理由がある場合を除き、前項の規定による要請に応じるよう努めなければならない。

    （差止請求に係る講じた措置の開示要請）'
- id: art-30
  title: 第十二条の五
  text: 第十二条の五
- id: art-31
  title: 第十二条第三項又は第四項の規定による請求により事業者又はその代理人がこれらの規定に規定する行為の停止若しくは予防又は当該行為の停止若しくは予防に必要な措置をとる義務を負うときは、当該請求をした適格消費者団体は、内閣府令で定めるところにより、その事業者又はその代理人に対し、これらの者が当該義務を履行するために講じた措置の内容を開示するよう要請することができる。
  text: '第十二条第三項又は第四項の規定による請求により事業者又はその代理人がこれらの規定に規定する行為の停止若しくは予防又は当該行為の停止若しくは予防に必要な措置をとる義務を負うときは、当該請求をした適格消費者団体は、内閣府令で定めるところにより、その事業者又はその代理人に対し、これらの者が当該義務を履行するために講じた措置の内容を開示するよう要請することができる。

    ２

    事業者又はその代理人は、前項の規定による要請に応じるよう努めなければならない。

    第二節　適格消費者団体

    第一款　適格消費者団体の認定等

    （適格消費者団体の認定）'
- id: art-32
  title: 第十三条
  text: '第十三条

    差止請求関係業務（不特定かつ多数の消費者の利益のために差止請求権を行使する業務並びに当該業務の遂行に必要な消費者の被害に関する情報の収集並びに消費者の被害の防止及び救済に資する差止請求権の行使の結果に関する情報の収集及び提供に係る業務をいう。以下同じ。）を行おうとする者は、内閣総理大臣の認定を受けなければならない。

    ２

    前項の認定を受けようとする者は、内閣総理大臣に認定の申請をしなければならない。

    ３

    内閣総理大臣は、前項の申請をした者が次に掲げる要件の全てに適合しているときに限り、第一項の認定をすることができる。

    一

    特定非営利活動促進法（平成十年法律第七号）第二条第二項に規定する特定非営利活動法人又は一般社団法人若しくは一般財団法人であること。

    二

    消費生活に関する情報の収集及び提供並びに消費者の被害の防止及び救済のための活動その他の不特定かつ多数の消費者の利益の擁護を図るための活動を行うことを主たる目的とし、現にその活動を相当期間にわたり継続して適正に行っていると認められること。

    三

    差止請求関係業務の実施に係る組織、差止請求関係業務の実施の方法、差止請求関係業務に関して知り得た情報の管理及び秘密の保持の方法その他の差止請求関係業務を適正に遂行するための体制及び業務規程が適切に整備されていること。

    四

    その理事に関し、次に掲げる要件に適合するものであること。

    イ

    差止請求関係業務の執行を決定する機関として理事をもって構成する理事会が置かれており、かつ、定款で定めるその決定の方法が次に掲げる要件に適合していると認められること。

    （１）

    当該理事会の決議が理事の過半数又はこれを上回る割合以上の多数決により行われるものとされていること。

    （２）'
- id: art-33
  title: 第四十一条第一項の規定による差止請求、差止請求に係る訴えの提起その他の差止請求関係業務の執行に係る重要な事項の決定が理事その他の者に委任されていないこと。
  text: '第四十一条第一項の規定による差止請求、差止請求に係る訴えの提起その他の差止請求関係業務の執行に係る重要な事項の決定が理事その他の者に委任されていないこと。

    ロ

    理事の構成が次の（１）又は（２）のいずれかに該当するものでないこと。

    この場合において、第二号に掲げる要件に適合する者は、次の（１）又は（２）に規定する事業者に該当しないものとみなす。

    （１）

    理事の数のうちに占める特定の事業者（当該事業者との間に発行済株式の総数の二分の一以上の株式の数を保有する関係その他の内閣府令で定める特別の関係のある者を含む。）の関係者（当該事業者及びその役員又は職員である者その他の内閣府令で定める者をいう。（２）において同じ。）の数の割合が三分の一を超えていること。

    （２）

    理事の数のうちに占める同一の業種（内閣府令で定める事業の区分をいう。）に属する事業を行う事業者の関係者の数の割合が二分の一を超えていること。

    五

    差止請求の要否及びその内容についての検討を行う部門において次のイ及びロに掲げる者（以下「専門委員」と総称する。）が共にその専門的な知識経験に基づいて必要な助言を行い又は意見を述べる体制が整備されていることその他差止請求関係業務を遂行するための人的体制に照らして、差止請求関係業務を適正に遂行することができる専門的な知識経験を有すると認められること。

    イ

    消費生活に関する消費者と事業者との間に生じた苦情に係る相談（第四十条第一項において「消費生活相談」という。）その他の消費生活に関する事項について専門的な知識経験を有する者として内閣府令で定める条件に適合する者

    ロ

    弁護士、司法書士その他の法律に関する専門的な知識経験を有する者として内閣府令で定める条件に適合する者

    六

    差止請求関係業務を適正に遂行するに足りる経理的基礎を有すること。

    七

    差止請求関係業務以外の業務を行う場合には、その業務を行うことによって差止請求関係業務の適正な遂行に支障を及ぼすおそれがないこと。

    ４

    前項第三号の業務規程には、差止請求関係業務の実施の方法、差止請求関係業務に関して知り得た情報の管理及び秘密の保持の方法その他の内閣府令で定める事項が定められていなければならない。

    この場合において、業務規程に定める差止請求関係業務の実施の方法には、同項第五号の検討を行う部門における専門委員からの助言又は意見の聴取に関する措置及び役員、職員又は専門委員が差止請求に係る相手方と特別の利害関係を有する場合の措置その他業務の公正な実施の確保に関する措置が含まれていなければならない。

    ５

    次の各号のいずれかに該当する者は、第一項の認定を受けることができない。

    一

    この法律、消費者の財産的被害等の集団的な回復のための民事の裁判手続の特例に関する法律（平成二十五年法律第九十六号。以下「消費者裁判手続特例法」という。）その他消費者の利益の擁護に関する法律で政令で定めるもの若しくはこれらの法律に基づく命令の規定又はこれらの規定に基づく処分に違反して罰金の刑に処せられ、その刑の執行を終わり、又はその刑の執行を受けることがなくなった日から三年を経過しない法人

    二'
- id: art-34
  title: 第三十四条第一項各号若しくは消費者裁判手続特例法第九十二条第二項各号に掲げる事由により第一項の認定を取り消され、又は第三十四条第三項の規定により同条第一項第四号に掲げる事由があった旨の認定がされ、その取消し又は認定の日から三年を経過しない法人
  text: '第三十四条第一項各号若しくは消費者裁判手続特例法第九十二条第二項各号に掲げる事由により第一項の認定を取り消され、又は第三十四条第三項の規定により同条第一項第四号に掲げる事由があった旨の認定がされ、その取消し又は認定の日から三年を経過しない法人

    三

    暴力団員による不当な行為の防止等に関する法律（平成三年法律第七十七号）第二条第六号に規定する暴力団員又は同号に規定する暴力団員でなくなった日から五年を経過しない者（次号及び第六号ハにおいて「暴力団員等」という。）がその事業活動を支配する法人

    四

    暴力団員等をその業務に従事させ、又はその業務の補助者として使用するおそれのある法人

    五

    政治団体（政治資金規正法（昭和二十三年法律第百九十四号）第三条第一項に規定する政治団体をいう。）

    六

    役員のうちに次のイからハまでのいずれかに該当する者のある法人

    イ

    拘禁刑以上の刑に処せられ、又はこの法律、消費者裁判手続特例法その他消費者の利益の擁護に関する法律で政令で定めるもの若しくはこれらの法律に基づく命令の規定若しくはこれらの規定に基づく処分に違反して罰金の刑に処せられ、その刑の執行を終わり、又はその刑の執行を受けることがなくなった日から三年を経過しない者

    ロ

    適格消費者団体が第三十四条第一項各号若しくは消費者裁判手続特例法第九十二条第二項各号に掲げる事由により第一項の認定を取り消され、又は第三十四条第三項の規定により同条第一項第四号に掲げる事由があった旨の認定がされた場合において、その取消し又は認定の日前六月以内に当該適格消費者団体の役員であった者でその取消し又は認定の日から三年を経過しないもの

    ハ

    暴力団員等

    （認定の申請）'
- id: art-35
  title: 第十四条
  text: '第十四条

    前条第二項の申請は、次に掲げる事項を記載した申請書を内閣総理大臣に提出してしなければならない。

    一

    名称及び住所並びに代表者の氏名

    二

    差止請求関係業務を行おうとする事務所の所在地

    三

    前二号に掲げるもののほか、内閣府令で定める事項

    ２

    前項の申請書には、次に掲げる書類を添付しなければならない。

    一

    定款

    二

    不特定かつ多数の消費者の利益の擁護を図るための活動を相当期間にわたり継続して適正に行っていることを証する書類

    三

    差止請求関係業務に関する業務計画書

    四

    差止請求関係業務を適正に遂行するための体制が整備されていることを証する書類

    五

    業務規程

    六

    役員、職員及び専門委員に関する次に掲げる書類

    イ

    氏名、役職及び職業を記載した書類

    ロ

    住所、略歴その他内閣府令で定める事項を記載した書類

    七

    前条第三項第一号の法人の社員について、その数及び個人又は法人その他の団体の別（社員が法人その他の団体である場合にあっては、その構成員の数を含む。）を記載した書類

    八

    最近の事業年度における財産目録、貸借対照表又は次のイ若しくはロに掲げる法人の区分に応じ、当該イ若しくはロに定める書類（第三十一条第一項において「財産目録等」という。）その他の経理的基礎を有することを証する書類

    イ

    特定非営利活動促進法第二条第二項に規定する特定非営利活動法人

    同法第二十七条第三号に規定する活動計算書

    ロ

    一般社団法人又は一般財団法人

    一般社団法人及び一般財団法人に関する法律（平成十八年法律第四十八号）第百二十三条第二項（同法第百九十九条において準用する場合を含む。）に規定する損益計算書（公益社団法人及び公益財団法人の認定等に関する法律（平成十八年法律第四十九号）第五条に規定する公益認定を受けている場合にあっては、内閣府令で定める書類）

    九

    前条第五項各号のいずれにも該当しないことを誓約する書面

    十

    差止請求関係業務以外の業務を行う場合には、その業務の種類及び概要を記載した書類

    十一

    その他内閣府令で定める書類

    （認定の申請に関する公告及び縦覧等）'
- id: art-36
  title: 第十五条
  text: '第十五条

    内閣総理大臣は、前条の規定による認定の申請があった場合には、遅滞なく、内閣府令で定めるところにより、その旨並びに同条第一項第一号及び第二号に掲げる事項を公告するとともに、同条第二項各号（第六号ロ、第九号及び第十一号を除く。）に掲げる書類を、公告の日から二週間、公衆の縦覧に供しなければならない。

    ２

    内閣総理大臣は、第十三条第一項の認定をしようとするときは、同条第三項第二号に規定する事由の有無について、経済産業大臣の意見を聴くものとする。

    ３

    内閣総理大臣は、前条の規定による認定の申請をした者について第十三条第五項第三号、第四号又は第六号ハに該当する疑いがあると認めるときは、警察庁長官の意見を聴くものとする。

    （認定の公示等）'
- id: art-37
  title: 第十六条
  text: '第十六条

    内閣総理大臣は、第十三条第一項の認定をしたときは、内閣府令で定めるところにより、当該適格消費者団体の名称及び住所、差止請求関係業務を行う事務所の所在地並びに当該認定をした日を公示するとともに、当該適格消費者団体に対し、その旨を書面により通知するものとする。

    ２

    適格消費者団体は、内閣府令で定めるところにより、適格消費者団体である旨について、差止請求関係業務を行う事務所において見やすいように掲示するとともに、電気通信回線に接続して行う自動公衆送信（公衆によって直接受信されることを目的として公衆からの求めに応じ自動的に送信を行うことをいい、放送又は有線放送に該当するものを除く。）により公衆の閲覧に供しなければならない。

    ３

    適格消費者団体でない者は、その名称中に適格消費者団体であると誤認されるおそれのある文字を用い、又はその業務に関し、適格消費者団体であると誤認されるおそれのある表示をしてはならない。

    （認定の有効期間等）'
- id: art-38
  title: 第十七条
  text: 第十七条
- id: art-39
  title: 第十三条第一項の認定の有効期間は、当該認定の日から起算して六年とする。
  text: '第十三条第一項の認定の有効期間は、当該認定の日から起算して六年とする。

    ２

    前項の有効期間の満了後引き続き差止請求関係業務を行おうとする適格消費者団体は、その有効期間の更新を受けなければならない。

    ３

    前項の有効期間の更新を受けようとする適格消費者団体は、第一項の有効期間の満了の日の九十日前から六十日前までの間（以下この項において「更新申請期間」という。）に、内閣総理大臣に有効期間の更新の申請をしなければならない。

    ただし、災害その他やむを得ない事由により更新申請期間にその申請をすることができないときは、この限りでない。

    ４

    前項の申請があった場合において、第一項の有効期間の満了の日までにその申請に対する処分がされないときは、従前の認定は、同項の有効期間の満了後もその処分がされるまでの間は、なお効力を有する。

    ５

    前項の場合において、第二項の有効期間の更新がされたときは、その認定の有効期間は、従前の認定の有効期間の満了の日の翌日から起算するものとする。

    ６'
- id: art-40
  title: 第十三条（第一項及び第五項第二号を除く。）、第十四条、第十五条及び前条第一項の規定は、第二項の有効期間の更新について準用する。
  text: '第十三条（第一項及び第五項第二号を除く。）、第十四条、第十五条及び前条第一項の規定は、第二項の有効期間の更新について準用する。

    ただし、第十四条第二項各号に掲げる書類については、既に内閣総理大臣に提出されている当該書類の内容に変更がないときは、その添付を省略することができる。

    （変更の届出）'
- id: art-41
  title: 第十八条
  text: '第十八条

    適格消費者団体は、第十四条第一項各号に掲げる事項又は同条第二項各号（第二号及び第十一号を除く。）に掲げる書類に記載した事項に変更があったときは、遅滞なく、内閣府令で定めるところにより、その旨を内閣総理大臣に届け出なければならない。

    ただし、その変更が内閣府令で定める軽微なものであるときは、この限りでない。

    （合併の届出及び認可等）'
- id: art-42
  title: 第十九条
  text: '第十九条

    適格消費者団体である法人が他の適格消費者団体である法人と合併をしたときは、合併後存続する法人又は合併により設立された法人は、合併により消滅した法人のこの法律の規定による適格消費者団体としての地位を承継する。

    ２

    前項の規定により合併により消滅した法人のこの法律の規定による適格消費者団体としての地位を承継した法人は、遅滞なく、その旨を内閣総理大臣に届け出なければならない。

    ３

    適格消費者団体である法人が適格消費者団体でない法人と合併（適格消費者団体である法人が存続するものを除く。以下この条及び第二十二条第二号において同じ。）をした場合には、合併後存続する法人又は合併により設立された法人は、その合併について内閣総理大臣の認可がされたときに限り、合併により消滅した法人のこの法律の規定による適格消費者団体としての地位を承継する。

    ４

    前項の認可を受けようとする適格消費者団体である法人及び適格消費者団体でない法人は、共同して、その合併がその効力を生ずる日の九十日前から六十日前までの間（以下この項において「認可申請期間」という。）に、内閣総理大臣に認可の申請をしなければならない。

    ただし、災害その他やむを得ない事由により認可申請期間にその申請をすることができないときは、この限りでない。

    ５

    前項の申請があった場合において、その合併がその効力を生ずる日までにその申請に対する処分がされないときは、合併後存続する法人又は合併により設立された法人は、その処分がされるまでの間は、合併により消滅した法人のこの法律の規定による適格消費者団体としての地位を承継しているものとみなす。

    ６'
- id: art-43
  title: 第十三条（第一項を除く。）、第十四条、第十五条及び第十六条第一項の規定は、第三項の認可について準用する。
  text: '第十三条（第一項を除く。）、第十四条、第十五条及び第十六条第一項の規定は、第三項の認可について準用する。

    ７

    適格消費者団体である法人は、適格消費者団体でない法人と合併をする場合において、第四項の申請をしないときは、その合併がその効力を生ずる日までに、その旨を内閣総理大臣に届け出なければならない。

    ８

    内閣総理大臣は、第二項又は前項の規定による届出があったときは、内閣府令で定めるところにより、その旨を公示するものとする。

    （事業の譲渡の届出及び認可等）'
- id: art-44
  title: 第二十条
  text: '第二十条

    適格消費者団体である法人が他の適格消費者団体である法人に対し差止請求関係業務に係る事業の全部の譲渡をしたときは、その譲渡を受けた法人は、その譲渡をした法人のこの法律の規定による適格消費者団体としての地位を承継する。

    ２

    前項の規定によりその譲渡をした法人のこの法律の規定による適格消費者団体としての地位を承継した法人は、遅滞なく、その旨を内閣総理大臣に届け出なければならない。

    ３

    適格消費者団体である法人が適格消費者団体でない法人に対し差止請求関係業務に係る事業の全部の譲渡をした場合には、その譲渡を受けた法人は、その譲渡について内閣総理大臣の認可がされたときに限り、その譲渡をした法人のこの法律の規定による適格消費者団体としての地位を承継する。

    ４

    前項の認可を受けようとする適格消費者団体である法人及び適格消費者団体でない法人は、共同して、その譲渡の日の九十日前から六十日前までの間（以下この項において「認可申請期間」という。）に、内閣総理大臣に認可の申請をしなければならない。

    ただし、災害その他やむを得ない事由により認可申請期間にその申請をすることができないときは、この限りでない。

    ５

    前項の申請があった場合において、その譲渡の日までにその申請に対する処分がされないときは、その譲渡を受けた法人は、その処分がされるまでの間は、その譲渡をした法人のこの法律の規定による適格消費者団体としての地位を承継しているものとみなす。

    ６'
- id: art-45
  title: 第十三条（第一項を除く。）、第十四条、第十五条及び第十六条第一項の規定は、第三項の認可について準用する。
  text: '第十三条（第一項を除く。）、第十四条、第十五条及び第十六条第一項の規定は、第三項の認可について準用する。

    ７

    適格消費者団体である法人は、適格消費者団体でない法人に対し差止請求関係業務に係る事業の全部の譲渡をする場合において、第四項の申請をしないときは、その譲渡の日までに、その旨を内閣総理大臣に届け出なければならない。

    ８

    内閣総理大臣は、第二項又は前項の規定による届出があったときは、内閣府令で定めるところにより、その旨を公示するものとする。

    （解散の届出等）'
- id: art-46
  title: 第二十一条
  text: '第二十一条

    適格消費者団体が次の各号に掲げる場合のいずれかに該当することとなったときは、当該各号に定める者は、遅滞なく、その旨を内閣総理大臣に届け出なければならない。

    一

    破産手続開始の決定により解散した場合

    破産管財人

    二

    合併及び破産手続開始の決定以外の理由により解散した場合

    清算人

    三

    差止請求関係業務を廃止した場合

    法人の代表者

    ２

    内閣総理大臣は、前項の規定による届出があったときは、内閣府令で定めるところにより、その旨を公示するものとする。

    （認定の失効）'
- id: art-47
  title: 第二十二条
  text: '第二十二条

    適格消費者団体について、次のいずれかに掲げる事由が生じたときは、第十三条第一項の認定は、その効力を失う。

    一'
- id: art-48
  title: 第十三条第一項の認定の有効期間が経過したとき（第十七条第四項に規定する場合にあっては、更新拒否処分がされたとき）。
  text: '第十三条第一項の認定の有効期間が経過したとき（第十七条第四項に規定する場合にあっては、更新拒否処分がされたとき）。

    二

    適格消費者団体である法人が適格消費者団体でない法人と合併をした場合において、その合併が第十九条第三項の認可を経ずにその効力を生じたとき（同条第五項に規定する場合にあっては、その合併の不認可処分がされたとき）。

    三

    適格消費者団体である法人が適格消費者団体でない法人に対し差止請求関係業務に係る事業の全部の譲渡をした場合において、その譲渡が第二十条第三項の認可を経ずにされたとき（同条第五項に規定する場合にあっては、その譲渡の不認可処分がされたとき）。

    四

    適格消費者団体が前条第一項各号に掲げる場合のいずれかに該当することとなったとき。

    第二款　差止請求関係業務等

    （差止請求権の行使等）'
- id: art-49
  title: 第二十三条
  text: '第二十三条

    適格消費者団体は、不特定かつ多数の消費者の利益のために、差止請求権を適切に行使しなければならない。

    ２

    適格消費者団体は、差止請求権を濫用してはならない。

    ３

    適格消費者団体は、事案の性質に応じて他の適格消費者団体と共同して差止請求権を行使するほか、差止請求関係業務について相互に連携を図りながら協力するように努めなければならない。

    ４

    適格消費者団体は、次に掲げる場合には、内閣府令で定めるところにより、遅滞なく、その旨を他の適格消費者団体に通知するとともに、その旨及びその内容その他内閣府令で定める事項を内閣総理大臣に報告しなければならない。

    この場合において、当該適格消費者団体が、当該通知及び報告に代えて、すべての適格消費者団体及び内閣総理大臣が電磁的方法（電子情報処理組織を使用する方法その他の情報通信の技術を利用する方法をいう。以下同じ。）を利用して同一の情報を閲覧することができる状態に置く措置であって内閣府令で定めるものを講じたときは、当該通知及び報告をしたものとみなす。

    一'
- id: art-50
  title: 第四十一条第一項（同条第三項において準用する場合を含む。）の規定による差止請求をしたとき。
  text: '第四十一条第一項（同条第三項において準用する場合を含む。）の規定による差止請求をしたとき。

    二

    前号に掲げる場合のほか、裁判外において差止請求をしたとき。

    三

    差止請求に係る訴えの提起（和解の申立て、調停の申立て又は仲裁合意を含む。）又は仮処分命令の申立てがあったとき。

    四

    差止請求に係る判決の言渡し（調停の成立、調停に代わる決定の告知又は仲裁判断を含む。）又は差止請求に係る仮処分命令の申立てについての決定の告知があったとき。

    五

    前号の判決に対する上訴の提起（調停に代わる決定に対する異議の申立て又は仲裁判断の取消しの申立てを含む。）又は同号の決定に対する不服の申立てがあったとき。

    六

    第四号の判決（調停に代わる決定又は仲裁判断を含む。）又は同号の決定が確定したとき。

    七

    差止請求に係る裁判上の和解が成立したとき。

    八

    前二号に掲げる場合のほか、差止請求に係る訴訟（和解の申立てに係る手続、調停手続又は仲裁手続を含む。）又は差止請求に係る仮処分命令に関する手続が終了したとき。

    九

    差止請求に係る裁判外の和解が成立したときその他差止請求に関する相手方との間の協議が調ったとき、又はこれが調わなかったとき。

    十

    差止請求に関し、請求の放棄、和解、上訴の取下げその他の内閣府令で定める手続に係る行為であって、それにより確定判決及びこれと同一の効力を有するものが存することとなるものをしようとするとき。

    十一

    その他差止請求に関し内閣府令で定める手続に係る行為がされたとき。

    ５

    内閣総理大臣は、前項の規定による報告を受けたときは、すべての適格消費者団体並びに内閣総理大臣及び経済産業大臣が電磁的方法を利用して同一の情報を閲覧することができる状態に置く措置その他の内閣府令で定める方法により、他の適格消費者団体及び経済産業大臣に当該報告の日時及び概要その他内閣府令で定める事項を伝達するものとする。

    ６

    適格消費者団体について、第十二条の二第一項第二号本文の確定判決等で強制執行をすることができるものが存する場合には、当該適格消費者団体は、当該確定判決等に係る差止請求権を放棄することができない。

    （消費者の被害に関する情報の取扱い）'
- id: art-51
  title: 第二十四条
  text: '第二十四条

    適格消費者団体は、差止請求権の行使（差止請求権不存在等確認請求に係る訴訟を含む。第二十八条において同じ。）に関し、消費者から収集した消費者の被害に関する情報をその相手方その他の第三者が当該被害に係る消費者を識別することができる方法で利用するに当たっては、あらかじめ、当該消費者の同意を得なければならない。

    （秘密保持義務）'
- id: art-52
  title: 第二十五条
  text: '第二十五条

    適格消費者団体の役員、職員若しくは専門委員又はこれらの職にあった者は、正当な理由がなく、差止請求関係業務に関して知り得た秘密を漏らしてはならない。

    （氏名等の明示）'
- id: art-53
  title: 第二十六条
  text: '第二十六条

    適格消費者団体の差止請求関係業務に従事する者は、その差止請求関係業務を行うに当たり、相手方の請求があったときは、当該適格消費者団体の名称、自己の氏名及び適格消費者団体における役職又は地位その他内閣府令で定める事項を、その相手方に明らかにしなければならない。

    （判決等に関する情報の提供）'
- id: art-54
  title: 第二十七条
  text: '第二十七条

    適格消費者団体は、消費者の被害の防止及び救済に資するため、消費者に対し、差止請求に係る判決（確定判決と同一の効力を有するもの及び仮処分命令の申立てについての決定を含む。）又は裁判外の和解の内容その他必要な情報を提供するよう努めなければならない。

    （財産上の利益の受領の禁止等）'
- id: art-55
  title: 第二十八条
  text: '第二十八条

    適格消費者団体は、次に掲げる場合を除き、その差止請求に係る相手方から、その差止請求権の行使に関し、寄附金、賛助金その他名目のいかんを問わず、金銭その他の財産上の利益を受けてはならない。

    一

    差止請求に係る判決（確定判決と同一の効力を有するもの及び仮処分命令の申立てについての決定を含む。以下この項において同じ。）又は民事訴訟法（平成八年法律第百九号）第七十三条第一項の決定により訴訟費用（和解の費用、調停手続の費用及び仲裁手続の費用を含む。）を負担することとされた相手方から当該訴訟費用に相当する額の償還として財産上の利益を受けるとき。

    二

    差止請求に係る判決に基づいて民事執行法（昭和五十四年法律第四号）第百七十二条第一項の規定により命じられた金銭の支払として財産上の利益を受けるとき。

    三

    差止請求に係る判決に基づく強制執行の執行費用に相当する額の償還として財産上の利益を受けるとき。

    四

    差止請求に係る相手方の債務の履行を確保するために約定された違約金の支払として財産上の利益を受けるとき。

    ２

    適格消費者団体の役員、職員又は専門委員は、適格消費者団体の差止請求に係る相手方から、その差止請求権の行使に関し、寄附金、賛助金その他名目のいかんを問わず、金銭その他の財産上の利益を受けてはならない。

    ３

    適格消費者団体又はその役員、職員若しくは専門委員は、適格消費者団体の差止請求に係る相手方から、その差止請求権の行使に関し、寄附金、賛助金その他名目のいかんを問わず、金銭その他の財産上の利益を第三者に受けさせてはならない。

    ４

    前三項に規定する差止請求に係る相手方からその差止請求権の行使に関して受け又は受けさせてはならない財産上の利益には、その相手方がその差止請求権の行使に関してした不法行為によって生じた損害の賠償として受け又は受けさせる財産上の利益は含まれない。

    ５

    適格消費者団体は、第一項各号に規定する財産上の利益を受けたときは、これに相当する金額を積み立て、これを差止請求関係業務に要する費用に充てなければならない。

    ６

    適格消費者団体は、その定款において、差止請求関係業務を廃止し、又は第十三条第一項の認定の失効（差止請求関係業務の廃止によるものを除く。）若しくは取消しにより差止請求関係業務を終了した場合において、積立金（前項の規定により積み立てられた金額をいう。）に残余があるときは、その残余に相当する金額を、他の適格消費者団体（第三十五条の規定により差止請求権を承継した適格消費者団体がある場合にあっては、当該適格消費者団体）があるときは当該他の適格消費者団体に、これがないときは第十三条第三項第二号に掲げる要件に適合する消費者団体であって内閣総理大臣が指定するもの又は国に帰属させる旨を定めておかなければならない。

    （業務の範囲及び区分経理）'
- id: art-56
  title: 第二十九条
  text: '第二十九条

    適格消費者団体は、その行う差止請求関係業務に支障がない限り、定款の定めるところにより、差止請求関係業務以外の業務を行うことができる。

    ２

    適格消費者団体は、次に掲げる業務に係る経理をそれぞれ区分して整理しなければならない。

    一

    差止請求関係業務

    二

    不特定かつ多数の消費者の利益の擁護を図るための活動に係る業務（前号に掲げる業務を除く。）

    三

    前二号に掲げる業務以外の業務

    第三款　監督

    （帳簿書類の作成及び保存）'
- id: art-57
  title: 第三十条
  text: '第三十条

    適格消費者団体は、内閣府令で定めるところにより、その業務及び経理に関する帳簿書類を作成し、これを保存しなければならない。

    （財務諸表等の作成、備置き、閲覧等及び提出等）'
- id: art-58
  title: 第三十一条
  text: '第三十一条

    適格消費者団体は、毎事業年度終了後三月以内に、その事業年度の財産目録等及び事業報告書（これらの作成に代えて電磁的記録（電子的方式、磁気的方式その他人の知覚によっては認識することができない方式で作られる記録であって、電子計算機による情報処理の用に供されるものをいう。以下この条において同じ。）の作成がされている場合における当該電磁的記録を含む。次項第五号及び第五十三条第六号において「財務諸表等」という。）を作成しなければならない。

    ２

    適格消費者団体の事務所には、内閣府令で定めるところにより、次に掲げる書類を備え置かなければならない。

    一

    定款

    二

    業務規程

    三

    役職員等名簿（役員、職員及び専門委員の氏名、役職及び職業その他内閣府令で定める事項を記載した名簿をいう。）

    四

    適格消費者団体の社員について、その数及び個人又は法人その他の団体の別（社員が法人その他の団体である場合にあっては、その構成員の数を含む。）を記載した書類

    五

    財務諸表等

    六

    収入の明細その他の資金に関する事項、寄附金に関する事項その他の経理に関する内閣府令で定める事項を記載した書類

    七

    差止請求関係業務以外の業務を行う場合には、その業務の種類及び概要を記載した書類

    ３

    何人も、適格消費者団体の業務時間内は、いつでも、次に掲げる請求をすることができる。

    ただし、第二号又は第四号に掲げる請求をするには、当該適格消費者団体の定めた費用を支払わなければならない。

    一

    前項各号に掲げる書類が書面をもって作成されているときは、当該書面の閲覧又は謄写の請求

    二

    前号の書面の謄本又は抄本の交付の請求

    三

    前項各号に掲げる書類が電磁的記録をもって作成されているときは、当該電磁的記録に記録された事項を内閣府令で定める方法により表示したものの閲覧又は謄写の請求

    四

    前号の電磁的記録に記録された事項を電磁的方法であって内閣府令で定めるものにより提供することの請求又は当該事項を記載した書面の交付の請求

    ４

    適格消費者団体は、前項各号に掲げる請求があったときは、正当な理由がある場合を除き、これを拒むことができない。

    ５

    適格消費者団体は、毎事業年度終了後三月以内に、第二項第三号から第六号までに掲げる書類を内閣総理大臣に提出しなければならない。

    （報告及び立入検査）'
- id: art-59
  title: 第三十二条
  text: '第三十二条

    内閣総理大臣は、この法律の実施に必要な限度において、適格消費者団体に対し、その業務若しくは経理の状況に関し報告をさせ、又はその職員に、適格消費者団体の事務所に立ち入り、業務の状況若しくは帳簿、書類その他の物件を検査させ、若しくは関係者に質問させることができる。

    ２

    前項の規定により職員が立ち入るときは、その身分を示す証明書を携帯し、関係者に提示しなければならない。

    ３

    第一項に規定する立入検査の権限は、犯罪捜査のために認められたものと解してはならない。

    （適合命令及び改善命令）'
- id: art-60
  title: 第三十三条
  text: '第三十三条

    内閣総理大臣は、適格消費者団体が、第十三条第三項第二号から第七号までに掲げる要件のいずれかに適合しなくなったと認めるときは、当該適格消費者団体に対し、これらの要件に適合するために必要な措置をとるべきことを命ずることができる。

    ２

    内閣総理大臣は、前項に定めるもののほか、適格消費者団体が第十三条第五項第三号から第六号までのいずれかに該当するに至ったと認めるとき、適格消費者団体又はその役員、職員若しくは専門委員が差止請求関係業務の遂行に関しこの法律の規定に違反したと認めるとき、その他適格消費者団体の業務の適正な運営を確保するため必要があると認めるときは、当該適格消費者団体に対し、人的体制の改善、違反の停止、業務規程の変更その他の業務の運営の改善に必要な措置をとるべきことを命ずることができる。

    （認定の取消し等）'
