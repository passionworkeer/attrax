- id: art-1
  title: Media regulation | The Official Platform of the UAE Governme
  text: "Media regulation | The Official Platform of the UAE Government\nMedia\nMedia In The UAE\nMedia regulation\nMedia regulation\nThe Internet Access Management Regulatory Policy consists of certain\
    \ frameworks and categories in regards to the internet, which must be taken into consideration by internet service providers to ensure the security of the internet and protect end-users from harmful\
    \ websites containing materials that are contrary to religious and ethical values of the UAE. Media Regulatory Office (MRO) manages and regulates media activities and media-related free zones in the\
    \ UAE. Federal Decree Law No. 34 of 2021 on Combatting Rumors and Cybercrimes aims to protect the society and government websites and data from information technology crimes and combat rumors and fraud\
    \ through electronic communication.\nU.Ask\nThe law regulating media\nInternet media regulations\nGeneral framework of the UAE Media Strategy\nRegulator of media in the UAE\nLaws and guidelines for\
    \ using social media\nAmen platform\nThe law regulating media\nThe \n Federal Decree-Law No. 55 of 2023\n (PDF in Arabic, 3.2 MB) on Media Regulation\norganises media activities of individuals, organisations,\
    \ media outlets, and free zones\ndedicated to media in the UAE.\nAs per the decree, a media activity means the production,\ncirculation, printing or publishing of media content. Media content may be\
    \ in audio,\nvideo or digital format. Activity may either be at a cost or free of charge. Media\nactivities include: \nradio and television broadcasting\ncinema movies and creative productions\n·\n\
    newspapers and publications\ndigital and electronic media activities\nimaging activities\nbook fairs.\nThe decree-law allows both, individuals and legal entities\nto own media institutions and outlets\
    \ under specific regulations and conditions. The\nprovisions of the decree-law organise the media authorities of the UAE Media Council and\nthe local governments concerned with regulating media affairs.\n\
    Standards of media content\nAs per the decree, all media individuals and institutions\noperating in the UAE are required to comply with the national standards for media\ncontent. Standards include:\n\
    respecting the divine and Islamic beliefs, as well as all other religions and\n    beliefs\nrespecting the country's sovereignty, symbols and institutions, and the supreme\n    interests of the UAE\
    \ and its society\nrespecting the directions and policies of the country on the local and\n    international levels\navoiding any actions that may hurt the UAE’s foreign relations\nrespecting the culture\
    \ and civilisation, national identity and values of the UAE\n    community\nrefraining from disseminating or circulating information that may offend or\n    compromise national unity or social cohesion,\
    \ incite violence or hatred or propagate\n    a spirit of discord among society members, and the UAE’s legal and economic\n    system\nensuring that justice and security are not exploited or abused\n\
    respecting privacy rules and individuals' private lives\nrefraining from publishing, broadcasting or circulating rumours, false and\n    misleading news or the publication of any matter that may constitute\
    \ instigation to\n    commit crimes.\nViolating the provisions of this decree-law may lead to\nadministrative fines, closure of the media institution or cancellation of the media\nlicence/permit.\n\
    Read related news coverage\n.\nInternet media regulations\nInternet Access Management (IAM)\npolicy\nTelecommunications and Digital\nGovernment Regulatory Authority\n (TDRA) implements\nthe \nInternet\
    \ Access Management Regulatory Policy\n (PDF, 500 KB) in\ncoordination with \nMedia Regulatory Office\n (MRO) \nand Etisalat and Du, the licensed\ninternet service providers in the UAE.\nThe regulation\
    \ policy consists of certain frameworks and\ncategories in regards to the internet, which must be taken into consideration by internet\nservice providers to ensure the security of the internet and protect\
    \ end-users from harmful"
- id: art-2
  title: websites containing materials that are contrary to religious
  text: "websites containing materials that are contrary to religious and ethical values of the UAE.\nTDRA monitors online content available to users in the UAE\nand will notify website operators based\
    \ in the UAE of any potential breaches of the IAM\npolicy. TDRA, in its enforcement of IAM, also monitors online advertising, including\nthe advertising of medical and other specialised products and\
    \ services.\nEtisalat and Du are required to block online content if so\nis requested by TDRA. \nCategories\n under which content is restricted by virtue of the IAM\npolicy are:\nbypassing blocked content\n\
    pornography, nudity and vice\nimpersonation, fraud and phishing\ninsult, slander and defamation\ninvasion of privacy\noffences against the UAE and the public order\nsupporting criminal acts and skills\n\
    drugs\nmedical and pharmaceutical practices in violation of the laws\ninfringement of intellectual property rights\ndiscrimination, racism and contempt of religion\nviruses and malicious programs\n\
    promotion of or trading in prohibited commodities and services\nillegal communication services\ngambling\nterrorism\nprohibited top level domains\nillegal activities\nany content prohibited upon order\
    \ from judicial authorities, or in accordance with\n    the law.\nReporting prohibited content\nAs per \nTDRA’s internet guidelines\n, internet users can report online about\nprohibited content to the\
    \ licensed internet service providers, \nEtisalat\n and \nDu\n.\nGeneral framework of the UAE Media Strategy\nIn January 2021, \nthe UAE Cabinet\n approved the general\n                            framework\
    \ of UAE Media Strategy which is overseen by the UAE Government Media Office. It is\n                            aimed to strengthen the UAE’s position and reputation at the regional and global levels\
    \ with\n                            the general framework.\nThe strategy will: \nintensify the role of government communication within the federal authorities \nreinforce the concept of partnership,\
    \ cooperation and integration between national media\n                                authorities \nestablish partnerships with global media entities \nmanage the country’s reputation and its achievements\
    \ within local and international\n                                media coverage \ncreate a digital media environment capable of keeping pace with rapid changes and\n                               \
    \ interacting with the world. \nThe strategy will also focus on several areas of national\n                            priority while:\nrelying on the efficient and influential presence of the government\
    \ in all media outlets\npromoting national culture and identity through all communication channels \nutilising modern technologies and digital media to interact with the public. \nRead related news\
    \ coverage on \nWAM\n.\nRegulator of media in the UAE\nAt the federal level\nNational Media Office\nThe National Media Office (NMO) is a new media unit\n                                that will be\
    \ responsible for developing the UAE’s media sector at the national level and\n                                enhance the UAE’s status as a key media hub regionally and internationally. NMO will\n\
    \                                support cooperation between the UAE’s various media offices, and ensure that Emiratis at\n                                higher positions in the media industry are\
    \ equipped with media leadership skills.\nNMO will train and upskill Emirati talent in media,\n                                develop and organise the roles of official spokespeople, represent the\
    \ UAE at media\n                                conferences and events and conduct research within the media sector.\nNMO is affiliated with \nMinister of Presidential\n                            \
    \        Court\n and it will be based in Abu Dhabi with offices set up in the UAE and\n                                abroad. The \nEmirates News Agency (WAM\n) will report to the Head of\n       \
    \                         NMO.\nRead news coverage on \nWAM\n.\nAt the local level"
- id: art-3
  title: Local media bodies contribute to the development of
  text: "Local media bodies contribute to the development of\n                                the media scene in the UAE. They include:\nAbu Dhabi Media\n                                        Office\n\
    Creative Media\n                                        Authority - Abu Dhabi\nMedia Office – Government of\n                                        Dubai\nSharjah Government Media Bureau\nDepartment\
    \ of Culture - Sharjah\nFujairah Culture and Media\n                                        Authority\n.\nLaws and guidelines for using social media\nLaws and regulations\nFederal Decree\nLaw No. 34\
    \ of 2021 on Combatting Rumors\n    and Cybercrimes\nFederal Decree\nLaw No. 34 of 2021 on Combatting Rumors and\nCybercrimes\nand other applicable laws for the protection of privacy\nand reputation,\
    \ defamation apply while using social media. Citizens and residents in the UAE\nneed to be aware of the provisions of the law that spell out actions that could be a\ncriminal offence.\nRegulation of\
    \ Using Social\n    Media by the Employees of Federal Entities as Approved by the Cabinet Resolution\n    No. 73/3/ & 1 of 2014\nThe regulation\n (PDF, 159 KB)  aims at\ndirecting and guiding the employees\
    \ of government entities on using social media safely and\nresponsibly when they discuss various current issues. In addition, it explains how employees\ncould express their personal opinion in a civil\
    \ manner that is not detrimental to their\nreputation or that of the entity they work for or that of the UAE. It provides guidelines to\nrespect professional ethics and behaviours set out in the UAE’s\
    \ laws and ensure not to\nviolate them.\nFederal Decree Law No.\n    34 of 2023 concerning Combating Discrimination, Hatred and\n    Extremism\nFederal Decree Law No. 34 of 2023 concerning Combating\
    \ Discrimination, Hatred and Extremism\n (in Arabic - PDF, 1.72 MB) prohibits contempt of\nreligions, discrimination and hatred against one another and extremism of views.\nGuidelines\nGuidelines for\
    \ social media users\nand \nPositive Digital Citizenship -\n    Values and Behaviours’ Code\n - (PDF, 0.5 MB).\nAmen platform\nAbout “A’men”\n “A’men” is a digital platform \nlaunched by The UAE Media\
    \ Council\n to empower the UAE community to monitor and report media content. It enables individuals to contribute to building a safe and responsible media environment that reflects social awareness\
    \ and positive engagement with digital content. For more details, visit \nA’men website\n.\nMission & Vision\nMission:\n To empower the community in enhancing the quality of circulated media content,\
    \ ensuring a responsible and secure media environment.  \nVision:\n To deliver responsible media content that aligns with the UAE’s vision and effectively conveys its message. \nGoals\nPromote positive\
    \ values within the media landscape.\nProtect the society from harmful content while ensuring the safety of future generations.\nEnhance the quality of media content to uphold professionalism and credibility.\n\
    Foster an environment conducive to the creation of purposeful and responsible content.\nWhat You Can Do\n Users can report media content that does not comply with UAE standards, such as:\nMisleading\
    \ content\n: content containing false or inaccurate information.\nUnsafe or non-compliant content:\n content media standards under UAE legislation.\nAdvertising content\n: content containing \nunauthorised\n\
    \ or non-compliant ads.\nGet Involved\n Users can register via \nUAE PASS\n or as guests to report content. A’men platform also offers a mobile app for easier access. You can download it  from \nGoogle\
    \ Play\n or \nApple Store\n.\nRead related media coverage on \nWAM\n. \nUpdated on: \n04 Nov 2025\nThis platform\nAbout U.AE\nWebsite Statistics\nDigital participation policy\nCitizen Charter\nResources\n\
