# 玩具类。优先子类型之一。
# Plan §5 toy 行:年龄说明、警告语、可见小附件、磁体/绳带、电池仓闭合方式、
# 可见尖锐或破损部位。单凭图片不能得出:小零件量规通过与否、拉力、磁通量、
# 迁移限值 —— 全部 lab_test。
profile_id: toy
version: 1
title: 玩具视觉检查
extends: common
checks:
  - id: toy.age_range.label
    version: 1
    title: 年龄适用范围标注
    semantic: required_presence
    target_regions: [packaging, product_label]
    required_views: [package_front]
    methods: [vision, ocr]
    evidence_mode: visual
    legal_anchor_refs:
      - EU-2009-48-toy
      - US-ASTM-F963-toy
      - US-16-CFR-1200-toy

  - id: toy.warnings.text
    version: 1
    title: 警告语(窒息/磁体/电池等)
    semantic: required_presence
    target_regions: [warning_label, packaging]
    required_views: [package_front, warning_label_closeup]
    methods: [vision, ocr]
    evidence_mode: visual
    legal_anchor_refs:
      - EU-2009-48-toy
      - US-16-CFR-1263-toy

  # record_only: 看到小附件只记录形态;尺寸/年龄风险需量规等证据,
  # 不因能看清就判绿,也不生成整改项(plan §4.2 真值表第 5 行)。
  - id: toy.small_parts.visible
    version: 1
    title: 可见小附件(含脱落风险目视)
    semantic: record_only
    target_regions: [product_body]
    required_views: [overview, accessories_flat]
    methods: [vision]
    evidence_mode: visual
    legal_anchor_refs: []

  # hazard_presence: 清晰看到磁体/绳带危险形态才生成疑点;未见是好事。
  - id: toy.magnets_cords.visible
    version: 1
    title: 磁体/绳带/绳索可见形态
    semantic: hazard_presence
    target_regions: [product_body]
    required_views: [overview, accessories_flat]
    methods: [vision]
    evidence_mode: visual
    legal_anchor_refs: []

  - id: toy.battery_compartment.closure
    version: 1
    title: 电池仓闭合方式(螺丝/卡扣)
    semantic: required_presence
    target_regions: [battery_compartment]
    required_views: [battery_compartment]
    methods: [vision]
    evidence_mode: visual
    legal_anchor_refs:
      - KB-toy-EU-2009-48
      - US-16-CFR-1263-toy

  # hazard_presence: 清晰看到尖锐/裂纹/破损 → 外观疑点+原图区域;
  # 区域可见但未见异常 → 无 finding(J02 正例)。
  - id: toy.sharp_edges.visible
    version: 1
    title: 可见尖锐/破损部位
    semantic: hazard_presence
    target_regions: [product_body]
    required_views: [overview]
    methods: [vision]
    evidence_mode: visual
    legal_anchor_refs: []

  - id: toy.mechanical_physical.test
    version: 1
    title: 机械物理性能测试(小零件/拉力/磁通量)
    target_regions: []
    required_views: []
    methods: []
    evidence_mode: lab_test
    legal_anchor_refs:
      - EU-2009-48-toy
      - US-ASTM-F963-toy
      - US-CPSIA-toy
      - US-16-CFR-1250-toy

  - id: toy.chemical_migration.test
    version: 1
    title: 化学迁移测试(重金属/增塑剂)
    target_regions: []
    required_views: []
    methods: []
    evidence_mode: lab_test
    legal_anchor_refs:
      - EU-2009-48-toy
      - US-CPSIA-toy
      - US-16-CFR-1250-toy
