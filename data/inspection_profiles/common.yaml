# 通用检查 — 所有品类在应用专属 profile 前先跑这一层。
# Plan 2026-09-13 §5:common 覆盖"产品主体、品牌型号、铭牌/标签、批次与追溯、
# 警告文字、包装信息、可见外观异常"。
#
# ⚠️ 这些是"图片里固定观察什么"的清单,不是法律要求断言。某项是否强制、
# 在哪个市场强制,由 KB anchors 的 applies_if + 适用性规则引擎判断。
profile_id: common
version: 1
title: 通用视觉检查
checks:
  # record_only: 产品主体外观只记录整体形态,不据此判绿判红。
  - id: common.product.overview
    version: 1
    title: 产品主体与外观完整性
    semantic: record_only
    target_regions: [product_body]
    required_views: [front]
    methods: [vision]
    evidence_mode: visual
    legal_anchor_refs: []

  - id: common.nameplate.readability
    version: 1
    title: 铭牌/标签信息可读性
    semantic: required_presence
    target_regions: [nameplate, product_label]
    required_views: [nameplate_closeup]
    methods: [vision, ocr]
    evidence_mode: visual
    legal_anchor_refs: []

  # record_only: 每个清晰可见的认证/环保/安全标志单独定位；识别到标志
  # 只代表图像事实，不代表认证真实有效或产品已合规。
  - id: common.certification_marks.visible
    version: 1
    title: 可见认证、环保与安全标志（逐个框选）
    semantic: record_only
    target_regions: [certification_mark, environmental_mark, safety_mark]
    required_views: [nameplate_closeup, packaging]
    methods: [vision, ocr]
    evidence_mode: visual
    legal_anchor_refs: []

  - id: common.brand_model.visible
    version: 1
    title: 品牌与型号标识
    semantic: required_presence
    target_regions: [brand_marking, model_marking]
    required_views: [front, back]
    methods: [vision, ocr]
    evidence_mode: visual
    legal_anchor_refs: []

  - id: common.batch_traceability.fields
    version: 1
    title: 批次号/序列号/生产日期等追溯字段
    semantic: required_presence
    target_regions: [nameplate, batch_label]
    required_views: [nameplate_closeup]
    methods: [vision, ocr]
    evidence_mode: visual
    legal_anchor_refs:
      - US-CPSIA-toy

  - id: common.warning_text.language
    version: 1
    title: 警告文字及其语言
    semantic: required_presence
    target_regions: [warning_label]
    required_views: [warning_label_closeup]
    methods: [vision, ocr]
    evidence_mode: visual
    legal_anchor_refs: []

  - id: common.packaging.info
    version: 1
    title: 包装信息(如已拍摄)
    semantic: required_presence
    target_regions: [packaging]
    required_views: [package]
    methods: [vision, ocr]
    evidence_mode: visual
    legal_anchor_refs: []

  # hazard_presence: 可见外观异常(裂损/变形/污渍/鼓胀)——清晰看到才出
  # 外观疑点;区域可见但未见异常不生成"缺异常"整改项(J02)。
  - id: common.defects.visible
    version: 1
    title: 可见外观异常(裂损/变形/污渍/鼓胀)
    semantic: hazard_presence
    target_regions: [product_body]
    required_views: [front, back, side]
    methods: [vision]
    evidence_mode: visual
    legal_anchor_refs: []
