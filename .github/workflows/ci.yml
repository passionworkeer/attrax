name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Three parallel gates:
#   frontend — lint (non-blocking) + vitest unit suite (blocking)
#   i18n     — translation key consistency (blocking; catches missing zh/en keys)
#   backend  — rag_service pytest (reporting-only; data/faiss + corpus are
#              gitignored so index-dependent tests can't run in CI yet)
#
# Build is intentionally NOT in CI: the 1.6GB server can't safely
# run `npm run build` (see RECOVERY.md OOM incident 2026-06-21).
# Builds are done locally on a 16GB+ machine and the standalone
# artifact is scp'd to the server.

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Unit tests
        run: npx vitest run --reporter=verbose

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: i18n key consistency
        # Fails the job when any t("a.b") call references a key missing from
        # zh or en. Pure-stdlib script (no pip install needed).
        run: python scripts/check_i18n_consistency.py

  backend:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rag_service deps
        run: |
          python -m pip install --upgrade pip
          pip install -r rag_service/requirements-prod.txt pytest httpx

      - name: pytest
        env:
          DEMO_MODE: "true"
        run: python -m pytest rag_service/tests/ -v
