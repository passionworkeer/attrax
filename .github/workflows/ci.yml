name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# CI gates:
#   frontend  — typecheck (blocking) + vitest unit suite (blocking) + coverage
#   lint      — eslint (non-blocking, see notes) + i18n key consistency (blocking)
#   e2e       — Playwright core specs against DEMO_MODE dev server (blocking)
#   backend-unit   — rag_service pytest pure-logic subset (blocking)
#   backend-full   — rag_service full pytest (reporting-only; data/faiss + corpus
#                    are gitignored so index/network-dependent tests fail in CI)
#
# Build is intentionally NOT in CI: the 1.6GB server can't safely
# run `npm run build` (see RECOVERY.md OOM incident 2026-06-21).
# Builds are done locally on a 16GB+ machine and the standalone
# artifact is scp'd to the server.

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Lint
        # Non-blocking as of 2026-06-28: `npm run lint` reports 10 errors /
        # 14 warnings (mostly unused-vars in test files + 2 unused eslint-disable
        # directives). TODO: fix the 10 errors in a dedicated lint pass, then
        # remove continue-on-error to make this gate. See task A9.
        run: npm run lint --if-present
        continue-on-error: true

      - name: Lint annotations
        # Re-run eslint with the compact formatter and surface each finding as a
        # GitHub annotation (`::error file=...,line=...::msg`) so reviewers see
        # lint issues inline on the PR diff even though lint is non-blocking.
        # Never fails the job (grep exit 1 when no matches is expected).
        if: always()
        run: |
          npx eslint . --format=compact 2>/dev/null \
            | grep -E 'error|warning' \
            | sed -nE 's#^[^ ]* - (.*), line ([0-9]+), col [0-9]+, (Error|Warning) - (.*)#::\3 file=\1,line=\2::\4#p' \
            || true

      - name: Typecheck
        # Blocking gate. Catches type regressions before the unit suite runs.
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run --reporter=verbose

      - name: Coverage
        # Generates coverage report AND enforces thresholds (vitest.config.ts:
        # statements/lines/functions 80, branches 70). A below-threshold result
        # fails this step (non-zero exit) — gating on coverage regressions.
        run: npx vitest run --coverage

      - name: Upload coverage
        # Only upload when the suite (incl. coverage thresholds) passed.
        # `if: success()` skips the artifact on coverage failure so a red
        # coverage result can't be silently swallowed.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: i18n key consistency
        # Fails the job when any t("a.b") call references a key missing from
        # zh or en. Pure-stdlib script (no pip install needed).
        run: python scripts/check_i18n_consistency.py

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (DEMO_MODE)
        env:
          # DEMO_MODE lets the dev server run with mock data — no API keys,
          # no RAG service dependency. webServer (playwright.config.ts) boots
          # `npm run dev` and waits for :3000.
          # In DEMO_MODE, POST /api/scan runs `runDemoSimulation` (4.5s), which
          # sets status="ready" with result.source="demo" — so the core
          # upload→burning→result flow completes in seconds without the real
          # ~150s RAG pipeline. All specs below are DEMO_MODE-compatible.
          DEMO_MODE: "true"
        run: >
          npx playwright test
          tests/e2e/smoke.spec.ts
          tests/e2e/pages.spec.ts
          tests/e2e/export-downloads.spec.ts
          tests/e2e/not-found.spec.ts
          tests/e2e/error-boundary.spec.ts
          tests/e2e/upload-scan-result.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # Pure-logic backend subset that needs NO FAISS index and NO external model /
  # network. This is the blocking gate. Files requiring a built index or live
  # ModelScope/FAISS are excluded (they cannot pass in CI — corpus + index are
  # gitignored). See pytest.ini for the unit/integration/requires_index/slow
  # marker taxonomy (existing tests not yet tagged, so we use --ignore below).
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rag_service deps
        run: |
          python -m pip install --upgrade pip
          pip install -r rag_service/requirements-prod.txt pytest httpx

      - name: pytest (pure-logic gate)
        env:
          DEMO_MODE: "true"
        # NOTE: test_build_faiss_versioning.py IS gated here (removed from the
        # --ignore list 2026-06-28). It is pure logic — stubbed embedder, tmp_path
        # index writes, no network, no real FAISS corpus. Verified standalone.
        run: >
          python -m pytest rag_service/tests/ -v
          --ignore=rag_service/tests/test_embedders.py
          --ignore=rag_service/tests/test_faiss_retriever.py
          --ignore=rag_service/tests/test_regulation_retrieval_eval.py
          --ignore=rag_service/tests/test_registry_collector_manifest.py
          --ignore=rag_service/tests/test_smoke.py

  # Full backend suite — reporting only. Index-dependent, network-dependent,
  # and environment-sensitive tests are expected to fail in CI (no index, no
  # ModelScope key, no live corpus). Kept non-blocking to surface drift.
  backend-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rag_service deps
        run: |
          python -m pip install --upgrade pip
          pip install -r rag_service/requirements-prod.txt pytest httpx

      - name: pytest (full, reporting-only)
        env:
          DEMO_MODE: "true"
        run: python -m pytest rag_service/tests/ -v

