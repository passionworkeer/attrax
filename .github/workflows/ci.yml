name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Unit tests
        run: npx vitest run --reporter=verbose

      # Build is intentionally NOT in CI: the 1.6GB server can't safely
      # run `npm run build` (see RECOVERY.md OOM incident 2026-06-21).
      # Builds are done locally on a 16GB+ machine and the standalone
      # artifact is scp'd to the server.
