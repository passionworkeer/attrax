name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: RAG contract check
        run: npm run codegen:rag-types && git diff --exit-code lib/rag-client/types.gen.ts

      - name: Unit tests
        run: npx vitest run --reporter=verbose

      - name: Coverage gate
        run: npx vitest run --coverage

      - name: Production build
        env:
          DEMO_MODE: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Production dependency audit
        # advisory(非阻塞):非破坏漏洞已清 —— next/postcss(override → 8.5.26)/
        # js-yaml(override → 4.3.1)/ undici 等均经 npm audit fix 或 overrides 修复,
        # 当前仅剩 sharp(0.34→0.35.3 breaking,影响 Next 图片优化),单独 follow-up issue
        # 跟踪,需专属 image-optimization + build 回归后移除 continue-on-error 恢复硬门控。
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Upload standalone build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone-${{ github.sha }}
          path: |
            .next/standalone/
            .next/static/
            public/
          if-no-files-found: error
          retention-days: 14

  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: i18n key consistency
        run: python scripts/check_i18n_consistency.py

  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: rag_service/requirements-prod.txt

      - name: Install RAG dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag_service/requirements-prod.txt pytest httpx
          pip check

      - name: Compile Python sources
        run: python -m compileall -q rag_service

      - name: pytest pure-logic gate
        env:
          DEMO_MODE: "true"
        run: >
          python -m pytest rag_service/tests/ -v
          --ignore=rag_service/tests/test_embedders.py
          --ignore=rag_service/tests/test_faiss_retriever.py
          --ignore=rag_service/tests/test_regulation_retrieval_eval.py
          --ignore=rag_service/tests/test_registry_collector_manifest.py
          --ignore=rag_service/tests/test_smoke.py

  e2e:
    needs: [frontend, backend-unit]
    runs-on: ubuntu-latest
    # 硬门控:e2e 预存债务(hydration / 上传页选择器过时 / error-boundary 触发 / 404 路由)
    # 已逐项修复,移除 continue-on-error 恢复为阻塞门。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run core E2E in demo mode
        env:
          DEMO_MODE: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: >
          npx playwright test
          tests/e2e/smoke.spec.ts
          tests/e2e/pages.spec.ts
          tests/e2e/export-downloads.spec.ts
          tests/e2e/not-found.spec.ts
          tests/e2e/error-boundary.spec.ts
          tests/e2e/upload-scan-result.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  backend-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: rag_service/requirements-prod.txt
      - name: Install RAG dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag_service/requirements-prod.txt pytest httpx
      - name: Full backend suite (reporting)
        env:
          DEMO_MODE: "true"
        run: python -m pytest rag_service/tests/ -v
