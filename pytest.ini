[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
# Registered markers. Tests that need a built data/faiss index or external
# models/network are tagged so the fast CI gate can exclude them:
#   - unit            : pure logic, no index/model/network
#   - integration     : multi-module or in-memory fakes together
#   - requires_index  : needs a built FAISS index (gitignored, not in CI)
#   - slow            : long-running; skipped by the fast gate
markers =
    unit: pure-logic test (no FAISS index / no external model / no network)
    integration: multi-module integration test using in-memory fakes
    requires_index: needs a built data/faiss index — excluded from the fast CI gate
    slow: long-running test — excluded from the fast CI gate
