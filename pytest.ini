[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
# Registered markers. Tests that touch external models or the network are
# tagged so the fast CI gate can exclude them:
#   - unit            : pure logic, no model/network
#   - integration     : multi-module or in-memory fakes together
#   - slow            : long-running; skipped by the fast gate
markers =
    unit: pure-logic test (no external model / no network)
    integration: multi-module integration test using in-memory fakes
    slow: long-running test — excluded from the fast CI gate
